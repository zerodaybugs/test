name: Extract public 0x audit corpus

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-audit-corpus-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Clone public upstream and extract reports
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/audit-corpus"
          SRC=/tmp/0x-settler
          rm -rf "$SRC" "$OUT"
          mkdir -p "$OUT/text" "$OUT/info"
          git clone --depth 1 https://github.com/0xProject/0x-settler.git "$SRC"
          git -C "$SRC" rev-parse HEAD > "$OUT/upstream-head.txt"

          count=0
          while IFS= read -r -d '' pdf; do
            count=$((count + 1))
            base="$(basename "$pdf" .pdf)"
            safe="$(printf '%s' "$base" | tr '/ ' '__' | tr -cd '[:alnum:]_.()-')"
            pdfinfo "$pdf" > "$OUT/info/${safe}.txt" 2>&1 || true
            pdftotext -layout "$pdf" "$OUT/text/${safe}.txt"
            printf '%s\t%s\n' "$safe" "$pdf" >> "$OUT/index.tsv"
          done < <(find "$SRC/audits" -maxdepth 1 -type f -iname '*.pdf' -print0 | sort -z)

          printf 'pdf_count=%s\n' "$count" > "$OUT/status.txt"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test "$count" -ge 10
          test -s "$OUT/index.tsv"

      - name: Upload extracted public audit corpus
        uses: actions/upload-artifact@v4
        with:
          name: 0x-audit-corpus-${{ github.run_id }}
          path: audit-corpus/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
