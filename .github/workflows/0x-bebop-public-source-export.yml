name: Export public Bebop Settlement source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-bebop-public-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Fetch already-public verified source and production bytecode
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/bebop-public-source"
          mkdir -p "$OUT"
          URL='https://raw.githubusercontent.com/tintinweb/smart-contract-sanctuary-arbitrum/465b14914e025d2892dd0b484ef8bf8b1efbefe3/contracts/mainnet/bb/bbbbbBB520d69a9775E85b458C58c648259FAD5F_BebopSettlement.sol'
          curl -fsSL --retry 3 --max-time 90 "$URL" > "$OUT/BebopSettlement.flattened.sol"
          RPC=https://eth.drpc.org
          ADDRESS=0xbbbbbBB520d69a9775E85b458C58c648259FAD5F
          cast code "$ADDRESS" --rpc-url "$RPC" > "$OUT/production-code.hex"
          cast codehash "$ADDRESS" --rpc-url "$RPC" > "$OUT/production-codehash.txt"
          cast block-number --rpc-url "$RPC" > "$OUT/head-block.txt"
          curl -fsSL --retry 3 --max-time 45 "https://eth.blockscout.com/api/v2/smart-contracts/$ADDRESS" > "$OUT/blockscout-contract.json" || true
          curl -fsSL --retry 3 --max-time 45 "https://eth.blockscout.com/api/v2/addresses/$ADDRESS" > "$OUT/blockscout-address.json" || true
          wc -l "$OUT/BebopSettlement.flattened.sol" > "$OUT/source-lines.txt"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/BebopSettlement.flattened.sol"
          test "$(wc -c < "$OUT/production-code.hex")" -gt 1000
      - name: Upload public source evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-bebop-public-source-${{ github.run_id }}
          path: bebop-public-source/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
