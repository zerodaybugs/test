name: Collect public 0x BridgeSettler history

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-bridge-public-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Collect registry, transactions, actions, transfers, and traces
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/bridge-history"
          mkdir -p "$OUT"
          RPC=https://eth.drpc.org
          REG=0x00000000000004533Fe15556B1E086BB1A72cEae
          CURRENT=$(cast call "$REG" 'ownerOf(uint256)(address)' 5 --rpc-url "$RPC")
          PREV=$(cast call "$REG" 'prev(uint128)(address)' 5 --rpc-url "$RPC")
          NEXT=$(cast call "$REG" 'next(uint128)(address)' 5 --rpc-url "$RPC")
          printf 'current=%s\nprev=%s\nnext=%s\nhead=%s\n' "$CURRENT" "$PREV" "$NEXT" "$(cast block-number --rpc-url "$RPC")" > "$OUT/registry.txt"
          printf 'current\t%s\nprev\t%s\nnext\t%s\n' "$CURRENT" "$PREV" "$NEXT" > "$OUT/addresses.tsv"

          python3 - "$OUT" <<'PY'
          import json, pathlib, sys, time, urllib.parse, urllib.request
          root=pathlib.Path(sys.argv[1])
          addresses=dict(line.split('\t',1) for line in (root/'addresses.tsv').read_text().splitlines())
          base='https://eth.blockscout.com/api/v2'
          headers={'User-Agent':'Mozilla/5.0 0x-public-security-research'}

          def get_json(url, attempts=4):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e; time.sleep(2*(i+1))
              return {'_error':repr(last),'_url':url}

          def paged(endpoint, max_pages=50):
              items=[]; params={}; pages=[]
              for page in range(max_pages):
                  query=('?'+urllib.parse.urlencode(params,doseq=True)) if params else ''
                  url=base+endpoint+query
                  data=get_json(url)
                  pages.append({'url':url,'count':len(data.get('items',[])) if isinstance(data,dict) else None,'error':data.get('_error') if isinstance(data,dict) else None})
                  if not isinstance(data,dict) or '_error' in data: break
                  batch=data.get('items',[]); items.extend(batch)
                  nxt=data.get('next_page_params')
                  if not nxt: break
                  params=nxt
              return {'items':items,'pages':pages}

          for kind,address in addresses.items():
              d=root/kind; d.mkdir()
              (d/'address.txt').write_text(address+'\n')
              endpoints={
                  'transactions':f'/addresses/{address}/transactions',
                  'token-transfers':f'/addresses/{address}/token-transfers',
                  'internal-transactions':f'/addresses/{address}/internal-transactions',
                  'logs':f'/addresses/{address}/logs',
              }
              for name,endpoint in endpoints.items():
                  result=paged(endpoint)
                  (d/f'{name}.json').write_text(json.dumps(result,indent=2,sort_keys=True))
              for name,endpoint in {
                  'address':f'/addresses/{address}',
                  'contract':f'/smart-contracts/{address}',
              }.items():
                  (d/f'{name}.json').write_text(json.dumps(get_json(base+endpoint),indent=2,sort_keys=True))
          PY

          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          execute_selector='3cdfaf67'
          selectors={
            'c1fb425e':'TRANSFER_FROM', '5d0095c8':'SETTLER_SWAP', '61443a67':'UNDERPAYMENT_CHECK',
            '38c9c147':'BASIC', 'e6a11230':'BRIDGE_ERC20_TO_RELAY', '4a674528':'BRIDGE_NATIVE_TO_RELAY',
            '0a401fb7':'BRIDGE_ERC20_TO_MAYAN', '78053e4a':'BRIDGE_NATIVE_TO_MAYAN',
            'ed850c26':'BRIDGE_ERC20_TO_ACROSS', '086a2c1a':'BRIDGE_NATIVE_TO_ACROSS',
            'df9ebf79':'BRIDGE_TO_STARGATE_V2', 'afe421b9':'BRIDGE_TO_LAYER_ZERO_OFT',
            'c4d43736':'BRIDGE_TO_DEBRIDGE', '24a4200f':'BRIDGE_TO_CCIP',
            '0b432752':'BRIDGE_TO_NUCLEUS_TELLER', 'd4f8082a':'DEPOSIT_AND_BRIDGE_TO_NUCLEUS_TELLER'
          }
          def word(buf,off):
              if off<0 or off+32>len(buf): raise ValueError(f'word OOB {off}/{len(buf)}')
              return int.from_bytes(buf[off:off+32],'big')
          def decode_actions(raw):
              if not isinstance(raw,str) or not raw.startswith('0x') or raw[2:10].lower()!=execute_selector: return []
              buf=bytes.fromhex(raw[10:])
              arr=word(buf,0)
              n=word(buf,arr)
              if n>100: raise ValueError('unreasonable action count')
              base=arr+32
              out=[]
              for i in range(n):
                  rel=word(buf,base+32*i)
                  pos=base+rel
                  ln=word(buf,pos)
                  data=buf[pos+32:pos+32+ln]
                  if len(data)!=ln: raise ValueError('short action')
                  sel=data[:4].hex() if len(data)>=4 else data.hex()
                  out.append({'index':i,'selector':'0x'+sel,'name':selectors.get(sel,'UNKNOWN'),'length':ln,'data':'0x'+data.hex()})
              return out
          summary={}
          all_rows=[]
          for kind in ('current','prev','next'):
              p=root/kind/'transactions.json'
              obj=json.loads(p.read_text()); txs=obj.get('items',[])
              counts={}; decoded=[]; errors=[]
              for tx in txs:
                  raw=tx.get('raw_input') or tx.get('input') or ''
                  try: actions=decode_actions(raw)
                  except Exception as e:
                      actions=[]; errors.append({'hash':tx.get('hash'),'error':repr(e),'raw_input':raw})
                  if actions:
                      row={'hash':tx.get('hash'),'block':tx.get('block_number'),'timestamp':tx.get('timestamp'),'from':(tx.get('from') or {}).get('hash') if isinstance(tx.get('from'),dict) else tx.get('from'),'to':(tx.get('to') or {}).get('hash') if isinstance(tx.get('to'),dict) else tx.get('to'),'value':tx.get('value'),'status':tx.get('status'),'method':tx.get('method'),'actions':actions,'raw_input':raw}
                      decoded.append(row); all_rows.append({'deployment':kind,**row})
                      for a in actions: counts[a['name']]=counts.get(a['name'],0)+1
              summary[kind]={'transaction_count':len(txs),'decoded_execute_count':len(decoded),'action_counts':counts,'decode_errors':len(errors)}
              (root/kind/'decoded-execute.json').write_text(json.dumps(decoded,indent=2,sort_keys=True))
              (root/kind/'decode-errors.json').write_text(json.dumps(errors,indent=2,sort_keys=True))
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          (root/'all-decoded-execute.json').write_text(json.dumps(all_rows,indent=2,sort_keys=True))
          PY

          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"
          test -s "$OUT/all-decoded-execute.json"

      - name: Upload public bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-bridge-public-history-${{ github.run_id }}
          path: bridge-history/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
