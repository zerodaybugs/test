name: Record 0x feature-2 deployment inputs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-feature2-deployment-tx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Query deployment transactions
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/deployments"
          mkdir -p "$OUT"
          RPC=https://eth.drpc.org
          for item in \
            current:0x8727b89eb4b194cbbe37daaee78b1e9abcf1fdd3d8de8302a01b0ee2a40c5b29 \
            prev:0xd48156e118ec18845f71b38ba79a68c187e1f9ccf1a0dfd7eaf4606c61de493c
          do
            kind=${item%%:*}
            tx=${item#*:}
            cast tx "$tx" --json --rpc-url "$RPC" > "$OUT/$kind.json"
          done
          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          summary={}
          for kind in ('current','prev'):
              obj=json.loads((root/f'{kind}.json').read_text())
              inp=obj.get('input') or obj.get('data') or '0x'
              summary[kind]={
                  'hash':obj.get('hash'),
                  'blockNumber':obj.get('blockNumber'),
                  'from':obj.get('from'),
                  'to':obj.get('to'),
                  'input_bytes':len(inp.removeprefix('0x'))//2,
                  'last_32_bytes':'0x'+inp.removeprefix('0x')[-64:],
                  'candidate_git_commit':'0x'+inp.removeprefix('0x')[-64:-24],
              }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          PY
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-feature2-deployment-tx-${{ github.run_id }}
          path: deployments/
          if-no-files-found: error
          retention-days: 1
