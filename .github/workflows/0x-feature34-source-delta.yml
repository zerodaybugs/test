name: Export exact 0x MetaTxn and Intent source delta

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-feature34-source-delta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Export exact public source snapshots and security delta
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/source-delta"
          REPO=/tmp/0x-settler
          OLD=340ffbb23734843f6a569ba14360e9088009cc8c
          NEW=f5744a91cb62f87f6415ec334fbe155f3705848f
          rm -rf "$ROOT" "$REPO" /tmp/old /tmp/new
          mkdir -p "$ROOT/old" "$ROOT/new" "$ROOT/delta"
          git clone https://github.com/0xProject/0x-settler.git "$REPO"
          git -C "$REPO" cat-file -e "$OLD^{commit}"
          git -C "$REPO" cat-file -e "$NEW^{commit}"

          for spec in old:$OLD new:$NEW; do
            name="${spec%%:*}"
            sha="${spec#*:}"
            mkdir -p "/tmp/$name"
            git -C "$REPO" archive "$sha" | tar -x -C "/tmp/$name"
            rsync -a \
              --exclude='lib/' --exclude='out/' --exclude='cache/' --exclude='broadcast/' \
              "/tmp/$name/src/" "$ROOT/$name/src/"
            rsync -a "/tmp/$name/test/" "$ROOT/$name/test/"
            cp "/tmp/$name/foundry.toml" "/tmp/$name/remappings.txt" "/tmp/$name/package.json" "$ROOT/$name/" 2>/dev/null || true
            printf '%s\n' "$sha" > "$ROOT/$name/HEAD.txt"
          done

          git -C "$REPO" log --reverse --date=iso-strict --pretty=format:'%H%x09%aI%x09%s' "$OLD..$NEW" > "$ROOT/delta/commits.tsv"
          git -C "$REPO" diff --name-status "$OLD" "$NEW" > "$ROOT/delta/name-status.txt"
          git -C "$REPO" diff --stat "$OLD" "$NEW" > "$ROOT/delta/stat.txt"
          git -C "$REPO" diff --find-renames "$OLD" "$NEW" -- src test > "$ROOT/delta/src-test.diff"
          git -C "$REPO" diff --find-renames "$OLD" "$NEW" -- \
            src/SettlerMetaTxn.sol src/SettlerIntent.sol src/SettlerBase.sol \
            src/core/Permit2Payment.sol src/core/UniswapV3Fork.sol src/core/Basic.sol \
            src/core/RfqOrderSettlement.sol src/core/BalancerV3.sol src/core/PancakeInfinity.sol \
            src/CrossChainReceiverFactory.sol src/multicall/MultiCall.sol src/multicall/MultiCallContext.sol \
            src/chains/Mainnet test/integration test/unit \
            > "$ROOT/delta/feature34-focused.diff"

          grep -Ei '\b(bug|fix|security|malleab|signature|permit|callback|reent|overflow|underflow|slippage|witness|solver|intent|metatxn|calldata|alias|dirty|refund|drain|steal|theft)\b' \
            "$ROOT/delta/commits.tsv" > "$ROOT/delta/security-commit-filter.tsv" || true

          find "$ROOT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS"
          test "$(cat "$ROOT/old/HEAD.txt")" = "$OLD"
          test "$(cat "$ROOT/new/HEAD.txt")" = "$NEW"
          test -s "$ROOT/delta/src-test.diff"

      - name: Upload exact source delta
        uses: actions/upload-artifact@v4
        with:
          name: 0x-feature34-source-delta-${{ github.run_id }}
          path: source-delta/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
