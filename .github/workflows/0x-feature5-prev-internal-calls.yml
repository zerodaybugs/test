name: Decode public previous 0x feature-5 internal calls

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-feature5-prev-internal-calls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download internal calls and parent transactions
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/previous-feature5-internal"
          mkdir -p "$OUT/parents"
          ADDRESS=0x2eCBa8E35F659Df6f5D6614D63276aa58d7D5422
          BASE=https://eth.blockscout.com/api/v2
          python3 - "$OUT" "$ADDRESS" "$BASE" <<'PY'
          import json,pathlib,sys,time,urllib.parse,urllib.request
          root=pathlib.Path(sys.argv[1]); address=sys.argv[2]; base=sys.argv[3]
          headers={'User-Agent':'Mozilla/5.0 0x-authorized-public-research'}
          def get(url,attempts=5):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
                  except Exception as e:last=e;time.sleep(i+1)
              return {'_error':repr(last),'_url':url}
          items=[];params={};pages=[]
          for page in range(40):
              q=('?'+urllib.parse.urlencode(params,doseq=True)) if params else ''
              url=f'{base}/addresses/{address}/internal-transactions{q}'
              obj=get(url);batch=obj.get('items',[]) if isinstance(obj,dict) else []
              pages.append({'url':url,'count':len(batch),'error':obj.get('_error') if isinstance(obj,dict) else 'not-object'})
              items.extend(batch)
              nxt=obj.get('next_page_params') if isinstance(obj,dict) else None
              if not nxt:break
              params=nxt
          (root/'internal-transactions.json').write_text(json.dumps({'items':items,'pages':pages},indent=2,sort_keys=True))
          hashes=sorted({x.get('transaction_hash') or x.get('transactionHash') for x in items if x.get('transaction_hash') or x.get('transactionHash')})
          for h in hashes:
              (root/'parents'/f'{h}.json').write_text(json.dumps(get(f'{base}/transactions/{h}'),indent=2,sort_keys=True))
              (root/'parents'/f'{h}-internal.json').write_text(json.dumps(get(f'{base}/transactions/{h}/internal-transactions'),indent=2,sort_keys=True))
              (root/'parents'/f'{h}-token-transfers.json').write_text(json.dumps(get(f'{base}/transactions/{h}/token-transfers'),indent=2,sort_keys=True))
          (root/'parent-hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
          python3 - "$OUT" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); target='0x2ecba8e35f659df6f5d6614d63276aa58d7d5422'
          EXEC='3cdfaf67'
          ACTIONS={'c1fb425e':'TRANSFER_FROM','5d0095c8':'SETTLER_SWAP','61443a67':'UNDERPAYMENT_CHECK','38c9c147':'BASIC','e6a11230':'BRIDGE_ERC20_TO_RELAY','4a674528':'BRIDGE_NATIVE_TO_RELAY','0a401fb7':'BRIDGE_ERC20_TO_MAYAN','78053e4a':'BRIDGE_NATIVE_TO_MAYAN','ed850c26':'BRIDGE_ERC20_TO_ACROSS','086a2c1a':'BRIDGE_NATIVE_TO_ACROSS','df9ebf79':'BRIDGE_ERC20_TO_STARGATE_V2','d2d5c201':'BRIDGE_NATIVE_TO_STARGATE_V2','afe421b9':'BRIDGE_TO_LAYER_ZERO_OFT','c4d43736':'BRIDGE_TO_DEBRIDGE','24a4200f':'BRIDGE_TO_CCIP'}
          def addr(x):
              if isinstance(x,dict):return (x.get('hash') or '').lower()
              return (x or '').lower()
          def w(b,o):
              if o<0 or o+32>len(b):raise ValueError(f'oob:{o}/{len(b)}')
              return int.from_bytes(b[o:o+32],'big')
          def dec(raw):
              if not isinstance(raw,str) or not raw.startswith('0x') or raw[2:10].lower()!=EXEC:return []
              b=bytes.fromhex(raw[10:]);a=w(b,0);n=w(b,a);base=a+32
              if n>200:raise ValueError('too-many')
              out=[]
              for i in range(n):
                  p=base+w(b,base+32*i);ln=w(b,p);d=b[p+32:p+32+ln]
                  if len(d)!=ln:raise ValueError('short')
                  s=d[:4].hex() if len(d)>=4 else d.hex();out.append({'index':i,'selector':'0x'+s,'name':ACTIONS.get(s,'UNKNOWN'),'length':ln,'data':'0x'+d.hex()})
              return out
          ints=json.loads((root/'internal-transactions.json').read_text())['items']
          calls=[];errors=[];counts={}
          for x in ints:
              if addr(x.get('to'))!=target:continue
              raw=x.get('input') or x.get('raw_input') or ''
              try:actions=dec(raw)
              except Exception as e:actions=[];errors.append({'transaction_hash':x.get('transaction_hash'),'error':repr(e),'input':raw})
              row={'transaction_hash':x.get('transaction_hash'),'block':x.get('block_number'),'from':addr(x.get('from')),'to':addr(x.get('to')),'value':x.get('value'),'success':x.get('success'),'type':x.get('type'),'input':raw,'actions':actions}
              calls.append(row)
              for a in actions:counts[a['name']]=counts.get(a['name'],0)+1
          (root/'decoded-calls.json').write_text(json.dumps(calls,indent=2,sort_keys=True))
          (root/'decode-errors.json').write_text(json.dumps(errors,indent=2,sort_keys=True))
          (root/'summary.json').write_text(json.dumps({'internal_items':len(ints),'calls_to_target':len(calls),'decoded_execute':sum(bool(x['actions']) for x in calls),'action_counts':counts,'errors':len(errors)},indent=2,sort_keys=True))
          PY
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"
      - name: Upload internal-call evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-feature5-prev-internal-${{ github.run_id }}
          path: previous-feature5-internal/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
