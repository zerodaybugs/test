name: Decode public previous 0x feature-5 transactions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-feature5-prev-transactions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download and decode previous BridgeSettler calls
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/previous-feature5-transactions"
          mkdir -p "$OUT/tx-details"
          ADDRESS=0x2eCBa8E35F659Df6f5D6614D63276aa58d7D5422
          BASE=https://eth.blockscout.com/api/v2
          printf '%s\n' "$ADDRESS" > "$OUT/address.txt"

          python3 - "$OUT" "$ADDRESS" "$BASE" <<'PY'
          import json, pathlib, sys, time, urllib.parse, urllib.request
          root=pathlib.Path(sys.argv[1]); address=sys.argv[2]; base=sys.argv[3]
          headers={'User-Agent':'Mozilla/5.0 0x-authorized-public-research'}
          def get(url, attempts=5):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=45) as r: return json.load(r)
                  except Exception as e:
                      last=e; time.sleep(i+1)
              return {'_error':repr(last),'_url':url}
          items=[]; params={}; pages=[]
          for page in range(30):
              q=('?'+urllib.parse.urlencode(params,doseq=True)) if params else ''
              url=f'{base}/addresses/{address}/transactions{q}'
              obj=get(url); batch=obj.get('items',[]) if isinstance(obj,dict) else []
              pages.append({'url':url,'count':len(batch),'error':obj.get('_error') if isinstance(obj,dict) else 'not-object'})
              items.extend(batch)
              nxt=obj.get('next_page_params') if isinstance(obj,dict) else None
              if not nxt: break
              params=nxt
          (root/'transactions.json').write_text(json.dumps({'items':items,'pages':pages},indent=2,sort_keys=True))
          for tx in items:
              h=tx.get('hash')
              if not h: continue
              (root/'tx-details'/f'{h}.json').write_text(json.dumps(get(f'{base}/transactions/{h}'),indent=2,sort_keys=True))
              (root/'tx-details'/f'{h}-internal.json').write_text(json.dumps(get(f'{base}/transactions/{h}/internal-transactions'),indent=2,sort_keys=True))
              (root/'tx-details'/f'{h}-token-transfers.json').write_text(json.dumps(get(f'{base}/transactions/{h}/token-transfers'),indent=2,sort_keys=True))
          PY

          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          obj=json.loads((root/'transactions.json').read_text())
          items=obj['items']
          EXEC='3cdfaf67'
          ACTIONS={
            'c1fb425e':'TRANSFER_FROM','5d0095c8':'SETTLER_SWAP','61443a67':'UNDERPAYMENT_CHECK','38c9c147':'BASIC',
            'e6a11230':'BRIDGE_ERC20_TO_RELAY','4a674528':'BRIDGE_NATIVE_TO_RELAY','0a401fb7':'BRIDGE_ERC20_TO_MAYAN',
            '78053e4a':'BRIDGE_NATIVE_TO_MAYAN','ed850c26':'BRIDGE_ERC20_TO_ACROSS','086a2c1a':'BRIDGE_NATIVE_TO_ACROSS',
            'df9ebf79':'BRIDGE_ERC20_TO_STARGATE_V2','d2d5c201':'BRIDGE_NATIVE_TO_STARGATE_V2',
            'afe421b9':'BRIDGE_TO_LAYER_ZERO_OFT','c4d43736':'BRIDGE_TO_DEBRIDGE','24a4200f':'BRIDGE_TO_CCIP'
          }
          def w(b,o):
              if o<0 or o+32>len(b): raise ValueError(f'word-oob:{o}/{len(b)}')
              return int.from_bytes(b[o:o+32],'big')
          def decode_execute(raw):
              if not isinstance(raw,str) or not raw.startswith('0x') or raw[2:10].lower()!=EXEC: return []
              b=bytes.fromhex(raw[10:]); arr=w(b,0); n=w(b,arr); base=arr+32
              if n>200: raise ValueError('too-many-actions')
              out=[]
              for i in range(n):
                  p=base+w(b,base+32*i); ln=w(b,p); d=b[p+32:p+32+ln]
                  if len(d)!=ln: raise ValueError('short-action')
                  s=d[:4].hex() if len(d)>=4 else d.hex()
                  out.append({'index':i,'selector':'0x'+s,'name':ACTIONS.get(s,'UNKNOWN'),'length':ln,'data':'0x'+d.hex()})
              return out
          rows=[]; errors=[]; counts={}
          for tx in items:
              raw=tx.get('raw_input') or tx.get('input') or ''
              try: acts=decode_execute(raw)
              except Exception as e:
                  errors.append({'hash':tx.get('hash'),'error':repr(e),'raw_input':raw}); continue
              row={
                'hash':tx.get('hash'),'block':tx.get('block_number'),'timestamp':tx.get('timestamp'),'status':tx.get('status'),
                'from':(tx.get('from') or {}).get('hash') if isinstance(tx.get('from'),dict) else tx.get('from'),
                'to':(tx.get('to') or {}).get('hash') if isinstance(tx.get('to'),dict) else tx.get('to'),
                'value':tx.get('value'),'method':tx.get('method'),'raw_input':raw,'actions':acts
              }
              rows.append(row)
              for a in acts: counts[a['name']]=counts.get(a['name'],0)+1
          (root/'decoded.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          (root/'decode-errors.json').write_text(json.dumps(errors,indent=2,sort_keys=True))
          (root/'summary.json').write_text(json.dumps({'transactions':len(items),'decoded_execute':sum(bool(r['actions']) for r in rows),'action_counts':counts,'decode_errors':len(errors)},indent=2,sort_keys=True))
          PY

          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/decoded.json"
          test -s "$OUT/summary.json"

      - name: Upload public transaction evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-feature5-prev-transactions-${{ github.run_id }}
          path: previous-feature5-transactions/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
