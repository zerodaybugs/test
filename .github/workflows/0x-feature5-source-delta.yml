name: Export exact 0x feature-5 source delta

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-feature5-source-delta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Export exact public sources and security-relevant delta
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/feature5-source-delta"
          REPO=/tmp/0x-settler
          PREV=111afe09957db8d0d895c6df64ee4c97077ef450
          CURRENT=92bc8f11836fa96eaa7c5f0b1c371205dcafe245
          rm -rf "$OUT" "$REPO"
          mkdir -p "$OUT/previous" "$OUT/current" "$OUT/diffs"

          git clone --filter=blob:none https://github.com/0xProject/0x-settler.git "$REPO"
          git -C "$REPO" config advice.detachedHead false

          export_one() {
            local ref="$1" dst="$2"
            git -C "$REPO" checkout --detach "$ref"
            git -C "$REPO" rev-parse HEAD > "$dst/HEAD.txt"
            git -C "$REPO" log -1 --date=iso-strict --pretty=fuller > "$dst/COMMIT.txt"
            cp "$REPO/foundry.toml" "$dst/" || true
            cp "$REPO/chain_config.json" "$dst/" || true
            cp "$REPO/CHANGELOG.md" "$dst/" || true
            cp "$REPO/README.md" "$dst/" || true
            rsync -a "$REPO/src/" "$dst/src/"
            rsync -a "$REPO/test/integration/" "$dst/test-integration/" || true
            rsync -a "$REPO/test/unit/" "$dst/test-unit/" || true
            rsync -a "$REPO/sh/" "$dst/sh/" || true
            find "$dst" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$dst/SHA256SUMS"
          }

          export_one "$PREV" "$OUT/previous"
          export_one "$CURRENT" "$OUT/current"

          git -C "$REPO" diff --no-ext-diff --unified=80 "$PREV" "$CURRENT" -- \
            src/bridge src/chains/Mainnet/BridgeSettler.sol src/core/Across.sol src/core/CCIP.sol \
            src/core/DeBridge.sol src/core/LayerZeroOFT.sol src/core/Mayan.sol src/core/NucleusTeller.sol \
            src/core/Relay.sol src/core/StargateV2.sol src/SettlerAbstract.sol src/core/Basic.sol \
            > "$OUT/diffs/bridge-security.patch"
          git -C "$REPO" diff --numstat "$PREV" "$CURRENT" -- src > "$OUT/diffs/src-numstat.tsv"
          git -C "$REPO" log --reverse --date=iso-strict --pretty=format:'%H%x09%aI%x09%s' "$PREV..$CURRENT" -- \
            src/bridge src/chains/Mainnet/BridgeSettler.sol src/core/Across.sol src/core/CCIP.sol \
            src/core/DeBridge.sol src/core/LayerZeroOFT.sol src/core/Mayan.sol src/core/NucleusTeller.sol \
            src/core/Relay.sol src/core/StargateV2.sol > "$OUT/diffs/bridge-commit-history.tsv"
          git -C "$REPO" log --reverse -p --date=iso-strict --pretty=format:'COMMIT %H%nDATE %aI%nSUBJECT %s%n' \
            "$PREV..$CURRENT" -- src/bridge src/chains/Mainnet/BridgeSettler.sol src/core/Across.sol \
            src/core/CCIP.sol src/core/DeBridge.sol src/core/LayerZeroOFT.sol src/core/Mayan.sol \
            src/core/NucleusTeller.sol src/core/Relay.sol src/core/StargateV2.sol \
            > "$OUT/diffs/bridge-commit-patches.txt"

          python3 - "$OUT" <<'PY'
          import json, pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          prev=root/'previous/src'
          cur=root/'current/src'
          names=['Across.sol','CCIP.sol','DeBridge.sol','LayerZeroOFT.sol','Mayan.sol','NucleusTeller.sol','Relay.sol','StargateV2.sol']
          rows=[]
          for name in names:
              p=prev/'core'/name
              c=cur/'core'/name
              rows.append({
                  'file':name,
                  'previous_exists':p.exists(),
                  'current_exists':c.exists(),
                  'previous_lines':len(p.read_text().splitlines()) if p.exists() else 0,
                  'current_lines':len(c.read_text().splitlines()) if c.exists() else 0,
              })
          history=(root/'diffs/bridge-commit-history.tsv').read_text().splitlines()
          suspicious=[]
          terms=re.compile(r'bug|fix|refund|fee|amount|recipient|token|allowance|approval|callback|reentr|overflow|underflow|calldata|offset|length|sender|beneficiary|authority|native',re.I)
          for line in history:
              if terms.search(line): suspicious.append(line)
          out={'files':rows,'bridge_commit_count':len(history),'security_keyword_commits':suspicious}
          (root/'SUMMARY.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY

          printf 'previous=%s\ncurrent=%s\n' "$PREV" "$CURRENT" > "$OUT/PROVENANCE.txt"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test "$(cat "$OUT/previous/HEAD.txt")" = "$PREV"
          test "$(cat "$OUT/current/HEAD.txt")" = "$CURRENT"
          test -s "$OUT/diffs/bridge-security.patch"
          test -s "$OUT/SUMMARY.json"

      - name: Upload exact public source delta
        uses: actions/upload-artifact@v4
        with:
          name: 0x-feature5-source-delta-${{ github.run_id }}
          path: feature5-source-delta/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
