name: Record 0x MetaTxn and Intent registry bindings

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-features34-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Query feature 3 and 4 deployments
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/features34"
          mkdir -p "$OUT"
          REG=0x00000000000004533Fe15556B1E086BB1A72cEae
          RPC=https://eth.drpc.org
          EX=https://eth.blockscout.com

          for feature in 3 4; do
            fd="$OUT/feature-$feature"
            mkdir -p "$fd"
            for kind in prev current next; do
              case "$kind" in
                prev) sig='prev(uint128)(address)' ;;
                current) sig='ownerOf(uint256)(address)' ;;
                next) sig='next(uint128)(address)' ;;
              esac
              address=$(cast call "$REG" "$sig" "$feature" --rpc-url "$RPC" 2> "$fd/$kind.call.err" || true)
              printf '%s\n' "$address" > "$fd/$kind.address"
              d="$fd/$kind"
              mkdir -p "$d"
              if printf '%s' "$address" | grep -Eq '^0x[0-9a-fA-F]{40}$'; then
                cast code "$address" --rpc-url "$RPC" > "$d/code.hex" 2> "$d/code.err" || true
                cast codehash "$address" --rpc-url "$RPC" > "$d/codehash.txt" 2> "$d/codehash.err" || true
                cast balance "$address" --rpc-url "$RPC" > "$d/native-balance.txt" 2> "$d/balance.err" || true
                curl -fsSL --retry 3 --max-time 45 "$EX/api/v2/addresses/$address" > "$d/address.json" 2> "$d/address.err" || true
                curl -fsSL --retry 3 --max-time 45 "$EX/api/v2/smart-contracts/$address" > "$d/smart-contract.json" 2> "$d/smart-contract.err" || true
                curl -fsSL --retry 3 --max-time 45 "$EX/api/v2/addresses/$address/internal-transactions" > "$d/internal-transactions.json" 2> "$d/internal-transactions.err" || true
                curl -fsSL --retry 3 --max-time 45 "$EX/api/v2/addresses/$address/transactions" > "$d/transactions.json" 2> "$d/transactions.err" || true
                cast logs --json --rpc-url "$RPC" --address "$address" --from-block 0 --to-block latest > "$d/logs.json" 2> "$d/logs.err" || true
              fi
            done
          done

          python3 - "$OUT" <<'PY'
          import json, pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          summary={}
          for feature in (3,4):
              fr={}
              for kind in ('prev','current','next'):
                  d=root/f'feature-{feature}'/kind
                  address=(root/f'feature-{feature}'/f'{kind}.address').read_text().strip()
                  code=''
                  if (d/'code.hex').exists(): code=(d/'code.hex').read_text().strip()
                  row={'address':address,'runtime_bytes':len(code.removeprefix('0x'))//2 if code else 0}
                  for name in ('address.json','smart-contract.json','internal-transactions.json','transactions.json','logs.json'):
                      p=d/name
                      if p.exists() and p.stat().st_size:
                          try: row[name]=json.loads(p.read_text())
                          except Exception as e: row[name]={'error':repr(e)}
                  fr[kind]=row
              summary[str(feature)]=fr
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          for feature in ('3','4'):
              if summary[feature]['current']['runtime_bytes']==0:
                  raise SystemExit(f'feature {feature} current runtime missing')
          PY

          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"

      - name: Upload public binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-features34-registry-${{ github.run_id }}
          path: features34/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
