name: Probe public 0x Intent msgSender codehashes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-intent-msgsender-codehash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Query current and historical public code
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/msgsender-codehash"
          mkdir -p "$OUT/code"
          RPC=https://eth.drpc.org
          EXPECTED=0xe98f46388916ca2f096ea767dc04dddb45d2ca2c2f44e7bcc529d6aded9c11f0
          cat > "$OUT/inputs.tsv" <<'EOF'
          0x0fbcce7bb116f943d1340534d73b83f0aed67adf	25623063
          0x1ad9feb1af22bed6e61fc9cea780fb0367a16cda	25622937
          0x1d5a8fd1ef47ce50e583bf7f64bd1379b31dbf08	25622071
          0x38f5e5b4da37531a6e85161e337e0238bb27aa90	25622748
          0x50b07c0b5e4d085e8a5c507f8a822d201d941a41	25622663
          0x5235a8e965e8556a57c7f4e0c0a961b2ce0e40f2	25622602
          0x6c3e007377effd74afe237ce3b0aeef969b63c91	25622367
          0x9f6601854dee374b1bfaf6350ffd27a97309d431	25622792
          0xad01c20d5886137e056775af56915de824c8fce5	25622370
          0xb7a7acc67208ce59ae5fe297d3b033d456c2a4a9	25622130
          0xc0658ebddcfff897b1f95c20a40fd5328438b65c	25621839
          0xd03c6eea41015e1122ab2bb33f24c7b424de7bd2	25622901
          0xde77d38bdb22549f2894bc6cfb2e2cdcb67c554b	25622747
          0xe03beb14a8ea4867aac12f047c4bcf509ba56bdf	25622398
          0xedc6531b10297788cbb0fcfaee904a3803d3e2e4	25622798
          0xf5c4f3dc02c3fb9279495a8fef7b0741da956157	25622593
          0xf8cfd0344cc5552203be99c82474fda3ea0ea0f8	25622457
          0xf9af49b841f4be0cb7595472f3f5dafff0b522f4	25622289
          EOF
          printf 'address\tblock\thistorical_bytes\thistorical_codehash\tcurrent_bytes\tcurrent_codehash\texpected_bridge_wallet\thistorical_nonce\tcurrent_nonce\n' > "$OUT/results.tsv"
          while IFS=$'\t' read -r addr block; do
            hcode=$(cast code "$addr" --block "$block" --rpc-url "$RPC")
            ccode=$(cast code "$addr" --rpc-url "$RPC")
            printf '%s\n' "$hcode" > "$OUT/code/${addr}-${block}.hex"
            printf '%s\n' "$ccode" > "$OUT/code/${addr}-latest.hex"
            hbytes=$(( (${#hcode} - 2) / 2 ))
            cbytes=$(( (${#ccode} - 2) / 2 ))
            if [ "$hbytes" -eq 0 ]; then hhash=0x0; else hhash=$(cast keccak "$hcode"); fi
            if [ "$cbytes" -eq 0 ]; then chash=0x0; else chash=$(cast keccak "$ccode"); fi
            match=false; [ "${hhash,,}" = "$EXPECTED" ] && match=true
            hnonce=$(cast nonce "$addr" --block "$block" --rpc-url "$RPC" 2>/dev/null || true)
            cnonce=$(cast nonce "$addr" --rpc-url "$RPC" 2>/dev/null || true)
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$addr" "$block" "$hbytes" "$hhash" "$cbytes" "$chash" "$match" "$hnonce" "$cnonce" >> "$OUT/results.tsv"
            curl -fsSL --retry 2 --max-time 30 "https://eth.blockscout.com/api/v2/addresses/$addr" > "$OUT/${addr}-blockscout.json" || true
          done < "$OUT/inputs.tsv"
          python3 - "$OUT" <<'PY'
          import csv,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          rows=list(csv.DictReader((root/'results.tsv').open(),delimiter='\t'))
          for r in rows:
              for k in ('block','historical_bytes','current_bytes'):
                  r[k]=int(r[k])
              r['expected_bridge_wallet']=r['expected_bridge_wallet']=='true'
          summary={
              'rows':rows,
              'historical_contract_count':sum(r['historical_bytes']>0 for r in rows),
              'bridge_wallet_matches':[r for r in rows if r['expected_bridge_wallet']],
              'historically_destroyed':[r for r in rows if r['historical_bytes']>0 and r['current_bytes']==0],
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          PY
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"
      - name: Upload public codehash evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-intent-msgsender-codehash-${{ github.run_id }}
          path: msgsender-codehash/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
