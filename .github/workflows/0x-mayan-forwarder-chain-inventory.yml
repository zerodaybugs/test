name: Inventory public Mayan forwarder runtimes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-mayan-forwarder-chain-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Query hardcoded forwarder and active feature-5 deployments
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/mayan-forwarder-inventory"
          mkdir -p "$OUT/code"
          FORWARDER=0x337685fdaB40D39bd02028545a4FfA7D287cC3E2
          REGISTRY=0x00000000000004533Fe15556B1E086BB1A72cEae
          cat > "$OUT/chains.tsv" <<'EOF'
          ethereum	1	https://eth.drpc.org
          arbitrum	42161	https://arbitrum-one-rpc.publicnode.com
          avalanche	43114	https://api.avax.network/ext/bc/C/rpc
          base	8453	https://base-rpc.publicnode.com
          bnb	56	https://bsc-rpc.publicnode.com
          optimism	10	https://optimism-rpc.publicnode.com
          polygon	137	https://polygon-bor-rpc.publicnode.com
          unichain	130	https://mainnet.unichain.org
          hyperevm	999	https://rpc.hyperliquid.xyz/evm
          EOF
          printf 'chain\texpected_chain_id\tactual_chain_id\thead\tforwarder_codehash\tforwarder_code_bytes\tguardian\tfeature5_current\tfeature5_current_codehash\tfeature5_current_code_bytes\tfeature5_prev\tfeature5_prev_codehash\tfeature5_prev_code_bytes\n' > "$OUT/inventory.tsv"

          while IFS=$'\t' read -r chain expected rpc; do
            actual=$(cast chain-id --rpc-url "$rpc" 2>/dev/null || true)
            if [ "$actual" != "$expected" ]; then
              printf '%s\t%s\t%s\tRPC_MISMATCH\n' "$chain" "$expected" "$actual" >> "$OUT/inventory.tsv"
              continue
            fi
            head=$(cast block-number --rpc-url "$rpc")
            fcode=$(cast code "$FORWARDER" --rpc-url "$rpc")
            printf '%s\n' "$fcode" > "$OUT/code/$chain-forwarder.hex"
            fbytes=$(( (${#fcode} - 2) / 2 ))
            fhash=$(cast codehash "$FORWARDER" --rpc-url "$rpc")
            guardian=$(cast call "$FORWARDER" 'guardian()(address)' --rpc-url "$rpc" 2>/dev/null || true)

            current=$(cast call "$REGISTRY" 'ownerOf(uint256)(address)' 5 --rpc-url "$rpc" 2>/dev/null || true)
            prev=$(cast call "$REGISTRY" 'prev(uint128)(address)' 5 --rpc-url "$rpc" 2>/dev/null || true)
            chash=''; cbytes=''; phash=''; pbytes=''
            if [[ "$current" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              ccode=$(cast code "$current" --rpc-url "$rpc")
              printf '%s\n' "$ccode" > "$OUT/code/$chain-feature5-current.hex"
              cbytes=$(( (${#ccode} - 2) / 2 ))
              chash=$(cast codehash "$current" --rpc-url "$rpc")
            fi
            if [[ "$prev" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              pcode=$(cast code "$prev" --rpc-url "$rpc")
              printf '%s\n' "$pcode" > "$OUT/code/$chain-feature5-prev.hex"
              pbytes=$(( (${#pcode} - 2) / 2 ))
              phash=$(cast codehash "$prev" --rpc-url "$rpc")
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$chain" "$expected" "$actual" "$head" "$fhash" "$fbytes" "$guardian" "$current" "$chash" "$cbytes" "$prev" "$phash" "$pbytes" >> "$OUT/inventory.tsv"
          done < "$OUT/chains.tsv"

          python3 - "$OUT" <<'PY'
          import csv,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          rows=list(csv.DictReader((root/'inventory.tsv').open(),delimiter='\t'))
          good=[r for r in rows if r.get('actual_chain_id')==r.get('expected_chain_id')]
          hashes={r['chain']:r.get('forwarder_codehash','') for r in good}
          nonempty={k:v for k,v in hashes.items() if v and v!='0x'+('0'*64)}
          summary={
            'queried_chains':[r['chain'] for r in good],
            'forwarder_codehashes':nonempty,
            'distinct_nonempty_forwarder_codehashes':sorted(set(nonempty.values())),
            'missing_forwarder_code_chains':[r['chain'] for r in good if int(r.get('forwarder_code_bytes') or 0)==0],
            'feature5_rows':good,
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: 0x-mayan-forwarder-inventory-${{ github.run_id }}
          path: mayan-forwarder-inventory/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
