name: Package offline Foundry and exact 0x toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-offline-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Package binaries, compiler cache, and exact public sources
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/offline-toolchain"
          SRC=/tmp/0x-settler
          rm -rf "$OUT" "$SRC"
          mkdir -p "$OUT/bin" "$OUT/solc" "$OUT/repos"

          cp "$(command -v forge)" "$(command -v cast)" "$(command -v anvil)" "$(command -v chisel)" "$OUT/bin/"
          forge --version > "$OUT/FOUNDRY_VERSION.txt"
          cast --version >> "$OUT/FOUNDRY_VERSION.txt"
          anvil --version >> "$OUT/FOUNDRY_VERSION.txt"

          git clone --recurse-submodules https://github.com/0xProject/0x-settler.git "$SRC"
          git -C "$SRC" checkout --detach 340ffbb23734843f6a569ba14360e9088009cc8c
          git -C "$SRC" submodule update --init --recursive

          (
            cd "$SRC"
            FOUNDRY_SOLC_VERSION=0.8.34 forge build -- src/chains/Mainnet/MetaTxn.sol src/chains/Mainnet/Intent.sol || true
            FOUNDRY_SOLC_VERSION=0.8.33 forge build -- src/chains/Mainnet/MetaTxn.sol src/chains/Mainnet/Intent.sol
            FOUNDRY_SOLC_VERSION=0.8.25 forge build -- src/allowanceholder/AllowanceHolder.sol src/deployer/Deployer.sol
            FOUNDRY_EVM_VERSION=london FOUNDRY_OPTIMIZER_RUNS=1000000 FOUNDRY_SOLC_VERSION=0.8.28 \
              forge build -- src/multicall/MultiCall.sol src/CrossChainReceiverFactory.sol
          ) > "$OUT/compiler-install.log" 2>&1

          cp -a "$HOME/.svm/." "$OUT/solc/"
          git -C "$SRC" rev-parse HEAD > "$OUT/OLD_HEAD.txt"
          rsync -a --exclude='.git' --exclude='out' --exclude='cache' "$SRC/" "$OUT/repos/old/"

          git -C "$SRC" checkout --detach f5744a91cb62f87f6415ec334fbe155f3705848f
          git -C "$SRC" submodule update --init --recursive
          (
            cd "$SRC"
            FOUNDRY_SOLC_VERSION=0.8.34 forge build -- src/chains/Mainnet/MetaTxn.sol src/chains/Mainnet/Intent.sol
            FOUNDRY_SOLC_VERSION=0.8.25 forge build -- src/allowanceholder/AllowanceHolder.sol src/deployer/Deployer.sol
            FOUNDRY_EVM_VERSION=london FOUNDRY_OPTIMIZER_RUNS=1000000 FOUNDRY_SOLC_VERSION=0.8.28 \
              forge build -- src/multicall/MultiCall.sol src/CrossChainReceiverFactory.sol
          ) > "$OUT/current-compiler-install.log" 2>&1
          cp -a "$HOME/.svm/." "$OUT/solc/"
          git -C "$SRC" rev-parse HEAD > "$OUT/NEW_HEAD.txt"
          rsync -a --exclude='.git' --exclude='out' --exclude='cache' "$SRC/" "$OUT/repos/new/"

          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test "$(cat "$OUT/OLD_HEAD.txt")" = 340ffbb23734843f6a569ba14360e9088009cc8c
          test "$(cat "$OUT/NEW_HEAD.txt")" = f5744a91cb62f87f6415ec334fbe155f3705848f
          test -x "$OUT/bin/forge"
          test -d "$OUT/repos/old/lib/forge-std"
          test -d "$OUT/repos/new/lib/forge-std"

      - name: Upload offline toolchain
        uses: actions/upload-artifact@v4
        with:
          name: 0x-offline-toolchain-${{ github.run_id }}
          path: offline-toolchain/
          if-no-files-found: error
          retention-days: 2
          compression-level: 1
