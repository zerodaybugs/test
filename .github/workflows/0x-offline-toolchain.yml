name: Package offline Foundry and exact 0x toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0x-offline-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Package binaries, compiler cache, and exact public sources
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/offline-toolchain"
          SRC=/tmp/0x-settler
          rm -rf "$OUT" "$SRC"
          mkdir -p "$OUT/bin" "$OUT/solc" "$OUT/repos"

          binaries_rc=0
          for name in forge cast anvil chisel; do
            path="$(command -v "$name" 2>/dev/null)"
            if [ -n "$path" ] && [ -x "$path" ]; then
              cp "$path" "$OUT/bin/$name"
              "$path" --version >> "$OUT/FOUNDRY_VERSION.txt" 2>&1
            else
              echo "missing_binary=$name" >> "$OUT/package-errors.txt"
              binaries_rc=1
            fi
          done

          git clone --recurse-submodules https://github.com/0xProject/0x-settler.git "$SRC" > "$OUT/clone.log" 2>&1
          clone_rc=$?
          old_checkout_rc=99
          old_submodule_rc=99
          old_build_rc=99
          new_checkout_rc=99
          new_submodule_rc=99
          new_build_rc=99

          if [ "$clone_rc" = 0 ]; then
            git -C "$SRC" checkout --detach 340ffbb23734843f6a569ba14360e9088009cc8c >> "$OUT/clone.log" 2>&1
            old_checkout_rc=$?
            git -C "$SRC" submodule update --init --recursive >> "$OUT/clone.log" 2>&1
            old_submodule_rc=$?
          fi

          if [ "$old_checkout_rc" = 0 ] && [ "$old_submodule_rc" = 0 ]; then
            git -C "$SRC" rev-parse HEAD > "$OUT/OLD_HEAD.txt"
            rsync -a --exclude='.git' --exclude='out' --exclude='cache' "$SRC/" "$OUT/repos/old/"
            (
              cd "$SRC"
              FOUNDRY_SOLC_VERSION=0.8.33 forge build -- src/chains/Mainnet/MetaTxn.sol src/chains/Mainnet/Intent.sol
              FOUNDRY_SOLC_VERSION=0.8.25 forge build -- src/allowanceholder/AllowanceHolder.sol src/deployer/Deployer.sol
              FOUNDRY_EVM_VERSION=london FOUNDRY_OPTIMIZER_RUNS=1000000 FOUNDRY_SOLC_VERSION=0.8.28 \
                forge build -- src/multicall/MultiCall.sol src/CrossChainReceiverFactory.sol
            ) > "$OUT/old-compiler-install.log" 2>&1
            old_build_rc=$?
          fi

          if [ "$clone_rc" = 0 ]; then
            git -C "$SRC" checkout --detach f5744a91cb62f87f6415ec334fbe155f3705848f >> "$OUT/clone.log" 2>&1
            new_checkout_rc=$?
            git -C "$SRC" submodule update --init --recursive >> "$OUT/clone.log" 2>&1
            new_submodule_rc=$?
          fi

          if [ "$new_checkout_rc" = 0 ] && [ "$new_submodule_rc" = 0 ]; then
            git -C "$SRC" rev-parse HEAD > "$OUT/NEW_HEAD.txt"
            rsync -a --exclude='.git' --exclude='out' --exclude='cache' "$SRC/" "$OUT/repos/new/"
            (
              cd "$SRC"
              FOUNDRY_SOLC_VERSION=0.8.34 forge build -- src/chains/Mainnet/MetaTxn.sol src/chains/Mainnet/Intent.sol
              FOUNDRY_SOLC_VERSION=0.8.25 forge build -- src/allowanceholder/AllowanceHolder.sol src/deployer/Deployer.sol
              FOUNDRY_EVM_VERSION=london FOUNDRY_OPTIMIZER_RUNS=1000000 FOUNDRY_SOLC_VERSION=0.8.28 \
                forge build -- src/multicall/MultiCall.sol src/CrossChainReceiverFactory.sol
            ) > "$OUT/new-compiler-install.log" 2>&1
            new_build_rc=$?
          fi

          if [ -d "$HOME/.svm" ]; then
            cp -a "$HOME/.svm/." "$OUT/solc/"
          else
            echo 'missing_svm_directory=1' >> "$OUT/package-errors.txt"
          fi

          printf '%s\n' \
            "binaries_rc=$binaries_rc" \
            "clone_rc=$clone_rc" \
            "old_checkout_rc=$old_checkout_rc" \
            "old_submodule_rc=$old_submodule_rc" \
            "old_build_rc=$old_build_rc" \
            "new_checkout_rc=$new_checkout_rc" \
            "new_submodule_rc=$new_submodule_rc" \
            "new_build_rc=$new_build_rc" \
            > "$OUT/status.txt"

          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          exit 0

      - name: Upload offline toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0x-offline-toolchain-${{ github.run_id }}
          path: offline-toolchain/
          if-no-files-found: error
          retention-days: 2
          compression-level: 1

      - name: Enforce minimum toolchain gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'binaries_rc=0' offline-toolchain/status.txt
          grep -Fx 'clone_rc=0' offline-toolchain/status.txt
          grep -Fx 'old_checkout_rc=0' offline-toolchain/status.txt
          grep -Fx 'old_submodule_rc=0' offline-toolchain/status.txt
          grep -Fx 'new_checkout_rc=0' offline-toolchain/status.txt
          grep -Fx 'new_submodule_rc=0' offline-toolchain/status.txt
          test -x offline-toolchain/bin/forge
          test -d offline-toolchain/repos/old/lib/forge-std
          test -d offline-toolchain/repos/new/lib/forge-std
