name: Export public 0x Settler source

on:
  push:
    branches:
      - infra/0x-source-export-20260726
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Clone and package public source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/public-source"
          SRC=/tmp/0x-settler
          rm -rf "$SRC" "$OUT"
          git clone https://github.com/0xProject/0x-settler.git "$SRC"
          git -C "$SRC" checkout --detach 862904650067da8f56e2be17e5007ea0db2849cb
          mkdir -p "$OUT/repo"
          rsync -a --exclude='.git' --exclude='lib' --exclude='out' --exclude='cache' \
            "$SRC/" "$OUT/repo/"
          git -C "$SRC" log --date=iso-strict --pretty=format:'%H%x09%aI%x09%s' -n 2000 > "$OUT/git-log.tsv"
          git -C "$SRC" rev-parse HEAD > "$OUT/HEAD.txt"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test "$(cat "$OUT/HEAD.txt")" = "862904650067da8f56e2be17e5007ea0db2849cb"
          test -s "$OUT/repo/src/Settler.sol"

      - name: Upload public source
        uses: actions/upload-artifact@v4
        with:
          name: 0x-settler-public-source-${{ github.run_id }}
          path: public-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
