name: Temporary Aspire Dashboard Publish

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspire-dashboard-publish-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspire-dashboard-publish-20260815
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact official Aspire source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/aspire
          ref: ca5531966ae95ed5066cc8e7aef9af12dd001412
          fetch-depth: 1
          persist-credentials: false
          path: aspire

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Restore official dependencies and normalize package asset layout
        shell: bash
        run: |
          set -euo pipefail
          cd aspire
          dotnet restore src/Aspire.Dashboard/Aspire.Dashboard.csproj --force --no-cache --nologo

          mkdir -p "$GITHUB_WORKSPACE/export"
          find .packages/microsoft.aspnetcore.app.internal.assets -type f -name blazor.web.js -print \
            | sort | tee "$GITHUB_WORKSPACE/export/BLAZOR_ASSET_PATHS.txt"

          normalize_asset() {
            local version="$1"
            local expected_rel="$2"
            local root=".packages/microsoft.aspnetcore.app.internal.assets/$version"
            local expected="$root/$expected_rel"
            if [[ -f "$expected" ]]; then
              return 0
            fi
            local source
            source="$(find "$root" -type f -name blazor.web.js -print -quit)"
            if [[ -z "$source" ]]; then
              echo "No blazor.web.js found under $root" >&2
              find "$root" -maxdepth 4 -type f -print >&2 || true
              return 1
            fi
            mkdir -p "$(dirname "$expected")"
            cp -a "$source" "$expected"
            printf 'normalized %s -> %s\n' "$source" "$expected" \
              >> "$GITHUB_WORKSPACE/export/ASSET_NORMALIZATION.txt"
          }

          normalize_asset "10.0.8" "_framework/blazor.web.js"
          normalize_asset "11.0.0-preview.6.26359.118" "staticwebassets/_framework/blazor.web.js"

      - name: Publish official dashboard source
        shell: bash
        run: |
          set -euo pipefail
          cd aspire
          dotnet publish src/Aspire.Dashboard/Aspire.Dashboard.csproj \
            -c Release \
            -o "$GITHUB_WORKSPACE/export/dashboard" \
            --no-restore \
            --nologo \
            /p:ContinuousIntegrationBuild=true
          git status --short > "$GITHUB_WORKSPACE/export/GIT_STATUS.txt"
          git diff -- src/Aspire.Dashboard ':!src/Aspire.Dashboard/wwwroot/framework/blazor.web.10.js' ':!src/Aspire.Dashboard/wwwroot/framework/blazor.web.11.js' \
            > "$GITHUB_WORKSPACE/export/SOURCE_DIFF_EXCLUDING_GENERATED_ASSETS.patch"
          test ! -s "$GITHUB_WORKSPACE/export/SOURCE_DIFF_EXCLUDING_GENERATED_ASSETS.patch"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/export/COMMIT_SHA.txt"
          dotnet --info > "$GITHUB_WORKSPACE/export/DOTNET_INFO.txt"
          (
            cd "$GITHUB_WORKSPACE/export"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$GITHUB_WORKSPACE/export"

      - name: Upload official publish output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspire-dashboard-ca553196-net8-rollforward-linux-x64
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
