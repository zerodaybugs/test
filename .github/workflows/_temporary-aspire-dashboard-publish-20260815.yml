name: Temporary Aspire Dashboard Publish

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspire-dashboard-publish-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspire-dashboard-publish-20260815
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact official Aspire source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/aspire
          ref: ca5531966ae95ed5066cc8e7aef9af12dd001412
          fetch-depth: 1
          persist-credentials: false
          path: aspire

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Publish unmodified dashboard
        shell: bash
        run: |
          set -euo pipefail
          cd aspire
          dotnet publish src/Aspire.Dashboard/Aspire.Dashboard.csproj \
            -c Release \
            -f net10.0 \
            -o "$GITHUB_WORKSPACE/export/dashboard" \
            --nologo \
            /p:ContinuousIntegrationBuild=true
          git status --short > "$GITHUB_WORKSPACE/export/GIT_STATUS.txt"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/export/COMMIT_SHA.txt"
          dotnet --info > "$GITHUB_WORKSPACE/export/DOTNET_INFO.txt"
          (
            cd "$GITHUB_WORKSPACE/export"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$GITHUB_WORKSPACE/export"

      - name: Upload unmodified publish output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspire-dashboard-ca553196-net10-linux-x64
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
