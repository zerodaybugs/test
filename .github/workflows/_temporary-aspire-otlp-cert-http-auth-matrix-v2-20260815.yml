name: Temporary Aspire OTLP Certificate HTTP Auth Matrix V2

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspire-otlp-cert-http-auth-matrix-v2-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspire-otlp-cert-http-auth-matrix-v2-20260815
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Create exact framework integration harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness evidence
          cat > harness/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.Authentication.Certificate" Version="10.0.10" />
            </ItemGroup>
          </Project>
          EOF

          cat > harness/Program.cs <<'EOF'
          using System.Security.Claims;
          using System.Text.Encodings.Web;
          using System.Text.Json;
          using Microsoft.AspNetCore.Authentication;
          using Microsoft.AspNetCore.Authentication.Certificate;
          using Microsoft.AspNetCore.Authorization;
          using Microsoft.AspNetCore.Hosting.Server;
          using Microsoft.AspNetCore.Hosting.Server.Features;
          using Microsoft.Extensions.Options;

          namespace AspireOtlpAuthMatrix;

          internal static class Program
          {
              private const string ConnectionScheme = "ConnectionOtlp";
              private const string ApiKeyScheme = "OtlpApiKey";
              private const string CompositeScheme = "OtlpComposite";
              private const string PatchedCompositeScheme = "OtlpCompositePatched";
              private const string OtlpClaimName = "Aspire.Dashboard.Otlp";
              private const string OtlpPolicyName = "OtlpPolicy";

              public static async Task<int> Main()
              {
                  var results = new[]
                  {
                      await RunCaseAsync("client-certificate-http-exact", AuthMode.ClientCertificate, patched: false),
                      await RunCaseAsync("api-key-http-missing-key-control", AuthMode.ApiKey, patched: false),
                      await RunCaseAsync("client-certificate-http-patched-control", AuthMode.ClientCertificate, patched: true),
                  };

                  Console.WriteLine(JsonSerializer.Serialize(results, new JsonSerializerOptions { WriteIndented = true }));

                  bool candidate =
                      results[0].Status == StatusCodes.Status200OK &&
                      results[1].Status == StatusCodes.Status401Unauthorized &&
                      results[2].Status == StatusCodes.Status401Unauthorized &&
                      results[0].Body.Contains("\"otlpClaim\":\"True\"", StringComparison.Ordinal);

                  Console.WriteLine($"CANDIDATE_AUTH_BYPASS={(candidate ? 1 : 0)}");
                  return candidate ? 0 : 90;
              }

              private static async Task<CaseResult> RunCaseAsync(string name, AuthMode mode, bool patched)
              {
                  string selectedCompositeScheme = patched ? PatchedCompositeScheme : CompositeScheme;

                  var builder = WebApplication.CreateBuilder(new WebApplicationOptions
                  {
                      EnvironmentName = Environments.Production,
                      ApplicationName = typeof(Program).Assembly.FullName,
                  });

                  builder.Logging.ClearProviders();
                  builder.WebHost.UseUrls("http://127.0.0.1:0");
                  builder.Services.Configure<MatrixOptions>(o => o.Mode = mode);

                  var authentication = builder.Services
                      .AddAuthentication(options =>
                      {
                          options.DefaultAuthenticateScheme = selectedCompositeScheme;
                          options.DefaultChallengeScheme = selectedCompositeScheme;
                      })
                      .AddScheme<AuthenticationSchemeOptions, ConnectionSuccessHandler>(ConnectionScheme, _ => { })
                      .AddScheme<AuthenticationSchemeOptions, MissingApiKeyFailureHandler>(ApiKeyScheme, _ => { })
                      .AddScheme<AuthenticationSchemeOptions, ExactAspireCompositeHandler>(CompositeScheme, _ => { })
                      .AddScheme<AuthenticationSchemeOptions, PatchedCompositeHandler>(PatchedCompositeScheme, _ => { });

                  authentication.AddCertificate(CertificateAuthenticationDefaults.AuthenticationScheme, _ => { });

                  builder.Services.AddAuthorization(options =>
                  {
                      options.AddPolicy(OtlpPolicyName, new AuthorizationPolicyBuilder(selectedCompositeScheme)
                          .RequireClaim(OtlpClaimName, bool.TrueString)
                          .Build());
                  });

                  await using var app = builder.Build();
                  app.UseAuthentication();
                  app.UseAuthorization();
                  app.MapPost("/v1/logs", (HttpContext context) => Results.Json(new
                  {
                      authenticated = context.User.Identity?.IsAuthenticated,
                      authenticationType = context.User.Identity?.AuthenticationType,
                      otlpClaim = context.User.FindFirst(OtlpClaimName)?.Value,
                  })).RequireAuthorization(OtlpPolicyName);

                  await app.StartAsync();
                  var addresses = app.Services.GetRequiredService<IServer>()
                      .Features.Get<IServerAddressesFeature>()?.Addresses
                      ?? throw new InvalidOperationException("No server addresses.");
                  string address = addresses.Single();

                  using var client = new HttpClient { BaseAddress = new Uri(address) };
                  using var content = new ByteArrayContent(Array.Empty<byte>());
                  content.Headers.ContentType = new System.Net.Http.Headers.MediaTypeHeaderValue("application/x-protobuf");
                  using var response = await client.PostAsync("/v1/logs", content);
                  string body = await response.Content.ReadAsStringAsync();
                  await app.StopAsync();

                  return new CaseResult(
                      name,
                      mode.ToString(),
                      patched,
                      selectedCompositeScheme,
                      address,
                      address.StartsWith("https://", StringComparison.OrdinalIgnoreCase),
                      (int)response.StatusCode,
                      response.StatusCode.ToString(),
                      body);
              }

              internal static IEnumerable<string> GetRelevantSchemes(AuthMode mode)
              {
                  yield return ConnectionScheme;
                  yield return mode == AuthMode.ApiKey
                      ? ApiKeyScheme
                      : CertificateAuthenticationDefaults.AuthenticationScheme;
              }

              internal static AuthenticationTicket CreateOtlpTicket(string scheme)
              {
                  var identity = new ClaimsIdentity(
                      [new Claim(OtlpClaimName, bool.TrueString)],
                      scheme);
                  return new AuthenticationTicket(new ClaimsPrincipal(identity), scheme);
              }
          }

          internal enum AuthMode
          {
              ClientCertificate,
              ApiKey,
          }

          internal sealed class MatrixOptions
          {
              public AuthMode Mode { get; set; }
          }

          internal sealed record CaseResult(
              string Name,
              string Mode,
              bool Patched,
              string Scheme,
              string Address,
              bool IsHttps,
              int Status,
              string StatusText,
              string Body);

          internal sealed class ConnectionSuccessHandler(
              IOptionsMonitor<AuthenticationSchemeOptions> options,
              ILoggerFactory logger,
              UrlEncoder encoder)
              : AuthenticationHandler<AuthenticationSchemeOptions>(options, logger, encoder)
          {
              protected override Task<AuthenticateResult> HandleAuthenticateAsync()
              {
                  var identity = new ClaimsIdentity([new Claim("connection", "otlp")], Scheme.Name);
                  var ticket = new AuthenticationTicket(new ClaimsPrincipal(identity), Scheme.Name);
                  return Task.FromResult(AuthenticateResult.Success(ticket));
              }
          }

          internal sealed class MissingApiKeyFailureHandler(
              IOptionsMonitor<AuthenticationSchemeOptions> options,
              ILoggerFactory logger,
              UrlEncoder encoder)
              : AuthenticationHandler<AuthenticationSchemeOptions>(options, logger, encoder)
          {
              protected override Task<AuthenticateResult> HandleAuthenticateAsync()
                  => Task.FromResult(AuthenticateResult.Fail("Missing API key control."));
          }

          // Semantically identical to Aspire v13.4.6 OtlpCompositeAuthenticationHandler:
          // reject only result.Failure, then mint the OTLP claim.
          internal sealed class ExactAspireCompositeHandler(
              IOptionsMonitor<MatrixOptions> matrixOptions,
              IOptionsMonitor<AuthenticationSchemeOptions> options,
              ILoggerFactory logger,
              UrlEncoder encoder)
              : AuthenticationHandler<AuthenticationSchemeOptions>(options, logger, encoder)
          {
              protected override async Task<AuthenticateResult> HandleAuthenticateAsync()
              {
                  foreach (string scheme in Program.GetRelevantSchemes(matrixOptions.CurrentValue.Mode))
                  {
                      AuthenticateResult result = await Context.AuthenticateAsync(scheme).ConfigureAwait(false);
                      if (result.Failure is not null)
                      {
                          return result;
                      }
                  }

                  return AuthenticateResult.Success(Program.CreateOtlpTicket(Scheme.Name));
              }
          }

          // Security control: every required scheme must explicitly succeed.
          internal sealed class PatchedCompositeHandler(
              IOptionsMonitor<MatrixOptions> matrixOptions,
              IOptionsMonitor<AuthenticationSchemeOptions> options,
              ILoggerFactory logger,
              UrlEncoder encoder)
              : AuthenticationHandler<AuthenticationSchemeOptions>(options, logger, encoder)
          {
              protected override async Task<AuthenticateResult> HandleAuthenticateAsync()
              {
                  foreach (string scheme in Program.GetRelevantSchemes(matrixOptions.CurrentValue.Mode))
                  {
                      AuthenticateResult result = await Context.AuthenticateAsync(scheme).ConfigureAwait(false);
                      if (!result.Succeeded)
                      {
                          return result.Failure is not null
                              ? result
                              : AuthenticateResult.Fail($"Required scheme {scheme} returned NoResult.");
                      }
                  }

                  return AuthenticateResult.Success(Program.CreateOtlpTicket(Scheme.Name));
              }
          }
          EOF

          dotnet restore harness/harness.csproj --nologo
          dotnet build harness/harness.csproj -c Release --no-restore --nologo

      - name: Run deterministic auth matrix
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info > evidence/DOTNET_INFO.txt
          dotnet list harness/harness.csproj package --include-transitive > evidence/PACKAGES.txt
          set +e
          dotnet run --project harness/harness.csproj -c Release --no-build \
            > evidence/MATRIX.log 2>&1
          rc=$?
          set -e
          echo "HARNESS_RC=$rc" | tee evidence/VERDICT.env
          grep '^CANDIDATE_AUTH_BYPASS=' evidence/MATRIX.log | tee -a evidence/VERDICT.env
          cat evidence/MATRIX.log
          cp harness/Program.cs harness/harness.csproj evidence/
          (
            cd evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          test "$rc" -eq 0
          grep -q '^CANDIDATE_AUTH_BYPASS=1$' evidence/MATRIX.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspire-otlp-cert-http-auth-matrix-v2-20260815
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
