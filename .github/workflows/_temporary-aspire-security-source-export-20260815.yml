name: Temporary Aspire Security Source Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspire-security-source-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspire-security-source-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout official Aspire source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: microsoft/aspire
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: aspire

      - name: Stage security-relevant source snapshot
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/aspire-security-source"
          mkdir -p "$OUT"
          cp -a aspire/.git/HEAD "$OUT/GIT_HEAD"
          git -C aspire rev-parse HEAD > "$OUT/COMMIT_SHA.txt"
          git -C aspire status --short > "$OUT/GIT_STATUS.txt"

          copy_path() {
            local rel="$1"
            if [[ -e "aspire/$rel" ]]; then
              mkdir -p "$OUT/$(dirname "$rel")"
              cp -a "aspire/$rel" "$OUT/$rel"
            fi
          }

          copy_path src/Aspire.Dashboard
          copy_path src/Aspire.Hosting/Dashboard
          copy_path src/Aspire.Hosting/Backchannel
          copy_path src/Aspire.Hosting/DevTunnels
          copy_path src/Aspire.Hosting/ApplicationModel
          copy_path src/Aspire.Hosting/Dcp
          copy_path src/Aspire.Cli/Commands
          copy_path src/Aspire.Cli/Profiling
          copy_path src/Shared
          copy_path tests/Aspire.Dashboard.Tests
          copy_path tests/Aspire.Hosting.Tests
          copy_path Directory.Packages.props
          copy_path Directory.Build.props
          copy_path global.json

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$OUT"

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspire-security-source-20260815
          path: aspire-security-source
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
