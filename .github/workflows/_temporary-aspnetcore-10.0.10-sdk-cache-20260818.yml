name: Temporary ASP.NET Core 10.0.10 exact SDK cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
    paths:
      - .github/workflows/_temporary-aspnetcore-10.0.10-sdk-cache-20260818.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-exact-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817

      - name: Download exact official .NET 10.0.302 SDK
        shell: bash
        run: |
          set -euo pipefail
          url='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.302/dotnet-sdk-10.0.302-linux-x64.tar.gz'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output dotnet-sdk-10.0.302-linux-x64.tar.gz
          test -s dotnet-sdk-10.0.302-linux-x64.tar.gz
          mkdir extracted
          tar -xzf dotnet-sdk-10.0.302-linux-x64.tar.gz -C extracted
          test -x extracted/dotnet
          test -d extracted/shared/Microsoft.AspNetCore.App/10.0.10
          test -d extracted/shared/Microsoft.NETCore.App/10.0.10
          extracted/dotnet --info | tee DOTNET_INFO.txt
          test "$(extracted/dotnet --version)" = '10.0.302'
          printf '%s\n' 'https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.302/dotnet-sdk-10.0.302-linux-x64.tar.gz' > SOURCE_URL.txt
          sha512sum dotnet-sdk-10.0.302-linux-x64.tar.gz > SHA512SUMS.txt
          sha256sum dotnet-sdk-10.0.302-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Upload exact SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-linux-x64-exact
          path: |
            dotnet-sdk-10.0.302-linux-x64.tar.gz
            DOTNET_INFO.txt
            SOURCE_URL.txt
            SHA512SUMS.txt
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
