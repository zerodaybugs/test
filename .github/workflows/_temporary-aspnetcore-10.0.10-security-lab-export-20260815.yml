name: Temporary ASP.NET Core 10.0.10 Security Lab Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspnetcore-10.0.10-security-lab-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspnetcore-10.0.10-security-lab-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact official ASP.NET Core release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          fetch-depth: 1
          persist-credentials: false
          path: aspnetcore

      - name: Install exact supported .NET SDK and ASP.NET runtime
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Verify exact runtime versions
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet --list-runtimes
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 10\.0\.10 '
          dotnet --list-runtimes | grep -E '^Microsoft\.AspNetCore\.App 10\.0\.10 '

      - name: Stage runtime and security-relevant source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")") }"
          ROOT="${ROOT% }"
          OUT="$GITHUB_WORKSPACE/aspnetcore-lab"
          mkdir -p "$OUT/dotnet/shared" "$OUT/source/src" "$OUT/source/eng"

          cp -a "$ROOT/shared/Microsoft.AspNetCore.App/10.0.10" "$OUT/dotnet/shared/Microsoft.AspNetCore.App"
          cp -a "$ROOT/shared/Microsoft.NETCore.App/10.0.10" "$OUT/dotnet/shared/Microsoft.NETCore.App"
          cp -a "$ROOT/host" "$OUT/dotnet/"
          cp -a "$ROOT/dotnet" "$OUT/dotnet/"

          copy_src() {
            local rel="$1"
            if test -e "aspnetcore/$rel"; then
              mkdir -p "$OUT/source/$(dirname "$rel")"
              cp -a "aspnetcore/$rel" "$OUT/source/$rel"
            fi
          }

          copy_src src/Servers/Kestrel
          copy_src src/Http/Http
          copy_src src/Http/Headers
          copy_src src/Http/WebUtilities
          copy_src src/Http/Routing
          copy_src src/Middleware/HostFiltering
          copy_src src/Middleware/HttpOverrides
          copy_src src/Security/Authentication/Cookies
          copy_src src/Shared/ResultsHelpers
          copy_src src/Shared/ServerInfrastructure
          copy_src src/Shared/HttpRuleParser
          copy_src eng/Versions.props

          git -C aspnetcore rev-parse HEAD > "$OUT/OFFICIAL_COMMIT.txt"
          git -C aspnetcore status --short > "$OUT/GIT_STATUS.txt"
          dotnet --info > "$OUT/DOTNET_INFO.txt"
          dotnet --list-runtimes > "$OUT/DOTNET_RUNTIMES.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$OUT"

      - name: Upload generic ASP.NET Core lab artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspnetcore-v10.0.10-security-lab-linux-x64
          path: aspnetcore-lab
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
