name: Temporary ASP.NET Core 10.0.11 exact SDK cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
    paths:
      - .github/workflows/_temporary-aspnetcore-10.0.400-sdk-cache-20260819.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-exact-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817

      - name: Download and verify exact official SDK and template asset package
        shell: bash
        run: |
          set -euo pipefail
          outdir='tooling-cache/aspnetcore-10.0.11-sdk'
          mkdir -p "$outdir" extracted
          sdk="$outdir/dotnet-sdk-10.0.400-linux-x64.tar.gz"
          sdk_url='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.400/dotnet-sdk-10.0.400-linux-x64.tar.gz'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$sdk_url" --output "$sdk"
          test -s "$sdk"
          tar -xzf "$sdk" -C extracted
          test -x extracted/dotnet
          test "$(extracted/dotnet --version)" = '10.0.400'
          test -d extracted/shared/Microsoft.AspNetCore.App/10.0.11
          test -d extracted/shared/Microsoft.NETCore.App/10.0.11
          extracted/dotnet --info | tee "$outdir/DOTNET_INFO.txt"

          assets="$outdir/microsoft.aspnetcore.app.internal.assets.10.0.11.nupkg"
          assets_url='https://api.nuget.org/v3-flatcontainer/microsoft.aspnetcore.app.internal.assets/10.0.11/microsoft.aspnetcore.app.internal.assets.10.0.11.nupkg'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$assets_url" --output "$assets"
          test -s "$assets"
          unzip -p "$assets" '*.nuspec' | grep -q '<version>10.0.11</version>'

          printf '%s\n' "$sdk_url" "$assets_url" > "$outdir/SOURCE_URLS.txt"
          sha256sum "$sdk" "$assets" > "$outdir/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$outdir/WORKFLOW_RUN_ID.txt"

      - name: Upload exact SDK and assets
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.400-aspnetcore-10.0.11-exact
          path: |
            tooling-cache/aspnetcore-10.0.11-sdk/dotnet-sdk-10.0.400-linux-x64.tar.gz
            tooling-cache/aspnetcore-10.0.11-sdk/microsoft.aspnetcore.app.internal.assets.10.0.11.nupkg
            tooling-cache/aspnetcore-10.0.11-sdk/DOTNET_INFO.txt
            tooling-cache/aspnetcore-10.0.11-sdk/SOURCE_URLS.txt
            tooling-cache/aspnetcore-10.0.11-sdk/SHA256SUMS.txt
            tooling-cache/aspnetcore-10.0.11-sdk/WORKFLOW_RUN_ID.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Persist run metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/aspnetcore-10.0.11-sdk/WORKFLOW_RUN_ID.txt tooling-cache/aspnetcore-10.0.11-sdk/SHA256SUMS.txt tooling-cache/aspnetcore-10.0.11-sdk/DOTNET_INFO.txt tooling-cache/aspnetcore-10.0.11-sdk/SOURCE_URLS.txt
          git commit -m 'cache: ASP.NET Core 10.0.11 SDK metadata' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
