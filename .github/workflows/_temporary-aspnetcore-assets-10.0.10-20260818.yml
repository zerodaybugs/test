name: Temporary ASP.NET Core 10.0.10 assets cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
    paths:
      - .github/workflows/_temporary-aspnetcore-assets-10.0.10-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817

      - name: Download and verify exact package
        shell: bash
        run: |
          set -euo pipefail
          outdir='tooling-cache/aspnetcore-assets-10.0.10'
          mkdir -p "$outdir"
          package="$outdir/microsoft.aspnetcore.app.internal.assets.10.0.10.nupkg"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors \
            'https://api.nuget.org/v3-flatcontainer/microsoft.aspnetcore.app.internal.assets/10.0.10/microsoft.aspnetcore.app.internal.assets.10.0.10.nupkg' \
            --output "$package"
          test -s "$package"
          rm -rf extracted
          unzip -q "$package" -d extracted
          grep -q '<id>Microsoft.AspNetCore.App.Internal.Assets</id>' extracted/Microsoft.AspNetCore.App.Internal.Assets.nuspec
          grep -q '<version>10.0.10</version>' extracted/Microsoft.AspNetCore.App.Internal.Assets.nuspec
          sha256sum "$package" > "$outdir/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$outdir/WORKFLOW_RUN_ID.txt"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-aspnetcore-app-internal-assets-10.0.10
          path: |
            tooling-cache/aspnetcore-assets-10.0.10/microsoft.aspnetcore.app.internal.assets.10.0.10.nupkg
            tooling-cache/aspnetcore-assets-10.0.10/SHA256SUMS.txt
            tooling-cache/aspnetcore-assets-10.0.10/WORKFLOW_RUN_ID.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Persist run metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/aspnetcore-assets-10.0.10
          git commit -m 'cache: ASP.NET Core 10.0.10 static assets package' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
