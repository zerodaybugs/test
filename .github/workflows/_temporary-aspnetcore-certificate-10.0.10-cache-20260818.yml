name: Temporary ASP.NET Core Certificate 10.0.10 package cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
    paths:
      - .github/workflows/_temporary-aspnetcore-certificate-10.0.10-cache-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-exact-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817

      - name: Download and verify exact package
        shell: bash
        run: |
          set -euo pipefail
          outdir='tooling-cache/aspnetcore-certificate-10.0.10'
          mkdir -p "$outdir"
          package="$outdir/microsoft.aspnetcore.authentication.certificate.10.0.10.nupkg"
          url='https://api.nuget.org/v3-flatcontainer/microsoft.aspnetcore.authentication.certificate/10.0.10/microsoft.aspnetcore.authentication.certificate.10.0.10.nupkg'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output "$package"
          test -s "$package"
          rm -rf extracted
          unzip -q "$package" -d extracted
          grep -q '<id>Microsoft.AspNetCore.Authentication.Certificate</id>' extracted/Microsoft.AspNetCore.Authentication.Certificate.nuspec
          grep -q '<version>10.0.10</version>' extracted/Microsoft.AspNetCore.Authentication.Certificate.nuspec
          test -f extracted/lib/net10.0/Microsoft.AspNetCore.Authentication.Certificate.dll
          sha256sum "$package" > "$outdir/SHA256SUMS.txt"
          find extracted -type f -print0 | sort -z | xargs -0 sha256sum > "$outdir/EXTRACTED_SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$outdir/WORKFLOW_RUN_ID.txt"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-aspnetcore-authentication-certificate-10.0.10
          path: |
            tooling-cache/aspnetcore-certificate-10.0.10/microsoft.aspnetcore.authentication.certificate.10.0.10.nupkg
            tooling-cache/aspnetcore-certificate-10.0.10/SHA256SUMS.txt
            tooling-cache/aspnetcore-certificate-10.0.10/EXTRACTED_SHA256SUMS.txt
            tooling-cache/aspnetcore-certificate-10.0.10/WORKFLOW_RUN_ID.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Persist run metadata and package cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/aspnetcore-certificate-10.0.10
          git commit -m 'cache: Microsoft.AspNetCore.Authentication.Certificate 10.0.10' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
