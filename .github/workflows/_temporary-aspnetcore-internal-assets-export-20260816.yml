name: Temporary ASP.NET Core Internal Assets Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspnetcore-internal-assets-export-20260816.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact framework asset package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          curl --fail --location --retry 3 \
            https://www.nuget.org/api/v2/package/Microsoft.AspNetCore.App.Internal.Assets/10.0.10 \
            --output export/microsoft.aspnetcore.app.internal.assets.10.0.10.nupkg
          sha256sum export/*.nupkg > export/SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-aspnetcore-app-internal-assets-10.0.10
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
