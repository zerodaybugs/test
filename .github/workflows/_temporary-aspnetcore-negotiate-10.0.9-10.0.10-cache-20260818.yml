name: Temporary ASP.NET Core Negotiate package diff cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
    paths:
      - .github/workflows/_temporary-aspnetcore-negotiate-10.0.9-10.0.10-cache-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-packages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817

      - name: Download and verify exact packages
        shell: bash
        run: |
          set -euo pipefail
          outdir='tooling-cache/aspnetcore-negotiate-diff'
          mkdir -p "$outdir"
          for version in 10.0.9 10.0.10; do
            package="$outdir/microsoft.aspnetcore.authentication.negotiate.$version.nupkg"
            url="https://api.nuget.org/v3-flatcontainer/microsoft.aspnetcore.authentication.negotiate/$version/microsoft.aspnetcore.authentication.negotiate.$version.nupkg"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output "$package"
            test -s "$package"
            rm -rf "extracted-$version"
            unzip -q "$package" -d "extracted-$version"
            grep -q '<id>Microsoft.AspNetCore.Authentication.Negotiate</id>' "extracted-$version/Microsoft.AspNetCore.Authentication.Negotiate.nuspec"
            grep -q "<version>$version</version>" "extracted-$version/Microsoft.AspNetCore.Authentication.Negotiate.nuspec"
            test -f "extracted-$version/lib/net10.0/Microsoft.AspNetCore.Authentication.Negotiate.dll"
            find "extracted-$version" -type f -print0 | sort -z | xargs -0 sha256sum > "$outdir/EXTRACTED_SHA256SUMS-$version.txt"
          done
          sha256sum "$outdir"/*.nupkg > "$outdir/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$outdir/WORKFLOW_RUN_ID.txt"

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-aspnetcore-authentication-negotiate-10.0.9-10.0.10
          path: tooling-cache/aspnetcore-negotiate-diff
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Persist package cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/aspnetcore-negotiate-diff
          git commit -m 'cache: Negotiate 10.0.9 and 10.0.10 packages' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
