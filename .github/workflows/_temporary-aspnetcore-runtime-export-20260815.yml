name: Temporary ASP.NET Core 10.0.10 Runtime Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspnetcore-runtime-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspnetcore-runtime-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Stage exact ASP.NET Core runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")") }"
          ROOT="${ROOT% }"
          OUT="$GITHUB_WORKSPACE/export"
          mkdir -p "$OUT/shared/Microsoft.AspNetCore.App"
          test -d "$ROOT/shared/Microsoft.AspNetCore.App/10.0.10"
          cp -a "$ROOT/shared/Microsoft.AspNetCore.App/10.0.10" "$OUT/shared/Microsoft.AspNetCore.App/"
          dotnet --info > "$OUT/DOTNET_INFO.txt"
          dotnet --list-runtimes > "$OUT/DOTNET_RUNTIMES.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$OUT"

      - name: Upload exact ASP.NET Core runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspnetcore-runtime-10.0.10-linux-x64
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
