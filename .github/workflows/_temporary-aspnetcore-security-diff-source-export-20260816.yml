name: Temporary ASP.NET Core Security Diff Source Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspnetcore-security-diff-source-export-20260816.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pre-patch release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.9
          fetch-depth: 1
          persist-credentials: false
          path: before

      - name: Checkout patched release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          fetch-depth: 1
          persist-credentials: false
          path: after

      - name: Stage source and deterministic diff
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          mkdir -p "$OUT/before" "$OUT/after" "$OUT/meta"
          printf 'v10.0.9=%s\n' "$(git -C before rev-parse HEAD)" > "$OUT/meta/COMMITS.txt"
          printf 'v10.0.10=%s\n' "$(git -C after rev-parse HEAD)" >> "$OUT/meta/COMMITS.txt"
          paths=(
            src/Security/Authentication
            src/Servers/Kestrel
            src/Http
            src/Middleware
            src/DataProtection
            src/Shared
            src/Components
            src/Mvc
            src/Grpc
          )
          for p in "${paths[@]}"; do
            if [[ -d "before/$p" ]]; then mkdir -p "$OUT/before/$(dirname "$p")"; cp -a "before/$p" "$OUT/before/$p"; fi
            if [[ -d "after/$p" ]]; then mkdir -p "$OUT/after/$(dirname "$p")"; cp -a "after/$p" "$OUT/after/$p"; fi
          done
          find "$OUT" -type d \( -name bin -o -name obj -o -name node_modules \) -prune -exec rm -rf '{}' +
          diff -ruN "$OUT/before" "$OUT/after" > "$OUT/meta/V10_0_9_TO_V10_0_10.diff" || true
          find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/meta/FILE_SIZES.tsv"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          du -sh "$OUT"

      - name: Upload source export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspnetcore-source-v10.0.9-vs-v10.0.10
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
