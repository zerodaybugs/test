name: Temporary ASP.NET Core Variant Source Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-aspnetcore-variant-source-export-20260816.yml

permissions:
  contents: read

concurrency:
  group: temporary-aspnetcore-variant-source-export-20260816
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout supported release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          fetch-depth: 1
          persist-credentials: false
          path: release

      - name: Checkout servicing branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/aspnetcore
          ref: release/10.0
          fetch-depth: 1
          persist-credentials: false
          path: servicing

      - name: Stage security-relevant source trees
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          mkdir -p "$OUT/release" "$OUT/servicing" "$OUT/meta"
          printf 'v10.0.10=%s\n' "$(git -C release rev-parse HEAD)" > "$OUT/meta/COMMITS.txt"
          printf 'release/10.0=%s\n' "$(git -C servicing rev-parse HEAD)" >> "$OUT/meta/COMMITS.txt"

          paths=(
            src/Security/Authentication
            src/Servers/Kestrel
            src/Http
            src/Middleware/ResponseCaching
            src/Middleware/OutputCaching
            src/DataProtection
            src/Shared
            src/Grpc
            src/SignalR
            src/Components/Endpoints
            src/Mvc
          )

          for p in "${paths[@]}"; do
            if [[ -d "release/$p" ]]; then
              mkdir -p "$OUT/release/$(dirname "$p")"
              cp -a "release/$p" "$OUT/release/$p"
            fi
            if [[ -d "servicing/$p" ]]; then
              mkdir -p "$OUT/servicing/$(dirname "$p")"
              cp -a "servicing/$p" "$OUT/servicing/$p"
            fi
          done

          find "$OUT" -type d \( -name bin -o -name obj -o -name node_modules \) -prune -exec rm -rf '{}' +
          diff -ruN "$OUT/release" "$OUT/servicing" > "$OUT/meta/RELEASE_TO_SERVICING.diff" || true
          find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/meta/FILE_SIZES.tsv"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$OUT"

      - name: Upload source export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aspnetcore-variant-source-v10.0.10-vs-release-10.0
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
