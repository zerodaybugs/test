name: Temporary Besu Collision-Resistant Research Build V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: besu-collision-resistant-export-v2-20260811
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref == 'ethereum-besu-collision-resistant-build-v2-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Besu release
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Apply collision-resistant address collections and per-instance hash memoization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          abstract = Path('besu/evm/src/main/java/org/hyperledger/besu/evm/worldstate/AbstractWorldUpdater.java')
          text = abstract.read_text(encoding='utf-8')
          text = text.replace(
              'import java.util.concurrent.ConcurrentHashMap;',
              'import java.util.concurrent.ConcurrentHashMap;\n'
              'import java.util.concurrent.ConcurrentSkipListMap;\n'
              'import java.util.concurrent.ConcurrentSkipListSet;',
              1,
          )
          replacements = {
              'protected Map<Address, UpdateTrackingAccount<A>> updatedAccounts = new ConcurrentHashMap<>();':
                  'protected Map<Address, UpdateTrackingAccount<A>> updatedAccounts = new ConcurrentSkipListMap<>();',
              'protected Set<Address> deletedAccounts = Collections.synchronizedSet(new HashSet<>(Address.SIZE));':
                  'protected Set<Address> deletedAccounts = new ConcurrentSkipListSet<>();',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing AbstractWorldUpdater pattern: {old}')
              text = text.replace(old, new, 1)
          abstract.write_text(text, encoding='utf-8')

          accumulator = Path(
              'besu/ethereum/core/src/main/java/org/hyperledger/besu/ethereum/trie/pathbased/common/'
              'worldview/accumulator/PathBasedWorldStateUpdateAccumulator.java'
          )
          text = accumulator.read_text(encoding='utf-8')
          text = text.replace(
              'import java.util.concurrent.ConcurrentHashMap;',
              'import java.util.concurrent.ConcurrentHashMap;\n'
              'import java.util.concurrent.ConcurrentSkipListMap;\n'
              'import java.util.concurrent.ConcurrentSkipListSet;',
              1,
          )
          replacements = {
              'private final Map<Address, PathBasedValue<Bytes>> codeToUpdate = new ConcurrentHashMap<>();':
                  'private final Map<Address, PathBasedValue<Bytes>> codeToUpdate = new ConcurrentSkipListMap<>();',
              'private final Set<Address> storageToClear = Collections.synchronizedSet(new HashSet<>());':
                  'private final Set<Address> storageToClear = new ConcurrentSkipListSet<>();',
              '      storageToUpdate = new ConcurrentHashMap<>();':
                  '      storageToUpdate = new ConcurrentSkipListMap<>();',
              'this.accountsToUpdate = new AccountConsumingMap<>(new ConcurrentHashMap<>(), accountPreloader);':
                  'this.accountsToUpdate = new AccountConsumingMap<>(new ConcurrentSkipListMap<>(), accountPreloader);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing accumulator pattern: {old}')
              text = text.replace(old, new, 1)
          accumulator.write_text(text, encoding='utf-8')

          address = Path('besu/datatypes/src/main/java/org/hyperledger/besu/datatypes/Address.java')
          text = address.read_text(encoding='utf-8')
          for old in (
              'import com.github.benmanes.caffeine.cache.Cache;\n',
              'import com.github.benmanes.caffeine.cache.Caffeine;\n',
          ):
              if old not in text:
                  raise SystemExit(f'missing Address import: {old!r}')
              text = text.replace(old, '', 1)
          old = (
              '  static final Cache<Address, Hash> hashCache =\n'
              '      Caffeine.newBuilder().executor(Runnable::run).maximumSize(4_000).build();\n'
          )
          new = '  private volatile Hash cachedAddressHash;\n'
          if old not in text:
              raise SystemExit('missing Address hashCache declaration')
          text = text.replace(old, new, 1)
          old = (
              '  public Hash addressHash() {\n'
              '    return hashCache.get(this, k -> Hash.hash(k.getBytes()));\n'
              '  }\n'
          )
          new = (
              '  public Hash addressHash() {\n'
              '    Hash cached = cachedAddressHash;\n'
              '    if (cached == null) {\n'
              '      cached = Hash.hash(getBytes());\n'
              '      cachedAddressHash = cached;\n'
              '    }\n'
              '    return cached;\n'
              '  }\n'
          )
          if old not in text:
              raise SystemExit('missing Address.addressHash method')
          text = text.replace(old, new, 1)
          address.write_text(text, encoding='utf-8')
          PY
          git -C besu diff --check
          git -C besu diff > collision-resistant-v2.patch

      - name: Build patched evmtool
        shell: bash
        run: |
          set -euo pipefail
          cd besu
          ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace
          cd ..
          mkdir -p export/meta
          cp -a besu/ethereum/evmtool/build/install/evmtool export/evmtool
          cp collision-resistant-v2.patch export/meta/
          git -C besu rev-parse HEAD > export/meta/besu-commit.txt
          java -version 2> export/meta/java-version.txt
          export/evmtool/bin/evmtool --version > export/meta/evmtool-version.txt
          tar -czf besu-26.7.1-collision-resistant-v2-20260811.tar.gz -C export .
          sha256sum besu-26.7.1-collision-resistant-v2-20260811.tar.gz > besu-26.7.1-collision-resistant-v2-20260811.tar.gz.sha256

      - name: Upload patched research build
        uses: actions/upload-artifact@v4
        with:
          name: besu-26.7.1-collision-resistant-v2-20260811
          path: |
            besu-26.7.1-collision-resistant-v2-20260811.tar.gz
            besu-26.7.1-collision-resistant-v2-20260811.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
