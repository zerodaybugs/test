name: Temporary Besu HashDoS Block Import Reproduction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: besu-hashdos-block-import-20260810
  cancel-in-progress: false

jobs:
  block-import:
    if: github.head_ref == 'ethereum-eip7702-diff-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout private harness
        uses: actions/checkout@v4
        with:
          path: research-repo
          persist-credentials: false

      - name: Checkout exact execution-specs oracle
        uses: actions/checkout@v4
        with:
          repository: ethereum/execution-specs
          ref: 343274cc0f43962ff39a648e2b2614bf227f8d1f
          path: eest
          persist-credentials: false

      - name: Checkout latest Besu release
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Configure uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: eest/uv.lock

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Generate deterministic Osaka blockchain fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/hashdos-block-import"
          mkdir -p "$ROOT/fixtures"
          cp research-repo/research/ethereum/besu_hashdos/test_besu_world_updater_hashdos_block.py \
             eest/tests/osaka/test_besu_world_updater_hashdos_block.py
          cd eest
          uv run --frozen fill tests/osaka/test_besu_world_updater_hashdos_block.py \
            --output="$ROOT/fixtures" --clean --fork Osaka -n 1 --no-html -q
          mapfile -t fixtures < <(find "$ROOT/fixtures/blockchain_tests" -type f -name '*.json' | sort)
          printf 'blockchain_fixture_count=%s\n' "${#fixtures[@]}"
          test "${#fixtures[@]}" -eq 1
          sha256sum "${fixtures[0]}"

      - name: Build Besu evmtool
        shell: bash
        run: |
          set -euo pipefail
          cd besu
          ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace

      - name: Import malicious and control blocks
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$(find "$GITHUB_WORKSPACE/hashdos-block-import/fixtures/blockchain_tests" -type f -name '*.json' | head -1)"
          BIN="$GITHUB_WORKSPACE/besu/ethereum/evmtool/build/install/evmtool/bin/evmtool"
          "$BIN" --version
          for pass in 1 2 3; do
            echo "=== BLOCK-IMPORT PASS $pass ==="
            timeout 600s "$BIN" block-test "$FIXTURE"
          done
