name: Temporary Besu Valid-Block HashDoS Differential Gate

on:
  pull_request:
    branches: [main]
    paths:
      - research/ethereum/besu_worldupdater_hashdos/**
      - .github/workflows/_temporary-besu-validblock-hashdos-20260811.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: besu-validblock-hashdos-20260811
  cancel-in-progress: true

jobs:
  differential:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ethereum-besu-hashdos-valid-block-gate2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout private harness
        uses: actions/checkout@v4
        with:
          path: research-repo
          persist-credentials: false

      - name: Checkout exact execution-specs oracle
        uses: actions/checkout@v4
        with:
          repository: ethereum/execution-specs
          ref: 343274cc0f43962ff39a648e2b2614bf227f8d1f
          path: eest
          persist-credentials: false

      - name: Checkout Geth v1.17.5
        uses: actions/checkout@v4
        with:
          repository: ethereum/go-ethereum
          ref: v1.17.5
          path: geth
          persist-credentials: false

      - name: Checkout Besu 26.7.1
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Checkout Nethermind 1.39.2
        uses: actions/checkout@v4
        with:
          repository: NethermindEth/nethermind
          ref: 1.39.2
          path: nethermind
          persist-credentials: false

      - name: Configure uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: eest/uv.lock

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: true
          cache-dependency-path: geth/go.sum

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: nethermind/global.json

      - name: Build clients, fill exact fixtures, and benchmark
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/research-result"
          BIN="$RUNNER_TEMP/eth-hashdos-bin"
          TEST_DST="eest/tests/prague/eip7702_set_code_tx/test_besu_worldupdater_hashdos.py"
          mkdir -p "$ROOT/fixtures" "$ROOT/logs" "$ROOT/meta" "$BIN"
          cp research-repo/research/ethereum/besu_worldupdater_hashdos/test_besu_worldupdater_hashdos.py "$TEST_DST"

          {
            echo "eest=$(git -C eest rev-parse HEAD)"
            echo "geth=$(git -C geth rev-parse HEAD)"
            echo "besu=$(git -C besu rev-parse HEAD)"
            echo "nethermind=$(git -C nethermind rev-parse HEAD)"
            echo "runner=$(uname -a)"
            echo "uv=$(uv --version)"
            echo "go=$(go version)"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "dotnet=$(dotnet --version)"
          } | tee "$ROOT/meta/environment.txt"

          echo 'phase=build_geth'
          go -C geth build -trimpath -o "$BIN/evm" ./cmd/evm
          echo 'phase=build_besu'
          (cd besu && ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace)
          echo 'phase=build_nethermind'
          dotnet publish \
            nethermind/src/Nethermind/Nethermind.Test.Runner/Nethermind.Test.Runner.csproj \
            -c Release -o "$BIN/nethermind-publish" --nologo

          GETH_BIN="$BIN/evm"
          BESU_BIN="$GITHUB_WORKSPACE/besu/ethereum/evmtool/build/install/evmtool/bin/evmtool"
          cat > "$BIN/nethtest" <<EOF
          #!/bin/sh
          exec dotnet "$BIN/nethermind-publish/nethtest.dll" "\$@"
          EOF
          chmod +x "$BIN/nethtest"
          NETHERMIND_BIN="$BIN/nethtest"

          "$GETH_BIN" --version | head -20 | tee "$ROOT/logs/geth-version.log"
          "$BESU_BIN" --version | head -20 | tee "$ROOT/logs/besu-version.log"
          "$NETHERMIND_BIN" --version | head -20 | tee "$ROOT/logs/nethermind-version.log"

          CASES=(
            worldupdater_control_0500x1
            worldupdater_colliding_0500x1
            worldupdater_control_5200x1
            worldupdater_colliding_5200x1
            worldupdater_control_5200x2
            worldupdater_colliding_5200x2
          )

          for case_id in "${CASES[@]}"; do
            out="$ROOT/fixtures/$case_id"
            mkdir -p "$out"
            echo "phase=fill case=$case_id"
            (cd eest && uv run --frozen fill \
              tests/prague/eip7702_set_code_tx/test_besu_worldupdater_hashdos.py \
              -k "$case_id" --output="$out" --clean --until Osaka -n 1 --no-html -q) \
              2>&1 | tee "$ROOT/logs/fill-$case_id.log"
            count="$(find "$out" -type f -name '*.json' | wc -l)"
            echo "fixture_json_count case=$case_id count=$count"
            test "$count" -gt 0
          done

          printf 'client,case,iteration,seconds,status\n' > "$ROOT/timings.csv"

          run_consumer() {
            client="$1"; bin="$2"; case_id="$3"; iteration="$4"
            fixture="$ROOT/fixtures/$case_id"
            log="$ROOT/logs/${client}-${case_id}-${iteration}.log"
            timefile="$ROOT/logs/${client}-${case_id}-${iteration}.time"
            set +e
            /usr/bin/time -f '%e' -o "$timefile" timeout 900s bash -lc \
              "cd eest && uv run --frozen consume direct --input='$fixture' --bin='$bin' -m blockchain_test -q" \
              >"$log" 2>&1
            rc=$?
            set -e
            seconds="$(cat "$timefile" 2>/dev/null || echo NA)"
            status=PASS
            if [ "$rc" -ne 0 ]; then status="FAIL:$rc"; fi
            printf '%s,%s,%s,%s,%s\n' "$client" "$case_id" "$iteration" "$seconds" "$status" \
              | tee -a "$ROOT/timings.csv"
            if [ "$rc" -ne 0 ]; then
              echo "CONSUMER_FAILURE client=$client case=$case_id rc=$rc"
              tail -200 "$log"
              return "$rc"
            fi
          }

          # Cross-client validity oracle. A test is not security evidence unless
          # all exact releases accept the same fixture.
          for client in geth besu nethermind; do
            case "$client" in
              geth) bin="$GETH_BIN" ;;
              besu) bin="$BESU_BIN" ;;
              nethermind) bin="$NETHERMIND_BIN" ;;
            esac
            run_consumer "$client" "$bin" worldupdater_control_0500x1 1
            run_consumer "$client" "$bin" worldupdater_colliding_0500x1 1
            run_consumer "$client" "$bin" worldupdater_control_5200x1 1
            run_consumer "$client" "$bin" worldupdater_colliding_5200x1 1
            run_consumer "$client" "$bin" worldupdater_control_5200x2 1
            run_consumer "$client" "$bin" worldupdater_colliding_5200x2 1
          done

          # Repeat Besu measurements to reject cold-start noise.
          for iteration in 2 3; do
            for case_id in \
              worldupdater_control_5200x1 \
              worldupdater_colliding_5200x1 \
              worldupdater_control_5200x2 \
              worldupdater_colliding_5200x2; do
              run_consumer besu "$BESU_BIN" "$case_id" "$iteration"
            done
          done

          python3 - "$ROOT/timings.csv" <<'PY'
          import csv, statistics, sys
          from collections import defaultdict

          rows = list(csv.DictReader(open(sys.argv[1], newline="")))
          groups = defaultdict(list)
          for row in rows:
              if row["status"] != "PASS" or row["seconds"] == "NA":
                  continue
              groups[(row["client"], row["case"])].append(float(row["seconds"]))

          print("BESU_VALID_BLOCK_HASHDOS_SUMMARY_V1")
          for key in sorted(groups):
              vals = groups[key]
              print(f"median client={key[0]} case={key[1]} seconds={statistics.median(vals):.6f} n={len(vals)}")

          for suffix in ("5200x1", "5200x2"):
              control = statistics.median(groups[("besu", f"worldupdater_control_{suffix}")])
              collision = statistics.median(groups[("besu", f"worldupdater_colliding_{suffix}")])
              print(
                  f"ratio client=besu case={suffix} control={control:.6f} "
                  f"collision={collision:.6f} ratio={collision/control:.3f}"
              )
          print("VALID_BLOCK_AND_CROSS_CLIENT_ACCEPTANCE=PASS")
          PY

          sha256sum research-repo/research/ethereum/besu_worldupdater_hashdos/test_besu_worldupdater_hashdos.py \
            | tee "$ROOT/meta/SHA256SUMS.txt"

      - name: Upload summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: besu-validblock-hashdos-summary
          path: |
            research-result/timings.csv
            research-result/meta
            research-result/logs/*version.log
            research-result/logs/*.time
          if-no-files-found: warn
          retention-days: 2
