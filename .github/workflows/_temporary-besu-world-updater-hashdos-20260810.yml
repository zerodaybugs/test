name: Temporary Besu World-Updater HashDoS Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: besu-world-updater-hashdos-20260810
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.head_ref == 'ethereum-eip7702-diff-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout private harness
        uses: actions/checkout@v4
        with:
          path: research-repo
          persist-credentials: false

      - name: Checkout Besu 26.7.1
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Install benchmark into Besu test tree
        shell: bash
        run: |
          set -euo pipefail
          cp research-repo/research/ethereum/besu_hashdos/WorldUpdaterHashDosBenchmarkTest.java \
             besu/evm/src/test/java/org/hyperledger/besu/evm/worldstate/WorldUpdaterHashDosBenchmarkTest.java
          sha256sum besu/evm/src/test/java/org/hyperledger/besu/evm/worldstate/WorldUpdaterHashDosBenchmarkTest.java
          git -C besu rev-parse HEAD
          java -version

      - name: Execute benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd besu
          timeout 2100s ./gradlew :evm:test \
            --tests org.hyperledger.besu.evm.worldstate.WorldUpdaterHashDosBenchmarkTest \
            --no-daemon --stacktrace --info
