name: Temporary Besu World-Updater HashDoS Block A-B Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: besu-worldupdater-hashdos-block-ab-rerun-20260810
  cancel-in-progress: false

jobs:
  reproduce:
    if: github.head_ref == 'ethereum-eip7702-diff-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx4g -XX:+UseG1GC
    steps:
      - name: Checkout existing public research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact EELS oracle
        uses: actions/checkout@v4
        with:
          repository: ethereum/execution-specs
          ref: 343274cc0f43962ff39a648e2b2614bf227f8d1f
          path: eest
          persist-credentials: false

      - name: Checkout exact Besu 26.7.1
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Configure uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: eest/uv.lock

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Generate isolated valid Osaka block fixtures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$ROOT/fixtures" "$ROOT/logs" "$ROOT/timing" "$ROOT/meta"
          cp research/ethereum/besu_hashdos/test_besu_world_updater_hashdos_block.py \
             eest/tests/osaka/test_besu_world_updater_hashdos_block.py
          cd eest
          for variant in control colliding; do
            uv run --frozen fill tests/osaka/test_besu_world_updater_hashdos_block.py \
              -k "$variant" --output="$ROOT/fixtures/$variant" --clean \
              --fork Osaka -n 1 --no-html -q
          done
          cd "$GITHUB_WORKSPACE"
          for variant in control colliding; do
            test "$(find "$ROOT/fixtures/$variant/blockchain_tests" -type f -name '*.json' | wc -l)" -eq 1
          done
          {
            echo "harness=$(git rev-parse HEAD)"
            echo "eest=$(git -C eest rev-parse HEAD)"
            echo "besu=$(git -C besu rev-parse HEAD)"
            echo "runner=$(uname -a)"
            echo "java=$(java -version 2>&1 | head -1)"
          } > "$ROOT/meta/environment.txt"
          find "$ROOT/fixtures" -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum \
            > "$ROOT/meta/FIXTURE_SHA256SUMS.txt"

      - name: Build and preserve unpatched Besu
        shell: bash
        run: |
          set -euo pipefail
          cd besu
          ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace
          cp -a ethereum/evmtool/build/install/evmtool "$RUNNER_TEMP/evmtool-unpatched"
          "$RUNNER_TEMP/evmtool-unpatched/bin/evmtool" --version \
            > "$GITHUB_WORKSPACE/evidence/meta/besu-version.txt"

      - name: Run unpatched valid-block measurements
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/evidence"
          BIN="$RUNNER_TEMP/evmtool-unpatched/bin/evmtool"
          for variant in control colliding; do
            fixture="$(find "$ROOT/fixtures/$variant/blockchain_tests" -type f -name '*.json' | head -1)"
            for pass in 1 2 3; do
              name="unpatched_${variant}_${pass}"
              /usr/bin/time -f 'wall_sec=%e\nuser_sec=%U\nsys_sec=%S\nmax_rss_kb=%M\nexit=%x' \
                -o "$ROOT/timing/${name}.txt" \
                timeout 900s "$BIN" block-test "$fixture" \
                > "$ROOT/logs/${name}.log" 2>&1
            done
          done

      - name: Apply collision-resistant address-map patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          abstract = Path('besu/evm/src/main/java/org/hyperledger/besu/evm/worldstate/AbstractWorldUpdater.java')
          text = abstract.read_text(encoding='utf-8')
          text = text.replace(
              'import java.util.concurrent.ConcurrentHashMap;',
              'import java.util.concurrent.ConcurrentHashMap;\nimport java.util.concurrent.ConcurrentSkipListMap;\nimport java.util.concurrent.ConcurrentSkipListSet;',
              1,
          )
          replacements = {
              'protected Map<Address, UpdateTrackingAccount<A>> updatedAccounts = new ConcurrentHashMap<>();':
                  'protected Map<Address, UpdateTrackingAccount<A>> updatedAccounts = new ConcurrentSkipListMap<>();',
              'protected Set<Address> deletedAccounts = Collections.synchronizedSet(new HashSet<>(Address.SIZE));':
                  'protected Set<Address> deletedAccounts = new ConcurrentSkipListSet<>();',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          abstract.write_text(text, encoding='utf-8')

          accumulator = Path(
              'besu/ethereum/core/src/main/java/org/hyperledger/besu/ethereum/trie/pathbased/common/'
              'worldview/accumulator/PathBasedWorldStateUpdateAccumulator.java'
          )
          text = accumulator.read_text(encoding='utf-8')
          text = text.replace(
              'import java.util.concurrent.ConcurrentHashMap;',
              'import java.util.concurrent.ConcurrentHashMap;\nimport java.util.concurrent.ConcurrentSkipListMap;\nimport java.util.concurrent.ConcurrentSkipListSet;',
              1,
          )
          replacements = {
              'private final Map<Address, PathBasedValue<Bytes>> codeToUpdate = new ConcurrentHashMap<>();':
                  'private final Map<Address, PathBasedValue<Bytes>> codeToUpdate = new ConcurrentSkipListMap<>();',
              'private final Set<Address> storageToClear = Collections.synchronizedSet(new HashSet<>());':
                  'private final Set<Address> storageToClear = new ConcurrentSkipListSet<>();',
              '      storageToUpdate = new ConcurrentHashMap<>();':
                  '      storageToUpdate = new ConcurrentSkipListMap<>();',
              'this.accountsToUpdate = new AccountConsumingMap<>(new ConcurrentHashMap<>(), accountPreloader);':
                  'this.accountsToUpdate = new AccountConsumingMap<>(new ConcurrentSkipListMap<>(), accountPreloader);',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          accumulator.write_text(text, encoding='utf-8')
          PY
          git -C besu diff --check
          git -C besu diff > "$GITHUB_WORKSPACE/evidence/meta/collision-resistant.patch"

      - name: Build patched Besu
        shell: bash
        run: |
          set -euo pipefail
          cd besu
          ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace --rerun-tasks
          cp -a ethereum/evmtool/build/install/evmtool "$RUNNER_TEMP/evmtool-patched"

      - name: Run patched valid-block measurements
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/evidence"
          BIN="$RUNNER_TEMP/evmtool-patched/bin/evmtool"
          for variant in control colliding; do
            fixture="$(find "$ROOT/fixtures/$variant/blockchain_tests" -type f -name '*.json' | head -1)"
            for pass in 1 2 3; do
              name="patched_${variant}_${pass}"
              /usr/bin/time -f 'wall_sec=%e\nuser_sec=%U\nsys_sec=%S\nmax_rss_kb=%M\nexit=%x' \
                -o "$ROOT/timing/${name}.txt" \
                timeout 900s "$BIN" block-test "$fixture" \
                > "$ROOT/logs/${name}.log" 2>&1
            done
          done

      - name: Build machine verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          root = Path('evidence')
          rows = []
          for path in sorted((root / 'timing').glob('*.txt')):
              vals = {}
              for line in path.read_text().splitlines():
                  key, value = line.split('=', 1)
                  vals[key] = int(value) if key == 'exit' else float(value)
              phase, variant, run = path.stem.split('_')
              rows.append({'phase': phase, 'variant': variant, 'run': int(run), **vals})
          assert len(rows) == 12, len(rows)
          assert all(row['exit'] == 0 for row in rows)
          def median(phase, variant):
              return statistics.median(
                  row['wall_sec'] for row in rows
                  if row['phase'] == phase and row['variant'] == variant
              )
          uc, ua = median('unpatched', 'control'), median('unpatched', 'colliding')
          pc, pa = median('patched', 'control'), median('patched', 'colliding')
          metrics = {
              'unpatched_control_median_sec': uc,
              'unpatched_colliding_median_sec': ua,
              'unpatched_ratio': ua / max(uc, 1e-9),
              'patched_control_median_sec': pc,
              'patched_colliding_median_sec': pa,
              'patched_ratio': pa / max(pc, 1e-9),
              'patch_attack_reduction_fraction': 1 - pa / max(ua, 1e-9),
          }
          proven = (
              metrics['unpatched_ratio'] >= 5.0
              and ua >= 2.0
              and metrics['patch_attack_reduction_fraction'] >= 0.60
              and metrics['patched_ratio'] <= 2.5
          )
          verdict = {
              'schema': 'besu-worldupdater-hashdos-block-ab-v1',
              'besu_commit': '49026aaf059f832a93f964d8d27191de2f0580e9',
              'fork': 'Osaka',
              'transaction_count': 1,
              'gas_limit': 16700000,
              'address_count': 5000,
              'calldata_bytes': 100000,
              'metrics': metrics,
              'technical_valid_block_dos_reproduction_proven': proven,
              'submission_status': 'HOLD_NEEDS_CROSS_CLIENT_SCOPE_DUPLICATE_GATE' if proven else 'KILL_NOT_REPRODUCED',
              'rows': rows,
          }
          (root / 'VERDICT.json').write_text(json.dumps(verdict, indent=2) + '\n')
          print(json.dumps(verdict, indent=2))
          PY
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: besu-worldupdater-hashdos-block-ab-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 1
