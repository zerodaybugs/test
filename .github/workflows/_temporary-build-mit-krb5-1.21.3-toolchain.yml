name: Temporary build MIT Kerberos 1.21.3 toolchain

on:
  push:
    branches:
      - agent/build-mit-krb5-1-21-3-toolchain-20260818
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file pkg-config \
            libssl-dev liblmdb-dev libverto-dev libedit-dev \
            bison flex zstd

      - name: Download and verify official MIT source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://web.mit.edu/kerberos/dist/krb5/1.21/krb5-1.21.3.tar.gz \
            -o krb5-1.21.3.tar.gz
          echo 'beb34d1dfc72ba0571ce72bed03e06eb  krb5-1.21.3.tar.gz' | md5sum --check
          sha256sum krb5-1.21.3.tar.gz | tee source.sha256
          tar -xzf krb5-1.21.3.tar.gz

      - name: Build and install
        shell: bash
        run: |
          set -euo pipefail
          prefix="$PWD/install"
          cd krb5-1.21.3/src
          ./configure \
            --prefix="$prefix" \
            --without-system-verto \
            --disable-rpath \
            --with-crypto-impl=openssl
          make -j"$(nproc)"
          make install
          "$prefix/sbin/krb5kdc" -V 2>&1 | tee "$GITHUB_WORKSPACE/krb5kdc-version.txt" || true
          "$prefix/bin/kinit" --version 2>&1 | tee "$GITHUB_WORKSPACE/kinit-version.txt" || true
          test -x "$prefix/sbin/krb5kdc"
          test -x "$prefix/sbin/kadmin.local"
          test -x "$prefix/sbin/kdb5_util"
          test -x "$prefix/bin/kinit"
          test -x "$prefix/bin/klist"
          test -x "$prefix/bin/ktutil"

      - name: Package relocatable build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp source.sha256 krb5kdc-version.txt kinit-version.txt artifact/
          printf '%s\n' 'MIT Kerberos 1.21.3 official source build' > artifact/PROVENANCE.txt
          printf '%s\n' 'https://web.mit.edu/kerberos/dist/krb5/1.21/krb5-1.21.3.tar.gz' >> artifact/PROVENANCE.txt
          tar -C install -I 'zstd -19 -T0' -cf artifact/mit-krb5-1.21.3-ubuntu-x64.tar.zst .
          sha256sum artifact/* > artifact/SHA256SUMS.txt
          find install -type f -print0 | sort -z | xargs -0 sha256sum > artifact/INSTALL_TREE_SHA256SUMS.txt
          du -h artifact/* | tee artifact/SIZES.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mit-krb5-1.21.3-ubuntu-x64-toolchain
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
