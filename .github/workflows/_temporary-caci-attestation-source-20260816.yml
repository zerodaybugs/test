name: Temporary C-ACI attestation source export

on:
  push:
    branches:
      - hcsshim-source-c4bdd-20260816
    paths:
      - '.github/workflows/_temporary-caci-attestation-source-20260816.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone current Microsoft sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags https://github.com/microsoft/TEE-Attestation-Verification.git tee-verifier
          git clone --filter=blob:none --no-tags https://github.com/microsoft/confidential-aci-examples.git caci-examples
          git -C tee-verifier rev-parse HEAD | tee TEE_VERIFIER_COMMIT.txt
          git -C caci-examples rev-parse HEAD | tee CACI_EXAMPLES_COMMIT.txt
          rm -rf tee-verifier/.git caci-examples/.git
          tar -czf caci-attestation-sources.tar.gz tee-verifier caci-examples TEE_VERIFIER_COMMIT.txt CACI_EXAMPLES_COMMIT.txt

      - name: Build source index
        shell: bash
        run: |
          set -euo pipefail
          rg -n -i 'minimum[_ -]?svn|guestsvn|host[_ -]?data|policy|issuer|feed|cose|attestation' tee-verifier caci-examples > SOURCE_INDEX.txt || true
          sha256sum caci-attestation-sources.tar.gz SOURCE_INDEX.txt TEE_VERIFIER_COMMIT.txt CACI_EXAMPLES_COMMIT.txt > SHA256SUMS.txt

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: caci-attestation-sources
          path: |
            caci-attestation-sources.tar.gz
            SOURCE_INDEX.txt
            TEE_VERIFIER_COMMIT.txt
            CACI_EXAMPLES_COMMIT.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
