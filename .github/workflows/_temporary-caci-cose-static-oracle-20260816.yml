name: Temporary C-ACI COSE static oracle

on:
  push:
    branches:
      - hcsshim-source-c4bdd-20260816
    paths:
      - '.github/workflows/_temporary-caci-cose-static-oracle-20260816.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect exact Microsoft source
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags https://github.com/microsoft/hcsshim.git repo
          git -C repo checkout c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8
          python3 - <<'PY'
          from pathlib import Path
          import re, json, os
          root=Path('repo')
          p=root/'pkg/securitypolicy/securitypolicyenforcer_rego.go'
          t=p.read_text()
          selectors=sorted(set(re.findall(r'\bcosesign1\.([A-Za-z_][A-Za-z0-9_]*)',t)))
          parsed=[]
          for f in (root/'vendor/github.com/Microsoft/cosesign1go').rglob('*.go'):
              s=f.read_text(errors='ignore')
              for m in re.finditer(r'(?m)^type\s+([A-Za-z0-9_]*Parsed[A-Za-z0-9_]*)\s+(.+)$',s):
                  parsed.append({'file':str(f.relative_to(root)),'name':m.group(1),'decl':m.group(2).strip()})
          # Extract LoadFragment body with a brace scanner.
          sig=re.search(r'func\s+\([^)]*\)\s+LoadFragment\s*\([^)]*\)\s*(?:\([^)]*\)|[^\{]*)\{',t)
          if not sig:
              raise SystemExit('LoadFragment not found')
          start=t.find('{',sig.start()); depth=0; end=None
          for i,ch in enumerate(t[start:],start):
              if ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          body=t[sig.start():end]
          facts={
            'selectors':selectors,
            'parsed_types':parsed,
            'has_protected':bool(re.search(r'Protected',body,re.I)),
            'has_unprotected':bool(re.search(r'Unprotected',body,re.I)),
            'issuer_mentions':len(re.findall(r'issuer',body,re.I)),
            'feed_mentions':len(re.findall(r'feed',body,re.I)),
            'svn_mentions':len(re.findall(r'svn',body,re.I)),
            'body':body,
          }
          Path('STATIC_FACTS.json').write_text(json.dumps(facts,indent=2))
          Path('LOAD_FRAGMENT.txt').write_text(body)
          selector='-'.join(selectors) if selectors else 'NONE'
          selector=re.sub(r'[^A-Za-z0-9_.-]+','_',selector)[:80]
          parsed_names='-'.join(x['name'] for x in parsed) if parsed else 'NONE'
          parsed_names=re.sub(r'[^A-Za-z0-9_.-]+','_',parsed_names)[:100]
          mode=('P' if facts['has_protected'] else 'N')+('U' if facts['has_unprotected'] else 'N')
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write(f'selector={selector}\n')
              fh.write(f'parsed={parsed_names}\n')
              fh.write(f'mode={mode}\n')
          PY
          sha256sum STATIC_FACTS.json LOAD_FRAGMENT.txt > SHA256SUMS.txt

      - name: Upload static oracle
        uses: actions/upload-artifact@v4
        with:
          name: caci-static-${{ steps.inspect.outputs.selector }}-${{ steps.inspect.outputs.parsed }}-${{ steps.inspect.outputs.mode }}
          path: |
            STATIC_FACTS.json
            LOAD_FRAGMENT.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
