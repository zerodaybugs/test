name: Temporary Cap Access-Control Scan V6

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-access-scan-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Scan live selectors against AccessControl
        shell: bash
        run: |
          set -u
          RPC='https://ethereum-rpc.publicnode.com'
          ACCESS='0x7731129a10d51e18cDE607C5C115F26503D2c683'
          ATTACKER='0x000000000000000000000000000000000000dEaD'
          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          OUTDIR='cap-access-scan-v6'
          mkdir -p "$OUTDIR"
          OUT="$OUTDIR/access-scan.tsv"
          TRUEOUT="$OUTDIR/random-attacker-true.tsv"
          ROLEOUT="$OUTDIR/upgrade-role-members.tsv"
          printf 'name\ttarget\timplementation\tselector\trandom_attacker_access\traw\n' > "$OUT"
          printf 'name\ttarget\timplementation\tselector\traw\n' > "$TRUEOUT"
          printf 'name\ttarget\trole\tmember_count\tmembers\n' > "$ROLEOUT"

          targets=(
            'AccessControl:0x7731129a10d51e18cDE607C5C115F26503D2c683'
            'Delegation:0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F'
            'Lender:0x15622c3dbbc5614E6DFa9446603c1779647f01FC'
            'Oracle:0xcD7f45566bc0E7303fB92A93969BB4D3f6e662bb'
            'cUSD:0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
            'stcUSD:0x88887bE419578051FF9F4eb6C858A951921D8888'
            'FeeAuction:0xa1a20aBdc873CF291c22Ce3C8968EC06277324D0'
            'FeeReceiver:0x0036c7b9b62c53F47c804a5643F0c09f864beF0b'
            'OldHarvester:0x1388B2dc1Fe408741E48145F87Fd79f01bca7e16'
            'ConfiguredHarvester:0xb90dE8357ee4f5c145c159f8e3822bA9b17BE4F1'
            'CapSweeper:0x51da1eC8dC52F146e644F5F759D399038CCf7aB4'
            'Wrapper:0x434558CB1EBe9950e8A66f1ef8A15A473Dce7D8c'
            'SymbioticNetwork:0x98e52Ea7578F2088c152E81b17A9a459bF089f2a'
            'SymbioticMiddleware:0x09A3976d8D63728d20DCDFEe1e531C206Ba91225'
            'SymbioticAgentManager:0x08A728CF4E6b39f4AFa059c6eE376103722953eA'
            'EigenServiceManager:0xE65c3eccd18879E103dBC96D854e376Ced4cC7dd'
            'EigenAgentManagerConfig:0xa82f6f9E67E127621F3e5F3953bEEf926b4B5bA9'
            'EigenAgentManagerLegacy:0x42ECa90444EB3aD14bDcA6D8821c48F887A7F839'
            'CapOFTLockbox:0xA62571EbdFfAbC3051a2e5B9e1f57b23D830c8Fd'
            'StakedCapOFTLockbox:0x983AEAaA0d0426839158435C43725EA7F45d4137'
          )

          for item in "${targets[@]}"; do
            name=${item%%:*}
            target=${item##*:}
            implword=$(cast storage --rpc-url "$RPC" "$target" "$IMPL_SLOT" 2>/dev/null || echo 0x0)
            impl="0x${implword:26}"
            if [[ ! "$impl" =~ ^0x[0-9a-fA-F]{40}$ ]] || [[ "${impl,,}" == '0x0000000000000000000000000000000000000000' ]]; then
              impl="$target"
            fi
            code=$(cast code --rpc-url "$RPC" "$impl" 2>/dev/null || echo 0x)
            mapfile -t selectors < <(cast selectors "$code" 2>/dev/null | awk '{print $1}' | grep -E '^0x[0-9a-fA-F]{8}$' | sort -u || true)
            selectors+=(0x00000000)
            for sel in "${selectors[@]}"; do
              set +e
              raw=$(cast call --rpc-url "$RPC" "$ACCESS" 'checkAccess(bytes4,address,address)(bool)' "$sel" "$target" "$ATTACKER" 2>&1)
              rc=$?
              set -e
              raw_one=$(echo "$raw" | tr '\n\t' '  ' | sed 's/  */ /g')
              if [ "$rc" -eq 0 ] && echo "$raw_one" | grep -Eq '(^| )true( |$)'; then
                status=true
                printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$target" "$impl" "$sel" "$raw_one" >> "$TRUEOUT"
              else
                status=false
              fi
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$target" "$impl" "$sel" "$status" "$raw_one" >> "$OUT"
            done

            role=$(cast call --rpc-url "$RPC" "$ACCESS" 'role(bytes4,address)(bytes32)' 0x00000000 "$target" 2>/dev/null | tr -d '[:space:]' || true)
            count=$(cast call --rpc-url "$RPC" "$ACCESS" 'getRoleMemberCount(bytes32)(uint256)' "$role" 2>/dev/null | awk '{print $1}' || echo 0)
            members=''
            if [[ "$count" =~ ^[0-9]+$ ]] && [ "$count" -le 20 ]; then
              for ((i=0; i<count; i++)); do
                m=$(cast call --rpc-url "$RPC" "$ACCESS" 'getRoleMember(bytes32,uint256)(address)' "$role" "$i" 2>/dev/null | tr -d '[:space:]' || true)
                members="${members}${m},"
              done
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$target" "$role" "$count" "$members" >> "$ROLEOUT"
          done

          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "block=$(cast block-number --rpc-url "$RPC")"
            echo "targets=${#targets[@]}"
            echo "selector_rows=$(($(wc -l < "$OUT") - 1))"
            echo "random_true_rows=$(($(wc -l < "$TRUEOUT") - 1))"
          } > "$OUTDIR/SUMMARY.txt"
          sha256sum "$OUTDIR"/* > "$OUTDIR/SHA256SUMS"
          cat "$OUTDIR/SUMMARY.txt"
          cat "$TRUEOUT"
          cat "$ROLEOUT"

      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: cap-access-scan-v6-20260811
          path: cap-access-scan-v6
          if-no-files-found: error
          retention-days: 1
