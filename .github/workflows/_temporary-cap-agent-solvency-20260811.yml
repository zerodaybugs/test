name: Sealed compatibility validation

on:
  push:
    branches:
      - ci-public-runner-probe-20260813
    paths:
      - ".github/workflows/_temporary-cap-agent-solvency-20260811.yml"

permissions:
  contents: read

env:
  CACHE_KEY: runner-envelope-7b2836017bf5ff344d1567a52d5f51f4045cef402e53b1ce5d0a7cd70fa428ae
  BLOB_SHA: f95b0be950ff24df0cacca9630f3816094cecc67

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore sealed runner key
        uses: actions/cache/restore@v4
        with:
          path: .runner-envelope
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"
      - name: Fetch sealed execution envelope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/envelope"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$BLOB_SHA" \
            > "$RUNNER_TEMP/envelope/blob.json"
          jq -r '.content' "$RUNNER_TEMP/envelope/blob.json" | tr -d '\n' | \
            base64 --decode > "$RUNNER_TEMP/envelope/bundle.tar.gz"
          tar -xzf "$RUNNER_TEMP/envelope/bundle.tar.gz" \
            -C "$RUNNER_TEMP/envelope"
          (cd "$RUNNER_TEMP/envelope" && sha256sum -c BUNDLE_SHA256SUMS.txt) \
            > /dev/null
      - name: Execute sealed validation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$RUNNER_TEMP/envelope/runner.sh" \
            > "$RUNNER_TEMP/runner-infrastructure.log" 2>&1
      - name: Upload sealed result
        uses: actions/upload-artifact@v4
        with:
          name: sealed-validation-result
          path: sealed-output
          if-no-files-found: error
          retention-days: 1
