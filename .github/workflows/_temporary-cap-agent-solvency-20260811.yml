name: Sealed runner key exchange

on:
  push:
    branches:
      - ci-public-runner-probe-20260813
    paths:
      - ".github/workflows/_temporary-cap-agent-solvency-20260811.yml"

permissions:
  contents: read

env:
  KEY_DIR: .runner-envelope
  EXPORT_DIR: runner-key-exchange

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate one-use runner key
        id: keygen
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$KEY_DIR" "$EXPORT_DIR"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$KEY_DIR/private.pem" 2>/dev/null
          openssl pkey -in "$KEY_DIR/private.pem" -pubout \
            -out "$EXPORT_DIR/public.pem" 2>/dev/null
          cache_key="runner-envelope-$(openssl rand -hex 32)"
          printf 'cache_key=%s\n' "$cache_key" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$cache_key" > "$EXPORT_DIR/cache_key.txt"
          sha256sum "$EXPORT_DIR/public.pem" > "$EXPORT_DIR/public.pem.sha256"
      - name: Seal private key in runner cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KEY_DIR }}
          key: ${{ steps.keygen.outputs.cache_key }}
      - name: Export public exchange material
        uses: actions/upload-artifact@v4
        with:
          name: runner-key-exchange
          path: ${{ env.EXPORT_DIR }}
          if-no-files-found: error
          retention-days: 1
