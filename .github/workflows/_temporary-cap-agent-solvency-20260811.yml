name: Temporary Cap Public Agent Solvency Inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-agent-solvency-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read-only agent solvency inventory
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://ethereum-rpc.publicnode.com'
          OUTDIR='cap-agent-solvency-20260811'
          OUT="$OUTDIR/state.txt"
          mkdir -p "$OUTDIR"

          LENDER='0x15622c3dbbc5614E6DFa9446603c1779647f01FC'
          DELEGATION='0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F'
          USDC='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          WTGXX='0x434558CB1EBe9950e8A66f1ef8A15A473Dce7D8c'
          CALLER='0x000000000000000000000000000000000000dEaD'

          call() {
            local label="$1"; shift
            printf '%s=' "$label" >> "$OUT"
            (cast call --rpc-url "$RPC" "$@" 2>&1 || true) | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' >> "$OUT"
            echo >> "$OUT"
          }

          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "block=$(cast block-number --rpc-url "$RPC")"
            echo "grace=$(cast call --rpc-url "$RPC" "$LENDER" 'grace()(uint256)')"
            echo "expiry=$(cast call --rpc-url "$RPC" "$LENDER" 'expiry()(uint256)')"
            echo "epochDuration=$(cast call --rpc-url "$RPC" "$DELEGATION" 'epochDuration()(uint256)')"
          } > "$OUT"

          agents_raw=$(cast call --rpc-url "$RPC" "$DELEGATION" 'agents()(address[])')
          mapfile -t agents < <(printf '%s' "$agents_raw" | grep -oE '0x[0-9a-fA-F]{40}')
          for a in "${agents[@]}"; do
            echo "--- agent=$a" >> "$OUT"
            call network "$DELEGATION" 'networks(address)(address)' "$a"
            call collateral "$DELEGATION" 'collateral(address)(address)' "$a"
            call coverage "$DELEGATION" 'coverage(address)(uint256)' "$a"
            call slashable "$DELEGATION" 'slashableCollateral(address)(uint256)' "$a"
            call coverageCap "$DELEGATION" 'coverageCap(address)(uint256)' "$a"
            call ltv "$DELEGATION" 'ltv(address)(uint256)' "$a"
            call liquidationThreshold "$DELEGATION" 'liquidationThreshold(address)(uint256)' "$a"
            call slashTimestamp "$DELEGATION" 'slashTimestamp(address)(uint48)' "$a"
            call agentState "$LENDER" 'agent(address)(uint256,uint256,uint256,uint256,uint256,uint256)' "$a"
            call liquidationStart "$LENDER" 'liquidationStart(address)(uint256)' "$a"
            call debtUSDC "$LENDER" 'debt(address,address)(uint256)' "$a" "$USDC"
            call debtWTGXX "$LENDER" 'debt(address,address)(uint256)' "$a" "$WTGXX"
            call maxLiquidatableUSDC "$LENDER" 'maxLiquidatable(address,address)(uint256)' "$a" "$USDC"
            call maxLiquidatableWTGXX "$LENDER" 'maxLiquidatable(address,address)(uint256)' "$a" "$WTGXX"
            call openLiquidationEthCall --from "$CALLER" "$LENDER" 'openLiquidation(address)' "$a"
          done

          sha256sum "$OUT" > "$OUTDIR/SHA256SUMS"
          cat "$OUT"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: cap-agent-solvency-20260811
          path: cap-agent-solvency-20260811
          if-no-files-found: error
          retention-days: 1
