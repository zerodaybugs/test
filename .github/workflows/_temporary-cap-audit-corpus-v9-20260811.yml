name: Temporary Cap Public Audit Corpus V9

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-audit-corpus-v9-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  extract:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download, render, and extract public audits
        shell: bash
        run: |
          set -euo pipefail
          OUT='cap-audit-corpus-v9'
          mkdir -p "$OUT/pdfs" "$OUT/text" "$OUT/renders"
          base='https://raw.githubusercontent.com/cap-labs-dev/cap-audits/main'
          declare -A files=(
            [certora-eigen]='2025-09-15-Certora%20(EigenAVS).pdf'
            [sherlock]='2025-09-03-Sherlock.pdf'
            [spearbit-pr]='2025-11-27-Spearbit%20(PR%20Review).pdf'
            [octane]='2026-03-24-Octane.pdf'
          )
          for name in "${!files[@]}"; do
            curl -fsSL "$base/${files[$name]}" -o "$OUT/pdfs/$name.pdf"
            pdfinfo "$OUT/pdfs/$name.pdf" > "$OUT/text/$name.info.txt"
            pdftotext -layout "$OUT/pdfs/$name.pdf" "$OUT/text/$name.txt"
            pdftoppm -f 1 -singlefile -png -r 130 "$OUT/pdfs/$name.pdf" "$OUT/renders/$name-page-1" >/dev/null 2>&1
          done
          {
            echo '# Exact-term scan'
            grep -RniE 'StartTimestampTooFarInPast|MAX_RETROACTIVE_LENGTH|retroactive|lastDistributionEpoch|createdAtEpoch|startTimestamp|reward.{0,20}submission|distribution epoch' "$OUT/text" || true
          } > "$OUT/TERM_SCAN.txt"
          sha256sum "$OUT"/pdfs/* "$OUT"/text/* "$OUT"/renders/* "$OUT/TERM_SCAN.txt" > "$OUT/SHA256SUMS"
          cat "$OUT/TERM_SCAN.txt"

      - name: Upload public audit corpus
        uses: actions/upload-artifact@v4
        with:
          name: cap-audit-corpus-v9-20260811
          path: cap-audit-corpus-v9
          if-no-files-found: error
          retention-days: 1
