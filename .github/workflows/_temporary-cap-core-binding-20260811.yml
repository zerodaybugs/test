name: Temporary Cap Core Production Binding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-core-binding-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  binding:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact public Cap source
        uses: actions/checkout@v4
        with:
          repository: cap-labs-dev/cap-contracts
          ref: 695c8280b410bce1b43c9254cb214be30fe51dde
          path: cap-contracts
          submodules: recursive
          persist-credentials: false

      - name: Configure Node and Foundry
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
          cache-dependency-path: cap-contracts/yarn.lock

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build exact source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd cap-contracts
          yarn install --frozen-lockfile
          forge build --force

      - name: Compare deployed implementations to exact source
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://ethereum-rpc.publicnode.com'
          mkdir -p result/source result/onchain result/meta
          cd cap-contracts

          python3 - "$RPC" <<'PY'
          import hashlib, json, pathlib, subprocess, sys

          rpc = sys.argv[1]
          out = pathlib.Path('../result')
          impl_slot = '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          targets = {
              'EigenServiceManager': {
                  'proxy': '0xE65c3eccd18879E103dBC96D854e376Ced4cC7dd',
                  'expected_impl': '0xf2ded7286C54a5Ca077Df40c0C21c5a555885Ca1',
                  'contract': 'contracts/delegation/providers/eigenlayer/EigenServiceManager.sol:EigenServiceManager',
              },
              'Delegation': {
                  'proxy': '0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F',
                  'expected_impl': '0x7e2D738042376BF48bEbC49932869eAC3d7E38b5',
                  'contract': 'contracts/delegation/Delegation.sol:Delegation',
              },
              'Lender': {
                  'proxy': '0x15622c3dbbc5614E6DFa9446603c1779647f01FC',
                  'expected_impl': '0x68c4F03b8640C0393a832987147BaE7A0b27aaa7',
                  'contract': 'contracts/lendingPool/Lender.sol:Lender',
              },
          }

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          def strip_metadata(hexcode):
              h = hexcode[2:] if hexcode.startswith('0x') else hexcode
              if len(h) < 4:
                  return h
              try:
                  n = int(h[-4:], 16)
              except ValueError:
                  return h
              cut = (n + 2) * 2
              return h[:-cut] if 0 < cut <= len(h) else h

          result = {'cap_commit': run('git', 'rev-parse', 'HEAD'), 'targets': {}}
          for name, t in targets.items():
              word = run('cast', 'storage', '--rpc-url', rpc, t['proxy'], impl_slot)
              impl = '0x' + word[-40:]
              onchain = run('cast', 'code', '--rpc-url', rpc, impl)
              local = run('forge', 'inspect', t['contract'], 'deployedBytecode')
              on_stripped = strip_metadata(onchain)
              local_stripped = strip_metadata(local)
              data = {
                  'proxy': t['proxy'],
                  'implementation_from_slot': impl,
                  'expected_implementation': t['expected_impl'],
                  'implementation_address_match': impl.lower() == t['expected_impl'].lower(),
                  'onchain_bytes': len(onchain[2:]) // 2,
                  'local_bytes': len(local[2:]) // 2,
                  'raw_runtime_match': onchain.lower() == local.lower(),
                  'stripped_runtime_match': on_stripped.lower() == local_stripped.lower(),
                  'onchain_stripped_sha256': hashlib.sha256(bytes.fromhex(on_stripped)).hexdigest(),
                  'local_stripped_sha256': hashlib.sha256(bytes.fromhex(local_stripped)).hexdigest(),
              }
              result['targets'][name] = data
              (out / 'onchain' / f'{name}.runtime.hex').write_text(onchain + '\n')
              (out / 'source' / f'{name}.deployedBytecode.hex').write_text(local + '\n')

          eigen = targets['EigenServiceManager']['proxy']
          delegation = targets['Delegation']['proxy']
          lender = targets['Lender']['proxy']
          access = '0x7731129a10d51e18cDE607C5C115F26503D2c683'
          usdc = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          result['epochs_between_distributions'] = run('cast','call','--rpc-url',rpc,eigen,'epochsBetweenDistributions()(uint32)').split()[0]
          result['calculation_interval_seconds'] = run('cast','call','--rpc-url',rpc,eigen,'calculationIntervalSeconds()(uint256)').split()[0]
          result['delegation_authorized_for_eigen_distribution'] = run(
              'cast','call','--rpc-url',rpc,access,'checkAccess(bytes4,address,address)(bool)',
              '0x3d11c00d',eigen,delegation
          )
          agents_raw = run('cast','call','--rpc-url',rpc,delegation,'agents()(address[])')
          import re
          agents = re.findall(r'0x[0-9A-Fa-f]{40}', agents_raw)
          eigen_agents = []
          for agent in agents:
              network = run('cast','call','--rpc-url',rpc,delegation,'networks(address)(address)',agent).split()[0]
              if network.lower() != eigen.lower():
                  continue
              debt = run('cast','call','--rpc-url',rpc,lender,'debt(address,address)(uint256)',agent,usdc).split()[0]
              eigen_agents.append({'agent': agent, 'network': network, 'usdc_debt': debt})
          result['eigen_agents'] = eigen_agents
          result['positive_debt_eigen_agents'] = [x for x in eigen_agents if int(x['usdc_debt']) > 0]
          (out / 'binding.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

          cp config/cap-eigen.json ../result/source/
          cp config/cap-infra.json ../result/source/
          cp contracts/delegation/providers/eigenlayer/EigenServiceManager.sol ../result/source/
          cp contracts/delegation/Delegation.sol ../result/source/
          cp contracts/lendingPool/Lender.sol ../result/source/
          cp contracts/lendingPool/libraries/BorrowLogic.sol ../result/source/
          cp contracts/lendingPool/libraries/LiquidationLogic.sol ../result/source/
          sha256sum ../result/source/* ../result/onchain/* ../result/binding.json > ../result/SHA256SUMS

      - name: Upload binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: cap-core-production-binding-20260811
          path: result
          if-no-files-found: error
          retention-days: 1
