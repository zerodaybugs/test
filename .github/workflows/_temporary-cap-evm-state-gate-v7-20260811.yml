name: Temporary Cap EVM State Gate V7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-evm-state-gate-v7-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  state-gate:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run read-only local-fork state gate
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://ethereum-rpc.publicnode.com'
          LOCAL='http://127.0.0.1:8545'
          OUTDIR='cap-evm-state-gate-v7'
          OUT="$OUTDIR/result.txt"
          mkdir -p "$OUTDIR"

          EIGEN='0xE65c3eccd18879E103dBC96D854e376Ced4cC7dd'
          DELEGATION='0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F'
          USDC='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          NS='0x9813e4033b5f31d05a061ad9d06fb8352756b0443d3cc09baeca467c0811ef00'
          AGENTS=(
            '0x5f33ff3027c4763D36e6f4F7C20eE72F700A5D34'
            '0x89Ffc736225bbfaA18aC20a846203CDbe7cC67D6'
            '0x69A6Af78fc45F654A1b5feEbC22c1fee88Df8a8F'
            '0x00b6aCF0FD8d742a0DbE75048dEa85cBf5Cb2eFE'
            '0x4d7B27e0f5D85e41870FE7E680c347bc943231aF'
          )

          addhex() {
            python3 - "$1" "$2" <<'PY'
          import sys
          print(hex(int(sys.argv[1], 16) + int(sys.argv[2], 0)))
          PY
          }
          dec() { cast to-dec "$1" | awk '{print $1}'; }
          word() {
            python3 - "$1" <<'PY'
          import sys
          print('0x' + int(sys.argv[1], 0).to_bytes(32, 'big').hex())
          PY
          }

          anvil --fork-url "$RPC" --port 8545 --silent > "$OUTDIR/anvil.log" 2>&1 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if cast block-number --rpc-url "$LOCAL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          cast block-number --rpc-url "$LOCAL" >/dev/null

          BLOCK=$(cast block-number --rpc-url "$LOCAL" | awk '{print $1}')
          TS_RAW=$(cast block latest --rpc-url "$LOCAL" --json | jq -r '.timestamp')
          if [[ "$TS_RAW" == 0x* ]]; then TS=$(cast to-dec "$TS_RAW" | awk '{print $1}'); else TS="$TS_RAW"; fi
          mapfile -t EA < <(cast call --rpc-url "$LOCAL" "$EIGEN" 'eigenAddresses()((address,address,address,address))' | grep -oE '0x[0-9a-fA-F]{40}')
          RC=${EA[3]}
          INTERVAL=$(cast call --rpc-url "$LOCAL" "$RC" 'CALCULATION_INTERVAL_SECONDS()(uint32)' | awk '{print $1}')
          MAXRETRO=$(cast call --rpc-url "$LOCAL" "$RC" 'MAX_RETROACTIVE_LENGTH()(uint32)' | awk '{print $1}')
          MAXDURATION=$(cast call --rpc-url "$LOCAL" "$RC" 'MAX_REWARDS_DURATION()(uint32)' | awk '{print $1}')
          CURRENT_EPOCH=$((TS / INTERVAL))
          MAX_RETRO_EPOCHS=$((MAXRETRO / INTERVAL))

          PENDING_SLOT=$(addhex "$NS" 8)
          OPERATORS_SLOT=$(addhex "$NS" 9)
          GLOBAL_SLOT=$(cast index address "$USDC" "$PENDING_SLOT")
          GLOBAL_PENDING=$(dec "$(cast storage --rpc-url "$LOCAL" "$EIGEN" "$GLOBAL_SLOT")")

          SENTINEL=987654321
          SENTINEL_WORD=$(word "$SENTINEL")
          USDC_BALANCE_SLOT=''
          for i in $(seq 0 40); do
            SNAP=$(cast rpc --rpc-url "$LOCAL" evm_snapshot | tr -d '"')
            SLOT=$(cast index address "$EIGEN" "$i")
            cast rpc --rpc-url "$LOCAL" anvil_setStorageAt "$USDC" "$SLOT" "$SENTINEL_WORD" >/dev/null
            BAL=$(cast call --rpc-url "$LOCAL" "$USDC" 'balanceOf(address)(uint256)' "$EIGEN" | awk '{print $1}')
            cast rpc --rpc-url "$LOCAL" evm_revert "$SNAP" >/dev/null
            if [ "$BAL" = "$SENTINEL" ]; then USDC_BALANCE_SLOT="$SLOT"; break; fi
          done
          test -n "$USDC_BALANCE_SLOT"

          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "fork_block=$BLOCK"
            echo "fork_timestamp=$TS"
            echo "rewards_coordinator=$RC"
            echo "interval=$INTERVAL"
            echo "max_retroactive_length=$MAXRETRO"
            echo "max_rewards_duration=$MAXDURATION"
            echo "current_epoch=$CURRENT_EPOCH"
            echo "max_retro_epochs=$MAX_RETRO_EPOCHS"
            echo "global_pending_usdc=$GLOBAL_PENDING"
            echo "usdc_balance_slot=$USDC_BALANCE_SLOT"
          } > "$OUT"

          TARGET_BALANCE=$((GLOBAL_PENDING + 1))
          TARGET_WORD=$(word "$TARGET_BALANCE")
          SUCCESSES=0
          REVERTS=0
          STALE=0

          for AGENT in "${AGENTS[@]}"; do
            CREATED=$(cast call --rpc-url "$LOCAL" "$EIGEN" 'createdAtEpoch(address)(uint32)' "$AGENT" | awk '{print $1}')
            BASE=$(cast index address "$AGENT" "$OPERATORS_SLOT")
            PENDING_MAP=$(addhex "$BASE" 3)
            LAST_MAP=$(addhex "$BASE" 4)
            OP_PENDING_SLOT=$(cast index address "$USDC" "$PENDING_MAP")
            LAST_SLOT=$(cast index address "$USDC" "$LAST_MAP")
            OP_PENDING=$(dec "$(cast storage --rpc-url "$LOCAL" "$EIGEN" "$OP_PENDING_SLOT")")
            LAST=$(dec "$(cast storage --rpc-url "$LOCAL" "$EIGEN" "$LAST_SLOT")")
            EFFECTIVE=$LAST
            if [ "$EFFECTIVE" -eq 0 ]; then EFFECTIVE=$CREATED; fi
            FIRST=$((EFFECTIVE + 1))
            AGE=0
            if [ "$CURRENT_EPOCH" -gt "$FIRST" ]; then AGE=$((CURRENT_EPOCH - FIRST)); fi
            STATE_STALE=0
            if [ "$AGE" -gt "$MAX_RETRO_EPOCHS" ]; then STATE_STALE=1; STALE=$((STALE + 1)); fi

            SNAP=$(cast rpc --rpc-url "$LOCAL" evm_snapshot | tr -d '"')
            cast rpc --rpc-url "$LOCAL" anvil_setStorageAt "$USDC" "$USDC_BALANCE_SLOT" "$TARGET_WORD" >/dev/null
            set +e
            CALL_OUT=$(cast call --rpc-url "$LOCAL" --from "$DELEGATION" "$EIGEN" 'distributeRewards(address,address)' "$AGENT" "$USDC" 2>&1)
            RCALL=$?
            set -e
            cast rpc --rpc-url "$LOCAL" evm_revert "$SNAP" >/dev/null
            CALL_ONE=$(printf '%s' "$CALL_OUT" | tr '\n\t' '  ' | sed 's/[[:space:]]\+/ /g')
            if [ "$RCALL" -eq 0 ]; then RESULT=SUCCESS; SUCCESSES=$((SUCCESSES + 1)); else RESULT=REVERT; REVERTS=$((REVERTS + 1)); fi

            {
              echo "--- agent=$AGENT"
              echo "created_epoch=$CREATED"
              echo "last_distribution_epoch=$LAST"
              echo "operator_pending_usdc=$OP_PENDING"
              echo "reward_start_age_epochs=$AGE"
              echo "state_stale=$STATE_STALE"
              echo "call_result=$RESULT"
              echo "call_output=$CALL_ONE"
            } >> "$OUT"
          done

          {
            echo "summary_successes=$SUCCESSES"
            echo "summary_reverts=$REVERTS"
            echo "summary_state_stale=$STALE"
          } >> "$OUT"
          sha256sum "$OUT" "$OUTDIR/anvil.log" > "$OUTDIR/SHA256SUMS"
          cat "$OUT"

      - name: Upload state gate
        uses: actions/upload-artifact@v4
        with:
          name: cap-evm-state-gate-v7-20260811
          path: cap-evm-state-gate-v7
          if-no-files-found: error
          retention-days: 1
