name: Temporary Cap Fix-Review Toolchain 20260812

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-fix-review-toolchain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout scoped Cap source
        uses: actions/checkout@v6
        with:
          repository: cap-labs-dev/cap-contracts
          ref: 403326df39f6987359bba648b7c09f81bd53da62
          path: cap-contracts
          submodules: recursive
          fetch-depth: 1

      - name: Verify and export scoped source
        shell: bash
        run: |
          set -euo pipefail
          cd cap-contracts
          test "$(git rev-parse HEAD)" = "403326df39f6987359bba648b7c09f81bd53da62"
          git submodule status --recursive > ../SUBMODULES.txt
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository=cap-labs-dev/cap-contracts"
            echo "scoped_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
          } > ../MANIFEST.txt
          cd ..
          tar --exclude='cap-contracts/.git' --exclude='cap-contracts/cache' --exclude='cap-contracts/out' -czf cap-fix-review-toolchain.tgz cap-contracts MANIFEST.txt SUBMODULES.txt
          sha256sum cap-fix-review-toolchain.tgz > cap-fix-review-toolchain.tgz.sha256

      - name: Upload scoped toolchain
        uses: actions/upload-artifact@v4
        with:
          name: cap-fix-review-toolchain-20260812
          path: |
            cap-fix-review-toolchain.tgz
            cap-fix-review-toolchain.tgz.sha256
            MANIFEST.txt
            SUBMODULES.txt
          if-no-files-found: error
          retention-days: 1
