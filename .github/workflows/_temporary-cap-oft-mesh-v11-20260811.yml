name: Temporary Cap OFT Mesh Inventory V11

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-oft-mesh-v11-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read-only OFT mesh and custody inventory
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR='cap-oft-mesh-v11'
          OUT="$OUTDIR/state.txt"
          mkdir -p "$OUTDIR"

          ETH_RPC='https://ethereum-rpc.publicnode.com'
          CUSD='0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
          STCUSD='0x88887bE419578051FF9F4eb6C858A951921D8888'
          CUSD_LOCK='0xA62571EbdFfAbC3051a2e5B9e1f57b23D830c8Fd'
          STCUSD_LOCK='0x983AEAaA0d0426839158435C43725EA7F45d4137'
          ETH_EID=30101

          one() { tr '\n\t' '  ' | sed 's/[[:space:]]\+/ /g'; }
          call() {
            local label="$1" rpc="$2" addr="$3" sig="$4"; shift 4
            printf '%s=' "$label" >> "$OUT"
            (cast call --rpc-url "$rpc" "$addr" "$sig" "$@" 2>&1 || true) | one >> "$OUT"
            echo >> "$OUT"
          }
          codeinfo() {
            local label="$1" rpc="$2" addr="$3"
            local code
            code=$(cast code --rpc-url "$rpc" "$addr" 2>/dev/null || echo 0x)
            echo "${label}_code_bytes=$(( (${#code} - 2) / 2 ))" >> "$OUT"
            printf '%s' "$code" | sha256sum | sed "s/-/${label}_code_sha256/" >> "$OUT"
          }
          b32addr() {
            python3 - "$1" <<'PY'
          import sys
          a=sys.argv[1].lower().removeprefix('0x')
          print('0x' + '0'*24 + a)
          PY
          }
          pick_rpc() {
            local expected="$1"; shift
            for rpc in "$@"; do
              set +e
              cid=$(cast chain-id --rpc-url "$rpc" 2>/dev/null | awk '{print $1}')
              rc=$?
              set -e
              if [ "$rc" -eq 0 ] && [ "$cid" = "$expected" ]; then echo "$rpc"; return 0; fi
            done
            return 1
          }

          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ethereum_block=$(cast block-number --rpc-url "$ETH_RPC")"
          } > "$OUT"

          for pair in "cusd:$CUSD:$CUSD_LOCK" "stcusd:$STCUSD:$STCUSD_LOCK"; do
            IFS=: read -r name token lock <<< "$pair"
            echo "--- ethereum_${name}" >> "$OUT"
            codeinfo "ethereum_${name}_lockbox" "$ETH_RPC" "$lock"
            call "ethereum_${name}_lockbox_token" "$ETH_RPC" "$lock" 'token()(address)'
            call "ethereum_${name}_lockbox_owner" "$ETH_RPC" "$lock" 'owner()(address)'
            call "ethereum_${name}_lockbox_endpoint" "$ETH_RPC" "$lock" 'endpoint()(address)'
            call "ethereum_${name}_approval_required" "$ETH_RPC" "$lock" 'approvalRequired()(bool)'
            call "ethereum_${name}_underlying_balance" "$ETH_RPC" "$token" 'balanceOf(address)(uint256)' "$lock"
            call "ethereum_${name}_underlying_total_supply" "$ETH_RPC" "$token" 'totalSupply()(uint256)'
            for eid in 30390 30410 30398 30375; do
              call "ethereum_${name}_peer_${eid}" "$ETH_RPC" "$lock" 'peers(uint32)(bytes32)' "$eid"
            done
          done

          declare -A RPC CUSD_REMOTE STCUSD_REMOTE EID
          RPC[megaeth]=$(pick_rpc 4326 'https://mainnet.megaeth.com/rpc') || RPC[megaeth]=''
          RPC[katana]=$(pick_rpc 747474 'https://rpc.katana.network/' 'https://katana.gateway.tenderly.co/' 'https://rpc.katanarpc.com/') || RPC[katana]=''
          RPC[monad]=$(pick_rpc 143 'https://rpc.monad.xyz' 'https://rpc1.monad.xyz' 'https://monad-mainnet.drpc.org') || RPC[monad]=''
          RPC[tempo]=$(pick_rpc 4217 'https://rpc.tempo.xyz' 'https://rpc.mainnet.tempo.xyz' 'https://rpc.tempo.xyz/') || RPC[tempo]=''

          CUSD_REMOTE[megaeth]='0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
          STCUSD_REMOTE[megaeth]='0x88887bE419578051FF9F4eb6C858A951921D8888'
          EID[megaeth]=30398
          CUSD_REMOTE[katana]='0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
          STCUSD_REMOTE[katana]='0x88887bE419578051FF9F4eb6C858A951921D8888'
          EID[katana]=30375
          CUSD_REMOTE[monad]='0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
          STCUSD_REMOTE[monad]='0x88887bE419578051FF9F4eb6C858A951921D8888'
          EID[monad]=30390
          CUSD_REMOTE[tempo]='0xbD12E50Bfaa25735D074DBfDCF73208b9ccD2e43'
          STCUSD_REMOTE[tempo]='0x4eeC5B8FDfBcdd45Dfb29F666D9c34AD38c7aFa5'
          EID[tempo]=30410

          CUSD_REMOTE_SUM=0
          STCUSD_REMOTE_SUM=0
          for chain in megaeth katana monad tempo; do
            rpc=${RPC[$chain]}
            echo "--- remote_${chain}" >> "$OUT"
            echo "remote_${chain}_rpc=$rpc" >> "$OUT"
            if [ -z "$rpc" ]; then
              echo "remote_${chain}_status=RPC_UNAVAILABLE" >> "$OUT"
              continue
            fi
            echo "remote_${chain}_block=$(cast block-number --rpc-url "$rpc")" >> "$OUT"
            for pair in "cusd:${CUSD_REMOTE[$chain]}:$CUSD_LOCK" "stcusd:${STCUSD_REMOTE[$chain]}:$STCUSD_LOCK"; do
              IFS=: read -r name remote ethlock <<< "$pair"
              codeinfo "remote_${chain}_${name}" "$rpc" "$remote"
              call "remote_${chain}_${name}_token" "$rpc" "$remote" 'token()(address)'
              call "remote_${chain}_${name}_owner" "$rpc" "$remote" 'owner()(address)'
              call "remote_${chain}_${name}_endpoint" "$rpc" "$remote" 'endpoint()(address)'
              call "remote_${chain}_${name}_peer_eth" "$rpc" "$remote" 'peers(uint32)(bytes32)' "$ETH_EID"
              call "remote_${chain}_${name}_total_supply" "$rpc" "$remote" 'totalSupply()(uint256)'
              supply=$(cast call --rpc-url "$rpc" "$remote" 'totalSupply()(uint256)' 2>/dev/null | awk '{print $1}' || echo 0)
              if [[ "$supply" =~ ^[0-9]+$ ]]; then
                if [ "$name" = cusd ]; then CUSD_REMOTE_SUM=$((CUSD_REMOTE_SUM + supply)); else STCUSD_REMOTE_SUM=$((STCUSD_REMOTE_SUM + supply)); fi
              fi
              expected=$(b32addr "$ethlock")
              actual=$(cast call --rpc-url "$rpc" "$remote" 'peers(uint32)(bytes32)' "$ETH_EID" 2>/dev/null | tr -d '[:space:]' || true)
              if [ "${actual,,}" = "${expected,,}" ]; then echo "remote_${chain}_${name}_mutual_peer=PASS" >> "$OUT"; else echo "remote_${chain}_${name}_mutual_peer=FAIL expected=$expected actual=$actual" >> "$OUT"; fi
            done
          done

          CUSD_LOCKED=$(cast call --rpc-url "$ETH_RPC" "$CUSD" 'balanceOf(address)(uint256)' "$CUSD_LOCK" | awk '{print $1}')
          STCUSD_LOCKED=$(cast call --rpc-url "$ETH_RPC" "$STCUSD" 'balanceOf(address)(uint256)' "$STCUSD_LOCK" | awk '{print $1}')
          {
            echo "cusd_remote_supply_sum=$CUSD_REMOTE_SUM"
            echo "cusd_ethereum_locked=$CUSD_LOCKED"
            echo "cusd_custody_surplus=$((CUSD_LOCKED - CUSD_REMOTE_SUM))"
            echo "cusd_remote_le_locked=$([ "$CUSD_REMOTE_SUM" -le "$CUSD_LOCKED" ] && echo PASS || echo FAIL)"
            echo "stcusd_remote_supply_sum=$STCUSD_REMOTE_SUM"
            echo "stcusd_ethereum_locked=$STCUSD_LOCKED"
            echo "stcusd_custody_surplus=$((STCUSD_LOCKED - STCUSD_REMOTE_SUM))"
            echo "stcusd_remote_le_locked=$([ "$STCUSD_REMOTE_SUM" -le "$STCUSD_LOCKED" ] && echo PASS || echo FAIL)"
          } >> "$OUT"

          sha256sum "$OUT" > "$OUTDIR/SHA256SUMS"
          cat "$OUT"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: cap-oft-mesh-v11-20260811
          path: cap-oft-mesh-v11
          if-no-files-found: error
          retention-days: 1
