name: Temporary Cap Public Binding Inventory V3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-public-bindings-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read-only production binding inventory
        shell: bash
        run: |
          set -u
          RPC='https://ethereum-rpc.publicnode.com'
          OUTDIR='cap-public-bindings-v3'
          OUT="$OUTDIR/state-v3.txt"
          mkdir -p "$OUTDIR"

          HARV='0x1388B2dc1Fe408741E48145F87Fd79f01bca7e16'
          CUSD='0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
          ORACLE='0xcD7f45566bc0E7303fB92A93969BB4D3f6e662bb'
          DELEGATION='0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F'
          LENDER='0x15622c3dbbc5614E6DFa9446603c1779647f01FC'
          ACCESS='0x7731129a10d51e18cDE607C5C115F26503D2c683'
          FEEAUCTION='0xa1a20aBdc873CF291c22Ce3C8968EC06277324D0'
          USDC='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          WTGXX='0x434558CB1EBe9950e8A66f1ef8A15A473Dce7D8c'
          LBTC='0x8236a87084f8B84306f72007F36F2618A5634494'
          FALCON='0x50449B3D1f5931d568A1951Ee506A9534e7f7dFf'
          LBTCRATIO='0x1De9fcfeDF3E51266c188ee422fbA1c7860DA0eF'
          GELATO='0xe84E4337c382cC8Ed57c6FB12919270228B6B7A3'
          ATTACKER='0x000000000000000000000000000000000000dEaD'
          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'

          q() { printf '\n### %s\n' "$1" >> "$OUT"; shift; "$@" >> "$OUT" 2>&1 || true; }
          call() { local label="$1" addr="$2" sig="$3"; shift 3; printf '%s=' "$label" >> "$OUT"; cast call --rpc-url "$RPC" "$addr" "$sig" "$@" >> "$OUT" 2>&1 || true; }

          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "block=$(cast block-number --rpc-url "$RPC")"
          } > "$OUT"

          q 'token metadata' bash -lc "
            for a in $USDC $WTGXX $LBTC; do
              echo asset=\$a
              cast call --rpc-url '$RPC' \$a 'name()(string)' || true
              cast call --rpc-url '$RPC' \$a 'symbol()(string)' || true
              cast call --rpc-url '$RPC' \$a 'decimals()(uint8)' || true
              cast call --rpc-url '$RPC' \$a 'totalSupply()(uint256)' || true
              cast call --rpc-url '$RPC' \$a 'asset()(address)' || true
              cast call --rpc-url '$RPC' \$a 'totalAssets()(uint256)' || true
              cast call --rpc-url '$RPC' \$a 'convertToAssets(uint256)(uint256)' 1000000 || true
            done
          "

          call cusd_assets "$CUSD" 'assets()(address[])'
          for a in "$USDC" "$WTGXX" "$LBTC"; do
            echo "--- asset=$a" >> "$OUT"
            call totalSupplies "$CUSD" 'totalSupplies(address)(uint256)' "$a"
            call totalBorrows "$CUSD" 'totalBorrows(address)(uint256)' "$a"
            call availableBalance "$CUSD" 'availableBalance(address)(uint256)' "$a"
            call depositCap "$CUSD" 'depositCap(address)(uint256)' "$a"
            call remainingMintCapacity "$CUSD" 'getRemainingMintCapacity(address)(uint256)' "$a"
            call mintQuote "$CUSD" 'getMintAmount(address,uint256)(uint256,uint256)' "$a" 1000000
            call price "$ORACLE" 'getPrice(address)(uint256,uint256)' "$a"
            call staleness "$ORACLE" 'staleness(address)(uint256)' "$a"
            call primaryOracle "$ORACLE" 'priceOracleData(address)((address,bytes))' "$a"
            call backupOracle "$ORACLE" 'priceBackupOracleData(address)((address,bytes))' "$a"
            call reserve "$LENDER" 'reservesData(address)((address,address,address,uint256,uint256,uint8,uint256))' "$a"
          done

          q 'Falcon source' bash -lc "
            cast call --rpc-url '$RPC' '$FALCON' 'description()(string)' || true
            cast call --rpc-url '$RPC' '$FALCON' 'decimals()(uint8)' || true
            cast call --rpc-url '$RPC' '$FALCON' 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' || true
            cast call --rpc-url '$RPC' '$FALCON' 'latestAnswer()(int256)' || true
            cast call --rpc-url '$RPC' '$FALCON' 'latestTimestamp()(uint256)' || true
            cast call --rpc-url '$RPC' '$FALCON' 'version()(uint256)' || true
            code=\$(cast code --rpc-url '$RPC' '$FALCON'); echo code_bytes=\$(( (\${#code}-2)/2 )); cast selectors \"\$code\" || true
          "

          q 'LBTC ratio oracle' bash -lc "
            cast call --rpc-url '$RPC' '$LBTCRATIO' 'getRate()(uint256)' || true
            cast call --rpc-url '$RPC' '$LBTCRATIO' 'ratio()(uint256)' || true
            cast call --rpc-url '$RPC' '$LBTCRATIO' 'nextRatio()(uint256,uint256)' || true
            cast call --rpc-url '$RPC' '$LBTCRATIO' 'maxAheadInterval()(uint256)' || true
            code=\$(cast code --rpc-url '$RPC' '$LBTCRATIO'); echo code_bytes=\$(( (\${#code}-2)/2 )); cast selectors \"\$code\" || true
          "

          q 'harvester implementation and access' bash -lc "
            implword=\$(cast storage --rpc-url '$RPC' '$HARV' '$IMPL_SLOT'); echo impl_word=\$implword
            impl=0x\${implword:26}; echo impl=\$impl
            code=\$(cast code --rpc-url '$RPC' '$HARV'); echo proxy_code_bytes=\$(( (\${#code}-2)/2 )); cast selectors \"\$code\" || true
            icode=\$(cast code --rpc-url '$RPC' \$impl); echo implementation_code_bytes=\$(( (\${#icode}-2)/2 )); cast selectors \"\$icode\" || true
            cast call --rpc-url '$RPC' '$HARV' 'owner()(address)' || true
            cast call --rpc-url '$RPC' '$HARV' 'lastHarvest()(uint256)' || true
            cast call --rpc-url '$RPC' '$HARV' 'checker()(bool,bytes)' || true
            echo arbitrary_harvest_call
            cast call --rpc-url '$RPC' --from '$ATTACKER' '$HARV' 'harvestInterest()' || true
            echo gelato_harvest_call
            cast call --rpc-url '$RPC' --from '$GELATO' '$HARV' 'harvestInterest()' || true
            echo arbitrary_access
            cast call --rpc-url '$RPC' '$ACCESS' 'checkAccess(bytes4,address,address)(bool)' 0xde0171ed '$HARV' '$ATTACKER' || true
            echo gelato_access
            cast call --rpc-url '$RPC' '$ACCESS' 'checkAccess(bytes4,address,address)(bool)' 0xde0171ed '$HARV' '$GELATO' || true
          "

          q 'fee auction and balances' bash -lc "
            cast call --rpc-url '$RPC' '$FEEAUCTION' 'currentPrice()(uint256)' || true
            cast call --rpc-url '$RPC' '$FEEAUCTION' 'startPrice()(uint256)' || true
            cast call --rpc-url '$RPC' '$FEEAUCTION' 'startTimestamp()(uint256)' || true
            cast call --rpc-url '$RPC' '$FEEAUCTION' 'duration()(uint256)' || true
            cast call --rpc-url '$RPC' '$FEEAUCTION' 'paymentRecipient()(address)' || true
            for a in $USDC $WTGXX; do echo token=\$a; cast call --rpc-url '$RPC' \$a 'balanceOf(address)(uint256)' '$FEEAUCTION' || true; done
          "

          q 'agent collateral inventory' bash -lc "
            agents=\$(cast call --rpc-url '$RPC' '$DELEGATION' 'agents()(address[])')
            echo \"\$agents\"
            for a in \$(echo \"\$agents\" | grep -oE '0x[0-9a-fA-F]{40}'); do
              network=\$(cast call --rpc-url '$RPC' '$DELEGATION' 'networks(address)(address)' \$a 2>/dev/null || true)
              collateral=\$(cast call --rpc-url '$RPC' \$network 'collateral(address)(address)' \$a 2>/dev/null || true)
              echo agent=\$a network=\$network collateral=\$collateral
              if [[ \$collateral =~ ^0x[0-9a-fA-F]{40}$ ]]; then
                cast call --rpc-url '$RPC' \$collateral 'symbol()(string)' || true
                cast call --rpc-url '$RPC' '$ORACLE' 'getPrice(address)(uint256,uint256)' \$collateral || true
                cast call --rpc-url '$RPC' '$ORACLE' 'priceOracleData(address)((address,bytes))' \$collateral || true
                cast call --rpc-url '$RPC' '$ORACLE' 'staleness(address)(uint256)' \$collateral || true
              fi
              cast call --rpc-url '$RPC' '$DELEGATION' 'coverage(address)(uint256)' \$a || true
              cast call --rpc-url '$RPC' '$LENDER' 'agent(address)(uint256,uint256,uint256,uint256,uint256,uint256)' \$a || true
            done
          "

          sha256sum "$OUT" > "$OUTDIR/SHA256SUMS"
          cat "$OUT"

      - name: Upload public inventory
        uses: actions/upload-artifact@v4
        with:
          name: cap-public-bindings-v3-20260811
          path: cap-public-bindings-v3
          if-no-files-found: error
          retention-days: 1
