name: Temporary Cap Public Finding Corpus V6

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-finding-corpus-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  export:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public Sherlock Cap finding corpus
        uses: actions/checkout@v4
        with:
          repository: sherlock-audit/2025-07-cap-judging
          ref: main
          path: cap-judging
          persist-credentials: false

      - name: Package public corpus
        shell: bash
        run: |
          set -euo pipefail
          git -C cap-judging rev-parse HEAD > cap-judging/PINNED_COMMIT.txt
          tar -czf cap-public-finding-corpus-v6.tgz cap-judging
          sha256sum cap-public-finding-corpus-v6.tgz > cap-public-finding-corpus-v6.tgz.sha256

      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: cap-public-finding-corpus-v6-20260811
          path: |
            cap-public-finding-corpus-v6.tgz
            cap-public-finding-corpus-v6.tgz.sha256
          if-no-files-found: error
          retention-days: 1
