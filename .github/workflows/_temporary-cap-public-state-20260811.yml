name: Temporary Cap Public State Inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-public-state-20260811-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read-only Ethereum production inventory
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://ethereum-rpc.publicnode.com'
          CUSD='0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
          STCUSD='0x88887bE419578051FF9F4eb6C858A951921D8888'
          FEE_AUCTION='0xa1a20aBdc873CF291c22Ce3C8968EC06277324D0'
          FEE_RECEIVER='0x0036c7b9b62c53F47c804a5643F0c09f864beF0b'
          ORACLE='0xcD7f45566bc0E7303fB92A93969BB4D3f6e662bb'
          HARVESTER='0x1388B2dc1Fe408741E48145F87Fd79f01bca7e16'
          LENDER='0x15622c3dbbc5614E6DFa9446603c1779647f01FC'
          DELEGATION='0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F'
          EIGEN='0xE65c3eccd18879E103dBC96D854e376Ced4cC7dd'
          USDC='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          FALCON_SOURCE='0x50449B3D1f5931d568A1951Ee506A9534e7f7dFf'
          LBTC='0x8236a87084f8B84306f72007F36F2618A5634494'
          LBTC_RATIO='0x1De9fcfeDF3E51266c188ee422fbA1c7860DA0eF'
          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          mkdir -p cap-public-state-v2
          OUT='cap-public-state-v2/state.txt'

          call() {
            local label="$1"; shift
            printf '%s=' "$label" | tee -a "$OUT"
            (cast call --rpc-url "$RPC" "$@" 2>&1 || true) | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | tee -a "$OUT"
            echo | tee -a "$OUT"
          }
          rawslot() {
            local label="$1" addr="$2" slot="$3"
            printf '%s=' "$label" | tee -a "$OUT"
            (cast storage --rpc-url "$RPC" "$addr" "$slot" 2>&1 || true) | tr '\n' ' ' | tee -a "$OUT"
            echo | tee -a "$OUT"
          }

          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "block=$(cast block-number --rpc-url "$RPC")"
          } | tee "$OUT"

          call harvester_owner "$HARVESTER" 'owner()(address)'
          call harvester_lastHarvest "$HARVESTER" 'lastHarvest()(uint256)'
          call harvester_checker "$HARVESTER" 'checker()(bool,bytes)'
          rawslot harvester_impl "$HARVESTER" "$IMPL_SLOT"
          rawslot harvester_asset "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce00
          rawslot harvester_cusd "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce01
          rawslot harvester_feeAuction "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce02
          rawslot harvester_feeReceiver "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce03
          rawslot harvester_fractionalHarvester "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce04
          rawslot harvester_lender "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce05
          rawslot harvester_balancerVault "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce06
          rawslot harvester_excessReceiver "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce07
          rawslot harvester_lastHarvestRaw "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce08
          rawslot harvester_flashAndWtgxx "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce09
          rawslot harvester_excess "$HARVESTER" 0xe6deaaba5d3c1b5422eff673d45817af41444ddbfa5eb9aacfa7dc58df43ce0a

          call cusd_assets "$CUSD" 'assets()(address[])'
          call cusd_totalSupply "$CUSD" 'totalSupply()(uint256)'
          call cusd_usdc_totalSupplies "$CUSD" 'totalSupplies(address)(uint256)' "$USDC"
          call cusd_usdc_totalBorrows "$CUSD" 'totalBorrows(address)(uint256)' "$USDC"
          call cusd_usdc_depositCap "$CUSD" 'depositCap(address)(uint256)' "$USDC"
          call cusd_usdc_remainingCapacity "$CUSD" 'getRemainingMintCapacity(address)(uint256)' "$USDC"
          call cusd_usdc_getMintAmount "$CUSD" 'getMintAmount(address,uint256)(uint256,uint256)' "$USDC" 1000000
          call stcusd_totalAssets "$STCUSD" 'totalAssets()(uint256)'
          call stcusd_totalSupply "$STCUSD" 'totalSupply()(uint256)'
          call stcusd_lockedProfit "$STCUSD" 'lockedProfit()(uint256)'
          call stcusd_lastNotify "$STCUSD" 'lastNotify()(uint256)'
          call stcusd_lockDuration "$STCUSD" 'lockDuration()(uint256)'

          call feeAuction_price "$FEE_AUCTION" 'currentPrice()(uint256)'
          call feeAuction_startPrice "$FEE_AUCTION" 'startPrice()(uint256)'
          call feeAuction_startTimestamp "$FEE_AUCTION" 'startTimestamp()(uint256)'
          call feeAuction_duration "$FEE_AUCTION" 'duration()(uint256)'
          call feeAuction_paymentToken "$FEE_AUCTION" 'paymentToken()(address)'
          call feeAuction_usdcBalance "$USDC" 'balanceOf(address)(uint256)' "$FEE_AUCTION"
          call feeAuction_cusdBalance "$CUSD" 'balanceOf(address)(uint256)' "$FEE_AUCTION"
          call feeReceiver_cusdBalance "$CUSD" 'balanceOf(address)(uint256)' "$FEE_RECEIVER"

          call oracle_usdc_price "$ORACLE" 'getPrice(address)(uint256,uint256)' "$USDC"
          call oracle_usdc_primary "$ORACLE" 'priceOracleData(address)((address,bytes))' "$USDC"
          call oracle_usdc_backup "$ORACLE" 'priceBackupOracleData(address)((address,bytes))' "$USDC"
          call oracle_usdc_staleness "$ORACLE" 'staleness(address)(uint256)' "$USDC"
          call oracle_lbtc_price "$ORACLE" 'getPrice(address)(uint256,uint256)' "$LBTC"
          call oracle_lbtc_primary "$ORACLE" 'priceOracleData(address)((address,bytes))' "$LBTC"
          call oracle_lbtc_backup "$ORACLE" 'priceBackupOracleData(address)((address,bytes))' "$LBTC"
          call oracle_lbtc_staleness "$ORACLE" 'staleness(address)(uint256)' "$LBTC"

          call falcon_decimals "$FALCON_SOURCE" 'decimals()(uint8)'
          call falcon_latestRoundData "$FALCON_SOURCE" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)'
          call falcon_description "$FALCON_SOURCE" 'description()(string)'
          call lbtc_ratio_getRate "$LBTC_RATIO" 'getRate()(uint256)'
          call lbtc_ratio_ratio "$LBTC_RATIO" 'ratio()(uint256)'
          call lbtc_ratio_nextRatio "$LBTC_RATIO" 'nextRatio()(uint256)'

          call eigen_epochs_between "$EIGEN" 'epochsBetweenDistributions()(uint32)'
          call eigen_calc_interval "$EIGEN" 'calculationIntervalSeconds()(uint256)'
          call agents "$DELEGATION" 'agents()(address[])'
          call usdc_reserve "$LENDER" 'reservesData(address)((address,address,address,uint256,uint256,uint8,uint256))' "$USDC"

          for pair in \
            "Harvester:$HARVESTER" \
            "cUSD:$CUSD" \
            "stcUSD:$STCUSD" \
            "FeeAuction:$FEE_AUCTION" \
            "Oracle:$ORACLE" \
            "FalconSource:$FALCON_SOURCE" \
            "LBTCRatio:$LBTC_RATIO"; do
            name=${pair%%:*}; addr=${pair##*:}
            code=$(cast code --rpc-url "$RPC" "$addr")
            echo "$name.code_bytes=$(( (${#code} - 2) / 2 ))" | tee -a "$OUT"
            printf '%s' "$code" | sha256sum | sed "s/-/$name.code_sha256/" | tee -a "$OUT"
          done

      - name: Upload state inventory
        uses: actions/upload-artifact@v4
        with:
          name: cap-public-state-v2-20260811
          path: cap-public-state-v2
          if-no-files-found: error
          retention-days: 1
