name: Temporary Cap Public State Inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-public-state-20260811
  cancel-in-progress: true

jobs:
  inventory:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read-only Ethereum state inventory
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://ethereum-rpc.publicnode.com'
          EIGEN='0xE65c3eccd18879E103dBC96D854e376Ced4cC7dd'
          DELEGATION='0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F'
          LENDER='0x15622c3dbbc5614E6DFa9446603c1779647f01FC'
          USDC='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          mkdir -p cap-public-state
          OUT='cap-public-state/state.txt'
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "block=$(cast block-number --rpc-url "$RPC")"
            echo "eigen_epochs_between=$(cast call --rpc-url "$RPC" "$EIGEN" 'epochsBetweenDistributions()(uint32)')"
            echo "eigen_calc_interval=$(cast call --rpc-url "$RPC" "$EIGEN" 'calculationIntervalSeconds()(uint256)')"
            echo "eigen_addresses=$(cast call --rpc-url "$RPC" "$EIGEN" 'eigenAddresses()((address,address,address,address))')"
            echo "agents=$(cast call --rpc-url "$RPC" "$DELEGATION" 'agents()(address[])')"
            echo "usdc_reserve=$(cast call --rpc-url "$RPC" "$LENDER" 'reservesData(address)((address,address,address,uint256,uint256,uint8,uint256))' "$USDC")"
          } | tee "$OUT"

          agents_raw=$(cast call --rpc-url "$RPC" "$DELEGATION" 'agents()(address[])')
          mapfile -t agents < <(echo "$agents_raw" | grep -oE '0x[0-9a-fA-F]{40}')
          for a in "${agents[@]}"; do
            {
              echo "--- agent=$a"
              network=$(cast call --rpc-url "$RPC" "$DELEGATION" 'networks(address)(address)' "$a")
              echo "network=$network"
              echo "coverage=$(cast call --rpc-url "$RPC" "$DELEGATION" 'coverage(address)(uint256)' "$a" || true)"
              echo "slashable=$(cast call --rpc-url "$RPC" "$DELEGATION" 'slashableCollateral(address)(uint256)' "$a" || true)"
              echo "ltv=$(cast call --rpc-url "$RPC" "$DELEGATION" 'ltv(address)(uint256)' "$a" || true)"
              echo "liquidation_threshold=$(cast call --rpc-url "$RPC" "$DELEGATION" 'liquidationThreshold(address)(uint256)' "$a" || true)"
              echo "debt_usdc=$(cast call --rpc-url "$RPC" "$LENDER" 'debt(address,address)(uint256)' "$a" "$USDC" || true)"
              echo "agent_state=$(cast call --rpc-url "$RPC" "$LENDER" 'agent(address)(uint256,uint256,uint256,uint256,uint256,uint256)' "$a" || true)"
              if [ "${network,,}" = "${EIGEN,,}" ]; then
                echo "eigen_operator=$(cast call --rpc-url "$RPC" "$EIGEN" 'getEigenOperator(address)(address)' "$a" || true)"
                echo "eigen_strategy=$(cast call --rpc-url "$RPC" "$EIGEN" 'operatorToStrategy(address)(address)' "$a" || true)"
                echo "eigen_pending_usdc=$(cast call --rpc-url "$RPC" "$EIGEN" 'pendingRewards(address,address)(uint256)' "$a" "$USDC" || true)"
              fi
            } | tee -a "$OUT"
          done

          for pair in \
            "EigenServiceManager:$EIGEN" \
            "Delegation:$DELEGATION" \
            "Lender:$LENDER"; do
            name=${pair%%:*}; addr=${pair##*:}
            code=$(cast code --rpc-url "$RPC" "$addr")
            echo "$name.code_bytes=$(( (${#code} - 2) / 2 ))" | tee -a "$OUT"
            echo "$code" | sha256sum | sed "s/-/$name.code_sha256/" | tee -a "$OUT"
            impl_word=$(cast storage --rpc-url "$RPC" "$addr" 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc)
            echo "$name.eip1967_impl_word=$impl_word" | tee -a "$OUT"
          done

      - name: Upload state inventory
        uses: actions/upload-artifact@v4
        with:
          name: cap-public-state-20260811
          path: cap-public-state
          if-no-files-found: error
          retention-days: 1
