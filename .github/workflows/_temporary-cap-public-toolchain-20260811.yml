name: Temporary Cap Public Toolchain Pack

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-public-toolchain-20260811
  cancel-in-progress: true

jobs:
  package:
    if: github.head_ref == 'cap-public-toolchain-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact public Cap source
        uses: actions/checkout@v4
        with:
          repository: cap-labs-dev/cap-contracts
          ref: 695c8280b410bce1b43c9254cb214be30fe51dde
          path: cap-contracts
          submodules: recursive
          persist-credentials: false

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
          cache-dependency-path: cap-contracts/yarn.lock

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies and compiler
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd cap-contracts
          yarn install --frozen-lockfile
          forge build --skip test --force
          forge --version
          solc_path="$(find "$HOME/.svm" -type f \( -name 'solc-0.8.28' -o -name '0.8.28' \) | head -1 || true)"
          echo "solc_path=$solc_path"

      - name: Package public toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cap-public-toolchain/home-foundry cap-public-toolchain/home-svm
          cp -a cap-contracts cap-public-toolchain/
          # Dereference foundry-toolchain action symlinks so the artifact contains actual binaries.
          cp -aL "$HOME/.foundry/bin/." cap-public-toolchain/home-foundry/
          if [ -d "$HOME/.svm" ]; then cp -a "$HOME/.svm/." cap-public-toolchain/home-svm/; fi
          {
            echo "cap_commit=$(git -C cap-contracts rev-parse HEAD)"
            echo "forge=$(forge --version | head -1)"
            echo "node=$(node --version)"
            sha256sum "$HOME/.foundry/bin/forge" || true
          } > cap-public-toolchain/ENVIRONMENT.txt
          tar -czf cap-public-toolchain.tgz cap-public-toolchain
          ls -lh cap-public-toolchain.tgz

      - name: Upload public toolchain
        uses: actions/upload-artifact@v4
        with:
          name: cap-public-toolchain-20260811-v2
          path: cap-public-toolchain.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
