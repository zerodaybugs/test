name: Temporary Cap Public Rate State V15

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  state:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read-only public state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cap-rate-state-v15
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          RPCS=["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com","https://rpc.flashbots.net","https://1rpc.io/eth"]
          VA="0xC6504C2c918c8C17eE2F1e01AEFa43b1f27849eC"
          ORACLE="0xcD7f45566bc0E7303fB92A93969BB4D3f6e662bb"
          VAULT="0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC"
          DEBT="0xfa8C6D0b95d9191B5A1D51C868Da2BDFd6C04Ff9"
          USDC="0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
          IMPL="0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc"
          SLOTS={
            "kink":"0xca8c8bf034d88ce3b0fb534170594361839b1f9e6a9594a999a291d39c968f90",
            "slope0":"0xca8c8bf034d88ce3b0fb534170594361839b1f9e6a9594a999a291d39c968f91",
            "slope1":"0xca8c8bf034d88ce3b0fb534170594361839b1f9e6a9594a999a291d39c968f92",
            "multiplier":"0xff82172bd354d088b8fe6d6a728897f16cd683d5b49ae4a8bcdaf296517be1ad",
            "util_index":"0xff82172bd354d088b8fe6d6a728897f16cd683d5b49ae4a8bcdaf296517be1ae",
            "last_update":"0xff82172bd354d088b8fe6d6a728897f16cd683d5b49ae4a8bcdaf296517be1af",
            "max_multiplier":"0x2b1d5d801322d1007f654ac87d8072a5f5ca4203517edc869ef2aa54addad602",
            "min_multiplier":"0x2b1d5d801322d1007f654ac87d8072a5f5ca4203517edc869ef2aa54addad603",
            "shift_rate":"0x2b1d5d801322d1007f654ac87d8072a5f5ca4203517edc869ef2aa54addad604",
            "debt_index":"0xf23a45dc65f14b1e5fe39f1163c383ff2dcba1153a83755b36cb0d5d51f3c602",
            "debt_last_update":"0xf23a45dc65f14b1e5fe39f1163c383ff2dcba1153a83755b36cb0d5d51f3c603",
            "debt_interest_rate":"0xf23a45dc65f14b1e5fe39f1163c383ff2dcba1153a83755b36cb0d5d51f3c604"
          }
          used=[]
          errors=[]
          def post(url,m,p):
            req=urllib.request.Request(url,data=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode(),headers={"Content-Type":"application/json","User-Agent":"cap-public-rate-state-v15"})
            with urllib.request.urlopen(req,timeout=15) as r:return json.loads(r.read())
          def q(m,p,required=True):
            for attempt in range(4):
              for url in RPCS:
                try:
                  body=post(url,m,p)
                  if "result" in body:
                    used.append(url)
                    return body["result"]
                  errors.append({"url":url,"method":m,"body":body})
                except Exception as exc:
                  errors.append({"url":url,"method":m,"error":repr(exc)})
              time.sleep(0.5*(attempt+1))
            if required: raise RuntimeError(f"RPC failure for {m}: {errors[-4:]}")
            return None
          def word(a):return a.lower().removeprefix("0x").rjust(64,"0")
          def call(to,sel,*args):return q("eth_call",[{"to":to,"data":"0x"+sel+"".join(args)},"latest"],False)
          def ui(v):return int(v,16) if v not in (None,"0x") else None
          block=ui(q("eth_blockNumber",[]))
          state={k:ui(q("eth_getStorageAt",[VA if not k.startswith("debt_") else DEBT,s,"latest"])) for k,s in SLOTS.items()}
          va_impl=q("eth_getStorageAt",[VA,IMPL,"latest"])
          oracle_impl=q("eth_getStorageAt",[ORACLE,IMPL,"latest"])
          state.update({
            "vault_adapter_impl":"0x"+va_impl[-40:],
            "oracle_impl":"0x"+oracle_impl[-40:],
            "vault_utilization":ui(call(VAULT,"bf20d9dc",word(USDC))),
            "vault_utilization_index":ui(call(VAULT,"feee1756",word(USDC))),
            "vault_total_supplies":ui(call(VAULT,"9782e821",word(USDC))),
            "vault_total_borrows":ui(call(VAULT,"8d730124",word(USDC))),
            "vault_available_balance":ui(call(VAULT,"a0821be3",word(USDC))),
            "benchmark_rate":ui(call(ORACLE,"58d7849a",word(USDC))),
            "simulated_market_rate":ui(call(ORACLE,"2daff25c",word(USDC))),
            "simulated_utilization_rate":ui(call(ORACLE,"207b27df",word(USDC))),
            "simulated_adapter_rate":ui(call(VA,"50e30042",word(VAULT),word(USDC))),
            "debt_index_view":ui(call(DEBT,"2986c0e5")),
            "debt_total_supply":ui(call(DEBT,"18160ddd"))
          })
          out={"captured_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"block":block,"used_endpoints":sorted(set(used)),"state":state,"rpc_errors":errors}
          Path("cap-rate-state-v15/state.json").write_text(json.dumps(out,indent=2))
          Path("cap-rate-state-v15/state.txt").write_text("\n".join(f"{k}={v}" for k,v in state.items())+"\n")
          print(Path("cap-rate-state-v15/state.txt").read_text())
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cap-rate-state-v15-20260813
          path: cap-rate-state-v15
          retention-days: 1
