name: Temporary Cap Public Scope Snapshot V10

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-scope-snapshot-v10-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch public bounty page and data
        shell: bash
        run: |
          set -euo pipefail
          OUT='cap-scope-snapshot-v10'
          mkdir -p "$OUT/scripts"
          PAGE='https://audits.sherlock.xyz/bug-bounties/114'
          curl -fsSL -A 'Mozilla/5.0' "$PAGE" -o "$OUT/page.html"
          grep -Eoi '<script[^>]+src="[^"]+"' "$OUT/page.html" | sed -E 's/.*src="([^"]+)"/\1/' | sort -u > "$OUT/script-paths.txt" || true
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http*) url="$src" ;;
              /*) url="https://audits.sherlock.xyz$src" ;;
              *) url="https://audits.sherlock.xyz/$src" ;;
            esac
            name=$(printf '%s' "$src" | sha256sum | cut -c1-16)
            curl -fsSL -A 'Mozilla/5.0' "$url" -o "$OUT/scripts/$name.js" || true
          done < "$OUT/script-paths.txt"
          {
            echo '# HTML matches'
            grep -niE 'EigenServiceManager|Delegation|Lender|cap-contracts|scope|impact|1,000,000|1000000' "$OUT/page.html" || true
            echo '# Script matches'
            grep -RniE 'EigenServiceManager|bug-bounties/114|cap-contracts|scopeAssets|inScope|impact' "$OUT/scripts" || true
          } > "$OUT/MATCHES.txt"
          sha256sum "$OUT/page.html" "$OUT/script-paths.txt" "$OUT/MATCHES.txt" "$OUT"/scripts/* > "$OUT/SHA256SUMS" 2>/dev/null || true
          sed -n '1,240p' "$OUT/MATCHES.txt"

      - name: Upload scope snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cap-scope-snapshot-v10-20260811
          path: cap-scope-snapshot-v10
          if-no-files-found: error
          retention-days: 1
