name: Temporary Cap Scoped State Gate V13

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-scoped-state-gate-v13-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read-only scoped production inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cap-scoped-state-v13
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          RPCS = [
              "https://ethereum-rpc.publicnode.com",
              "https://eth.llamarpc.com",
              "https://rpc.ankr.com/eth",
          ]

          DELEGATION = "0xF3E3Eae671000612CE3Fd15e1019154C1a4d693F"
          EXPECTED_DELEGATION_IMPL = "0x386C93f9f0A8a681c5A3E826063106A2474958ab"
          ACCESS_CONTROL = "0x7731129a10d51e18cDE607C5C115F26503D2c683"
          LENDER = "0x15622c3dbbc5614E6DFa9446603c1779647f01FC"
          USDC = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
          PROBE_FROM = "0x000000000000000000000000000000000000bEEF"
          IMPL_SLOT = "0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc"

          SEL = {
              "feeRecipient": "46904840",
              "agents": "58516661",
              "coverage": "33024430",
              "networks": "b5e2efd2",
              "liquidationThreshold": "b1732b25",
              "debt": "d449300d",
              "accruedRestakerInterest": "968faa95",
              "agent": "92e423b5",
              "getRoleMemberCount": "ca15c873",
              "getRoleMember": "9010d07c",
              "realizeRestakerInterest": "0a8d01da",
              "repay": "5ceae9c4",
              "borrow": "6c665a55",
              "liquidationStart": "6511a068",
              "maxLiquidatable": "d9f97d00",
              "reservesCount": "54b768bb",
          }

          def post(url, method, params):
              payload = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type":"application/json", "User-Agent":"cap-read-only-state-gate"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = json.loads(resp.read().decode())
              return body

          selected = None
          rpc_errors = []
          for endpoint in RPCS:
              try:
                  probe = post(endpoint, "eth_blockNumber", [])
                  if "result" in probe:
                      selected = endpoint
                      break
                  rpc_errors.append({"endpoint": endpoint, "response": probe})
              except Exception as exc:
                  rpc_errors.append({"endpoint": endpoint, "error": repr(exc)})
          if selected is None:
              raise RuntimeError(f"No RPC endpoint available: {rpc_errors}")

          def rpc(method, params):
              return post(selected, method, params)

          def addr_word(address):
              return address.lower().removeprefix("0x").rjust(64, "0")

          def uint_word(value):
              return hex(int(value))[2:].rjust(64, "0")

          def bytes32_word(value):
              return value.lower().removeprefix("0x").rjust(64, "0")

          def eth_call(to, data, from_addr=None, block="latest"):
              tx = {"to": to, "data": data}
              if from_addr:
                  tx["from"] = from_addr
              response = rpc("eth_call", [tx, block])
              if "result" in response:
                  return {"ok": True, "result": response["result"]}
              return {"ok": False, "error": response.get("error", response)}

          def call_data(selector, *words):
              return "0x" + selector + "".join(words)

          def decode_uint(result):
              if not result or result == "0x":
                  raise ValueError("empty return data")
              return int(result, 16)

          def decode_address(result):
              if not result or len(result) < 42:
                  raise ValueError("invalid address return")
              return "0x" + result[-40:]

          def decode_uint_tuple(result, count):
              raw = result.removeprefix("0x")
              if len(raw) < count * 64:
                  raise ValueError("short tuple return")
              return [int(raw[i*64:(i+1)*64], 16) for i in range(count)]

          def decode_address_array(result):
              raw = result.removeprefix("0x")
              if len(raw) < 128:
                  raise ValueError("short dynamic array return")
              offset = int(raw[:64], 16) * 2
              length = int(raw[offset:offset+64], 16)
              start = offset + 64
              values = []
              for i in range(length):
                  word = raw[start+i*64:start+(i+1)*64]
                  values.append("0x" + word[-40:])
              return values

          block_hex = rpc("eth_blockNumber", [])["result"]
          block_number = int(block_hex, 16)
          block = rpc("eth_getBlockByNumber", [block_hex, False])["result"]
          timestamp = int(block["timestamp"], 16)

          impl_word = rpc("eth_getStorageAt", [DELEGATION, IMPL_SLOT, block_hex])
          impl = decode_address(impl_word["result"]) if "result" in impl_word else None
          impl_code = rpc("eth_getCode", [impl, block_hex]) if impl else {}
          proxy_code = rpc("eth_getCode", [DELEGATION, block_hex])

          fee_call = eth_call(DELEGATION, call_data(SEL["feeRecipient"]), block=block_hex)
          fee_recipient = decode_address(fee_call["result"]) if fee_call["ok"] else None

          # AccessControl role(bytes4,address) is bytes32(selector) | bytes32(uint160(contract)).
          setter_selector = int("3ffb11b6", 16)  # setFeeRecipient(address)
          role_int = (setter_selector << 224) | int(DELEGATION, 16)
          setter_role = "0x" + role_int.to_bytes(32, "big").hex()
          count_call = eth_call(
              ACCESS_CONTROL,
              call_data(SEL["getRoleMemberCount"], bytes32_word(setter_role)),
              block=block_hex,
          )
          setter_role_count = decode_uint(count_call["result"]) if count_call["ok"] else None
          setter_role_members = []
          if setter_role_count is not None:
              for index in range(min(setter_role_count, 32)):
                  member_call = eth_call(
                      ACCESS_CONTROL,
                      call_data(SEL["getRoleMember"], bytes32_word(setter_role), uint_word(index)),
                      block=block_hex,
                  )
                  setter_role_members.append(
                      decode_address(member_call["result"]) if member_call["ok"] else {"error": member_call["error"]}
                  )

          reserve_count_call = eth_call(LENDER, call_data(SEL["reservesCount"]), block=block_hex)
          reserve_count = decode_uint(reserve_count_call["result"]) if reserve_count_call["ok"] else None

          agents_call = eth_call(DELEGATION, call_data(SEL["agents"]), block=block_hex)
          agents = decode_address_array(agents_call["result"]) if agents_call["ok"] else []
          agent_rows = []
          for agent in agents:
              row = {"agent": agent}
              queries = {
                  "network": (DELEGATION, call_data(SEL["networks"], addr_word(agent)), "address"),
                  "coverage": (DELEGATION, call_data(SEL["coverage"], addr_word(agent)), "uint"),
                  "liquidation_threshold": (
                      DELEGATION,
                      call_data(SEL["liquidationThreshold"], addr_word(agent)),
                      "uint",
                  ),
                  "debt_usdc": (LENDER, call_data(SEL["debt"], addr_word(agent), addr_word(USDC)), "uint"),
                  "accrued_restaker_interest_usdc": (
                      LENDER,
                      call_data(SEL["accruedRestakerInterest"], addr_word(agent), addr_word(USDC)),
                      "uint",
                  ),
                  "agent_tuple": (LENDER, call_data(SEL["agent"], addr_word(agent)), "tuple6"),
                  "liquidation_start": (
                      LENDER,
                      call_data(SEL["liquidationStart"], addr_word(agent)),
                      "uint",
                  ),
                  "max_liquidatable_usdc": (
                      LENDER,
                      call_data(SEL["maxLiquidatable"], addr_word(agent), addr_word(USDC)),
                      "uint",
                  ),
              }
              for key, (target, data, kind) in queries.items():
                  response = eth_call(target, data, block=block_hex)
                  if not response["ok"]:
                      row[key] = {"error": response["error"]}
                  else:
                      try:
                          if kind == "address":
                              row[key] = decode_address(response["result"])
                          elif kind == "tuple6":
                              values = decode_uint_tuple(response["result"], 6)
                              row[key] = {
                                  "total_delegation": values[0],
                                  "total_slashable_collateral": values[1],
                                  "total_debt_usd8": values[2],
                                  "ltv_ray": values[3],
                                  "liquidation_threshold_ray": values[4],
                                  "health_ray": values[5],
                              }
                          else:
                              row[key] = decode_uint(response["result"])
                      except Exception as exc:
                          row[key] = {"decode_error": repr(exc), "raw": response["result"]}

              # Read-only simulation: state changes are never persisted by eth_call.
              realize_data = call_data(
                  SEL["realizeRestakerInterest"], addr_word(agent), addr_word(USDC)
              )
              row["simulate_realize_restaker_interest"] = eth_call(
                  LENDER, realize_data, from_addr=PROBE_FROM, block=block_hex
              )
              repay_data = call_data(
                  SEL["repay"], addr_word(USDC), uint_word(0), addr_word(agent)
              )
              row["simulate_zero_repay"] = eth_call(
                  LENDER, repay_data, from_addr=PROBE_FROM, block=block_hex
              )
              agent_rows.append(row)

          zero = "0x" + "00" * 20
          exposed = []
          for row in agent_rows:
              coverage = row.get("coverage")
              debt = row.get("debt_usdc")
              accrued = row.get("accrued_restaker_interest_usdc")
              if isinstance(coverage, int) and isinstance(debt, int) and isinstance(accrued, int):
                  if coverage == 0 and debt > 0 and accrued > 0:
                      exposed.append(row["agent"])

          output = {
              "captured_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "rpc_endpoint": selected,
              "rpc_failures_before_selection": rpc_errors,
              "block_number": block_number,
              "block_timestamp": timestamp,
              "contracts": {
                  "delegation": DELEGATION,
                  "expected_delegation_implementation": EXPECTED_DELEGATION_IMPL,
                  "observed_delegation_implementation": impl,
                  "implementation_matches_scoped_config": (
                      impl.lower() == EXPECTED_DELEGATION_IMPL.lower() if impl else False
                  ),
                  "delegation_proxy_code_bytes": (
                      (len(proxy_code.get("result", "0x")) - 2) // 2 if "result" in proxy_code else None
                  ),
                  "delegation_implementation_code_bytes": (
                      (len(impl_code.get("result", "0x")) - 2) // 2 if "result" in impl_code else None
                  ),
                  "access_control": ACCESS_CONTROL,
                  "lender": LENDER,
                  "usdc": USDC,
              },
              "fee_recipient_call": fee_call,
              "fee_recipient": fee_recipient,
              "fee_recipient_is_zero": fee_recipient.lower() == zero.lower() if fee_recipient else None,
              "setter_role": setter_role,
              "setter_role_member_count": setter_role_count,
              "setter_role_members": setter_role_members,
              "reserves_count": reserve_count,
              "agents_call": agents_call,
              "agents": agent_rows,
              "zero_coverage_debt_and_accrual_agents": exposed,
              "candidate_live_gate": {
                  "scoped_implementation": (
                      impl.lower() == EXPECTED_DELEGATION_IMPL.lower() if impl else False
                  ),
                  "fee_recipient_zero": fee_recipient.lower() == zero.lower() if fee_recipient else False,
                  "setter_role_empty": setter_role_count == 0,
                  "exposed_agent_count": len(exposed),
              },
          }
          Path("cap-scoped-state-v13/state.json").write_text(json.dumps(output, indent=2), encoding="utf-8")
          Path("cap-scoped-state-v13/state.txt").write_text(
              "\n".join([
                  f"block_number={block_number}",
                  f"delegation_implementation={impl}",
                  f"implementation_matches_scoped_config={output['contracts']['implementation_matches_scoped_config']}",
                  f"fee_recipient={fee_recipient}",
                  f"fee_recipient_is_zero={output['fee_recipient_is_zero']}",
                  f"setter_role_member_count={setter_role_count}",
                  f"reserves_count={reserve_count}",
                  f"agent_count={len(agent_rows)}",
                  f"zero_coverage_debt_and_accrual_agents={len(exposed)}",
              ]) + "\n",
              encoding="utf-8",
          )
          print(Path("cap-scoped-state-v13/state.txt").read_text())
          PY

      - name: Upload scoped state gate
        uses: actions/upload-artifact@v4
        with:
          name: cap-scoped-state-v13-20260812
          path: cap-scoped-state-v13
          if-no-files-found: error
          retention-days: 1
