name: Temporary Cap wTGXX Economics V4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-cap-wtgxx-economics-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.head_ref == 'cap-public-state-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read-only economics inventory
        shell: bash
        run: |
          set -u
          RPC='https://ethereum-rpc.publicnode.com'
          OUTDIR='cap-wtgxx-economics-v4'
          OUT="$OUTDIR/state.txt"
          mkdir -p "$OUTDIR"
          CUSD='0xcCcc62962d17b8914c62D74FfB843d73B2a3cccC'
          WTGXXW='0x434558CB1EBe9950e8A66f1ef8A15A473Dce7D8c'
          USDC='0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
          ORACLE='0xcD7f45566bc0E7303fB92A93969BB4D3f6e662bb'
          USER='0x000000000000000000000000000000000000dEaD'
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "block=$(cast block-number --rpc-url "$RPC")"
            echo "cusd_total_supply=$(cast call --rpc-url "$RPC" "$CUSD" 'totalSupply()(uint256)' || true)"
            echo "cusd_price=$(cast call --rpc-url "$RPC" "$ORACLE" 'getPrice(address)(uint256,uint256)' "$CUSD" || true)"
            echo "wtgxx_wrapper_underlying=$(cast call --rpc-url "$RPC" "$WTGXXW" 'underlying()(address)' || true)"
            UNDER=$(cast call --rpc-url "$RPC" "$WTGXXW" 'underlying()(address)' 2>/dev/null | tr -d '[:space:]')
            echo "underlying=$UNDER"
            for A in "$WTGXXW" "$UNDER"; do
              echo "--- token=$A"
              echo "name=$(cast call --rpc-url "$RPC" "$A" 'name()(string)' || true)"
              echo "symbol=$(cast call --rpc-url "$RPC" "$A" 'symbol()(string)' || true)"
              echo "decimals=$(cast call --rpc-url "$RPC" "$A" 'decimals()(uint8)' || true)"
              echo "totalSupply=$(cast call --rpc-url "$RPC" "$A" 'totalSupply()(uint256)' || true)"
              echo "asset=$(cast call --rpc-url "$RPC" "$A" 'asset()(address)' || true)"
              echo "totalAssets=$(cast call --rpc-url "$RPC" "$A" 'totalAssets()(uint256)' || true)"
              echo "convertToAssets_1e18=$(cast call --rpc-url "$RPC" "$A" 'convertToAssets(uint256)(uint256)' 1000000000000000000 || true)"
              echo "previewRedeem_1e18=$(cast call --rpc-url "$RPC" "$A" 'previewRedeem(uint256)(uint256)' 1000000000000000000 || true)"
              echo "exchangeRate=$(cast call --rpc-url "$RPC" "$A" 'exchangeRate()(uint256)' || true)"
              echo "pricePerShare=$(cast call --rpc-url "$RPC" "$A" 'pricePerShare()(uint256)' || true)"
            done
            echo "mint_usdc_1=$(cast call --rpc-url "$RPC" --from "$USER" "$CUSD" 'getMintAmount(address,uint256)(uint256,uint256)' "$USDC" 1000000 || true)"
            echo "mint_wtgxx_1=$(cast call --rpc-url "$RPC" --from "$USER" "$CUSD" 'getMintAmount(address,uint256)(uint256,uint256)' "$WTGXXW" 1000000000000000000 || true)"
            echo "burn_usdc_1cusd=$(cast call --rpc-url "$RPC" --from "$USER" "$CUSD" 'getBurnAmount(address,uint256)(uint256,uint256)' "$USDC" 1000000000000000000 || true)"
            echo "burn_wtgxx_1cusd=$(cast call --rpc-url "$RPC" --from "$USER" "$CUSD" 'getBurnAmount(address,uint256)(uint256,uint256)' "$WTGXXW" 1000000000000000000 || true)"
            echo "redeem_1cusd=$(cast call --rpc-url "$RPC" --from "$USER" "$CUSD" 'getRedeemAmount(uint256)(uint256[],uint256[])' 1000000000000000000 || true)"
            echo "wtgxx_price=$(cast call --rpc-url "$RPC" "$ORACLE" 'getPrice(address)(uint256,uint256)' "$WTGXXW" || true)"
            echo "usdc_price=$(cast call --rpc-url "$RPC" "$ORACLE" 'getPrice(address)(uint256,uint256)' "$USDC" || true)"
            echo "wtgxx_total_supply_book=$(cast call --rpc-url "$RPC" "$CUSD" 'totalSupplies(address)(uint256)' "$WTGXXW" || true)"
            echo "wtgxx_available=$(cast call --rpc-url "$RPC" "$CUSD" 'availableBalance(address)(uint256)' "$WTGXXW" || true)"
            echo "wtgxx_wallet_balance=$(cast call --rpc-url "$RPC" "$WTGXXW" 'balanceOf(address)(uint256)' "$CUSD" || true)"
          } > "$OUT" 2>&1
          cat "$OUT"
          sha256sum "$OUT" > "$OUTDIR/SHA256SUMS"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: cap-wtgxx-economics-v4-20260811
          path: cap-wtgxx-economics-v4
          if-no-files-found: error
          retention-days: 1
