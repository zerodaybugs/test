name: Temporary Certificate Authentication Package Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-certcache-package-export-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-certcache-package-export-20260817
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact official NuGet package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://api.nuget.org/v3-flatcontainer/microsoft.aspnetcore.authentication.certificate/10.0.10/microsoft.aspnetcore.authentication.certificate.10.0.10.nupkg' \
            -o export/microsoft.aspnetcore.authentication.certificate.10.0.10.nupkg
          sha256sum export/microsoft.aspnetcore.authentication.certificate.10.0.10.nupkg > export/SHA256SUMS
          unzip -t export/microsoft.aspnetcore.authentication.certificate.10.0.10.nupkg

      - name: Upload exact package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certificate-authentication-10.0.10-package
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
