name: Temporary Cryptography Internal Matrix

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-cryptography-internal-matrix-20260816.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Restore exact cryptography package matrix
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          WORK="$GITHUB_WORKSPACE/work"
          mkdir -p "$OUT" "$WORK"
          for version in 10.0.5 10.0.7 10.0.10 11.0.0-preview.6.26359.118; do
            slug="${version//[^A-Za-z0-9]/_}"
            packages="$WORK/packages-$slug"
            project="$WORK/$slug/probe.csproj"
            mkdir -p "$(dirname "$project")" "$packages" "$OUT/$version"
            cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework><RestorePackagesPath>$packages</RestorePackagesPath></PropertyGroup>
            <ItemGroup><PackageReference Include="Microsoft.AspNetCore.Cryptography.Internal" Version="$version" /></ItemGroup>
          </Project>
          EOF
            dotnet restore "$project" --packages "$packages" --force --no-cache --nologo --use-lock-file
            cp "$project" "$(dirname "$project")/packages.lock.json" "$OUT/$version/"
            cp -a "$packages/microsoft.aspnetcore.cryptography.internal/$version" "$OUT/$version/package"
          done
          dotnet --info > "$OUT/DOTNET_INFO.txt"
          find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/FILE_SIZES.tsv"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cryptography-internal-matrix-10.0.5-10.0.7-10.0.10-preview11
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
