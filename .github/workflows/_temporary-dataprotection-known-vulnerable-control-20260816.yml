name: Temporary DataProtection Known-Vulnerable Control

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dataprotection-known-vulnerable-control-20260816.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Restore exact 10.0.6 packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          PACKAGES="$GITHUB_WORKSPACE/packages"
          mkdir -p "$OUT" "$PACKAGES" "$GITHUB_WORKSPACE/work"
          cat > "$GITHUB_WORKSPACE/work/probe.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework><RestorePackagesPath>$PACKAGES</RestorePackagesPath><PrunePackageReference>false</PrunePackageReference></PropertyGroup>
            <ItemGroup><PackageReference Include="Microsoft.AspNetCore.DataProtection" Version="10.0.6" /></ItemGroup>
          </Project>
          EOF
          dotnet restore "$GITHUB_WORKSPACE/work/probe.csproj" --packages "$PACKAGES" --force --no-cache --nologo --use-lock-file
          cp "$GITHUB_WORKSPACE/work/probe.csproj" "$GITHUB_WORKSPACE/work/packages.lock.json" "$OUT/"
          cp -a "$PACKAGES/microsoft.aspnetcore.dataprotection/10.0.6" "$OUT/dataprotection"
          cp -a "$PACKAGES/microsoft.aspnetcore.cryptography.internal/10.0.6" "$OUT/cryptography-internal"
          dotnet --info > "$OUT/DOTNET_INFO.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload known-vulnerable control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dataprotection-known-vulnerable-control-10.0.6
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
