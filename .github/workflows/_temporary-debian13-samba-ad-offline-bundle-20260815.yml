name: Temporary Debian 13 Samba AD offline bundle

on:
  push:
    branches:
      - samba-debian13-bootstrap-20260815
    paths:
      - '.github/workflows/_temporary-debian13-samba-ad-offline-bundle-20260815.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download Debian 13 Samba AD package closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/debs export/evidence

          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/export:/out" \
            debian:13 \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --download-only \
                samba-ad-dc \
                samba-common-bin \
                samba-dsdb-modules \
                samba-vfs-modules \
                winbind \
                libnss-winbind \
                libpam-winbind \
                ldap-utils \
                krb5-user \
                dnsutils \
                ldb-tools

              cp -a /var/cache/apt/archives/*.deb /out/debs/
              apt-cache policy \
                samba-ad-dc samba-common-bin samba-dsdb-modules samba-vfs-modules \
                winbind libnss-winbind libpam-winbind ldap-utils krb5-user dnsutils ldb-tools \
                > /out/evidence/apt-policy.txt
            '

      - name: Build package manifest and archive
        shell: bash
        run: |
          set -euo pipefail
          count="$(find export/debs -maxdepth 1 -type f -name '*.deb' | wc -l)"
          test "$count" -gt 20

          : > export/evidence/deb-manifest.tsv
          while IFS= read -r deb; do
            package="$(dpkg-deb -f "$deb" Package)"
            version="$(dpkg-deb -f "$deb" Version)"
            architecture="$(dpkg-deb -f "$deb" Architecture)"
            size="$(stat -c '%s' "$deb")"
            printf '%s\t%s\t%s\t%s\t%s\n' "$package" "$version" "$architecture" "$size" "$(basename "$deb")" >> export/evidence/deb-manifest.tsv
          done < <(find export/debs -maxdepth 1 -type f -name '*.deb' | sort)

          find export/debs -maxdepth 1 -type f -name '*.deb' -print0 | sort -z | xargs -0 sha256sum > export/evidence/debs.sha256
          tar -C export -czf debian13-samba-ad-offline-debs.tar.gz debs
          mv debian13-samba-ad-offline-debs.tar.gz export/
          sha256sum export/debian13-samba-ad-offline-debs.tar.gz > export/evidence/archive.sha256
          rm -rf export/debs

          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "deb_count=${count}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > export/evidence/ci-provenance.txt

          find export -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | tee export/evidence/inventory.txt
          find export/evidence -type f -print0 | sort -z | xargs -0 sha256sum > export/evidence/SHA256SUMS.txt

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: debian13-samba-ad-offline-bundle
          path: export
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
