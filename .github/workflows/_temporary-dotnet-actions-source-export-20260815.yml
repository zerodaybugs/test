name: Temporary dotnet GitHub Actions Source Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-actions-source-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-actions-source-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repository:
          - dotnet/runtime
          - dotnet/aspnetcore

    steps:
      - name: Check out official repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repository }}
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Stage automation source and provenance
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ matrix.repository }}"
          NAME="${NAME//\//-}"
          OUT="$GITHUB_WORKSPACE/$NAME-actions"
          mkdir -p "$OUT"
          cp -a source/.github "$OUT/"
          git -C source rev-parse HEAD > "$OUT/OFFICIAL_COMMIT.txt"
          git -C source status --short > "$OUT/GIT_STATUS.txt"
          if test -d source/eng; then
            mkdir -p "$OUT/eng"
            find source/eng -maxdepth 3 -type f \( -name '*.ps1' -o -name '*.sh' -o -name '*.py' -o -name '*.yml' -o -name '*.yaml' \) -print0 |
              while IFS= read -r -d '' f; do
                rel="${f#source/}"
                mkdir -p "$OUT/$(dirname "$rel")"
                cp -a "$f" "$OUT/$rel"
              done
          fi
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$OUT"

      - name: Upload automation source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ replace(matrix.repository, '/', '-') }}-actions-source
          path: ${{ replace(matrix.repository, '/', '-') }}-actions
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
