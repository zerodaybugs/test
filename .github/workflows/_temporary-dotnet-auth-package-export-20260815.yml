name: Temporary .NET Authentication Package Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-auth-package-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-auth-package-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Restore exact package matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work export
          dotnet --info > export/DOTNET_INFO.txt

          restore_one() {
            local id="$1"
            local version="$2"
            local slug="$3"
            local dir="$PWD/work/$slug-$version"
            local packages="$PWD/work/packages-$slug-$version"
            mkdir -p "$dir" "$packages"
            cat > "$dir/probe.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestorePackagesPath>$packages</RestorePackagesPath>
              <RestoreIgnoreFailedSources>false</RestoreIgnoreFailedSources>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="$id" Version="$version" />
            </ItemGroup>
          </Project>
          EOF
            dotnet restore "$dir/probe.csproj" \
              --packages "$packages" \
              --force \
              --no-cache \
              --nologo \
              --use-lock-file
            mkdir -p "export/$slug/$version"
            cp "$dir/probe.csproj" "export/$slug/$version/"
            cp "$dir/packages.lock.json" "export/$slug/$version/"
            cp -a "$packages/${id,,}/$version/." "export/$slug/$version/package/"
          }

          restore_one Microsoft.AspNetCore.Authentication.Negotiate 10.0.9 negotiate
          restore_one Microsoft.AspNetCore.Authentication.Negotiate 10.0.10 negotiate
          restore_one System.DirectoryServices.Protocols 10.0.9 ldap
          restore_one System.DirectoryServices.Protocols 10.0.10 ldap

      - name: Produce deterministic fingerprints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/diff
          find export -type f -printf '%P\t%s\n' | sort > export/FILE_SIZES.txt

          fingerprint_tree() {
            local root="$1"
            local out="$2"
            (
              cd "$root"
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$out"
          }

          fingerprint_tree export/negotiate/10.0.9/package export/diff/negotiate-10.0.9.sha256
          fingerprint_tree export/negotiate/10.0.10/package export/diff/negotiate-10.0.10.sha256
          fingerprint_tree export/ldap/10.0.9/package export/diff/ldap-10.0.9.sha256
          fingerprint_tree export/ldap/10.0.10/package export/diff/ldap-10.0.10.sha256

          diff -u export/diff/negotiate-10.0.9.sha256 export/diff/negotiate-10.0.10.sha256 \
            > export/diff/negotiate-package.diff || true
          diff -u export/diff/ldap-10.0.9.sha256 export/diff/ldap-10.0.10.sha256 \
            > export/diff/ldap-package.diff || true

          for family in negotiate ldap; do
            for version in 10.0.9 10.0.10; do
              find "export/$family/$version/package" -type f -name '*.dll' -print0 \
                | while IFS= read -r -d '' dll; do
                    base="$(basename "$dll")"
                    strings -a -n 4 "$dll" | sort -u \
                      > "export/diff/${family}-${version}-${base}.strings.txt"
                  done
            done
          done

          diff -u \
            export/diff/negotiate-10.0.9-Microsoft.AspNetCore.Authentication.Negotiate.dll.strings.txt \
            export/diff/negotiate-10.0.10-Microsoft.AspNetCore.Authentication.Negotiate.dll.strings.txt \
            > export/diff/negotiate-assembly-strings.diff || true

          diff -u \
            export/diff/ldap-10.0.9-System.DirectoryServices.Protocols.dll.strings.txt \
            export/diff/ldap-10.0.10-System.DirectoryServices.Protocols.dll.strings.txt \
            > export/diff/ldap-assembly-strings.diff || true

          (
            cd export
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh export

      - name: Upload exact package export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-auth-packages-10.0.9-vs-10.0.10
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
