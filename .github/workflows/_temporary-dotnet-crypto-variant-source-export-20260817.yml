name: Temporary .NET Cryptography Variant Source Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-crypto-variant-source-export-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-crypto-variant-source-export-20260817
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current runtime source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/runtime
          ref: 6f4026d538b80b1f6f27bb190a05a16e983506af
          fetch-depth: 1
          persist-credentials: false
          path: current

      - name: Checkout supported runtime source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/runtime
          ref: v10.0.10
          fetch-depth: 1
          persist-credentials: false
          path: supported

      - name: Stage cryptographic trust-boundary sources
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          mkdir -p "$OUT/current" "$OUT/supported" "$OUT/meta"
          printf 'current=%s\n' "$(git -C current rev-parse HEAD)" > "$OUT/meta/COMMITS.txt"
          printf 'v10.0.10=%s\n' "$(git -C supported rev-parse HEAD)" >> "$OUT/meta/COMMITS.txt"

          paths=(
            src/libraries/System.Security.Cryptography.Algorithms
            src/libraries/System.Security.Cryptography.Cng
            src/libraries/System.Security.Cryptography.Csp
            src/libraries/System.Security.Cryptography.Encoding
            src/libraries/System.Security.Cryptography.OpenSsl
            src/libraries/System.Security.Cryptography.Pkcs
            src/libraries/System.Security.Cryptography.Primitives
            src/libraries/System.Security.Cryptography.ProtectedData
            src/libraries/System.Security.Cryptography.X509Certificates
            src/libraries/System.Security.Cryptography.Xml
            src/libraries/System.Formats.Asn1
            src/libraries/System.Net.Security
            src/libraries/System.Security.Claims
            src/libraries/System.Security.Principal.Windows
            src/libraries/System.Security.AccessControl
            src/libraries/System.Security.Permissions
            src/libraries/Common/src/System/Security/Cryptography
            src/libraries/Common/src/System/Formats/Asn1
            src/native/libs/System.Security.Cryptography.Native
          )

          for tree in current supported; do
            for rel in "${paths[@]}"; do
              if [[ -e "$tree/$rel" ]]; then
                mkdir -p "$OUT/$tree/$(dirname "$rel")"
                cp -a "$tree/$rel" "$OUT/$tree/$rel"
              fi
            done
          done

          find "$OUT" -type d \( -name bin -o -name obj -o -name artifacts -o -name node_modules \) -prune -exec rm -rf '{}' +
          diff -ruN "$OUT/supported" "$OUT/current" > "$OUT/meta/SUPPORTED_TO_CURRENT.diff" || true

          python3 - <<'PY'
          from pathlib import Path
          import csv
          import re

          root = Path('export')
          patterns = {
              'prefix_compare': re.compile(r'(?:SequenceEqual|FixedTimeEquals|CryptographicEquals)[^;\n]{0,180}(?:Slice|AsSpan|\[\.\.)\s*\(?(?:0\s*,)?[^\n;]*(?:Length|Count)', re.I),
              'length_from_attacker': re.compile(r'(?:signature|mac|tag|digest|hash|checksum)[^\n;]{0,160}(?:Length|Count)', re.I),
              'take_signature_length': re.compile(r'(?:Take|Slice|AsSpan)\s*\([^\)]*(?:signature|mac|tag)[^\)]*(?:Length|Count)', re.I),
              'memcmp': re.compile(r'\b(?:memcmp|CRYPTO_memcmp|FixedTimeEquals|SequenceEqual)\b'),
              'verify_hash': re.compile(r'\b(?:VerifyHash|VerifyData|VerifySignature|CheckSignature|CheckSignedInfo|ValidateSignature)\b'),
              'truncate': re.compile(r'\b(?:truncate|truncated|truncation|prefix|partial)\b', re.I),
              'empty_allowed': re.compile(r'(?:Length|Count)\s*(?:==|<=)\s*0|IsEmpty'),
              'asn_decode': re.compile(r'\b(?:AsnReader|ReadEncodedValue|ReadOctetString|ReadBitString|Decode)\b'),
          }
          rows=[]
          for tree in ('supported','current'):
            base=root/tree
            for p in base.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.cs','.c','.cpp','.h','.m'}:
                continue
              try: text=p.read_text(errors='replace')
              except OSError: continue
              for idx,line in enumerate(text.splitlines(),1):
                hits=[name for name,rx in patterns.items() if rx.search(line)]
                if hits:
                  score=(hits.count('prefix_compare')*80 + hits.count('take_signature_length')*70 +
                         hits.count('memcmp')*20 + hits.count('verify_hash')*25 +
                         hits.count('truncate')*15 + hits.count('empty_allowed')*10 +
                         hits.count('asn_decode')*5 + hits.count('length_from_attacker')*10)
                  rows.append({'tree':tree,'path':p.relative_to(base).as_posix(),'line':idx,'score':score,'hits':','.join(hits),'text':line.strip()[:500]})
          rows.sort(key=lambda r:(-r['score'],r['tree'],r['path'],r['line']))
          fields=['tree','path','line','score','hits','text']
          with (root/'meta'/'CRYPTO_PATTERN_INDEX.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          with (root/'meta'/'TOP_CRYPTO_CANDIDATES.md').open('w',encoding='utf-8') as f:
            f.write('# Cryptography variant-analysis candidates\n\nHeuristic only; every entry requires semantic review and a positive control.\n\n')
            f.write('| score | tree | path:line | hits | excerpt |\n|---:|---|---|---|---|\n')
            for r in rows[:250]:
              excerpt=r['text'].replace('|','\\|')
              f.write(f"| {r['score']} | {r['tree']} | `{r['path']}:{r['line']}` | {r['hits']} | `{excerpt}` |\n")
          PY

          find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/meta/FILE_SIZES.tsv"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          du -sh "$OUT"

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-crypto-variant-source-20260817
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
