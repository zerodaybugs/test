name: Temporary .NET 10 JIT Source Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-jit-source-export-20260815.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Export selected public .NET runtime source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse --branch release/10.0 https://github.com/dotnet/runtime.git runtime
          cd runtime
          git sparse-checkout set \
            src/coreclr/jit \
            src/coreclr/inc \
            src/tests/JIT/opt/ObjectStackAllocation \
            src/libraries/System.Private.CoreLib/src/System \
            src/coreclr/System.Private.CoreLib/src/System
          git rev-parse HEAD > ../RUNTIME_COMMIT.txt
          cd ..
          find runtime -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload source corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-runtime-release10-jit-source-20260815
          path: |
            runtime/src/coreclr/jit
            runtime/src/coreclr/inc
            runtime/src/tests/JIT/opt/ObjectStackAllocation
            runtime/src/libraries/System.Private.CoreLib/src/System
            runtime/src/coreclr/System.Private.CoreLib/src/System
            RUNTIME_COMMIT.txt
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 9
          include-hidden-files: true
