name: Temporary .NET 10.0.10 Instrumented JIT Build

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-runtime-jit-instrumented-build-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-runtime-jit-instrumented-build-20260815
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: checked
            configuration: Checked
            sanitizer: ""
          - flavor: asan
            configuration: Release
            sanitizer: address

    steps:
      - name: Check out exact official runtime release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dotnet/runtime
          ref: v10.0.10
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee OFFICIAL_COMMIT.txt
          git status --short | tee GIT_STATUS.txt

      - name: Build instrumented CoreCLR JIT
        shell: bash
        run: |
          set -euo pipefail
          args=(
            -subset clr
            -configuration "${{ matrix.configuration }}"
            -arch x64
            -ninja
          )
          if [[ -n "${{ matrix.sanitizer }}" ]]; then
            args+=( -fsanitize "${{ matrix.sanitizer }}" )
          fi
          ./build.sh "${args[@]}"

      - name: Stage JIT, symbols, sanitizer runtime and provenance
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="${{ matrix.configuration }}"
          SRC="artifacts/bin/coreclr/linux.x64.${CONFIG}"
          OUT="$GITHUB_WORKSPACE/out-${{ matrix.flavor }}"
          mkdir -p "$OUT"

          test -f "$SRC/libclrjit.so"
          cp -a "$SRC/libclrjit.so" "$OUT/"
          find "$SRC" -maxdepth 1 -type f \( -name 'libclrjit.so.dbg' -o -name 'libclrjit*.dwarf' -o -name 'libclrjit*.pdb' \) -exec cp -a {} "$OUT/" \;

          cp OFFICIAL_COMMIT.txt GIT_STATUS.txt "$OUT/"
          ./dotnet.sh --info > "$OUT/BOOTSTRAP_DOTNET_INFO.txt" 2>&1 || true
          ldd "$OUT/libclrjit.so" > "$OUT/LDD.txt" 2>&1 || true
          file "$OUT/libclrjit.so" > "$OUT/FILE.txt"
          readelf -n "$OUT/libclrjit.so" > "$OUT/ELF_NOTES.txt" 2>&1 || true

          if [[ "${{ matrix.flavor }}" == "asan" ]]; then
            while IFS= read -r candidate; do
              cp -a "$candidate" "$OUT/"
            done < <(find /usr /opt -type f -name 'libclang_rt.asan-x86_64.so' 2>/dev/null | sort -u)
          fi

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$OUT"
          find "$OUT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload generic instrumented JIT artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-runtime-v10.0.10-jit-${{ matrix.flavor }}-linux-x64
          path: out-${{ matrix.flavor }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-runtime-v10.0.10-jit-${{ matrix.flavor }}-build-logs
          path: artifacts/log
          retention-days: 1
          if-no-files-found: warn
          compression-level: 9
