name: Temporary .NET Runtime Source Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-runtime-source-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-runtime-source-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact official .NET runtime tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dotnet/runtime
          ref: v10.0.10
          fetch-depth: 1
          persist-credentials: false
          path: runtime

      - name: Stage security-relevant source subset
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/runtime-source"
          mkdir -p "$OUT/src/coreclr" "$OUT/src/libraries" "$OUT/src/tests/JIT/opt"
          cp -a runtime/src/coreclr/jit "$OUT/src/coreclr/"
          cp -a runtime/src/coreclr/vm "$OUT/src/coreclr/"
          cp -a runtime/src/coreclr/inc "$OUT/src/coreclr/"
          cp -a runtime/src/libraries/System.Private.CoreLib "$OUT/src/libraries/"
          cp -a runtime/src/tests/JIT/opt/ObjectStackAllocation "$OUT/src/tests/JIT/opt/"
          cp -a runtime/eng/native "$OUT/eng-native"
          git -C runtime rev-parse HEAD > "$OUT/OFFICIAL_COMMIT.txt"
          git -C runtime status --short > "$OUT/GIT_STATUS.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$OUT"

      - name: Upload official source subset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-runtime-v10.0.10-security-source
          path: runtime-source
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
