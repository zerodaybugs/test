name: Temporary .NET 10.0.302 bootstrap export

on:
  push:
    branches:
      - dotnet-bootstrap-10.0.302-20260815
    paths:
      - '.github/workflows/_temporary-dotnet-sdk-bootstrap-10.0.302-20260815.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Install isolated exact SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project export/evidence export/dotnet export/nuget
          curl --fail --silent --show-error --location https://dot.net/v1/dotnet-install.sh -o work/dotnet-install.sh
          sha256sum work/dotnet-install.sh | tee export/evidence/dotnet-install-script.sha256
          bash work/dotnet-install.sh \
            --version 10.0.302 \
            --install-dir "$PWD/export/dotnet" \
            --architecture x64 \
            --os linux \
            --no-path

          export DOTNET_ROOT="$PWD/export/dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          export NUGET_PACKAGES="$PWD/export/nuget"

          dotnet --info | tee export/evidence/dotnet-info.txt
          test -d "$DOTNET_ROOT/sdk/10.0.302"
          test -d "$DOTNET_ROOT/shared/Microsoft.NETCore.App/10.0.10"
          test -d "$DOTNET_ROOT/shared/Microsoft.AspNetCore.App/10.0.10"
          test "$(dotnet --version)" = "10.0.302"

      - name: Resolve exact Negotiate package in isolated cache
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_ROOT="$PWD/export/dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          export NUGET_PACKAGES="$PWD/export/nuget"

          cat > work/project/Bootstrap.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>
            </PropertyGroup>
            <ItemGroup>
              <FrameworkReference Include="Microsoft.AspNetCore.App" />
              <PackageReference Include="Microsoft.AspNetCore.Authentication.Negotiate" Version="10.0.10" />
            </ItemGroup>
          </Project>
          EOF

          dotnet restore work/project/Bootstrap.csproj --force-evaluate --verbosity normal 2>&1 | tee export/evidence/restore.log
          cp work/project/packages.lock.json export/evidence/

          grep -F 'Microsoft.AspNetCore.Authentication.Negotiate' work/project/packages.lock.json
          grep -F '10.0.10' work/project/packages.lock.json

          negotiate_dll="$(find "$NUGET_PACKAGES/microsoft.aspnetcore.authentication.negotiate/10.0.10" -type f -name 'Microsoft.AspNetCore.Authentication.Negotiate.dll' | sort | head -n 1)"
          protocols_dll="$(find "$NUGET_PACKAGES/system.directoryservices.protocols/10.0.10" -type f -name 'System.DirectoryServices.Protocols.dll' | sort | head -n 1)"
          test -n "$negotiate_dll"
          test -n "$protocols_dll"
          printf 'negotiate_dll=%s\nprotocols_dll=%s\n' "$negotiate_dll" "$protocols_dll" | tee export/evidence/package-layout.txt
          sha256sum "$negotiate_dll" "$protocols_dll" | tee export/evidence/package-dlls.sha256

      - name: Archive isolated SDK and exact package cache
        shell: bash
        run: |
          set -euo pipefail
          tar -C export -czf dotnet-sdk-10.0.302-linux-x64.tar.gz dotnet
          tar -C export -czf nuget-cache-net10-negotiate-10.0.10.tar.gz nuget

          mv dotnet-sdk-10.0.302-linux-x64.tar.gz export/
          mv nuget-cache-net10-negotiate-10.0.10.tar.gz export/

          sha256sum \
            export/dotnet-sdk-10.0.302-linux-x64.tar.gz \
            export/nuget-cache-net10-negotiate-10.0.10.tar.gz \
            | tee export/evidence/archive-files.sha256

          rm -rf export/dotnet export/nuget

          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > export/evidence/ci-provenance.txt

          find export -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | tee export/evidence/inventory.txt
          find export/evidence -type f -print0 | sort -z | xargs -0 sha256sum > export/evidence/SHA256SUMS.txt

      - name: Upload bootstrap bundle
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-linux-x64-bootstrap
          path: export
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
