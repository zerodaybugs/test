name: Temporary .NET 10.0.302 bootstrap export

on:
  push:
    branches:
      - dotnet-bootstrap-10.0.302-20260815
    paths:
      - '.github/workflows/_temporary-dotnet-sdk-bootstrap-10.0.302-20260815.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Install exact SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Resolve exact Negotiate package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project export/evidence
          cat > work/project/Bootstrap.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>
            </PropertyGroup>
            <ItemGroup>
              <FrameworkReference Include="Microsoft.AspNetCore.App" />
              <PackageReference Include="Microsoft.AspNetCore.Authentication.Negotiate" Version="10.0.10" />
            </ItemGroup>
          </Project>
          EOF
          dotnet --info | tee export/evidence/dotnet-info.txt
          dotnet restore work/project/Bootstrap.csproj --force-evaluate --verbosity normal 2>&1 | tee export/evidence/restore.log
          cp work/project/packages.lock.json export/evidence/
          grep -F 'Microsoft.AspNetCore.Authentication.Negotiate' work/project/packages.lock.json
          grep -F '10.0.10' work/project/packages.lock.json

      - name: Archive exact SDK and package cache
        shell: bash
        run: |
          set -euo pipefail
          dotnet_bin="$(readlink -f "$(command -v dotnet)")"
          dotnet_root="$(dirname "$dotnet_bin")"
          printf 'dotnet_bin=%s\ndotnet_root=%s\n' "$dotnet_bin" "$dotnet_root" | tee export/evidence/layout.txt

          test -d "$dotnet_root/sdk/10.0.302"
          test -d "$dotnet_root/shared/Microsoft.NETCore.App/10.0.10"
          test -d "$dotnet_root/shared/Microsoft.AspNetCore.App/10.0.10"
          test -f "$dotnet_root/shared/Microsoft.AspNetCore.App/10.0.10/Microsoft.AspNetCore.Authentication.Negotiate.dll"

          tar -C "$dotnet_root" -czf export/dotnet-sdk-10.0.302-linux-x64.tar.gz .

          package_root="$HOME/.nuget/packages"
          mkdir -p export/nuget-cache
          while IFS= read -r package_dir; do
            relative="${package_dir#${package_root}/}"
            mkdir -p "export/nuget-cache/$(dirname "$relative")"
            cp -a "$package_dir" "export/nuget-cache/$relative"
          done < <(find "$package_root" -mindepth 2 -maxdepth 2 -type d | sort)
          tar -C export -czf export/nuget-cache-net10-negotiate-10.0.10.tar.gz nuget-cache
          rm -rf export/nuget-cache

          sha256sum \
            export/dotnet-sdk-10.0.302-linux-x64.tar.gz \
            export/nuget-cache-net10-negotiate-10.0.10.tar.gz \
            "$dotnet_root/shared/Microsoft.AspNetCore.App/10.0.10/Microsoft.AspNetCore.Authentication.Negotiate.dll" \
            > export/evidence/SHA256SUMS.txt
          find export -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | tee export/evidence/inventory.txt

      - name: Upload bootstrap bundle
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-linux-x64-bootstrap
          path: export
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
