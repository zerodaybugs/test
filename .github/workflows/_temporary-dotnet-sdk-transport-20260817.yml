name: Temporary official .NET SDK transport

on:
  push:
    branches:
      - msrc-identitymodel-source-20260817
    paths:
      - .github/workflows/_temporary-dotnet-sdk-transport-20260817.yml

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact official SDK archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          url='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.302/dotnet-sdk-10.0.302-linux-x64.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors "$url" -o artifact/dotnet-sdk-10.0.302-linux-x64.tar.gz
          test -s artifact/dotnet-sdk-10.0.302-linux-x64.tar.gz
          sha512sum artifact/dotnet-sdk-10.0.302-linux-x64.tar.gz > artifact/SHA512SUMS.txt
          printf 'SOURCE=%s\nSDK_VERSION=10.0.302\n' "$url" > artifact/PROVENANCE.env
      - name: Upload SDK transport artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-dotnet-sdk-10.0.302-linux-x64
          path: artifact
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
