name: Temporary Supported .NET Authentication Matrix Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-supported-auth-matrix-export-20260816.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.129
            9.0.316
            10.0.302
          cache: false

      - name: Restore exact supported package matrix
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          WORK="$GITHUB_WORKSPACE/work"
          mkdir -p "$OUT/packages" "$OUT/runtime" "$WORK"
          dotnet --info > "$OUT/DOTNET_INFO.txt"
          dotnet --list-sdks > "$OUT/DOTNET_SDKS.txt"
          dotnet --list-runtimes > "$OUT/DOTNET_RUNTIMES.txt"

          restore_pair() {
            local tfm="$1"
            local neg="$2"
            local ldap="$3"
            local slug="$4"
            local dir="$WORK/$slug"
            local packages="$WORK/packages-$slug"
            mkdir -p "$dir" "$packages"
            cat > "$dir/probe.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>$tfm</TargetFramework>
              <RestorePackagesPath>$packages</RestorePackagesPath>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.Authentication.Negotiate" Version="$neg" />
              <PackageReference Include="System.DirectoryServices.Protocols" Version="$ldap" />
            </ItemGroup>
          </Project>
          EOF
            dotnet restore "$dir/probe.csproj" --packages "$packages" --force --no-cache --nologo --use-lock-file
            mkdir -p "$OUT/packages/$slug"
            cp "$dir/probe.csproj" "$dir/packages.lock.json" "$OUT/packages/$slug/"
            cp -a "$packages/microsoft.aspnetcore.authentication.negotiate/$neg" "$OUT/packages/$slug/negotiate"
            cp -a "$packages/system.directoryservices.protocols/$ldap" "$OUT/packages/$slug/ldap"
          }

          restore_pair net8.0 8.0.29 8.0.29 net8
          restore_pair net9.0 9.0.18 9.0.18 net9
          restore_pair net10.0 10.0.10 10.0.10 net10

          ROOT="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")") }"
          ROOT="${ROOT% }"
          cp "$ROOT/dotnet" "$OUT/runtime/"
          cp -a "$ROOT/host" "$OUT/runtime/"
          mkdir -p "$OUT/runtime/shared/Microsoft.NETCore.App" "$OUT/runtime/shared/Microsoft.AspNetCore.App"
          for v in 8.0.29 9.0.18 10.0.10; do
            cp -a "$ROOT/shared/Microsoft.NETCore.App/$v" "$OUT/runtime/shared/Microsoft.NETCore.App/"
            cp -a "$ROOT/shared/Microsoft.AspNetCore.App/$v" "$OUT/runtime/shared/Microsoft.AspNetCore.App/"
          done

          find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/FILE_SIZES.tsv"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          du -sh "$OUT"

      - name: Upload supported matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-supported-negotiate-matrix-8.0.29-9.0.18-10.0.10
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
