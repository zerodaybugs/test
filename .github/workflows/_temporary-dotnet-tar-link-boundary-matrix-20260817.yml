name: Temporary .NET Tar Link Boundary Matrix

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-tar-link-boundary-matrix-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-tar-link-boundary-matrix-20260817
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install patched-baseline and current runtime lines
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.302
            10.0.303
          cache: false

      - name: Verify exact versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet --info > evidence/DOTNET_INFO.txt
          dotnet --list-runtimes > evidence/DOTNET_RUNTIMES.txt
          grep -F 'Microsoft.NETCore.App 10.0.10 ' evidence/DOTNET_RUNTIMES.txt
          grep -F 'Microsoft.NETCore.App 10.0.11 ' evidence/DOTNET_RUNTIMES.txt

      - name: Build safe local Tar extraction harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness
          cat > harness/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <Optimize>true</Optimize>
              <Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
            </PropertyGroup>
          </Project>
          EOF

          cat > harness/Program.cs <<'EOF'
          using System.Formats.Tar;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Text.Json;

          var results = new List<object>();
          string[] scenarios =
          [
              "destination_root_symlink_control",
              "direct_parent_traversal",
              "direct_absolute_path",
              "symlink_absolute_then_file",
              "symlink_parent_then_file",
              "symlink_dotdot_normalized_then_file",
              "symlink_inside_dangling_then_file",
              "symlink_chain_parent_then_file",
              "symlink_dot_chain_then_file",
              "symlink_loop_then_file",
              "hardlink_absolute",
              "hardlink_parent",
              "hardlink_to_archive_symlink",
              "directory_then_symlink_parent_then_file",
              "target_then_symlink_inside_then_file",
              "deep_chain_parent_then_file",
              "double_separator_parent_then_file",
              "dot_prefixed_parent_then_file",
          ];

          foreach (string scenario in scenarios)
          {
              results.Add(RunScenario(scenario));
          }

          Console.WriteLine(JsonSerializer.Serialize(new
          {
              framework = RuntimeInformation.FrameworkDescription,
              os = RuntimeInformation.OSDescription,
              results,
          }, new JsonSerializerOptions { WriteIndented = true }));
          return 0;

          static object RunScenario(string scenario)
          {
              string root = Path.Combine(Path.GetTempPath(), "dotnet-tar-boundary", Guid.NewGuid().ToString("N"));
              string logicalDestination = Path.Combine(root, "dest");
              string actualDestination = logicalDestination;
              string outside = Path.Combine(root, "outside");
              string archive = Path.Combine(root, "attack.tar");
              Directory.CreateDirectory(root);
              Directory.CreateDirectory(outside);

              string? setupException = null;
              string? extractionException = null;
              bool extractionCompleted = false;
              try
              {
                  if (scenario == "destination_root_symlink_control")
                  {
                      string physical = Path.Combine(root, "physical-destination-name-longer-than-logical-dest");
                      Directory.CreateDirectory(physical);
                      Directory.CreateSymbolicLink(logicalDestination, physical);
                  }
                  else
                  {
                      Directory.CreateDirectory(logicalDestination);
                  }

                  using (FileStream stream = File.Create(archive))
                  using (var writer = new TarWriter(stream, TarEntryFormat.Pax, leaveOpen: false))
                  {
                      switch (scenario)
                      {
                          case "destination_root_symlink_control":
                              WriteFile(writer, "file.txt", "control");
                              break;
                          case "direct_parent_traversal":
                              WriteFile(writer, "../outside/pwn.txt", "pwn");
                              break;
                          case "direct_absolute_path":
                              WriteFile(writer, Path.Combine(outside, "pwn.txt"), "pwn");
                              break;
                          case "symlink_absolute_then_file":
                              WriteLink(writer, "link", outside);
                              WriteFile(writer, "link/pwn.txt", "pwn");
                              break;
                          case "symlink_parent_then_file":
                              WriteLink(writer, "link", "../outside");
                              WriteFile(writer, "link/pwn.txt", "pwn");
                              break;
                          case "symlink_dotdot_normalized_then_file":
                              WriteLink(writer, "link", "inside/../../outside");
                              WriteFile(writer, "link/pwn.txt", "pwn");
                              break;
                          case "symlink_inside_dangling_then_file":
                              WriteLink(writer, "link", "inside/target");
                              WriteFile(writer, "link/pwn.txt", "pwn");
                              break;
                          case "symlink_chain_parent_then_file":
                              WriteLink(writer, "a", "b");
                              WriteLink(writer, "b", "../outside");
                              WriteFile(writer, "a/pwn.txt", "pwn");
                              break;
                          case "symlink_dot_chain_then_file":
                              WriteDirectory(writer, "a/");
                              WriteLink(writer, "a/b", ".");
                              WriteLink(writer, "a/b/c", ".");
                              WriteLink(writer, "a/b/c/d", "../../outside");
                              WriteFile(writer, "a/d/pwn.txt", "pwn");
                              break;
                          case "symlink_loop_then_file":
                              WriteLink(writer, "a", "b");
                              WriteLink(writer, "b", "a");
                              WriteFile(writer, "a/pwn.txt", "pwn");
                              break;
                          case "hardlink_absolute":
                              WriteHardLink(writer, "hard", Path.Combine(outside, "target.txt"));
                              break;
                          case "hardlink_parent":
                              WriteHardLink(writer, "hard", "../outside/target.txt");
                              break;
                          case "hardlink_to_archive_symlink":
                              WriteLink(writer, "alias", "../outside");
                              WriteHardLink(writer, "hard", "alias/target.txt");
                              break;
                          case "directory_then_symlink_parent_then_file":
                              WriteDirectory(writer, "dir/");
                              WriteLink(writer, "dir/link", "../../outside");
                              WriteFile(writer, "dir/link/pwn.txt", "pwn");
                              break;
                          case "target_then_symlink_inside_then_file":
                              WriteDirectory(writer, "inside/");
                              WriteLink(writer, "link", "inside");
                              WriteFile(writer, "link/pwn.txt", "inside-only");
                              break;
                          case "deep_chain_parent_then_file":
                              WriteDirectory(writer, "d/");
                              WriteLink(writer, "d/a", "b");
                              WriteLink(writer, "d/b", "c");
                              WriteLink(writer, "d/c", "../../outside");
                              WriteFile(writer, "d/a/pwn.txt", "pwn");
                              break;
                          case "double_separator_parent_then_file":
                              WriteLink(writer, "link", "..//outside");
                              WriteFile(writer, "link/pwn.txt", "pwn");
                              break;
                          case "dot_prefixed_parent_then_file":
                              WriteLink(writer, "link", "./../outside");
                              WriteFile(writer, "link/pwn.txt", "pwn");
                              break;
                      }
                  }
              }
              catch (Exception ex)
              {
                  setupException = ex.GetType().FullName + ": " + ex.Message;
              }

              if (setupException is null)
              {
                  try
                  {
                      TarFile.ExtractToDirectory(archive, actualDestination, overwriteFiles: true);
                      extractionCompleted = true;
                  }
                  catch (Exception ex)
                  {
                      extractionException = ex.GetType().FullName + ": " + ex.Message;
                  }
              }

              string[] outsideFiles = Directory.Exists(outside)
                  ? Directory.GetFiles(outside, "*", SearchOption.AllDirectories)
                  : [];
              bool outsideWritten = outsideFiles.Length != 0;
              string[] destinationFiles = Directory.Exists(actualDestination)
                  ? Directory.GetFiles(actualDestination, "*", SearchOption.AllDirectories)
                  : [];

              var result = new
              {
                  scenario,
                  setupException,
                  extractionException,
                  extractionCompleted,
                  outsideWritten,
                  outsideFiles,
                  destinationFiles,
              };

              try { Directory.Delete(root, recursive: true); } catch { }
              return result;
          }

          static void WriteDirectory(TarWriter writer, string name)
              => writer.WriteEntry(new PaxTarEntry(TarEntryType.Directory, name));

          static void WriteLink(TarWriter writer, string name, string target)
              => writer.WriteEntry(new PaxTarEntry(TarEntryType.SymbolicLink, name) { LinkName = target });

          static void WriteHardLink(TarWriter writer, string name, string target)
              => writer.WriteEntry(new PaxTarEntry(TarEntryType.HardLink, name) { LinkName = target });

          static void WriteFile(TarWriter writer, string name, string content)
          {
              var entry = new PaxTarEntry(TarEntryType.RegularFile, name)
              {
                  DataStream = new MemoryStream(Encoding.UTF8.GetBytes(content), writable: false),
              };
              writer.WriteEntry(entry);
          }
          EOF

          dotnet publish harness/harness.csproj -c Release -o harness/out --nologo
          cp harness/Program.cs harness/harness.csproj evidence/

      - name: Run repeated runtime differential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runs
          for runtime in 10.0.10 10.0.11; do
            for repeat in 1 2 3 4 5; do
              dotnet exec --fx-version "$runtime" harness/out/harness.dll \
                > "evidence/runs/${runtime}-repeat-${repeat}.json"
            done
          done

          python3 - <<'PY'
          from pathlib import Path
          import json

          runs={}
          for path in sorted(Path('evidence/runs').glob('*.json')):
              data=json.loads(path.read_text())
              runtime=data['framework'].split()[-1]
              runs.setdefault(runtime,[]).append({'file':path.name,'data':data})

          def by_name(run,name):
              return next(item for item in run['data']['results'] if item['scenario']==name)

          baseline=runs.get('10.0.10',[])
          current=runs.get('10.0.11',[])
          control_detected=bool(baseline) and all(
              (by_name(run,'destination_root_symlink_control')['extractionException'] or '').startswith('System.ArgumentOutOfRangeException')
              for run in baseline)
          control_fixed=bool(current) and all(
              not (by_name(run,'destination_root_symlink_control')['extractionException'] or '').startswith('System.ArgumentOutOfRangeException')
              for run in current)
          current_escapes=[]
          for run in current:
              for item in run['data']['results']:
                  if item['scenario']!='destination_root_symlink_control' and item['outsideWritten']:
                      current_escapes.append({'run':run['file'],'scenario':item['scenario'],'result':item})

          deterministic=True
          if current:
              reference={item['scenario']:(item['setupException'],item['extractionException'],item['extractionCompleted'],item['outsideWritten']) for item in current[0]['data']['results']}
              for run in current[1:]:
                  observed={item['scenario']:(item['setupException'],item['extractionException'],item['extractionCompleted'],item['outsideWritten']) for item in run['data']['results']}
                  deterministic &= observed==reference

          if not control_detected:
              verdict='HARNESS_NOT_SENSITIVE_KILL'
          elif current_escapes:
              verdict='CURRENT_RELEASE_RAW_TAR_ESCAPE_CANDIDATE'
          elif control_fixed and deterministic:
              verdict='PUBLIC_REGRESSION_DETECTED_CURRENT_RELEASE_NO_ESCAPE'
          else:
              verdict='INCONCLUSIVE_MATRIX'

          gate={
              'schema':'dotnet_tar_link_boundary_matrix/v1',
              'baseline_control_detected':control_detected,
              'current_control_fixed':control_fixed,
              'current_deterministic':deterministic,
              'current_escapes':current_escapes,
              'verdict':verdict,
              'submission_ready':False,
              'runs':runs,
          }
          Path('evidence/GATE.json').write_text(json.dumps(gate,indent=2))
          Path('evidence/VERDICT.env').write_text(
              f'VERDICT={verdict}\nSUBMISSION_READY=0\nCONTROL_DETECTED={int(control_detected)}\n'
              f'CONTROL_FIXED={int(control_fixed)}\nDETERMINISTIC={int(deterministic)}\n'
              f'CURRENT_ESCAPE_COUNT={len(current_escapes)}\n')
          print(Path('evidence/VERDICT.env').read_text())
          if not control_detected:
              raise SystemExit(90)
          PY
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload Tar boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-tar-link-boundary-matrix-20260817
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
