name: Temporary .NET GitHub Actions Trust Boundary Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-workflow-trust-boundary-export-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-workflow-trust-boundary-export-20260817
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact dotnet/runtime snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/runtime
          ref: 6f4026d538b80b1f6f27bb190a05a16e983506af
          fetch-depth: 1
          persist-credentials: false
          path: runtime

      - name: Checkout exact dotnet/aspnetcore snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dotnet/aspnetcore
          ref: 1b3defefc0818bbf845a7dfc0aec6559c001d60f
          fetch-depth: 1
          persist-credentials: false
          path: aspnetcore

      - name: Stage workflow security surface and static index
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          mkdir -p "$OUT/runtime" "$OUT/aspnetcore" "$OUT/meta"

          printf 'dotnet/runtime=%s\n' "$(git -C runtime rev-parse HEAD)" > "$OUT/meta/COMMITS.txt"
          printf 'dotnet/aspnetcore=%s\n' "$(git -C aspnetcore rev-parse HEAD)" >> "$OUT/meta/COMMITS.txt"

          for repo in runtime aspnetcore; do
            for rel in .github eng/pipelines eng/common; do
              if [[ -e "$repo/$rel" ]]; then
                mkdir -p "$OUT/$repo/$(dirname "$rel")"
                cp -a "$repo/$rel" "$OUT/$repo/$rel"
              fi
            done
          done

          python3 - <<'PY'
          from pathlib import Path
          import csv
          import re

          root = Path('export')
          rows = []
          patterns = {
              'trigger_pull_request_target': re.compile(r'(?m)^\s*pull_request_target\s*:'),
              'trigger_issue_comment': re.compile(r'(?m)^\s*issue_comment\s*:'),
              'trigger_workflow_run': re.compile(r'(?m)^\s*workflow_run\s*:'),
              'trigger_workflow_dispatch': re.compile(r'(?m)^\s*workflow_dispatch\s*:'),
              'write_permission': re.compile(r'(?im)^\s*(?:contents|pull-requests|issues|actions|checks|packages|id-token)\s*:\s*write\s*$'),
              'secrets_reference': re.compile(r'\$\{\{\s*secrets\.'),
              'github_token_reference': re.compile(r'\$\{\{\s*(?:secrets\.)?GITHUB_TOKEN\s*\}\}', re.I),
              'checkout_action': re.compile(r'uses\s*:\s*actions/checkout@'),
              'checkout_ref_expression': re.compile(r'(?im)^\s*ref\s*:\s*.*\$\{\{'),
              'checkout_repository_expression': re.compile(r'(?im)^\s*repository\s*:\s*.*\$\{\{'),
              'persist_credentials_true': re.compile(r'(?im)^\s*persist-credentials\s*:\s*(?:true|["\']true["\'])\s*$'),
              'pr_head_sha': re.compile(r'github\.event\.pull_request\.head\.(?:sha|ref|repo)'),
              'comment_body': re.compile(r'github\.event\.comment\.body'),
              'issue_title_body': re.compile(r'github\.event\.(?:issue|pull_request)\.(?:title|body)'),
              'shell_expression': re.compile(r'(?s)run\s*:\s*[|>][-+]?\s*.*?\$\{\{\s*github\.event\.'),
              'gh_pr_checkout': re.compile(r'\bgh\s+pr\s+checkout\b'),
              'git_checkout_expression': re.compile(r'\bgit\s+(?:checkout|fetch)\b.*\$\{\{'),
              'curl_pipe_shell': re.compile(r'\bcurl\b[^\n|]*\|\s*(?:bash|sh|pwsh)'),
              'self_hosted_runner': re.compile(r'(?im)^\s*runs-on\s*:\s*.*self-hosted'),
              'oidc_permission': re.compile(r'(?im)^\s*id-token\s*:\s*write\s*$'),
          }

          for repo_dir in [root / 'runtime', root / 'aspnetcore']:
              for path in repo_dir.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.yml', '.yaml', '.md', '.ps1', '.sh', '.py', '.js', '.ts'}:
                      continue
                  try:
                      text = path.read_text(errors='replace')
                  except OSError:
                      continue
                  hits = {name: bool(regex.search(text)) for name, regex in patterns.items()}
                  if any(hits.values()):
                      score = (
                          hits['trigger_pull_request_target'] * 70 +
                          hits['trigger_issue_comment'] * 50 +
                          hits['trigger_workflow_run'] * 35 +
                          hits['write_permission'] * 30 +
                          hits['secrets_reference'] * 30 +
                          hits['oidc_permission'] * 40 +
                          hits['checkout_ref_expression'] * 35 +
                          hits['checkout_repository_expression'] * 40 +
                          hits['pr_head_sha'] * 25 +
                          hits['comment_body'] * 20 +
                          hits['shell_expression'] * 40 +
                          hits['gh_pr_checkout'] * 35 +
                          hits['git_checkout_expression'] * 35 +
                          hits['persist_credentials_true'] * 15 +
                          hits['self_hosted_runner'] * 35 +
                          hits['curl_pipe_shell'] * 20
                      )
                      rows.append({
                          'repository': repo_dir.name,
                          'path': path.relative_to(repo_dir).as_posix(),
                          'score': score,
                          **{k: int(v) for k, v in hits.items()},
                      })

          rows.sort(key=lambda row: (-row['score'], row['repository'], row['path']))
          fieldnames = ['repository', 'path', 'score', *patterns.keys()]
          with (root / 'meta' / 'STATIC_INDEX.csv').open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          with (root / 'meta' / 'TOP_CANDIDATES.md').open('w', encoding='utf-8') as f:
              f.write('# Static workflow trust-boundary candidates\n\n')
              f.write('Heuristic index only. A hit is not a vulnerability.\n\n')
              f.write('| score | repository | path | high-signal flags |\n|---:|---|---|---|\n')
              for row in rows[:100]:
                  flags = ', '.join(k for k in patterns if row[k])
                  f.write(f"| {row['score']} | {row['repository']} | `{row['path']}` | {flags} |\n")
          PY

          find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/meta/FILE_SIZES.tsv"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          du -sh "$OUT"

      - name: Upload exact trust-boundary snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-github-actions-trust-boundary-20260817
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
