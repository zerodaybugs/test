name: Temporary .NET X509 NameInfo Type Matrix

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-x509-nameinfo-type-matrix-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-x509-nameinfo-type-matrix-20260817
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Install vulnerable, patched, and current SDK/runtime lines
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.301
            10.0.302
            10.0.303
          cache: false

      - name: Verify exact runtime matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet --info > evidence/DOTNET_INFO.txt
          dotnet --list-sdks > evidence/DOTNET_SDKS.txt
          dotnet --list-runtimes > evidence/DOTNET_RUNTIMES.txt
          grep -E '^Microsoft\.NETCore\.App 10\.0\.9 ' evidence/DOTNET_RUNTIMES.txt
          grep -E '^Microsoft\.NETCore\.App 10\.0\.10 ' evidence/DOTNET_RUNTIMES.txt
          grep -E '^Microsoft\.NETCore\.App 10\.0\.11 ' evidence/DOTNET_RUNTIMES.txt

      - name: Generate exact ASN.1 otherName corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus evidence/cert-generation

          cat > generate.py <<'PY'
          from pathlib import Path
          import json
          import subprocess

          oid_upn = '1.3.6.1.4.1.311.20.2.3'
          oid_other = '1.3.6.1.4.1.311.20.2.99'
          cases = {
              'upn_utf8_valid': f'otherName:{oid_upn};UTF8:alice@example.com',
              'upn_boolean_true': f'otherName:{oid_upn};BOOLEAN:TRUE',
              'upn_boolean_false': f'otherName:{oid_upn};BOOLEAN:FALSE',
              'upn_integer_zero': f'otherName:{oid_upn};INTEGER:0',
              'upn_integer_positive': f'otherName:{oid_upn};INTEGER:42',
              'upn_integer_negative': f'otherName:{oid_upn};INTEGER:-1',
              'upn_null': f'otherName:{oid_upn};NULL:',
              'upn_octet_empty': f'otherName:{oid_upn};OCTETSTRING:',
              'upn_octet_data': f'otherName:{oid_upn};OCTETSTRING:attacker',
              'upn_bitstring': f'otherName:{oid_upn};BITSTRING:10101010',
              'upn_oid': f'otherName:{oid_upn};OID:1.2.3.4.5',
              'upn_enumerated': f'otherName:{oid_upn};ENUMERATED:2',
              'upn_ia5': f'otherName:{oid_upn};IA5:alice@example.com',
              'upn_printable': f'otherName:{oid_upn};PRINTABLE:alice',
              'upn_numeric': f'otherName:{oid_upn};NUMERIC:123456',
              'upn_t61': f'otherName:{oid_upn};T61:alice',
              'upn_visible': f'otherName:{oid_upn};VISIBLE:alice',
              'upn_general': f'otherName:{oid_upn};GENERAL:alice',
              'upn_bmp': f'otherName:{oid_upn};BMP:alice',
              'upn_universal': f'otherName:{oid_upn};UNIVERSAL:alice',
              'upn_utctime': f'otherName:{oid_upn};UTCTIME:260817000000Z',
              'upn_generalizedtime': f'otherName:{oid_upn};GENERALIZEDTIME:20260817000000Z',
              'upn_sequence': f'otherName:{oid_upn};SEQUENCE:seq_section',
              'upn_set': f'otherName:{oid_upn};SET:set_section',
              'other_oid_boolean': f'otherName:{oid_other};BOOLEAN:TRUE',
              'other_oid_integer': f'otherName:{oid_other};INTEGER:42',
              'other_oid_sequence': f'otherName:{oid_other};SEQUENCE:seq_section',
              'mixed_other_then_upn_boolean': f'otherName:{oid_other};UTF8:safe,otherName:{oid_upn};BOOLEAN:TRUE',
              'mixed_upn_boolean_then_dns': f'otherName:{oid_upn};BOOLEAN:TRUE,DNS:example.test',
              'mixed_dns_then_upn_boolean': f'DNS:example.test,otherName:{oid_upn};BOOLEAN:TRUE',
              'mixed_valid_then_invalid_upn': f'otherName:{oid_upn};UTF8:valid@example.com,otherName:{oid_upn};BOOLEAN:TRUE',
              'mixed_invalid_then_valid_upn': f'otherName:{oid_upn};BOOLEAN:TRUE,otherName:{oid_upn};UTF8:valid@example.com',
              'issuer_upn_boolean': f'otherName:{oid_upn};BOOLEAN:TRUE',
              'issuer_upn_integer': f'otherName:{oid_upn};INTEGER:42',
              'issuer_upn_utf8': f'otherName:{oid_upn};UTF8:issuer@example.com',
          }

          generated=[]
          failures=[]
          for name, san in cases.items():
              d=Path('corpus')/name
              d.mkdir(parents=True, exist_ok=True)
              extension_name = 'issuerAltName' if name.startswith('issuer_') else 'subjectAltName'
              config=f'''[ req ]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [ dn ]
          CN = {name}.example
          [ ext ]
          basicConstraints = CA:FALSE
          keyUsage = digitalSignature
          {extension_name} = {san}
          [ seq_section ]
          field1 = UTF8:inside-sequence
          field2 = INTEGER:7
          [ set_section ]
          field1 = UTF8:inside-set
          field2 = INTEGER:8
          '''
              (d/'openssl.cnf').write_text(config)
              cmd=['openssl','req','-new','-x509','-newkey','rsa:1024','-nodes','-days','2',
                   '-config',str(d/'openssl.cnf'),'-keyout',str(d/'key.pem'),'-out',str(d/'cert.pem')]
              proc=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              (d/'openssl.stdout').write_text(proc.stdout)
              (d/'openssl.stderr').write_text(proc.stderr)
              if proc.returncode != 0:
                  failures.append({'name':name,'returncode':proc.returncode,'stderr':proc.stderr[-1000:]})
                  continue
              proc2=subprocess.run(['openssl','x509','-in',str(d/'cert.pem'),'-outform','der','-out',str(d/'cert.der')],
                                   stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              if proc2.returncode != 0:
                  failures.append({'name':name,'returncode':proc2.returncode,'stderr':proc2.stderr[-1000:]})
                  continue
              generated.append({'name':name,'extension':extension_name,'san':san,'size':(d/'cert.der').stat().st_size})

          Path('evidence/cert-generation/generated.json').write_text(json.dumps(generated,indent=2))
          Path('evidence/cert-generation/failures.json').write_text(json.dumps(failures,indent=2))
          if failures:
              raise SystemExit(f'certificate generation failures: {failures}')
          PY

          python3 generate.py
          find corpus -name cert.der -type f -print | sort > evidence/CORPUS_FILES.txt
          test "$(wc -l < evidence/CORPUS_FILES.txt)" -ge 30

      - name: Build process-isolated GetNameInfo harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness
          cat > harness/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <Optimize>true</Optimize>
              <Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
            </PropertyGroup>
          </Project>
          EOF
          cat > harness/Program.cs <<'EOF'
          using System.Runtime.InteropServices;
          using System.Security.Cryptography.X509Certificates;
          using System.Text;
          using System.Text.Json;

          if (args.Length != 1)
          {
              Console.Error.WriteLine("usage: harness CERT.der");
              return 64;
          }

          string path = args[0];
          var output = new Dictionary<string, object?>
          {
              ["framework"] = RuntimeInformation.FrameworkDescription,
              ["os"] = RuntimeInformation.OSDescription,
              ["certificate"] = path,
          };

          try
          {
              using X509Certificate2 cert = X509CertificateLoader.LoadCertificateFromFile(path);
              output["loaded"] = true;
              var values = new Dictionary<string, object?>();
              foreach (bool issuer in new[] { false, true })
              {
                  foreach (X509NameType type in Enum.GetValues<X509NameType>())
                  {
                      string key = $"{(issuer ? "issuer" : "subject")}:{type}";
                      try
                      {
                          string value = cert.GetNameInfo(type, issuer);
                          values[key] = new
                          {
                              utf8_base64 = Convert.ToBase64String(Encoding.UTF8.GetBytes(value)),
                              length = value.Length,
                          };
                      }
                      catch (Exception ex)
                      {
                          values[key] = new { exception = ex.GetType().FullName, message = ex.Message };
                      }
                  }
              }
              output["values"] = values;
              output["completed"] = true;
              Console.WriteLine(JsonSerializer.Serialize(output));
              return 0;
          }
          catch (Exception ex)
          {
              output["loaded"] = false;
              output["exception"] = ex.GetType().FullName;
              output["message"] = ex.Message;
              Console.WriteLine(JsonSerializer.Serialize(output));
              return 70;
          }
          EOF
          dotnet publish harness/harness.csproj -c Release -o harness/out --nologo
          cp harness/Program.cs harness/harness.csproj evidence/

      - name: Run vulnerable, patched, and current process matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runs
          : > evidence/MATRIX.tsv
          printf 'runtime\tcase\texit_code\tsignal\tcompleted\tlog\n' >> evidence/MATRIX.tsv

          for runtime in 10.0.9 10.0.10 10.0.11; do
            mkdir -p "evidence/runs/$runtime"
            while IFS= read -r cert; do
              case_name="$(basename "$(dirname "$cert")")"
              log="evidence/runs/$runtime/$case_name.log"
              set +e
              timeout --signal=KILL 12s dotnet exec --fx-version "$runtime" harness/out/harness.dll "$cert" > "$log" 2>&1
              rc=$?
              set -e
              signal=0
              if [[ "$rc" -ge 128 ]]; then signal="$((rc-128))"; fi
              completed=0
              grep -q '"completed":true' "$log" && completed=1 || true
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$runtime" "$case_name" "$rc" "$signal" "$completed" "$log" >> evidence/MATRIX.tsv
            done < evidence/CORPUS_FILES.txt
          done

          python3 - <<'PY'
          from pathlib import Path
          import csv, json
          rows=list(csv.DictReader(Path('evidence/MATRIX.tsv').open(),delimiter='\t'))
          for row in rows:
              for key in ('exit_code','signal','completed'):
                  row[key]=int(row[key])

          def row(runtime,case):
              return next((r for r in rows if r['runtime']==runtime and r['case']==case),None)

          known=row('10.0.9','upn_boolean_true')
          positive_control = known is not None and (known['exit_code'] != 0 or known['completed'] != 1)
          patched_complete = all(r['exit_code']==0 and r['completed']==1 for r in rows if r['runtime']=='10.0.10')
          current_complete = all(r['exit_code']==0 and r['completed']==1 for r in rows if r['runtime']=='10.0.11')
          current_failures=[r for r in rows if r['runtime']=='10.0.11' and (r['exit_code']!=0 or r['completed']!=1)]

          if not positive_control:
              verdict='HARNESS_NOT_SENSITIVE_KILL'
          elif current_failures:
              verdict='CURRENT_RELEASE_RAW_X509_CANDIDATE'
          elif patched_complete and current_complete:
              verdict='KNOWN_CVE_DETECTED_CURRENT_RELEASE_FAILS_CLOSED'
          else:
              verdict='INCONCLUSIVE_MATRIX'

          gate={
              'schema':'dotnet_x509_nameinfo_type_matrix/v1',
              'known_vulnerable_positive_control_10_0_9':positive_control,
              'patched_10_0_10_all_cases_complete':patched_complete,
              'current_10_0_11_all_cases_complete':current_complete,
              'current_failures':current_failures,
              'verdict':verdict,
              'submission_ready':False,
              'rows':rows,
          }
          Path('evidence/GATE.json').write_text(json.dumps(gate,indent=2))
          Path('evidence/VERDICT.env').write_text(
              f'VERDICT={verdict}\nSUBMISSION_READY=0\nPOSITIVE_CONTROL={int(positive_control)}\n'
              f'PATCHED_COMPLETE={int(patched_complete)}\nCURRENT_COMPLETE={int(current_complete)}\n'
              f'CURRENT_FAILURE_COUNT={len(current_failures)}\n')
          print(Path('evidence/VERDICT.env').read_text())
          if verdict == 'HARNESS_NOT_SENSITIVE_KILL':
              raise SystemExit(90)
          PY

          cp -a corpus evidence/
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact X509 matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-x509-nameinfo-type-matrix-20260817
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
