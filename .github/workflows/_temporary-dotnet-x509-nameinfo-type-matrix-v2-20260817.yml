name: Temporary .NET X509 NameInfo Type Matrix V2

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-x509-nameinfo-type-matrix-v2-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-x509-nameinfo-type-matrix-v2-20260817
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Install vulnerable, patched, and current SDK/runtime lines
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.301
            10.0.302
            10.0.303
          cache: false

      - name: Verify exact runtime matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet --info > evidence/DOTNET_INFO.txt
          dotnet --list-sdks > evidence/DOTNET_SDKS.txt
          dotnet --list-runtimes > evidence/DOTNET_RUNTIMES.txt
          for runtime in 10.0.9 10.0.10 10.0.11; do
            grep -E "^Microsoft\\.NETCore\\.App ${runtime//./\\.} " evidence/DOTNET_RUNTIMES.txt
          done

      - name: Generate valid ASN.1 otherName corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus evidence/cert-generation
          cat > generate.py <<'PY'
          from pathlib import Path
          import json, subprocess

          upn='1.3.6.1.4.1.311.20.2.3'
          other='1.3.6.1.4.1.311.20.2.99'
          cases={
            'upn_utf8_valid':f'otherName:{upn};UTF8:alice@example.com',
            'upn_boolean_true':f'otherName:{upn};BOOLEAN:TRUE',
            'upn_boolean_false':f'otherName:{upn};BOOLEAN:FALSE',
            'upn_integer_zero':f'otherName:{upn};INTEGER:0',
            'upn_integer_positive':f'otherName:{upn};INTEGER:42',
            'upn_integer_negative':f'otherName:{upn};INTEGER:-1',
            'upn_null':f'otherName:{upn};NULL:',
            'upn_octet_empty':f'otherName:{upn};OCTETSTRING:',
            'upn_octet_data':f'otherName:{upn};OCTETSTRING:attacker',
            'upn_bitstring':f'otherName:{upn};BITSTRING:10101010',
            'upn_oid':f'otherName:{upn};OID:1.2.3.4.5',
            'upn_enumerated':f'otherName:{upn};ENUMERATED:2',
            'upn_ia5':f'otherName:{upn};IA5:alice@example.com',
            'upn_printable':f'otherName:{upn};PRINTABLE:alice',
            'upn_numeric':f'otherName:{upn};NUMERIC:123456',
            'upn_t61':f'otherName:{upn};T61:alice',
            'upn_visible':f'otherName:{upn};VISIBLE:alice',
            'upn_bmp':f'otherName:{upn};BMP:alice',
            'upn_utctime':f'otherName:{upn};UTCTIME:260817000000Z',
            'upn_generalizedtime':f'otherName:{upn};GENERALIZEDTIME:20260817000000Z',
            'upn_sequence':f'otherName:{upn};SEQUENCE:seq',
            'upn_set':f'otherName:{upn};SET:setsec',
            'other_oid_boolean':f'otherName:{other};BOOLEAN:TRUE',
            'other_oid_integer':f'otherName:{other};INTEGER:42',
            'other_oid_sequence':f'otherName:{other};SEQUENCE:seq',
            'mixed_other_then_upn_boolean':f'otherName:{other};UTF8:safe,otherName:{upn};BOOLEAN:TRUE',
            'mixed_upn_boolean_then_dns':f'otherName:{upn};BOOLEAN:TRUE,DNS:example.test',
            'mixed_dns_then_upn_boolean':f'DNS:example.test,otherName:{upn};BOOLEAN:TRUE',
            'mixed_valid_then_invalid_upn':f'otherName:{upn};UTF8:valid@example.com,otherName:{upn};BOOLEAN:TRUE',
            'mixed_invalid_then_valid_upn':f'otherName:{upn};BOOLEAN:TRUE,otherName:{upn};UTF8:valid@example.com',
            'issuer_upn_boolean':f'otherName:{upn};BOOLEAN:TRUE',
            'issuer_upn_integer':f'otherName:{upn};INTEGER:42',
            'issuer_upn_utf8':f'otherName:{upn};UTF8:issuer@example.com',
          }
          generated=[]
          failures=[]
          for name,value in cases.items():
            d=Path('corpus')/name; d.mkdir(parents=True,exist_ok=True)
            ext='issuerAltName' if name.startswith('issuer_') else 'subjectAltName'
            cfg=f'''[req]
distinguished_name=dn
x509_extensions=ext
prompt=no
[dn]
CN={name}.example
[ext]
basicConstraints=CA:FALSE
keyUsage=digitalSignature
{ext}={value}
[seq]
a=UTF8:inside-sequence
b=INTEGER:7
[setsec]
a=UTF8:inside-set
b=INTEGER:8
'''
            (d/'openssl.cnf').write_text(cfg)
            cmd=['openssl','req','-new','-x509','-newkey','rsa:1024','-nodes','-days','2','-config',str(d/'openssl.cnf'),'-keyout',str(d/'key.pem'),'-out',str(d/'cert.pem')]
            p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
            (d/'openssl.stdout').write_text(p.stdout); (d/'openssl.stderr').write_text(p.stderr)
            if p.returncode:
              failures.append({'name':name,'rc':p.returncode,'stderr':p.stderr[-1200:]}); continue
            p=subprocess.run(['openssl','x509','-in',str(d/'cert.pem'),'-outform','der','-out',str(d/'cert.der')],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
            if p.returncode:
              failures.append({'name':name,'rc':p.returncode,'stderr':p.stderr[-1200:]}); continue
            generated.append({'name':name,'extension':ext,'value':value,'size':(d/'cert.der').stat().st_size})
          Path('evidence/cert-generation/generated.json').write_text(json.dumps(generated,indent=2))
          Path('evidence/cert-generation/failures.json').write_text(json.dumps(failures,indent=2))
          if failures: raise SystemExit(f'Unexpected valid-corpus generation failure: {failures}')
          PY
          python3 generate.py
          find corpus -name cert.der -type f -print | sort > evidence/CORPUS_FILES.txt
          test "$(wc -l < evidence/CORPUS_FILES.txt)" -eq 33

      - name: Build process-isolated GetNameInfo harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness
          cat > harness/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable>
              <Optimize>true</Optimize><Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
            </PropertyGroup>
          </Project>
          EOF
          cat > harness/Program.cs <<'EOF'
          using System.Runtime.InteropServices;
          using System.Security.Cryptography.X509Certificates;
          using System.Text;
          using System.Text.Json;

          if (args.Length != 1) return 64;
          var output = new Dictionary<string, object?>
          {
              ["framework"] = RuntimeInformation.FrameworkDescription,
              ["os"] = RuntimeInformation.OSDescription,
              ["certificate"] = args[0],
          };
          try
          {
              using var cert = X509CertificateLoader.LoadCertificateFromFile(args[0]);
              output["loaded"] = true;
              var values = new Dictionary<string, object?>();
              foreach (bool issuer in new[] { false, true })
              foreach (X509NameType type in Enum.GetValues<X509NameType>())
              {
                  string key = $"{(issuer ? "issuer" : "subject")}:{type}";
                  try
                  {
                      string value = cert.GetNameInfo(type, issuer);
                      values[key] = new { utf8_base64 = Convert.ToBase64String(Encoding.UTF8.GetBytes(value)), length = value.Length };
                  }
                  catch (Exception ex)
                  {
                      values[key] = new { exception = ex.GetType().FullName, message = ex.Message };
                  }
              }
              output["values"] = values;
              output["completed"] = true;
              Console.WriteLine(JsonSerializer.Serialize(output));
              return 0;
          }
          catch (Exception ex)
          {
              output["completed"] = false; output["exception"] = ex.GetType().FullName; output["message"] = ex.Message;
              Console.WriteLine(JsonSerializer.Serialize(output));
              return 70;
          }
          EOF
          dotnet publish harness/harness.csproj -c Release -o harness/out --nologo
          cp harness/Program.cs harness/harness.csproj evidence/

      - name: Run vulnerable, patched, and current process matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runs
          printf 'runtime\tcase\texit_code\tsignal\tcompleted\tlog\n' > evidence/MATRIX.tsv
          for runtime in 10.0.9 10.0.10 10.0.11; do
            mkdir -p "evidence/runs/$runtime"
            while IFS= read -r cert; do
              case_name="$(basename "$(dirname "$cert")")"
              log="evidence/runs/$runtime/$case_name.log"
              set +e
              timeout --signal=KILL 12s dotnet exec --fx-version "$runtime" harness/out/harness.dll "$cert" > "$log" 2>&1
              rc=$?
              set -e
              signal=0; [[ "$rc" -ge 128 ]] && signal="$((rc-128))"
              completed=0; grep -q '"completed":true' "$log" && completed=1 || true
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$runtime" "$case_name" "$rc" "$signal" "$completed" "$log" >> evidence/MATRIX.tsv
            done < evidence/CORPUS_FILES.txt
          done

          python3 - <<'PY'
          from pathlib import Path
          import csv,json
          rows=list(csv.DictReader(Path('evidence/MATRIX.tsv').open(),delimiter='\t'))
          for r in rows:
            for k in ('exit_code','signal','completed'): r[k]=int(r[k])
          find=lambda runtime,case: next((r for r in rows if r['runtime']==runtime and r['case']==case),None)
          known=find('10.0.9','upn_boolean_true')
          positive=known is not None and (known['exit_code']!=0 or known['completed']!=1)
          failures={v:[r for r in rows if r['runtime']==v and (r['exit_code']!=0 or r['completed']!=1)] for v in ('10.0.9','10.0.10','10.0.11')}
          patched_complete=not failures['10.0.10']
          current_complete=not failures['10.0.11']
          if not positive: verdict='HARNESS_NOT_SENSITIVE_KILL'
          elif failures['10.0.11']: verdict='CURRENT_RELEASE_RAW_X509_CANDIDATE'
          elif patched_complete and current_complete: verdict='KNOWN_CVE_DETECTED_CURRENT_RELEASE_FAILS_CLOSED'
          else: verdict='INCONCLUSIVE_MATRIX'
          gate={'schema':'dotnet_x509_nameinfo_type_matrix/v2','positive_control_10_0_9':positive,'failures':failures,
                'patched_10_0_10_complete':patched_complete,'current_10_0_11_complete':current_complete,
                'verdict':verdict,'submission_ready':False,'rows':rows}
          Path('evidence/GATE.json').write_text(json.dumps(gate,indent=2))
          Path('evidence/VERDICT.env').write_text(
            f'VERDICT={verdict}\nSUBMISSION_READY=0\nPOSITIVE_CONTROL={int(positive)}\n'
            f'VULNERABLE_FAILURE_COUNT={len(failures["10.0.9"])}\nPATCHED_FAILURE_COUNT={len(failures["10.0.10"])}\n'
            f'CURRENT_FAILURE_COUNT={len(failures["10.0.11"])}\n')
          print(Path('evidence/VERDICT.env').read_text())
          if not positive: raise SystemExit(90)
          PY
          cp -a corpus evidence/
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact X509 matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-x509-nameinfo-type-matrix-v2-20260817
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
