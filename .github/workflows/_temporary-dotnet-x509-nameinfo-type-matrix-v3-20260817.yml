name: Temporary .NET X509 NameInfo Type Matrix V3

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet-x509-nameinfo-type-matrix-v3-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet-x509-nameinfo-type-matrix-v3-20260817
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install exact vulnerable, patched, and current runtime lines
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.301
            10.0.302
            10.0.303
          cache: false

      - name: Verify exact runtime matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet --info > evidence/DOTNET_INFO.txt
          dotnet --list-sdks > evidence/DOTNET_SDKS.txt
          dotnet --list-runtimes > evidence/DOTNET_RUNTIMES.txt
          grep -F 'Microsoft.NETCore.App 10.0.9 ' evidence/DOTNET_RUNTIMES.txt
          grep -F 'Microsoft.NETCore.App 10.0.10 ' evidence/DOTNET_RUNTIMES.txt
          grep -F 'Microsoft.NETCore.App 10.0.11 ' evidence/DOTNET_RUNTIMES.txt

      - name: Generate valid ASN.1 otherName corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus evidence/cert-generation
          UPN='1.3.6.1.4.1.311.20.2.3'
          OTHER='1.3.6.1.4.1.311.20.2.99'

          generate_cert() {
            name="$1"
            extension="$2"
            value="$3"
            dir="corpus/$name"
            mkdir -p "$dir"
            {
              echo '[req]'
              echo 'distinguished_name=dn'
              echo 'x509_extensions=ext'
              echo 'prompt=no'
              echo '[dn]'
              echo "CN=$name.example"
              echo '[ext]'
              echo 'basicConstraints=CA:FALSE'
              echo 'keyUsage=digitalSignature'
              printf '%s=%s\n' "$extension" "$value"
              echo '[seq]'
              echo 'a=UTF8:inside-sequence'
              echo 'b=INTEGER:7'
              echo '[setsec]'
              echo 'a=UTF8:inside-set'
              echo 'b=INTEGER:8'
            } > "$dir/openssl.cnf"
            openssl req -new -x509 -newkey rsa:1024 -nodes -days 2 \
              -config "$dir/openssl.cnf" -keyout "$dir/key.pem" -out "$dir/cert.pem" \
              > "$dir/openssl.stdout" 2> "$dir/openssl.stderr"
            openssl x509 -in "$dir/cert.pem" -outform der -out "$dir/cert.der"
          }

          generate_cert upn_utf8_valid subjectAltName "otherName:$UPN;UTF8:alice@example.com"
          generate_cert upn_boolean_true subjectAltName "otherName:$UPN;BOOLEAN:TRUE"
          generate_cert upn_boolean_false subjectAltName "otherName:$UPN;BOOLEAN:FALSE"
          generate_cert upn_integer_zero subjectAltName "otherName:$UPN;INTEGER:0"
          generate_cert upn_integer_positive subjectAltName "otherName:$UPN;INTEGER:42"
          generate_cert upn_integer_negative subjectAltName "otherName:$UPN;INTEGER:-1"
          generate_cert upn_null subjectAltName "otherName:$UPN;NULL:"
          generate_cert upn_octet_empty subjectAltName "otherName:$UPN;OCTETSTRING:"
          generate_cert upn_octet_data subjectAltName "otherName:$UPN;OCTETSTRING:attacker"
          generate_cert upn_bitstring subjectAltName "otherName:$UPN;BITSTRING:10101010"
          generate_cert upn_oid subjectAltName "otherName:$UPN;OID:1.2.3.4.5"
          generate_cert upn_enumerated subjectAltName "otherName:$UPN;ENUMERATED:2"
          generate_cert upn_ia5 subjectAltName "otherName:$UPN;IA5:alice@example.com"
          generate_cert upn_printable subjectAltName "otherName:$UPN;PRINTABLE:alice"
          generate_cert upn_numeric subjectAltName "otherName:$UPN;NUMERIC:123456"
          generate_cert upn_t61 subjectAltName "otherName:$UPN;T61:alice"
          generate_cert upn_visible subjectAltName "otherName:$UPN;VISIBLE:alice"
          generate_cert upn_bmp subjectAltName "otherName:$UPN;BMP:alice"
          generate_cert upn_utctime subjectAltName "otherName:$UPN;UTCTIME:260817000000Z"
          generate_cert upn_generalizedtime subjectAltName "otherName:$UPN;GENERALIZEDTIME:20260817000000Z"
          generate_cert upn_sequence subjectAltName "otherName:$UPN;SEQUENCE:seq"
          generate_cert upn_set subjectAltName "otherName:$UPN;SET:setsec"
          generate_cert other_oid_boolean subjectAltName "otherName:$OTHER;BOOLEAN:TRUE"
          generate_cert other_oid_integer subjectAltName "otherName:$OTHER;INTEGER:42"
          generate_cert other_oid_sequence subjectAltName "otherName:$OTHER;SEQUENCE:seq"
          generate_cert mixed_other_then_upn_boolean subjectAltName "otherName:$OTHER;UTF8:safe,otherName:$UPN;BOOLEAN:TRUE"
          generate_cert mixed_upn_boolean_then_dns subjectAltName "otherName:$UPN;BOOLEAN:TRUE,DNS:example.test"
          generate_cert mixed_dns_then_upn_boolean subjectAltName "DNS:example.test,otherName:$UPN;BOOLEAN:TRUE"
          generate_cert mixed_valid_then_invalid_upn subjectAltName "otherName:$UPN;UTF8:valid@example.com,otherName:$UPN;BOOLEAN:TRUE"
          generate_cert mixed_invalid_then_valid_upn subjectAltName "otherName:$UPN;BOOLEAN:TRUE,otherName:$UPN;UTF8:valid@example.com"
          generate_cert issuer_upn_boolean issuerAltName "otherName:$UPN;BOOLEAN:TRUE"
          generate_cert issuer_upn_integer issuerAltName "otherName:$UPN;INTEGER:42"
          generate_cert issuer_upn_utf8 issuerAltName "otherName:$UPN;UTF8:issuer@example.com"

          find corpus -name cert.der -type f -print | sort > evidence/CORPUS_FILES.txt
          test "$(wc -l < evidence/CORPUS_FILES.txt)" -eq 33
          openssl version -a > evidence/OPENSSL_VERSION.txt

      - name: Build process-isolated GetNameInfo harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness
          cat > harness/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <Optimize>true</Optimize>
              <Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
            </PropertyGroup>
          </Project>
          EOF
          cat > harness/Program.cs <<'EOF'
          using System.Runtime.InteropServices;
          using System.Security.Cryptography.X509Certificates;
          using System.Text;
          using System.Text.Json;

          if (args.Length != 1) return 64;
          var output = new Dictionary<string, object?>
          {
              ["framework"] = RuntimeInformation.FrameworkDescription,
              ["os"] = RuntimeInformation.OSDescription,
              ["certificate"] = args[0],
          };
          try
          {
              using var cert = X509CertificateLoader.LoadCertificateFromFile(args[0]);
              output["loaded"] = true;
              var values = new Dictionary<string, object?>();
              foreach (bool issuer in new[] { false, true })
              foreach (X509NameType type in Enum.GetValues<X509NameType>())
              {
                  string key = $"{(issuer ? "issuer" : "subject")}:{type}";
                  try
                  {
                      string value = cert.GetNameInfo(type, issuer);
                      values[key] = new
                      {
                          utf8_base64 = Convert.ToBase64String(Encoding.UTF8.GetBytes(value)),
                          length = value.Length,
                      };
                  }
                  catch (Exception ex)
                  {
                      values[key] = new { exception = ex.GetType().FullName, message = ex.Message };
                  }
              }
              output["values"] = values;
              output["completed"] = true;
              Console.WriteLine(JsonSerializer.Serialize(output));
              return 0;
          }
          catch (Exception ex)
          {
              output["completed"] = false;
              output["exception"] = ex.GetType().FullName;
              output["message"] = ex.Message;
              Console.WriteLine(JsonSerializer.Serialize(output));
              return 70;
          }
          EOF
          dotnet publish harness/harness.csproj -c Release -o harness/out --nologo
          cp harness/Program.cs harness/harness.csproj evidence/

      - name: Run vulnerable, patched, and current process matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/runs
          printf 'runtime\tcase\texit_code\tsignal\tcompleted\tlog\n' > evidence/MATRIX.tsv
          for runtime in 10.0.9 10.0.10 10.0.11; do
            mkdir -p "evidence/runs/$runtime"
            while IFS= read -r cert; do
              case_name="$(basename "$(dirname "$cert")")"
              log="evidence/runs/$runtime/$case_name.log"
              set +e
              timeout --signal=KILL 12s dotnet exec --fx-version "$runtime" harness/out/harness.dll "$cert" > "$log" 2>&1
              rc=$?
              set -e
              signal=0
              if [[ "$rc" -ge 128 ]]; then signal="$((rc-128))"; fi
              completed=0
              grep -q '"completed":true' "$log" && completed=1 || true
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$runtime" "$case_name" "$rc" "$signal" "$completed" "$log" >> evidence/MATRIX.tsv
            done < evidence/CORPUS_FILES.txt
          done

          python3 - <<'PY'
          from pathlib import Path
          import csv
          import json
          rows=list(csv.DictReader(Path('evidence/MATRIX.tsv').open(),delimiter='\t'))
          for item in rows:
              for key in ('exit_code','signal','completed'):
                  item[key]=int(item[key])
          def find(runtime,case):
              return next((item for item in rows if item['runtime']==runtime and item['case']==case),None)
          known=find('10.0.9','upn_boolean_true')
          positive=known is not None and (known['exit_code']!=0 or known['completed']!=1)
          failures={version:[item for item in rows if item['runtime']==version and (item['exit_code']!=0 or item['completed']!=1)] for version in ('10.0.9','10.0.10','10.0.11')}
          patched_complete=not failures['10.0.10']
          current_complete=not failures['10.0.11']
          if not positive:
              verdict='HARNESS_NOT_SENSITIVE_KILL'
          elif failures['10.0.11']:
              verdict='CURRENT_RELEASE_RAW_X509_CANDIDATE'
          elif patched_complete and current_complete:
              verdict='KNOWN_CVE_DETECTED_CURRENT_RELEASE_FAILS_CLOSED'
          else:
              verdict='INCONCLUSIVE_MATRIX'
          gate={
              'schema':'dotnet_x509_nameinfo_type_matrix/v3',
              'positive_control_10_0_9':positive,
              'failures':failures,
              'patched_10_0_10_complete':patched_complete,
              'current_10_0_11_complete':current_complete,
              'verdict':verdict,
              'submission_ready':False,
              'rows':rows,
          }
          Path('evidence/GATE.json').write_text(json.dumps(gate,indent=2))
          Path('evidence/VERDICT.env').write_text(
              f'VERDICT={verdict}\nSUBMISSION_READY=0\nPOSITIVE_CONTROL={int(positive)}\n'
              f'VULNERABLE_FAILURE_COUNT={len(failures["10.0.9"])}\n'
              f'PATCHED_FAILURE_COUNT={len(failures["10.0.10"])}\n'
              f'CURRENT_FAILURE_COUNT={len(failures["10.0.11"])}\n')
          print(Path('evidence/VERDICT.env').read_text())
          if not positive:
              raise SystemExit(90)
          PY
          cp -a corpus evidence/
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact X509 matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-x509-nameinfo-type-matrix-v3-20260817
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
