name: Temporary .NET 10.0.302 Toolchain Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-dotnet10-toolchain-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-dotnet10-toolchain-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Install exact supported .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Verify exact versions
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet --list-runtimes
          test "$(dotnet --version)" = "10.0.302"
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 10\.0\.10 '

      - name: Stage minimal Linux x64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")") }"
          ROOT="${ROOT% }"
          OUT="$GITHUB_WORKSPACE/dotnet-toolchain"
          mkdir -p "$OUT"

          install -m 0755 "$ROOT/dotnet" "$OUT/dotnet"

          copy_required() {
            local rel="$1"
            test -e "$ROOT/$rel"
            mkdir -p "$OUT/$(dirname "$rel")"
            cp -a "$ROOT/$rel" "$OUT/$rel"
          }

          copy_optional() {
            local rel="$1"
            if test -e "$ROOT/$rel"; then
              mkdir -p "$OUT/$(dirname "$rel")"
              cp -a "$ROOT/$rel" "$OUT/$rel"
            fi
          }

          copy_required "host/fxr/10.0.10"
          copy_required "shared/Microsoft.NETCore.App/10.0.10"
          copy_required "sdk/10.0.302"
          copy_required "packs/Microsoft.NETCore.App.Ref/10.0.10"
          copy_required "packs/Microsoft.NETCore.App.Host.linux-x64/10.0.10"

          copy_optional "shared/Microsoft.AspNetCore.App/10.0.10"
          copy_optional "packs/Microsoft.AspNetCore.App.Ref/10.0.10"
          copy_optional "packs/NETStandard.Library.Ref/2.1.0"
          copy_optional "sdk-manifests/10.0.100"
          copy_optional "LICENSE.txt"
          copy_optional "ThirdPartyNotices.txt"

          (
            cd "$OUT"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          "$OUT/dotnet" --info > "$OUT/DOTNET_INFO.txt"
          "$OUT/dotnet" --list-runtimes > "$OUT/DOTNET_RUNTIMES.txt"
          du -sh "$OUT"

      - name: Upload generic toolchain artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-10.0.302-linux-x64-toolchain
          path: dotnet-toolchain
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
