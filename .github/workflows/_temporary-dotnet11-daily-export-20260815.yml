name: Temporary .NET 11 Daily Toolchain Export 20260815

on:
  push:
    branches:
      - agent/dotnet11-daily-20260815
    paths:
      - .github/workflows/_temporary-dotnet11-daily-export-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-dotnet11-daily-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/dotnet11-root

    steps:
      - name: Install latest .NET 11 daily SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 11.0.x
          dotnet-quality: daily
          cache: false

      - name: Verify build and stage complete toolchain
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$DOTNET_INSTALL_DIR"
          test -x "$ROOT/dotnet"
          "$ROOT/dotnet" --info | tee "$ROOT/DOTNET_INFO.txt"
          "$ROOT/dotnet" --list-runtimes | tee "$ROOT/DOTNET_RUNTIMES.txt"
          "$ROOT/dotnet" --version | tee "$ROOT/SDK_VERSION.txt"

          SDK_VERSION=$("$ROOT/dotnet" --version)
          RUNTIME_VERSION=$("$ROOT/dotnet" --list-runtimes | awk '/^Microsoft.NETCore.App / {print $2; exit}')
          printf '%s\n' "$RUNTIME_VERSION" > "$ROOT/RUNTIME_VERSION.txt"

          case "$SDK_VERSION" in
            11.*) ;;
            *) echo "Unexpected SDK version: $SDK_VERSION" >&2; exit 1 ;;
          esac
          case "$RUNTIME_VERSION" in
            11.*) ;;
            *) echo "Unexpected runtime version: $RUNTIME_VERSION" >&2; exit 1 ;;
          esac

          (
            cd "$ROOT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh "$ROOT"

      - name: Upload daily toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet11-daily-linux-x64-20260815
          path: dotnet11-root
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
