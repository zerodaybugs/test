name: Temporary Ethereum Blob Mainnet Verifiable Gate

on:
  pull_request:
    branches: [main]
    paths:
      - research/blob_mainnet_research_fuzz_test.go
      - research/ethereum-eth72-encrypted-gate-trigger-20260809.txt

permissions:
  contents: read

jobs:
  current-mainnet-verifiable:
    if: github.head_ref == 'ethereum-fusaka-eth72-fuzz-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Checkout exact released Geth
        uses: actions/checkout@v4
        with:
          repository: ethereum/go-ethereum
          ref: 9621c6ad10934a01b5514886fb6fbd87640b6c05
          path: geth
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: true
          cache-dependency-path: geth/go.sum

      - name: Install and compile harness
        shell: bash
        run: |
          cp research/blob_mainnet_research_fuzz_test.go geth/eth/fetcher/blob_mainnet_research_fuzz_test.go
          cd geth
          gofmt -w eth/fetcher/blob_mainnet_research_fuzz_test.go
          go test ./eth/fetcher -run '^TestBlobFetcherCurrentMainnetMatrix$' -count=1

      - name: Run exact-release gates
        shell: bash
        run: |
          set -u
          mkdir -p research-result public-result
          printf 'geth_commit=%s\n' "$(git -C geth rev-parse HEAD)" > research-result/environment.txt
          printf 'go_version=%s\n' "$(go version)" >> research-result/environment.txt
          printf 'initial_custody=CustodyBitmapAll\nupdate_custody_calls=0\n' >> research-result/environment.txt

          run_gate() {
            name="$1"; shift
            set +e
            timeout 360s "$@" > "research-result/${name}.log" 2>&1
            rc=$?
            set -e
            printf '%s=%s\n' "$name" "$rc" >> research-result/exit-codes.txt
          }

          set -e
          run_gate matrix go -C geth test ./eth/fetcher -run '^TestBlobFetcherCurrentMainnetMatrix$' -count=1
          run_gate fuzz go -C geth test ./eth/fetcher -run '^$' -fuzz '^FuzzBlobFetcherCurrentMainnet$' -fuzztime=180s -parallel=2 -count=1
          run_gate matrix_race go -C geth test -race ./eth/fetcher -run '^TestBlobFetcherCurrentMainnetMatrix$' -count=1
          run_gate fuzz_race go -C geth test -race ./eth/fetcher -run '^$' -fuzz '^FuzzBlobFetcherCurrentMainnet$' -fuzztime=30s -parallel=1 -count=1

          cp research-result/exit-codes.txt public-result/exit-codes.txt
          sha256sum research-result/*.log research-result/environment.txt research-result/exit-codes.txt > public-result/evidence-sha256.txt
          {
            printf 'schema=ethereum-blob-mainnet-verifiable-gate-v1\n'
            printf 'geth_commit=9621c6ad10934a01b5514886fb6fbd87640b6c05\n'
            printf 'initial_custody=CustodyBitmapAll\n'
            printf 'update_custody_calls=0\n'
            cat research-result/exit-codes.txt
          } > public-result/SUMMARY.txt

          if [ -d geth/eth/fetcher/testdata/fuzz ]; then
            cp -a geth/eth/fetcher/testdata/fuzz research-result/fuzz-corpus
          fi

      - name: Encrypt detailed evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-result
          cat > /tmp/research-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAv5BSxyiyqlF6PKhUDjTI
          AfqX5Ih/LpAwcDYa4CyRboSO6gV+RwHMECHk+GqDYEmi6t+yxmhDXaUn1dG1NP+Z
          +r2HWnjvRgGnQ+jXuDd2cWxjX8dUGqBEgjuLdRaE1A3WgFIlrZ5sxIcvzeLqKrI1
          ler6su+tlTPl/97VPlqHyNE8sGJdTECf6nkW8nsykxs0TZZzG5xBI39gpnoPzmmL
          1OGIzwoBKiR5373QT47USKyQfgM/w5N5gQmgwQuMPNPAgtI3S7Xf/xxryUxFiKpQ
          LJ9p3YWse2E2zOS6MWlsX7eWxT1EatTmUpbGHKWQps6/myrgp/bE+W/8RNe3grM5
          qd+UTbGbFNFuwilZnmm4uFE+Ry0QFNh8lsNWX/ty5eDf6bToo8S+BhPlUhMqC5GL
          QKA/EwXwJN9kIlwnJwzg0160UzSrfO2pfNvYQZ3UpgIGuDacbRBZ3T9LINLLnguX
          LB8J304zWlYGAqU7U1tcHvMgfBU4PtP8zPKc/CIglhJHAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -czf /tmp/research-result.tar.gz research-result
          keyhex="$(openssl rand -hex 32)"
          ivhex="$(openssl rand -hex 16)"
          printf '%s\n%s\n' "$keyhex" "$ivhex" > /tmp/key-material.txt
          openssl enc -aes-256-cbc -K "$keyhex" -iv "$ivhex" -in /tmp/research-result.tar.gz -out encrypted-result/research-result.tar.gz.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/research-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/key-material.txt -out encrypted-result/key-material.rsa-oaep.enc
          sha256sum encrypted-result/* > encrypted-result/SHA256SUMS.txt
          printf 'ENCRYPTED_RESEARCH_ARTIFACT_V2\n' > encrypted-result/FORMAT.txt
          rm -rf research-result /tmp/research-result.tar.gz /tmp/key-material.txt /tmp/research-public.pem

      - name: Upload verifiable result
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-blob-mainnet-verifiable-result
          path: |
            public-result
            encrypted-result
          if-no-files-found: error
          retention-days: 1
