name: Temporary Ethereum Blob State Encrypted PR Gate V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  state-machine-v2:
    if: github.head_ref == 'ethereum-fusaka-eth72-fuzz-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact released Geth
        uses: actions/checkout@v4
        with:
          repository: ethereum/go-ethereum
          ref: 9621c6ad10934a01b5514886fb6fbd87640b6c05
          path: geth
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: true
          cache-dependency-path: geth/go.sum

      - name: Install corrected state-machine fuzzer
        shell: bash
        run: |
          cat > geth/eth/fetcher/blob_state_research_fuzz_test.go <<'EOF'
          package fetcher

          import (
              "fmt"
              "slices"
              "sort"
              "sync"
              "testing"
              "time"

              "github.com/ethereum/go-ethereum/common"
              "github.com/ethereum/go-ethereum/common/mclock"
              "github.com/ethereum/go-ethereum/core/types"
              "github.com/ethereum/go-ethereum/crypto/kzg4844"
          )

          type researchRequest struct {
              peer string
              txs  []common.Hash
              mask types.CustodyBitmap
          }

          func waitStep(t *testing.T, step <-chan struct{}) {
              t.Helper()
              select {
              case <-step:
              case <-time.After(2 * time.Second):
                  t.Fatal("BlobFetcher loop failed to acknowledge operation")
              }
          }

          func drainSteps(step <-chan struct{}) {
              for {
                  select {
                  case <-step:
                  default:
                      return
                  }
              }
          }

          func pickRequest(fetcher *BlobFetcher, selector byte) (researchRequest, bool) {
              peers := make([]string, 0, len(fetcher.requests))
              for peer, requests := range fetcher.requests {
                  if len(requests) > 0 {
                      peers = append(peers, peer)
                  }
              }
              if len(peers) == 0 {
                  return researchRequest{}, false
              }
              sort.Strings(peers)
              peer := peers[int(selector)%len(peers)]
              reqs := fetcher.requests[peer]
              req := reqs[int(selector/7)%len(reqs)]
              return researchRequest{peer: peer, txs: slices.Clone(req.txs), mask: req.cells}, true
          }

          func validCells(mask types.CustodyBitmap, corrupt bool) []kzg4844.Cell {
              cells := slices.Clone(selectMultiBlobCells(testBlobSidecars[0], mask))
              if corrupt && len(cells) > 0 {
                  cells[0][0] ^= 0x80
              }
              return cells
          }

          func response(req researchRequest, variant byte) ([]common.Hash, [][]kzg4844.Cell) {
              hashes := slices.Clone(req.txs)
              cells := make([][]kzg4844.Cell, len(hashes))
              for i := range cells {
                  cells[i] = validCells(req.mask, false)
              }
              switch variant % 9 {
              case 0:
              case 1:
                  if len(hashes) > 1 {
                      hashes, cells = hashes[:len(hashes)-1], cells[:len(cells)-1]
                  }
              case 2:
                  slices.Reverse(hashes)
                  slices.Reverse(cells)
              case 3:
                  if len(hashes) > 0 {
                      hashes = append(hashes, hashes[0])
                      cells = append(cells, slices.Clone(cells[0]))
                  }
              case 4:
                  hashes = append(hashes, common.Hash{0xee})
                  cells = append(cells, validCells(req.mask, false))
              case 5:
                  if len(cells) > 0 && len(cells[0]) > 0 {
                      cells[0] = cells[0][:len(cells[0])-1]
                  }
              case 6:
                  if len(cells) > 0 {
                      cells[0] = append(cells[0], kzg4844.Cell{})
                  }
              case 7:
                  if len(cells) > 0 {
                      cells[0] = validCells(req.mask, true)
                  }
              case 8:
                  if len(cells) > 0 {
                      cells[0] = nil
                  }
              }
              return hashes, cells
          }

          func assertState(t *testing.T, fetcher *BlobFetcher) {
              t.Helper()
              for peer, reqs := range fetcher.requests {
                  if len(reqs) == 0 {
                      t.Fatalf("empty request slice retained for peer %q", peer)
                  }
                  for _, req := range reqs {
                      if req == nil || len(req.txs) == 0 || req.cells.OneCount() == 0 {
                          t.Fatalf("invalid active request for peer %q", peer)
                      }
                      seen := make(map[common.Hash]struct{}, len(req.txs))
                      for _, hash := range req.txs {
                          if _, ok := seen[hash]; ok {
                              t.Fatalf("duplicate hash retained in request: %x", hash)
                          }
                          seen[hash] = struct{}{}
                          if fetcher.fetches[hash] == nil {
                              t.Fatalf("request references absent fetch state: %x", hash)
                          }
                      }
                  }
              }
              for hash, status := range fetcher.fetches {
                  if status == nil {
                      t.Fatalf("nil fetch status: %x", hash)
                  }
                  seen := make(map[uint64]struct{}, len(status.fetched))
                  for _, index := range status.fetched {
                      if index >= kzg4844.CellsPerBlob {
                          t.Fatalf("out-of-range fetched index: %d", index)
                      }
                      if _, ok := seen[index]; ok {
                          t.Fatalf("duplicate fetched index %d for %x", index, hash)
                      }
                      seen[index] = struct{}{}
                  }
              }
          }

          func runStateMachine(t *testing.T, data []byte) {
              t.Helper()
              if len(data) == 0 || len(data) > 512 {
                  return
              }
              masks := []types.CustodyBitmap{
                  fullCustody, halfCustody, custody, frontCustody,
                  backCustody, differentCustody,
                  types.NewCustodyBitmap([]uint64{0}), {},
              }
              peers := []string{"A", "B", "C", "D"}
              initial := masks[int(data[0])%len(masks)]
              if initial.OneCount() == 0 {
                  initial = custody
              }
              fetcher := NewBlobFetcher(
                  BlobFetcherFunctions{
                      HasPayload:    func(common.Hash) bool { return false },
                      AddCells:      func(common.Hash, map[string]*PeerCellDelivery, types.CustodyBitmap) {},
                      FetchPayloads: func(string, []common.Hash, types.CustodyBitmap) error { return nil },
                      DropPeer:      func(string) {},
                  },
                  initial,
                  &mockRand{value: int(data[0] % 100)},
                  15,
              )
              clock := new(mclock.Simulated)
              step := make(chan struct{}, 64)
              fetcher.clock, fetcher.step = clock, step
              done := make(chan struct{})
              go func() {
                  defer close(done)
                  fetcher.loop()
              }()
              defer func() {
                  drainSteps(step)
                  close(fetcher.quit)
                  select {
                  case <-done:
                  case <-time.After(2 * time.Second):
                      t.Fatal("BlobFetcher loop did not terminate")
                  }
              }()

              operations := 8 + len(data)%40
              for i := 0; i < operations; i++ {
                  a := data[(1+i*4)%len(data)]
                  b := data[(2+i*4)%len(data)]
                  c := data[(3+i*4)%len(data)]
                  d := data[(4+i*4)%len(data)]
                  peer := peers[int(b)%len(peers)]
                  hash := testBlobTxHashes[int(c)%len(testBlobTxHashes)]
                  mask := masks[int(d)%len(masks)]

                  switch a % 8 {
                  case 0:
                      if fetcher.Notify(peer, []common.Hash{hash}, mask) == nil {
                          waitStep(t, step)
                      }
                  case 1:
                      other := peers[(int(b)+1)%len(peers)]
                      if fetcher.Notify(peer, []common.Hash{hash}, fullCustody) == nil {
                          waitStep(t, step)
                      }
                      if fetcher.Notify(other, []common.Hash{hash}, fullCustody) == nil {
                          waitStep(t, step)
                      }
                  case 2:
                      if req, ok := pickRequest(fetcher, b); ok {
                          hashes, cells := response(req, d)
                          if fetcher.Enqueue(req.peer, hashes, cells, req.mask) == nil {
                              waitStep(t, step)
                          }
                      } else if fetcher.Notify(peer, []common.Hash{hash}, fullCustody) == nil {
                          waitStep(t, step)
                      }
                  case 3:
                      if fetcher.Drop(peer) == nil {
                          waitStep(t, step)
                      }
                  case 4:
                      if mask.OneCount() == 0 {
                          mask = custody
                      }
                      fetcher.UpdateCustody(mask)
                      waitStep(t, step)
                  case 5:
                      if len(fetcher.requests) > 0 {
                          clock.Run(blobFetchTimeout + time.Millisecond)
                          time.Sleep(time.Millisecond)
                          drainSteps(step)
                      } else if len(fetcher.waittime) > 0 {
                          clock.Run(blobAvailabilityTimeout + time.Millisecond)
                          time.Sleep(time.Millisecond)
                          drainSteps(step)
                      }
                  case 6:
                      var wg sync.WaitGroup
                      wg.Add(2)
                      go func() {
                          defer wg.Done()
                          _ = fetcher.Notify(peer, []common.Hash{hash}, fullCustody)
                      }()
                      go func() {
                          defer wg.Done()
                          _ = fetcher.Drop(peers[(int(b)+2)%len(peers)])
                      }()
                      wg.Wait()
                      waitStep(t, step)
                      waitStep(t, step)
                  case 7:
                      hashes := []common.Hash{hash, hash, testBlobTxHashes[(int(c)+1)%len(testBlobTxHashes)]}
                      if fetcher.Notify(peer, hashes, fullCustody) == nil {
                          waitStep(t, step)
                      }
                  }
                  drainSteps(step)
                  assertState(t, fetcher)
              }
          }

          func TestBlobFetcherAdversarialStateMatrix(t *testing.T) {
              for i := 0; i < 128; i++ {
                  seed := []byte{byte(i), byte(i * 3), byte(i * 5), byte(i * 7), byte(i * 11), byte(i * 13), byte(i * 17), byte(i * 19)}
                  t.Run(fmt.Sprintf("seed-%03d", i), func(t *testing.T) { runStateMachine(t, seed) })
              }
          }

          func FuzzBlobFetcherStateMachine(f *testing.F) {
              f.Add([]byte{1, 0, 0, 0, 2, 1, 0, 1, 5, 0, 0, 0})
              f.Add([]byte{70, 1, 2, 0, 70, 2, 2, 0, 2, 0, 0, 5})
              f.Add([]byte{5, 0, 0, 0, 6, 1, 0, 0, 3, 0, 0, 0})
              f.Add([]byte{99, 3, 4, 0, 1, 0, 4, 0, 2, 0, 0, 7})
              f.Fuzz(func(t *testing.T, data []byte) { runStateMachine(t, data) })
          }
          EOF
          cd geth
          gofmt -w eth/fetcher/blob_state_research_fuzz_test.go
          go test ./eth/fetcher -run '^TestBlobFetcherAdversarialStateMatrix$' -count=1

      - name: Run matrix, fuzz, and race gates
        shell: bash
        run: |
          set -u
          mkdir -p research-result
          printf 'geth_commit=%s\n' "$(git -C geth rev-parse HEAD)" > research-result/environment.txt
          printf 'go_version=%s\n' "$(go version)" >> research-result/environment.txt
          run_gate() {
            name="$1"; shift
            set +e
            timeout 360s "$@" > "research-result/${name}.log" 2>&1
            rc=$?
            set -e
            printf '%s=%s\n' "$name" "$rc" >> research-result/exit-codes.txt
          }
          set -e
          run_gate matrix go -C geth test ./eth/fetcher -run '^TestBlobFetcherAdversarialStateMatrix$' -count=1
          run_gate fuzz go -C geth test ./eth/fetcher -run '^$' -fuzz '^FuzzBlobFetcherStateMachine$' -fuzztime=180s -parallel=2 -count=1
          run_gate matrix_race go -C geth test -race ./eth/fetcher -run '^TestBlobFetcherAdversarialStateMatrix$' -count=1
          run_gate fuzz_race go -C geth test -race ./eth/fetcher -run '^$' -fuzz '^FuzzBlobFetcherStateMachine$' -fuzztime=30s -parallel=1 -count=1
          if [ -d geth/eth/fetcher/testdata/fuzz ]; then
            cp -a geth/eth/fetcher/testdata/fuzz research-result/fuzz-corpus
          fi

      - name: Encrypt results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-artifact
          cat > /tmp/research-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtKxz8mg3ok3Lk82so0S1
          dUKwhR8gmTdegVVvQ48jOcXy4HknIQUfoVxne1Qi5TWV3Qnpk3ErqF5invvzeBMt
          Jp71OSa3kDD4ddJAo/dDZr7XRbki5BQuhl2sGvuVqoqs8/h+dNCtIrJ6gFPIPwpk
          JgR6W2jOxJQ+8fMgYjPjrNzUuDGX2yUK+AIYIkluHXeqSXrG0j3aleFBjBjC4SV+
          FjswsfdoiZGK+OdrQJcZAaeo7LY9i4fBNyXA69IbLU4zb8N48E0Ya/kvs/+TILTD
          mMP9vrLcPLx9nKhdH4/hKWHWtlbzQ0i/UpORf43PKEnOhS4nWwudzocskNP1rfG9
          hZ4zNIub8TvaJ/WlAx8e32TuzCj11ahQIzwtaneIF3ax4Xlp0aS7Rv0MeAXOp/7B
          OjvywymjI3fEPvTOeIX81nwtT/tCXs5163X+6uoEilfCq8FkuT9oLr+39sE0D5E4
          SQPCH/y+vVIYyBvmADaCrCH33gKcCRpAMQnvOYnqj+snAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -czf /tmp/research-result.tar.gz research-result
          keyhex="$(openssl rand -hex 32)"
          ivhex="$(openssl rand -hex 16)"
          printf '%s\n%s\n' "$keyhex" "$ivhex" > /tmp/key-material.txt
          openssl enc -aes-256-cbc -K "$keyhex" -iv "$ivhex" -in /tmp/research-result.tar.gz -out encrypted-artifact/research-result.tar.gz.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/research-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/key-material.txt -out encrypted-artifact/key-material.rsa-oaep.enc
          sha256sum encrypted-artifact/* > encrypted-artifact/SHA256SUMS.txt
          printf 'ENCRYPTED_RESEARCH_ARTIFACT_V1\n' > encrypted-artifact/FORMAT.txt
          rm -rf research-result /tmp/research-result.tar.gz /tmp/key-material.txt /tmp/research-public.pem

      - name: Upload encrypted-only result
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-blob-state-encrypted-result-v2
          path: encrypted-artifact
          if-no-files-found: error
          retention-days: 1
