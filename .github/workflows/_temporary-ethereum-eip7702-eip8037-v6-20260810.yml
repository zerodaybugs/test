name: Temporary EIP-7702 EIP-8037 Differential Gate V6

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ethereum-eip7702-eip8037-v6-20260810
  cancel-in-progress: true

jobs:
  eip8037-v6:
    if: github.head_ref == 'ethereum-eip7702-diff-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: research-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ethereum/execution-specs
          ref: 343274cc0f43962ff39a648e2b2614bf227f8d1f
          path: eest
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ethereum/go-ethereum
          ref: v1.17.5
          path: geth
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NethermindEth/nethermind
          ref: 1.39.2
          path: nethermind
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: eest/uv.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: true
          cache-dependency-path: geth/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: nethermind/global.json

      - name: Run sealed Amsterdam authorization matrix
        id: matrix
        shell: bash
        run: |
          set -u
          ROOT="$GITHUB_WORKSPACE/eth7702-v6"
          BIN="$RUNNER_TEMP/eth7702-v6-bin"
          mkdir -p "$ROOT/logs" "$ROOT/fixtures" "$ROOT/status" "$BIN"
          STATUS="$ROOT/status/status.env"
          : > "$STATUS"
          capture() {
            local name="$1"; shift
            set +e
            timeout 2400s "$@" >"$ROOT/logs/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s=%s\n' "$name" "$rc" >> "$STATUS"
          }
          capture build_geth go -C geth build -trimpath -o "$BIN/evm" ./cmd/evm
          export PATH="$BIN:$PATH"
          cp research-repo/research/ethereum/eip7702/test_eip7702_eip8037_nested_halts.py \
             eest/tests/prague/eip7702_set_code_tx/
          cp research-repo/research/ethereum/eip7702/test_eip7702_eip8037_auth_sequences.py \
             eest/tests/prague/eip7702_set_code_tx/
          capture fill_oracle bash -lc \
            "cd eest && EVM_BIN='$BIN/evm' uv run --frozen fill \
             tests/prague/eip7702_set_code_tx/test_eip7702_eip8037_nested_halts.py \
             tests/prague/eip7702_set_code_tx/test_eip7702_eip8037_auth_sequences.py \
             --output='$ROOT/fixtures' --clean --fork Amsterdam -n 1 --no-html -q"
          capture build_besu bash -lc \
            "cd besu && ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace"
          capture build_nethermind dotnet publish \
            nethermind/src/Nethermind/Nethermind.Test.Runner/Nethermind.Test.Runner.csproj \
            -c Release -o "$BIN/nethermind-publish" --nologo
          BESU_BIN="$GITHUB_WORKSPACE/besu/ethereum/evmtool/build/install/evmtool/bin/evmtool"
          cat > "$BIN/nethtest" <<EOF
          #!/bin/sh
          exec dotnet "$BIN/nethermind-publish/nethtest.dll" "\$@"
          EOF
          chmod +x "$BIN/nethtest"
          capture geth_consume bash -lc \
            "cd eest && uv run --frozen consume direct --input='$ROOT/fixtures' --bin='$BIN/evm' -q"
          capture besu_consume bash -lc \
            "cd eest && uv run --frozen consume direct --input='$ROOT/fixtures' --bin='$BESU_BIN' -q"
          capture nethermind_consume bash -lc \
            "cd eest && uv run --frozen consume direct --input='$ROOT/fixtures' --bin='$BIN/nethtest' -q"
          echo "fixture_files=$(find "$ROOT/fixtures" -type f | wc -l | tr -d ' ')" >> "$STATUS"
          echo "eest_commit=$(git -C eest rev-parse HEAD)" >> "$STATUS"
          echo "geth_commit=$(git -C geth rev-parse HEAD)" >> "$STATUS"
          echo "besu_commit=$(git -C besu rev-parse HEAD)" >> "$STATUS"
          echo "nethermind_commit=$(git -C nethermind rev-parse HEAD)" >> "$STATUS"
          set -a; . "$STATUS"; set +a
          label="infra-failure"
          if [ "${build_geth:-1}" = 0 ] && [ "${fill_oracle:-1}" = 0 ] && \
             [ "${build_besu:-1}" = 0 ] && [ "${build_nethermind:-1}" = 0 ]; then
            if [ "${geth_consume:-1}" = 0 ] && [ "${besu_consume:-1}" = 0 ] && [ "${nethermind_consume:-1}" = 0 ]; then
              label="all-pass"
            else
              label="client-difference"
            fi
          fi
          echo "classification=$label" >> "$STATUS"
          python - "$STATUS" "$ROOT/status/status.json" <<'PY'
          import json, sys
          data = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              k, v = line.rstrip("\n").split("=", 1)
              data[k] = int(v) if v.isdigit() else v
          json.dump(data, open(sys.argv[2], "w", encoding="utf-8"), indent=2, sort_keys=True)
          PY
          sha256sum "$ROOT/status/status.json" > "$ROOT/status/SHA256SUMS.txt"
          echo "artifact_label=$label" >> "$GITHUB_OUTPUT"

      - name: Upload non-sensitive Amsterdam matrix status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-eip7702-v6-${{ steps.matrix.outputs.artifact_label || 'unknown' }}
          path: eth7702-v6/status
          if-no-files-found: error
          retention-days: 1

      - name: Strict Amsterdam matrix gate
        if: always()
        shell: bash
        run: |
          set -a; . eth7702-v6/status/status.env; set +a
          [ "$build_geth" = 0 ] && [ "$fill_oracle" = 0 ]
          [ "$build_besu" = 0 ] && [ "$build_nethermind" = 0 ]
          [ "$geth_consume" = 0 ] && [ "$besu_consume" = 0 ] && [ "$nethermind_consume" = 0 ]
