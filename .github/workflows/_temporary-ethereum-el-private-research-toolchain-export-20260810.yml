name: Temporary Ethereum EL Private Research Toolchain Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ethereum-el-toolchain-export-20260810
  cancel-in-progress: false

jobs:
  export:
    if: github.head_ref == 'ethereum-el-toolchain-export-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact EELS
        uses: actions/checkout@v4
        with:
          repository: ethereum/execution-specs
          ref: 343274cc0f43962ff39a648e2b2614bf227f8d1f
          path: eest
          persist-credentials: false

      - name: Checkout exact Geth
        uses: actions/checkout@v4
        with:
          repository: ethereum/go-ethereum
          ref: v1.17.5
          path: geth
          persist-credentials: false

      - name: Checkout exact Besu
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: eest/uv.lock

      - name: Configure Go from Geth module
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: true
          cache-dependency-path: geth/go.sum

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Build official runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/runtime/bin export/runtime/meta export/geth-dev/meta

          cd eest
          uv run --frozen fill --help >/dev/null
          cd ..

          go -C geth build -trimpath -o "$GITHUB_WORKSPACE/export/runtime/bin/geth-evm" ./cmd/evm
          go -C geth build -trimpath -o "$GITHUB_WORKSPACE/export/runtime/bin/geth" ./cmd/geth

          cd besu
          ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace
          cd ..

          export/runtime/bin/geth-evm --version > export/runtime/meta/geth-evm-version.txt
          export/runtime/bin/geth version > export/runtime/meta/geth-version.txt
          besu/ethereum/evmtool/build/install/evmtool/bin/evmtool --version \
            > export/runtime/meta/besu-evmtool-version.txt
          {
            echo "eest=$(git -C eest rev-parse HEAD)"
            echo "geth=$(git -C geth rev-parse HEAD)"
            echo "besu=$(git -C besu rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            echo "uv=$(uv --version)"
            echo "go=$(go version)"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "runner=$(uname -a)"
          } > export/runtime/meta/environment.txt

      - name: Assemble portable runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/export/runtime"
          rsync -a --exclude='.git' eest/ "$ROOT/eest/"
          rsync -a besu/ethereum/evmtool/build/install/evmtool/ "$ROOT/besu-evmtool/"
          rsync -a "$pythonLocation/" "$ROOT/python/"
          rsync -a "$JAVA_HOME/" "$ROOT/jdk/"
          cp "$(command -v uv)" "$ROOT/bin/uv"

          cat > "$ROOT/relocate.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PY="$ROOT/python/bin/python3.12"
          test -x "$PY"
          rm -f "$ROOT/eest/.venv/bin/python" "$ROOT/eest/.venv/bin/python3" "$ROOT/eest/.venv/bin/python3.12"
          ln -s "$PY" "$ROOT/eest/.venv/bin/python"
          ln -s "$PY" "$ROOT/eest/.venv/bin/python3"
          ln -s "$PY" "$ROOT/eest/.venv/bin/python3.12"
          if [ -f "$ROOT/eest/.venv/pyvenv.cfg" ]; then
            sed -i "s#^home = .*#home = $ROOT/python/bin#" "$ROOT/eest/.venv/pyvenv.cfg"
            sed -i "s#^executable = .*#executable = $PY#" "$ROOT/eest/.venv/pyvenv.cfg" || true
          fi
          printf '%s\n' "$ROOT" > "$ROOT/.relocated"
          EOF

          cat > "$ROOT/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export JAVA_HOME="$ROOT/jdk"
          export VIRTUAL_ENV="$ROOT/eest/.venv"
          export PATH="$ROOT/eest/.venv/bin:$ROOT/python/bin:$ROOT/jdk/bin:$ROOT/bin:$ROOT/besu-evmtool/bin:$PATH"
          export EEST_ROOT="$ROOT/eest"
          EOF

          cat > "$ROOT/bin/eest-fill" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          test -f "$ROOT/.relocated" || "$ROOT/relocate.sh"
          exec "$ROOT/eest/.venv/bin/python" "$ROOT/eest/.venv/bin/fill" "$@"
          EOF

          cat > "$ROOT/bin/eest-consume" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          test -f "$ROOT/.relocated" || "$ROOT/relocate.sh"
          exec "$ROOT/eest/.venv/bin/python" "$ROOT/eest/.venv/bin/consume" "$@"
          EOF

          chmod +x "$ROOT/relocate.sh" "$ROOT/activate.sh" "$ROOT/bin/eest-fill" "$ROOT/bin/eest-consume"
          du -sh "$ROOT" | tee "$ROOT/meta/uncompressed-size.txt"
          tar -C export -czf ethereum-el-runtime-toolchain-20260810.tar.gz runtime
          sha256sum ethereum-el-runtime-toolchain-20260810.tar.gz \
            > ethereum-el-runtime-toolchain-20260810.tar.gz.sha256

      - name: Assemble Geth development bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/export/geth-dev"
          rsync -a --exclude='.git' geth/ "$ROOT/go-ethereum/"
          rsync -a "$(go env GOROOT)/" "$ROOT/go/"
          rsync -a "$(go env GOMODCACHE)/" "$ROOT/gomodcache/"
          cp export/runtime/bin/geth-evm "$ROOT/geth-evm"
          cp export/runtime/bin/geth "$ROOT/geth"
          {
            echo "geth=$(git -C geth rev-parse HEAD)"
            echo "go=$(go version)"
            echo "goroot=$(go env GOROOT)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } > "$ROOT/meta/environment.txt"
          cat > "$ROOT/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export GOROOT="$ROOT/go"
          export GOMODCACHE="$ROOT/gomodcache"
          export GOCACHE="$ROOT/gocache"
          export PATH="$ROOT/go/bin:$PATH"
          mkdir -p "$GOCACHE"
          EOF
          chmod +x "$ROOT/activate.sh"
          du -sh "$ROOT" | tee "$ROOT/meta/uncompressed-size.txt"
          tar -C export -czf geth-v1.17.5-dev-toolchain-20260810.tar.gz geth-dev
          sha256sum geth-v1.17.5-dev-toolchain-20260810.tar.gz \
            > geth-v1.17.5-dev-toolchain-20260810.tar.gz.sha256

      - name: Upload runtime toolchain
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-el-runtime-toolchain-20260810
          path: |
            ethereum-el-runtime-toolchain-20260810.tar.gz
            ethereum-el-runtime-toolchain-20260810.tar.gz.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload Geth development toolchain
        uses: actions/upload-artifact@v4
        with:
          name: geth-v1.17.5-dev-toolchain-20260810
          path: |
            geth-v1.17.5-dev-toolchain-20260810.tar.gz
            geth-v1.17.5-dev-toolchain-20260810.tar.gz.sha256
          compression-level: 0
          retention-days: 1
