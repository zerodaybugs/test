name: Temporary Ethereum EL Runtime Split Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ethereum-el-runtime-split-export-20260810
  cancel-in-progress: false

jobs:
  export:
    if: github.head_ref == 'ethereum-el-toolchain-export-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact EELS
        uses: actions/checkout@v4
        with:
          repository: ethereum/execution-specs
          ref: 343274cc0f43962ff39a648e2b2614bf227f8d1f
          path: eest
          persist-credentials: false

      - name: Checkout exact Besu
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: eest/uv.lock

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Build exact runtimes
        shell: bash
        run: |
          set -euo pipefail
          cd eest
          uv run --frozen fill --help >/dev/null
          cd ../besu
          ./gradlew :ethereum:evmtool:installDist --no-daemon --stacktrace
          cd ..
          mkdir -p export/meta
          {
            echo "eest=$(git -C eest rev-parse HEAD)"
            echo "besu=$(git -C besu rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            echo "uv=$(uv --version)"
            echo "java=$(java -version 2>&1 | head -1)"
          } > export/meta/environment.txt

      - name: Assemble EELS and Python bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/export/eels-python"
          mkdir -p "$ROOT/bin" "$ROOT/meta"
          rsync -a --exclude='.git' eest/ "$ROOT/eest/"
          rsync -a "$pythonLocation/" "$ROOT/python/"
          cp "$(command -v uv)" "$ROOT/bin/uv"
          cp export/meta/environment.txt "$ROOT/meta/environment.txt"
          cat > "$ROOT/relocate.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PY="$ROOT/python/bin/python3.12"
          test -x "$PY"
          rm -f "$ROOT/eest/.venv/bin/python" "$ROOT/eest/.venv/bin/python3" "$ROOT/eest/.venv/bin/python3.12"
          ln -s "$PY" "$ROOT/eest/.venv/bin/python"
          ln -s "$PY" "$ROOT/eest/.venv/bin/python3"
          ln -s "$PY" "$ROOT/eest/.venv/bin/python3.12"
          if [ -f "$ROOT/eest/.venv/pyvenv.cfg" ]; then
            sed -i "s#^home = .*#home = $ROOT/python/bin#" "$ROOT/eest/.venv/pyvenv.cfg"
            sed -i "s#^executable = .*#executable = $PY#" "$ROOT/eest/.venv/pyvenv.cfg" || true
          fi
          printf '%s\n' "$ROOT" > "$ROOT/.relocated"
          EOF
          cat > "$ROOT/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          test -f "$ROOT/.relocated" || "$ROOT/relocate.sh"
          export VIRTUAL_ENV="$ROOT/eest/.venv"
          export EEST_ROOT="$ROOT/eest"
          export PATH="$ROOT/eest/.venv/bin:$ROOT/python/bin:$ROOT/bin:$PATH"
          EOF
          chmod +x "$ROOT/relocate.sh" "$ROOT/activate.sh"
          tar -C export -czf ethereum-eels-python312-20260810.tar.gz eels-python
          sha256sum ethereum-eels-python312-20260810.tar.gz > ethereum-eels-python312-20260810.tar.gz.sha256
          du -sh "$ROOT" ethereum-eels-python312-20260810.tar.gz

      - name: Assemble Besu evmtool bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/export/besu-evmtool"
          mkdir -p "$ROOT/meta"
          rsync -a besu/ethereum/evmtool/build/install/evmtool/ "$ROOT/evmtool/"
          cp export/meta/environment.txt "$ROOT/meta/environment.txt"
          tar -C export -czf besu-26.7.1-evmtool-20260810.tar.gz besu-evmtool
          sha256sum besu-26.7.1-evmtool-20260810.tar.gz > besu-26.7.1-evmtool-20260810.tar.gz.sha256
          du -sh "$ROOT" besu-26.7.1-evmtool-20260810.tar.gz

      - name: Assemble JDK 25 bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/export/jdk25"
          mkdir -p "$ROOT/meta"
          rsync -a "$JAVA_HOME/" "$ROOT/jdk/"
          cp export/meta/environment.txt "$ROOT/meta/environment.txt"
          tar -C export -czf temurin-jdk25-20260810.tar.gz jdk25
          sha256sum temurin-jdk25-20260810.tar.gz > temurin-jdk25-20260810.tar.gz.sha256
          du -sh "$ROOT" temurin-jdk25-20260810.tar.gz

      - name: Upload EELS and Python
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-eels-python312-20260810
          path: |
            ethereum-eels-python312-20260810.tar.gz
            ethereum-eels-python312-20260810.tar.gz.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload Besu evmtool
        uses: actions/upload-artifact@v4
        with:
          name: besu-26.7.1-evmtool-20260810
          path: |
            besu-26.7.1-evmtool-20260810.tar.gz
            besu-26.7.1-evmtool-20260810.tar.gz.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload JDK 25
        uses: actions/upload-artifact@v4
        with:
          name: temurin-jdk25-20260810
          path: |
            temurin-jdk25-20260810.tar.gz
            temurin-jdk25-20260810.tar.gz.sha256
          compression-level: 0
          retention-days: 1
