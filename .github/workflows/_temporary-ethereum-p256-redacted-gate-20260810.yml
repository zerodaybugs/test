name: Temporary Ethereum P256 Redacted Differential Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-ethereum-p256-redacted-20260810
  cancel-in-progress: true

jobs:
  p256-redacted-differential:
    if: github.head_ref == 'ethereum-p256-redacted-gate-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout public research branch
        uses: actions/checkout@v4
        with:
          ref: ethereum-p256-redacted-gate-20260810
          path: research-repo
          persist-credentials: false

      - name: Checkout exact Besu release
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 26.7.1
          path: besu
          persist-credentials: false

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            besu/**/*.gradle*
            besu/gradle/wrapper/gradle-wrapper.properties

      - name: Install redacted differential test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-result/meta research-result/logs research-result/private
          cp research-repo/research/ethereum/p256/P256NativeJavaRedactedDifferentialTest.java \
             besu/evm/src/test/java/org/hyperledger/besu/evm/precompile/P256NativeJavaRedactedDifferentialTest.java
          {
            echo "besu_commit=$(git -C besu rev-parse HEAD)"
            echo "research_commit=$(git -C research-repo rev-parse HEAD)"
            echo "runner=$(uname -a)"
            echo "java=$(java -version 2>&1 | head -1)"
            sha256sum research-repo/research/ethereum/p256/P256NativeJavaRedactedDifferentialTest.java
          } | tee research-result/meta/environment.txt

      - name: Execute exact P256 differential
        id: differential
        shell: bash
        env:
          P256_EVIDENCE_FILE: ${{ github.workspace }}/research-result/private/p256-candidate-evidence.txt
        run: |
          set -o pipefail
          cd besu
          timeout 4200s ./gradlew :evm:test \
            --tests org.hyperledger.besu.evm.precompile.P256NativeJavaRedactedDifferentialTest \
            --no-daemon --stacktrace --info 2>&1 \
            | tee ../research-result/logs/p256-differential.log
          rc=${PIPESTATUS[0]}
          echo "test_exit_code=$rc" | tee ../research-result/meta/exit-codes.txt
          exit "$rc"

      - name: Classify machine result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG=research-result/logs/p256-differential.log
          mkdir -p research-result/meta
          if [ ! -f "$LOG" ]; then
            decision='INCONCLUSIVE_NO_LOG'
          elif grep -q 'P256_CONSENSUS_DIFFERENTIAL_CANDIDATE' "$LOG"; then
            decision='CANDIDATE_CONSENSUS_DIFFERENTIAL'
          elif grep -q 'P256_GATE_INCONCLUSIVE_' "$LOG"; then
            decision='INCONCLUSIVE_IMPLEMENTATION_UNAVAILABLE'
          elif grep -q 'BUILD SUCCESSFUL' "$LOG" \
            && grep -q 'P256_DIFF_VALID_MUTATION_PASS' "$LOG" \
            && grep -q 'P256_DIFF_RAW_PASS' "$LOG" \
            && grep -q 'P256_DIFF_BOUNDARY_PASS' "$LOG" \
            && grep -q 'P256_DIFF_LENGTH_PASS' "$LOG"; then
            decision='NO_DIFFERENTIAL_OBSERVED'
          else
            decision='INCONCLUSIVE_GATE_INCOMPLETE'
          fi
          printf '%s\n' "$decision" | tee research-result/meta/decision.txt
          if [ "$decision" = 'CANDIDATE_CONSENSUS_DIFFERENTIAL' ]; then
            test -s research-result/private/p256-candidate-evidence.txt
          fi

      - name: Encrypt exact evidence and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/research-result"
          OUT="$GITHUB_WORKSPACE/encrypted-artifact"
          mkdir -p "$ROOT" "$OUT"
          cat > /tmp/research-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsHpE3Q89tjL2jIGECuvc
          XBAFyMz47sjahIivKbjLvz0Jc6Tlhsl5qdm67N/KUZw9mBglWICPEYQpWBezdwNm
          DJ+wlcx6zHLaIo0bhYFejerOzUYQqVcDE65neuMQWohC8S4s1/ehc09t8eSuYf+h
          ebW2gTlnmJNVZm9K49n5fgUovsicZfI155RAsNv+0S+1o2MJ0l6fdu6d2XH609Ae
          fqS29du55AzUshkcMtm/iDEm1A9+fjUG4DD2Z/op4EA/PsJgGZw25EWqbxGHfrfR
          5tE7ly5+aunFpHr7CXQsUwnYdAr+fdJWUh2KaL5g4zP048ALG84l0s4R7p0GCz3k
          RoxqZoegS++h527T/nlOcIb1ty7s25yC3GLa56J+A8qMXbbFER4r3SC27gxJSoZi
          DXfXrCVjVzay5OP2O8LUgLJR54aAPS+okCDOK4V82kmvgGuEo/7X0AMxuImkL6kH
          h0t8hMVY7EHOTtgb6fPC/vNha14HaXaX/v0Xephkf9yTAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/research-result.tar.gz research-result
          keyhex="$(openssl rand -hex 32)"
          ivhex="$(openssl rand -hex 16)"
          printf '%s\n%s\n' "$keyhex" "$ivhex" > /tmp/key-material.txt
          openssl enc -aes-256-cbc -K "$keyhex" -iv "$ivhex" \
            -in /tmp/research-result.tar.gz \
            -out "$OUT/research-result.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey /tmp/research-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/key-material.txt \
            -out "$OUT/key-material.rsa-oaep.enc"
          (cd "$OUT" && sha256sum key-material.rsa-oaep.enc research-result.tar.gz.enc > SHA256SUMS.txt)
          echo 'ENCRYPTED_ETHEREUM_P256_REDACTED_V1' > "$OUT/FORMAT.txt"
          rm -rf "$ROOT" /tmp/research-result.tar.gz /tmp/key-material.txt /tmp/research-public.pem

      - name: Upload encrypted-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-p256-redacted-differential-encrypted
          path: encrypted-artifact
          if-no-files-found: error
          retention-days: 1
