name: evm-readonly-encrypted-census

on:
  push:
    branches: [agent/evm-readonly-encrypted-20260816]
    paths:
      - tmp_evm_encrypted/**
      - .github/workflows/_temporary-evm-encrypted-census-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evm-readonly-encrypted-20260816
          fetch-depth: 1

      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'

      - name: Reconstruct and verify read-only census
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_evm_encrypted/census.part00 \
              tmp_evm_encrypted/census.part01 \
              tmp_evm_encrypted/census.part02 \
              tmp_evm_encrypted/census.part03 \
              tmp_evm_encrypted/census.part04 > /tmp/census.py
          echo '38bd85a69e75aa2fdc4956f0c5ea9350663a86a7490ac15eeac71c080bf653e0  /tmp/census.py' | sha256sum --check --strict
          python3 -m py_compile /tmp/census.py

      - name: Run without public result output
        shell: bash
        run: |
          set +e
          python3 /tmp/census.py > /tmp/private_run.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/private_exit_code.txt
          echo "PRIVATE_CENSUS_EXIT_CODE_RECORDED"

      - name: Encrypt complete result bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/private_exit_code.txt
          mkdir -p encrypted_delivery
          if [ -d census_results ]; then
            tar -czf /tmp/private_payload.tar.gz census_results /tmp/private_run.log /tmp/private_exit_code.txt /tmp/census.py
          else
            tar -czf /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt /tmp/census.py
          fi
          openssl rand 32 > /tmp/private_aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/private_payload.tar.gz \
            -out encrypted_delivery/payload.aes256 \
            -pass file:/tmp/private_aes.key
          openssl pkeyutl -encrypt -pubin \
            -inkey tmp_evm_encrypted/r19_public.pem \
            -in /tmp/private_aes.key \
            -out encrypted_delivery/key.rsa3072 \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_delivery/payload.aes256 encrypted_delivery/key.rsa3072 > encrypted_delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('encrypted_delivery')
          exit_code = int(Path('/tmp/private_exit_code.txt').read_text().strip())
          manifest = {
              'schema': 'encrypted-readonly-census-delivery-v1',
              'runner_exit_code': exit_code,
              'script_sha256': '38bd85a69e75aa2fdc4956f0c5ea9350663a86a7490ac15eeac71c080bf653e0',
              'encryption': 'AES-256-CBC/PBKDF2-250000 + RSA-3072-OAEP-SHA256 wrapped key',
              'plaintext_results_publicly_exposed': False,
              'transactions_signed': 0,
              'transactions_sent': 0,
          }
          (root/'PUBLIC_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True))
          PY
          rm -rf census_results
          rm -f /tmp/private_run.log /tmp/private_exit_code.txt /tmp/private_payload.tar.gz /tmp/private_aes.key /tmp/census.py

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-readonly-census-results
          path: encrypted_delivery
          if-no-files-found: error
          retention-days: 1
