name: evm-r20e-encrypted-corrected-matrix

on:
  push:
    branches: [agent/evm-readonly-encrypted-20260816]
    paths:
      - tmp_evm_encrypted/generate_r20_roundtrip.py
      - tmp_evm_encrypted/r19_public.pem
      - .github/workflows/_temporary-evm-r20e-corrected-matrix-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chain_name: optimism
            chain_id: 10
            rpc_url: https://optimism-rpc.publicnode.com
          - chain_name: bnb
            chain_id: 56
            rpc_url: https://bsc-rpc.publicnode.com
          - chain_name: polygon
            chain_id: 137
            rpc_url: https://polygon-bor-rpc.publicnode.com
          - chain_name: base
            chain_id: 8453
            rpc_url: https://base-rpc.publicnode.com
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      R20_CHAIN_NAME: ${{ matrix.chain_name }}
      R20_CHAIN_ID: ${{ matrix.chain_id }}
      R20_RPC_URL: ${{ matrix.rpc_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evm-readonly-encrypted-20260816
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned generator dependency
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'

      - name: Verify explicit-state RPC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,requests
          chain=int(os.environ['R20_CHAIN_ID']);url=os.environ['R20_RPC_URL']
          scope=requests.get('https://raw.githubusercontent.com/zerodaybugs/test/agent/kiln-omnivault-r11-readonly/r13_persisted_results/31910466827/r13_generation/SCOPE.json',timeout=45).json()
          vault=next(row['vault'] for row in scope if int(row['chain_id'])==chain)
          def q(method,params):
            r=requests.post(url,json={'jsonrpc':'2.0','id':1,'method':method,'params':params},timeout=25,allow_redirects=False)
            r.raise_for_status();d=r.json();assert 'result' in d,d;return d['result']
          assert int(q('eth_chainId',[]),16)==chain
          b=q('eth_blockNumber',[])
          q('eth_getBlockByNumber',[b,False]);q('eth_getCode',[vault,b])
          print('R20E_RPC_GATE=PASS')
          PY

      - name: Generate and harden snapshot-isolated test
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp_evm_encrypted/generate_r20_roundtrip.py > /tmp/r20_generation.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/KilnR20RoundTrip.t.sol');s=p.read_text()
          s=s.replace('_scanVault(rpc, fixedBlock, vaults[i]);','_scanVault(vaults[i]);')
          s=s.replace('function _scanVault(string memory rpc, uint256 fixedBlock, address vaultAddr) internal {\n        vm.createSelectFork(rpc, fixedBlock);','function _scanVault(address vaultAddr) internal {')
          s=s.replace('_attempt(rpc, fixedBlock, vaultAddr, asset, small, totalAssetsBefore)','_attempt(vaultAddr, asset, small, totalAssetsBefore)')
          s=s.replace('_attempt(rpc, fixedBlock, vaultAddr, asset, material, totalAssetsBefore)','_attempt(vaultAddr, asset, material, totalAssetsBefore)')
          s=s.replace('''function _attempt(\n        string memory rpc,\n        uint256 fixedBlock,\n        address vaultAddr,''','''function _attempt(\n        address vaultAddr,''')
          s=s.replace('''    ) internal returns (Result memory result) {\n        vm.createSelectFork(rpc, fixedBlock);\n        IR20Vault vault''','''    ) internal returns (Result memory result) {\n        uint256 snapshotId = vm.snapshotState();\n        IR20Vault vault''')
          s=s.replace('deal(asset, ATTACKER, amount, true);','deal(asset, ATTACKER, amount, false);')
          s=s.replace('''            result.depositError = bytes4(keccak256("APPROVE_FAILED"));\n            return result;''','''            result.depositError = bytes4(keccak256("APPROVE_FAILED"));\n            require(vm.revertToState(snapshotId), "snapshot restore failed");\n            return result;''')
          s=s.replace('''            result.afterBalance = token.balanceOf(ATTACKER);\n            return result;''','''            result.afterBalance = token.balanceOf(ATTACKER);\n            require(vm.revertToState(snapshotId), "snapshot restore failed");\n            return result;''')
          s=s.replace('''        catch { result.totalAssetsAfter = type(uint256).max; }\n    }''','''        catch { result.totalAssetsAfter = type(uint256).max; }\n        require(vm.revertToState(snapshotId), "snapshot restore failed");\n    }''')
          for needle in ['vm.snapshotState()','vm.revertToState(snapshotId)','deal(asset, ATTACKER, amount, false);']:
            assert needle in s,needle
          assert 'vm.createSelectFork(rpc, fixedBlock);' not in s
          p.write_text(s)
          PY
          sha256sum test/KilnR20RoundTrip.t.sol > /tmp/r20_source.sha256

      - name: Execute corrected local fork privately
        shell: bash
        run: |
          set +e
          forge test --via-ir --match-contract KilnR20RoundTrip -vv > /tmp/r20_forge.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/r20_exit_code.txt
          forge --version > /tmp/r20_foundry_version.txt
          echo 'R20E_PRIVATE_EXECUTION_RECORDED'

      - name: Encrypt result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_r20e
          tar -czf /tmp/r20_payload.tar.gz test/KilnR20RoundTrip.t.sol /tmp/r20_generation.log /tmp/r20_source.sha256 /tmp/r20_forge.log /tmp/r20_exit_code.txt /tmp/r20_foundry_version.txt
          openssl rand 32 > /tmp/r20_aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in /tmp/r20_payload.tar.gz -out encrypted_r20e/payload.aes256 -pass file:/tmp/r20_aes.key
          openssl pkeyutl -encrypt -pubin -inkey tmp_evm_encrypted/r19_public.pem -in /tmp/r20_aes.key -out encrypted_r20e/key.rsa3072 -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_r20e/payload.aes256 encrypted_r20e/key.rsa3072 > encrypted_r20e/SHA256SUMS.txt
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('encrypted_r20e/PUBLIC_MANIFEST.json').write_text(json.dumps({
            'schema':'encrypted-r20e-corrected-matrix-v1','chain_name':os.environ['R20_CHAIN_NAME'],'chain_id':int(os.environ['R20_CHAIN_ID']),
            'forge_exit_code':int(Path('/tmp/r20_exit_code.txt').read_text().strip()),'source_commit':'${{ github.sha }}',
            'plaintext_results_publicly_exposed':False,'public_chain_transactions_signed':0,'public_chain_transactions_sent':0,
            'execution':'single latest local fork with snapshot/revert isolation and unchanged underlying totalSupply',
            'encryption':'AES-256-CBC/PBKDF2-250000 + RSA-3072-OAEP-SHA256 wrapped key'},indent=2,sort_keys=True))
          PY
          rm -f /tmp/r20_payload.tar.gz /tmp/r20_aes.key /tmp/r20_forge.log /tmp/r20_exit_code.txt /tmp/r20_generation.log /tmp/r20_source.sha256
          rm -f test/KilnR20RoundTrip.t.sol

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-r20e-${{ matrix.chain_name }}
          path: encrypted_r20e
          if-no-files-found: error
          retention-days: 1
