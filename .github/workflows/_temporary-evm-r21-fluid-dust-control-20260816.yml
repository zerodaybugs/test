name: evm-r21-encrypted-fluid-dust-control

on:
  push:
    branches: [agent/evm-readonly-encrypted-20260816]
    paths:
      - tmp_evm_encrypted/generate_r21_fluid_dust.py
      - tmp_evm_encrypted/r19_public.pem
      - .github/workflows/_temporary-evm-r21-fluid-dust-control-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      R21_RPC_URL: https://rpc.flashbots.net

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evm-readonly-encrypted-20260816
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned generator dependency
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'

      - name: Verify RPC and generate exact control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests
          u='https://rpc.flashbots.net'
          def q(method,params):
            r=requests.post(u,json={'jsonrpc':'2.0','id':1,'method':method,'params':params},timeout=25,allow_redirects=False)
            r.raise_for_status();d=r.json();assert 'result' in d,d;return d['result']
          assert int(q('eth_chainId',[]),16)==1
          b=q('eth_blockNumber',[])
          q('eth_getBlockByNumber',[b,False])
          print('R21_RPC_GATE=PASS')
          PY
          python3 tmp_evm_encrypted/generate_r21_fluid_dust.py > /tmp/r21_generation.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/KilnR21FluidDust.t.sol')
          s=p.read_text()
          old='''        vm.prank(ATTACKER);\n        bool ok=IR21Token(asset).approve(vaultAddr,type(uint256).max);\n        require(ok,"approve");'''
          new='''        vm.prank(ATTACKER);\n        (bool ok,bytes memory ret)=asset.call(abi.encodeWithSelector(bytes4(0x095ea7b3),vaultAddr,type(uint256).max));\n        require(ok && (ret.length==0 || (ret.length>=32 && abi.decode(ret,(bool)))),"approve");'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('''        bool secondRedeemOk;\n        bytes4 secondRedeemError;''','''        bool secondRedeemOk;\n        bytes4 secondRedeemError;\n        uint256 secondRedeemReceived;\n        uint256 attackerAssetAfterSecond;''')
          s=s.replace('''            try v.redeem(a.remainingShares,ATTACKER,ATTACKER) returns(uint256) { a.secondRedeemOk=true; }''','''            try v.redeem(a.remainingShares,ATTACKER,ATTACKER) returns(uint256 received) { a.secondRedeemOk=true; a.secondRedeemReceived=received; }''')
          s=s.replace('''        }\n        _log(vaultAddr,armId,a);''','''        }\n        a.attackerAssetAfterSecond=IR21Token(asset).balanceOf(ATTACKER);\n        _log(vaultAddr,armId,a);''')
          s=s.replace('''        console2.logBytes4(a.secondRedeemError);\n        console2.log("R21_ARM_END");''','''        console2.logBytes4(a.secondRedeemError);\n        console2.log("R21_SECOND_REDEEM_RECEIVED",a.secondRedeemReceived);\n        console2.log("R21_ATTACKER_ASSET_AFTER_SECOND",a.attackerAssetAfterSecond);\n        console2.log("R21_FINAL_ASSET_LOSS_RAW",a.amount-a.attackerAssetAfterSecond);\n        console2.log("R21_ARM_END");''')
          for needle in ['low-level optional-return compatible' if False else 'asset.call(abi.encodeWithSelector','R21_FINAL_ASSET_LOSS_RAW','secondRedeemReceived=received']:
            assert needle in s,needle
          p.write_text(s)
          PY
          sha256sum test/KilnR21FluidDust.t.sol > /tmp/r21_source.sha256
          python3 -m py_compile tmp_evm_encrypted/generate_r21_fluid_dust.py

      - name: Execute isolated local-fork control privately
        shell: bash
        run: |
          set +e
          forge test --via-ir --match-contract KilnR21FluidDust -vvv > /tmp/r21_forge.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/r21_exit_code.txt
          forge --version > /tmp/r21_foundry_version.txt
          echo 'R21_PRIVATE_EXECUTION_RECORDED'

      - name: Encrypt result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_r21
          tar -czf /tmp/r21_payload.tar.gz test/KilnR21FluidDust.t.sol /tmp/r21_generation.log /tmp/r21_source.sha256 /tmp/r21_forge.log /tmp/r21_exit_code.txt /tmp/r21_foundry_version.txt
          openssl rand 32 > /tmp/r21_aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in /tmp/r21_payload.tar.gz -out encrypted_r21/payload.aes256 -pass file:/tmp/r21_aes.key
          openssl pkeyutl -encrypt -pubin -inkey tmp_evm_encrypted/r19_public.pem -in /tmp/r21_aes.key -out encrypted_r21/key.rsa3072 -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_r21/payload.aes256 encrypted_r21/key.rsa3072 > encrypted_r21/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('encrypted_r21/PUBLIC_MANIFEST.json').write_text(json.dumps({
            'schema':'encrypted-r21-fluid-control-v3',
            'forge_exit_code':int(Path('/tmp/r21_exit_code.txt').read_text().strip()),
            'source_commit':'${{ github.sha }}',
            'approval_harness':'low-level optional-return compatible',
            'measures_final_balance_after_second_redeem':True,
            'plaintext_results_publicly_exposed':False,
            'public_chain_transactions_signed':0,
            'public_chain_transactions_sent':0,
            'execution':'single latest Ethereum local fork with snapshot/revert isolation and unchanged underlying totalSupply',
            'encryption':'AES-256-CBC/PBKDF2-250000 + RSA-3072-OAEP-SHA256 wrapped key'
          },indent=2,sort_keys=True))
          PY
          rm -f /tmp/r21_payload.tar.gz /tmp/r21_aes.key /tmp/r21_forge.log /tmp/r21_exit_code.txt /tmp/r21_generation.log /tmp/r21_source.sha256
          rm -f test/KilnR21FluidDust.t.sol

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-r21-fluid-control
          path: encrypted_r21
          if-no-files-found: error
          retention-days: 1
