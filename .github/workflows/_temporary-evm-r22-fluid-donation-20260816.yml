name: evm-r22-encrypted-fluid-donation

on:
  push:
    branches: [agent/evm-readonly-encrypted-20260816]
    paths:
      - tmp_evm_encrypted/generate_r22_fluid_donation.py
      - tmp_evm_encrypted/r19_public.pem
      - .github/workflows/_temporary-evm-r22-fluid-donation-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  donation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      R22_RPC_URL: https://rpc.flashbots.net

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evm-readonly-encrypted-20260816
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned generator dependency
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'

      - name: Verify RPC and generate exact attack/control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests
          u='https://rpc.flashbots.net'
          def q(method,params):
            r=requests.post(u,json={'jsonrpc':'2.0','id':1,'method':method,'params':params},timeout=25,allow_redirects=False)
            r.raise_for_status();d=r.json();assert 'result' in d,d;return d['result']
          assert int(q('eth_chainId',[]),16)==1
          b=q('eth_blockNumber',[]);q('eth_getBlockByNumber',[b,False])
          print('R22_RPC_GATE=PASS')
          PY
          python3 tmp_evm_encrypted/generate_r22_fluid_donation.py > /tmp/r22_generation.log 2>&1
          python3 -m py_compile tmp_evm_encrypted/generate_r22_fluid_donation.py
          sha256sum test/KilnR22FluidDonation.t.sol > /tmp/r22_source.sha256

      - name: Execute realistic local-fork donation attack privately
        shell: bash
        run: |
          set +e
          forge test --via-ir --match-contract KilnR22FluidDonation -vvv > /tmp/r22_forge.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/r22_exit_code.txt
          forge --version > /tmp/r22_foundry_version.txt
          echo 'R22_PRIVATE_EXECUTION_RECORDED'

      - name: Encrypt result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_r22
          tar -czf /tmp/r22_payload.tar.gz \
            test/KilnR22FluidDonation.t.sol \
            /tmp/r22_generation.log \
            /tmp/r22_source.sha256 \
            /tmp/r22_forge.log \
            /tmp/r22_exit_code.txt \
            /tmp/r22_foundry_version.txt
          openssl rand 32 > /tmp/r22_aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in /tmp/r22_payload.tar.gz -out encrypted_r22/payload.aes256 -pass file:/tmp/r22_aes.key
          openssl pkeyutl -encrypt -pubin -inkey tmp_evm_encrypted/r19_public.pem -in /tmp/r22_aes.key -out encrypted_r22/key.rsa3072 -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_r22/payload.aes256 encrypted_r22/key.rsa3072 > encrypted_r22/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('encrypted_r22/PUBLIC_MANIFEST.json').write_text(json.dumps({
            'schema':'encrypted-r22-fluid-donation-v1',
            'forge_exit_code':int(Path('/tmp/r22_exit_code.txt').read_text().strip()),
            'source_commit':'${{ github.sha }}',
            'plaintext_results_publicly_exposed':False,
            'public_chain_transactions_signed':0,
            'public_chain_transactions_sent':0,
            'execution':'single latest Ethereum local fork; real fToken deposit and transfer donation; snapshot/revert isolation',
            'encryption':'AES-256-CBC/PBKDF2-250000 + RSA-3072-OAEP-SHA256 wrapped key'
          },indent=2,sort_keys=True))
          PY
          rm -f /tmp/r22_payload.tar.gz /tmp/r22_aes.key /tmp/r22_forge.log /tmp/r22_exit_code.txt /tmp/r22_generation.log /tmp/r22_source.sha256
          rm -f test/KilnR22FluidDonation.t.sol

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-r22-fluid-donation
          path: encrypted_r22
          if-no-files-found: error
          retention-days: 1
