name: Temporary export minimal official .NET 10 toolchain

on:
  push:
    branches:
      - agent/build-mit-krb5-1-21-3-toolchain-20260818
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Assemble minimal exact SDK/runtime tree
        shell: bash
        run: |
          set -euo pipefail
          src=/usr/share/dotnet
          dst="$PWD/minimal-dotnet"
          mkdir -p "$dst" artifact
          cp "$src/dotnet" "$dst/"
          cp -a "$src/host" "$dst/"
          mkdir -p "$dst/sdk" "$dst/shared/Microsoft.NETCore.App" "$dst/shared/Microsoft.AspNetCore.App" "$dst/packs"
          cp -a "$src/sdk/10.0.302" "$dst/sdk/"
          cp -a "$src/shared/Microsoft.NETCore.App/10.0.10" "$dst/shared/Microsoft.NETCore.App/"
          cp -a "$src/shared/Microsoft.AspNetCore.App/10.0.10" "$dst/shared/Microsoft.AspNetCore.App/"
          for p in Microsoft.NETCore.App.Ref Microsoft.AspNetCore.App.Ref Microsoft.NETCore.App.Host.linux-x64 NETStandard.Library.Ref; do
            if [ -d "$src/packs/$p" ]; then cp -a "$src/packs/$p" "$dst/packs/"; fi
          done
          DOTNET_ROOT="$dst" "$dst/dotnet" --info | tee artifact/DOTNET_INFO.txt
          tar -C "$dst" -I 'zstd -19 -T0' -cf artifact/dotnet-sdk-10.0.302-runtime-10.0.10-minimal-linux-x64.tar.zst .
          sha256sum artifact/* > artifact/SHA256SUMS.txt
          du -h artifact/* | tee artifact/SIZES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet10-minimal-sdk-runtime
          path: artifact/
          compression-level: 0
          retention-days: 1
