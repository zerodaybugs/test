name: Temporary export official .NET 10 Negotiate toolchain

on:
  push:
    branches:
      - agent/build-mit-krb5-1-21-3-toolchain-20260818
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Capture toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact work
          dotnet --info | tee artifact/DOTNET_INFO.txt
          dotnet --list-sdks | tee artifact/DOTNET_SDKS.txt
          dotnet --list-runtimes | tee artifact/DOTNET_RUNTIMES.txt
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          printf '%s\n' "$dotnet_root" > artifact/DOTNET_ROOT.txt
          tar -C "$dotnet_root" -I 'zstd -19 -T0' -cf artifact/dotnet-sdk-10.0.302-linux-x64.tar.zst .

      - name: Restore exact official package and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/restore
          cat > work/restore/restore.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestorePackagesPath>$(MSBuildThisFileDirectory)packages</RestorePackagesPath>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.Authentication.Negotiate" Version="10.0.10" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore work/restore/restore.csproj --force --no-cache --verbosity minimal
          find work/restore/packages -type f -print0 | sort -z | xargs -0 sha256sum > artifact/NUGET_TREE_SHA256SUMS.txt
          tar -C work/restore/packages -I 'zstd -19 -T0' -cf artifact/nuget-negotiate-10.0.10-packages.tar.zst .

      - name: Capture exact ASP.NET Core source tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v10.0.10 https://github.com/dotnet/aspnetcore.git work/aspnetcore-v10.0.10
          cd work/aspnetcore-v10.0.10
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/artifact/ASPNETCORE_COMMIT.txt"
          git status --short | tee "$GITHUB_WORKSPACE/artifact/ASPNETCORE_STATUS.txt"
          cd "$GITHUB_WORKSPACE"
          tar --exclude='.git' -C work/aspnetcore-v10.0.10 -I 'zstd -19 -T0' -cf artifact/aspnetcore-v10.0.10-source.tar.zst .

      - name: Build artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Official .NET SDK 10.0.302, Microsoft.AspNetCore.Authentication.Negotiate 10.0.10 package closure, and dotnet/aspnetcore v10.0.10 source.' > artifact/PROVENANCE.txt
          sha256sum artifact/* > artifact/SHA256SUMS.txt
          du -h artifact/* | tee artifact/SIZES.txt

      - name: Upload official toolchain bundle
        uses: actions/upload-artifact@v4
        with:
          name: dotnet10-negotiate-10.0.10-official-toolchain
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
