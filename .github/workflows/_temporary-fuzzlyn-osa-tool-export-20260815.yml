name: Temporary Fuzzlyn OSA Tool Export 20260815

on:
  push:
    branches:
      - agent/fuzzlyn-tool-20260815
    paths:
      - .github/workflows/_temporary-fuzzlyn-osa-tool-export-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-fuzzlyn-osa-tool-export-20260815
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out pinned Fuzzlyn source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakobbotsch/Fuzzlyn
          ref: 6c2e1d3f2d680c169e727098132e7b3659a8b690
          path: fuzzlyn-src
          persist-credentials: false
          fetch-depth: 1

      - name: Apply object-stack-allocation research profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('fuzzlyn-src')
          options = root / 'Fuzzlyn' / 'FuzzlynOptions.cs'
          text = options.read_text(encoding='utf-8-sig')

          replacements = {
              'public double MakeClassProb { get; set; } = 0.5;':
                  'public double MakeClassProb { get; set; } = 0.90;',
              '[(int)AggregateFieldKind.Primitive] = 0.65,':
                  '[(int)AggregateFieldKind.Primitive] = 0.44,',
              '[(int)AggregateFieldKind.Vector] = 0.15,':
                  '[(int)AggregateFieldKind.Vector] = 0.01,',
              '[(int)AggregateFieldKind.Aggregate] = 0.20,':
                  '[(int)AggregateFieldKind.Aggregate] = 0.55,',
              'public int ProgramMinStatements { get; set; } = 50;':
                  'public int ProgramMinStatements { get; set; } = 35;',
              'public ProbabilityDistribution NumAggregateTypesDist { get; set; } = new GeometricDistribution(0.4);':
                  'public ProbabilityDistribution NumAggregateTypesDist { get; set; } = new GeometricDistribution(0.25);',
              'public ProbabilityDistribution NumStructFieldsDist { get; set; } = new UniformRangeDistribution(1, 10);':
                  'public ProbabilityDistribution NumStructFieldsDist { get; set; } = new UniformRangeDistribution(1, 8);',
              'public ProbabilityDistribution NumClassFieldsDist { get; set; } = new UniformRangeDistribution(1, 10);':
                  'public ProbabilityDistribution NumClassFieldsDist { get; set; } = new UniformRangeDistribution(2, 8);',
              'public double MakeVectorProb { get; set; } = 0.3;':
                  'public double MakeVectorProb { get; set; } = 0.0;',
              '[(int)ExpressionKind.MemberAccess] = 0.46,':
                  '[(int)ExpressionKind.MemberAccess] = 0.38,',
              '[(int)ExpressionKind.Literal] = 0.21,':
                  '[(int)ExpressionKind.Literal] = 0.16,',
              '[(int)ExpressionKind.Call] = 0.11,':
                  '[(int)ExpressionKind.Call] = 0.10,',
              '[(int)ExpressionKind.NewObject] = 0.02,':
                  '[(int)ExpressionKind.NewObject] = 0.18,',
              '[(int)ExpressionKind.Unary] = 0.05,':
                  '[(int)ExpressionKind.Unary] = 0.04,',
              '[(int)ExpressionKind.Binary] = 0.05,':
                  '[(int)ExpressionKind.Binary] = 0.06,',
              '[(int)ExpressionKind.Increment] = 0.05,':
                  '[(int)ExpressionKind.Increment] = 0.04,',
              '[(int)ExpressionKind.Decrement] = 0.05,':
                  '[(int)ExpressionKind.Decrement] = 0.04,',
              'public double GenNewFunctionProb { get; set; } = 0.07;':
                  'public double GenNewFunctionProb { get; set; } = 0.12;',
              'public double GenCallToApiProb { get; set; } = 0.5;':
                  'public double GenCallToApiProb { get; set; } = 0.05;',
              'public double ParameterIsByRefProb { get; set; } = 0.25;':
                  'public double ParameterIsByRefProb { get; set; } = 0.35;',
              'public double LocalIsByRefProb { get; set; } = 0.10;':
                  'public double LocalIsByRefProb { get; set; } = 0.20;',
              'public double ReturnTypeIsByRefProb { get; set; } = 0.20;':
                  'public double ReturnTypeIsByRefProb { get; set; } = 0.30;',
              'public double MemberAccessSelectLocalProb { get; set; } = 0.8;':
                  'public double MemberAccessSelectLocalProb { get; set; } = 0.90;',
              'public double MakeMethodAsyncProb { get; set; } = 0.5;':
                  'public double MakeMethodAsyncProb { get; set; } = 0.0;',
              '[(int)LValueKind.Local] = 0.7,':
                  '[(int)LValueKind.Local] = 0.85,',
              '[(int)LValueKind.Static] = 0.2,':
                  '[(int)LValueKind.Static] = 0.05,',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          options.write_text(text, encoding='utf-8')

          program = root / 'Fuzzlyn' / 'Program.cs'
          ptext = program.read_text(encoding='utf-8-sig')
          old = 'options.GenExtensions = [Extension.Default];'
          new = 'options.GenExtensions = []; // OSA research profile: no vector/intrinsic extension noise.'
          count = ptext.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one default-extension assignment, found {count}')
          program.write_text(ptext.replace(old, new), encoding='utf-8')

          manifest = root / 'OSA_RESEARCH_PROFILE.txt'
          manifest.write_text(
              'Base Fuzzlyn commit: 6c2e1d3f2d680c169e727098132e7b3659a8b690\n'
              'Purpose: increase class, aggregate-reference, new-object, byref and local-dataflow coverage; '\
              'disable async and default intrinsic noise.\n',
              encoding='utf-8')
          PY

          git -C fuzzlyn-src diff --check
          git -C fuzzlyn-src diff -- Fuzzlyn/FuzzlynOptions.cs Fuzzlyn/Program.cs > fuzzlyn-src/OSA_RESEARCH_PROFILE.patch
          cat fuzzlyn-src/OSA_RESEARCH_PROFILE.patch

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Publish self-contained Linux x64 targeted Fuzzlyn
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish fuzzlyn-src/Fuzzlyn/Fuzzlyn.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:RuntimeIdentifiers=linux-x64 \
            -p:DebugType=portable \
            -p:DebugSymbols=true \
            -o "$GITHUB_WORKSPACE/fuzzlyn-osa-publish"

          cp fuzzlyn-src/OSA_RESEARCH_PROFILE.txt fuzzlyn-osa-publish/
          cp fuzzlyn-src/OSA_RESEARCH_PROFILE.patch fuzzlyn-osa-publish/
          printf '%s\n' '6c2e1d3f2d680c169e727098132e7b3659a8b690' > fuzzlyn-osa-publish/FUZZLYN_SOURCE_COMMIT.txt
          printf '%s\n' '10.0.302' > fuzzlyn-osa-publish/BUILD_SDK.txt
          ./fuzzlyn-osa-publish/Fuzzlyn --help > fuzzlyn-osa-publish/HELP.txt
          (
            cd fuzzlyn-osa-publish
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh fuzzlyn-osa-publish

      - name: Upload targeted Fuzzlyn artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzzlyn-osa-profile-linux-x64-6c2e1d3
          path: fuzzlyn-osa-publish
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
