name: Temporary Fuzzlyn Tool Export 20260815

on:
  push:
    branches:
      - agent/fuzzlyn-tool-20260815
    paths:
      - .github/workflows/_temporary-fuzzlyn-tool-export-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-fuzzlyn-tool-export-20260815
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out pinned Fuzzlyn source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakobbotsch/Fuzzlyn
          ref: 6c2e1d3f2d680c169e727098132e7b3659a8b690
          path: fuzzlyn-src
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Publish self-contained Linux x64 Fuzzlyn
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet publish fuzzlyn-src/Fuzzlyn/Fuzzlyn.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:RuntimeIdentifiers=linux-x64 \
            -p:DebugType=portable \
            -p:DebugSymbols=true \
            -o "$GITHUB_WORKSPACE/fuzzlyn-publish"

          printf '%s\n' '6c2e1d3f2d680c169e727098132e7b3659a8b690' > fuzzlyn-publish/FUZZLYN_SOURCE_COMMIT.txt
          printf '%s\n' '10.0.302' > fuzzlyn-publish/BUILD_SDK.txt
          ./fuzzlyn-publish/Fuzzlyn --help > fuzzlyn-publish/HELP.txt
          (
            cd fuzzlyn-publish
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh fuzzlyn-publish

      - name: Upload generic Fuzzlyn artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzzlyn-3.3-linux-x64-6c2e1d3
          path: fuzzlyn-publish
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
