name: Temporary Fuzzlyn Tool Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-fuzzlyn-tool-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-fuzzlyn-tool-export-20260815
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out pinned Fuzzlyn source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakobbotsch/Fuzzlyn
          ref: 6c2e1d3f2d680c169e727098132e7b3659a8b690
          fetch-depth: 1
          persist-credentials: false
          path: Fuzzlyn-src

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Build Fuzzlyn
        shell: bash
        run: |
          set -euo pipefail
          cd Fuzzlyn-src
          git rev-parse HEAD | tee OFFICIAL_COMMIT.txt
          git status --short | tee GIT_STATUS.txt
          dotnet build Fuzzlyn/Fuzzlyn.csproj -c Release --nologo

      - name: Stage tool and provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/fuzzlyn-tool"
          mkdir -p "$OUT/bin" "$OUT/source"
          cp -a Fuzzlyn-src/Fuzzlyn/bin/Release/*/* "$OUT/bin/"
          cp -a Fuzzlyn-src/Fuzzlyn "$OUT/source/"
          cp -a Fuzzlyn-src/Fuzzlyn.ExecutionServer "$OUT/source/"
          cp -a Fuzzlyn-src/LICENSE Fuzzlyn-src/README.md Fuzzlyn-src/BUGS.md Fuzzlyn-src/OFFICIAL_COMMIT.txt Fuzzlyn-src/GIT_STATUS.txt "$OUT/"
          dotnet --info > "$OUT/BUILD_DOTNET_INFO.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          find "$OUT/bin" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          du -sh "$OUT"

      - name: Upload generic Fuzzlyn artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzzlyn-6c2e1d3-dotnet10-linux-x64
          path: fuzzlyn-tool
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
