name: Temporary Geth Master Source and Vendor Export 20260812

on:
  pull_request:
    branches: [main]
    paths:
      - research/ethereum/geth_master_export_20260812/**
      - .github/workflows/_temporary-geth-master-source-vendor-export-20260812.yml

permissions:
  contents: read

concurrency:
  group: geth-master-source-vendor-export-20260812
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'ethereum-geth-master-export-20260812'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact current Geth master
        uses: actions/checkout@v4
        with:
          repository: ethereum/go-ethereum
          ref: 98a0080a2cc88abf09e5ba65da8122cc48f626b3
          path: go-ethereum
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-ethereum/go.mod
          cache: true
          cache-dependency-path: go-ethereum/go.sum

      - name: Materialize source and vendor
        shell: bash
        run: |
          set -euo pipefail
          cd go-ethereum
          test "$(git rev-parse HEAD)" = "98a0080a2cc88abf09e5ba65da8122cc48f626b3"
          go mod vendor
          go test ./core -run '^$' -count=1
          cd ..
          mkdir -p export/meta
          git -C go-ethereum rev-parse HEAD > export/meta/GETH_COMMIT.txt
          go version > export/meta/GO_VERSION.txt
          cp go-ethereum/go.mod go-ethereum/go.sum export/meta/
          tar --exclude='.git' --exclude='vendor' -czf geth-master-source-98a0080.tar.gz -C go-ethereum .
          tar -czf geth-master-vendor-98a0080.tar.gz -C go-ethereum vendor
          sha256sum geth-master-source-98a0080.tar.gz geth-master-vendor-98a0080.tar.gz > export/meta/SHA256SUMS.txt
          cp export/meta/SHA256SUMS.txt .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: geth-master-source-98a0080-20260812
          path: |
            geth-master-source-98a0080.tar.gz
            export/meta
          if-no-files-found: error
          retention-days: 1

      - name: Upload vendor
        uses: actions/upload-artifact@v4
        with:
          name: geth-master-vendor-98a0080-20260812
          path: |
            geth-master-vendor-98a0080.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
