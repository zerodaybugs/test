name: Temporary hcsshim reconnect fix differential

on:
  push:
    branches:
      - hcsshim-source-c4bdd-20260816
    paths:
      - '.github/workflows/_temporary-hcsshim-reconnect-fix-differential-20260816.yml'
      - '.github/scripts/zdb_hcsshim_reconnect_fix_test.go'
      - '.github/scripts/zdb_patch_hcsshim_reconnect.py'
      - '.github/scripts/run_hcsshim_reconnect_fix_diff.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Run exact-source differential validation
        shell: bash
        run: bash .github/scripts/run_hcsshim_reconnect_fix_diff.sh

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcsshim-reconnect-fix-differential
          path: export
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
