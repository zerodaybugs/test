name: Temporary hcsshim reconnect fix differential

on:
  push:
    branches:
      - hcsshim-source-c4bdd-20260816
    paths:
      - '.github/workflows/_temporary-hcsshim-reconnect-fix-differential-20260816.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Clone exact current source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags https://github.com/microsoft/hcsshim.git repo
          cd repo
          git checkout c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8
          test "$(git rev-parse HEAD)" = 'c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8'

      - name: Install exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Run unmodified bridge baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          cd repo
          go version | tee ../export/go-version.txt
          git rev-parse HEAD | tee ../export/source-commit.txt
          go test -mod=vendor ./internal/guest/bridge -count=1 -timeout=180s 2>&1 | tee ../export/unmodified-full-bridge-tests.log

      - name: Apply minimal connection-epoch fix and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('repo/internal/guest/bridge/bridge.go')
          text = path.read_text()

          old = '''\t// pendingNotifications holds container exit notifications that arrived
\t// while the bridge was disconnected. They are drained when ListenAndServe
\t// reconnects.
\tpendingNotifications []*prot.ContainerNotification
}'''
          new = '''\t// pendingNotifications holds container exit notifications that arrived
\t// while the bridge was disconnected. They are drained when ListenAndServe
\t// reconnects.
\tpendingNotifications []*prot.ContainerNotification

\t// sequentialMu serializes mutating request processing across transport
\t// connection epochs. A reconnect must not create a second independent
\t// sequential queue while a request from the previous connection is active.
\tsequentialMu sync.Mutex
}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''\trequestChan := make(chan *Request)
\trequestErrChan := make(chan error)
\tb.responseChan = make(chan bridgeResponse)
\tresponseErrChan := make(chan error)
\tb.quitChan = make(chan bool)'''
          new = '''\trequestChan := make(chan *Request)
\trequestErrChan := make(chan error)
\tresponseChan := make(chan bridgeResponse)
\tb.responseChan = responseChan
\tresponseErrChan := make(chan error)
\tb.quitChan = make(chan bool)
\tsessionDone := make(chan struct{})'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''\tdefer b.disconnectNotifications()
\tdefer close(b.quitChan)

\tif b.Sequential {'''
          new = '''\tdefer b.disconnectNotifications()
\tdefer close(b.quitChan)
\t// Close this before any old request handler can publish after reconnect.
\tdefer close(sessionDone)

\tif b.Sequential {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''\t\t\tbr.response = resp
\t\t\tb.responseChan <- br
\t\t}'''
          new = '''\t\t\tbr.response = resp
\t\t\t// A request is bound to the connection epoch that accepted it. If
\t\t\t// that epoch has ended, drop the response instead of publishing it
\t\t\t// through a later connection's mutable Bridge field.
\t\t\tselect {
\t\t\tcase responseChan <- br:
\t\t\tcase <-sessionDone:
\t\t\t}
\t\t}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''\t\tfor req := range requestChan {
\t\t\tif b.Sequential && !alwaysAsync(req.Header.Type) {
\t\t\t\t// This will log warn after 5 seconds if the request is still
\t\t\t\t// being processed,
\t\t\t\trunSequentialRequest(req, doRequest)
\t\t\t} else {
\t\t\t\tgo doRequest(req)
\t\t\t}
\t\t}
\t}()
\t// Process each bridge response sync. This channel is for request/response and publish workflows.
\tgo func() {
\t\tvar resperr error
\t\tfor resp := range b.responseChan {'''
          new = '''\t\tfor req := range requestChan {
\t\t\tif b.Sequential && !alwaysAsync(req.Header.Type) {
\t\t\t\t// Serialize across the lifetime of the Bridge, including
\t\t\t\t// reconnects, rather than only within this requestChan.
\t\t\t\tb.sequentialMu.Lock()
\t\t\t\trunSequentialRequest(req, doRequest)
\t\t\t\tb.sequentialMu.Unlock()
\t\t\t} else {
\t\t\t\tgo doRequest(req)
\t\t\t}
\t\t}
\t}()
\t// Process each bridge response sync. Bind the writer to this connection's
\t// channel; never lazily dereference b.responseChan after a reconnect.
\tgo func() {
\t\tvar resperr error
\t\tfor resp := range responseChan {'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cat > repo/internal/guest/bridge/zdb_reconnect_fix_test.go <<'EOF'
          //go:build linux

          package bridge

          import (
              "fmt"
              "io"
              "testing"
              "time"

              "github.com/Microsoft/hcsshim/internal/guest/prot"
              "github.com/sirupsen/logrus"
          )

          type zdbFixedReadResult struct {
              header *prot.MessageHeader
              body   []byte
              err    error
          }

          func zdbFixedReadWithTimeout(r io.Reader, timeout time.Duration) zdbFixedReadResult {
              ch := make(chan zdbFixedReadResult, 1)
              go func() {
                  h, body, err := serverRead(r)
                  ch <- zdbFixedReadResult{header: h, body: body, err: err}
              }()
              select {
              case result := <-ch:
                  return result
              case <-time.After(timeout):
                  return zdbFixedReadResult{err: fmt.Errorf("timed out waiting for bridge response")}
              }
          }

          func TestZDBBridgeReconnectPreservesSequentialEpochBoundary(t *testing.T) {
              logrus.SetOutput(io.Discard)

              firstEntered := make(chan struct{})
              releaseFirst := make(chan struct{})
              secondEntered := make(chan struct{})
              releaseSecond := make(chan struct{})

              mux := NewBridgeMux()
              mux.HandleFunc(prot.ComputeSystemCreateV1, prot.PvInvalid,
                  func(_ *Request) (RequestResponse, error) {
                      close(firstEntered)
                      <-releaseFirst
                      return &prot.MessageResponseBase{Result: 101}, nil
                  })
              mux.HandleFunc(prot.ComputeSystemModifySettingsV1, prot.PvInvalid,
                  func(_ *Request) (RequestResponse, error) {
                      close(secondEntered)
                      <-releaseSecond
                      return &prot.MessageResponseBase{Result: 202}, nil
                  })

              b := &Bridge{Handler: mux, Sequential: true}

              first := newLoopbackConnection()
              defer first.close()
              serveFirst := make(chan error, 1)
              go func() { serveFirst <- b.ListenAndServe(first.SRead(), first.SWrite()) }()

              const oldID prot.SequenceID = 1001
              if err := serverSend(first.CWrite(), prot.ComputeSystemCreateV1, oldID, nil); err != nil {
                  t.Fatalf("send first request: %v", err)
              }
              select {
              case <-firstEntered:
              case <-time.After(2 * time.Second):
                  t.Fatal("first mutating request did not enter handler")
              }

              if err := first.CWrite().Close(); err != nil {
                  t.Fatalf("disconnect first host transport: %v", err)
              }
              select {
              case <-serveFirst:
              case <-time.After(2 * time.Second):
                  t.Fatal("first ListenAndServe did not return after disconnect")
              }

              second := newLoopbackConnection()
              defer second.close()
              serveSecond := make(chan error, 1)
              go func() { serveSecond <- b.ListenAndServe(second.SRead(), second.SWrite()) }()

              const newID prot.SequenceID = 2002
              if err := serverSend(second.CWrite(), prot.ComputeSystemModifySettingsV1, newID, nil); err != nil {
                  t.Fatalf("send second request: %v", err)
              }

              // The fixed bridge must not start the second mutating request while
              // the old connection's Create request still owns the global gate.
              select {
              case <-secondEntered:
                  t.Fatal("second mutating request overlapped the old connection epoch")
              case <-time.After(150 * time.Millisecond):
                  fmt.Println("ZDB_FIXED_CROSS_CONNECTION_OVERLAP_BLOCKED=true")
              }

              close(releaseFirst)

              select {
              case <-secondEntered:
                  fmt.Println("ZDB_FIXED_SECOND_REQUEST_ENTERED_AFTER_OLD_COMPLETION=true")
              case <-time.After(2 * time.Second):
                  t.Fatal("second request did not enter after old request completed")
              }

              // The old response belongs to a closed epoch and must not be
              // emitted on the new transport. Release only the current response
              // and assert the first wire message is the current sequence ID.
              close(releaseSecond)
              current := zdbFixedReadWithTimeout(second.CRead(), 2*time.Second)
              if current.err != nil {
                  t.Fatalf("read current response: %v", current.err)
              }
              if current.header.Type != prot.ComputeSystemResponseModifySettingsV1 || current.header.ID != newID {
                  t.Fatalf("stale response crossed connection epoch: got type=%v id=%d; want type=%v id=%d",
                      current.header.Type, current.header.ID,
                      prot.ComputeSystemResponseModifySettingsV1, newID)
              }
              fmt.Println("ZDB_FIXED_OLD_RESPONSE_DROPPED=true")

              if err := second.CWrite().Close(); err != nil {
                  t.Fatalf("disconnect second host transport: %v", err)
              }
              select {
              case <-serveSecond:
              case <-time.After(2 * time.Second):
                  t.Fatal("second ListenAndServe did not return")
              }

              fmt.Println("ZDB_PATCHED_RECONNECT_EPOCH_INVARIANT=PASS")
          }
          EOF

          cd repo
          git diff -- internal/guest/bridge/bridge.go internal/guest/bridge/zdb_reconnect_fix_test.go > ../export/natural-fix-and-regression.patch
          cp internal/guest/bridge/zdb_reconnect_fix_test.go ../export/

      - name: Run patched full bridge suite and stress matrix
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          go test -mod=vendor ./internal/guest/bridge -count=1 -timeout=180s 2>&1 | tee ../export/patched-full-bridge-tests.log
          go test -mod=vendor ./internal/guest/bridge \
            -run '^TestZDBBridgeReconnectPreservesSequentialEpochBoundary$' \
            -count=20 -v -timeout=180s 2>&1 | tee ../export/patched-fix-kill-stress.log
          grep -c 'ZDB_FIXED_CROSS_CONNECTION_OVERLAP_BLOCKED=true' ../export/patched-fix-kill-stress.log | tee ../export/fixed-overlap-blocked-count.txt
          grep -c 'ZDB_FIXED_OLD_RESPONSE_DROPPED=true' ../export/patched-fix-kill-stress.log | tee ../export/fixed-stale-dropped-count.txt
          grep -c 'ZDB_PATCHED_RECONNECT_EPOCH_INVARIANT=PASS' ../export/patched-fix-kill-stress.log | tee ../export/fixed-pass-count.txt
          test "$(cat ../export/fixed-overlap-blocked-count.txt)" -eq 20
          test "$(cat ../export/fixed-stale-dropped-count.txt)" -eq 20
          test "$(cat ../export/fixed-pass-count.txt)" -eq 20

      - name: Build differential verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('export')
          verdict = {
              'source_commit': 'c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8',
              'unmodified_full_suite_pass': 'FAIL' not in (p/'unmodified-full-bridge-tests.log').read_text(errors='ignore'),
              'patched_full_suite_pass': (p/'patched-full-bridge-tests.log').exists() and 'FAIL' not in (p/'patched-full-bridge-tests.log').read_text(errors='ignore'),
              'fixed_overlap_blocked_runs': int((p/'fixed-overlap-blocked-count.txt').read_text().strip()) if (p/'fixed-overlap-blocked-count.txt').exists() else 0,
              'fixed_stale_response_dropped_runs': int((p/'fixed-stale-dropped-count.txt').read_text().strip()) if (p/'fixed-stale-dropped-count.txt').exists() else 0,
              'fixed_invariant_pass_runs': int((p/'fixed-pass-count.txt').read_text().strip()) if (p/'fixed-pass-count.txt').exists() else 0,
          }
          verdict['decision'] = 'FIX_DIFFERENTIAL_PASS' if (
              verdict['unmodified_full_suite_pass'] and
              verdict['patched_full_suite_pass'] and
              verdict['fixed_overlap_blocked_runs'] == 20 and
              verdict['fixed_stale_response_dropped_runs'] == 20 and
              verdict['fixed_invariant_pass_runs'] == 20
          ) else 'FIX_DIFFERENTIAL_FAIL'
          (p/'FIX_DIFFERENTIAL_VERDICT.json').write_text(json.dumps(verdict, indent=2) + '\n')
          print(json.dumps(verdict, indent=2))
          PY
          sha256sum export/* > export/SHA256SUMS.txt
          find export -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > export/INVENTORY.txt
          grep -q 'FIX_DIFFERENTIAL_PASS' export/FIX_DIFFERENTIAL_VERDICT.json

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcsshim-reconnect-fix-differential
          path: export
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
