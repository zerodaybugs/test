name: Temporary hcsshim reconnect persistence and race matrix

on:
  push:
    branches:
      - hcsshim-source-c4bdd-20260816
    paths:
      - '.github/workflows/_temporary-hcsshim-reconnect-persistence-race-20260816.yml'
      - '.github/scripts/zdb_hcsshim_reconnect_vulnerable_test.go'

permissions:
  contents: read

jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: reconnect-introduction
            ref: a4051da4aa70cb8082fb12d672e1b6b684da215f
          - label: current-main
            ref: c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out validation test
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Clone target ref and run 20x matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git clone --filter=blob:none --no-tags https://github.com/microsoft/hcsshim.git repo
          cd repo
          git checkout '${{ matrix.ref }}'
          test "$(git rev-parse HEAD)" = '${{ matrix.ref }}'
          cp ../.github/scripts/zdb_hcsshim_reconnect_vulnerable_test.go \
            internal/guest/bridge/zdb_reconnect_vulnerable_test.go
          go version | tee "../export/${{ matrix.label }}-go-version.txt"
          git rev-parse HEAD | tee "../export/${{ matrix.label }}-source-commit.txt"
          go test -mod=vendor ./internal/guest/bridge \
            -run '^TestZDBBridgeSequentialModeIsBypassedAcrossReconnect$' \
            -count=20 -v -timeout=180s 2>&1 \
            | tee "../export/${{ matrix.label }}-persistence.log"
          cd ..
          grep -c 'ZDB_CROSS_CONNECTION_MUTATING_OVERLAP=true' \
            "export/${{ matrix.label }}-persistence.log" \
            | tee "export/${{ matrix.label }}-overlap-count.txt"
          grep -c 'ZDB_OLD_RESPONSE_DELIVERED_ON_NEW_CONNECTION=true' \
            "export/${{ matrix.label }}-persistence.log" \
            | tee "export/${{ matrix.label }}-stale-count.txt"
          grep -c 'ZDB_RECONNECT_EPOCH_BYPASS=PASS' \
            "export/${{ matrix.label }}-persistence.log" \
            | tee "export/${{ matrix.label }}-pass-count.txt"
          test "$(cat export/${{ matrix.label }}-overlap-count.txt)" -eq 20
          test "$(cat export/${{ matrix.label }}-stale-count.txt)" -eq 20
          test "$(cat export/${{ matrix.label }}-pass-count.txt)" -eq 20
          sha256sum export/* > "export/${{ matrix.label }}-SHA256SUMS.txt"

      - name: Upload persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcsshim-reconnect-persistence-${{ matrix.label }}
          path: export
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out validation test
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Run current-source race detector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git clone --filter=blob:none --no-tags https://github.com/microsoft/hcsshim.git repo
          cd repo
          git checkout c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8
          cp ../.github/scripts/zdb_hcsshim_reconnect_vulnerable_test.go \
            internal/guest/bridge/zdb_reconnect_vulnerable_test.go
          set +e
          go test -race -mod=vendor ./internal/guest/bridge \
            -run '^TestZDBBridgeSequentialModeIsBypassedAcrossReconnect$' \
            -count=1 -v -timeout=180s 2>&1 | tee ../export/race-current.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > ../export/race-exit-code.txt
          git rev-parse HEAD > ../export/race-source-commit.txt
          cd ..
          if grep -q 'WARNING: DATA RACE' export/race-current.log; then
            printf 'DATA_RACE_DETECTED\n' | tee export/race-verdict.txt
          else
            printf 'NO_DATA_RACE_SIGNAL\n' | tee export/race-verdict.txt
          fi
          # A race-detector nonzero exit is expected if the shared Bridge fields race.
          # Preserve the result either way; do not make the workflow fail merely
          # because the detector correctly reported a race.
          sha256sum export/* > export/race-SHA256SUMS.txt

      - name: Upload race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcsshim-reconnect-race-current
          path: export
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
