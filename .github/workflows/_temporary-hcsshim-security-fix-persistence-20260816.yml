name: Temporary hcsshim security-fix persistence matrix

on:
  push:
    branches:
      - hcsshim-source-c4bdd-20260816
    paths:
      - '.github/workflows/_temporary-hcsshim-security-fix-persistence-20260816.yml'
      - '.github/scripts/zdb_hcsshim_reconnect_vulnerable_test.go'

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out validation test
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false

      - name: Run 20x on public confidential-container security fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git clone --filter=blob:none --no-tags https://github.com/microsoft/hcsshim.git repo
          cd repo
          git checkout 2e97c9bb3ff26f9bf2fb6b776099d099eb9ecffd
          test "$(git rev-parse HEAD)" = '2e97c9bb3ff26f9bf2fb6b776099d099eb9ecffd'
          cp ../.github/scripts/zdb_hcsshim_reconnect_vulnerable_test.go \
            internal/guest/bridge/zdb_reconnect_vulnerable_test.go
          go version | tee ../export/security-fix-go-version.txt
          git rev-parse HEAD | tee ../export/security-fix-source-commit.txt
          go test -mod=vendor ./internal/guest/bridge \
            -run '^TestZDBBridgeSequentialModeIsBypassedAcrossReconnect$' \
            -count=20 -v -timeout=180s 2>&1 \
            | tee ../export/security-fix-persistence.log
          cd ..
          grep -c 'ZDB_CROSS_CONNECTION_MUTATING_OVERLAP=true' \
            export/security-fix-persistence.log | tee export/security-fix-overlap-count.txt
          grep -c 'ZDB_OLD_RESPONSE_DELIVERED_ON_NEW_CONNECTION=true' \
            export/security-fix-persistence.log | tee export/security-fix-stale-count.txt
          grep -c 'ZDB_RECONNECT_EPOCH_BYPASS=PASS' \
            export/security-fix-persistence.log | tee export/security-fix-pass-count.txt
          test "$(cat export/security-fix-overlap-count.txt)" -eq 20
          test "$(cat export/security-fix-stale-count.txt)" -eq 20
          test "$(cat export/security-fix-pass-count.txt)" -eq 20
          sha256sum export/* > export/security-fix-SHA256SUMS.txt

      - name: Upload persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcsshim-reconnect-persistence-security-fix
          path: export
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
