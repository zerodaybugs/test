name: Temporary pinned hcsshim source export

on:
  push:
    branches:
      - hcsshim-source-c4bdd-20260816
    paths:
      - '.github/workflows/_temporary-hcsshim-source-c4bdd-20260816.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download pinned public source
        shell: bash
        run: |
          set -euo pipefail
          commit='c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8'
          mkdir -p export
          curl --fail --location --retry 3 \
            "https://api.github.com/repos/microsoft/hcsshim/tarball/${commit}" \
            --output "export/hcsshim-${commit}.tar.gz"
          printf '%s\n' "$commit" > export/COMMIT.txt
          sha256sum "export/hcsshim-${commit}.tar.gz" > export/SHA256SUMS.txt
          tar -tzf "export/hcsshim-${commit}.tar.gz" | sed -n '1,40p' > export/TAR_HEAD.txt
          stat -c '%n %s bytes' "export/hcsshim-${commit}.tar.gz" > export/INVENTORY.txt

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: hcsshim-c4bdd-source
          path: export
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
