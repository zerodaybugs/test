name: Temporary official IdentityModel NuGet transport

on:
  push:
    branches:
      - msrc-identitymodel-source-20260817
    paths:
      - .github/workflows/_temporary-identitymodel-nuget-transport-20260817.yml

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install exact SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
          cache: false
      - name: Restore official packages into isolated cache
        shell: bash
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/offline-packages
        run: |
          set -euo pipefail
          mkdir -p transport
          cd transport
          dotnet new console --framework net10.0 --no-restore
          dotnet add package Microsoft.IdentityModel.JsonWebTokens --version 8.22.0
          dotnet add package System.IdentityModel.Tokens.Jwt --version 8.22.0
          dotnet add package Microsoft.IdentityModel.Protocols.OpenIdConnect --version 8.22.0
          dotnet add package Microsoft.IdentityModel.Protocols.SignedHttpRequest --version 8.22.0
          dotnet restore --locked-mode=false
          cd ..
          find offline-packages -type f -print0 | sort -z | xargs -0 sha256sum > PACKAGE_SHA256SUMS.txt
          tar -czf identitymodel-8.22.0-offline-packages.tar.gz offline-packages
          sha256sum identitymodel-8.22.0-offline-packages.tar.gz > ARCHIVE_SHA256.txt
          printf 'IDENTITYMODEL_VERSION=8.22.0\nSUBMISSION_READY=0\n' > PROVENANCE.env
      - name: Upload official package cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identitymodel-8.22.0-offline-packages
          path: |
            identitymodel-8.22.0-offline-packages.tar.gz
            ARCHIVE_SHA256.txt
            PACKAGE_SHA256SUMS.txt
            PROVENANCE.env
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
