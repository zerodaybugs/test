name: Temporary IdentityModel OIDC Build Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-identitymodel-oidc-build-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-identitymodel-oidc-build-export-20260815
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact official IdentityModel source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
          ref: 8.22.0
          fetch-depth: 1
          persist-credentials: false
          path: identitymodel

      - name: Install compatible .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Build official OIDC and validator projects without source modifications
        shell: bash
        run: |
          set -euo pipefail
          cd identitymodel
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/COMMIT_SHA.txt"
          git status --short | tee "$GITHUB_WORKSPACE/GIT_STATUS_BEFORE.txt"
          dotnet --info > "$GITHUB_WORKSPACE/DOTNET_INFO.txt"
          dotnet restore src/Microsoft.IdentityModel.Protocols.OpenIdConnect/Microsoft.IdentityModel.Protocols.OpenIdConnect.csproj --nologo
          dotnet build src/Microsoft.IdentityModel.Protocols.OpenIdConnect/Microsoft.IdentityModel.Protocols.OpenIdConnect.csproj \
            -c Release --no-restore --nologo /p:ContinuousIntegrationBuild=true
          dotnet restore src/Microsoft.IdentityModel.Validators/Microsoft.IdentityModel.Validators.csproj --nologo
          dotnet build src/Microsoft.IdentityModel.Validators/Microsoft.IdentityModel.Validators.csproj \
            -c Release --no-restore --nologo /p:ContinuousIntegrationBuild=true
          git status --short | tee "$GITHUB_WORKSPACE/GIT_STATUS_AFTER.txt"
          test ! -s "$GITHUB_WORKSPACE/GIT_STATUS_AFTER.txt"

      - name: Stage exact binaries and relevant source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          mkdir -p "$OUT/binaries" "$OUT/source" "$OUT/tests"
          cp COMMIT_SHA.txt GIT_STATUS_BEFORE.txt GIT_STATUS_AFTER.txt DOTNET_INFO.txt "$OUT/"

          for dir in \
            Microsoft.IdentityModel.Protocols.OpenIdConnect \
            Microsoft.IdentityModel.Protocols \
            Microsoft.IdentityModel.Validators \
            Microsoft.IdentityModel.JsonWebTokens \
            Microsoft.IdentityModel.Tokens \
            System.IdentityModel.Tokens.Jwt; do
            cp -a "identitymodel/src/$dir" "$OUT/source/$dir"
            find "$OUT/source/$dir" -type d \( -name bin -o -name obj \) -prune -exec rm -rf '{}' +
          done

          for dir in \
            Microsoft.IdentityModel.Protocols.OpenIdConnect.Tests \
            Microsoft.IdentityModel.Validators.Tests \
            Microsoft.IdentityModel.JsonWebTokens.Tests \
            Microsoft.IdentityModel.Tokens.Tests \
            System.IdentityModel.Tokens.Jwt.Tests; do
            if [[ -d "identitymodel/test/$dir" ]]; then
              cp -a "identitymodel/test/$dir" "$OUT/tests/$dir"
              find "$OUT/tests/$dir" -type d \( -name bin -o -name obj \) -prune -exec rm -rf '{}' +
            fi
          done

          find identitymodel/src -path '*/bin/Release/net10.0/*' -type f \
            \( -name 'Microsoft.IdentityModel*.dll' -o -name 'System.IdentityModel*.dll' -o -name '*.pdb' -o -name '*.deps.json' -o -name '*.xml' \) \
            -exec cp -a --parents '{}' "$OUT/binaries/" \;

          cp -a identitymodel/build "$OUT/build"
          cp -a identitymodel/Directory.Build.props identitymodel/Directory.Packages.props identitymodel/global.json "$OUT/" 2>/dev/null || true
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          find "$OUT" -type f -printf '%P\n' | sort > "$OUT/FILE_LIST.txt"
          du -sh "$OUT"

      - name: Upload exact build export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identitymodel-oidc-8.22.0-official-build
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
