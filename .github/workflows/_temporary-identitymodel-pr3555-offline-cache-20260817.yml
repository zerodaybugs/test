name: Temporary IdentityModel 8.22.0 offline cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-offline-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout exact released source
        uses: actions/checkout@v4
        with:
          repository: AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
          ref: 58d60020455b042cef6f648ba14ebcd38f20fb98
          path: identitymodel
          fetch-depth: 1

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Verify exact release and available SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C identitymodel rev-parse HEAD)" = '58d60020455b042cef6f648ba14ebcd38f20fb98'
          dotnet --list-sdks | tee DOTNET_SDKS.txt
          grep -E '^10\.0\.100 ' DOTNET_SDKS.txt
          printf '%s\n' '8.22.0' > SOURCE_TAG.txt
          printf '%s\n' '58d60020455b042cef6f648ba14ebcd38f20fb98' > SOURCE_COMMIT.txt
          (cd identitymodel && dotnet --version) | tee SELECTED_DOTNET_VERSION.txt
          (cd identitymodel && dotnet --info) > DOTNET_INFO.txt

      - name: Prime offline NuGet cache
        shell: bash
        run: |
          set -euo pipefail
          cd identitymodel
          projects=(
            test/Microsoft.IdentityModel.Protocols.SignedHttpRequest.Tests/Microsoft.IdentityModel.Protocols.SignedHttpRequest.Tests.csproj
            test/Microsoft.IdentityModel.Dpop.Tests/Microsoft.IdentityModel.Dpop.Tests.csproj
            test/Microsoft.IdentityModel.JsonWebTokens.Tests/Microsoft.IdentityModel.JsonWebTokens.Tests.csproj
            test/System.IdentityModel.Tokens.Jwt.Tests/System.IdentityModel.Tokens.Jwt.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project" --nologo --verbosity minimal -p:LocalBuild=True
          done
          git status --short

      - name: Diagnostic released-framework builds
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd identitymodel
          dotnet build test/Microsoft.IdentityModel.Protocols.SignedHttpRequest.Tests/Microsoft.IdentityModel.Protocols.SignedHttpRequest.Tests.csproj --no-restore --nologo -c Debug -f net10.0 -p:LocalBuild=True | tee ../BUILD_SHR_NET10.log
          dotnet build test/Microsoft.IdentityModel.Dpop.Tests/Microsoft.IdentityModel.Dpop.Tests.csproj --no-restore --nologo -c Debug -f net10.0 -p:LocalBuild=True | tee ../BUILD_DPOP_NET10.log
          dotnet build test/Microsoft.IdentityModel.JsonWebTokens.Tests/Microsoft.IdentityModel.JsonWebTokens.Tests.csproj --no-restore --nologo -c Debug -f net10.0 -p:LocalBuild=True | tee ../BUILD_JSONWEBTOKENS_NET10.log
          dotnet build test/System.IdentityModel.Tokens.Jwt.Tests/System.IdentityModel.Tokens.Jwt.Tests.csproj --no-restore --nologo -c Debug -f net10.0 -p:LocalBuild=True | tee ../BUILD_JWT_NET10.log

      - name: Fetch exact official SDK archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.100/dotnet-sdk-10.0.100-linux-x64.tar.gz'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output dotnet-sdk-10.0.100-linux-x64.tar.gz
          test "$(stat -c '%s' dotnet-sdk-10.0.100-linux-x64.tar.gz)" = '239125653'

      - name: Pack verified offline inputs
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf identitymodel-8.22.0-source.tar.gz -C identitymodel .
          tar -czf nuget-packages-identitymodel-8.22.0.tar.gz -C "$HOME/.nuget" packages
          sha256sum identitymodel-8.22.0-source.tar.gz dotnet-sdk-10.0.100-linux-x64.tar.gz nuget-packages-identitymodel-8.22.0.tar.gz SOURCE_TAG.txt SOURCE_COMMIT.txt DOTNET_INFO.txt DOTNET_SDKS.txt SELECTED_DOTNET_VERSION.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified offline inputs
        uses: actions/upload-artifact@v4
        with:
          name: identitymodel-8.22.0-dotnet10-offline-inputs
          path: |
            identitymodel-8.22.0-source.tar.gz
            dotnet-sdk-10.0.100-linux-x64.tar.gz
            nuget-packages-identitymodel-8.22.0.tar.gz
            SOURCE_TAG.txt
            SOURCE_COMMIT.txt
            DOTNET_INFO.txt
            DOTNET_SDKS.txt
            SELECTED_DOTNET_VERSION.txt
            BUILD_SHR_NET10.log
            BUILD_DPOP_NET10.log
            BUILD_JSONWEBTOKENS_NET10.log
            BUILD_JWT_NET10.log
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
