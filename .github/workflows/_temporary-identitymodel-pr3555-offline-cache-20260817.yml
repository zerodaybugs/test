name: Temporary IdentityModel DPoP 8.22.0 resolved graph cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-resolved-package-graph:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Resolve exact published dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-graph
          cat > package-graph/Graph.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestorePackagesPath>$(MSBuildThisFileDirectory)packages</RestorePackagesPath>
              <RestoreNoCache>true</RestoreNoCache>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.IdentityModel.Dpop" Version="8.22.0" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore package-graph/Graph.csproj --nologo --verbosity minimal
          jq -r '.libraries | keys[]' package-graph/obj/project.assets.json | sort > package-graph/RESOLVED_LIBRARIES.txt
          cat package-graph/RESOLVED_LIBRARIES.txt
          grep -qx 'Microsoft.IdentityModel.Dpop/8.22.0' package-graph/RESOLVED_LIBRARIES.txt
          grep -qx 'Microsoft.IdentityModel.JsonWebTokens/8.22.0' package-graph/RESOLVED_LIBRARIES.txt
          grep -qx 'Microsoft.IdentityModel.Tokens/8.22.0' package-graph/RESOLVED_LIBRARIES.txt
          if grep '^Microsoft.IdentityModel\.' package-graph/RESOLVED_LIBRARIES.txt | grep -v '/8.22.0$'; then
            echo 'IdentityModel version skew detected' >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_RUN_ID" > package-graph/GRAPH_WORKFLOW_RUN_ID.txt
          find package-graph/packages -type f -print0 | sort -z | xargs -0 sha256sum > package-graph/PACKAGE_GRAPH_SHA256SUMS.txt
          tar -czf identitymodel-dpop-8.22.0-resolved-packages.tar.gz -C package-graph packages
          sha256sum identitymodel-dpop-8.22.0-resolved-packages.tar.gz > package-graph/ARCHIVE_SHA256SUMS.txt

      - name: Upload exact resolved graph
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-identitymodel-dpop-8.22.0-resolved-graph
          path: |
            identitymodel-dpop-8.22.0-resolved-packages.tar.gz
            package-graph/RESOLVED_LIBRARIES.txt
            package-graph/PACKAGE_GRAPH_SHA256SUMS.txt
            package-graph/ARCHIVE_SHA256SUMS.txt
            package-graph/GRAPH_WORKFLOW_RUN_ID.txt
            package-graph/obj/project.assets.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Persist graph run identifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tooling-cache/identitymodel-dpop-8.22.0
          cp package-graph/GRAPH_WORKFLOW_RUN_ID.txt tooling-cache/identitymodel-dpop-8.22.0/GRAPH_WORKFLOW_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/identitymodel-dpop-8.22.0/GRAPH_WORKFLOW_RUN_ID.txt
          git commit -m 'cache: record DPoP 8.22.0 graph run' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
