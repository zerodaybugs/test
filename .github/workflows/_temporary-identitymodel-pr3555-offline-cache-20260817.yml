name: Temporary IdentityModel exact-head offline cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-offline-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
          ref: 6381a843435726b07b2a026f8ee8780f92dc771b
          path: identitymodel
          fetch-depth: 1

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Verify source and prime offline NuGet cache
        shell: bash
        run: |
          set -euo pipefail
          cd identitymodel
          test "$(git rev-parse HEAD)" = '6381a843435726b07b2a026f8ee8780f92dc771b'
          test "$(dotnet --version)" = '10.0.100'
          dotnet restore test/Microsoft.IdentityModel.JsonWebTokens.Tests/Microsoft.IdentityModel.JsonWebTokens.Tests.csproj --nologo
          dotnet restore test/System.IdentityModel.Tokens.Jwt.Tests/System.IdentityModel.Tokens.Jwt.Tests.csproj --nologo
          dotnet build test/Microsoft.IdentityModel.JsonWebTokens.Tests/Microsoft.IdentityModel.JsonWebTokens.Tests.csproj --no-restore --nologo -c Debug -f net10.0
          dotnet build test/System.IdentityModel.Tokens.Jwt.Tests/System.IdentityModel.Tokens.Jwt.Tests.csproj --no-restore --nologo -c Debug -f net10.0
          git status --short
          cd ..
          printf '%s\n' '6381a843435726b07b2a026f8ee8780f92dc771b' > SOURCE_COMMIT.txt
          dotnet --info > DOTNET_INFO.txt

      - name: Pack verified offline inputs
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf identitymodel-pr3555-head.tar.gz -C identitymodel .
          tar -czf dotnet-sdk-10.0.100-linux-x64.tar.gz -C "$DOTNET_ROOT" .
          tar -czf nuget-packages-pr3555.tar.gz -C "$HOME/.nuget" packages
          sha256sum identitymodel-pr3555-head.tar.gz dotnet-sdk-10.0.100-linux-x64.tar.gz nuget-packages-pr3555.tar.gz SOURCE_COMMIT.txt DOTNET_INFO.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified offline inputs
        uses: actions/upload-artifact@v4
        with:
          name: identitymodel-pr3555-dotnet10-offline-inputs
          path: |
            identitymodel-pr3555-head.tar.gz
            dotnet-sdk-10.0.100-linux-x64.tar.gz
            nuget-packages-pr3555.tar.gz
            SOURCE_COMMIT.txt
            DOTNET_INFO.txt
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
