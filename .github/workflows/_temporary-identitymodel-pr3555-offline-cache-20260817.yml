name: Temporary IdentityModel DPoP 8.22.0 package cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-published-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download exact published NuGet package
        shell: bash
        run: |
          set -euo pipefail
          package='microsoft.identitymodel.dpop.8.22.0.nupkg'
          url='https://api.nuget.org/v3-flatcontainer/microsoft.identitymodel.dpop/8.22.0/microsoft.identitymodel.dpop.8.22.0.nupkg'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output "$package"
          test -s "$package"
          sha256sum "$package" | tee SHA256SUMS.txt
          rm -rf extracted
          unzip -q "$package" -d extracted
          grep -q '<id>Microsoft.IdentityModel.Dpop</id>' extracted/Microsoft.IdentityModel.Dpop.nuspec
          grep -q '<version>8.22.0</version>' extracted/Microsoft.IdentityModel.Dpop.nuspec
          test -f extracted/lib/net10.0/Microsoft.IdentityModel.Dpop.dll
          find extracted -type f -print0 | sort -z | xargs -0 sha256sum > EXTRACTED_SHA256SUMS.txt

      - name: Upload exact published package
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-identitymodel-dpop-8.22.0-published-nupkg
          path: |
            microsoft.identitymodel.dpop.8.22.0.nupkg
            SHA256SUMS.txt
            EXTRACTED_SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
