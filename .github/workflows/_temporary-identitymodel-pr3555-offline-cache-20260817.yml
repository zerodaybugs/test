name: Temporary IdentityModel and LDAP dependency cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-resolved-package-graph:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - name: Resolve exact published dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-graph
          cat > package-graph/Graph.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestorePackagesPath>$(MSBuildThisFileDirectory)packages</RestorePackagesPath>
              <RestoreNoCache>true</RestoreNoCache>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.IdentityModel.Dpop" Version="8.22.0" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore package-graph/Graph.csproj --nologo --verbosity minimal
          jq -r '.libraries | keys[]' package-graph/obj/project.assets.json | sort > package-graph/RESOLVED_LIBRARIES.txt
          printf '%s\n' "$GITHUB_RUN_ID" > package-graph/GRAPH_WORKFLOW_RUN_ID.txt
          find package-graph/packages -type f -print0 | sort -z | xargs -0 sha256sum > package-graph/PACKAGE_GRAPH_SHA256SUMS.txt
          tar -czf identitymodel-dpop-8.22.0-resolved-packages.tar.gz -C package-graph packages
          sha256sum identitymodel-dpop-8.22.0-resolved-packages.tar.gz > package-graph/ARCHIVE_SHA256SUMS.txt
      - name: Upload exact resolved graph
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-identitymodel-dpop-8.22.0-resolved-graph-refresh
          path: |
            identitymodel-dpop-8.22.0-resolved-packages.tar.gz
            package-graph/RESOLVED_LIBRARIES.txt
            package-graph/PACKAGE_GRAPH_SHA256SUMS.txt
            package-graph/ARCHIVE_SHA256SUMS.txt
            package-graph/GRAPH_WORKFLOW_RUN_ID.txt
            package-graph/obj/project.assets.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  cache-ldap-dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817
      - name: Download and verify System.DirectoryServices.Protocols 10.0.10
        shell: bash
        run: |
          set -euo pipefail
          out='ldap-dependency'
          mkdir -p "$out"
          url='https://api.nuget.org/v3-flatcontainer/system.directoryservices.protocols/10.0.10/system.directoryservices.protocols.10.0.10.nupkg'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" -o "$out/system.directoryservices.protocols.10.0.10.nupkg"
          test -s "$out/system.directoryservices.protocols.10.0.10.nupkg"
          unzip -q "$out/system.directoryservices.protocols.10.0.10.nupkg" -d "$out/extracted"
          test -f "$out/extracted/lib/net10.0/System.DirectoryServices.Protocols.dll"
          sha256sum "$out/system.directoryservices.protocols.10.0.10.nupkg" > "$out/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/WORKFLOW_RUN_ID.txt"
      - name: Upload LDAP dependency
        uses: actions/upload-artifact@v4
        with:
          name: negotiate-ldap-grouptype-deps-20260819
          path: ldap-dependency
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Persist LDAP run identifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tooling-cache/negotiate-ldap-grouptype-20260819
          cp ldap-dependency/WORKFLOW_RUN_ID.txt tooling-cache/negotiate-ldap-grouptype-20260819/WORKFLOW_RUN_ID.txt
          cp ldap-dependency/SHA256SUMS.txt tooling-cache/negotiate-ldap-grouptype-20260819/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/negotiate-ldap-grouptype-20260819
          git commit -m 'cache: record LDAP dependency run' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
