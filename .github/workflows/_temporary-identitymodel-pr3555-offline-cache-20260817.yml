name: Temporary IdentityModel DPoP 8.22.0 package cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-published-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout cache branch
        uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817

      - name: Download and verify exact published NuGet package
        shell: bash
        run: |
          set -euo pipefail
          outdir='tooling-cache/identitymodel-dpop-8.22.0'
          mkdir -p "$outdir"
          package="$outdir/microsoft.identitymodel.dpop.8.22.0.nupkg"
          url='https://api.nuget.org/v3-flatcontainer/microsoft.identitymodel.dpop/8.22.0/microsoft.identitymodel.dpop.8.22.0.nupkg'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output "$package"
          test -s "$package"
          sha256sum "$package" > "$outdir/SHA256SUMS.txt"
          rm -rf extracted
          unzip -q "$package" -d extracted
          grep -q '<id>Microsoft.IdentityModel.Dpop</id>' extracted/Microsoft.IdentityModel.Dpop.nuspec
          grep -q '<version>8.22.0</version>' extracted/Microsoft.IdentityModel.Dpop.nuspec
          test -f extracted/lib/net10.0/Microsoft.IdentityModel.Dpop.dll
          find extracted -type f -print0 | sort -z | xargs -0 sha256sum > "$outdir/EXTRACTED_SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$outdir/WORKFLOW_RUN_ID.txt"

      - name: Upload exact verified package
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-identitymodel-dpop-8.22.0-published-nupkg
          path: |
            tooling-cache/identitymodel-dpop-8.22.0/microsoft.identitymodel.dpop.8.22.0.nupkg
            tooling-cache/identitymodel-dpop-8.22.0/SHA256SUMS.txt
            tooling-cache/identitymodel-dpop-8.22.0/EXTRACTED_SHA256SUMS.txt
            tooling-cache/identitymodel-dpop-8.22.0/WORKFLOW_RUN_ID.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Persist verified public package cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/identitymodel-dpop-8.22.0
          git commit -m 'cache: published Microsoft.IdentityModel.Dpop 8.22.0' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
