name: temporary-java-dependency-cache-20260825

on:
  push:
    branches:
      - temp-java-dependency-cache-20260825
    paths:
      - temp/java-dependency-cache-20260825/**
      - .github/workflows/_temporary-java-dependency-cache-20260825.yml

permissions:
  contents: read

concurrency:
  group: temporary-java-dependency-cache-20260825
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve dependencies and plugins
        shell: bash
        run: |
          set -euo pipefail
          cd temp/java-dependency-cache-20260825
          mvn -B -ntp dependency:go-offline
          mvn -B -ntp -DskipTests clean compile dependency:copy-dependencies -DoutputDirectory=target/dependency dependency:sources
          mvn -B -ntp dependency:tree -DoutputFile=dependency-tree.txt

      - name: Snapshot exact current public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Azure/azure-sdk-for-java.git upstream
          cd upstream
          git sparse-checkout set \
            sdk/keyvault/azure-security-keyvault-keys/src/main/java/com/azure/security/keyvault/keys/implementation/KeyVaultCredentialPolicy.java \
            sdk/keyvault/azure-security-keyvault-secrets/src/main/java/com/azure/security/keyvault/secrets/implementation/KeyVaultCredentialPolicy.java \
            sdk/keyvault/azure-security-keyvault-certificates/src/main/java/com/azure/security/keyvault/certificates/implementation/KeyVaultCredentialPolicy.java \
            sdk/keyvault/azure-security-keyvault-administration/src/main/java/com/azure/security/keyvault/administration/implementation/KeyVaultCredentialPolicy.java
          git checkout
          git rev-parse HEAD > current-main-commit.txt

      - name: Package toolchain and local repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/current-main
          MVN_BIN="$(readlink -f "$(command -v mvn)")"
          MAVEN_HOME="$(cd "$(dirname "$MVN_BIN")/.." && pwd)"
          cp -a "$MAVEN_HOME" bundle/maven-home
          cp -a "$HOME/.m2/repository" bundle/m2-repository
          cp temp/java-dependency-cache-20260825/dependency-tree.txt bundle/
          cp upstream/current-main-commit.txt bundle/current-main/
          cp --parents \
            upstream/sdk/keyvault/azure-security-keyvault-keys/src/main/java/com/azure/security/keyvault/keys/implementation/KeyVaultCredentialPolicy.java \
            upstream/sdk/keyvault/azure-security-keyvault-secrets/src/main/java/com/azure/security/keyvault/secrets/implementation/KeyVaultCredentialPolicy.java \
            upstream/sdk/keyvault/azure-security-keyvault-certificates/src/main/java/com/azure/security/keyvault/certificates/implementation/KeyVaultCredentialPolicy.java \
            upstream/sdk/keyvault/azure-security-keyvault-administration/src/main/java/com/azure/security/keyvault/administration/implementation/KeyVaultCredentialPolicy.java \
            bundle/current-main/
          {
            java -version 2>&1
            mvn -version 2>&1
            printf 'maven_home=%s\n' "$MAVEN_HOME"
          } > bundle/environment.txt
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/MANIFEST.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: java-dependency-cache-20260825
          path: bundle
          if-no-files-found: error
          retention-days: 1
