name: kiln-omnivault-r11-final-persisted-results
on:
  push:
    branches: [agent/kiln-omnivault-r11-readonly]
    paths:
      - .github/workflows/_temporary-kiln-omnivault-r11-final-commit-results-20260815.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  census-and-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Python dependency
        run: python3 -m pip install --disable-pip-version-check requests pycryptodome
      - name: Run read-only runtime census
        id: census
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf r11_results
          python3 ci/kiln_r11_probe.py 2>&1 | tee R11_CENSUS_RUN.log
          printf '%s\n' "${PIPESTATUS[0]}" > R11_CENSUS_EXIT_CODE.txt
      - name: Run fixed-block local-fork differential
        id: fork
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p r11_fork_results
          forge --version | tee r11_fork_results/FOUNDRY_VERSION.txt
          forge test --match-contract KilnVenusR11Fork -vvv 2>&1 | tee r11_fork_results/FORK_DIFFERENTIAL.log
          printf '%s\n' "${PIPESTATUS[0]}" > r11_fork_results/FORGE_EXIT_CODE.txt
      - name: Build persisted evidence directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST="r11_persisted_results/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -a r11_results "$DEST/" 2>/dev/null || true
          cp -a r11_fork_results "$DEST/" 2>/dev/null || true
          cp R11_CENSUS_RUN.log R11_CENSUS_EXIT_CODE.txt "$DEST/" 2>/dev/null || true
          cat > "$DEST/SAFETY.json" <<'EOF'
          {
            "public_chain_transactions": 0,
            "private_keys": 0,
            "signatures": 0,
            "runtime_rpc_methods": ["eth_chainId", "eth_blockNumber", "eth_call", "eth_getCode", "eth_getStorageAt"],
            "fork_execution": "local Foundry fork only"
          }
          EOF
          find "$DEST" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$DEST/RUN_ID.txt"
          printf '%s\n' "$GITHUB_SHA" > "$DEST/INPUT_COMMIT.txt"
      - name: Commit generated evidence to isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add r11_persisted_results
          if git diff --cached --quiet; then
            echo "No evidence files to commit"
            exit 0
          fi
          git commit -m "persist Kiln R11 read-only evidence ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin agent/kiln-omnivault-r11-readonly || true
            if git push origin HEAD:agent/kiln-omnivault-r11-readonly; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r11-final-persisted-results
          path: r11_persisted_results
          if-no-files-found: error
          retention-days: 3
