name: kiln-omnivault-r11-venus-fork-differential
on:
  push:
    branches: [agent/kiln-omnivault-r11-readonly]
    paths:
      - test/KilnVenusR11Fork.t.sol
      - .github/workflows/_temporary-kiln-omnivault-r11-fork-differential-20260815.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-block-local-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Record toolchain
        run: |
          mkdir -p r11_fork_results
          forge --version | tee r11_fork_results/FOUNDRY_VERSION.txt
          git rev-parse HEAD | tee r11_fork_results/BRANCH_COMMIT.txt
      - name: Run fixed-block attack and accrued control
        id: fork_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          forge test --match-contract KilnVenusR11Fork -vvv 2>&1 | tee r11_fork_results/FORK_DIFFERENTIAL.log
          printf '%s\n' "${PIPESTATUS[0]}" > r11_fork_results/FORGE_EXIT_CODE.txt
      - name: Record safety boundary and hashes
        if: always()
        shell: bash
        run: |
          cat > r11_fork_results/SAFETY.json <<'EOF'
          {
            "public_chain_transactions": 0,
            "private_keys": 0,
            "signatures": 0,
            "execution": "local Foundry forks only",
            "cheatcode_funding": "local fork only"
          }
          EOF
          sha256sum test/KilnVenusR11Fork.t.sol r11_fork_results/* > r11_fork_results/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r11-venus-fork-differential
          path: r11_fork_results
          if-no-files-found: error
          retention-days: 3
