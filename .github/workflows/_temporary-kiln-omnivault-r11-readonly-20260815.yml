name: kiln-omnivault-r11-readonly
on:
  push:
    branches: [agent/kiln-omnivault-r11-readonly]
    paths:
      - ci/kiln_r11_probe.py
      - .github/workflows/_temporary-kiln-omnivault-r11-readonly-20260815.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-runtime-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependency
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Run read-only Kiln R11 census
        run: python3 ci/kiln_r11_probe.py | tee r11_probe.log
      - name: Assert safety boundary
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('r11_results/R11_RUNTIME.json'))
          assert d['safety']['read_only'] is True
          assert d['safety']['transactions_signed'] == 0
          assert d['safety']['transactions_sent'] == 0
          assert d['safety']['private_keys'] == 0
          print('SAFETY_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r11-readonly-results
          path: |
            r11_results
            r11_probe.log
          if-no-files-found: error
          retention-days: 3
