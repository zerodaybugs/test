name: kiln-omnivault-r14-isolated-repro
on:
  push:
    branches: [agent/kiln-omnivault-r11-readonly]
    paths:
      - ci/generate_kiln_r14_isolated_repro.py
      - .github/workflows/_temporary-kiln-omnivault-r14-isolated-repro-20260815.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-local-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Generate isolated tests from R13 markers
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 ci/generate_kiln_r14_isolated_repro.py 2>&1 | tee R14_GENERATION.log
          printf '%s\n' "${PIPESTATUS[0]}" > R14_GENERATION_EXIT_CODE.txt
          sha256sum test/KilnR14IsolatedRepro.t.sol r14_generation/CANDIDATES.json > R14_GENERATED_SHA256.txt 2>/dev/null || true
      - name: Run isolated fixed-block 5-of-5 reproduction
        id: fork
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p r14_results
          forge --version | tee r14_results/FOUNDRY_VERSION.txt
          forge test --match-contract KilnR14IsolatedRepro -vvv 2>&1 | tee r14_results/ISOLATED_REPRO.log
          printf '%s\n' "${PIPESTATUS[0]}" > r14_results/FORGE_EXIT_CODE.txt
      - name: Build evidence package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST="r14_persisted_results/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -a r14_results "$DEST/" 2>/dev/null || true
          cp -a r14_generation "$DEST/" 2>/dev/null || true
          cp R14_GENERATION.log R14_GENERATION_EXIT_CODE.txt R14_GENERATED_SHA256.txt "$DEST/" 2>/dev/null || true
          cp test/KilnR14IsolatedRepro.t.sol "$DEST/" 2>/dev/null || true
          cat > "$DEST/SAFETY.json" <<'EOF'
          {
            "public_chain_transactions": 0,
            "private_keys": 0,
            "signatures": 0,
            "execution": "local Foundry fixed-block forks only",
            "repetitions": 5
          }
          EOF
          printf '%s\n' "$GITHUB_RUN_ID" > "$DEST/RUN_ID.txt"
          printf '%s\n' "$GITHUB_SHA" > "$DEST/INPUT_COMMIT.txt"
          find "$DEST" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS.txt"
      - name: Persist evidence to isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add r14_persisted_results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "persist Kiln R14 isolated evidence ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin agent/kiln-omnivault-r11-readonly || true
            if git push origin HEAD:agent/kiln-omnivault-r11-readonly; then exit 0; fi
            sleep $((i * 4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r14-isolated-repro
          path: r14_persisted_results
          if-no-files-found: error
          retention-days: 3
