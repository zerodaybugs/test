name: kiln-omnivault-r15-ethereum-venus-freeze
on:
  push:
    branches: [agent/kiln-omnivault-r11-readonly]
    paths:
      - ci/kiln_r15_routescan_probe.py
      - .github/workflows/_temporary-kiln-omnivault-r15-ethereum-venus-freeze-20260816.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  readonly-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-omnivault-r11-readonly
          fetch-depth: 1
      - name: Install deterministic dependencies
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Run Routescan-indexed and RPC read-only proof
        run: |
          set -o pipefail
          python3 ci/kiln_r15_routescan_probe.py 2>&1 | tee r15_routescan_probe.log
      - name: Assert safety and integrity
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.load(open('r15_routescan_results/R15_EVIDENCE.json'))
          assert d['safety']['read_only'] is True
          assert d['safety']['transactions_signed']==0
          assert d['safety']['transactions_sent']==0
          assert d['safety']['private_keys']==0
          for line in Path('r15_routescan_results/SHA256SUMS.txt').read_text().splitlines():
              h,rel=line.split('  ',1)
              assert hashlib.sha256((Path('r15_routescan_results')/rel).read_bytes()).hexdigest()==h
          print('R15_SAFETY_AND_INTEGRITY=PASS')
          PY
      - name: Persist exact evidence on research branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DEST="evidence/kiln-r15-routescan/${RUN_ID}"
          mkdir -p "$DEST"
          cp -R r15_routescan_results/. "$DEST/"
          cp r15_routescan_probe.log "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "persist Kiln R15 Routescan evidence ${RUN_ID}"
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-omnivault-r11-readonly
            if git push origin HEAD:agent/kiln-omnivault-r11-readonly; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r15-routescan-results
          path: |
            r15_routescan_results
            r15_routescan_probe.log
          if-no-files-found: warn
          retention-days: 3
