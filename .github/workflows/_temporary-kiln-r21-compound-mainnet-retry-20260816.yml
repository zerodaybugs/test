name: kiln-r21-compound-mainnet-retry

on:
  push:
    branches: [agent/kiln-r21-compound-census-20260816]
    paths:
      - .github/workflows/_temporary-kiln-r21-compound-mainnet-retry-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r21-compound-census-20260816
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Bind to provider supporting the exact vault getters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tmp_evm_encrypted/r21_compound_census.py')
          s=p.read_text()
          s=s.replace(
            "1:('ethereum',['https://eth.llamarpc.com','https://1rpc.io/eth','https://rpc.flashbots.net','https://ethereum-rpc.publicnode.com']),",
            "1:('ethereum',['https://ethereum-rpc.publicnode.com','https://rpc.flashbots.net','https://eth.llamarpc.com','https://1rpc.io/eth']),"
          )
          s=s.replace(
            "if w.is_connected() and w.eth.chain_id==cid:return w,u",
            "if w.is_connected() and w.eth.chain_id==cid:\n    probe=Web3.to_checksum_address(next(v for c,_,v in VS if c==cid))\n    w.eth.call({'to':probe,'data':'0x38d52e0f'})\n    return w,u"
          )
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
      - name: Run read-only current-state gate privately
        shell: bash
        run: |
          set +e
          python3 tmp_evm_encrypted/r21_compound_census.py > /tmp/private_run.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/private_exit_code.txt
          echo 'R21_COMPOUND_MAINNET_RETRY_EXIT_RECORDED'
      - name: Encrypt results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_delivery
          if [ -d r21_compound_results ]; then
            tar -czf /tmp/private_payload.tar.gz r21_compound_results /tmp/private_run.log /tmp/private_exit_code.txt tmp_evm_encrypted/r21_compound_census.py
          else
            tar -czf /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt tmp_evm_encrypted/r21_compound_census.py
          fi
          openssl rand 32 > /tmp/aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/private_payload.tar.gz -out encrypted_delivery/payload.aes256 -pass file:/tmp/aes.key
          openssl pkeyutl -encrypt -pubin -inkey tmp_evm_encrypted/r19_public.pem \
            -in /tmp/aes.key -out encrypted_delivery/key.rsa3072 \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_delivery/payload.aes256 encrypted_delivery/key.rsa3072 > encrypted_delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('encrypted_delivery/PUBLIC_MANIFEST.json').write_text(json.dumps({
            'schema':'kiln-r21-compound-mainnet-retry-v1',
            'runner_exit_code':int(Path('/tmp/private_exit_code.txt').read_text().strip()),
            'source_commit':'${{ github.sha }}',
            'plaintext_results_publicly_exposed':False,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r21-compound-mainnet-retry
          path: encrypted_delivery
          if-no-files-found: error
          retention-days: 1
