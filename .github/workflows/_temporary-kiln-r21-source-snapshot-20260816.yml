name: kiln-r21-public-source-snapshot

on:
  push:
    branches: [agent/kiln-r21-source-snapshot-20260816]
    paths:
      - .github/workflows/_temporary-kiln-r21-source-snapshot-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r21-source-snapshot-20260816
          fetch-depth: 1
      - name: Clone current public Kiln research mirror
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dumebi042/kiln-vault.git kiln-vault
          cd kiln-vault
          git rev-parse HEAD > ../KILN_SOURCE_HEAD.txt
          git log -1 --format='%H%n%aI%n%s' > ../KILN_SOURCE_COMMIT.txt
          find . -type f -not -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > ../KILN_SOURCE_SHA256SUMS.txt
      - name: Package public source only
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf kiln-r21-public-source.tar.gz kiln-vault KILN_SOURCE_HEAD.txt KILN_SOURCE_COMMIT.txt KILN_SOURCE_SHA256SUMS.txt
          sha256sum kiln-r21-public-source.tar.gz > kiln-r21-public-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r21-public-source-snapshot
          path: |
            kiln-r21-public-source.tar.gz
            kiln-r21-public-source.tar.gz.sha256
            KILN_SOURCE_HEAD.txt
            KILN_SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 1
