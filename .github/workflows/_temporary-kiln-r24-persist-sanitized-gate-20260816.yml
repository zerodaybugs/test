name: kiln-r24-persist-sanitized-gate

on:
  push:
    branches: [agent/kiln-r24-private-gates-20260816]
    paths:
      - .github/workflows/_temporary-kiln-r24-persist-sanitized-gate-20260816.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r24-private-gates-20260816
          fetch-depth: 1
      - name: Wait for sanitized master and download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='kiln-r24-sanitized-master-gate'
          run_id=''
          for attempt in $(seq 1 80); do
            run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/_temporary-kiln-r24-sanitized-master-gate-20260816.yml/runs?branch=agent/kiln-r24-private-gates-20260816&per_page=5" --jq '.workflow_runs[0].id // empty')
            status=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status // empty' 2>/dev/null || true)
            conclusion=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty' 2>/dev/null || true)
            echo "attempt=${attempt} run=${run_id} status=${status} conclusion=${conclusion}"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              break
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$status" = completed
          test "$conclusion" = success
          rm -rf /tmp/master_gate
          mkdir -p /tmp/master_gate
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$target" --dir /tmp/master_gate
          test -f /tmp/master_gate/MASTER_PUBLIC_GATE.json
      - name: Persist redacted decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r24_public_gate
          cp /tmp/master_gate/MASTER_PUBLIC_GATE.json r24_public_gate/MASTER_PUBLIC_GATE.json
          cp /tmp/master_gate/README.txt r24_public_gate/README.txt
          python3 - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          p=Path('r24_public_gate/MASTER_PUBLIC_GATE.json')
          d=json.loads(p.read_text())
          d['persisted_at_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          d['source_workflow_run_id']='${{ github.run_id }}'
          p.write_text(json.dumps(d,indent=2,sort_keys=True))
          Path('r24_public_gate/SHA256SUMS.txt').write_text(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  MASTER_PUBLIC_GATE.json\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r24_public_gate
          git commit -m 'persist Kiln R24 sanitized master gate'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r24-private-gates-20260816
            if git push origin HEAD:agent/kiln-r24-private-gates-20260816; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
