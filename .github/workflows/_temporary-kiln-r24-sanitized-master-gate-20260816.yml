name: kiln-r24-sanitized-master-gate

on:
  push:
    branches: [agent/kiln-r24-private-gates-20260816]
    paths:
      - .github/workflows/_temporary-kiln-r24-sanitized-master-gate-20260816.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  UA: Kiln-R24-Sanitized-Gate/1.0

jobs:
  compound:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r24-private-gates-20260816
      - run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Run Compound current-state gate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 6 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://raw.githubusercontent.com/zerodaybugs/test/agent/kiln-r21-compound-census-20260816/tmp_evm_encrypted/r21_compound_census.py' \
            -o /tmp/gate.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/gate.py')
          s=p.read_text()
          s=s.replace(
            "1:('ethereum',['https://eth.llamarpc.com','https://1rpc.io/eth','https://rpc.flashbots.net','https://ethereum-rpc.publicnode.com']),",
            "1:('ethereum',['https://ethereum-rpc.publicnode.com','https://rpc.flashbots.net','https://eth.llamarpc.com','https://1rpc.io/eth']),"
          )
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
          set +e
          python3 /tmp/gate.py > /tmp/run.log 2>&1
          echo $? > /tmp/exit.txt
          set -e
      - name: Create redacted gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def first_gate(root):
              gate={}; summary={}
              for p in Path(root).rglob('*.json') if Path(root).exists() else []:
                  try:d=json.loads(p.read_text())
                  except Exception:continue
                  if isinstance(d,dict):
                      if 'decision' in d and ('submit_ready' in d or 'validated_high' in d): gate=d
                      if isinstance(d.get('summary'),dict): summary=d['summary']
              return gate,summary
          gate,summary=first_gate('r21_compound_results')
          public={
            'lane':'compound_v3_reward_preclaim',
            'runner_exit_code':int(Path('/tmp/exit.txt').read_text().strip()),
            'decision':gate.get('decision','INCONCLUSIVE'),
            'submit_ready':bool(gate.get('submit_ready',False)),
            'validated_critical':int(gate.get('validated_critical',0) or 0),
            'validated_high':int(gate.get('validated_high',0) or 0),
            'validated_medium':int(gate.get('validated_medium',0) or 0),
            'candidate_count':int(gate.get('candidate_count',summary.get('claim_with_value_count',0)) or 0),
            'inspected':int(summary.get('inspected',0) or 0),
            'errors':int(summary.get('errors',0) or 0),
            'strategy_counts':summary.get('strategy_counts',{}),
            'redacted':True,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0,
          }
          out=Path('public_compound');out.mkdir()
          (out/'PUBLIC_GATE.json').write_text(json.dumps(public,indent=2,sort_keys=True))
          PY
          rm -rf r21_compound_results /tmp/gate.py /tmp/run.log /tmp/exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r24-public-compound
          path: public_compound
          retention-days: 2

  aave:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r24-private-gates-20260816
      - run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Run Aave reward compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 6 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://raw.githubusercontent.com/zerodaybugs/test/agent/kiln-r21-aave-rewards-20260816/tmp_evm_encrypted/r21_aave_reward_gate.py' \
            -o /tmp/gate.py
          set +e
          python3 /tmp/gate.py > /tmp/run.log 2>&1
          echo $? > /tmp/exit.txt
          set -e
      - name: Create redacted gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          gate={}; summary={}
          root=Path('r21_aave_reward_results')
          for p in root.rglob('*.json') if root.exists() else []:
              try:d=json.loads(p.read_text())
              except Exception:continue
              if isinstance(d,dict):
                  if 'decision' in d and ('submit_ready' in d or 'validated_high' in d): gate=d
                  if isinstance(d.get('summary'),dict): summary=d['summary']
          count=gate.get('candidate_count')
          if count is None:
              for k in ('candidate_count','compatibility_candidate_count','active_candidate_count','promotable_count'):
                  if k in summary: count=summary[k]; break
          public={
            'lane':'aave_reward_controller_compatibility',
            'runner_exit_code':int(Path('/tmp/exit.txt').read_text().strip()),
            'decision':gate.get('decision','INCONCLUSIVE'),
            'submit_ready':bool(gate.get('submit_ready',False)),
            'validated_critical':int(gate.get('validated_critical',0) or 0),
            'validated_high':int(gate.get('validated_high',0) or 0),
            'validated_medium':int(gate.get('validated_medium',0) or 0),
            'candidate_count':int(count or 0),
            'inspected':int(summary.get('inspected',0) or 0),
            'errors':int(summary.get('errors',0) or 0),
            'strategy_counts':summary.get('strategy_counts',{}),
            'redacted':True,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0,
          }
          out=Path('public_aave');out.mkdir()
          (out/'PUBLIC_GATE.json').write_text(json.dumps(public,indent=2,sort_keys=True))
          PY
          rm -rf r21_aave_reward_results /tmp/gate.py /tmp/run.log /tmp/exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r24-public-aave
          path: public_aave
          retention-days: 2

  metamorpho:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r24-private-gates-20260816
      - run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Run MetaMorpho Re7 accounting gate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 6 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://raw.githubusercontent.com/zerodaybugs/test/agent/kiln-r21-metamorpho-re7-20260816/tmp_evm_encrypted/r21_metamorpho_re7_census.py' \
            -o /tmp/gate.py
          set +e
          python3 /tmp/gate.py > /tmp/run.log 2>&1
          echo $? > /tmp/exit.txt
          set -e
      - name: Create redacted gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          gate={}; summary={}
          root=Path('r21_metamorpho_re7_results')
          for p in root.rglob('*.json') if root.exists() else []:
              try:d=json.loads(p.read_text())
              except Exception:continue
              if isinstance(d,dict):
                  if 'decision' in d and ('submit_ready' in d or 'validated_high' in d): gate=d
                  if isinstance(d.get('summary'),dict): summary=d['summary']
          public={
            'lane':'metamorpho_re7_accounting',
            'runner_exit_code':int(Path('/tmp/exit.txt').read_text().strip()),
            'decision':gate.get('decision','INCONCLUSIVE'),
            'submit_ready':bool(gate.get('submit_ready',False)),
            'validated_critical':int(gate.get('validated_critical',0) or 0),
            'validated_high':int(gate.get('validated_high',0) or 0),
            'validated_medium':int(gate.get('validated_medium',0) or 0),
            'candidate_count':int(gate.get('candidate_count',summary.get('candidate_count',0)) or 0),
            'inspected':int(summary.get('inspected',0) or 0),
            'errors':int(summary.get('errors',0) or 0),
            'redacted':True,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0,
          }
          out=Path('public_metamorpho');out.mkdir()
          (out/'PUBLIC_GATE.json').write_text(json.dumps(public,indent=2,sort_keys=True))
          PY
          rm -rf r21_metamorpho_re7_results /tmp/gate.py /tmp/run.log /tmp/exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r24-public-metamorpho
          path: public_metamorpho
          retention-days: 2

  full-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r24-private-gates-20260816
      - run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Reconstruct full-scope census
        shell: bash
        run: |
          set -euo pipefail
          for part in census.part00 census.part01 census.part02 census.part025 census.part03 census.part04; do
            curl --fail --retry 6 --retry-all-errors --connect-timeout 20 --max-time 180 \
              "https://raw.githubusercontent.com/zerodaybugs/test/agent/evm-readonly-encrypted-20260816/tmp_evm_encrypted/${part}" \
              -o "/tmp/${part}"
          done
          cat /tmp/census.part00 /tmp/census.part01 /tmp/census.part02 /tmp/census.part025 /tmp/census.part03 /tmp/census.part04 > /tmp/census.py
          python3 -m py_compile /tmp/census.py
          set +e
          python3 /tmp/census.py > /tmp/run.log 2>&1
          echo $? > /tmp/exit.txt
          set -e
      - name: Create redacted gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          gate={}; summary={}
          root=Path('census_results')
          for p in root.rglob('*.json') if root.exists() else []:
              try:d=json.loads(p.read_text())
              except Exception:continue
              if isinstance(d,dict):
                  if 'decision' in d and ('submit_ready' in d or 'validated_high' in d): gate=d
                  if isinstance(d.get('summary'),dict): summary=d['summary']
          count=gate.get('candidate_count')
          if count is None:
              for k in ('candidate_count','promotable_candidate_count','source_promotable_candidate_count','observed_signal_count'):
                  if k in summary: count=summary[k]; break
          public={
            'lane':'full_scope_runtime_census',
            'runner_exit_code':int(Path('/tmp/exit.txt').read_text().strip()),
            'decision':gate.get('decision','INCONCLUSIVE'),
            'submit_ready':bool(gate.get('submit_ready',False)),
            'validated_critical':int(gate.get('validated_critical',0) or 0),
            'validated_high':int(gate.get('validated_high',0) or 0),
            'validated_medium':int(gate.get('validated_medium',0) or 0),
            'candidate_count':int(count or 0),
            'inspected':int(summary.get('inspected',summary.get('vaults_inspected',0)) or 0),
            'errors':int(summary.get('errors',0) or 0),
            'redacted':True,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0,
          }
          out=Path('public_full');out.mkdir()
          (out/'PUBLIC_GATE.json').write_text(json.dumps(public,indent=2,sort_keys=True))
          PY
          rm -rf census_results /tmp/census.py /tmp/census.part* /tmp/run.log /tmp/exit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r24-public-full-census
          path: public_full
          retention-days: 2

  aggregate:
    needs: [compound, aave, metamorpho, full-census]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kiln-r24-public-*
          path: public_inputs
      - name: Aggregate redacted gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          rows=[]
          for p in sorted(Path('public_inputs').rglob('PUBLIC_GATE.json')):
              try:rows.append(json.loads(p.read_text()))
              except Exception:pass
          valid_critical=sum(int(x.get('validated_critical',0) or 0) for x in rows)
          valid_high=sum(int(x.get('validated_high',0) or 0) for x in rows)
          candidates=sum(int(x.get('candidate_count',0) or 0) for x in rows)
          incomplete=sum(1 for x in rows if int(x.get('runner_exit_code',1))!=0 or x.get('decision')=='INCONCLUSIVE')
          if valid_critical or valid_high:
              decision='PROMOTE_PRIVATE_SUBMISSION_REVIEW'
          elif candidates:
              decision='PROMOTE_PRIVATE_LOCAL_FORK'
          elif incomplete:
              decision='INCONCLUSIVE_RETRY_REQUIRED'
          else:
              decision='NO_SUBMITTABLE_HIGH_OR_CRITICAL'
          master={
            'schema':'kiln-r24-sanitized-master-gate-v1',
            'generated_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'decision':decision,
            'submit_ready':bool(valid_critical or valid_high) and all(bool(x.get('submit_ready')) for x in rows if int(x.get('validated_critical',0) or 0) or int(x.get('validated_high',0) or 0)),
            'validated_critical':valid_critical,
            'validated_high':valid_high,
            'candidate_count':candidates,
            'incomplete_lanes':incomplete,
            'lane_count':len(rows),
            'lanes':rows,
            'redacted':True,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0,
          }
          out=Path('public_master');out.mkdir()
          (out/'MASTER_PUBLIC_GATE.json').write_text(json.dumps(master,indent=2,sort_keys=True))
          (out/'README.txt').write_text('Sanitized decision gate only. No addresses, exploit details, private keys, or public-chain transactions.\n')
          print(decision)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r24-sanitized-master-gate
          path: public_master
          retention-days: 2
