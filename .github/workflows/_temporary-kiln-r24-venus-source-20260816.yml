name: kiln-r24-venus-source
on:
  push:
    branches: [agent/kiln-r24-private-gates-20260816]
    paths:
      - .github/workflows/_temporary-kiln-r24-venus-source-20260816.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r24-private-gates-20260816
      - name: Fetch public verified Venus connector source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r24_venus_source
          curl --fail --retry 6 --retry-all-errors --connect-timeout 20 --max-time 120 \
            'https://api.routescan.io/v2/network/mainnet/evm/56/etherscan/api?module=contract&action=getsourcecode&address=0x045d8C112645301565935f250f4520008c26F50F' \
            -o r24_venus_source/connector_source.json
          python3 - <<'PY'
          import json
          p='r24_venus_source/connector_source.json'
          d=json.load(open(p))
          assert isinstance(d.get('result'),list) and d['result']
          print('VENUS_SOURCE_FETCH=PASS')
          PY
          sha256sum r24_venus_source/connector_source.json > r24_venus_source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r24-venus-source
          path: r24_venus_source
          if-no-files-found: error
          retention-days: 1
