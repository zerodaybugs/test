name: kiln-r24-venus-source-sourcify
on:
  push:
    branches: [agent/kiln-r24-private-gates-20260816]
    paths:
      - .github/workflows/_temporary-kiln-r24-venus-source-sourcify-20260816.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r24-private-gates-20260816
      - name: Fetch public verification artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r24_venus_source
          curl -L --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            'https://sourcify.dev/server/v2/contract/56/0x045d8C112645301565935f250f4520008c26F50F?fields=all' \
            -o r24_venus_source/sourcify.json || true
          curl -L --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0 Kiln-R24-ReadOnly' \
            'https://bscscan.com/address/0x045d8C112645301565935f250f4520008c26F50F#code' \
            -o r24_venus_source/bscscan.html || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          out={}
          p=Path('r24_venus_source/sourcify.json')
          if p.exists():
            try:
              d=json.loads(p.read_text())
              out['sourcify_keys']=sorted(d) if isinstance(d,dict) else []
              out['sourcify_match']=d.get('match') if isinstance(d,dict) else None
              out['sourcify_runtime_match']=d.get('runtimeMatch') if isinstance(d,dict) else None
              out['sourcify_error']=d.get('error') if isinstance(d,dict) else None
            except Exception as e: out['sourcify_parse_error']=str(e)
          h=Path('r24_venus_source/bscscan.html')
          out['bscscan_bytes']=h.stat().st_size if h.exists() else 0
          if h.exists():
            t=h.read_text(errors='replace')
            out['contains_venus_connector']='VenusConnector' in t
            out['contains_source_code']='Contract Source Code' in t
          Path('r24_venus_source/SUMMARY.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          PY
          sha256sum r24_venus_source/* > r24_venus_source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r24-venus-source-sourcify
          path: r24_venus_source
          if-no-files-found: error
          retention-days: 1
