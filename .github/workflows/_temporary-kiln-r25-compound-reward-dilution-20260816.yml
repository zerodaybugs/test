name: kiln-r25-compound-reward-dilution

on:
  push:
    branches: [agent/kiln-r25-compound-reward-dilution-20260816]
    paths:
      - kiln_r25/reward_dilution_gate.py
      - .github/workflows/_temporary-kiln-r25-compound-reward-dilution-20260816.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r25-compound-reward-dilution-20260816
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0' 'requests==2.32.5'
      - name: Verify script
        run: python3 -m py_compile kiln_r25/reward_dilution_gate.py
      - name: Clone public Kiln research mirror
        run: git clone --depth 1 https://github.com/dumebi042/kiln-vault.git mirror
      - name: Run read-only live and historical gate
        shell: bash
        run: |
          set -o pipefail
          KILN_MIRROR=mirror python3 kiln_r25/reward_dilution_gate.py 2>&1 | tee r25_run.log
      - name: Assert safety and integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          ev=json.load(open('r25_results/EVIDENCE.json'))
          assert ev['safety']['read_only'] is True
          assert ev['safety']['public_chain_state_changes']==0
          assert ev['safety']['transactions_signed']==0
          assert ev['safety']['transactions_sent']==0
          for line in Path('r25_results/SHA256SUMS.txt').read_text().splitlines():
              h,name=line.split('  ',1)
              assert hashlib.sha256((Path('r25_results')/name).read_bytes()).hexdigest()==h
          print('R25_SAFETY_AND_INTEGRITY=PASS')
          PY
      - name: Persist redacted decision only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r25_public_gate
          cp r25_results/PUBLIC_GATE.json r25_public_gate/PUBLIC_GATE.json
          python3 - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          p=Path('r25_public_gate/PUBLIC_GATE.json')
          d=json.loads(p.read_text())
          d['persisted_at_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          d['source_commit']='${{ github.sha }}'
          p.write_text(json.dumps(d,indent=2,sort_keys=True))
          Path('r25_public_gate/SHA256SUMS.txt').write_text(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  PUBLIC_GATE.json\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r25_public_gate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'persist Kiln R25 reward dilution gate'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r25-compound-reward-dilution-20260816
            if git push origin HEAD:agent/kiln-r25-compound-reward-dilution-20260816; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r25-private-evidence
          path: |
            r25_results
            r25_run.log
            kiln_r25/reward_dilution_gate.py
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r25-public-gate
          path: r25_public_gate
          if-no-files-found: warn
          retention-days: 3
