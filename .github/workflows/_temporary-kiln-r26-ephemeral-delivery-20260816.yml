name: kiln-r26-ephemeral-delivery

on:
  push:
    branches: [agent/kiln-r25-compound-reward-dilution-20260816]
    paths:
      - .github/workflows/_temporary-kiln-r26-ephemeral-delivery-20260816.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r25-compound-reward-dilution-20260816
          fetch-depth: 1
      - name: Locate latest completed R26 v2 run and download delivery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='_temporary-kiln-r26-historical-reward-dilution-poc-v2-20260816.yml'
          run_id=''
          for attempt in $(seq 1 90); do
            run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=agent/kiln-r25-compound-reward-dilution-20260816&per_page=10" --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "$run_id" > R26_SOURCE_RUN_ID.txt
          rm -rf delivery_download
          mkdir delivery_download
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name 'kiln-r26-v2-submit-ready' --dir delivery_download
          find delivery_download -maxdepth 3 -type f -print
          package=$(find delivery_download -type f -name 'KILN_OMNIVAULT_*_SUBMIT_READY_2026-08-16.zip' | head -n1)
          test -n "$package"
          sidecar="${package}.sha256"
          test -f "$sidecar"
          cp "$package" .
          cp "$sidecar" .
          basename "$package" > R26_PACKAGE_NAME.txt
      - name: Verify package before release
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          name=Path('R26_PACKAGE_NAME.txt').read_text().strip()
          p=Path(name)
          assert p.exists()
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              required=['REPORT.md','KilnR26PoC.t.sol','POC_RESULT.json','REPLAY_SPEC.json','DUPLICATE_CLEARANCE.json','SAFETY.json']
              for item in required:
                  assert any(n.endswith('/'+item) or n==item for n in names), item
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          side=Path(str(p)+'.sha256').read_text()
          assert digest in side
          Path('R26_RELEASE_AUDIT.json').write_text(json.dumps({
              'package':name,'sha256':digest,'zip_entries':len(names),'crc_error':None,
              'required_files_present':True,'source_run_id':Path('R26_SOURCE_RUN_ID.txt').read_text().strip()
          },indent=2,sort_keys=True))
          PY
      - name: Publish short-lived delivery release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='kiln-r26-delivery-20260816'
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          name=$(cat R26_PACKAGE_NAME.txt)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target agent/kiln-r25-compound-reward-dilution-20260816 \
            --title 'Temporary Kiln R26 delivery' \
            --notes 'Automated short-lived transfer. Local fixed-block PoC only.' \
            "$name" "${name}.sha256" R26_RELEASE_AUDIT.json
          echo 'R26_EPHEMERAL_RELEASE_READY'
      - name: Keep transfer window open
        run: sleep 900
      - name: Remove delivery release and tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete 'kiln-r26-delivery-20260816' --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
