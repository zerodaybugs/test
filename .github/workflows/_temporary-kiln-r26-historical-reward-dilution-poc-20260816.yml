name: kiln-r26-historical-reward-dilution-poc

on:
  push:
    branches: [agent/kiln-r25-compound-reward-dilution-20260816]
    paths:
      - kiln_r25/reward_dilution_gate.py
      - kiln_r25/run_historical_replay.py
      - .github/workflows/_temporary-kiln-r26-historical-reward-dilution-poc-20260816.yml
      - r25_public_gate/PUBLIC_GATE.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r25-compound-reward-dilution-20260816
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned Python runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0' 'requests==2.32.5'
      - name: Verify research scripts
        run: |
          python3 -m py_compile kiln_r25/reward_dilution_gate.py
          python3 -m py_compile kiln_r25/run_historical_replay.py
      - name: Ensure forge-std
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f lib/forge-std/src/Test.sol ]; then
            rm -rf lib/forge-std
            forge install foundry-rs/forge-std --no-git
          fi
      - name: Clone public Kiln mirror
        run: git clone --depth 1 https://github.com/dumebi042/kiln-vault.git mirror
      - name: Re-run R25 current and historical gate
        shell: bash
        run: |
          set -o pipefail
          KILN_MIRROR=mirror python3 kiln_r25/reward_dilution_gate.py 2>&1 | tee r25_replay_gate.log
      - name: Run R26 fixed-block historical replay
        shell: bash
        run: |
          set -o pipefail
          python3 kiln_r25/run_historical_replay.py 2>&1 | tee r26_replay.log
      - name: Assert safety and package integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          gate=json.load(open('r26_results/MASTER_GATE.json'))
          safety=gate.get('safety',{})
          assert safety.get('public_chain_state_changes',0)==0
          assert safety.get('transactions_signed',0)==0
          assert safety.get('transactions_sent',0)==0
          for line in Path('r26_results/SHA256SUMS.txt').read_text().splitlines():
              h,name=line.split('  ',1)
              assert hashlib.sha256((Path('r26_results')/name).read_bytes()).hexdigest()==h
          zips=list(Path('.').glob('KILN_OMNIVAULT_*_SUBMIT_READY_2026-08-16.zip'))
          for path in zips:
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
          print('R26_SAFETY_AND_INTEGRITY=PASS')
          PY
      - name: Persist redacted R26 decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r26_public_gate
          cp r26_results/PUBLIC_GATE.json r26_public_gate/PUBLIC_GATE.json
          python3 - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          p=Path('r26_public_gate/PUBLIC_GATE.json')
          d=json.loads(p.read_text())
          d['persisted_at_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          d['source_commit']='${{ github.sha }}'
          p.write_text(json.dumps(d,indent=2,sort_keys=True))
          Path('r26_public_gate/SHA256SUMS.txt').write_text(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  PUBLIC_GATE.json\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add r26_public_gate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'persist Kiln R26 historical replay gate'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r25-compound-reward-dilution-20260816
            if git push origin HEAD:agent/kiln-r25-compound-reward-dilution-20260816; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r26-private-evidence
          path: |
            r25_results
            r26_results
            r25_replay_gate.log
            r26_replay.log
            test/KilnR26PoC.t.sol
            kiln_r25/reward_dilution_gate.py
            kiln_r25/run_historical_replay.py
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r26-public-gate
          path: r26_public_gate
          if-no-files-found: warn
          retention-days: 3
      - name: Stage submit-ready package when gate passes
        if: always()
        shell: bash
        run: |
          mkdir -p submit_ready_delivery
          find . -maxdepth 1 -type f \( -name 'KILN_OMNIVAULT_*_SUBMIT_READY_2026-08-16.zip' -o -name 'KILN_OMNIVAULT_*_SUBMIT_READY_2026-08-16.zip.sha256' \) -exec cp {} submit_ready_delivery/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r26-submit-ready-delivery
          path: submit_ready_delivery
          if-no-files-found: warn
          retention-days: 3
