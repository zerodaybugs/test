name: kiln-r27-current-aave-compatibility

on:
  push:
    branches: [agent/kiln-r27-current-aave-compatibility-20260817]
    paths:
      - kiln_r27/**
      - .github/workflows/_temporary-kiln-r27-current-aave-compatibility-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r27-current-aave-compatibility-20260817
          fetch-depth: 1

      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0' 'requests==2.32.5'

      - name: Verify census source
        run: |
          python3 -m py_compile kiln_r27/aave_compatibility_census.py
          sha256sum kiln_r27/aave_compatibility_census.py > /tmp/script.sha256

      - name: Run private read-only census
        shell: bash
        run: |
          set +e
          python3 kiln_r27/aave_compatibility_census.py > /tmp/private_run.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/private_exit_code.txt
          echo 'R27_PRIVATE_CENSUS_EXIT_RECORDED'

      - name: Encrypt complete evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_delivery
          if [ -d r27_results ]; then
            tar -czf /tmp/private_payload.tar.gz r27_results /tmp/private_run.log /tmp/private_exit_code.txt /tmp/script.sha256
          else
            tar -czf /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt /tmp/script.sha256
          fi
          openssl rand 32 > /tmp/aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/private_payload.tar.gz \
            -out encrypted_delivery/payload.aes256 \
            -pass file:/tmp/aes.key
          openssl pkeyutl -encrypt -pubin \
            -inkey kiln_r27/delivery_public.pem \
            -in /tmp/aes.key \
            -out encrypted_delivery/key.rsa3072 \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_delivery/payload.aes256 encrypted_delivery/key.rsa3072 > encrypted_delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('encrypted_delivery/PUBLIC_MANIFEST.json').write_text(json.dumps({
              'schema': 'kiln-r27-encrypted-readonly-delivery-v1',
              'runner_exit_code': int(Path('/tmp/private_exit_code.txt').read_text().strip()),
              'source_commit': '${{ github.sha }}',
              'script_sha256': Path('/tmp/script.sha256').read_text().split()[0],
              'plaintext_results_publicly_exposed': False,
              'public_chain_state_changes': 0,
              'transactions_signed': 0,
              'transactions_sent': 0,
              'private_keys_loaded': 0,
          }, indent=2, sort_keys=True))
          PY
          rm -rf r27_results
          rm -f /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt /tmp/script.sha256 /tmp/aes.key

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r27-current-aave-compatibility-encrypted
          path: encrypted_delivery
          if-no-files-found: error
          retention-days: 3
