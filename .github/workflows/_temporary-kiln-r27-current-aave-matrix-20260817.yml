name: kiln-r27-current-aave-matrix

on:
  push:
    branches: [agent/kiln-r27-current-aave-compatibility-20260817]
    paths:
      - .github/workflows/_temporary-kiln-r27-current-aave-matrix-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-census:
    strategy:
      fail-fast: false
      matrix:
        network: [ethereum, optimism, bnb, polygon, base, arbitrum]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r27-current-aave-compatibility-20260817
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0' 'requests==2.32.5'
      - name: Run isolated private network census
        env:
          TARGET_NETWORK: ${{ matrix.network }}
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/private_run.log 2>&1
          import importlib.util, os
          from pathlib import Path
          p=Path('kiln_r27/aave_compatibility_census.py')
          spec=importlib.util.spec_from_file_location('r27',p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          original=mod.fetch_scope
          target=os.environ['TARGET_NETWORK']
          def filtered_scope():
              rows,meta=original()
              selected=[row for row in rows if row.network==target]
              meta=dict(meta)
              meta['matrix_network']=target
              meta['pre_filter_count']=len(rows)
              meta['post_filter_count']=len(selected)
              return selected,meta
          mod.fetch_scope=filtered_scope
          raise SystemExit(mod.main())
          PY
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/private_exit_code.txt
          echo 'R27_MATRIX_PRIVATE_EXIT_RECORDED_${{ matrix.network }}'
      - name: Encrypt complete network evidence
        env:
          TARGET_NETWORK: ${{ matrix.network }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_delivery
          if [ -d r27_results ]; then
            tar -czf /tmp/private_payload.tar.gz r27_results /tmp/private_run.log /tmp/private_exit_code.txt
          else
            tar -czf /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt
          fi
          openssl rand 32 > /tmp/aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in /tmp/private_payload.tar.gz -out encrypted_delivery/payload.aes256 -pass file:/tmp/aes.key
          openssl pkeyutl -encrypt -pubin -inkey kiln_r27/delivery_public.pem -in /tmp/aes.key -out encrypted_delivery/key.rsa3072 -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_delivery/payload.aes256 encrypted_delivery/key.rsa3072 > encrypted_delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('encrypted_delivery/PUBLIC_MANIFEST.json').write_text(json.dumps({
              'schema':'kiln-r27-network-encrypted-delivery-v1',
              'network':os.environ['TARGET_NETWORK'],
              'runner_exit_code':int(Path('/tmp/private_exit_code.txt').read_text().strip()),
              'source_commit':'${{ github.sha }}',
              'plaintext_results_publicly_exposed':False,
              'public_chain_state_changes':0,
              'transactions_signed':0,
              'transactions_sent':0,
              'private_keys_loaded':0
          },indent=2,sort_keys=True))
          PY
          rm -rf r27_results
          rm -f /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt /tmp/aes.key
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r27-${{ matrix.network }}-encrypted
          path: encrypted_delivery
          if-no-files-found: error
          retention-days: 3
