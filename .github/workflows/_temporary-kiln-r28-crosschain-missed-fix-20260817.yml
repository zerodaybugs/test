name: kiln-r28-crosschain-missed-fix

on:
  push:
    branches: [agent/kiln-r28-crosschain-missed-fix-20260817]
    paths:
      - kiln_r28/**
      - .github/workflows/_temporary-kiln-r28-crosschain-missed-fix-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r28-crosschain-missed-fix-20260817
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Restore and verify gate
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc kiln_r28/crosschain_logic_delta.py.gz > /tmp/r28.py
          test "$(sha256sum /tmp/r28.py | cut -d' ' -f1)" = '566802709997164ebe7fb1b43689247f2cf0f294afd967aa469a8f036d9e7b18'
          python3 -m py_compile /tmp/r28.py
      - name: Run private read-only gate
        shell: bash
        run: |
          set +e
          python3 /tmp/r28.py > /tmp/private_run.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/private_exit_code.txt
          echo 'R28_PRIVATE_EXIT_RECORDED'
      - name: Encrypt complete evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_delivery
          if [ -d r28_results ]; then
            tar -czf /tmp/private_payload.tar.gz r28_results /tmp/private_run.log /tmp/private_exit_code.txt /tmp/r28.py
          else
            tar -czf /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt /tmp/r28.py
          fi
          openssl rand 32 > /tmp/aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in /tmp/private_payload.tar.gz -out encrypted_delivery/payload.aes256 -pass file:/tmp/aes.key
          openssl pkeyutl -encrypt -pubin -inkey kiln_r28/delivery_public.pem -in /tmp/aes.key -out encrypted_delivery/key.rsa3072 -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_delivery/payload.aes256 encrypted_delivery/key.rsa3072 > encrypted_delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('encrypted_delivery/PUBLIC_MANIFEST.json').write_text(json.dumps({
            'schema':'kiln-r28-encrypted-delivery-v1',
            'runner_exit_code':int(Path('/tmp/private_exit_code.txt').read_text().strip()),
            'source_commit':'${{ github.sha }}',
            'plaintext_results_publicly_exposed':False,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0,
            'private_keys_loaded':0
          },indent=2,sort_keys=True))
          PY
          rm -rf r28_results
          rm -f /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt /tmp/aes.key /tmp/r28.py
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r28-crosschain-missed-fix-encrypted
          path: encrypted_delivery
          if-no-files-found: error
          retention-days: 3
