name: kiln-r30-current-full-scope-export

on:
  push:
    branches: [agent/kiln-r30-current-scope-all-20260817]
    paths:
      - kiln_r30/current_scope_export.py
      - .github/workflows/_temporary-kiln-r30-current-scope-export-20260817.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r30-current-scope-all-20260817
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'requests==2.32.5'
      - name: Verify exporter
        run: python3 -m py_compile kiln_r30/current_scope_export.py
      - name: Export current public scope
        run: python3 kiln_r30/current_scope_export.py | tee r30_scope.log
      - name: Self-check hashes and gate
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('r30_scope')
          gate=json.loads((root/'PUBLIC_GATE.json').read_text())
          assert gate['decision']=='PASS_CURRENT_SCOPE_EXPORTED', gate
          assert gate['row_count'] >= 49, gate
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              h,name=line.split('  ',1)
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h
          print('R30_SCOPE_SELF_CHECK=PASS')
          PY
      - name: Persist public scope snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r30_scope
          git commit -m 'persist Kiln R30 current full scope' || exit 0
          git pull --rebase origin agent/kiln-r30-current-scope-all-20260817
          git push origin HEAD:agent/kiln-r30-current-scope-all-20260817
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r30-current-full-scope
          path: |
            r30_scope
            r30_scope.log
          if-no-files-found: error
          retention-days: 3
