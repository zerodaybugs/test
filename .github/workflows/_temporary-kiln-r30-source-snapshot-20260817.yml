name: kiln-r30-source-snapshot

on:
  push:
    branches: [agent/kiln-r30-current-scope-all-20260817]
    paths:
      - .github/workflows/_temporary-kiln-r30-source-snapshot-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r30-current-scope-all-20260817
          fetch-depth: 1
      - name: Clone public Kiln audit mirror at pinned commit
        run: |
          git clone https://github.com/dumebi042/kiln-vault.git kiln_source
          cd kiln_source
          git checkout 33359ff399fd9fbf31ca87e3671446eb37a7ee61
          test "$(git rev-parse HEAD)" = "33359ff399fd9fbf31ca87e3671446eb37a7ee61"
      - name: Build source snapshot
        run: |
          set -euo pipefail
          mkdir -p kiln-r30-source-snapshot
          cp -R kiln_source/src kiln-r30-source-snapshot/
          cp -R kiln_source/.audit kiln-r30-source-snapshot/
          cp kiln_source/foundry.toml kiln_source/remappings.txt kiln-r30-source-snapshot/ 2>/dev/null || true
          printf '%s\n' '33359ff399fd9fbf31ca87e3671446eb37a7ee61' > kiln-r30-source-snapshot/PINNED_COMMIT.txt
          find kiln-r30-source-snapshot -type f -print0 | sort -z | xargs -0 sha256sum > kiln-r30-source-snapshot/SHA256SUMS.txt
          tar -czf KILN_R30_SOURCE_SNAPSHOT_2026-08-17.tar.gz kiln-r30-source-snapshot
          sha256sum KILN_R30_SOURCE_SNAPSHOT_2026-08-17.tar.gz > KILN_R30_SOURCE_SNAPSHOT_2026-08-17.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r30-source-snapshot
          path: |
            KILN_R30_SOURCE_SNAPSHOT_2026-08-17.tar.gz
            KILN_R30_SOURCE_SNAPSHOT_2026-08-17.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
