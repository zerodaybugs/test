name: kiln-r31-base64-export

on:
  push:
    branches: [agent/kiln-r31-runtime-census-20260817]
    paths:
      - .github/workflows/_temporary-kiln-r31-base64-export-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r31-runtime-census-20260817
          fetch-depth: 1
      - name: Convert selected encrypted evidence to lossless wrapped base64 text
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r31_recovery_b64
          mkdir -p r31_recovery_b64
          for key in ethereum_0 ethereum_1 ethereum_2 ethereum_3 bnb_0; do
            src="r31_recovery_parallel_results/${key}"
            dst="r31_recovery_b64/${key}"
            test -f "$src/encrypted/key.rsa3072"
            test -f "$src/encrypted/payload.aes256"
            mkdir -p "$dst"
            base64 -w 76 "$src/encrypted/key.rsa3072" > "$dst/key.rsa3072.b64"
            base64 -w 76 "$src/encrypted/payload.aes256" > "$dst/payload.aes256.b64"
            cp "$src/PUBLIC_GATE.json" "$dst/PUBLIC_GATE.json"
            cp "$src/MANIFEST.json" "$dst/MANIFEST.json"
            python3 - "$src" "$dst" <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          src,dst=Path(sys.argv[1]),Path(sys.argv[2])
          checks={}
          for raw_name,b64_name in [('encrypted/key.rsa3072','key.rsa3072.b64'),('encrypted/payload.aes256','payload.aes256.b64')]:
              raw=(src/raw_name).read_bytes()
              decoded=base64.b64decode((dst/b64_name).read_text())
              checks[raw_name]={
                'raw_sha256':hashlib.sha256(raw).hexdigest(),
                'decoded_sha256':hashlib.sha256(decoded).hexdigest(),
                'bytes':len(raw),
                'roundtrip_ok':raw==decoded,
              }
          assert all(x['roundtrip_ok'] for x in checks.values())
          (dst/'ROUNDTRIP.json').write_text(json.dumps(checks,indent=2,sort_keys=True))
          PY
          done
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('r31_recovery_b64')
          files=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files))
          manifest={'schema':'kiln-r31-lossless-b64-export-v1','selected_shards':['ethereum_0','ethereum_1','ethereum_2','ethereum_3','bnb_0'],'private_keys_included':False,'binary_roundtrip_verified':True,'public_chain_state_changes':0,'transactions_signed':0,'transactions_sent':0}
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True))
          PY
      - name: Commit lossless base64 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r31_recovery_b64
          git commit -m 'persist lossless base64 Kiln R31 evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r31-runtime-census-20260817
            if git push origin HEAD:agent/kiln-r31-runtime-census-20260817; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
