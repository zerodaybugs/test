name: kiln-r32-recovered-export

on:
  push:
    branches: [agent/kiln-r32-signal-recovery-20260818]
    paths:
      - .github/workflows/_temporary-kiln-r32-recovered-export-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r32-signal-recovery-20260818
          fetch-depth: 1

      - name: Validate recovered encrypted bundles
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('r32_recovered')
          expected={'ethereum_0','ethereum_1','ethereum_2','ethereum_3','bnb_0','base_0'}
          actual={p.name for p in root.iterdir() if p.is_dir()}
          assert expected <= actual, (expected,actual)
          for name in sorted(expected):
              d=root/name
              gate=json.loads((d/'PUBLIC_GATE.json').read_text())
              manifest=json.loads((d/'PUBLIC_MANIFEST.json').read_text())
              assert gate['submit_ready'] is False
              assert gate['validated_critical']==0
              assert gate['validated_high']==0
              assert manifest['public_chain_state_changes']==0
              assert manifest['transactions_signed']==0
              assert manifest['transactions_sent']==0
              for line in (d/'encrypted'/'SHA256SUMS.txt').read_text().splitlines():
                  digest,path=line.split(maxsplit=1)
                  candidate=d/'encrypted'/Path(path).name
                  assert hashlib.sha256(candidate.read_bytes()).hexdigest()==digest
          print('R32_EXPORT_SELF_CHECK=PASS')
          PY

      - name: Record export run id
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > r32_recovered/EXPORT_RUN_ID.txt
          printf '%s\n' "${GITHUB_SHA}" > r32_recovered/EXPORT_SOURCE_SHA.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r32-recovered-encrypted-bundles
          path: r32_recovered
          if-no-files-found: error
          retention-days: 3

      - name: Persist export locator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r32_recovered/EXPORT_RUN_ID.txt r32_recovered/EXPORT_SOURCE_SHA.txt
          git commit -m 'persist Kiln R32 encrypted export locator' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/kiln-r32-signal-recovery-20260818
            if git push origin HEAD:agent/kiln-r32-signal-recovery-20260818; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
