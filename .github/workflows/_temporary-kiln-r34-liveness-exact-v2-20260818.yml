name: kiln-r34-liveness-exact-v2

on:
  push:
    branches: [agent/kiln-r34-liveness-exact-v2-20260818]
    paths:
      - kiln_r34/liveness_exact_v2.py
      - .github/workflows/_temporary-kiln-r34-liveness-exact-v2-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liveness-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r34-liveness-exact-v2-20260818
          fetch-depth: 1

      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0' 'requests==2.32.5'

      - name: Verify source
        run: python3 -m py_compile kiln_r34/liveness_exact_v2.py

      - name: Run exact read-only liveness gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 kiln_r34/liveness_exact_v2.py 2>&1 | tee r34_exact_run.log
          printf '%s\n' "${PIPESTATUS[0]}" > r34_exact_exit_code.txt
          exit "$(cat r34_exact_exit_code.txt)"

      - name: Build fail-closed public result and refresh hashes
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          root=Path('r34_exact_results'); root.mkdir(exist_ok=True)
          code=999
          p=Path('r34_exact_exit_code.txt')
          if p.exists():
              try: code=int(p.read_text().strip())
              except Exception: pass
          gate_path=root/'PUBLIC_GATE.json'
          if gate_path.exists():
              try: gate=json.loads(gate_path.read_text())
              except Exception: gate={}
          else: gate={}
          if not gate:
              gate={
                'schema':'kiln-r34-fallback-public-gate-v2',
                'decision':'INCONCLUSIVE_EXECUTION_FAILURE',
                'submit_ready':False,
                'validated_critical':0,
                'validated_high':0,
                'scope_count':0,
                'inspected_count':0,
                'error_count':1,
                'preliminary_signal_rows':0,
                'candidate_count':0,
                'inconclusive_holder_rows':0,
                'candidate_vaults':[],
                'public_chain_state_changes':0,
                'transactions_signed':0,
                'transactions_sent':0,
              }
          gate['runner_exit_code']=code
          gate['step_outcome']=os.environ.get('STEP_OUTCOME')
          gate['persisted_at_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          if code!=0 or os.environ.get('STEP_OUTCOME')!='success':
              gate.update({
                'decision':'INCONCLUSIVE_EXECUTION_FAILURE',
                'submit_ready':False,
                'validated_critical':0,
                'validated_high':0,
              })
          gate_path.write_text(json.dumps(gate,indent=2,sort_keys=True))
          files=sorted(x for x in root.iterdir() if x.is_file() and x.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(
              f'{hashlib.sha256(x.read_bytes()).hexdigest()}  {x.name}\n' for x in files
          ))
          PY

      - name: Self-check evidence and safety boundary
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('r34_exact_results')
          gate=json.loads((root/'PUBLIC_GATE.json').read_text())
          assert gate['submit_ready'] is False
          assert gate['validated_critical']==0
          assert gate['validated_high']==0
          assert gate['public_chain_state_changes']==0
          assert gate['transactions_signed']==0
          assert gate['transactions_sent']==0
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          evidence=root/'EVIDENCE.json'
          if evidence.exists():
              data=json.loads(evidence.read_text())
              safety=data['safety']
              assert safety['public_chain_state_changes']==0
              assert safety['transactions_signed']==0
              assert safety['transactions_sent']==0
              assert safety['private_keys_loaded']==0
          print('R34_EXACT_SELF_CHECK=PASS')
          PY

      - name: Persist sanitized public gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r34_public_gate_v2
          mkdir r34_public_gate_v2
          cp r34_exact_results/PUBLIC_GATE.json r34_public_gate_v2/
          cp r34_exact_results/SHA256SUMS.txt r34_public_gate_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r34_public_gate_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'persist Kiln R34 exact liveness public gate'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/kiln-r34-liveness-exact-v2-20260818
            if git push origin HEAD:agent/kiln-r34-liveness-exact-v2-20260818; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r34-exact-v2-private-evidence
          path: |
            r34_exact_results
            r34_exact_run.log
            r34_exact_exit_code.txt
            kiln_r34/liveness_exact_v2.py
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r34-exact-v2-public-gate
          path: r34_public_gate_v2
          if-no-files-found: error
          retention-days: 3
