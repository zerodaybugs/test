name: kiln-r37-fee-invariant-census

on:
  push:
    branches: [agent/kiln-r37-fee-invariant-census-20260818]
    paths:
      - kiln_r37/fee_invariant_census.py
      - kiln_r37/delivery_public.pem
      - .github/workflows/_temporary-kiln-r37-fee-invariant-census-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {network: ethereum, shard_index: 0, shard_count: 4}
          - {network: ethereum, shard_index: 1, shard_count: 4}
          - {network: ethereum, shard_index: 2, shard_count: 4}
          - {network: ethereum, shard_index: 3, shard_count: 4}
          - {network: arbitrum, shard_index: 0, shard_count: 2}
          - {network: arbitrum, shard_index: 1, shard_count: 2}
          - {network: base, shard_index: 0, shard_count: 1}
          - {network: bnb, shard_index: 0, shard_count: 1}
          - {network: polygon, shard_index: 0, shard_count: 1}
          - {network: optimism, shard_index: 0, shard_count: 1}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r37-fee-invariant-census-20260818
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Verify source and scope
        run: |
          set -euo pipefail
          python3 -m py_compile kiln_r37/fee_invariant_census.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('r30_scope/SCOPE.json')
          assert p.exists(), p
          d=json.loads(p.read_text())
          assert len(d.get('rows',[])) == 101, len(d.get('rows',[]))
          print('R37_SCOPE_GATE=PASS_101')
          PY
      - name: Run private read-only fee census
        env:
          TARGET_NETWORK: ${{ matrix.network }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        shell: bash
        run: |
          set +e
          python3 kiln_r37/fee_invariant_census.py > /tmp/private_run.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > /tmp/private_exit_code.txt
          echo "R37_PRIVATE_EXIT_RECORDED_${{ matrix.network }}_${{ matrix.shard_index }}"
      - name: Build fail-closed public gate and refresh hashes
        env:
          TARGET_NETWORK: ${{ matrix.network }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('r37_results'); root.mkdir(exist_ok=True)
          gate=root/'PUBLIC_GATE.json'
          code=int(Path('/tmp/private_exit_code.txt').read_text().strip())
          if gate.exists():
              data=json.loads(gate.read_text())
          else:
              data={
                'schema':'kiln-r37-public-gate-fallback-v1',
                'decision':'INCONCLUSIVE_EXECUTION_FAILURE',
                'submit_ready':False,
                'validated_critical':0,
                'validated_high':0,
                'network':os.environ['TARGET_NETWORK'],
                'shard_index':int(os.environ['SHARD_INDEX']),
                'shard_count':int(os.environ['SHARD_COUNT']),
                'selected_count':0,'inspected_count':0,'error_count':1,
                'candidate_count':0,
                'public_chain_state_changes':0,'transactions_signed':0,'transactions_sent':0,
              }
          data['runner_exit_code']=code
          if code != 0:
              data.update({
                'decision':'INCONCLUSIVE_EXECUTION_FAILURE',
                'submit_ready':False,
                'validated_critical':0,
                'validated_high':0,
              })
          gate.write_text(json.dumps(data,indent=2,sort_keys=True))
          files=sorted(p for p in root.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files
          ))
          PY
      - name: Triple self-check private and public evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('r37_results')
          gate=json.loads((root/'PUBLIC_GATE.json').read_text())
          assert gate['submit_ready'] is False
          assert int(gate['validated_critical']) == 0
          assert int(gate['validated_high']) == 0
          assert int(gate['public_chain_state_changes']) == 0
          assert int(gate['transactions_signed']) == 0
          assert int(gate['transactions_sent']) == 0
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          if (root/'EVIDENCE.json').exists():
              evidence=json.loads((root/'EVIDENCE.json').read_text())
              safety=evidence.get('safety',{})
              assert safety.get('read_only') is True
              assert safety.get('public_chain_state_changes') == 0
              assert safety.get('transactions_signed') == 0
              assert safety.get('transactions_sent') == 0
          print('R37_SELF_CHECK_1=PASS')
          print('R37_SELF_CHECK_2=PASS')
          print('R37_SELF_CHECK_3=PASS')
          PY
      - name: Encrypt complete evidence
        env:
          TARGET_NETWORK: ${{ matrix.network }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted_delivery public_delivery
          cp r37_results/PUBLIC_GATE.json public_delivery/
          cp r37_results/SHA256SUMS.txt public_delivery/
          tar -czf /tmp/private_payload.tar.gz r37_results /tmp/private_run.log /tmp/private_exit_code.txt kiln_r37/fee_invariant_census.py
          openssl rand 32 > /tmp/aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/private_payload.tar.gz -out encrypted_delivery/payload.aes256 -pass file:/tmp/aes.key
          openssl pkeyutl -encrypt -pubin -inkey kiln_r37/delivery_public.pem \
            -in /tmp/aes.key -out encrypted_delivery/key.rsa3072 \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted_delivery/payload.aes256 encrypted_delivery/key.rsa3072 > encrypted_delivery/SHA256SUMS.txt
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('encrypted_delivery/PUBLIC_MANIFEST.json').write_text(json.dumps({
            'schema':'kiln-r37-encrypted-delivery-v1',
            'network':os.environ['TARGET_NETWORK'],
            'shard_index':int(os.environ['SHARD_INDEX']),
            'shard_count':int(os.environ['SHARD_COUNT']),
            'runner_exit_code':int(Path('/tmp/private_exit_code.txt').read_text().strip()),
            'source_commit':'${{ github.sha }}',
            'plaintext_results_publicly_exposed':False,
            'public_chain_state_changes':0,
            'transactions_signed':0,
            'transactions_sent':0,
            'private_keys_loaded':0
          },indent=2,sort_keys=True))
          PY
          rm -rf r37_results
          rm -f /tmp/private_payload.tar.gz /tmp/private_run.log /tmp/private_exit_code.txt /tmp/aes.key
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r37-${{ matrix.network }}-${{ matrix.shard_index }}-encrypted
          path: encrypted_delivery
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-r37-${{ matrix.network }}-${{ matrix.shard_index }}-public-gate
          path: public_delivery
          if-no-files-found: error
          retention-days: 3


  persist:
    needs: census
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r37-fee-invariant-census-20260818
          fetch-depth: 1
      - name: Download all R37 public gates
        uses: actions/download-artifact@v4
        with:
          pattern: kiln-r37-*-public-gate
          path: /tmp/r37_public
      - name: Download all R37 encrypted evidence
        uses: actions/download-artifact@v4
        with:
          pattern: kiln-r37-*-encrypted
          path: /tmp/r37_encrypted
      - name: Aggregate, verify and create lossless encrypted export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r37_persisted_results/LATEST
          mkdir -p r37_persisted_results/LATEST/public_gates r37_persisted_results/LATEST/encrypted_b64
          python3 - <<'PY'
          import base64,hashlib,json,shutil,time
          from pathlib import Path
          public_root=Path('/tmp/r37_public')
          encrypted_root=Path('/tmp/r37_encrypted')
          out=Path('r37_persisted_results/LATEST')
          expected={
            ('ethereum',0,4),('ethereum',1,4),('ethereum',2,4),('ethereum',3,4),
            ('arbitrum',0,2),('arbitrum',1,2),('base',0,1),('bnb',0,1),
            ('polygon',0,1),('optimism',0,1),
          }
          rows=[]; integrity=[]; seen=set()
          for gate_path in sorted(public_root.rglob('PUBLIC_GATE.json')):
              raw=gate_path.read_bytes(); gate=json.loads(raw)
              key=(str(gate.get('network')),int(gate.get('shard_index',-1)),int(gate.get('shard_count',-1)))
              seen.add(key)
              sums_path=gate_path.with_name('SHA256SUMS.txt')
              manifest_ok=False
              if sums_path.exists():
                  for line in sums_path.read_text().splitlines():
                      parts=line.split('  ',1)
                      if len(parts)==2 and parts[1]=='PUBLIC_GATE.json':
                          manifest_ok=parts[0]==hashlib.sha256(raw).hexdigest()
                          break
              dest=out/'public_gates'/f'{key[0]}_{key[1]}'
              dest.mkdir(parents=True,exist_ok=True)
              shutil.copy2(gate_path,dest/'PUBLIC_GATE.json')
              if sums_path.exists(): shutil.copy2(sums_path,dest/'SHA256SUMS.txt')
              rows.append(gate)
              integrity.append({'key':list(key),'gate_sha256':hashlib.sha256(raw).hexdigest(),'manifest_ok':manifest_ok})
          encrypted_exports=[]
          for artifact_dir in sorted(p for p in encrypted_root.iterdir() if p.is_dir()):
              dest=out/'encrypted_b64'/artifact_dir.name
              dest.mkdir(parents=True,exist_ok=True)
              files=[]
              for src in sorted(artifact_dir.rglob('*')):
                  if not src.is_file(): continue
                  rel=src.relative_to(artifact_dir.as_posix()
                  raw=src.read_bytes()
                  encoded=base64.b64encode(raw)
                  target=dest/(rel.replace('/','__'+'.b64')
                  target.write_bytes(encoded+b'\n')
                  decoded=base64.b64decode(encoded,validate=True)
                  assert decoded==raw
                  files.append({'source':rel,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'roundtrip_ok':True,'b64_file':target.name})
              (dest/'ROUNDTRIP.json').write_text(json.dumps({'artifact':artifact_dir.name,'files':files},indent=2,sort_keys=True))
              encrypted_exports.append({'artifact':artifact_dir.name,'file_count':len(files),'all_roundtrip_ok':all(x['roundtrip_ok'] for x in files)})
          selected=sum(int(x.get('selected_count',0) or 0) for x in rows)
          inspected=sum(int(x.get('inspected_count',0) or 0) for x in rows)
          errors=sum(int(x.get('error_count',0) or 0) for x in rows)
          candidates=sum(int(x.get('candidate_count',0) or 0) for x in rows)
          exit_errors=sum(int(x.get('runner_exit_code',1) or 0)!=0 for x in rows)
          manifest_failures=sum(not x['manifest_ok'] for x in integrity)
          complete=(seen==expected and len(rows)==10 and selected==101 and inspected==101 and errors==0 and exit_errors==0 and manifest_failures==0 and len(encrypted_exports)==10)
          decision=('HOLD_PRIVATE_FEE_SIGNAL_REVIEW# if complete and candidates else ('KILL_NO_LIVE_FEE_INVARIANT_SIGNAL' if complete else 'INCONCLUSIVE_COVERAGE_OR_INTEGRITY_FAILURE'))
          aggregate={
            'schema':'kiln-r37-persisted-aggregate-v1',
            'generated_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'source_run_id':'${{ github.run_id }}',
            'source_commit':'${{ github.sha }}',
            'decision':decision,'submit_ready':False,'validated_critical':0,'validated_high':0,
            'coverage_complete':complete,'expected_shards':10,'public_gate_count':len(rows),
            'encrypted_export_count':len(encrypted_exports),'selected_total':selected,'inspected_total':inspected,
            'error_total':errors,'candidate_total':candidates,'runner_exit_error_count':exit_errors,
            'manifest_failure_count':manifest_failures,'seen_shards':[list(x) for x in sorted(seen)],
            'integrity':integrity,'encrypted_exports':encrypted_exports,'rows':rows,
            'safety':{'public_chain_state_changes':0,'transactions_signed':0,'transactions_sent':0,'private_keys_included':False}
          }
          (out/'AGGREGATE_PUBLIC.json').write_text(json.dumps(aggregate,indent=2,sort_keys=True))
          files=sorted(p for p in out.rglob('*') f p.is_file() and p.name!='SHA256SUMS.txt')
          (out/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out).as_posix()}\n' for p in files))
          assert aggregate['submit_ready'] is False
          assert aggregate['validated_critical']==0 and aggregate['validated_high']==0
          print(json.dumps(aggregate,sort_keys=True))
          PY
      - name: Commit recoverable R37 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r37_persisted_results/LATEST
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'persist recoverable Kiln R37 fee evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r37-fee-invariant-census-20260818
            if git push origin HEAD:agent/kiln-r37-fee-invariant-census-20260818; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
