name: kiln-r37b-fee-invariant-sequential

on:
  push:
    branches: [agent/kiln-r37b-fee-sequential-20260818]
    paths:
      - kiln_r37/run_all.py
      - kiln_r37/fee_invariant_census.py
      - kiln_r37/delivery_public.pem
      - .github/workflows/_temporary-kiln-r37b-fee-sequential-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r37b-fee-sequential-20260818
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Compile and preflight
        run: |
          set -euo pipefail
          python3 -m py_compile kiln_r37/fee_invariant_census.py kiln_r37/run_all.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          scope=json.loads(Path('r30_scope/SCOPE.json').read_text())
          assert len(scope['rows']) == 101
          source=Path('kiln_r37/fee_invariant_census.py').read_text()
          assert 'VAULT_SLOT+9' in source
          assert 'VAULT_SLOT+8' not in source
          print('R37B_PREFLIGHT=PASS')
          PY
      - name: Run exact-block read-only census and persist encrypted evidence
        run: python3 kiln_r37/run_all.py | tee r37b_run.log
      - name: Triple final self-check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('r37b_persisted/LATEST')
          gate=json.loads((root/'AGGREGATE_PUBLIC.json').read_text())
          assert gate['submit_ready'] is False
          assert gate['validated_critical'] == gate['validated_high'] == 0
          assert gate['public_gate_count'] == 10
          assert gate['encrypted_export_count'] == 10
          for _ in range(3):
              for line in (root/'SHA256SUMS.txt').read_text().splitlines():
                  digest,name=line.split('  ',1)
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          assert not any(b'BEGIN PRIVATE KEY' in p.read_bytes() for p in root.rglob('*') if p.is_file())
          print('R37B_FINAL_SELF_CHECK_1=PASS')
          print('R37B_FINAL_SELF_CHECK_2=PASS')
          print('R37B_FINAL_SELF_CHECK_3=PASS')
          PY
      - name: Commit recoverable result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r37b_persisted/LATEST
          git commit -m 'persist self-checked Kiln R37b fee census result'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r37b-fee-sequential-20260818
            if git push origin HEAD:agent/kiln-r37b-fee-sequential-20260818; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
