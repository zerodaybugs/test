name: kiln-r37c-fee-candidate-summary

on:
  push:
    branches: [agent/kiln-r37b-fee-sequential-20260818]
    paths:
      - kiln_r37/summarize_candidates.py
      - .github/workflows/_temporary-kiln-r37c-candidate-summary-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r37b-fee-sequential-20260818
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Compile and preflight
        run: |
          set -euo pipefail
          python3 -m py_compile kiln_r37/fee_invariant_census.py kiln_r37/summarize_candidates.py
          grep -q 'VAULT_SLOT+9' kiln_r37/fee_invariant_census.py
          ! grep -q 'VAULT_SLOT+8' kiln_r37/fee_invariant_census.py
      - name: Reproduce and summarize candidate shards
        run: python3 kiln_r37/summarize_candidates.py | tee r37c_run.log
      - name: Triple verify summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('r37c_candidate_summary')
          gate=json.loads((root/'PUBLIC_GATE.json').read_text())
          summary=json.loads((root/'CANDIDATE_SUMMARY.json').read_text())
          assert gate['submit_ready'] is False
          assert gate['validated_critical'] == gate['validated_high'] == 0
          assert summary['submit_ready'] is False
          assert summary['safety']['public_chain_state_changes'] == 0
          assert summary['safety']['transactions_signed'] == 0
          assert summary['safety']['transactions_sent'] == 0
          for _ in range(3):
              for line in (root/'SHA256SUMS.txt').read_text().splitlines():
                  digest,name=line.split('  ',1)
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          print('R37C_FINAL_VERIFY_1=PASS')
          print('R37C_FINAL_VERIFY_2=PASS')
          print('R37C_FINAL_VERIFY_3=PASS')
          PY
      - name: Commit summary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r37c_candidate_summary
          git commit -m 'persist Kiln R37c fee candidate summary'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r37b-fee-sequential-20260818
            if git push origin HEAD:agent/kiln-r37b-fee-sequential-20260818; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
