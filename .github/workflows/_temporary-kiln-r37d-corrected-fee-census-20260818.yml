name: kiln-r37d-corrected-fee-census

on:
  push:
    branches: [agent/kiln-r37b-fee-sequential-20260818]
    paths:
      - kiln_r37/fee_invariant_census_v2.py
      - kiln_r37/run_all_v2.py
      - .github/workflows/_temporary-kiln-r37d-corrected-fee-census-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kiln-r37b-fee-sequential-20260818
          fetch-depth: 1
      - name: Install pinned runtime
        run: python3 -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Compile and verify correction
        run: |
          set -euo pipefail
          python3 -m py_compile kiln_r37/fee_invariant_census.py kiln_r37/fee_invariant_census_v2.py kiln_r37/run_all.py kiln_r37/run_all_v2.py
          grep -q 'not total_assets.get("ok")' kiln_r37/fee_invariant_census_v2.py
          grep -q 'r37d_persisted/LATEST' kiln_r37/run_all_v2.py
      - name: Run corrected 101-vault census
        run: python3 kiln_r37/run_all_v2.py | tee r37d_run.log
      - name: Triple final verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('r37d_persisted/LATEST')
          gate=json.loads((root/'AGGREGATE_PUBLIC.json').read_text())
          assert gate['coverage_complete'] is True
          assert gate['selected_total'] == 101
          assert gate['inspected_total'] == 101
          assert gate['error_total'] == 0
          assert gate['runner_exit_error_count'] == 0
          assert gate['public_gate_count'] == 10
          assert gate['encrypted_export_count'] == 10
          assert gate['submit_ready'] is False
          assert gate['validated_critical'] == gate['validated_high'] == 0
          for _ in range(3):
              for line in (root/'SHA256SUMS.txt').read_text().splitlines():
                  digest,name=line.split('  ',1)
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          assert not any(b'BEGIN PRIVATE KEY' in p.read_bytes() for p in root.rglob('*') if p.is_file())
          print('R37D_FINAL_VERIFY_1=PASS')
          print('R37D_FINAL_VERIFY_2=PASS')
          print('R37D_FINAL_VERIFY_3=PASS')
          PY
      - name: Commit corrected result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r37d_persisted/LATEST
          git commit -m 'persist corrected Kiln R37d fee census result'
          for attempt in 1 2 3; do
            git pull --rebase origin agent/kiln-r37b-fee-sequential-20260818
            if git push origin HEAD:agent/kiln-r37b-fee-sequential-20260818; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
