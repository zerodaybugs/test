name: kiln-r42-live-config-delta

on:
  push:
    branches:
      - agent/kiln-r42-live-config-delta-20260818
    paths:
      - kiln_r42/**
      - .github/workflows/_temporary-kiln-r42-live-config-delta-20260818.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiln-r42-live-config-delta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and enforce safety boundary
        run: |
          set -euo pipefail
          python -m py_compile kiln_r42/live_config_delta.py
          python - <<'PY'
          from pathlib import Path
          source = Path('kiln_r42/live_config_delta.py').read_text()
          prohibited = [
              'eth_sendTransaction', 'eth_sendRawTransaction',
              'personal_sign', 'eth_signTransaction',
          ]
          hits = [item for item in prohibited if item in source]
          assert not hits, hits
          assert 'transactions_sent": 0' in source
          assert 'public_chain_state_changes": 0' in source
          print('R42_SAFETY_STATIC_GATE=PASS')
          PY

      - name: Run exact-block two-RPC live configuration census
        id: census
        shell: bash
        run: |
          set +e
          rm -rf r42_results
          mkdir -p r42_results
          python kiln_r42/live_config_delta.py > >(tee r42_results/RUN.stdout.log) 2> >(tee r42_results/RUN.stderr.log >&2)
          code=$?
          printf '%s\n' "$code" > r42_results/RUNNER_EXIT_CODE.txt
          exit 0

      - name: Create fail-closed gate when runner did not produce one
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('r42_results')
          out.mkdir(exist_ok=True)
          exit_path = out / 'RUNNER_EXIT_CODE.txt'
          try:
              exit_code = int(exit_path.read_text().strip())
          except Exception:
              exit_code = 255
          gate_path = out / 'PUBLIC_GATE.json'
          if not gate_path.exists():
              gate = {
                  'schema': 'kiln-omnivault-r42-public-gate-v1',
                  'decision': 'INCONCLUSIVE_RUNNER_FAILED_BEFORE_GATE',
                  'submit_ready': False,
                  'validated_critical': 0,
                  'validated_high': 0,
                  'coverage_complete': False,
                  'scope_count': 0,
                  'inspected_count': 0,
                  'chain_count': 0,
                  'error_count': 1,
                  'quorum_mismatch_count': 0,
                  'inventory_trigger_count': 0,
                  'research_candidate_count': 0,
                  'duplicate_or_known_signal_count': 0,
                  'runner_exit_code': exit_code,
                  'public_chain_state_changes': 0,
                  'transactions_signed': 0,
                  'transactions_sent': 0,
              }
              gate_path.write_text(json.dumps(gate, indent=2, sort_keys=True))
          gate = json.loads(gate_path.read_text())
          gate['runner_exit_code'] = exit_code
          gate_path.write_text(json.dumps(gate, indent=2, sort_keys=True))
          PY

      - name: Validate public gate and regenerate checksums
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          out = Path('r42_results')
          gate = json.loads((out / 'PUBLIC_GATE.json').read_text())
          assert gate.get('submit_ready') is False
          assert int(gate.get('validated_critical', 0)) == 0
          assert int(gate.get('validated_high', 0)) == 0
          assert int(gate.get('public_chain_state_changes', 0)) == 0
          assert int(gate.get('transactions_signed', 0)) == 0
          assert int(gate.get('transactions_sent', 0)) == 0
          files = sorted(p for p in out.iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
          (out / 'SHA256SUMS.txt').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in files
          ))
          print(json.dumps(gate, sort_keys=True))
          PY
          sha256sum r42_results/PUBLIC_GATE.json r42_results/SHA256SUMS.txt

      - name: Encrypt full evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r42_encrypted
          mkdir -p r42_encrypted
          tar -czf /tmp/r42-evidence.tar.gz r42_results
          openssl rand -hex 32 > /tmp/r42-passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/r42-evidence.tar.gz \
            -out r42_encrypted/payload.aes256 \
            -pass file:/tmp/r42-passphrase.txt
          openssl pkeyutl -encrypt -pubin \
            -inkey kiln_r42/evidence_public.pem \
            -in /tmp/r42-passphrase.txt \
            -out r42_encrypted/key.rsa3072 \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          cp kiln_r42/evidence_public.pem r42_encrypted/evidence_public.pem
          cat > r42_encrypted/README.txt <<'EOF'
          Kiln OmniVault R42 encrypted research evidence.
          AES-256-CBC, PBKDF2 250000 iterations.
          AES passphrase wrapped with RSA-3072 OAEP SHA-256.
          Public-chain writes, signatures, and broadcasts: zero.
          EOF
          sha256sum r42_encrypted/* > r42_encrypted/SHA256SUMS.txt
          (cd r42_encrypted && zip -q -9 ../kiln-r42-encrypted-evidence.zip ./*)
          sha256sum kiln-r42-encrypted-evidence.zip > kiln-r42-encrypted-evidence.zip.sha256
          rm -f /tmp/r42-passphrase.txt /tmp/r42-evidence.tar.gz

      - name: Upload sanitized public gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-r42-public-gate
          path: |
            r42_results/PUBLIC_GATE.json
            r42_results/RUNNER_EXIT_CODE.txt
            r42_results/RUN.stdout.log
            r42_results/RUN.stderr.log
            r42_results/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-r42-encrypted-evidence
          path: |
            kiln-r42-encrypted-evidence.zip
            kiln-r42-encrypted-evidence.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Preserve fail-closed runner status
        if: always()
        shell: bash
        run: |
          code=$(cat r42_results/RUNNER_EXIT_CODE.txt 2>/dev/null || echo 255)
          exit "$code"
