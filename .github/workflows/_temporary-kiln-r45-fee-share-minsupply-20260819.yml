name: kiln-r45-fee-share-minsupply-liveness

on:
  pull_request:
    branches:
      - agent/kiln-r45-fee-share-minsupply-liveness-20260819
    paths:
      - kiln_r45/**
      - .github/workflows/_temporary-kiln-r45-fee-share-minsupply-20260819.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiln-r45-fee-share-minsupply-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  r45-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install narrow dependencies
        run: python -m pip install --disable-pip-version-check pycryptodome

      - name: Compile and enforce read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile kiln_r45/fee_share_liveness.py
          python - <<'PY'
          from pathlib import Path
          source = Path('kiln_r45/fee_share_liveness.py').read_text()
          prohibited = [
              'eth_sendTransaction', 'eth_sendRawTransaction', 'personal_sign',
              'eth_signTransaction', 'eth_sign', 'cast send', 'forge script --broadcast'
          ]
          hits = [item for item in prohibited if item in source]
          assert not hits, hits
          print('R45_STATIC_SAFETY_GATE=PASS')
          PY

      - name: Fetch current source mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r45_source
          git clone --depth 1 https://github.com/dumebi042/kiln-vault.git r45_source
          git -C r45_source rev-parse HEAD > r45_source/EXACT_HEAD.txt

      - name: Run exact-block two-RPC R45 gate
        shell: bash
        run: |
          set +e
          rm -rf r45_results
          python kiln_r45/fee_share_liveness.py > r45_run.stdout.log 2> r45_run.stderr.log
          code=$?
          printf '%s\n' "$code" > R45_EXIT_CODE.txt
          cat r45_run.stdout.log
          cat r45_run.stderr.log >&2
          exit 0

      - name: Fail closed and regenerate checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r45_results
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out = Path('r45_results')
          try:
              exit_code = int(Path('R45_EXIT_CODE.txt').read_text().strip())
          except Exception:
              exit_code = 255
          gate_path = out / 'PUBLIC_GATE.json'
          if gate_path.exists():
              gate = json.loads(gate_path.read_text())
          else:
              gate = {
                  'schema': 'kiln-omnivault-r45-fee-share-minsupply-public-gate-v1',
                  'decision': 'INCONCLUSIVE_R45_RUNNER_FAILED_BEFORE_GATE',
                  'submit_ready': False,
                  'validated_critical': 0,
                  'validated_high': 0,
                  'scope_count': 0,
                  'inspected_count': 0,
                  'coverage_complete': False,
                  'error_count': 1,
                  'structural_candidate_count': 0,
                  'material_candidate_count': 0,
                  'public_chain_state_changes': 0,
                  'transactions_signed': 0,
                  'transactions_sent': 0,
              }
          gate['runner_exit_code'] = exit_code
          assert gate.get('submit_ready') is False
          assert int(gate.get('validated_critical', 0)) == 0
          assert int(gate.get('validated_high', 0)) == 0
          assert int(gate.get('public_chain_state_changes', 0)) == 0
          assert int(gate.get('transactions_signed', 0)) == 0
          assert int(gate.get('transactions_sent', 0)) == 0
          gate_path.write_text(json.dumps(gate, indent=2, sort_keys=True))
          files = sorted(path for path in out.iterdir() if path.is_file() and path.name != 'SHA256SUMS.txt')
          (out / 'SHA256SUMS.txt').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files
          ))
          print(json.dumps(gate, sort_keys=True))
          PY

      - name: Package and self-test evidence three times
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f kiln-r45-public-evidence.zip kiln-r45-public-evidence.zip.sha256
          (cd r45_results && zip -q -9 ../kiln-r45-public-evidence.zip ./*)
          sha256sum kiln-r45-public-evidence.zip > kiln-r45-public-evidence.zip.sha256
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          archive = Path('kiln-r45-public-evidence.zip')
          rows = []
          for index in range(3):
              with zipfile.ZipFile(archive) as zf:
                  rows.append({'round': index + 1, 'crc_error': zf.testzip(), 'entries': len(zf.namelist())})
          assert all(row['crc_error'] is None for row in rows), rows
          Path('R45_ZIP_SELF_TEST.json').write_text(json.dumps({
              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'rounds': rows,
              'all_pass': True,
          }, indent=2, sort_keys=True))
          PY
          unzip -t kiln-r45-public-evidence.zip >/tmp/r45-unzip-1.log
          unzip -t kiln-r45-public-evidence.zip >/tmp/r45-unzip-2.log
          unzip -t kiln-r45-public-evidence.zip >/tmp/r45-unzip-3.log

      - name: Persist sanitized result on the PR head branch
        if: always()
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf kiln_r45_persist
          mkdir -p kiln_r45_persist
          cp r45_results/PUBLIC_GATE.json kiln_r45_persist/PUBLIC_GATE.json
          cp r45_results/SHA256SUMS.txt kiln_r45_persist/R45_RESULTS_SHA256SUMS.txt
          cp kiln-r45-public-evidence.zip kiln_r45_persist/kiln-r45-public-evidence.zip
          cp kiln-r45-public-evidence.zip.sha256 kiln_r45_persist/kiln-r45-public-evidence.zip.sha256
          cp R45_ZIP_SELF_TEST.json kiln_r45_persist/R45_ZIP_SELF_TEST.json
          cp R45_EXIT_CODE.txt kiln_r45_persist/R45_EXIT_CODE.txt
          cp r45_source/EXACT_HEAD.txt kiln_r45_persist/SOURCE_EXACT_HEAD.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kiln_r45_persist
          if git diff --cached --quiet; then
            echo 'No persisted changes'
            exit 0
          fi
          git commit -m 'kiln: persist R45 sanitized gate and evidence [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Preserve fail-closed result
        if: always()
        shell: bash
        run: |
          code=$(cat R45_EXIT_CODE.txt 2>/dev/null || echo 255)
          exit "$code"
