name: kiln-r45v3-sharded-live-invariant

on:
  pull_request:
    branches:
      - agent/kiln-r45-sharded-live-invariant-v3-20260819
    paths:
      - kiln_r45/**
      - R45V3_TRIGGER.txt
      - .github/workflows/_temporary-kiln-r45v3-sharded-live-invariant-20260819.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiln-r45v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and enforce read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile kiln_r42/live_config_delta.py kiln_r45/run_network.py kiln_r45/run_network_v3.py kiln_r45/aggregate_v3.py
          python - <<'PY'
          from pathlib import Path
          prohibited = ['eth_sendTransaction','eth_sendRawTransaction','personal_sign','eth_signTransaction','eth_sendBundle','eth_sendUserOperation']
          for name in ('kiln_r42/live_config_delta.py','kiln_r45/run_network.py','kiln_r45/run_network_v3.py'):
              source = Path(name).read_text()
              hits = [item for item in prohibited if item in source]
              assert not hits, (name, hits)
          print('R45V3_STATIC_SAFETY_GATE=PASS')
          PY
          openssl pkey -pubin -in kiln_r45/evidence_public.pem -text -noout >/dev/null

  network-census:
    needs: static-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        network: [ethereum, optimism, bnb, polygon, base, arbitrum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run corrected isolated exact-block census
        shell: bash
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          set +e
          rm -rf "r45_results/${NETWORK}"
          mkdir -p "r45_results/${NETWORK}"
          python kiln_r45/run_network_v3.py --network "${NETWORK}" > >(tee "r45_results/${NETWORK}/RUN.stdout.log") 2> >(tee "r45_results/${NETWORK}/RUN.stderr.log" >&2)
          code=$?
          printf '%s\n' "$code" > "r45_results/${NETWORK}/RUNNER_EXIT_CODE.txt"
          exit 0
      - name: Harden fail-closed gate and sanitize candidate metadata
        if: always()
        shell: bash
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          network = os.environ['NETWORK']
          out = Path('r45_results') / network
          out.mkdir(parents=True, exist_ok=True)
          try: code = int((out/'RUNNER_EXIT_CODE.txt').read_text().strip())
          except Exception: code = 255
          gate_path = out/'PUBLIC_GATE.json'
          if gate_path.exists(): gate = json.loads(gate_path.read_text())
          else:
              gate = {'schema':'kiln-r45v3-network-public-gate-fallback-v1','network':network,'decision':'INCONCLUSIVE_RUNNER_FAILED_BEFORE_GATE','coverage_complete':False,'selected_count':0,'inspected_count':0,'base_error_count':1,'base_quorum_mismatch_count':0,'extension_quorum_mismatch_count':0,'candidate_count':0,'inventory_trigger_count':0,'known_or_duplicate_signal_count':0,'candidate_kinds':{}}
          gate.update({'network':network,'runner_exit_code':code,'submit_ready':False,'validated_critical':0,'validated_high':0,'public_chain_state_changes':0,'transactions_signed':0,'transactions_sent':0})
          if code != 0:
              gate['coverage_complete'] = False
              if not str(gate.get('decision','')).startswith('INCONCLUSIVE'): gate['decision']='INCONCLUSIVE_NONZERO_RUNNER_EXIT'
          gate_path.write_text(json.dumps(gate,indent=2,sort_keys=True))
          source_path=out/'CANDIDATE_SUMMARY.json'
          source=json.loads(source_path.read_text()) if source_path.exists() else {}
          candidate_rows=[]
          for key in ('candidates','research_candidates','extension_candidates','base_research_candidates'):
              value=source.get(key)
              if isinstance(value,list): candidate_rows.extend(row for row in value if isinstance(row,dict))
          allowed={'network','label','vault','kind','severity_ceiling','block','connector_name','connector','reason','strategy','human','idle_excess_raw','idle_excess_human','reward_fee_raw'}
          sanitized=[]; seen=set()
          for row in candidate_rows:
              item={key:row.get(key) for key in allowed if key in row}; item.setdefault('network',network)
              identity=json.dumps(item,sort_keys=True,default=str)
              if identity not in seen: seen.add(identity); sanitized.append(item)
          (out/'CANDIDATE_PUBLIC.json').write_text(json.dumps({'network':network,'candidates':sanitized},indent=2,sort_keys=True))
          if not (out/'EVIDENCE.json').exists(): (out/'EVIDENCE.json').write_text(json.dumps({'gate':gate,'runner_failed_before_evidence':True},indent=2,sort_keys=True))
          if not source_path.exists(): source_path.write_text(json.dumps({'network':network,'candidates':[],'submit_ready':False},indent=2,sort_keys=True))
          files=sorted(path for path in out.iterdir() if path.is_file() and path.name!='SHA256SUMS.txt')
          (out/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files))
          assert gate['submit_ready'] is False and int(gate['validated_critical'])==0 and int(gate['validated_high'])==0
          assert int(gate['public_chain_state_changes'])==0 and int(gate['transactions_signed'])==0 and int(gate['transactions_sent'])==0
          print(json.dumps(gate,sort_keys=True))
          PY
      - name: Encrypt evidence and repeatedly test package
        if: always()
        shell: bash
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          set -euo pipefail
          rm -rf "r45_package/${NETWORK}"; mkdir -p "r45_package/${NETWORK}/encrypted"
          cp "r45_results/${NETWORK}/PUBLIC_GATE.json" "r45_package/${NETWORK}/PUBLIC_GATE.json"
          cp "r45_results/${NETWORK}/CANDIDATE_PUBLIC.json" "r45_package/${NETWORK}/CANDIDATE_PUBLIC.json"
          cp "r45_results/${NETWORK}/RUNNER_EXIT_CODE.txt" "r45_package/${NETWORK}/RUNNER_EXIT_CODE.txt"
          cp kiln_r45/evidence_public.pem "r45_package/${NETWORK}/encrypted/evidence_public.pem"
          tar -czf "/tmp/r45v3-${NETWORK}.tar.gz" -C "r45_results/${NETWORK}" .
          openssl rand -hex 32 > "/tmp/r45v3-${NETWORK}.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in "/tmp/r45v3-${NETWORK}.tar.gz" -out "r45_package/${NETWORK}/encrypted/payload.aes256" -pass file:"/tmp/r45v3-${NETWORK}.pass"
          openssl pkeyutl -encrypt -pubin -inkey kiln_r45/evidence_public.pem -in "/tmp/r45v3-${NETWORK}.pass" -out "r45_package/${NETWORK}/encrypted/key.rsa3072" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          printf '%s\n' 'AES-256-CBC/PBKDF2-250000; RSA-3072 OAEP SHA-256.' > "r45_package/${NETWORK}/encrypted/README.txt"
          (cd "r45_package/${NETWORK}/encrypted" && sha256sum evidence_public.pem payload.aes256 key.rsa3072 README.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          (cd "r45_package/${NETWORK}" && sha256sum PUBLIC_GATE.json CANDIDATE_PUBLIC.json RUNNER_EXIT_CODE.txt encrypted/* > PACKAGE_SHA256SUMS.txt && zip -q -9 "../${NETWORK}-network-package.zip" PUBLIC_GATE.json CANDIDATE_PUBLIC.json RUNNER_EXIT_CODE.txt PACKAGE_SHA256SUMS.txt encrypted/*)
          for n in 1 2 3 4; do unzip -t "r45_package/${NETWORK}-network-package.zip" >/dev/null; done
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          p=Path('r45_package')/f"{os.environ['NETWORK']}-network-package.zip"
          for _ in range(4):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  names=z.namelist(); assert len(names)==len(set(names))
          PY
          rm -f "/tmp/r45v3-${NETWORK}.pass" "/tmp/r45v3-${NETWORK}.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r45v3-network-${{ matrix.network }}
          path: |
            r45_package/${{ matrix.network }}
            r45_package/${{ matrix.network }}-network-package.zip
          if-no-files-found: error
          retention-days: 3
      - name: Preserve fail-closed result
        if: always()
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          code=$(cat "r45_results/${NETWORK}/RUNNER_EXIT_CODE.txt" 2>/dev/null || echo 255)
          exit "$code"

  aggregate:
    needs: network-census
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: kiln-r45v3-network-*
          path: r45_downloads
          merge-multiple: false
      - name: Build strict aggregate gate
        shell: bash
        run: |
          set +e
          mkdir -p r45_aggregate_v3
          python kiln_r45/aggregate_v3.py r45_downloads | tee r45_aggregate_v3/RUN.log
          code=${PIPESTATUS[0]}; printf '%s\n' "$code" > r45_aggregate_v3/RUNNER_EXIT_CODE.txt
          exit 0
      - name: Build and repeatedly verify final research archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r45_final_v3 r45_extract_a r45_extract_b; mkdir -p r45_final_v3/public r45_final_v3/network_packages
          cp r45_aggregate_v3/PUBLIC_GATE.json r45_final_v3/public/PUBLIC_GATE.json
          cp r45_aggregate_v3/CANDIDATE_PUBLIC_AGGREGATE.json r45_final_v3/public/CANDIDATE_PUBLIC_AGGREGATE.json
          cp r45_aggregate_v3/SHA256SUMS.txt r45_final_v3/public/AGGREGATE_SHA256SUMS.txt
          find r45_downloads -type f -name '*-network-package.zip' -exec cp {} r45_final_v3/network_packages/ \;
          printf '%s\n' 'Research checkpoint only. NOT FOR SUBMISSION.' > r45_final_v3/00_READ_ME_FIRST.txt
          (cd r45_final_v3 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find r45_final_v3 -type f -exec touch -t 202608190000 {} +
          (cd r45_final_v3 && find . -type f -print | LC_ALL=C sort | zip -X -q -9 ../kiln-r45v3-research-checkpoint.zip -@)
          for n in 1 2 3 4 5; do unzip -t kiln-r45v3-research-checkpoint.zip >/dev/null; done
          python - <<'PY'
          import hashlib,shutil,zipfile
          from pathlib import Path
          z=Path('kiln-r45v3-research-checkpoint.zip')
          for _ in range(5):
              with zipfile.ZipFile(z) as a:
                  assert a.testzip() is None
                  names=a.namelist(); assert len(names)==len(set(names))
          for d in (Path('r45_extract_a'),Path('r45_extract_b')):
              shutil.rmtree(d,ignore_errors=True); d.mkdir()
              with zipfile.ZipFile(z) as a: a.extractall(d)
          def h(root): return [(p.relative_to(root).as_posix(),hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.rglob('*')) if p.is_file()]
          assert h(Path('r45_extract_a'))==h(Path('r45_extract_b'))
          PY
          sha256sum kiln-r45v3-research-checkpoint.zip > kiln-r45v3-research-checkpoint.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-r45v3-aggregate
          path: |
            r45_aggregate_v3
            kiln-r45v3-research-checkpoint.zip
            kiln-r45v3-research-checkpoint.zip.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Preserve aggregate fail-closed status
        if: always()
        run: |
          code=$(cat r45_aggregate_v3/RUNNER_EXIT_CODE.txt 2>/dev/null || echo 255)
          exit "$code"
