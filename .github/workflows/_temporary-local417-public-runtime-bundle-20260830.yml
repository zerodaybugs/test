name: _temporary LOCAL417 public runtime bundle

on:
  push:
    branches:
      - local417-public-runtime-bundle-20260830
    paths:
      - '.github/workflows/_temporary-local417-public-runtime-bundle-20260830.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local417-public-runtime-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download and cryptographically verify public runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p bundle

          wine_url='https://github.com/Kron4ek/Wine-Builds/releases/download/11.16/wine-11.16-amd64-wow64.tar.xz'
          wine_file='bundle/wine-11.16-amd64-wow64.tar.xz'
          wine_sha256='63d5e45a4843930ca7512cc1c0bd34e6d4093dc392d96a1752545dea289feaf4'

          dotnet_url='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.400/dotnet-sdk-10.0.400-win-x64.zip'
          dotnet_file='bundle/dotnet-sdk-10.0.400-win-x64.zip'
          dotnet_sha512='9b8b88590e4da131bfd0da7aa089d0fc04d5418d5f8607ec13d55dc5a17b4399afd54d496c12657fa05c6c6546dc5eab930f26ac6c50f2d3a7712c0fb378c366'

          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 --output "$wine_file" "$wine_url"
          printf '%s  %s\n' "$wine_sha256" "$wine_file" | sha256sum --check --strict

          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 --output "$dotnet_file" "$dotnet_url"
          printf '%s  %s\n' "$dotnet_sha512" "$dotnet_file" | sha512sum --check --strict

          test "$(stat -c '%s' "$wine_file")" -gt 50000000
          test "$(stat -c '%s' "$dotnet_file")" -gt 100000000

          cat > bundle/MANIFEST.json <<JSON
          {
            "schema": "local417-public-runtime-bundle/v1",
            "created_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "contains_candidate_or_poc": false,
            "files": [
              {
                "name": "wine-11.16-amd64-wow64.tar.xz",
                "source": "${wine_url}",
                "sha256": "${wine_sha256}",
                "bytes": $(stat -c '%s' "$wine_file")
              },
              {
                "name": "dotnet-sdk-10.0.400-win-x64.zip",
                "source": "${dotnet_url}",
                "sha512": "${dotnet_sha512}",
                "bytes": $(stat -c '%s' "$dotnet_file")
              }
            ]
          }
          JSON
          sha256sum bundle/* | sort > bundle/SHA256SUMS.txt
          sha512sum bundle/* | sort > bundle/SHA512SUMS.txt

      - name: Upload verified runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local417-public-runtime-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
