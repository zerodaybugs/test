name: Temporary Markdig 1.2.0 Export

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-markdig-1-2-0-export-20260815.yml

permissions:
  contents: read

concurrency:
  group: temporary-markdig-1-2-0-export-20260815
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: false

      - name: Restore exact Markdig package and stage immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/export
          cd work
          dotnet new console --framework net10.0 --no-restore
          dotnet add package Markdig --version 1.2.0
          dotnet restore --locked-mode || dotnet restore

          PKG="$HOME/.nuget/packages/markdig/1.2.0"
          test -d "$PKG"
          cp -a "$PKG" export/markdig-1.2.0
          dotnet --info > export/DOTNET_INFO.txt
          dotnet list package --include-transitive > export/PACKAGES.txt
          (
            cd export
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload exact package snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markdig-1.2.0-package-snapshot
          path: work/export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
