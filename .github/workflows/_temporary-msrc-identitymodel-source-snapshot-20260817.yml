name: Temporary MSRC IdentityModel source snapshot

on:
  push:
    branches:
      - msrc-identitymodel-source-20260817
    paths:
      - .github/workflows/_temporary-msrc-identitymodel-source-snapshot-20260817.yml

permissions:
  contents: read

concurrency:
  group: temporary-msrc-identitymodel-source-snapshot-20260817
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact stable IdentityModel release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
          ref: 8.22.0
          fetch-depth: 1
          persist-credentials: false
          path: identitymodel-8.22.0

      - name: Check out current development branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
          ref: dev
          fetch-depth: 1
          persist-credentials: false
          path: identitymodel-dev

      - name: Build source provenance archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C identitymodel-8.22.0 rev-parse HEAD | tee evidence/STABLE_COMMIT.txt
          git -C identitymodel-dev rev-parse HEAD | tee evidence/DEV_COMMIT.txt
          git -C identitymodel-8.22.0 log -1 --format='%cI%n%s' > evidence/STABLE_HEAD.txt
          git -C identitymodel-dev log -1 --format='%cI%n%s' > evidence/DEV_HEAD.txt
          git -C identitymodel-8.22.0 status --porcelain=v1 > evidence/STABLE_STATUS.txt
          git -C identitymodel-dev status --porcelain=v1 > evidence/DEV_STATUS.txt
          test ! -s evidence/STABLE_STATUS.txt
          test ! -s evidence/DEV_STATUS.txt
          tar --exclude='.git' -czf evidence/identitymodel-8.22.0-source.tar.gz identitymodel-8.22.0
          tar --exclude='.git' -czf evidence/identitymodel-dev-source.tar.gz identitymodel-dev
          sha256sum evidence/identitymodel-8.22.0-source.tar.gz evidence/identitymodel-dev-source.tar.gz > evidence/SHA256SUMS.txt
          cat > evidence/STATUS.env <<'EOF'
          STABLE_TAG=8.22.0
          SNAPSHOT_COMPLETE=1
          SUBMISSION_READY=0
          EOF

      - name: Upload source snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msrc-identitymodel-source-snapshots-20260817
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
