name: temporary-msrc-negotiate-inventory-v2

on:
  push:
    branches: [msrc-negotiate-20260816]
    paths:
      - .github/workflows/_temporary-msrc-negotiate-inventory-v2-20260816.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: msrc-negotiate-20260816
          fetch-depth: 1

      - name: Clone exact ASP.NET Core release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aspnetcore .ci/negotiate-v2
          mkdir -p .ci/negotiate-v2
          git clone --filter=blob:none --depth=1 --branch v10.0.10 \
            https://github.com/dotnet/aspnetcore.git /tmp/aspnetcore \
            || git clone --filter=blob:none --depth=1 --branch release/10.0 \
            https://github.com/dotnet/aspnetcore.git /tmp/aspnetcore
          git -C /tmp/aspnetcore rev-parse HEAD > .ci/negotiate-v2/source-commit.txt
          find /tmp/aspnetcore/src/Security/Authentication/Negotiate -type f \
            \( -name '*.cs' -o -name '*.csproj' \) -print | sort \
            > .ci/negotiate-v2/file-list.txt
          while IFS= read -r p; do
            rel="${p#/tmp/aspnetcore/}"
            case "$rel" in
              *Ldap*|*NegotiateOptions*|*PostConfigure*|*.csproj)
                mkdir -p ".ci/negotiate-v2/$(dirname "$rel")"
                cp "$p" ".ci/negotiate-v2/$rel"
                ;;
            esac
          done < .ci/negotiate-v2/file-list.txt
          grep -RInE 'class LdapAdapter|groupType|tokenGroups|memberOf|IgnoreNestedGroups|ClaimTypes.Role|new Claim|SearchRequest|SearchResponse' \
            /tmp/aspnetcore/src/Security/Authentication/Negotiate \
            > .ci/negotiate-v2/security-map.txt || true

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .ci/negotiate-v2
          git commit -m 'research: exact Negotiate LDAP source inventory v2'
          git push origin HEAD:msrc-negotiate-20260816
