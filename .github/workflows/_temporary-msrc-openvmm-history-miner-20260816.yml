name: Private MSRC OpenVMM fix-history miner

on:
  push:
    branches:
      - agent/msrc-openvmm-round-next-20260816

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone OpenVMM history
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-single-branch https://github.com/microsoft/openvmm.git openvmm
          cd openvmm
          git checkout --detach 61fd38fe6114d0955a082aa717a8e16e722b8490

      - name: Generate history corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cd openvmm
          git log -1500 --date=iso-strict --format='%H%x09%ad%x09%s' > ../artifact/COMMITS.tsv
          git log -1500 --date=iso-strict --format='COMMIT %H%nDATE %ad%nSUBJECT %s%nBODY%n%b%nFILES' --name-status > ../artifact/COMMITS_WITH_FILES.txt
          git log -1500 --regexp-ignore-case \
            --grep='security\|permission\|protect\|overflow\|underflow\|race\|stale\|use.after\|out.of.bounds\|panic\|crash\|pin\|mapping\|validate\|sanitize\|guest\|VTL\|DMA\|GPADL\|hypercall\|emulat\|rollback\|reset' \
            --date=iso-strict --format='COMMIT %H%nDATE %ad%nSUBJECT %s%nBODY%n%b%nFILES' --name-status \
            > ../artifact/SECURITY_RELEVANT_HISTORY.txt
          git log -500 -p --regexp-ignore-case \
            --grep='permission\|protect\|overflow\|underflow\|race\|stale\|out.of.bounds\|pin\|mapping\|VTL\|DMA\|GPADL\|hypercall\|emulat\|rollback\|reset' \
            > ../artifact/SECURITY_PATCHES.diff
          cd ..
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload history corpus
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-fix-history-corpus
          path: artifact/
          if-no-files-found: error
          retention-days: 1
