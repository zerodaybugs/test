name: Private MSRC OpenVMM exact-source bundle

on:
  push:
    branches:
      - agent/msrc-openvmm-round-next-20260816

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact Microsoft OpenVMM source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/openvmm.git openvmm
          cd openvmm
          git checkout --detach 61fd38fe6114d0955a082aa717a8e16e722b8490
          test "$(git rev-parse HEAD)" = "61fd38fe6114d0955a082aa717a8e16e722b8490"
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive

      - name: Create deterministic source archive and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          printf '%s\n' '61fd38fe6114d0955a082aa717a8e16e722b8490' > artifact/OPENVMM_COMMIT.txt
          git -C openvmm submodule status --recursive > artifact/SUBMODULES.txt
          git -C openvmm status --short > artifact/WORKTREE_STATUS.txt
          test ! -s artifact/WORKTREE_STATUS.txt
          tar --exclude='.git' --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-08-16' \
            -C openvmm -I 'zstd -19 -T0' -cf artifact/openvmm-61fd38fe-source.tar.zst .
          sha256sum artifact/* > artifact/SHA256SUMS.txt
          du -h artifact/* > artifact/SIZES.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-61fd38fe-exact-source
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
