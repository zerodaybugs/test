name: Temporary Negotiate LDAP groupType dependency cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
    paths:
      - .github/workflows/_temporary-negotiate-ldap-grouptype-deps-20260819.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tooling/rust-1.95-cache-20260817
      - name: Download and verify exact package
        shell: bash
        run: |
          set -euo pipefail
          out='tooling-cache/negotiate-ldap-grouptype-20260819'
          mkdir -p "$out"
          url='https://api.nuget.org/v3-flatcontainer/system.directoryservices.protocols/10.0.10/system.directoryservices.protocols.10.0.10.nupkg'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" -o "$out/system.directoryservices.protocols.10.0.10.nupkg"
          test -s "$out/system.directoryservices.protocols.10.0.10.nupkg"
          unzip -q "$out/system.directoryservices.protocols.10.0.10.nupkg" -d extracted
          test -f extracted/lib/net10.0/System.DirectoryServices.Protocols.dll
          sha256sum "$out/system.directoryservices.protocols.10.0.10.nupkg" > "$out/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/WORKFLOW_RUN_ID.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: negotiate-ldap-grouptype-deps-20260819
          path: tooling-cache/negotiate-ldap-grouptype-20260819
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Persist metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling-cache/negotiate-ldap-grouptype-20260819
          git commit -m 'cache: LDAP groupType test dependency' || exit 0
          git push origin HEAD:tooling/rust-1.95-cache-20260817
