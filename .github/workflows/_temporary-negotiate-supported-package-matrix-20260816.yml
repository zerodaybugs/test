name: Temporary Negotiate Supported Package Matrix

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-negotiate-supported-package-matrix-20260816.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install supported SDKs
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.129
            9.0.316
            10.0.302
          cache: false

      - name: Restore exact supported packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/export"
          WORK="$GITHUB_WORKSPACE/work"
          mkdir -p "$OUT" "$WORK"
          restore_one() {
            local tfm="$1" version="$2" slug="$3"
            local packages="$WORK/packages-$slug"
            local project="$WORK/$slug/probe.csproj"
            mkdir -p "$(dirname "$project")" "$packages" "$OUT/$slug"
            cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>$tfm</TargetFramework><RestorePackagesPath>$packages</RestorePackagesPath></PropertyGroup>
            <ItemGroup><PackageReference Include="Microsoft.AspNetCore.Authentication.Negotiate" Version="$version" /></ItemGroup>
          </Project>
          EOF
            dotnet restore "$project" --packages "$packages" --force --no-cache --nologo --use-lock-file
            cp "$project" "$(dirname "$project")/packages.lock.json" "$OUT/$slug/"
            cp -a "$packages/microsoft.aspnetcore.authentication.negotiate/$version" "$OUT/$slug/negotiate"
            dsver="$(find "$packages/system.directoryservices.protocols" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
            cp -a "$packages/system.directoryservices.protocols/$dsver" "$OUT/$slug/directoryservices-protocols"
            printf 'TFM=%s\nNEGOTIATE_VERSION=%s\nDIRECTORYSERVICES_VERSION=%s\n' "$tfm" "$version" "$dsver" > "$OUT/$slug/VERSIONS.env"
          }
          restore_one net8.0 8.0.29 net8
          restore_one net9.0 9.0.18 net9
          restore_one net10.0 10.0.10 net10
          dotnet --info > "$OUT/DOTNET_INFO.txt"
          find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/FILE_SIZES.tsv"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: negotiate-supported-package-matrix-8.0.29-9.0.18-10.0.10
          path: export
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
