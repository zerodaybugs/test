name: Temporary OpenHCL Signed Product Binary Inventory

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-openhcl-signed-product-binary-inventory-20260817.yml
      - msrc-lab/openhcl-signed-binary-inventory/inventory.ps1
      - msrc-lab/openhcl-signed-binary-inventory/analyze_embedded_hcl_firmware.py

permissions:
  contents: read

concurrency:
  group: temporary-openhcl-signed-product-binary-inventory-20260817
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out inventory probe
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run signed product binary inventory
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          pwsh -NoLogo -NoProfile -File msrc-lab/openhcl-signed-binary-inventory/inventory.ps1 2>&1 | Tee-Object -FilePath inventory-console.log
          if (-not (Test-Path evidence/GATE.json)) { throw 'GATE.json missing' }
          Get-Content evidence/GATE.json

      - name: Upload binary-binding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openhcl-signed-product-binary-inventory-20260817
          path: |
            evidence
            inventory-console.log
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true

  embedded-analysis:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out embedded analyzer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned analysis dependencies
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pefile==2024.8.26 capstone==5.0.6
          python -m pip freeze | Set-Content analysis-requirements-freeze.txt -Encoding UTF8
          $pdb = Get-Command llvm-pdbutil.exe -ErrorAction SilentlyContinue
          if ($pdb) { "LLVM_PDBUTIL=$($pdb.Source)" | Add-Content $env:GITHUB_ENV }
          Get-FileHash C:\Windows\System32\vmfirmwarehcl.dll -Algorithm SHA256 | Format-List | Out-String | Set-Content signed-input-hash.txt -Encoding UTF8
          Get-AuthenticodeSignature C:\Windows\System32\vmfirmwarehcl.dll | Format-List * | Out-String | Set-Content signed-input-authenticode.txt -Encoding UTF8
          (Get-Item C:\Windows\System32\vmfirmwarehcl.dll).VersionInfo | Format-List * | Out-String | Set-Content signed-input-version.txt -Encoding UTF8

      - name: Analyze embedded firmware modules and call graph
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence-embedded | Out-Null
          python msrc-lab/openhcl-signed-binary-inventory/analyze_embedded_hcl_firmware.py `
            C:\Windows\System32\vmfirmwarehcl.dll evidence-embedded\embedded-analysis `
            2>&1 | Tee-Object -FilePath evidence-embedded\analyzer-console.log
          if (-not (Test-Path evidence-embedded\embedded-analysis\GATE.json)) { throw 'embedded GATE.json missing' }
          Get-Content evidence-embedded\embedded-analysis\GATE.json
          Copy-Item signed-input-hash.txt,signed-input-authenticode.txt,signed-input-version.txt,analysis-requirements-freeze.txt evidence-embedded\
          Get-ChildItem evidence-embedded -File -Recurse | Sort-Object FullName | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.FullName.Substring((Resolve-Path evidence-embedded).Path.Length + 1).Replace('\','/')
          } | Set-Content evidence-embedded\SHA256SUMS.txt -Encoding ASCII

      - name: Upload embedded implementation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vmfirmwarehcl-embedded-source-binding-20260817
          path: evidence-embedded
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
