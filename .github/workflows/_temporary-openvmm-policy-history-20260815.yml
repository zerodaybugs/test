name: Temporary OpenVMM policy history analysis

on:
  push:
    branches:
      - openvmm-source-61fd-20260815
    paths:
      - '.github/workflows/_temporary-openvmm-policy-history-20260815.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trace validation history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git clone --filter=blob:none --no-tags https://github.com/microsoft/openvmm.git repo
          cd repo
          git checkout 61fd38fe6114d0955a082aa717a8e16e722b8490
          file='openhcl/underhill_core/src/worker.rs'
          {
            echo '=== exact commit ==='
            git rev-parse HEAD
            echo
            echo '=== -S encryption policy not supported ==='
            git log --all --date=iso-strict --format='%H %ad %s' -S'encryption policy not supported' -- "$file"
            echo
            echo '=== -S GspKey | Auto validation expression ==='
            git log --all --date=iso-strict --format='%H %ad %s' -S'GuestStateEncryptionPolicy::GspKey | GuestStateEncryptionPolicy::Auto' -- "$file"
            echo
            echo '=== regex changes around validation ==='
            git log --all --date=iso-strict --format='%H %ad %s' -G'guest_state_encryption_policy|validate_isolated_configuration' -- "$file" | head -n 120
            echo
            echo '=== current blame ==='
            git blame -L 3874,3965 --date=iso-strict "$file"
          } > ../export/history.txt
          removal=$(git log --all --format='%H' -S'encryption policy not supported' -- "$file" | tail -n 1 || true)
          introduction=$(git log --all --reverse --format='%H' -S'encryption policy not supported' -- "$file" | head -n 1 || true)
          printf 'introduction=%s\nremoval_or_last_change=%s\n' "$introduction" "$removal" > ../export/commits.txt
          for c in $(git log --all --format='%H' -S'encryption policy not supported' -- "$file"); do
            git show --stat --oneline "$c" > "../export/show-${c}.txt"
            git show --format=fuller --find-renames "$c" -- "$file" >> "../export/show-${c}.txt"
          done
          cd ..
          sha256sum export/* > export/SHA256SUMS.txt

      - name: Upload history evidence
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-policy-history
          path: export
          if-no-files-found: error
          retention-days: 2
