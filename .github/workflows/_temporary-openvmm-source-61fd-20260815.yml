name: Temporary pinned OpenVMM source export

on:
  push:
    branches:
      - openvmm-source-61fd-20260815
    paths:
      - '.github/workflows/_temporary-openvmm-source-61fd-20260815.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download pinned public source
        shell: bash
        run: |
          set -euo pipefail
          commit='61fd38fe6114d0955a082aa717a8e16e722b8490'
          mkdir -p export
          curl --fail --location --retry 3 \
            "https://api.github.com/repos/microsoft/openvmm/tarball/${commit}" \
            --output export/openvmm-${commit}.tar.gz
          printf '%s\n' "$commit" > export/COMMIT.txt
          sha256sum export/openvmm-${commit}.tar.gz > export/SHA256SUMS.txt
          tar -tzf export/openvmm-${commit}.tar.gz | head -n 30 > export/TAR_HEAD.txt
          stat -c '%n %s bytes' export/openvmm-${commit}.tar.gz > export/INVENTORY.txt

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-61fd-source
          path: export
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
