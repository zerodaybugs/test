name: Temporary OpenVMM v0.1.0 source cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch and verify exact OpenVMM release source
        shell: bash
        run: |
          set -euo pipefail
          commit='ee2fc3ffe2a816135374921d34b2fdf2990fd072'
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/openvmm.git openvmm
          git -C openvmm checkout --detach "$commit"
          test "$(git -C openvmm rev-parse HEAD)" = "$commit"
          test "$(git -C openvmm describe --tags --exact-match HEAD)" = 'openvmm-v0.1.0'
          git -C openvmm status --short | tee source-status.txt
          test ! -s source-status.txt
          git -C openvmm archive --format=tar --prefix=openvmm-v0.1.0/ "$commit" | zstd -T0 -19 -o openvmm-v0.1.0-source.tar.zst
          sha256sum openvmm-v0.1.0-source.tar.zst > openvmm-v0.1.0-source.tar.zst.sha256

      - name: Fetch and verify official offline vendor asset
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/microsoft/openvmm/releases/download/openvmm-v0.1.0/openvmm-0.1.0-vendor.tar.gz'
          out='openvmm-0.1.0-vendor.tar.gz'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output "$out"
          echo 'd21252583e230fff402945332afe4ffa6ee2bd4a96e6ef446a29fe5f93d25fb2  openvmm-0.1.0-vendor.tar.gz' | sha256sum --check --strict
          tar -tzf "$out" | sed -n '1,20p'
          cat > EXACT_SOURCE_METADATA.txt <<'EOF'
          repository=https://github.com/microsoft/openvmm.git
          tag=openvmm-v0.1.0
          commit=ee2fc3ffe2a816135374921d34b2fdf2990fd072
          vendor_sha256=d21252583e230fff402945332afe4ffa6ee2bd4a96e6ef446a29fe5f93d25fb2
          EOF
          sha256sum EXACT_SOURCE_METADATA.txt openvmm-v0.1.0-source.tar.zst openvmm-0.1.0-vendor.tar.gz > SHA256SUMS.txt

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-openvmm-v0.1.0-source-and-vendor
          path: |
            EXACT_SOURCE_METADATA.txt
            SHA256SUMS.txt
            openvmm-v0.1.0-source.tar.zst
            openvmm-v0.1.0-source.tar.zst.sha256
            openvmm-0.1.0-vendor.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
