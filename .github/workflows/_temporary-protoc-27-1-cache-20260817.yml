name: Temporary protoc 27.1 cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-protoc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify protoc 27.1
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/protocolbuffers/protobuf/releases/download/v27.1/protoc-27.1-linux-x86_64.zip'
          out='protoc-27.1-linux-x86_64.zip'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output "$out"
          sha256sum "$out" | tee SHA256SUMS.txt
          rm -rf extracted
          unzip -q "$out" -d extracted
          test -x extracted/bin/protoc
          test "$(extracted/bin/protoc --version)" = 'libprotoc 27.1'
          find extracted -type f -print0 | sort -z | xargs -0 sha256sum > EXTRACTED_SHA256SUMS.txt

      - name: Upload verified protoc
        uses: actions/upload-artifact@v4
        with:
          name: verified-protoc-27.1-linux-x86_64
          path: |
            protoc-27.1-linux-x86_64.zip
            SHA256SUMS.txt
            EXTRACTED_SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
