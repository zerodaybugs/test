name: Public hcsshim offline source bundle

on:
  push:
    branches:
      - agent/public-hcsshim-offline-bundle-20260816

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: false

      - name: Clone exact public Microsoft source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/hcsshim.git hcsshim
          cd hcsshim
          git checkout --detach c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8
          test "$(git rev-parse HEAD)" = "c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8"
          test -d vendor
          test "$(sed -n 's/^go //p' go.mod | head -1)" = "1.26.3"

      - name: Build offline bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          printf '%s\n' 'c4bdd7c8b5acf04abb6ac990e29ecbb8416523f8' > artifact/HCCSHIM_COMMIT.txt
          go version > artifact/GO_VERSION.txt
          go env GOROOT > artifact/GOROOT_PATH.txt

          tar --exclude='.git' -C hcsshim -I 'zstd -19 -T0' -cf artifact/hcsshim-c4bdd7c8-source.tar.zst .
          goroot="$(go env GOROOT)"
          tar -C "$(dirname "$goroot")" -I 'zstd -19 -T0' -cf artifact/go-1.26.3-linux-amd64.tar.zst "$(basename "$goroot")"

          sha256sum artifact/* > artifact/SHA256SUMS.txt
          du -h artifact/* | tee artifact/SIZES.txt

      - name: Upload public offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: public-hcsshim-c4bdd7c8-offline-bundle
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
