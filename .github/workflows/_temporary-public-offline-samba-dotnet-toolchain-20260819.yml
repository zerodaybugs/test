name: Public generic offline Samba AD and .NET toolchain bundle

on:
  push:
    branches:
      - agent/public-offline-samba-dotnet-toolchain-20260819
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install .NET SDK 10.0.400
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Build generic Ubuntu Samba AD rootfs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debootstrap zstd
          sudo debootstrap \
            --variant=minbase \
            --include=samba,samba-common-bin,winbind,krb5-config,libnss-winbind,netcat-openbsd,jq,python3,ca-certificates,openssl,procps,iproute2,psmisc \
            noble rootfs http://archive.ubuntu.com/ubuntu

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu noble main universe
          deb http://archive.ubuntu.com/ubuntu noble-updates main universe
          deb http://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /bin/bash -lc \
            'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq; apt-get install -y --no-install-recommends krb5-user dnsutils; samba --version; kinit --version 2>&1 | head -2 || true'

          sudo rm -rf rootfs/var/cache/apt/archives/*.deb rootfs/var/lib/apt/lists/*
          sudo rm -f rootfs/etc/resolv.conf
          sudo touch rootfs/etc/resolv.conf

      - name: Package offline artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          dotnet --info > artifact/dotnet-info.txt
          sudo chroot rootfs /bin/bash -lc 'samba --version' > artifact/samba-version.txt
          sudo tar --numeric-owner --xattrs --acls -C rootfs -I 'zstd -15 -T0' -cf artifact/ubuntu-noble-samba-ad-rootfs.tar.zst .

          DOTNET_ROOT="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          echo "$DOTNET_ROOT" > artifact/dotnet-root.txt
          sudo tar -C "$(dirname "$DOTNET_ROOT")" -I 'zstd -15 -T0' -cf artifact/dotnet-sdk-10.0.400-linux-x64.tar.zst "$(basename "$DOTNET_ROOT")"

          sha256sum artifact/*.tar.zst artifact/*.txt > artifact/SHA256SUMS.txt
          du -h artifact/* | tee artifact/SIZES.txt

      - name: Upload generic offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: public-generic-offline-samba-dotnet-20260819
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
