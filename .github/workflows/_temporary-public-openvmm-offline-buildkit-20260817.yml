name: Public OpenVMM offline Rust build kit

on:
  push:
    branches:
      - agent/public-openvmm-offline-buildkit-20260817

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install exact minimal Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version
          cargo +1.95.0 --version

      - name: Clone exact public Microsoft source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/openvmm.git openvmm
          cd openvmm
          git checkout --detach 61fd38fe6114d0955a082aa717a8e16e722b8490
          test "$(git rev-parse HEAD)" = "61fd38fe6114d0955a082aa717a8e16e722b8490"
          test "$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "1.95"

      - name: Vendor exact locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd openvmm
          rm -rf vendor
          cargo +1.95.0 vendor --locked --versioned-dirs vendor > ../cargo_config
          test -s ../cargo_config
          test -d vendor

      - name: Build deterministic offline archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          printf '%s\n' '61fd38fe6114d0955a082aa717a8e16e722b8490' > artifact/OPENVMM_COMMIT.txt
          rustc +1.95.0 --version --verbose > artifact/RUSTC_VERSION.txt
          cargo +1.95.0 --version --verbose > artifact/CARGO_VERSION.txt

          tar --sort=name --mtime='UTC 2026-08-17' --owner=0 --group=0 --numeric-owner \
            -C openvmm -I 'zstd -19 -T0' -cf artifact/openvmm-61fd38fe-vendor.tar.zst vendor
          cp cargo_config artifact/cargo_config

          sysroot="$(rustc +1.95.0 --print sysroot)"
          tar --sort=name --mtime='UTC 2026-08-17' --owner=0 --group=0 --numeric-owner \
            -C "$(dirname "${sysroot}")" -I 'zstd -19 -T0' \
            -cf artifact/rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst "$(basename "${sysroot}")"

          sha256sum artifact/* > artifact/SHA256SUMS.txt
          du -h artifact/* | tee artifact/SIZES.txt

      - name: Upload public offline build kit
        uses: actions/upload-artifact@v4
        with:
          name: public-openvmm-61fd38fe-offline-buildkit
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
