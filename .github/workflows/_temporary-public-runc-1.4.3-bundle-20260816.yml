name: Public official runc 1.4.3 bundle

on:
  push:
    branches:
      - agent/public-hcsshim-offline-bundle-20260816

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official runc binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl --fail --location --retry 5 \
            https://github.com/opencontainers/runc/releases/download/v1.4.3/runc.amd64 \
            --output artifact/runc
          echo 'f6ae8efc0fa40079e1475e97cbe9d1bd3f106a28d6af78a11d9f1bd565515e60  artifact/runc' | sha256sum -c -
          chmod 0755 artifact/runc
          artifact/runc --version | tee artifact/RUNC_VERSION.txt
          sha256sum artifact/runc artifact/RUNC_VERSION.txt > artifact/SHA256SUMS.txt

      - name: Upload verified runc binary
        uses: actions/upload-artifact@v4
        with:
          name: official-runc-v1.4.3-amd64
          path: artifact/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
