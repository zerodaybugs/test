name: temporary-runtime-lab-public-key

on:
  push:
    branches:
      - runtime-lab-20260816-x7
    paths:
      - .github/workflows/_temporary-runtime-lab-public-key-20260816.yml

permissions:
  contents: read

jobs:
  export-public-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore ephemeral private key
        uses: actions/cache@v4
        with:
          path: .runner-key/private.pem
          key: runtime-lab-x7-ed64898f228407684877b7c000ce65e3
      - name: Derive public key
        shell: bash
        run: |
          set -euo pipefail
          test -s .runner-key/private.pem
          openssl pkey -in .runner-key/private.pem -pubout -out /tmp/runtime-lab-x7-public.pem
          sha256sum /tmp/runtime-lab-x7-public.pem > /tmp/runtime-lab-x7-public.pem.sha256
      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: runtime-lab-x7-public-key
          path: |
            /tmp/runtime-lab-x7-public.pem
            /tmp/runtime-lab-x7-public.pem.sha256
          if-no-files-found: error
          retention-days: 1
