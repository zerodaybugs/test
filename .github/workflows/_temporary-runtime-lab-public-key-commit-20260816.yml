name: temporary-runtime-lab-public-key-commit

on:
  push:
    branches:
      - runtime-lab-20260816-x7
    paths:
      - .github/workflows/_temporary-runtime-lab-public-key-commit-20260816.yml

permissions:
  contents: write

jobs:
  commit-public-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-lab-20260816-x7
      - name: Restore ephemeral private key
        uses: actions/cache@v4
        with:
          path: .runner-key/private.pem
          key: runtime-lab-x7-ed64898f228407684877b7c000ce65e3
      - name: Commit public key only
        shell: bash
        run: |
          set -euo pipefail
          test -s .runner-key/private.pem
          mkdir -p .ci/runtime-lab-x7
          openssl pkey -in .runner-key/private.pem -pubout -out .ci/runtime-lab-x7/public.pem
          sha256sum .ci/runtime-lab-x7/public.pem > .ci/runtime-lab-x7/public.pem.sha256
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .ci/runtime-lab-x7/public.pem .ci/runtime-lab-x7/public.pem.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: publish runtime lab encryption public key"
          git push origin HEAD:runtime-lab-20260816-x7
