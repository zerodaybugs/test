name: temporary-runtime-lab-x7

on:
  push:
    branches:
      - runtime-lab-20260816-x7
    paths:
      - .github/workflows/_temporary-runtime-lab-x7-20260816.yml

permissions:
  contents: read

jobs:
  exact-release-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone exact release and current main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openvmm-release /tmp/openvmm-main /tmp/openvmm-gate
          mkdir -p /tmp/openvmm-gate

          git clone --filter=blob:none --no-checkout https://github.com/microsoft/openvmm.git /tmp/openvmm-release
          cd /tmp/openvmm-release
          git fetch --depth=1 origin ee2fc3ffe2a816135374921d34b2fdf2990fd072
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "ee2fc3ffe2a816135374921d34b2fdf2990fd072"

          git clone --filter=blob:none --depth=1 https://github.com/microsoft/openvmm.git /tmp/openvmm-main

          {
            echo "EXACT_RELEASE_COMMIT=$(git -C /tmp/openvmm-release rev-parse HEAD)"
            echo "CURRENT_MAIN_COMMIT=$(git -C /tmp/openvmm-main rev-parse HEAD)"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
          } | tee /tmp/openvmm-gate/environment.txt

      - name: Extract trust-epoch and reserved-state evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          out = Path('/tmp/openvmm-gate')
          roots = {
              'release': Path('/tmp/openvmm-release'),
              'main': Path('/tmp/openvmm-main'),
          }
          patterns = {
              'trust_epoch_todo': r"Don't allow trusted messages if an untrusted connection was ever used",
              'untrusted_message_error': r'UntrustedMessage',
              'reserved_state': r'ReservedState',
              'restore_channel': r'restore_channel',
              'confidential_ring_buffer': r'confidential_ring_buffer',
              'confidential_channels': r'confidential_channels',
              'select_gm_for_channel': r'select_gm_for_channel',
              'open_reserved_channel': r'OPEN_RESERVED_CHANNEL|OpenReservedChannel|handle_open_reserved_channel',
              'save_restore_reserved_test': r'test_.*save.*restore.*reserved|test_.*reserved.*restore',
          }
          files = [
              'vm/devices/vmbus/vmbus_server/src/channels.rs',
              'vm/devices/vmbus/vmbus_server/src/channels/saved_state.rs',
              'vm/devices/vmbus/vmbus_server/src/channels/tests.rs',
              'vm/devices/vmbus/vmbus_server/src/lib.rs',
              'vm/devices/vmbus/vmbus_channel/src/bus.rs',
              'vm/devices/vmbus/vmbus_channel/src/channel.rs',
              'vm/devices/vmbus/vmbus_channel/src/gpadl_ring.rs',
          ]
          summary = {}
          contexts = []
          for label, root in roots.items():
              summary[label] = {}
              for key, pattern in patterns.items():
                  rx = re.compile(pattern, re.I)
                  hits = []
                  for rel in files:
                      path = root / rel
                      if not path.exists():
                          continue
                      lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                      for i, line in enumerate(lines):
                          if rx.search(line):
                              hits.append({'file': rel, 'line': i + 1, 'text': line.strip()})
                              lo, hi = max(0, i - 10), min(len(lines), i + 18)
                              contexts.append(
                                  f"===== {label}:{rel}:{i+1} [{key}] =====\n" +
                                  '\n'.join(f'{j+1:6d}: {lines[j]}' for j in range(lo, hi)) + '\n'
                              )
                  summary[label][key] = hits
          (out / 'source_scan.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          (out / 'source_contexts.txt').write_text('\n'.join(contexts), encoding='utf-8')
          PY

      - name: Build exact vmbus_server test target
        id: build
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/openvmm-release
          cargo test -p vmbus_server --no-run 2>&1 | tee /tmp/openvmm-gate/build.log

      - name: Enumerate and run relevant exact-release tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/openvmm-release
          cargo test -p vmbus_server -- --list 2>&1 | tee /tmp/openvmm-gate/test-list.log

          mapfile -t tests < <(
            grep -E 'test: ' /tmp/openvmm-gate/test-list.log \
              | sed -E 's/: test$//' \
              | grep -Ei '(confidential|reserved|save.*restore|restore.*save|disconnect)' \
              | sort -u
          )

          printf '%s\n' "${tests[@]}" > /tmp/openvmm-gate/selected-tests.txt
          : > /tmp/openvmm-gate/selected-tests.log
          rc=0
          for test_name in "${tests[@]}"; do
            echo "===== RUN $test_name =====" | tee -a /tmp/openvmm-gate/selected-tests.log
            cargo test -p vmbus_server "$test_name" -- --exact --nocapture 2>&1 \
              | tee -a /tmp/openvmm-gate/selected-tests.log || rc=1
          done
          exit "$rc"

      - name: Produce machine verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          out = Path('/tmp/openvmm-gate')
          scan = json.loads((out / 'source_scan.json').read_text())
          build_log = (out / 'build.log').read_text(errors='replace') if (out / 'build.log').exists() else ''
          test_log = (out / 'selected-tests.log').read_text(errors='replace') if (out / 'selected-tests.log').exists() else ''
          selected = (out / 'selected-tests.txt').read_text(errors='replace').splitlines() if (out / 'selected-tests.txt').exists() else []

          exact = subprocess.check_output(['git', '-C', '/tmp/openvmm-release', 'rev-parse', 'HEAD'], text=True).strip()
          main = subprocess.check_output(['git', '-C', '/tmp/openvmm-main', 'rev-parse', 'HEAD'], text=True).strip()

          release = scan.get('release', {})
          current = scan.get('main', {})
          structural = all(bool(release.get(k)) for k in (
              'trust_epoch_todo',
              'reserved_state',
              'restore_channel',
              'confidential_ring_buffer',
              'open_reserved_channel',
          ))
          current_persists = all(bool(current.get(k)) for k in (
              'reserved_state',
              'restore_channel',
              'confidential_ring_buffer',
              'open_reserved_channel',
          ))
          build_pass = 'Finished `test`' in build_log or 'Finished `test` profile' in build_log
          tests_pass = bool(selected) and 'test result: FAILED' not in test_log and test_log.count('test result: ok') >= len(selected)

          verdict = {
              'candidate_id': 'MS-OHCL-CVMBUS-TRUSTEPOCH-01',
              'exact_release_commit': exact,
              'current_main_commit': main,
              'selected_test_count': len(selected),
              'selected_tests': selected,
              'exact_release_build_pass': build_pass,
              'selected_tests_pass': tests_pass,
              'release_structural_primitive': structural,
              'current_main_related_mechanism_present': current_persists,
              'production_binding_gate': False,
              'private_memory_read_or_write_gate': False,
              'deterministic_10_of_10_exploit_gate': False,
              'scope_gate': False,
              'duplicate_gate': False,
              'critical_confirmed': False,
              'submit_ready': False,
              'verdict': 'HOLD_NOT_FOR_SUBMISSION',
              'blocker': 'No production reserved confidential channel and no deterministic private VTL0 memory read/write impact proof.',
          }
          (out / 'MACHINE_VERDICT.json').write_text(json.dumps(verdict, indent=2), encoding='utf-8')
          (out / 'READ_ME_FIRST.txt').write_text(
              '\n'.join([
                  'OPENHCL / OPENVMM TRUST-EPOCH EXACT-RELEASE GATE',
                  '=' * 72,
                  f'EXACT_RELEASE_COMMIT={exact}',
                  f'CURRENT_MAIN_COMMIT={main}',
                  f'EXACT_RELEASE_BUILD_PASS={build_pass}',
                  f'SELECTED_TEST_COUNT={len(selected)}',
                  f'SELECTED_TESTS_PASS={tests_pass}',
                  f'RELEASE_STRUCTURAL_PRIMITIVE={structural}',
                  f'CURRENT_MAIN_RELATED_MECHANISM_PRESENT={current_persists}',
                  'PRODUCTION_BINDING_GATE=False',
                  'PRIVATE_MEMORY_READ_OR_WRITE_GATE=False',
                  'CRITICAL_CONFIRMED=False',
                  'SUBMIT_READY=False',
                  'VERDICT=HOLD_NOT_FOR_SUBMISSION',
                  '',
                  'This is a public-source research checkpoint. Do not submit it to MSRC.',
              ]) + '\n', encoding='utf-8')
          PY
          cd /tmp/openvmm-gate
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload public-source checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-trustepoch-exact-release-gate
          path: /tmp/openvmm-gate
          if-no-files-found: error
          retention-days: 1
