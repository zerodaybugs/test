name: Temporary Rust 1.95 toolchain cache

on:
  push:
    branches:
      - tooling/rust-1.95-cache-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download bundled Rust 1.95 wheel
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/QunaSys/setuptools-rust-bundled/releases/download/v0.1.5/setuptools_rust_bundled-0.1.5-py3-none-manylinux_2_17_x86_64.whl'
          out='setuptools_rust_bundled-0.1.5-py3-none-manylinux_2_17_x86_64.whl'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" --output "$out"
          echo 'fda7023d79fbfcab29026ec87f5e59154a0350f9297c542543fcfc9834d438d4  setuptools_rust_bundled-0.1.5-py3-none-manylinux_2_17_x86_64.whl' | sha256sum --check --strict
          python3 - <<'PY'
          import zipfile
          p = 'setuptools_rust_bundled-0.1.5-py3-none-manylinux_2_17_x86_64.whl'
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              assert any(n.endswith('/bin/rustc') for n in names)
              assert any(n.endswith('/bin/cargo') for n in names)
              assert any('/lib/rustlib/x86_64-unknown-linux-gnu/lib/libstd-' in n for n in names)
              print('WHEEL_CONTENT_GATE=PASS')
              print('entries=', len(names))
          PY

      - name: Upload verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: verified-rust-1.95-manylinux-x86_64-wheel
          path: setuptools_rust_bundled-0.1.5-py3-none-manylinux_2_17_x86_64.whl
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
