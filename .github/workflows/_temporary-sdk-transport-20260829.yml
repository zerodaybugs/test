name: Temporary official .NET SDK transport

on:
  push:
    branches:
      - ci/sdk-smoke-20260829

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official .NET SDK 10.0.111
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.111

      - name: Record version and package installed SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport
          dotnet --info | tee transport/dotnet-info.txt
          dotnet --version | tee transport/dotnet-version.txt
          tar -C "$DOTNET_ROOT" -czf transport/dotnet-sdk-10.0.111-linux-x64.tar.gz .
          sha512sum transport/dotnet-sdk-10.0.111-linux-x64.tar.gz | tee transport/SHA512SUMS.txt

      - name: Upload temporary SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-dotnet-sdk-10.0.111-linux-x64
          path: transport
          if-no-files-found: error
          retention-days: 1
