name: Temporary official .NET SDK transport

on:
  push:
    branches:
      - ci/sdk-smoke-20260829

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDK_VERSION: 10.0.400
      SDK_URL: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.400/dotnet-sdk-10.0.400-linux-x64.tar.gz
      SDK_SHA512: 1033977dd837150e0814cf0c5d5b17ceb63925fda7ba2158b47258a4bd7c048cf82eac3bc1166f3146f53124a3f5fba09db1de1260d2ce96399860303b404b48
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify exact official SDK archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/sdk transport/template-bundle/dotnet-home transport/template-bundle/nuget-packages
          curl --fail --location --retry 5 --retry-all-errors "$SDK_URL" \
            --output "transport/sdk/dotnet-sdk-${SDK_VERSION}-linux-x64.tar.gz"
          printf '%s  %s\n' "$SDK_SHA512" "transport/sdk/dotnet-sdk-${SDK_VERSION}-linux-x64.tar.gz" \
            | sha512sum --check --strict
          printf '%s  %s\n' "$SDK_SHA512" "dotnet-sdk-${SDK_VERSION}-linux-x64.tar.gz" \
            > transport/sdk/SHA512SUMS.txt

      - name: Extract exact SDK and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet-${SDK_VERSION}"
          tar -xzf "transport/sdk/dotnet-sdk-${SDK_VERSION}-linux-x64.tar.gz" \
            -C "$RUNNER_TEMP/dotnet-${SDK_VERSION}"
          export DOTNET_ROOT="$RUNNER_TEMP/dotnet-${SDK_VERSION}"
          export PATH="$DOTNET_ROOT:$PATH"
          export DOTNET_CLI_HOME="$PWD/transport/template-bundle/dotnet-home"
          export NUGET_PACKAGES="$PWD/transport/template-bundle/nuget-packages"
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_NOLOGO=1
          test "$(dotnet --version)" = "$SDK_VERSION"
          dotnet --info | tee transport/sdk/dotnet-info.txt
          dotnet --list-runtimes | tee transport/sdk/dotnet-runtimes.txt
          grep -F 'Microsoft.AspNetCore.App 10.0.11 ' transport/sdk/dotnet-runtimes.txt
          grep -F 'Microsoft.NETCore.App 10.0.11 ' transport/sdk/dotnet-runtimes.txt

      - name: Generate, restore, and build untouched current Blazor Individual Accounts template
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_ROOT="$RUNNER_TEMP/dotnet-${SDK_VERSION}"
          export PATH="$DOTNET_ROOT:$PATH"
          export DOTNET_CLI_HOME="$PWD/transport/template-bundle/dotnet-home"
          export NUGET_PACKAGES="$PWD/transport/template-bundle/nuget-packages"
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_NOLOGO=1
          mkdir -p transport/template-bundle/source
          dotnet new blazor \
            -n CurrentBlazorIndividual \
            --auth Individual \
            --interactivity Server \
            --all-interactive \
            --no-restore \
            --output transport/template-bundle/source/CurrentBlazorIndividual \
            | tee transport/template-bundle/template-generate.log
          dotnet restore transport/template-bundle/source/CurrentBlazorIndividual/CurrentBlazorIndividual.csproj \
            --nologo | tee transport/template-bundle/template-restore.log
          dotnet build transport/template-bundle/source/CurrentBlazorIndividual/CurrentBlazorIndividual.csproj \
            -c Release --no-restore --nologo -warnaserror \
            | tee transport/template-bundle/template-build.log
          find transport/template-bundle/source/CurrentBlazorIndividual -type f \
            ! -path '*/bin/*' ! -path '*/obj/*' -print0 \
            | sort -z | xargs -0 sha256sum > transport/template-bundle/SOURCE_SHA256SUMS.txt
          tar -czf transport/current-blazor-individual-template-and-nuget-cache.tar.gz \
            -C transport/template-bundle .
          sha512sum transport/current-blazor-individual-template-and-nuget-cache.tar.gz \
            > transport/TEMPLATE_BUNDLE_SHA512SUMS.txt

      - name: Upload exact official SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: official-dotnet-sdk-10.0.400-linux-x64
          path: transport/sdk
          if-no-files-found: error
          retention-days: 1

      - name: Upload untouched current template and dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: current-blazor-individual-template-10.0.11
          path: |
            transport/current-blazor-individual-template-and-nuget-cache.tar.gz
            transport/TEMPLATE_BUNDLE_SHA512SUMS.txt
          if-no-files-found: error
          retention-days: 1
