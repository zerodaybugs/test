name: Temporary SignalR Method AuthenticationSchemes Cross-Version V2

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-signalr-authschemes-crossversion-v2-20260817.yml
      - msrc-lab/signalr-authschemes-v2/patch_program.py

permissions:
  contents: read
  actions: read

concurrency:
  group: temporary-signalr-authschemes-crossversion-v2-20260817
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out patcher only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact supported SDK/runtime lines
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.129
            10.0.303
          cache: false

      - name: Verify exact supported runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source
          dotnet --info > evidence/DOTNET_INFO.txt
          dotnet --list-runtimes > evidence/DOTNET_RUNTIMES.txt
          grep -E '^Microsoft\.NETCore\.App 8\.0\.29 ' evidence/DOTNET_RUNTIMES.txt
          grep -E '^Microsoft\.AspNetCore\.App 8\.0\.29 ' evidence/DOTNET_RUNTIMES.txt
          grep -E '^Microsoft\.NETCore\.App 10\.0\.11 ' evidence/DOTNET_RUNTIMES.txt
          grep -E '^Microsoft\.AspNetCore\.App 10\.0\.11 ' evidence/DOTNET_RUNTIMES.txt

      - name: Recover first-pass source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/zerodaybugs/test/actions/artifacts/9294886802/zip' \
            -o evidence/source/first-pass-artifact.zip
          unzip -q evidence/source/first-pass-artifact.zip -d evidence/source/first-pass
          test -s evidence/source/first-pass/Program.cs
          cp evidence/source/first-pass/Program.cs Program.cs
          python3 msrc-lab/signalr-authschemes-v2/patch_program.py
          cp Program.cs evidence/source/Program.v2.cs
          sha256sum evidence/source/first-pass-artifact.zip > evidence/source/FIRST_PASS_ARTIFACT_SHA256.txt

      - name: Build exact 8.0.29 and 10.0.11 harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness/net8 harness/net10 evidence/net8 evidence/net10
          cp Program.cs harness/net8/Program.cs
          cp Program.cs harness/net10/Program.cs
          cat > harness/net8/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <Optimize>true</Optimize>
              <Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.SignalR.Client" Version="8.0.29" />
            </ItemGroup>
          </Project>
          EOF
          cat > harness/net10/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <Optimize>true</Optimize>
              <Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.SignalR.Client" Version="10.0.11" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore harness/net8/harness.csproj --nologo
          dotnet restore harness/net10/harness.csproj --nologo
          dotnet build harness/net8/harness.csproj -c Release --no-restore --nologo
          dotnet build harness/net10/harness.csproj -c Release --no-restore --nologo
          dotnet list harness/net8/harness.csproj package --include-transitive > evidence/net8/PACKAGES.txt
          dotnet list harness/net10/harness.csproj package --include-transitive > evidence/net10/PACKAGES.txt

      - name: Run clean supported-release matrices
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local folder="$1"
            local tfm="$2"
            local fx="$3"
            local out="$4"
            set +e
            EVIDENCE_DIR="$GITHUB_WORKSPACE/$out" timeout --signal=KILL 14m \
              dotnet exec --fx-version "$fx" "harness/$folder/bin/Release/$tfm/harness.dll" \
              > "$out/RUN.log" 2>&1
            local rc=$?
            set -e
            echo "RUN_RC=$rc" > "$out/RUN_STATUS.env"
            cat "$out/RUN.log"
            test "$rc" -eq 0
            grep -q '^ATTACK_PASS=1$' "$out/VERDICT.env"
            grep -q '^CONTROLS_PASS=1$' "$out/VERDICT.env"
            grep -q '^VERDICT=CURRENT_RELEASE_REAL_COOKIE_METHOD_SCHEME_FAIL_OPEN$' "$out/VERDICT.env"
          }
          run_one net8 net8.0 8.0.29 evidence/net8
          run_one net10 net10.0 10.0.11 evidence/net10

      - name: Build cross-version gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for name in ('net8','net10'):
              result=json.loads(Path(f'evidence/{name}/RESULT.json').read_text())
              rows.append({
                  'line':name,
                  'framework':result['framework'],
                  'aspnetcoreAssembly':result['aspnetcoreAssembly'],
                  'attackPass':result['attackPass'],
                  'controlsPass':result['controlsPass'],
                  'verdict':result['verdict'],
                  'attackCount':len(result['attackRows']),
                  'controlCount':len(result['controlRows']),
              })
          passed=all(r['attackPass'] and r['controlsPass'] for r in rows)
          gate={
              'schema':'signalr_method_authschemes_crossversion_gate/v2',
              'rows':rows,
              'supportedLinesPass':passed,
              'verdict':'SUPPORTED_8_AND_10_REAL_COOKIE_FAIL_OPEN' if passed else 'KILL_OR_INCONCLUSIVE',
              'submissionReady':False,
          }
          Path('evidence/CROSS_VERSION_GATE.json').write_text(json.dumps(gate,indent=2))
          Path('evidence/FINAL_VERDICT.env').write_text(
              f"SUPPORTED_LINES_PASS={int(passed)}\nVERDICT={gate['verdict']}\nSUBMISSION_READY=0\n")
          print(Path('evidence/FINAL_VERDICT.env').read_text())
          if not passed:
              raise SystemExit(90)
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload cross-version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signalr-authschemes-crossversion-v2-20260817
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
