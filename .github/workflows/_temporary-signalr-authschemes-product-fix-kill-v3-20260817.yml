name: Temporary SignalR AuthenticationSchemes Product Fix Kill V3

on:
  push:
    branches:
      - agent/dotnet10-toolchain-20260815
    paths:
      - .github/workflows/_temporary-signalr-authschemes-product-fix-kill-v3-20260817.yml
      - msrc-lab/signalr-authschemes-v2/HubMethodAuthenticationSchemesTests.cs
      - msrc-lab/signalr-authschemes-v2/apply_product_fix.py

permissions:
  contents: read

concurrency:
  group: temporary-signalr-authschemes-product-fix-kill-v3-20260817
  cancel-in-progress: false

jobs:
  product-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out validation files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          path: lab

      - name: Check out exact ASP.NET Core 10.0.11 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.11
          persist-credentials: false
          fetch-depth: 1
          path: aspnetcore

      - name: Install supported SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.303
          cache: false

      - name: Stage source-bound tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C aspnetcore rev-parse HEAD | tee evidence/ASPNETCORE_COMMIT.txt
          test "$(cat evidence/ASPNETCORE_COMMIT.txt)" = "a5383385245bdacc20ec19f30e46090a8154d8da"
          test "$(git -C aspnetcore describe --tags --exact-match)" = "v10.0.11"
          cp lab/msrc-lab/signalr-authschemes-v2/HubMethodAuthenticationSchemesTests.cs \
            aspnetcore/src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/
          cp lab/msrc-lab/signalr-authschemes-v2/HubMethodAuthenticationSchemesTests.cs evidence/
          cp lab/msrc-lab/signalr-authschemes-v2/apply_product_fix.py evidence/
          dotnet --info > evidence/DOTNET_INFO.txt

      - name: Build unmodified source through official repository entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cd aspnetcore
          project='src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj'
          chmod +x eng/build.sh
          ./eng/build.sh --restore --build --projects "$project" \
            /p:AllowMissingPrunePackageData=true \
            > ../evidence/UNMODIFIED_BUILD.log 2>&1
          cat ../evidence/UNMODIFIED_BUILD.log
          test -f artifacts/bin/GenerateFiles/Directory.Build.props

      - name: Unmodified product must silently accept method schemes
        shell: bash
        run: |
          set -euo pipefail
          cd aspnetcore
          project='src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj'
          set +e
          dotnet test "$project" -c Release --no-restore \
            /p:AllowMissingPrunePackageData=true \
            --filter 'FullyQualifiedName~HubMethodAuthenticationSchemesTests' \
            --logger 'console;verbosity=normal' --nologo \
            > ../evidence/UNMODIFIED_TARGETED_TEST.log 2>&1
          rc=$?
          set -e
          echo "UNMODIFIED_TEST_RC=$rc" > ../evidence/UNMODIFIED_STATUS.env
          cat ../evidence/UNMODIFIED_TARGETED_TEST.log
          test "$rc" -ne 0
          grep -q 'MethodLevelAuthenticationSchemesFailFast' ../evidence/UNMODIFIED_TARGETED_TEST.log
          grep -q 'MissingMethodLevelAuthenticationSchemeAlsoFailsFast' ../evidence/UNMODIFIED_TARGETED_TEST.log
          grep -q 'ClassLevelAuthenticationSchemesRemainSupported' ../evidence/UNMODIFIED_TARGETED_TEST.log
          grep -q 'PlainMethodAuthorizationRemainsSupported' ../evidence/UNMODIFIED_TARGETED_TEST.log
          unmodified="$(find artifacts/bin/Microsoft.AspNetCore.SignalR.Core -type f -name 'Microsoft.AspNetCore.SignalR.Core.dll' -print | sort | tail -1)"
          test -n "$unmodified"
          printf 'UNMODIFIED_ASSEMBLY=%s\n' "$unmodified" > ../evidence/UNMODIFIED_ASSEMBLY.env
          sha256sum "$unmodified" >> ../evidence/UNMODIFIED_ASSEMBLY.env

      - name: Apply actual SignalR product fix
        shell: bash
        run: |
          set -euo pipefail
          cp lab/msrc-lab/signalr-authschemes-v2/apply_product_fix.py aspnetcore/
          cd aspnetcore
          python3 apply_product_fix.py
          git diff -- src/SignalR/server/Core/src/Internal/DefaultHubDispatcher.cs > ../evidence/PRODUCT_FIX.patch
          test -s ../evidence/PRODUCT_FIX.patch
          grep -q 'AuthenticationSchemes' ../evidence/PRODUCT_FIX.patch
          grep -q 'cannot re-run named authentication handlers' ../evidence/PRODUCT_FIX.patch

      - name: Rebuild patched product through official repository entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cd aspnetcore
          project='src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj'
          ./eng/build.sh --build --no-restore --projects "$project" \
            /p:AllowMissingPrunePackageData=true \
            > ../evidence/PATCHED_BUILD.log 2>&1
          cat ../evidence/PATCHED_BUILD.log

      - name: Patched targeted product tests must pass
        shell: bash
        run: |
          set -euo pipefail
          cd aspnetcore
          project='src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj'
          dotnet test "$project" -c Release --no-restore \
            /p:AllowMissingPrunePackageData=true \
            --filter 'FullyQualifiedName~HubMethodAuthenticationSchemesTests' \
            --logger 'console;verbosity=normal' --nologo \
            > ../evidence/PATCHED_TARGETED_TEST.log 2>&1
          cat ../evidence/PATCHED_TARGETED_TEST.log
          grep -q 'MethodLevelAuthenticationSchemesFailFast' ../evidence/PATCHED_TARGETED_TEST.log
          grep -q 'MissingMethodLevelAuthenticationSchemeAlsoFailsFast' ../evidence/PATCHED_TARGETED_TEST.log
          grep -q 'ClassLevelAuthenticationSchemesRemainSupported' ../evidence/PATCHED_TARGETED_TEST.log
          grep -q 'PlainMethodAuthorizationRemainsSupported' ../evidence/PATCHED_TARGETED_TEST.log
          grep -Eq 'Failed:[[:space:]]+0' ../evidence/PATCHED_TARGETED_TEST.log

      - name: Complete patched SignalR server test project
        shell: bash
        run: |
          set -euo pipefail
          cd aspnetcore
          project='src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj'
          dotnet test "$project" -c Release --no-restore \
            /p:AllowMissingPrunePackageData=true \
            --logger 'console;verbosity=minimal' --nologo \
            > ../evidence/PATCHED_FULL_SIGNALR_TEST.log 2>&1
          cat ../evidence/PATCHED_FULL_SIGNALR_TEST.log
          grep -Eq 'Failed:[[:space:]]+0' ../evidence/PATCHED_FULL_SIGNALR_TEST.log
          patched="$(find artifacts/bin/Microsoft.AspNetCore.SignalR.Core -type f -name 'Microsoft.AspNetCore.SignalR.Core.dll' -print | sort | tail -1)"
          test -n "$patched"
          printf 'PATCHED_ASSEMBLY=%s\n' "$patched" > ../evidence/PATCHED_ASSEMBLY.env
          sha256sum "$patched" >> ../evidence/PATCHED_ASSEMBLY.env

      - name: Build strict fix-kill gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          unmodified = Path('evidence/UNMODIFIED_STATUS.env').read_text()
          targeted = Path('evidence/PATCHED_TARGETED_TEST.log').read_text(errors='replace')
          full = Path('evidence/PATCHED_FULL_SIGNALR_TEST.log').read_text(errors='replace')
          checks = {
              'exact_source_commit': Path('evidence/ASPNETCORE_COMMIT.txt').read_text().strip() == 'a5383385245bdacc20ec19f30e46090a8154d8da',
              'unmodified_silent_acceptance_detected': 'UNMODIFIED_TEST_RC=0' not in unmodified,
              'actual_product_patch': Path('evidence/PRODUCT_FIX.patch').stat().st_size > 0,
              'method_scheme_fails_fast': 'MethodLevelAuthenticationSchemesFailFast' in targeted,
              'missing_scheme_fails_fast': 'MissingMethodLevelAuthenticationSchemeAlsoFailsFast' in targeted,
              'class_level_control': 'ClassLevelAuthenticationSchemesRemainSupported' in targeted,
              'plain_authorize_control': 'PlainMethodAuthorizationRemainsSupported' in targeted,
              'patched_targeted_zero_failures': bool(re.search(r'Failed:\s+0', targeted)),
              'patched_full_zero_failures': bool(re.search(r'Failed:\s+0', full)),
              'unmodified_assembly_recorded': Path('evidence/UNMODIFIED_ASSEMBLY.env').exists(),
              'patched_assembly_recorded': Path('evidence/PATCHED_ASSEMBLY.env').exists(),
          }
          passed = all(checks.values())
          gate = {
              'schema': 'signalr_method_authschemes_product_fix_gate/v3',
              'checks': checks,
              'fixKillPass': passed,
              'verdict': 'ACTUAL_PRODUCT_FAIL_FAST_FIX_KILLS_BYPASS' if passed else 'FIX_GATE_FAILED',
              'submissionReady': False,
          }
          Path('evidence/FIX_GATE.json').write_text(json.dumps(gate, indent=2))
          Path('evidence/FINAL_VERDICT.env').write_text(
              f"FIX_KILL_PASS={int(passed)}\nVERDICT={gate['verdict']}\nSUBMISSION_READY=0\n")
          print(Path('evidence/FINAL_VERDICT.env').read_text())
          if not passed:
              raise SystemExit(90)
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload product fix-kill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signalr-authschemes-product-fix-kill-v3-20260817
          path: evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
