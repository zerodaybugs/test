name: Temporary split encrypted relay result

on:
  push:
    branches:
      - agent/windows-runner-probe-20260812
    paths:
      - '.github/workflows/_temporary-split-encrypted-result-20260812.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Split public ciphertext envelope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'exchange/result-envelope.json'
          $output = Join-Path $env:GITHUB_WORKSPACE 'exchange/result-chunks'
          Remove-Item -Recurse -Force $output -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $bytes = [IO.File]::ReadAllBytes($source)
          $encoded = [Convert]::ToBase64String($bytes)
          $chunkSize = 5000
          $count = [Math]::Ceiling($encoded.Length / $chunkSize)
          for ($index = 0; $index -lt $count; $index++) {
            $start = $index * $chunkSize
            $length = [Math]::Min($chunkSize, $encoded.Length - $start)
            $chunk = $encoded.Substring($start, $length)
            $name = '{0:D3}.txt' -f $index
            [IO.File]::WriteAllText((Join-Path $output $name), $chunk, [Text.Encoding]::ASCII)
          }

          $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          [ordered]@{
            encoding = 'base64'
            chunkSize = $chunkSize
            chunkCount = [int]$count
            originalByteLength = $bytes.Length
            sha256 = $sha
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'manifest.json')

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exchange/result-chunks
          git commit -m 'publish split encrypted result [skip ci]'
          git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
