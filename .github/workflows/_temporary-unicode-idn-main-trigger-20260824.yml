name: temporary-unicode-idn-main-trigger-20260824

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_temporary-unicode-idn-main-trigger-20260824.yml

permissions:
  contents: write

concurrency:
  group: temporary-unicode-idn-main-trigger-20260824
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-unicode-idn-ordinal-matrix-20260824

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run matrix
        shell: bash
        run: |
          set -euo pipefail
          cd tools/unicode-idn-matrix
          dotnet --info > dotnet-info.txt
          dotnet run --configuration Release --nologo > run.log
          test -s unicode-idn-matrix.json
          sha256sum unicode-idn-matrix.json dotnet-info.txt run.log > MANIFEST.sha256
          cat unicode-idn-matrix.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: unicode-idn-matrix-${{ github.run_id }}
          path: |
            tools/unicode-idn-matrix/unicode-idn-matrix.json
            tools/unicode-idn-matrix/dotnet-info.txt
            tools/unicode-idn-matrix/run.log
            tools/unicode-idn-matrix/MANIFEST.sha256
          retention-days: 7

      - name: Publish result branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_BRANCH: temp-unicode-idn-ordinal-results-20260824
        run: |
          set -euo pipefail
          mkdir result
          cp tools/unicode-idn-matrix/{unicode-idn-matrix.json,dotnet-info.txt,run.log,MANIFEST.sha256} result/
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > result/RUN.txt
          cd result
          git init
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$RESULT_BRANCH"
          git add .
          git commit -m "ci: publish Unicode IDN matrix $GITHUB_RUN_ID"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$RESULT_BRANCH"
