name: Temporary upstream OpenVMM build kit 20260816

on:
  push:
    branches:
      - toolchain-links-20260816

permissions:
  contents: read

concurrency:
  group: upstream-openvmm-buildkit-20260816
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact public OpenVMM release
        uses: actions/checkout@v4
        with:
          repository: microsoft/openvmm
          ref: ee2fc3ffe2a816135374921d34b2fdf2990fd072
          path: openvmm
          fetch-depth: 1
          persist-credentials: false

      - name: Configure exact public Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Assemble public-source offline kit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir -p bundle evidence

          git -C openvmm rev-parse HEAD | tee evidence/OPENVMM_COMMIT.txt
          rustc --version | tee evidence/RUSTC_VERSION.txt
          cargo --version | tee evidence/CARGO_VERSION.txt

          curl --fail --location --retry 3 \
            --output openvmm-0.1.0-vendor.tar.gz \
            https://github.com/microsoft/openvmm/releases/download/openvmm-v0.1.0/openvmm-0.1.0-vendor.tar.gz
          echo 'd21252583e230fff402945332afe4ffa6ee2bd4a96e6ef446a29fe5f93d25fb2  openvmm-0.1.0-vendor.tar.gz' \
            | sha256sum --check

          mkdir -p bundle/openvmm
          git -C openvmm archive --format=tar HEAD | tar -xf - -C bundle/openvmm
          tar -xzf openvmm-0.1.0-vendor.tar.gz -C bundle/openvmm

          sysroot="$(rustc --print sysroot)"
          tar --zstd -cf rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst \
            -C "$(dirname "$sysroot")" "$(basename "$sysroot")"
          tar --zstd -cf openvmm-0.1.0-source-vendor.tar.zst -C bundle openvmm

          sha256sum \
            rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst \
            openvmm-0.1.0-source-vendor.tar.zst \
            | tee evidence/SHA256SUMS.txt
          du -h rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst \
            openvmm-0.1.0-source-vendor.tar.zst \
            | tee evidence/SIZES.txt

      - name: Upload public-source offline kit
        uses: actions/upload-artifact@v4
        with:
          name: upstream-openvmm-public-buildkit-20260816
          path: |
            rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst
            openvmm-0.1.0-source-vendor.tar.zst
            evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
