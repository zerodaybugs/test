name: Temporary public Windows runner probe

on:
  push:
    branches:
      - agent/windows-runner-probe-20260812
    paths:
      - '.github/workflows/_temporary-windows-runner-probe-20260812.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Report runner
        shell: pwsh
        run: |
          Write-Output "WINDOWS_RUNNER_OK"
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | Format-List
