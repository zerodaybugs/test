name: Aave Aptos Round 7 Chainlink replay scan

on:
  push:
    branches:
      - aave-aptos-round7-20260815
    paths:
      - tools/aave_round7_chainlink_cross_receiver.py
      - .github/workflows/aave-aptos-round7-chainlink-scan-20260815.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      REST: "https://api.mainnet.aptoslabs.com/v1"
      GRAPHQL: "https://indexer.mainnet.aptoslabs.com/v1/graphql"
      DATA_FEEDS: "0x3f985798ce4975f430ef5c75776ff98a77b9f9d0fb38184d225adc9c1cc6b79b"
      PLATFORMS: "0x9976bb288ed9177b542d568fa1ac386819dc99141630e582315804840f41928a,0x3bcacb561438c55ce2a9da479df6ab486af55b2fb7070b700df36c097da732b8"
      MAX_ROWS_PER_PLATFORM: "10000"
      EVIDENCE_DIR: "evidence/chainlink-cross-receiver"
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Scan both deployed forwarders
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/aave_round7_chainlink_cross_receiver.py
          find evidence/chainlink-cross-receiver -type f -print0 | sort -z | \
            xargs -0 sha256sum > evidence/chainlink-cross-receiver/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-round7-chainlink-cross-receiver
          path: evidence/chainlink-cross-receiver
          retention-days: 7
          if-no-files-found: error
