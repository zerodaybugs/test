name: Aave Aptos Round 7 validation

on:
  push:
    branches:
      - aave-aptos-round7-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-incentives:
    name: Inspect live incentives and zero-supply reward state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FULLNODE: "https://api.mainnet.aptoslabs.com/v1"
      AAVE: "0x39ddcd9e1a39fa14f25e3f9ec8a86074d05cc0881cbf667df8a6ee70942016fb"
    steps:
      - name: Query and classify live incentive state
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/live-incentives
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          root = Path("evidence/live-incentives")
          endpoint = os.environ["FULLNODE"].rstrip("/")
          aave = os.environ["AAVE"]
          metadata_type = "0x1::fungible_asset::Metadata"

          def request_json(url, body=None):
              data = None if body is None else json.dumps(body).encode()
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "aave-aptos-round7-validation",
              }
              if body is not None:
                  headers["Content-Type"] = "application/json"
              last = None
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers)
                      with urllib.request.urlopen(req, timeout=120) as response:
                          return json.loads(response.read())
                  except Exception as exc:
                      last = exc
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f"request failed for {url}: {last!r}")

          def view(function, type_arguments=None, arguments=None):
              return request_json(
                  endpoint + "/view",
                  {
                      "function": function,
                      "type_arguments": type_arguments or [],
                      "arguments": arguments or [],
                  },
              )

          def return_value(raw):
              if isinstance(raw, list) and len(raw) == 1:
                  return raw[0]
              return raw

          def option_value(raw):
              value = return_value(raw)
              if value is None:
                  return None
              if isinstance(value, list):
                  if not value:
                      return None
                  return value[0]
              if isinstance(value, dict):
                  vec = value.get("vec")
                  if isinstance(vec, list):
                      return vec[0] if vec else None
              return value

          def integer_value(raw):
              value = return_value(raw)
              if isinstance(value, list):
                  if not value:
                      return None
                  value = value[0]
              if isinstance(value, dict) and "vec" in value:
                  vec = value["vec"]
                  value = vec[0] if vec else None
              return None if value is None else int(value)

          ledger = request_json(endpoint)
          chain_time = int(ledger["ledger_timestamp"]) // 1_000_000
          incentives_raw = view(
              f"{aave}::ui_incentive_data_provider_v3::get_reserves_incentives_data"
          )
          reserves_raw = view(
              f"{aave}::ui_pool_data_provider_v3::get_reserves_data"
          )
          (root / "ledger.json").write_text(json.dumps(ledger, indent=2) + "\n")
          (root / "incentives_raw.json").write_text(
              json.dumps(incentives_raw, indent=2) + "\n"
          )
          (root / "reserves_raw.json").write_text(
              json.dumps(reserves_raw, indent=2) + "\n"
          )

          incentives = return_value(incentives_raw)
          if not isinstance(incentives, list):
              raise TypeError(f"unexpected incentives response: {type(incentives)!r}")

          reserve_values = reserves_raw[0] if isinstance(reserves_raw, list) and reserves_raw else []
          reserve_by_underlying = {
              str(row.get("underlying_asset", "")).lower(): row
              for row in reserve_values
              if isinstance(row, dict)
          }

          rows = []
          candidates = []
          for reserve in incentives:
              underlying = str(reserve.get("underlying_asset", ""))
              reserve_data = reserve_by_underlying.get(underlying.lower(), {})
              for token_kind, key in (
                  ("aToken", "a_incentive_data"),
                  ("variableDebtToken", "v_incentive_data"),
              ):
                  token_data = reserve.get(key) or {}
                  token = str(token_data.get("token_address", "0x0"))
                  controller = str(
                      token_data.get("incentive_controller_address", "0x0")
                  )
                  supply_raw = view(
                      "0x1::dispatchable_fungible_asset::derived_supply",
                      [metadata_type],
                      [token],
                  )
                  token_supply = integer_value(supply_raw)
                  for reward in token_data.get("rewards_token_information") or []:
                      reward_token = str(reward.get("reward_token_address"))
                      emission = int(reward.get("emission_per_second", 0))
                      end = int(reward.get("emission_end_timestamp", 0))
                      strategy = None
                      vault = None
                      vault_balance = None
                      strategy_raw = None
                      vault_raw = None
                      balance_raw = None
                      if controller.lower() not in ("0x0", "0x"):
                          strategy_raw = view(
                              f"{aave}::rewards_controller::get_pull_rewards_transfer_strategy",
                              [],
                              [reward_token, controller],
                          )
                          strategy = option_value(strategy_raw)
                      if strategy:
                          vault_raw = view(
                              f"{aave}::transfer_strategy::pull_rewards_transfer_strategy_get_rewards_vault",
                              [],
                              [strategy],
                          )
                          vault = return_value(vault_raw)
                          if isinstance(vault, list):
                              vault = vault[0] if vault else None
                      if vault:
                          balance_raw = view(
                              "0x1::primary_fungible_store::balance",
                              [metadata_type],
                              [vault, reward_token],
                          )
                          vault_balance = integer_value(balance_raw)

                      active = emission > 0 and end > chain_time
                      zero_supply = token_supply == 0
                      funded = vault_balance is not None and vault_balance > 0
                      row = {
                          "underlying_asset": underlying,
                          "reserve_symbol": reserve_data.get("symbol"),
                          "reserve_name": reserve_data.get("name"),
                          "borrowing_enabled": reserve_data.get("borrowing_enabled"),
                          "token_kind": token_kind,
                          "token_address": token,
                          "token_supply": token_supply,
                          "controller": controller,
                          "reward_symbol": reward.get("reward_token_symbol"),
                          "reward_token": reward_token,
                          "emission_per_second": emission,
                          "last_update_timestamp": int(
                              reward.get("incentives_last_update_timestamp", 0)
                          ),
                          "emission_end_timestamp": end,
                          "chain_timestamp": chain_time,
                          "active_emission": active,
                          "zero_token_supply": zero_supply,
                          "transfer_strategy": strategy,
                          "rewards_vault": vault,
                          "rewards_vault_balance": vault_balance,
                          "vault_funded": funded,
                      }
                      rows.append(row)
                      if active and zero_supply and funded:
                          candidates.append(row)

          (root / "classified_incentives.json").write_text(
              json.dumps(rows, indent=2) + "\n"
          )
          (root / "zero_supply_active_reward_candidates.json").write_text(
              json.dumps(candidates, indent=2) + "\n"
          )
          summary = [
              f"chain_timestamp={chain_time}",
              f"reserves={len(incentives)}",
              f"reward_rows={len(rows)}",
              f"zero_supply_active_funded_candidates={len(candidates)}",
          ]
          for row in rows:
              summary.append(
                  f"{row['reserve_symbol']} {row['token_kind']} reward={row['reward_symbol']} "
                  f"supply={row['token_supply']} emission={row['emission_per_second']} "
                  f"end={row['emission_end_timestamp']} active={row['active_emission']} "
                  f"vault_balance={row['rewards_vault_balance']}"
              )
          (root / "summary.txt").write_text("\n".join(summary) + "\n")
          marker = (
              "LIVE_ZERO_SUPPLY_INCENTIVE_CANDIDATE"
              if candidates
              else "NO_LIVE_ZERO_SUPPLY_INCENTIVE_CANDIDATE"
          )
          (root / marker).write_text(marker + "\n")
          print((root / "summary.txt").read_text())
          PY
          find evidence/live-incentives -type f -print0 | sort -z | \
            xargs -0 sha256sum > evidence/live-incentives/SHA256SUMS.txt

      - name: Upload live incentive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-round7-live-incentives
          path: evidence/live-incentives
          retention-days: 7
          if-no-files-found: error

  multi-debt-liquidation:
    name: Verify multi-debt deficit and bitmap post-state
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact in-scope Aave revision
        uses: actions/checkout@v4
        with:
          repository: aave/aptos-aave-v3
          ref: 919362ba93c6291b25a31282b25d3def6e6357b9
          path: src
          fetch-depth: 1

      - name: Install Aptos CLI 9.5.0
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/aptos.zip \
            https://github.com/aptos-labs/aptos-core/releases/download/aptos-cli-v9.5.0/aptos-cli-9.5.0-Ubuntu-24.04-x86_64.zip
          echo "d8211cad689791639acb095d8ad06c3baa593c4c6216d2721414c9a66b252ed9  /tmp/aptos.zip" | sha256sum -c -
          unzip -q /tmp/aptos.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/aptos"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aptos" --version

      - name: Add strict cross-reserve invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/multi-debt
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/aave-core/tests/aave-logic/liquidation_logic_tests.move")
          source = path.read_text()
          function_name = "fun test_liquidation_when_has_no_collateral_left_and_user_has_borrowing_any"
          function_start = source.index(function_name)
          next_test = source.find("\n    #[", function_start + 1)
          function_end = len(source) if next_test < 0 else next_test
          prefix = source[:function_start]
          body = source[function_start:function_end]
          suffix = source[function_end:]

          before_anchor = '''        let (
            _, u1_current_variable_debt_before, _, _, _
        ) =
            pool_data_provider::get_user_reserve_data(
                underlying_u1_token_address, borrower_address
            );
'''
          before_insert = before_anchor + '''
        let (
            _, u0_current_variable_debt_before, _, _, _
        ) =
            pool_data_provider::get_user_reserve_data(
                underlying_u0_token_address, borrower_address
            );
        let u0_deficit_before =
            pool::get_reserve_deficit(
                pool::get_reserve_data(underlying_u0_token_address)
            );
        let u1_deficit_before =
            pool::get_reserve_deficit(
                pool::get_reserve_data(underlying_u1_token_address)
            );
'''
          if body.count(before_anchor) != 1:
              raise RuntimeError("before-anchor mismatch")
          body = body.replace(before_anchor, before_insert, 1)

          after_anchor = '''        let (
            _, u1_current_variable_debt_after, _, _, _
        ) =
            pool_data_provider::get_user_reserve_data(
                underlying_u1_token_address, borrower_address
            );
'''
          after_insert = after_anchor + '''
        let (
            _, u0_current_variable_debt_after, _, _, _
        ) =
            pool_data_provider::get_user_reserve_data(
                underlying_u0_token_address, borrower_address
            );
        let u0_deficit_after =
            pool::get_reserve_deficit(
                pool::get_reserve_data(underlying_u0_token_address)
            );
        let u1_deficit_after =
            pool::get_reserve_deficit(
                pool::get_reserve_data(underlying_u1_token_address)
            );
        let final_user_config = pool::get_user_configuration(borrower_address);
'''
          if body.count(after_anchor) != 1:
              raise RuntimeError("after-anchor mismatch")
          body = body.replace(after_anchor, after_insert, 1)

          final_anchor = '''        assert!(u1_current_variable_debt_after == 0, TEST_SUCCESS);
        assert!(u2_current_variable_debt_before == 0, TEST_SUCCESS);
'''
          final_insert = '''        assert!(u1_current_variable_debt_after == 0, TEST_SUCCESS);
        assert!(u0_current_variable_debt_after == 0, TEST_SUCCESS);
        assert!(
            u0_deficit_after
                == u0_deficit_before + (u0_current_variable_debt_before as u128),
            TEST_SUCCESS
        );
        assert!(u1_deficit_after == u1_deficit_before, TEST_SUCCESS);
        assert!(!user_config::is_borrowing_any(&final_user_config), TEST_SUCCESS);
        assert!(u2_current_variable_debt_before == 0, TEST_SUCCESS);
'''
          if body.count(final_anchor) != 1:
              raise RuntimeError("final-anchor mismatch")
          body = body.replace(final_anchor, final_insert, 1)

          path.write_text(prefix + body + suffix)
          PY
          git -C src diff -- aave-core/tests/aave-logic/liquidation_logic_tests.move \
            > evidence/multi-debt/STRICT_INVARIANTS.patch
          cp src/aave-core/tests/aave-logic/liquidation_logic_tests.move \
            evidence/multi-debt/liquidation_logic_tests_patched.move

      - name: Execute exact Move E2E test
        shell: bash
        run: |
          set -Eeuo pipefail
          NAMED="aave_acl=0x10,aave_config=0x11,aave_math=0x12,aave_oracle=0x13,aave_pool=0x14,aave_large_packages=0x15,aave_mock_underlyings=0x16,aave_data=0x17,data_feeds=0x18,platform=0x19,aave_oracle_racc_address=0x1a"
          set +e
          aptos move test \
            --package-dir src/aave-core \
            --ignore-compile-warnings \
            --skip-attribute-checks \
            --language-version 2.3 \
            --compiler-version 2.0 \
            --named-addresses "$NAMED" \
            --filter test_liquidation_when_has_no_collateral_left_and_user_has_borrowing_any \
            2>&1 | tee evidence/multi-debt/move_test.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > evidence/multi-debt/exit_code.txt
          if [ "$rc" -eq 0 ]; then
            echo "MULTI_DEBT_POST_STATE_INVARIANTS_PASS" | \
              tee evidence/multi-debt/MULTI_DEBT_POST_STATE_INVARIANTS_PASS
          else
            echo "MULTI_DEBT_TEST_REQUIRES_REVIEW" | \
              tee evidence/multi-debt/MULTI_DEBT_TEST_REQUIRES_REVIEW
          fi
          find evidence/multi-debt -type f -print0 | sort -z | \
            xargs -0 sha256sum > evidence/multi-debt/SHA256SUMS.txt
          exit "$rc"

      - name: Upload multi-debt E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-round7-multi-debt-e2e
          path: evidence/multi-debt
          retention-days: 7
          if-no-files-found: error
