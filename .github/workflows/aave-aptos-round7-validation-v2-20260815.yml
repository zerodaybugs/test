name: Aave Aptos Round 7 validation v2

on:
  push:
    branches:
      - aave-aptos-round7-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-incentives:
    name: Inspect live incentives and zero-supply reward state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FULLNODE: "https://api.mainnet.aptoslabs.com/v1"
      AAVE: "0x39ddcd9e1a39fa14f25e3f9ec8a86074d05cc0881cbf667df8a6ee70942016fb"
      EVIDENCE_DIR: "evidence/live-incentives"
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4

      - name: Query and classify live incentive state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/aave_round7_live_incentives.py
          find evidence/live-incentives -type f -print0 | sort -z | \
            xargs -0 sha256sum > evidence/live-incentives/SHA256SUMS.txt

      - name: Upload live incentive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-round7-live-incentives
          path: evidence/live-incentives
          retention-days: 7
          if-no-files-found: error

  multi-debt-liquidation:
    name: Verify multi-debt deficit and bitmap post-state
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4

      - name: Checkout exact in-scope Aave revision
        uses: actions/checkout@v4
        with:
          repository: aave/aptos-aave-v3
          ref: 919362ba93c6291b25a31282b25d3def6e6357b9
          path: src
          fetch-depth: 1

      - name: Install Aptos CLI 9.5.0
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/aptos.zip \
            https://github.com/aptos-labs/aptos-core/releases/download/aptos-cli-v9.5.0/aptos-cli-9.5.0-Ubuntu-24.04-x86_64.zip
          echo "d8211cad689791639acb095d8ad06c3baa593c4c6216d2721414c9a66b252ed9  /tmp/aptos.zip" | sha256sum -c -
          unzip -q /tmp/aptos.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/aptos"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aptos" --version

      - name: Add strict cross-reserve invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/multi-debt
          python3 tools/aave_round7_patch_multi_debt.py
          git -C src diff -- aave-core/tests/aave-logic/liquidation_logic_tests.move \
            > evidence/multi-debt/STRICT_INVARIANTS.patch
          cp src/aave-core/tests/aave-logic/liquidation_logic_tests.move \
            evidence/multi-debt/liquidation_logic_tests_patched.move

      - name: Execute exact Move E2E test
        shell: bash
        run: |
          set -Eeuo pipefail
          NAMED="aave_acl=0x10,aave_config=0x11,aave_math=0x12,aave_oracle=0x13,aave_pool=0x14,aave_large_packages=0x15,aave_mock_underlyings=0x16,aave_data=0x17,data_feeds=0x18,platform=0x19,aave_oracle_racc_address=0x1a"
          set +e
          aptos move test \
            --package-dir src/aave-core \
            --ignore-compile-warnings \
            --skip-attribute-checks \
            --language-version 2.3 \
            --compiler-version 2.0 \
            --named-addresses "$NAMED" \
            --filter test_liquidation_when_has_no_collateral_left_and_user_has_borrowing_any \
            2>&1 | tee evidence/multi-debt/move_test.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > evidence/multi-debt/exit_code.txt
          if [ "$rc" -eq 0 ]; then
            echo "MULTI_DEBT_POST_STATE_INVARIANTS_PASS" | \
              tee evidence/multi-debt/MULTI_DEBT_POST_STATE_INVARIANTS_PASS
          else
            echo "MULTI_DEBT_TEST_REQUIRES_REVIEW" | \
              tee evidence/multi-debt/MULTI_DEBT_TEST_REQUIRES_REVIEW
          fi
          find evidence/multi-debt -type f -print0 | sort -z | \
            xargs -0 sha256sum > evidence/multi-debt/SHA256SUMS.txt
          exit "$rc"

      - name: Upload multi-debt E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-round7-multi-debt-e2e
          path: evidence/multi-debt
          retention-days: 7
          if-no-files-found: error
