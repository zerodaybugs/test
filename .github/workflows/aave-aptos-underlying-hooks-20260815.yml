name: Aave Aptos underlying hook inventory

on:
  push:
    branches:
      - aave-aptos-underlying-hooks-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture token account resources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/resources evidence/modules
          cat > evidence/assets.json <<'JSON'
          {
            "USDt": "0x357b0b74bc833e95a115ad22604854d6b0fca151cecd94111770e5d6ffc9dc2b",
            "APT": "0xa",
            "sUSDe": "0xb30a694a344edee467d9f82330bbe7c3b89f440a1ecd2da1f3bca266560fce69",
            "USDC": "0xbae207659db88bea0cbead6da0ed00aac12edcdda169e591cd41c94180b46f3b"
          }
          JSON
          python3 - <<'PY'
          import json, pathlib, time, urllib.request
          assets=json.loads(pathlib.Path('evidence/assets.json').read_text())
          bases=['https://api.mainnet.aptoslabs.com/v1','https://fullnode.mainnet.aptoslabs.com/v1']
          for sym,addr in assets.items():
              last=None
              for base in bases:
                  try:
                      req=urllib.request.Request(f'{base}/accounts/{addr}/resources',headers={'User-Agent':'aave-aptos-hook-inventory'})
                      with urllib.request.urlopen(req,timeout=90) as r:
                          body=r.read()
                      pathlib.Path(f'evidence/resources/{sym}.json').write_bytes(body)
                      pathlib.Path(f'evidence/resources/{sym}.endpoint.txt').write_text(base+'\n')
                      break
                  except Exception as exc:
                      last=exc
                      time.sleep(1)
              else:
                  raise RuntimeError(f'{sym}: {last!r}')
          PY

      - name: Analyse dispatch and supply features
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib
          rows=[]
          for p in sorted(pathlib.Path('evidence/resources').glob('*.json')):
              sym=p.stem
              resources=json.loads(p.read_text())
              types=[r.get('type','') for r in resources]
              dispatch=[t for t in types if 'dispatch' in t.lower()]
              supply=[t for t in types if any(x in t for x in ('::fungible_asset::Supply','::fungible_asset::ConcurrentSupply','::fungible_asset::DeriveSupply'))]
              object_types=[t for t in types if '::object::ObjectCore' in t or '::fungible_asset::Metadata' in t]
              rows.append({
                  'symbol':sym,
                  'resource_count':len(resources),
                  'dispatch_resources':dispatch,
                  'supply_resources':supply,
                  'object_resources':object_types,
                  'has_dispatch':bool(dispatch),
                  'has_derive_supply':any('DeriveSupply' in t for t in types),
              })
          pathlib.Path('evidence/analysis.json').write_text(json.dumps(rows,indent=2))
          pathlib.Path('evidence/summary.txt').write_text('\n'.join(
              f"{r['symbol']}: resources={r['resource_count']} dispatch={r['has_dispatch']} derive_supply={r['has_derive_supply']} dispatch_types={r['dispatch_resources']}" for r in rows
          )+'\n')
          print(pathlib.Path('evidence/summary.txt').read_text())
          PY
          sha256sum evidence/assets.json evidence/resources/* evidence/analysis.json evidence/summary.txt > evidence/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-underlying-hook-inventory
          path: evidence
          retention-days: 7
          if-no-files-found: error
