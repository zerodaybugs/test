name: Aave Chainlink artifact inventory

on:
  push:
    branches:
      - aave-aptos-chainlink-raw-20260817
    paths:
      - research/aave_chainlink_artifact_inventory_20260818.py
      - .github/workflows/aave-chainlink-artifact-inventory-20260818.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aave-aptos-chainlink-raw-20260817

      - name: Download full public platform archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 32014639964 \
            --repo zerodaybugs/test \
            --name aptos-public-platform-archive-20260817 \
            --dir artifact

      - name: Build compact inventory
        run: python3 research/aave_chainlink_artifact_inventory_20260818.py

      - name: Commit inventory result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/results/aave_chainlink_artifact_inventory_20260818.json
          git diff --cached --quiet && exit 0
          git commit -m "research: record Aave Chainlink artifact inventory"
          git push origin HEAD:aave-aptos-chainlink-raw-20260817
