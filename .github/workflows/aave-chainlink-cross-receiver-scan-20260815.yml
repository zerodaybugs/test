name: Aave Aptos Chainlink cross receiver scan

on:
  push:
    branches:
      - aave-aptos-underlying-hooks-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REST: "https://api.mainnet.aptoslabs.com/v1"
      GRAPHQL: "https://indexer.mainnet.aptoslabs.com/v1/graphql"
      PLATFORM: "0x9976bb288ed9177b542d568fa1ac386819dc99141630e582315804840f41928a"
      DATA_FEEDS: "0x3f985798ce4975f430ef5c75776ff98a77b9f9d0fb38184d225adc9c1cc6b79b"
    steps:
      - name: Query forwarder report transactions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/transactions
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          graphql=os.environ['GRAPHQL']
          rest=os.environ['REST']
          platform=os.environ['PLATFORM']
          query='''query Reports($platform: String!, $limit: Int!, $offset: Int!) {
            user_transactions(
              where: {
                entry_function_contract_address: {_eq: $platform},
                entry_function_module_name: {_eq: "forwarder"},
                entry_function_function_name: {_eq: "report"}
              },
              order_by: {version: desc},
              limit: $limit,
              offset: $offset
            ) {
              version
              sender
              timestamp
              entry_function_id_str
            }
          }'''

          all_rows=[]
          page_size=500
          max_rows=5000
          for offset in range(0,max_rows,page_size):
              body=json.dumps({'query':query,'variables':{'platform':platform,'limit':page_size,'offset':offset}}).encode()
              req=urllib.request.Request(graphql,data=body,headers={'Content-Type':'application/json','User-Agent':'aave-chainlink-cross-receiver-scan-v2'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as response:
                      payload=json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raw=exc.read()
                  pathlib.Path(f'evidence/indexer_http_{offset}.txt').write_bytes(raw)
                  raise
              pathlib.Path(f'evidence/indexer_page_{offset}.json').write_text(json.dumps(payload,indent=2))
              if payload.get('errors'):
                  raise RuntimeError(payload['errors'])
              rows=payload.get('data',{}).get('user_transactions',[])
              all_rows.extend(rows)
              if len(rows)<page_size:
                  break
          versions=[]
          seen=set()
          for row in all_rows:
              v=str(row['version'])
              if v not in seen:
                  seen.add(v); versions.append(v)
          pathlib.Path('evidence/indexer_rows.json').write_text(json.dumps(all_rows,indent=2))

          errors=[]
          def fetch(v):
              target=pathlib.Path(f'evidence/transactions/{v}.json')
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(f'{rest}/transactions/by_version/{v}',headers={'User-Agent':'aave-chainlink-cross-receiver-scan-v2'})
                      with urllib.request.urlopen(req,timeout=120) as response:
                          raw=response.read()
                      target.write_bytes(raw)
                      return v,None
                  except Exception as exc:
                      time.sleep(0.25*(attempt+1))
                      last=repr(exc)
              return v,last

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as executor:
              for v,error in executor.map(fetch,versions):
                  if error is not None:
                      errors.append({'version':v,'error':error})
          pathlib.Path('evidence/fetch_errors.json').write_text(json.dumps(errors,indent=2))
          pathlib.Path('evidence/transaction_count.txt').write_text(
              f'indexer_rows={len(all_rows)}\nunique_transactions={len(versions)}\nfetch_errors={len(errors)}\n'
          )
          if errors:
              raise RuntimeError(f'failed transaction downloads: {errors[:5]}')
          PY

      - name: Query Aave feed and workflow state
        shell: bash
        run: |
          set -Eeuo pipefail
          for item in workflow feeds; do
            if [ "$item" = workflow ]; then fn=get_workflow_config; else fn=get_feeds; fi
            printf '{"function":"%s::registry::%s","type_arguments":[],"arguments":[]}' "$DATA_FEEDS" "$fn" > "/tmp/${item}.json"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 \
              -fsS -X POST "$REST/view" -H 'Content-Type: application/json' \
              --data-binary @"/tmp/${item}.json" -o "evidence/${item}.json"
          done

      - name: Parse replay candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          AAVE=os.environ['DATA_FEEDS'].lower()

          def as_bytes(value):
              if value is None:
                  return b''
              if isinstance(value,str):
                  s=value[2:] if value.startswith('0x') else value
                  try:
                      return bytes.fromhex(s)
                  except ValueError:
                      return value.encode()
              if isinstance(value,list):
                  return bytes(int(x) for x in value)
              raise TypeError(type(value))

          def parse_data(data):
              if len(data)<64:
                  return []
              u=lambda x:int.from_bytes(x,'big')
              if u(data[:32])!=32:
                  return []
              count=u(data[32:64])
              if count>100:
                  return []
              offset=64+32*count
              rows=[]
              for _ in range(count):
                  if offset+96>len(data):
                      break
                  outer=data[offset:offset+32]; offset+=32
                  marker=u(data[offset:offset+32]); offset+=32
                  length=u(data[offset:offset+32]); offset+=32
                  if marker!=64 or offset+length>len(data):
                      break
                  report=data[offset:offset+length]; offset+=length
                  inner=report[:32] if len(report)>=32 else b''
                  schema=int.from_bytes(inner[:2],'big') if len(inner)>=2 else None
                  ts=int.from_bytes(report[92:96],'big') if len(report)>=96 and schema in (3,4) else None
                  benchmark=int.from_bytes(report[192:224],'big') if len(report)>=224 and schema in (3,4) else None
                  rows.append({
                      'outer':'0x'+outer.hex(),
                      'inner':'0x'+inner.hex(),
                      'schema':schema,
                      'timestamp':ts,
                      'benchmark':str(benchmark) if benchmark is not None else None,
                      'report_len':len(report),
                  })
              return rows

          workflow=json.loads(Path('evidence/workflow.json').read_text())[0]
          allowed_owners={'0x'+as_bytes(x).hex() for x in workflow.get('allowed_workflow_owners',[])}
          allowed_names={'0x'+as_bytes(x).hex() for x in workflow.get('allowed_workflow_names',[])}
          feed_values=json.loads(Path('evidence/feeds.json').read_text())[0]
          aave_feeds={}
          for entry in feed_values:
              outer='0x'+as_bytes(entry.get('feed_id')).hex()
              feed=entry.get('feed',{})
              report=as_bytes(feed.get('report'))
              aave_feeds[outer]={
                  'description':feed.get('description'),
                  'timestamp':int(str(feed.get('observation_timestamp') or 0)),
                  'benchmark':str(feed.get('benchmark')),
                  'inner':'0x'+report[:32].hex() if len(report)>=32 else None,
              }

          parsed=[]
          candidates=[]
          for path in sorted(Path('evidence/transactions').glob('*.json'),key=lambda p:int(p.stem),reverse=True):
              tx=json.loads(path.read_text())
              payload=tx.get('payload',{})
              function=str(payload.get('function','')).lower()
              args=payload.get('arguments',[])
              if not function.endswith('::forwarder::report') or len(args)<3:
                  continue
              receiver=str(args[0]).lower()
              raw=as_bytes(args[1])
              if len(raw)<205:
                  continue
              report=raw[96:]
              if len(report)<109 or report[0]!=1:
                  continue
              metadata=report[45:109]
              workflow_name='0x'+metadata[32:42].hex()
              workflow_owner='0x'+metadata[42:62].hex()
              feeds=parse_data(report[109:])
              intersections=[]
              for feed in feeds:
                  current=aave_feeds.get(feed['outer'])
                  if current is None:
                      continue
                  intersections.append({
                      **feed,
                      'aave_description':current['description'],
                      'aave_current_timestamp':current['timestamp'],
                      'aave_current_benchmark':current['benchmark'],
                      'aave_current_inner':current['inner'],
                      'newer_than_aave':feed['timestamp'] is not None and feed['timestamp']>current['timestamp'],
                      'different_benchmark':feed['benchmark'] is not None and feed['benchmark']!=current['benchmark'],
                  })
              row={
                  'version':str(tx.get('version')),
                  'sender':tx.get('sender'),
                  'success':tx.get('success'),
                  'timestamp':tx.get('timestamp'),
                  'receiver':receiver,
                  'receiver_is_aave':receiver==AAVE,
                  'workflow_execution_id':'0x'+report[1:33].hex(),
                  'report_header_timestamp':int.from_bytes(report[33:37],'big'),
                  'don_id':int.from_bytes(report[37:41],'big'),
                  'config_version':int.from_bytes(report[41:45],'big'),
                  'workflow_cid':'0x'+metadata[:32].hex(),
                  'workflow_name':workflow_name,
                  'workflow_owner':workflow_owner,
                  'owner_allowed_by_aave':workflow_owner in allowed_owners,
                  'name_allowed_by_aave':not allowed_names or workflow_name in allowed_names,
                  'metadata_report_id':int.from_bytes(metadata[62:64],'big'),
                  'feed_count':len(feeds),
                  'feeds':feeds,
                  'aave_intersections':intersections,
              }
              parsed.append(row)
              if receiver!=AAVE and row['owner_allowed_by_aave'] and row['name_allowed_by_aave'] and intersections:
                  candidates.append(row)

          exploitable=[]
          for candidate in candidates:
              material=[item for item in candidate['aave_intersections'] if item['newer_than_aave'] and item['different_benchmark']]
              if material:
                  exploitable.append({**candidate,'material_intersections':material})

          Path('evidence/parsed_reports.json').write_text(json.dumps(parsed,indent=2))
          Path('evidence/cross_receiver_candidates.json').write_text(json.dumps(candidates,indent=2))
          Path('evidence/exploitable_candidates.json').write_text(json.dumps(exploitable,indent=2))
          summary=[
              f'parsed_reports={len(parsed)}',
              f'cross_receiver_candidates={len(candidates)}',
              f'exploitable_candidates={len(exploitable)}',
              f'allowed_owner_count={len(allowed_owners)}',
              f'allowed_name_count={len(allowed_names)}',
          ]
          for candidate in exploitable:
              summary.append(f"version={candidate['version']} receiver={candidate['receiver']} owner={candidate['workflow_owner']} material={len(candidate['material_intersections'])}")
              for item in candidate['material_intersections']:
                  summary.append(f"  {item['aave_description']}: ts={item['timestamp']} current={item['aave_current_timestamp']} value={item['benchmark']} current_value={item['aave_current_benchmark']}")
          Path('evidence/summary.txt').write_text('\n'.join(summary)+'\n')
          print(Path('evidence/summary.txt').read_text())
          PY
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-chainlink-cross-receiver-scan
          path: evidence
          retention-days: 7
          if-no-files-found: error
