name: Aave Origin source export

on:
  push:
    branches:
      - aave-aptos-underlying-hooks-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Aave Origin exact source
        uses: actions/checkout@v4
        with:
          repository: aave-dao/aave-v3-origin
          ref: cff15de6d1271b0c800fc001f4aea4c263e8a597
          path: origin
          persist-credentials: false

      - name: Record provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C origin rev-parse HEAD > origin/SOURCE_COMMIT.txt
          find origin -type f -not -path 'origin/.git/*' -print0 | sort -z | xargs -0 sha256sum > origin/SOURCE_MANIFEST.sha256
          rm -rf origin/.git

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: aave-v3-origin-cff15de-source
          path: origin
          retention-days: 1
          if-no-files-found: error
