name: Aave R19 live accounting
on:
  push:
    branches: [aave-r19-live-accounting-20260816]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run live accounting scan
        env:
          REST: "https://api.mainnet.aptoslabs.com/v1"
          AAVE_POOL: "0x39ddcd9e1a39fa14f25e3f9ec8a86074d05cc0881cbf667df8a6ee70942016fb"
          EVIDENCE_DIR: "evidence/aave-r19-live-accounting"
        run: |
          python3 research/aave_r19_live_accounting.py
          find evidence/aave-r19-live-accounting -type f -print0 | sort -z | xargs -0 sha256sum > evidence/aave-r19-live-accounting/SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-r19-live-accounting
          path: evidence/aave-r19-live-accounting
          retention-days: 7
          if-no-files-found: error
