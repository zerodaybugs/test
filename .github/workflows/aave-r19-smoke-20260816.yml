name: Aave R19 verified scan
on:
  push:
    branches: [aave-r19-full-chainlink-scan-20260816]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run receiver replay scan
        env:
          REST: "https://api.mainnet.aptoslabs.com/v1"
          GRAPHQL: "https://indexer.mainnet.aptoslabs.com/v1/graphql"
          DATA_FEEDS: "0x3f985798ce4975f430ef5c75776ff98a77b9f9d0fb38184d225adc9c1cc6b79b"
          PLATFORMS: "0x9976bb288ed9177b542d568fa1ac386819dc99141630e582315804840f41928a,0x3bcacb561438c55ce2a9da479df6ab486af55b2fb7070b700df36c097da732b8"
          MAX_ROWS_PER_PLATFORM: "1000"
          PAGE_SIZE: "100"
          EVIDENCE_DIR: "evidence/aave-r19-chainlink"
        run: |
          python3 research/aave_r19_full_chainlink_scan.py
          find evidence/aave-r19-chainlink -type f -print0 | sort -z | xargs -0 sha256sum > evidence/aave-r19-chainlink/SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-r19-chainlink-full-scan
          path: evidence/aave-r19-chainlink
          retention-days: 7
          if-no-files-found: error
