name: Aave R20 live user configuration scan v2
on:
  push:
    branches: [aave-r20-live-user-config-scan-20260816]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run hardened debt-bit scan
        env:
          REST: "https://api.mainnet.aptoslabs.com/v1"
          GRAPHQL: "https://indexer.mainnet.aptoslabs.com/v1/graphql"
          AAVE_POOL: "0x39ddcd9e1a39fa14f25e3f9ec8a86074d05cc0881cbf667df8a6ee70942016fb"
          EVIDENCE_DIR: "evidence/aave-r20-user-config-v2"
          PAGE_SIZE: "50"
          MAX_HOLDERS_PER_TOKEN: "10000"
        run: |
          python3 research/aave_r20_live_user_config_scan_v2.py
          find evidence/aave-r20-user-config-v2 -type f -print0 | sort -z | xargs -0 sha256sum > evidence/aave-r20-user-config-v2/SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-r20-live-user-config-v2
          path: evidence/aave-r20-user-config-v2
          retention-days: 7
          if-no-files-found: error
