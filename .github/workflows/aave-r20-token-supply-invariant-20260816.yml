name: Aave R20 token supply invariant
on:
  push:
    branches: [aave-r20-token-supply-invariant-20260816]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run token supply scan
        env:
          REST: "https://api.mainnet.aptoslabs.com/v1"
          AAVE_POOL: "0x39ddcd9e1a39fa14f25e3f9ec8a86074d05cc0881cbf667df8a6ee70942016fb"
          EVIDENCE_DIR: "evidence/aave-r20-token-supply"
        run: |
          python3 research/aave_r20_token_supply_invariant.py
          find evidence/aave-r20-token-supply -type f -print0 | sort -z | xargs -0 sha256sum > evidence/aave-r20-token-supply/SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-r20-token-supply-invariant
          path: evidence/aave-r20-token-supply
          retention-days: 7
          if-no-files-found: error
