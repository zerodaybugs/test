name: Aave Aptos exact source export

on:
  push:
    branches:
      - aave-aptos-hf-gift-rebuild-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Aave source
        uses: actions/checkout@v4
        with:
          repository: aave/aptos-aave-v3
          ref: 919362ba93c6291b25a31282b25d3def6e6357b9
          path: aave
          persist-credentials: false

      - name: Record provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C aave rev-parse HEAD > aave/SOURCE_COMMIT.txt
          git -C aave status --short > aave/SOURCE_STATUS.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: aave-aptos-exact-source-919362b
          path: aave
          include-hidden-files: true
          retention-days: 1
