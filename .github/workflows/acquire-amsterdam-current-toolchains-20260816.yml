name: Acquire current Amsterdam transition toolchains

on:
  push:
    branches:
      - tmp/amsterdam-toolchains-current-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geth-evm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Geth master
        uses: actions/checkout@v6
        with:
          repository: ethereum/go-ethereum
          ref: 6bb0588ad8e7f922e4ad5580f51265a4097af08f
          fetch-depth: 1
      - name: Set up module-declared Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and verify evm transition tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test "$(git rev-parse HEAD)" = "6bb0588ad8e7f922e4ad5580f51265a4097af08f"
          go build -trimpath -o out/geth-evm ./cmd/evm
          out/geth-evm version > out/version.txt
          git rev-parse HEAD > out/commit.txt
          go version > out/go-version.txt
          sha256sum out/geth-evm > out/SHA256SUMS
      - name: Upload Geth tool
        uses: actions/upload-artifact@v7
        with:
          name: geth-master-6bb0588-evm
          path: out
          retention-days: 1

  besu-evmtool:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact Besu main
        uses: actions/checkout@v6
        with:
          repository: besu-eth/besu
          ref: c2addd94244196d4713e38ea659be0d2581082e9
          fetch-depth: 1
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and package EvmTool
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c2addd94244196d4713e38ea659be0d2581082e9"
          ./gradlew --no-daemon :ethereum:evmtool:installDist
          mkdir -p out
          cp -a ethereum/evmtool/build/install/. out/install
          launcher=$(find out/install -type f -path '*/bin/*' -perm -u+x | head -1)
          test -n "$launcher"
          "$launcher" --help > out/help.txt
          git rev-parse HEAD > out/commit.txt
          java -version 2> out/java-version.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - name: Upload Besu tool
        uses: actions/upload-artifact@v7
        with:
          name: besu-main-c2addd9-evmtool
          path: out
          retention-days: 1

  execution-specs-wheelhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact execution-specs Amsterdam head
        uses: actions/checkout@v6
        with:
          repository: ethereum/execution-specs
          ref: 43e3cd1ec03dd550a2bd43746564b339e85fcd1d
          fetch-depth: 1
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Build portable wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "43e3cd1ec03dd550a2bd43746564b339e85fcd1d"
          python -m pip install --upgrade pip build wheel
          mkdir -p out/wheelhouse
          python -m pip wheel . packages/testing --wheel-dir out/wheelhouse
          python -m venv verify-venv
          verify-venv/bin/pip install --no-index --find-links out/wheelhouse ethereum-execution-testing
          verify-venv/bin/ethereum-spec-evm --help > out/ethereum-spec-evm-help.txt
          git rev-parse HEAD > out/commit.txt
          python --version > out/python-version.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - name: Upload reference wheelhouse
        uses: actions/upload-artifact@v7
        with:
          name: execution-specs-43e3cd1-wheelhouse-py313
          path: out
          retention-days: 1
