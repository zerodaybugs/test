name: Acquire exact public Besu 26.7.1 release
on:
  push:
    paths:
      - '.github/workflows/acquire-besu-26-7-1.yml'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify public release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o besu-26.7.1.tar.gz https://github.com/besu-eth/besu/releases/download/26.7.1/besu-26.7.1.tar.gz
          echo '7311ba20a585a016543a12417d2c822e850c6a6fc58e5128cdf770653951f6c7  besu-26.7.1.tar.gz' | sha256sum -c -
          sha256sum besu-26.7.1.tar.gz > ARCHIVE_SHA256.txt
          printf 'tag=26.7.1\nasset=besu-26.7.1.tar.gz\nsource=https://github.com/besu-eth/besu/releases/tag/26.7.1\n' > PROVENANCE.txt
      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: besu-26.7.1-exact-release
          path: |
            besu-26.7.1.tar.gz
            ARCHIVE_SHA256.txt
            PROVENANCE.txt
          retention-days: 1