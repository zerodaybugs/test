name: Acquire exact Besu 26.7.1 source

on:
  push:
    paths:
      - '.github/workflows/acquire-besu-26.7.1-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone exact public release tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/besu-eth/besu.git besu
          cd besu
          git checkout --detach 26.7.1
          git rev-parse HEAD | tee ../BESU_COMMIT.txt
          git tag --points-at HEAD | sort | tee ../BESU_TAGS.txt
          git status --porcelain=v1 | tee ../BESU_STATUS.txt
          git archive --format=tar.gz --prefix=besu-26.7.1-source/ -o ../besu-26.7.1-source.tar.gz HEAD
          cd ..
          sha256sum besu-26.7.1-source.tar.gz | tee BESU_SOURCE_SHA256.txt
          {
            echo 'repository=https://github.com/besu-eth/besu.git'
            echo 'requested_ref=26.7.1'
            echo "resolved_commit=$(cat BESU_COMMIT.txt)"
            echo 'archive_method=git archive HEAD'
          } > PROVENANCE.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: besu-26.7.1-exact-source
          path: |
            besu-26.7.1-source.tar.gz
            BESU_COMMIT.txt
            BESU_TAGS.txt
            BESU_STATUS.txt
            BESU_SOURCE_SHA256.txt
            PROVENANCE.txt
          if-no-files-found: error
          retention-days: 1
