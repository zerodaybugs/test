name: Acquire exact consensus client sources V10
on:
  push:
    paths:
      - '.github/workflows/acquire-consensus-clients-v10.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prysm-v7.1.8
            repo: https://github.com/OffchainLabs/prysm.git
            ref: 51b5a75ebbadf05af22bd2601b5baf7a9e99b66d
          - name: teku-26.8.0
            repo: https://github.com/Consensys/teku.git
            ref: 26.8.0
          - name: nimbus-v26.7.0
            repo: https://github.com/status-im/nimbus-eth2.git
            ref: v26.7.0
    steps:
      - name: Clone exact public revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "${{ matrix.repo }}" source
          cd source
          git checkout --detach "${{ matrix.ref }}"
          git rev-parse HEAD > ../COMMIT.txt
          git status --porcelain=v1 > ../GIT_STATUS.txt
          git remote get-url origin > ../ORIGIN.txt
          git submodule status --recursive > ../SUBMODULES.txt || true
          cd ..
          tar --exclude='.git' -czf "${{ matrix.name }}-source.tar.gz" source
          sha256sum "${{ matrix.name }}-source.tar.gz" > SOURCE_SHA256.txt
      - name: Upload exact public source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-exact-source
          path: |
            ${{ matrix.name }}-source.tar.gz
            COMMIT.txt
            GIT_STATUS.txt
            ORIGIN.txt
            SUBMODULES.txt
            SOURCE_SHA256.txt
          retention-days: 1