name: Acquire exact latest Prysm and Lighthouse sources
on:
  push:
    paths:
      - '.github/workflows/acquire-consensus-latest-sources-20260814.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prysm
            repo: OffchainLabs/prysm
          - name: lighthouse
            repo: sigp/lighthouse
    steps:
      - name: Resolve exact latest release and clone
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL "https://api.github.com/repos/${{ matrix.repo }}/releases/latest" | jq -r .tag_name)
          test -n "$tag" && test "$tag" != null
          git clone --depth 1 --branch "$tag" "https://github.com/${{ matrix.repo }}.git" source
          cd source
          commit=$(git rev-parse HEAD)
          git status --porcelain=v1 > ../GIT_STATUS.txt
          printf 'repository=%s\ntag=%s\ncommit=%s\n' '${{ matrix.repo }}' "$tag" "$commit" > ../PROVENANCE.txt
          git archive --format=tar.gz --prefix="${{ matrix.name }}-${tag}/" -o "../${{ matrix.name }}-${tag}-source.tar.gz" HEAD
          cd ..
          sha256sum "${{ matrix.name }}-${tag}-source.tar.gz" > SOURCE_SHA256.txt
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-latest-exact-source
          path: |
            *-source.tar.gz
            PROVENANCE.txt
            SOURCE_SHA256.txt
            GIT_STATUS.txt
          retention-days: 1