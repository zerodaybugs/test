name: Acquire exact current Ethereum transition tools

on:
  push:
    branches:
      - tmp/current-ethereum-tools-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geth-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact current Geth
        uses: actions/checkout@v6
        with:
          repository: ethereum/go-ethereum
          ref: 6017c756e2b07fc39a8b51af39c80dd6a4d8d185
          fetch-depth: 1
      - name: Set up module-declared Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build current Geth tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bin out/provenance
          test "$(git rev-parse HEAD)" = "6017c756e2b07fc39a8b51af39c80dd6a4d8d185"
          go build -trimpath -o out/bin/evm ./cmd/evm
          go build -trimpath -o out/bin/geth ./cmd/geth
          out/bin/evm --help > out/evm-help.txt
          out/bin/evm t8n --help > out/evm-t8n-help.txt
          out/bin/geth version > out/geth-version.txt
          git rev-parse HEAD > out/provenance/commit.txt
          git show -s --format=fuller HEAD > out/provenance/commit-full.txt
          go version > out/provenance/go-version.txt
          git status --short > out/provenance/git-status.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - name: Upload current Geth tools
        uses: actions/upload-artifact@v7
        with:
          name: geth-current-6017c75-tools
          path: out
          retention-days: 1

  besu-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact current Besu
        uses: actions/checkout@v6
        with:
          repository: besu-eth/besu
          ref: 89cbd0a2775e18a8681f64c40fcd98d9f6b087af
          fetch-depth: 1
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build current Besu EvmTool
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "89cbd0a2775e18a8681f64c40fcd98d9f6b087af"
          ./gradlew --no-daemon :ethereum:evmtool:installDist
          mkdir -p out/install out/provenance
          cp -a ethereum/evmtool/build/install/. out/install/
          launcher=$(find out/install -type f -path '*/bin/*' -perm -u+x | head -1)
          test -n "$launcher"
          "$launcher" --help > out/evmtool-help.txt
          git rev-parse HEAD > out/provenance/commit.txt
          git show -s --format=fuller HEAD > out/provenance/commit-full.txt
          java -version 2> out/provenance/java-version.txt
          git status --short > out/provenance/git-status.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - name: Upload current Besu EvmTool
        uses: actions/upload-artifact@v7
        with:
          name: besu-current-89cbd0a-evmtool
          path: out
          retention-days: 1
