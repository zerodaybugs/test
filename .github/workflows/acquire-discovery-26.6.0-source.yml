name: Acquire exact ConsenSys discovery 26.6.0 source

on:
  push:
    paths:
      - '.github/workflows/acquire-discovery-26.6.0-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone exact public release tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ConsenSys/discovery.git discovery
          cd discovery
          git checkout --detach 26.6.0
          git rev-parse HEAD | tee ../DISCOVERY_COMMIT.txt
          git tag --points-at HEAD | sort | tee ../DISCOVERY_TAGS.txt
          git status --porcelain=v1 | tee ../DISCOVERY_STATUS.txt
          git archive --format=tar.gz --prefix=discovery-26.6.0-source/ -o ../discovery-26.6.0-source.tar.gz HEAD
          cd ..
          sha256sum discovery-26.6.0-source.tar.gz | tee DISCOVERY_SOURCE_SHA256.txt
          {
            echo 'repository=https://github.com/ConsenSys/discovery.git'
            echo 'requested_ref=26.6.0'
            echo "resolved_commit=$(cat DISCOVERY_COMMIT.txt)"
            echo 'archive_method=git archive HEAD'
          } > PROVENANCE.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: discovery-26.6.0-exact-source
          path: |
            discovery-26.6.0-source.tar.gz
            DISCOVERY_COMMIT.txt
            DISCOVERY_TAGS.txt
            DISCOVERY_STATUS.txt
            DISCOVERY_SOURCE_SHA256.txt
            PROVENANCE.txt
          if-no-files-found: error
          retention-days: 1
