name: Acquire exact .NET 10.0.100 SDK Linux x64

on:
  push:
    branches:
      - tmp/dotnet-10-sdk-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_ROOT: ${{ github.workspace }}/dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Install exact SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Archive SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          dotnet --info | tee out/DOTNET_INFO.txt
          actual_root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          printf 'ACTUAL_DOTNET_ROOT=%s\n' "$actual_root" > out/PROVENANCE.txt
          tar --zstd -cf out/dotnet-sdk-10.0.100-linux-x64.tar.zst -C "$actual_root" .
          sha256sum out/dotnet-sdk-10.0.100-linux-x64.tar.zst > out/SHA256SUMS
          du -sh "$actual_root" > out/SIZE.txt

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.100-linux-x64
          path: out
          if-no-files-found: error
          retention-days: 1
