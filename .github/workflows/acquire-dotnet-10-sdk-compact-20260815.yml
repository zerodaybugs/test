name: Acquire compact .NET 10.0.100 SDK Linux x64

on:
  push:
    branches:
      - tmp/dotnet-10-sdk-compact-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install only exact SDK into isolated directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dotnet" out
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --version 10.0.100 --install-dir "$GITHUB_WORKSPACE/dotnet" --architecture x64 --os linux --no-path
          "$GITHUB_WORKSPACE/dotnet/dotnet" --info | tee out/DOTNET_INFO.txt
          tar --zstd -cf out/dotnet-sdk-10.0.100-linux-x64-compact.tar.zst -C "$GITHUB_WORKSPACE/dotnet" .
          sha256sum out/dotnet-sdk-10.0.100-linux-x64-compact.tar.zst > out/SHA256SUMS
          du -sh "$GITHUB_WORKSPACE/dotnet" > out/SIZE.txt

      - name: Upload compact SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.100-linux-x64-compact
          path: out
          if-no-files-found: error
          retention-days: 1
