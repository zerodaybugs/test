name: Acquire public Go toolchain and Geth module cache

"on":
  push:
    branches:
      - tmp/geth-official-url-seed-20260813
    paths:
      - ".github/workflows/acquire-geth-go-toolchain.yml"

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone exact public source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.17.5 https://github.com/ethereum/go-ethereum.git geth
          cd geth
          test "$(git rev-parse HEAD)" = "9621c6ad10934a01b5514886fb6fbd87640b6c05"

      - name: Set up exact module-declared Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: false

      - name: Download public module dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd geth
          go version
          go env
          go mod download
          go test ./rlp ./eth/protocols/snap ./eth/fetcher -run '^$' -count=1

      - name: Package toolchain and module cache
        shell: bash
        run: |
          set -euxo pipefail
          GOROOT_PATH="$(go env GOROOT)"
          GOMODCACHE_PATH="$(go env GOMODCACHE)"
          printf 'go_version=%s\ngoroot=%s\ngomodcache=%s\n' "$(go version)" "$GOROOT_PATH" "$GOMODCACHE_PATH" > TOOLCHAIN_PROVENANCE.txt
          tar --sort=name --mtime='UTC 2026-08-13' --owner=0 --group=0 --numeric-owner \
            -czf go-toolchain.tar.gz -C "$(dirname "$GOROOT_PATH")" "$(basename "$GOROOT_PATH")"
          tar --sort=name --mtime='UTC 2026-08-13' --owner=0 --group=0 --numeric-owner \
            -czf go-modcache.tar.gz -C "$(dirname "$GOMODCACHE_PATH")" "$(basename "$GOMODCACHE_PATH")"
          sha256sum go-toolchain.tar.gz go-modcache.tar.gz > TOOLCHAIN_SHA256.txt
          ls -lh go-toolchain.tar.gz go-modcache.tar.gz

      - name: Upload Go toolchain
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-for-geth-v1.17.5
          path: |
            go-toolchain.tar.gz
            TOOLCHAIN_PROVENANCE.txt
            TOOLCHAIN_SHA256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload Go module cache
        uses: actions/upload-artifact@v4
        with:
          name: go-modcache-for-geth-v1.17.5
          path: |
            go-modcache.tar.gz
            TOOLCHAIN_PROVENANCE.txt
            TOOLCHAIN_SHA256.txt
          if-no-files-found: error
          retention-days: 1
