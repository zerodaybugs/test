name: Acquire exact Geth master 393555b source
on:
  push:
    paths:
      - '.github/workflows/acquire-geth-master-393555b.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ethereum/go-ethereum.git repo
          cd repo
          git checkout --detach 393555b0977c97d502fcf8c25685e5f6042142d7
          git status --porcelain=v1 > ../GIT_STATUS.txt
          git log -1 --format=fuller > ../PROVENANCE.txt
          git rev-parse HEAD > ../COMMIT.txt
          git rev-parse HEAD^{tree} > ../TREE.txt
          rm -rf .git
          cd ..
          tar -czf go-ethereum-master-393555b-source.tar.gz repo
          sha256sum go-ethereum-master-393555b-source.tar.gz > ARCHIVE_SHA256.txt
      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: go-ethereum-master-393555b-exact-source
          path: |
            go-ethereum-master-393555b-source.tar.gz
            PROVENANCE.txt
            COMMIT.txt
            TREE.txt
            GIT_STATUS.txt
            ARCHIVE_SHA256.txt
          retention-days: 1