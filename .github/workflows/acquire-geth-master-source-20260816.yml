name: Acquire exact current Geth source

on:
  push:
    branches:
      - tmp/geth-master-source-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current Geth source
        uses: actions/checkout@v6
        with:
          repository: ethereum/go-ethereum
          ref: 6bb0588ad8e7f922e4ad5580f51265a4097af08f
          fetch-depth: 1
      - name: Archive verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test "$(git rev-parse HEAD)" = "6bb0588ad8e7f922e4ad5580f51265a4097af08f"
          git rev-parse HEAD > out/commit.txt
          git status --porcelain=v1 > out/git-status.txt
          tar --zstd -cf out/go-ethereum-6bb0588-source.tar.zst \
            --exclude=.git --exclude=out .
          sha256sum out/go-ethereum-6bb0588-source.tar.zst > out/SHA256SUMS
      - name: Upload source
        uses: actions/upload-artifact@v7
        with:
          name: go-ethereum-6bb0588-exact-source
          path: out
          retention-days: 1
