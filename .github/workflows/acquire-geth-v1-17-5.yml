name: Acquire exact public Geth v1.17.5 source

"on":
  push:
    branches:
      - tmp/geth-official-url-seed-20260813
    paths:
      - ".github/workflows/acquire-geth-v1-17-5.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone exact public source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.17.5 https://github.com/ethereum/go-ethereum.git go-ethereum-v1.17.5
          cd go-ethereum-v1.17.5
          test "$(git rev-parse HEAD)" = "9621c6ad10934a01b5514886fb6fbd87640b6c05"
          git status --porcelain=v1
          git show -s --format=fuller HEAD > ../PROVENANCE.txt
          printf 'commit=%s\ntree=%s\ntag=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" \
            "$(git describe --tags --exact-match)" >> ../PROVENANCE.txt
          cd ..
          rm -rf go-ethereum-v1.17.5/.git
          find go-ethereum-v1.17.5 -type f -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256SUMS.txt
          tar --sort=name --mtime='UTC 2026-07-27' --owner=0 --group=0 --numeric-owner \
            -czf go-ethereum-v1.17.5-source.tar.gz go-ethereum-v1.17.5 PROVENANCE.txt SOURCE_SHA256SUMS.txt
          sha256sum go-ethereum-v1.17.5-source.tar.gz > ARCHIVE_SHA256.txt

      - name: Upload exact public source archive
        uses: actions/upload-artifact@v4
        with:
          name: go-ethereum-v1.17.5-exact-source
          path: |
            go-ethereum-v1.17.5-source.tar.gz
            PROVENANCE.txt
            SOURCE_SHA256SUMS.txt
            ARCHIVE_SHA256.txt
          if-no-files-found: error
          retention-days: 1
