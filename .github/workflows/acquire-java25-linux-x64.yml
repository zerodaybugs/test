name: Acquire Java 25 Linux x64

on:
  push:
    paths:
      - '.github/workflows/acquire-java25-linux-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Temurin Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Archive exact installed toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee JAVA_VERSION.txt
          javac -version 2>&1 | tee JAVAC_VERSION.txt
          printf '%s\n' "$JAVA_HOME" | tee JAVA_HOME.txt
          tar -C "$JAVA_HOME" -czf java-25-linux-x64.tar.gz .
          sha256sum java-25-linux-x64.tar.gz | tee JAVA25_SHA256.txt
          {
            echo 'distribution=temurin'
            echo 'requested_version=25'
            echo "resolved_java=$(java -version 2>&1 | head -1)"
            echo "resolved_javac=$(javac -version 2>&1)"
            echo "runner=$(uname -a)"
          } > PROVENANCE.txt

      - name: Upload Java 25
        uses: actions/upload-artifact@v4
        with:
          name: java-25-linux-x64
          path: |
            java-25-linux-x64.tar.gz
            JAVA_VERSION.txt
            JAVAC_VERSION.txt
            JAVA_HOME.txt
            JAVA25_SHA256.txt
            PROVENANCE.txt
          if-no-files-found: error
          retention-days: 1
