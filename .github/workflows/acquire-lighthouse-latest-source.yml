name: Acquire current Lighthouse release source

on:
  push:
    paths:
      - '.github/workflows/acquire-lighthouse-latest-source.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve current non-prerelease release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl -fsSL --retry 3 https://api.github.com/repos/sigp/lighthouse/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"$json")"
          commit="$(git ls-remote https://github.com/sigp/lighthouse.git "refs/tags/${tag}^{}" | awk 'NR==1{print $1}')"
          if [ -z "$commit" ]; then
            commit="$(git ls-remote https://github.com/sigp/lighthouse.git "refs/tags/${tag}" | awk 'NR==1{print $1}')"
          fi
          test -n "$tag"
          test -n "$commit"
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" | tee RELEASE.txt
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Clone exact release and archive source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sigp/lighthouse.git lighthouse
          cd lighthouse
          git checkout --detach '${{ steps.release.outputs.commit }}'
          test "$(git rev-parse HEAD)" = '${{ steps.release.outputs.commit }}'
          git status --porcelain=v1 | tee ../GIT_STATUS.txt
          test ! -s ../GIT_STATUS.txt
          git show -s --format=fuller HEAD | tee ../COMMIT.txt
          git archive --format=tar.gz --prefix=lighthouse-current/ HEAD > ../lighthouse-current-source.tar.gz
          cd ..
          sha256sum lighthouse-current-source.tar.gz > SHA256SUMS.txt
          printf 'repository=https://github.com/sigp/lighthouse\ntag=%s\ncommit=%s\n' \
            '${{ steps.release.outputs.tag }}' '${{ steps.release.outputs.commit }}' > PROVENANCE.txt

      - name: Upload exact public source
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-current-exact-source
          path: |
            lighthouse-current-source.tar.gz
            RELEASE.txt
            COMMIT.txt
            GIT_STATUS.txt
            PROVENANCE.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
