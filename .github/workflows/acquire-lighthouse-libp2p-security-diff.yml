name: Acquire Lighthouse libp2p revisions
on:
  push:
    paths:
      - '.github/workflows/acquire-lighthouse-libp2p-security-diff.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Archive exact public revisions
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sigp/rust-libp2p.git source
          cd source
          git checkout --detach 3563de5ed20e509885592b391aa816992eef55d4
          git archive --format=tar.gz --prefix=rust-libp2p-old/ HEAD > ../rust-libp2p-old.tar.gz
          git checkout --detach c774d4e71357d7cd2f792c4767d616d2dd369ee3
          git archive --format=tar.gz --prefix=rust-libp2p-new/ HEAD > ../rust-libp2p-new.tar.gz
          cd ..
          sha256sum rust-libp2p-old.tar.gz rust-libp2p-new.tar.gz > SOURCE_SHA256.txt
          printf 'old=3563de5ed20e509885592b391aa816992eef55d4\nnew=c774d4e71357d7cd2f792c4767d616d2dd369ee3\n' > PROVENANCE.txt
      - name: Upload exact sources
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-libp2p-exact-revisions
          path: |
            rust-libp2p-old.tar.gz
            rust-libp2p-new.tar.gz
            SOURCE_SHA256.txt
            PROVENANCE.txt
          retention-days: 1