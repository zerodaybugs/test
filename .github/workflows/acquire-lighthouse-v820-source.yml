name: Acquire exact Lighthouse v8.2.0 source
on:
  push:
    paths:
      - '.github/workflows/acquire-lighthouse-v820-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone exact public release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sigp/lighthouse.git source
          cd source
          git checkout --detach 120c3c6dac9df8ee4d83f055919bd3488abae4f6
          test "$(git rev-parse HEAD)" = "120c3c6dac9df8ee4d83f055919bd3488abae4f6"
          git status --porcelain=v1 > ../GIT_STATUS.txt
          git show -s --format=fuller HEAD > ../COMMIT.txt
          git archive --format=tar.gz --prefix=lighthouse-v8.2.0/ HEAD > ../lighthouse-v8.2.0-source.tar.gz
          cd ..
          sha256sum lighthouse-v8.2.0-source.tar.gz > SOURCE_SHA256.txt
          printf 'tag=v8.2.0\ncommit=120c3c6dac9df8ee4d83f055919bd3488abae4f6\n' > PROVENANCE.txt
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v8.2.0-exact-source
          path: |
            lighthouse-v8.2.0-source.tar.gz
            SOURCE_SHA256.txt
            PROVENANCE.txt
            COMMIT.txt
            GIT_STATUS.txt
          retention-days: 1