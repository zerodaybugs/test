name: Acquire exact Lighthouse v8.2.1 source
on:
  push:
    paths:
      - '.github/workflows/acquire-lighthouse-v821-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone exact public release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sigp/lighthouse.git source
          cd source
          git checkout --detach b263df596671a2bd42bf1034e1cdc8188ba8a9b0
          test "$(git rev-parse HEAD)" = "b263df596671a2bd42bf1034e1cdc8188ba8a9b0"
          git status --porcelain=v1 > ../GIT_STATUS.txt
          git show -s --format=fuller HEAD > ../COMMIT.txt
          git archive --format=tar.gz --prefix=lighthouse-v8.2.1/ HEAD > ../lighthouse-v8.2.1-source.tar.gz
          cd ..
          sha256sum lighthouse-v8.2.1-source.tar.gz > SOURCE_SHA256.txt
          printf 'tag=v8.2.1\ncommit=b263df596671a2bd42bf1034e1cdc8188ba8a9b0\n' > PROVENANCE.txt
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v8.2.1-exact-source
          path: |
            lighthouse-v8.2.1-source.tar.gz
            SOURCE_SHA256.txt
            PROVENANCE.txt
            COMMIT.txt
            GIT_STATUS.txt
          retention-days: 1