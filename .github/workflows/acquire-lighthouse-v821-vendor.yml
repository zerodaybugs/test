name: Acquire exact Lighthouse v8.2.1 vendor
on:
  push:
    paths:
      - '.github/workflows/acquire-lighthouse-v821-vendor.yml'
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone exact public release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sigp/lighthouse.git source
          cd source
          git checkout --detach b263df596671a2bd42bf1034e1cdc8188ba8a9b0
          test "$(git rev-parse HEAD)" = "b263df596671a2bd42bf1034e1cdc8188ba8a9b0"
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Vendor locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo vendor --locked ../vendor > ../cargo-vendor-config.toml
          cd ..
          tar -czf lighthouse-v8.2.1-vendor.tar.gz vendor cargo-vendor-config.toml
          sha256sum lighthouse-v8.2.1-vendor.tar.gz > SHA256SUMS.txt
          rustc --version > RUST_VERSION.txt
          cargo --version > CARGO_VERSION.txt
          printf 'tag=v8.2.1\ncommit=b263df596671a2bd42bf1034e1cdc8188ba8a9b0\n' > PROVENANCE.txt
      - name: Upload exact vendor
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-v8.2.1-vendor
          path: |
            lighthouse-v8.2.1-vendor.tar.gz
            cargo-vendor-config.toml
            SHA256SUMS.txt
            RUST_VERSION.txt
            CARGO_VERSION.txt
            PROVENANCE.txt
          retention-days: 1