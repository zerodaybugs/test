name: Acquire exact Nethermind 1.39.3 V10
on:
  push:
    paths:
      - '.github/workflows/acquire-nethermind-v1393-v10.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NethermindEth/nethermind.git source
          cd source
          git checkout --detach 28cbe2a0ae28373f66abdc584f3eaf21516e84b3
          test "$(git rev-parse HEAD)" = "28cbe2a0ae28373f66abdc584f3eaf21516e84b3"
          git rev-parse HEAD > ../COMMIT.txt
          git status --porcelain=v1 > ../GIT_STATUS.txt
          git remote get-url origin > ../ORIGIN.txt
          cd ..
          tar --exclude='.git' -czf nethermind-1.39.3-exact-source.tar.gz source
          sha256sum nethermind-1.39.3-exact-source.tar.gz > SOURCE_SHA256.txt
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: nethermind-1.39.3-exact-source
          path: |
            nethermind-1.39.3-exact-source.tar.gz
            COMMIT.txt
            GIT_STATUS.txt
            ORIGIN.txt
            SOURCE_SHA256.txt
          retention-days: 1
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official Linux x64 release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o nethermind-1.39.3-linux-x64.zip https://github.com/NethermindEth/nethermind/releases/download/1.39.3/nethermind-1.39.3-28cbe2a0-linux-x64.zip
          echo '8766fd72642b5b4238db48d34eb3f77aaf14c918dc88a1e7014252b0b829270c  nethermind-1.39.3-linux-x64.zip' | sha256sum -c -
          sha256sum nethermind-1.39.3-linux-x64.zip > BINARY_SHA256.txt
          printf 'tag=1.39.3\ncommit=28cbe2a0ae28373f66abdc584f3eaf21516e84b3\n' > PROVENANCE.txt
      - name: Upload exact binary
        uses: actions/upload-artifact@v4
        with:
          name: nethermind-1.39.3-linux-x64
          path: |
            nethermind-1.39.3-linux-x64.zip
            BINARY_SHA256.txt
            PROVENANCE.txt
          retention-days: 1