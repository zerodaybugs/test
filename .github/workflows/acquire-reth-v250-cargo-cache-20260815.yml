name: Acquire exact Reth v2.5.0 Cargo cache

on:
  push:
    branches:
      - tmp/reth-v250-cargo-cache-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_HOME: ${{ github.workspace }}/cargo-home
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact Reth source
        uses: actions/checkout@v4
        with:
          repository: paradigmxyz/reth
          ref: v2.5.0
          path: reth
          fetch-depth: 1

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Fetch exact eth-wire dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git -C reth rev-parse HEAD | tee out/commit.txt
          git -C reth describe --tags --exact-match | tee out/tag.txt
          rustc --version --verbose | tee out/rustc.txt
          cargo --version --verbose | tee out/cargo.txt
          cargo fetch --locked --manifest-path reth/crates/net/eth-wire/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo metadata --locked --manifest-path reth/crates/net/eth-wire/Cargo.toml --format-version 1 --no-deps > out/metadata.json
          du -sh "$CARGO_HOME" | tee out/cargo-home-size.txt
          tar --zstd -cf out/reth-v2.5.0-cargo-home.tar.zst -C "$CARGO_HOME" .
          sha256sum out/reth-v2.5.0-cargo-home.tar.zst | tee out/SHA256SUMS

      - name: Upload exact dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: reth-v2.5.0-cargo-cache
          path: out
          if-no-files-found: error
          retention-days: 1
