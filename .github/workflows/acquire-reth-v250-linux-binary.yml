name: Acquire exact Reth v2.5.0 Linux binary

"on":
  push:
    branches:
      - tmp/geth-official-url-seed-20260813
    paths:
      - ".github/workflows/acquire-reth-v250-linux-binary.yml"

permissions:
  contents: read

jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and verify official release
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o reth-v2.5.0-x86_64-unknown-linux-gnu.tar.gz \
            https://github.com/paradigmxyz/reth/releases/download/v2.5.0/reth-v2.5.0-x86_64-unknown-linux-gnu.tar.gz
          echo '6719ec675744c279dadab1269a15b3afb6ed153839aa87ccad7c2d119d48f47f  reth-v2.5.0-x86_64-unknown-linux-gnu.tar.gz' | sha256sum -c -
          mkdir extract
          tar -xzf reth-v2.5.0-x86_64-unknown-linux-gnu.tar.gz -C extract
          find extract -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | tee CONTENTS.txt
          find extract -type f -name reth -exec {} --version \; | tee VERSION.txt
          sha256sum reth-v2.5.0-x86_64-unknown-linux-gnu.tar.gz > ARCHIVE_SHA256.txt
      - name: Upload verified binary
        uses: actions/upload-artifact@v4
        with:
          name: reth-v2.5.0-linux-x86_64-exact
          path: |
            reth-v2.5.0-x86_64-unknown-linux-gnu.tar.gz
            ARCHIVE_SHA256.txt
            CONTENTS.txt
            VERSION.txt
          retention-days: 1
