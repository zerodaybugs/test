name: Acquire exact Reth v2.5.0 source

"on":
  push:
    branches:
      - tmp/geth-official-url-seed-20260813
    paths:
      - ".github/workflows/acquire-reth-v250-source.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone exact public source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/paradigmxyz/reth.git reth
          cd reth
          git checkout --detach v2.5.0
          git rev-parse HEAD | tee ../RETH_COMMIT.txt
          git describe --tags --exact-match | tee ../RETH_TAG.txt
          git status --porcelain=v1 | tee ../RETH_STATUS.txt
          git archive --format=tar.gz --prefix=reth-v2.5.0/ HEAD > ../reth-v2.5.0-source.tar.gz
          cd ..
          sha256sum reth-v2.5.0-source.tar.gz > RETH_SOURCE_SHA256.txt
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: reth-v2.5.0-exact-source
          path: |
            reth-v2.5.0-source.tar.gz
            RETH_COMMIT.txt
            RETH_TAG.txt
            RETH_STATUS.txt
            RETH_SOURCE_SHA256.txt
          retention-days: 1
