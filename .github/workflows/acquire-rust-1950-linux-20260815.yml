name: Acquire exact Rust 1.95.0 Linux toolchain

on:
  push:
    branches:
      - tmp/rust-1950-toolchain-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install exact toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Archive exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          rustc --version --verbose | tee out/rustc.txt
          cargo --version --verbose | tee out/cargo.txt
          rustup show active-toolchain | tee out/active-toolchain.txt
          name=$(rustup show active-toolchain | awk '{print $1}')
          dir="$HOME/.rustup/toolchains/$name"
          test -d "$dir"
          tar --zstd -cf out/rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst -C "$dir" .
          sha256sum out/rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst | tee out/SHA256SUMS
          du -sh "$dir" | tee out/toolchain-size.txt

      - name: Upload exact toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.95.0-linux-x86_64
          path: out
          if-no-files-found: error
          retention-days: 1
