name: Acquire Rust 1.88 and exact libp2p vendor
on:
  push:
    paths:
      - '.github/workflows/acquire-rust188-libp2p-vendor.yml'
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone exact public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sigp/rust-libp2p.git source
          cd source
          git checkout --detach c774d4e71357d7cd2f792c4767d616d2dd369ee3
          test "$(git rev-parse HEAD)" = "c774d4e71357d7cd2f792c4767d616d2dd369ee3"
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Vendor locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo vendor --locked ../vendor > ../cargo-vendor-config.toml
          cd ..
          rustc --version > RUST_VERSION.txt
          cargo --version > CARGO_VERSION.txt
          tar -C "$HOME/.rustup/toolchains" -czf rust-1.88.0-x86_64-unknown-linux-gnu.tar.gz 1.88.0-x86_64-unknown-linux-gnu
          tar -czf libp2p-vendor-c774d4e.tar.gz vendor cargo-vendor-config.toml
          sha256sum rust-1.88.0-x86_64-unknown-linux-gnu.tar.gz libp2p-vendor-c774d4e.tar.gz > SHA256SUMS.txt
          printf 'source_commit=c774d4e71357d7cd2f792c4767d616d2dd369ee3\n' > PROVENANCE.txt
      - name: Upload Rust toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.88.0-linux-x86_64
          path: |
            rust-1.88.0-x86_64-unknown-linux-gnu.tar.gz
            RUST_VERSION.txt
            CARGO_VERSION.txt
            SHA256SUMS.txt
            PROVENANCE.txt
          retention-days: 1
      - name: Upload exact vendor
        uses: actions/upload-artifact@v4
        with:
          name: libp2p-c774d4e-vendor
          path: |
            libp2p-vendor-c774d4e.tar.gz
            cargo-vendor-config.toml
            SHA256SUMS.txt
            PROVENANCE.txt
          retention-days: 1