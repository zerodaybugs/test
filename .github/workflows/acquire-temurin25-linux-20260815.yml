name: Acquire Temurin JDK 25 Linux x64

on:
  push:
    branches:
      - tmp/java25-besu-parallel-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Package exact runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          java -version 2> out/JAVA_VERSION.txt
          javac -version 2> out/JAVAC_VERSION.txt
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" > out/JAVA_HOME.txt
          tar --zstd -cf out/temurin-jdk25-linux-x64.tar.zst -C "$JAVA_HOME" .
          sha256sum out/temurin-jdk25-linux-x64.tar.zst > out/SHA256SUMS
          du -sh "$JAVA_HOME" > out/SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: temurin-jdk25-linux-x64
          path: out
          if-no-files-found: error
          retention-days: 1
