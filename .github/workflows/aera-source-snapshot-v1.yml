name: Aera public source snapshot build

on:
  pull_request:
    branches: [main]
    paths:
      - '.aera-source-v1/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Pin, build, test and archive public source
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifact
          git clone https://github.com/aera-finance/aera-contracts-public.git /tmp/aera
          git -C /tmp/aera checkout f0ebc15985b2f19d1e599b604370fdbaeb314180
          git -C /tmp/aera submodule update --init --recursive
          git -C /tmp/aera rev-parse HEAD > artifact/COMMIT.txt
          git -C /tmp/aera submodule status --recursive > artifact/SUBMODULES.txt
          (cd /tmp/aera/v3 && forge build --force) > artifact/FORGE_BUILD.log 2>&1
          echo $? > artifact/FORGE_BUILD_STATUS.txt
          (cd /tmp/aera/v3 && forge test -vv) > artifact/FORGE_TEST.log 2>&1
          echo $? > artifact/FORGE_TEST_STATUS.txt
          git -C /tmp/aera diff 3b1477c01c811a778a777ef90d40c41a00846109 f0ebc15985b2f19d1e599b604370fdbaeb314180 -- v3 > artifact/PROVISIONER_V2_RELEASE.diff
          tar --exclude='.git' -C /tmp/aera -czf artifact/AERA_V3_SOURCE.tar.gz v3 README.md
          find /tmp/aera/v3 -type f -printf '%P\n' | sort > artifact/V3_FILE_INDEX.txt
          (cd artifact && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aera-public-source-snapshot-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
