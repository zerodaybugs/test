name: Portable Aiken 1.1.21 bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/aiken-1-1-21-portable-bundle-20260730.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install and package exact Aiken release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/bin bundle/npm bundle/provenance
          npm pack @aiken-lang/aiken@1.1.21 --pack-destination bundle/npm
          npm install --global @aiken-lang/aiken@1.1.21
          A=$(command -v aiken)
          readlink -f "$A" | tee bundle/provenance/aiken-realpath.txt
          file "$(readlink -f "$A")" | tee bundle/provenance/aiken-file.txt
          aiken --version | tee bundle/provenance/aiken-version.txt
          node --version | tee bundle/provenance/node-version.txt
          npm --version | tee bundle/provenance/npm-version.txt
          cp -L "$A" bundle/bin/aiken
          chmod +x bundle/bin/aiken
          sha256sum bundle/bin/aiken bundle/npm/* \
            | tee bundle/provenance/payload.sha256
          find bundle -type f -printf '%P\t%s bytes\n' | sort \
            > bundle/provenance/FILE_INDEX.txt

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: aiken-1.1.21-portable-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
