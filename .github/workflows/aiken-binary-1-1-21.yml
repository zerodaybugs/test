name: Aiken 1.1.21 binary bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/aiken-binary-1-1-21.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and bundle exact Aiken
        run: |
          set -euo pipefail
          npm install -g @aiken-lang/aikup
          aikup v1.1.21 || aikup 1.1.21 || aikup install v1.1.21
          export PATH="$HOME/.aiken/bin:$HOME/.local/bin:$PATH"
          mkdir -p out
          cp "$(command -v aiken)" out/aiken
          chmod +x out/aiken
          out/aiken --version | tee out/VERSION.txt
          sha256sum out/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aiken-1.1.21-linux-x64
          retention-days: 7
          compression-level: 0
          path: out/
