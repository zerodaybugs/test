name: Aiken stdlib v3 source bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/aiken-stdlib-v3.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive public source
        run: |
          set -euo pipefail
          git clone --branch v3.0.0 --depth 1 https://github.com/aiken-lang/stdlib.git source
          git -C source rev-parse HEAD > STDLIB_COMMIT.txt
          rm -rf source/.git
          tar -czf aiken-stdlib-v3.0.0.tar.gz source
          sha256sum aiken-stdlib-v3.0.0.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aiken-stdlib-v3
          retention-days: 7
          path: |
            aiken-stdlib-v3.0.0.tar.gz
            STDLIB_COMMIT.txt
            SHA256SUMS
