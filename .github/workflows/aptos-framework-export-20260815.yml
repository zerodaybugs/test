name: Aptos framework source export

on:
  push:
    branches:
      - aave-aptos-hf-gift-rebuild-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Aptos mainnet framework
        uses: actions/checkout@v4
        with:
          repository: aptos-labs/aptos-core
          ref: mainnet
          path: aptos-core
          persist-credentials: false
          sparse-checkout: |
            aptos-move/framework
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Record provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C aptos-core rev-parse HEAD > aptos-core/APTOS_FRAMEWORK_COMMIT.txt
          test -f aptos-core/aptos-move/framework/aptos-framework/Move.toml

      - name: Upload framework source
        uses: actions/upload-artifact@v4
        with:
          name: aptos-mainnet-framework-source
          path: |
            aptos-core/aptos-move/framework
            aptos-core/APTOS_FRAMEWORK_COMMIT.txt
          include-hidden-files: true
          retention-days: 1
