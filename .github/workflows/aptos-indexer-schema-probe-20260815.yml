name: Aptos indexer schema probe

on:
  push:
    branches:
      - aave-aptos-underlying-hooks-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAPHQL: "https://indexer.mainnet.aptoslabs.com/v1/graphql"
    steps:
      - name: Probe current GraphQL schema
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          endpoint=os.environ['GRAPHQL']
          queries={
            'query_fields':'query { __schema { queryType { fields { name } } } }',
            'user_transactions_type':'query { __type(name: "user_transactions") { name fields { name type { kind name ofType { kind name } } } } }',
            'user_transactions_bool_exp':'query { __type(name: "user_transactions_bool_exp") { name inputFields { name type { kind name ofType { kind name } } } } }',
            'account_transactions_type':'query { __type(name: "account_transactions") { name fields { name type { kind name ofType { kind name } } } } }',
          }
          for name,query in queries.items():
              body=json.dumps({'query':query}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Content-Type':'application/json','User-Agent':'aptos-schema-probe'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read()
                      status=r.status
              except urllib.error.HTTPError as exc:
                  raw=exc.read(); status=exc.code
              pathlib.Path(f'evidence/{name}.status.txt').write_text(str(status)+'\n')
              pathlib.Path(f'evidence/{name}.json').write_bytes(raw)
              print(name,status,raw[:1000])
          PY
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload schema probe
        uses: actions/upload-artifact@v4
        with:
          name: aptos-indexer-schema-probe
          path: evidence
          retention-days: 2
          if-no-files-found: error
