name: Public Aptos platform transaction archive

on:
  push:
    branches:
      - aave-aptos-chainlink-raw-20260817
    paths:
      - research/aptos_indexer_archive_fetch_20260817.py
      - research/aptos_raw_transaction_fetch_20260817.py
      - .github/workflows/aptos-public-platform-archive-fetch-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GRAPHQL: https://indexer.mainnet.aptoslabs.com/v1/graphql
      PLATFORMS: 0x9976bb288ed9177b542d568fa1ac386819dc99141630e582315804840f41928a,0x3bcacb561438c55ce2a9da479df6ab486af55b2fb7070b700df36c097da732b8
      PAGE_SIZE: "100"
      MAX_ROWS_PER_PLATFORM: "10000"
      PAGE_DELAY_SECONDS: "2.0"
      OUTPUT_DIR: evidence/aptos-platform-transactions
      MAX_WORKERS: "8"
      RETRIES_PER_PROVIDER: "2"
      REQUEST_TIMEOUT: "60"
    steps:
      - name: Checkout public archive fetcher
        uses: actions/checkout@v4

      - name: Query indexer and fetch public transactions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 research/aptos_indexer_archive_fetch_20260817.py

      - name: Create integrity manifest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d evidence/aptos-platform-transactions ]; then
            find evidence/aptos-platform-transactions -type f \
              ! -name SHA256SUMS.txt -print0 | sort -z | \
              xargs -0 sha256sum > evidence/aptos-platform-transactions/SHA256SUMS.txt
          fi

      - name: Upload public platform archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aptos-public-platform-archive-20260817
          path: evidence/aptos-platform-transactions
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
