name: Public Aptos transaction archive sample

on:
  push:
    branches:
      - aave-aptos-chainlink-raw-20260817
    paths:
      - research/aptos_transaction_versions_20260817.json
      - research/aptos_raw_transaction_fetch_20260817.py
      - .github/workflows/aptos-public-transaction-fetch-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSIONS_PATH: research/aptos_transaction_versions_20260817.json
      OUTPUT_DIR: evidence/aptos-raw-transactions
      MAX_WORKERS: "2"
      RETRIES_PER_PROVIDER: "3"
      REQUEST_TIMEOUT: "60"
    steps:
      - name: Checkout public fetcher
        uses: actions/checkout@v4

      - name: Fetch public Aptos transactions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 research/aptos_raw_transaction_fetch_20260817.py

      - name: Create integrity manifest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d evidence/aptos-raw-transactions ]; then
            find evidence/aptos-raw-transactions -type f -print0 | sort -z | \
              xargs -0 sha256sum > evidence/aptos-raw-transactions/SHA256SUMS.txt
          fi

      - name: Upload public transaction sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aptos-public-transaction-sample-20260817
          path: evidence/aptos-raw-transactions
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
