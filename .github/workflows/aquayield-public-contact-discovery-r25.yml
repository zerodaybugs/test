name: AquaYield Public Contact and Security Metadata R25

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-cdp-account-gate-r23-20260811]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch only public web, DNS, SuiNS profile, and security metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aquayield-contact-r25
          mkdir -p aquayield-contact-r25/{http,dns}

          urls=(
            'https://aquayield.sui.id/'
            'https://aquayield.sui.id/.well-known/security.txt'
            'https://aquayield.sui.id/security.txt'
            'https://api-mainnet.suins.io/nfts/aquayield.sui/1835357192019'
            'https://aquayield.fi/'
            'https://aquayield.finance/'
            'https://aquayield.xyz/'
            'https://aquayield.app/'
            'https://aquayield.io/'
          )
          : > aquayield-contact-r25/URL_RESULTS.tsv
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            slug=$(printf '%02d' "$n")
            set +e
            curl -A 'ZeroDayBugs responsible-disclosure contact discovery' -L --max-redirs 10 \
              --connect-timeout 10 --max-time 30 -D "aquayield-contact-r25/http/${slug}.headers.txt" \
              -o "aquayield-contact-r25/http/${slug}.body" \
              -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}\n' "$url" \
              > "aquayield-contact-r25/http/${slug}.meta.tsv" 2> "aquayield-contact-r25/http/${slug}.error.txt"
            rc=$?
            set -e
            printf '%s\t%s\t%s\t' "$slug" "$rc" "$url" >> aquayield-contact-r25/URL_RESULTS.tsv
            cat "aquayield-contact-r25/http/${slug}.meta.tsv" >> aquayield-contact-r25/URL_RESULTS.tsv || true
          done

          for domain in aquayield.sui.id aquayield.fi aquayield.finance aquayield.xyz aquayield.app aquayield.io; do
            safe=$(echo "$domain" | tr '.' '_')
            dig +short A "$domain" > "aquayield-contact-r25/dns/${safe}.A.txt" || true
            dig +short AAAA "$domain" > "aquayield-contact-r25/dns/${safe}.AAAA.txt" || true
            dig +short CNAME "$domain" > "aquayield-contact-r25/dns/${safe}.CNAME.txt" || true
            dig +short MX "$domain" > "aquayield-contact-r25/dns/${safe}.MX.txt" || true
            dig +short TXT "$domain" > "aquayield-contact-r25/dns/${safe}.TXT.txt" || true
          done

          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('aquayield-contact-r25')
          urls=[]
          for line in (root/'URL_RESULTS.tsv').read_text(errors='replace').splitlines():
              parts=line.split('\t')
              urls.append({
                  'slot':parts[0] if len(parts)>0 else None,
                  'curlRc':parts[1] if len(parts)>1 else None,
                  'requested':parts[2] if len(parts)>2 else None,
                  'httpCode':parts[3] if len(parts)>3 else None,
                  'effectiveUrl':parts[4] if len(parts)>4 else None,
                  'contentType':parts[5] if len(parts)>5 else None,
                  'size':parts[6] if len(parts)>6 else None,
              })
          signals=[]
          pattern=re.compile(r'(mailto:[^"\s<>]+|https?://[^"\s<>]+|@[A-Za-z0-9_]{2,}|security@[A-Za-z0-9._-]+|discord(?:\.gg|\.com/invite)/[A-Za-z0-9_-]+|t\.me/[A-Za-z0-9_-]+)',re.I)
          for body in sorted((root/'http').glob('*.body')):
              data=body.read_bytes()[:2_000_000]
              text=data.decode('utf-8','replace')
              for match in pattern.findall(text):
                  signals.append({'file':body.name,'value':match[:500]})
          unique=[]; seen=set()
          for row in signals:
              key=row['value'].lower()
              if key not in seen:
                  seen.add(key); unique.append(row)
          dns={}
          for path in sorted((root/'dns').glob('*')):
              text=path.read_text(errors='replace').strip()
              if text: dns[path.name]=text.splitlines()
          summary={
              'schema':'aquayield-public-contact-r25/v1',
              'urls':urls,'publicContactSignals':unique[:200],'dns':dns,
              'activeCandidateUrls':[row for row in urls if row.get('httpCode') and row['httpCode'].startswith(('2','3'))],
              'securityTxtHits':[row for row in urls if 'security.txt' in str(row.get('requested')) and row.get('httpCode')=='200'],
              'writes':0,'authenticatedRequests':0,
          }
          (root/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          find aquayield-contact-r25 -type f -print0 | sort -z | xargs -0 sha256sum > aquayield-contact-r25/SHA256SUMS.txt

      - name: Validate passive public-contact boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('aquayield-contact-r25/SUMMARY.json'))
          assert s['writes']==0 and s['authenticatedRequests']==0
          print('AQUAYIELD_PUBLIC_CONTACT_R25_PASS')
          PY

      - name: Upload public contact evidence
        uses: actions/upload-artifact@v4
        with:
          name: aquayield-contact-r25
          path: aquayield-contact-r25
          if-no-files-found: error
          retention-days: 2
