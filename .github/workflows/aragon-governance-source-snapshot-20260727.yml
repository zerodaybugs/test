name: Aragon governance public source snapshot 20260727

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned public source snapshot
        id: build
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/aragon-snapshot-build.log") 2>&1
          set -Eeuo pipefail

          ROOT="$RUNNER_TEMP/aragon-governance-public-snapshot"
          SRC="$ROOT/katana-governance"
          COMMIT="2fe29c49bfbd6c7c116ddf56a1228de450a62728"
          SOLC_VERSION="0.8.18"

          mkdir -p "$ROOT/toolchain"

          echo "[stage] clone root"
          git clone --no-checkout https://github.com/aragon/katana-governance.git "$SRC"
          git -C "$SRC" checkout --detach "$COMMIT"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$COMMIT"

          echo "[stage] sync submodules"
          git -C "$SRC" submodule sync --recursive
          GIT_TERMINAL_PROMPT=0 git -C "$SRC" submodule update --init --recursive --jobs 8 --progress

          echo "[stage] source manifest"
          {
            echo "repository=https://github.com/aragon/katana-governance"
            echo "commit=$(git -C "$SRC" rev-parse HEAD)"
            echo "commit_date=$(git -C "$SRC" show -s --format=%cI HEAD)"
            echo "subject=$(git -C "$SRC" show -s --format=%s HEAD)"
          } > "$ROOT/SOURCE_MANIFEST.txt"
          git -C "$SRC" submodule status --recursive > "$ROOT/SUBMODULES.txt"

          echo "[stage] download verified solc"
          curl --fail --location --retry 5 --retry-all-errors \
            https://binaries.soliditylang.org/linux-amd64/list.json \
            --output "$ROOT/toolchain/solc-list.json"

          python3 - "$ROOT/toolchain/solc-list.json" "$SOLC_VERSION" "$ROOT/toolchain/SOLC_META.env" <<'PY'
          import json
          import pathlib
          import sys

          index_path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          meta_path = pathlib.Path(sys.argv[3])
          data = json.loads(index_path.read_text(encoding="utf-8"))
          artifact_path = data["releases"][version]
          build = next(item for item in data["builds"] if item["path"] == artifact_path)
          expected = build["sha256"].removeprefix("0x").lower()
          meta_path.write_text(
              f"SOLC_ARTIFACT_PATH={artifact_path}\nSOLC_EXPECTED_SHA={expected}\n",
              encoding="utf-8",
          )
          PY

          source "$ROOT/toolchain/SOLC_META.env"
          SOLC_URL="https://binaries.soliditylang.org/linux-amd64/$SOLC_ARTIFACT_PATH"
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent "Mozilla/5.0 GitHub-Actions-public-source-snapshot" \
            "$SOLC_URL" --output "$ROOT/toolchain/solc-0.8.18"
          SOLC_ACTUAL_SHA="$(sha256sum "$ROOT/toolchain/solc-0.8.18" | awk '{print $1}')"
          test "$SOLC_ACTUAL_SHA" = "$SOLC_EXPECTED_SHA"
          chmod 0755 "$ROOT/toolchain/solc-0.8.18"
          printf '%s  %s\n' "$SOLC_ACTUAL_SHA" "solc-0.8.18" > "$ROOT/toolchain/SOLC_SHA256.txt"
          {
            echo "version=$SOLC_VERSION"
            echo "path=$SOLC_ARTIFACT_PATH"
            echo "url=$SOLC_URL"
            echo "sha256=$SOLC_ACTUAL_SHA"
          } > "$ROOT/toolchain/SOLC_SOURCE.txt"
          "$ROOT/toolchain/solc-0.8.18" --version | tee "$ROOT/toolchain/SOLC_VERSION.txt"

          echo "[stage] remove git metadata"
          find "$SRC" -name .git -type f -delete
          find "$SRC" -name .git -type d -prune -exec rm -rf {} +

          echo "[stage] hash and package"
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/ALL_FILES_SHA256.txt"
          tar --zstd -cf "$RUNNER_TEMP/aragon-governance-public-snapshot-20260727.tar.zst" -C "$ROOT" .
          sha256sum "$RUNNER_TEMP/aragon-governance-public-snapshot-20260727.tar.zst" \
            > "$RUNNER_TEMP/aragon-governance-public-snapshot-20260727.tar.zst.sha256"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aragon-governance-source-build-log-20260727
          path: ${{ runner.temp }}/aragon-snapshot-build.log
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload snapshot
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aragon-governance-public-snapshot-20260727
          path: |
            ${{ runner.temp }}/aragon-governance-public-snapshot-20260727.tar.zst
            ${{ runner.temp }}/aragon-governance-public-snapshot-20260727.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Enforce successful build
        if: always()
        shell: bash
        run: test "${{ steps.build.outcome }}" = "success"
