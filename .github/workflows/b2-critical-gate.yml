name: b2-critical-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/b2-critical-gate.yml'
      - 'security/b2_gate.js'
      - 'security/b2_gate_public.pem'
      - 'security/b2_gate_trigger.txt'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2
      - name: Execute read-only gate and package all evidence
        run: |
          rm -rf evidence upload gate.tar.gz key-material.txt
          mkdir -p evidence upload
          set +e
          node security/b2_gate.js > evidence/EXECUTION.stdout 2> evidence/EXECUTION.stderr
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > evidence/EXIT_STATUS.txt
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt
          tar -czf gate.tar.gz evidence
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in gate.tar.gz -out upload/gate.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" upload/gate.enc | awk '{print $2}' > upload/gate.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/b2_gate_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key-material.txt -out upload/key-material.enc
          sha256sum upload/* > upload/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > upload/FORMAT.txt
          rm -rf evidence gate.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b2-critical-gate-encrypted
          path: upload/
          if-no-files-found: error
          retention-days: 2
