name: Balancer V2 Authorizer read-only census

on:
  push:
    branches:
      - tooling/foundry-bootstrap-20260801
    paths:
      - '.github/workflows/balancer-v2-authorizer-census-20260801.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/balancer-v2-authorizer-census-20260801.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Install pinned Foundry CLI
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/foundry-rs/foundry/releases/download/nightly-716e451ca3b6073a1a91a22d7970cbbd1f5eb843/foundry_nightly_linux_amd64.tar.gz'
          curl --fail --location --retry 4 --retry-all-errors --output foundry.tar.gz "$url"
          mkdir foundry
          tar -xzf foundry.tar.gz -C foundry
          echo "$PWD/foundry" >> "$GITHUB_PATH"

      - name: Enumerate current batchSwap role members
        shell: bash
        run: |
          set -euo pipefail
          AUTHORIZER='0xA331D84eC860Bf466b4CdCcFb4aC09a1B43F3aE6'
          VAULT='0xBA12222222228d8Ba445958a75a0704d566BF2C8'
          ROLE='0x1282ab709b2b70070f829c46bc36f76b32ad4989fecb2fcb09a1b3ce00bbfc30'
          RPC='https://ethereum-rpc.publicnode.com'

          block_number="$(cast block-number --rpc-url "$RPC")"
          block_hash="$(cast block "$block_number" --field hash --rpc-url "$RPC")"
          vault_authorizer="$(cast call "$VAULT" 'getAuthorizer()(address)' --rpc-url "$RPC")"
          count="$(cast call "$AUTHORIZER" 'getRoleMemberCount(bytes32)(uint256)' "$ROLE" --rpc-url "$RPC")"

          mkdir -p census
          {
            echo -e 'index\taddress\tcode_size_bytes\tcan_perform'
            for ((i=0; i<count; i++)); do
              member="$(cast call "$AUTHORIZER" 'getRoleMember(bytes32,uint256)(address)' "$ROLE" "$i" --rpc-url "$RPC")"
              code="$(cast code "$member" --rpc-url "$RPC")"
              if [ "$code" = '0x' ]; then size=0; else size=$(( (${#code} - 2) / 2 )); fi
              allowed="$(cast call "$AUTHORIZER" 'canPerform(bytes32,address,address)(bool)' "$ROLE" "$member" "$VAULT" --rpc-url "$RPC")"
              printf '%s\t%s\t%s\t%s\n' "$i" "$member" "$size" "$allowed"
            done
          } | tee census/batchswap-role-members.tsv

          python3 - <<PY
          import csv, json
          rows = list(csv.DictReader(open('census/batchswap-role-members.tsv'), delimiter='\t'))
          out = {
              'chain_id': 1,
              'rpc': '$RPC',
              'block_number': int('$block_number'),
              'block_hash': '$block_hash',
              'vault': '$VAULT',
              'vault_getAuthorizer': '$vault_authorizer',
              'authorizer': '$AUTHORIZER',
              'batchSwap_action_id': '$ROLE',
              'member_count': int('$count'),
              'members': rows,
          }
          open('census/batchswap-role-members.json','w').write(json.dumps(out, indent=2) + '\n')
          PY

          sha256sum census/* | tee census/SHA256SUMS.txt
          cat census/batchswap-role-members.json

      - name: Upload census
        uses: actions/upload-artifact@v4
        with:
          name: balancer-v2-authorizer-census-20260801
          path: census/
          if-no-files-found: error
          retention-days: 1
