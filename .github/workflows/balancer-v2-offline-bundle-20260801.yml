name: Balancer V2 exact-source offline bundle

on:
  push:
    branches:
      - tooling/foundry-bootstrap-20260801
    paths:
      - '.github/workflows/balancer-v2-offline-bundle-20260801.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/balancer-v2-offline-bundle-20260801.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Use exact supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18.15.0

      - name: Fetch and pin public Balancer V2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/balancer/balancer-v2-monorepo.git upstream
          cd upstream
          git checkout --detach f8b6f44f21afaf3c802536ed478277f945e7f256
          test "$(git rev-parse HEAD)" = 'f8b6f44f21afaf3c802536ed478277f945e7f256'
          git rev-parse HEAD > UPSTREAM_COMMIT.txt

      - name: Install immutable dependencies and compile public source
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable
          yarn workspace @balancer-labs/balancer-js build
          yarn workspace @balancer-labs/v2-vault compile
          yarn workspace @balancer-labs/v2-pool-weighted compile

      - name: Add portable Node 18.15 runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output node-v18.15.0-linux-x64.tar.xz \
            https://nodejs.org/dist/v18.15.0/node-v18.15.0-linux-x64.tar.xz
          tar -xJf node-v18.15.0-linux-x64.tar.xz
          ./node-v18.15.0-linux-x64/bin/node --version

      - name: Produce integrity-bound offline archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/.git
          tar --zstd -cf balancer-v2-exact-weighted-offline.tar.zst upstream node-v18.15.0-linux-x64
          sha256sum balancer-v2-exact-weighted-offline.tar.zst | tee balancer-v2-exact-weighted-offline.tar.zst.sha256
          ls -lh balancer-v2-exact-weighted-offline.tar.zst

      - name: Upload one-day offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: balancer-v2-exact-weighted-offline-20260801
          path: |
            balancer-v2-exact-weighted-offline.tar.zst
            balancer-v2-exact-weighted-offline.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
