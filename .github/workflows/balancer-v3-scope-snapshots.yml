name: Balancer V3 scope snapshots

on:
  push:
    branches:
      - tooling/foundry-download-bootstrap-20260802
    paths:
      - '.github/workflows/balancer-v3-scope-snapshots.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/balancer-v3-scope-snapshots.yml'

permissions:
  contents: read

jobs:
  package-snapshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact deployed-source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshots
          download() {
            local sha="$1" name="$2"
            curl --fail --location --retry 5 --retry-all-errors \
              -o "snapshots/${name}-${sha:0:7}.tar.gz" \
              "https://codeload.github.com/balancer/balancer-v3-monorepo/tar.gz/${sha}"
          }
          download 6c37baf5d9efdc21c167e30fd6928446d717ab6e weighted-stable-surge
          download aa9fe53856b69ee0be58c273f0b899defb07e89f gyro-v2
          download c1cd3696c3627bfe93f66f6aa175b9ad894c3e4a lp-oracles
          download 0a5890a8c5d79865498d75cdc6ecdc75cf8d297d lbp-v4
          sha256sum snapshots/*.tar.gz | tee snapshots/SHA256SUMS
          find snapshots -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee snapshots/INVENTORY.tsv
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: balancer-v3-scope-snapshots
          path: snapshots/
          if-no-files-found: error
          retention-days: 1
