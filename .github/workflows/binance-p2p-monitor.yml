name: Binance P2P USDT EUR monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/binance_p2p_monitor.py"
      - ".github/workflows/binance-p2p-monitor.yml"

permissions:
  contents: write

concurrency:
  group: binance-p2p-usdt-eur-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load previous monitor state
        shell: bash
        run: |
          set -u
          git fetch origin binance-monitor-data:refs/remotes/origin/binance-monitor-data || true
          git show origin/binance-monitor-data:state.json > /tmp/binance-state.json 2>/dev/null || true

      - name: Query official Binance public P2P APIs
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/binance-monitor-output
          if [ -s /tmp/binance-state.json ]; then
            python3 scripts/binance_p2p_monitor.py \
              --state-in /tmp/binance-state.json \
              --out-dir /tmp/binance-monitor-output
          else
            python3 scripts/binance_p2p_monitor.py \
              --out-dir /tmp/binance-monitor-output
          fi
          test -s /tmp/binance-monitor-output/status.json
          test -s /tmp/binance-monitor-output/event.json
          test -s /tmp/binance-monitor-output/state.json

      - name: Publish latest result to data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan binance-monitor-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/binance-monitor-output/status.json status.json
          cp /tmp/binance-monitor-output/event.json event.json
          cp /tmp/binance-monitor-output/state.json state.json
          cat > README.md <<'EOF'
          # Binance P2P monitor data

          Machine-generated read-only output for the USDT/EUR P2P monitor.
          The monitor never places or initiates trades.
          EOF
          git add README.md status.json event.json state.json
          git commit -m "Update Binance P2P monitor data [skip ci]"
          git push --force origin HEAD:binance-monitor-data
