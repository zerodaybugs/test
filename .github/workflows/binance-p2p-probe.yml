name: Binance P2P API Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Binance P2P probe
        id: probe
        continue-on-error: true
        run: python3 automation/binance_p2p_probe.py

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-p2p-probe-result
          path: |
            result.json
            trade-methods.raw.json
            ad-list.raw.json
          if-no-files-found: warn
          retention-days: 1

      - name: Preserve probe failure state
        if: steps.probe.outcome == 'failure'
        run: exit 1
