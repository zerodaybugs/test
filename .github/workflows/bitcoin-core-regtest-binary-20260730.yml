name: Bitcoin Core regtest binary materialization 20260730

on:
  pull_request:
    paths:
      - "bitcoin-core-regtest-trigger/**"

permissions:
  contents: read

concurrency:
  group: bitcoin-core-regtest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Download and verify official Bitcoin Core Linux binary
        env:
          VERSION: "31.1"
          ARCHIVE: "bitcoin-31.1-x86_64-linux-gnu.tar.gz"
        run: |
          set -euo pipefail
          rm -rf bitcoin-core-regtest-output bitcoin-core-extract
          mkdir -p bitcoin-core-regtest-output bitcoin-core-extract
          base="https://bitcoincore.org/bin/bitcoin-core-${VERSION}"
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/$ARCHIVE" -o "$ARCHIVE"
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/SHA256SUMS" -o SHA256SUMS
          grep " $ARCHIVE$" SHA256SUMS | sha256sum --check -
          tar -xzf "$ARCHIVE" -C bitcoin-core-extract
          cp "bitcoin-core-extract/bitcoin-${VERSION}/bin/bitcoind" bitcoin-core-regtest-output/
          cp "bitcoin-core-extract/bitcoin-${VERSION}/bin/bitcoin-cli" bitcoin-core-regtest-output/
          cp "bitcoin-core-extract/bitcoin-${VERSION}/bin/bitcoin-tx" bitcoin-core-regtest-output/
          cp SHA256SUMS bitcoin-core-regtest-output/
          sha256sum bitcoin-core-regtest-output/bitcoind \
            bitcoin-core-regtest-output/bitcoin-cli \
            bitcoin-core-regtest-output/bitcoin-tx \
            > bitcoin-core-regtest-output/BINARY_SHA256SUMS.txt
          bitcoin-core-regtest-output/bitcoind --version > bitcoin-core-regtest-output/VERSION.txt

      - name: Upload verified binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitcoin-core-31.1-regtest-bin
          path: bitcoin-core-regtest-output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
