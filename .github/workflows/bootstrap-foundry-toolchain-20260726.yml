name: Bootstrap pinned Foundry toolchain artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-foundry-toolchain-20260726.yml'
      - 'temporary-toolchain-links-20260726.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download and verify Foundry v1.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain/bin toolchain/evidence
          url='https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" -o /tmp/foundry.tar.gz
          printf '%s  %s\n' 'cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b' /tmp/foundry.tar.gz | sha256sum --check
          tar -xzf /tmp/foundry.tar.gz -C toolchain/bin forge cast anvil chisel
          chmod 0755 toolchain/bin/*
          toolchain/bin/forge --version | tee toolchain/evidence/forge-version.txt
          toolchain/bin/cast --version | tee toolchain/evidence/cast-version.txt
          toolchain/bin/anvil --version | tee toolchain/evidence/anvil-version.txt

      - name: Download and verify Solidity 0.8.30 identity
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/ethereum/solidity/releases/download/v0.8.30/solc-static-linux'
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors "$url" -o toolchain/bin/solc-0.8.30
          chmod 0755 toolchain/bin/solc-0.8.30
          toolchain/bin/solc-0.8.30 --version | tee toolchain/evidence/solc-version.txt
          grep -F 'Version: 0.8.30+commit.73712a01.Linux.g++' toolchain/evidence/solc-version.txt

      - name: Record checksums and provenance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum toolchain/bin/* > toolchain/evidence/SHA256SUMS.txt
          cat > toolchain/evidence/PROVENANCE.txt <<'EOF'
          Foundry source: https://github.com/foundry-rs/foundry/releases/tag/v1.7.1
          Foundry archive: foundry_v1.7.1_linux_amd64.tar.gz
          Foundry archive SHA-256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
          Solidity source: https://github.com/ethereum/solidity/releases/tag/v0.8.30
          Solidity version: 0.8.30+commit.73712a01.Linux.g++
          Purpose: temporary reproducible local security-test toolchain
          Vulnerability/project data included: none
          EOF
          tar -czf pinned-foundry-solc-linux-amd64.tar.gz -C toolchain .
          sha256sum pinned-foundry-solc-linux-amd64.tar.gz > pinned-foundry-solc-linux-amd64.tar.gz.sha256

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinned-foundry-solc-linux-amd64
          path: |
            pinned-foundry-solc-linux-amd64.tar.gz
            pinned-foundry-solc-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
