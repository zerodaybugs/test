name: Bootstrap pinned Foundry v1.7.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-foundry-v171.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci/bootstrap-foundry-v171.trigger"
      - ".github/workflows/bootstrap-foundry-v171.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and verify official Foundry release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            -o foundry_v1.7.1_linux_amd64.tar.gz \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  foundry_v1.7.1_linux_amd64.tar.gz" \
            | sha256sum --check --strict

      - name: Smoke test package
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          tar -xzf foundry_v1.7.1_linux_amd64.tar.gz -C unpacked
          unpacked/forge --version
          unpacked/cast --version
          unpacked/anvil --version

      - name: Upload verified release archive
        uses: actions/upload-artifact@v4
        with:
          name: foundry-v1.7.1-linux-amd64
          path: foundry_v1.7.1_linux_amd64.tar.gz
          if-no-files-found: error
          retention-days: 1
