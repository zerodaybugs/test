name: Bootstrap Metric C-02 pinned dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - "ci/bootstrap-metric-c02-deps.trigger"
      - ".github/workflows/bootstrap-metric-c02-deps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps

          git clone --depth 1 --branch v1.9.4 \
            https://github.com/foundry-rs/forge-std.git deps/forge-std
          git clone --depth 1 --branch v5.4.0 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git \
            deps/openzeppelin-contracts
          git clone --depth 1 --branch v5.4.0 \
            https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git \
            deps/openzeppelin-contracts-upgradeable

          mkdir -p deps/pyth-crosschain
          git -C deps/pyth-crosschain init
          git -C deps/pyth-crosschain remote add origin \
            https://github.com/pyth-network/pyth-crosschain.git
          git -C deps/pyth-crosschain sparse-checkout init --cone
          git -C deps/pyth-crosschain sparse-checkout set lazer/contracts/evm/src
          git -C deps/pyth-crosschain fetch --depth 1 origin \
            4a596e7adff552afaf5687ce791764019f2d3719
          git -C deps/pyth-crosschain checkout --detach FETCH_HEAD

      - name: Record exact commits and package
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "forge-std=$(git -C deps/forge-std rev-parse HEAD)"
            echo "openzeppelin-contracts=$(git -C deps/openzeppelin-contracts rev-parse HEAD)"
            echo "openzeppelin-contracts-upgradeable=$(git -C deps/openzeppelin-contracts-upgradeable rev-parse HEAD)"
            echo "pyth-crosschain=$(git -C deps/pyth-crosschain rev-parse HEAD)"
          } | tee DEPENDENCY_PINS.txt
          find deps -type d -name .git -prune -exec rm -rf {} +
          tar -czf metric-c02-pinned-deps.tar.gz deps DEPENDENCY_PINS.txt
          sha256sum metric-c02-pinned-deps.tar.gz | tee metric-c02-pinned-deps.tar.gz.sha256

      - name: Upload pinned dependencies
        uses: actions/upload-artifact@v4
        with:
          name: metric-c02-pinned-dependencies
          path: |
            metric-c02-pinned-deps.tar.gz
            metric-c02-pinned-deps.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
