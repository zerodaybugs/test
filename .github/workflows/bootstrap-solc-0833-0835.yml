name: Bootstrap solc 0.8.33 and 0.8.35

on:
  pull_request:
    branches: [main]
    paths:
      - "ci/bootstrap-solc-0833-0835.trigger"
      - ".github/workflows/bootstrap-solc-0833-0835.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download official compiler list and pinned binaries
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://binaries.soliditylang.org/linux-amd64
          curl -fL --retry 5 -o list.json "$BASE/list.json"
          mkdir -p solc-bin
          for VERSION in 0.8.33 0.8.35; do
            PATH_NAME=$(jq -r --arg v "$VERSION" '.releases[$v]' list.json)
            test "$PATH_NAME" != null
            EXPECTED=$(jq -r --arg p "$PATH_NAME" '.builds[] | select(.path==$p) | .sha256' list.json | sed 's/^0x//')
            test -n "$EXPECTED"
            curl -fL --retry 5 -o "solc-bin/solc-$VERSION" "$BASE/$PATH_NAME"
            echo "$EXPECTED  solc-bin/solc-$VERSION" | sha256sum --check --strict
            chmod +x "solc-bin/solc-$VERSION"
            "solc-bin/solc-$VERSION" --version
            echo "$VERSION $PATH_NAME $EXPECTED" >> SOLC_PINS.txt
          done

      - name: Package verified compilers
        shell: bash
        run: |
          set -euo pipefail
          tar -czf solc-0.8.33-0.8.35-linux-amd64.tar.gz solc-bin SOLC_PINS.txt list.json
          sha256sum solc-0.8.33-0.8.35-linux-amd64.tar.gz \
            > solc-0.8.33-0.8.35-linux-amd64.tar.gz.sha256

      - name: Upload verified compilers
        uses: actions/upload-artifact@v4
        with:
          name: solc-0.8.33-0.8.35-linux-amd64
          path: |
            solc-0.8.33-0.8.35-linux-amd64.tar.gz
            solc-0.8.33-0.8.35-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
