name: Bootstrap pinned TermMax source artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-termmax-source-20260726.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        id: foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Clone exact TermMax commit, install dependencies, and capture build
        shell: bash
        run: |
          set +e
          HEAD='e314f3f849577dfecd4614f148c4df81fdf8c72d'
          rm -rf termmax-contract-v2 evidence
          mkdir -p evidence

          git clone https://github.com/term-structure/termmax-contract-v2.git termmax-contract-v2 \
            > evidence/clone.log 2>&1
          clone_rc=$?

          checkout_rc=99
          dependency_rc=99
          build_rc=99
          if [ "$clone_rc" = 0 ]; then
            git -C termmax-contract-v2 checkout --detach "$HEAD" >> evidence/clone.log 2>&1
            checkout_rc=$?
            git -C termmax-contract-v2 rev-parse HEAD > evidence/target-head.txt 2>&1
          fi

          if [ "$checkout_rc" = 0 ]; then
            (
              cd termmax-contract-v2
              forge soldeer install
            ) > evidence/dependencies.log 2>&1
            dependency_rc=$?
          fi

          if [ "$dependency_rc" = 0 ]; then
            (
              cd termmax-contract-v2
              forge build
            ) > evidence/build.log 2>&1
            build_rc=$?
          fi

          forge --version > evidence/forge-version.txt 2>&1
          forge config > evidence/forge-config.txt 2>&1 || true
          if [ -d termmax-contract-v2/.git ]; then
            git -C termmax-contract-v2 status --short > evidence/git-status.txt 2>&1
          fi

          printf '%s\n' \
            "foundry_action_outcome=${{ steps.foundry.outcome }}" \
            "clone_rc=${clone_rc}" \
            "checkout_rc=${checkout_rc}" \
            "dependency_rc=${dependency_rc}" \
            "build_rc=${build_rc}" \
            > evidence/exit-codes.txt
          exit 0

      - name: Package reproducible source tree and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d termmax-contract-v2
          rm -rf termmax-contract-v2/.git termmax-contract-v2/cache termmax-contract-v2/out
          cat > SOURCE_PROVENANCE.txt <<'EOF'
          Repository: https://github.com/term-structure/termmax-contract-v2
          Commit: e314f3f849577dfecd4614f148c4df81fdf8c72d
          Dependency/build exit codes are preserved under evidence/exit-codes.txt.
          Vulnerability/PoC data included: none
          EOF
          find termmax-contract-v2 evidence -type f -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256SUMS.txt
          tar -czf termmax-contract-v2-e314f3f-with-dependencies.tar.gz \
            termmax-contract-v2 evidence SOURCE_PROVENANCE.txt SOURCE_SHA256SUMS.txt
          sha256sum termmax-contract-v2-e314f3f-with-dependencies.tar.gz \
            > termmax-contract-v2-e314f3f-with-dependencies.tar.gz.sha256

      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-contract-v2-e314f3f-with-dependencies
          path: |
            termmax-contract-v2-e314f3f-with-dependencies.tar.gz
            termmax-contract-v2-e314f3f-with-dependencies.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Enforce source/dependency gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'foundry_action_outcome=success' evidence/exit-codes.txt
          grep -Fx 'clone_rc=0' evidence/exit-codes.txt
          grep -Fx 'checkout_rc=0' evidence/exit-codes.txt
          grep -Fx 'dependency_rc=0' evidence/exit-codes.txt
