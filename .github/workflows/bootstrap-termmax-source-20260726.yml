name: Bootstrap pinned TermMax source artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-termmax-source-20260726.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Clone exact TermMax commit and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          HEAD='e314f3f849577dfecd4614f148c4df81fdf8c72d'
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax-contract-v2
          git -C termmax-contract-v2 checkout --detach "$HEAD"
          test "$(git -C termmax-contract-v2 rev-parse HEAD)" = "$HEAD"
          (
            cd termmax-contract-v2
            forge soldeer install
            forge build --use 0.8.30
            git status --short > ../TERM_MAX_GIT_STATUS_AFTER_DEPS.txt
            forge --version > ../FOUNDRY_VERSION.txt
            solc --version > ../SOLC_DISCOVERY.txt 2>&1 || true
          )

      - name: Package reproducible source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf termmax-contract-v2/.git termmax-contract-v2/cache termmax-contract-v2/out
          cat > SOURCE_PROVENANCE.txt <<'EOF'
          Repository: https://github.com/term-structure/termmax-contract-v2
          Commit: e314f3f849577dfecd4614f148c4df81fdf8c72d
          Dependencies: installed by `forge soldeer install`
          Baseline build: `forge build --use 0.8.30` PASS in GitHub Actions
          Vulnerability/PoC data included: none
          EOF
          tar -czf termmax-contract-v2-e314f3f-with-dependencies.tar.gz \
            termmax-contract-v2 SOURCE_PROVENANCE.txt FOUNDRY_VERSION.txt \
            SOLC_DISCOVERY.txt TERM_MAX_GIT_STATUS_AFTER_DEPS.txt
          sha256sum termmax-contract-v2-e314f3f-with-dependencies.tar.gz \
            > termmax-contract-v2-e314f3f-with-dependencies.tar.gz.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: termmax-contract-v2-e314f3f-with-dependencies
          path: |
            termmax-contract-v2-e314f3f-with-dependencies.tar.gz
            termmax-contract-v2-e314f3f-with-dependencies.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
