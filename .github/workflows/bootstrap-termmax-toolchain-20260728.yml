name: Bootstrap public TermMax toolchain 20260728

on:
  push:
    branches:
      - bootstrap/termmax-toolchain-20260728
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TERMMAX_COMMIT: e314f3f849577dfecd4614f148c4df81fdf8c72d
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Prepare exact public TermMax source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/termmax-contract-v2 /tmp/termmax-bootstrap
          git clone https://github.com/term-structure/termmax-contract-v2.git /tmp/termmax-contract-v2
          cd /tmp/termmax-contract-v2
          git checkout --detach "$TERMMAX_COMMIT"
          git submodule update --init --recursive
          forge soldeer update
          forge build --use 0.8.30 --optimizer-runs 1 --via-ir

      - name: Package portable public toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/termmax-bootstrap/bin /tmp/termmax-bootstrap/home
          for tool in forge cast anvil chisel; do
            cp "$(command -v "$tool")" "/tmp/termmax-bootstrap/bin/$tool"
          done
          cp -a /tmp/termmax-contract-v2 /tmp/termmax-bootstrap/termmax-contract-v2
          if [ -d "$HOME/.svm" ]; then
            cp -a "$HOME/.svm" /tmp/termmax-bootstrap/home/.svm
          fi
          {
            echo "TERMMAX_COMMIT=$TERMMAX_COMMIT"
            forge --version
            cast --version
            anvil --version
            uname -a
          } > /tmp/termmax-bootstrap/VERSIONS.txt
          find /tmp/termmax-bootstrap -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/termmax-bootstrap/FILES_SHA256_ABSOLUTE.txt
          tar -C /tmp -czf "$GITHUB_WORKSPACE/termmax-public-toolchain-20260728.tar.gz" termmax-bootstrap
          sha256sum "$GITHUB_WORKSPACE/termmax-public-toolchain-20260728.tar.gz" > "$GITHUB_WORKSPACE/termmax-public-toolchain-20260728.tar.gz.sha256"

      - name: Upload public-source toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-toolchain-20260728
          path: |
            termmax-public-toolchain-20260728.tar.gz
            termmax-public-toolchain-20260728.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
