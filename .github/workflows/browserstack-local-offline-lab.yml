name: BrowserStack Local latest cross-platform offline binding

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    name: Fingerprint ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win32, darwin-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Download and fingerprint current official binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 077
          work="browserstack-latest/${TARGET}"
          out="cross-platform-output/${TARGET}"
          mkdir -p "$work/input" "$out"

          case "$TARGET" in
            linux-x64) url='https://local-downloads.browserstack.com/BrowserStackLocal-linux-x64.zip' ;;
            win32) url='https://local-downloads.browserstack.com/BrowserStackLocal-win32.zip' ;;
            darwin-x64) url='https://local-downloads.browserstack.com/BrowserStackLocal-darwin-x64.zip' ;;
            *) exit 2 ;;
          esac

          zip_path="$work/input/BrowserStackLocal-${TARGET}.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --output "$zip_path" "$url"
          printf '%s\n' "$url" > "$out/source_url.txt"
          sha256sum "$zip_path" > "$out/SHA256SUMS.txt"
          unzip -t "$zip_path" > "$out/unzip_test.txt"
          unzip -q "$zip_path" -d "$work/input/extracted"

          binary="$(find "$work/input/extracted" -maxdepth 3 -type f \( -name BrowserStackLocal -o -name BrowserStackLocal.exe \) -print -quit)"
          test -n "$binary"
          sha256sum "$binary" >> "$out/SHA256SUMS.txt"
          file "$binary" > "$out/file.txt"
          stat "$binary" > "$out/stat.txt"

          BINARY_PATH="$binary" OUTPUT_DIR="$out" TARGET="$TARGET" python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          binary_path = Path(os.environ['BINARY_PATH'])
          output_dir = Path(os.environ['OUTPUT_DIR'])
          target = os.environ['TARGET']
          data = binary_path.read_bytes()
          source = data.decode('latin-1')

          def digest(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def extract(name: str, next_name: str) -> str:
              starts = (f',{name}:function', f'{name}:function')
              start = -1
              marker = ''
              for candidate in starts:
                  start = source.find(candidate)
                  if start >= 0:
                      marker = candidate
                      break
              if start < 0:
                  raise RuntimeError(f'missing {name}:function')
              end_marker = f',{next_name}:function'
              end = source.find(end_marker, start + len(marker))
              if end < 0:
                  raise RuntimeError(f'missing {end_marker}')
              return source[start + marker.index(name) + len(name) + 1:end]

          components = {
              'createSocksResponse': extract('createSocksResponse', 'getSocketSummary'),
              'convertToSubnets': extract('convertToSubnets', 'convertToRegexArray'),
              'convertToRegexArray': extract('convertToRegexArray', 'testAgainstSubnetsArray'),
              'testAgainstSubnetsArray': extract('testAgainstSubnetsArray', 'testAgainstRegexArray'),
              'testAgainstRegexArray': extract('testAgainstRegexArray', 'generateMetadataForErrorEvent'),
              '_connectToLocalServer': extract('_connectToLocalServer', 'connectToLocalServer'),
              'connectToLocalServer': extract('connectToLocalServer', 'setSocketReadWithoutProxy'),
              'setupHTTPTunnel': extract('setupHTTPTunnel', 'gotTerminalData'),
          }

          exact_dir = output_dir / 'exact-production-source'
          exact_dir.mkdir(parents=True, exist_ok=True)
          metadata = {}
          for name, text in components.items():
              payload = text.encode('latin-1')
              (exact_dir / f'{name}.min.js').write_bytes(payload)
              metadata[name] = {'sha256': digest(payload), 'bytes': len(payload)}

          create_source = components['createSocksResponse']
          include_first = create_source.find('__hostAllowedSubnets.length')
          exclude_after_include = create_source.find('__hostDisallowedSubnets.length', include_first + 1)
          socket_pattern = re.compile(
              r'var [A-Za-z_$][A-Za-z0-9_$]*=\{port:[A-Za-z_$][A-Za-z0-9_$]*,host:[A-Za-z_$][A-Za-z0-9_$]*,family:[A-Za-z_$][A-Za-z0-9_$]*\};[A-Za-z_$][A-Za-z0-9_$]*\.connect\('
          )
          assertions = {
              'policyGateChecksSubnetArraysBeforeDnsLookup':
                  '__hostDisallowedSubnets.length' in create_source and
                  '__hostAllowedSubnets.length' in create_source and
                  '.lookup(' in create_source,
              'dnsErrorFallsThroughToConnect': ':d()}):d()' in create_source,
              'includeBranchPrecedesExcludeBranch':
                  include_first >= 0 and exclude_after_include > include_first,
              'individualIpClassifierRequiresCidrSuffix':
                  '^([0-9]{1,3}.){3}' in components['convertToSubnets'] and
                  '/[0-3]?[0-9]$' in components['convertToSubnets'],
              'originalHostnameSentInProxyConnect':
                  'CONNECT "+a+" HTTP/1.1' in components['setupHTTPTunnel'],
              'directSocketWrapperBuildsHostOptionAndCallsConnect':
                  socket_pattern.search(source) is not None,
          }

          result = {
              'target': target,
              'binary': {
                  'filename': binary_path.name,
                  'bytes': len(data),
                  'sha256': digest(data),
              },
              'components': metadata,
              'assertions': assertions,
              'assertionsAllPass': all(assertions.values()),
          }
          (output_dir / 'fingerprint.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload platform fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-local-latest-${{ matrix.target }}-fingerprint
          path: cross-platform-output/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  compare:
    name: Compare security-relevant production code across platforms
    needs: fingerprint
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browserstack-local-latest-*-fingerprint
          path: fingerprints

      - name: Enforce cross-platform identity gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          files = sorted(Path('fingerprints').glob('*/fingerprint.json'))
          if len(files) != 3:
              raise SystemExit(f'expected 3 fingerprints, got {len(files)}: {files}')
          records = [json.loads(path.read_text(encoding='utf-8')) for path in files]
          targets = sorted(record['target'] for record in records)

          comparison = {}
          for name in sorted(records[0]['components']):
              values = {r['target']: r['components'][name]['sha256'] for r in records}
              comparison[name] = {
                  'sha256ByTarget': values,
                  'identicalAcrossPlatforms': len(set(values.values())) == 1,
              }

          gate = {
              'expectedTargetsPresent': targets == ['darwin-x64', 'linux-x64', 'win32'],
              'allPlatformAssertionsPass': all(r['assertionsAllPass'] for r in records),
              'allNamedSecurityRelevantComponentsIdentical':
                  all(item['identicalAcrossPlatforms'] for item in comparison.values()),
          }
          gate['overallPass'] = all(gate.values())
          result = {'targets': targets, 'records': records, 'comparison': comparison, 'gate': gate}

          out = Path('cross-platform-binding')
          out.mkdir()
          binding = out / 'cross_platform_binding.json'
          binding.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          with (out / 'SHA256SUMS.txt').open('w', encoding='utf-8') as handle:
              for path in files:
                  handle.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path}\n")
              handle.write(f"{hashlib.sha256(binding.read_bytes()).hexdigest()}  {binding}\n")

          print(json.dumps(gate, indent=2))
          if not gate['overallPass']:
              raise SystemExit(1)
          PY

      - name: Upload cross-platform binding gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-local-latest-cross-platform-binding
          path: cross-platform-binding/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
