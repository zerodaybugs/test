name: BrowserStack Local v8.8 offline reference

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-v88-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and inspect the official v8.8 Linux x64 reference
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p browserstack-local-v88/input browserstack-local-v88/output
          cd browserstack-local-v88/input

          url='https://bstack-local-prod.s3.amazonaws.com/binaries/release/v8.8/BrowserStackLocal-linux-x64.zip'
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output BrowserStackLocal-linux-x64-v8.8.zip "$url"

          printf '%s\n' "$url" > ../output/source_url.txt
          sha256sum BrowserStackLocal-linux-x64-v8.8.zip > ../output/SHA256SUMS.txt
          unzip -t BrowserStackLocal-linux-x64-v8.8.zip > ../output/unzip_test.txt
          unzip -q BrowserStackLocal-linux-x64-v8.8.zip -d extracted

          binary="$(find extracted -maxdepth 2 -type f -name BrowserStackLocal -print -quit)"
          test -n "$binary"
          chmod u+x "$binary"
          sha256sum "$binary" >> ../output/SHA256SUMS.txt
          file "$binary" > ../output/file.txt
          stat "$binary" > ../output/stat.txt
          timeout 10s "$binary" --version > ../output/version.txt 2>&1 || true
          timeout 10s "$binary" --help > ../output/help.txt 2>&1 || true

          strings -a -n 6 "$binary" > ../output/strings.txt
          grep -nEi 'createSocksResponse|__hostAllowed|__hostDisallowed|convertToSubnets|convertToRegexArray|testAgainstRegexArray|include-hosts|exclude-hosts' \
            ../output/strings.txt > ../output/keyword_lines.txt || true
          gzip -9 ../output/strings.txt

          BINARY_PATH="$binary" python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          data = Path(os.environ['BINARY_PATH']).read_bytes()
          keywords = [
              b'createSocksResponse', b'__hostAllowed', b'__hostDisallowed',
              b'convertToSubnets', b'convertToRegexArray',
              b'testAgainstRegexArray', b'include-hosts', b'exclude-hosts'
          ]

          segments = []
          for match in re.finditer(rb'[\x09\x0a\x0d\x20-\x7e]{512,}', data):
              blob = match.group(0)
              if any(keyword.lower() in blob.lower() for keyword in keywords):
                  segments.append({
                      'offset': match.start(),
                      'length': len(blob),
                      'keywords': [k.decode() for k in keywords if k.lower() in blob.lower()]
                  })
                  out = Path('../output') / f'ascii_segment_{len(segments):03d}_{match.start()}_{len(blob)}.txt'
                  out.write_bytes(blob)

          Path('../output/ascii_segments_index.json').write_text(
              json.dumps(segments, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload isolated v8.8 reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-local-v88-offline-reference
          path: browserstack-local-v88/output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
