name: BrowserStack Local v8.9 cross-platform offline binding

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    name: Fingerprint ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - win32
          - darwin-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and fingerprint official v8.9 binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 077
          work="browserstack-v89/${TARGET}"
          mkdir -p "$work/input" "cross-platform-output/${TARGET}"

          case "$TARGET" in
            linux-x64)
              url='https://bstack-local-prod.s3.amazonaws.com/binaries/release/v8.9/BrowserStackLocal-linux-x64.zip'
              ;;
            win32)
              url='https://bstack-local-prod.s3.amazonaws.com/binaries/release/v8.9/BrowserStackLocal-win32.zip'
              ;;
            darwin-x64)
              url='https://bstack-local-prod.s3.amazonaws.com/binaries/release/v8.9/BrowserStackLocal-darwin-x64.zip'
              ;;
            *)
              echo "Unexpected target: $TARGET" >&2
              exit 2
              ;;
          esac

          zip_path="$work/input/BrowserStackLocal-${TARGET}-v8.9.zip"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output "$zip_path" "$url"

          printf '%s\n' "$url" > "cross-platform-output/${TARGET}/source_url.txt"
          sha256sum "$zip_path" > "cross-platform-output/${TARGET}/SHA256SUMS.txt"
          unzip -t "$zip_path" > "cross-platform-output/${TARGET}/unzip_test.txt"
          unzip -q "$zip_path" -d "$work/input/extracted"

          binary="$(find "$work/input/extracted" -maxdepth 3 -type f \( -name BrowserStackLocal -o -name BrowserStackLocal.exe \) -print -quit)"
          test -n "$binary"
          sha256sum "$binary" >> "cross-platform-output/${TARGET}/SHA256SUMS.txt"
          file "$binary" > "cross-platform-output/${TARGET}/file.txt"
          stat "$binary" > "cross-platform-output/${TARGET}/stat.txt"

          BINARY_PATH="$binary" OUTPUT_DIR="cross-platform-output/${TARGET}" TARGET="$TARGET" python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          binary_path = Path(os.environ['BINARY_PATH'])
          output_dir = Path(os.environ['OUTPUT_DIR'])
          target = os.environ['TARGET']
          data = binary_path.read_bytes()
          source = data.decode('latin-1')

          def sha256_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def extract_property(name: str, next_name: str) -> str:
              anchored = f',{name}:function'
              unanchored = f'{name}:function'
              start = source.find(anchored)
              marker = anchored
              if start < 0:
                  start = source.find(unanchored)
                  marker = unanchored
              if start < 0:
                  raise RuntimeError(f'missing {name}:function')
              end_marker = f',{next_name}:function'
              end = source.find(end_marker, start + len(marker))
              if end < 0:
                  raise RuntimeError(f'missing {end_marker}')
              name_offset = marker.index(name)
              return source[start + name_offset + len(name) + 1:end]

          def extract_assignment(assignment: str, next_assignment: str) -> str:
              start = source.find(assignment)
              if start < 0:
                  raise RuntimeError(f'missing {assignment}')
              end = source.find(next_assignment, start + len(assignment))
              if end < 0:
                  raise RuntimeError(f'missing {next_assignment}')
              return source[start + assignment.index('=') + 1:end]

          components = {
              'createSocksResponse': extract_property('createSocksResponse', 'getSocketSummary'),
              'convertToSubnets': extract_property('convertToSubnets', 'convertToRegexArray'),
              'convertToRegexArray': extract_property('convertToRegexArray', 'testAgainstSubnetsArray'),
              'testAgainstSubnetsArray': extract_property('testAgainstSubnetsArray', 'testAgainstRegexArray'),
              'testAgainstRegexArray': extract_property('testAgainstRegexArray', 'generateMetadataForErrorEvent'),
              '_connectToLocalServer': extract_property('_connectToLocalServer', 'connectToLocalServer'),
              'connectToLocalServer': extract_property('connectToLocalServer', 'setSocketReadWithoutProxy'),
              'setupHTTPTunnel': extract_property('setupHTTPTunnel', 'gotTerminalData'),
              'socketWrapperJe': extract_assignment('je=function(e,t,n,r)', ',Me=function'),
          }

          exact_dir = output_dir / 'exact-production-source'
          exact_dir.mkdir(parents=True, exist_ok=True)
          component_meta = {}
          for name, text in components.items():
              payload = text.encode('latin-1')
              (exact_dir / f'{name}.min.js').write_bytes(payload)
              component_meta[name] = {
                  'sha256': sha256_bytes(payload),
                  'bytes': len(payload),
              }

          assertions = {
              'policyGateOnlyMentionsSubnetArrays':
                  'z.__hostDisallowedSubnets.length||z.__hostAllowedSubnets.length?b.lookup' in components['createSocksResponse'],
              'dnsErrorFallsThroughToConnect': ':d()}):d()' in components['createSocksResponse'],
              'includeBranchPrecedesExcludeBranch':
                  'z.__hostAllowedSubnets.length||z.__hostAllowedRegexes.length?' in components['createSocksResponse'],
              'individualIpCidrsOnlyClassifier':
                  '^[0-9]{1,3}' in components['convertToSubnets'] and '/[0-3]?[0-9]$' in components['convertToSubnets'],
              'originalHostnameSentInProxyConnect': 'CONNECT "+a+" HTTP/1.1' in components['setupHTTPTunnel'],
              'socketWrapperUsesOriginalHost': 'var l={port:a,host:s,family:u}' in components['socketWrapperJe'],
          }

          fingerprint = {
              'target': target,
              'archive': {
                  'filename': binary_path.parent.parent.name,
              },
              'binary': {
                  'filename': binary_path.name,
                  'bytes': len(data),
                  'sha256': sha256_bytes(data),
              },
              'components': component_meta,
              'assertions': assertions,
              'assertionsAllPass': all(assertions.values()),
          }
          (output_dir / 'fingerprint.json').write_text(
              json.dumps(fingerprint, indent=2) + '\n', encoding='utf-8'
          )
          if not fingerprint['assertionsAllPass']:
              raise SystemExit(json.dumps(fingerprint, indent=2))
          PY

      - name: Upload platform fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-local-v89-${{ matrix.target }}-fingerprint
          path: cross-platform-output/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  compare:
    name: Compare production policy code across platforms
    needs: fingerprint
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download all platform fingerprints
        uses: actions/download-artifact@v4
        with:
          pattern: browserstack-local-v89-*-fingerprint
          path: fingerprints

      - name: Enforce cross-platform source identity gate
        shell: bash
        run: |
          set -euo pipefail
          find fingerprints -maxdepth 3 -type f -print | sort
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          files = sorted(Path('fingerprints').glob('*/fingerprint.json'))
          if len(files) != 3:
              raise SystemExit(f'expected 3 fingerprints, got {len(files)}: {files}')

          records = [json.loads(path.read_text(encoding='utf-8')) for path in files]
          targets = sorted(record['target'] for record in records)
          component_names = sorted(records[0]['components'])
          comparison = {}
          for name in component_names:
              values = {record['target']: record['components'][name]['sha256'] for record in records}
              comparison[name] = {
                  'sha256ByTarget': values,
                  'identicalAcrossPlatforms': len(set(values.values())) == 1,
              }

          gate = {
              'targets': targets,
              'expectedTargetsPresent': targets == ['darwin-x64', 'linux-x64', 'win32'],
              'allPlatformAssertionsPass': all(record['assertionsAllPass'] for record in records),
              'allSecurityRelevantComponentsIdentical':
                  all(item['identicalAcrossPlatforms'] for item in comparison.values()),
          }
          gate['overallPass'] = all(value for key, value in gate.items() if key != 'targets')

          result = {
              'records': records,
              'comparison': comparison,
              'gate': gate,
          }
          out = Path('cross-platform-binding')
          out.mkdir()
          (out / 'cross_platform_binding.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          with (out / 'SHA256SUMS.txt').open('w', encoding='utf-8') as handle:
              for path in sorted(files):
                  handle.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path}\n")
              binding = out / 'cross_platform_binding.json'
              handle.write(f"{hashlib.sha256(binding.read_bytes()).hexdigest()}  {binding}\n")

          if not gate['overallPass']:
              raise SystemExit(json.dumps(result, indent=2))
          print(json.dumps(gate, indent=2))
          PY

      - name: Upload cross-platform binding gate
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-local-v89-cross-platform-binding
          path: cross-platform-binding/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
