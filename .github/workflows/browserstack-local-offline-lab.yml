name: BrowserStack Local v8.8 offline reference

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-v88-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and extract the official v8.8 Linux x64 reference
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p browserstack-local-v88/input browserstack-local-v88/output
          cd browserstack-local-v88/input

          url='https://bstack-local-prod.s3.amazonaws.com/binaries/release/v8.8/BrowserStackLocal-linux-x64.zip'
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output BrowserStackLocal-linux-x64-v8.8.zip "$url"

          printf '%s\n' "$url" > ../output/source_url.txt
          sha256sum BrowserStackLocal-linux-x64-v8.8.zip > ../output/SHA256SUMS.txt
          unzip -t BrowserStackLocal-linux-x64-v8.8.zip > ../output/unzip_test.txt
          unzip -q BrowserStackLocal-linux-x64-v8.8.zip -d extracted

          binary="$(find extracted -maxdepth 2 -type f -name BrowserStackLocal -print -quit)"
          test -n "$binary"
          chmod u+x "$binary"
          sha256sum "$binary" >> ../output/SHA256SUMS.txt
          file "$binary" > ../output/file.txt
          timeout 10s "$binary" --version > ../output/version.txt 2>&1 || true
          timeout 10s "$binary" --help > ../output/help.txt 2>&1 || true

          BINARY_PATH="$binary" python3 - <<'PY'
          from pathlib import Path
          import os

          binary = Path(os.environ['BINARY_PATH']).read_bytes()
          prefix = b'!function e(t,n,r){'
          suffix = b'},{},[1]);bslocal'
          start = binary.find(prefix)
          if start < 0:
              raise SystemExit('embedded Browserify prefix not found')
          end = binary.find(suffix, start)
          if end < 0:
              raise SystemExit('embedded Browserify suffix not found')
          end += len(suffix)
          bundle = binary[start:end]
          Path('../output/embedded_bundle_v8.8.min.js').write_bytes(bundle)
          Path('../output/extraction.txt').write_text(
              f'prefix_offset={start}\nend_offset={end}\nbundle_bytes={len(bundle)}\n',
              encoding='utf-8'
          )
          PY

      - name: Upload isolated v8.8 reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-local-v88-offline-reference
          path: browserstack-local-v88/output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
