name: BrowserStack Local offline lab

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and inspect the current official Linux x64 binary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p browserstack-local-lab/input browserstack-local-lab/output
          cd browserstack-local-lab/input

          url='https://local-downloads.browserstack.com/BrowserStackLocal-linux-x64.zip'
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output BrowserStackLocal-linux-x64.zip "$url"

          printf '%s\n' "$url" > ../output/source_url.txt
          sha256sum BrowserStackLocal-linux-x64.zip > ../output/SHA256SUMS.txt
          unzip -t BrowserStackLocal-linux-x64.zip > ../output/unzip_test.txt
          unzip -q BrowserStackLocal-linux-x64.zip -d extracted

          binary="$(find extracted -maxdepth 2 -type f -name BrowserStackLocal -print -quit)"
          test -n "$binary"
          chmod u+x "$binary"

          sha256sum "$binary" >> ../output/SHA256SUMS.txt
          file "$binary" > ../output/file.txt
          stat "$binary" > ../output/stat.txt
          timeout 10s "$binary" --version > ../output/version.txt 2>&1 || true
          timeout 10s "$binary" --help > ../output/help.txt 2>&1 || true
          readelf -h "$binary" > ../output/readelf_header.txt 2>&1 || true
          readelf -lW "$binary" > ../output/readelf_program_headers.txt 2>&1 || true
          readelf -dW "$binary" > ../output/readelf_dynamic.txt 2>&1 || true
          readelf -nW "$binary" > ../output/readelf_notes.txt 2>&1 || true
          objdump -p "$binary" > ../output/objdump_private_headers.txt 2>&1 || true
          ldd "$binary" > ../output/ldd.txt 2>&1 || true
          strings -a -n 6 "$binary" > ../output/strings.txt

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('../output')
          text = (root / 'strings.txt').read_text(errors='replace')
          urls = sorted(set(re.findall(r'(?i)(?:https?|wss?)://[^\s\x00"\'<>]{4,300}', text)))
          paths = sorted(set(re.findall(r'(?<![A-Za-z0-9])/(?:[A-Za-z0-9._~!$&()*+,;=:@%-]+/?){2,}', text)))
          keywords = [
              'localIdentifier', 'include-hosts', 'exclude-hosts', 'force-local',
              'disable-ssl-validation', 'auth_token', 'access_key', 'repeater',
              'websocket', 'localhost:45454', 'local/v1', 'binary/api/v1'
          ]
          hits = {}
          lines = text.splitlines()
          for keyword in keywords:
              hits[keyword] = sorted({line for line in lines if keyword.lower() in line.lower()})[:500]

          (root / 'extracted_urls.json').write_text(json.dumps(urls, indent=2), encoding='utf-8')
          (root / 'extracted_paths.json').write_text(json.dumps(paths[:20000], indent=2), encoding='utf-8')
          (root / 'keyword_hits.json').write_text(json.dumps(hits, indent=2), encoding='utf-8')
          PY

          cp BrowserStackLocal-linux-x64.zip ../output/
          cp "$binary" ../output/BrowserStackLocal

      - name: Upload isolated research artifact
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-local-offline-lab
          path: browserstack-local-lab/output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
