name: BSC Chapel Public Contract State Snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Capture public read-only state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot

          RPC=''
          for candidate in \
            'https://bsc-testnet-rpc.publicnode.com' \
            'https://data-seed-prebsc-1-s1.bnbchain.org:8545' \
            'https://data-seed-prebsc-2-s1.bnbchain.org:8545' \
            'https://bsc-testnet.public.blastapi.io' \
            'https://bsc-testnet.drpc.org'; do
            if [[ "$(cast chain-id --rpc-url "$candidate" 2>/dev/null || true)" == '97' ]]; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"

          TCGV='0xba9e4d6b0b8c3bb13b28a3b3a2f09012674ed5c0'
          NEXUS='0xb11426b649404ef2df7f8f7acf3de3aa00e3ed60'
          BUY='0x3d5c49910f32ed78dc83141fabf1033d7b5e52e2'
          STAKING='0x8d2478b2901036a4a0f88c4dfe6b6075e02d197a'
          BASIC='0xe901ec321c5aa78f080bf99cc31e7b83c7a0fd0d'
          FOUNDER='0xb8a75c065556c95f7ce86eaefdce849afa8e6324'
          LAUNCH='0x411db8fa3638976b6802e76bb0789014eed4c1e9'
          WRAPPER='0xfdc1b93a80b56efd66dda8c82f1f5f70f3fa1178'
          TCGR='0xd9be1afabdcc07faed8f64d9dbfe56459085bb0d'
          CONVERTER='0xe150b30181d455c8a47a27dbebb1de41ec6d8d97'
          USDC='0xc6ace01ffc5b8925d5f4c2d427481f8612b4ca1b'
          PAIR='0xe7ebfbf0cadad62b03935b87ddf4bf570e9594e5'

          call() {
            local label="$1" address="$2" signature="$3"
            shift 3
            local value
            if value="$(cast call "$address" "$signature" "$@" --rpc-url "$RPC" 2>&1)"; then
              printf '%s\tOK\t%s\n' "$label" "$value" >> snapshot/state.tsv
            else
              printf '%s\tERROR\t%s\n' "$label" "$value" >> snapshot/state.tsv
            fi
          }

          {
            echo -e 'key\tstatus\tvalue'
            echo -e "metadata.rpc\tOK\t$RPC"
            echo -e "metadata.chainId\tOK\t$(cast chain-id --rpc-url "$RPC")"
            echo -e "metadata.blockNumber\tOK\t$(cast block-number --rpc-url "$RPC")"
            echo -e "metadata.timestampUtc\tOK\t$(date -u +%FT%TZ)"
          } > snapshot/state.tsv

          for item in \
            "TCGV:$TCGV" "NEXUS:$NEXUS" "BUY:$BUY" "STAKING:$STAKING" \
            "BASIC:$BASIC" "FOUNDER:$FOUNDER" "LAUNCH:$LAUNCH" "WRAPPER:$WRAPPER" \
            "TCGR:$TCGR" "CONVERTER:$CONVERTER" "USDC:$USDC" "PAIR:$PAIR"; do
            label="${item%%:*}"; address="${item#*:}"
            code="$(cast code "$address" --rpc-url "$RPC")"
            echo -e "code.$label.bytes\tOK\t$(( (${#code} - 2) / 2 ))" >> snapshot/state.tsv
            echo -e "code.$label.keccak\tOK\t$(cast keccak "$code")" >> snapshot/state.tsv
          done

          call USDC.name "$USDC" 'name()(string)'
          call USDC.symbol "$USDC" 'symbol()(string)'
          call USDC.decimals "$USDC" 'decimals()(uint8)'
          call USDC.totalSupply "$USDC" 'totalSupply()(uint256)'

          call TCGV.nexusToken "$TCGV" 'nexusToken()(address)'
          call TCGV.stakingVault "$TCGV" 'stakingVault()(address)'
          call TCGV.initialLaunch "$TCGV" 'initialLaunch()(address)'
          call TCGV.buyRouter "$TCGV" 'buyRouter()(address)'
          call TCGV.vaultAddress "$TCGV" 'vaultAddress()(address)'
          call TCGV.marketingAddress "$TCGV" 'marketingAddress()(address)'
          call TCGV.communityAddress "$TCGV" 'communityAddress()(address)'
          call TCGV.totalSupply "$TCGV" 'totalSupply()(uint256)'
          call TCGV.presaleActive "$TCGV" 'presaleActive()(bool)'
          call TCGV.supplyRecomputed "$TCGV" 'supplyRecomputed()(bool)'
          call TCGV.feesEnabled "$TCGV" 'feesEnabled()(bool)'
          call TCGV.cashbackEnabled "$TCGV" 'cashbackEnabled()(bool)'
          call TCGV.paused "$TCGV" 'paused()(bool)'
          call TCGV.minBuyAmount "$TCGV" 'minBuyAmount()(uint256)'
          call TCGV.minSellAmount "$TCGV" 'minSellAmount()(uint256)'
          call TCGV.pendingAutolp "$TCGV" 'pendingAutolp()(uint256)'
          call TCGV.isPair.PAIR "$TCGV" 'isPair(address)(bool)' "$PAIR"
          call TCGV.isExcluded.BUY "$TCGV" 'isExcludedFromFees(address)(bool)' "$BUY"
          call TCGV.isExcluded.STAKING "$TCGV" 'isExcludedFromFees(address)(bool)' "$STAKING"
          call TCGV.isExcluded.WRAPPER "$TCGV" 'isExcludedFromFees(address)(bool)' "$WRAPPER"

          call NEXUS.minter "$NEXUS" 'minter()(address)'
          call NEXUS.founderNFTPresaleBonus "$NEXUS" 'founderNFTPresaleBonus()(address)'
          call NEXUS.initialLaunchPresaleBonus "$NEXUS" 'initialLaunchPresaleBonus()(address)'
          call NEXUS.totalSupply "$NEXUS" 'totalSupply()(uint256)'

          call BUY.router "$BUY" 'router()(address)'
          call BUY.factory "$BUY" 'factory()(address)'
          call BUY.tcgv "$BUY" 'tcgv()(address)'
          call BUY.usdc "$BUY" 'usdc()(address)'
          call BUY.vault "$BUY" 'vault()(address)'
          call BUY.marketing "$BUY" 'marketing()(address)'
          call BUY.community "$BUY" 'community()(address)'
          call BUY.referralToken "$BUY" 'referralToken()(address)'
          call BUY.buyVaultBp "$BUY" 'buyVaultBp()(uint256)'
          call BUY.buyMarketingBp "$BUY" 'buyMarketingBp()(uint256)'
          call BUY.buyCommunityBp "$BUY" 'buyCommunityBp()(uint256)'
          call BUY.sellTaxBp "$BUY" 'sellTaxBp()(uint256)'

          call STAKING.asset "$STAKING" 'asset()(address)'
          call STAKING.totalAssets "$STAKING" 'totalAssets()(uint256)'
          call STAKING.totalSupply "$STAKING" 'totalSupply()(uint256)'
          call STAKING.requiredStakeForBasicNFT "$STAKING" 'requiredStakeForBasicNFT()(uint256)'
          call STAKING.basicNFTContract "$STAKING" 'basicNFTContract()(address)'
          call STAKING.basicNFTPricingRouter "$STAKING" 'basicNFTPricingRouter()(address)'
          call STAKING.basicNFTPricingUsdc "$STAKING" 'basicNFTPricingUsdc()(address)'
          call STAKING.basicNFTPricingTwapAnchor "$STAKING" 'basicNFTPricingTwapAnchor()(uint32,uint256)'

          call BASIC.stakingVault "$BASIC" 'stakingVault()(address)'
          call BASIC.totalSupply "$BASIC" 'totalSupply()(uint256)'
          call BASIC.totalMinted "$BASIC" 'totalMinted()(uint256)'
          call BASIC.requiredStake "$BASIC" 'requiredStake()(uint256)'

          call FOUNDER.usdc "$FOUNDER" 'usdc()(address)'
          call FOUNDER.nexusToken "$FOUNDER" 'nexusToken()(address)'
          call FOUNDER.wave2StartTimestamp "$FOUNDER" 'wave2StartTimestamp()(uint256)'
          call FOUNDER.caspUsdcRecipient "$FOUNDER" 'caspUsdcRecipient()(address)'
          call FOUNDER.soldCount "$FOUNDER" 'soldCount()(uint256)'
          call FOUNDER.strategicReserveMinted "$FOUNDER" 'strategicReserveMinted()(uint256)'
          call FOUNDER.currentWave "$FOUNDER" 'currentWave()(uint256)'
          call FOUNDER.currentPrice "$FOUNDER" 'currentPrice()(uint256)'

          call LAUNCH.tcgv "$LAUNCH" 'tcgv()(address)'
          call LAUNCH.usdc "$LAUNCH" 'usdc()(address)'
          call LAUNCH.founderNFT "$LAUNCH" 'founderNFT()(address)'
          call LAUNCH.nexusToken "$LAUNCH" 'nexusToken()(address)'
          call LAUNCH.totalTCGVAllocated "$LAUNCH" 'totalTCGVAllocated()(uint256)'
          call LAUNCH.tgeTimestamp "$LAUNCH" 'tgeTimestamp()(uint256)'
          call LAUNCH.treasury "$LAUNCH" 'treasury()(address)'
          call LAUNCH.presaleStartTimestamp "$LAUNCH" 'presaleStartTimestamp()(uint256)'
          call LAUNCH.presaleEndTime "$LAUNCH" 'presaleEndTime()(uint256)'
          call LAUNCH.currentPrice "$LAUNCH" 'currentPrice()(uint256)'

          call TCGR.minter "$TCGR" 'minter()(address)'
          call TCGR.converter "$TCGR" 'converter()(address)'
          call TCGR.qualifyingNft "$TCGR" 'qualifyingNft()(address)'
          call TCGR.totalSupply "$TCGR" 'totalSupply()(uint256)'

          call CONVERTER.tcgr "$CONVERTER" 'tcgr()(address)'
          call CONVERTER.tcgv "$CONVERTER" 'tcgv()(address)'
          call CONVERTER.ratio "$CONVERTER" 'ratio()(uint256)'

          call PAIR.token0 "$PAIR" 'token0()(address)'
          call PAIR.token1 "$PAIR" 'token1()(address)'
          call PAIR.getReserves "$PAIR" 'getReserves()(uint112,uint112,uint32)'
          call PAIR.totalSupply "$PAIR" 'totalSupply()(uint256)'

          call WRAPPER.tcgvToken "$WRAPPER" 'tcgvToken()(address)'

          for account_item in \
            "PAIR:$PAIR" "BUY:$BUY" "STAKING:$STAKING" "FOUNDER:$FOUNDER" \
            "LAUNCH:$LAUNCH" "WRAPPER:$WRAPPER" "CONVERTER:$CONVERTER"; do
            label="${account_item%%:*}"; account="${account_item#*:}"
            call "USDC.balance.$label" "$USDC" 'balanceOf(address)(uint256)' "$account"
            call "TCGV.balance.$label" "$TCGV" 'balanceOf(address)(uint256)' "$account"
          done

          sha256sum snapshot/state.tsv > snapshot/SHA256SUMS.txt
          echo "Captured public state at block $(cast block-number --rpc-url "$RPC")"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bsc-chapel-public-state-snapshot
          path: snapshot
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
