name: BSC97 read-only state snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/bsc97-readonly-state.yml'
      - 'bsc97-readonly-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install pinned read-only RPC client
        run: npm install --no-save --no-audit --no-fund viem@2.43.0

      - name: Write state snapshot script
        shell: bash
        run: |
          mkdir -p snapshot
          cat > bsc97-readonly-state.mjs <<'EOF'
          import fs from 'node:fs';
          import {
            createPublicClient,
            formatUnits,
            http,
            keccak256,
            parseAbi,
          } from 'viem';
          import { bscTestnet } from 'viem/chains';

          const addresses = {
            TCGV: '0xba9e4d6b0b8c3bb13b28a3b3a2f09012674ed5c0',
            NEXUS: '0xb11426b649404ef2df7f8f7acf3de3aa00e3ed60',
            BUY_ROUTER: '0x3d5c49910f32ed78dc83141fabf1033d7b5e52e2',
            STAKING: '0x8d2478b2901036a4a0f88c4dfe6b6075e02d197a',
            BASIC_NFT: '0xe901ec321c5aa78f080bf99cc31e7b83c7a0fd0d',
            FOUNDER_NFT: '0xb8a75c065556c95f7ce86eaefdce849afa8e6324',
            INITIAL_LAUNCH: '0x411db8fa3638976b6802e76bb0789014eed4c1e9',
            WRAPPER: '0xfdc1b93a80b56efd66dda8c82f1f5f70f3fa1178',
            TCGR: '0xd9be1afabdcc07faed8f64d9dbfe56459085bb0d',
            CONVERTER: '0xe150b30181d455c8a47a27dbebb1de41ec6d8d97',
            USDC: '0xc6ace01ffc5b8925d5f4c2d427481f8612b4ca1b',
            PAIR: '0xe7ebfbf0cadad62b03935b87ddf4bf570e9594e5',
          };

          const rpcUrls = [
            'https://bsc-testnet-rpc.publicnode.com',
            'https://data-seed-prebsc-1-s1.bnbchain.org:8545',
            'https://data-seed-prebsc-2-s1.bnbchain.org:8545',
            'https://bsc-testnet.public.blastapi.io',
            'https://bsc-testnet.drpc.org',
            'https://97.rpc.thirdweb.com',
          ];

          let client;
          let selectedRpc;
          const rpcErrors = [];
          for (const url of rpcUrls) {
            const candidate = createPublicClient({
              chain: bscTestnet,
              transport: http(url, { timeout: 15_000, retryCount: 1 }),
              batch: { multicall: false },
            });
            try {
              const [chainId, blockNumber] = await Promise.all([
                candidate.getChainId(),
                candidate.getBlockNumber(),
              ]);
              if (chainId !== 97) throw new Error(`unexpected chainId ${chainId}`);
              client = candidate;
              selectedRpc = url;
              console.log(`selected_rpc=${url} block=${blockNumber}`);
              break;
            } catch (error) {
              rpcErrors.push({ url, error: String(error) });
            }
          }
          if (!client) {
            throw new Error(`No BSC testnet endpoint available: ${JSON.stringify(rpcErrors)}`);
          }

          const abi = parseAbi([
            'function owner() view returns (address)',
            'function name() view returns (string)',
            'function symbol() view returns (string)',
            'function decimals() view returns (uint8)',
            'function totalSupply() view returns (uint256)',
            'function balanceOf(address) view returns (uint256)',
            'function asset() view returns (address)',
            'function totalAssets() view returns (uint256)',
            'function nexusToken() view returns (address)',
            'function stakingVault() view returns (address)',
            'function initialLaunch() view returns (address)',
            'function buyRouter() view returns (address)',
            'function vaultAddress() view returns (address)',
            'function marketingAddress() view returns (address)',
            'function communityAddress() view returns (address)',
            'function presaleActive() view returns (bool)',
            'function supplyRecomputed() view returns (bool)',
            'function feesEnabled() view returns (bool)',
            'function cashbackEnabled() view returns (bool)',
            'function paused() view returns (bool)',
            'function pendingAutolp() view returns (uint256)',
            'function isPair(address) view returns (bool)',
            'function isExcludedFromFees(address) view returns (bool)',
            'function minter() view returns (address)',
            'function founderNFTPresaleBonus() view returns (address)',
            'function initialLaunchPresaleBonus() view returns (address)',
            'function router() view returns (address)',
            'function factory() view returns (address)',
            'function tcgv() view returns (address)',
            'function usdc() view returns (address)',
            'function referralToken() view returns (address)',
            'function requiredStakeForBasicNFT() view returns (uint256)',
            'function basicNFTContract() view returns (address)',
            'function basicNFTPricingRouter() view returns (address)',
            'function basicNFTPricingUsdc() view returns (address)',
            'function basicNFTPricingTwapAnchor() view returns (uint32,uint256)',
            'function totalMinted() view returns (uint256)',
            'function requiredStake() view returns (uint256)',
            'function wave2StartTimestamp() view returns (uint256)',
            'function soldCount() view returns (uint256)',
            'function strategicReserveMinted() view returns (uint256)',
            'function currentWave() view returns (uint256)',
            'function currentPrice() view returns (uint256)',
            'function founderNFT() view returns (address)',
            'function totalTCGVAllocated() view returns (uint256)',
            'function tgeTimestamp() view returns (uint256)',
            'function treasury() view returns (address)',
            'function presaleStartTimestamp() view returns (uint256)',
            'function presaleEndTime() view returns (uint256)',
            'function converter() view returns (address)',
            'function qualifyingNft() view returns (address)',
            'function ratio() view returns (uint256)',
            'function token0() view returns (address)',
            'function token1() view returns (address)',
            'function getReserves() view returns (uint112,uint112,uint32)',
            'function allowedRouters(address) view returns (bool)',
            'function tcgvToken() view returns (address)',
          ]);

          const normalize = (value) => {
            if (typeof value === 'bigint') return value.toString();
            if (Array.isArray(value)) return value.map(normalize);
            return value;
          };

          const out = {
            schema: 'bsc97-readonly-state/v1',
            capturedAt: new Date().toISOString(),
            selectedRpc,
            rpcErrors,
            addresses,
            contracts: {},
            calls: {},
            summary: {},
          };

          const blockNumber = await client.getBlockNumber();
          const block = await client.getBlock({ blockNumber });
          out.chainId = await client.getChainId();
          out.blockNumber = blockNumber.toString();
          out.blockTimestamp = block.timestamp.toString();
          out.blockTimestampIso = new Date(Number(block.timestamp) * 1000).toISOString();

          for (const [name, address] of Object.entries(addresses)) {
            const code = await client.getCode({ address, blockNumber });
            out.contracts[name] = {
              address,
              hasCode: Boolean(code && code !== '0x'),
              codeBytes: code && code !== '0x' ? (code.length - 2) / 2 : 0,
              codeHash: code && code !== '0x' ? keccak256(code) : null,
            };
          }

          async function read(label, address, functionName, args = []) {
            try {
              const value = await client.readContract({
                address,
                abi,
                functionName,
                args,
                blockNumber,
              });
              out.calls[label] = { ok: true, value: normalize(value) };
              return value;
            } catch (error) {
              out.calls[label] = { ok: false, error: String(error) };
              return undefined;
            }
          }

          const usdcDecimals = await read('USDC.decimals', addresses.USDC, 'decimals');
          await read('USDC.name', addresses.USDC, 'name');
          await read('USDC.symbol', addresses.USDC, 'symbol');
          const tcgvSupply = await read('TCGV.totalSupply', addresses.TCGV, 'totalSupply');
          const tcgrSupply = await read('TCGR.totalSupply', addresses.TCGR, 'totalSupply');
          const nexusSupply = await read('NEXUS.totalSupply', addresses.NEXUS, 'totalSupply');
          const stakingAssets = await read('STAKING.totalAssets', addresses.STAKING, 'totalAssets');
          const stakingSupply = await read('STAKING.totalSupply', addresses.STAKING, 'totalSupply');
          const basicSupply = await read('BASIC_NFT.totalSupply', addresses.BASIC_NFT, 'totalSupply');
          await read('BASIC_NFT.totalMinted', addresses.BASIC_NFT, 'totalMinted');
          const launchAllocated = await read('INITIAL_LAUNCH.totalTCGVAllocated', addresses.INITIAL_LAUNCH, 'totalTCGVAllocated');
          const qualifyingNft = await read('TCGR.qualifyingNft', addresses.TCGR, 'qualifyingNft');
          const converterReserve = await read('TCGV.balanceOf(CONVERTER)', addresses.TCGV, 'balanceOf', [addresses.CONVERTER]);

          for (const fn of [
            'presaleActive', 'supplyRecomputed', 'feesEnabled', 'cashbackEnabled',
            'paused', 'pendingAutolp', 'stakingVault', 'initialLaunch', 'buyRouter',
            'nexusToken', 'vaultAddress', 'marketingAddress', 'communityAddress',
          ]) await read(`TCGV.${fn}`, addresses.TCGV, fn);
          await read('TCGV.isPair(PAIR)', addresses.TCGV, 'isPair', [addresses.PAIR]);
          await read('TCGV.isExcluded(BUY_ROUTER)', addresses.TCGV, 'isExcludedFromFees', [addresses.BUY_ROUTER]);
          await read('TCGV.isExcluded(STAKING)', addresses.TCGV, 'isExcludedFromFees', [addresses.STAKING]);
          await read('TCGV.isExcluded(WRAPPER)', addresses.TCGV, 'isExcludedFromFees', [addresses.WRAPPER]);

          for (const fn of ['minter', 'founderNFTPresaleBonus', 'initialLaunchPresaleBonus']) {
            await read(`NEXUS.${fn}`, addresses.NEXUS, fn);
          }

          const pancakeRouter = await read('BUY_ROUTER.router', addresses.BUY_ROUTER, 'router');
          for (const fn of ['factory', 'tcgv', 'usdc', 'referralToken']) {
            await read(`BUY_ROUTER.${fn}`, addresses.BUY_ROUTER, fn);
          }

          for (const fn of [
            'asset', 'requiredStakeForBasicNFT', 'basicNFTContract',
            'basicNFTPricingRouter', 'basicNFTPricingUsdc', 'basicNFTPricingTwapAnchor',
          ]) await read(`STAKING.${fn}`, addresses.STAKING, fn);
          await read('BASIC_NFT.stakingVault', addresses.BASIC_NFT, 'stakingVault');
          await read('BASIC_NFT.requiredStake', addresses.BASIC_NFT, 'requiredStake');

          for (const fn of [
            'soldCount', 'strategicReserveMinted', 'wave2StartTimestamp',
            'currentWave', 'currentPrice',
          ]) await read(`FOUNDER_NFT.${fn}`, addresses.FOUNDER_NFT, fn);
          for (const fn of [
            'founderNFT', 'tgeTimestamp', 'treasury', 'presaleStartTimestamp',
            'presaleEndTime', 'currentPrice',
          ]) await read(`INITIAL_LAUNCH.${fn}`, addresses.INITIAL_LAUNCH, fn);

          await read('TCGR.minter', addresses.TCGR, 'minter');
          await read('TCGR.converter', addresses.TCGR, 'converter');
          await read('CONVERTER.tcgr', addresses.CONVERTER, 'tcgr');
          await read('CONVERTER.tcgv', addresses.CONVERTER, 'tcgv');
          await read('CONVERTER.ratio', addresses.CONVERTER, 'ratio');
          await read('WRAPPER.tcgvToken', addresses.WRAPPER, 'tcgvToken');
          if (pancakeRouter) {
            await read('WRAPPER.allowedRouters(Pancake)', addresses.WRAPPER, 'allowedRouters', [pancakeRouter]);
          }

          const token0 = await read('PAIR.token0', addresses.PAIR, 'token0');
          const token1 = await read('PAIR.token1', addresses.PAIR, 'token1');
          const reserves = await read('PAIR.getReserves', addresses.PAIR, 'getReserves');
          const lpSupply = await read('PAIR.totalSupply', addresses.PAIR, 'totalSupply');

          const watched = [
            addresses.PAIR, addresses.BUY_ROUTER, addresses.STAKING,
            addresses.FOUNDER_NFT, addresses.INITIAL_LAUNCH,
            addresses.CONVERTER, addresses.WRAPPER,
          ];
          for (const account of watched) {
            await read(`TCGV.balanceOf(${account})`, addresses.TCGV, 'balanceOf', [account]);
            await read(`USDC.balanceOf(${account})`, addresses.USDC, 'balanceOf', [account]);
          }

          let pair = null;
          if (Array.isArray(reserves) && reserves.length >= 2 && token0 && token1) {
            const r0 = reserves[0];
            const r1 = reserves[1];
            const tcgvReserve = token0.toLowerCase() === addresses.TCGV.toLowerCase() ? r0 : r1;
            const usdcReserve = token0.toLowerCase() === addresses.USDC.toLowerCase() ? r0 : r1;
            pair = {
              token0,
              token1,
              reserve0: r0.toString(),
              reserve1: r1.toString(),
              tcgvReserve: tcgvReserve.toString(),
              usdcReserve: usdcReserve.toString(),
              tcgvFormatted: formatUnits(tcgvReserve, 18),
              usdcFormatted: usdcDecimals === undefined ? null : formatUnits(usdcReserve, Number(usdcDecimals)),
              lpSupply: lpSupply === undefined ? null : lpSupply.toString(),
            };
          }

          const zero = '0x0000000000000000000000000000000000000000';
          out.summary = {
            usdcDecimals: normalize(usdcDecimals),
            tcgvSupply: normalize(tcgvSupply),
            tcgrSupply: normalize(tcgrSupply),
            nexusSupply: normalize(nexusSupply),
            stakingAssets: normalize(stakingAssets),
            stakingSupply: normalize(stakingSupply),
            basicNftSupply: normalize(basicSupply),
            launchAllocated: normalize(launchAllocated),
            qualifyingNft: normalize(qualifyingNft),
            qualifyingNftActive: typeof qualifyingNft === 'string' && qualifyingNft.toLowerCase() !== zero,
            converterReserve: normalize(converterReserve),
            pair,
            missingCode: Object.entries(out.contracts).filter(([, value]) => !value.hasCode).map(([name]) => name),
            failedCalls: Object.entries(out.calls).filter(([, value]) => !value.ok).map(([name]) => name),
          };

          fs.writeFileSync('snapshot/state.json', JSON.stringify(out, null, 2));
          const summary = [
            `CAPTURED_AT=${out.capturedAt}`,
            `RPC=${selectedRpc}`,
            `BLOCK=${out.blockNumber}`,
            `BLOCK_TIME=${out.blockTimestampIso}`,
            `USDC_DECIMALS=${String(out.summary.usdcDecimals)}`,
            `TCGV_SUPPLY=${String(out.summary.tcgvSupply)}`,
            `TCGR_SUPPLY=${String(out.summary.tcgrSupply)}`,
            `NEXUS_SUPPLY=${String(out.summary.nexusSupply)}`,
            `STAKING_ASSETS=${String(out.summary.stakingAssets)}`,
            `STAKING_SUPPLY=${String(out.summary.stakingSupply)}`,
            `BASIC_NFT_SUPPLY=${String(out.summary.basicNftSupply)}`,
            `LAUNCH_ALLOCATED=${String(out.summary.launchAllocated)}`,
            `QUALIFYING_NFT=${String(out.summary.qualifyingNft)}`,
            `CONVERTER_RESERVE=${String(out.summary.converterReserve)}`,
            `PAIR=${JSON.stringify(out.summary.pair)}`,
            `MISSING_CODE=${out.summary.missingCode.join(',') || 'none'}`,
            `FAILED_CALLS=${out.summary.failedCalls.join(',') || 'none'}`,
          ].join('\n') + '\n';
          fs.writeFileSync('snapshot/summary.txt', summary);
          console.log(summary);
          EOF

      - name: Execute read-only snapshot
        run: node bsc97-readonly-state.mjs 2>&1 | tee snapshot/run.log

      - name: Record integrity
        if: always()
        run: |
          node --version > snapshot/NODE_VERSION.txt
          npm list viem --depth=0 > snapshot/DEPENDENCY_VERSION.txt || true
          sha256sum snapshot/* | sort > snapshot/SHA256SUMS.txt

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsc97-readonly-state
          path: snapshot/
          if-no-files-found: error
          retention-days: 1
