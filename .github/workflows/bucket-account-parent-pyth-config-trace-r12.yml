name: Bucket Account Parent and Pyth Config Trace R12

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Trace object-owned Accounts and Pyth tolerance update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-account-parent-pyth-config-r12
          mkdir -p bucket-account-parent-pyth-config-r12/raw

          cat > bucket-account-parent-pyth-config-r12/trace.py <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-account-parent-pyth-config-r12')
          RAW = OUT / 'raw'
          RPCS = [
              'https://fullnode.mainnet.sui.io:443',
              'https://sui-mainnet-endpoint.blockvision.org',
          ]
          ACCOUNTS = [
              {
                  'id': '0x0bd4c9887129746355e0b44552fc2c92787a4fa418249ce1f92e84ab47e28b54',
                  'parent': '0x85e245228f58564e6e3191a6f1c39a23f4a1a79fc7060d5f4062ed30728ee76f',
                  'creationTx': 'HVR8WaaERqPGFgrUBazcYvUiqfAMkC8GAZzVLM956Pva',
              },
              {
                  'id': '0x3d3ea407522b697303737f6fd736ef71672af6fdbac6e8a2478245082145d712',
                  'parent': '0x4254a80f281d22ea9fe08fb1826db38139e68acd5bf331b34d6a93c2c24eb6ce',
                  'creationTx': 'H4zmR9FVxmto7JD4REqWYaz6H5AxB77P6hniDaoTGrjp',
              },
              {
                  'id': '0xb4ec04eacb8e070cf372796f2f311d16105dc15a2ecda547acd5e5b7465b69ed',
                  'parent': '0x6e6ec86d8384507e3b54700406bf69fc0b6e571e0feb54cd841d49710e2ea7b7',
                  'creationTx': '89s1sEUogegTx9FRqzJwEuqe3868S1hcpABWhPkLXkDr',
              },
          ]
          PYTH_CONFIG = '0x00aea60b799575ae4203bcc80c16844c4d514d5af661200c4565f6d5a6deac1f'
          PYTH_CONFIG_TX = 'Dj73y5CRSVSmTRKjixbKvGd9ADrhb9VFmG5GbkXhYd19'

          def post(url, payload, retries=6, timeout=180):
              data = json.dumps(payload).encode()
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          data=data,
                          method='POST',
                          headers={
                              'Content-Type': 'application/json',
                              'User-Agent': 'bucket-account-parent-pyth-config-r12/1',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 ** attempt, 30))
              raise RuntimeError(f'POST failed for {url}: {last}')

          def rpc(method, params):
              failures = []
              for endpoint in RPCS:
                  try:
                      body = post(endpoint, {
                          'jsonrpc': '2.0',
                          'id': 1,
                          'method': method,
                          'params': params,
                      })
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return {'endpoint': endpoint, 'result': body.get('result')}
                  except Exception as exc:
                      failures.append({'endpoint': endpoint, 'error': str(exc)})
              return {'failures': failures}

          def dump(name, value):
              (RAW / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          OPTIONS = {
              'showType': True,
              'showOwner': True,
              'showPreviousTransaction': True,
              'showDisplay': True,
              'showContent': True,
              'showBcs': True,
          }
          TX_OPTIONS = {
              'showInput': True,
              'showRawInput': True,
              'showEffects': True,
              'showEvents': True,
              'showObjectChanges': True,
              'showBalanceChanges': True,
          }

          def object_data(object_id):
              wrapper = rpc('sui_getObject', [object_id, OPTIONS])
              dump(f'object_{object_id}.json', wrapper)
              result = wrapper.get('result') if isinstance(wrapper, dict) else None
              return (result or {}).get('data') if isinstance(result, dict) else None

          def tx_data(digest):
              wrapper = rpc('sui_getTransactionBlock', [digest, TX_OPTIONS])
              dump(f'tx_{digest}.json', wrapper)
              return wrapper.get('result') if isinstance(wrapper, dict) else None

          def owner_kind(owner):
              if not isinstance(owner, dict):
                  return None
              for key, label in [
                  ('Shared', 'Shared'),
                  ('AddressOwner', 'AddressOwner'),
                  ('ObjectOwner', 'ObjectOwner'),
                  ('Immutable', 'Immutable'),
              ]:
                  if key in owner:
                      return label
              lowered = {str(k).lower(): k for k in owner}
              for key, label in [
                  ('shared', 'Shared'),
                  ('addressowner', 'AddressOwner'),
                  ('objectowner', 'ObjectOwner'),
                  ('immutable', 'Immutable'),
              ]:
                  if key in lowered:
                      return label
              return 'Other'

          def owner_address(owner):
              if not isinstance(owner, dict):
                  return None
              for key in ('ObjectOwner', 'AddressOwner', 'objectOwner', 'addressOwner'):
                  value = owner.get(key)
                  if isinstance(value, str):
                      return value
                  if isinstance(value, dict):
                      for child in ('address', 'objectId'):
                          if isinstance(value.get(child), str):
                              return value[child]
              return None

          def move_calls(tx):
              try:
                  commands = tx['transaction']['data']['transaction']['transactions']
              except Exception:
                  return []
              rows = []
              for index, command in enumerate(commands or []):
                  call = command.get('MoveCall') if isinstance(command, dict) else None
                  if call:
                      rows.append({
                          'index': index,
                          'package': call.get('package'),
                          'module': call.get('module'),
                          'function': call.get('function'),
                          'typeArguments': call.get('type_arguments') or call.get('typeArguments'),
                          'arguments': call.get('arguments'),
                      })
              return rows

          parent_rows = []
          fetched = {}
          for account in ACCOUNTS:
              account_data = object_data(account['id'])
              creation = tx_data(account['creationTx'])
              chain = []
              current = account['parent']
              seen = set()
              for depth in range(5):
                  if not current or current in seen:
                      break
                  seen.add(current)
                  data = object_data(current)
                  if not data:
                      chain.append({'id': current, 'missing': True})
                      break
                  owner = data.get('owner')
                  row = {
                      'id': current,
                      'type': data.get('type'),
                      'owner': owner,
                      'ownerKind': owner_kind(owner),
                      'ownerAddress': owner_address(owner),
                      'hasPublicTransfer': ((data.get('content') or {}).get('hasPublicTransfer')),
                      'version': data.get('version'),
                      'previousTransaction': data.get('previousTransaction'),
                  }
                  chain.append(row)
                  if row['ownerKind'] != 'ObjectOwner':
                      break
                  current = row['ownerAddress']
              parent_rows.append({
                  'account': account,
                  'accountCurrent': {
                      'type': account_data.get('type') if account_data else None,
                      'owner': account_data.get('owner') if account_data else None,
                      'version': account_data.get('version') if account_data else None,
                  },
                  'creationSender': (((creation or {}).get('transaction') or {}).get('data') or {}).get('sender'),
                  'creationMoveCalls': move_calls(creation or {}),
                  'parentChain': chain,
                  'sharedAncestor': next((row for row in chain if row.get('ownerKind') == 'Shared'), None),
                  'addressOwnedAncestor': next((row for row in chain if row.get('ownerKind') == 'AddressOwner'), None),
              })

          pyth_config_data = object_data(PYTH_CONFIG)
          pyth_tx = tx_data(PYTH_CONFIG_TX)
          pyth_fields = ((pyth_config_data or {}).get('content') or {}).get('fields') or {}
          tolerance_entries = (((pyth_fields.get('tolerance_sec_map') or {}).get('fields') or {}).get('contents') or [])
          tolerances = []
          for entry in tolerance_entries:
              fields = (entry or {}).get('fields') or {}
              key = (((fields.get('key') or {}).get('fields') or {}).get('name'))
              tolerances.append({'type': key, 'value': fields.get('value')})

          summary = {
              'schema': 'bucket-account-parent-pyth-config-r12/v1',
              'network': 'sui-mainnet',
              'readOnly': True,
              'accountParentRows': parent_rows,
              'sharedAncestorAccountCount': sum(1 for row in parent_rows if row['sharedAncestor']),
              'objectOwnedAccountPublicIdentityCandidate': any(row['sharedAncestor'] for row in parent_rows),
              'pythConfig': {
                  'id': PYTH_CONFIG,
                  'version': pyth_config_data.get('version') if pyth_config_data else None,
                  'previousTransaction': pyth_config_data.get('previousTransaction') if pyth_config_data else None,
                  'tolerances': tolerances,
                  'updateTx': PYTH_CONFIG_TX,
                  'updateSender': (((pyth_tx or {}).get('transaction') or {}).get('data') or {}).get('sender'),
                  'updateTimestampMs': (pyth_tx or {}).get('timestampMs'),
                  'updateMoveCalls': move_calls(pyth_tx or {}),
                  'updateInputs': ((((pyth_tx or {}).get('transaction') or {}).get('data') or {}).get('transaction') or {}).get('inputs'),
                  'events': (pyth_tx or {}).get('events'),
              },
              'writes': 0,
              'transactionsConstructed': 0,
              'productionTransactionsSubmitted': 0,
              'generatedUnix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'sharedAncestorAccountCount': summary['sharedAncestorAccountCount'],
              'objectOwnedAccountPublicIdentityCandidate': summary['objectOwnedAccountPublicIdentityCandidate'],
              'accountParentRows': parent_rows,
              'pythConfig': summary['pythConfig'],
          }, indent=2))
          PY

          python3 bucket-account-parent-pyth-config-r12/trace.py | tee bucket-account-parent-pyth-config-r12/run.log
          find bucket-account-parent-pyth-config-r12 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-account-parent-pyth-config-r12/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' bucket-account-parent-pyth-config-r12 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-account-parent-pyth-config-r12/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['writes'] == 0
          assert summary['transactionsConstructed'] == 0
          assert summary['productionTransactionsSubmitted'] == 0
          print('BUCKET_ACCOUNT_PARENT_PYTH_CONFIG_R12_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-account-parent-pyth-config-r12
          path: bucket-account-parent-pyth-config-r12
          if-no-files-found: error
          retention-days: 7
