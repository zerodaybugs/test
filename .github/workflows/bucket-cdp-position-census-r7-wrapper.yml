name: Bucket CDP Position Census R7 Hardened

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract, harden, and execute the position census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/bucket-cdp-position-census-r7.yml').read_text()
          start_marker = "cat > bucket-cdp-position-census-r7/census.py <<'PY'\n"
          end_marker = "\n          PY\n          python3 bucket-cdp-position-census-r7/census.py"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(body)
          script = script.replace(
              "[('ids[]', item) for item in pyth_ids]",
              "[('ids[]', '0x' + item.removeprefix('0x')) for item in pyth_ids]",
          )
          script = script.replace(
              "hermes = get_json(f'{HERMES}?{query}')\ndump('hermes_prices.json', hermes)",
              "try:\n    hermes = get_json(f'{HERMES}?{query}')\nexcept Exception as exc:\n    hermes = {'parsed': [], 'error': str(exc)}\ndump('hermes_prices.json', hermes)",
          )
          script = script.replace(
              "        if isinstance(interest_unit_value, dict):\n            position_unit = int(interest_unit_value.get('value'))\n        else:\n            position_unit = int(interest_unit_value)",
              "        # Conservative fail-open bound: zero position unit maximizes accrued debt.\n        # Any position healthy under this bound is certainly not a live candidate.\n        position_unit = 0",
          )
          out = Path('bucket-cdp-position-census-r7')
          (out / 'raw').mkdir(parents=True, exist_ok=True)
          (out / 'census.py').write_text(script)
          PY
          python3 bucket-cdp-position-census-r7/census.py | tee bucket-cdp-position-census-r7/run.log
          find bucket-cdp-position-census-r7 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-cdp-position-census-r7/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' bucket-cdp-position-census-r7 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-cdp-position-census-r7/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['productionTransactionsSubmitted'] == 0
          print('BUCKET_CDP_POSITION_CENSUS_R7_HARDENED_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-cdp-position-census-r7-hardened
          path: bucket-cdp-position-census-r7
          if-no-files-found: error
          retention-days: 7
