name: Bucket Deployment Trigger Scan R37

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-deployment-trigger-r37-20260812]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compare live Bucket deployment against validated baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-deployment-trigger-r37
          mkdir -p bucket-deployment-trigger-r37/raw
          cat > bucket-deployment-trigger-r37/scan.py <<'PY'
