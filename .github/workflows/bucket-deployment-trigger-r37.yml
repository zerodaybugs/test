            },
            "vault_ids": [
              "0x13ca385797229d6ad23a3ff0981fc30971735b0efd307d02920b58730d923a14",
              "0x1e90eb4184e3303ee69d1728630c872b214f8699982b00dc39aabde8b4ff5ce3",
              "0x1f32b8b587b69a97cb779b2df1e2aa90f6fbb43edcc887f11a8f4a6de0944937",
              "0x2169f7a9f7c693265dad755bd7e75382e88cc4432595a22950432cb512bc6cd7",
              "0x38057191f48cf748d3b018e83ec0dda9f769f3f2d98010561002d6d2378f8ec3",
              "0x542eff36534bc5d7d07808953ebb8c580c23f047b41c094601d40a0fc7e99238",
              "0x5d76ee14fc4b1f501653c65eb3dc2ba0cd42f7d0d11480a840322e77d4b56362",
              "0x61c4f4e0849de36b840a5198dbe0ac5bbdedf3a514f8a66ecedd2c6f7b2fb380",
              "0x6677cdcc3186900914823fc8e5de7a2d1e874bbc0682cbcf7637ddf9342b1cbd",
              "0x755c54dd718d350afd03314fe6ccc71e0ab36a974caf6721f1e03b7675dfaba1",
              "0x83367e510389536e2041d50b3faabc2d1b1c8194ca5570a2a3a3e460d6113e86",
              "0x94f785bda085beb012e9e96d16a36cf16b6729f776e620ef8c3b37d1e06c2d82",
              "0x9cd535e14d25767387e29798cfd61cf8c780d4836798cd64a5ce0d6fdc4659b2",
              "0xb36fea26a681f44b9a075297ddb9ebb9d4f35210c48d133e767bb294ac6427c6",
              "0xbd0079fb337dc5c79ae8f522aab72fcda38b6f10e38f2477c075777d8b1ac263",
              "0xd3ef65a1dec4b5c5f0e0bb7caf29f4a425bd04ad43bce942ec6e1c70385b79de",
              "0xdb3b2f1ce99c935a5c5e14ce8321e0c252a8b16c50861407d2253d392d5fb836",
              "0xe1c7630ef33094491ab291bed669fcc64a48a88fcc99ddc200bcc38deb00400e",
              "0xee2d62b04abd9064a5526043395e09b0481e89fa3309d428fcb271ac53ce3103",
              "0xf985037e218946d20344810be7c07e42e7fae1666cdce60e7f028706768daed0"
            ],
            "vault_types": {}
          }

          def post(url, payload, retries=6, timeout=150):
              data = json.dumps(payload).encode()
              last = None
              for attempt in range(retries):
                  try:
                      request = urllib.request.Request(
                          url,
                          data=data,
                          method='POST',
                          headers={
                              'Content-Type': 'application/json',
                              'User-Agent': 'bucket-deployment-trigger-r37/1',
                          },
                      )
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f'POST failed {url}: {last}')

          def rpc(method, params):
              failures = []
              for endpoint in RPCS:
                  try:
                      body = post(endpoint, {
                          'jsonrpc': '2.0',
                          'id': 1,
                          'method': method,
                          'params': params,
                      })
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return {'endpoint': endpoint, 'result': body.get('result')}
                  except Exception as exc:
                      failures.append({'endpoint': endpoint, 'error': type(exc).__name__, 'message': str(exc)})
              return {'failures': failures}

          def result(wrapper):
              return wrapper.get('result') if isinstance(wrapper, dict) else None

          def gql(query, variables=None):
              body = post(GQL, {'query': query, 'variables': variables or {}})
              if body.get('errors'):
                  raise RuntimeError(json.dumps(body['errors']))
              return body['data']

          def dump(name, value):
              (RAW / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          def get_object(object_id):
              return rpc('sui_getObject', [object_id, {
                  'showType': True,
                  'showOwner': True,
                  'showPreviousTransaction': True,
                  'showDisplay': False,
                  'showContent': True,
                  'showBcs': True,
              }])

          def object_data(wrapper):
              response = result(wrapper)
              return (response or {}).get('data') if isinstance(response, dict) else None

          def fields(wrapper):
              data = object_data(wrapper) or {}
              content = data.get('content') or {}
              return content.get('fields') or {}

          def flatten(value, prefix=''):
              rows = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      path = f'{prefix}.{key}' if prefix else str(key)
                      rows.extend(flatten(child, path))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      rows.extend(flatten(child, f'{prefix}[{index}]'))
              else:
                  rows.append((prefix, value))
              return rows

          def transaction(digest):
              if not digest:
                  return None
              return rpc('sui_getTransactionBlock', [digest, {
                  'showInput': True,
                  'showRawInput': False,
                  'showEffects': True,
                  'showEvents': True,
                  'showObjectChanges': True,
                  'showBalanceChanges': True,
              }])

          def tx_timestamp(wrapper):
              response = result(wrapper)
              if isinstance(response, dict) and response.get('timestampMs') is not None:
                  return int(response['timestampMs'])
              return None

          baseline_ms = int(BASELINE['captured_unix']) * 1000
          entry_id = BASELINE['entry']['id']
          entry = get_object(entry_id)
          dump('entry.json', entry)
          entry_data = object_data(entry) or {}
          entry_fields = fields(entry)
          current_subobjects = list(entry_fields.get('id_vector') or [])
          if not current_subobjects:
              current_subobjects = list(BASELINE['entry']['subobject_ids'])

          subobjects = {object_id: get_object(object_id) for object_id in current_subobjects}
          dump('subobjects.json', subobjects)

          package_fields = {}
          object_fields = {}
          for object_id, wrapper in subobjects.items():
              current = fields(wrapper)
              scalar_rows = flatten(current)
              package_like = {
                  path.split('.')[-1]: value
                  for path, value in scalar_rows
                  if path.split('.')[-1].endswith('_package_id')
                  and isinstance(value, str)
                  and value.startswith('0x')
              }
              object_like = {
                  path: value
                  for path, value in scalar_rows
                  if path.endswith('objectId')
                  and isinstance(value, str)
                  and value.startswith('0x')
              }
              if package_like:
                  package_fields.update(package_like)
              if object_like:
                  object_fields.update(object_like)

          current_packages = {
              key: value for key, value in package_fields.items()
              if key in BASELINE['package_config']
          }
          package_changes = {
              key: {'baseline': BASELINE['package_config'].get(key), 'current': current_packages.get(key)}
              for key in sorted(set(BASELINE['package_config']) | set(current_packages))
              if key.endswith('_package_id')
              and BASELINE['package_config'].get(key) != current_packages.get(key)
          }

          baseline_object_ids = {}
          for key, value in BASELINE['object_config'].items():
              if isinstance(value, dict) and value.get('objectId'):
                  baseline_object_ids[key] = value['objectId']
          current_object_ids = {}
          for path, value in object_fields.items():
              lower = path.lower()
              for key in baseline_object_ids:
                  if key.lower() in lower:
                      current_object_ids[key] = value
          object_changes = {
              key: {'baseline': baseline_object_ids.get(key), 'current': current_object_ids.get(key)}
              for key in sorted(set(baseline_object_ids) | set(current_object_ids))
              if current_object_ids.get(key) is not None
              and baseline_object_ids.get(key) != current_object_ids.get(key)
          }

          package_ids = sorted(set(
              [value for value in current_packages.values() if isinstance(value, str) and value.startswith('0x')]
              + [value for key, value in BASELINE['package_config'].items() if key.endswith('_package_id') and isinstance(value, str)]
          ))
          package_objects = {package_id: get_object(package_id) for package_id in package_ids}
          package_transactions = {}
          for package_id, wrapper in package_objects.items():
              data = object_data(wrapper) or {}
              digest = data.get('previousTransaction')
              package_transactions[package_id] = transaction(digest)
          dump('package_objects.json', package_objects)
          dump('package_transactions.json', package_transactions)

          object_query = '''query Vaults($after:String){objects(first:50,after:$after,filter:{type:"''' + VAULT_TYPE + '''"}){pageInfo{hasNextPage endCursor}nodes{address version digest owner{__typename}previousTransaction{digest sender{address}}asMoveObject{contents{type{repr}json bcs}}}}}}'''
          vaults = []
          cursor = None
          for _ in range(20):
              connection = gql(object_query, {'after': cursor})['objects']
              vaults.extend(connection.get('nodes') or [])
              page = connection.get('pageInfo') or {}
              if not page.get('hasNextPage'):
                  break
              cursor = page.get('endCursor')
          dump('vaults.json', vaults)

          current_vault_ids = sorted(row.get('address') for row in vaults if row.get('address'))
          baseline_vault_ids = sorted(BASELINE['vault_ids'])
          new_vaults = sorted(set(current_vault_ids) - set(baseline_vault_ids))
          removed_vaults = sorted(set(baseline_vault_ids) - set(current_vault_ids))

          tracked_ids = [entry_id] + current_subobjects
          recent_activity = {}
          for object_id in tracked_ids:
              wrapper = rpc('suix_queryTransactionBlocks', [{
                  'filter': {'InputObject': object_id},
                  'options': {
                      'showInput': True,
                      'showRawInput': False,
                      'showEffects': True,
                      'showEvents': True,
                      'showObjectChanges': True,
                      'showBalanceChanges': True,
                  },
              }, None, 50, True])
              response = result(wrapper)
              transactions = (response or {}).get('data') if isinstance(response, dict) else []
              recent_activity[object_id] = [
                  {
                      'digest': tx.get('digest'),
                      'timestampMs': tx.get('timestampMs'),
                      'sender': (((tx.get('transaction') or {}).get('data') or {}).get('sender')),
                      'status': ((tx.get('effects') or {}).get('status')),
                  }
                  for tx in (transactions or [])
                  if tx.get('timestampMs') is not None and int(tx['timestampMs']) > baseline_ms
              ]
          dump('recent_config_activity.json', recent_activity)

          current_entry = {
              'version': int(entry_data.get('version')) if entry_data.get('version') is not None else None,
              'digest': entry_data.get('digest'),
              'previousTransaction': entry_data.get('previousTransaction'),
              'type': entry_data.get('type'),
              'subobjectIds': current_subobjects,
          }
          entry_changed = (
              current_entry['version'] != int(BASELINE['entry']['version'])
              or current_entry['digest'] != BASELINE['entry']['digest']
              or sorted(current_subobjects) != sorted(BASELINE['entry']['subobject_ids'])
          )
          post_baseline_config_transactions = sum(len(items) for items in recent_activity.values())

          package_meta = {}
          for package_id, wrapper in package_objects.items():
              data = object_data(wrapper) or {}
              tx = package_transactions.get(package_id)
              package_meta[package_id] = {
                  'version': data.get('version'),
                  'digest': data.get('digest'),
                  'previousTransaction': data.get('previousTransaction'),
                  'publishTimestampMs': tx_timestamp(tx),
                  'publishedAfterBaseline': (
                      tx_timestamp(tx) is not None and tx_timestamp(tx) > baseline_ms
                  ),
              }

          trigger_reasons = []
          if package_changes:
              trigger_reasons.append('PACKAGE_CONFIG_CHANGED')
          if object_changes:
              trigger_reasons.append('OBJECT_CONFIG_CHANGED')
          if new_vaults:
              trigger_reasons.append('NEW_VAULT_DEPLOYMENT')
          if removed_vaults:
              trigger_reasons.append('VAULT_REMOVED')
          if entry_changed:
              trigger_reasons.append('ENTRY_CONFIG_OBJECT_CHANGED')
          if post_baseline_config_transactions:
              trigger_reasons.append('POST_BASELINE_CONFIG_ACTIVITY')
          if any(meta.get('publishedAfterBaseline') for meta in package_meta.values()):
              trigger_reasons.append('PACKAGE_PUBLISHED_AFTER_BASELINE')

          summary = {
              'schema': 'bucket-deployment-trigger-r37/v1',
              'network': 'sui-mainnet',
              'readOnly': True,
              'baselineCapturedUnix': BASELINE['captured_unix'],
              'baselineEntry': BASELINE['entry'],
              'currentEntry': current_entry,
              'entryChanged': entry_changed,
              'packageChanges': package_changes,
              'objectChanges': object_changes,
              'newVaults': new_vaults,
              'removedVaults': removed_vaults,
              'baselineVaultCount': len(baseline_vault_ids),
              'currentVaultCount': len(current_vault_ids),
              'postBaselineConfigTransactionCount': post_baseline_config_transactions,
              'packageMetadata': package_meta,
              'triggerReasons': sorted(set(trigger_reasons)),
              'triggerOpen': bool(trigger_reasons),
              'recommendedAction': (
                  'REOPEN_TARGETED_AUDIT'
                  if trigger_reasons
                  else 'KEEP_TRIGGER_BASED_ICEBOX'
              ),
              'writes': 0,
              'transactionsConstructed': 0,
              'generatedUnix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-deployment-trigger-r37/scan.py | tee bucket-deployment-trigger-r37/run.log
          find bucket-deployment-trigger-r37 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-deployment-trigger-r37/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-deployment-trigger-r37 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-deployment-trigger-r37/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['writes'] == 0
          assert summary['transactionsConstructed'] == 0
          print('BUCKET_DEPLOYMENT_TRIGGER_R37_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-deployment-trigger-r37
          path: bucket-deployment-trigger-r37
          if-no-files-found: error
          retention-days: 5
