name: Bucket Deployment Trigger Scan R37B

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-deployment-trigger-r37-20260812]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compare live Bucket deployment with August 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-deployment-trigger-r37b
          mkdir -p bucket-deployment-trigger-r37b/raw
          cat > bucket-deployment-trigger-r37b/scan.py <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-deployment-trigger-r37b')
          RAW = OUT / 'raw'
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          RPCS = [
              'https://sui-mainnet-endpoint.blockvision.org',
              'https://fullnode.mainnet.sui.io:443',
          ]
          VAULT_TYPE = '0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e::vault::Vault'

          BASELINE = json.loads(r'''
          {
            "captured_unix": 1786270404,
            "entry": {
              "id": "0x03e79aa64ac007d200aefdcb445e31e24f460279bab6c73babfb031b7464072e",
              "version": 869774190,
              "digest": "29vJxmUhv4yoMSUcRrkBQ5JaZqEL33e7C47BH2oRYkyz",
              "subobject_ids": [
                "0x929c394fd2e140e157d7d618a4f7ecdbaab0928ac454ec57654ef6cb62c78338",
                "0xcb6a035cb6621626eab35d60b10f6c49a2638ab6ac13fc9836d79c6c58cdbd51",
                "0xdcf2054cdce3258e0f808ed2456b84cda0a57ac77b16c7e97fbf218d1adb4a6f",
                "0x654251ce3f37a0ec1895b8052cef32dfbf88a5f592c6be7891726a6b0f82f0c8",
                "0x7db45f918fe2bc8efbb5b544b955aec93df4cc4432b7fc21232e4d563fb4d916",
                "0x5a73da42eb064695ba15854aa62b4a0368430eab83995ac3ca238ca713402ff9",
                "0x152805bfb0b6d9b1cefd4a51e42c6c8220c3cc7a4f2659c0a19ae39421cde50b",
                "0x7f8ec209420823c1eab1a47e18e5fb425d19203185956d10ed8c78af97111236"
              ]
            },
            "subobjects": {
              "0x929c394fd2e140e157d7d618a4f7ecdbaab0928ac454ec57654ef6cb62c78338": {"version": 901207035, "digest": "2x9y4minCPfkqV7Afi8eb1EkjUM3rSYS4sECEwBVJaqT", "kind": "PackageConfig"},
              "0xcb6a035cb6621626eab35d60b10f6c49a2638ab6ac13fc9836d79c6c58cdbd51": {"version": 806071582, "digest": "EqQfsQQHYLiXum9w3x2sTUCoQp1Nnr5KS9v1gSprAvUt", "kind": "OracleConfig"},
              "0xdcf2054cdce3258e0f808ed2456b84cda0a57ac77b16c7e97fbf218d1adb4a6f": {"version": 806071583, "digest": "EEakneygJ7HyobpnVNUBarKGBQ5bknzdkHmfkhf6eUsQ", "kind": "ObjectConfig"},
              "0x654251ce3f37a0ec1895b8052cef32dfbf88a5f592c6be7891726a6b0f82f0c8": {"version": 893151864, "digest": "8XsauZ6tBcvP2NGtuPKWa7aa9SY5Jn422PXmK1UmfsGu", "kind": "AggregatorConfig"},
              "0x7db45f918fe2bc8efbb5b544b955aec93df4cc4432b7fc21232e4d563fb4d916": {"version": 806071590, "digest": "CRQQEPYFrxHFSskfud6Gc2abAuSCmtEDKimXkCCYhqvw", "kind": "VaultRegistry"},
              "0x5a73da42eb064695ba15854aa62b4a0368430eab83995ac3ca238ca713402ff9": {"version": 806071591, "digest": "AVdF7o4Cvw3x5zJE4rucETS1dsmk8xwfunbXvWEGcB81", "kind": "SavingPoolRegistry"},
              "0x152805bfb0b6d9b1cefd4a51e42c6c8220c3cc7a4f2659c0a19ae39421cde50b": {"version": 893151863, "digest": "2ZTbzw9CQM7x5xU42Dd2UsgwJX13VnFYhhmMijVtA7du", "kind": "PsmPoolRegistry"},
              "0x7f8ec209420823c1eab1a47e18e5fb425d19203185956d10ed8c78af97111236": {"version": 806071593, "digest": "aaPSXzJwJdCF2nnB9sPfZyYQHErkoLgbZEecdCsKNh3", "kind": "PriceConfig"}
            },
            "package_config": {
              "blacklist_package_id": "0xca8749b4c503302f69a3f026e493679076f725732d81de963a10cc7fd6720caa",
              "borrow_incentive_package_id": "0xef9719a3392d3742ae09c42ebf01030d88b1a75651430932be1eb017b79fb372",
              "cdp_package_id": "0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26",
              "flash_package_id": "0xca00bbb7ecfe11dbb527efab6145b358f2a95aa11a8aae9b9f475176430cf42a",
              "framework_package_id": "0xe2d49d67ff42dc500275f2d84841bf35632aa6c1abdb70af66a10e1de93a4400",
              "oracle_package_id": "0xf2ab9aa60c5e879675351a1a89f47131de9dea7cc927327dd0e7282e295c7f5e",
              "psm_package_id": "0x8a46afe6ab0b972e2ee3923f5669104ae9465c12b84cd5e78ea1ff6404e4bfaf",
              "saving_incentive_package_id": "0xd419027a4b92b1916c62c08da27520576bcf34d0a8c40884491dca2f5d992719",
              "saving_package_id": "0x5b60c3cdbb9ee31b856f7f8a6d4d6c8b91e3c0036a138fb9927529b05fd00373",
              "usdb_package_id": "0xe14726c336e81b32328e92afc37345d159f5b550b09fa92bd43640cfdd0a0cfd"
            },
            "vault_ids": [
              "0x13ca385797229d6ad23a3ff0981fc30971735b0efd307d02920b58730d923a14",
              "0x1e90eb4184e3303ee69d1728630c872b214f8699982b00dc39aabde8b4ff5ce3",
              "0x1f32b8b587b69a97cb779b2df1e2aa90f6fbb43edcc887f11a8f4a6de0944937",
              "0x2169f7a9f7c693265dad755bd7e75382e88cc4432595a22950432cb512bc6cd7",
              "0x38057191f48cf748d3b018e83ec0dda9f769f3f2d98010561002d6d2378f8ec3",
              "0x542eff36534bc5d7d07808953ebb8c580c23f047b41c094601d40a0fc7e99238",
              "0x5d76ee14fc4b1f501653c65eb3dc2ba0cd42f7d0d11480a840322e77d4b56362",
              "0x61c4f4e0849de36b840a5198dbe0ac5bbdedf3a514f8a66ecedd2c6f7b2fb380",
              "0x6677cdcc3186900914823fc8e5de7a2d1e874bbc0682cbcf7637ddf9342b1cbd",
              "0x755c54dd718d350afd03314fe6ccc71e0ab36a974caf6721f1e03b7675dfaba1",
              "0x83367e510389536e2041d50b3faabc2d1b1c8194ca5570a2a3a3e460d6113e86",
              "0x94f785bda085beb012e9e96d16a36cf16b6729f776e620ef8c3b37d1e06c2d82",
              "0x9cd535e14d25767387e29798cfd61cf8c780d4836798cd64a5ce0d6fdc4659b2",
              "0xb36fea26a681f44b9a075297ddb9ebb9d4f35210c48d133e767bb294ac6427c6",
              "0xbd0079fb337dc5c79ae8f522aab72fcda38b6f10e38f2477c075777d8b1ac263",
              "0xd3ef65a1dec4b5c5f0e0bb7caf29f4a425bd04ad43bce942ec6e1c70385b79de",
              "0xdb3b2f1ce99c935a5c5e14ce8321e0c252a8b16c50861407d2253d392d5fb836",
              "0xe1c7630ef33094491ab291bed669fcc64a48a88fcc99ddc200bcc38deb00400e",
              "0xee2d62b04abd9064a5526043395e09b0481e89fa3309d428fcb271ac53ce3103",
              "0xf985037e218946d20344810be7c07e42e7fae1666cdce60e7f028706768daed0"
            ]
          }
          ''')

          def post(url, payload, retries=6, timeout=150):
              encoded = json.dumps(payload).encode()
              last = None
              for attempt in range(retries):
                  try:
                      request = urllib.request.Request(
                          url,
                          data=encoded,
                          method='POST',
                          headers={
                              'Content-Type': 'application/json',
                              'User-Agent': 'bucket-deployment-trigger-r37b/1',
                          },
                      )
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f'POST failed {url}: {last}')

          def rpc(method, params):
              failures = []
              for endpoint in RPCS:
                  try:
                      body = post(endpoint, {
                          'jsonrpc': '2.0',
                          'id': 1,
                          'method': method,
                          'params': params,
                      })
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return {'endpoint': endpoint, 'result': body.get('result')}
                  except Exception as exc:
                      failures.append({'endpoint': endpoint, 'error': type(exc).__name__, 'message': str(exc)})
              return {'failures': failures}

          def gql(query, variables=None):
              body = post(GQL, {'query': query, 'variables': variables or {}})
              if body.get('errors'):
                  raise RuntimeError(json.dumps(body['errors']))
              return body['data']

          def result(wrapper):
              return wrapper.get('result') if isinstance(wrapper, dict) else None

          def object_data(wrapper):
              response = result(wrapper)
              return (response or {}).get('data') if isinstance(response, dict) else None

          def object_fields(wrapper):
              data = object_data(wrapper) or {}
              return ((data.get('content') or {}).get('fields') or {})

          def get_object(object_id):
              return rpc('sui_getObject', [object_id, {
                  'showType': True,
                  'showOwner': True,
                  'showPreviousTransaction': True,
                  'showDisplay': False,
                  'showContent': True,
                  'showBcs': True,
              }])

          def flatten(value, prefix=''):
              rows = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      path = f'{prefix}.{key}' if prefix else str(key)
                      rows.extend(flatten(child, path))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      rows.extend(flatten(child, f'{prefix}[{index}]'))
              else:
                  rows.append((prefix, value))
              return rows

          entry = get_object(BASELINE['entry']['id'])
          entry_data = object_data(entry) or {}
          entry_fields = object_fields(entry)
          current_subobjects = list(entry_fields.get('id_vector') or [])
          if not current_subobjects:
              current_subobjects = list(BASELINE['entry']['subobject_ids'])

          subobjects = {object_id: get_object(object_id) for object_id in current_subobjects}
          current_subobject_meta = {}
          for object_id, wrapper in subobjects.items():
              data = object_data(wrapper) or {}
              current_subobject_meta[object_id] = {
                  'version': int(data['version']) if data.get('version') is not None else None,
                  'digest': data.get('digest'),
                  'previousTransaction': data.get('previousTransaction'),
                  'type': data.get('type'),
              }

          subobject_changes = {}
          for object_id in sorted(set(BASELINE['subobjects']) | set(current_subobject_meta)):
              old = BASELINE['subobjects'].get(object_id)
              new = current_subobject_meta.get(object_id)
              if old is None or new is None or old.get('version') != new.get('version') or old.get('digest') != new.get('digest'):
                  subobject_changes[object_id] = {'baseline': old, 'current': new}

          package_config_id = '0x929c394fd2e140e157d7d618a4f7ecdbaab0928ac454ec57654ef6cb62c78338'
          package_fields = object_fields(subobjects.get(package_config_id, {}))
          package_scalars = flatten(package_fields)
          current_packages = {
              path.split('.')[-1]: value
              for path, value in package_scalars
              if path.split('.')[-1].endswith('_package_id')
              and isinstance(value, str)
              and value.startswith('0x')
              and path.split('.')[-1] in BASELINE['package_config']
          }
          package_changes = {
              key: {'baseline': BASELINE['package_config'].get(key), 'current': current_packages.get(key)}
              for key in sorted(BASELINE['package_config'])
              if BASELINE['package_config'].get(key) != current_packages.get(key)
          }

          vault_query = '''query Vaults($after:String){objects(first:50,after:$after,filter:{type:"''' + VAULT_TYPE + '''"}){pageInfo{hasNextPage endCursor}nodes{address version digest previousTransaction{digest sender{address}}asMoveObject{contents{type{repr}json}}}}}'''
          vaults = []
          cursor = None
          for _ in range(20):
              connection = gql(vault_query, {'after': cursor})['objects']
              vaults.extend(connection.get('nodes') or [])
              page = connection.get('pageInfo') or {}
              if not page.get('hasNextPage'):
                  break
              cursor = page.get('endCursor')

          current_vault_ids = sorted(row.get('address') for row in vaults if row.get('address'))
          baseline_vault_ids = sorted(BASELINE['vault_ids'])
          new_vaults = sorted(set(current_vault_ids) - set(baseline_vault_ids))
          removed_vaults = sorted(set(baseline_vault_ids) - set(current_vault_ids))

          current_entry = {
              'version': int(entry_data['version']) if entry_data.get('version') is not None else None,
              'digest': entry_data.get('digest'),
              'previousTransaction': entry_data.get('previousTransaction'),
              'type': entry_data.get('type'),
              'subobjectIds': current_subobjects,
          }
          entry_changed = (
              current_entry['version'] != BASELINE['entry']['version']
              or current_entry['digest'] != BASELINE['entry']['digest']
              or sorted(current_subobjects) != sorted(BASELINE['entry']['subobject_ids'])
          )

          trigger_reasons = []
          if entry_changed:
              trigger_reasons.append('ENTRY_CONFIG_CHANGED')
          if package_changes:
              trigger_reasons.append('PACKAGE_IDS_CHANGED')
          if subobject_changes:
              trigger_reasons.append('CONFIG_SUBOBJECTS_CHANGED')
          if new_vaults:
              trigger_reasons.append('NEW_VAULTS')
          if removed_vaults:
              trigger_reasons.append('REMOVED_VAULTS')

          summary = {
              'schema': 'bucket-deployment-trigger-r37b/v1',
              'network': 'sui-mainnet',
              'readOnly': True,
              'baselineCapturedUnix': BASELINE['captured_unix'],
              'currentEntry': current_entry,
              'entryChanged': entry_changed,
              'currentSubobjects': current_subobject_meta,
              'subobjectChanges': subobject_changes,
              'currentPackages': current_packages,
              'packageChanges': package_changes,
              'baselineVaultCount': len(baseline_vault_ids),
              'currentVaultCount': len(current_vault_ids),
              'newVaults': new_vaults,
              'removedVaults': removed_vaults,
              'triggerReasons': trigger_reasons,
              'triggerOpen': bool(trigger_reasons),
              'recommendedAction': 'REOPEN_TARGETED_AUDIT' if trigger_reasons else 'KEEP_TRIGGER_BASED_ICEBOX',
              'writes': 0,
              'transactionsConstructed': 0,
              'generatedUnix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          (RAW / 'entry.json').write_text(json.dumps(entry, indent=2, sort_keys=True) + '\n')
          (RAW / 'subobjects.json').write_text(json.dumps(subobjects, indent=2, sort_keys=True) + '\n')
          (RAW / 'vaults.json').write_text(json.dumps(vaults, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-deployment-trigger-r37b/scan.py | tee bucket-deployment-trigger-r37b/run.log
          find bucket-deployment-trigger-r37b -type f -print0 | sort -z | xargs -0 sha256sum > bucket-deployment-trigger-r37b/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-deployment-trigger-r37b && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-deployment-trigger-r37b/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['writes'] == 0
          assert summary['transactionsConstructed'] == 0
          print('BUCKET_DEPLOYMENT_TRIGGER_R37B_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-deployment-trigger-r37b
          path: bucket-deployment-trigger-r37b
          if-no-files-found: error
          retention-days: 5
