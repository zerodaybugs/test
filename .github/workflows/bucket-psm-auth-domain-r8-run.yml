name: Bucket PSM Authorization Domain R8 Runner

on:
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load and execute the isolated read-only census
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/bucket-psm-auth-r8-20260810:refs/remotes/origin/agent/bucket-psm-auth-r8-20260810
          mkdir -p bucket-psm-auth-domain-r8/raw
          git show origin/agent/bucket-psm-auth-r8-20260810:.github/workflows/bucket-psm-auth-domain-r8.yml > /tmp/bucket-psm-auth-domain-r8.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/bucket-psm-auth-domain-r8.yml').read_text()
          start_marker = "cat > bucket-psm-auth-domain-r8/census.py <<'PY'\n"
          end_marker = "\n          PY\n          python3 bucket-psm-auth-domain-r8/census.py"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('bucket-psm-auth-domain-r8/census.py').write_text(textwrap.dedent(body))
          PY
          python3 bucket-psm-auth-domain-r8/census.py | tee bucket-psm-auth-domain-r8/run.log
          find bucket-psm-auth-domain-r8 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-psm-auth-domain-r8/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' bucket-psm-auth-domain-r8 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-psm-auth-domain-r8/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['writes'] == 0
          assert summary['transactionsConstructed'] == 0
          print('BUCKET_PSM_AUTH_DOMAIN_R8_RUNNER_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-psm-auth-domain-r8
          path: bucket-psm-auth-domain-r8
          if-no-files-found: error
          retention-days: 7
