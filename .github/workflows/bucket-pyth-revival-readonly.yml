name: Bucket CDP Full Upgrade Chain and Legacy Bypass Audit R5

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct CDP upgrade chain and diff every deployed package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-cdp-legacy-r5
          mkdir -p bucket-cdp-legacy-r5/{raw,asm,diff,analysis}
          cat > bucket-cdp-legacy-r5/audit.py <<'PY'
          import difflib, hashlib, json, pathlib, re, time, urllib.request
          OUT=pathlib.Path('bucket-cdp-legacy-r5'); RAW=OUT/'raw'; ASM=OUT/'asm'; DIFF=OUT/'diff'; ANALYSIS=OUT/'analysis'
          GQL='https://graphql.mainnet.sui.io/graphql'
          RPCS=['https://sui-mainnet-endpoint.blockvision.org','https://fullnode.mainnet.sui.io:443']
          ORIGINAL='0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e'
          KNOWN={
            'v1':ORIGINAL,
            'v3':'0x1a9ed525e699c5716923d36ac02f554368a7f52b83bc59679eef1f99efee324a',
            'v4':'0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26',
          }
          KNOWN_TXS=['ohy1VSE2DDfyfqbcDuadWLJ42TULCM2igG8WAR6ZRUG','Hrec83VDAHcu8xjYNi6sqMvqEEm3snzNgGe8JaKB4H9W','TzbfvdroB3drZ6MB53ps3vSACnwidF5kVrC2Vh79oXc']

          def post(url,payload,retries=5,timeout=150):
            data=json.dumps(payload).encode(); last=None
            for n in range(retries):
              try:
                req=urllib.request.Request(url,data=data,method='POST',headers={'Content-Type':'application/json','User-Agent':'bucket-cdp-legacy-r5/1'})
                with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read().decode())
              except Exception as e: last=e; time.sleep(2**n)
            raise RuntimeError(f'POST failure {url}: {last}')
          def gql(q,v=None):
            b=post(GQL,{'query':q,'variables':v or {}})
            if b.get('errors'): raise RuntimeError(json.dumps(b['errors']))
            return b
          def rpc(method,params):
            errs=[]
            for ep in RPCS:
              try:
                b=post(ep,{'jsonrpc':'2.0','id':1,'method':method,'params':params},timeout=120)
                if b.get('error'): raise RuntimeError(json.dumps(b['error']))
                return {'endpoint':ep,'result':b.get('result')}
              except Exception as e: errs.append({'endpoint':ep,'error':type(e).__name__,'message':str(e)})
            return {'failures':errs}
          def dump(p,v): p.write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')

          opts={'showInput':True,'showRawInput':False,'showEffects':True,'showEvents':True,'showObjectChanges':True,'showBalanceChanges':True}
          seed={}
          cap_ids=set(); published=set(KNOWN.values())
          for digest in KNOWN_TXS:
            w=rpc('sui_getTransactionBlock',[digest,opts]); seed[digest]=w
            result=w.get('result') if isinstance(w,dict) else None
            for c in (result or {}).get('objectChanges') or []:
              typ=str(c.get('objectType') or c.get('type') or '')
              if '::package::UpgradeCap' in typ and c.get('objectId'): cap_ids.add(c['objectId'])
              if c.get('type')=='published' and c.get('packageId'): published.add(c['packageId'])
          dump(RAW/'seed_transactions.json',seed)

          cap_activity={}
          for cap in sorted(cap_ids):
            cursor=None; rows=[]
            for _ in range(20):
              w=rpc('suix_queryTransactionBlocks',[{'filter':{'InputObject':cap},'options':opts},cursor,50,False])
              result=w.get('result') if isinstance(w,dict) else None
              if not isinstance(result,dict): break
              rows.extend(result.get('data') or [])
              if not result.get('hasNextPage'): break
              cursor=result.get('nextCursor')
            cap_activity[cap]=rows
            for tx in rows:
              for c in tx.get('objectChanges') or []:
                if c.get('type')=='published' and c.get('packageId'): published.add(c['packageId'])
          dump(RAW/'upgrade_cap_activity.json',cap_activity)

          Q='''query P($a:SuiAddress!){object(address:$a){address version digest previousTransaction{digest sender{address}}asMovePackage{address version linkage{originalId upgradedId version}typeOrigins{module struct definingId}modules{nodes{name fileFormatVersion disassembly functions(first:50){nodes{name visibility isEntry parameters{repr}return{repr}typeParameters{constraints}}}structs(first:50){nodes{name abilities fields{name type{repr}}typeParameters{constraints}}}}}}}}'''
          packages={}; valid=[]
          for pid in sorted(published):
            try:
              r=gql(Q,{'a':pid}); dump(RAW/f'package_{pid[2:]}.json',r)
              obj=r['data']['object']; pkg=(obj or {}).get('asMovePackage')
              if not pkg: continue
              origins=pkg.get('typeOrigins') or []
              is_cdp=any(str(x.get('definingId')).lower()==ORIGINAL.lower() for x in origins)
              packages[pid]={'object_version':obj.get('version'),'package_version':pkg.get('version'),'digest':obj.get('digest'),'previous_transaction':obj.get('previousTransaction'),'linkage':pkg.get('linkage'),'type_origins':origins,'is_cdp_lineage':is_cdp}
              if is_cdp: valid.append(pid)
            except Exception as e: packages[pid]={'error':type(e).__name__,'message':str(e)}
          dump(ANALYSIS/'all_candidate_packages.json',packages)

          # include known packages even if UpgradeCap activity did not reveal all of them
          for pid in KNOWN.values():
            if pid not in valid: valid.append(pid)
          valid=sorted(set(valid),key=lambda p:(packages.get(p,{}).get('package_version') or 999,p))

          sig=re.compile(r'^(?:entry\s+)?(?:public(?:\([^)]*\))?\s+|fun\s+)?([^\s<(]+)(?:<[^>]*>)?\(')
          def split(text):
            lines=text.splitlines(); starts=[]
            for i,line in enumerate(lines):
              m=sig.match(line)
              if m and not line.startswith(('B','L')): starts.append((i,m.group(1),line))
            out={}
            for n,(st,name,signature) in enumerate(starts):
              en=starts[n+1][0] if n+1<len(starts) else len(lines); body='\n'.join(lines[st:en]).rstrip()+'\n'
              key=name; k=2
              while key in out: key=f'{name}#{k}'; k+=1
              out[key]={'signature':signature,'body':body,'sha256':hashlib.sha256(body.encode()).hexdigest()}
            return out

          bodies={}; meta={}
          for pid in valid:
            raw=json.load(open(RAW/f'package_{pid[2:]}.json')) if (RAW/f'package_{pid[2:]}.json').exists() else gql(Q,{'a':pid})
            pkg=raw['data']['object']['asMovePackage']; label=f"v{pkg.get('version')}_{pid[2:10]}"; meta[label]={'package_id':pid,**packages.get(pid,{})}; bodies[label]={}
            d=ASM/label; d.mkdir(exist_ok=True)
            for mod in pkg['modules']['nodes']:
              name=mod['name']; text=mod.get('disassembly') or ''; (d/f'{name}.asm').write_text(text); bodies[label][name]=split(text)
          labels=sorted(meta,key=lambda x:(meta[x].get('package_version') or 999,x))

          changes=[]
          security=re.compile(r'liquid|borrow|repay|withdraw|deposit|interest|mint|burn|security|manager|admin|request|response|debt|collateral|position|limit|price|donor|beneficiary|blacklist',re.I)
          for left,right in zip(labels,labels[1:]):
            modules=sorted(set(bodies[left])|set(bodies[right]))
            for module in modules:
              names=sorted(set(bodies[left].get(module,{}))|set(bodies[right].get(module,{})))
              for fn in names:
                a=bodies[left].get(module,{}).get(fn); b=bodies[right].get(module,{}).get(fn)
                if a and b and a['sha256']==b['sha256']: continue
                row={'left':left,'right':right,'module':module,'function':fn,'left_present':bool(a),'right_present':bool(b),'left_signature':a['signature'] if a else None,'right_signature':b['signature'] if b else None,'security_shaped':bool(security.search(module+' '+fn))}
                changes.append(row)
                if a and b:
                  patch=''.join(difflib.unified_diff(a['body'].splitlines(True),b['body'].splitlines(True),fromfile=left,tofile=right)); (DIFF/f'{left}__{right}__{module}__{fn}.patch').write_text(patch)
          dump(ANALYSIS/'changes.json',changes); dump(ANALYSIS/'lineage.json',meta)

          # Search old public functions that current version removed or tightened.
          latest=labels[-1]; legacy_surface=[]
          current_index={(m,f) for m,fs in bodies[latest].items() for f in fs}
          for label in labels[:-1]:
            for module,fs in bodies[label].items():
              for fn,data in fs.items():
                signature=data['signature']; public=signature.startswith('public') or signature.startswith('entry public') or signature.startswith('public entry')
                if public and ((module,fn) not in current_index or data['sha256']!=bodies[latest].get(module,{}).get(fn,{}).get('sha256')) and security.search(module+' '+fn):
                  legacy_surface.append({'version':label,'package_id':meta[label]['package_id'],'module':module,'function':fn,'signature':signature,'removed_in_latest':(module,fn) not in current_index})
          dump(ANALYSIS/'legacy_security_surface.json',legacy_surface)
          summary={'network':'sui-mainnet','upgrade_cap_ids':sorted(cap_ids),'candidate_package_count':len(published),'cdp_lineage':meta,'ordered_labels':labels,'change_count':len(changes),'security_change_count':sum(1 for x in changes if x['security_shaped']),'legacy_security_surface':legacy_surface,'writes':0,'transactions_constructed':0,'generated_unix':int(time.time())}
          dump(OUT/'SUMMARY.json',summary)
          print(json.dumps({'upgrade_cap_ids':summary['upgrade_cap_ids'],'ordered_labels':labels,'packages':{k:v['package_id'] for k,v in meta.items()},'security_change_count':summary['security_change_count'],'legacy_security_surface':legacy_surface},indent=2))
          PY
          python3 bucket-cdp-legacy-r5/audit.py | tee bucket-cdp-legacy-r5/run.log
          find bucket-cdp-legacy-r5 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-cdp-legacy-r5/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-cdp-legacy-r5 && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-cdp-legacy-r5/SUMMARY.json'))
          assert s['writes']==0 and s['transactions_constructed']==0
          assert len(s['ordered_labels'])>=3
          print('BUCKET_CDP_LEGACY_R5_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-cdp-legacy-r5
          path: bucket-cdp-legacy-r5
          if-no-files-found: error
          retention-days: 7
