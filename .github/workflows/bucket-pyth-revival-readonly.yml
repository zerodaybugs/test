name: Bucket LP Provider and Contingency Mint-Domain Audit R6

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Disassemble live packages and inventory mint, burn, collateral and authorization surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-provider-audit-r6
          mkdir -p bucket-provider-audit-r6/{raw,asm,analysis}
          cat > bucket-provider-audit-r6/audit.py <<'PY'
          import json
          import pathlib
          import re
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-provider-audit-r6')
          RAW = OUT / 'raw'
          ASM = OUT / 'asm'
          ANALYSIS = OUT / 'analysis'
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          RPCS = [
              'https://sui-mainnet-endpoint.blockvision.org',
              'https://fullnode.mainnet.sui.io:443',
          ]

          PACKAGES = {
              'cetus_lp': '0xb9204c991f982e4ec53dd9161ed56ff837716c81861929853e894d77eec71bea',
              'momentum_lp': '0x42df76466b4df87f875e044dea3f011f3c0824ded63f77abbb41deb5aa8eb351',
              'bluefin_lp': '0x266588b4ade88033ebe61e158ca25504b772fb7c1cdb89294a2c25c9073c3ecf',
              'ferra_lp': '0x94d6ef0a563955eb3cca10752e7dda02729b6d3d5f11493d5c1e5971e9bde2af',
              'steamm_lp': '0x00985a81917a9632acfa47f8e402ed389d0765f29eae25fc6bbbe047436fb6e5',
              'current_lp_a': '0x7dd03ca2dfff17c40fd0b6d9e85b5e68f12499e68d35e5e8483a4c16409bfe42',
              'current_lp_b': '0x66dc696ab05177efd117c6d80a0627b4b61ae10b2fbcccc37f81241ab7803611',
              'contingency': '0xf5efcfb849fd4ea967a4b67a1d6b008c8246eaaf737dc14e226f27a9ade3f548',
          }

          def post(url, payload, retries=6, timeout=180):
              body = json.dumps(payload).encode()
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          data=body,
                          method='POST',
                          headers={
                              'Content-Type': 'application/json',
                              'User-Agent': 'bucket-provider-audit-r6/1',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2**attempt)
              raise RuntimeError(f'POST failed for {url}: {last}')

          def gql(query, variables=None):
              body = post(GQL, {'query': query, 'variables': variables or {}})
              if body.get('errors'):
                  raise RuntimeError(json.dumps(body['errors']))
              return body['data']

          def rpc(method, params):
              failures = []
              for endpoint in RPCS:
                  try:
                      body = post(endpoint, {
                          'jsonrpc': '2.0',
                          'id': 1,
                          'method': method,
                          'params': params,
                      })
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return {'endpoint': endpoint, 'result': body.get('result')}
                  except Exception as exc:
                      failures.append({'endpoint': endpoint, 'error': str(exc)})
              return {'failures': failures}

          def result(wrapper):
              return wrapper.get('result') if isinstance(wrapper, dict) else None

          def dump(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          package_query = '''query Package($address:SuiAddress!){object(address:$address){address version digest previousTransaction{digest sender{address}}asMovePackage{address version linkage{originalId upgradedId version}typeOrigins{module struct definingId}modules{nodes{name disassembly functions(first:200){nodes{name visibility isEntry parameters{repr}return{repr}typeParameters{constraints}}}structs(first:200){nodes{name abilities fields{name type{repr}}}}}}}}}}'''
          checkpoint = gql('query { checkpoint { sequenceNumber timestamp } }')['checkpoint']

          package_rows = []
          function_rows = []
          static_hits = []
          transaction_summary = []
          object_type_counts = {}
          sender_counts = {}

          risk_patterns = {
              'usdb_mint': re.compile(r'usdb::mint', re.I),
              'usdb_burn': re.compile(r'usdb::burn', re.I),
              'coin_or_balance_split': re.compile(r'coin::split|balance::split', re.I),
              'transfer': re.compile(r'transfer::(?:public_)?transfer|transfer::share_object', re.I),
              'price_oracle': re.compile(r'oracle|price|sqrt_price|tick', re.I),
              'external_liquidity': re.compile(r'cetus|bluefin|momentum|mmt|ferra|steamm|current', re.I),
              'sender_auth': re.compile(r'tx_context::sender|assert_sender|admin|manager|cap', re.I),
              'overflow_or_rounding': re.compile(r'floor|ceil|mul_div|div_u64|checked|saturating', re.I),
          }

          for label, package in PACKAGES.items():
              graph = gql(package_query, {'address': package})['object']
              dump(RAW / f'{label}_package.json', graph)
              normalized_wrapper = rpc('sui_getNormalizedMoveModulesByPackage', [package])
              dump(RAW / f'{label}_normalized.json', normalized_wrapper)
              move_package = (graph or {}).get('asMovePackage')
              row = {
                  'label': label,
                  'package': package,
                  'exists': move_package is not None,
                  'version': (move_package or {}).get('version'),
                  'linkage': (move_package or {}).get('linkage'),
                  'type_origins': (move_package or {}).get('typeOrigins'),
                  'previous_transaction': (graph or {}).get('previousTransaction'),
                  'module_names': [],
              }
              if move_package:
                  package_dir = ASM / label
                  package_dir.mkdir(parents=True, exist_ok=True)
                  for module in (move_package.get('modules') or {}).get('nodes', []):
                      module_name = module.get('name')
                      row['module_names'].append(module_name)
                      disassembly = module.get('disassembly') or ''
                      (package_dir / f'{module_name}.asm').write_text(disassembly)
                      for function in (module.get('functions') or {}).get('nodes', []):
                          entry = {
                              'label': label,
                              'package': package,
                              'module': module_name,
                              'function': function.get('name'),
                              'visibility': function.get('visibility'),
                              'is_entry': function.get('isEntry'),
                              'parameters': [item.get('repr') for item in function.get('parameters', [])],
                              'returns': [item.get('repr') for item in function.get('return', [])],
                              'type_parameters': function.get('typeParameters'),
                          }
                          function_rows.append(entry)
                      for pattern_name, pattern in risk_patterns.items():
                          for match in pattern.finditer(disassembly):
                              start = max(0, disassembly.rfind('\n', 0, match.start() - 600))
                              end = disassembly.find('\n', match.end() + 900)
                              if end < 0:
                                  end = min(len(disassembly), match.end() + 900)
                              snippet = disassembly[start:end].strip()
                              static_hits.append({
                                  'label': label,
                                  'package': package,
                                  'module': module_name,
                                  'pattern': pattern_name,
                                  'match': match.group(0),
                                  'snippet': snippet[:3000],
                              })
              package_rows.append(row)

              cursor = None
              tx_count = 0
              relevant_calls = []
              for _ in range(12):
                  wrapper = rpc('suix_queryTransactionBlocks', [
                      {
                          'filter': {'MoveFunction': {'package': package}},
                          'options': {
                              'showInput': True,
                              'showRawInput': False,
                              'showEffects': True,
                              'showEvents': True,
                              'showObjectChanges': True,
                              'showBalanceChanges': True,
                          },
                      },
                      cursor,
                      50,
                      True,
                  ])
                  page = result(wrapper)
                  if not isinstance(page, dict):
                      dump(RAW / f'{label}_transaction_query_failure.json', wrapper)
                      break
                  transactions = page.get('data') or []
                  tx_count += len(transactions)
                  for tx in transactions:
                      sender = (((tx.get('transaction') or {}).get('data') or {}).get('sender'))
                      if sender:
                          sender_counts[sender] = sender_counts.get(sender, 0) + 1
                      for change in tx.get('objectChanges') or []:
                          object_type = change.get('objectType')
                          if object_type:
                              object_type_counts[object_type] = object_type_counts.get(object_type, 0) + 1
                      try:
                          commands = tx['transaction']['data']['transaction']['transactions']
                      except Exception:
                          commands = []
                      for index, command in enumerate(commands or []):
                          move = command.get('MoveCall') if isinstance(command, dict) else None
                          if move and move.get('package') == package:
                              relevant_calls.append({
                                  'digest': tx.get('digest'),
                                  'timestampMs': tx.get('timestampMs'),
                                  'sender': sender,
                                  'status': (tx.get('effects') or {}).get('status'),
                                  'index': index,
                                  'module': move.get('module'),
                                  'function': move.get('function'),
                                  'type_arguments': move.get('type_arguments'),
                                  'balance_changes': tx.get('balanceChanges'),
                                  'object_changes': tx.get('objectChanges'),
                              })
                  if not page.get('hasNextPage'):
                      break
                  cursor = page.get('nextCursor')
              dump(RAW / f'{label}_recent_calls.json', relevant_calls)
              transaction_summary.append({
                  'label': label,
                  'package': package,
                  'queried_transaction_count': tx_count,
                  'matching_call_count': len(relevant_calls),
                  'unique_senders': len({row.get('sender') for row in relevant_calls if row.get('sender')}),
                  'function_counts': {},
              })
              for call in relevant_calls:
                  key = f"{call.get('module')}::{call.get('function')}"
                  transaction_summary[-1]['function_counts'][key] = transaction_summary[-1]['function_counts'].get(key, 0) + 1

          public_or_entry = [
              row for row in function_rows
              if str(row.get('visibility')).upper() == 'PUBLIC' or row.get('is_entry')
          ]
          minting_functions = []
          for hit in static_hits:
              if hit['pattern'] != 'usdb_mint':
                  continue
              header = hit['snippet'].splitlines()[0] if hit['snippet'] else ''
              minting_functions.append({**hit, 'probable_function_header': header})

          capless_candidates = []
          for row in public_or_entry:
              serialized = json.dumps(row).lower()
              sensitive = any(word in serialized for word in (
                  'mint', 'borrow', 'deposit', 'withdraw', 'redeem', 'claim',
                  'remove', 'collect', 'destroy', 'supply', 'contingency',
              ))
              has_cap_parameter = any(
                  any(token in str(parameter).lower() for token in ('cap', 'admin', 'manager'))
                  for parameter in row.get('parameters', [])
              )
              if sensitive and not has_cap_parameter:
                  capless_candidates.append(row)

          dump(ANALYSIS / 'functions.json', function_rows)
          dump(ANALYSIS / 'public_or_entry_functions.json', public_or_entry)
          dump(ANALYSIS / 'static_hits.json', static_hits)
          dump(ANALYSIS / 'minting_functions.json', minting_functions)
          dump(ANALYSIS / 'capless_sensitive_candidates.json', capless_candidates)
          dump(ANALYSIS / 'object_type_counts.json', object_type_counts)
          dump(ANALYSIS / 'sender_counts.json', sender_counts)

          summary = {
              'schema': 'bucket-provider-mint-domain-audit-r6/v1',
              'network': 'sui-mainnet',
              'checkpoint': checkpoint,
              'readOnly': True,
              'package_count': len(package_rows),
              'packages': package_rows,
              'public_or_entry_function_count': len(public_or_entry),
              'mint_instruction_hit_count': len(minting_functions),
              'minting_functions': minting_functions,
              'capless_sensitive_candidate_count': len(capless_candidates),
              'capless_sensitive_candidates': capless_candidates,
              'transaction_summary': transaction_summary,
              'top_object_types': sorted(object_type_counts.items(), key=lambda item: item[1], reverse=True)[:100],
              'top_senders': sorted(sender_counts.items(), key=lambda item: item[1], reverse=True)[:50],
              'writes': 0,
              'transactionsConstructed': 0,
              'generatedUnix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'package_count': summary['package_count'],
              'public_or_entry_function_count': summary['public_or_entry_function_count'],
              'mint_instruction_hit_count': summary['mint_instruction_hit_count'],
              'capless_sensitive_candidate_count': summary['capless_sensitive_candidate_count'],
              'transaction_summary': summary['transaction_summary'],
              'minting_functions': [
                  {
                      'label': row['label'],
                      'module': row['module'],
                      'header': row['probable_function_header'],
                  }
                  for row in minting_functions
              ],
              'capless_sensitive_candidates': capless_candidates,
          }, indent=2))
          PY
          python3 bucket-provider-audit-r6/audit.py | tee bucket-provider-audit-r6/run.log
          find bucket-provider-audit-r6 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-provider-audit-r6/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' bucket-provider-audit-r6 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-provider-audit-r6/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['writes'] == 0
          assert summary['transactionsConstructed'] == 0
          assert summary['package_count'] == 8
          print('BUCKET_PROVIDER_AUDIT_R6_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-provider-audit-r6
          path: bucket-provider-audit-r6
          if-no-files-found: error
          retention-days: 7
