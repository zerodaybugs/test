name: Bucket Liquidation Allowlist Census

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Query live liquidation config and liquidator domains
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-liquidation-allowlist
          mkdir -p bucket-liquidation-allowlist/raw
          cat > bucket-liquidation-allowlist/census.py <<'PY'
          import json
          import pathlib
          import re
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-liquidation-allowlist')
          RAW = OUT / 'raw'
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          CONFIG_TYPE = '0xbe1457c92f8e8c39e85fa4f77bfcd8cfbda30d1861286ba64c76a94773138b5d::liquidation_rule::Config'
          ADMIN = '0x19f528ccf2c1ff204b61f9958517c26fcf0950a6034a20f8c342cc142fb0f5f5'
          HEX = re.compile(r'^0x[0-9a-fA-F]{64}$')

          def gql(query, variables=None, retries=5):
              payload = json.dumps({'query': query, 'variables': variables or {}}).encode()
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(
                          GQL,
                          data=payload,
                          method='POST',
                          headers={'Content-Type':'application/json','User-Agent':'bucket-liquidation-allowlist/1'},
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode())
                      if body.get('errors'):
                          raise RuntimeError(json.dumps(body['errors']))
                      return body
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** n)
              raise RuntimeError(f'GraphQL failure: {last}')

          def dump(name, value):
              (RAW / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          q_configs = '''query C($type:String!){objects(first:50,filter:{type:$type}){pageInfo{hasNextPage endCursor}nodes{address version digest owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}}previousTransaction{digest sender{address}}asMoveObject{contents{type{repr}json bcs}}}}}'''
          configs = gql(q_configs, {'type': CONFIG_TYPE})
          dump('01_configs.json', configs)
          nodes = configs['data']['objects']['nodes']

          liquidators = []
          config_rows = []
          for node in nodes:
              contents = (node.get('asMoveObject') or {}).get('contents') or {}
              data = contents.get('json') or {}
              raw_liquidators = (data.get('liquidators') or {}).get('contents', [])
              raw_versions = (data.get('versions') or {}).get('contents', [])
              raw_protected = (data.get('protected_debtors') or {}).get('contents', [])
              raw_unswappable = (data.get('unswappable_coin_types') or {}).get('contents', [])
              for value in raw_liquidators:
                  if isinstance(value, str) and HEX.match(value):
                      liquidators.append(value.lower())
              config_rows.append({
                  'id': node.get('address'),
                  'version': node.get('version'),
                  'owner': node.get('owner'),
                  'previous_transaction': node.get('previousTransaction'),
                  'liquidators': raw_liquidators,
                  'versions': raw_versions,
                  'protected_debtors': raw_protected,
                  'unswappable_coin_types': raw_unswappable,
              })

          liquidators = sorted(set(liquidators))
          q_addr = '''query A($address:SuiAddress!){address(address:$address){address balances(first:50){nodes{coinType coinObjectCount totalBalance}} objects(first:50){pageInfo{hasNextPage endCursor}nodes{address version digest owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}}previousTransaction{digest sender{address}}contents{type{repr}json bcs}}}transactions(first:20,relation:SENT){nodes{digest sender{address}effects{status errors}kind{__typename}}}}}'''
          address_results = {}
          for address in liquidators + [ADMIN]:
              try:
                  address_results[address] = gql(q_addr, {'address': address})
              except Exception as exc:
                  address_results[address] = {'error': type(exc).__name__, 'message': str(exc)}
          dump('02_liquidator_addresses.json', address_results)

          summary = {
              'network': 'sui-mainnet',
              'config_type': CONFIG_TYPE,
              'config_count': len(config_rows),
              'configs': config_rows,
              'liquidator_count': len(liquidators),
              'liquidators': liquidators,
              'admin_reference': ADMIN,
              'liquidator_equals_admin': [x for x in liquidators if x == ADMIN.lower()],
              'writes': 0,
              'transactions_constructed': 0,
              'generated_unix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-liquidation-allowlist/census.py | tee bucket-liquidation-allowlist/run.log
          find bucket-liquidation-allowlist -type f -print0 | sort -z | xargs -0 sha256sum > bucket-liquidation-allowlist/SHA256SUMS.txt

      - name: Verify read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-liquidation-allowlist && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-liquidation-allowlist/SUMMARY.json'))
          assert s['writes'] == 0
          assert s['transactions_constructed'] == 0
          assert s['config_count'] >= 1
          print('BUCKET_LIQUIDATION_ALLOWLIST_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-liquidation-allowlist-census
          path: bucket-liquidation-allowlist
          if-no-files-found: error
          retention-days: 7
