name: Bucket Credit ACL Manager Identity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Query manager addresses as objects and accounts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-credit-manager-gate
          mkdir -p bucket-credit-manager-gate/raw
          cat > bucket-credit-manager-gate/query.py <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-credit-manager-gate')
          RAW = OUT / 'raw'
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          CDP_ACL = '0x578045427984976a5d7d6d2f35f2d23da6b85e6062771e999aaddf1dd54fcd3f'
          MANAGERS = {
              'manager_admin_like': '0x938884d43de2bcf13a2f8f5886ea6382994ba49dcf7b3d08203acdd508778b6b',
              'manager_shared_between_cdp_psm': '0xbb7e63ea8820707968c5c9879c5e3a8ac6ffe59337c7e307490089b8c6caf6ef',
              'manager_psm_only': '0xbfd2e22f32d4bcaaf6f12f218fcc26488fdf63f338481e0d4f96e95160d61ba9',
          }

          def gql(query, variables=None, retries=5):
              payload = json.dumps({'query': query, 'variables': variables or {}}).encode()
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(
                          GQL,
                          data=payload,
                          method='POST',
                          headers={'Content-Type':'application/json','User-Agent':'bucket-credit-manager-gate/1'},
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode())
                      if body.get('errors'):
                          raise RuntimeError(json.dumps(body['errors']))
                      return body
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** n)
              raise RuntimeError(f'GraphQL failure: {last}')

          def dump(name, value):
              (RAW / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          keys = [CDP_ACL] + list(MANAGERS.values())
          q_objects = '''query O($keys:[ObjectKey!]!){multiGetObjects(keys:$keys){address version digest owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}}previousTransaction{digest sender{address}}asMoveObject{hasPublicTransfer contents{type{repr}json bcs}}asMovePackage{address version linkage{originalId upgradedId version}typeOrigins{module struct definingId}}}}'''
          objects = gql(q_objects, {'keys':[{'address':x} for x in keys]})
          dump('objects.json', objects)

          q_address = '''query A($address:SuiAddress!){address(address:$address){address balances(first:20){nodes{coinType coinObjectCount totalBalance}}objects(first:50){pageInfo{hasNextPage endCursor}nodes{address version digest owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}}previousTransaction{digest sender{address}}contents{type{repr}json bcs}hasPublicTransfer}}transactions(first:20,relation:SENT){pageInfo{hasNextPage endCursor}nodes{digest sender{address}effects{status errors}kind{__typename}}}}}'''
          address_results = {}
          for label, address in MANAGERS.items():
              try:
                  address_results[label] = gql(q_address, {'address':address})
              except Exception as exc:
                  address_results[label] = {'error':type(exc).__name__,'message':str(exc)}
          dump('addresses.json', address_results)

          object_nodes = objects['data']['multiGetObjects']
          by_address = {node['address'].lower():node for node in object_nodes if node and node.get('address')}
          rows = []
          dangerous = []
          for label, address in MANAGERS.items():
              node = by_address.get(address.lower())
              move = (node or {}).get('asMoveObject') or {}
              contents = move.get('contents') or {}
              type_repr = (contents.get('type') or {}).get('repr')
              owner = (node or {}).get('owner')
              row = {
                  'label': label,
                  'address': address,
                  'address_resolves_to_live_object': bool(node),
                  'object_type': type_repr,
                  'object_owner': owner,
                  'has_public_transfer': move.get('hasPublicTransfer'),
                  'is_bucket_account_object': bool(type_repr and type_repr.endswith('::account::Account')),
                  'is_shared_object': bool(owner and owner.get('__typename') == 'Shared'),
              }
              rows.append(row)
              if row['is_bucket_account_object'] and row['is_shared_object']:
                  dangerous.append(row)

          acl_node = by_address.get(CDP_ACL.lower())
          acl_json = (((acl_node or {}).get('asMoveObject') or {}).get('contents') or {}).get('json')
          summary = {
              'network': 'sui-mainnet',
              'cdp_access_control': CDP_ACL,
              'live_acl_json': acl_json,
              'manager_identity_rows': rows,
              'permissionless_shared_account_manager_candidates': dangerous,
              'critical_gate': 'PASS' if dangerous else 'NO_SHARED_ACCOUNT_MANAGER_FOUND',
              'writes': 0,
              'transactions_constructed': 0,
              'generated_unix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-credit-manager-gate/query.py | tee bucket-credit-manager-gate/run.log
          find bucket-credit-manager-gate -type f -print0 | sort -z | xargs -0 sha256sum > bucket-credit-manager-gate/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-credit-manager-gate && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-credit-manager-gate/SUMMARY.json'))
          assert s['writes'] == 0
          assert s['transactions_constructed'] == 0
          assert len(s['manager_identity_rows']) == 3
          print('BUCKET_CREDIT_MANAGER_IDENTITY_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-credit-manager-identity-gate
          path: bucket-credit-manager-gate
          if-no-files-found: error
          retention-days: 7
