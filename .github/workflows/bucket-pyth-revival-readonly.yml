name: Bucket CDP V3 Bytecode Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bytecode-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch v1, v3, and v4 package bytecode and metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-cdp-v3-gate
          mkdir -p bucket-cdp-v3-gate/{json,mv}
          cat > bucket-cdp-v3-gate/fetch.py <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-cdp-v3-gate')
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          PACKAGES = {
              'cdp_v1': '0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e',
              'cdp_v3_wrapper_link': '0x1a9ed525e699c5716923d36ac02f554368a7f52b83bc59679eef1f99efee324a',
              'cdp_v4_current': '0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26',
              'liquidation_wrapper': '0xbe1457c92f8e8c39e85fa4f77bfcd8cfbda30d1861286ba64c76a94773138b5d',
          }

          def post(payload, retries=5):
              data = json.dumps(payload).encode()
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(
                          GQL,
                          data=data,
                          method='POST',
                          headers={
                              'Content-Type': 'application/json',
                              'User-Agent': 'bucket-cdp-v3-bytecode-gate/1',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode())
                      if body.get('errors'):
                          raise RuntimeError(json.dumps(body['errors']))
                      return body
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** n)
              raise RuntimeError(f'GraphQL failure: {last}')

          def write_json(name, value):
              (OUT / 'json' / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          manifest = {}
          for label, package_id in PACKAGES.items():
              query = f'''{{ object(address: "{package_id}") {{ address version digest previousTransaction {{ digest sender {{ address }} }} asMovePackage {{ address version linkage {{ originalId upgradedId version }} typeOrigins {{ module struct definingId }} modules {{ nodes {{ name bytes fileFormatVersion }} }} }} }} }}'''
              result = post({'query': query})
              write_json(f'{label}.graphql.json', result)
              package = result['data']['object']['asMovePackage']
              target = OUT / 'mv' / label
              target.mkdir(parents=True, exist_ok=True)
              rows = []
              for module in package['modules']['nodes']:
                  raw = base64.b64decode(module['bytes'])
                  path = target / f"{module['name']}.mv"
                  path.write_bytes(raw)
                  rows.append({
                      'name': module['name'],
                      'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'magic': raw[:4].hex(),
                      'file_format_version': module.get('fileFormatVersion'),
                  })
              manifest[label] = {
                  'package_id': package_id,
                  'package_version': package.get('version'),
                  'linkage': package.get('linkage'),
                  'type_origins': package.get('typeOrigins'),
                  'modules': rows,
              }

          write_json('MANIFEST.json', manifest)
          summary = {
              'network': 'sui-mainnet',
              'packages': PACKAGES,
              'v3_vault_present': any(x['name'] == 'vault' for x in manifest['cdp_v3_wrapper_link']['modules']),
              'writes': 0,
              'transactions_constructed': 0,
              'generated_unix': int(time.time()),
          }
          write_json('SUMMARY.json', summary)
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-cdp-v3-gate/fetch.py | tee bucket-cdp-v3-gate/run.log
          find bucket-cdp-v3-gate -type f -print0 | sort -z | xargs -0 sha256sum > bucket-cdp-v3-gate/SHA256SUMS.txt

      - name: Validate evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-cdp-v3-gate/json/SUMMARY.json'))
          assert s['writes'] == 0
          assert s['transactions_constructed'] == 0
          assert s['v3_vault_present']
          print('BUCKET_CDP_V3_BYTECODE_GATE_PASS')
          PY
          for f in bucket-cdp-v3-gate/mv/*/*.mv; do
            test "$(head -c 4 "$f" | xxd -p)" = "a11ceb0b"
          done

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-cdp-v3-bytecode-gate
          path: bucket-cdp-v3-gate
          if-no-files-found: error
          retention-days: 7
