name: Bucket Legacy Package Bytecode Census

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact package bytecode and upgrade metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-legacy-packages
          mkdir -p bucket-legacy-packages/{json,mv}
          cat > bucket-legacy-packages/fetch.py <<'PY'
          import base64
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-legacy-packages')
          ENDPOINT = 'https://graphql.mainnet.sui.io/graphql'
          PACKAGES = {
              'framework_original': '0x665188033384920a5bb5dcfb2ef21f54b4568d08b431718b97e02e5c184b92cc',
              'framework_current': '0xe2d49d67ff42dc500275f2d84841bf35632aa6c1abdb70af66a10e1de93a4400',
              'flash_original': '0x0f51f9eb63574a1d12b62295599ac4f8231197f95b3cce9a516daba64f419d06',
              'flash_current': '0xca00bbb7ecfe11dbb527efab6145b358f2a95aa11a8aae9b9f475176430cf42a',
              'psm_original': '0xc2ae6693383e4a81285136effc8190c7baaf0e75aafa36d1c69cd2170cfc3803',
              'psm_current': '0x8a46afe6ab0b972e2ee3923f5669104ae9465c12b84cd5e78ea1ff6404e4bfaf',
          }

          QUERY = '''
          query Package($address: SuiAddress!) {
            object(address: $address) {
              address
              version
              digest
              owner { __typename }
              previousTransaction { digest sender { address } }
              asMovePackage {
                address
                version
                modules { nodes { name bytes } }
                linkage { originalId upgradedId version }
                typeOrigins { module struct definingId }
              }
            }
          }
          '''

          def post(address, retries=5):
              payload = json.dumps({'query': QUERY, 'variables': {'address': address}}).encode()
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          ENDPOINT,
                          data=payload,
                          method='POST',
                          headers={'Content-Type': 'application/json', 'User-Agent': 'bucket-legacy-bytecode/1'},
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode())
                      if body.get('errors'):
                          raise RuntimeError(json.dumps(body['errors']))
                      return body['data']['object']
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f'GraphQL failed: {last}')

          summary = {
              'network': 'sui-mainnet',
              'writes': 0,
              'transactions_constructed': 0,
              'packages': {},
          }
          for label, address in PACKAGES.items():
              obj = post(address)
              (OUT / 'json' / f'{label}.json').write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n')
              package = obj.get('asMovePackage') or {}
              module_dir = OUT / 'mv' / label
              module_dir.mkdir(parents=True, exist_ok=True)
              modules = []
              for node in ((package.get('modules') or {}).get('nodes') or []):
                  raw = base64.b64decode(node['bytes'])
                  path = module_dir / f"{node['name']}.mv"
                  path.write_bytes(raw)
                  modules.append({'name': node['name'], 'bytes': len(raw), 'magic': raw[:4].hex()})
              summary['packages'][label] = {
                  'requested_address': address,
                  'object_version': obj.get('version'),
                  'package_version': package.get('version'),
                  'digest': obj.get('digest'),
                  'previous_transaction': obj.get('previousTransaction'),
                  'linkage': package.get('linkage'),
                  'type_origins': package.get('typeOrigins'),
                  'modules': modules,
              }

          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-legacy-packages/fetch.py | tee bucket-legacy-packages/run.log
          find bucket-legacy-packages -type f -print0 | sort -z | xargs -0 sha256sum > bucket-legacy-packages/SHA256SUMS.txt

      - name: Verify read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-legacy-packages && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-legacy-packages/SUMMARY.json'))
          assert summary['writes'] == 0
          assert summary['transactions_constructed'] == 0
          assert all(v['modules'] for v in summary['packages'].values())
          print('BUCKET_LEGACY_PACKAGE_FETCH_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-legacy-package-bytecode-census
          path: bucket-legacy-packages
          if-no-files-found: error
          retention-days: 7
