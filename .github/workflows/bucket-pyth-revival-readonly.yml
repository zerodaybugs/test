name: Bucket BUCK PSM Historical Price Age Gate R4

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  age-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Measure historical BUCK price ages consumed by successful PSM swaps
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-buck-psm-age-gate-r4
          mkdir -p bucket-buck-psm-age-gate-r4/raw
          cat > bucket-buck-psm-age-gate-r4/gate.py <<'PY'
          import csv
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-buck-psm-age-gate-r4')
          RPC = 'https://sui-mainnet-endpoint.blockvision.org'
          AGG = '0xe7683cdd76af3f80da4f022afa2c31b554a45d23dcd1f418d11eff8cd5c9bf82'
          PSM = {
              '0xc2ae6693383e4a81285136effc8190c7baaf0e75aafa36d1c69cd2170cfc3803',
              '0x8a46afe6ab0b972e2ee3923f5669104ae9465c12b84cd5e78ea1ff6404e4bfaf',
          }
          PYTH_RULE = {
              '0x6ee87742e673749a97f5fbe576b92d8dd294a482307d3a3fb2c6f73a56b906a0',
              '0x5bc4f912b59c5cfcc86dfc90419837b9c3f9d3a3a94cef7a198838fa196bac4a',
          }

          def rpc(method, params, retries=6):
              payload = json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(
                          RPC, data=payload, method='POST',
                          headers={'Content-Type':'application/json','User-Agent':'bucket-buck-psm-age-gate-r4/1'},
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          body = json.loads(response.read().decode())
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return body.get('result')
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** n)
              raise RuntimeError(f'{method} failed: {last}')

          def object_id(arg, inputs):
              if not isinstance(arg, dict) or 'Input' not in arg:
                  return None
              try:
                  value = inputs[arg['Input']]
              except Exception:
                  return None
              return value.get('objectId') if isinstance(value, dict) else None

          def scalar_paths(value, path=()):
              rows = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      rows.extend(scalar_paths(child, path + (str(key),)))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      rows.extend(scalar_paths(child, path + (str(index),)))
              else:
                  rows.append(('.'.join(path), value))
              return rows

          def extract_price_fields(content):
              scalars = scalar_paths(content)
              timestamps = []
              prices = []
              confidences = []
              expos = []
              for path, value in scalars:
                  low = path.lower()
                  if any(term in low for term in ('timestamp', 'publish_time', 'publish-time')):
                      try:
                          timestamps.append((path, int(value)))
                      except Exception:
                          pass
                  if low.endswith('.price'):
                      try:
                          prices.append((path, int(value)))
                      except Exception:
                          pass
                  if low.endswith('.conf') or low.endswith('.confidence'):
                      try:
                          confidences.append((path, int(value)))
                      except Exception:
                          pass
                  if low.endswith('.expo') or low.endswith('.exponent'):
                      try:
                          expos.append((path, int(value)))
                      except Exception:
                          pass
              preferred = [row for row in timestamps if '.price.' in row[0].lower() and 'ema' not in row[0].lower()]
              timestamp = preferred[0][1] if preferred else (timestamps[0][1] if timestamps else None)
              return {
                  'publish_time': timestamp,
                  'timestamp_candidates': timestamps,
                  'price_candidates': prices,
                  'confidence_candidates': confidences,
                  'exponent_candidates': expos,
              }

          transactions = []
          cursor = None
          for _ in range(10):
              page = rpc('suix_queryTransactionBlocks', [{
                  'filter': {'InputObject': AGG},
                  'options': {
                      'showInput': True,
                      'showRawInput': False,
                      'showEffects': True,
                      'showEvents': True,
                      'showObjectChanges': True,
                      'showBalanceChanges': True,
                  },
              }, cursor, 50, True])
              transactions.extend(page.get('data') or [])
              if not page.get('hasNextPage'):
                  break
              cursor = page.get('nextCursor')

          rows = []
          past_cache = {}
          for tx in transactions:
              status = ((tx.get('effects') or {}).get('status') or {}).get('status')
              if status != 'success':
                  continue
              txdata = (((tx.get('transaction') or {}).get('data') or {}).get('transaction') or {})
              inputs = txdata.get('inputs') or []
              commands = txdata.get('transactions') or []
              swaps = []
              feeds = []
              pyth_updates = []
              for index, command in enumerate(commands):
                  call = command.get('MoveCall') if isinstance(command, dict) else None
                  if not call:
                      continue
                  package = str(call.get('package') or '').lower()
                  module = call.get('module')
                  function = call.get('function')
                  if package in PSM and module == 'pool' and function in ('swap_in', 'swap_out'):
                      swaps.append((index, call))
                  if package in PYTH_RULE and module == 'pyth_rule' and function == 'feed':
                      feeds.append((index, call))
                  if module == 'pyth' and function and 'update' in function:
                      pyth_updates.append((index, call))
              if not swaps or not feeds:
                  continue
              feed = feeds[0][1]
              args = feed.get('arguments') or []
              price_object = object_id(args[-1], inputs) if args else None
              price_version = None
              price_digest = None
              for ref in (tx.get('effects') or {}).get('sharedObjects') or []:
                  if str(ref.get('objectId')).lower() == str(price_object).lower():
                      price_version = int(ref.get('version'))
                      price_digest = ref.get('digest')
                      break
              historical = None
              extracted = {'publish_time': None, 'timestamp_candidates': [], 'price_candidates': [], 'confidence_candidates': [], 'exponent_candidates': []}
              object_type = None
              if price_object and price_version is not None:
                  cache_key = f'{price_object}@{price_version}'
                  if cache_key not in past_cache:
                      past_cache[cache_key] = rpc('sui_tryGetPastObject', [price_object, price_version, {
                          'showType': True,
                          'showOwner': True,
                          'showPreviousTransaction': True,
                          'showDisplay': False,
                          'showContent': True,
                          'showBcs': True,
                      }])
                  historical = past_cache[cache_key]
                  if isinstance(historical, dict) and historical.get('status') == 'VersionFound':
                      details = historical.get('details') or {}
                      data = details.get('data') if isinstance(details, dict) else None
                      if not data and isinstance(details, dict):
                          data = details
                      object_type = (data or {}).get('type') if isinstance(data, dict) else None
                      content = (data or {}).get('content') if isinstance(data, dict) else None
                      extracted = extract_price_fields(content)
              tx_ms = int(tx.get('timestampMs')) if tx.get('timestampMs') is not None else None
              publish_time = extracted['publish_time']
              age_sec = tx_ms // 1000 - publish_time if tx_ms is not None and publish_time is not None else None
              event = None
              for item in tx.get('events') or []:
                  if 'PsmSwap' in str(item.get('type')):
                      event = item.get('parsedJson')
                      break
              rows.append({
                  'digest': tx.get('digest'),
                  'tx_timestamp_ms': tx_ms,
                  'psm_function': swaps[0][1].get('function'),
                  'same_ptb_pyth_update': bool(pyth_updates),
                  'price_info_object': price_object,
                  'price_info_version': price_version,
                  'price_info_digest': price_digest,
                  'object_type': object_type,
                  'publish_time': publish_time,
                  'age_sec': age_sec,
                  'timestamp_candidates': extracted['timestamp_candidates'],
                  'price_candidates': extracted['price_candidates'],
                  'confidence_candidates': extracted['confidence_candidates'],
                  'exponent_candidates': extracted['exponent_candidates'],
                  'psm_event': event,
              })

          (OUT / 'ROWS.json').write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n')
          (OUT / 'raw' / 'PAST_OBJECTS.json').write_text(json.dumps(past_cache, indent=2, sort_keys=True) + '\n')
          (OUT / 'raw' / 'TRANSACTIONS.json').write_text(json.dumps(transactions, indent=2, sort_keys=True) + '\n')
          with (OUT / 'ROWS.csv').open('w', newline='') as handle:
              fields = ['digest','tx_timestamp_ms','psm_function','same_ptb_pyth_update','price_info_object','price_info_version','publish_time','age_sec']
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for row in rows:
                  writer.writerow({key: row.get(key) for key in fields})

          ages = [row['age_sec'] for row in rows if row['age_sec'] is not None]
          ranked = sorted((row for row in rows if row['age_sec'] is not None), key=lambda row: row['age_sec'], reverse=True)
          version_found = sum(1 for value in past_cache.values() if isinstance(value, dict) and value.get('status') == 'VersionFound')
          summary = {
              'network': 'sui-mainnet',
              'aggregator': AGG,
              'transactions_scanned': len(transactions),
              'successful_buck_psm_swaps': len(rows),
              'same_ptb_pyth_update_count': sum(1 for row in rows if row['same_ptb_pyth_update']),
              'without_same_ptb_pyth_update_count': sum(1 for row in rows if not row['same_ptb_pyth_update']),
              'unique_historical_objects_requested': len(past_cache),
              'historical_version_found_count': version_found,
              'age_count': len(ages),
              'age_min_sec': min(ages) if ages else None,
              'age_max_sec': max(ages) if ages else None,
              'age_average_sec': sum(ages) / len(ages) if ages else None,
              'oldest_20_successful_swaps': ranked[:20],
              'writes': 0,
              'transactions_constructed': 0,
              'generated_unix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'transactions_scanned': summary['transactions_scanned'],
              'successful_buck_psm_swaps': summary['successful_buck_psm_swaps'],
              'same_ptb_pyth_update_count': summary['same_ptb_pyth_update_count'],
              'without_same_ptb_pyth_update_count': summary['without_same_ptb_pyth_update_count'],
              'historical_version_found_count': summary['historical_version_found_count'],
              'age_count': summary['age_count'],
              'age_min_sec': summary['age_min_sec'],
              'age_max_sec': summary['age_max_sec'],
              'age_average_sec': summary['age_average_sec'],
              'oldest_5': [{key: row.get(key) for key in ('digest','psm_function','same_ptb_pyth_update','publish_time','age_sec')} for row in ranked[:5]],
          }, indent=2))
          PY
          python3 bucket-buck-psm-age-gate-r4/gate.py | tee bucket-buck-psm-age-gate-r4/run.log
          find bucket-buck-psm-age-gate-r4 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-buck-psm-age-gate-r4/SHA256SUMS.txt

      - name: Validate read-only boundary and extraction
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-buck-psm-age-gate-r4 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-buck-psm-age-gate-r4/SUMMARY.json'))
          assert summary['writes'] == 0
          assert summary['transactions_constructed'] == 0
          assert summary['successful_buck_psm_swaps'] > 0
          assert summary['historical_version_found_count'] > 0
          assert summary['age_count'] > 0
          print('BUCKET_BUCK_PSM_AGE_GATE_R4_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-buck-psm-age-gate-r4
          path: bucket-buck-psm-age-gate-r4
          if-no-files-found: error
          retention-days: 7
