name: Bucket V2 Public Audit Duplicate Scan R6B

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdfinfo -v 2>&1 | tee poppler-version.txt

      - name: Download, inspect, extract, and render public V2 audit reports
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-audit-duplicate-r6b
          mkdir -p bucket-audit-duplicate-r6b/{pdf,text,pages,renders}
          cp poppler-version.txt bucket-audit-duplicate-r6b/
          base='https://raw.githubusercontent.com/Bucket-Protocol/Audit/main/BucketV2'
          files=(
            Movebit_Bucket_V2_Report_Final_Report.pdf
            Hashlock_Bucket_V2_Report_Final_Report.pdf
            Quantstamp_Bucket_V2_Final_Report.pdf
          )
          for name in "${files[@]}"; do
            curl -fL "$base/$name" -o "bucket-audit-duplicate-r6b/pdf/$name"
            pdfinfo "bucket-audit-duplicate-r6b/pdf/$name" > "bucket-audit-duplicate-r6b/text/$name.pdfinfo.txt"
            pdftotext -layout "bucket-audit-duplicate-r6b/pdf/$name" "bucket-audit-duplicate-r6b/text/$name.txt"
          done

          cat > bucket-audit-duplicate-r6b/scan.py <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('bucket-audit-duplicate-r6b')
          terms = re.compile(
              r'blacklist|blacklisted|freeze|frozen|sanction|liquidat|withdraw|bad debt|insolven',
              re.I,
          )
          specific = re.compile(
              r'(blacklist|blacklisted|freeze|frozen|sanction).{0,300}(liquidat|withdraw)|'
              r'(liquidat|withdraw).{0,300}(blacklist|blacklisted|freeze|frozen|sanction)',
              re.I | re.S,
          )
          reports = []
          for pdf in sorted((root / 'pdf').glob('*.pdf')):
              info = (root / 'text' / f'{pdf.name}.pdfinfo.txt').read_text(errors='replace')
              match = re.search(r'^Pages:\s+(\d+)', info, re.M)
              pages = int(match.group(1)) if match else 0
              page_hits = []
              for page in range(1, pages + 1):
                  page_txt = root / 'pages' / f'{pdf.stem}.page-{page:03d}.txt'
                  subprocess.run(
                      ['pdftotext', '-layout', '-f', str(page), '-l', str(page), str(pdf), str(page_txt)],
                      check=True,
                  )
                  text = page_txt.read_text(errors='replace')
                  matches = []
                  for line_number, line in enumerate(text.splitlines(), 1):
                      if terms.search(line):
                          matches.append({'line': line_number, 'text': line.strip()})
                  if matches:
                      page_hits.append({'page': page, 'matches': matches})
                      prefix = root / 'renders' / f'{pdf.stem}.page-{page:03d}'
                      subprocess.run(
                          ['pdftoppm', '-f', str(page), '-l', str(page), '-r', '130', '-png', '-singlefile', str(pdf), str(prefix)],
                          check=True,
                      )
                  else:
                      page_txt.unlink(missing_ok=True)
              full_text = (root / 'text' / f'{pdf.name}.txt').read_text(errors='replace')
              overlap_matches = list(specific.finditer(full_text))
              reports.append({
                  'file': pdf.name,
                  'pages': pages,
                  'page_hits': page_hits,
                  'specific_blacklist_liquidation_overlap': bool(overlap_matches),
                  'specific_overlap_snippets': [
                      ' '.join(match.group(0).split())[:1200]
                      for match in overlap_matches[:30]
                  ],
              })
          summary = {
              'schema': 'bucket-v2-public-audit-duplicate-scan-r6b/v1',
              'reports': reports,
              'exact_or_near_blacklist_liquidation_overlap_count': sum(
                  1 for report in reports if report['specific_blacklist_liquidation_overlap']
              ),
              'search_terms': terms.pattern,
              'manual_review_required_for_any_overlap': True,
          }
          (root / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-audit-duplicate-r6b/scan.py | tee bucket-audit-duplicate-r6b/run.log
          find bucket-audit-duplicate-r6b -type f -print0 | sort -z | xargs -0 sha256sum > bucket-audit-duplicate-r6b/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-audit-duplicate-r6b
          path: bucket-audit-duplicate-r6b
          if-no-files-found: error
          retention-days: 7
