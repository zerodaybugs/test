name: Bucket Live Role and Cap Census

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read-only Sui mainnet census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-live-census
          mkdir -p bucket-live-census/raw
          cat > bucket-live-census/census.py <<'PY'
          import json, pathlib, re, time, urllib.request

          OUT = pathlib.Path('bucket-live-census')
          RAW = OUT / 'raw'
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          HEX = re.compile(r'^0x[0-9a-fA-F]{64}$')

          ENTRY = '0x03e79aa64ac007d200aefdcb445e31e24f460279bab6c73babfb031b7464072e'
          TREASURY = '0x4de1c29a89d6888ebf8f7ae20364571dce4e1e42b9c9221f7df924ad6f9e617d'
          USD_ADMIN = '0x14bdc35f9759cdba6d6a76b5cb4f56341f7421e2bc814317a53463c003020e30'
          USD_UPGRADE = '0x4035e8134f67518779278b3f3fcf9212249bde705a5f2e04005c686d7cf2f357'
          CDP_UPGRADE = '0x9e9a1e879aa062c46e0beb731a974ee9de0c242989127d4da0b1edcf37bf7526'
          CONFIG_ADMIN = '0xd1ce0affeda5aa8f3ec50ff617f27717673acd74fecaf850a7d1096f421d4131'
          KNOWN_MANAGER = '0x3b23b0a29ff0cd68144930cc409d242fdc10201ac9d9159d3c597252e8e0781e'
          CDP_ORIGINAL = '0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e'
          CDP_CALL_TARGET = '0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26'

          FALLBACK_VAULTS = [
            '0xdb3b2f1ce99c935a5c5e14ce8321e0c252a8b16c50861407d2253d392d5fb836',
            '0x1e90eb4184e3303ee69d1728630c872b214f8699982b00dc39aabde8b4ff5ce3',
            '0x38057191f48cf748d3b018e83ec0dda9f769f3f2d98010561002d6d2378f8ec3',
            '0x13ca385797229d6ad23a3ff0981fc30971735b0efd307d02920b58730d923a14',
            '0x6677cdcc3186900914823fc8e5de7a2d1e874bbc0682cbcf7637ddf9342b1cbd',
            '0xe1c7630ef33094491ab291bed669fcc64a48a88fcc99ddc200bcc38deb00400e',
            '0xf985037e218946d20344810be7c07e42e7fae1666cdce60e7f028706768daed0',
            '0xbd0079fb337dc5c79ae8f522aab72fcda38b6f10e38f2477c075777d8b1ac263',
            '0x5d76ee14fc4b1f501653c65eb3dc2ba0cd42f7d0d11480a840322e77d4b56362',
            '0xd3ef65a1dec4b5c5f0e0bb7caf29f4a425bd04ad43bce942ec6e1c70385b79de',
            '0x9cd535e14d25767387e29798cfd61cf8c780d4836798cd64a5ce0d6fdc4659b2',
            '0xee2d62b04abd9064a5526043395e09b0481e89fa3309d428fcb271ac53ce3103',
            '0x755c54dd718d350afd03314fe6ccc71e0ab36a974caf6721f1e03b7675dfaba1',
            '0xb36fea26a681f44b9a075297ddb9ebb9d4f35210c48d133e767bb294ac6427c6',
            '0x2169f7a9f7c693265dad755bd7e75382e88cc4432595a22950432cb512bc6cd7',
            '0x83367e510389536e2041d50b3faabc2d1b1c8194ca5570a2a3a3e460d6113e86',
            '0x542eff36534bc5d7d07808953ebb8c580c23f047b41c094601d40a0fc7e99238',
            '0x1f32b8b587b69a97cb779b2df1e2aa90f6fbb43edcc887f11a8f4a6de0944937',
            '0x94f785bda085beb012e9e96d16a36cf16b6729f776e620ef8c3b37d1e06c2d82',
            '0x61c4f4e0849de36b840a5198dbe0ac5bbdedf3a514f8a66ecedd2c6f7b2fb380',
          ]

          Q_OBJECTS = '''query O($keys:[ObjectKey!]!){multiGetObjects(keys:$keys){address version digest owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}} previousTransaction{digest sender{address}} asMoveObject{contents{type{repr} json bcs}} asMovePackage{address version linkage{originalId upgradedId version} typeOrigins{module struct definingId}}}}'''
          Q_ADDRESS = '''query A($address:SuiAddress!){address(address:$address){address objects(first:100){pageInfo{hasNextPage endCursor} nodes{address version owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}} asMoveObject{contents{type{repr} json bcs}}}}}}'''

          def gql(query, variables, retries=5):
              payload=json.dumps({'query':query,'variables':variables}).encode()
              last=None
              for n in range(retries):
                  try:
                      req=urllib.request.Request(GQL,data=payload,method='POST',headers={'Content-Type':'application/json','User-Agent':'bucket-live-census/3'})
                      with urllib.request.urlopen(req,timeout=90) as r:
                          body=json.loads(r.read().decode())
                      if body.get('errors'): raise RuntimeError(json.dumps(body['errors']))
                      return body
                  except Exception as e:
                      last=e; time.sleep(2**n)
              raise RuntimeError(f'GraphQL failure: {last}')

          def objects(ids):
              ids=list(dict.fromkeys(x.lower() for x in ids if isinstance(x,str) and HEX.match(x)))
              out=[]
              for n in range(0,len(ids),35):
                  out += gql(Q_OBJECTS,{'keys':[{'address':x} for x in ids[n:n+35]]})['data']['multiGetObjects']
              return out

          def dump(name,x): (RAW/name).write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          def content(o):
              try:
                  c=o['asMoveObject']['contents']; return c['type']['repr'],c['json']
              except Exception: return None,None
          def owner(o):
              z=(o or {}).get('owner') or {}; return {'kind':z.get('__typename'),'address':((z.get('address') or {}).get('address'))}
          def i(x):
              try:return int(x)
              except:return None
          def ids_in(x,out):
              if isinstance(x,str) and HEX.match(x):out.add(x.lower())
              elif isinstance(x,list):
                  for y in x:ids_in(y,out)
              elif isinstance(x,dict):
                  for y in x.values():ids_in(y,out)
          def find_key(x,need):
              if isinstance(x,dict):
                  for k,v in x.items():
                      lk=k.lower()
                      if all(s in lk for s in need) and isinstance(v,str) and HEX.match(v):return v.lower()
                  for v in x.values():
                      r=find_key(v,need)
                      if r:return r
              elif isinstance(x,list):
                  for v in x:
                      r=find_key(v,need)
                      if r:return r
              return None
          def managers(j):
              try:m=j['access_control']['managers']; m=m.get('contents',[]) if isinstance(m,dict) else m
              except:return []
              return [{'address':x.get('key'),'level':i(x.get('value'))} for x in m if isinstance(x,dict)]

          entry=objects([ENTRY]); dump('01_entry.json',entry)
          et,ej=content(entry[0])
          subids=[x.lower() for x in (ej or {}).get('id_vector',[]) if isinstance(x,str) and HEX.match(x)]
          subs=objects(subids); dump('02_subobjects.json',subs)

          pkg_cfg=obj_cfg=vault_cfg=None
          config_ids=set()
          for o in subs:
              t,j=content(o); ids_in(j,config_ids)
              if t and t.endswith('::package_config::PackageConfig'):pkg_cfg=j
              elif t and t.endswith('::object_config::ObjectConfig'):obj_cfg=j
              elif t and t.endswith('::vault::Vault'):vault_cfg=j
          live_cdp=find_key(pkg_cfg,['cdp','package']) or find_key(pkg_cfg,['cdp'])
          live_treasury=find_key(obj_cfg,['treasury']) or TREASURY

          query=set(FALLBACK_VAULTS)|config_ids|{TREASURY,live_treasury,USD_ADMIN,USD_UPGRADE,CDP_UPGRADE,CONFIG_ADMIN,CDP_ORIGINAL,CDP_CALL_TARGET}
          if live_cdp:query.add(live_cdp)
          allobj=objects(sorted(query)); dump('03_objects.json',allobj)
          byid={o['address'].lower():o for o in allobj if o and o.get('address')}

          rows=[]; manager_map={}; total_debt=total_supply=total_limits=0
          for oid,o in byid.items():
              t,j=content(o)
              if not(t and '::vault::Vault<' in t and isinstance(j,dict)):continue
              lim=j.get('limited_supply') or {}; debt=i(j.get('total_debt_amount')) or 0; supply=i(lim.get('supply')) or 0; limit=i(lim.get('limit')) or 0
              ms=managers(j)
              for m in ms:manager_map.setdefault(str(m['address']).lower(),[]).append({'vault_id':oid,'level':m['level'],'debt_raw':debt,'type':t})
              pt=j.get('position_table') or {}
              row={'id':oid,'type':t,'version':o.get('version'),'security_level':j.get('security_level'),'managers':ms,'debt_raw':debt,'collateral_raw':i(j.get('total_coll_amount')),'positions':i(pt.get('size')),'supply_raw':supply,'limit_raw':limit,'headroom_raw':max(limit-supply,0),'interest_rate_raw':((j.get('interest_rate') or {}).get('value')),'mcr_raw':((j.get('min_collateral_ratio') or {}).get('value'))}
              rows.append(row);total_debt+=debt;total_supply+=supply;total_limits+=limit
          rows.sort(key=lambda x:x['debt_raw'],reverse=True)

          to=byid.get(live_treasury.lower()) or byid.get(TREASURY.lower());tt,tj=content(to)
          entries=[]
          if isinstance(tj,dict):
              mm=tj.get('module_config_map') or tj.get('module_configs') or {};entries=mm.get('contents',[]) if isinstance(mm,dict) else (mm or [])
          cdp_entry=next((x for x in entries if 'BucketV2CDP' in json.dumps(x.get('key') if isinstance(x,dict) else x)),None)
          def num(x,names):
              if isinstance(x,dict):
                  for k in names:
                      if k in x and i(x[k]) is not None:return i(x[k])
                  for v in x.values():
                      q=num(v,names)
                      if q is not None:return q
              if isinstance(x,list):
                  for v in x:
                      q=num(v,names)
                      if q is not None:return q
              return None
          ms=num((cdp_entry or {}).get('value'),['supply','current_supply']);ml=num((cdp_entry or {}).get('value'),['limit','supply_limit','max_supply'])

          capids=[USD_ADMIN,USD_UPGRADE,CDP_UPGRADE,CONFIG_ADMIN]
          caps={x:owner(byid.get(x.lower())) for x in capids}
          ownerids=[v['address'] for v in caps.values() if v.get('address')]
          dump('04_cap_owner_objects.json',objects(ownerids))
          manager_owned=gql(Q_ADDRESS,{'address':KNOWN_MANAGER});dump('05_manager_owned.json',manager_owned)

          summary={'captured_unix':int(time.time()),'network':'sui-mainnet','writes':0,'transactions_constructed':0,'entry_config':{'id':ENTRY,'type':et,'subobjects':subids},'live_config':{'cdp_package_id':live_cdp,'treasury_id':live_treasury,'package_config':pkg_cfg,'object_config':obj_cfg},'vault_totals':{'vault_count':len(rows),'debt_raw':total_debt,'sum_supply_raw':total_supply,'sum_limits_raw':total_limits,'sum_headroom_raw':total_limits-total_supply},'vaults':rows,'manager_assignments':manager_map,'known_manager':KNOWN_MANAGER,'treasury':{'type':tt,'module_config_count':len(entries),'cdp_module_config':cdp_entry,'supply_raw':ms,'limit_raw':ml,'headroom_raw':None if ms is None or ml is None else ml-ms},'cap_owners':caps}
          (OUT/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'live_cdp':live_cdp,'vault_totals':summary['vault_totals'],'known_manager_assignments':manager_map.get(KNOWN_MANAGER.lower(),[]),'treasury':summary['treasury'],'cap_owners':caps},indent=2))
          PY
          python3 bucket-live-census/census.py | tee bucket-live-census/run.log
          find bucket-live-census -type f -print0 | sort -z | xargs -0 sha256sum > bucket-live-census/SHA256SUMS.txt

      - name: Verify read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-live-census && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-live-census/SUMMARY.json'))
          assert s['writes']==0 and s['transactions_constructed']==0
          assert s['entry_config']['subobjects']
          assert s['vault_totals']['vault_count']>0
          print('BUCKET_LIVE_CENSUS_READ_ONLY_PASS')
          PY

      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-live-role-cap-census-v2
          path: bucket-live-census
          if-no-files-found: error
          retention-days: 7
