name: Bucket CDP Module Cap Reachability Gate R6

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cap-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Capture current Treasury and all CDP Vault cap values
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-cdp-cap-gate-r6
          mkdir -p bucket-cdp-cap-gate-r6/raw
          cat > bucket-cdp-cap-gate-r6/gate.py <<'PY'
          import json, pathlib, time, urllib.request
          OUT=pathlib.Path('bucket-cdp-cap-gate-r6'); RAW=OUT/'raw'
          GQL='https://graphql.mainnet.sui.io/graphql'
          TREASURY_TYPE='0xe14726c336e81b32328e92afc37345d159f5b550b09fa92bd43640cfdd0a0cfd::usdb::Treasury'
          VAULT_TYPE='0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e::vault::Vault'
          U64_MAX=(1<<64)-1

          def post(payload,retries=6,timeout=120):
              data=json.dumps(payload).encode(); last=None
              for n in range(retries):
                  try:
                      req=urllib.request.Request(GQL,data=data,method='POST',headers={'Content-Type':'application/json','User-Agent':'bucket-cdp-cap-gate-r6/1'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: body=json.loads(r.read().decode())
                      if body.get('errors'): raise RuntimeError(json.dumps(body['errors']))
                      return body
                  except Exception as exc:
                      last=exc; time.sleep(2**n)
              raise RuntimeError(f'GraphQL failed: {last}')
          def gql(query,variables=None): return post({'query':query,'variables':variables or {}})['data']
          def as_int(v):
              if isinstance(v,int) and not isinstance(v,bool): return v
              if isinstance(v,str) and v.isdigit(): return int(v)
              raise RuntimeError(f'invalid integer {v!r}')
          def vecmap(v):
              if isinstance(v,dict): v=v.get('contents')
              return v if isinstance(v,list) else []
          def dump(name,value): (RAW/name).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')

          checkpoint=gql('query { checkpoint { sequenceNumber timestamp } }')['checkpoint']
          query='''query O($type:String!,$after:String){objects(first:50,after:$after,filter:{type:$type}){pageInfo{hasNextPage endCursor}nodes{address version digest owner{__typename}previousTransaction{digest sender{address}}asMoveObject{contents{type{repr}json bcs}}}}}'''
          def objects(type_):
              rows=[]; after=None
              while True:
                  conn=gql(query,{'type':type_,'after':after})['objects']; rows.extend(conn.get('nodes') or [])
                  page=conn.get('pageInfo') or {}
                  if not page.get('hasNextPage'): break
                  after=page.get('endCursor')
              return rows

          treasuries=objects(TREASURY_TYPE)
          if len(treasuries)!=1: raise RuntimeError(f'expected one Treasury, got {len(treasuries)}')
          treasury=treasuries[0]
          tj=treasury['asMoveObject']['contents']['json']
          configs=vecmap(tj.get('module_config_map'))
          cdp=[x for x in configs if 'BucketV2CDP' in str(x.get('key'))]
          if len(cdp)!=1: raise RuntimeError(f'expected one CDP module config, got {len(cdp)}')
          module_ls=cdp[0]['value']['limited_supply']
          module_limit=as_int(module_ls['limit']); module_supply=as_int(module_ls['supply'])
          module_headroom=max(0,module_limit-module_supply)

          vaults=objects(VAULT_TYPE)
          parsed=[]
          for row in vaults:
              c=row['asMoveObject']['contents']; j=c['json']; ls=j['limited_supply']
              limit=as_int(ls['limit']); supply=as_int(ls['supply'])
              parsed.append({
                  'id':row['address'],'version':str(row['version']),'digest':row['digest'],
                  'type':c['type']['repr'],'decimal':as_int(j['decimal']),
                  'limit':limit,'supply':supply,'headroom':max(0,limit-supply),
                  'totalDebt':as_int(j.get('total_debt_amount','0')),
                  'totalCollateral':as_int(j.get('total_coll_amount','0')),
                  'positionCount':as_int((j.get('position_table') or {}).get('size','0')),
                  'interestRateRaw':j.get('interest_rate'),
                  'minimumCollateralRatioRaw':j.get('min_collateral_ratio'),
              })
          aggregate=sum(v['headroom'] for v in parsed)
          active=[v for v in parsed if v['totalDebt']>0 and v['headroom']>0]
          coverage=aggregate/module_headroom if module_headroom else None
          analysis={
              'moduleCapFinite':0<module_limit<U64_MAX,
              'moduleLimitRaw':module_limit,'moduleSupplyRaw':module_supply,'moduleHeadroomRaw':module_headroom,
              'aggregateVaultHeadroomRaw':aggregate,'aggregateVaultHeadroomCoversModuleHeadroom':aggregate>=module_headroom,
              'coverageRatio':coverage,'reachabilityShortfallRaw':max(0,module_headroom-aggregate),
              'activeVaultCount':len(active),'activeVaultIds':[v['id'] for v in active],
              'automatedTechnicalGatePass':0<module_limit<U64_MAX and aggregate>=module_headroom and len(active)>0,
              'usdbDecimalsAssumedForDisplayOnly':6,
              'moduleHeadroomDisplayUSDB':module_headroom/1_000_000,
              'aggregateVaultHeadroomDisplayUSDB':aggregate/1_000_000,
              'reachabilityShortfallDisplayUSDB':max(0,module_headroom-aggregate)/1_000_000,
          }
          summary={
              'schema':'bucket-cdp-module-cap-reachability-r6/v1','network':'sui-mainnet','readOnly':True,
              'checkpoint':checkpoint,
              'treasury':{'id':treasury['address'],'version':str(treasury['version']),'digest':treasury['digest'],'moduleConfigKey':cdp[0]['key'],'validVersions':cdp[0]['value'].get('valid_versions')},
              'analysis':analysis,'vaults':sorted(parsed,key=lambda x:x['headroom']),
              'writes':0,'transactionsConstructed':0,'generatedUnix':int(time.time()),
          }
          dump('treasury.json',treasury); dump('vaults.json',vaults)
          (OUT/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          python3 bucket-cdp-cap-gate-r6/gate.py | tee bucket-cdp-cap-gate-r6/run.log
          find bucket-cdp-cap-gate-r6 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-cdp-cap-gate-r6/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-cdp-cap-gate-r6 && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-cdp-cap-gate-r6/SUMMARY.json'))
          assert s['readOnly'] is True
          assert s['writes']==0 and s['transactionsConstructed']==0
          assert len(s['vaults'])>0
          print('BUCKET_CDP_CAP_GATE_R6_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-cdp-cap-gate-r6
          path: bucket-cdp-cap-gate-r6
          if-no-files-found: error
          retention-days: 7
