name: Bucket Liquidator Trust Domain Probe

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Query liquidator ownership and transaction history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-liquidator-domain
          mkdir -p bucket-liquidator-domain/raw
          cat > bucket-liquidator-domain/probe.py <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-liquidator-domain')
          RAW = OUT / 'raw'
          ENDPOINTS = [
              'https://sui-mainnet-endpoint.blockvision.org',
              'https://fullnode.mainnet.sui.io:443',
          ]
          ADDRESSES = {
              'liquidator_a': '0x26266b1381bcf03ab3acc37c1e87beffb52d49f345248bc3efb9114176990ae4',
              'liquidator_b': '0xb05747d4b5af0ba8cfeacbbf8fc8ab0c37d13b2244c9d9622befbd1e70872fc6',
              'liquidation_admin': '0x19f528ccf2c1ff204b61f9958517c26fcf0950a6034a20f8c342cc142fb0f5f5',
              'config_last_updater': '0x938884d43de2bcf13a2f8f5886ea6382994ba49dcf7b3d08203acdd508778b6b',
          }
          CONFIG_TX = 'coWCfh9dNo1sA9yRj6Jo3GGcpjY6kxTC9srAuEpcguW'

          def post(endpoint, method, params, retries=5):
              payload = json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(
                          endpoint,
                          data=payload,
                          method='POST',
                          headers={'Content-Type':'application/json','User-Agent':'bucket-liquidator-domain/1'},
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode())
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return body.get('result')
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** n)
              raise RuntimeError(f'{method} failed: {last}')

          def call(method, params):
              failures = []
              for endpoint in ENDPOINTS:
                  try:
                      return {'endpoint':endpoint,'result':post(endpoint,method,params)}
                  except Exception as exc:
                      failures.append({'endpoint':endpoint,'error':type(exc).__name__,'message':str(exc)})
              return {'failures':failures}

          def dump(name, value):
              (RAW / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          collected = {}
          for label, address in ADDRESSES.items():
              balances = call('suix_getAllBalances', [address])
              owned = call('suix_getOwnedObjects', [
                  address,
                  {'options': {
                      'showType': True,
                      'showOwner': True,
                      'showPreviousTransaction': True,
                      'showContent': True,
                      'showDisplay': False,
                  }},
                  None,
                  50,
              ])
              sent = call('suix_queryTransactionBlocks', [
                  {'filter': {'FromAddress': address}, 'options': {
                      'showInput': True,
                      'showRawInput': False,
                      'showEffects': True,
                      'showEvents': True,
                      'showObjectChanges': True,
                      'showBalanceChanges': True,
                  }},
                  None,
                  50,
                  True,
              ])
              collected[label] = {
                  'address': address,
                  'balances': balances,
                  'owned_objects': owned,
                  'sent_transactions': sent,
              }
              dump(f'{label}.json', collected[label])

          config_tx = call('sui_getTransactionBlock', [CONFIG_TX, {
              'showInput': True,
              'showRawInput': False,
              'showEffects': True,
              'showEvents': True,
              'showObjectChanges': True,
              'showBalanceChanges': True,
          }])
          dump('config_last_update_tx.json', config_tx)

          def result(wrapper):
              return wrapper.get('result') if isinstance(wrapper, dict) else None

          def move_calls(tx):
              calls = []
              try:
                  commands = tx['transaction']['data']['transaction']['transactions']
              except Exception:
                  return calls
              for command in commands or []:
                  mc = command.get('MoveCall') if isinstance(command, dict) else None
                  if mc:
                      calls.append({
                          'package': mc.get('package'),
                          'module': mc.get('module'),
                          'function': mc.get('function'),
                          'type_arguments': mc.get('type_arguments'),
                      })
              return calls

          def summarize(label, data):
              balances = result(data['balances']) or []
              owned_result = result(data['owned_objects']) or {}
              owned = owned_result.get('data', []) if isinstance(owned_result, dict) else []
              sent_result = result(data['sent_transactions']) or {}
              txs = sent_result.get('data', []) if isinstance(sent_result, dict) else []
              owned_types = []
              for row in owned:
                  item = row.get('data') or {}
                  type_ = item.get('type')
                  if type_:
                      owned_types.append(type_)
              call_rows = []
              sponsors = []
              gas_owners = []
              for tx in txs:
                  call_rows.extend(move_calls(tx))
                  transaction = tx.get('transaction') or {}
                  data0 = transaction.get('data') or {}
                  gas = data0.get('gasData') or {}
                  owner = gas.get('owner')
                  if owner:
                      gas_owners.append(owner)
                  sponsor = data0.get('sender')
                  if sponsor:
                      sponsors.append(sponsor)
              return {
                  'label': label,
                  'address': data['address'],
                  'balance_coin_types': sorted({x.get('coinType') for x in balances if isinstance(x, dict) and x.get('coinType')}),
                  'owned_object_count_returned': len(owned),
                  'owned_types': sorted(set(owned_types)),
                  'sent_tx_count_returned': len(txs),
                  'unique_gas_owners': sorted(set(gas_owners)),
                  'unique_senders': sorted(set(sponsors)),
                  'move_calls': call_rows,
                  'has_more_sent_transactions': bool(sent_result.get('hasNextPage')) if isinstance(sent_result, dict) else None,
              }

          summaries = {label:summarize(label,data) for label,data in collected.items()}
          liquidator_calls = []
          for label in ('liquidator_a','liquidator_b'):
              liquidator_calls.extend(summaries[label]['move_calls'])
          bucket_calls = [x for x in liquidator_calls if str(x.get('package','')).lower() in {
              '0xbe1457c92f8e8c39e85fa4f77bfcd8cfbda30d1861286ba64c76a94773138b5d',
              '0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e',
              '0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26',
          }]
          gas_owner_sets = {
              label: set(value['unique_gas_owners'])
              for label, value in summaries.items()
          }
          overlaps = {}
          labels = list(gas_owner_sets)
          for i, left in enumerate(labels):
              for right in labels[i+1:]:
                  overlaps[f'{left}__{right}'] = sorted(gas_owner_sets[left] & gas_owner_sets[right])

          summary = {
              'network': 'sui-mainnet',
              'addresses': ADDRESSES,
              'address_summaries': summaries,
              'liquidator_bucket_move_calls': bucket_calls,
              'gas_owner_overlaps': overlaps,
              'config_update_transaction': config_tx,
              'writes': 0,
              'transactions_constructed': 0,
              'generated_unix': int(time.time()),
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'addresses': ADDRESSES,
              'sent_tx_counts': {k:v['sent_tx_count_returned'] for k,v in summaries.items()},
              'owned_types': {k:v['owned_types'] for k,v in summaries.items()},
              'gas_owner_overlaps': overlaps,
              'liquidator_bucket_move_calls': bucket_calls,
              'writes': 0,
          }, indent=2))
          PY
          python3 bucket-liquidator-domain/probe.py | tee bucket-liquidator-domain/run.log
          find bucket-liquidator-domain -type f -print0 | sort -z | xargs -0 sha256sum > bucket-liquidator-domain/SHA256SUMS.txt

      - name: Verify read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-liquidator-domain && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-liquidator-domain/SUMMARY.json'))
          assert s['writes'] == 0
          assert s['transactions_constructed'] == 0
          print('BUCKET_LIQUIDATOR_DOMAIN_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-liquidator-trust-domain
          path: bucket-liquidator-domain
          if-no-files-found: error
          retention-days: 7
