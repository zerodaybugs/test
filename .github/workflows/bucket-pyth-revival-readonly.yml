name: Bucket Scoped Source Snapshot R4

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact current scoped source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-scoped-source-r4
          mkdir -p bucket-scoped-source-r4
          git clone --filter=blob:none --no-checkout https://github.com/hackenproof-public/bucket-protocol.git bucket-scoped-source-r4/repo
          cd bucket-scoped-source-r4/repo
          git checkout main
          git rev-parse HEAD | tee ../HEAD.txt
          git log -20 --date=iso-strict --pretty='format:%H%x09%ad%x09%s' > ../RECENT_COMMITS.tsv
          git status --porcelain=v1 > ../WORKTREE_STATUS.txt
          git ls-tree -r --name-only HEAD | sort > ../FILE_TREE.txt
          git ls-files -z | sort -z | xargs -0 sha256sum > ../SOURCE_SHA256SUMS.txt
          git bundle create ../SOURCE.bundle --all
          cd ..
          python3 - <<'PY'
          import json, pathlib, subprocess, time
          out=pathlib.Path('bucket-scoped-source-r4')
          head=(out/'HEAD.txt').read_text().strip()
          pinned='74b28e1912e9b134af9a36f0e0052e2bf1c79bd7'
          repo=out/'repo'
          pinned_exists=subprocess.run(['git','-C',str(repo),'cat-file','-e',pinned+'^{commit}']).returncode == 0
          diff=[]
          if pinned_exists:
              text=subprocess.check_output(['git','-C',str(repo),'diff','--name-status',pinned+'..'+head],text=True)
              diff=[line.split('\t') for line in text.splitlines() if line.strip()]
          summary={
              'target':'https://github.com/hackenproof-public/bucket-protocol',
              'branch':'main',
              'head':head,
              'prior_pinned_revision':pinned,
              'prior_pinned_revision_present':pinned_exists,
              'changed_paths_since_prior_pin':diff,
              'changed_path_count':len(diff),
              'writes_to_chain':0,
              'transactions_constructed':0,
              'generated_unix':int(time.time()),
          }
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          rm -rf repo/.git/objects/pack/*.keep || true
          find . -maxdepth 2 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Validate source snapshot boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s bucket-scoped-source-r4/HEAD.txt
          test -s bucket-scoped-source-r4/SOURCE.bundle
          test ! -s bucket-scoped-source-r4/WORKTREE_STATUS.txt
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-scoped-source-r4/SUMMARY.json'))
          assert s['writes_to_chain'] == 0
          assert s['transactions_constructed'] == 0
          print('BUCKET_SCOPED_SOURCE_R4_PASS')
          PY

      - name: Upload scoped source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bucket-scoped-source-r4
          path: bucket-scoped-source-r4
          if-no-files-found: error
          retention-days: 7
