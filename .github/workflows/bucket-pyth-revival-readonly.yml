name: Bucket Credit ACL Domain Census

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Query live AccessControl objects by defining type
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-credit-acl-census
          mkdir -p bucket-credit-acl-census
          cat > bucket-credit-acl-census/query.py <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-credit-acl-census')
          ENDPOINT = 'https://graphql.mainnet.sui.io/graphql'
          TYPES = {
              'cdp_credit_acl': '0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26::vault::AccessControl',
              'psm_credit_acl': '0x5a77b4e1c6f108047c9c75c3abfddb89cabdea1c1dc7291d7a47f60007259c34::pool::AccessControl',
          }

          QUERY = '''
          query LiveObjects($filter: ObjectFilter!, $first: Int, $after: String) {
            objects(filter: $filter, first: $first, after: $after) {
              pageInfo { hasNextPage endCursor }
              nodes {
                address
                version
                digest
                owner {
                  __typename
                  ... on AddressOwner { address { address } }
                  ... on ObjectOwner { address { address } }
                }
                previousTransaction { digest sender { address } }
                asMoveObject { contents { type { repr } json bcs } }
              }
            }
          }
          '''

          def post(variables, retries=5):
              payload = json.dumps({'query': QUERY, 'variables': variables}).encode()
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          ENDPOINT,
                          data=payload,
                          method='POST',
                          headers={'Content-Type': 'application/json', 'User-Agent': 'bucket-credit-acl-census/1'},
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode())
                      if body.get('errors'):
                          raise RuntimeError(json.dumps(body['errors']))
                      return body['data']['objects']
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f'GraphQL failed: {last}')

          results = {}
          summary = {}
          for label, type_name in TYPES.items():
              nodes = []
              cursor = None
              while True:
                  page = post({'filter': {'type': type_name}, 'first': 50, 'after': cursor})
                  nodes.extend(page['nodes'])
                  if not page['pageInfo']['hasNextPage']:
                      break
                  cursor = page['pageInfo']['endCursor']
              results[label] = nodes
              parsed = []
              for node in nodes:
                  contents = ((node.get('asMoveObject') or {}).get('contents') or {})
                  value = contents.get('json') or {}
                  managers = value.get('managers') or {}
                  if isinstance(managers, dict):
                      managers = managers.get('contents', [])
                  parsed.append({
                      'object_id': node.get('address'),
                      'version': node.get('version'),
                      'owner': node.get('owner'),
                      'previous_transaction': node.get('previousTransaction'),
                      'type': ((contents.get('type') or {}).get('repr')),
                      'managers': managers or [],
                  })
              manager_sets = [sorted(str(x).lower() for x in row['managers']) for row in parsed]
              summary[label] = {
                  'type': type_name,
                  'object_count': len(parsed),
                  'objects': parsed,
                  'distinct_manager_sets': sorted({tuple(x) for x in manager_sets}),
              }

          evidence = {
              'captured_unix': int(time.time()),
              'network': 'sui-mainnet',
              'writes': 0,
              'transactions_constructed': 0,
              'summary': summary,
          }
          (OUT / 'RAW.json').write_text(json.dumps(results, indent=2, sort_keys=True) + '\n')
          (OUT / 'SUMMARY.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps(evidence, indent=2))
          PY
          python3 bucket-credit-acl-census/query.py | tee bucket-credit-acl-census/run.log
          find bucket-credit-acl-census -type f -print0 | sort -z | xargs -0 sha256sum > bucket-credit-acl-census/SHA256SUMS.txt

      - name: Verify read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-credit-acl-census && exit 1 || true
          python3 - <<'PY'
          import json
          evidence = json.load(open('bucket-credit-acl-census/SUMMARY.json'))
          assert evidence['writes'] == 0
          assert evidence['transactions_constructed'] == 0
          print('BUCKET_CREDIT_ACL_CENSUS_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-credit-acl-domain-census
          path: bucket-credit-acl-census
          if-no-files-found: error
          retention-days: 7
