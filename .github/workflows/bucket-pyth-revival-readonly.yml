name: Bucket Live Role and Cap Census

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read-only Sui mainnet census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-live-census
          mkdir -p bucket-live-census/raw
          cat > bucket-live-census/census.py <<'PY'
          import json
          import pathlib
          import re
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-live-census')
          RAW = OUT / 'raw'
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          HEX = re.compile(r'^0x[0-9a-fA-F]{64}$')

          ENTRY = '0x03e79aa64ac007d200aefdcb445e31e24f460279bab6c73babfb031b7464072e'
          TREASURY = '0x4de1c29a89d6888ebf8f7ae20364571dce4e1e42b9c9221f7df924ad6f9e617d'
          USD_ADMIN = '0x14bdc35f9759cdba6d6a76b5cb4f56341f7421e2bc814317a53463c003020e30'
          USD_UPGRADE = '0x4035e8134f67518779278b3f3fcf9212249bde705a5f2e04005c686d7cf2f357'
          CDP_UPGRADE = '0x9e9a1e879aa062c46e0beb731a974ee9de0c242989127d4da0b1edcf37bf7526'
          CONFIG_ADMIN = '0xd1ce0affeda5aa8f3ec50ff617f27717673acd74fecaf850a7d1096f421d4131'
          KNOWN_MANAGER = '0x3b23b0a29ff0cd68144930cc409d242fdc10201ac9d9159d3c597252e8e0781e'
          CDP_ORIGINAL = '0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e'
          CDP_CALL_TARGET = '0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26'

          VAULTS = [
              '0xdb3b2f1ce99c935a5c5e14ce8321e0c252a8b16c50861407d2253d392d5fb836',
              '0x1e90eb4184e3303ee69d1728630c872b214f8699982b00dc39aabde8b4ff5ce3',
              '0x38057191f48cf748d3b018e83ec0dda9f769f3f2d98010561002d6d2378f8ec3',
              '0x13ca385797229d6ad23a3ff0981fc30971735b0efd307d02920b58730d923a14',
              '0x6677cdcc3186900914823fc8e5de7a2d1e874bbc0682cbcf7637ddf9342b1cbd',
              '0xe1c7630ef33094491ab291bed669fcc64a48a88fcc99ddc200bcc38deb00400e',
              '0xf985037e218946d20344810be7c07e42e7fae1666cdce60e7f028706768daed0',
              '0xbd0079fb337dc5c79ae8f522aab72fcda38b6f10e38f2477c075777d8b1ac263',
              '0x5d76ee14fc4b1f501653c65eb3dc2ba0cd42f7d0d11480a840322e77d4b56362',
              '0xd3ef65a1dec4b5c5f0e0bb7caf29f4a425bd04ad43bce942ec6e1c70385b79de',
              '0x9cd535e14d25767387e29798cfd61cf8c780d4836798cd64a5ce0d6fdc4659b2',
              '0xee2d62b04abd9064a5526043395e09b0481e89fa3309d428fcb271ac53ce3103',
              '0x755c54dd718d350afd03314fe6ccc71e0ab36a974caf6721f1e03b7675dfaba1',
              '0xb36fea26a681f44b9a075297ddb9ebb9d4f35210c48d133e767bb294ac6427c6',
              '0x2169f7a9f7c693265dad755bd7e75382e88cc4432595a22950432cb512bc6cd7',
              '0x83367e510389536e2041d50b3faabc2d1b1c8194ca5570a2a3a3e460d6113e86',
              '0x542eff36534bc5d7d07808953ebb8c580c23f047b41c094601d40a0fc7e99238',
              '0x1f32b8b587b69a97cb779b2df1e2aa90f6fbb43edcc887f11a8f4a6de0944937',
              '0x94f785bda085beb012e9e96d16a36cf16b6729f776e620ef8c3b37d1e06c2d82',
              '0x61c4f4e0849de36b840a5198dbe0ac5bbdedf3a514f8a66ecedd2c6f7b2fb380',
          ]

          QUERY = '''
          query Objects($keys: [ObjectKey!]!) {
            multiGetObjects(keys: $keys) {
              address
              version
              digest
              owner {
                __typename
                ... on AddressOwner { address { address } }
                ... on ObjectOwner { address { address } }
              }
              previousTransaction { digest sender { address } }
              asMoveObject { contents { type { repr } json bcs } }
              asMovePackage {
                address
                version
                linkage { originalId upgradedId version }
                typeOrigins { module struct definingId }
              }
            }
          }
          '''

          def gql(ids, retries=5):
              ids = list(dict.fromkeys(x.lower() for x in ids if isinstance(x, str) and HEX.match(x)))
              payload = json.dumps({
                  'query': QUERY,
                  'variables': {'keys': [{'address': x} for x in ids]},
              }).encode()
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          GQL,
                          data=payload,
                          method='POST',
                          headers={'Content-Type': 'application/json', 'User-Agent': 'bucket-live-census/4'},
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          body = json.loads(response.read().decode())
                      if body.get('errors'):
                          raise RuntimeError(json.dumps(body['errors']))
                      return body['data']['multiGetObjects']
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(f'GraphQL failure: {last}')

          def fetch(ids):
              ids = list(dict.fromkeys(x.lower() for x in ids if isinstance(x, str) and HEX.match(x)))
              out = []
              for start in range(0, len(ids), 35):
                  out.extend(gql(ids[start:start + 35]))
              return out

          def content(obj):
              try:
                  value = obj['asMoveObject']['contents']
                  return value['type']['repr'], value['json']
              except Exception:
                  return None, None

          def owner(obj):
              data = (obj or {}).get('owner') or {}
              return {
                  'kind': data.get('__typename'),
                  'address': ((data.get('address') or {}).get('address')),
              }

          def integer(value):
              try:
                  return int(value)
              except Exception:
                  return None

          def collect_ids(value, output):
              if isinstance(value, str) and HEX.match(value):
                  output.add(value.lower())
              elif isinstance(value, list):
                  for item in value:
                      collect_ids(item, output)
              elif isinstance(value, dict):
                  for item in value.values():
                      collect_ids(item, output)

          def find_address(value, required_terms):
              if isinstance(value, dict):
                  for key, item in value.items():
                      lowered = key.lower()
                      if all(term in lowered for term in required_terms) and isinstance(item, str) and HEX.match(item):
                          return item.lower()
                  for item in value.values():
                      found = find_address(item, required_terms)
                      if found:
                          return found
              elif isinstance(value, list):
                  for item in value:
                      found = find_address(item, required_terms)
                      if found:
                          return found
              return None

          def managers(vault_json):
              try:
                  value = vault_json['access_control']['managers']
                  entries = value.get('contents', []) if isinstance(value, dict) else value
                  return [
                      {'address': row.get('key'), 'level': integer(row.get('value'))}
                      for row in entries
                      if isinstance(row, dict)
                  ]
              except Exception:
                  return []

          def find_number(value, names):
              if isinstance(value, dict):
                  for name in names:
                      if name in value and integer(value[name]) is not None:
                          return integer(value[name])
                  for item in value.values():
                      found = find_number(item, names)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for item in value:
                      found = find_number(item, names)
                      if found is not None:
                          return found
              return None

          entry_objects = fetch([ENTRY])
          (RAW / '01_entry.json').write_text(json.dumps(entry_objects, indent=2, sort_keys=True) + '\n')
          entry_type, entry_json = content(entry_objects[0])
          sub_ids = [
              item.lower()
              for item in (entry_json or {}).get('id_vector', [])
              if isinstance(item, str) and HEX.match(item)
          ]

          subobjects = fetch(sub_ids)
          (RAW / '02_config_subobjects.json').write_text(json.dumps(subobjects, indent=2, sort_keys=True) + '\n')

          package_config = None
          object_config = None
          config_ids = set()
          for obj in subobjects:
              obj_type, obj_json = content(obj)
              collect_ids(obj_json, config_ids)
              if obj_type and obj_type.endswith('::package_config::PackageConfig'):
                  package_config = obj_json
              elif obj_type and obj_type.endswith('::object_config::ObjectConfig'):
                  object_config = obj_json

          live_cdp = find_address(package_config, ['cdp', 'package']) or find_address(package_config, ['cdp'])
          live_treasury = find_address(object_config, ['treasury']) or TREASURY

          relevant_ids = set(VAULTS) | config_ids | {
              TREASURY,
              live_treasury,
              USD_ADMIN,
              USD_UPGRADE,
              CDP_UPGRADE,
              CONFIG_ADMIN,
              CDP_ORIGINAL,
              CDP_CALL_TARGET,
          }
          if live_cdp:
              relevant_ids.add(live_cdp)

          objects = fetch(sorted(relevant_ids))
          (RAW / '03_objects.json').write_text(json.dumps(objects, indent=2, sort_keys=True) + '\n')
          by_id = {
              obj['address'].lower(): obj
              for obj in objects
              if obj and obj.get('address')
          }

          vault_rows = []
          manager_map = {}
          total_debt = 0
          total_supply = 0
          total_limits = 0
          for object_id, obj in by_id.items():
              obj_type, obj_json = content(obj)
              if not (obj_type and '::vault::Vault<' in obj_type and isinstance(obj_json, dict)):
                  continue
              limited = obj_json.get('limited_supply') or {}
              debt = integer(obj_json.get('total_debt_amount')) or 0
              supply = integer(limited.get('supply')) or 0
              limit = integer(limited.get('limit')) or 0
              assigned = managers(obj_json)
              for manager in assigned:
                  manager_map.setdefault(str(manager['address']).lower(), []).append({
                      'vault_id': object_id,
                      'vault_type': obj_type,
                      'level': manager['level'],
                      'debt_raw': debt,
                  })
              position_table = obj_json.get('position_table') or {}
              vault_rows.append({
                  'id': object_id,
                  'type': obj_type,
                  'version': obj.get('version'),
                  'security_level': obj_json.get('security_level'),
                  'managers': assigned,
                  'debt_raw': debt,
                  'collateral_raw': integer(obj_json.get('total_coll_amount')),
                  'position_count': integer(position_table.get('size')),
                  'supply_raw': supply,
                  'limit_raw': limit,
                  'headroom_raw': max(limit - supply, 0),
                  'interest_rate_raw': ((obj_json.get('interest_rate') or {}).get('value')),
                  'mcr_raw': ((obj_json.get('min_collateral_ratio') or {}).get('value')),
              })
              total_debt += debt
              total_supply += supply
              total_limits += limit
          vault_rows.sort(key=lambda row: row['debt_raw'], reverse=True)

          treasury_obj = by_id.get(live_treasury.lower()) or by_id.get(TREASURY.lower())
          treasury_type, treasury_json = content(treasury_obj)
          module_entries = []
          if isinstance(treasury_json, dict):
              module_map = treasury_json.get('module_config_map') or treasury_json.get('module_configs') or {}
              module_entries = module_map.get('contents', []) if isinstance(module_map, dict) else (module_map or [])
          cdp_module = next(
              (
                  entry
                  for entry in module_entries
                  if isinstance(entry, dict) and 'BucketV2CDP' in json.dumps(entry.get('key'))
              ),
              None,
          )
          module_supply = find_number((cdp_module or {}).get('value'), ['supply', 'current_supply'])
          module_limit = find_number((cdp_module or {}).get('value'), ['limit', 'supply_limit', 'max_supply'])

          cap_ids = [USD_ADMIN, USD_UPGRADE, CDP_UPGRADE, CONFIG_ADMIN]
          cap_owners = {cap_id: owner(by_id.get(cap_id.lower())) for cap_id in cap_ids}

          summary = {
              'captured_unix': int(time.time()),
              'network': 'sui-mainnet',
              'writes': 0,
              'transactions_constructed': 0,
              'entry_config': {'id': ENTRY, 'type': entry_type, 'subobject_ids': sub_ids},
              'live_config': {
                  'cdp_package_id': live_cdp,
                  'treasury_id': live_treasury,
                  'package_config': package_config,
                  'object_config': object_config,
              },
              'vault_totals': {
                  'vault_count': len(vault_rows),
                  'debt_raw': total_debt,
                  'sum_supply_raw': total_supply,
                  'sum_limits_raw': total_limits,
                  'sum_headroom_raw': total_limits - total_supply,
              },
              'vaults': vault_rows,
              'manager_assignments': manager_map,
              'known_manager': KNOWN_MANAGER,
              'treasury': {
                  'type': treasury_type,
                  'module_config_count': len(module_entries),
                  'cdp_module_config': cdp_module,
                  'supply_raw': module_supply,
                  'limit_raw': module_limit,
                  'headroom_raw': None if module_supply is None or module_limit is None else module_limit - module_supply,
              },
              'cap_owners': cap_owners,
          }
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'live_cdp_package_id': live_cdp,
              'vault_totals': summary['vault_totals'],
              'known_manager_assignments': manager_map.get(KNOWN_MANAGER.lower(), []),
              'treasury': summary['treasury'],
              'cap_owners': cap_owners,
          }, indent=2))
          PY

          python3 bucket-live-census/census.py | tee bucket-live-census/run.log
          find bucket-live-census -type f -print0 | sort -z | xargs -0 sha256sum > bucket-live-census/SHA256SUMS.txt

      - name: Verify read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-live-census && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-live-census/SUMMARY.json'))
          assert summary['writes'] == 0
          assert summary['transactions_constructed'] == 0
          assert summary['entry_config']['subobject_ids']
          assert summary['vault_totals']['vault_count'] > 0
          print('BUCKET_LIVE_CENSUS_READ_ONLY_PASS')
          PY

      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-live-role-cap-census-v3
          path: bucket-live-census
          if-no-files-found: error
          retention-days: 7
