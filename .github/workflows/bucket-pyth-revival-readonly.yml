name: Bucket Oracle Topology and Source Audit R4

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enumerate live aggregators, configured sources, source bytecode, and recent call chains
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-oracle-audit-r4
          mkdir -p bucket-oracle-audit-r4/{raw,asm,analysis}
          cat > bucket-oracle-audit-r4/audit.py <<'PY'
          import json
          import pathlib
          import re
          import time
          import urllib.request

          OUT=pathlib.Path('bucket-oracle-audit-r4')
          RAW=OUT/'raw'
          ASM=OUT/'asm'
          ANALYSIS=OUT/'analysis'
          GQL='https://graphql.mainnet.sui.io/graphql'
          RPCS=['https://sui-mainnet-endpoint.blockvision.org','https://fullnode.mainnet.sui.io:443']
          ORACLE='0xf2ab9aa60c5e879675351a1a89f47131de9dea7cc927327dd0e7282e295c7f5e'
          AGG_TYPE=ORACLE+'::aggregator::PriceAggregator'

          def post(url,payload,retries=5,timeout=150):
              data=json.dumps(payload).encode(); last=None
              for n in range(retries):
                  try:
                      req=urllib.request.Request(url,data=data,method='POST',headers={'Content-Type':'application/json','User-Agent':'bucket-oracle-audit-r4/1'})
                      with urllib.request.urlopen(req,timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last=exc; time.sleep(2**n)
              raise RuntimeError(f'POST failure {url}: {last}')

          def gql(query,variables=None):
              body=post(GQL,{'query':query,'variables':variables or {}})
              if body.get('errors'): raise RuntimeError(json.dumps(body['errors']))
              return body

          def rpc(method,params):
              failures=[]
              for endpoint in RPCS:
                  try:
                      body=post(endpoint,{'jsonrpc':'2.0','id':1,'method':method,'params':params},timeout=100)
                      if body.get('error'): raise RuntimeError(json.dumps(body['error']))
                      return {'endpoint':endpoint,'result':body.get('result')}
                  except Exception as exc:
                      failures.append({'endpoint':endpoint,'error':type(exc).__name__,'message':str(exc)})
              return {'failures':failures}

          def dump(path,value): path.write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')

          q_objects='''query O($type:String!,$after:String){objects(first:50,after:$after,filter:{type:$type}){pageInfo{hasNextPage endCursor}nodes{address version digest owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}}previousTransaction{digest sender{address}}asMoveObject{hasPublicTransfer contents{type{repr}json bcs}}}}}'''
          aggregators=[]; after=None
          while True:
              body=gql(q_objects,{'type':AGG_TYPE,'after':after})
              conn=body['data']['objects']; aggregators.extend(conn.get('nodes') or [])
              page=conn.get('pageInfo') or {}
              if not page.get('hasNextPage'): break
              after=page.get('endCursor')
          dump(RAW/'aggregators.json',aggregators)

          source_types=[]; aggregator_rows=[]
          for row in aggregators:
              contents=((row.get('asMoveObject') or {}).get('contents') or {})
              data=contents.get('json') or {}
              weights=(data.get('weights') or {}).get('contents',[])
              parsed=[]
              for item in weights:
                  key=item.get('key') if isinstance(item,dict) else None
                  val=item.get('value') if isinstance(item,dict) else None
                  if isinstance(key,dict):
                      key=key.get('name') or key.get('value') or key.get('bytes') or str(key)
                  if key:
                      key=str(key)
                      source_types.append(key)
                      parsed.append({'source_type':key,'weight':val})
              aggregator_rows.append({
                  'id':row.get('address'),
                  'version':row.get('version'),
                  'owner':row.get('owner'),
                  'coin_type':(contents.get('type') or {}).get('repr'),
                  'weight_threshold':data.get('weight_threshold'),
                  'outlier_tolerance':data.get('outlier_tolerance'),
                  'weights':parsed,
                  'previous_transaction':row.get('previousTransaction'),
              })
          source_types=sorted(set(source_types))

          hex64=re.compile(r'(?:0x)?([0-9a-fA-F]{64})::')
          source_packages={}
          for source in source_types:
              m=hex64.search(source)
              if m:
                  source_packages.setdefault('0x'+m.group(1).lower(),[]).append(source)

          q_pkg='''query P($address:SuiAddress!){object(address:$address){address version digest previousTransaction{digest sender{address}}asMovePackage{address version linkage{originalId upgradedId version}typeOrigins{module struct definingId}modules{nodes{name fileFormatVersion disassembly functions(first:50){nodes{name visibility isEntry parameters{repr}return{repr}typeParameters{constraints}}}structs(first:50){nodes{name abilities fields{name type{repr}}typeParameters{constraints}}}}}}}}'''
          package_rows={}; public_functions=[]; suspicious_functions=[]
          terms=re.compile(r'price|oracle|pyth|supra|switchboard|stale|timestamp|clock|confidence|deviation|feed|update|extract|convert|decimal|expo|aggregate|collect',re.I)
          for pkg,sources in source_packages.items():
              try:
                  response=gql(q_pkg,{'address':pkg})
                  dump(RAW/f'package_{pkg[2:]}.json',response)
                  obj=response['data']['object']; package=obj.get('asMovePackage')
                  if not package:
                      package_rows[pkg]={'sources':sources,'error':'not a Move package'}; continue
                  package_rows[pkg]={
                      'sources':sources,'version':package.get('version'),'digest':obj.get('digest'),
                      'previous_transaction':obj.get('previousTransaction'),'linkage':package.get('linkage'),
                      'type_origins':package.get('typeOrigins'),
                  }
                  target=ASM/pkg[2:]; target.mkdir(parents=True,exist_ok=True)
                  for module in package['modules']['nodes']:
                      name=module['name']; dis=module.get('disassembly') or ''
                      (target/f'{name}.asm').write_text(dis)
                      for fn in (module.get('functions') or {}).get('nodes',[]):
                          item={
                              'package':pkg,'module':name,'name':fn.get('name'),'visibility':fn.get('visibility'),
                              'is_entry':fn.get('isEntry'),'parameters':[x.get('repr') for x in fn.get('parameters',[])],
                              'returns':[x.get('repr') for x in fn.get('return',[])],
                          }
                          if str(fn.get('visibility')).upper()=='PUBLIC' or fn.get('isEntry'):
                              public_functions.append(item)
                              if terms.search(json.dumps(item)):
                                  suspicious_functions.append(item)
              except Exception as exc:
                  package_rows[pkg]={'sources':sources,'error':type(exc).__name__,'message':str(exc)}

          activity={}; call_rows=[]
          for agg in aggregator_rows:
              oid=agg['id']
              wrapper=rpc('suix_queryTransactionBlocks',[{
                  'filter':{'InputObject':oid},
                  'options':{'showInput':True,'showRawInput':False,'showEffects':True,'showEvents':True,'showObjectChanges':True,'showBalanceChanges':True},
              },None,50,True])
              activity[oid]=wrapper
              result=wrapper.get('result') if isinstance(wrapper,dict) else None
              txs=(result or {}).get('data',[]) if isinstance(result,dict) else []
              for tx in txs:
                  try: commands=tx['transaction']['data']['transaction']['transactions']
                  except Exception: commands=[]
                  for index,command in enumerate(commands or []):
                      mc=command.get('MoveCall') if isinstance(command,dict) else None
                      if mc:
                          call_rows.append({
                              'aggregator':oid,'digest':tx.get('digest'),'command_index':index,
                              'sender':((tx.get('transaction') or {}).get('data') or {}).get('sender'),
                              'status':((tx.get('effects') or {}).get('status')),
                              'package':mc.get('package'),'module':mc.get('module'),'function':mc.get('function'),
                              'type_arguments':mc.get('type_arguments'),
                          })
          dump(RAW/'activity.json',activity)
          dump(ANALYSIS/'aggregator_rows.json',aggregator_rows)
          dump(ANALYSIS/'source_packages.json',package_rows)
          dump(ANALYSIS/'public_functions.json',public_functions)
          dump(ANALYSIS/'suspicious_functions.json',suspicious_functions)
          dump(ANALYSIS/'recent_move_calls.json',call_rows)

          unweighted=[]
          for agg in aggregator_rows:
              for w in agg['weights']:
                  try: val=int(w['weight'])
                  except Exception: val=None
                  if val is not None and val<=0: unweighted.append({'aggregator':agg['id'],**w})
          summary={
              'network':'sui-mainnet','oracle_package':ORACLE,
              'aggregator_count':len(aggregator_rows),'aggregators':aggregator_rows,
              'source_type_count':len(source_types),'source_types':source_types,
              'source_package_count':len(source_packages),'source_packages':package_rows,
              'public_source_function_count':len(public_functions),
              'suspicious_source_functions':suspicious_functions,
              'recent_move_call_count':len(call_rows),'recent_move_calls':call_rows,
              'nonpositive_configured_weights':unweighted,
              'writes':0,'transactions_constructed':0,'generated_unix':int(time.time()),
          }
          dump(OUT/'SUMMARY.json',summary)
          print(json.dumps({
              'aggregator_count':summary['aggregator_count'],
              'source_types':source_types,
              'source_packages':package_rows,
              'suspicious_source_functions':suspicious_functions,
              'recent_move_call_count':len(call_rows),
          },indent=2))
          PY
          python3 bucket-oracle-audit-r4/audit.py | tee bucket-oracle-audit-r4/run.log
          find bucket-oracle-audit-r4 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-oracle-audit-r4/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-oracle-audit-r4 && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-oracle-audit-r4/SUMMARY.json'))
          assert s['writes']==0 and s['transactions_constructed']==0
          assert s['aggregator_count']>0
          print('BUCKET_ORACLE_AUDIT_R4_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-oracle-audit-r4
          path: bucket-oracle-audit-r4
          if-no-files-found: error
          retention-days: 7
