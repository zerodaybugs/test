name: Bucket Legacy Replay Tooling Discovery R6

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download official Sui mainnet release and capture replay/fork help
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-sui-tooling-r6
          mkdir -p bucket-sui-tooling-r6/bin
          curl -fsSL https://api.github.com/repos/MystenLabs/sui/releases/latest -o bucket-sui-tooling-r6/release.json
          jq -r '.tag_name' bucket-sui-tooling-r6/release.json | tee bucket-sui-tooling-r6/TAG.txt
          jq -r '.assets[] | [.name,.browser_download_url] | @tsv' bucket-sui-tooling-r6/release.json | tee bucket-sui-tooling-r6/ASSETS.tsv
          url=$(jq -r '.assets[] | select(.name | test("ubuntu.*x86_64|linux.*x86_64";"i")) | .browser_download_url' bucket-sui-tooling-r6/release.json | head -n1)
          if [ -z "$url" ]; then
            url=$(jq -r '.assets[] | select(.name | test("ubuntu|linux";"i")) | .browser_download_url' bucket-sui-tooling-r6/release.json | head -n1)
          fi
          test -n "$url"
          echo "$url" > bucket-sui-tooling-r6/SELECTED_URL.txt
          curl -fL "$url" -o bucket-sui-tooling-r6/release_asset
          file bucket-sui-tooling-r6/release_asset | tee bucket-sui-tooling-r6/FILE.txt
          if file bucket-sui-tooling-r6/release_asset | grep -qi 'zip'; then
            unzip -q bucket-sui-tooling-r6/release_asset -d bucket-sui-tooling-r6/bin
          else
            tar -xf bucket-sui-tooling-r6/release_asset -C bucket-sui-tooling-r6/bin
          fi
          find bucket-sui-tooling-r6/bin -maxdepth 4 -type f -printf '%p\n' | sort | tee bucket-sui-tooling-r6/FILES.txt
          SUI=$(find bucket-sui-tooling-r6/bin -type f -name sui | head -n1)
          test -n "$SUI"
          chmod +x "$SUI"
          "$SUI" --version | tee bucket-sui-tooling-r6/SUI_VERSION.txt
          "$SUI" replay --help > bucket-sui-tooling-r6/SUI_REPLAY_HELP.txt 2>&1 || true
          "$SUI" replay transaction --help > bucket-sui-tooling-r6/SUI_REPLAY_TRANSACTION_HELP.txt 2>&1 || true
          "$SUI" client --help > bucket-sui-tooling-r6/SUI_CLIENT_HELP.txt 2>&1 || true
          FORK=$(find bucket-sui-tooling-r6/bin -type f -name 'sui-fork*' | head -n1 || true)
          if [ -n "$FORK" ]; then
            chmod +x "$FORK"
            "$FORK" --help > bucket-sui-tooling-r6/SUI_FORK_HELP.txt 2>&1 || true
          else
            echo 'sui-fork binary not present in selected release asset' > bucket-sui-tooling-r6/SUI_FORK_HELP.txt
          fi
          sha256sum bucket-sui-tooling-r6/release_asset > bucket-sui-tooling-r6/RELEASE_ASSET.sha256
          find bucket-sui-tooling-r6 -type f ! -path '*/bin/*' -print0 | sort -z | xargs -0 sha256sum > bucket-sui-tooling-r6/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-sui-tooling-r6
          path: bucket-sui-tooling-r6
          if-no-files-found: error
          retention-days: 7
