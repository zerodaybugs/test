name: Bucket Live Debtor Receiver Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debtor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch debtor packages and derive receiver-witness call graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-debtor-audit
          mkdir -p bucket-debtor-audit/{raw,asm,analysis}
          cat > bucket-debtor-audit/audit.py <<'PY'
          import json
          import pathlib
          import re
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-debtor-audit')
          RAW = OUT / 'raw'
          ASM = OUT / 'asm'
          ANALYSIS = OUT / 'analysis'
          GQL = 'https://graphql.mainnet.sui.io/graphql'
          RPCS = [
              'https://sui-mainnet-endpoint.blockvision.org',
              'https://fullnode.mainnet.sui.io:443',
          ]
          PACKAGES = {
              'delegation_farm': '0xd95810493736139876e9f1fe0cd1de12639a6d6abe7c92c86d7d4f9ada96adce',
              'navi_farm': '0x22955b7a13502d3b20383a6904abadad683456128141d9ff6820260c7020f0cb',
          }
          ENTITY_NAMES = {
              'delegation_farm': 'DelegationEntity',
              'navi_farm': 'NaviFarmEntity',
          }

          def post(url, payload, retries=5, timeout=120):
              data = json.dumps(payload).encode()
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          data=data,
                          method='POST',
                          headers={'Content-Type':'application/json','User-Agent':'bucket-debtor-audit/2'},
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** n)
              raise RuntimeError(f'POST failure: {last}')

          def gql(query, variables=None):
              body = post(GQL, {'query':query,'variables':variables or {}})
              if body.get('errors'):
                  raise RuntimeError(json.dumps(body['errors']))
              return body

          def rpc(method, params):
              failures = []
              for endpoint in RPCS:
                  try:
                      body = post(endpoint, {'jsonrpc':'2.0','id':1,'method':method,'params':params}, timeout=90)
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return {'endpoint':endpoint,'result':body.get('result')}
                  except Exception as exc:
                      failures.append({'endpoint':endpoint,'error':type(exc).__name__,'message':str(exc)})
              return {'failures':failures}

          def dump(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          def functions(disassembly):
              lines = disassembly.splitlines()
              starts = []
              pattern = re.compile(r'^(entry\s+)?(public(?:\([^)]*\))?\s+)?(?:fun\s+)?([^\s<(]+)(?:<[^>]*>)?\(')
              for index, line in enumerate(lines):
                  match = pattern.match(line)
                  if match and not line.startswith(('B', 'L')):
                      starts.append((index, match.group(3), line))
              result = []
              for pos, (start, name, signature) in enumerate(starts):
                  end = starts[pos + 1][0] if pos + 1 < len(starts) else len(lines)
                  result.append({'name':name,'signature':signature,'body':'\n'.join(lines[start:end]).rstrip()+'\n'})
              return result

          package_rows = {}
          entity_structs = []
          candidate_functions = []
          receive_functions = []
          constructor_functions = []

          query = '''query P($address:SuiAddress!){object(address:$address){address version digest previousTransaction{digest sender{address}}asMovePackage{address version linkage{originalId upgradedId version}typeOrigins{module struct definingId}modules{nodes{name fileFormatVersion disassembly functions(first:50){nodes{name visibility isEntry parameters{repr}return{repr}}}structs(first:50){nodes{name abilities fields{name type{repr}}}}}}}}}'''

          for label, package_id in PACKAGES.items():
              response = gql(query, {'address':package_id})
              dump(RAW / f'{label}.package.json', response)
              package = response['data']['object']['asMovePackage']
              package_rows[label] = {
                  'package_id':package_id,
                  'version':package.get('version'),
                  'linkage':package.get('linkage'),
                  'type_origins':package.get('typeOrigins'),
                  'previous_transaction':response['data']['object'].get('previousTransaction'),
              }
              entity_name = ENTITY_NAMES[label]
              for module in package['modules']['nodes']:
                  module_name = module['name']
                  disassembly = module.get('disassembly') or ''
                  (ASM / f'{label}__{module_name}.asm').write_text(disassembly)
                  metas = {x['name']:x for x in (module.get('functions') or {}).get('nodes', [])}
                  structs = {x['name']:x for x in (module.get('structs') or {}).get('nodes', [])}
                  if entity_name in structs:
                      entity_structs.append({'package_label':label,'module':module_name,**structs[entity_name]})
                  for fn in functions(disassembly):
                      meta = metas.get(fn['name'], {})
                      row = {
                          'package_label':label,
                          'package_id':package_id,
                          'module':module_name,
                          'name':fn['name'],
                          'signature':fn['signature'],
                          'visibility':meta.get('visibility'),
                          'is_entry':meta.get('isEntry'),
                          'parameters':[x.get('repr') for x in meta.get('parameters', [])],
                          'returns':[x.get('repr') for x in meta.get('return', [])],
                          'body':fn['body'],
                      }
                      text = fn['signature'] + '\n' + fn['body']
                      if entity_name in text or any(term in text for term in ('sheet::receive','sheet::pay','Loan<','Request<','vault::loan','request_repayment','collect_repayment')):
                          candidate_functions.append(row)
                      if 'sheet::receive' in text or 'Loan<' in fn['signature']:
                          receive_functions.append(row)
                      if entity_name in text and 'Pack[' in fn['body']:
                          constructor_functions.append(row)

              dump(RAW / f'{label}.normalized.json', rpc('sui_getNormalizedMoveModulesByPackage', [package_id]))
              object_query = '''query O($type:String!){objects(first:50,filter:{type:$type}){pageInfo{hasNextPage endCursor}nodes{address version digest owner{__typename ... on AddressOwner{address{address}} ... on ObjectOwner{address{address}}}previousTransaction{digest sender{address}}asMoveObject{hasPublicTransfer contents{type{repr}json bcs}}}}}'''
              try:
                  live_objects = gql(object_query, {'type':package_id})
              except Exception as exc:
                  live_objects = {'error':type(exc).__name__,'message':str(exc)}
              dump(RAW / f'{label}.live_objects.json', live_objects)

          def stripped(rows):
              return [{k:v for k,v in row.items() if k != 'body'} for row in rows]

          dump(ANALYSIS / 'entity_structs.json', entity_structs)
          dump(ANALYSIS / 'candidate_functions.json', candidate_functions)
          dump(ANALYSIS / 'receive_functions.json', receive_functions)
          dump(ANALYSIS / 'constructor_functions.json', constructor_functions)

          public_receivers = [row for row in receive_functions if str(row.get('visibility')).upper() == 'PUBLIC' or row.get('is_entry')]
          public_constructors = [row for row in constructor_functions if str(row.get('visibility')).upper() == 'PUBLIC' or row.get('is_entry')]
          summary = {
              'network':'sui-mainnet',
              'packages':package_rows,
              'entity_structs':entity_structs,
              'candidate_function_count':len(candidate_functions),
              'receive_function_count':len(receive_functions),
              'constructor_function_count':len(constructor_functions),
              'public_or_entry_receive_functions':stripped(public_receivers),
              'public_or_entry_entity_constructors':stripped(public_constructors),
              'writes':0,
              'transactions_constructed':0,
              'generated_unix':int(time.time()),
          }
          dump(OUT / 'SUMMARY.json', summary)
          print(json.dumps(summary, indent=2))
          PY
          python3 bucket-debtor-audit/audit.py | tee bucket-debtor-audit/run.log
          find bucket-debtor-audit -type f -print0 | sort -z | xargs -0 sha256sum > bucket-debtor-audit/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-debtor-audit && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-debtor-audit/SUMMARY.json'))
          assert s['writes'] == 0
          assert s['transactions_constructed'] == 0
          assert len(s['entity_structs']) == 2
          print('BUCKET_DEBTOR_RECEIVER_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-live-debtor-receiver-audit-v2
          path: bucket-debtor-audit
          if-no-files-found: error
          retention-days: 7
