name: Bucket R16-R22 Final Aggregator

on:
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
    paths:
      - '.github/workflows/bucket-r16-r22-final-aggregator.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bucket-pyth-revival-gate-20260809
          fetch-depth: 0

      - name: Download R22 and publish final bounded decision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: agent/bucket-pyth-revival-gate-20260809
        shell: bash
        run: |
          set -euo pipefail
          rm -rf analysis-results/bucket-r16-r22-final
          mkdir -p analysis-results/bucket-r16-r22-final/evidence
          cat > /tmp/bucket-r22-final.py <<'PY'
          import hashlib,io,json,os,pathlib,time,urllib.parse,urllib.request,zipfile
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']; branch=os.environ['GH_BRANCH']
          out=pathlib.Path('analysis-results/bucket-r16-r22-final'); evidence=out/'evidence'; date='2026-08-10'
          previous_path=pathlib.Path('analysis-results/bucket-r16-r21-final/FINAL_STATUS.json')
          previous=json.loads(previous_path.read_text()) if previous_path.exists() else {}
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'bucket-r22-final/1'}
          def read(url,accept=None):
              h=dict(headers)
              if accept:h['Accept']=accept
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=180) as response:return response.read()
          query=urllib.parse.urlencode({'branch':branch,'status':'completed','per_page':30})
          runs=json.loads(read(f'https://api.github.com/repos/{repo}/actions/workflows/bucket-pyth-psm-coin-rebind-fallback-r22.yml/runs?{query}').decode()).get('workflow_runs') or []
          run=next((row for row in runs if row.get('conclusion')=='success'),None)
          r22={}; artifact=None; member=None; error=None
          try:
              if not run:raise RuntimeError('no successful R22 run')
              artifacts=json.loads(read(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100').decode()).get('artifacts') or []
              artifact=next((row for row in artifacts if row.get('name')=='bucket-pyth-psm-coin-rebind-r22' and not row.get('expired')),None)
              if not artifact:raise RuntimeError('R22 artifact missing')
              raw=read(f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact["id"]}/zip','application/octet-stream')
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  candidates=[name for name in archive.namelist() if name=='SUMMARY.json' or name.endswith('/SUMMARY.json')]
                  if not candidates:raise RuntimeError('SUMMARY missing')
                  member=sorted(candidates,key=lambda value:(value.count('/'),len(value)))[0]
                  r22=json.loads(archive.read(member).decode())
          except Exception as exc:error=f'{type(exc).__name__}: {exc}'
          (evidence/'R22_SUMMARY.json').write_text(json.dumps(r22,indent=2,sort_keys=True)+'\n')
          if previous_path.exists():(evidence/'R16_R21_FINAL_STATUS.json').write_bytes(previous_path.read_bytes())
          gates=r22.get('gates') or {}
          r22_exploit=bool(r22.get('exploitConfirmed')) and bool(r22.get('economicImpactProven')) and int(gates.get('repeatablePositiveCandidateCount') or 0)>0
          safe=False
          if r22_exploit:
              verdict='REAL_PYTH_PSM_ECONOMIC_MECHANISM_NOT_MATERIAL_SCOPE_OR_DUPLICATE_READY'
              strongest='PYTH_PRICEINFO_PSM_COIN_REBIND_HOLD'
              next_gate='LIVE_USD_MATERIALITY_SCOPE_AND_DUPLICATE'
          else:
              verdict=previous.get('verdict') or 'NO_NEW_SUBMIT_READY_HIGH_OR_CRITICAL'
              strongest=previous.get('strongestCandidate') or 'NONE'
              next_gate='NEW_ROOT_CAUSE_REQUIRED' if verdict=='NO_NEW_SUBMIT_READY_HIGH_OR_CRITICAL' else previous.get('requiredNextGate') or 'NEW_ROOT_CAUSE_REQUIRED'
          final={
              'schema':'bucket-r16-r22-final/v1','date':date,'repository':repo,'branch':branch,
              'verdict':verdict,'safeToSubmitNow':safe,'strongestCandidate':strongest,'requiredNextGate':next_gate,
              'previousDecision':{k:previous.get(k) for k in ('verdict','safeToSubmitNow','strongestCandidate','requiredNextGate','strictGates','candidateStatus')},
              'r22':{
                  'run':None if not run else {'id':run.get('id'),'status':run.get('status'),'conclusion':run.get('conclusion'),'headSha':run.get('head_sha'),'htmlUrl':run.get('html_url')},
                  'artifact':None if not artifact else {'id':artifact.get('id'),'name':artifact.get('name'),'digest':artifact.get('digest'),'size':artifact.get('size_in_bytes')},
                  'summaryMember':member,'error':error,'relevant':r22.get('relevant'),'r19ExactCandidateCount':r22.get('r19ExactCandidateCount',0),
                  'gates':gates,'promotedCandidates':r22.get('promotedCandidates') or [],
                  'exploitConfirmed':bool(r22.get('exploitConfirmed')),'economicImpactProven':bool(r22.get('economicImpactProven')),
                  'materialHighOrCriticalImpactProven':bool(r22.get('materialHighOrCriticalImpactProven')),
                  'scopeAndDuplicatePassed':bool(r22.get('scopeAndDuplicatePassed')),'submissionReady':bool(r22.get('submissionReady')),
              },
              'integrity':{'productionTransactionsSubmitted':0,'privateKeysUsed':0,'severityInflationAllowed':False,'readOnlyEvidence':True},
              'generatedUnix':int(time.time()),
          }
          (out/'FINAL_STATUS.json').write_text(json.dumps(final,indent=2,sort_keys=True)+'\n')
          compact={k:final[k] for k in ('verdict','safeToSubmitNow','strongestCandidate','requiredNextGate','r22','integrity')}
          (out/'FINAL_COMPACT.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          lines=['# Bucket Protocol — R16–R22 final decision','',f'**Date:** {date}',f'**Verdict:** `{verdict}`',f'**Safe to submit now:** `false`',f'**Strongest candidate:** `{strongest}`',f'**Required next gate:** `{next_gate}`','',
                 '## R22 spent-coin-independent fallback','',f'- Relevant to the surviving Pyth branch: **{bool(r22.get("relevant"))}**',f'- R19 exact candidates: **{r22.get("r19ExactCandidateCount",0)}**',f'- Coin rebind used: **{bool(gates.get("anyCoinRebindUsed"))}**',f'- Canonical baseline success: **{bool(gates.get("anyBaselineSuccess"))}**',f'- Wrong-feed control pass: **{bool(gates.get("wrongFeedControlPass"))}**',f'- Controlled positive cases: **{int(gates.get("positiveControlledCaseCount") or 0)}**',f'- Repeatable positive candidates: **{int(gates.get("repeatablePositiveCandidateCount") or 0)}**',f'- Maximum observed advantage: **{gates.get("maxAdvantageBps") or 0} bps**','',
                 '## Release decision','',
                 'No report is eligible for submission. Even a functioning mechanism remains HOLD until material High/Critical impact, current program scope and duplicate clearance are proven.' if r22_exploit else 'The coin-rebind fallback did not promote the surviving branch to a controlled, repeatable economic exploit. No High/Critical report is justified.','',
                 '## Integrity','', '- Production transactions submitted: **0**','- Private keys used: **0**','- All chain interaction was read-only or simulation-only.','']
          (out/'FINAL_REPORT_HU.md').write_text('\n'.join(lines))
          def sha(path):
              h=hashlib.sha256();
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          manifest=[]
          for path in sorted(out.rglob('*')):
              if path.is_file() and path.name!='MANIFEST.json':manifest.append({'path':str(path.relative_to(out)),'size':path.stat().st_size,'sha256':sha(path)})
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          zip_name=f'BUCKET_PROTOCOL_R16_R22_RESEARCH_EVIDENCE_NOT_FOR_SUBMISSION_{date}.zip'; zip_path=out/zip_name
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in sorted(out.rglob('*')):
                  if path.is_file() and path!=zip_path and not path.name.endswith('.sha256'):archive.write(path,path.relative_to(out))
          with zipfile.ZipFile(zip_path) as archive:
              bad=archive.testzip()
              if bad:raise RuntimeError(bad)
          (out/(zip_name+'.sha256')).write_text(f'{sha(zip_path)}  {zip_name}\n')
          pointer={'safeToSubmitNow':False,'verdict':verdict,'strongestCandidate':strongest,'requiredNextGate':next_gate,'zip':zip_name,'sha256':zip_name+'.sha256','report':'FINAL_REPORT_HU.md','status':'FINAL_STATUS.json'}
          (out/'RELEASE_POINTER.json').write_text(json.dumps(pointer,indent=2,sort_keys=True)+'\n')
          print(json.dumps(pointer,indent=2,sort_keys=True))
          PY
          python3 /tmp/bucket-r22-final.py

      - name: Commit final R22 decision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bucket-evidence-bot'
          git config user.email 'bucket-evidence-bot@users.noreply.github.com'
          git add -f analysis-results/bucket-r16-r22-final
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: publish Bucket R16-R22 final decision'
          git push origin HEAD:agent/bucket-pyth-revival-gate-20260809
