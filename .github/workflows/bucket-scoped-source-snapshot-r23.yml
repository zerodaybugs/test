name: Bucket Exact Scoped Source Snapshot R23

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/bucket-pyth-revival-gate-20260809]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Clone exact in-scope revision and collect relevant source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-scoped-source-r23
          mkdir -p bucket-scoped-source-r23/{source,metadata}
          git clone --no-checkout https://github.com/hackenproof-public/bucket-protocol.git bucket-scoped-source-r23/repo
          git -C bucket-scoped-source-r23/repo checkout 74b28e1912e9b134af9a36f0e0052e2bf1c79bd7
          git -C bucket-scoped-source-r23/repo rev-parse HEAD | tee bucket-scoped-source-r23/metadata/HEAD.txt
          git -C bucket-scoped-source-r23/repo status --porcelain=v1 | tee bucket-scoped-source-r23/metadata/WORKTREE_STATUS.txt
          git -C bucket-scoped-source-r23/repo ls-tree -r --name-only HEAD | sort > bucket-scoped-source-r23/metadata/FILE_TREE.txt
          git -C bucket-scoped-source-r23/repo log -1 --date=iso-strict --pretty=fuller > bucket-scoped-source-r23/metadata/COMMIT.txt

          cd bucket-scoped-source-r23/repo
          grep -RIl --include='*.move' -E 'borrow_protocol_cap|return_protocol_cap|request_with_account|public fun withdraw|public fun claim|bucket_account' . \
            | sed 's#^./##' | sort | tee ../metadata/RELEVANT_FILES.txt
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "../source/$(dirname "$path")"
            cp "$path" "../source/$path"
          done < ../metadata/RELEVANT_FILES.txt
          git ls-files -z | sort -z | xargs -0 sha256sum > ../metadata/SCOPED_SOURCE_SHA256SUMS.txt
          cd ..
          rm -rf repo
          find source metadata -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Validate exact source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat bucket-scoped-source-r23/metadata/HEAD.txt)" = "74b28e1912e9b134af9a36f0e0052e2bf1c79bd7"
          test ! -s bucket-scoped-source-r23/metadata/WORKTREE_STATUS.txt
          grep -Rq 'borrow_protocol_cap' bucket-scoped-source-r23/source
          grep -Rq 'request_with_account' bucket-scoped-source-r23/source
          grep -Rq 'public fun withdraw' bucket-scoped-source-r23/source
          echo BUCKET_SCOPED_SOURCE_R23_PASS

      - name: Upload exact source evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-scoped-source-r23
          path: bucket-scoped-source-r23
          if-no-files-found: error
          retention-days: 7
