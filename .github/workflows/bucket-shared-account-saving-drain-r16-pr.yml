name: Bucket Shared Account Saving Drain Exact Gate R16 PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact probe and install official Mysten SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-shared-account-saving-drain-r16
          mkdir -p bucket-shared-account-saving-drain-r16/raw
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/bucket-shared-account-saving-drain-r16.yml').read_text()
          start_marker = "cat > bucket-shared-account-saving-drain-r16/probe.mjs <<'JS'\n"
          end_marker = "\n          JS\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          decoded = []
          for line in lines:
              decoded.append(line[10:] if line.startswith('          ') else line)
          Path('bucket-shared-account-saving-drain-r16/probe.mjs').write_text('\n'.join(decoded) + '\n')
          PY
          cd bucket-shared-account-saving-drain-r16
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-audit --no-fund @mysten/sui@2.23.2
          npm list @mysten/sui | tee SDK_VERSION.txt

      - name: Run borrowed-Account vs fresh-EOA control matrix
        shell: bash
        run: |
          set -euo pipefail
          cd bucket-shared-account-saving-drain-r16
          node probe.mjs | tee run.log
          find . -type f ! -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Validate read-only boundary and exact controls
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' \
            bucket-shared-account-saving-drain-r16/probe.mjs \
            bucket-shared-account-saving-drain-r16/SUMMARY.json && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-shared-account-saving-drain-r16/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['productionTransactionsSubmitted'] == 0
          assert summary['gates']['freshEoaControlRejected'] is True
          assert summary['gates']['wrongKeyControlRejected'] is True
          print('BUCKET_SHARED_ACCOUNT_SAVING_DRAIN_R16_READ_ONLY_CONTROL_PASS')
          print('EXPLOIT_CONFIRMED=', summary['gates']['exploitConfirmed'])
          print('CHECKED_EXPLOIT_CONFIRMED=', summary['gates']['checkedExploitConfirmed'])
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-shared-account-saving-drain-r16
          path: |
            bucket-shared-account-saving-drain-r16/SUMMARY.json
            bucket-shared-account-saving-drain-r16/SDK_VERSION.txt
            bucket-shared-account-saving-drain-r16/probe.mjs
            bucket-shared-account-saving-drain-r16/run.log
            bucket-shared-account-saving-drain-r16/SHA256SUMS.txt
            bucket-shared-account-saving-drain-r16/raw
          if-no-files-found: error
          retention-days: 7
