name: Bucket Shared Account Saving Drain Stack Matrix R16B

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Extract parameterized probe and install official Mysten SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-shared-account-saving-drain-r16b
          mkdir -p bucket-shared-account-saving-drain-r16b/{current,legacy}
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/bucket-shared-account-saving-drain-r16.yml').read_text()
          start_marker = "cat > bucket-shared-account-saving-drain-r16/probe.mjs <<'JS'\n"
          end_marker = "\n          JS\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          text = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          origin_account = '0x665188033384920a5bb5dcfb2ef21f54b4568d08b431718b97e02e5c184b92cc'
          text = text.replace(
              f"const ACCOUNT_PACKAGE = '{origin_account}';",
              f"const ACCOUNT_PACKAGE = process.env.ACCOUNT_FUNCTION_PACKAGE || '{origin_account}';",
          )
          text = text.replace(
              "const ACCOUNT_TYPE = `${ACCOUNT_PACKAGE}::account::Account`;",
              f"const ACCOUNT_TYPE = process.env.ACCOUNT_TYPE || '{origin_account}::account::Account';",
          )
          text = text.replace(
              "const SAVING = '0x5b60c3cdbb9ee31b856f7f8a6d4d6c8b91e3c0036a138fb9927529b05fd00373';",
              "const SAVING = process.env.SAVING_PACKAGE || '0x5b60c3cdbb9ee31b856f7f8a6d4d6c8b91e3c0036a138fb9927529b05fd00373';",
          )
          text = text.replace(
              "const INCENTIVE = '0xd419027a4b92b1916c62c08da27520576bcf34d0a8c40884491dca2f5d992719';",
              "const INCENTIVE = process.env.INCENTIVE_PACKAGE || '0xd419027a4b92b1916c62c08da27520576bcf34d0a8c40884491dca2f5d992719';",
          )
          text = text.replace(
              "schema: 'bucket-shared-account-saving-drain-exact-r16/v1',",
              "schema: `bucket-shared-account-saving-drain-stack-r16b/${process.env.STACK_LABEL || 'unknown'}/v1`,\n            stack: { label: process.env.STACK_LABEL || null, accountFunctionPackage: ACCOUNT_PACKAGE, accountType: ACCOUNT_TYPE, savingPackage: SAVING, incentivePackage: INCENTIVE },",
          )
          for name in ('current', 'legacy'):
              directory = Path('bucket-shared-account-saving-drain-r16b') / name
              (directory / 'raw').mkdir(parents=True, exist_ok=True)
              (directory / 'probe.mjs').write_text(text)
          PY
          cd bucket-shared-account-saving-drain-r16b
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-audit --no-fund @mysten/sui@2.23.2
          npm list @mysten/sui | tee SDK_VERSION.txt

      - name: Run corrected current stack
        shell: bash
        run: |
          set -euo pipefail
          cd bucket-shared-account-saving-drain-r16b/current
          STACK_LABEL=current \
          ACCOUNT_FUNCTION_PACKAGE=0xe2d49d67ff42dc500275f2d84841bf35632aa6c1abdb70af66a10e1de93a4400 \
          SAVING_PACKAGE=0x5b60c3cdbb9ee31b856f7f8a6d4d6c8b91e3c0036a138fb9927529b05fd00373 \
          INCENTIVE_PACKAGE=0xd419027a4b92b1916c62c08da27520576bcf34d0a8c40884491dca2f5d992719 \
          node probe.mjs | tee run.log

      - name: Run live-object-compatible legacy stack
        shell: bash
        run: |
          set -euo pipefail
          cd bucket-shared-account-saving-drain-r16b/legacy
          STACK_LABEL=legacy \
          ACCOUNT_FUNCTION_PACKAGE=0xe2d49d67ff42dc500275f2d84841bf35632aa6c1abdb70af66a10e1de93a4400 \
          SAVING_PACKAGE=0x872d08a70db3db498aa7853276acea8091fdd9871b2d86bc8dcb8524526df622 \
          INCENTIVE_PACKAGE=0x39692320d6fc01c27315a7972ed4717e4fd32eed43531ad6f55fd7f24b74e207 \
          node probe.mjs | tee run.log

      - name: Build strict cross-stack verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('bucket-shared-account-saving-drain-r16b')
          rows = []
          for label in ('current', 'legacy'):
              path = root / label / 'SUMMARY.json'
              data = json.loads(path.read_text())
              rows.append({
                  'label': label,
                  'stack': data.get('stack'),
                  'positions': data.get('positions'),
                  'totalLivePositionRaw': data.get('totalLivePositionRaw'),
                  'gates': data.get('gates'),
                  'severityAssessment': data.get('severityAssessment'),
                  'cases': data.get('cases'),
              })
          confirmed = [row for row in rows if row['gates']['exploitConfirmed']]
          checked = [row for row in rows if row['gates']['checkedExploitConfirmed']]
          verdict = {
              'schema': 'bucket-shared-account-saving-drain-stack-matrix-r16b/v1',
              'network': 'sui-mainnet',
              'readOnly': True,
              'stacks': rows,
              'confirmedStacks': [row['label'] for row in confirmed],
              'checkedConfirmedStacks': [row['label'] for row in checked],
              'exploitConfirmed': bool(confirmed),
              'checkedExploitConfirmed': bool(checked),
              'productionTransactionsSubmitted': 0,
          }
          (root / 'SUMMARY.json').write_text(json.dumps(verdict, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'confirmedStacks': verdict['confirmedStacks'],
              'checkedConfirmedStacks': verdict['checkedConfirmedStacks'],
              'exploitConfirmed': verdict['exploitConfirmed'],
              'checkedExploitConfirmed': verdict['checkedExploitConfirmed'],
              'stackGates': {row['label']: row['gates'] for row in rows},
              'caseResults': {
                  row['label']: [
                      {
                          'label': case['label'],
                          'checked': case['checked'],
                          'success': case['success'],
                          'attackerUsdbDeltaRaw': case['attackerUsdbDeltaRaw'],
                          'errorMessage': case['errorMessage'],
                          'abortCode': case['abortCode'],
                      }
                      for case in row['cases']
                  ]
                  for row in rows
              },
          }, indent=2))
          PY
          find bucket-shared-account-saving-drain-r16b -type f ! -path '*/node_modules/*' -print0 | sort -z | xargs -0 sha256sum > bucket-shared-account-saving-drain-r16b/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|signAndExecute|private.?key|mnemonic' \
            bucket-shared-account-saving-drain-r16b/current/probe.mjs \
            bucket-shared-account-saving-drain-r16b/legacy/probe.mjs \
            bucket-shared-account-saving-drain-r16b/SUMMARY.json && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-shared-account-saving-drain-r16b/SUMMARY.json'))
          assert summary['readOnly'] is True
          assert summary['productionTransactionsSubmitted'] == 0
          print('BUCKET_SHARED_ACCOUNT_SAVING_DRAIN_R16B_READ_ONLY_PASS')
          print('EXPLOIT_CONFIRMED=', summary['exploitConfirmed'])
          print('CHECKED_EXPLOIT_CONFIRMED=', summary['checkedExploitConfirmed'])
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-shared-account-saving-drain-r16b
          path: |
            bucket-shared-account-saving-drain-r16b/SUMMARY.json
            bucket-shared-account-saving-drain-r16b/SHA256SUMS.txt
            bucket-shared-account-saving-drain-r16b/SDK_VERSION.txt
            bucket-shared-account-saving-drain-r16b/current/SUMMARY.json
            bucket-shared-account-saving-drain-r16b/current/probe.mjs
            bucket-shared-account-saving-drain-r16b/current/run.log
            bucket-shared-account-saving-drain-r16b/current/raw
            bucket-shared-account-saving-drain-r16b/legacy/SUMMARY.json
            bucket-shared-account-saving-drain-r16b/legacy/probe.mjs
            bucket-shared-account-saving-drain-r16b/legacy/run.log
            bucket-shared-account-saving-drain-r16b/legacy/raw
          if-no-files-found: error
          retention-days: 7
