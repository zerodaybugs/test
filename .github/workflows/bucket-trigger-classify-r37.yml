name: Bucket Post-Baseline Transaction Classifier R37

on:
  push:
    branches: [agent/bucket-trigger-scan-r37-20260812]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact Move calls and publication/config signals
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-trigger-classify-r37
          mkdir -p bucket-trigger-classify-r37/raw
          cat > bucket-trigger-classify-r37/classify.py <<'PY'
          import json, pathlib, time, urllib.request

          OUT=pathlib.Path('bucket-trigger-classify-r37'); RAW=OUT/'raw'
          RPCS=['https://sui-mainnet-endpoint.blockvision.org','https://fullnode.mainnet.sui.io:443']
          DIGESTS=[
            '4r7Xew3UPxNEMbsvdNEc6E3oX3QToBj15Mnbq2x53nSC',
            '6UNvvzByeDs689awXmdpbq7ufRg9TRhbmtcYGbPDKi4P',
            'Gp6RAGJo8887WmyzGCGbdRp6obpoZ22cup8W8X3ENpE6',
            'CsKa71HezLS3HeGNobKZuofu3VWtR8y4c6ZKpGXamf4c',
            '27GgEVPJo16obWAZnAkSZQrePZCfe1LDYztUxAQ9R8d8',
            '81D7Bp8Mew3cRBjrRGUum7JC4VDXfZV2YQo6dzp1W5fb',
            'BQkQRrZqfm15vWZNzrUJtfazjAmC6BJoKmpCT94DURsY',
            'BwfCZJFruGYz29rLFUMKFUeDRADR4nCNcNmk1LULtKp1',
            'EaJs8zt2vmCyWMjNzA8234H51EX3SsM1Shst2cWBoUif',
            '9V8WnbhEaXCy9LxcJyJvYdgTAT3DnXUkDtaCXeUsUWxP',
          ]
          BUCKET_PACKAGES={
            '0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e',
            '0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26',
            '0xe14726c336e81b32328e92afc37345d159f5b550b09fa92bd43640cfdd0a0cfd',
            '0x8cc2eed1b1012881a623e9bafd58ff0f17a8c5f807662631e623acf7779a78ee',
            '0x872d08a70db3db498aa7853276acea8091fdd9871b2d86bc8dcb8524526df622',
            '0x39692320d6fc01c27315a7972ed4717e4fd32eed43531ad6f55fd7f24b74e207',
            '0xc2ae6693383e4a81285136effc8190c7baaf0e75aafa36d1c69cd2170cfc3803',
            '0xf2ab9aa60c5e879675351a1a89f47131de9dea7cc927327dd0e7282e295c7f5e',
            '0x5bc4f912b59c5cfcc86dfc90419837b9c3f9d3a3a94cef7a198838fa196bac4a',
            '0x1906a868f05cec861532d92aa49059580caf72d900ba2c387d5135b6a9727f52',
          }
          CONFIG_WORDS=('set_','add_','remove_','update_config','upgrade','migrate','register','create_vault','new_vault','set_security','set_role','set_limit','set_rate','set_rule')

          def post(url,payload,retries=4):
            data=json.dumps(payload).encode(); last=None
            for n in range(retries):
              try:
                req=urllib.request.Request(url,data=data,method='POST',headers={'Content-Type':'application/json','User-Agent':'bucket-trigger-classify-r37/1'})
                with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read().decode())
              except Exception as e:
                last=e; time.sleep(2**n)
            raise RuntimeError(f'{url}: {last}')

          def rpc(method,params):
            errors=[]
            for ep in RPCS:
              try:
                body=post(ep,{'jsonrpc':'2.0','id':1,'method':method,'params':params})
                if body.get('error'): raise RuntimeError(json.dumps(body['error']))
                return {'endpoint':ep,'result':body.get('result')}
              except Exception as e: errors.append({'endpoint':ep,'error':str(e)})
            return {'failures':errors}

          rows=[]; raw={}
          for digest in DIGESTS:
            wrapper=rpc('sui_getTransactionBlock',[digest,{
              'showInput':True,'showRawInput':False,'showEffects':True,
              'showEvents':True,'showObjectChanges':True,'showBalanceChanges':True,
            }])
            raw[digest]=wrapper
            tx=wrapper.get('result') if isinstance(wrapper,dict) else None
            if not isinstance(tx,dict):
              rows.append({'digest':digest,'fetchFailed':True,'wrapper':wrapper}); continue
            txdata=((tx.get('transaction') or {}).get('data') or {})
            commands=((txdata.get('transaction') or {}).get('transactions') or [])
            calls=[]
            for index,command in enumerate(commands):
              call=command.get('MoveCall') if isinstance(command,dict) else None
              if not call: continue
              package=str(call.get('package') or '').lower()
              function=str(call.get('function') or '')
              item={
                'index':index,'package':package,'module':call.get('module'),
                'function':function,'typeArguments':call.get('type_arguments'),
                'bucketPackage':package in BUCKET_PACKAGES,
                'configShaped':any(word in function.lower() for word in CONFIG_WORDS),
              }
              calls.append(item)
            changes=tx.get('objectChanges') or []
            published=[{
              'packageId':change.get('packageId'),'modules':change.get('modules')
            } for change in changes if change.get('type')=='published']
            bucket_calls=[call for call in calls if call['bucketPackage']]
            config_calls=[call for call in calls if call['configShaped']]
            rows.append({
              'digest':digest,'timestampMs':tx.get('timestampMs'),'sender':txdata.get('sender'),
              'status':(tx.get('effects') or {}).get('status'),'calls':calls,
              'bucketCalls':bucket_calls,'configShapedCalls':config_calls,
              'publishedPackages':published,'publishedPackageCount':len(published),
            })

          published_total=sum(row.get('publishedPackageCount',0) for row in rows)
          bucket_config_calls=[]
          for row in rows:
            for call in row.get('bucketCalls') or []:
              if call.get('configShaped'):
                bucket_config_calls.append({'digest':row['digest'],**call})
          summary={
            'schema':'bucket-post-baseline-transaction-classifier-r37/v1',
            'network':'sui-mainnet','transactionCount':len(rows),'rows':rows,
            'publishedPackageCount':published_total,
            'bucketConfigShapedCallCount':len(bucket_config_calls),
            'bucketConfigShapedCalls':bucket_config_calls,
            'deploymentOrConfigTrigger':bool(published_total or bucket_config_calls),
            'writes':0,'transactionsConstructed':0,'generatedUnix':int(time.time()),
          }
          (RAW/'transactions.json').write_text(json.dumps(raw,indent=2,sort_keys=True)+'\n')
          (OUT/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
            'publishedPackageCount':published_total,
            'bucketConfigShapedCallCount':len(bucket_config_calls),
            'bucketConfigShapedCalls':bucket_config_calls,
            'deploymentOrConfigTrigger':summary['deploymentOrConfigTrigger'],
            'transactions':[{
              'digest':row.get('digest'),'status':row.get('status'),
              'bucketCalls':[(c['module'],c['function']) for c in row.get('bucketCalls') or []],
              'publishedPackageCount':row.get('publishedPackageCount',0),
            } for row in rows],
          },indent=2))
          PY
          python3 bucket-trigger-classify-r37/classify.py | tee bucket-trigger-classify-r37/run.log
          find bucket-trigger-classify-r37 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-trigger-classify-r37/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-trigger-classify-r37 && exit 1 || true
          python3 - <<'PY'
          import json
          s=json.load(open('bucket-trigger-classify-r37/SUMMARY.json'))
          assert s['writes']==0 and s['transactionsConstructed']==0
          assert s['transactionCount']==10
          print('BUCKET_TRIGGER_CLASSIFY_R37_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-trigger-classify-r37
          path: bucket-trigger-classify-r37
          if-no-files-found: error
          retention-days: 3
