name: Bucket Deployment Delta Trigger Scan R37

on:
  push:
    branches: [agent/bucket-trigger-scan-r37-20260812]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compare current Sui deployment metadata with validated August 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bucket-trigger-scan-r37
          mkdir -p bucket-trigger-scan-r37/raw
          cat > bucket-trigger-scan-r37/scan.py <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import time
          import urllib.request

          OUT = pathlib.Path('bucket-trigger-scan-r37')
          RAW = OUT / 'raw'
          RPCS = [
              'https://fullnode.mainnet.sui.io:443',
              'https://sui-mainnet-endpoint.blockvision.org',
          ]
          BASELINE_UNIX_MS = 1786270404000
          ENTRY = '0x03e79aa64ac007d200aefdcb445e31e24f460279bab6c73babfb031b7464072e'
          BASELINE_ENTRY = {
              'version': '869774190',
              'digest': '29vJxmUhv4yoMSUcRrkBQ5JaZqEL33e7C47BH2oRYkyz',
              'id_vector': [
                  '0x929c394fd2e140e157d7d618a4f7ecdbaab0928ac454ec57654ef6cb62c78338',
                  '0xcb6a035cb6621626eab35d60b10f6c49a2638ab6ac13fc9836d79c6c58cdbd51',
                  '0xdcf2054cdce3258e0f808ed2456b84cda0a57ac77b16c7e97fbf218d1adb4a6f',
                  '0x654251ce3f37a0ec1895b8052cef32dfbf88a5f592c6be7891726a6b0f82f0c8',
                  '0x7db45f918fe2bc8efbb5b544b955aec93df4cc4432b7fc21232e4d563fb4d916',
                  '0x5a73da42eb064695ba15854aa62b4a0368430eab83995ac3ca238ca713402ff9',
                  '0x152805bfb0b6d9b1cefd4a51e42c6c8220c3cc7a4f2659c0a19ae39421cde50b',
                  '0x7f8ec209420823c1eab1a47e18e5fb425d19203185956d10ed8c78af97111236',
              ],
          }
          KNOWN_PACKAGES = {
              'onchain_config': '0x1906a868f05cec861532d92aa49059580caf72d900ba2c387d5135b6a9727f52',
              'cdp_origin': '0x9f835c21d21f8ce519fec17d679cd38243ef2643ad879e7048ba77374be4036e',
              'cdp_current_202603': '0xc1dd29778f3fccd19a4ac79d1c35a14bf9d65a0b48f1c5bba98a949cacc53e26',
              'oracle_core': '0xf2ab9aa60c5e879675351a1a89f47131de9dea7cc927327dd0e7282e295c7f5e',
              'pyth_rule_current': '0x5bc4f912b59c5cfcc86dfc90419837b9c3f9d3a3a94cef7a198838fa196bac4a',
          }
          HEX64 = re.compile(r'^0x[0-9a-fA-F]{64}$')

          def post(url, payload, retries=6, timeout=120):
              data = json.dumps(payload).encode()
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          data=data,
                          method='POST',
                          headers={
                              'Content-Type': 'application/json',
                              'User-Agent': 'bucket-trigger-scan-r37/1',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** n)
              raise RuntimeError(f'POST failed for {url}: {last}')

          def rpc(method, params):
              failures = []
              for endpoint in RPCS:
                  try:
                      body = post(endpoint, {
                          'jsonrpc': '2.0',
                          'id': 1,
                          'method': method,
                          'params': params,
                      })
                      if body.get('error'):
                          raise RuntimeError(json.dumps(body['error']))
                      return {'endpoint': endpoint, 'result': body.get('result')}
                  except Exception as exc:
                      failures.append({'endpoint': endpoint, 'error': str(exc)})
              return {'failures': failures}

          def result(wrapper):
              return wrapper.get('result') if isinstance(wrapper, dict) else None

          def dump(name, value):
              (RAW / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')

          def get_object(object_id):
              return rpc('sui_getObject', [object_id, {
                  'showType': True,
                  'showOwner': True,
                  'showPreviousTransaction': True,
                  'showDisplay': False,
                  'showContent': True,
                  'showBcs': True,
              }])

          def scalars(value):
              if isinstance(value, dict):
                  for child in value.values():
                      yield from scalars(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from scalars(child)
              else:
                  yield value

          def content_hash(data):
              content = (data or {}).get('content')
              encoded = json.dumps(content, sort_keys=True, separators=(',', ':')).encode()
              return hashlib.sha256(encoded).hexdigest()

          entry_wrapper = get_object(ENTRY)
          entry_result = result(entry_wrapper) or {}
          entry_data = entry_result.get('data') or {}
          entry_fields = ((entry_data.get('content') or {}).get('fields') or {})
          current_vector = entry_fields.get('id_vector') or []
          if isinstance(current_vector, dict):
              current_vector = current_vector.get('contents') or []
          current_vector = [str(value) for value in current_vector]

          seed_ids = set(BASELINE_ENTRY['id_vector']) | set(current_vector) | set(KNOWN_PACKAGES.values()) | {ENTRY}
          wrappers = {}
          queue = list(sorted(seed_ids))
          seen = set()
          discovered_ids = set(seed_ids)

          while queue and len(seen) < 300:
              object_id = queue.pop(0)
              if object_id in seen:
                  continue
              seen.add(object_id)
              wrapper = get_object(object_id)
              wrappers[object_id] = wrapper
              obj_result = result(wrapper) or {}
              data = obj_result.get('data') or {}
              content = data.get('content')
              for scalar in scalars(content):
                  if isinstance(scalar, str) and HEX64.fullmatch(scalar) and scalar not in discovered_ids:
                      discovered_ids.add(scalar)
                      queue.append(scalar)

          tx_cache = {}
          records = []
          changes_after_baseline = []
          for object_id, wrapper in sorted(wrappers.items()):
              obj_result = result(wrapper) or {}
              data = obj_result.get('data') or {}
              previous = data.get('previousTransaction')
              tx_timestamp = None
              if previous:
                  if previous not in tx_cache:
                      tx_cache[previous] = rpc('sui_getTransactionBlock', [previous, {
                          'showInput': False,
                          'showRawInput': False,
                          'showEffects': True,
                          'showEvents': False,
                          'showObjectChanges': True,
                          'showBalanceChanges': False,
                      }])
                  tx_result = result(tx_cache[previous]) or {}
                  raw_ts = tx_result.get('timestampMs')
                  try:
                      tx_timestamp = int(raw_ts) if raw_ts is not None else None
                  except Exception:
                      tx_timestamp = None

              record = {
                  'objectId': object_id,
                  'version': str(data.get('version')) if data.get('version') is not None else None,
                  'digest': data.get('digest'),
                  'dataType': data.get('dataType'),
                  'type': data.get('type'),
                  'owner': data.get('owner'),
                  'previousTransaction': previous,
                  'previousTransactionTimestampMs': tx_timestamp,
                  'contentSha256': content_hash(data),
                  'changedAfterBaselineTimestamp': bool(tx_timestamp and tx_timestamp > BASELINE_UNIX_MS),
              }
              records.append(record)
              if record['changedAfterBaselineTimestamp']:
                  changes_after_baseline.append(record)

          package_modules = {}
          for label, package_id in KNOWN_PACKAGES.items():
              package_modules[label] = rpc('sui_getNormalizedMoveModulesByPackage', [package_id])

          entry_changed = (
              str(entry_data.get('version')) != BASELINE_ENTRY['version']
              or entry_data.get('digest') != BASELINE_ENTRY['digest']
              or current_vector != BASELINE_ENTRY['id_vector']
          )
          new_config_ids = sorted(set(current_vector) - set(BASELINE_ENTRY['id_vector']))
          removed_config_ids = sorted(set(BASELINE_ENTRY['id_vector']) - set(current_vector))

          summary = {
              'schema': 'bucket-deployment-delta-trigger-r37/v1',
              'network': 'sui-mainnet',
              'baselineUnixMs': BASELINE_UNIX_MS,
              'entryConfig': {
                  'objectId': ENTRY,
                  'baselineVersion': BASELINE_ENTRY['version'],
                  'currentVersion': str(entry_data.get('version')) if entry_data.get('version') is not None else None,
                  'baselineDigest': BASELINE_ENTRY['digest'],
                  'currentDigest': entry_data.get('digest'),
                  'baselineIdVector': BASELINE_ENTRY['id_vector'],
                  'currentIdVector': current_vector,
                  'entryChanged': entry_changed,
                  'newConfigIds': new_config_ids,
                  'removedConfigIds': removed_config_ids,
              },
              'queriedObjectCount': len(records),
              'discoveredObjectIdCount': len(discovered_ids),
              'objectsChangedAfterBaselineTimestamp': changes_after_baseline,
              'changedAfterBaselineCount': len(changes_after_baseline),
              'knownPackageModuleQueries': package_modules,
              'trigger': bool(entry_changed or changes_after_baseline or new_config_ids or removed_config_ids),
              'triggerReasons': {
                  'entryChanged': entry_changed,
                  'changedAfterBaselineCount': len(changes_after_baseline),
                  'newConfigIdCount': len(new_config_ids),
                  'removedConfigIdCount': len(removed_config_ids),
              },
              'writes': 0,
              'transactionsConstructed': 0,
              'generatedUnix': int(time.time()),
          }
          dump('entry_object.json', entry_wrapper)
          dump('objects.json', wrappers)
          dump('transactions.json', tx_cache)
          dump('records.json', records)
          dump('package_modules.json', package_modules)
          (OUT / 'SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'entryChanged': entry_changed,
              'currentEntryVersion': summary['entryConfig']['currentVersion'],
              'currentEntryDigest': summary['entryConfig']['currentDigest'],
              'newConfigIds': new_config_ids,
              'removedConfigIds': removed_config_ids,
              'changedAfterBaselineCount': len(changes_after_baseline),
              'changedAfterBaseline': [
                  {
                      'objectId': row['objectId'],
                      'version': row['version'],
                      'type': row['type'],
                      'timestampMs': row['previousTransactionTimestampMs'],
                  }
                  for row in changes_after_baseline
              ],
              'trigger': summary['trigger'],
          }, indent=2))
          PY
          python3 bucket-trigger-scan-r37/scan.py | tee bucket-trigger-scan-r37/run.log
          find bucket-trigger-scan-r37 -type f -print0 | sort -z | xargs -0 sha256sum > bucket-trigger-scan-r37/SHA256SUMS.txt

      - name: Validate read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'executeTransaction|dryRunTransaction|devInspectTransaction|signAndExecute|private.?key|mnemonic' bucket-trigger-scan-r37 && exit 1 || true
          python3 - <<'PY'
          import json
          summary = json.load(open('bucket-trigger-scan-r37/SUMMARY.json'))
          assert summary['writes'] == 0
          assert summary['transactionsConstructed'] == 0
          assert summary['queriedObjectCount'] > 0
          print('BUCKET_TRIGGER_SCAN_R37_READ_ONLY_PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bucket-trigger-scan-r37
          path: bucket-trigger-scan-r37
          if-no-files-found: error
          retention-days: 3
