name: build-aspnetcore-components-server-v10-0-10

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/build-aspnetcore-components-server-v10-0-10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unmodified-product:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact official ASP.NET Core tag with submodules
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify source provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "2adedfc51f57ce4f0e98616fa0eb1e65283dd6af"
          printf '%s\n' "$actual" > source-commit.txt
          git -C source status --porcelain=v1 > source-status-before.txt
          test ! -s source-status-before.txt

      - name: Build exact Microsoft.AspNetCore.Components.Server product project
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/Components/Server/src/Microsoft.AspNetCore.Components.Server.csproj" \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            --verbosity minimal \
            2>&1 | tee ../build.log

      - name: Collect assemblies, provenance and reproducibility data
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact/assemblies artifact/source artifact/environment
          mapfile -d '' assemblies < <(find source/artifacts -type f -name 'Microsoft.AspNetCore.Components.Server.dll' -print0 | sort -z)
          if [[ ${#assemblies[@]} -eq 0 ]]; then
            echo 'No product assembly was produced.' >&2
            find source/artifacts -maxdepth 5 -type f | sort | tail -300 >&2 || true
            exit 1
          fi
          for file in "${assemblies[@]}"; do
            rel="${file#source/}"
            safe="${rel//\//__}"
            cp "$file" "artifact/assemblies/$safe"
            for ext in pdb xml deps.json; do
              sibling="${file%.dll}.$ext"
              if [[ -f "$sibling" ]]; then
                cp "$sibling" "artifact/assemblies/${safe%.dll}.$ext"
              fi
            done
          done
          cp source/src/Components/Server/src/Circuits/RevalidatingServerAuthenticationStateProvider.cs artifact/source/
          cp source/src/Components/Server/src/Microsoft.AspNetCore.Components.Server.csproj artifact/source/
          cp source/global.json artifact/source/
          cp source-commit.txt source-status-before.txt build.log artifact/
          source/.dotnet/dotnet --info > artifact/environment/dotnet-info.txt
          source/.dotnet/dotnet --list-sdks > artifact/environment/dotnet-sdks.txt
          source/.dotnet/dotnet --list-runtimes > artifact/environment/dotnet-runtimes.txt
          git -C source status --porcelain=v1 > artifact/source-status-after.txt
          find artifact -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Upload unmodified product build
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-components-server-v10.0.10-unmodified-build
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
