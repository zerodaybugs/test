name: Build exact Geth v1.17.5 Linux binary

"on":
  push:
    branches:
      - tmp/geth-official-url-seed-20260813
    paths:
      - ".github/workflows/build-geth-v1175-linux.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone exact public release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ethereum/go-ethereum.git geth
          cd geth
          git checkout --detach 9621c6ad10934a01b5514886fb6fbd87640b6c05
          test "$(git describe --tags --exact-match)" = "v1.17.5"
          git rev-parse HEAD | tee ../GETH_COMMIT.txt
          git status --porcelain=v1 | tee ../GETH_STATUS.txt
      - name: Set up exact module-declared Go
        uses: actions/setup-go@v6
        with:
          go-version-file: geth/go.mod
          cache: true
          cache-dependency-path: geth/go.sum
      - name: Build exact binary
        shell: bash
        run: |
          set -euxo pipefail
          cd geth
          go build -trimpath -o ../geth-v1.17.5 ./cmd/geth
          cd ..
          ./geth-v1.17.5 version | tee GETH_VERSION.txt
          sha256sum geth-v1.17.5 > GETH_BINARY_SHA256.txt
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: geth-v1.17.5-linux-x86_64-exact-build
          path: |
            geth-v1.17.5
            GETH_COMMIT.txt
            GETH_STATUS.txt
            GETH_VERSION.txt
            GETH_BINARY_SHA256.txt
          retention-days: 1
