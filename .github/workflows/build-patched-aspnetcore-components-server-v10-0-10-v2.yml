name: build-patched-aspnetcore-components-server-v10-0-10-v2

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/build-patched-aspnetcore-components-server-v10-0-10-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-patched-product:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact official ASP.NET Core tag with submodules
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify source provenance and apply minimal security patch
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "2adedfc51f57ce4f0e98616fa0eb1e65283dd6af"
          printf '%s\n' "$actual" > source-commit.txt
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('source/src/Components/Server/src/Circuits/RevalidatingServerAuthenticationStateProvider.cs')
          text = provider.read_text(encoding='utf-8')
          using_old = 'using System.Security.Claims;\n'
          using_new = 'using System.Linq;\nusing System.Security.Claims;\n'
          vulnerable = 'if (authenticationState.User.Identity?.IsAuthenticated == true)'
          fixed = 'if (authenticationState.User.Identities.Any(static identity => identity.IsAuthenticated))'
          if text.count(using_old) != 1 or text.count(vulnerable) != 1:
              raise SystemExit('unexpected source context')
          provider.write_text(
              text.replace(using_old, using_new, 1).replace(vulnerable, fixed, 1),
              encoding='utf-8', newline='\n')

          tests = Path('source/src/Components/Server/test/Circuits/RevalidatingServerAuthenticationStateProviderTest.cs')
          test_text = tests.read_text(encoding='utf-8')
          marker = '    static Task<AuthenticationState> CreateAuthenticationStateTask(string username)\n'
          lines = [
              '    [Fact]',
              '    public async Task RevalidatesWhenSecondaryIdentityIsAuthenticated()',
              '    {',
              '        using var provider = new TestRevalidatingServerAuthenticationStateProvider(',
              '            TimeSpan.FromMilliseconds(50));',
              '        provider.NextValidationResult = Task.FromResult(true);',
              '',
              '        var metadataIdentity = new ClaimsIdentity(new[] { new Claim("tenant", "tenant-a") });',
              '        var authenticatedIdentity = new ClaimsIdentity(',
              '            new[] { new Claim(ClaimTypes.Name, "test user") }, "testauth");',
              '        var principal = new ClaimsPrincipal(new[] { metadataIdentity, authenticatedIdentity });',
              '',
              '        Assert.False(principal.Identity.IsAuthenticated);',
              '        Assert.Contains(principal.Identities, identity => identity.IsAuthenticated);',
              '',
              '        provider.SetAuthenticationState(Task.FromResult(new AuthenticationState(principal)));',
              '        await provider.NextValidateAuthenticationStateAsyncCall.TimeoutAfter(TimeSpan.FromSeconds(5));',
              '',
              '        Assert.Contains(provider.RevalidationCallLog,',
              '            call => ReferenceEquals(principal, call.AuthenticationState.User));',
              '    }',
              '',
          ]
          regression = '\n'.join(lines) + '\n'
          if marker not in test_text or 'RevalidatesWhenSecondaryIdentityIsAuthenticated' in test_text:
              raise SystemExit('unexpected test insertion context')
          tests.write_text(test_text.replace(marker, regression + marker), encoding='utf-8', newline='\n')
          PY
          git -C source diff --check
          git -C source diff -- \
            src/Components/Server/src/Circuits/RevalidatingServerAuthenticationStateProvider.cs \
            src/Components/Server/test/Circuits/RevalidatingServerAuthenticationStateProviderTest.cs \
            > security-fix.patch

      - name: Build actual patched product assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/Components/Server/src/Microsoft.AspNetCore.Components.Server.csproj" \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            --verbosity minimal \
            2>&1 | tee ../product-build.log

      - name: Run complete Components.Server test project
        id: product_tests
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/Components/Server/test/Microsoft.AspNetCore.Components.Server.Tests.csproj" \
            --test \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            --verbosity minimal \
            2>&1 | tee ../components-server-tests.log

      - name: Print failing test details when present
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          for p in Path('source/artifacts/TestResults').rglob('*.html'):
              text = unescape(p.read_text(encoding='utf-8', errors='replace'))
              plain = re.sub(r'<[^>]+>', '\n', text)
              lines = [line.strip() for line in plain.splitlines() if line.strip()]
              interesting = [line for line in lines if any(k in line.lower() for k in ('fail', 'exception', 'timeout', 'revalidateswhensecondary'))]
              print(f'===== {p} =====')
              print('\n'.join(interesting[-200:]))
          PY

      - name: Collect patched assemblies, test results and provenance
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact/assemblies artifact/source artifact/test-results artifact/environment
          mapfile -d '' assemblies < <(find source/artifacts -type f -name 'Microsoft.AspNetCore.Components.Server.dll' -print0 | sort -z)
          test ${#assemblies[@]} -gt 0
          for file in "${assemblies[@]}"; do
            rel="${file#source/}"
            safe="${rel//\//__}"
            cp "$file" "artifact/assemblies/$safe"
            for ext in pdb xml deps.json; do
              sibling="${file%.dll}.$ext"
              [[ -f "$sibling" ]] && cp "$sibling" "artifact/assemblies/${safe%.dll}.$ext"
            done
          done
          [[ -d source/artifacts/TestResults ]] && cp -a source/artifacts/TestResults/. artifact/test-results/
          cp source/src/Components/Server/src/Circuits/RevalidatingServerAuthenticationStateProvider.cs artifact/source/
          cp source/src/Components/Server/test/Circuits/RevalidatingServerAuthenticationStateProviderTest.cs artifact/source/
          cp source-commit.txt security-fix.patch product-build.log artifact/
          [[ -f components-server-tests.log ]] && cp components-server-tests.log artifact/
          source/.dotnet/dotnet --info > artifact/environment/dotnet-info.txt
          source/.dotnet/dotnet --list-sdks > artifact/environment/dotnet-sdks.txt
          source/.dotnet/dotnet --list-runtimes > artifact/environment/dotnet-runtimes.txt
          git -C source status --porcelain=v1 > artifact/source-status-after.txt
          printf 'product_tests_outcome=%s\n' '${{ steps.product_tests.outcome }}' > artifact/TEST_OUTCOME.txt
          find artifact -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Upload patched product build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-components-server-v10.0.10-patched-build-and-tests-v2
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Enforce complete product test success
        if: always()
        shell: bash
        run: test '${{ steps.product_tests.outcome }}' = success
