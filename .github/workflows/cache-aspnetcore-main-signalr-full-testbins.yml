name: cache-aspnetcore-main-signalr-full-testbins

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-aspnetcore-main-signalr-full-testbins.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Exact main SignalR full test outputs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_COMMIT: 78cf766bb1069ac3d65df5ddfc78c68b453f283b
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out exact official source
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: 78cf766bb1069ac3d65df5ddfc78c68b453f283b
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify source provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$TARGET_COMMIT"
          printf '%s\n' "$actual" > source-commit.txt
          git -C source status --porcelain=v1 > source-status-before.txt
          test ! -s source-status-before.txt

      - name: Build and run exact HTTP Connections tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/common/Http.Connections/test/Microsoft.AspNetCore.Http.Connections.Tests.csproj" \
            --test \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            2>&1 | tee ../http-connections-tests.log

      - name: Build and run exact SignalR server tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj" \
            --test \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            2>&1 | tee ../signalr-server-tests.log

      - name: Package complete runnable test output directories
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p package/provenance
          test -d source/artifacts/bin/Microsoft.AspNetCore.Http.Connections.Tests
          test -d source/artifacts/bin/Microsoft.AspNetCore.SignalR.Tests
          tar -czf package/http-connections-tests-full.tar.gz \
            -C source/artifacts/bin Microsoft.AspNetCore.Http.Connections.Tests
          tar -czf package/signalr-tests-full.tar.gz \
            -C source/artifacts/bin Microsoft.AspNetCore.SignalR.Tests
          cp source-commit.txt source-status-before.txt http-connections-tests.log signalr-server-tests.log package/provenance/
          if [[ -d source/artifacts/TestResults ]]; then
            cp -a source/artifacts/TestResults package/test-results
          fi
          source/.dotnet/dotnet --info > package/provenance/dotnet-info.txt
          source/.dotnet/dotnet --list-sdks > package/provenance/dotnet-sdks.txt
          source/.dotnet/dotnet --list-runtimes > package/provenance/dotnet-runtimes.txt
          sha256sum package/http-connections-tests-full.tar.gz package/signalr-tests-full.tar.gz > package/SHA256SUMS.txt
          du -h package/*.tar.gz | sort -h > package/provenance/archive-sizes.txt

      - name: Upload complete runnable test outputs
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-main-signalr-full-testbins-78cf766b
          path: package
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
