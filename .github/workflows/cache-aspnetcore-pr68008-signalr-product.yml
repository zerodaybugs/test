name: cache-aspnetcore-pr68008-signalr-product

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-aspnetcore-pr68008-signalr-product.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Exact PR 68008 SignalR product
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_COMMIT: 3b7bacdad96fec0a86880e28e8a74afc86170f42
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out exact public PR head
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: 3b7bacdad96fec0a86880e28e8a74afc86170f42
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$TARGET_COMMIT"
          printf '%s\n' "$actual" > source-commit.txt
          git -C source status --porcelain=v1 > source-status-before.txt
          test ! -s source-status-before.txt
          sha256sum source/global.json > global-json.sha256

      - name: Build exact product assemblies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/Security/Authorization/Core/src/Microsoft.AspNetCore.Authorization.csproj" \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            2>&1 | tee ../authorization-core-product-build.log
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/Security/Authorization/Policy/src/Microsoft.AspNetCore.Authorization.Policy.csproj" \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            2>&1 | tee ../authorization-policy-product-build.log
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/common/Http.Connections/src/Microsoft.AspNetCore.Http.Connections.csproj" \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            2>&1 | tee ../http-connections-product-build.log
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/server/Core/src/Microsoft.AspNetCore.SignalR.Core.csproj" \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            2>&1 | tee ../signalr-core-product-build.log
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/server/SignalR/src/Microsoft.AspNetCore.SignalR.csproj" \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            2>&1 | tee ../signalr-server-product-build.log

      - name: Run exact focused product tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/common/Http.Connections/test/Microsoft.AspNetCore.Http.Connections.Tests.csproj" \
            --test \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            2>&1 | tee ../http-connections-tests.log
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj" \
            --test \
            --no-build-native --no-build-nodejs --no-build-java --no-build-installers \
            2>&1 | tee ../signalr-server-tests.log

      - name: Collect product binaries, source and provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact/files artifact/source artifact/provenance
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('source/artifacts')
          out = Path('artifact/files')
          prefixes = (
              'Microsoft.AspNetCore.Authorization',
              'Microsoft.AspNetCore.Connections',
              'Microsoft.AspNetCore.Http.Connections',
              'Microsoft.AspNetCore.SignalR',
          )
          suffixes = {'.dll', '.pdb', '.xml', '.json'}
          copied = 0
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              if not path.name.startswith(prefixes):
                  continue
              rel = path.relative_to(root)
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, dest)
              copied += 1
          if copied == 0:
              raise SystemExit('No product files collected')
          print(f'collected={copied}')
          PY
          cp source/src/SignalR/common/Http.Connections/src/Internal/HttpConnectionDispatcher.cs artifact/source/
          cp source/src/SignalR/common/Http.Connections/test/HttpConnectionDispatcherTests.AuthenticationRefresh.cs artifact/source/
          cp source-commit.txt source-status-before.txt global-json.sha256 artifact/provenance/
          cp source/global.json artifact/provenance/
          cp authorization-core-product-build.log authorization-policy-product-build.log artifact/provenance/
          cp http-connections-product-build.log signalr-core-product-build.log signalr-server-product-build.log artifact/provenance/
          cp http-connections-tests.log signalr-server-tests.log artifact/provenance/
          source/.dotnet/dotnet --info > artifact/provenance/dotnet-info.txt
          source/.dotnet/dotnet --list-sdks > artifact/provenance/dotnet-sdks.txt
          source/.dotnet/dotnet --list-runtimes > artifact/provenance/dotnet-runtimes.txt
          git -C source status --porcelain=v1 > artifact/provenance/source-status-after.txt
          find artifact -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Upload exact PR product evidence
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-pr68008-signalr-product-3b7bacda
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
