name: cache-aspnetcore-signalr-offline-build-seeds

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-aspnetcore-signalr-offline-build-seeds.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: ASP.NET Core ${{ matrix.version }} SignalR offline seed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 10.0.10
            tag: v10.0.10
            commit: 2adedfc51f57ce4f0e98616fa0eb1e65283dd6af
            test_project: src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj
          - version: 8.0.29
            tag: v8.0.29
            commit: 03ef277b368eb3b02122ca62f97d155845cfd5fa
            test_project: src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests.csproj

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/offline-nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out exact official ASP.NET Core tag with submodules
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: ${{ matrix.tag }}
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify source provenance
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ matrix.commit }}
        run: |
          set -Eeuo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$EXPECTED_COMMIT"
          printf '%s\n' "$actual" > source-commit.txt
          git -C source status --porcelain=v1 > source-status.txt
          test ! -s source-status.txt

      - name: Restore and build SignalR product
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/SignalR/server/Core/src/Microsoft.AspNetCore.SignalR.Core.csproj" \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            2>&1 | tee ../product-build.log

      - name: Restore and build complete SignalR server test project
        shell: bash
        env:
          TEST_PROJECT: ${{ matrix.test_project }}
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/$TEST_PROJECT" \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            2>&1 | tee ../test-project-build.log

      - name: Package and split offline seed
        shell: bash
        env:
          VERSION_LABEL: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          mkdir -p staging/provenance parts
          cp source-commit.txt source-status.txt product-build.log test-project-build.log staging/provenance/
          source/.dotnet/dotnet --info > staging/provenance/dotnet-info.txt
          source/.dotnet/dotnet --list-sdks > staging/provenance/dotnet-sdks.txt
          source/.dotnet/dotnet --list-runtimes > staging/provenance/dotnet-runtimes.txt
          printf '%s\n' "$VERSION_LABEL" > staging/provenance/framework-version.txt

          tar -czf staging/dotnet-toolchain.tar.gz -C source .dotnet .config
          tar -czf staging/nuget-packages.tar.gz -C "$NUGET_PACKAGES" .
          tar -czf staging/build-artifacts.tar.gz -C source artifacts

          sha256sum \
            staging/dotnet-toolchain.tar.gz \
            staging/nuget-packages.tar.gz \
            staging/build-artifacts.tar.gz \
            > staging/SHA256SUMS.txt
          du -h staging/*.tar.gz | sort -h | tee staging/provenance/archive-sizes.txt

          tar -cf offline-seed-bundle.tar -C staging \
            dotnet-toolchain.tar.gz \
            nuget-packages.tar.gz \
            build-artifacts.tar.gz \
            SHA256SUMS.txt \
            provenance
          sha256sum offline-seed-bundle.tar > offline-seed-bundle.tar.sha256
          split -b 240M -d -a 2 offline-seed-bundle.tar parts/offline-seed-bundle.tar.part-
          sha256sum parts/* > parts/SHA256SUMS.parts.txt
          cp offline-seed-bundle.tar.sha256 parts/
          ls -lh parts

      - name: Upload seed part 00
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-signalr-${{ matrix.version }}-offline-seed-part-00
          path: parts/offline-seed-bundle.tar.part-00
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload seed part 01
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-signalr-${{ matrix.version }}-offline-seed-part-01
          path: parts/offline-seed-bundle.tar.part-01
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Upload seed part 02
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-signalr-${{ matrix.version }}-offline-seed-part-02
          path: parts/offline-seed-bundle.tar.part-02
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Upload seed part 03
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-signalr-${{ matrix.version }}-offline-seed-part-03
          path: parts/offline-seed-bundle.tar.part-03
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Upload seed checksums and provenance
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-signalr-${{ matrix.version }}-offline-seed-provenance
          path: |
            parts/SHA256SUMS.parts.txt
            parts/offline-seed-bundle.tar.sha256
            staging/provenance
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
