name: cache-aspnetcore-source-v8-0-29

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-aspnetcore-source-v8-0-29.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch exact official ASP.NET Core source tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone \
            --depth 1 \
            --branch v8.0.29 \
            https://github.com/dotnet/aspnetcore.git aspnetcore
          git -C aspnetcore rev-parse HEAD > ASPNETCORE_COMMIT.txt
          test "$(cat ASPNETCORE_COMMIT.txt)" = "03ef277b368eb3b02122ca62f97d155845cfd5fa"
          git -C aspnetcore status --porcelain=v1 > ASPNETCORE_STATUS.txt
          test ! -s ASPNETCORE_STATUS.txt
          rm -rf aspnetcore/.git

      - name: Package source and provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          tar -czf artifact/aspnetcore-v8.0.29-source.tar.gz aspnetcore
          cp ASPNETCORE_COMMIT.txt ASPNETCORE_STATUS.txt artifact/
          sha256sum artifact/aspnetcore-v8.0.29-source.tar.gz \
            > artifact/SHA256SUMS.txt

      - name: Upload official source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-v8.0.29-source
          path: artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
