name: cache-debian-trixie-samba-ad-rootfs

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-debian-trixie-samba-ad-rootfs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build generic Debian trixie Samba AD root filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull debian:trixie-slim
          cid="$(docker create debian:trixie-slim sleep infinity)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker start "$cid"
          docker exec "$cid" bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              samba samba-dsdb-modules samba-vfs-modules \
              krb5-user ldap-utils dnsutils iproute2 procps ca-certificates
            apt-get clean
            rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          '
          mkdir -p artifact
          docker export "$cid" | zstd -T0 -19 -o artifact/debian-trixie-samba-ad-rootfs.tar.zst
          docker inspect debian:trixie-slim > artifact/base-image-inspect.json
          docker exec "$cid" bash -lc 'samba --version; samba-tool --version; ldd --version | head -1' > artifact/tool-versions.txt
          sha256sum artifact/debian-trixie-samba-ad-rootfs.tar.zst > artifact/SHA256SUMS.txt
          du -h artifact/debian-trixie-samba-ad-rootfs.tar.zst > artifact/SIZE.txt

      - name: Upload root filesystem
        uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-samba-ad-rootfs
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
