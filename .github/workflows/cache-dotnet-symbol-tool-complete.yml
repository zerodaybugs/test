name: cache-dotnet-symbol-tool-complete

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-dotnet-symbol-tool-complete.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/tool artifact
          dotnet tool install --tool-path work/tool dotnet-symbol
          work/tool/dotnet-symbol --help > artifact/help.txt
          tar -czf artifact/dotnet-symbol-tool-complete.tar.gz -C work tool
          sha256sum artifact/dotnet-symbol-tool-complete.tar.gz > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-symbol-tool-complete
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
