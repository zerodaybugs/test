name: cache-dotnet-symbol-tool

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-dotnet-symbol-tool.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact/tool artifact/packages
          dotnet tool install --tool-path artifact/tool dotnet-symbol --add-source https://api.nuget.org/v3/index.json
          dotnet nuget locals all --list > artifact/nuget-locals.txt
          artifact/tool/dotnet-symbol --help > artifact/help.txt
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-symbol-tool
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
