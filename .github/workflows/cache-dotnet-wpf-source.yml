name: cache-dotnet-wpf-source

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-dotnet-wpf-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dotnet/wpf
          ref: 1346571efc19a83a90edf3abe9059d18f8412cdb
          path: source
          submodules: recursive
          fetch-depth: 1
      - shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "1346571efc19a83a90edf3abe9059d18f8412cdb"
          test -z "$(git -C source status --porcelain=v1)"
          mkdir -p artifact
          tar --exclude=.git -czf artifact/source.tar.gz -C source .
          printf '%s\n' 1346571efc19a83a90edf3abe9059d18f8412cdb > artifact/COMMIT.txt
          sha256sum artifact/source.tar.gz > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-wpf-source-1346571e
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
