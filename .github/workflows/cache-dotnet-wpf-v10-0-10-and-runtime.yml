name: cache-dotnet-wpf-v10-0-10-and-runtime

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-dotnet-wpf-v10-0-10-and-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact WPF release source
        uses: actions/checkout@v4
        with:
          repository: dotnet/wpf
          ref: v10.0.10
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify and package exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git -C source status --porcelain=v1)"
          mkdir -p source-artifact runtime-artifact
          git -C source rev-parse HEAD > source-artifact/COMMIT.txt
          printf '%s\n' 'v10.0.10' > source-artifact/TAG.txt
          tar --exclude=.git -czf source-artifact/source.tar.gz -C source .
          sha256sum source-artifact/source.tar.gz > source-artifact/SHA256SUMS.txt

      - name: Fetch and verify official Windows Desktop Runtime 10.0.10
        shell: bash
        run: |
          set -Eeuo pipefail
          metadata='https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
          curl --fail --location --retry 5 --retry-all-errors "$metadata" -o runtime-artifact/releases.json
          python3 - <<'PY' > runtime-artifact/selected.json
          import json
          from pathlib import Path
          data=json.loads(Path('runtime-artifact/releases.json').read_text())
          hits=[]
          for release in data.get('releases',[]):
              if release.get('release-version')!='10.0.10':
                  continue
              wd=release.get('windowsdesktop',{})
              for f in wd.get('files',[]):
                  if f.get('rid')=='win-x64' and f.get('name','').endswith('.zip'):
                      hits.append({'release':release.get('release-version'),'runtime_version':wd.get('version'),'name':f['name'],'url':f['url'],'hash':f['hash']})
          if len(hits)!=1:
              raise SystemExit(f'expected one win-x64 WindowsDesktop zip, got {len(hits)}')
          print(json.dumps(hits[0],indent=2))
          PY
          url="$(python3 -c "import json;print(json.load(open('runtime-artifact/selected.json'))['url'])")"
          name="$(python3 -c "import json;print(json.load(open('runtime-artifact/selected.json'))['name'])")"
          expected="$(python3 -c "import json;print(json.load(open('runtime-artifact/selected.json'))['hash'].lower())")"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "runtime-artifact/$name"
          actual="$(sha512sum "runtime-artifact/$name" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "$name" > runtime-artifact/SHA512SUMS.txt
          unzip -t "runtime-artifact/$name" >/dev/null
          printf 'verified=true\nsource=%s\n' "$url" > runtime-artifact/VERIFICATION.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-wpf-v10.0.10-source
          path: source-artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload official Windows Desktop Runtime
        uses: actions/upload-artifact@v4
        with:
          name: windowsdesktop-runtime-10.0.10-win-x64
          path: runtime-artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
