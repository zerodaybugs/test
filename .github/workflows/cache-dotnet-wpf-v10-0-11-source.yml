name: cache-dotnet-wpf-v10-0-11-source

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-dotnet-wpf-v10-0-11-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dotnet/wpf
          ref: v10.0.11
          path: source
          submodules: recursive
          fetch-depth: 1
      - shell: bash
        run: |
          set -Eeuo pipefail
          commit="$(git -C source rev-parse HEAD)"
          test -z "$(git -C source status --porcelain=v1)"
          mkdir -p artifact
          tar --exclude=.git -czf artifact/source.tar.gz -C source .
          printf '%s\n' "$commit" > artifact/COMMIT.txt
          printf '%s\n' 'v10.0.11' > artifact/TAG.txt
          sha256sum artifact/source.tar.gz > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-wpf-v10.0.11-source
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
