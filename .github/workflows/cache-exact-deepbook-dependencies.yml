name: Cache exact DeepBook Move dependencies

on:
  push:
    branches:
      - "sui-runtime-extract-*"

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact DeepBook source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MystenLabs/deepbookv3.git /tmp/deepbookv3
          git -C /tmp/deepbookv3 checkout --detach 73253baacbcfb230987de180f55920ea869cfd0b
          test "$(git -C /tmp/deepbookv3 rev-parse HEAD)" = "73253baacbcfb230987de180f55920ea869cfd0b"

      - name: Install exact official Sui CLI
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/MystenLabs/sui/releases/download/testnet-v1.77.2/sui-testnet-v1.77.2-ubuntu-x86_64.tgz"
          expected="07456cf6bad1244973c3a9507f84a8b35857dc0316016b66c73aeebc61f64e94"
          curl --fail --location --retry 5 --retry-all-errors --output /tmp/sui-release.tgz "$url"
          printf '%s  %s\n' "$expected" /tmp/sui-release.tgz | sha256sum --check --strict
          tar -tzf /tmp/sui-release.tgz > /tmp/sui-release.members
          member="$(grep -m1 -E '(^|/)sui$' /tmp/sui-release.members)"
          tar -xzf /tmp/sui-release.tgz -C /tmp "$member"
          install -m 0755 "/tmp/$member" /usr/local/bin/sui
          sui --version
          sui client -y envs >/tmp/sui-client-init.log

      - name: Resolve and compile exact package baseline
        shell: bash
        run: |
          set -euo pipefail
          sui move test \
            --path /tmp/deepbookv3/packages/deepbook_margin \
            -e mainnet \
            --gas-limit 100000000000 \
            --list \
            | tee /tmp/BASELINE_LIST.log

      - name: Record cache manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cache-artifact
          cp -a "$HOME/.move" /tmp/cache-artifact/.move
          cp /tmp/BASELINE_LIST.log /tmp/cache-artifact/
          printf '%s\n' "sui 1.77.2-51d177ad7d65" > /tmp/cache-artifact/SUI_VERSION.txt
          printf '%s\n' "73253baacbcfb230987de180f55920ea869cfd0b" > /tmp/cache-artifact/DEEPBOOK_COMMIT.txt
          find /tmp/cache-artifact/.move -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/cache-artifact/MOVE_CACHE_SHA256SUMS
          du -sh /tmp/cache-artifact/.move | tee /tmp/cache-artifact/MOVE_CACHE_SIZE.txt

      - name: Upload resolved Move cache
        uses: actions/upload-artifact@v4
        with:
          name: deepbook-v6-move-dependency-cache
          path: /tmp/cache-artifact/
          compression-level: 6
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
