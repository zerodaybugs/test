name: cache-identitymodel-8-19-2

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-identitymodel-8-19-2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore exact Microsoft IdentityModel package graph
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p project artifact
          cat > project/cache.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.IdentityModel.JsonWebTokens" Version="8.19.2" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore project/cache.csproj --packages "$NUGET_PACKAGES" --force-evaluate
          dotnet list project/cache.csproj package --include-transitive > artifact/package-list.txt
          tar -czf artifact/identitymodel-8.19.2-nuget-cache.tar.gz -C "$NUGET_PACKAGES" .
          dotnet --info > artifact/dotnet-info.txt
          find "$NUGET_PACKAGES" -type f -print0 | sort -z | xargs -0 sha256sum > artifact/cache-file-sha256.txt
          sha256sum artifact/identitymodel-8.19.2-nuget-cache.tar.gz > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: identitymodel-8.19.2-nuget-cache
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
