name: cache-mono-cecil-0-11-6

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-mono-cecil-0-11-6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-tooling-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install official .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore exact Mono.Cecil package and extract runtime assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p project artifact
          cat > project/tool.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Mono.Cecil" Version="0.11.6" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore project/tool.csproj --packages packages
          cp packages/mono.cecil/0.11.6/lib/netstandard2.0/Mono.Cecil.dll artifact/
          cp packages/mono.cecil/0.11.6/.nupkg.metadata artifact/
          cp packages/mono.cecil/0.11.6/mono.cecil.0.11.6.nupkg.sha512 artifact/
          dotnet list project/tool.csproj package --include-transitive > artifact/package-list.txt
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload extracted tooling library
        uses: actions/upload-artifact@v4
        with:
          name: mono-cecil-0.11.6-extracted
          path: artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
