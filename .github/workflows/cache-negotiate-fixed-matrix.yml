name: cache-negotiate-fixed-matrix

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-negotiate-fixed-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    strategy:
      matrix:
        include:
          - package_version: 8.0.29
            tfm: net8.0
          - package_version: 9.0.18
            tfm: net9.0
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore exact package graph
        shell: bash
        env:
          PACKAGE_VERSION: ${{ matrix.package_version }}
          TFM: ${{ matrix.tfm }}
          NUGET_PACKAGES: ${{ github.workspace }}/packages
        run: |
          set -Eeuo pipefail
          mkdir -p project artifact
          cat > project/cache.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>${TFM}</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.Authentication.Negotiate" Version="${PACKAGE_VERSION}" />
              <PackageReference Include="System.DirectoryServices.Protocols" Version="${PACKAGE_VERSION}" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore project/cache.csproj --packages "$NUGET_PACKAGES" --force-evaluate
          dotnet list project/cache.csproj package --include-transitive > artifact/package-list.txt
          tar -czf "artifact/negotiate-${PACKAGE_VERSION}-nuget-cache.tar.gz" -C "$NUGET_PACKAGES" .
          dotnet --info > artifact/dotnet-info.txt
          find "$NUGET_PACKAGES" -type f -print0 | sort -z | xargs -0 sha256sum > artifact/cache-file-sha256.txt
          sha256sum "artifact/negotiate-${PACKAGE_VERSION}-nuget-cache.tar.gz" > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: negotiate-${{ matrix.package_version }}-nuget-cache
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
