name: cache-official-blazor-individual-packages-10-0-10

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-official-blazor-individual-packages-10-0-10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/offline-packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Install official .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Generate and restore unmodified official template
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet new blazor \
            --name OfflineTemplate \
            --output template \
            --auth Individual \
            --interactivity Server \
            --all-interactive \
            --no-restore
          dotnet restore template/OfflineTemplate.csproj \
            --packages "$NUGET_PACKAGES" \
            --force-evaluate
          dotnet publish template/OfflineTemplate.csproj \
            -c Release \
            --no-restore \
            -o published

      - name: Package isolated NuGet cache and provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          tar -czf artifact/blazor-individual-nuget-cache-10.0.10.tar.gz \
            -C "$NUGET_PACKAGES" .
          dotnet --info > artifact/dotnet-info.txt
          dotnet list template/OfflineTemplate.csproj package \
            --include-transitive > artifact/package-list.txt
          find "$NUGET_PACKAGES" -type f -name '*.nupkg.sha512' -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifact/cache-file-sha256.txt
          sha256sum artifact/blazor-individual-nuget-cache-10.0.10.tar.gz \
            > artifact/SHA256SUMS.txt

      - name: Upload isolated package cache
        uses: actions/upload-artifact@v4
        with:
          name: official-blazor-individual-nuget-cache-10.0.10
          path: artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
