name: cache-official-dotnet-sdk-10-0-400-win-x64

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-official-dotnet-sdk-10-0-400-win-x64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve, download and verify official Windows SDK archive
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          metadata_url='https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
          curl --fail --location --retry 5 --retry-all-errors "$metadata_url" -o artifact/releases.json
          python3 - <<'PY' > artifact/selected.json
          import json
          from pathlib import Path
          data=json.loads(Path('artifact/releases.json').read_text())
          hits=[]
          for release in data.get('releases',[]):
              for sdk in release.get('sdks',[]):
                  if sdk.get('version')!='10.0.400':
                      continue
                  for f in sdk.get('files',[]):
                      if f.get('rid')=='win-x64' and f.get('name','').endswith('.zip'):
                          hits.append({'release_version':release.get('release-version'),'sdk_version':sdk.get('version'),'name':f.get('name'),'url':f.get('url'),'hash':f.get('hash')})
          if len(hits)!=1:
              raise SystemExit(f'expected one archive, got {len(hits)}: {hits}')
          print(json.dumps(hits[0],indent=2))
          PY
          url="$(python3 -c "import json; print(json.load(open('artifact/selected.json'))['url'])")"
          name="$(python3 -c "import json; print(json.load(open('artifact/selected.json'))['name'])")"
          expected="$(python3 -c "import json; print(json.load(open('artifact/selected.json'))['hash'].lower())")"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "artifact/$name"
          actual="$(sha512sum "artifact/$name" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "$name" > artifact/SHA512SUMS.txt
          unzip -t "artifact/$name" >/dev/null
          printf 'source=%s\nverified=true\n' "$url" > artifact/PROVENANCE.txt

      - name: Upload verified Windows SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: official-dotnet-sdk-10.0.400-win-x64
          path: artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
