name: cache-official-dotnet-sdk-9-0-316

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-official-dotnet-sdk-9-0-316.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Microsoft release metadata and exact official SDK binary
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          metadata_url='https://builds.dotnet.microsoft.com/dotnet/release-metadata/9.0/releases.json'
          curl --fail --location --retry 5 --retry-all-errors \
            "$metadata_url" -o artifact/releases.json

          python3 - <<'PY' > artifact/selected.json
          import json
          from pathlib import Path

          releases = json.loads(Path('artifact/releases.json').read_text(encoding='utf-8'))
          matches = []
          for release in releases.get('releases', []):
              for sdk in release.get('sdks', []):
                  if sdk.get('version') != '9.0.316':
                      continue
                  for file in sdk.get('files', []):
                      if file.get('rid') == 'linux-x64' and file.get('name', '').endswith('.tar.gz'):
                          matches.append({
                              'release_version': release.get('release-version'),
                              'sdk_version': sdk.get('version'),
                              'name': file.get('name'),
                              'url': file.get('url'),
                              'hash': file.get('hash'),
                          })
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one SDK asset, got {len(matches)}')
          print(json.dumps(matches[0], indent=2))
          PY

          sdk_url="$(python3 -c "import json; print(json.load(open('artifact/selected.json'))['url'])")"
          sdk_name="$(python3 -c "import json; print(json.load(open('artifact/selected.json'))['name'])")"
          expected_hash="$(python3 -c "import json; print(json.load(open('artifact/selected.json'))['hash'].lower())")"
          curl --fail --location --retry 5 --retry-all-errors "$sdk_url" -o "artifact/$sdk_name"
          actual_hash="$(sha512sum "artifact/$sdk_name" | awk '{print $1}')"
          test "$actual_hash" = "$expected_hash"
          printf '%s  %s\n' "$actual_hash" "$sdk_name" > artifact/SHA512SUMS.txt
          tar -tzf "artifact/$sdk_name" >/dev/null
          printf 'verified=true\nsource=%s\n' "$sdk_url" > artifact/VERIFICATION.txt

      - name: Upload verified official SDK
        uses: actions/upload-artifact@v4
        with:
          name: official-dotnet-sdk-9.0.316-linux-x64
          path: artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
