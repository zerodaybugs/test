name: cache-playwright-chromium-1-57

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-playwright-chromium-1-57.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
    steps:
      - name: Install exact Playwright client and Chromium revision
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input playwright==1.57.0
          python3 -m playwright install chromium
          python3 - <<'PY' > browser-provenance.json
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              executable = Path(p.chromium.executable_path)
              if not executable.is_file():
                  raise SystemExit(f'missing executable: {executable}')
              print(json.dumps({
                  'playwright': '1.57.0',
                  'browser_type': p.chromium.name,
                  'executable_relative_to_cache': executable.relative_to(Path.cwd() / 'ms-playwright').as_posix(),
              }, indent=2))
          PY

      - name: Package browser cache and hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          cp browser-provenance.json artifact/
          tar -czf artifact/playwright-chromium-1.57.0-linux-x64.tar.gz \
            -C "$PLAYWRIGHT_BROWSERS_PATH" .
          sha256sum artifact/playwright-chromium-1.57.0-linux-x64.tar.gz \
            > artifact/SHA256SUMS.txt

      - name: Upload browser cache
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-1.57.0-linux-x64
          path: artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
