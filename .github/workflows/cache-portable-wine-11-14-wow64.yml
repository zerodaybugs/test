name: cache-portable-wine-11-14-wow64

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-portable-wine-11-14-wow64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify portable Wine build
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          name='wine-11.14-amd64-wow64.tar.xz'
          url="https://github.com/Kron4ek/Wine-Builds/releases/download/11.14/$name"
          expected='707956fa1574ad1660c4d7f2cfd9c024e0f437ad0a2d501a53b717adb1288222'
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "artifact/$name"
          actual="$(sha256sum "artifact/$name" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "$name" > artifact/SHA256SUMS.txt
          tar -tJf "artifact/$name" >/dev/null
          printf 'source=%s\nverified=true\n' "$url" > artifact/PROVENANCE.txt

      - name: Upload verified portable Wine
        uses: actions/upload-artifact@v4
        with:
          name: portable-wine-11.14-amd64-wow64
          path: artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
