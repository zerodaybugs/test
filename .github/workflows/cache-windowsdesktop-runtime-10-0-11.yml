name: cache-windowsdesktop-runtime-10-0-11

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/cache-windowsdesktop-runtime-10-0-11.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch and verify official Windows Desktop Runtime 10.0.11
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          metadata='https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
          curl --fail --location --retry 5 --retry-all-errors "$metadata" -o artifact/releases.json
          python3 - <<'PY' > artifact/selected.json
          import json
          from pathlib import Path
          data=json.loads(Path('artifact/releases.json').read_text())
          hits=[]
          for release in data.get('releases',[]):
              if release.get('release-version')!='10.0.11':
                  continue
              wd=release.get('windowsdesktop',{})
              for f in wd.get('files',[]):
                  if f.get('rid')=='win-x64' and f.get('name','').endswith('.zip'):
                      hits.append({'release':release.get('release-version'),'runtime_version':wd.get('version'),'name':f['name'],'url':f['url'],'hash':f['hash']})
          if len(hits)!=1:
              raise SystemExit(f'expected one win-x64 WindowsDesktop zip, got {len(hits)}')
          print(json.dumps(hits[0],indent=2))
          PY
          url="$(python3 -c "import json;print(json.load(open('artifact/selected.json'))['url'])")"
          name="$(python3 -c "import json;print(json.load(open('artifact/selected.json'))['name'])")"
          expected="$(python3 -c "import json;print(json.load(open('artifact/selected.json'))['hash'].lower())")"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "artifact/$name"
          actual="$(sha512sum "artifact/$name" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "$name" > artifact/SHA512SUMS.txt
          unzip -t "artifact/$name" >/dev/null
          printf 'verified=true\nsource=%s\n' "$url" > artifact/VERIFICATION.txt
      - name: Upload official runtime
        uses: actions/upload-artifact@v4
        with:
          name: windowsdesktop-runtime-10.0.11-win-x64
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
