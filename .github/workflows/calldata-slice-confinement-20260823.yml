name: Generic calldata slice confinement semantics

on:
  push:
    branches:
      - research/calldata-slice-confinement-20260823
    paths:
      - .github/workflows/calldata-slice-confinement-20260823.yml
      - research/calldata-slice-confinement/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/calldata-slice-confinement-20260823.yml
      - research/calldata-slice-confinement/**

permissions:
  contents: read

jobs:
  native-solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Native compiler and EVM run 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/calldata-slice-confinement
          forge --version | tee evidence/calldata-slice-confinement/foundry-version.txt
          cd research/calldata-slice-confinement
          forge test --fuzz-runs 1024 -vvv 2>&1 | tee ../../evidence/calldata-slice-confinement/native-run-1.log

      - name: Independent seeded stress run
        shell: bash
        run: |
          set -euo pipefail
          cd research/calldata-slice-confinement
          forge test --fuzz-seed 0x5a17ce20260823 --fuzz-runs 4096 -vvv 2>&1 | tee ../../evidence/calldata-slice-confinement/native-run-2-fuzz4096.log

      - name: Record evidence integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence/calldata-slice-confinement -type f -print0 | sort -z | xargs -0 sha256sum \
            > evidence/calldata-slice-confinement/SHA256SUMS.txt
          printf 'source_commit=%s\n' "$GITHUB_SHA" \
            > evidence/calldata-slice-confinement/RUN_METADATA.txt

      - name: Upload generic semantics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calldata-slice-confinement-native-evidence
          path: evidence/calldata-slice-confinement
          retention-days: 1
          if-no-files-found: error
