name: capability-selector-map

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build selector dictionary
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules --shallow-submodules --depth 1 https://github.com/Veda-Labs/boring-vault.git target
          cd target
          forge build --skip test --skip script
          cd ..
          python3 - <<'PY'
          import json, pathlib, urllib.request, time

          target=pathlib.Path('target')
          selector_map={}
          artifact_sources={}
          for p in target.glob('out/**/*.json'):
            try:d=json.loads(p.read_text())
            except Exception:continue
            mids=d.get('methodIdentifiers') or ((d.get('evm') or {}).get('methodIdentifiers')) or {}
            if not mids: continue
            for sig,sel in mids.items():
              sel=sel.lower().removeprefix('0x')
              selector_map.setdefault(sel,set()).add(sig)
              artifact_sources.setdefault(sel,set()).add(str(p.relative_to(target)))

          CHAINS={
            'ethereum':{'id':1,'eps':['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://rpc.ankr.com/eth']},
            'scroll':{'id':534352,'eps':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']},
            'ink':{'id':57073,'eps':['https://rpc-gel.inkonchain.com','https://rpc-qnd.inkonchain.com','https://ink.drpc.org']},
          }
          PRODUCTS={
            'ethereum':{
              'liquidETH':{'vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0xf9f7969C357ce6dfd7973098Ea0D57173592bCCa'},
              'liquidBTC':{'vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x92b10e02825986bAc2375BdACaFA3e89E3f612aA','manager':'0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'},
            },
            'scroll':{
              'liquidETH':{'vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0x227975088C28DBBb4b421c6d96781a53578f19a8'},
              'liquidBTC':{'vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610','manager':'0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'},
            },
            'ink':{
              'balanced':{'vault':'0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f','accountant':'0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67','teller':'0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC','queue':'0x4c433Ed6d57316170565D7Fedc11a841832cDc3d','solver':'0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6','manager':'0xA0e501F98A1B5d3d8e6Ffd161c76f92570E42931'},
              'boosted':{'vault':'0xDbD87325D7b1189Dcc9255c4926076fF4a96A271','accountant':'0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9','teller':'0xc46f2443b3521632E2E2a903D6da8f965B46f6a0','queue':'0x406E63323EF5d39D41C6fD895Ef9665AF926184c','solver':'0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF','manager':'0xEd23b12e7700BeB638562A22ED65f74291901c25'},
            }
          }
          ATTACKER='0x1111111111111111111111111111111111111111'
          AUTH_SEL='bf7e214f'; CAN_SEL='b7009613'; PUBLIC_SEL='2f47571f'
          def rq(ep,m,p):
            payload=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode()
            req=urllib.request.Request(ep,data=payload,method='POST',headers={'content-type':'application/json','user-agent':'capability-selector-map/1.0'})
            with urllib.request.urlopen(req,timeout=30) as f: out=json.loads(f.read().decode())
            if 'error' in out: raise RuntimeError(out['error'])
            return out['result']
          def select(c):
            bad={}
            for ep in c['eps']:
              try:
                if int(rq(ep,'eth_chainId',[]),16)==c['id']: return ep
              except Exception as e: bad[ep]=repr(e)
            raise RuntimeError(bad)
          def clean(x):return x.lower().removeprefix('0x')
          def aw(x):return clean(x).rjust(64,'0')
          def b4w(x):return clean(x).ljust(64,'0')
          def boolraw(x):return bool(int(x,16))
          def addr(x):return '0x'+x[-40:]
          def safe(f):
            try:return f()
            except Exception as e:return {'error':repr(e)}
          def push4s(codehex):
            b=bytes.fromhex(codehex.removeprefix('0x')); out=set(); i=0
            while i<len(b):
              op=b[i]
              if op==0x63 and i+4<len(b): out.add(b[i+1:i+5].hex())
              if 0x60<=op<=0x7f: i += 1 + (op-0x5f)
              else:i+=1
            return sorted(out)
          result={'target_commit':(target/'.git/refs/heads/main').read_text().strip() if (target/'.git/refs/heads/main').exists() else None,'selector_dictionary_count':len(selector_map),'chains':{}}
          for cn,products in PRODUCTS.items():
            cfg=CHAINS[cn]; ep=select(cfg); block=rq(ep,'eth_blockNumber',[])
            def call(to,data):return rq(ep,'eth_call',[{'to':to,'data':data},block])
            chain={'endpoint':ep,'block':int(block,16),'products':{}}
            for pn,comps in products.items():
              pout={}
              for comp,target_addr in comps.items():
                code=rq(ep,'eth_getCode',[target_addr,block])
                if code=='0x':
                  pout[comp]={'address':target_addr,'code_bytes':0,'authority':None,'push4_count':0,'public':[],'attacker_callable':[]}
                  continue
                authority=safe(lambda:addr(call(target_addr,'0x'+AUTH_SEL)))
                sels=push4s(code)
                pub=[]; callable=[]
                if isinstance(authority,str) and authority!='0x0000000000000000000000000000000000000000':
                  for sel in sels:
                    ispub=safe(lambda sel=sel:boolraw(call(authority,'0x'+PUBLIC_SEL+aw(target_addr)+b4w(sel))))
                    can=safe(lambda sel=sel:boolraw(call(authority,'0x'+CAN_SEL+aw(ATTACKER)+aw(target_addr)+b4w(sel))))
                    item={'selector':'0x'+sel,'signatures':sorted(selector_map.get(sel,[])),'artifact_sources':sorted(artifact_sources.get(sel,[]))[:10]}
                    if ispub is True:pub.append(item)
                    if can is True:callable.append(item)
                pout[comp]={'address':target_addr,'code_bytes':(len(code)-2)//2,'authority':authority,'push4_count':len(sels),'public':pub,'attacker_callable':callable}
              chain['products'][pn]=pout
            result['chains'][cn]=chain
          text=json.dumps(result,indent=2,sort_keys=True)
          print('CAPABILITY_SUMMARY')
          for cn,c in result['chains'].items():
            for pn,p in c['products'].items():
              for comp,x in p.items():
                if x['public'] or x['attacker_callable']:
                  print(cn,pn,comp,json.dumps({'public':x['public'],'attacker_callable':x['attacker_callable']},sort_keys=True))
          pathlib.Path('capability-selector-map.json').write_text(text+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capability-selector-map
          path: capability-selector-map.json
          retention-days: 1
