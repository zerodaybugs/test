name: chain-state-gate-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-live-gate-trigger.txt'

permissions:
  contents: read

jobs:
  state-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract read-only gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/chain-state-gate.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if "cat > /tmp/live_gate.py <<'PY'" in l) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          lines = [line[10:] if line.startswith('          ') else line for line in src[start:end]]
          Path('/tmp/live_gate.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 -m py_compile /tmp/live_gate.py 2> evidence/PY_COMPILE.err || true
      - name: Execute read-only gate
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python3 /tmp/live_gate.py > evidence/EXECUTION.log 2>&1
          status=$?
          echo "$status" > evidence/EXIT_STATUS.txt
          cat evidence/EXECUTION.log
          exit 0
      - name: Build manifest
        if: always()
        shell: bash
        run: |
          set +e
          env | sort > evidence/RUNNER_ENV.txt
          sha256sum evidence/* 2>/dev/null | sort > evidence/SHA256SUMS.txt
          ls -lah evidence > evidence/FILE_LIST.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-state-gate-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
