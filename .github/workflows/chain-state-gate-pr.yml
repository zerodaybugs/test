name: chain-state-gate-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-live-gate-trigger.txt'

permissions:
  contents: read

jobs:
  state-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract and execute read-only gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/chain-state-gate.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if "cat > /tmp/live_gate.py <<'PY'" in l) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          lines = []
          for line in src[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/live_gate.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/live_gate.py | tee evidence/EXECUTION.log
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: chain-state-gate-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
