name: Minimal Clarinet dependency lock

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/clarinet-minimal-lock.yml'
      - 'public-data/clarinet-minimal-lock-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate minimal package lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > out/package.json <<'JSON'
          {
            "name": "clarinet-local-reproduction",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {"poc": "node run_poc.mjs"},
            "dependencies": {
              "@stacks/clarinet-sdk": "3.13.1",
              "@stacks/transactions": "7.2.0"
            }
          }
          JSON
          cd out
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "Promise.all([import('@stacks/clarinet-sdk'), import('@stacks/transactions')]).then(() => console.log('dependency_imports=PASS'))"
          rm -rf node_modules
          sha256sum package.json package-lock.json > SHA256SUMS
      - name: Upload package lock
        uses: actions/upload-artifact@v4
        with:
          name: clarinet-minimal-lock
          path: out
          retention-days: 1
          if-no-files-found: error
