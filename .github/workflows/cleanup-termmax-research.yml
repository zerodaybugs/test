name: cleanup-termmax-research

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cleanup-termmax-research-trigger.txt'

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove all temporary research files from main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name termmax-research-cleanup
          git config user.email actions@users.noreply.github.com
          find .github/workflows -maxdepth 1 -type f \( -name '*termmax*' -o -name 'chain-state-gate*.yml' \) -print -delete || true
          find . -maxdepth 1 -mindepth 1 \( -name 'termmax-*' -o -name 'TERMMAX_*' \) -print -exec rm -rf {} + || true
          git add -A
          git commit -m 'Remove temporary TermMax research CI and evidence' || true
          git push origin HEAD:main
      - name: Delete temporary research branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/termmax-live-gate-20260720"
          exit 0
