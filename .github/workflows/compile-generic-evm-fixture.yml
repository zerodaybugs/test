name: Compile generic EVM fixture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compile-generic-evm-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install official Solidity 0.8.26 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/solc \
            https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          chmod +x /tmp/solc
          /tmp/solc --version | tee solc-version.txt
          sha256sum /tmp/solc | tee solc-sha256.txt

      - name: Write generic fixture source
        shell: bash
        run: |
          cat > Fixture.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.26;

          interface IFixtureToken {
              function deposit(address to, uint256 amount) external returns (bool);
              function approve(address spender, uint256 amount) external returns (bool);
              function transferFrom(address from, address to, uint256 amount) external returns (bool);
              function burn(uint256 amount) external returns (bool);
          }

          interface IFixtureGateway {
              function burnAndEmit(address token, uint256 amount) external;
          }

          contract FixtureToken {
              string public constant name = "Fixture Token";
              string public constant symbol = "FIX";
              uint8 public constant decimals = 6;
              uint256 public totalSupply;
              mapping(address => uint256) public balanceOf;
              mapping(address => mapping(address => uint256)) public allowance;

              event Transfer(address indexed from, address indexed to, uint256 amount);
              event Approval(address indexed owner, address indexed spender, uint256 amount);

              function deposit(address to, uint256 amount) external returns (bool) {
                  require(to != address(0) && amount != 0, "bad mint");
                  totalSupply += amount;
                  balanceOf[to] += amount;
                  emit Transfer(address(0), to, amount);
                  return true;
              }

              function approve(address spender, uint256 amount) external returns (bool) {
                  allowance[msg.sender][spender] = amount;
                  emit Approval(msg.sender, spender, amount);
                  return true;
              }

              function transferFrom(address from, address to, uint256 amount) external returns (bool) {
                  uint256 allowed = allowance[from][msg.sender];
                  require(allowed >= amount, "allowance");
                  require(balanceOf[from] >= amount, "balance");
                  allowance[from][msg.sender] = allowed - amount;
                  balanceOf[from] -= amount;
                  balanceOf[to] += amount;
                  emit Transfer(from, to, amount);
                  return true;
              }

              function burn(uint256 amount) external returns (bool) {
                  require(amount != 0 && balanceOf[msg.sender] >= amount, "bad burn");
                  balanceOf[msg.sender] -= amount;
                  totalSupply -= amount;
                  emit Transfer(msg.sender, address(0), amount);
                  return true;
              }
          }

          contract FixtureCore {
              function depositPRC20Token(address token, uint256 amount, address recipient) external {
                  require(IFixtureToken(token).deposit(recipient, amount), "deposit failed");
              }
          }

          contract FixtureGateway {
              uint256 public nonce;

              enum TxType { GAS, GAS_AND_PAYLOAD, FUNDS, FUNDS_AND_PAYLOAD, RESCUE_FUNDS }

              event UniversalTxOutbound(
                  bytes32 indexed subTxId,
                  address indexed sender,
                  string chainNamespace,
                  address indexed token,
                  bytes recipient,
                  uint256 amount,
                  address gasToken,
                  uint256 gasFee,
                  uint256 gasLimit,
                  bytes payload,
                  uint256 protocolFee,
                  address revertRecipient,
                  TxType txType,
                  uint256 gasPrice
              );

              function burnAndEmit(address token, uint256 amount) external {
                  require(amount != 0, "zero");
                  require(IFixtureToken(token).transferFrom(msg.sender, address(this), amount), "pull failed");
                  require(IFixtureToken(token).burn(amount), "burn failed");

                  uint256 currentNonce = nonce++;
                  bytes memory recipient = hex"1234567890abcdef1234567890abcdef12345678";
                  bytes memory payload = bytes("");
                  string memory chainNamespace = "eip155:11155111";
                  bytes32 subTxId = keccak256(
                      abi.encode(msg.sender, recipient, token, amount, keccak256(payload), chainNamespace, currentNonce)
                  );

                  emit UniversalTxOutbound(
                      subTxId,
                      msg.sender,
                      chainNamespace,
                      token,
                      recipient,
                      amount,
                      token,
                      1,
                      100000,
                      payload,
                      0,
                      0x1234567890AbcdEF1234567890aBcdef12345678,
                      TxType.FUNDS,
                      1
                  );
              }
          }

          contract FixtureRecipient {
              address internal constant GATEWAY = 0x00000000000000000000000000000000000000C1;

              function executeUniversalTx(
                  string calldata,
                  bytes calldata,
                  bytes calldata,
                  uint256 amount,
                  address token,
                  bytes32
              ) external {
                  require(IFixtureToken(token).approve(GATEWAY, amount), "approve failed");
                  IFixtureGateway(GATEWAY).burnAndEmit(token, amount);
              }
          }
          EOF
          sha256sum Fixture.sol > fixture-source-sha256.txt

      - name: Compile runtime bytecode and ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          /tmp/solc --optimize --optimize-runs 200 --evm-version cancun \
            --bin-runtime --abi --metadata-hash none \
            -o out --overwrite Fixture.sol 2>&1 | tee compile.log
          find out -maxdepth 1 -type f -print -exec wc -c {} \; | tee artifact-sizes.txt
          sha256sum Fixture.sol solc-version.txt solc-sha256.txt compile.log out/* > SHA256SUMS

      - name: Upload compiled fixture
        uses: actions/upload-artifact@v4
        with:
          name: generic-evm-fixture-solc-0.8.26
          path: |
            Fixture.sol
            out/
            solc-version.txt
            solc-sha256.txt
            compile.log
            artifact-sizes.txt
            fixture-source-sha256.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
