name: DeepBook deployed v6 public source mirror 20260808

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror-deployed-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source-verified deployed v6 commit
        uses: actions/checkout@v4
        with:
          repository: MystenLabs/deepbookv3
          ref: 73253baacbcfb230987de180f55920ea869cfd0b
          path: deepbookv3-v6
          fetch-depth: 1

      - name: Verify and package public source
        shell: bash
        run: |
          set -euo pipefail
          cd deepbookv3-v6
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "73253baacbcfb230987de180f55920ea869cfd0b"
          printf '%s\n' "$ACTUAL" > ../UPSTREAM_DEPLOYED_V6_COMMIT.txt
          grep -q 'published-at = "0x8af25e44bcdfb8b19ceffef5a1bd457a89a4270b8237e1025f30cd26acb4edbe"' packages/deepbook_margin/Published.toml
          grep -q 'version = 6' packages/deepbook_margin/Published.toml
          rm -rf .git
          cd ..
          tar -czf deepbookv3-deployed-v6-73253baa-public-source.tar.gz deepbookv3-v6 UPSTREAM_DEPLOYED_V6_COMMIT.txt
          sha256sum deepbookv3-deployed-v6-73253baa-public-source.tar.gz > deepbookv3-deployed-v6-73253baa-public-source.tar.gz.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbookv3-deployed-v6-73253baa-public-source
          path: |
            deepbookv3-deployed-v6-73253baa-public-source.tar.gz
            deepbookv3-deployed-v6-73253baa-public-source.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
