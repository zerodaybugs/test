name: DeepBook deployed v6 Wormhole source mirror 20260808

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror-wormhole-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact public Wormhole dependency
        uses: actions/checkout@v4
        with:
          repository: wormhole-foundation/wormhole
          ref: b71be5cbb9537c4aac8e23e74371affa3825efcd
          path: wormhole-repo
          fetch-depth: 1

      - name: Verify and package public dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C wormhole-repo rev-parse HEAD)" = "b71be5cbb9537c4aac8e23e74371affa3825efcd"
          mkdir -p wormhole-v6
          cp -a wormhole-repo/sui/wormhole/. wormhole-v6/
          find wormhole-v6 -type d -name .git -prune -exec rm -rf {} +
          printf '%s\n' 'b71be5cbb9537c4aac8e23e74371affa3825efcd' > wormhole-v6/UPSTREAM_COMMIT.txt
          tar -czf deepbook-deployed-v6-wormhole-b71be5cb.tar.gz wormhole-v6
          sha256sum deepbook-deployed-v6-wormhole-b71be5cb.tar.gz > deepbook-deployed-v6-wormhole-b71be5cb.tar.gz.sha256

      - name: Upload dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbook-deployed-v6-wormhole-b71be5cb
          path: |
            deepbook-deployed-v6-wormhole-b71be5cb.tar.gz
            deepbook-deployed-v6-wormhole-b71be5cb.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
