name: DeepBook public audit mirror 20260808

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  mirror-public-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Checkout public Zellic publications
        uses: actions/checkout@v4
        with:
          repository: Zellic/publications
          ref: master
          path: zellic-publications
          fetch-depth: 1

      - name: Mirror only the already-public DeepBook Margin audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-audit-mirror
          cp 'zellic-publications/Deepbook Margin - Zellic Audit Report.pdf' \
             'public-audit-mirror/Deepbook-Margin-Zellic-Audit-Report.pdf'
          sha256sum 'public-audit-mirror/Deepbook-Margin-Zellic-Audit-Report.pdf' \
             > 'public-audit-mirror/Deepbook-Margin-Zellic-Audit-Report.pdf.sha256'
          rm -rf zellic-publications
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-audit-mirror
          if git diff --cached --quiet; then
            echo 'Public audit already mirrored.'
            exit 0
          fi
          git commit -m 'docs: temporarily mirror public DeepBook Margin audit'
          git push origin HEAD:${{ github.head_ref }}
