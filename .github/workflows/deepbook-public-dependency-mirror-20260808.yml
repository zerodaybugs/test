name: DeepBook public dependency mirror 20260808

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned Pyth source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: 3bd1262dcba9518a6901aa6a15f04072799bfb37
          path: pyth-crosschain
          fetch-depth: 1

      - name: Checkout pinned Wormhole source
        uses: actions/checkout@v4
        with:
          repository: wormhole-foundation/wormhole
          ref: 1b1cb69e809e0e7081cf1bf9b2779c41c14fc7f0
          path: wormhole
          fetch-depth: 1

      - name: Checkout DeepBook pinned token source
        uses: actions/checkout@v4
        with:
          repository: MystenLabs/deepbookv3
          ref: 802a863995946ea230e04964d2118fb09170626d
          path: deepbook-token-repo
          fetch-depth: 1

      - name: Checkout pinned Sui framework A
        uses: actions/checkout@v4
        with:
          repository: MystenLabs/sui
          ref: 73dd2c2ba6f9fdb21d7ffde2b50a3f2f0ac39bc1
          path: sui-a
          fetch-depth: 1
          sparse-checkout: |
            crates/sui-framework/packages/move-stdlib
            crates/sui-framework/packages/sui-framework
          sparse-checkout-cone-mode: false

      - name: Checkout pinned Sui framework B
        uses: actions/checkout@v4
        with:
          repository: MystenLabs/sui
          ref: 041c5f2bae2fe52079e44b70514333532d69f4e6
          path: sui-b
          fetch-depth: 1
          sparse-checkout: |
            crates/sui-framework/packages/move-stdlib
            crates/sui-framework/packages/sui-framework
          sparse-checkout-cone-mode: false

      - name: Verify and package public dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "3bd1262dcba9518a6901aa6a15f04072799bfb37"
          test "$(git -C wormhole rev-parse HEAD)" = "1b1cb69e809e0e7081cf1bf9b2779c41c14fc7f0"
          test "$(git -C deepbook-token-repo rev-parse HEAD)" = "802a863995946ea230e04964d2118fb09170626d"
          test "$(git -C sui-a rev-parse HEAD)" = "73dd2c2ba6f9fdb21d7ffde2b50a3f2f0ac39bc1"
          test "$(git -C sui-b rev-parse HEAD)" = "041c5f2bae2fe52079e44b70514333532d69f4e6"

          mkdir -p dependency-bundle/pyth dependency-bundle/wormhole dependency-bundle/token dependency-bundle/sui-a dependency-bundle/sui-b
          cp -a pyth-crosschain/target_chains/sui/contracts/. dependency-bundle/pyth/
          cp -a wormhole/sui/wormhole/. dependency-bundle/wormhole/
          cp -a deepbook-token-repo/packages/token/. dependency-bundle/token/
          cp -a sui-a/crates/sui-framework/packages/move-stdlib dependency-bundle/sui-a/
          cp -a sui-a/crates/sui-framework/packages/sui-framework dependency-bundle/sui-a/
          cp -a sui-b/crates/sui-framework/packages/move-stdlib dependency-bundle/sui-b/
          cp -a sui-b/crates/sui-framework/packages/sui-framework dependency-bundle/sui-b/
          find dependency-bundle -type d -name .git -prune -exec rm -rf {} +

          cat > dependency-bundle/PINNED_COMMITS.txt <<'PINS'
          pyth-crosschain=3bd1262dcba9518a6901aa6a15f04072799bfb37
          wormhole=1b1cb69e809e0e7081cf1bf9b2779c41c14fc7f0
          token=802a863995946ea230e04964d2118fb09170626d
          sui-a=73dd2c2ba6f9fdb21d7ffde2b50a3f2f0ac39bc1
          sui-b=041c5f2bae2fe52079e44b70514333532d69f4e6
          PINS
          tar -czf deepbook-public-pinned-dependencies.tar.gz dependency-bundle
          sha256sum deepbook-public-pinned-dependencies.tar.gz > deepbook-public-pinned-dependencies.tar.gz.sha256

      - name: Upload dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbook-public-pinned-dependencies
          path: |
            deepbook-public-pinned-dependencies.tar.gz
            deepbook-public-pinned-dependencies.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
