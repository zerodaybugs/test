name: DeepBook public source mirror 20260808

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact public upstream source
        uses: actions/checkout@v4
        with:
          repository: MystenLabs/deepbookv3
          ref: 4ac0066c339150e86f28dc298500661bd2a4ac25
          path: deepbookv3
          fetch-depth: 1

      - name: Verify and package public source
        shell: bash
        run: |
          set -euo pipefail
          cd deepbookv3
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "4ac0066c339150e86f28dc298500661bd2a4ac25"
          printf '%s\n' "$ACTUAL" > ../UPSTREAM_COMMIT.txt
          rm -rf .git
          cd ..
          tar -czf deepbookv3-4ac0066c-public-source.tar.gz deepbookv3 UPSTREAM_COMMIT.txt
          sha256sum deepbookv3-4ac0066c-public-source.tar.gz > deepbookv3-4ac0066c-public-source.tar.gz.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbookv3-4ac0066c-public-source
          path: |
            deepbookv3-4ac0066c-public-source.tar.gz
            deepbookv3-4ac0066c-public-source.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
