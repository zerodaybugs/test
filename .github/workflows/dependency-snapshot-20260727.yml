name: Dependency snapshot 20260727

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build public dependency snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/dependency-snapshot"
          SOURCE_COMMIT="50ade621592a3eec48f431f282d074ce08a7781a"
          CORE_ARCHIVE="bitcoin-24.0.1-x86_64-linux-gnu.tar.gz"
          CORE_SHA256="49df6e444515d457ea0b885d66f521f2a26ca92ccf73d5296082e633544253bf"

          mkdir -p "$ROOT"
          git clone --filter=blob:none --no-checkout \
            https://github.com/rsksmart/liquidity-provider-server.git "$ROOT/source"
          git -C "$ROOT/source" checkout --detach "$SOURCE_COMMIT"
          test "$(git -C "$ROOT/source" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$ROOT/source" show -s \
            --format='commit=%H%ncommit_date=%cI%nsubject=%s' HEAD > "$ROOT/source-commit.txt"
          rm -rf "$ROOT/source/.git"

          curl --fail --location --retry 5 --retry-all-errors \
            "https://bitcoincore.org/bin/bitcoin-core-24.0.1/$CORE_ARCHIVE" \
            --output "$RUNNER_TEMP/$CORE_ARCHIVE"
          printf '%s  %s\n' "$CORE_SHA256" "$RUNNER_TEMP/$CORE_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$CORE_ARCHIVE" -C "$ROOT"
          "$ROOT/bitcoin-24.0.1/bin/bitcoind" --version > "$ROOT/bitcoind-version.txt"
          "$ROOT/bitcoin-24.0.1/bin/bitcoin-cli" --version > "$ROOT/bitcoin-cli-version.txt"

          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/ALL_FILES_SHA256.txt"
          tar -C "$ROOT" -czf "$RUNNER_TEMP/dependency-snapshot-20260727.tar.gz" .
          sha256sum "$RUNNER_TEMP/dependency-snapshot-20260727.tar.gz" > "$RUNNER_TEMP/dependency-snapshot-20260727.tar.gz.sha256"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dependency-snapshot-20260727
          path: |
            ${{ runner.temp }}/dependency-snapshot-20260727.tar.gz
            ${{ runner.temp }}/dependency-snapshot-20260727.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
