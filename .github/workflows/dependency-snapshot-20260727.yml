name: Dependency snapshot 20260727

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build public Rootstock scope snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/dependency-snapshot"
          SRC="$ROOT/sources"
          CORE_ARCHIVE="bitcoin-24.0.1-x86_64-linux-gnu.tar.gz"
          CORE_SHA256="49df6e444515d457ea0b885d66f521f2a26ca92ccf73d5296082e633544253bf"
          mkdir -p "$SRC"

          clone_head() {
            local repo="$1"
            local dir="$2"
            git clone --depth 1 --filter=blob:none "https://github.com/$repo.git" "$SRC/$dir"
            git -C "$SRC/$dir" show -s --format='repository=%s%ncommit=%H%ncommit_date=%cI%nsubject=%s' HEAD > "$SRC/$dir/SNAPSHOT_COMMIT.txt"
            rm -rf "$SRC/$dir/.git"
          }

          clone_exact() {
            local repo="$1"
            local commit="$2"
            local dir="$3"
            git init "$SRC/$dir"
            git -C "$SRC/$dir" remote add origin "https://github.com/$repo.git"
            git -C "$SRC/$dir" fetch --depth 1 origin "$commit"
            git -C "$SRC/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$SRC/$dir" rev-parse HEAD)" = "$commit"
            git -C "$SRC/$dir" show -s --format='repository=%s%ncommit=%H%ncommit_date=%cI%nsubject=%s' HEAD > "$SRC/$dir/SNAPSHOT_COMMIT.txt"
            rm -rf "$SRC/$dir/.git"
          }

          clone_head rsksmart/rskj rskj-head
          clone_head rsksmart/powpeg-node powpeg-node-head
          clone_head rsksmart/rsk-powhsm rsk-powhsm-head
          clone_head rsksmart/liquidity-bridge-contract liquidity-bridge-contract-head
          clone_head rsksmart/liquidity-provider-server liquidity-provider-server-head
          clone_head rsksmart/flyover-sdk flyover-sdk-head
          clone_head rsksmart/bridges-core-sdk bridges-core-sdk-head
          clone_head rsksmart/2wp-api 2wp-api-head
          clone_head rsksmart/2wp-app 2wp-app-head

          clone_exact rsksmart/liquidity-bridge-contract 4066b8fb726bb6c7cf9c0fb7d2761ff6739c8793 liquidity-bridge-contract-deployed
          clone_exact rsksmart/liquidity-provider-server 50ade621592a3eec48f431f282d074ce08a7781a liquidity-provider-server-target

          curl --fail --location --retry 5 --retry-all-errors \
            "https://bitcoincore.org/bin/bitcoin-core-24.0.1/$CORE_ARCHIVE" \
            --output "$RUNNER_TEMP/$CORE_ARCHIVE"
          printf '%s  %s\n' "$CORE_SHA256" "$RUNNER_TEMP/$CORE_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$CORE_ARCHIVE" -C "$ROOT"
          "$ROOT/bitcoin-24.0.1/bin/bitcoind" --version > "$ROOT/bitcoind-version.txt"
          "$ROOT/bitcoin-24.0.1/bin/bitcoin-cli" --version > "$ROOT/bitcoin-cli-version.txt"

          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=$(uname -a)"
            echo "purpose=public source snapshot for local authorized bounty review"
          } > "$ROOT/MANIFEST.txt"

          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/ALL_FILES_SHA256.txt"
          tar -C "$ROOT" --zstd -cf "$RUNNER_TEMP/dependency-snapshot-20260727.tar.zst" .
          sha256sum "$RUNNER_TEMP/dependency-snapshot-20260727.tar.zst" > "$RUNNER_TEMP/dependency-snapshot-20260727.tar.zst.sha256"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dependency-snapshot-20260727
          path: |
            ${{ runner.temp }}/dependency-snapshot-20260727.tar.zst
            ${{ runner.temp }}/dependency-snapshot-20260727.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
