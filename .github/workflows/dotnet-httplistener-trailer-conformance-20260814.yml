name: .NET HttpListener Trailer Conformance 2026-08-14

on:
  push:
    branches:
      - lab/dotnet-httplistener-trailer-conformance-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Record exact runtime inventory
        working-directory: lab/dotnet_http_listener_trailer_probe
        run: |
          mkdir -p artifacts
          dotnet --version | tee artifacts/dotnet-version.txt
          dotnet --info | tee artifacts/dotnet-info.txt
          dotnet --list-sdks | tee artifacts/dotnet-sdks.txt
          dotnet --list-runtimes | tee artifacts/dotnet-runtimes.txt
          grep -F "Microsoft.NETCore.App 10.0.11" artifacts/dotnet-runtimes.txt

      - name: Build shipping-runtime probe
        working-directory: lab/dotnet_http_listener_trailer_probe
        run: |
          dotnet restore TrailerProbe.csproj
          dotnet build TrailerProbe.csproj -c Release --no-restore

      - name: Execute trailer conformance matrix
        working-directory: lab/dotnet_http_listener_trailer_probe
        env:
          ARTIFACT_DIR: artifacts
        run: |
          dotnet run --project TrailerProbe.csproj -c Release --no-build | tee artifacts/stdout.txt
          grep -Fx "PROBE_RESULT=PASS" artifacts/stdout.txt
          sha256sum artifacts/* | tee artifacts/SHA256SUMS.txt

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-httplistener-trailer-conformance
          path: lab/dotnet_http_listener_trailer_probe/artifacts
          if-no-files-found: warn
          retention-days: 30
