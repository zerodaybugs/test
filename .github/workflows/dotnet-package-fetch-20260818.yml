name: Fetch pinned public .NET packages 20260818

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/dotnet-package-fetch-20260818.yml'
      - 'tooling/dotnet-package-fetch/trigger.txt'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dotnet-package-fetch-20260818-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dotnet-package-fetch-20260818

      - name: Download pinned public packages
        shell: bash
        run: |
          set -Eeuo pipefail
          out='tooling/dotnet-package-fetch/packages'
          rm -rf "$out"
          mkdir -p "$out"
          fetch() {
            id="$1"; ver="$2"; lower="$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]')"
            url="https://api.nuget.org/v3-flatcontainer/${lower}/${ver}/${lower}.${ver}.nupkg"
            curl --fail --location --retry 5 --retry-all-errors --output "$out/${id}.${ver}.nupkg" "$url"
          }
          for id in \
            Microsoft.IdentityModel.Abstractions \
            Microsoft.IdentityModel.Logging \
            Microsoft.IdentityModel.Tokens \
            Microsoft.IdentityModel.JsonWebTokens \
            Microsoft.IdentityModel.Protocols \
            Microsoft.IdentityModel.Protocols.OpenIdConnect \
            System.IdentityModel.Tokens.Jwt; do
            fetch "$id" 8.22.0
          done
          fetch Microsoft.AspNetCore.Authentication.Negotiate 10.0.10
          fetch Microsoft.AspNetCore.Authentication.Negotiate 10.0.11
          (cd "$out" && sha256sum *.nupkg | sort > SHA256SUMS.txt)
          python3 - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path('tooling/dotnet-package-fetch/packages')
          rows=[]
          for f in sorted(p.glob('*.nupkg')):
              rows.append({'name':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          (p/'MANIFEST.json').write_text(json.dumps({'source':'nuget-v3-flatcontainer','files':rows},indent=2)+'\n')
          PY

      - name: Upload package bundle
        uses: actions/upload-artifact@v4
        with:
          name: pinned-dotnet-packages-20260818
          path: tooling/dotnet-package-fetch/packages
          if-no-files-found: error
          retention-days: 7

      - name: Commit fetched packages
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/dotnet-package-fetch/packages
          git commit -m 'tooling: fetch pinned public .NET packages' || true
          git push origin HEAD:agent/dotnet-package-fetch-20260818
