name: Export official .NET SDK 10.0.302

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/dotnet-sdk-10.0.302-export-20260819.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official SDK and verify release-metadata checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          sdk='dotnet-sdk-10.0.302-linux-x64.tar.gz'
          metadata='https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json'
          curl --fail --location --retry 5 --retry-all-errors -o out/releases.json "$metadata"
          python3 - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('out')
          target = 'dotnet-sdk-10.0.302-linux-x64.tar.gz'
          data = json.loads((root/'releases.json').read_text())
          matches = []
          def walk(value):
              if isinstance(value, dict):
                  if value.get('name') == target and value.get('hash') and value.get('url'):
                      matches.append(value)
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(data)
          if len(matches) != 1:
              raise SystemExit(f'expected one release-metadata match, got {len(matches)}')
          m = matches[0]
          (root/'EXPECTED_SHA512.txt').write_text(m['hash'].lower()+'\n')
          (root/'SOURCE_URL.txt').write_text(m['url']+'\n')
          urllib.request.urlretrieve(m['url'], root/target)
          PY
          expected="$(tr -d '\r\n ' < out/EXPECTED_SHA512.txt)"
          actual="$(sha512sum "out/$sdk" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          printf '{"sdk":"10.0.302","file":"%s","sha512":"%s","bytes":%s,"metadata":"%s"}\n' \
            "$sdk" "$actual" "$(stat -c %s "out/$sdk")" "$metadata" > out/MANIFEST.json

      - name: Upload verified SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-linux-x64
          path: out
          if-no-files-found: error
          retention-days: 7
