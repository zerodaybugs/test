name: Export official .NET SDK 10.0.302

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/dotnet-sdk-10.0.302-export-20260819.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official SDK and verify checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          sdk='dotnet-sdk-10.0.302-linux-x64.tar.gz'
          base='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.302'
          curl --fail --location --retry 5 --retry-all-errors -o "out/$sdk" "$base/$sdk"
          curl --fail --location --retry 5 --retry-all-errors -o out/sha512.txt "$base/sha512.txt"
          expected="$(awk -v f="$sdk" '$2==f {print $1}' out/sha512.txt)"
          actual="$(sha512sum "out/$sdk" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          printf '{"sdk":"10.0.302","file":"%s","sha512":"%s","bytes":%s}\n' \
            "$sdk" "$actual" "$(stat -c %s "out/$sdk")" > out/MANIFEST.json

      - name: Upload verified SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-linux-x64
          path: out
          if-no-files-found: error
          retention-days: 7
