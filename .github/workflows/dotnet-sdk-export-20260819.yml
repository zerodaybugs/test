name: Export official .NET SDK 10.0.400 20260819

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/dotnet-sdk-export-20260819.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-sdk-export-20260819-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dotnet-package-fetch-20260818

      - name: Install exact official SDK into isolated directory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tooling/dotnet-sdk
          curl --fail --location --retry 5 --retry-all-errors \
            https://dot.net/v1/dotnet-install.sh \
            -o tooling/dotnet-sdk/dotnet-install.sh
          bash tooling/dotnet-sdk/dotnet-install.sh \
            --version 10.0.400 \
            --install-dir tooling/dotnet-sdk/export \
            --no-path
          tooling/dotnet-sdk/export/dotnet --info | tee tooling/dotnet-sdk/DOTNET_INFO.txt
          tar --sort=name --mtime='UTC 2026-08-19' --owner=0 --group=0 --numeric-owner \
            -C tooling/dotnet-sdk -czf tooling/dotnet-sdk/dotnet-sdk-10.0.400-linux-x64.tar.gz export
          sha256sum tooling/dotnet-sdk/dotnet-sdk-10.0.400-linux-x64.tar.gz \
            > tooling/dotnet-sdk/dotnet-sdk-10.0.400-linux-x64.tar.gz.sha256

      - name: Upload SDK bundle
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.400-linux-x64
          path: |
            tooling/dotnet-sdk/dotnet-sdk-10.0.400-linux-x64.tar.gz
            tooling/dotnet-sdk/dotnet-sdk-10.0.400-linux-x64.tar.gz.sha256
            tooling/dotnet-sdk/DOTNET_INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
