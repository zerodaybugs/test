name: Export current .NET 10.0.11 security source snapshot

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/dotnet-security-source-snapshot-20260819.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clone exact public runtime tags and export selected security surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/dotnet/runtime.git runtime
          cd runtime
          git fetch --depth=1 origin tag v10.0.10 tag v10.0.11
          mkdir -p ../out/v10.0.10 ../out/v10.0.11 ../out/diffs
          paths=(
            src/libraries/System.Formats.Tar
            src/libraries/System.Private.CoreLib/src/System/IO/Enumeration/FileSystemEnumerator.Windows.cs
            src/coreclr/System.Private.CoreLib/src/System/Reflection/MdImport.cs
            src/coreclr/gc/handletable.inl
            src/coreclr/gc/unix/cgroup.cpp
            src/coreclr/jit/assertionprop.cpp
            src/coreclr/jit/forwardsub.cpp
            src/coreclr/jit/importer.cpp
            src/coreclr/jit/inductionvariableopts.cpp
            src/coreclr/jit/morph.cpp
            src/coreclr/vm/genmeth.cpp
            src/coreclr/vm/managedmdimport.cpp
            src/coreclr/vm/managedmdimport.hpp
            src/coreclr/vm/threadstatics.cpp
            src/coreclr/vm/threadstatics.h
            src/coreclr/vm/threadsuspend.cpp
            src/libraries/System.Runtime.InteropServices
          )
          for tag in v10.0.10 v10.0.11; do
            git archive "$tag" "${paths[@]}" | tar -x -C "../out/$tag"
          done
          git diff --binary v10.0.10..v10.0.11 > ../out/diffs/v10.0.10-to-v10.0.11-full.patch
          git diff --binary v10.0.10..v10.0.11 -- "${paths[@]}" \
            > ../out/diffs/v10.0.10-to-v10.0.11-selected.patch
          git log --format='%H%x09%ad%x09%s' --date=iso-strict v10.0.10..v10.0.11 \
            > ../out/diffs/COMMITS.tsv
          git rev-parse v10.0.10^{} > ../out/v10.0.10.commit
          git rev-parse v10.0.11^{} > ../out/v10.0.11.commit
          cd ..
          (cd out && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload public source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-10.0.11-security-source-snapshot-20260819
          path: out
          if-no-files-found: error
          retention-days: 7
