name: Export public .NET security source snapshots

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/dotnet-security-source-snapshot-20260819.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact public runtime tags
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/dotnet/runtime.git runtime
          cd runtime
          git fetch --depth=1 origin tag v10.0.9 tag v10.0.10
          mkdir -p ../out/v10.0.9 ../out/v10.0.10 ../out/diffs
          for tag in v10.0.9 v10.0.10; do
            git archive "$tag" \
              src/libraries/System.Formats.Tar \
              src/libraries/System.Security.Cryptography.Xml \
              src/libraries/System.Security.Cryptography.Pkcs \
              src/libraries/System.Security.Cryptography.Encoding \
              | tar -x -C "../out/$tag"
          done
          git diff --binary v10.0.9..v10.0.10 -- \
            src/libraries/System.Formats.Tar \
            src/libraries/System.Security.Cryptography.Xml \
            src/libraries/System.Security.Cryptography.Pkcs \
            src/libraries/System.Security.Cryptography.Encoding \
            > ../out/diffs/v10.0.9-to-v10.0.10.patch
          git rev-parse v10.0.9^{} > ../out/v10.0.9.commit
          git rev-parse v10.0.10^{} > ../out/v10.0.10.commit
          cd ..
          (cd out && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload public source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-security-source-snapshot-20260819
          path: out
          if-no-files-found: error
          retention-days: 7
