name: WPF v10.0.11 TrueType Subsetter Source Snapshot

on:
  push:
    branches:
      - lab/dotnet-ttfdelta-static-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness repository
        uses: actions/checkout@v4

      - name: Fetch exact WPF servicing source
        run: |
          git clone --depth 1 --branch v10.0.11 https://github.com/dotnet/wpf.git wpf-v10.0.11
          test "$(git -C wpf-v10.0.11 describe --tags --exact-match)" = "v10.0.11"
          git -C wpf-v10.0.11 rev-parse HEAD | tee WPF_COMMIT.txt

      - name: Assemble focused source snapshot
        run: |
          set -euo pipefail
          root="wpf-v10.0.11/src/Microsoft.DotNet.Wpf/src/DirectWriteForwarder"
          mkdir -p snapshot/CPP/TrueTypeSubsetter
          cp -a "$root/CPP/TrueTypeSubsetter/TtfDelta" snapshot/CPP/TrueTypeSubsetter/
          cp "$root/CPP/TrueTypeSubsetter/truetype.cpp" snapshot/CPP/TrueTypeSubsetter/
          cp "$root/main.cpp" snapshot/
          find snapshot -type f -print0 | sort -z | xargs -0 sha256sum > snapshot/SHA256SUMS.txt
          find snapshot -type f | sort > snapshot/FILES.txt
          cp WPF_COMMIT.txt snapshot/

      - name: Produce mechanical audit inventory
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('snapshot')
          source_files = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.suffix.lower() in {'.c', '.cc', '.cpp', '.cxx', '.h', '.hpp'}
          )
          patterns = {
              'memcpy': re.compile(r'\bmemcpy\s*\('),
              'memmove': re.compile(r'\bmemmove\s*\('),
              'memset': re.compile(r'\bmemset\s*\('),
              'allocation': re.compile(r'\b(?:Mem_Alloc|Mem_ReAlloc|malloc|realloc|new\s*\[)\s*\('),
              'raw_index': re.compile(r'\[[^\]\n]+\]'),
              'unchecked_addition': re.compile(r'\b(?:uint16|uint32|int16|int32|ULONG|UINT|DWORD)\b[^;\n=]*=[^;\n]*\+[^;\n]*;'),
              'unchecked_multiplication': re.compile(r'\b(?:uint16|uint32|int16|int32|ULONG|UINT|DWORD|size_t)\b[^;\n=]*=[^;\n]*\*[^;\n]*;'),
              'safe_switch': re.compile(r'TTF_SAFE_CHECKS_ENABLED\s*\('),
              'read_generic': re.compile(r'\bRead(?:Generic(?:Repeat)?|Bytes|Word|Long)\s*\('),
              'write_generic': re.compile(r'\bWrite(?:Generic(?:Repeat)?|Bytes|Word|Long)\s*\('),
          }

          inventory = {
              'source_files': len(source_files),
              'patterns': {},
          }
          for name, pattern in patterns.items():
              matches = []
              for path in source_files:
                  text = path.read_text(encoding='utf-8', errors='replace')
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if pattern.search(line):
                          matches.append({
                              'file': str(path.relative_to(root)),
                              'line': line_no,
                              'text': line.strip(),
                          })
              inventory['patterns'][name] = matches

          pathlib.Path('snapshot/AUDIT_INVENTORY.json').write_text(
              json.dumps(inventory, indent=2), encoding='utf-8')
          PY

      - name: Archive focused source snapshot
        run: |
          tar -czf wpf-v10.0.11-ttfdelta-source-snapshot.tar.gz snapshot
          sha256sum wpf-v10.0.11-ttfdelta-source-snapshot.tar.gz > wpf-v10.0.11-ttfdelta-source-snapshot.tar.gz.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wpf-v10.0.11-ttfdelta-source-snapshot
          path: |
            wpf-v10.0.11-ttfdelta-source-snapshot.tar.gz
            wpf-v10.0.11-ttfdelta-source-snapshot.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
