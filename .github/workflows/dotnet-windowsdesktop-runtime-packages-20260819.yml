name: Export official .NET 10 WindowsDesktop runtime packages

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/dotnet-windowsdesktop-runtime-packages-20260819.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download exact official NuGet runtime packs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          fetch() {
            id="$1"; ver="$2"; lower="$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]')"
            url="https://api.nuget.org/v3-flatcontainer/${lower}/${ver}/${lower}.${ver}.nupkg"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "out/${id}.${ver}.nupkg" "$url"
          }
          for ver in 10.0.10 10.0.11; do
            fetch Microsoft.WindowsDesktop.App.Runtime.win-x64 "$ver"
            fetch Microsoft.WindowsDesktop.App.Runtime.win-x86 "$ver"
            fetch Microsoft.NETCore.App.Runtime.win-x64 "$ver"
            fetch Microsoft.NETCore.App.Runtime.win-x86 "$ver"
          done
          (cd out && sha256sum *.nupkg | sort > SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('out')
          rows=[]
          for p in sorted(root.glob('*.nupkg')):
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  files=len(z.infolist())
              rows.append({
                  'name':p.name,
                  'bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'zip_crc_pass':bad is None,
                  'entries':files,
              })
          (root/'MANIFEST.json').write_text(json.dumps({'source':'nuget-v3-flatcontainer','packages':rows},indent=2)+'\n')
          PY

      - name: Upload exact runtime packs
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-windowsdesktop-runtime-packs-10.0.10-10.0.11
          path: out
          if-no-files-found: error
          retention-days: 7
