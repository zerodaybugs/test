name: Public Drift SDK package snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/drift-sdk-public-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Download exact public package and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/package
          cd evidence
          npm config set registry https://registry.npmjs.org/
          npm view @drift-labs/sdk@2.163.0-beta.13 --json > NPM_METADATA.json
          npm pack @drift-labs/sdk@2.163.0-beta.13 --pack-destination . > NPM_PACK_STDOUT.txt
          tarball="$(cat NPM_PACK_STDOUT.txt | tail -n 1)"
          tar -xzf "$tarball" -C package
          sha256sum "$tarball" > PACKAGE_TARBALL_SHA256.txt
          find package -type f -print0 | sort -z | xargs -0 sha256sum > PACKAGE_FILE_SHA256.txt
          printf 'package=@drift-labs/sdk\nversion=2.163.0-beta.13\npublic_chain_transactions=0\n' > SNAPSHOT_STATUS.txt

      - name: Upload exact public package snapshot
        uses: actions/upload-artifact@v4
        with:
          name: drift-sdk-2.163.0-beta.13-snapshot
          path: evidence
          if-no-files-found: error
          retention-days: 1
