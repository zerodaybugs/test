name: dual-chain-live-state

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query pinned Ethereum and Scroll state
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib, time

          CHAINS = {
            "ethereum": {
              "chain_id": 1,
              "eids": [30101, 30214],
              "endpoints": [
                "https://ethereum-rpc.publicnode.com",
                "https://eth.llamarpc.com",
                "https://rpc.ankr.com/eth",
                "https://cloudflare-eth.com",
              ],
            },
            "scroll": {
              "chain_id": 534352,
              "eids": [30101, 30214],
              "endpoints": [
                "https://scroll-rpc.publicnode.com",
                "https://rpc.scroll.io",
                "https://scroll.drpc.org",
              ],
            },
          }

          PRODUCTS = {
            "liquidETH": {
              "vault": "0xf0bb20865277aBd641a307eCe5Ee04E79073416C",
              "accountant": "0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198",
              "teller": "0x9AA79C84b79816ab920bBcE20f8f74557B514734",
              "queue": "0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0",
              "solver": "0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042",
              "manager": {
                "ethereum": "0xf9f7969C357ce6dfd7973098Ea0D57173592bCCa",
                "scroll": "0x227975088C28DBBb4b421c6d96781a53578f19a8",
              },
            },
            "liquidBTC": {
              "vault": "0x5f46d540b6eD704C3c8789105F30E075AA900726",
              "accountant": "0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0",
              "teller": "0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
              "queue": "0x77A2fd42F8769d8063F2E75061FC200014E41Edf",
              "solver": {
                "ethereum": "0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929",
                "scroll": "0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29",
              },
              "manager": "0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d",
            },
            "liquidUSD": {
              "vault": "0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C",
              "accountant": "0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7",
              "teller": "0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
              "queue": "0x38FC1BA73b7ED289955a07d9F11A85b6E388064A",
              "solver": {
                "ethereum": "0x92b10e02825986bAc2375BdACaFA3e89E3f612aA",
                "scroll": "0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610",
              },
              "manager": "0x7b57Ad1A0AA89583130aCfAD024241170D24C13C",
            },
          }

          S = {
            "version":"54fd4d50", "vault":"fbfa77cf", "boringVault":"f3b97784",
            "accountant":"4fb3ccc5", "authority":"bf7e214f", "owner":"8da5cb5b",
            "hook":"7f5a7c7b", "paused":"b187bd26", "shareLock":"9fdb11b6",
            "permissioned":"0511ef43", "assetData":"41fee44a", "getRate":"679aefce",
            "getRateSafe":"282a8700", "base":"5001f3b5", "decimals":"313ce567",
            "totalSupply":"18160ddd", "balanceOf":"70a08231", "name":"06fdde03",
            "symbol":"95d89b41", "deposit":"8b6099db", "depositPermit":"6495043a",
            "withdraw":"16762eed", "bridge":"05921740", "depositBridge":"f8b7b66d",
            "depositBridgePermit":"5bc52162", "bulkDeposit":"9d574420", "bulkWithdraw":"3e64ce99",
            "enter":"39d6ba32", "exit":"18457e61", "idToChains":"d1822216",
            "peers":"bb0b6a53", "outbound":"51c32a88", "inbound":"55b56c0c",
            "amountSent":"c272198d", "amountReceived":"703d3768", "endpoint":"5e280f11",
            "ONE_SHARE":"b7d122b5", "nonce":"affed0e0", "withdrawAssets":"aa5a0ffd",
            "getRequestIds":"ac33a273", "request":"6bb3b476", "requestPermit":"581b4920",
            "cancel":"4a2dc5e4", "replace":"a5672fd7", "selfRedeem":"72faf4a4",
            "selfRedeemMint":"8f386608", "adminRedeem":"5ff8a71f", "adminRedeemMint":"bc9961f7",
            "solve":"412638dc", "boringSolve":"67aa0416", "excess":"6b9f9fef",
            "canCall":"b7009613", "public":"2f47571f", "hasRole":"ea7ca276",
          }

          ATTACKER = "0x1111111111111111111111111111111111111111"

          def request(endpoint, method, params, retries=3):
            payload=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
            last=None
            for attempt in range(retries):
              try:
                req=urllib.request.Request(endpoint,data=payload,method="POST",headers={
                  "content-type":"application/json","user-agent":"veda-readonly-state/1.0"
                })
                with urllib.request.urlopen(req,timeout=30) as f:
                  body=json.loads(f.read().decode())
                if "error" in body: raise RuntimeError(body["error"])
                return body["result"]
              except Exception as exc:
                last=exc
                time.sleep(0.7*(attempt+1))
            raise last

          def select_endpoint(cfg):
            failures={}
            for ep in cfg["endpoints"]:
              try:
                cid=int(request(ep,"eth_chainId",[]),16)
                if cid!=cfg["chain_id"]: raise RuntimeError(f"wrong chain {cid}")
                return ep
              except Exception as exc: failures[ep]=repr(exc)
            raise RuntimeError(f"No endpoint: {failures}")

          def clean(v): return v.lower().removeprefix("0x")
          def aw(v): return clean(v).rjust(64,"0")
          def uw(v): return hex(v)[2:].rjust(64,"0")
          def b4w(v): return clean(v).ljust(64,"0")
          def decode_uint(raw): return int(raw,16)
          def decode_bool(raw): return bool(int(raw,16))
          def decode_address(raw): return "0x"+raw[-40:]
          def decode_words(raw):
            h=raw[2:]
            return [int(h[i:i+64],16) for i in range(0,len(h),64)]
          def decode_bytes32(raw): return "0x"+raw[-64:]
          def decode_string(raw):
            h=raw[2:]
            if not h: return ""
            try:
              off=int(h[:64],16)*2
              ln=int(h[off:off+64],16)
              return bytes.fromhex(h[off+64:off+64+ln*2]).decode(errors="replace")
            except Exception:
              try:
                return bytes.fromhex(h[:64]).rstrip(b"\x00").decode(errors="replace")
              except Exception: return raw
          def dynamic_array_length(raw):
            h=raw[2:]
            if len(h)<128: return None
            off=int(h[:64],16)*2
            return int(h[off:off+64],16)
          def safe(fn):
            try: return fn()
            except Exception as exc: return {"error":repr(exc)}

          result={"queried_at_unix":int(time.time()),"chains":{},"comparisons":{}}

          for chain_name,cfg in CHAINS.items():
            ep=select_endpoint(cfg)
            block=request(ep,"eth_blockNumber",[])
            block_int=int(block,16)
            def rpc(method,params): return request(ep,method,params)
            def call(to,data,from_addr=None):
              tx={"to":to,"data":data}
              if from_addr: tx["from"]=from_addr
              return rpc("eth_call",[tx,block])
            def c0(to,sel): return call(to,"0x"+sel)
            def c_addr(to,sel,arg): return call(to,"0x"+sel+aw(arg))
            def c_u32(to,sel,arg): return call(to,"0x"+sel+uw(arg))
            def code(addr): return rpc("eth_getCode",[addr,block])
            def native_balance(addr): return int(rpc("eth_getBalance",[addr,block]),16)
            def can(auth,user,target,sel):
              return decode_bool(call(auth,"0x"+S["canCall"]+aw(user)+aw(target)+b4w(sel)))
            def is_public(auth,target,sel):
              return decode_bool(call(auth,"0x"+S["public"]+aw(target)+b4w(sel)))
            def has_role(auth,user,role):
              return decode_bool(call(auth,"0x"+S["hasRole"]+aw(user)+uw(role)))
            def choose(value):
              if isinstance(value,dict): return value[chain_name]
              return value

            cout={"endpoint":ep,"block_hex":block,"block_number":block_int,"products":{}}
            for product_name,p in PRODUCTS.items():
              vault=p["vault"]; accountant=p["accountant"]; teller=p["teller"]
              queue=p["queue"]; solver=choose(p["solver"]); manager=choose(p["manager"])
              authority=safe(lambda:decode_address(c0(teller,S["authority"])))
              auth_addr=authority if isinstance(authority,str) else None
              base=safe(lambda:decode_address(c0(accountant,S["base"])))
              base_addr=base if isinstance(base,str) else None

              def code_info(addr):
                raw=code(addr)
                return {"bytes":(len(raw)-2)//2,"sha256":hashlib.sha256(bytes.fromhex(raw[2:])).hexdigest()}

              entry={
                "addresses":{"vault":vault,"accountant":accountant,"teller":teller,"queue":queue,"solver":solver,"manager":manager},
                "vault":{
                  "code":safe(lambda:code_info(vault)),
                  "name":safe(lambda:decode_string(c0(vault,S["name"]))),
                  "symbol":safe(lambda:decode_string(c0(vault,S["symbol"]))),
                  "decimals":safe(lambda:decode_uint(c0(vault,S["decimals"]))),
                  "total_supply":safe(lambda:decode_uint(c0(vault,S["totalSupply"]))),
                  "hook":safe(lambda:decode_address(c0(vault,S["hook"]))),
                  "authority":safe(lambda:decode_address(c0(vault,S["authority"]))),
                  "owner":safe(lambda:decode_address(c0(vault,S["owner"]))),
                  "native_balance":safe(lambda:native_balance(vault)),
                },
                "accountant":{
                  "code":safe(lambda:code_info(accountant)),
                  "version":safe(lambda:decode_string(c0(accountant,S["version"]))),
                  "base":base,
                  "get_rate":safe(lambda:decode_uint(c0(accountant,S["getRate"]))),
                  "get_rate_safe":safe(lambda:decode_uint(c0(accountant,S["getRateSafe"]))),
                  "authority":safe(lambda:decode_address(c0(accountant,S["authority"]))),
                  "owner":safe(lambda:decode_address(c0(accountant,S["owner"]))),
                },
                "teller":{
                  "code":safe(lambda:code_info(teller)),
                  "version":safe(lambda:decode_string(c0(teller,S["version"]))),
                  "vault":safe(lambda:decode_address(c0(teller,S["vault"]))),
                  "accountant":safe(lambda:decode_address(c0(teller,S["accountant"]))),
                  "authority":authority,
                  "owner":safe(lambda:decode_address(c0(teller,S["owner"]))),
                  "paused":safe(lambda:decode_bool(c0(teller,S["paused"]))),
                  "share_lock_period":safe(lambda:decode_uint(c0(teller,S["shareLock"]))),
                  "permissioned_transfers":safe(lambda:decode_bool(c0(teller,S["permissioned"]))),
                  "endpoint":safe(lambda:decode_address(c0(teller,S["endpoint"]))),
                  "native_balance":safe(lambda:native_balance(teller)),
                },
                "queue":{
                  "code":safe(lambda:code_info(queue)),
                  "version":safe(lambda:decode_string(c0(queue,S["version"]))),
                  "vault":safe(lambda:decode_address(c0(queue,S["boringVault"]))),
                  "accountant":safe(lambda:decode_address(c0(queue,S["accountant"]))),
                  "authority":safe(lambda:decode_address(c0(queue,S["authority"]))),
                  "owner":safe(lambda:decode_address(c0(queue,S["owner"]))),
                  "paused":safe(lambda:decode_bool(c0(queue,S["paused"]))),
                  "one_share":safe(lambda:decode_uint(c0(queue,S["ONE_SHARE"]))),
                  "nonce":safe(lambda:decode_uint(c0(queue,S["nonce"]))),
                  "request_count":safe(lambda:dynamic_array_length(c0(queue,S["getRequestIds"]))),
                },
                "solver":{
                  "code":safe(lambda:code_info(solver)),
                  "version":safe(lambda:decode_string(c0(solver,S["version"]))),
                  "authority":safe(lambda:decode_address(c0(solver,S["authority"]))),
                  "owner":safe(lambda:decode_address(c0(solver,S["owner"]))),
                  "excess_to_solver":safe(lambda:decode_bool(c0(solver,S["excess"]))),
                },
                "manager":{
                  "code":safe(lambda:code_info(manager)),
                  "version":safe(lambda:decode_string(c0(manager,S["version"]))),
                  "vault":safe(lambda:decode_address(c0(manager,S["vault"]))),
                  "authority":safe(lambda:decode_address(c0(manager,S["authority"]))),
                  "owner":safe(lambda:decode_address(c0(manager,S["owner"]))),
                  "paused":safe(lambda:decode_bool(c0(manager,S["paused"]))),
                },
                "base_token":{},"authorization":{},"lz":{},
              }

              if base_addr:
                entry["base_token"]={
                  "address":base_addr,
                  "code":safe(lambda:code_info(base_addr)),
                  "symbol":safe(lambda:decode_string(c0(base_addr,S["symbol"]))),
                  "decimals":safe(lambda:decode_uint(c0(base_addr,S["decimals"]))),
                  "vault_balance":safe(lambda:decode_uint(c_addr(base_addr,S["balanceOf"],vault))),
                  "teller_balance":safe(lambda:decode_uint(c_addr(base_addr,S["balanceOf"],teller))),
                  "teller_asset_data":safe(lambda:decode_words(c_addr(teller,S["assetData"],base_addr))),
                  "queue_withdraw_asset":safe(lambda:decode_words(c_addr(queue,S["withdrawAssets"],base_addr))),
                }

              if auth_addr:
                selectors={
                  "deposit":S["deposit"],"deposit_permit":S["depositPermit"],"withdraw":S["withdraw"],
                  "bridge":S["bridge"],"deposit_bridge":S["depositBridge"],
                  "deposit_bridge_permit":S["depositBridgePermit"],"bulk_deposit":S["bulkDeposit"],
                  "bulk_withdraw":S["bulkWithdraw"],"queue_request":S["request"],
                  "queue_request_permit":S["requestPermit"],"queue_cancel":S["cancel"],
                  "queue_replace":S["replace"],"self_redeem":S["selfRedeem"],
                  "self_redeem_mint":S["selfRedeemMint"],"admin_redeem":S["adminRedeem"],
                  "admin_redeem_mint":S["adminRedeemMint"],
                }
                targets={
                  "deposit":teller,"deposit_permit":teller,"withdraw":teller,"bridge":teller,
                  "deposit_bridge":teller,"deposit_bridge_permit":teller,"bulk_deposit":teller,
                  "bulk_withdraw":teller,"queue_request":queue,"queue_request_permit":queue,
                  "queue_cancel":queue,"queue_replace":queue,"self_redeem":solver,
                  "self_redeem_mint":solver,"admin_redeem":solver,"admin_redeem_mint":solver,
                }
                for k,sel in selectors.items():
                  target=targets[k]
                  entry["authorization"][k]={
                    "attacker_can_call":safe(lambda target=target,sel=sel:can(auth_addr,ATTACKER,target,sel)),
                    "public":safe(lambda target=target,sel=sel:is_public(auth_addr,target,sel)),
                  }
                entry["authorization"].update({
                  "teller_can_enter":safe(lambda:can(auth_addr,teller,vault,S["enter"])),
                  "teller_can_exit":safe(lambda:can(auth_addr,teller,vault,S["exit"])),
                  "queue_can_boring_solve":safe(lambda:can(auth_addr,queue,solver,S["boringSolve"])),
                  "solver_can_solve_queue":safe(lambda:can(auth_addr,solver,queue,S["solve"])),
                  "teller_role2":safe(lambda:has_role(auth_addr,teller,2)),
                  "teller_role3":safe(lambda:has_role(auth_addr,teller,3)),
                })

              for eid in cfg["eids"]:
                entry["lz"][str(eid)]={
                  "chain_words":safe(lambda eid=eid:decode_words(c_u32(teller,S["idToChains"],eid))),
                  "peer":safe(lambda eid=eid:decode_bytes32(c_u32(teller,S["peers"],eid))),
                  "outbound_words":safe(lambda eid=eid:decode_words(c_u32(teller,S["outbound"],eid))),
                  "inbound_words":safe(lambda eid=eid:decode_words(c_u32(teller,S["inbound"],eid))),
                  "amount_can_send":safe(lambda eid=eid:decode_words(c_u32(teller,S["amountSent"],eid))),
                  "amount_can_receive":safe(lambda eid=eid:decode_words(c_u32(teller,S["amountReceived"],eid))),
                }

              cout["products"][product_name]=entry
            result["chains"][chain_name]=cout

          for product in PRODUCTS:
            e=result["chains"]["ethereum"]["products"][product]
            s=result["chains"]["scroll"]["products"][product]
            er=e["accountant"]["get_rate_safe"]
            sr=s["accountant"]["get_rate_safe"]
            cmp={
              "ethereum_rate":er,"scroll_rate":sr,
              "ethereum_vault_decimals":e["vault"]["decimals"],
              "scroll_vault_decimals":s["vault"]["decimals"],
              "ethereum_base_symbol":e["base_token"].get("symbol"),
              "scroll_base_symbol":s["base_token"].get("symbol"),
              "ethereum_base_decimals":e["base_token"].get("decimals"),
              "scroll_base_decimals":s["base_token"].get("decimals"),
            }
            if isinstance(er,int) and isinstance(sr,int) and er:
              cmp["scroll_over_ethereum_ppm"]=(sr-er)*1_000_000//er
              cmp["higher_rate_chain"]="scroll" if sr>er else ("ethereum" if er>sr else "equal")
            result["comparisons"][product]=cmp

          text=json.dumps(result,indent=2,sort_keys=True)
          print("DUAL_CHAIN_SUMMARY")
          print(json.dumps({"blocks":{k:v["block_number"] for k,v in result["chains"].items()},"comparisons":result["comparisons"]},indent=2,sort_keys=True))
          with open("dual-chain-live-state.json","w",encoding="utf-8") as f: f.write(text+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dual-chain-live-state
          path: dual-chain-live-state.json
          retention-days: 1
