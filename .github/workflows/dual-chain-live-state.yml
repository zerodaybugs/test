name: alternate-teller-hook-state

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query alternate teller and hook state
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib, time

          CHAINS={
            "ethereum":{"id":1,"eps":["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com","https://rpc.ankr.com/eth"]},
            "scroll":{"id":534352,"eps":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"]},
          }
          PRODUCTS={
            "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","scope_teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","alternate_teller":"0x5c135e8eC99557b412b9B4492510dCfBD36066F5"},
            "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","scope_teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353","alternate_teller":"0x9E88C603307fdC33aA5F26E38b6f6aeF3eE92d48"},
            "liquidUSD":{"vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","scope_teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387","alternate_teller":"0x221Ea02d409074546265CCD1123050F4D498ef64"},
          }
          S={
            "vault":"fbfa77cf","accountant":"4fb3ccc5","authority":"bf7e214f","owner":"8da5cb5b",
            "hook":"7f5a7c7b","paused":"b187bd26","shareLock":"9fdb11b6","depositNonce":"de35f5cb",
            "depositCap":"dbd5edc7","assetData":"41fee44a","base":"5001f3b5","getRateSafe":"282a8700",
            "deposit":"8b6099db","depositPermit":"6495043a","withdraw":"16762eed","bulkDeposit":"9d574420",
            "bulkWithdraw":"3e64ce99","bridge":"05921740","enter":"39d6ba32","exit":"18457e61",
            "canCall":"b7009613","public":"2f47571f","hasRole":"ea7ca276","beforeData":"5c465430",
          }
          attacker="0x1111111111111111111111111111111111111111"

          def rq(ep,m,p):
            data=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode()
            r=urllib.request.Request(ep,data=data,method="POST",headers={"content-type":"application/json","user-agent":"readonly-hook-probe/1.0"})
            with urllib.request.urlopen(r,timeout=25) as f: out=json.loads(f.read().decode())
            if "error" in out: raise RuntimeError(out["error"])
            return out["result"]
          def select(c):
            bad={}
            for ep in c["eps"]:
              try:
                if int(rq(ep,"eth_chainId",[]),16)==c["id"]: return ep
              except Exception as e: bad[ep]=repr(e)
            raise RuntimeError(bad)
          def cl(x): return x.lower().removeprefix("0x")
          def aw(x): return cl(x).rjust(64,"0")
          def b4(x): return cl(x).ljust(64,"0")
          def uw(x): return hex(x)[2:].rjust(64,"0")
          def addr(x): return "0x"+x[-40:]
          def ui(x): return int(x,16)
          def bo(x): return bool(int(x,16))
          def words(x):
            h=x[2:]; return [int(h[i:i+64],16) for i in range(0,len(h),64)]
          def safe(f):
            try:return f()
            except Exception as e:return {"error":repr(e)}

          out={"at":int(time.time()),"chains":{}}
          for cn,c in CHAINS.items():
            ep=select(c); block=rq(ep,"eth_blockNumber",[])
            def call(to,data):return rq(ep,"eth_call",[{"to":to,"data":data},block])
            def c0(to,s):return call(to,"0x"+s)
            def ca(to,s,a):return call(to,"0x"+s+aw(a))
            def code(a):return rq(ep,"eth_getCode",[a,block])
            def can(auth,user,target,sel):return bo(call(auth,"0x"+S["canCall"]+aw(user)+aw(target)+b4(sel)))
            def pub(auth,target,sel):return bo(call(auth,"0x"+S["public"]+aw(target)+b4(sel)))
            def role(auth,user,n):return bo(call(auth,"0x"+S["hasRole"]+aw(user)+uw(n)))
            co={"endpoint":ep,"block":int(block,16),"products":{}}
            for pn,p in PRODUCTS.items():
              v=p["vault"]; a=p["accountant"]; st=p["scope_teller"]; alt=p["alternate_teller"]
              base=safe(lambda:addr(c0(a,S["base"])))
              auth=safe(lambda:addr(c0(alt,S["authority"])))
              autha=auth if isinstance(auth,str) else None
              raw=code(alt)
              e={
                "addresses":p,
                "vault_hook":safe(lambda:addr(c0(v,S["hook"]))),
                "accountant_rate":safe(lambda:ui(c0(a,S["getRateSafe"]))),
                "base":base,
                "alternate":{
                  "code_bytes":(len(raw)-2)//2,"code_sha256":hashlib.sha256(bytes.fromhex(raw[2:])).hexdigest(),
                  "vault":safe(lambda:addr(c0(alt,S["vault"]))),
                  "accountant":safe(lambda:addr(c0(alt,S["accountant"]))),
                  "authority":auth,"owner":safe(lambda:addr(c0(alt,S["owner"]))),
                  "paused":safe(lambda:bo(c0(alt,S["paused"]))),
                  "share_lock_period":safe(lambda:ui(c0(alt,S["shareLock"]))),
                  "deposit_nonce":safe(lambda:ui(c0(alt,S["depositNonce"]))),
                  "deposit_cap":safe(lambda:ui(c0(alt,S["depositCap"]))),
                  "attacker_before_transfer_data":safe(lambda:words(ca(alt,S["beforeData"],attacker))),
                },
                "scope":{
                  "share_lock_period":safe(lambda:ui(c0(st,S["shareLock"]))),
                  "deposit_nonce":safe(lambda:ui(c0(st,S["depositNonce"]))),
                  "authority":safe(lambda:addr(c0(st,S["authority"]))),
                },
                "authorization":{},
              }
              if isinstance(base,str):
                e["alternate"]["asset_data"]=safe(lambda:words(ca(alt,S["assetData"],base)))
                e["scope"]["asset_data"]=safe(lambda:words(ca(st,S["assetData"],base)))
              if autha:
                for name,sel in {"deposit":S["deposit"],"deposit_permit":S["depositPermit"],"withdraw":S["withdraw"],"bulk_deposit":S["bulkDeposit"],"bulk_withdraw":S["bulkWithdraw"],"bridge":S["bridge"]}.items():
                  e["authorization"][name]={"attacker_can_call":safe(lambda sel=sel:can(autha,attacker,alt,sel)),"public":safe(lambda sel=sel:pub(autha,alt,sel))}
                e["authorization"].update({
                  "alternate_can_enter":safe(lambda:can(autha,alt,v,S["enter"])),
                  "alternate_can_exit":safe(lambda:can(autha,alt,v,S["exit"])),
                  "role2":safe(lambda:role(autha,alt,2)),"role3":safe(lambda:role(autha,alt,3)),
                })
              co["products"][pn]=e
            out["chains"][cn]=co
          text=json.dumps(out,indent=2,sort_keys=True)
          print("ALT_TELLER_SUMMARY")
          for cn,c in out["chains"].items():
            for pn,e in c["products"].items():
              print(cn,pn,json.dumps({"hook":e["vault_hook"],"lock":e["alternate"]["share_lock_period"],"nonce":e["alternate"]["deposit_nonce"],"asset":e["alternate"].get("asset_data"),"auth":e["authorization"]},sort_keys=True))
          open("alternate-teller-hook-state.json","w").write(text+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alternate-teller-hook-state
          path: alternate-teller-hook-state.json
          retention-days: 1
