name: encrypted-b2-uniswap-blockscout-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-b2-uniswap-blockscout-gate.yml'
      - 'security/b2_uniswap_blockscout_gate.js'
      - 'security/snapshot_public.pem'
      - 'security/b2-blockscout-trigger.txt'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2
      - name: Execute read-only Blockscout/RPC gate
        run: |
          set -euo pipefail
          rm -rf b2-blockscout-gate b2-blockscout-upload
          mkdir -p b2-blockscout-gate b2-blockscout-upload
          node security/b2_uniswap_blockscout_gate.js > b2-blockscout-gate/execution.stdout 2> b2-blockscout-gate/execution.stderr
          sha256sum b2-blockscout-gate/* | sort > b2-blockscout-gate/SHA256SUMS.txt
          tar -czf b2-blockscout-gate.tar.gz b2-blockscout-gate
      - name: Encrypt before upload
        run: |
          set -euo pipefail
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in b2-blockscout-gate.tar.gz -out b2-blockscout-upload/b2-blockscout-gate.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" b2-blockscout-upload/b2-blockscout-gate.enc | awk '{print $2}' > b2-blockscout-upload/b2-blockscout-gate.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/snapshot_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key-material.txt -out b2-blockscout-upload/key-material.enc
          sha256sum b2-blockscout-upload/* > b2-blockscout-upload/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > b2-blockscout-upload/FORMAT.txt
          rm -rf b2-blockscout-gate b2-blockscout-gate.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-b2-uniswap-blockscout-gate
          path: b2-blockscout-upload/
          if-no-files-found: warn
          retention-days: 2
