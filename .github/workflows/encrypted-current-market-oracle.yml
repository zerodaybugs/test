name: encrypted-current-market-oracle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-current-market-oracle.yml'
      - 'security/current_market_oracle_gate.js'
      - 'security/current_market_oracle_public.pem'
      - 'security/current-market-oracle-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ethereum
            chain: ethereum
            rpcs: 'https://ethereum-rpc.publicnode.com,https://eth.llamarpc.com,https://eth.drpc.org,https://1rpc.io/eth'
            factories: '0xC53aB74EeB5E818147eb6d06134d81D3AC810987:24696192,0xc1E9640F04B802Bbf0B02a4e9Fe394039AbE8B59:24883366'
          - label: arbitrum
            chain: arbitrum
            rpcs: 'https://arbitrum-one-rpc.publicnode.com,https://arb1.arbitrum.io/rpc,https://1rpc.io/arb'
            factories: '0x18b8A9433dBefcd15370F10a75e28149bcc2e301:443718623,0xcaF2632BdB12Aa20b17f3E80CeAF9781b4aD4F38:452661450'
          - label: base
            chain: base
            rpcs: 'https://base-rpc.publicnode.com,https://mainnet.base.org,https://1rpc.io/base'
            factories: '0xa6875Af7a45BEf941e484b59C149E5C1772DE643:43603595,0x08c50Bd46992d35694208eC3Cf1f1EDcE38f5fd1:44722441'
          - label: bnb
            chain: bsc
            rpcs: 'https://bsc-rpc.publicnode.com,https://bsc-dataseed.binance.org,https://1rpc.io/bnb'
            factories: '0xdffE6De6de1dB8e1B5Ce77D3222eba401C2573b5:87654021,0x96839e9B0482BfFA7e129Ce9FEEFCeb1e895fC2B:87654021,0x4a34b4cAaA6AD23B95d6ec6394472fbB857eB064:92629573,0x22105089AFC8F35D55a9Efb19785fd350ADdd7C3:92629573'
          - label: b2
            chain: b2
            rpcs: 'https://rpc.bsquared.network,https://223.rpc.thirdweb.com'
            factories: '0x33931f3898EfB9A42B0D7CFfa9bb50A566A6b421:30415006,0x5BA2d33fB50d08D7755787E729183FedD6a3F3e7:31535305'
          - label: berachain
            chain: berachain
            rpcs: 'https://rpc.berachain.com'
            factories: '0x4BC4F8f9B212B5a3F9f7Eeb35Ae1A91902670F7f:18489300,0x2A15CC106bCa1Ee17a411d77A9C53eC3509d47C2:19609794'
          - label: pharos
            chain: pharos
            rpcs: 'https://rpc.pharos.xyz'
            factories: '0xEDC206E67eAc5C949c0a90A02E29B4b2791c8395:5278169'
          - label: xlayer
            chain: xlayer
            rpcs: 'https://rpc.xlayer.tech,https://mainnet.xlayer-rpc.com,https://xlayer.drpc.org'
            factories: '0x3d2C215DE72877c3611cD0A9D8d69f60f1a5dB93:57465452'
          - label: hyperevm
            chain: hyperevm
            rpcs: 'https://rpc.hyperliquid.xyz/evm,https://rpc.nodeflare.app/hl/public'
            factories: '0xC1Ce945e55506B384daDDEf48FA5A78554560ad3:15997130'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund ethers@5.7.2 @defillama/sdk@5.0.219
      - name: Run read-only inventory
        env:
          LABEL: ${{ matrix.label }}
          CHAIN: ${{ matrix.chain }}
          RPCS: ${{ matrix.rpcs }}
          FACTORIES: ${{ matrix.factories }}
        shell: bash
        run: |
          set +e
          OUT="current-market-oracle-${LABEL}"
          rm -rf "$OUT" encrypted-current-market-oracle
          mkdir -p "$OUT" encrypted-current-market-oracle
          node security/current_market_oracle_gate.js > "$OUT/execution.stdout" 2> "$OUT/execution.stderr"
          status=$?
          printf '%s\n' "$status" > "$OUT/EXIT_CODE.txt"
          find "$OUT" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          tar -czf evidence.tar.gz "$OUT"
          exit 0
      - name: Encrypt output
        shell: bash
        run: |
          set -euo pipefail
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in evidence.tar.gz -out encrypted-current-market-oracle/evidence.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-current-market-oracle/evidence.enc | awk '{print $2}' > encrypted-current-market-oracle/evidence.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/current_market_oracle_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key-material.txt -out encrypted-current-market-oracle/key-material.enc
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-current-market-oracle/FORMAT.txt
          sha256sum encrypted-current-market-oracle/* > encrypted-current-market-oracle/CIPHERTEXT_SHA256SUMS.txt
          rm -rf current-market-oracle-* evidence.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-current-market-oracle-${{ matrix.label }}
          path: encrypted-current-market-oracle/
          if-no-files-found: error
          retention-days: 3
