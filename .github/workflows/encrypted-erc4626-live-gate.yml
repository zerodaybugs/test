name: encrypted-erc4626-live-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-erc4626-live-gate.yml'
      - 'security/erc4626_live_gate.js'
      - 'security/current_market_oracle_public.pem'
      - 'security/erc4626-live-trigger.txt'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2
      - name: Execute read-only ERC4626 live gate
        shell: bash
        run: |
          set +e
          rm -rf erc4626-live-gate encrypted-erc4626-live-gate
          mkdir -p erc4626-live-gate encrypted-erc4626-live-gate
          node security/erc4626_live_gate.js > erc4626-live-gate/execution.stdout 2> erc4626-live-gate/execution.stderr
          status=$?
          printf '%s\n' "$status" > erc4626-live-gate/EXIT_CODE.txt
          find erc4626-live-gate -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > erc4626-live-gate/SHA256SUMS.txt
          tar -czf erc4626-live-gate.tar.gz erc4626-live-gate
          exit 0
      - name: Encrypt output
        shell: bash
        run: |
          set -euo pipefail
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in erc4626-live-gate.tar.gz -out encrypted-erc4626-live-gate/evidence.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-erc4626-live-gate/evidence.enc | awk '{print $2}' > encrypted-erc4626-live-gate/evidence.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/current_market_oracle_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key-material.txt -out encrypted-erc4626-live-gate/key-material.enc
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-erc4626-live-gate/FORMAT.txt
          sha256sum encrypted-erc4626-live-gate/* > encrypted-erc4626-live-gate/CIPHERTEXT_SHA256SUMS.txt
          rm -rf erc4626-live-gate erc4626-live-gate.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-erc4626-live-gate
          path: encrypted-erc4626-live-gate/
          if-no-files-found: error
          retention-days: 3
