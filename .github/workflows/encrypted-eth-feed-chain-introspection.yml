name: encrypted-eth-feed-chain-introspection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-eth-feed-chain-introspection.yml'
      - 'security/eth_feed_chain_introspection.js'
      - 'security/eth_inventory_public.pem'
      - 'security/eth-feed-chain-trigger.txt'

permissions:
  contents: read

jobs:
  introspection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2
      - name: Execute read-only feed-chain introspection
        run: |
          set -o pipefail
          rm -rf feed-evidence encrypted-output
          mkdir -p feed-evidence encrypted-output
          node security/eth_feed_chain_introspection.js > feed-evidence/EXECUTION.stdout 2> feed-evidence/EXECUTION.stderr
          sha256sum feed-evidence/* | sort > feed-evidence/SHA256SUMS.txt
          tar -czf feed-evidence.tar.gz feed-evidence
      - name: Encrypt before upload
        if: always()
        run: |
          set -euo pipefail
          test -f feed-evidence.tar.gz || tar -czf feed-evidence.tar.gz feed-evidence || true
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in feed-evidence.tar.gz -out encrypted-output/evidence.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-output/evidence.enc | awk '{print $2}' > encrypted-output/evidence.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/eth_inventory_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key-material.txt -out encrypted-output/key-material.enc
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-output/FORMAT.txt
          sha256sum encrypted-output/* | sort > encrypted-output/CIPHERTEXT_SHA256SUMS.txt
          rm -rf feed-evidence feed-evidence.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-eth-feed-chain-introspection
          path: encrypted-output/
          if-no-files-found: error
          retention-days: 2
