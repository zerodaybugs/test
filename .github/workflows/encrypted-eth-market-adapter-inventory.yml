name: encrypted-eth-market-adapter-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-eth-market-adapter-inventory.yml'
      - 'security/eth_market_adapter_inventory.js'
      - 'security/eth_inventory_public.pem'
      - 'security/eth-market-adapter-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund ethers@5.7.2 @defillama/sdk@5.0.219
      - name: Execute read-only inventory
        run: |
          set -o pipefail
          rm -rf evidence encrypted-output
          mkdir -p evidence encrypted-output
          node security/eth_market_adapter_inventory.js > evidence/EXECUTION.stdout 2> evidence/EXECUTION.stderr
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt
          tar -czf evidence.tar.gz evidence
      - name: Encrypt before upload
        if: always()
        run: |
          set -euo pipefail
          test -f evidence.tar.gz || tar -czf evidence.tar.gz evidence || true
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in evidence.tar.gz -out encrypted-output/evidence.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-output/evidence.enc | awk '{print $2}' > encrypted-output/evidence.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/eth_inventory_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key-material.txt -out encrypted-output/key-material.enc
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-output/FORMAT.txt
          sha256sum encrypted-output/* | sort > encrypted-output/CIPHERTEXT_SHA256SUMS.txt
          rm -rf evidence evidence.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-eth-market-adapter-inventory
          path: encrypted-output/
          if-no-files-found: error
          retention-days: 2
