name: Encrypted EVM proxy initialization snapshot

on:
  push:
    branches: [research/encrypted-evm-proxy-init-snapshot-20260724]
    paths:
      - '.github/workflows/encrypted-evm-proxy-init-snapshot.yml'
      - 'research/encrypted_evm_proxy_snapshot/**'
      - 'ci/encrypted-evm-proxy-init-snapshot.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-evm-proxy-init-snapshot.yml'
      - 'research/encrypted_evm_proxy_snapshot/**'
      - 'ci/encrypted-evm-proxy-init-snapshot.trigger'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned selector dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pycryptodome==3.23.0'
      - name: Run read-only multi-chain snapshot
        shell: bash
        env:
          PRIVATE_OUT: private_out
        run: |
          set -euo pipefail
          rm -rf private_out public_out
          mkdir -p private_out public_out
          python research/encrypted_evm_proxy_snapshot/snapshot.py | tee public_out/console.log
          python research/encrypted_evm_proxy_snapshot/signer_snapshot.py | tee -a public_out/console.log
          python research/encrypted_evm_proxy_snapshot/executor_snapshot.py | tee -a public_out/console.log
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "mode=public-chain read-only eth_call and eth_get*"
            echo "signed_transactions=0"
            echo "broadcast_transactions=0"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          } > private_out/PROVENANCE.txt
          find private_out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > private_out/SHA256SUMS
          tar -C private_out -czf private-results.tar.gz .
      - name: Encrypt all detailed results to researcher-owned certificate
        shell: bash
        run: |
          set -euo pipefail
          openssl x509 \
            -in research/encrypted_evm_proxy_snapshot/recipient-cert.pem \
            -noout -subject -fingerprint -sha256 \
            > public_out/RECIPIENT_CERTIFICATE.txt
          openssl cms -encrypt -binary -aes256 \
            -in private-results.tar.gz \
            -outform DER \
            -out public_out/encrypted-results.cms \
            research/encrypted_evm_proxy_snapshot/recipient-cert.pem
          sha256sum public_out/encrypted-results.cms > public_out/encrypted-results.cms.sha256
          openssl cms -cmsout -inform DER -in public_out/encrypted-results.cms -print \
            > public_out/encrypted-results.cms.structure.txt
          rm -rf private_out private-results.tar.gz
          test -s public_out/encrypted-results.cms
          test ! -e private-results.tar.gz
          test ! -d private_out
      - name: Final public artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            git --version
            python --version
            openssl version
          } > public_out/ENVIRONMENT.txt
          find public_out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > public_out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-evm-proxy-init-snapshot-${{ github.run_id }}
          path: public_out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
