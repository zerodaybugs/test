name: encrypted-evm-readonly-snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-evm-snapshot.yml'
      - 'security/evm_readonly_snapshot.js'
      - 'security/snapshot_public.pem'
      - 'security/encrypted-snapshot-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal dependency
        shell: bash
        run: npm install --no-audit --no-fund ethers@5.7.2

      - name: Execute read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf encrypted-evidence encrypted-upload
          mkdir -p encrypted-evidence encrypted-upload
          node security/evm_readonly_snapshot.js > encrypted-evidence/execution.stdout 2> encrypted-evidence/execution.stderr
          sha256sum encrypted-evidence/* | sort > encrypted-evidence/SHA256SUMS.txt
          tar -czf snapshot.tar.gz encrypted-evidence

      - name: Encrypt snapshot before upload
        shell: bash
        run: |
          set -euo pipefail
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in snapshot.tar.gz -out encrypted-upload/snapshot.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-upload/snapshot.enc | awk '{print $2}' > encrypted-upload/snapshot.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/snapshot_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key-material.txt -out encrypted-upload/key-material.enc
          sha256sum encrypted-upload/snapshot.enc encrypted-upload/key-material.enc encrypted-upload/snapshot.hmac \
            > encrypted-upload/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-upload/FORMAT.txt
          rm -rf encrypted-evidence snapshot.tar.gz key-material.txt

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-evm-readonly-snapshot
          path: encrypted-upload/
          if-no-files-found: error
          retention-days: 2
