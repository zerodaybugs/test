name: encrypted-generic-b2-market-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-generic-b2-market-inventory.yml'
      - 'security/generic_b2_market_inventory.js'
      - 'security/generic_b2_public.pem'
      - 'security/generic-b2-market-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2

      - name: Build read-only market inventory
        shell: bash
        run: |
          set -o pipefail
          rm -rf b2-market-output encrypted-b2-market
          mkdir -p b2-market-output encrypted-b2-market
          sed -i 's/async function inspectMarket(provider, base, blockTag)/async function inspectMarket(provider, base, blockTag, blockTimestamp)/' security/generic_b2_market_inventory.js
          sed -i 's/maturity > blockTag/maturity > blockTimestamp/' security/generic_b2_market_inventory.js
          sed -i 's/inspectMarket(provider, base, blockNumber))/inspectMarket(provider, base, blockNumber, block.timestamp))/' security/generic_b2_market_inventory.js
          node security/generic_b2_market_inventory.js > b2-market-output/execution.stdout 2> b2-market-output/execution.stderr
          status=$?
          find b2-market-output -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > b2-market-output/SHA256SUMS.txt
          tar -czf market-inventory.tar.gz b2-market-output
          exit "$status"

      - name: Encrypt output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-b2-market
          if [ ! -f market-inventory.tar.gz ]; then
            tar -czf market-inventory.tar.gz b2-market-output || true
          fi
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in market-inventory.tar.gz -out encrypted-b2-market/market-inventory.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-b2-market/market-inventory.enc | awk '{print $2}' > encrypted-b2-market/market-inventory.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/generic_b2_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key-material.txt -out encrypted-b2-market/key-material.enc
          sha256sum encrypted-b2-market/* > encrypted-b2-market/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-b2-market/FORMAT.txt
          rm -rf b2-market-output market-inventory.tar.gz key-material.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-generic-b2-market-inventory
          path: encrypted-b2-market/
          if-no-files-found: error
          retention-days: 2
