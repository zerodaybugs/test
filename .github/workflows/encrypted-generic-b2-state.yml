name: encrypted-generic-b2-state

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-generic-b2-state.yml'
      - 'security/generic_b2_state.js'
      - 'security/generic_b2_public.pem'
      - 'security/generic-b2-trigger.txt'

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2

      - name: Collect read-only state
        shell: bash
        run: |
          set -o pipefail
          rm -rf b2-state-output encrypted-b2-state
          mkdir -p b2-state-output encrypted-b2-state
          node security/generic_b2_state.js > b2-state-output/execution.stdout 2> b2-state-output/execution.stderr
          status=$?
          find b2-state-output -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > b2-state-output/SHA256SUMS.txt
          tar -czf state.tar.gz b2-state-output
          exit "$status"

      - name: Encrypt output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-b2-state
          if [ ! -f state.tar.gz ]; then
            tar -czf state.tar.gz b2-state-output || true
          fi
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in state.tar.gz -out encrypted-b2-state/state.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-b2-state/state.enc | awk '{print $2}' > encrypted-b2-state/state.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/generic_b2_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key-material.txt -out encrypted-b2-state/key-material.enc
          sha256sum encrypted-b2-state/* > encrypted-b2-state/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-b2-state/FORMAT.txt
          rm -rf b2-state-output state.tar.gz key-material.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-generic-b2-state
          path: encrypted-b2-state/
          if-no-files-found: error
          retention-days: 2
