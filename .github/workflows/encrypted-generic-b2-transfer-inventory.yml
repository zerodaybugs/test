name: encrypted-generic-b2-transfer-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-generic-b2-transfer-inventory.yml'
      - 'security/generic_b2_transfer_inventory.js'
      - 'security/generic_b2_public.pem'
      - 'security/generic-b2-transfer-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2

      - name: Build read-only ERC20 transfer inventory
        shell: bash
        run: |
          set -o pipefail
          rm -rf b2-transfer-output encrypted-b2-transfer
          mkdir -p b2-transfer-output encrypted-b2-transfer
          node security/generic_b2_transfer_inventory.js > b2-transfer-output/execution.stdout 2> b2-transfer-output/execution.stderr
          status=$?
          find b2-transfer-output -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > b2-transfer-output/SHA256SUMS.txt
          tar -czf transfer-inventory.tar.gz b2-transfer-output
          exit "$status"

      - name: Encrypt output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-b2-transfer
          if [ ! -f transfer-inventory.tar.gz ]; then
            tar -czf transfer-inventory.tar.gz b2-transfer-output || true
          fi
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in transfer-inventory.tar.gz -out encrypted-b2-transfer/transfer-inventory.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-b2-transfer/transfer-inventory.enc | awk '{print $2}' > encrypted-b2-transfer/transfer-inventory.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/generic_b2_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key-material.txt -out encrypted-b2-transfer/key-material.enc
          sha256sum encrypted-b2-transfer/* > encrypted-b2-transfer/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-b2-transfer/FORMAT.txt
          rm -rf b2-transfer-output transfer-inventory.tar.gz key-material.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-generic-b2-transfer-inventory
          path: encrypted-b2-transfer/
          if-no-files-found: error
          retention-days: 2
