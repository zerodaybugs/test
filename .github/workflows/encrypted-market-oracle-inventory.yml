name: encrypted-market-oracle-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-market-oracle-inventory.yml'
      - 'security/market_oracle_inventory.js'
      - 'security/snapshot_public.pem'
      - 'security/encrypted-market-oracle-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: bnb-alpha
            rpcs: 'https://bsc-rpc.publicnode.com,https://bsc-dataseed.binance.org,https://1rpc.io/bnb'
            markets: '0xc43E48e8EA0658754446bCd32Bc6d91EBfD73C89,0x3ECaf35c5F107F24076Be1F08266347Ef0F2c8Cd,0x331910970E9999629083a83Dc282bB879F7a4e77,0xe01419D7fCe5deC5F358e04764283067d69D81cA,0x805B175109ADf0ECD2AB5fb21018F540EA10E8d3,0xaCfa81FB5b1b6Aa7A8E60f73B50C711AE2F3be8b'
          - label: ethereum-material
            rpcs: 'https://ethereum-rpc.publicnode.com,https://eth.llamarpc.com,https://eth.drpc.org,https://1rpc.io/eth'
            markets: '0xf61d02aE5D19fA11fC825dc565cFaf264720F6C4,0x776b9A6200c0F29b6C862E4D8E38a99AC3272110,0xC894b068d99376D6aBF8A9625667CAd2D6E5eaB7,0x1F5FeeF78D7186A718F779a4282CAD33d43825e5,0x38f35b56D4666013096B7AED555B82EaB13ac87a,0x598f6deCDf9b414F1A7EAD76307aADc8682a8c70,0x02d59E7C407CA565BACb0CDB1929d678786Eb2Af,0xBB9D063D37e07998317eCDcEc6Fc099ea034D60f,0xaf7560124faAe12D4378EC030b7644f16B370ccc,0x4036493e7c6635Cf0689E229b05DBAb85e5b25c3,0x4A640c87d048DBcDB1F27e1a5882fb7947446E7d,0x9d08e943828DA4BCc9681eda5d7e4D4994cC24b8'
          - label: base-material
            rpcs: 'https://base-rpc.publicnode.com,https://mainnet.base.org,https://1rpc.io/base'
            markets: '0xd9898A39e92CaA54733Da7A729e0080e1cBA3f45,0x4dCbe7FF6001Bf0A84b2EEE33077a7264b6E031a,0x8F95830b57117F775220a94af459FBB0a4F80A08'
          - label: arbitrum-material
            rpcs: 'https://arbitrum-one-rpc.publicnode.com,https://arb1.arbitrum.io/rpc,https://1rpc.io/arb'
            markets: '0x5462CfCD9616a1dca7B5dF13414FCC2634ceD893'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal dependency
        run: npm install --no-audit --no-fund ethers@5.7.2
      - name: Execute read-only market inventory
        env:
          LABEL: ${{ matrix.label }}
          RPCS: ${{ matrix.rpcs }}
          MARKETS: ${{ matrix.markets }}
        run: |
          set -euo pipefail
          rm -rf encrypted-market-evidence encrypted-market-upload
          mkdir -p encrypted-market-evidence encrypted-market-upload
          node security/market_oracle_inventory.js > encrypted-market-evidence/execution.stdout 2> encrypted-market-evidence/execution.stderr
          sha256sum encrypted-market-evidence/* | sort > encrypted-market-evidence/SHA256SUMS.txt
          tar -czf market-inventory.tar.gz encrypted-market-evidence
      - name: Encrypt before artifact upload
        run: |
          set -euo pipefail
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in market-inventory.tar.gz -out encrypted-market-upload/market-inventory.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-market-upload/market-inventory.enc | awk '{print $2}' > encrypted-market-upload/market-inventory.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/snapshot_public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key-material.txt -out encrypted-market-upload/key-material.enc
          sha256sum encrypted-market-upload/* > encrypted-market-upload/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-market-upload/FORMAT.txt
          rm -rf encrypted-market-evidence market-inventory.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-market-oracle-${{ matrix.label }}
          path: encrypted-market-upload/
          if-no-files-found: error
          retention-days: 2
