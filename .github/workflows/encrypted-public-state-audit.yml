name: encrypted public-state audit

on:
  pull_request:
    paths:
      - ".github/encrypted_public_state_audit.py"
      - ".github/workflows/encrypted-public-state-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pinned read-only matrix
        id: matrix
        continue-on-error: true
        run: python .github/encrypted_public_state_audit.py

      - name: Encrypt evidence before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d probe-output ]]; then
            mkdir -p probe-output
            printf '{"runner":"failed-before-output"}\n' > probe-output/runner-error.json
          fi
          tar -czf evidence.tar.gz probe-output
          openssl rand -hex 32 > evidence.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -pass file:evidence.key -in evidence.tar.gz -out evidence.tar.gz.enc
          cat > probe-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA7DlD6u2n57MeV2VdzHSa
          CMgGDKpz+kN6Jn2h62WCI0EJRZcmcbcjsYveW0UyqGh9/wMQVxtPNsS+LImEN5ts
          uvumMUBgxJ1hvFrbqszpTMQrq+v8/GeswHjh1I70cXhaYwdnPNUu7U7qsaKv4MtA
          wWwc/CW/85wMngXWgjHN2Gu/po9JTBrVPJ+NqKi7Oq3Ky35uRfzwUIoubE9kqfXl
          4gPu/urbYeFcJ68G0wxCm82R46ytA/bfZCm66Oi6PQPxeAJQNlnGrlhZAQcAnOGL
          qAXgjQmjd1wiYfCLihLsA1/Yb6hpYVoCVBvsDKDkfiaLlvKR2HhZYQLJZw57foDK
          O6f/QdBSPAFDRZU10aeX0dy6dUuKV7/vh/A4MggLoUe1b50qCnx1Nsv1+CGORW8X
          vFYoeroj8GylbBHL7BHZxkxChVa1lqoS0RWXr0v+qxXRiPmMdgogndMC2NdHmUi0
          wvsczfbuzhSLaG5YZT8qluOyofKwO5Ph/ghPOad8T3u1AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey probe-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in evidence.key -out evidence.key.enc
          mkdir encrypted-output
          mv evidence.tar.gz.enc evidence.key.enc encrypted-output/
          sha256sum encrypted-output/* > encrypted-output/cipher.sha256
          rm -rf probe-output evidence.tar.gz evidence.key probe-public.pem

      - name: Upload encrypted artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-public-state-evidence
          path: encrypted-output/
          if-no-files-found: error
          retention-days: 1

      - name: Propagate audit failure after evidence upload
        if: steps.matrix.outcome != 'success'
        run: exit 1
