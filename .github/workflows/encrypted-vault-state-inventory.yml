name: encrypted-vault-state-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-vault-state-inventory.yml'
      - 'security/vault_state_inventory.js'
      - 'security/snapshot_public.pem'
      - 'security/encrypted-vault-state-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: npm install --no-audit --no-fund ethers@5.7.2
      - name: Collect read-only state
        shell: bash
        run: |
          set -o pipefail
          rm -rf encrypted-vault-state encrypted-vault-upload
          mkdir -p encrypted-vault-state encrypted-vault-upload
          node security/vault_state_inventory.js > encrypted-vault-state/execution.stdout 2> encrypted-vault-state/execution.stderr
          status=$?
          find encrypted-vault-state -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > encrypted-vault-state/SHA256SUMS.txt
          tar -czf vault-state.tar.gz encrypted-vault-state
          exit "$status"
      - name: Encrypt output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-vault-upload
          if [ ! -f vault-state.tar.gz ]; then tar -czf vault-state.tar.gz encrypted-vault-state || true; fi
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in vault-state.tar.gz -out encrypted-vault-upload/vault-state.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" encrypted-vault-upload/vault-state.enc | awk '{print $2}' > encrypted-vault-upload/vault-state.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/snapshot_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key-material.txt -out encrypted-vault-upload/key-material.enc
          sha256sum encrypted-vault-upload/* > encrypted-vault-upload/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > encrypted-vault-upload/FORMAT.txt
          rm -rf encrypted-vault-state vault-state.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-vault-state-inventory
          path: encrypted-vault-upload/
          if-no-files-found: error
          retention-days: 2
