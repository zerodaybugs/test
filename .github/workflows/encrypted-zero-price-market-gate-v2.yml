name: encrypted-zero-price-market-gate-v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/encrypted-zero-price-market-gate-v2.yml'
      - 'security/zero_price_market_gate_entry.js'
      - 'security/zero_price_market_gate.js'
      - 'security/snapshot_public.pem'
      - 'security/zero-price-v2-trigger.txt'

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ethereum
            chain: ethereum
            rpcs: 'https://ethereum-rpc.publicnode.com,https://eth.llamarpc.com,https://eth.drpc.org,https://1rpc.io/eth'
            factories: '0xF2BDa87CA467eB90A1b68f824cB136baA68a8177:23430000,0x5b8B26a6734B5eABDBe6C5A19580Ab2D0424f027:23430000,0xc1E9640F04B802Bbf0B02a4e9Fe394039AbE8B59:24883366'
          - label: bnb
            chain: bsc
            rpcs: 'https://bsc-rpc.publicnode.com,https://bsc-dataseed.binance.org,https://1rpc.io/bnb'
            factories: '0x1401049368eD6AD8194f8bb7E41732c4620F170b:63100000,0xdffE6De6de1dB8e1B5Ce77D3222eba401C2573b5:63100000,0x4a34b4cAaA6AD23B95d6ec6394472fbB857eB064:92629573,0x22105089AFC8F35D55a9Efb19785fd350ADdd7C3:92629573'
          - label: base
            chain: base
            rpcs: 'https://base-rpc.publicnode.com,https://mainnet.base.org,https://1rpc.io/base'
            factories: '0xDA4aAF85Bb924B53DCc2DFFa9e1A9C2Ef97aCFDF:43289755,0x08c50Bd46992d35694208eC3Cf1f1EDcE38f5fd1:44722441'
          - label: arbitrum
            chain: arbitrum
            rpcs: 'https://arbitrum-one-rpc.publicnode.com,https://arb1.arbitrum.io/rpc,https://1rpc.io/arb'
            factories: '0xa7c93162962D050098f4BB44E88661517484C5EB:385228046,0x18b8A9433dBefcd15370F10a75e28149bcc2e301:385228046,0xcaF2632BdB12Aa20b17f3E80CeAF9781b4aD4F38:452661450'
          - label: berachain
            chain: berachain
            rpcs: 'https://rpc.berachain.com'
            factories: '0x2A15CC106bCa1Ee17a411d77A9C53eC3509d47C2:19609794'
          - label: b2
            chain: b2
            rpcs: 'https://rpc.bsquared.network,https://213.rpc.thirdweb.com'
            factories: '0x5BA2d33fB50d08D7755787E729183FedD6a3F3e7:31535305'
          - label: xlayer
            chain: xlayer
            rpcs: 'https://rpc.xlayer.tech,https://mainnet.xlayer-rpc.com,https://xlayer.drpc.org'
            factories: '0x3d2C215DE72877c3611cD0A9D8d69f60f1a5dB93:57465452'
          - label: pharos
            chain: pharos
            rpcs: 'https://rpc.pharos.xyz'
            factories: '0xEDC206E67eAc5C949c0a90A02E29B4b2791c8395:5278169'
          - label: hyperevm
            chain: hyperevm
            rpcs: 'https://rpc.hyperliquid.xyz/evm,https://rpc.nodeflare.app/hl/public'
            factories: '0xC1Ce945e55506B384daDDEf48FA5A78554560ad3:15997130'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund ethers@5.7.2 @defillama/sdk@5.0.219
      - name: Execute read-only zero-price gate
        env:
          LABEL: ${{ matrix.label }}
          CHAIN: ${{ matrix.chain }}
          RPCS: ${{ matrix.rpcs }}
          FACTORIES: ${{ matrix.factories }}
        run: |
          set -euo pipefail
          rm -rf zero-price-gate zero-price-upload
          mkdir -p zero-price-gate zero-price-upload
          node security/zero_price_market_gate_entry.js > zero-price-gate/execution.stdout 2> zero-price-gate/execution.stderr
          sha256sum zero-price-gate/* | sort > zero-price-gate/SHA256SUMS.txt
          tar -czf zero-price-gate.tar.gz zero-price-gate
      - name: Encrypt before upload
        run: |
          set -euo pipefail
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in zero-price-gate.tar.gz -out zero-price-upload/zero-price-gate.enc
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" zero-price-upload/zero-price-gate.enc | awk '{print $2}' > zero-price-upload/zero-price-gate.hmac
          openssl pkeyutl -encrypt -pubin -inkey security/snapshot_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key-material.txt -out zero-price-upload/key-material.enc
          sha256sum zero-price-upload/* > zero-price-upload/CIPHERTEXT_SHA256SUMS.txt
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > zero-price-upload/FORMAT.txt
          rm -rf zero-price-gate zero-price-gate.tar.gz key-material.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-zero-price-market-v2-${{ matrix.label }}
          path: zero-price-upload/
          if-no-files-found: warn
          retention-days: 2
