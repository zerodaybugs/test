name: Ephemeral encrypted Bucket Move runner v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ephemeral-private-bucket-move-v2.yml'

permissions:
  contents: read

jobs:
  private-bucket-move-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out public runner definition
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate one-time input certificate
        shell: bash
        run: bash .github/scripts/ephemeral-private-bucket-move-v2.sh prepare

      - name: Publish one-time input certificate
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-bucket-v2-input-certificate-${{ github.run_id }}
          path: |
            bucket_v2_public_metadata/input_certificate.pem
            bucket_v2_public_metadata/INPUT_CERTIFICATE_METADATA.txt
          if-no-files-found: error
          retention-days: 1

      - name: Receive, execute, and encrypt private payload
        id: private_run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash .github/scripts/ephemeral-private-bucket-move-v2.sh run
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload encrypted private result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-private-bucket-v2-result-${{ github.run_id }}
          path: |
            /tmp/private-bucket-v2-result/encrypted-result.cms
            /tmp/private-bucket-v2-result/ENCRYPTED_RESULT_SHA256.txt
            /tmp/private-bucket-v2-result/RESULT_STATUS.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce private result after encrypted upload
        if: always()
        shell: bash
        env:
          PRIVATE_STATUS: ${{ steps.private_run.outputs.status }}
        run: |
          set -euo pipefail
          test "$PRIVATE_STATUS" = '0'
