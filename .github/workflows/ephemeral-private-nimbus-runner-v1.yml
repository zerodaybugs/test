name: Ephemeral encrypted Nimbus local runner v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ephemeral-private-nimbus-runner-v1.yml'

permissions:
  contents: read

jobs:
  encrypted-local-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out public runner definition
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate run-bound input certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/nimbus-input public_metadata
          openssl req -x509 -newkey rsa:4096 -nodes -sha256 -days 1 \
            -subj "/CN=nimbus-input-${GITHUB_RUN_ID}" \
            -keyout /tmp/nimbus-input/private.pem \
            -out /tmp/nimbus-input/certificate.pem >/dev/null 2>&1
          chmod 600 /tmp/nimbus-input/private.pem
          cp /tmp/nimbus-input/certificate.pem public_metadata/input_certificate.pem
          openssl x509 -in /tmp/nimbus-input/certificate.pem \
            -noout -fingerprint -sha256 -subject -dates \
            > public_metadata/INPUT_CERTIFICATE_METADATA.txt
          uname -a > public_metadata/UNAME.txt
          openssl version -a > public_metadata/OPENSSL_VERSION.txt
          python3 --version > public_metadata/PYTHON_VERSION.txt

      - name: Publish one-time input certificate
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-input-certificate-${{ github.run_id }}
          path: public_metadata
          if-no-files-found: error
          retention-days: 1

      - name: Wait for run-bound encrypted payload
        id: inbox
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$HEAD_BRANCH"
          inbox=".tooling/ephemeral-private-runner/inbox/nimbus-v2-${GITHUB_RUN_ID}"
          remote='refs/remotes/nimbus-payload/head'
          found=false
          for attempt in $(seq 1 1800); do
            git fetch --quiet --no-tags --depth=1 \
              "https://github.com/${REPOSITORY}.git" \
              "+refs/heads/${HEAD_BRANCH}:${remote}" >/dev/null 2>&1 || true
            if git show "${remote}:${inbox}/READY" > /tmp/nimbus-input/READY 2>/dev/null; then
              mapfile -t parts < <(git ls-tree -r --name-only "$remote" -- "$inbox" \
                | grep -E '/part-[0-9]{4}$' | sort)
              if test "${#parts[@]}" -gt 0; then
                : > /tmp/nimbus-input/payload.cms.b64
                for part in "${parts[@]}"; do
                  git show "${remote}:${part}" >> /tmp/nimbus-input/payload.cms.b64
                done
                base64 --decode /tmp/nimbus-input/payload.cms.b64 > /tmp/nimbus-input/payload.cms
                expected="$(tr -d '[:space:]' < /tmp/nimbus-input/READY)"
                actual="$(sha256sum /tmp/nimbus-input/payload.cms | awk '{print $1}')"
                if test -s /tmp/nimbus-input/payload.cms && test "$actual" = "$expected"; then
                  printf '%s\n' "${#parts[@]}" > public_metadata/ENCRYPTED_PAYLOAD_PART_COUNT.txt
                  printf '%s  payload.cms\n' "$actual" > public_metadata/ENCRYPTED_PAYLOAD_SHA256.txt
                  found=true
                  break
                fi
              fi
            fi
            sleep 5
          done
          test "$found" = true
          printf 'payload_received=true\n' >> "$GITHUB_OUTPUT"

      - name: Decrypt and validate private payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/nimbus-payload /tmp/nimbus-result
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/nimbus-input/payload.cms \
            -recip /tmp/nimbus-input/certificate.pem \
            -inkey /tmp/nimbus-input/private.pem \
            -out /tmp/nimbus-input/payload.tar >/dev/null 2>&1
          python3 - <<'PY'
          import pathlib, tarfile
          src = pathlib.Path('/tmp/nimbus-input/payload.tar')
          dst = pathlib.Path('/tmp/nimbus-payload')
          with tarfile.open(src, 'r:*') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('empty payload')
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev():
                      raise SystemExit(f'unsafe payload member: {m.name}')
              tf.extractall(dst, members=members, filter='data')
          PY
          test -f /tmp/nimbus-payload/run.sh
          test -f /tmp/nimbus-payload/result_cert.pem
          test -f /tmp/nimbus-payload/MANIFEST.sha256
          (cd /tmp/nimbus-payload && sha256sum -c MANIFEST.sha256) \
            > /tmp/nimbus-result/PAYLOAD_INTEGRITY.log 2>&1
          chmod 700 /tmp/nimbus-payload/run.sh

      - name: Execute private payload without plaintext logging
        id: private_run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          umask 077
          mkdir -p /tmp/nimbus-payload/results /tmp/nimbus-result
          (cd /tmp/nimbus-payload && \
            PRIVATE_RUNNER_RESULTS=/tmp/nimbus-payload/results \
            PRIVATE_RUNNER_PUBLIC_METADATA="$GITHUB_WORKSPACE/public_metadata" \
            bash ./run.sh) > /tmp/nimbus-result/PRIVATE_RUN.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/nimbus-result/PRIVATE_RUN_STATUS.txt
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Encrypt all private output
        if: always() && steps.inbox.outputs.payload_received == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/nimbus-result/bundle/public_metadata encrypted_output
          test -f /tmp/nimbus-result/PRIVATE_RUN_STATUS.txt \
            || printf '125\n' > /tmp/nimbus-result/PRIVATE_RUN_STATUS.txt
          cp /tmp/nimbus-result/PRIVATE_RUN_STATUS.txt /tmp/nimbus-result/bundle/
          cp /tmp/nimbus-result/PRIVATE_RUN.log /tmp/nimbus-result/bundle/ 2>/dev/null || true
          cp /tmp/nimbus-result/PAYLOAD_INTEGRITY.log /tmp/nimbus-result/bundle/ 2>/dev/null || true
          cp -a public_metadata/. /tmp/nimbus-result/bundle/public_metadata/
          if test -d /tmp/nimbus-payload/results; then
            cp -a /tmp/nimbus-payload/results/. /tmp/nimbus-result/bundle/
          fi
          (cd /tmp/nimbus-result/bundle && \
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -cf /tmp/nimbus-result/result.tar -C /tmp/nimbus-result/bundle .
          openssl cms -encrypt -binary -aes256 \
            -in /tmp/nimbus-result/result.tar -outform DER \
            -out encrypted_output/encrypted-result.cms \
            /tmp/nimbus-payload/result_cert.pem >/dev/null 2>&1
          sha256sum encrypted_output/encrypted-result.cms \
            > encrypted_output/ENCRYPTED_RESULT_SHA256.txt
          rm -rf /tmp/nimbus-payload /tmp/nimbus-input /tmp/nimbus-result/result.tar /tmp/nimbus-result/bundle

      - name: Upload only encrypted private result
        if: always() && steps.inbox.outputs.payload_received == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-nimbus-result-${{ github.run_id }}
          path: encrypted_output
          if-no-files-found: error
          retention-days: 1

      - name: Enforce private result after encrypted upload
        if: always() && steps.inbox.outputs.payload_received == 'true'
        shell: bash
        env:
          PRIVATE_STATUS: ${{ steps.private_run.outputs.status }}
        run: |
          set -euo pipefail
          test "$PRIVATE_STATUS" = '0'

# trigger: psx1-a3f7-20260804
