name: Ephemeral encrypted Nimbus local runner v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ephemeral-private-nimbus-runner-v1.yml'

permissions:
  contents: read

jobs:
  encrypted-local-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate run-bound certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/nimbus public_metadata encrypted_output
          openssl req -x509 -newkey rsa:4096 -nodes -sha256 -days 1 \
            -subj "/CN=nimbus-${GITHUB_RUN_ID}" \
            -keyout /tmp/nimbus/input.key -out /tmp/nimbus/input.crt >/dev/null 2>&1
          cp /tmp/nimbus/input.crt public_metadata/input_certificate.pem
          openssl x509 -in /tmp/nimbus/input.crt -noout -fingerprint -sha256 -subject -dates \
            > public_metadata/INPUT_CERTIFICATE_METADATA.txt

      - name: Publish one-time certificate
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-input-certificate-${{ github.run_id }}
          path: public_metadata
          retention-days: 1
          if-no-files-found: error

      - name: Receive and verify encrypted payload
        id: inbox
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          inbox=".tooling/ephemeral-private-runner/inbox/nimbus-v2-${GITHUB_RUN_ID}"
          remote=refs/remotes/nimbus-payload/head
          found=false
          for _ in $(seq 1 1800); do
            git fetch --quiet --no-tags --depth=1 "https://github.com/${REPO}.git" \
              "+refs/heads/${BRANCH}:${remote}" >/dev/null 2>&1 || true
            if git show "${remote}:${inbox}/READY" >/tmp/nimbus/READY 2>/dev/null; then
              mapfile -t parts < <(git ls-tree -r --name-only "$remote" -- "$inbox" | grep -E '/part-[0-9]{4}$' | sort)
              if test "${#parts[@]}" -gt 0; then
                : >/tmp/nimbus/payload.b64
                for part in "${parts[@]}"; do git show "${remote}:${part}" >>/tmp/nimbus/payload.b64; done
                base64 -d /tmp/nimbus/payload.b64 >/tmp/nimbus/payload.cms
                expected="$(tr -d '[:space:]' </tmp/nimbus/READY)"
                actual="$(sha256sum /tmp/nimbus/payload.cms | awk '{print $1}')"
                if test -s /tmp/nimbus/payload.cms && test "$actual" = "$expected"; then
                  printf '%s  payload.cms\n' "$actual" >public_metadata/ENCRYPTED_PAYLOAD_SHA256.txt
                  printf '%s\n' "${#parts[@]}" >public_metadata/ENCRYPTED_PAYLOAD_PART_COUNT.txt
                  found=true
                  break
                fi
              fi
            fi
            sleep 5
          done
          test "$found" = true
          echo 'payload_received=true' >>"$GITHUB_OUTPUT"

      - name: Decrypt and validate payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/nimbus/payload /tmp/nimbus/results /tmp/nimbus/bundle
          openssl cms -decrypt -binary -inform DER -in /tmp/nimbus/payload.cms \
            -recip /tmp/nimbus/input.crt -inkey /tmp/nimbus/input.key \
            -out /tmp/nimbus/payload.tar >/dev/null 2>&1
          python3 - <<'PY'
          import pathlib, tarfile
          src=pathlib.Path('/tmp/nimbus/payload.tar'); dst=pathlib.Path('/tmp/nimbus/payload')
          with tarfile.open(src,'r:*') as tf:
              members=tf.getmembers()
              if not members: raise SystemExit('empty payload')
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or m.isdev():
                      raise SystemExit(f'unsafe member: {m.name}')
              tf.extractall(dst,members=members,filter='data')
          PY
          test -f /tmp/nimbus/payload/run.sh
          test -f /tmp/nimbus/payload/result_cert.pem
          test -f /tmp/nimbus/payload/MANIFEST.sha256
          (cd /tmp/nimbus/payload && sha256sum -c MANIFEST.sha256) >/tmp/nimbus/PAYLOAD_INTEGRITY.log 2>&1
          chmod 700 /tmp/nimbus/payload/run.sh

      - name: Execute private payload
        id: private_run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd /tmp/nimbus/payload && PRIVATE_RUNNER_RESULTS=/tmp/nimbus/results bash ./run.sh) \
            >/tmp/nimbus/PRIVATE_RUN.log 2>&1
          status=$?
          printf '%s\n' "$status" >/tmp/nimbus/PRIVATE_RUN_STATUS.txt
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit "$status"

      - name: Encrypt all output
        if: always() && steps.inbox.outputs.payload_received == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/nimbus/PRIVATE_RUN_STATUS.txt /tmp/nimbus/bundle/ 2>/dev/null || printf '125\n' >/tmp/nimbus/bundle/PRIVATE_RUN_STATUS.txt
          cp /tmp/nimbus/PRIVATE_RUN.log /tmp/nimbus/bundle/ 2>/dev/null || true
          cp /tmp/nimbus/PAYLOAD_INTEGRITY.log /tmp/nimbus/bundle/ 2>/dev/null || true
          cp -a public_metadata /tmp/nimbus/bundle/
          cp -a /tmp/nimbus/results/. /tmp/nimbus/bundle/ 2>/dev/null || true
          (cd /tmp/nimbus/bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS.txt)
          tar -cf /tmp/nimbus/result.tar -C /tmp/nimbus/bundle .
          openssl cms -encrypt -binary -aes256 -in /tmp/nimbus/result.tar -outform DER \
            -out encrypted_output/encrypted-result.cms /tmp/nimbus/payload/result_cert.pem >/dev/null 2>&1
          sha256sum encrypted_output/encrypted-result.cms >encrypted_output/ENCRYPTED_RESULT_SHA256.txt
          rm -rf /tmp/nimbus/payload /tmp/nimbus/input.key /tmp/nimbus/input.crt /tmp/nimbus/result.tar /tmp/nimbus/bundle

      - name: Upload encrypted result only
        if: always() && steps.inbox.outputs.payload_received == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-nimbus-result-${{ github.run_id }}
          path: encrypted_output
          retention-days: 1
          if-no-files-found: error

      - name: Enforce private result
        if: always() && steps.inbox.outputs.payload_received == 'true'
        shell: bash
        env:
          STATUS: ${{ steps.private_run.outputs.status }}
        run: test "$STATUS" = '0'

