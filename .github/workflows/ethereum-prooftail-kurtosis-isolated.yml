name: Isolated Ethereum proof-tail Kurtosis gate

on:
  push:
    branches:
      - research/ethereum-prooftail-kurtosis-run-20260802
    paths:
      - '.github/workflows/ethereum-prooftail-kurtosis-isolated.yml'

permissions:
  contents: read

jobs:
  isolated-kurtosis-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out isolated runner branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_metadata
          uname -a > public_metadata/UNAME.txt
          docker version > public_metadata/DOCKER_VERSION.txt
          openssl version -a > public_metadata/OPENSSL_VERSION.txt
          python3 --version > public_metadata/PYTHON_VERSION.txt

      - name: Generate one-time input certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/prooftail-input
          openssl req \
            -x509 \
            -newkey rsa:4096 \
            -nodes \
            -sha256 \
            -days 1 \
            -subj "/CN=prooftail-isolated-${GITHUB_RUN_ID}" \
            -keyout /tmp/prooftail-input/private.pem \
            -out /tmp/prooftail-input/certificate.pem \
            >/dev/null 2>&1
          chmod 600 /tmp/prooftail-input/private.pem
          openssl x509 \
            -in /tmp/prooftail-input/certificate.pem \
            -noout -fingerprint -sha256 -subject -dates \
            > public_metadata/INPUT_CERTIFICATE_METADATA.txt
          cp /tmp/prooftail-input/certificate.pem public_metadata/input_certificate.pem

      - name: Publish one-time input certificate
        uses: actions/upload-artifact@v4
        with:
          name: prooftail-isolated-input-${{ github.run_id }}
          path: |
            public_metadata/input_certificate.pem
            public_metadata/INPUT_CERTIFICATE_METADATA.txt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for run-bound encrypted payload
        id: inbox
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_BRANCH: research/ethereum-prooftail-kurtosis-run-20260802
        run: |
          set -euo pipefail
          inbox_dir=".private/prooftail-kurtosis/${GITHUB_RUN_ID}"
          ready_path="${inbox_dir}/READY"
          remote_ref='refs/remotes/prooftail-isolated/head'
          found='false'
          for attempt in $(seq 1 1440); do
            git fetch --quiet --no-tags --depth=1 \
              "https://github.com/${REPOSITORY}.git" \
              "+refs/heads/${RUN_BRANCH}:${remote_ref}" \
              >/dev/null 2>&1 || true
            if git show "${remote_ref}:${ready_path}" > /tmp/prooftail-input/READY 2>/dev/null; then
              mapfile -t parts < <(
                git ls-tree -r --name-only "$remote_ref" -- "$inbox_dir" \
                  | grep -E '/part-[0-9]{4}$' \
                  | sort
              )
              if test "${#parts[@]}" -gt 0; then
                : > /tmp/prooftail-input/payload.cms.b64
                for part in "${parts[@]}"; do
                  git show "${remote_ref}:${part}" >> /tmp/prooftail-input/payload.cms.b64
                done
                base64 --decode /tmp/prooftail-input/payload.cms.b64 \
                  > /tmp/prooftail-input/payload.cms
                expected="$(tr -d '[:space:]' < /tmp/prooftail-input/READY)"
                actual="$(sha256sum /tmp/prooftail-input/payload.cms | awk '{print $1}')"
                if test -s /tmp/prooftail-input/payload.cms && test "$actual" = "$expected"; then
                  printf '%s\n' "${#parts[@]}" > public_metadata/ENCRYPTED_PAYLOAD_PART_COUNT.txt
                  found='true'
                  break
                fi
              fi
            fi
            sleep 5
          done
          test "$found" = 'true'
          sha256sum /tmp/prooftail-input/payload.cms \
            > public_metadata/ENCRYPTED_PAYLOAD_SHA256.txt
          printf 'payload_received=true\n' >> "$GITHUB_OUTPUT"

      - name: Decrypt and validate payload without plaintext logging
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/prooftail-payload /tmp/prooftail-result
          openssl cms \
            -decrypt \
            -binary \
            -inform DER \
            -in /tmp/prooftail-input/payload.cms \
            -recip /tmp/prooftail-input/certificate.pem \
            -inkey /tmp/prooftail-input/private.pem \
            -out /tmp/prooftail-input/payload.tar \
            >/dev/null 2>&1
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/prooftail-input/payload.tar')
          target = pathlib.Path('/tmp/prooftail-payload')
          with tarfile.open(archive, 'r:*') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('empty payload')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('unsafe payload path')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit('unsupported payload member')
              tf.extractall(target, members=members, filter='data')
          PY
          test -f /tmp/prooftail-payload/MANIFEST.sha256
          test -f /tmp/prooftail-payload/run.sh
          test -f /tmp/prooftail-payload/result_cert.pem
          (
            cd /tmp/prooftail-payload
            sha256sum -c MANIFEST.sha256 \
              > /tmp/prooftail-result/PAYLOAD_INTEGRITY.log 2>&1
          )
          chmod 700 /tmp/prooftail-payload/run.sh

      - name: Execute private local-only Kurtosis payload
        id: private_run
        continue-on-error: true
        shell: bash
        run: |
          set +e
          umask 077
          mkdir -p /tmp/prooftail-payload/results /tmp/prooftail-result
          (
            cd /tmp/prooftail-payload
            env \
              PRIVATE_RUNNER_RESULTS=/tmp/prooftail-payload/results \
              PRIVATE_RUNNER_PUBLIC_METADATA="$GITHUB_WORKSPACE/public_metadata" \
              bash ./run.sh
          ) > /tmp/prooftail-result/PRIVATE_RUN.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/prooftail-result/PRIVATE_RUN_STATUS.txt
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Encrypt all private results
        if: always() && steps.inbox.outputs.payload_received == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/prooftail-result/bundle/public_metadata
          test -f /tmp/prooftail-result/PRIVATE_RUN_STATUS.txt \
            || printf '125\n' > /tmp/prooftail-result/PRIVATE_RUN_STATUS.txt
          cp -a /tmp/prooftail-result/PRIVATE_RUN.log /tmp/prooftail-result/bundle/ 2>/dev/null || true
          cp -a /tmp/prooftail-result/PRIVATE_RUN_STATUS.txt /tmp/prooftail-result/bundle/
          cp -a /tmp/prooftail-result/PAYLOAD_INTEGRITY.log /tmp/prooftail-result/bundle/ 2>/dev/null || true
          if test -d /tmp/prooftail-payload/results; then
            cp -a /tmp/prooftail-payload/results/. /tmp/prooftail-result/bundle/
          fi
          cp -a public_metadata/. /tmp/prooftail-result/bundle/public_metadata/
          (
            cd /tmp/prooftail-result/bundle
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          tar -cf /tmp/prooftail-result/result.tar -C /tmp/prooftail-result/bundle .
          openssl cms \
            -encrypt \
            -binary \
            -aes256 \
            -in /tmp/prooftail-result/result.tar \
            -outform DER \
            -out /tmp/prooftail-result/encrypted-result.cms \
            /tmp/prooftail-payload/result_cert.pem \
            >/dev/null 2>&1
          sha256sum /tmp/prooftail-result/encrypted-result.cms \
            > /tmp/prooftail-result/ENCRYPTED_RESULT_SHA256.txt
          rm -rf /tmp/prooftail-payload /tmp/prooftail-input /tmp/prooftail-result/result.tar /tmp/prooftail-result/bundle

      - name: Upload encrypted private result only
        if: always() && steps.inbox.outputs.payload_received == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prooftail-isolated-result-${{ github.run_id }}
          path: |
            /tmp/prooftail-result/encrypted-result.cms
            /tmp/prooftail-result/ENCRYPTED_RESULT_SHA256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce private result after encrypted upload
        if: always() && steps.inbox.outputs.payload_received == 'true'
        shell: bash
        env:
          PRIVATE_STATUS: ${{ steps.private_run.outputs.status }}
        run: |
          set -euo pipefail
          test "$PRIVATE_STATUS" = '0'
