name: Evolution devnet Docker image bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/evolution-devnet-images.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pull and archive exact public images
        run: |
          set -euo pipefail
          mkdir -p images
          images=(
            ghcr.io/intersectmbo/cardano-node:10.5.1
            cardanosolutions/kupo:v2.10.0
            cardanosolutions/ogmios:v6.14.0
          )
          for image in "${images[@]}"; do
            docker pull "$image"
            safe=$(echo "$image" | tr '/:' '__')
            docker image inspect "$image" > "images/${safe}.inspect.json"
            docker save "$image" | zstd -T0 -19 -o "images/${safe}.tar.zst"
          done
          docker images --digests > images/DOCKER_IMAGES.txt
          find images -type f -print0 | sort -z | xargs -0 sha256sum > images/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-devnet-images
          retention-days: 7
          compression-level: 0
          path: images/
