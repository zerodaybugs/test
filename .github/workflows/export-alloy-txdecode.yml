name: export-alloy-txdecode

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-alloy-txdecode.yml'
      - 'alloy-txdecode-trigger.txt'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Reth v2.4.1 Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Build generic Alloy transaction decoder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alloy-txdecode/src export
          cat > /tmp/alloy-txdecode/Cargo.toml <<'EOF'
          [package]
          name = "alloy-txdecode"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.95"
          publish = false

          [dependencies]
          alloy-consensus = { version = "=2.1.1", features = ["k256"] }
          alloy-eips = "=2.1.1"
          alloy-primitives = "=1.6.1"
          alloy-rlp = "=0.3.16"
          alloy-serde = "=2.1.1"
          alloy-tx-macros = "=2.1.1"
          hex = "=0.4.3"
          serde_json = "=1.0.145"
          EOF

          cat > /tmp/alloy-txdecode/src/main.rs <<'EOF'
          use alloy_consensus::{transaction::SignerRecoverable, Transaction, TxEnvelope};
          use alloy_eips::{eip2718::Decodable2718, Typed2718};
          use serde_json::json;
          use std::io::{self, BufRead};

          fn main() {
              let stdin = io::stdin();
              for line in stdin.lock().lines() {
                  let line = match line {
                      Ok(line) => line,
                      Err(error) => {
                          println!("{}", json!({"accepted": false, "stage": "stdin", "error": error.to_string()}));
                          continue;
                      }
                  };
                  let trimmed = line.trim();
                  if trimmed.is_empty() {
                      continue;
                  }
                  let raw = trimmed.strip_prefix("0x").unwrap_or(trimmed);
                  let bytes = match hex::decode(raw) {
                      Ok(bytes) => bytes,
                      Err(error) => {
                          println!("{}", json!({"input": trimmed, "accepted": false, "stage": "hex", "error": error.to_string()}));
                          continue;
                      }
                  };

                  match TxEnvelope::decode_2718_exact(&bytes) {
                      Ok(tx) => {
                          let recovery = tx.recover_signer().map(|address| format!("{address:?}"));
                          println!("{}", json!({
                              "input": trimmed,
                              "accepted": true,
                              "tx_type": tx.ty(),
                              "chain_id": tx.chain_id(),
                              "nonce": tx.nonce(),
                              "gas_limit": tx.gas_limit(),
                              "signature_recovery_ok": recovery.is_ok(),
                              "recovered_signer": recovery.ok(),
                          }));
                      }
                      Err(error) => {
                          println!("{}", json!({
                              "input": trimmed,
                              "accepted": false,
                              "stage": "decode_2718_exact",
                              "error": error.to_string(),
                              "error_debug": format!("{error:?}"),
                          }));
                      }
                  }
              }
          }
          EOF

          cd /tmp/alloy-txdecode
          cargo generate-lockfile
          cargo build --release --locked
          printf '' | ./target/release/alloy-txdecode

          cp target/release/alloy-txdecode "$GITHUB_WORKSPACE/export/"
          cp Cargo.toml Cargo.lock "$GITHUB_WORKSPACE/export/"
          rustc --version > "$GITHUB_WORKSPACE/export/RUSTC_VERSION.txt"
          cargo --version > "$GITHUB_WORKSPACE/export/CARGO_VERSION.txt"
          printf 'reth=2.4.1\nalloy-consensus=2.1.1\nalloy-eips=2.1.1\nalloy-primitives=1.6.1\nalloy-rlp=0.3.16\n' > "$GITHUB_WORKSPACE/export/DEPENDENCY_VERSIONS.txt"
          cd "$GITHUB_WORKSPACE"
          sha256sum export/alloy-txdecode export/Cargo.toml export/Cargo.lock | sort > export/SHA256SUMS.txt

      - name: Upload generic decoder
        uses: actions/upload-artifact@v4
        with:
          name: alloy-txdecode-reth-2.4.1-linux-amd64
          path: export/
          if-no-files-found: error
          retention-days: 1
