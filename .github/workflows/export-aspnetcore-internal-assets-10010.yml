name: export-aspnetcore-internal-assets-10010

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-aspnetcore-internal-assets-10010.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Export exact internal assets pack
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/internal-assets-export
          mkdir -p "$OUT"
          dotnet --info | tee "$OUT/dotnet-info.txt"
          find "$DOTNET_ROOT" -maxdepth 5 \( -path '*Microsoft.AspNetCore.App.Internal.Assets*' -o -iname '*Internal.Assets*.nupkg' \) -print | sort | tee "$OUT/locations.txt"
          PACK="$DOTNET_ROOT/packs/Microsoft.AspNetCore.App.Internal.Assets/10.0.10"
          test -d "$PACK"
          tar -C "$DOTNET_ROOT" -czf "$OUT/microsoft-aspnetcore-app-internal-assets-10.0.10.tar.gz" "packs/Microsoft.AspNetCore.App.Internal.Assets/10.0.10"
          sha256sum "$OUT/microsoft-aspnetcore-app-internal-assets-10.0.10.tar.gz" | tee "$OUT/SHA256SUMS.txt"
          du -sh "$PACK" "$OUT"/* | tee "$OUT/SIZES.txt"
      - name: Upload exact pack
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-aspnetcore-app-internal-assets-10.0.10
          path: /tmp/internal-assets-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
