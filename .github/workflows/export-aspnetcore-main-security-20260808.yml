name: export-aspnetcore-main-security-20260808

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-aspnetcore-main-security-20260808.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current ASP.NET Core main
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: main
          path: aspnetcore
          fetch-depth: 0
          persist-credentials: false
      - name: Package security-relevant source
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/aspnetcore-main-security
          mkdir -p "$OUT"
          git -C aspnetcore rev-parse HEAD | tee "$OUT/COMMIT.txt"
          git -C aspnetcore log -n 500 --date=iso-strict --pretty=format:'%H%x09%ad%x09%s' > "$OUT/RECENT_COMMITS.tsv"
          git -C aspnetcore diff --stat v10.0.10..HEAD -- \
            src/Security src/Identity src/Middleware src/Http src/Servers src/SignalR src/Components \
            > "$OUT/V10_TO_MAIN_SECURITY_DIFFSTAT.txt" || true
          tar -C aspnetcore -czf "$OUT/aspnetcore-main-security-source.tar.gz" \
            src/Security \
            src/Identity \
            src/Middleware \
            src/Http \
            src/Servers \
            src/SignalR \
            src/Components \
            src/Shared \
            eng/Versions.props \
            eng/Dependencies.props \
            Directory.Build.props \
            Directory.Build.targets \
            global.json
          sha256sum "$OUT/aspnetcore-main-security-source.tar.gz" | tee "$OUT/SHA256SUMS.txt"
          du -sh "$OUT"/* | tee "$OUT/SIZES.txt"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-main-security-source
          path: /tmp/aspnetcore-main-security/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
