name: export-aspnetcore-outputcaching-source-20260808

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-aspnetcore-outputcaching-source-20260808.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact ASP.NET Core source
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          path: aspnetcore
          persist-credentials: false
      - name: Package exact OutputCaching source and build metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/outputcaching-source
          mkdir -p "$OUT"
          git -C aspnetcore rev-parse HEAD | tee "$OUT/COMMIT.txt"
          tar -C aspnetcore -czf "$OUT/aspnetcore-v10.0.10-outputcaching-source.tar.gz" \
            src/Middleware/OutputCaching \
            src/Shared \
            eng/Versions.props \
            eng/Dependencies.props \
            Directory.Build.props \
            Directory.Build.targets \
            global.json
          sha256sum "$OUT/aspnetcore-v10.0.10-outputcaching-source.tar.gz" | tee "$OUT/SHA256SUMS.txt"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-v10.0.10-outputcaching-source
          path: /tmp/outputcaching-source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
