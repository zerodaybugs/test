name: export-aspnetcore-security-source-20260811

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-aspnetcore-security-source-20260811.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact ASP.NET Core release source
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          path: aspnetcore
          persist-credentials: false
      - name: Package security-relevant source
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/aspnetcore-security-source
          mkdir -p "$OUT"
          git -C aspnetcore rev-parse HEAD | tee "$OUT/COMMIT.txt"
          tar -C aspnetcore -czf "$OUT/aspnetcore-v10.0.10-security-source.tar.gz" \
            src/Security \
            src/Identity \
            src/Middleware \
            src/SignalR \
            src/Servers/Kestrel \
            src/Antiforgery \
            src/Components \
            src/Http \
            src/Shared \
            eng/Versions.props \
            eng/Dependencies.props \
            global.json
          sha256sum "$OUT/aspnetcore-v10.0.10-security-source.tar.gz" > "$OUT/SHA256SUMS.txt"
          du -sh "$OUT"/* > "$OUT/SIZES.txt"
      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-v10.0.10-security-source
          path: /tmp/aspnetcore-security-source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
