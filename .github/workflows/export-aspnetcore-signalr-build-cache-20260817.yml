name: Export pinned ASP.NET Core SignalR build cache

on:
  push:
    paths:
      - '.github/workflows/export-aspnetcore-signalr-build-cache-20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.11
          fetch-depth: 1
          path: aspnetcore-source

      - name: Build exact SignalR test project from official source
        run: |
          set -euo pipefail
          cd aspnetcore-source
          git rev-parse HEAD | tee ../SOURCE_COMMIT.txt
          ./eng/build.sh --restore --build --projects src/SignalR/server/SignalR/test/Microsoft.AspNetCore.SignalR.Tests/Microsoft.AspNetCore.SignalR.Tests.csproj -ci -configuration Release 2>&1 | tee ../SOURCE_BUILD.log
          cd ..
          test -x aspnetcore-source/.dotnet/dotnet
          test -d aspnetcore-source/.packages
          aspnetcore-source/.dotnet/dotnet --info > SOURCE_DOTNET_INFO.txt
          find aspnetcore-source/.packages -type f -name '*.nupkg' -print0 | sort -z | xargs -0 sha256sum > SOURCE_PACKAGES_SHA256.txt

      - name: Archive exact private build tooling and package cache
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-08-11' -czf aspnetcore-v10.0.11-dotnet-tooling.tar.gz -C aspnetcore-source .dotnet
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-08-11' -czf aspnetcore-v10.0.11-package-cache.tar.gz -C aspnetcore-source .packages
          sha256sum aspnetcore-v10.0.11-dotnet-tooling.tar.gz aspnetcore-v10.0.11-package-cache.tar.gz > BUILD_CACHE_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-v10.0.11-dotnet-tooling
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            aspnetcore-v10.0.11-dotnet-tooling.tar.gz
            SOURCE_DOTNET_INFO.txt
            SOURCE_COMMIT.txt
            BUILD_CACHE_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-v10.0.11-package-cache
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            aspnetcore-v10.0.11-package-cache.tar.gz
            SOURCE_PACKAGES_SHA256.txt
            SOURCE_BUILD.log
            SOURCE_COMMIT.txt
            BUILD_CACHE_SHA256.txt
