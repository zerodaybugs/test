name: Export ASP.NET Core SignalR Core build cache and diagnostics

on:
  push:
    paths:
      - '.github/workflows/export-aspnetcore-signalr-core-build-cache-20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.11
          fetch-depth: 1
          path: aspnetcore-source

      - name: Build exact SignalR Core source
        id: build
        continue-on-error: true
        run: |
          set +e
          cd aspnetcore-source
          git rev-parse HEAD > ../SOURCE_COMMIT.txt
          ./eng/build.sh --restore --build --projects src/SignalR/server/Core/src/Microsoft.AspNetCore.SignalR.Core.csproj -ci -configuration Release > ../SOURCE_CORE_BUILD.log 2>&1
          rc=$?
          cd ..
          echo "$rc" > SOURCE_CORE_BUILD_RC.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          tail -n 200 SOURCE_CORE_BUILD.log
          exit 0

      - name: Archive available tooling and cache
        if: always()
        run: |
          set -euo pipefail
          if [ -d aspnetcore-source/.dotnet ]; then
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-08-11' -czf aspnetcore-v10.0.11-dotnet-tooling-core.tar.gz -C aspnetcore-source .dotnet
            aspnetcore-source/.dotnet/dotnet --info > SOURCE_DOTNET_INFO.txt || true
          fi
          if [ -d aspnetcore-source/.packages ]; then
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-08-11' -czf aspnetcore-v10.0.11-package-cache-core.tar.gz -C aspnetcore-source .packages
          fi
          sha256sum aspnetcore-v10.0.11-*.tar.gz > CORE_BUILD_CACHE_SHA256.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aspnetcore-v10.0.11-signalr-core-build-diagnostics
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            SOURCE_COMMIT.txt
            SOURCE_CORE_BUILD.log
            SOURCE_CORE_BUILD_RC.txt
            SOURCE_DOTNET_INFO.txt
            CORE_BUILD_CACHE_SHA256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aspnetcore-v10.0.11-signalr-core-dotnet-tooling
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
          path: aspnetcore-v10.0.11-dotnet-tooling-core.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aspnetcore-v10.0.11-signalr-core-package-cache
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
          path: aspnetcore-v10.0.11-package-cache-core.tar.gz
