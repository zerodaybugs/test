name: Export pinned ASP.NET Core source archive

on:
  push:
    paths:
      - '.github/workflows/export-aspnetcore-v10-source-20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.11
          fetch-depth: 1
          path: aspnetcore-v10.0.11

      - name: Verify and archive exact source
        run: |
          set -euo pipefail
          cd aspnetcore-v10.0.11
          git rev-parse HEAD | tee ../SOURCE_COMMIT.txt
          git status --porcelain=v1 | tee ../SOURCE_STATUS.txt
          test ! -s ../SOURCE_STATUS.txt
          cd ..
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-08-11' \
            --exclude='aspnetcore-v10.0.11/.git' \
            -czf aspnetcore-v10.0.11-source.tar.gz aspnetcore-v10.0.11
          sha256sum aspnetcore-v10.0.11-source.tar.gz > aspnetcore-v10.0.11-source.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-v10.0.11-source
          retention-days: 1
          if-no-files-found: error
          path: |
            aspnetcore-v10.0.11-source.tar.gz
            aspnetcore-v10.0.11-source.tar.gz.sha256
            SOURCE_COMMIT.txt
            SOURCE_STATUS.txt
