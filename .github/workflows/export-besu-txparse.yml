name: export-besu-txparse

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-besu-txparse.yml'
      - 'besu-txparse-trigger.txt'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build exact Besu distribution with txparse
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 26.2.0 https://github.com/besu-eth/besu.git /tmp/besu
          cd /tmp/besu
          test "$(git describe --tags --exact-match)" = "26.2.0"
          ./gradlew installDist --no-daemon --stacktrace
          find . -type f -path '*/build/install/*/bin/besu' -print
          BESU_BIN=$(find . -type f -path '*/build/install/*/bin/besu' -print -quit)
          test -n "$BESU_BIN"
          DIST_DIR=$(dirname "$(dirname "$BESU_BIN")")
          "$BESU_BIN" txparse --help > /tmp/besu-txparse-help.txt

          mkdir -p "$GITHUB_WORKSPACE/export"
          tar -C "$DIST_DIR" -czf "$GITHUB_WORKSPACE/export/besu-26.2.0-linux-x86_64.tar.gz" .
          cp /tmp/besu-txparse-help.txt "$GITHUB_WORKSPACE/export/TXPARSE_HELP.txt"
          java -version 2> "$GITHUB_WORKSPACE/export/JAVA_VERSION.txt"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/export/BESU_COMMIT.txt"
          printf 'besu=26.2.0\n' > "$GITHUB_WORKSPACE/export/DEPENDENCY_VERSIONS.txt"
          cd "$GITHUB_WORKSPACE"
          sha256sum export/besu-26.2.0-linux-x86_64.tar.gz | sort > export/SHA256SUMS.txt

      - name: Upload generic Besu distribution
        uses: actions/upload-artifact@v4
        with:
          name: besu-txparse-26.2.0-linux-x86_64
          path: export/
          if-no-files-found: error
          retention-days: 1
