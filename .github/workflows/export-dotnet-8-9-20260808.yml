name: export-dotnet-8-9-20260808

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-dotnet-8-9-20260808.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '8.0.423'
            runtime: '8.0.29'
            manifest: '8.0.100'
          - sdk: '9.0.316'
            runtime: '9.0.18'
            manifest: '9.0.100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Package exact SDK and runtimes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/dotnet-${{ matrix.sdk }}"
          OUT="/tmp/dotnet-export-${{ matrix.sdk }}"
          rm -rf "$ROOT" "$OUT"
          mkdir -p "$ROOT" "$OUT"
          dotnet --info | tee "$OUT/dotnet-info.txt"
          printf 'DOTNET_ROOT=%s\n' "$DOTNET_ROOT" | tee "$OUT/environment.txt"

          copy_tree() {
            local relative="$1"
            test -e "$DOTNET_ROOT/$relative"
            mkdir -p "$ROOT/$(dirname "$relative")"
            cp -a "$DOTNET_ROOT/$relative" "$ROOT/$relative"
          }

          copy_tree dotnet
          copy_tree "host/fxr/${{ matrix.runtime }}"
          copy_tree "sdk/${{ matrix.sdk }}"
          copy_tree "shared/Microsoft.NETCore.App/${{ matrix.runtime }}"
          copy_tree "shared/Microsoft.AspNetCore.App/${{ matrix.runtime }}"
          copy_tree "packs/Microsoft.NETCore.App.Host.linux-x64/${{ matrix.runtime }}"
          copy_tree "packs/Microsoft.NETCore.App.Ref/${{ matrix.runtime }}"
          copy_tree "packs/Microsoft.AspNetCore.App.Ref/${{ matrix.runtime }}"
          copy_tree "packs/NETStandard.Library.Ref/2.1.0"
          test ! -e "$DOTNET_ROOT/sdk-manifests/${{ matrix.manifest }}" || copy_tree "sdk-manifests/${{ matrix.manifest }}"
          test ! -e "$DOTNET_ROOT/templates/${{ matrix.runtime }}" || copy_tree "templates/${{ matrix.runtime }}"

          tar -C "$ROOT" -czf "$OUT/dotnet-sdk-${{ matrix.sdk }}-runtime-${{ matrix.runtime }}-linux-x64.tar.gz" .
          sha512sum "$OUT/dotnet-sdk-${{ matrix.sdk }}-runtime-${{ matrix.runtime }}-linux-x64.tar.gz" | tee "$OUT/SHA512SUMS.txt"
          du -sh "$ROOT" "$OUT"/* | tee "$OUT/SIZES.txt"
      - name: Upload exact SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-${{ matrix.sdk }}-runtime-${{ matrix.runtime }}-linux-x64
          path: /tmp/dotnet-export-${{ matrix.sdk }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
