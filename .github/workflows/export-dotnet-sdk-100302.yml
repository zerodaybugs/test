name: export-dotnet-sdk-100302

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-dotnet-sdk-100302.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Package exact SDK and runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dotnet-export /tmp/dotnet-subset
          dotnet --info | tee /tmp/dotnet-export/dotnet-info.txt
          printf 'DOTNET_ROOT=%s\n' "$DOTNET_ROOT" | tee /tmp/dotnet-export/environment.txt

          copy_tree() {
            local relative="$1"
            test -e "$DOTNET_ROOT/$relative"
            mkdir -p "/tmp/dotnet-subset/$(dirname "$relative")"
            cp -a "$DOTNET_ROOT/$relative" "/tmp/dotnet-subset/$relative"
          }

          copy_tree dotnet
          copy_tree host/fxr/10.0.10
          copy_tree sdk/10.0.302
          copy_tree shared/Microsoft.NETCore.App/10.0.10
          copy_tree shared/Microsoft.AspNetCore.App/10.0.10
          copy_tree packs/Microsoft.NETCore.App.Host.linux-x64/10.0.10
          copy_tree packs/Microsoft.NETCore.App.Ref/10.0.10
          copy_tree packs/Microsoft.AspNetCore.App.Ref/10.0.10
          copy_tree packs/NETStandard.Library.Ref/2.1.0
          copy_tree sdk-manifests/10.0.100
          test ! -e "$DOTNET_ROOT/templates/10.0.10" || copy_tree templates/10.0.10

          tar -C /tmp/dotnet-subset -czf /tmp/dotnet-export/dotnet-sdk-10.0.302-runtime-10.0.10-linux-x64.tar.gz .
          sha256sum /tmp/dotnet-export/dotnet-sdk-10.0.302-runtime-10.0.10-linux-x64.tar.gz | tee /tmp/dotnet-export/SHA256SUMS.txt
          du -sh /tmp/dotnet-subset /tmp/dotnet-export/* | tee /tmp/dotnet-export/SIZES.txt
      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-runtime-10.0.10-linux-x64
          path: /tmp/dotnet-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
