name: export-dotnet-sdk-100302

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-dotnet-sdk-100302.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Package exact SDK and runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dotnet-export
          dotnet --info | tee /tmp/dotnet-export/dotnet-info.txt
          printf 'DOTNET_ROOT=%s\n' "$DOTNET_ROOT" | tee /tmp/dotnet-export/environment.txt
          tar -C "$DOTNET_ROOT" -czf /tmp/dotnet-export/dotnet-sdk-10.0.302-linux-x64.tar.gz .
          sha256sum /tmp/dotnet-export/dotnet-sdk-10.0.302-linux-x64.tar.gz | tee /tmp/dotnet-export/SHA256SUMS.txt
      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.302-linux-x64
          path: /tmp/dotnet-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
