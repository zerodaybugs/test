name: export-dotnet11-preview6-20260808

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-dotnet11-preview6-20260808.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-preview.6.26359.118'
      - name: Package exact SDK and runtimes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/dotnet11p6
          OUT=/tmp/dotnet11p6-export
          rm -rf "$ROOT" "$OUT"
          mkdir -p "$ROOT" "$OUT"
          dotnet --info | tee "$OUT/dotnet-info.txt"
          printf 'DOTNET_ROOT=%s\n' "$DOTNET_ROOT" | tee "$OUT/environment.txt"

          copy_tree() {
            local relative="$1"
            test -e "$DOTNET_ROOT/$relative"
            mkdir -p "$ROOT/$(dirname "$relative")"
            cp -a "$DOTNET_ROOT/$relative" "$ROOT/$relative"
          }

          copy_tree dotnet
          copy_tree host/fxr/11.0.0-preview.6.26359.118
          copy_tree sdk/11.0.100-preview.6.26359.118
          copy_tree shared/Microsoft.NETCore.App/11.0.0-preview.6.26359.118
          copy_tree shared/Microsoft.AspNetCore.App/11.0.0-preview.6.26359.118
          copy_tree packs/Microsoft.NETCore.App.Host.linux-x64/11.0.0-preview.6.26359.118
          copy_tree packs/Microsoft.NETCore.App.Ref/11.0.0-preview.6.26359.118
          copy_tree packs/Microsoft.AspNetCore.App.Ref/11.0.0-preview.6.26359.118
          copy_tree packs/NETStandard.Library.Ref/2.1.0
          test ! -e "$DOTNET_ROOT/sdk-manifests/11.0.100" || copy_tree sdk-manifests/11.0.100
          test ! -e "$DOTNET_ROOT/templates/11.0.0-preview.6.26359.118" || copy_tree templates/11.0.0-preview.6.26359.118

          tar -C "$ROOT" -czf "$OUT/dotnet-sdk-11.0.100-preview.6.26359.118-linux-x64.tar.gz" .
          sha512sum "$OUT/dotnet-sdk-11.0.100-preview.6.26359.118-linux-x64.tar.gz" | tee "$OUT/SHA512SUMS.txt"
          du -sh "$ROOT" "$OUT"/* | tee "$OUT/SIZES.txt"
      - name: Upload exact SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-11.0.100-preview.6.26359.118-linux-x64
          path: /tmp/dotnet11p6-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
