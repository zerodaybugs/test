name: Export exact official .NET SDK archives

on:
  push:
    paths:
      - '.github/workflows/export-exact-dotnet-sdks-20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: '10.0'
            release: '10.0.11'
            sdk: '10.0.400'
          - channel: '8.0'
            release: '8.0.29'
            sdk: '8.0.129'
    steps:
      - name: Download and verify official SDK archive
        env:
          CHANNEL: ${{ matrix.channel }}
          RELEASE_VERSION: ${{ matrix.release }}
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          channel = os.environ['CHANNEL']
          release_version = os.environ['RELEASE_VERSION']
          sdk_version = os.environ['SDK_VERSION']
          metadata_url = f'https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/{channel}/releases.json'
          with urllib.request.urlopen(metadata_url) as response:
              metadata = json.load(response)

          release = next(item for item in metadata['releases'] if item['release-version'] == release_version)
          sdk_candidates = []
          if release.get('sdk'):
              sdk_candidates.append(release['sdk'])
          sdk_candidates.extend(release.get('sdks', []))
          sdk = next(item for item in sdk_candidates if item['version'] == sdk_version)
          archive = next(item for item in sdk['files'] if item.get('rid') == 'linux-x64' and item['name'].endswith('.tar.gz'))

          output = pathlib.Path(archive['name'])
          urllib.request.urlretrieve(archive['url'], output)
          digest = hashlib.sha512(output.read_bytes()).hexdigest()
          if digest.lower() != archive['hash'].lower():
              raise SystemExit(f'SHA-512 mismatch: {digest} != {archive["hash"]}')

          result = {
              'schema': 'official_dotnet_sdk_export/v1',
              'channel': channel,
              'releaseVersion': release_version,
              'sdkVersion': sdk_version,
              'runtimeVersion': sdk.get('runtime-version'),
              'archive': archive['name'],
              'sourceUrl': archive['url'],
              'sha512': digest,
              'metadataUrl': metadata_url,
              'verified': True,
          }
          pathlib.Path('SDK_METADATA.json').write_text(json.dumps(result, indent=2) + '\n')
          pathlib.Path('SDK_SHA512.txt').write_text(f'{digest}  {archive["name"]}\n')
          print(json.dumps(result, indent=2))
          PY
          tar -tzf dotnet-sdk-*.tar.gz >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-${{ matrix.sdk }}-linux-x64
          retention-days: 1
          if-no-files-found: error
          path: |
            dotnet-sdk-*.tar.gz
            SDK_METADATA.json
            SDK_SHA512.txt
