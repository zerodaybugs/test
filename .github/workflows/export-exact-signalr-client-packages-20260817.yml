name: Export exact SignalR client package caches

on:
  push:
    paths:
      - '.github/workflows/export-exact-signalr-client-packages-20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10-10.0.11
            sdk: '10.0.400'
            tfm: 'net10.0'
            package: '10.0.11'
          - label: net8-8.0.29
            sdk: '8.0.129'
            tfm: 'net8.0'
            package: '8.0.29'
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Restore exact package graph to isolated cache
        env:
          TFM: ${{ matrix.tfm }}
          SIGNALR_PACKAGE: ${{ matrix.package }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p project packages
          cat > project/PackageGraph.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>${TFM}</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.SignalR.Client" Version="${SIGNALR_PACKAGE}" />
            </ItemGroup>
          </Project>
          EOF
          NUGET_PACKAGES="$PWD/packages" dotnet restore project/PackageGraph.csproj --force --no-cache
          NUGET_PACKAGES="$PWD/packages" dotnet list project/PackageGraph.csproj package --include-transitive > package-list.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('packages')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          manifest = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest.append({'path': path.relative_to(root).as_posix(), 'size': path.stat().st_size, 'sha256': digest})
          out = {
              'schema': 'offline_nuget_cache_export/v1',
              'label': os.environ['LABEL'],
              'targetFramework': os.environ['TFM'],
              'signalRClientVersion': os.environ['SIGNALR_PACKAGE'],
              'files': manifest,
          }
          pathlib.Path('PACKAGE_CACHE_MANIFEST.json').write_text(json.dumps(out, indent=2) + '\n')
          PY
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-08-17' -czf signalr-client-packages-${{ matrix.label }}.tar.gz packages
          sha256sum signalr-client-packages-${{ matrix.label }}.tar.gz > signalr-client-packages-${{ matrix.label }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: signalr-client-package-cache-${{ matrix.label }}
          retention-days: 1
          if-no-files-found: error
          path: |
            signalr-client-packages-${{ matrix.label }}.tar.gz
            signalr-client-packages-${{ matrix.label }}.tar.gz.sha256
            PACKAGE_CACHE_MANIFEST.json
            package-list.txt
            project/PackageGraph.csproj
