name: export-foundry-toolchain

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-foundry-toolchain.yml'
      - 'toolchain-export-trigger.txt'

permissions:
  contents: read

env:
  PUBLIC_SOURCE_REPOSITORY: tcg-vault/contracts
  PUBLIC_SOURCE_COMMIT: 7e785d4872843ba2a78b43daad2761c4ba416413

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Fetch Solidity 0.8.27 and collect static binaries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/solc-fetch/src export/bin export/solc
          cat > /tmp/solc-fetch/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          out = "out"
          solc = "0.8.27"
          EOF
          cat > /tmp/solc-fetch/src/X.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.27;
          contract X { function x() external pure returns (uint256) { return 1; } }
          EOF
          cd /tmp/solc-fetch
          forge build --use 0.8.27
          cd "$GITHUB_WORKSPACE"
          for binary in forge cast anvil chisel; do
            cp "$(command -v "$binary")" "export/bin/$binary"
          done
          find "$HOME/.svm" -type f -name 'solc-0.8.27' -exec cp '{}' export/solc/solc-0.8.27 \;
          test -x export/bin/forge
          test -s export/solc/solc-0.8.27
          export/bin/forge --version > export/FOUNDRY_VERSION.txt
          export/solc/solc-0.8.27 --version > export/SOLC_VERSION.txt
          sha256sum export/bin/* export/solc/* | sort > export/SHA256SUMS.txt

      - name: Export exact public Hardhat environment
        shell: bash
        run: |
          set -euxo pipefail
          git clone "https://github.com/${PUBLIC_SOURCE_REPOSITORY}.git" public-source
          cd public-source
          git checkout "$PUBLIC_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$PUBLIC_SOURCE_COMMIT"
          corepack enable
          corepack prepare yarn@4.5.1 --activate
          yarn install --immutable
          yarn build 2>&1 | tee ../export/HARDHAT_BUILD.log
          set +e
          yarn test 2>&1 | tee ../export/HARDHAT_TEST.log
          test_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$test_rc" > ../export/HARDHAT_TEST_EXIT_CODE.txt
          printf 'commit=%s\nnode=%s\nyarn=%s\n' "$(git rev-parse HEAD)" "$(node --version)" "$(yarn --version)" > ../export/HARDHAT_ENVIRONMENT.txt
          tar --zstd -cf ../export/public-hardhat-environment.tar.zst \
            package.json yarn.lock .yarnrc.yml hardhat.config.ts tsconfig.json \
            contracts scripts test node_modules artifacts cache
          cd ..
          sha256sum export/public-hardhat-environment.tar.zst >> export/SHA256SUMS.txt

      - name: Upload toolchain and dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: foundry-v1.7.1-solc-0.8.27-hardhat-cache-linux-amd64
          path: export/
          if-no-files-found: error
          retention-days: 1
