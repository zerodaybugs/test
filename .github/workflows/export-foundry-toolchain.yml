name: Export pinned Foundry toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-foundry-toolchain.yml'
      - 'toolchain/foundry-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry v1.7.1
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Collect binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "$(command -v forge)" artifact/forge
          cp "$(command -v cast)" artifact/cast
          cp "$(command -v anvil)" artifact/anvil
          cp "$(command -v chisel)" artifact/chisel
          forge --version > artifact/VERSIONS.txt
          cast --version >> artifact/VERSIONS.txt
          anvil --version >> artifact/VERSIONS.txt
          sha256sum artifact/* > artifact/SHA256SUMS
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: foundry-v1.7.1-linux-amd64
          path: artifact/
          if-no-files-found: error
          retention-days: 1
