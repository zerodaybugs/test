name: Export pinned Foundry toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-foundry-toolchain.yml'
      - 'toolchain/foundry-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry v1.7.1
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Solidity 0.8.33 through Foundry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/solc-probe
          mkdir -p /tmp/solc-probe/src
          cat > /tmp/solc-probe/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          solc_version = "0.8.33"
          evm_version = "cancun"
          EOF
          cat > /tmp/solc-probe/src/Probe.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.33;
          contract Probe { function one() external pure returns (uint256) { return 1; } }
          EOF
          (cd /tmp/solc-probe && forge build)

      - name: Clone exact Tare dependency closure
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/tare-deps/lib
          rm -rf /tmp/tare-deps
          mkdir -p "$ROOT"

          clone_exact() {
            local url="$1"
            local rev="$2"
            local dst="$3"
            git init "$dst"
            git -C "$dst" remote add origin "$url"
            git -C "$dst" fetch --depth 1 origin "$rev"
            git -C "$dst" checkout --detach FETCH_HEAD
            git -C "$dst" submodule update --init --recursive --depth 1
          }

          clone_exact https://github.com/radeksvarz/createx-forge.git \
            1d5ed80fabe164421228d7ce0fd5c7f3e3010300 "$ROOT/createx-forge"
          clone_exact https://github.com/foundry-rs/forge-std.git \
            8e40513d678f392f398620b3ef2b418648b33e89 "$ROOT/forge-std"
          clone_exact https://github.com/OpenZeppelin/openzeppelin-contracts.git \
            fcbae5394ae8ad52d8e580a3477db99814b9d565 "$ROOT/openzeppelin-contracts"
          clone_exact https://github.com/safe-global/safe-smart-account.git \
            21dc82410445637820f600c7399a804ad55841d5 "$ROOT/safe-smart-account"
          clone_exact https://github.com/transmissions11/solmate.git \
            89365b880c4f3c786bdd453d4b8e8fe410344a69 "$ROOT/solmate"

          find "$ROOT" -name .git -type d -prune -exec rm -rf {} +
          tar -C /tmp/tare-deps -czf /tmp/tare-pinned-libs.tar.gz lib

      - name: Collect offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "$(command -v forge)" artifact/forge
          cp "$(command -v cast)" artifact/cast

          SOLC_PATH="$(find "$HOME/.svm" -type f -name 'solc-0.8.33' -print -quit)"
          test -n "$SOLC_PATH"
          cp "$SOLC_PATH" artifact/solc-0.8.33
          cp /tmp/tare-pinned-libs.tar.gz artifact/tare-pinned-libs.tar.gz

          chmod +x artifact/forge artifact/cast artifact/solc-0.8.33
          {
            forge --version
            cast --version
            "$SOLC_PATH" --version
          } > artifact/VERSIONS.txt
          sha256sum artifact/* > artifact/SHA256SUMS

      - name: Upload offline audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: tare-offline-toolchain-v1.7.1-solc0.8.33
          path: artifact/
          if-no-files-found: error
          retention-days: 1
