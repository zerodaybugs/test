name: export-geth-txdecode

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-geth-txdecode.yml'
      - 'geth-txdecode-trigger.txt'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Build generic Geth transaction decoder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/geth-txdecode export
          cat > /tmp/geth-txdecode/go.mod <<'EOF'
          module geth-txdecode

          go 1.24

          require github.com/ethereum/go-ethereum v1.17.4
          EOF

          cat > /tmp/geth-txdecode/main.go <<'EOF'
          package main

          import (
              "bufio"
              "encoding/hex"
              "encoding/json"
              "errors"
              "fmt"
              "os"
              "strings"

              "github.com/ethereum/go-ethereum/core/types"
          )

          type result struct {
              Input               string `json:"input"`
              Accepted            bool   `json:"accepted"`
              Stage               string `json:"stage,omitempty"`
              Error               string `json:"error,omitempty"`
              Type                uint8  `json:"tx_type,omitempty"`
              ChainID             string `json:"chain_id,omitempty"`
              Nonce               uint64 `json:"nonce,omitempty"`
              Gas                 uint64 `json:"gas_limit,omitempty"`
              Protected           bool   `json:"protected,omitempty"`
              SignatureRecoveryOK bool   `json:"signature_recovery_ok,omitempty"`
              RecoveredSigner     string `json:"recovered_signer,omitempty"`
              Hash                string `json:"hash,omitempty"`
          }

          func emit(r result) {
              b, err := json.Marshal(r)
              if err != nil {
                  fmt.Printf("{\"accepted\":false,\"stage\":\"json\",\"error\":%q}\n", err.Error())
                  return
              }
              fmt.Println(string(b))
          }

          func main() {
              scanner := bufio.NewScanner(os.Stdin)
              scanner.Buffer(make([]byte, 1024), 16*1024*1024)
              for scanner.Scan() {
                  input := strings.TrimSpace(scanner.Text())
                  if input == "" {
                      continue
                  }
                  raw := strings.TrimPrefix(input, "0x")
                  payload, err := hex.DecodeString(raw)
                  if err != nil {
                      emit(result{Input: input, Accepted: false, Stage: "hex", Error: err.Error()})
                      continue
                  }

                  var tx types.Transaction
                  if err := tx.UnmarshalBinary(payload); err != nil {
                      emit(result{Input: input, Accepted: false, Stage: "unmarshal_binary", Error: err.Error()})
                      continue
                  }

                  var senderErr error
                  var sender string
                  if tx.Protected() && tx.ChainId().Sign() <= 0 {
                      senderErr = errors.New("protected transaction has non-positive chain ID")
                  } else {
                      var signer types.Signer
                      if tx.Protected() {
                          signer = types.LatestSignerForChainID(tx.ChainId())
                      } else {
                          signer = types.HomesteadSigner{}
                      }
                      recovered, err := types.Sender(signer, &tx)
                      senderErr = err
                      if err == nil {
                          sender = recovered.Hex()
                      }
                  }

                  r := result{
                      Input: input,
                      Accepted: true,
                      Type: tx.Type(),
                      ChainID: tx.ChainId().String(),
                      Nonce: tx.Nonce(),
                      Gas: tx.Gas(),
                      Protected: tx.Protected(),
                      SignatureRecoveryOK: senderErr == nil,
                      RecoveredSigner: sender,
                      Hash: tx.Hash().Hex(),
                  }
                  if senderErr != nil {
                      r.Error = senderErr.Error()
                      r.Stage = "sender_recovery"
                  }
                  emit(r)
              }
              if err := scanner.Err(); err != nil {
                  emit(result{Accepted: false, Stage: "stdin", Error: err.Error()})
              }
          }
          EOF

          cd /tmp/geth-txdecode
          go mod tidy
          go build -trimpath -ldflags='-s -w' -o geth-txdecode ./
          printf '' | ./geth-txdecode

          cp geth-txdecode go.mod go.sum "$GITHUB_WORKSPACE/export/"
          go version > "$GITHUB_WORKSPACE/export/GO_VERSION.txt"
          printf 'go-ethereum=1.17.4\n' > "$GITHUB_WORKSPACE/export/DEPENDENCY_VERSIONS.txt"
          cd "$GITHUB_WORKSPACE"
          sha256sum export/geth-txdecode export/go.mod export/go.sum | sort > export/SHA256SUMS.txt

      - name: Upload generic decoder
        uses: actions/upload-artifact@v4
        with:
          name: geth-txdecode-1.17.4-linux-amd64
          path: export/
          if-no-files-found: error
          retention-days: 1
