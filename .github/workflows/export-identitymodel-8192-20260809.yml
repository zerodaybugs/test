name: export-identitymodel-8192-20260809

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-identitymodel-8192-20260809.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact public IdentityModel source
        uses: actions/checkout@v4
        with:
          repository: AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
          ref: '8.19.2'
          path: identitymodel
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Restore exact stable packages and package source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/identitymodel-8192-export
          PKGS="$ROOT/packages"
          OUT="$ROOT/out"
          mkdir -p "$ROOT/project" "$PKGS" "$OUT"
          cat > "$ROOT/project/Export.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.IdentityModel.Protocols.SignedHttpRequest" Version="8.19.2" />
            </ItemGroup>
          </Project>
          XML
          NUGET_PACKAGES="$PKGS" dotnet restore "$ROOT/project/Export.csproj" --force --no-cache
          git -C identitymodel rev-parse HEAD | tee "$OUT/SOURCE_COMMIT.txt"
          cp "$ROOT/project/obj/project.assets.json" "$OUT/project.assets.json"
          find "$PKGS" -type f -printf '%P\n' | sort > "$OUT/package-file-list.txt"
          tar -C "$ROOT" -czf "$OUT/identitymodel-8.19.2-packages.tar.gz" packages
          tar -C identitymodel -czf "$OUT/identitymodel-8.19.2-security-source.tar.gz" \
            src/Microsoft.IdentityModel.Protocols.SignedHttpRequest \
            src/Microsoft.IdentityModel.Protocols \
            src/Microsoft.IdentityModel.JsonWebTokens \
            src/Microsoft.IdentityModel.Tokens \
            src/Microsoft.IdentityModel.Logging \
            src/Microsoft.IdentityModel.Abstractions \
            build \
            global.json
          sha256sum "$OUT"/*.tar.gz | tee "$OUT/SHA256SUMS.txt"
          du -sh "$OUT"/* | tee "$OUT/SIZES.txt"
      - name: Upload exact source and packages
        uses: actions/upload-artifact@v4
        with:
          name: identitymodel-8.19.2-source-and-packages
          path: /tmp/identitymodel-8192-export/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
