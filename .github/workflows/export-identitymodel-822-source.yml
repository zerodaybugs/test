name: export-identitymodel-822-source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-identitymodel-822-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact IdentityModel source
        uses: actions/checkout@v4
        with:
          repository: AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet
          ref: '8.22.0'
          path: identitymodel
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Restore exact public packages and package source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/identitymodel-822-export
          PKGS="$ROOT/packages"
          OUT="$ROOT/out"
          mkdir -p "$ROOT/project" "$PKGS" "$OUT/source"
          git -C identitymodel rev-parse HEAD | tee "$OUT/COMMIT.txt"
          cat > "$ROOT/project/Export.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.IdentityModel.Protocols.SignedHttpRequest" Version="8.22.0" />
              <PackageReference Include="Microsoft.IdentityModel.Protocols.OpenIdConnect" Version="8.22.0" />
              <PackageReference Include="Microsoft.IdentityModel.JsonWebTokens" Version="8.22.0" />
              <PackageReference Include="Microsoft.IdentityModel.Tokens" Version="8.22.0" />
              <PackageReference Include="Microsoft.IdentityModel.Validators" Version="8.22.0" />
              <PackageReference Include="System.IdentityModel.Tokens.Jwt" Version="8.22.0" />
            </ItemGroup>
          </Project>
          XML
          NUGET_PACKAGES="$PKGS" dotnet restore "$ROOT/project/Export.csproj" --force --no-cache
          cp "$ROOT/project/obj/project.assets.json" "$OUT/project.assets.json"
          tar -C "$ROOT" -czf "$OUT/identitymodel-8.22.0-packages.tar.gz" packages
          tar -C identitymodel -czf "$OUT/identitymodel-8.22.0-security-source.tar.gz" \
            src/Microsoft.IdentityModel.Protocols.SignedHttpRequest \
            src/Microsoft.IdentityModel.Protocols.OpenIdConnect \
            src/Microsoft.IdentityModel.JsonWebTokens \
            src/Microsoft.IdentityModel.Tokens \
            src/Microsoft.IdentityModel.Validators \
            src/System.IdentityModel.Tokens.Jwt \
            test/Microsoft.IdentityModel.Protocols.SignedHttpRequest.Tests \
            test/Microsoft.IdentityModel.Protocols.OpenIdConnect.Tests \
            test/Microsoft.IdentityModel.JsonWebTokens.Tests \
            test/Microsoft.IdentityModel.Tokens.Tests \
            test/Microsoft.IdentityModel.Validators.Tests \
            test/System.IdentityModel.Tokens.Jwt.Tests \
            build/version.props \
            CHANGELOG.md
          sha256sum "$OUT"/*.tar.gz | tee "$OUT/SHA256SUMS.txt"
          du -sh "$PKGS" "$OUT"/* | tee "$OUT/SIZES.txt"
      - name: Upload source and packages
        uses: actions/upload-artifact@v4
        with:
          name: identitymodel-8.22.0-source-and-packages
          path: /tmp/identitymodel-822-export/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
