name: export-identitymodel-dpop-822-20260811

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-identitymodel-dpop-822-20260811.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Restore exact DPoP package and export source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/dpop-export
          PKGS="$ROOT/packages"
          OUT="$ROOT/out"
          mkdir -p "$ROOT/project" "$PKGS" "$OUT"
          cat > "$ROOT/project/Export.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.IdentityModel.Dpop" Version="8.22.0" />
            </ItemGroup>
          </Project>
          XML
          NUGET_PACKAGES="$PKGS" dotnet restore "$ROOT/project/Export.csproj" --force --no-cache
          cp "$ROOT/project/obj/project.assets.json" "$OUT/project.assets.json"
          find "$PKGS" -type f -printf '%P\n' | sort > "$OUT/package-file-list.txt"
          tar -C "$ROOT" -czf "$OUT/identitymodel-dpop-8.22.0-nuget-packages.tar.gz" packages

          git clone --depth 1 --branch 8.22.0 https://github.com/AzureAD/azure-activedirectory-identitymodel-extensions-for-dotnet.git "$ROOT/source"
          git -C "$ROOT/source" rev-parse HEAD | tee "$OUT/SOURCE_COMMIT.txt"
          tar -C "$ROOT/source" -czf "$OUT/identitymodel-dpop-8.22.0-source.tar.gz" \
            src/Microsoft.IdentityModel.Dpop \
            src/Microsoft.IdentityModel.Tokens \
            src/Microsoft.IdentityModel.JsonWebTokens \
            Directory.Build.props \
            Directory.Build.targets \
            build/common.props \
            build/targets.props \
            build/dependencies.props \
            global.json

          sha256sum "$OUT"/*.tar.gz | tee "$OUT/SHA256SUMS.txt"
          dotnet --info > "$OUT/dotnet-info.txt"
          du -sh "$PKGS" "$OUT"/* > "$OUT/SIZES.txt"
      - name: Upload exact DPoP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: identitymodel-dpop-8.22.0
          path: /tmp/dpop-export/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
