name: export-negotiatelab-deps-10010

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-negotiatelab-deps-10010.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Restore and package exact public dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/negotiatelab-export
          PKGS="$ROOT/packages"
          OUT="$ROOT/out"
          mkdir -p "$ROOT/project" "$PKGS" "$OUT"
          cat > "$ROOT/project/Export.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.Authentication.Negotiate" Version="10.0.10" />
            </ItemGroup>
          </Project>
          XML
          NUGET_PACKAGES="$PKGS" dotnet restore "$ROOT/project/Export.csproj" --force --no-cache
          cp "$ROOT/project/obj/project.assets.json" "$OUT/project.assets.json"
          cp "$ROOT/project/obj/Export.csproj.nuget.g.props" "$OUT/"
          cp "$ROOT/project/obj/Export.csproj.nuget.g.targets" "$OUT/"
          find "$PKGS" -type f -printf '%P\n' | sort > "$OUT/package-file-list.txt"
          tar -C "$ROOT" -czf "$OUT/negotiatelab-nuget-packages-10.0.10.tar.gz" packages
          sha256sum "$OUT/negotiatelab-nuget-packages-10.0.10.tar.gz" > "$OUT/SHA256SUMS.txt"
          du -sh "$PKGS" "$OUT"/* > "$OUT/SIZES.txt"
      - name: Upload exact dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: negotiatelab-nuget-packages-10.0.10
          path: /tmp/negotiatelab-export/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
