name: Export Prysm v7.1.8 offline Go environment

on:
  push:
    branches:
      - ci/fetch-prysm-v7.1.8
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-offline-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install Go 1.26.5
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: false

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev zstd

      - name: Fetch exact Prysm source and populate module cache
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/prysm-gomodcache
          GOCACHE: ${{ runner.temp }}/prysm-gocache
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v7.1.8 https://github.com/OffchainLabs/prysm.git prysm-v7.1.8
          actual="$(git -C prysm-v7.1.8 rev-parse HEAD)"
          expected="51b5a75ebbadf05af22bd2601b5baf7a9e99b66d"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > prysm-v7.1.8/SOURCE_COMMIT.txt
          cd prysm-v7.1.8
          go mod download
          go test ./beacon-chain/verification -run '^$' -count=1 -timeout=30m
          go list -deps -test ./beacon-chain/verification > OFFLINE_DEPENDENCIES.txt
          go env -json > OFFLINE_GO_ENV.json
          rm -rf .git

      - name: Build deterministic offline bundle
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/prysm-gomodcache
        run: |
          set -euo pipefail
          mkdir -p offline-stage metadata
          goroot="$(go env GOROOT)"
          ln -s "$goroot" offline-stage/go
          ln -s "$GITHUB_WORKSPACE/prysm-v7.1.8" offline-stage/prysm-v7.1.8
          ln -s "$GOMODCACHE" offline-stage/gomodcache
          {
            date --iso-8601=seconds
            uname -a
            go version
            cat prysm-v7.1.8/SOURCE_COMMIT.txt
            du -sh "$goroot" "$GITHUB_WORKSPACE/prysm-v7.1.8" "$GOMODCACHE"
          } | tee metadata/BUILD_ENVIRONMENT.txt
          cp prysm-v7.1.8/OFFLINE_DEPENDENCIES.txt metadata/
          cp prysm-v7.1.8/OFFLINE_GO_ENV.json metadata/
          ln -s "$GITHUB_WORKSPACE/metadata" offline-stage/metadata
          tar --dereference --zstd -cf prysm-v7.1.8-offline-env.tar.zst \
            -C offline-stage go prysm-v7.1.8 gomodcache metadata
          sha256sum prysm-v7.1.8-offline-env.tar.zst > prysm-v7.1.8-offline-env.tar.zst.sha256
          ls -lh prysm-v7.1.8-offline-env.tar.zst*

      - name: Upload offline environment
        uses: actions/upload-artifact@v4
        with:
          name: prysm-v7.1.8-offline-go-env
          path: |
            prysm-v7.1.8-offline-env.tar.zst
            prysm-v7.1.8-offline-env.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
