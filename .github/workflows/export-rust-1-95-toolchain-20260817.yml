name: Export Rust 1.95 toolchain

on:
  push:
    branches:
      - tooling-rust-1-95-link-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install and package Rust 1.95.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          TOOLCHAIN="$(rustup toolchain list -v | awk '$1 ~ /^1\.95\.0-x86_64-unknown-linux-gnu/ {print $2; exit}')"
          test -n "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/rustc"
          test -x "$TOOLCHAIN/bin/cargo"
          "$TOOLCHAIN/bin/rustc" --version --verbose
          "$TOOLCHAIN/bin/cargo" --version --verbose
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "$(dirname "$TOOLCHAIN")" \
            -czf /tmp/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz \
            "$(basename "$TOOLCHAIN")"
          sha256sum /tmp/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz \
            > /tmp/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-1.95.0-x86_64-unknown-linux-gnu
          path: |
            /tmp/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz
            /tmp/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
