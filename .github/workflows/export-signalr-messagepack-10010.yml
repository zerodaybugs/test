name: export-signalr-messagepack-10010

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-signalr-messagepack-10010.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - name: Restore exact public packages
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/signalr-msgpack-export
          PKGS="$ROOT/packages"
          OUT="$ROOT/out"
          mkdir -p "$ROOT/project" "$PKGS" "$OUT"
          cat > "$ROOT/project/Export.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.AspNetCore.SignalR.Protocols.MessagePack" Version="10.0.10" />
              <PackageReference Include="MessagePack" Version="2.5.302" />
            </ItemGroup>
          </Project>
          XML
          NUGET_PACKAGES="$PKGS" dotnet restore "$ROOT/project/Export.csproj" --force --no-cache
          cp "$ROOT/project/obj/project.assets.json" "$OUT/project.assets.json"
          find "$PKGS" -type f -printf '%P\n' | sort > "$OUT/package-file-list.txt"
          tar -C "$ROOT" -czf "$OUT/signalr-messagepack-packages-10.0.10.tar.gz" packages
          sha256sum "$OUT/signalr-messagepack-packages-10.0.10.tar.gz" | tee "$OUT/SHA256SUMS.txt"
          du -sh "$PKGS" "$OUT"/* | tee "$OUT/SIZES.txt"
      - name: Upload package archive
        uses: actions/upload-artifact@v4
        with:
          name: signalr-messagepack-packages-10.0.10
          path: /tmp/signalr-msgpack-export/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
