name: Export source-build workflow status

on:
  push:
    paths:
      - '.github/workflows/export-source-build-status-20260817.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query source-build run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: b3212baa69dd7a3ee50f108f7228d09736db555a
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" > SOURCE_BUILD_RUNS.json
          python3 - <<'PY'
          import json
          data=json.load(open('SOURCE_BUILD_RUNS.json'))
          print(json.dumps([{
            'id':r['id'], 'name':r['name'], 'status':r['status'], 'conclusion':r['conclusion'],
            'created_at':r['created_at'], 'updated_at':r['updated_at']
          } for r in data.get('workflow_runs',[])], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-source-build-status
          retention-days: 1
          if-no-files-found: error
          path: SOURCE_BUILD_RUNS.json
