name: export-termmax-build-cache

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-termmax-build-cache.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build public pinned TermMax baseline
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax
          cd termmax
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d
          forge soldeer install
          rm -f test/v2/integration/ForkXauePriceFeedAdapter.t.sol
          sed -i 's/optimizer_runs = 200/optimizer_runs = 1/' foundry.toml
          forge build --use 0.8.30
          tar -czf "$GITHUB_WORKSPACE/termmax-build-cache-e314f3f.tar.gz" out cache foundry.toml remappings.txt
          cd "$GITHUB_WORKSPACE"
          sha256sum termmax-build-cache-e314f3f.tar.gz > SHA256SUMS.txt

      - name: Upload baseline build cache
        uses: actions/upload-artifact@v4
        with:
          name: termmax-build-cache-e314f3f
          path: |
            termmax-build-cache-e314f3f.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
