name: export-termmax-dependencies

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-termmax-dependencies.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Resolve public TermMax dependencies
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax
          cd termmax
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d
          forge soldeer install
          test -d dependencies
          tar -czf "$GITHUB_WORKSPACE/termmax-dependencies-e314f3f.tar.gz" dependencies remappings.txt soldeer.lock
          cd "$GITHUB_WORKSPACE"
          sha256sum termmax-dependencies-e314f3f.tar.gz > SHA256SUMS.txt

      - name: Upload dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: termmax-dependencies-e314f3f
          path: |
            termmax-dependencies-e314f3f.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
