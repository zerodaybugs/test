name: Export Vercel Python Sandbox SDK

on:
  push:
    branches:
      - research/vercel-py-export-20260819
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Clone current public SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/vercel/vercel-py.git export
          git -C export rev-parse HEAD > export/UPSTREAM_COMMIT.txt
          rm -rf export/.git
      - name: Upload SDK corpus
        uses: actions/upload-artifact@v4
        with:
          name: vercel-py-current-source
          path: export/
          if-no-files-found: error
          retention-days: 1
