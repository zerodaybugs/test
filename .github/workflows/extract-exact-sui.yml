name: Extract exact Sui CLI

on:
  push:
    branches:
      - "sui-runtime-extract-*"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download and verify official release bundle
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/MystenLabs/sui/releases/download/testnet-v1.77.2/sui-testnet-v1.77.2-ubuntu-x86_64.tgz"
          expected="07456cf6bad1244973c3a9507f84a8b35857dc0316016b66c73aeebc61f64e94"
          curl --fail --location --retry 5 --retry-all-errors --output /tmp/sui-release.tgz "$url"
          printf '%s  %s\n' "$expected" /tmp/sui-release.tgz | sha256sum --check --strict

      - name: Extract only the exact sui executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/extracted /tmp/artifact
          member="$(tar -tzf /tmp/sui-release.tgz | awk '/(^|\/)sui$/{print; exit}')"
          test -n "$member"
          tar -xzf /tmp/sui-release.tgz -C /tmp/extracted "$member"
          cp "/tmp/extracted/$member" /tmp/artifact/sui
          chmod 0755 /tmp/artifact/sui
          file /tmp/artifact/sui | tee /tmp/artifact/FILE_TYPE.txt
          /tmp/artifact/sui --version | tee /tmp/artifact/VERSION.txt
          (cd /tmp/artifact && sha256sum sui FILE_TYPE.txt VERSION.txt > SHA256SUMS)

      - name: Upload exact executable only
        uses: actions/upload-artifact@v4
        with:
          name: sui-testnet-v1.77.2-linux-x86_64-exact
          path: /tmp/artifact/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
