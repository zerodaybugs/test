name: Fetch pinned PRoot v5.3.0 static binary

on:
  push:
    branches:
      - agent/monad-v0160-exact-vendor-20260811
    paths:
      - .github/workflows/fetch-proot-v530-20260812.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-proot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable upstream release asset
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://github.com/proot-me/proot/releases/download/v5.3.0/proot-v5.3.0-x86_64-static'
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            "$url" -o proot-v5.3.0-x86_64-static
          chmod 0755 proot-v5.3.0-x86_64-static
          file proot-v5.3.0-x86_64-static | tee proot.file.txt
          ./proot-v5.3.0-x86_64-static --version | tee proot.version.txt
          sha256sum proot-v5.3.0-x86_64-static | tee proot.sha256
          test "$(stat -c %s proot-v5.3.0-x86_64-static)" = '1901440'
      - name: Upload pinned binary
        uses: actions/upload-artifact@v4
        with:
          name: proot-v5.3.0-x86_64-static-${{ github.run_id }}
          path: |
            proot-v5.3.0-x86_64-static
            proot.file.txt
            proot.version.txt
            proot.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
