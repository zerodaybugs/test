name: Fetch Prysm v7.1.8 release assets

on:
  push:
    branches:
      - ci/fetch-prysm-v7.1.8
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-release-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download official Prysm release assets
        shell: bash
        env:
          VERSION: v7.1.8
        run: |
          set -euo pipefail
          mkdir -p prysm-release
          cd prysm-release
          base="https://github.com/OffchainLabs/prysm/releases/download/${VERSION}"
          files=(
            "beacon-chain-${VERSION}-linux-amd64"
            "beacon-chain-${VERSION}-linux-amd64.sha256"
            "beacon-chain-${VERSION}-linux-amd64.sig"
            "validator-${VERSION}-linux-amd64"
            "validator-${VERSION}-linux-amd64.sha256"
            "validator-${VERSION}-linux-amd64.sig"
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "${base}/${file}" --output "${file}"
          done
          sha256sum --check "beacon-chain-${VERSION}-linux-amd64.sha256"
          sha256sum --check "validator-${VERSION}-linux-amd64.sha256"
          chmod 0755 "beacon-chain-${VERSION}-linux-amd64" "validator-${VERSION}-linux-amd64"
          ./beacon-chain-${VERSION}-linux-amd64 --version | tee beacon-version.txt
          ./validator-${VERSION}-linux-amd64 --version | tee validator-version.txt
          sha256sum * | sort > all-assets.sha256

      - name: Checkout exact Prysm source tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v7.1.8 https://github.com/OffchainLabs/prysm.git prysm-v7.1.8-source
          cd prysm-v7.1.8-source
          test "$(git rev-parse HEAD)" = "51b5a75ebbadf05af22bd2601b5baf7a9e99b66d"
          git rev-parse HEAD > ../prysm-source-commit.txt
          rm -rf .git

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: prysm-v7.1.8-linux-amd64
          path: prysm-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: prysm-v7.1.8-source
          path: |
            prysm-v7.1.8-source/
            prysm-source-commit.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
