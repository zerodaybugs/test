name: Fetch Prysm v7.1.8 release assets

on:
  push:
    branches:
      - ci/fetch-prysm-v7.1.8
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-release-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Download official Prysm release assets
        shell: bash
        env:
          VERSION: v7.1.8
        run: |
          set -euo pipefail
          mkdir -p prysm-release
          cd prysm-release
          base="https://github.com/OffchainLabs/prysm/releases/download/${VERSION}"
          files=(
            "beacon-chain-${VERSION}-linux-amd64"
            "beacon-chain-${VERSION}-linux-amd64.sha256"
            "beacon-chain-${VERSION}-linux-amd64.sig"
            "validator-${VERSION}-linux-amd64"
            "validator-${VERSION}-linux-amd64.sha256"
            "validator-${VERSION}-linux-amd64.sig"
            "prysmctl-${VERSION}-linux-amd64"
            "prysmctl-${VERSION}-linux-amd64.sha256"
            "prysmctl-${VERSION}-linux-amd64.sig"
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "${base}/${file}" --output "${file}"
          done
          sha256sum --check "beacon-chain-${VERSION}-linux-amd64.sha256"
          sha256sum --check "validator-${VERSION}-linux-amd64.sha256"
          sha256sum --check "prysmctl-${VERSION}-linux-amd64.sha256"
          chmod 0755 \
            "beacon-chain-${VERSION}-linux-amd64" \
            "validator-${VERSION}-linux-amd64" \
            "prysmctl-${VERSION}-linux-amd64"
          ./beacon-chain-${VERSION}-linux-amd64 --version | tee beacon-version.txt
          ./validator-${VERSION}-linux-amd64 --version | tee validator-version.txt
          ./prysmctl-${VERSION}-linux-amd64 --help > prysmctl-help.txt
          sha256sum * | sort > all-assets.sha256

      - name: Checkout exact Prysm source tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v7.1.8 https://github.com/OffchainLabs/prysm.git prysm-v7.1.8-source
          cd prysm-v7.1.8-source
          test "$(git rev-parse HEAD)" = "51b5a75ebbadf05af22bd2601b5baf7a9e99b66d"
          git rev-parse HEAD > ../prysm-source-commit.txt

      - name: Warm exact verification-package dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd prysm-v7.1.8-source
          GOTOOLCHAIN=local go test ./beacon-chain/verification \
            -run '^$' -count=0 -timeout=25m

      - name: Export offline Go build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-go-env
          goroot="$(go env GOROOT)"
          gomodcache="$(go env GOMODCACHE)"
          gocache="$(go env GOCACHE)"
          printf 'GOROOT=%s\nGOMODCACHE=%s\nGOCACHE=%s\n' \
            "$goroot" "$gomodcache" "$gocache" > offline-go-env/paths.txt
          go version > offline-go-env/go-version.txt
          tar --zstd -cf offline-go-env/go-toolchain.tar.zst \
            -C "$(dirname "$goroot")" "$(basename "$goroot")"
          tar --zstd -cf offline-go-env/go-caches.tar.zst \
            -C "$HOME" go/pkg/mod .cache/go-build
          sha256sum offline-go-env/*.tar.zst | sort > offline-go-env/SHA256SUMS
          du -h offline-go-env/*
          rm -rf prysm-v7.1.8-source/.git

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: prysm-v7.1.8-linux-amd64
          path: prysm-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: prysm-v7.1.8-source
          path: |
            prysm-v7.1.8-source/
            prysm-source-commit.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Upload offline Go environment
        uses: actions/upload-artifact@v4
        with:
          name: prysm-v7.1.8-offline-go-env
          path: offline-go-env/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
