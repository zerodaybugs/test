name: Fetch Ubuntu Resolute libc6-dev 2.43-2ubuntu2.3

on:
  push:
    branches:
      - agent/monad-v0160-exact-vendor-20260811
    paths:
      - .github/workflows/fetch-ubuntu-resolute-libc6-dev-20260812.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect exact package
        shell: bash
        run: |
          set -Eeuo pipefail
          package='libc6-dev_2.43-2ubuntu2.3_amd64.deb'
          url="https://archive.ubuntu.com/ubuntu/pool/main/g/glibc/${package}"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            "$url" -o "$package"
          dpkg-deb --info "$package" | tee libc6-dev.info.txt
          dpkg-deb --contents "$package" | tee libc6-dev.contents.txt
          grep -Fq './usr/include/x86_64-linux-gnu/sys/cdefs.h' libc6-dev.contents.txt
          sha256sum "$package" | tee "$package.sha256"
          stat -c 'size=%s' "$package" | tee "$package.size.txt"
      - name: Upload exact package
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-resolute-libc6-dev-2.43-2ubuntu2.3-${{ github.run_id }}
          path: |
            libc6-dev_2.43-2ubuntu2.3_amd64.deb
            libc6-dev_2.43-2ubuntu2.3_amd64.deb.sha256
            libc6-dev.info.txt
            libc6-dev.contents.txt
            libc6-dev_2.43-2ubuntu2.3_amd64.deb.size.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
