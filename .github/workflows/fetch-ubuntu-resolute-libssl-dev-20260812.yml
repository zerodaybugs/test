name: Fetch Ubuntu Resolute libssl-dev 3.5.5-1ubuntu3.2

on:
  push:
    branches:
      - agent/monad-v0160-exact-vendor-20260811
    paths:
      - .github/workflows/fetch-ubuntu-resolute-libssl-dev-20260812.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect development package
        shell: bash
        run: |
          set -Eeuo pipefail
          package='libssl-dev_3.5.5-1ubuntu3.2_amd64.deb'
          url="https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/${package}"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            "$url" -o "$package"
          dpkg-deb --info "$package" | tee libssl-dev.info.txt
          dpkg-deb --contents "$package" | tee libssl-dev.contents.txt
          grep -Fq './usr/include/openssl/ssl.h' libssl-dev.contents.txt
          grep -Fq './usr/lib/x86_64-linux-gnu/pkgconfig/openssl.pc' libssl-dev.contents.txt
          sha256sum "$package" | tee "$package.sha256"
          stat -c 'size=%s' "$package" | tee "$package.size.txt"
      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-resolute-libssl-dev-3.5.5-1ubuntu3.2-${{ github.run_id }}
          path: |
            libssl-dev_3.5.5-1ubuntu3.2_amd64.deb
            libssl-dev_3.5.5-1ubuntu3.2_amd64.deb.sha256
            libssl-dev.info.txt
            libssl-dev.contents.txt
            libssl-dev_3.5.5-1ubuntu3.2_amd64.deb.size.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
