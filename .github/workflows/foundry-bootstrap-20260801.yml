name: Foundry bootstrap artifact

on:
  push:
    branches:
      - tooling/foundry-bootstrap-20260801
    paths:
      - '.github/workflows/foundry-bootstrap-20260801.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/foundry-bootstrap-20260801.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download official Foundry and Solidity 0.7.1 binaries
        shell: bash
        run: |
          set -euo pipefail
          foundry_url='https://github.com/foundry-rs/foundry/releases/download/nightly-716e451ca3b6073a1a91a22d7970cbbd1f5eb843/foundry_nightly_linux_amd64.tar.gz'
          solc_url='https://github.com/ethereum/solidity/releases/download/v0.7.1/solc-static-linux'
          curl --fail --location --retry 4 --retry-all-errors --output foundry-upstream.tar.gz "$foundry_url"
          mkdir toolchain
          tar -xzf foundry-upstream.tar.gz -C toolchain
          curl --fail --location --retry 4 --retry-all-errors --output toolchain/solc-0.7.1 "$solc_url"
          chmod +x toolchain/*
          ./toolchain/forge --version
          ./toolchain/anvil --version
          ./toolchain/solc-0.7.1 --version
          sha256sum toolchain/* | tee toolchain/SHA256SUMS.txt

      - name: Upload verified tool archive
        uses: actions/upload-artifact@v4
        with:
          name: foundry-solc071-linux-amd64-20260801
          path: toolchain/
          if-no-files-found: error
          retention-days: 1
