name: Foundry bootstrap artifact

on:
  push:
    branches:
      - tooling/foundry-bootstrap-20260801
    paths:
      - '.github/workflows/foundry-bootstrap-20260801.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download official Foundry nightly
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/foundry-rs/foundry/releases/download/nightly-716e451ca3b6073a1a91a22d7970cbbd1f5eb843/foundry_nightly_linux_amd64.tar.gz'
          curl --fail --location --retry 4 --retry-all-errors --output foundry-upstream.tar.gz "$url"
          mkdir foundry
          tar -xzf foundry-upstream.tar.gz -C foundry
          ./foundry/forge --version
          ./foundry/anvil --version
          sha256sum foundry/* | tee foundry/SHA256SUMS.txt

      - name: Upload verified tool archive
        uses: actions/upload-artifact@v4
        with:
          name: foundry-nightly-linux-amd64-20260801
          path: foundry/
          if-no-files-found: error
          retention-days: 1
