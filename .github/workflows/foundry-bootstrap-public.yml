name: Public Foundry and source bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/foundry-bootstrap-public.yml'
      - 'infra/foundry-bootstrap-trigger.txt'

permissions:
  contents: read

jobs:
  package-foundry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Package binaries and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundry-bootstrap/bin
          for binary in forge cast anvil chisel; do
            src="$(command -v "$binary")"
            cp "$src" "foundry-bootstrap/bin/$binary"
          done
          forge --version | tee foundry-bootstrap/forge-version.txt
          cast --version | tee foundry-bootstrap/cast-version.txt
          anvil --version | tee foundry-bootstrap/anvil-version.txt
          uname -a > foundry-bootstrap/runner.txt
          sha256sum foundry-bootstrap/bin/* > foundry-bootstrap/SHA256SUMS
          tar -C foundry-bootstrap -czf foundry-v1.7.1-linux-amd64.tar.gz .
          sha256sum foundry-v1.7.1-linux-amd64.tar.gz > foundry-v1.7.1-linux-amd64.tar.gz.sha256

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundry-v1.7.1-linux-amd64
          path: |
            foundry-v1.7.1-linux-amd64.tar.gz
            foundry-v1.7.1-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  package-termmax-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Fetch exact public TermMax source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags \
            https://github.com/term-structure/termmax-contract-v2.git termmax-contract-v2
          git -C termmax-contract-v2 checkout --detach \
            e314f3f849577dfecd4614f148c4df81fdf8c72d
          git -C termmax-contract-v2 rev-parse HEAD | tee termmax-head.txt
          (
            cd termmax-contract-v2
            forge soldeer update
            forge build --use 0.8.30 --optimizer-runs 1 --via-ir
          ) 2>&1 | tee termmax-public-build.log

      - name: Package source, dependencies, and compiler cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf termmax-contract-v2/.git termmax-contract-v2/out termmax-contract-v2/cache
          mkdir -p termmax-public-bundle
          mv termmax-contract-v2 termmax-public-bundle/
          cp termmax-head.txt termmax-public-build.log termmax-public-bundle/
          cp -a "$HOME/.svm" termmax-public-bundle/svm
          find termmax-public-bundle -type f -print0 | sort -z | xargs -0 sha256sum \
            > termmax-public-bundle/SHA256SUMS
          tar -czf termmax-e314-public-source-deps.tar.gz termmax-public-bundle
          sha256sum termmax-e314-public-source-deps.tar.gz \
            > termmax-e314-public-source-deps.tar.gz.sha256

      - name: Upload exact public source bundle
        uses: actions/upload-artifact@v4
        with:
          name: termmax-e314-public-source-deps
          path: |
            termmax-e314-public-source-deps.tar.gz
            termmax-e314-public-source-deps.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
