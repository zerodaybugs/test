name: Pinned Foundry and solc bundle

# Reproducibility trigger: 2026-07-24
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/foundry-solc-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/foundry-solc-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned release binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out work
          mkdir -p out/bin work
          curl -fL --retry 5 \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz \
            -o work/foundry.tar.gz
          tar -xzf work/foundry.tar.gz -C out/bin
          for version in 0.8.20 0.8.29; do
            curl -fL --retry 5 \
              "https://github.com/ethereum/solidity/releases/download/v${version}/solc-static-linux" \
              -o "out/bin/solc-${version}"
          done
          chmod 0755 out/bin/*
          out/bin/forge --version | tee out/forge-version.txt
          out/bin/cast --version | tee out/cast-version.txt
          out/bin/anvil --version | tee out/anvil-version.txt
          out/bin/solc-0.8.20 --version | tee out/solc-0.8.20-version.txt
          out/bin/solc-0.8.29 --version | tee out/solc-0.8.29-version.txt
          sha256sum work/foundry.tar.gz > out/foundry-archive.sha256
          find out/bin -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/BINARY_SHA256SUMS
          {
            uname -a
            git --version
          } > out/ENVIRONMENT.txt
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-v1.7.1-solc-0.8.20-0.8.29-linux-amd64
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
