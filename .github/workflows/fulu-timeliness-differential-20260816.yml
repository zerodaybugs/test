name: Fulu timeliness multi-client exact-release scan

on:
  push:
    branches:
      - tmp/fulu-timeliness-differential-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v6

      - name: Fetch exact stable client releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf work research/fulu_timeliness/results
          mkdir -p work research/fulu_timeliness/results

          fetch_release() {
            local name="$1"
            local repo="$2"
            local api="https://api.github.com/repos/${repo}/releases/latest"
            local json tag sha
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            tag="$(jq -r '.tag_name // empty' <<<"$json")"
            if [[ -z "$tag" ]]; then
              printf '%s\t%s\t%s\n' "$name" "$repo" "NO_STABLE_RELEASE" >> research/fulu_timeliness/results/RELEASES.tsv
              return 0
            fi
            git clone --quiet --filter=blob:none --depth 1 --branch "$tag" "https://github.com/${repo}.git" "work/${name}"
            sha="$(git -C "work/${name}" rev-parse HEAD)"
            printf '%s\t%s\t%s\t%s\n' "$name" "$repo" "$tag" "$sha" >> research/fulu_timeliness/results/RELEASES.tsv
          }

          fetch_release prysm OffchainLabs/prysm
          fetch_release lighthouse sigp/lighthouse
          fetch_release teku Consensys/teku
          fetch_release nimbus status-im/nimbus-eth2
          fetch_release lodestar ChainSafe/lodestar
          if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/grandinetech/grandine >/dev/null; then
            fetch_release grandine grandinetech/grandine
          fi

          # Pin the normative Fulu reference independently of client code.
          git clone --quiet --filter=blob:none --depth 1 --branch v1.6.1 \
            https://github.com/ethereum/consensus-specs.git work/consensus-specs
          printf 'consensus-specs\tethereum/consensus-specs\tv1.6.1\t%s\n' \
            "$(git -C work/consensus-specs rev-parse HEAD)" >> research/fulu_timeliness/results/RELEASES.tsv

      - name: Extract timeliness and DA call sites
        shell: bash
        run: |
          set -euo pipefail
          TIMELY='block.?timeliness|timeliness|is[_A-Za-z]*timely|timely[_A-Za-z]*block|block[_A-Za-z]*timely|proposer.?boost'
          DA='data.?availab|availability.?check|is_data_available|data.?column|column.?sidecar|blob.?sidecar|peer.?das|peerdas'

          mkdir -p research/fulu_timeliness/results/snapshots
          : > research/fulu_timeliness/results/COOCCURRENCE.tsv

          for dir in work/prysm work/lighthouse work/teku work/nimbus work/lodestar work/grandine; do
            [[ -d "$dir" ]] || continue
            name="${dir#work/}"
            out="research/fulu_timeliness/results/${name}"
            snap="research/fulu_timeliness/results/snapshots/${name}"
            mkdir -p "$out" "$snap"

            rg -n -i --hidden \
              -g '!**/.git/**' -g '!**/node_modules/**' -g '!**/vendor/**' \
              -g '!**/target/**' -g '!**/build/**' -g '!**/dist/**' \
              "$TIMELY" "$dir" > "$out/TIMELINESS_MATCHES.txt" || true
            rg -n -i --hidden \
              -g '!**/.git/**' -g '!**/node_modules/**' -g '!**/vendor/**' \
              -g '!**/target/**' -g '!**/build/**' -g '!**/dist/**' \
              "$DA" "$dir" > "$out/DATA_AVAILABILITY_MATCHES.txt" || true

            mapfile -t timely_files < <(rg -l -i --hidden \
              -g '!**/.git/**' -g '!**/node_modules/**' -g '!**/vendor/**' \
              -g '!**/target/**' -g '!**/build/**' -g '!**/dist/**' \
              "$TIMELY" "$dir" | head -n 100 || true)

            for f in "${timely_files[@]}"; do
              if rg -q -i "$DA" "$f"; then
                rel="${f#${dir}/}"
                printf '%s\t%s\n' "$name" "$rel" >> research/fulu_timeliness/results/COOCCURRENCE.tsv
                mkdir -p "$snap/$(dirname "$rel")"
                cp "$f" "$snap/$rel"
              fi
            done
          done

          mkdir -p research/fulu_timeliness/results/spec
          cp work/consensus-specs/specs/fulu/fork-choice.md \
            research/fulu_timeliness/results/spec/fulu-fork-choice-v1.6.1.md

      - name: Generate structural triage report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          root = Path('research/fulu_timeliness/results')
          releases = []
          for line in (root / 'RELEASES.tsv').read_text().splitlines():
              parts = line.split('\t')
              releases.append({
                  'client': parts[0],
                  'repository': parts[1],
                  'tag': parts[2] if len(parts) > 2 else None,
                  'sha': parts[3] if len(parts) > 3 else None,
              })

          records = []
          co = root / 'COOCCURRENCE.tsv'
          if co.exists():
              for line in co.read_text().splitlines():
                  if not line.strip():
                      continue
                  client, rel = line.split('\t', 1)
                  p = root / 'snapshots' / client / rel
                  text = p.read_text(errors='replace')
                  lines = text.splitlines()
                  timely = [i + 1 for i, s in enumerate(lines) if re.search(r'(?i)(timeliness|timely|proposer.?boost)', s)]
                  da = [i + 1 for i, s in enumerate(lines) if re.search(r'(?i)(data.?availab|availability.?check|data.?column|column.?sidecar|peer.?das|peerdas)', s)]
                  records.append({
                      'client': client,
                      'path': rel,
                      'timeliness_lines': timely[:50],
                      'availability_lines': da[:50],
                      'first_timeliness_line': min(timely) if timely else None,
                      'first_availability_line': min(da) if da else None,
                      'requires_manual_control_flow_review': True,
                  })

          result = {
              'schema': 'fulu-timeliness-multiclient-scan-v1',
              'normative_rule': 'Fulu on_block checks data availability before recording block timeliness.',
              'releases': releases,
              'cooccurrence_files': records,
              'severity_gate': 'HOLD_MANUAL_CONTROL_FLOW_REVIEW',
              'note': 'Textual ordering alone is not a verdict; each import path must be traced and exact runtime-tested.'
          }
          (root / 'SCAN.json').write_text(json.dumps(result, indent=2))
          PY

      - name: Persist scan results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fulu_timeliness/results
          if ! git diff --cached --quiet; then
            git commit -m "research: record Fulu timeliness exact-release scan [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload scan evidence
        uses: actions/upload-artifact@v7
        with:
          name: fulu-timeliness-multiclient-exact-scan
          retention-days: 1
          path: research/fulu_timeliness/results
