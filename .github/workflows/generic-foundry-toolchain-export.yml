name: Generic Foundry toolchain export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generic-foundry-toolchain-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Package binaries and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bin
          for binary in forge cast anvil chisel; do
            path="$(command -v "$binary")"
            cp "$path" "out/bin/$binary"
          done
          {
            forge --version
            cast --version
            anvil --version
            uname -a
          } | tee out/VERSIONS.txt
          sha256sum out/bin/* out/VERSIONS.txt > out/SHA256SUMS
          tar -czf out/foundry-linux-amd64.tar.gz -C out bin VERSIONS.txt SHA256SUMS

      - name: Upload toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-foundry-linux-amd64
          path: out/foundry-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
