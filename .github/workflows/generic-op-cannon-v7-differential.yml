name: Generic OP Cannon v7 exact differential

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generic-op-cannon-v7-differential.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: generic-op-cannon-v7-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOFLAGS: "-trimpath"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-contracts/v7.0.0
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          expected="a7c88c8d636ceb9944ea0edaf7d033da258778ab"
          actual="$(git -C upstream rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install native utilities and just
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq unzip zip zstd
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore pinned Foundry and multi-solc tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool-artifacts/foundry tool-artifacts/contracts "$HOME/.local/bin"
          gh run download 30477191194 -R zerodaybugs/test -n generic-foundry-linux-amd64 -D tool-artifacts/foundry
          tar -xzf tool-artifacts/foundry/foundry-linux-amd64.tar.gz -C tool-artifacts/foundry
          cp tool-artifacts/foundry/bin/{forge,cast,anvil,chisel} "$HOME/.local/bin/"

          gh run download 30477191612 -R zerodaybugs/test -n generic-op-contracts-v7-test-tools-linux-amd64 -D tool-artifacts/contracts
          tar -xzf tool-artifacts/contracts/op-contracts-v7-test-tools-linux-amd64.tar.gz -C tool-artifacts/contracts
          cp tool-artifacts/contracts/bin/go-ffi "$HOME/.local/bin/go-ffi"
          for version in 0.8.10 0.8.15 0.8.19 0.8.25; do
            mkdir -p "$HOME/.svm/$version"
            cp "tool-artifacts/contracts/bin/solc-$version" "$HOME/.svm/$version/solc-$version"
            chmod +x "$HOME/.svm/$version/solc-$version"
          done
          chmod +x "$HOME/.local/bin/"*
          "$HOME/.local/bin/forge" --version
          "$HOME/.svm/0.8.15/solc-0.8.15" --version

      - name: Set up root Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.13'
          cache: false

      - name: Prepare generated Superchain data and module graph
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          ./op-core/superchain/sync-superchain.sh
          go mod download
          go version

      - name: Build exact MIPS64 and PreimageOracle Foundry artifacts
        shell: bash
        working-directory: upstream/packages/contracts-bedrock
        env:
          FOUNDRY_PROFILE: lite
        run: |
          set -euo pipefail
          forge build --offline --deny never \
            src/cannon/MIPS64.sol src/cannon/PreimageOracle.sol
          test -s forge-artifacts/MIPS64.sol/MIPS64.json
          test -s forge-artifacts/PreimageOracle.sol/PreimageOracle.json
          sha256sum \
            forge-artifacts/MIPS64.sol/MIPS64.json \
            forge-artifacts/PreimageOracle.sol/PreimageOracle.json

      - name: Build Go 1.24.2 Cannon ELF fixtures
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.2'
          cache: false

      - name: Compile Go 1.24.2 modules for MIPS64
        shell: bash
        working-directory: upstream/cannon/testdata/go-1-24
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p bin
          count=0
          for mod in */go.mod; do
            if grep -q '^toolchain go1\.24\.2$' "$mod"; then
              name="$(dirname "$mod")"
              echo "[go1.24.2] $name"
              (cd "$name" && GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -o "../bin/${name}.64.elf" .)
              count=$((count+1))
            fi
          done
          echo "built_go_1_24_2=$count"
          test "$count" -gt 0

      - name: Build Go 1.24.10 Cannon ELF fixtures
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.10'
          cache: false

      - name: Compile Go 1.24.10 modules for MIPS64
        shell: bash
        working-directory: upstream/cannon/testdata/go-1-24
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p bin
          count=0
          for mod in */go.mod; do
            if grep -q '^toolchain go1\.24\.10$' "$mod"; then
              name="$(dirname "$mod")"
              echo "[go1.24.10] $name"
              (cd "$name" && GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -o "../bin/${name}.64.elf" .)
              count=$((count+1))
            fi
          done
          echo "built_go_1_24_10=$count"
          test "$count" -gt 0

      - name: Build Go 1.25.4 Cannon ELF fixtures
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.4'
          cache: false

      - name: Compile Go 1.25.4 modules for MIPS64
        shell: bash
        working-directory: upstream/cannon/testdata/go-1-25
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p bin
          count=0
          for mod in */go.mod; do
            name="$(dirname "$mod")"
            echo "[go1.25.4] $name"
            (cd "$name" && GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -o "../bin/${name}.64.elf" .)
            count=$((count+1))
          done
          echo "built_go_1_25_4=$count"
          test "$count" -gt 0

      - name: Inventory exact ELF corpus
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p ../out
          find cannon/testdata/go-1-24/bin cannon/testdata/go-1-25/bin \
            -type f -name '*.64.elf' -print | sort | tee ../out/elf-list.txt
          find cannon/testdata/go-1-24/bin cannon/testdata/go-1-25/bin \
            -type f -name '*.64.elf' -print0 | sort -z | xargs -0 sha256sum > ../out/elf-SHA256SUMS
          echo "elf_count=$(wc -l < ../out/elf-list.txt)"
          test "$(wc -l < ../out/elf-list.txt)" -ge 40

      - name: Restore root Go toolchain for differential tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.13'
          cache: false

      - name: Run complete Go-to-Solidity MIPS64 differential suite
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          set -o pipefail
          go test ./cannon/mipsevm/tests \
            -run '^TestEVM' -count=1 -timeout=180m -v \
            2>&1 | tee ../out/evm-differential-complete.log

      - name: Run complete Cannon state-machine and ELF execution suite
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          set -o pipefail
          go test ./cannon/mipsevm/... -count=1 -timeout=180m -v \
            2>&1 | tee ../out/cannon-complete.log

      - name: Run high-risk Cannon fuzz targets
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          set -o pipefail
          targets=(
            FuzzMulOp FuzzMultOp FuzzMultuOp
            FuzzStateSyscallBrk FuzzStateSyscallMmap FuzzStateSyscallExitGroup
            FuzzStateSyscallFcntl FuzzStateHintRead FuzzStatePreimageRead
            FuzzStateHintWrite FuzzStatePreimageWrite FuzzStateSyscallCloneMT
          )
          : > ../out/fuzz-summary.log
          for target in "${targets[@]}"; do
            echo "===== $target =====" | tee -a ../out/fuzz-summary.log
            go test ./cannon/mipsevm/tests -run '^$' -fuzz "^${target}$" \
              -fuzztime=12s -parallel=2 -timeout=3m \
              2>&1 | tee "../out/fuzz-${target}.log"
          done

      - name: Record provenance and upload evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "source_tag=op-contracts/v7.0.0"
            echo "source_commit=$(git -C upstream rev-parse HEAD 2>/dev/null || true)"
            echo "source_tree=$(git -C upstream rev-parse HEAD^{tree} 2>/dev/null || true)"
            echo "go=$(go version 2>/dev/null || true)"
            echo "forge=$(forge --version 2>/dev/null | head -1 || true)"
            echo "runner=$(uname -a)"
          } > out/MANIFEST.txt
          find out -type f -maxdepth 2 -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS

      - name: Upload exact Cannon differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-cannon-v7-exact-complete-differential
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
