name: Generic OP Cannon v7 full ELF differential corpus

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generic-op-cannon-v7-full-elf-corpus.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: generic-op-cannon-v7-full-elf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GOFLAGS: "-trimpath"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-contracts/v7.0.0
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          expected="a7c88c8d636ceb9944ea0edaf7d033da258778ab"
          actual="$(git -C upstream rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install native tools and exact Foundry/Solidity toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq unzip zstd
          mkdir -p "$HOME/.local/bin" "$HOME/.svm" tool-artifacts upstream/out

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/zerodaybugs/test/actions/artifacts/8734097551/zip" \
            -o tool-artifacts/foundry.zip
          unzip -q tool-artifacts/foundry.zip -d tool-artifacts/foundry
          mkdir -p tool-artifacts/foundry-unpacked
          tar -xzf tool-artifacts/foundry/foundry-linux-amd64.tar.gz -C tool-artifacts/foundry-unpacked
          cp tool-artifacts/foundry-unpacked/bin/* "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/forge" "$HOME/.local/bin/cast" "$HOME/.local/bin/anvil" "$HOME/.local/bin/chisel"

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/zerodaybugs/test/actions/artifacts/8734150444/zip" \
            -o tool-artifacts/solc.zip
          unzip -q tool-artifacts/solc.zip -d tool-artifacts/solc
          tar -xzf tool-artifacts/solc/op-contracts-v7-test-tools-linux-amd64.tar.gz -C tool-artifacts/solc
          for version in 0.8.10 0.8.15 0.8.19 0.8.25; do
            mkdir -p "$HOME/.svm/${version}"
            cp "tool-artifacts/solc/bin/solc-${version}" "$HOME/.svm/${version}/solc-${version}"
            chmod +x "$HOME/.svm/${version}/solc-${version}"
          done
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          forge --version
          for version in 0.8.10 0.8.15 0.8.19 0.8.25; do
            "$HOME/.svm/${version}/solc-${version}" --version | tail -n 1
          done

      - name: Prepare generated Superchain data
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          if ! command -v just >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          fi
          ./op-core/superchain/sync-superchain.sh

      - name: Set up Go 1.24.2
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.2'
          cache: false

      - name: Build exact Go 1.24.2 MIPS64 ELF fixtures
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p cannon/testdata/go-1-24/bin out
          count=0
          for mod in cannon/testdata/go-1-24/*/go.mod; do
            toolchain="$(awk '$1 == "toolchain" { print $2 }' "$mod")"
            [[ "$toolchain" == "go1.24.2" ]] || continue
            dir="$(dirname "$mod")"
            name="$(basename "$dir")"
            echo "building ${name} with $(go version)"
            (cd "$dir" && GOTOOLCHAIN=local GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -o "../bin/${name}.64.elf" .)
            count=$((count + 1))
          done
          echo "go1.24.2_count=${count}" | tee out/go1.24.2-count.txt
          test "$count" -eq 20

      - name: Set up Go 1.24.10
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.10'
          cache: false

      - name: Build exact Go 1.24.10 MIPS64 ELF fixtures
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          count=0
          for mod in cannon/testdata/go-1-24/*/go.mod; do
            toolchain="$(awk '$1 == "toolchain" { print $2 }' "$mod")"
            [[ "$toolchain" == "go1.24.10" ]] || continue
            dir="$(dirname "$mod")"
            name="$(basename "$dir")"
            echo "building ${name} with $(go version)"
            (cd "$dir" && GOTOOLCHAIN=local GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -o "../bin/${name}.64.elf" .)
            count=$((count + 1))
          done
          echo "go1.24.10_count=${count}" | tee out/go1.24.10-count.txt
          test "$count" -eq 2

      - name: Set up Go 1.25.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false

      - name: Build exact Go 1.25.4 MIPS64 ELF fixtures
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p cannon/testdata/go-1-25/bin
          count=0
          for mod in cannon/testdata/go-1-25/*/go.mod; do
            toolchain="$(awk '$1 == "toolchain" { print $2 }' "$mod")"
            [[ "$toolchain" == "go1.25.4" ]] || continue
            dir="$(dirname "$mod")"
            name="$(basename "$dir")"
            echo "building ${name} with $(go version)"
            (cd "$dir" && GOTOOLCHAIN=local GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -o "../bin/${name}.64.elf" .)
            count=$((count + 1))
          done
          echo "go1.25.4_count=${count}" | tee out/go1.25.4-count.txt
          test "$count" -eq 22

      - name: Record fixture provenance
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          find cannon/testdata/go-1-24/bin cannon/testdata/go-1-25/bin -type f -name '*.elf' -print0 \
            | sort -z | xargs -0 sha256sum | tee out/ELF_SHA256SUMS
          test "$(find cannon/testdata/go-1-24/bin -type f -name '*.elf' | wc -l)" -eq 22
          test "$(find cannon/testdata/go-1-25/bin -type f -name '*.elf' | wc -l)" -eq 22

      - name: Build exact MIPS64 and PreimageOracle Foundry artifacts
        shell: bash
        working-directory: upstream/packages/contracts-bedrock
        run: |
          set -euo pipefail
          rm -rf forge-artifacts cache
          set +e
          forge build --offline src/cannon/MIPS64.sol src/cannon/PreimageOracle.sol -vv \
            2>&1 | tee ../../out/forge-mips-oracle-build.log
          build_rc=${PIPESTATUS[0]}
          set -e
          test -s forge-artifacts/MIPS64.sol/MIPS64.json
          test -s forge-artifacts/PreimageOracle.sol/PreimageOracle.json
          echo "forge_exit=${build_rc}; artifacts_present=true" | tee ../../out/forge-artifact-status.txt
          sha256sum forge-artifacts/MIPS64.sol/MIPS64.json \
                    forge-artifacts/PreimageOracle.sol/PreimageOracle.json \
            | tee ../../out/FOUNDRY_ARTIFACT_SHA256SUMS

      - name: Set up repository Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache: false

      - name: Download locked module graph
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          go version | tee out/root-go-version.txt
          go mod download

      - name: Run exact full Go to Solidity MIPS64 differential corpus
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          set -o pipefail
          go test ./cannon/mipsevm/tests \
            -count=1 -timeout=210m -v 2>&1 | tee out/full-evm-differential.log

      - name: Run focused repeated high-risk program tests
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          set -o pipefail
          go test ./cannon/mipsevm/tests \
            -run 'TestEVM_(RandomProgram|EntryProgram|ClaimProgram|HelloProgram|SyscallEventFdProgram|SysGetRandom|MT_SysRead|MT_SysReadWrite|MT_StoreOpsClearMemReservation)' \
            -count=20 -timeout=90m -v 2>&1 | tee out/repeated-high-risk-programs.log

      - name: Export evidence
        if: always()
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "source_tag=op-contracts/v7.0.0"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "runner=$(uname -a)"
            echo "root_go=$(go version 2>/dev/null || true)"
          } | tee out/MANIFEST.txt
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS

      - name: Upload full differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-cannon-v7-full-elf-differential
          path: upstream/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
