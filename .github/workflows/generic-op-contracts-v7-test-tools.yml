name: Generic OP contracts v7 test tools export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generic-op-contracts-v7-test-tools.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-contracts/v7.0.0
          path: upstream
          fetch-depth: 1
          submodules: false

      - name: Set up repository Go version
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Build public go-ffi utility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bin
          cd upstream
          go build -trimpath -o ../out/bin/go-ffi ./packages/contracts-bedrock/scripts/go-ffi
          ../out/bin/go-ffi --help >/dev/null 2>&1 || true

      - name: Download official static solc 0.8.15
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://github.com/ethereum/solidity/releases/download/v0.8.15/solc-static-linux \
            --output out/bin/solc-0.8.15
          chmod +x out/bin/solc-0.8.15
          out/bin/solc-0.8.15 --version | tee out/SOLC_VERSION.txt

      - name: Record provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_tag=op-contracts/v7.0.0"
            echo "source_commit=$(git -C upstream rev-parse HEAD)"
            echo "go=$(go version)"
          } | tee out/MANIFEST.txt
          sha256sum out/bin/go-ffi out/bin/solc-0.8.15 out/MANIFEST.txt out/SOLC_VERSION.txt > out/SHA256SUMS
          tar -czf out/op-contracts-v7-test-tools-linux-amd64.tar.gz -C out bin MANIFEST.txt SOLC_VERSION.txt SHA256SUMS

      - name: Upload tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-op-contracts-v7-test-tools-linux-amd64
          path: out/op-contracts-v7-test-tools-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
