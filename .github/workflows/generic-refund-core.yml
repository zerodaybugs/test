name: Compile generic refund core fixture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generic-refund-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile generic fixture with solc 0.8.26
        shell: bash
        run: |
          set -euo pipefail
          cat > RefundCore.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.26;
          interface IToken {
              function deposit(address to, uint256 amount) external returns (bool);
          }
          contract RefundCore {
              function depositPRC20Token(address token, uint256 amount, address recipient) external {
                  require(IToken(token).deposit(recipient, amount), "deposit failed");
              }
              function refundUnusedGas(
                  address gasToken,
                  uint256 amount,
                  address recipient,
                  bool,
                  uint24,
                  uint256
              ) external {
                  require(IToken(gasToken).deposit(recipient, amount), "refund failed");
              }
          }
          EOF
          npx --yes solc@0.8.26 --bin-runtime --abi --optimize --optimize-runs 200 RefundCore.sol -o out
          npx --yes solc@0.8.26 --version | tee solc-version.txt
          sha256sum RefundCore.sol out/* solc-version.txt > SHA256SUMS
          wc -c RefundCore.sol out/* | tee artifact-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: generic-refund-core-${{ github.run_id }}
          path: |
            RefundCore.sol
            out/
            solc-version.txt
            SHA256SUMS
            artifact-sizes.txt
          retention-days: 3
