name: Compile generic refund core fixture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generic-refund-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile generic fixture with solc 0.8.26
        shell: bash
        run: |
          set -euo pipefail
          cat > RefundCore.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.26;
          interface IToken {
              function deposit(address to, uint256 amount) external returns (bool);
          }
          contract RefundCore {
              function depositPRC20Token(address token, uint256 amount, address recipient) external {
                  require(IToken(token).deposit(recipient, amount), "deposit failed");
              }
              function refundUnusedGas(
                  address gasToken,
                  uint256 amount,
                  address recipient,
                  bool,
                  uint24,
                  uint256
              ) external {
                  require(IToken(gasToken).deposit(recipient, amount), "refund failed");
              }
          }
          EOF
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund solc@0.8.26 >/dev/null
          cat > compile.js <<'EOF'
          const fs=require('fs');
          const solc=require('solc');
          const source=fs.readFileSync('RefundCore.sol','utf8');
          const input={language:'Solidity',sources:{'RefundCore.sol':{content:source}},settings:{optimizer:{enabled:true,runs:200},outputSelection:{'*':{'*':['abi','evm.bytecode.object','evm.deployedBytecode.object']}}}};
          const out=JSON.parse(solc.compile(JSON.stringify(input)));
          if(out.errors){ for(const e of out.errors) console.error(e.formattedMessage); if(out.errors.some(e=>e.severity==='error')) process.exit(1); }
          fs.mkdirSync('out',{recursive:true});
          for(const [name,c] of Object.entries(out.contracts['RefundCore.sol'])){
            fs.writeFileSync(`out/${name}.abi`,JSON.stringify(c.abi,null,2)+'\n');
            fs.writeFileSync(`out/${name}.bin`,c.evm.bytecode.object+'\n');
            fs.writeFileSync(`out/${name}.bin-runtime`,c.evm.deployedBytecode.object+'\n');
          }
          console.log(solc.version());
          EOF
          node compile.js | tee solc-version.txt
          sha256sum RefundCore.sol compile.js out/* solc-version.txt > SHA256SUMS
          wc -c RefundCore.sol compile.js out/* | tee artifact-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: generic-refund-core-${{ github.run_id }}
          path: |
            RefundCore.sol
            compile.js
            out/
            solc-version.txt
            SHA256SUMS
            artifact-sizes.txt
          retention-days: 3
