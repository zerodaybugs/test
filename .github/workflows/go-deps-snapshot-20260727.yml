name: Go dependency snapshot 20260727

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout public source dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/rsksmart/liquidity-provider-server.git "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" checkout --detach 50ade621592a3eec48f431f282d074ce08a7781a
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = "50ade621592a3eec48f431f282d074ce08a7781a"

      - name: Install exact Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.8'
          cache: false

      - name: Materialize modules and validate baseline package
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/source"
          go version | tee "$RUNNER_TEMP/go-version.txt"
          go mod download
          go test ./internal/adapters/dataproviders/bitcoin \
            -run '^TestNewDerivativeWallet$' -count=1 -timeout=10m \
            | tee "$RUNNER_TEMP/baseline-test.log"

          GOROOT_PATH="$(go env GOROOT)"
          GOMODCACHE_PATH="$(go env GOMODCACHE)"
          STAGE="$RUNNER_TEMP/go-dependency-snapshot"
          mkdir -p "$STAGE/goroot" "$STAGE/gomodcache"
          cp -a "$GOROOT_PATH"/. "$STAGE/goroot/"
          cp -a "$GOMODCACHE_PATH"/. "$STAGE/gomodcache/"
          cp "$RUNNER_TEMP/go-version.txt" "$STAGE/"
          cp "$RUNNER_TEMP/baseline-test.log" "$STAGE/"
          {
            echo "source_commit=50ade621592a3eec48f431f282d074ce08a7781a"
            echo "go_version=$(go version)"
            echo "goroot_source=$GOROOT_PATH"
            echo "gomodcache_source=$GOMODCACHE_PATH"
          } > "$STAGE/MANIFEST.txt"
          find "$STAGE" -type f -print0 | sort -z | xargs -0 sha256sum > "$STAGE/ALL_FILES_SHA256.txt"
          tar --zstd -cf "$RUNNER_TEMP/go-dependency-snapshot-20260727.tar.zst" -C "$STAGE" .
          sha256sum "$RUNNER_TEMP/go-dependency-snapshot-20260727.tar.zst" \
            > "$RUNNER_TEMP/go-dependency-snapshot-20260727.tar.zst.sha256"

      - name: Upload Go dependency snapshot
        uses: actions/upload-artifact@v4
        with:
          name: go-dependency-snapshot-20260727
          path: |
            ${{ runner.temp }}/go-dependency-snapshot-20260727.tar.zst
            ${{ runner.temp }}/go-dependency-snapshot-20260727.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
