name: Granite deployed source capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/granite-deployed-source.yml'
      - 'public-data/granite-source-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout capture branch
        uses: actions/checkout@v4
        with:
          ref: granite-deployed-source-20260724
          fetch-depth: 0

      - name: Fetch immutable deployed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-data/granite
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://api.hiro.so/v2/contracts/source/SP26NGV9AFZBX7XBDBS2C7EC7FCPSAV9PKREQNMVS/borrower-v1?proof=0' \
            -o /tmp/borrower-source.json
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          payload = json.loads(Path('/tmp/borrower-source.json').read_text())
          source = payload['source']
          out = Path('public-data/granite')
          out.joinpath('borrower-v1.clar').write_text(source, encoding='utf-8')
          signatures = []
          for line in source.splitlines():
              if line.lstrip().startswith('(define-public '):
                  signatures.append(line.strip())
          # Preserve multiline public headers by extracting balanced forms up to first body expression.
          names = re.findall(r'\(define-public\s+\(([^\s()]+)', source)
          out.joinpath('borrower-v1-public-functions.json').write_text(
              json.dumps({'names': names, 'source_sha256': hashlib.sha256(source.encode()).hexdigest()}, indent=2),
              encoding='utf-8')
          PY
          sha256sum public-data/granite/borrower-v1.clar > public-data/granite/SHA256SUMS

      - name: Commit public source evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/granite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture public deployed Granite borrower source [skip ci]'
          git push origin HEAD:granite-deployed-source-20260724
