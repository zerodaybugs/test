name: Granite deployed source capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/granite-deployed-source.yml'
      - 'public-data/granite-source-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout capture branch
        uses: actions/checkout@v4
        with:
          ref: granite-deployed-source-20260724
          fetch-depth: 0

      - name: Fetch immutable deployed sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-data/granite
          python3 - <<'PY'
          import hashlib, json, re, time, urllib.request
          from pathlib import Path

          contracts = {
              'borrower-v1': ('SP26NGV9AFZBX7XBDBS2C7EC7FCPSAV9PKREQNMVS', 'borrower-v1'),
              'pyth-adapter-v1': ('SP26NGV9AFZBX7XBDBS2C7EC7FCPSAV9PKREQNMVS', 'pyth-adapter-v1'),
              'withdrawal-caps-v1': ('SP26NGV9AFZBX7XBDBS2C7EC7FCPSAV9PKREQNMVS', 'withdrawal-caps-v1'),
              'liquidator-v1': ('SP26NGV9AFZBX7XBDBS2C7EC7FCPSAV9PKREQNMVS', 'liquidator-v1'),
              'state-v1': ('SP35E2BBMDT2Y1HB0NTK139YBGYV3PAPK3WA8BRNA', 'state-v1'),
              'math-v1': ('SP35E2BBMDT2Y1HB0NTK139YBGYV3PAPK3WA8BRNA', 'math-v1'),
          }
          out = Path('public-data/granite')
          manifest = {}
          for label, (address, name) in contracts.items():
              url = f'https://api.hiro.so/v2/contracts/source/{address}/{name}?proof=0'
              last = None
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'public-source-compatibility-check/1.0'})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          payload = json.loads(response.read().decode())
                      break
                  except Exception as exc:
                      last = exc
                      if attempt == 4:
                          raise
                      time.sleep(2 ** attempt)
              source = payload['source']
              path = out / f'{label}.clar'
              path.write_text(source, encoding='utf-8')
              manifest[label] = {
                  'contract_id': f'{address}.{name}',
                  'source_sha256': hashlib.sha256(source.encode()).hexdigest(),
                  'public_functions': re.findall(r'\(define-public\s+\(([^\s()]+)', source),
              }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          PY
          find public-data/granite -maxdepth 1 -type f -name '*.clar' -print | LC_ALL=C sort | xargs sha256sum > public-data/granite/SHA256SUMS

      - name: Commit public source evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/granite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture public deployed Granite sources [skip ci]'
          git push origin HEAD:granite-deployed-source-20260724
