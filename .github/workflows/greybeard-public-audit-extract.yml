name: Greybeard public Hermetica audit extract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/greybeard-public-audit-extract.yml'
      - 'public-data/greybeard-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: greybeard-audit-extract-20260724
          fetch-depth: 0

      - name: Extract relevant public audit sections
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p public-data/greybeard
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://raw.githubusercontent.com/greybeard-security/audit-reports/main/hermetica-hbtc-2025-11.pdf' \
            -o /tmp/hermetica-hbtc-2025-11.pdf
          pdftotext -layout /tmp/hermetica-hbtc-2025-11.pdf /tmp/hermetica-hbtc-2025-11.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/hermetica-hbtc-2025-11.txt').read_text(encoding='utf-8', errors='replace')
          lines = text.splitlines()
          needles = [
              'Precision loss allows for a share price increase after funding a claim',
              'Consider minimum redeem sizes to avoid potential attacks based on small amounts',
              'Inequivalence between fund-claim and fund-claim-many',
          ]
          out = []
          for needle in needles:
              matches = [i for i, line in enumerate(lines) if needle.lower() in line.lower()]
              out.append('=' * 96)
              out.append(needle)
              out.append('=' * 96)
              if not matches:
                  out.append('NOT FOUND')
                  continue
              for idx in matches:
                  start = max(0, idx - 8)
                  end = min(len(lines), idx + 130)
                  out.extend(lines[start:end])
                  out.append('\n--- END MATCH WINDOW ---\n')
          Path('public-data/greybeard/hermetica-relevant-sections.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          sha256sum /tmp/hermetica-hbtc-2025-11.pdf > public-data/greybeard/hermetica-hbtc-2025-11.sha256

      - name: Commit extracted public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/greybeard
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: extract relevant public Greybeard audit sections [skip ci]'
          git push origin HEAD:greybeard-audit-extract-20260724
