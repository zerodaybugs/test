name: Hermetica active minter sources

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-active-minter-sources.yml'
      - 'public-data/hermetica-active-minter-sources-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture active contract minters
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-active-minter-sources
          mkdir -p "$OUT"
          API='https://api.hiro.so'
          cat > "$OUT/contracts.txt" <<'EOF'
          SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.flh
          SP1A4X1ZFXGE4J28ZQ9QG3JNRCQ4AK6R10PECHVVP.liquidator
          SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D.hermetica-interface-hbtc-v1
          EOF
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            addr="${cid%%.*}"
            name="${cid#*.}"
            curl --fail --location --retry 8 --retry-all-errors "$API/extended/v1/contract/$cid" -o "$OUT/$cid.metadata.json"
            curl --fail --location --retry 8 --retry-all-errors "$API/v2/contracts/source/$addr/$name?proof=0" -o "$OUT/$cid.source.json"
            python3 - "$OUT/$cid.source.json" "$OUT/$cid.clar" <<'PY'
          import json,sys,pathlib
          src=json.loads(pathlib.Path(sys.argv[1]).read_text()).get('source','')
          pathlib.Path(sys.argv[2]).write_text(src)
          PY
          done < "$OUT/contracts.txt"
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('/tmp/hermetica-active-minter-sources')
          rows=[]
          for cid in root.joinpath('contracts.txt').read_text().splitlines():
            cid=cid.strip()
            if not cid: continue
            meta=json.loads(root.joinpath(cid+'.metadata.json').read_text())
            src=root.joinpath(cid+'.clar').read_text()
            funcs=re.findall(r'\(define-public\s+\(([^\s\)]+)',src)
            rows.append({'contract_id':cid,'tx_id':meta.get('tx_id'),'block_height':meta.get('block_height'),'burn_block_time':meta.get('burn_block_time'),'source_bytes':len(src.encode()),'public_functions':funcs})
          root.joinpath('summary.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
          (cd "$OUT" && sha256sum contracts.txt *.json *.clar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-active-minter-sources
          path: /tmp/hermetica-active-minter-sources
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
