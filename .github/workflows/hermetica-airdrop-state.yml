name: Hermetica airdrop public state

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-airdrop-state.yml'
      - 'public-data/hermetica-airdrop-state-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-airdrop
          cd /tmp/hermetica-airdrop
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0
      - name: Capture public whitelist and balances
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-airdrop
          cat > capture.cjs <<'NODE'
          const fs = require('fs');
          const { principalCV, cvToHex, hexToCV, cvToJSON } = require('@stacks/transactions');
          const API='https://api.hiro.so';
          const DEP='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const NAME='airdrop-v1';
          const CID=`${DEP}.${NAME}`;
          async function retry(url,opt={},n=8){let e;for(let i=0;i<n;i++){try{const r=await fetch(url,opt);if(r.ok)return r;const t=await r.text();e=new Error(`${r.status}: ${t}`);if(r.status<500&&r.status!==429)throw e;}catch(x){e=x;}await new Promise(r=>setTimeout(r,1000*(i+1)));}throw e;}
          async function history(){const a=[];for(let o=0;o<2000;o+=50){const r=await retry(`${API}/extended/v1/address/${encodeURIComponent(CID)}/transactions?limit=50&offset=${o}`);const b=await r.json();const rows=b.results||[];a.push(...rows);if(rows.length<50||a.length>=(b.total||2000))break;}return a;}
          async function read(fn,args=[]){const r=await retry(`${API}/v2/contracts/call-read/${DEP}/${NAME}/${fn}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:DEP,arguments:args.map(cvToHex)})});const b=await r.json();let d=null;if(b.result){try{d=cvToJSON(hexToCV(b.result));}catch(e){d={error:String(e),raw:b.result};}}return {okay:b.okay,cause:b.cause,result_raw:b.result,decoded:d};}
          function ps(x){const s=typeof x==='string'?x:JSON.stringify(x);return [...new Set([...s.matchAll(/((?:SP|SM)[0-9A-HJKMNP-TV-Z]{25,50}(?:\.[a-zA-Z0-9-]{1,128})?)/g)].map(m=>m[1]))];}
          (async()=>{const txs=await history();const direct=txs.filter(t=>t.tx_type==='contract_call'&&t.contract_call?.contract_id===CID);const candidates=new Set([DEP,CID]);for(const t of direct){if(t.sender_address)candidates.add(t.sender_address);for(const p of ps(t))candidates.add(p);}const whitelist={};for(const p of [...candidates].sort()){try{whitelist[p]=await read('get-whitelist',[principalCV(p)]);}catch(e){whitelist[p]={error:String(e)};}}
          const active={};for(const [p,v] of Object.entries(whitelist)){if(v.decoded?.value?.active?.value===true||v.decoded?.value?.active===true)active[p]=true;}
          const br=await retry(`${API}/extended/v1/address/${encodeURIComponent(CID)}/balances`);const balances=await br.json();const sourceState={};for(const p of Object.keys(active)){if(!p.includes('.'))continue;const [a,...rest]=p.split('.');const n=rest.join('.');const r=await fetch(`${API}/v2/contracts/source/${a}/${n}?proof=0`);if(r.ok){const b=await r.json();const src=b.source||'';const file=`active-${p.replace(/[^a-zA-Z0-9_.-]/g,'_')}.clar`;fs.writeFileSync(file,src);sourceState[p]={exists:true,file,public_functions:[...src.matchAll(/\(define-public\s+\(([^\s()]+)/g)].map(m=>m[1]),contract_caller_refs:(src.match(/contract-caller/g)||[]).length,tx_sender_refs:(src.match(/tx-sender/g)||[]).length};}else sourceState[p]={exists:false,status:r.status};}
          const calls=direct.map(t=>({tx_id:t.tx_id,status:t.tx_status,time:t.burn_block_time_iso,sender:t.sender_address,function:t.contract_call?.function_name,args:t.contract_call?.function_args?.map(a=>({name:a.name,repr:a.repr}))||[],result:t.tx_result?.repr}));const out={generated_at:new Date().toISOString(),source:'Hiro public read-only APIs',contract:CID,transaction_count:direct.length,candidate_principals:[...candidates].sort(),active_whitelist:active,whitelist,balances,source_state:sourceState,calls};fs.writeFileSync('airdrop-state.json',JSON.stringify(out,null,2));fs.writeFileSync('summary.json',JSON.stringify({contract:CID,transaction_count:direct.length,active_whitelist:active,balances,source_state:sourceState},null,2));console.log(fs.readFileSync('summary.json','utf8'));})().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node capture.cjs
          sha256sum airdrop-state.json summary.json active-*.clar 2>/dev/null > SHA256SUMS || sha256sum airdrop-state.json summary.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-airdrop-state
          path: /tmp/hermetica-airdrop
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
