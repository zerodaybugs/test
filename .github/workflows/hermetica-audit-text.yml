name: Hermetica audit text extraction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-audit-text.yml'
      - 'public-data/hermetica-audit-text-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract public Hermetica audits
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-audit-text
          mkdir -p "$OUT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl --fail --location --retry 8 --retry-all-errors \
            'https://raw.githubusercontent.com/Clarity-Alliance/audits/main/Clarity%20Alliance%20-%20Hermetica%20USDh%20Minting%20Contract.pdf' \
            -o "$OUT/minting-audit.pdf"
          curl --fail --location --retry 8 --retry-all-errors \
            'https://raw.githubusercontent.com/Clarity-Alliance/audits/main/Clarity%20Alliance%20-%20Hermetica.pdf' \
            -o "$OUT/usdh-audit.pdf"
          pdftotext -layout "$OUT/minting-audit.pdf" "$OUT/minting-audit.txt"
          pdftotext -layout "$OUT/usdh-audit.pdf" "$OUT/usdh-audit.txt"
          grep -inE 'mint[- ]limit|current-mint-limit|pending|unconfirmed|confirmation window|request' "$OUT/minting-audit.txt" > "$OUT/minting-keywords.txt" || true
          grep -inE 'mint[- ]limit|current-mint-limit|pending|unconfirmed|confirmation window|request' "$OUT/usdh-audit.txt" > "$OUT/usdh-keywords.txt" || true
          (cd "$OUT" && sha256sum *.pdf *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-audit-text
          path: /tmp/hermetica-audit-text
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
