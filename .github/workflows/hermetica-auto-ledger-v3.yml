name: Hermetica auto mint ledger v3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-auto-ledger-v3.yml'
      - 'public-data/hermetica_auto_ledger_v3.py'
      - 'public-data/hermetica-auto-ledger-v3-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve nested transaction order and simulate ledger
        run: |
          set -euo pipefail
          python3 public-data/hermetica_auto_ledger_v3.py
          cd /tmp/hermetica-auto-ledger-v3
          find . -type f -not -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-auto-ledger-v3
          path: /tmp/hermetica-auto-ledger-v3
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
