name: Hermetica block endpoint probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-block-endpoint-probe.yml'
      - 'public-data/hermetica-block-endpoint-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe read-only block endpoints
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-block-endpoint-probe
          mkdir -p "$OUT"
          python3 - <<'PY'
          import datetime as dt, json, pathlib, urllib.error, urllib.request
          OUT=pathlib.Path('/tmp/hermetica-block-endpoint-probe')
          API='https://api.hiro.so'
          heights=[7961941,4455800,4200000]
          templates=[
            '/extended/v2/blocks/{h}',
            '/extended/v1/block/by_height/{h}',
            '/extended/v3/blocks/{h}/transactions?limit=1',
            '/extended/v2/blocks/{h}/transactions?limit=1',
          ]
          rows=[]
          for h in heights:
            for template in templates:
              url=API+template.format(h=h)
              req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0','Accept':'application/json'})
              row={'height':h,'url':url}
              try:
                with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read().decode('utf-8','replace')
                  row.update({'status':r.status,'headers':dict(r.headers),'body_text':raw[:20000]})
                  try: row['body_json']=json.loads(raw)
                  except Exception as e: row['json_error']=str(e)
              except urllib.error.HTTPError as e:
                row.update({'status':e.code,'body_text':e.read().decode('utf-8','replace')[:20000]})
              except Exception as e:
                row['error']=repr(e)
              rows.append(row)
          out={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source':'Hiro public read-only API','rows':rows}
          (OUT/'probe.json').write_text(json.dumps(out,indent=2))
          summary=[{'height':r['height'],'url':r['url'],'status':r.get('status'),'error':r.get('error'),'body_keys':list((r.get('body_json') or {}).keys()) if isinstance(r.get('body_json'),dict) else None,'body_preview':r.get('body_text','')[:300]} for r in rows]
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          (cd "$OUT" && sha256sum *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-block-endpoint-probe
          path: /tmp/hermetica-block-endpoint-probe
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
