name: Hermetica caller capability graph

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/hermetica_role_replay.py'
      - 'scripts/hermetica_caller_capability_graph.py'
      - '.github/workflows/hermetica-caller-capability.yml'
      - 'public-data/hermetica-capability-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout collector branch
        uses: actions/checkout@v4
        with:
          ref: stacks-public-history-20260724
          fetch-depth: 0

      - name: Clone pinned public target
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hermetica-contracts
          git clone --filter=blob:none https://github.com/hermetica-fi/hermetica-contracts.git /tmp/hermetica-contracts
          git -C /tmp/hermetica-contracts checkout --detach 5e13e431f69dd840fe297791fa2a73d9993a27e0

      - name: Replay public role ledger and build graph
        shell: bash
        env:
          HERMETICA_REPO: /tmp/hermetica-contracts
          HERMETICA_HEAD: 5e13e431f69dd840fe297791fa2a73d9993a27e0
        run: |
          set -euo pipefail
          python3 scripts/hermetica_role_replay.py
          python3 scripts/hermetica_caller_capability_graph.py
          sha256sum \
            public-data/hermetica-role-ledger.json \
            public-data/hermetica-caller-capability-graph.json \
            > public-data/hermetica-caller-capability.sha256

      - name: Commit public capability evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public-data/hermetica-role-ledger.json \
            public-data/hermetica-caller-capability-graph.json \
            public-data/hermetica-caller-capability.sha256
          if git diff --cached --quiet; then
            echo 'No capability evidence changes.'
            exit 0
          fi
          git commit -m 'chore: capture Hermetica caller-capability evidence [skip ci]'
          git push origin HEAD:stacks-public-history-20260724
