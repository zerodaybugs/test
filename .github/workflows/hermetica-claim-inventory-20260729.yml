name: Hermetica public claim inventory

on:
  pull_request:
    paths:
      - "hermetica-claim-inventory-trigger/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermetica-claim-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Run public read-only inventory
        env:
          SCAN_OUT: hermetica-claim-inventory-output
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 --version
          python3 .github/scripts/hermetica_claim_inventory_scan_20260729.py | tee hermetica-claim-inventory-console.log
          test -s hermetica-claim-inventory-output/SUMMARY.json
          test -s hermetica-claim-inventory-output/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermetica-claim-inventory
          path: |
            hermetica-claim-inventory-output
            hermetica-claim-inventory-console.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
