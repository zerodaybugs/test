name: Hermetica claim refresh 20260730

on:
  pull_request:
    paths:
      - "hermetica-claim-refresh-trigger/**"

permissions:
  contents: read

concurrency:
  group: hermetica-claim-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Run public read-only claim refresh
        env:
          SCAN_OUT: hermetica-claim-refresh-output
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 \
            https://raw.githubusercontent.com/zerodaybugs/test/30a7983f4db04ea2cfb9644021c81e1d11564eba/.github/scripts/hermetica_claim_inventory_scan_20260729.py \
            --output /tmp/hermetica_claim_refresh.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/hermetica_claim_refresh.py')
          s = p.read_text(encoding='utf-8')
          old_tuple = '   for _ in range(int.from_bytes(self.take(4),"big")):d[self.take(self.take(1)[0]).decode()]=self.val()'
          new_tuple = '   for _ in range(int.from_bytes(self.take(4),"big")):\n    key_len=self.take(1)[0]\n    key=self.take(key_len).decode()\n    d[key]=self.val()'
          assert old_tuple in s
          s = s.replace(old_tuple, new_tuple)
          s = s.replace('def get(url,body=None,n=6):', 'def get(url,body=None,n=14):')
          s = s.replace('max_workers=6', 'max_workers=1')
          s = s.replace('ash=sum(x["shares"] for x in slim);ta=', 'ash=sum(x["shares"] for x in unfunded);ta=')
          s = s.replace('"active_claim_shares":ash', '"unfunded_claim_shares":ash')
          old_tip = '''def main():
           O.mkdir(parents=True,exist_ok=True);info=get(H+"/v2/info");height=int(info["stacks_tip_height"]);block=get(f"{H}/extended/v2/blocks/{height}")
           def ox(x):return x if not x or x.startswith("0x") else "0x"+x
           candidates=[]
           for x in (info.get("stacks_tip"),block.get("index_block_hash"),block.get("hash"),block.get("block_hash")):
            x=ox(x)
            if x and x not in candidates:candidates.append(x)
           probe=None;tip=None
           for x in candidates:
            try:probe=call(D,S,"get-claim-id",x);tip=x;break
            except urllib.error.HTTPError as e:
             if e.code!=404:raise
           if tip is None:
            height-=1;block=get(f"{H}/extended/v2/blocks/{height}")
            for x in (block.get("index_block_hash"),block.get("hash"),block.get("block_hash")):
             x=ox(x)
             if not x:continue
             try:probe=call(D,S,"get-claim-id",x);tip=x;break
             except urllib.error.HTTPError as e:
              if e.code!=404:raise
           if tip is None:raise RuntimeError("no usable pinned tip")
          '''
          new_tip = '''def main():
           O.mkdir(parents=True,exist_ok=True);info=get(H+"/v2/info");height=int(info["stacks_tip_height"])
           def ox(x):return x if not x or x.startswith("0x") else "0x"+x
           probe=None;tip=None;block=None
           for candidate_height in range(height,max(height-16,0),-1):
            try:block=get(f"{H}/extended/v2/blocks/{candidate_height}")
            except urllib.error.HTTPError as e:
             if e.code==404:continue
             raise
            candidates=[]
            for x in (info.get("stacks_tip") if candidate_height==height else None,block.get("index_block_hash"),block.get("hash"),block.get("block_hash")):
             x=ox(x)
             if x and x not in candidates:candidates.append(x)
            for x in candidates:
             try:probe=call(D,S,"get-claim-id",x);tip=x;height=candidate_height;break
             except urllib.error.HTTPError as e:
              if e.code!=404:raise
            if tip is not None:break
           if tip is None or block is None:raise RuntimeError("no usable pinned tip")
          '''
          assert old_tip in s
          p.write_text(s.replace(old_tip, new_tip), encoding='utf-8')
          PY
          python3 -m py_compile /tmp/hermetica_claim_refresh.py
          python3 /tmp/hermetica_claim_refresh.py | tee hermetica-claim-refresh-console.log
          test -s hermetica-claim-refresh-output/SUMMARY.json
          test -s hermetica-claim-refresh-output/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermetica-claim-refresh-20260730
          path: |
            hermetica-claim-refresh-output
            hermetica-claim-refresh-console.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
