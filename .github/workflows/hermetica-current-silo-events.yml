name: Hermetica current silo event solvency

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-current-silo-events.yml'
      - 'public-data/hermetica-current-silo-events-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-current-silo-events
          cd /tmp/hermetica-current-silo-events
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0
      - name: Reconstruct liabilities from immutable contract events
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-current-silo-events
          cat > reconstruct.cjs <<'NODE'
          const fs = require('fs');
          const { hexToCV, cvToJSON } = require('@stacks/transactions');
          const API='https://api.hiro.so';
          const DEP='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const NAME='staking-silo-v1-1';
          const CID=`${DEP}.${NAME}`;
          const TOKEN=`${DEP}.usdh-token-v1::usdh`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function retry(url,opt={},n=10){let last;for(let i=0;i<n;i++){try{const r=await fetch(url,opt);if(r.ok)return r;const text=await r.text();last=new Error(`${r.status} ${r.statusText}: ${text}`);if(r.status<500&&r.status!==429)throw last;}catch(e){last=e;}await sleep(Math.min(10000,700*(i+1)));}throw last;}
          function unwrap(x){
            if(x===null||x===undefined)return x;
            if(typeof x!=='object')return x;
            if(Array.isArray(x))return x.map(unwrap);
            if(Object.prototype.hasOwnProperty.call(x,'success') && x.success===false)return {error:unwrap(x.value)};
            if(Object.prototype.hasOwnProperty.call(x,'value'))return unwrap(x.value);
            const o={}; for(const [k,v] of Object.entries(x)){if(k==='type'||k==='success')continue;o[k]=unwrap(v);} return o;
          }
          function decode(hex){return unwrap(cvToJSON(hexToCV(hex)));}
          async function allEvents(){
            const out=[];
            for(let offset=0;;offset+=50){
              const r=await retry(`${API}/extended/v1/contract/${encodeURIComponent(CID)}/events?limit=50&offset=${offset}`);
              const b=await r.json(); const rows=b.results||[]; out.push(...rows);
              if(rows.length<50 || out.length>=(b.total||Number.MAX_SAFE_INTEGER))break;
            }
            return out;
          }
          (async()=>{
            const events=await allEvents();
            const logs=[]; const creates=[]; const withdrawals=[]; const decodeErrors=[];
            for(const e of events){
              const log=e.contract_log;
              if(!log || log.contract_id!==CID || log.topic!=='print')continue;
              try{
                const value=decode(log.value.hex);
                const row={event_index:e.event_index,tx_id:e.tx_id,value,repr:log.value.repr}; logs.push(row);
                const action=value?.action;
                const data=value?.data||{};
                if(action==='create-claim')creates.push({event_index:e.event_index,tx_id:e.tx_id,claim_id:Number(data['claim-id']),recipient:data.recipient,amount:String(data.amount),claim_ts:String(data['claim-ts']),raw:value});
                if(action==='withdraw'){
                  const claim=data['claim-data']||{};
                  withdrawals.push({event_index:e.event_index,tx_id:e.tx_id,claim_id:Number(data['claim-id']),recipient:claim.recipient,amount:String(claim.amount),claim_ts:String(claim.ts),raw:value});
                }
              }catch(err){decodeErrors.push({event_index:e.event_index,tx_id:e.tx_id,error:String(err),repr:log.value?.repr,hex:log.value?.hex});}
            }
            const createdById=new Map(); const duplicateCreates=[];
            for(const c of creates){if(createdById.has(c.claim_id))duplicateCreates.push({prior:createdById.get(c.claim_id),next:c});createdById.set(c.claim_id,c);}
            const withdrawnById=new Map(); const duplicateWithdrawals=[]; const unmatchedWithdrawals=[]; const amountMismatches=[];
            for(const w of withdrawals){
              if(withdrawnById.has(w.claim_id))duplicateWithdrawals.push({prior:withdrawnById.get(w.claim_id),next:w});
              withdrawnById.set(w.claim_id,w);
              const c=createdById.get(w.claim_id);
              if(!c)unmatchedWithdrawals.push(w);
              else if(c.amount!==w.amount || c.recipient!==w.recipient)amountMismatches.push({create:c,withdraw:w});
            }
            const open=[]; let liability=0n;
            for(const [id,c] of createdById){if(!withdrawnById.has(id)){open.push(c);liability+=BigInt(c.amount);}}
            open.sort((a,b)=>a.claim_id-b.claim_id);
            const br=await retry(`${API}/extended/v1/address/${encodeURIComponent(CID)}/balances`); const balances=await br.json();
            const balance=BigInt(balances.fungible_tokens?.[TOKEN]?.balance||'0');
            const sourceRes=await retry(`${API}/v2/contracts/source/${DEP}/${NAME}?proof=0`); const source=await sourceRes.json(); fs.writeFileSync(`${NAME}.clar`,source.source||'');
            const summary={contract:CID,total_events:events.length,print_logs:logs.length,create_count:creates.length,withdraw_count:withdrawals.length,unique_created:createdById.size,unique_withdrawn:withdrawnById.size,open_claim_count:open.length,total_open_liability:liability.toString(),silo_usdh_balance:balance.toString(),surplus_or_deficit:(balance-liability).toString(),duplicate_create_count:duplicateCreates.length,duplicate_withdraw_count:duplicateWithdrawals.length,unmatched_withdraw_count:unmatchedWithdrawals.length,amount_mismatch_count:amountMismatches.length,decode_error_count:decodeErrors.length,max_claim_id:Math.max(0,...createdById.keys())};
            const out={generated_at:new Date().toISOString(),source:'Hiro public read-only contract events and balances',summary,open_claims:open,creates,withdrawals,duplicate_creates:duplicateCreates,duplicate_withdrawals:duplicateWithdrawals,unmatched_withdrawals:unmatchedWithdrawals,amount_mismatches:amountMismatches,decode_errors:decodeErrors,balances};
            fs.writeFileSync('current-silo-events.json',JSON.stringify(out,null,2));
            fs.writeFileSync('summary.json',JSON.stringify(summary,null,2));
            console.log(JSON.stringify(summary,null,2));
            if(decodeErrors.length)throw new Error(`event decode errors: ${decodeErrors.length}`);
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node reconstruct.cjs
          sha256sum current-silo-events.json summary.json staking-silo-v1-1.clar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-current-silo-events
          path: /tmp/hermetica-current-silo-events
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
