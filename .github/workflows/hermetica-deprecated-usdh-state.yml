name: Hermetica deprecated USDh state capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-deprecated-usdh-state.yml'
      - 'public-data/hermetica-deprecated-usdh-state-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect public deprecated-contract balances and state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-deprecated
          API='https://api.hiro.so'
          DEP='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG'
          contracts=(staking-v1 staking-silo-v1 minting-auto-v1 minting-auto-v1-1 minting-otc-v1 redeeming-reserve-v1-1 redeeming-reserve-v1)
          for name in "${contracts[@]}"; do
            curl --fail --location --retry 6 "$API/extended/v1/address/$DEP.$name/balances" -o "/tmp/hermetica-deprecated/$name-balances.json"
            curl --fail --location --retry 6 "$API/extended/v1/address/$DEP.$name/transactions?limit=50&offset=0" -o "/tmp/hermetica-deprecated/$name-transactions.json"
          done
          call_read() {
            local contract="$1" fn="$2" out="$3"
            curl --fail --location --retry 6 -X POST -H 'content-type: application/json' \
              -d "{\"sender\":\"$DEP\",\"arguments\":[]}" \
              "$API/v2/contracts/call-read/$DEP/$contract/$fn" -o "/tmp/hermetica-deprecated/$out.json" || true
          }
          call_read staking-v1 get-usdh-per-susdh old-staking-ratio
          call_read staking-v1 get-total-supply old-staking-total-supply
          call_read staking-silo-v1 get-current-claim-id old-silo-current-claim-id
          call_read staking-silo-v1 get-cooldown-window old-silo-cooldown
          call_read staking-v1 initialized old-staking-initialized
          curl --fail --location --retry 6 -X POST -H 'content-type: application/json' \
            -d "{\"sender\":\"$DEP\",\"arguments\":[]}" \
            "$API/v2/contracts/call-read/$DEP/hq-v1/get-contracts-enabled" -o /tmp/hermetica-deprecated/hq-enabled.json
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/hermetica-deprecated')
          contracts=['staking-v1','staking-silo-v1','minting-auto-v1','minting-auto-v1-1','minting-otc-v1','redeeming-reserve-v1-1','redeeming-reserve-v1']
          out={'source':'Hiro public read-only APIs','contracts':{}}
          for c in contracts:
              bal=json.loads(root.joinpath(c+'-balances.json').read_text())
              tx=json.loads(root.joinpath(c+'-transactions.json').read_text())
              out['contracts'][c]={'balances':bal,'recent_transactions':tx.get('results',[]),'tx_total':tx.get('total')}
          for p in root.glob('*.json'):
              if p.name.endswith('-balances.json') or p.name.endswith('-transactions.json'): continue
              try: out[p.stem]=json.loads(p.read_text())
              except Exception: pass
          root.joinpath('deprecated-state.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({c:out['contracts'][c]['balances'].get('fungible_tokens',{}) for c in contracts},indent=2))
          PY
          sha256sum /tmp/hermetica-deprecated/* > /tmp/hermetica-deprecated/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-deprecated-usdh-state
          path: /tmp/hermetica-deprecated
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
