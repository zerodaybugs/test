name: Hermetica whitelisted contract source capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-flh-source.yml'
      - 'public-data/hermetica-flh-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture immutable public sources and interfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-flh
          fetch_contract() {
            local address="$1" name="$2" stem="$3"
            curl --fail --location --retry 5 --retry-delay 2 \
              "https://api.hiro.so/v2/contracts/source/${address}/${name}?proof=0" \
              -o "/tmp/hermetica-flh/${stem}.source.json"
            jq -r '.source' "/tmp/hermetica-flh/${stem}.source.json" > "/tmp/hermetica-flh/${stem}.clar"
            curl --fail --location --retry 5 --retry-delay 2 \
              "https://api.hiro.so/v2/contracts/interface/${address}/${name}" \
              -o "/tmp/hermetica-flh/${stem}.interface.json"
            curl --fail --location --retry 5 --retry-delay 2 \
              "https://api.hiro.so/extended/v1/address/${address}.${name}/transactions?limit=50&offset=0" \
              -o "/tmp/hermetica-flh/${stem}.transactions.json"
          }
          fetch_contract 'SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7' 'flh' 'zest-flh'
          fetch_contract 'SP1A4X1ZFXGE4J28ZQ9QG3JNRCQ4AK6R10PECHVVP' 'liquidator' 'granite-liquidator'
          sha256sum /tmp/hermetica-flh/* > /tmp/hermetica-flh/SHA256SUMS
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('/tmp/hermetica-flh')
          out = {}
          for stem in ('zest-flh', 'granite-liquidator'):
              src = root.joinpath(stem + '.clar').read_text()
              out[stem] = {
                  'source_length': len(src),
                  'public_functions': re.findall(r'\(define-public\s+\(([^\s()]+)', src),
                  'read_only_functions': re.findall(r'\(define-read-only\s+\(([^\s()]+)', src),
              }
          root.joinpath('summary.json').write_text(json.dumps(out, indent=2))
          PY

      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-whitelisted-contract-sources
          path: /tmp/hermetica-flh
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
