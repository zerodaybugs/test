name: Hermetica fork dependency snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-fork-deps.yml'
      - 'public-data/hermetica-fork-deps-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture public contract metadata and source
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-fork-deps
          mkdir -p "$OUT/raw" "$OUT/cache"
          API='https://api.hiro.so'
          cat > "$OUT/contracts.txt" <<'EOF'
          SP1CGXWEAMG6P6FT04W66NVGJ7PQWMDAC19R7PJ0Y.pyth-pnau-decoder-v3
          SP1CGXWEAMG6P6FT04W66NVGJ7PQWMDAC19R7PJ0Y.wormhole-core-v4
          SP3FBR2AGK5H9QBDH3EEN6DF8EK8JY7RX8QJ5SVTE.sip-010-trait-ft-standard
          SP3Y2ZSH8P7D50B0VBTSX11S7XSG24M1VB9YFQA4K.token-aeusdc
          SP3Y2ZSH8P7D50B0VBTSX11S7XSG24M1VB9YFQA4K.bridge-token-trait
          SP3Y2ZSH8P7D50B0VBTSX11S7XSG24M1VB9YFQA4K.ownable-trait
          SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-withdrawal
          SP35E2BBMDT2Y1HB0NTK139YBGYV3PAPK3WA8BRNA.linear-kinked-ir-v1
          SP35E2BBMDT2Y1HB0NTK139YBGYV3PAPK3WA8BRNA.math-v1
          SP35E2BBMDT2Y1HB0NTK139YBGYV3PAPK3WA8BRNA.staking-reward-v1
          SP3BJR4P3W2Y9G22HA595Z59VHBC9EQYRFWSKG743.constants-v2
          SP3R4F6C1J3JQWWCVZ3S7FRRYPMYG6ZW6RZK31FXY.pyth-oracle-v3
          SP3R4F6C1J3JQWWCVZ3S7FRRYPMYG6ZW6RZK31FXY.pyth-traits-v1
          SP3R4F6C1J3JQWWCVZ3S7FRRYPMYG6ZW6RZK31FXY.wormhole-traits-v1
          EOF
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            addr="${cid%%.*}"
            name="${cid#*.}"
            key="${cid}"
            curl --fail --location --retry 8 --retry-all-errors \
              "$API/extended/v1/contract/$cid" \
              -o "$OUT/raw/$key.metadata.json"
            curl --fail --location --retry 8 --retry-all-errors \
              "$API/v2/contracts/source/$addr/$name?proof=0" \
              -o "$OUT/raw/$key.source.json"
          done < "$OUT/contracts.txt"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/hermetica-fork-deps')
          rows=[]
          for line in (root/'contracts.txt').read_text().splitlines():
              cid=line.strip()
              if not cid: continue
              meta=json.loads((root/'raw'/f'{cid}.metadata.json').read_text())
              src=json.loads((root/'raw'/f'{cid}.source.json').read_text())
              source=src.get('source') or meta.get('source_code') or ''
              (root/'cache'/f'{cid}.clar').write_text(source)
              row={
                  'contract_id':cid,
                  'metadata':meta,
                  'source_metadata':{k:v for k,v in src.items() if k!='source'},
                  'source_bytes':len(source.encode()),
              }
              rows.append(row)
          (root/'summary.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
          (cd "$OUT" && sha256sum contracts.txt summary.json raw/* cache/* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-fork-deps
          path: /tmp/hermetica-fork-deps
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
