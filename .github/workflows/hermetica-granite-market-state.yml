name: Hermetica Granite market state

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-granite-market-state.yml'
      - 'public-data/hermetica-granite-market-state-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture public Granite sBTC market state
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-granite-market-state
          mkdir -p "$OUT"
          cd "$OUT"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0 >/dev/null
          cat > snapshot.cjs <<'NODE'
          const fs=require('fs');
          const {principalCV,cvToHex,hexToCV,cvToJSON}=require('@stacks/transactions');
          const API='https://api.hiro.so';
          const DEP='SP35E2BBMDT2Y1HB0NTK139YBGYV3PAPK3WA8BRNA';
          const NAME='state-v1';
          const CID=`${DEP}.${NAME}`;
          const SBTC='SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url,opt={},n=10){let e;for(let i=0;i<n;i++){try{const r=await fetch(url,opt);const t=await r.text();if(r.ok)return JSON.parse(t);e=new Error(`${r.status}: ${t.slice(0,300)}`);}catch(x){e=x;}await sleep(Math.min(10000,700*(i+1)));}throw e;}
          function unwrap(x){if(x==null)return x;if(typeof x!=='object')return x;if(Array.isArray(x))return x.map(unwrap);if('value'in x)return unwrap(x.value);const o={};for(const[k,v]of Object.entries(x)){if(k==='type'||k==='success')continue;o[k]=unwrap(v);}return o;}
          async function read(fn,args=[]){const b=await req(`${API}/v2/contracts/call-read/${DEP}/${NAME}/${fn}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:DEP,arguments:args.map(cvToHex)})});let d=null;if(b.result){try{d=unwrap(cvToJSON(hexToCV(b.result)));}catch(e){d={error:String(e),raw:b.result};}}return{okay:b.okay,cause:b.cause,result_raw:b.result,decoded:d};}
          (async()=>{
            const functions=['get-total-assets','get-total-debt-shares','get-open-interest','get-protocol-reserve-percentage','get-reserve-balance','get-asset-cap','get-borrowable-balance','get-total-borrowed-amount','get-debt-params','get-lp-params','get-accrue-interest-params'];
            const reads={};for(const fn of functions){try{reads[fn]=await read(fn);}catch(e){reads[fn]={error:String(e)};}}
            reads['get-collateral-sbtc']=await read('get-collateral',[principalCV(SBTC)]);
            const balances=await req(`${API}/extended/v1/address/${encodeURIComponent(CID)}/balances`);
            const out={generated_at:new Date().toISOString(),source:'Hiro public read-only APIs',contract:CID,sbtc:SBTC,reads,balances};
            fs.writeFileSync('granite-market-state.json',JSON.stringify(out,null,2));
            fs.writeFileSync('summary.json',JSON.stringify({contract:CID,sbtc:SBTC,reads,sbtc_contract_balance:balances.fungible_tokens?.[`${SBTC}::sbtc-token`]??balances.fungible_tokens},null,2));
            console.log(fs.readFileSync('summary.json','utf8'));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node snapshot.cjs
          sha256sum *.json snapshot.cjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-granite-market-state
          path: /tmp/hermetica-granite-market-state
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
