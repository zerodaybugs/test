name: Hermetica Granite whitelist history

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-granite-whitelist-history.yml'
      - 'public-data/hermetica-granite-whitelist-history-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture minting-auto-state whitelist history
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-granite-whitelist-history
          mkdir -p "$OUT"
          python3 - <<'PY'
          import datetime as dt, json, pathlib, time, urllib.parse, urllib.request
          OUT=pathlib.Path('/tmp/hermetica-granite-whitelist-history')
          API='https://api.hiro.so'
          CID='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG.minting-auto-state-v1'
          TARGET='SP1A4X1ZFXGE4J28ZQ9QG3JNRCQ4AK6R10PECHVVP.liquidator'
          ASSET='SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token'
          def get(url,attempts=10):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
                  except Exception as e:
                      last=e; time.sleep(min(10,1+i))
              raise RuntimeError(f'{url}: {last}')
          txs=[]
          for offset in range(0,5000,50):
              body=get(f'{API}/extended/v1/address/{urllib.parse.quote(CID,safe="")}/transactions?limit=50&offset={offset}')
              batch=body.get('results') or []; txs.extend(batch)
              if len(batch)<50 or len(txs)>=body.get('total',len(txs)):break
              time.sleep(.1)
          rows=[]
          for t in txs:
              cc=t.get('contract_call') or {}
              if cc.get('contract_id')!=CID or cc.get('function_name')!='set-whitelist':continue
              args=cc.get('function_args') or []
              reprs=[a.get('repr') for a in args]
              rows.append({'tx_id':t.get('tx_id'),'status':t.get('tx_status'),'sender':t.get('sender_address'),'block_height':t.get('block_height'),'block_time':t.get('block_time'),'block_time_iso':t.get('block_time_iso'),'burn_block_time':t.get('burn_block_time'),'burn_block_time_iso':t.get('burn_block_time_iso'),'result':(t.get('tx_result') or {}).get('repr'),'args':args,'arg_reprs':reprs,'matches_target':TARGET in reprs and ASSET in reprs})
          matched=[r for r in rows if r['matches_target']]
          result={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source':'Hiro public read-only APIs','contract':CID,'target':TARGET,'asset':ASSET,'transaction_count':len(txs),'set_whitelist_count':len(rows),'target_updates':matched,'all_set_whitelist':rows}
          (OUT/'whitelist-history.json').write_text(json.dumps(result,indent=2))
          summary={k:v for k,v in result.items() if k!='all_set_whitelist'}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          (cd "$OUT" && sha256sum *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-granite-whitelist-history
          path: /tmp/hermetica-granite-whitelist-history
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
