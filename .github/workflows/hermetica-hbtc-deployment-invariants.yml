name: Hermetica hBTC deployment invariants

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-hbtc-deployment-invariants.yml'
      - 'public-data/hermetica-hbtc-deployment-invariants-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture public deployment invariants
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-hbtc-deployment-invariants
          mkdir -p "$OUT"
          API='https://api.hiro.so'
          DEP='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D'
          BURN='SP000000000000000000002Q6VF78'
          TOKEN="$DEP.token-hbtc-v1::hbtc"
          curl --fail --location --retry 6 "$API/extended/v1/address/$BURN/balances" -o "$OUT/burn-address-balances.json"
          curl --fail --location --retry 6 "$API/extended/v1/address/$DEP.token-hbtc-v1/transactions?limit=50&offset=0" -o "$OUT/token-transactions-0.json"
          curl --fail --location --retry 6 "$API/extended/v1/address/$DEP.vault-hbtc-v1-2/balances" -o "$OUT/vault-balances.json"
          curl --fail --location --retry 6 "$API/extended/v1/address/$DEP.reserve-hbtc-v1/balances" -o "$OUT/reserve-balances.json"
          curl --fail --location --retry 6 "$API/v2/contracts/source/$DEP/token-hbtc-v1?proof=0" -o "$OUT/token-source.json"
          TOKEN="$TOKEN" BURN="$BURN" python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('/tmp/hermetica-hbtc-deployment-invariants')
          burn=json.loads((root/'burn-address-balances.json').read_text())
          token=os.environ['TOKEN']
          bal=int((burn.get('fungible_tokens') or {}).get(token,{}).get('balance','0'))
          tx=json.loads((root/'token-transactions-0.json').read_text())
          rows=[]
          for t in tx.get('results',[]):
              for e in t.get('events',[]) or []:
                  ft=e.get('fungible_token_asset') or {}
                  if ft.get('recipient')==os.environ['BURN'] or ft.get('sender')==os.environ['BURN']:
                      rows.append({'tx_id':t.get('tx_id'),'status':t.get('tx_status'),'time':t.get('burn_block_time_iso'),'event':e})
          out={'generated_at':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'source':'Hiro public read-only APIs','burn_address':os.environ['BURN'],'token':token,'burn_address_hbtc_balance':str(bal),'burn_address_related_events_first_page':rows}
          (root/'summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-hbtc-deployment-invariants
          path: /tmp/hermetica-hbtc-deployment-invariants
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
