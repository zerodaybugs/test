name: Hermetica hBTC deployment invariants

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-hbtc-deployment-invariants.yml'
      - 'public-data/hermetica-hbtc-deployment-invariants-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-hbtc-deployment-invariants
          cd /tmp/hermetica-hbtc-deployment-invariants
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0
      - name: Capture public deployment invariants
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-hbtc-deployment-invariants
          cat > snapshot.cjs <<'NODE'
          const fs=require('fs');
          const {principalCV,cvToHex,hexToCV,cvToJSON}=require('@stacks/transactions');
          const API='https://api.hiro.so';
          const DEP='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const TOKEN='token-hbtc-v1';
          const BURN='SP000000000000000000002Q6VF78';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function retry(url,opt={},n=8){let e;for(let i=0;i<n;i++){try{const r=await fetch(url,opt);if(r.ok)return r;const t=await r.text();e=new Error(`${r.status}: ${t}`);if(r.status<500&&r.status!==429)throw e;}catch(x){e=x;}await sleep(600*(i+1));}throw e;}
          function unwrap(x){if(x==null)return x;if(typeof x!=='object')return x;if(Array.isArray(x))return x.map(unwrap);if('value' in x)return unwrap(x.value);const o={};for(const [k,v] of Object.entries(x)){if(k==='type'||k==='success')continue;o[k]=unwrap(v);}return o;}
          async function read(fn,args=[]){const r=await retry(`${API}/v2/contracts/call-read/${DEP}/${TOKEN}/${fn}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:DEP,arguments:args.map(cvToHex)})});const b=await r.json();if(!b.okay)throw new Error(`${fn}: ${JSON.stringify(b)}`);return {raw:b.result,decoded:unwrap(cvToJSON(hexToCV(b.result)))};}
          async function getJson(url){const r=await retry(url);return r.json();}
          (async()=>{
            const burnBalance=await read('get-balance',[principalCV(BURN)]);
            const totalSupply=await read('get-total-supply');
            const vault=await getJson(`${API}/extended/v1/address/${encodeURIComponent(DEP+'.vault-hbtc-v1-2')}/balances`);
            const reserve=await getJson(`${API}/extended/v1/address/${encodeURIComponent(DEP+'.reserve-hbtc-v1')}/balances`);
            const source=await getJson(`${API}/v2/contracts/source/${DEP}/${TOKEN}?proof=0`);
            fs.writeFileSync(`${TOKEN}.clar`,source.source||'');
            fs.writeFileSync('vault-balances.json',JSON.stringify(vault,null,2));
            fs.writeFileSync('reserve-balances.json',JSON.stringify(reserve,null,2));
            const out={generated_at:new Date().toISOString(),source:'Hiro public read-only APIs',burn_address:BURN,burn_address_hbtc_balance:String(burnBalance.decoded),hbtc_total_supply:String(totalSupply.decoded),burn_share_fraction_numerator:String(burnBalance.decoded),burn_share_fraction_denominator:String(totalSupply.decoded)};
            fs.writeFileSync('summary.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node snapshot.cjs
          sha256sum summary.json vault-balances.json reserve-balances.json token-hbtc-v1.clar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-hbtc-deployment-invariants
          path: /tmp/hermetica-hbtc-deployment-invariants
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
