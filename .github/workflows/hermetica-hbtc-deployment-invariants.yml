name: Hermetica hBTC deployment invariants

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-hbtc-deployment-invariants.yml'
      - 'public-data/hermetica-hbtc-deployment-invariants-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-hbtc-deployment-invariants
          cd /tmp/hermetica-hbtc-deployment-invariants
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0
      - name: Capture public deployment invariants
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-hbtc-deployment-invariants
          cat > snapshot.cjs <<'NODE'
          const fs=require('fs');
          const {hexToCV,cvToJSON}=require('@stacks/transactions');
          const API='https://api.hiro.so';
          const DEP='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const TOKEN='token-hbtc';
          const BURN='SP000000000000000000002Q6VF78';
          const PRINCIPAL_ARG='0x05160000000000000000000000000000000000000000';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function request(name,url,opt={}){
            let last;
            for(let i=0;i<8;i++){
              try{
                const r=await fetch(url,opt); const text=await r.text();
                const row={name,url,status:r.status,status_text:r.statusText,ok:r.ok,body_text:text};
                try{row.body_json=JSON.parse(text);}catch{}
                if(r.ok){fs.writeFileSync(`${name}.json`,JSON.stringify(row,null,2));return row;}
                last=row;
                if(r.status<500&&r.status!==429)break;
              }catch(e){last={name,url,error:String(e)};}
              await sleep(600*(i+1));
            }
            fs.writeFileSync(`${name}.json`,JSON.stringify(last,null,2));return last;
          }
          function decodeResult(row){
            try{
              const body=row.body_json||{};
              if(!body.result)return null;
              return cvToJSON(hexToCV(body.result));
            }catch(e){return {decode_error:String(e)};}
          }
          (async()=>{
            const common={method:'POST',headers:{'content-type':'application/json'}};
            const burn=await request('burn-balance',`${API}/v2/contracts/call-read/${DEP}/${TOKEN}/get-balance`,{...common,body:JSON.stringify({sender:DEP,arguments:[PRINCIPAL_ARG]})});
            const supply=await request('total-supply',`${API}/v2/contracts/call-read/${DEP}/${TOKEN}/get-total-supply`,{...common,body:JSON.stringify({sender:DEP,arguments:[]})});
            const vault=await request('vault-balances',`${API}/extended/v1/address/${encodeURIComponent(DEP+'.vault-hbtc-v1-2')}/balances`);
            const reserve=await request('reserve-balances',`${API}/extended/v1/address/${encodeURIComponent(DEP+'.reserve-hbtc-v1')}/balances`);
            const source=await request('token-source',`${API}/v2/contracts/source/${DEP}/${TOKEN}?proof=0`);
            if(source.body_json?.source)fs.writeFileSync(`${TOKEN}.clar`,source.body_json.source);
            const out={generated_at:new Date().toISOString(),source:'Hiro public read-only APIs',token_contract:`${DEP}.${TOKEN}`,burn_address:BURN,principal_argument:PRINCIPAL_ARG,burn_response_ok:burn.body_json?.okay===true,burn_decoded:decodeResult(burn),supply_response_ok:supply.body_json?.okay===true,supply_decoded:decodeResult(supply),vault_response_ok:vault.ok,reserve_response_ok:reserve.ok,source_response_ok:source.ok};
            fs.writeFileSync('summary.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
          })().catch(e=>{fs.writeFileSync('fatal-error.txt',String(e));console.error(e);});
          NODE
          node snapshot.cjs
          sha256sum * > SHA256SUMS.tmp || true
          mv SHA256SUMS.tmp SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-hbtc-deployment-invariants
          path: /tmp/hermetica-hbtc-deployment-invariants
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
