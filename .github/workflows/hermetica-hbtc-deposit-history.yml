name: Hermetica hBTC deposit history

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-hbtc-deposit-history.yml'
      - 'public-data/hermetica-hbtc-deposit-history-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-hbtc-deposit-history
          cd /tmp/hermetica-hbtc-deposit-history
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0
      - name: Capture public vault event history
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-hbtc-deposit-history
          cat > snapshot.cjs <<'NODE'
          const fs=require('fs');
          const {hexToCV,cvToJSON}=require('@stacks/transactions');
          const API='https://api.hiro.so';
          const DEP='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const NAME='vault-hbtc-v1-2';
          const CID=`${DEP}.${NAME}`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function retry(url,n=10){let e;for(let i=0;i<n;i++){try{const r=await fetch(url);if(r.ok)return r;const t=await r.text();e=new Error(`${r.status}: ${t}`);if(r.status<500&&r.status!==429)throw e;}catch(x){e=x;}await sleep(500*(i+1));}throw e;}
          function unwrap(x){if(x==null)return x;if(typeof x!=='object')return x;if(Array.isArray(x))return x.map(unwrap);if('value' in x)return unwrap(x.value);const o={};for(const [k,v] of Object.entries(x)){if(k==='type'||k==='success')continue;o[k]=unwrap(v);}return o;}
          function decode(hex){return unwrap(cvToJSON(hexToCV(hex)));}
          (async()=>{
            const all=[];for(let off=0;;off+=50){const r=await retry(`${API}/extended/v1/contract/${encodeURIComponent(CID)}/events?limit=50&offset=${off}`);const b=await r.json();const rows=b.results||[];all.push(...rows);if(rows.length<50||all.length>=(b.total||Number.MAX_SAFE_INTEGER))break;}
            const logs=[];const actions={};const deposits=[];
            for(const e of all){const l=e.contract_log;if(!l||l.contract_id!==CID||l.topic!=='print')continue;try{const v=decode(l.value.hex);const a=v?.action||'unknown';actions[a]=(actions[a]||0)+1;const row={event_index:e.event_index,tx_id:e.tx_id,action:a,value:v,repr:l.value.repr};logs.push(row);if(a==='deposit')deposits.push({event_index:e.event_index,tx_id:e.tx_id,user:v.user,assets:String(v.data?.assets),shares:String(v.data?.shares),net_assets:String(v.data?.['net-assets'])});}catch(err){logs.push({event_index:e.event_index,tx_id:e.tx_id,decode_error:String(err),repr:l.value?.repr});}}
            const amounts=deposits.map(x=>BigInt(x.assets));const summary={generated_at:new Date().toISOString(),source:'Hiro public read-only contract events',contract:CID,total_events:all.length,print_logs:logs.length,action_counts:actions,deposit_count:deposits.length,deposit_assets_total:amounts.reduce((a,b)=>a+b,0n).toString(),deposit_assets_min:amounts.length?amounts.reduce((a,b)=>a<b?a:b).toString():'0',deposit_assets_max:amounts.length?amounts.reduce((a,b)=>a>b?a:b).toString():'0'};
            fs.writeFileSync('summary.json',JSON.stringify(summary,null,2));fs.writeFileSync('deposits.json',JSON.stringify(deposits,null,2));fs.writeFileSync('logs.json',JSON.stringify(logs,null,2));console.log(JSON.stringify(summary,null,2));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node snapshot.cjs
          sha256sum summary.json deposits.json logs.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-hbtc-deposit-history
          path: /tmp/hermetica-hbtc-deposit-history
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
