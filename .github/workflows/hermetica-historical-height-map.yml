name: Hermetica historical Stacks height map

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-historical-height-map.yml'
      - 'public-data/hermetica-historical-height-map-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Map target timestamps to Stacks heights
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-historical-height-map
          mkdir -p "$OUT"
          python3 - <<'PY'
          import datetime as dt, json, pathlib, time, urllib.parse, urllib.request

          OUT=pathlib.Path('/tmp/hermetica-historical-height-map')
          API='https://api.hiro.so'
          TARGETS=[
            {'name':'peak','timestamp':1760128800},
            {'name':'trough','timestamp':1760131200},
            {'name':'pre_peak_40m','timestamp':1760126400},
            {'name':'reset_1','timestamp':1760127000},
            {'name':'reset_2','timestamp':1760127600},
            {'name':'reset_3','timestamp':1760128200},
            {'name':'reset_4','timestamp':1760128800},
          ]

          def get(url, attempts=12):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          return json.loads(r.read().decode())
                  except Exception as e:
                      last=e
                      time.sleep(min(12,1.5*(i+1)))
              raise RuntimeError(f'{url}: {last}')

          info=get(f'{API}/v2/info')
          tip=int(info['stacks_tip_height'])
          cache={}

          def block(height):
              height=max(1,min(tip,int(height)))
              if height not in cache:
                  offset=tip-height
                  q=urllib.parse.urlencode({'limit':1,'offset':offset})
                  body=get(f'{API}/extended/v1/block?{q}')
                  rows=body.get('results') or []
                  if not rows:
                      raise RuntimeError(f'no block for height={height}, offset={offset}, body={body}')
                  row=rows[0]
                  if int(row.get('height',-1)) != height:
                      raise RuntimeError(f'height mismatch requested={height} got={row.get("height")} offset={offset}')
                  cache[height]=row
              return cache[height]

          def block_time(row):
              return int(row.get('block_time') or row.get('burn_block_time') or 0)

          def first_at_or_after(target):
              lo,hi=1,tip
              while lo<hi:
                  mid=(lo+hi)//2
                  if block_time(block(mid)) < target:
                      lo=mid+1
                  else:
                      hi=mid
              return lo

          results=[]
          for target in TARGETS:
              h=first_at_or_after(target['timestamp'])
              neighborhood=[]
              for x in range(max(1,h-6),min(tip,h+6)+1):
                  b=block(x)
                  neighborhood.append({
                    'height':int(b['height']),
                    'block_time':block_time(b),
                    'block_time_iso':dt.datetime.fromtimestamp(block_time(b),dt.timezone.utc).isoformat(),
                    'burn_block_time':int(b.get('burn_block_time') or 0),
                    'burn_block_height':int(b.get('burn_block_height') or 0),
                    'hash':b.get('hash'),
                    'index_block_hash':b.get('index_block_hash'),
                  })
              results.append({
                **target,
                'target_iso':dt.datetime.fromtimestamp(target['timestamp'],dt.timezone.utc).isoformat(),
                'first_height_at_or_after':h,
                'previous':neighborhood[5] if h>1 else None,
                'at_or_after':neighborhood[6] if len(neighborhood)>6 else neighborhood[-1],
                'neighborhood':neighborhood,
              })

          out={
            'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),
            'source':'Hiro public read-only Stacks Blockchain API',
            'tip_height':tip,
            'targets':results,
          }
          (OUT/'historical-height-map.json').write_text(json.dumps(out,indent=2))
          summary={
            'generated_at':out['generated_at'],
            'source':out['source'],
            'tip_height':tip,
            'targets':[{k:v for k,v in row.items() if k!='neighborhood'} for row in results],
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          (cd "$OUT" && sha256sum *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-historical-height-map
          path: /tmp/hermetica-historical-height-map
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
