name: Hermetica historical relay state

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-historical-relays.yml'
      - 'public-data/hermetica_historical_relays.cjs'
      - 'public-data/hermetica-historical-relays-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Clarity value encoder
        run: npm install --no-save --ignore-scripts @stacks/transactions@7.2.0
      - name: Capture current whitelist and immutable sources
        run: |
          set -euo pipefail
          node public-data/hermetica_historical_relays.cjs
          cd /tmp/hermetica-historical-relays
          find . -type f -not -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-historical-relays
          path: /tmp/hermetica-historical-relays
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
