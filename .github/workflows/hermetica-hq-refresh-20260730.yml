name: Hermetica HQ refresh 20260730

on:
  pull_request:
    paths:
      - "hermetica-hq-refresh-trigger/**"

permissions:
  contents: read

concurrency:
  group: hermetica-hq-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Run public read-only HQ refresh
        env:
          SCAN_OUT: hermetica-hq-refresh-output
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 \
            https://raw.githubusercontent.com/zerodaybugs/test/4b59cd16ef3ca5ae1ce732c34e1da8a49dd3deac/.github/scripts/hermetica_hq_role_delta_20260729.py \
            --output /tmp/hermetica_hq_refresh.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/hermetica_hq_refresh.py')
          s = p.read_text(encoding='utf-8')
          old = '''def pinned_tip() -> tuple[dict[str, Any], dict[str, Any], int, str]:
              info = fetch_json(f"{HIRO}/v2/info")
              height = int(info["stacks_tip_height"])
              for candidate_height in (height, height - 1):
                  block = fetch_json(f"{HIRO}/extended/v2/blocks/{candidate_height}")
                  candidates: list[str] = []
                  for raw in (info.get("stacks_tip") if candidate_height == height else None, block.get("index_block_hash"), block.get("hash"), block.get("block_hash")):
                      if raw:
                          candidate = raw if str(raw).startswith("0x") else "0x" + str(raw)
                          if candidate not in candidates:
                              candidates.append(candidate)
                  for tip in candidates:
                      try:
                          call_read("get-protocol-enabled", tip)
                          return info, block, candidate_height, tip
                      except RuntimeError as exc:
                          if "HTTP 404" not in str(exc):
                              raise
              raise RuntimeError("no usable pinned tip")
          '''
          new = '''def pinned_tip() -> tuple[dict[str, Any], dict[str, Any], int, str]:
              info = fetch_json(f"{HIRO}/v2/info")
              height = int(info["stacks_tip_height"])
              last_error: Exception | None = None
              for candidate_height in range(height, max(height - 16, 0), -1):
                  try:
                      block = fetch_json(f"{HIRO}/extended/v2/blocks/{candidate_height}")
                  except RuntimeError as exc:
                      last_error = exc
                      if "HTTP 404" in str(exc):
                          time.sleep(0.5)
                          continue
                      raise
                  candidates: list[str] = []
                  for raw in (
                      info.get("stacks_tip") if candidate_height == height else None,
                      block.get("index_block_hash"),
                      block.get("hash"),
                      block.get("block_hash"),
                  ):
                      if raw:
                          candidate = raw if str(raw).startswith("0x") else "0x" + str(raw)
                          if candidate not in candidates:
                              candidates.append(candidate)
                  for tip in candidates:
                      try:
                          call_read("get-protocol-enabled", tip)
                          return info, block, candidate_height, tip
                      except RuntimeError as exc:
                          last_error = exc
                          if "HTTP 404" not in str(exc):
                              raise
              raise RuntimeError(f"no usable pinned tip: {last_error}")
          '''
          assert old in s
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile /tmp/hermetica_hq_refresh.py
          python3 /tmp/hermetica_hq_refresh.py | tee hermetica-hq-refresh-console.log
          test -s hermetica-hq-refresh-output/SUMMARY.json
          test -s hermetica-hq-refresh-output/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermetica-hq-refresh-20260730
          path: |
            hermetica-hq-refresh-output
            hermetica-hq-refresh-console.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
