name: Hermetica HQ role delta

on:
  pull_request:
    paths:
      - "hermetica-hq-role-trigger/**"

permissions:
  contents: read

concurrency:
  group: hermetica-hq-role-delta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Run public read-only HQ role scan
        env:
          SCAN_OUT: hermetica-hq-role-delta-output
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile .github/scripts/hermetica_hq_role_delta_20260729.py
          python3 .github/scripts/hermetica_hq_role_delta_20260729.py | tee hermetica-hq-role-delta-console.log
          test -s hermetica-hq-role-delta-output/SUMMARY.json
          test -s hermetica-hq-role-delta-output/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermetica-hq-role-delta
          path: |
            hermetica-hq-role-delta-output
            hermetica-hq-role-delta-console.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
