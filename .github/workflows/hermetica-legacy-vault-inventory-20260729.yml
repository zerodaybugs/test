name: Hermetica legacy vault inventory

on:
  pull_request:
    paths:
      - "hermetica-legacy-inventory-trigger/**"

permissions:
  contents: read

concurrency:
  group: hermetica-legacy-vault-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Run public read-only legacy inventory
        env:
          SCAN_OUT: hermetica-legacy-vault-inventory-output
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile .github/scripts/hermetica_legacy_vault_inventory_20260729.py
          python3 .github/scripts/hermetica_legacy_vault_inventory_20260729.py | tee hermetica-legacy-vault-inventory-console.log
          test -s hermetica-legacy-vault-inventory-output/SUMMARY.json
          test -s hermetica-legacy-vault-inventory-output/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermetica-legacy-vault-inventory
          path: |
            hermetica-legacy-vault-inventory-output
            hermetica-legacy-vault-inventory-console.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
