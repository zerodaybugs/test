name: Hermetica pinned local bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-local-bundle.yml'
      - 'public-data/hermetica-local-bundle-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4

      - name: Checkout pinned Hermetica source
        uses: actions/checkout@v4
        with:
          repository: hermetica-fi/hermetica-contracts
          ref: 5e13e431f69dd840fe297791fa2a73d9993a27e0
          path: hermetica-contracts
          fetch-depth: 1

      - name: Install pinned JavaScript dependencies
        working-directory: hermetica-contracts
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --ignore-scripts=false

      - name: Run baseline test suite
        id: baseline
        continue-on-error: true
        working-directory: hermetica-contracts
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee baseline-test-output.txt

      - name: Record baseline conclusion
        if: always()
        shell: bash
        run: |
          printf '%s\n' '${{ steps.baseline.outcome }}' > hermetica-contracts/baseline-conclusion.txt

      - name: Package reproducible local environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf hermetica-local-bundle.tar.gz hermetica-contracts
          sha256sum hermetica-local-bundle.tar.gz > hermetica-local-bundle.tar.gz.sha256

      - name: Upload pinned local bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-local-bundle-5e13e431
          path: |
            hermetica-local-bundle.tar.gz
            hermetica-local-bundle.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
