name: Hermetica on-chain USDh source capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-onchain-usdh-source.yml'
      - 'public-data/hermetica-onchain-usdh-source-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch immutable deployed source from Hiro
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG'
          OUT='hermetica-onchain-usdh-source'
          mkdir -p "$OUT/contracts"
          contracts=(
            hq-v1
            controller-v1-1
            staking-v1-1
            staking-silo-v1-1
            staking-reserve-v1
            staking-state-v1
            blacklist-susdh-v1
            usdh-token-v1
            susdh-token-v1
            sip-010-trait
            token-migration-trait-v1
            interim-token-trait-v1
            staking-trait-v1
            staking-silo-trait-v1
          )
          python3 - <<'PY'
          import json, pathlib, subprocess
          deployer = 'SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG'
          names = [
            'hq-v1','controller-v1-1','staking-v1-1','staking-silo-v1-1',
            'staking-reserve-v1','staking-state-v1','blacklist-susdh-v1',
            'usdh-token-v1','susdh-token-v1','sip-010-trait',
            'token-migration-trait-v1','interim-token-trait-v1',
            'staking-trait-v1','staking-silo-trait-v1'
          ]
          out = pathlib.Path('hermetica-onchain-usdh-source/contracts')
          meta = {}
          for name in names:
              url = f'https://api.hiro.so/v2/contracts/source/{deployer}/{name}?proof=0'
              raw = subprocess.check_output(['curl','--fail','--location','--retry','5','--retry-delay','2',url])
              payload = json.loads(raw)
              source = payload['source']
              out.joinpath(name + '.clar').write_text(source, encoding='utf-8')
              meta[name] = {
                  'contract_id': f'{deployer}.{name}',
                  'publish_height': payload.get('publish_height'),
                  'source_length': len(source),
              }
          pathlib.Path('hermetica-onchain-usdh-source/source-metadata.json').write_text(
              json.dumps(meta, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          find "$OUT/contracts" -type f -name '*.clar' -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          tar -czf hermetica-onchain-usdh-source.tar.gz "$OUT"
          sha256sum hermetica-onchain-usdh-source.tar.gz > hermetica-onchain-usdh-source.tar.gz.sha256

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-onchain-usdh-source
          path: |
            hermetica-onchain-usdh-source.tar.gz
            hermetica-onchain-usdh-source.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
