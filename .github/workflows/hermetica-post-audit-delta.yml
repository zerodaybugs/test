name: Hermetica post-audit public delta

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/hermetica_post_audit_delta.py'
      - '.github/workflows/hermetica-post-audit-delta.yml'
      - 'public-data/hermetica-delta-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout collector branch
        uses: actions/checkout@v4
        with:
          ref: stacks-public-history-20260724
          fetch-depth: 0

      - name: Clone pinned public target
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hermetica-contracts
          git clone --filter=blob:none https://github.com/hermetica-fi/hermetica-contracts.git /tmp/hermetica-contracts
          git -C /tmp/hermetica-contracts cat-file -e 09393e69a57db59e071b622d3e8cb7dfb5fcc426^{commit}
          git -C /tmp/hermetica-contracts cat-file -e 5e13e431f69dd840fe297791fa2a73d9993a27e0^{commit}

      - name: Generate function-level delta
        shell: bash
        env:
          HERMETICA_REPO: /tmp/hermetica-contracts
          HERMETICA_AUDITED_HEAD: 09393e69a57db59e071b622d3e8cb7dfb5fcc426
          HERMETICA_LATEST_HEAD: 5e13e431f69dd840fe297791fa2a73d9993a27e0
        run: |
          set -euo pipefail
          python3 scripts/hermetica_post_audit_delta.py
          sha256sum public-data/hermetica-post-audit-delta.json > public-data/hermetica-post-audit-delta.sha256

      - name: Commit public delta inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/hermetica-post-audit-delta.json public-data/hermetica-post-audit-delta.sha256
          if git diff --cached --quiet; then
            echo 'No delta changes.'
            exit 0
          fi
          git commit -m 'chore: capture Hermetica post-audit public delta [skip ci]'
          git push origin HEAD:stacks-public-history-20260724
