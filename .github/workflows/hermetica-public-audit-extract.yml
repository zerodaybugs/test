name: Hermetica public audit text extract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-public-audit-extract.yml'
      - 'public-data/hermetica-audit-extract-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download public reports and extract text
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p /tmp/hermetica-audits
          cd /tmp/hermetica-audits
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://raw.githubusercontent.com/Clarity-Alliance/audits/main/Clarity%20Alliance%20-%20Hermetica.pdf' \
            -o clarity-2024.pdf
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://2201013687-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2Fxp26OjT5H1o55M1QMDI4%2Fuploads%2FsxllbdrJOMTz2f6U8MRR%2FHermetica%20x%20StrataLabs%20-%20Audit%20Report.pdf?alt=media&token=b906f43e-aebc-4d96-a050-223689442378' \
            -o strata-2024.pdf
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://clarity-alliance.github.io/audits/Clarity%20Alliance%20-%20Hermetica%20USDh%20(Upgrade).pdf' \
            -o clarity-staking-2025.pdf
          for pdf in *.pdf; do
            pdfinfo "$pdf" > "${pdf%.pdf}.pdfinfo.txt"
            pdftotext -layout "$pdf" "${pdf%.pdf}.txt"
            sha256sum "$pdf" > "$pdf.sha256"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          keywords = [
            'reward', 'front-run', 'frontrun', 'front run', 'stake before',
            'staking', 'yield', 'dilut', 'snapshot', 'timing', 'daily',
            'conversion ratio', 'unclaimed', 'sandwich', 'deposit before'
          ]
          out = {}
          for path in sorted(Path('.').glob('*.txt')):
            if path.name.endswith('.pdfinfo.txt'):
              continue
            lines = path.read_text(errors='replace').splitlines()
            matches = []
            seen = set()
            for i, line in enumerate(lines):
              low = line.lower()
              terms = [k for k in keywords if k in low]
              if not terms:
                continue
              start=max(0,i-5); end=min(len(lines),i+8)
              key=(start,end)
              if key in seen: continue
              seen.add(key)
              matches.append({
                'line': i+1,
                'terms': terms,
                'window': '\n'.join(f'{j+1}: {lines[j]}' for j in range(start,end))
              })
            out[path.name] = {'line_count': len(lines), 'matches': matches}
          Path('keyword-windows.json').write_text(json.dumps(out, indent=2), encoding='utf-8')
          PY

      - name: Upload public audit extracts
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-public-audit-extracts
          path: /tmp/hermetica-audits
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
