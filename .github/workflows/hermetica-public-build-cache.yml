name: Hermetica pinned public build cache

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hermetica-public-build-cache.yml'
      - 'public-data/hermetica-build-cache-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          ref: stacks-public-history-20260724

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone pinned public Hermetica source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/hermetica-fi/hermetica-contracts.git hermetica-contracts
          git -C hermetica-contracts checkout --detach 5e13e431f69dd840fe297791fa2a73d9993a27e0
          test "$(git -C hermetica-contracts rev-parse HEAD)" = "5e13e431f69dd840fe297791fa2a73d9993a27e0"

      - name: Install lockfile-pinned public dependencies
        working-directory: hermetica-contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Record provenance and package integrity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'target_repository=hermetica-fi/hermetica-contracts'
            echo 'target_commit=5e13e431f69dd840fe297791fa2a73d9993a27e0'
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            sha256sum hermetica-contracts/package-lock.json
          } > hermetica-contracts/PUBLIC_BUILD_PROVENANCE.txt
          rm -rf hermetica-contracts/.git
          tar -czf hermetica-public-build-cache.tar.gz hermetica-contracts
          sha256sum hermetica-public-build-cache.tar.gz > hermetica-public-build-cache.tar.gz.sha256

      - name: Upload pinned public build cache
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-public-build-cache-5e13e431
          path: |
            hermetica-public-build-cache.tar.gz
            hermetica-public-build-cache.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
