name: Hermetica Pyth drawdown updates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-pyth-drawdown-updates.yml'
      - 'public-data/hermetica-pyth-drawdown-updates-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch signed Pyth BTC updates around large drawdowns
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-pyth-drawdown-updates
          mkdir -p "$OUT"
          python3 - <<'PY'
          import datetime as dt, decimal, hashlib, json, pathlib, time, urllib.parse, urllib.request
          OUT=pathlib.Path('/tmp/hermetica-pyth-drawdown-updates')
          FEED='e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43'
          BASE='https://benchmarks.pyth.network'
          WINDOWS=[
            {'name':'2025-10-10','peak':1760128800,'trough':1760131200},
            {'name':'2026-02-05-late','peak':1770334200,'trough':1770336600},
            {'name':'2026-02-05-early','peak':1770302700,'trough':1770305100},
            {'name':'2026-06-25','peak':1782393300,'trough':1782395700},
          ]
          decimal.getcontext().prec=50
          def get(url,attempts=10):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
                  except Exception as e:
                      last=e;time.sleep(min(10,1.5*(i+1)))
              raise RuntimeError(f'{url}: {last}')
          def fetch_at(ts):
              errs=[]
              for q in [urllib.parse.urlencode({'ids':FEED,'encoding':'hex','parsed':'true'}),urllib.parse.urlencode([('ids[]',FEED),('encoding','hex'),('parsed','true')])]:
                  url=f'{BASE}/v1/updates/price/{ts}?{q}'
                  try:
                      body=get(url); parsed=body.get('parsed') or []; data=(body.get('binary') or {}).get('data') or []
                      if not parsed or not data:errs.append({'url':url,'keys':list(body)});continue
                      item=parsed[0]; p=item.get('price') or {}; ptime=int(p.get('publish_time',item.get('publish_time',0))); pi=decimal.Decimal(str(p['price'])); expo=int(p['expo']); signed=data[0]
                      return {'requested_time':ts,'requested_iso':dt.datetime.fromtimestamp(ts,dt.timezone.utc).isoformat(),'publish_time':ptime,'publish_iso':dt.datetime.fromtimestamp(ptime,dt.timezone.utc).isoformat(),'price_integer':str(pi),'expo':expo,'price':format(pi*(decimal.Decimal(10)**expo),'f'),'conf':str(p.get('conf')),'feed_id':item.get('id'),'signed_hex':signed,'signed_bytes':len(signed)//2,'sha256':hashlib.sha256(bytes.fromhex(signed)).hexdigest(),'endpoint':url}
                  except Exception as e:errs.append({'url':url,'error':str(e)})
              raise RuntimeError(json.dumps(errs))
          results=[]
          for w in WINDOWS:
              peak=fetch_at(w['peak']);time.sleep(1.1);trough=fetch_at(w['trough']);time.sleep(1.1)
              pp=decimal.Decimal(peak['price']);tp=decimal.Decimal(trough['price']);drop=(pp-tp)/pp
              results.append({**w,'peak_update':peak,'trough_update':trough,'pyth_drop_fraction':str(drop),'pyth_drop_percent':str(drop*100),'stale_over_current_ratio':str(pp/tp)})
          out={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source':'Pyth Benchmarks public historical signed-price API','feed_id':FEED,'windows':results}
          (OUT/'pyth-drawdown-updates.json').write_text(json.dumps(out,indent=2))
          clean=[]
          for w in results:
              c={k:v for k,v in w.items() if k not in ('peak_update','trough_update')}
              c['peak_update']={k:v for k,v in w['peak_update'].items() if k!='signed_hex'}
              c['trough_update']={k:v for k,v in w['trough_update'].items() if k!='signed_hex'}
              clean.append(c)
          (OUT/'summary.json').write_text(json.dumps({'generated_at':out['generated_at'],'source':out['source'],'feed_id':FEED,'windows':clean},indent=2))
          print((OUT/'summary.json').read_text())
          PY
          (cd "$OUT" && sha256sum *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-pyth-drawdown-updates
          path: /tmp/hermetica-pyth-drawdown-updates
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
