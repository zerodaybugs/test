name: Hermetica Pyth reset sequence snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-pyth-reset-sequence.yml'
      - 'public-data/hermetica-pyth-reset-sequence-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch signed BTC updates at reset-separated timestamps
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-pyth-reset-sequence
          mkdir -p "$OUT"
          python3 - <<'PY'
          import datetime as dt, decimal, hashlib, json, pathlib, time, urllib.parse, urllib.request
          OUT=pathlib.Path('/tmp/hermetica-pyth-reset-sequence')
          FEED='e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43'
          BASE='https://benchmarks.pyth.network'
          REQUESTED=[1784576719,1784577319,1784577919,1784578519]
          decimal.getcontext().prec=50
          def get(url,attempts=8):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
                  except Exception as e:
                      last=e; time.sleep(min(10,1.5*(i+1)))
              raise RuntimeError(f'{url}: {last}')
          def fetch_at(ts):
              queries=[
                  urllib.parse.urlencode({'ids':FEED,'encoding':'hex','parsed':'true'}),
                  urllib.parse.urlencode([('ids[]',FEED),('encoding','hex'),('parsed','true')]),
              ]
              errors=[]
              for q in queries:
                  url=f'{BASE}/v1/updates/price/{ts}?{q}'
                  try:
                      body=get(url)
                      parsed=body.get('parsed') or []
                      data=(body.get('binary') or {}).get('data') or []
                      if not parsed or not data:
                          errors.append({'url':url,'body_keys':list(body),'parsed_count':len(parsed),'binary_count':len(data)})
                          continue
                      item=parsed[0]; price=item.get('price') or {}; signed=data[0]
                      ptime=int(price.get('publish_time',item.get('publish_time',0)))
                      p_int=decimal.Decimal(str(price['price'])); expo=int(price['expo'])
                      return {'requested_timestamp':ts,'requested_iso':dt.datetime.fromtimestamp(ts,dt.timezone.utc).isoformat(),'publish_time':ptime,'publish_iso':dt.datetime.fromtimestamp(ptime,dt.timezone.utc).isoformat(),'price_integer':str(p_int),'expo':expo,'price':format(p_int*(decimal.Decimal(10)**expo),'f'),'conf':str(price.get('conf')),'feed_id':item.get('id'),'signed_hex':signed,'signed_bytes':len(signed)//2,'sha256':hashlib.sha256(bytes.fromhex(signed)).hexdigest(),'endpoint':url}
                  except Exception as e:
                      errors.append({'url':url,'error':str(e)})
              raise RuntimeError(json.dumps(errors))
          rows=[]; errors=[]
          for ts in REQUESTED:
              try: rows.append(fetch_at(ts))
              except Exception as e: errors.append({'requested_timestamp':ts,'error':str(e)})
              time.sleep(1.1)
          out={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source':'Pyth Benchmarks public historical signed-price API','feed_id':FEED,'requested':REQUESTED,'rows':rows,'errors':errors,'publish_deltas':[rows[i+1]['publish_time']-rows[i]['publish_time'] for i in range(len(rows)-1)]}
          (OUT/'pyth-reset-sequence.json').write_text(json.dumps(out,indent=2))
          summary={k:v for k,v in out.items() if k!='rows'}|{'rows':[{k:v for k,v in r.items() if k!='signed_hex'} for r in rows]}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2))
          print((OUT/'summary.json').read_text())
          if len(rows)<2: raise SystemExit('fewer than two usable signed updates')
          PY
          (cd "$OUT" && sha256sum *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermetica-pyth-reset-sequence
          path: /tmp/hermetica-pyth-reset-sequence
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
