name: Hermetica rapid BTC drawdown scan v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-rapid-drawdown-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan signed Pyth BTC prices in exact four-block windows
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-rapid-v2
          mkdir -p "$OUT"
          python3 - <<'PY'
          import concurrent.futures as cf
          import datetime as dt
          import json, pathlib, time, urllib.parse, urllib.request
          from decimal import Decimal, getcontext
          getcontext().prec=50
          OUT=pathlib.Path('/tmp/hermetica-rapid-v2')
          FEED='e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43'
          API='https://api.hiro.so'
          START=1760128500
          END=1760131500
          STEP=5
          DELAY=4
          THRESHOLD=Decimal('5.2631578947368421052631578947')
          def get(url,attempts=10):
            last=None
            for i in range(attempts):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=40) as r:return json.loads(r.read().decode())
              except Exception as e:
                last=e;time.sleep(min(10,0.75*(i+1)))
            raise RuntimeError(f'{url}: {last}')
          def pyth(ts):
            queries=[
              [('ids',FEED),('encoding','hex'),('parsed','true')],
              [('ids[]','0x'+FEED),('encoding','hex'),('parsed','true')],
            ]
            last=None
            for params in queries:
              try:
                url=f'https://benchmarks.pyth.network/v1/updates/price/{ts}?'+urllib.parse.urlencode(params)
                d=get(url,4); parsed=d.get('parsed') or []
                if not parsed: raise RuntimeError('empty parsed list')
                p=parsed[0]['price']; binary=(d.get('binary') or {}).get('data') or []
                return {'requested_ts':ts,'publish_time':int(p['publish_time']),'price_integer':str(p['price']),'expo':int(p['expo']),'conf':str(p['conf']),'signed_hex':binary[0] if binary else None,'endpoint':url}
              except Exception as e:last=e
            raise RuntimeError(str(last))
          requested=list(range(START,END+1,STEP)); raw={}; errors={}
          with cf.ThreadPoolExecutor(max_workers=12) as ex:
            futs={ex.submit(pyth,t):t for t in requested}
            for f in cf.as_completed(futs):
              t=futs[f]
              try:raw[t]=f.result()
              except Exception as e:errors[t]=str(e)
          unique={}
          for r in raw.values():unique[r['publish_time']]=r
          updates=sorted(unique.values(),key=lambda x:x['publish_time'])
          for r in updates:r['price']=str(Decimal(r['price_integer'])*(Decimal(10)**r['expo']))
          info=get(f'{API}/v2/info');tip=int(info['stacks_tip_height']);cache={}
          def block(h):
            h=max(1,min(tip,int(h)))
            if h not in cache:
              q=urllib.parse.urlencode({'limit':1,'offset':tip-h});d=get(f'{API}/extended/v1/block?{q}');rows=d.get('results') or []
              if not rows:raise RuntimeError(f'no block {h}')
              if int(rows[0].get('height',-1))!=h:raise RuntimeError(f'height mismatch {h} {rows[0].get("height")}')
              cache[h]=rows[0]
            return cache[h]
          def bt(b):return int(b.get('block_time') or b.get('burn_block_time') or 0)
          def first(target):
            lo,hi=1,tip
            while lo<hi:
              mid=(lo+hi)//2
              if bt(block(mid))<target:lo=mid+1
              else:hi=mid
            return lo
          h0=max(DELAY+1,first(START)-8);h1=min(tip,first(END)+8)
          candidates=[]
          for h in range(h0,h1+1):
            floor_ts=bt(block(h-DELAY));exec_ts=bt(block(h));eligible=[u for u in updates if floor_ts<u['publish_time']<=exec_ts]
            maxrow=None;best=None
            for low in eligible:
              lp=Decimal(low['price'])
              if maxrow and maxrow['publish_time']<low['publish_time']:
                hp=Decimal(maxrow['price'])
                if lp<hp:
                  drop=(hp-lp)/hp*100
                  row={'execution_height':h,'execution_time':exec_ts,'floor_height':h-DELAY,'floor_time':floor_ts,'span_seconds':exec_ts-floor_ts,'high_publish_time':maxrow['publish_time'],'high_price':maxrow['price'],'low_publish_time':low['publish_time'],'low_price':low['price'],'publish_delta_seconds':low['publish_time']-maxrow['publish_time'],'drop_percent':str(drop),'threshold_crossed':drop>THRESHOLD,'high_signed_hex':maxrow['signed_hex'],'low_signed_hex':low['signed_hex']}
                  if best is None or drop>Decimal(best['drop_percent']):best=row
              if maxrow is None or lp>Decimal(maxrow['price']):maxrow=low
            if best:candidates.append(best)
          candidates.sort(key=lambda x:Decimal(x['drop_percent']),reverse=True)
          summary={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source':'Pyth Benchmarks signed updates + Hiro Stacks blocks','requested':len(requested),'successful':len(raw),'errors':len(errors),'unique_updates':len(updates),'blocks_scanned':h1-h0+1,'threshold_percent':str(THRESHOLD),'threshold_crossings':sum(1 for x in candidates if x['threshold_crossed']),'best':candidates[0] if candidates else None,'top_without_hex':[{k:v for k,v in x.items() if k not in ('high_signed_hex','low_signed_hex')} for x in candidates[:100]]}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2));(OUT/'candidates.json').write_text(json.dumps(candidates,indent=2));(OUT/'updates.json').write_text(json.dumps(updates,indent=2));(OUT/'errors.json').write_text(json.dumps(errors,indent=2));print(json.dumps(summary,indent=2))
          PY
          (cd "$OUT" && find . -type f -not -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-rapid-v2
          path: /tmp/hermetica-rapid-v2
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
