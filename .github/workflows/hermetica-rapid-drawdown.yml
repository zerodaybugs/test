name: Hermetica rapid BTC drawdown scan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-rapid-drawdown.yml'
      - 'public-data/hermetica-rapid-drawdown-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan public one-second BTC data and validate top intervals with signed Pyth updates
        shell: bash
        continue-on-error: true
        run: |
          set -u
          OUT=/tmp/hermetica-rapid-drawdown
          mkdir -p "$OUT"
          python3 - <<'PY'
          import concurrent.futures as cf
          import datetime as dt
          import json, pathlib, time, urllib.parse, urllib.request
          from decimal import Decimal, getcontext
          getcontext().prec=40
          OUT=pathlib.Path('/tmp/hermetica-rapid-drawdown')
          FEED='e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43'
          WINDOWS=[10,15,20,30,45,60,90,120,180,300]
          EVENTS=[
            ('2025-10-10',1760128800,1760131200),
            ('2026-02-05-early',1770302700,1770305100),
            ('2026-02-05-late',1770334200,1770336600),
            ('2026-06-25',1782393300,1782395700),
          ]
          errors=[]
          def get_json(url, attempts=8):
            last=None
            for i in range(attempts):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=40) as r:return json.loads(r.read().decode())
              except Exception as e:
                last=e; time.sleep(min(8,0.6*(i+1)))
            raise RuntimeError(f'{url}: {last}')
          def binance_1s(start_s,end_s):
            bases=['https://data-api.binance.vision','https://api.binance.com','https://api.binance.us']
            last=None
            for base in bases:
              try:
                rows=[]; cur=start_s*1000; end=end_s*1000
                while cur<=end:
                  q=urllib.parse.urlencode({'symbol':'BTCUSDT','interval':'1s','startTime':cur,'endTime':end,'limit':1000})
                  page=get_json(base+'/api/v3/klines?'+q,attempts=3)
                  if not page: break
                  rows.extend(page)
                  nxt=int(page[-1][0])+1000
                  if nxt<=cur: break
                  cur=nxt; time.sleep(.05)
                out=[]
                for r in rows:
                  ts=int(r[0])//1000
                  if start_s<=ts<=end_s:
                    out.append({'ts':ts,'open':str(r[1]),'high':str(r[2]),'low':str(r[3]),'close':str(r[4]),'source':base})
                if out:return out
              except Exception as e:last=e
            raise RuntimeError(f'all Binance endpoints failed: {last}')
          def top_drawdowns(rows,name):
            prices={r['ts']:r for r in rows}; times=sorted(prices); candidates=[]
            for w in WINDOWS:
              for t in times:
                end=t+w
                if end not in prices: continue
                hi=Decimal(prices[t]['high']); lo=Decimal(prices[end]['low'])
                if hi<=0: continue
                candidates.append({'event':name,'window_seconds':w,'high_ts':t,'low_ts':end,'binance_high':str(hi),'binance_low':str(lo),'binance_drop_percent':str((hi-lo)/hi*100)})
            candidates.sort(key=lambda x:Decimal(x['binance_drop_percent']),reverse=True)
            uniq=[]; seen=set()
            for c in candidates:
              key=(c['high_ts'],c['low_ts'])
              if key in seen:continue
              seen.add(key);uniq.append(c)
              if len(uniq)>=100:break
            return uniq
          def pyth(ts):
            q=urllib.parse.urlencode({'ids':FEED,'encoding':'hex','parsed':'true'})
            u=f'https://benchmarks.pyth.network/v1/updates/price/{ts}?{q}'
            d=get_json(u,attempts=6); parsed=(d.get('parsed') or [])[0]; price=parsed['price']
            return {'requested_ts':ts,'publish_time':int(price['publish_time']),'price_integer':str(price['price']),'expo':int(price['expo']),'conf':str(price['conf']),'signed_hex':(d.get('binary') or {}).get('data',[None])[0],'endpoint':u}
          all_rows=[]; all_candidates=[]
          for name,peak,trough in EVENTS:
            start=peak-900;end=trough+900
            try:
              rows=binance_1s(start,end)
              all_rows.append({'event':name,'start':start,'end':end,'rows':rows})
              all_candidates.extend(top_drawdowns(rows,name))
            except Exception as e:
              errors.append({'stage':'binance','event':name,'error':str(e)})
          all_candidates.sort(key=lambda x:Decimal(x['binance_drop_percent']),reverse=True)
          selected=[];seen=set()
          for c in all_candidates:
            key=(c['high_ts'],c['low_ts'])
            if key in seen:continue
            seen.add(key);selected.append(c)
            if len(selected)>=160:break
          timestamps=sorted({x[k] for x in selected for k in ('high_ts','low_ts')})
          pyth_map={}
          with cf.ThreadPoolExecutor(max_workers=12) as ex:
            fut={ex.submit(pyth,t):t for t in timestamps}
            for f in cf.as_completed(fut):
              t=fut[f]
              try:pyth_map[t]=f.result()
              except Exception as e:pyth_map[t]={'requested_ts':t,'error':str(e)};errors.append({'stage':'pyth','timestamp':t,'error':str(e)})
          enriched=[]
          for c in selected:
            a=pyth_map[c['high_ts']];b=pyth_map[c['low_ts']];row={**c,'pyth_high':a,'pyth_low':b}
            if 'price_integer' in a and 'price_integer' in b:
              pa=Decimal(a['price_integer'])*(Decimal(10)**a['expo']);pb=Decimal(b['price_integer'])*(Decimal(10)**b['expo'])
              row['pyth_high_price']=str(pa);row['pyth_low_price']=str(pb);row['pyth_drop_percent']=str((pa-pb)/pa*100) if pa else None;row['pyth_publish_delta']=b['publish_time']-a['publish_time']
            enriched.append(row)
          enriched.sort(key=lambda x:Decimal(x.get('pyth_drop_percent') or '-999'),reverse=True)
          compact=[]
          for r in enriched[:80]:
            q={k:v for k,v in r.items() if k not in ('pyth_high','pyth_low')}
            q['pyth_high']={k:v for k,v in r['pyth_high'].items() if k!='signed_hex'}
            q['pyth_low']={k:v for k,v in r['pyth_low'].items() if k!='signed_hex'}
            compact.append(q)
          summary={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source':'Binance public 1s klines plus Pyth Benchmarks signed historical updates','feed_id':FEED,'events':[x[0] for x in EVENTS],'binance_rows':sum(len(x['rows']) for x in all_rows),'candidate_count':len(selected),'pyth_timestamps_requested':len(timestamps),'top_by_pyth':compact,'errors':errors}
          (OUT/'raw-binance.json').write_text(json.dumps(all_rows,indent=2));(OUT/'pyth-updates.json').write_text(json.dumps(pyth_map,indent=2));(OUT/'enriched-candidates.json').write_text(json.dumps(enriched,indent=2));(OUT/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
          (cd "$OUT" && find . -type f -not -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermetica-rapid-drawdown
          path: /tmp/hermetica-rapid-drawdown
          retention-days: 2
          if-no-files-found: warn
          compression-level: 0
