name: Hermetica rapid BTC drawdown scan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-rapid-drawdown.yml'
      - 'public-data/hermetica-rapid-drawdown-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Scan signed Pyth BTC updates inside exact four-Stacks-block windows
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-rapid-drawdown
          mkdir -p "$OUT"
          python3 - <<'PY'
          import concurrent.futures as cf
          import datetime as dt
          import json, pathlib, time, urllib.parse, urllib.request
          from decimal import Decimal, getcontext

          getcontext().prec = 50
          OUT = pathlib.Path('/tmp/hermetica-rapid-drawdown')
          FEED = 'e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43'
          API = 'https://api.hiro.so'
          # Largest known BTC move from the prior broad scan. Extend five minutes
          # on each side so the exact short-duration path is captured.
          START = 1760128500
          END = 1760131500
          BLOCK_DELAY = 4
          INSOLVENCY_THRESHOLD_PERCENT = Decimal('5.2631578947368421052631578947')

          def get_json(url, attempts=12):
              last = None
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'read-only-security-research/1.0',
                          'Accept': 'application/json',
                      })
                      with urllib.request.urlopen(req, timeout=40) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(min(12, 0.75 * (i + 1)))
              raise RuntimeError(f'{url}: {last}')

          def pyth_at(ts):
              variants = [
                  [('ids', FEED), ('encoding', 'hex'), ('parsed', 'true')],
                  [('ids[]', '0x' + FEED), ('encoding', 'hex'), ('parsed', 'true')],
                  [('ids[]', FEED), ('encoding', 'hex'), ('parsed', 'true')],
              ]
              last = None
              for params in variants:
                  try:
                      url = f'https://benchmarks.pyth.network/v1/updates/price/{ts}?' + urllib.parse.urlencode(params)
                      data = get_json(url, attempts=4)
                      parsed = data.get('parsed') or []
                      if not parsed:
                          raise RuntimeError(f'no parsed update: {data}')
                      price = parsed[0]['price']
                      binary = (data.get('binary') or {}).get('data') or []
                      return {
                          'requested_ts': ts,
                          'publish_time': int(price['publish_time']),
                          'price_integer': str(price['price']),
                          'expo': int(price['expo']),
                          'conf': str(price['conf']),
                          'signed_hex': binary[0] if binary else None,
                          'endpoint': url,
                      }
                  except Exception as exc:
                      last = exc
              raise RuntimeError(str(last))

          requested = list(range(START, END + 1))
          updates_by_request = {}
          errors = {}
          with cf.ThreadPoolExecutor(max_workers=24) as executor:
              futures = {executor.submit(pyth_at, ts): ts for ts in requested}
              for future in cf.as_completed(futures):
                  ts = futures[future]
                  try:
                      updates_by_request[ts] = future.result()
                  except Exception as exc:
                      errors[ts] = str(exc)

          # Deduplicate the benchmark responses by actual signed publish time.
          unique = {}
          for row in updates_by_request.values():
              unique[row['publish_time']] = row
          updates = sorted(unique.values(), key=lambda x: x['publish_time'])
          for row in updates:
              row['price'] = str(Decimal(row['price_integer']) * (Decimal(10) ** row['expo']))

          info = get_json(f'{API}/v2/info')
          tip = int(info['stacks_tip_height'])
          block_cache = {}

          def block(height):
              height = max(1, min(tip, int(height)))
              if height not in block_cache:
                  offset = tip - height
                  query = urllib.parse.urlencode({'limit': 1, 'offset': offset})
                  body = get_json(f'{API}/extended/v1/block?{query}')
                  rows = body.get('results') or []
                  if not rows:
                      raise RuntimeError(f'no block at height={height}')
                  row = rows[0]
                  if int(row.get('height', -1)) != height:
                      raise RuntimeError(f'height mismatch requested={height} got={row.get("height")}')
                  block_cache[height] = row
              return block_cache[height]

          def block_time(row):
              return int(row.get('block_time') or row.get('burn_block_time') or 0)

          def first_at_or_after(target):
              lo, hi = 1, tip
              while lo < hi:
                  mid = (lo + hi) // 2
                  if block_time(block(mid)) < target:
                      lo = mid + 1
                  else:
                      hi = mid
              return lo

          h0 = max(BLOCK_DELAY + 1, first_at_or_after(START) - 8)
          h1 = min(tip, first_at_or_after(END) + 8)
          blocks = [block(h) for h in range(h0, h1 + 1)]

          candidates = []
          for current in blocks:
              h = int(current['height'])
              floor_block = block(h - BLOCK_DELAY)
              floor_ts = block_time(floor_block)
              execution_ts = block_time(current)
              eligible = [u for u in updates if floor_ts < u['publish_time'] <= execution_ts]
              best = None
              max_seen = None
              for low in eligible:
                  p = Decimal(low['price'])
                  if max_seen is not None and max_seen['publish_time'] < low['publish_time']:
                      hp = Decimal(max_seen['price'])
                      if hp > 0 and p < hp:
                          drop = (hp - p) / hp * Decimal(100)
                          row = {
                              'execution_height': h,
                              'execution_time': execution_ts,
                              'execution_iso': dt.datetime.fromtimestamp(execution_ts, dt.timezone.utc).isoformat(),
                              'floor_height': h - BLOCK_DELAY,
                              'floor_time': floor_ts,
                              'floor_iso': dt.datetime.fromtimestamp(floor_ts, dt.timezone.utc).isoformat(),
                              'four_block_span_seconds': execution_ts - floor_ts,
                              'high_publish_time': max_seen['publish_time'],
                              'high_iso': dt.datetime.fromtimestamp(max_seen['publish_time'], dt.timezone.utc).isoformat(),
                              'high_price': max_seen['price'],
                              'low_publish_time': low['publish_time'],
                              'low_iso': dt.datetime.fromtimestamp(low['publish_time'], dt.timezone.utc).isoformat(),
                              'low_price': low['price'],
                              'publish_delta_seconds': low['publish_time'] - max_seen['publish_time'],
                              'drop_percent': str(drop),
                              'exceeds_5pct_mint_slippage_threshold': drop > INSOLVENCY_THRESHOLD_PERCENT,
                              'high_signed_hex': max_seen['signed_hex'],
                              'low_signed_hex': low['signed_hex'],
                          }
                          if best is None or Decimal(row['drop_percent']) > Decimal(best['drop_percent']):
                              best = row
                  if max_seen is None or p > Decimal(max_seen['price']):
                      max_seen = low
              if best:
                  candidates.append(best)

          candidates.sort(key=lambda x: Decimal(x['drop_percent']), reverse=True)
          summary = {
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat(),
              'source': 'Pyth Benchmarks signed historical updates plus Hiro Stacks block history',
              'feed_id': FEED,
              'scan_start': START,
              'scan_end': END,
              'scan_start_iso': dt.datetime.fromtimestamp(START, dt.timezone.utc).isoformat(),
              'scan_end_iso': dt.datetime.fromtimestamp(END, dt.timezone.utc).isoformat(),
              'requested_seconds': len(requested),
              'successful_requests': len(updates_by_request),
              'request_errors': len(errors),
              'unique_signed_publish_times': len(updates),
              'block_delay': BLOCK_DELAY,
              'blocks_scanned': len(blocks),
              'insolvency_threshold_percent': str(INSOLVENCY_THRESHOLD_PERCENT),
              'best_candidate': candidates[0] if candidates else None,
              'threshold_crossings': sum(1 for c in candidates if c['exceeds_5pct_mint_slippage_threshold']),
              'top_candidates_without_hex': [
                  {k: v for k, v in c.items() if k not in ('high_signed_hex', 'low_signed_hex')}
                  for c in candidates[:100]
              ],
          }

          (OUT / 'summary.json').write_text(json.dumps(summary, indent=2))
          (OUT / 'candidates.json').write_text(json.dumps(candidates, indent=2))
          (OUT / 'unique-pyth-updates.json').write_text(json.dumps(updates, indent=2))
          (OUT / 'request-errors.json').write_text(json.dumps(errors, indent=2))
          (OUT / 'blocks.json').write_text(json.dumps(blocks, indent=2))
          print(json.dumps(summary, indent=2))
          PY
          (cd "$OUT" && find . -type f -not -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-rapid-drawdown
          path: /tmp/hermetica-rapid-drawdown
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
