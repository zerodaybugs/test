name: Hermetica Stacks gap cross-check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-stacks-price-drop-gaps.yml'
      - 'public-data/hermetica-stacks-price-drop-gaps-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check Stacks blocks around >5 percent BTC drops
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-stacks-price-drop-gaps
          mkdir -p "$OUT"
          python3 - <<'PY'
          import datetime as dt, json, pathlib, time, urllib.request
          OUT=pathlib.Path('/tmp/hermetica-stacks-price-drop-gaps')
          API='https://api.hiro.so'
          CANDIDATES=[
            {'name':'2025-10-10','peak':1760128800,'trough':1760131200,'drop_percent':12.980153332382372},
            {'name':'2026-02-05-late','peak':1770334200,'trough':1770336600,'drop_percent':6.83334764679018},
            {'name':'2026-02-05-early','peak':1770302700,'trough':1770305100,'drop_percent':5.589543269740249},
            {'name':'2026-06-25','peak':1782393300,'trough':1782395700,'drop_percent':5.302612809882743},
          ]
          def get(url,attempts=10):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
                  except Exception as e:
                      last=e;time.sleep(min(10,1+i))
              raise RuntimeError(f'{url}: {last}')
          info=get(f'{API}/v2/info'); tip=int(info['stacks_tip_height'])
          cache={}
          def block(h):
              h=max(1,min(tip,int(h)))
              if h not in cache:
                  data=get(f'{API}/extended/v2/blocks/{h}')
                  cache[h]=data.get('result',data)
              return cache[h]
          def ts(b):return int(b.get('block_time') or b.get('burn_block_time') or 0)
          def first_at_or_after(target):
              lo,hi=1,tip
              while lo<hi:
                  mid=(lo+hi)//2; t=ts(block(mid))
                  if t<target:lo=mid+1
                  else:hi=mid
              return lo
          results=[]
          for c in CANDIDATES:
              hp=first_at_or_after(c['peak']); ht=first_at_or_after(c['trough'])
              heights=set()
              for center in (hp,ht):
                  for h in range(max(1,center-12),min(tip,center+12)+1):heights.add(h)
              blocks=[block(h) for h in sorted(heights)]
              blocks.sort(key=lambda b:int(b['height']))
              gaps=[]
              for a,b in zip(blocks,blocks[1:]):
                  if int(b['height'])==int(a['height'])+1:
                      gaps.append({'from_height':int(a['height']),'to_height':int(b['height']),'from_time':ts(a),'to_time':ts(b),'from_iso':dt.datetime.fromtimestamp(ts(a),dt.timezone.utc).isoformat(),'to_iso':dt.datetime.fromtimestamp(ts(b),dt.timezone.utc).isoformat(),'gap_seconds':ts(b)-ts(a)})
              gaps.sort(key=lambda x:x['gap_seconds'],reverse=True)
              before_peak=block(max(1,hp-1)); after_peak=block(hp); before_trough=block(max(1,ht-1)); after_trough=block(ht)
              spanning=(int(after_trough['height'])-int(before_peak['height'])<=8 and ts(before_peak)<=c['peak'] and ts(after_trough)>=c['trough'])
              results.append({**c,'peak_iso':dt.datetime.fromtimestamp(c['peak'],dt.timezone.utc).isoformat(),'trough_iso':dt.datetime.fromtimestamp(c['trough'],dt.timezone.utc).isoformat(),'first_height_at_peak':hp,'first_height_at_trough':ht,'height_delta':ht-hp,'before_peak':before_peak,'after_peak':after_peak,'before_trough':before_trough,'after_trough':after_trough,'largest_local_gap':gaps[0] if gaps else None,'gaps':gaps,'single_delay4_window_can_span_drop':spanning})
          out={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'source':'Hiro public read-only block API + Binance candidate timestamps','tip_height':tip,'results':results}
          (OUT/'stacks-gap-cross-check.json').write_text(json.dumps(out,indent=2))
          summary={'generated_at':out['generated_at'],'source':out['source'],'results':[{k:v for k,v in r.items() if k not in ('before_peak','after_peak','before_trough','after_trough','gaps')} for r in results]}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          (cd "$OUT" && sha256sum *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-stacks-price-drop-gaps
          path: /tmp/hermetica-stacks-price-drop-gaps
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
