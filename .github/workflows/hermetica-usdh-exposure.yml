name: Hermetica USDh exposure snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-usdh-exposure.yml'
      - 'public-data/hermetica-usdh-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v4
        with:
          ref: hermetica-usdh-exposure-20260724
          fetch-depth: 0

      - name: Capture read-only public state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-data/hermetica-usdh
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          BASE = 'https://api.hiro.so'
          SENDER = 'SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D'
          addresses = {
              'hbtc-reserve': f'{SENDER}.reserve-hbtc-v1',
              'hbtc-hermetica-interface': f'{SENDER}.hermetica-interface-hbtc-v1',
              'usdh-staking-reserve': 'SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG.staking-reserve-v1',
              'usdh-staking-silo': 'SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG.staking-silo-v1-1',
          }

          def request_json(url, body=None):
              data = None if body is None else json.dumps(body).encode()
              headers = {'Accept': 'application/json', 'User-Agent': 'public-hbtc-exposure-snapshot/1.0'}
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              last = None
              for i in range(6):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers)
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      if i == 5: raise
                      time.sleep(min(30, 2 ** i))
              raise RuntimeError(last)

          def call_read(address, contract, function):
              return request_json(
                  f'{BASE}/v2/contracts/call-read/{address}/{contract}/{function}',
                  {'sender': SENDER, 'arguments': []},
              )

          def decode_ok_uint(payload):
              value = payload.get('result', '')
              if not isinstance(value, str) or not value.startswith('0x0701'):
                  return None
              return int(value[6:38], 16)

          balances = {}
          for name, principal in addresses.items():
              encoded = urllib.parse.quote(principal, safe='')
              balances[name] = request_json(f'{BASE}/extended/v1/address/{encoded}/balances')

          reads = {
              'susdh-total-supply': call_read('SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG', 'susdh-token-v1', 'get-total-supply'),
              'usdh-total-supply': call_read('SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG', 'usdh-token-v1', 'get-total-supply'),
              'usdh-per-susdh': call_read('SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG', 'staking-v1-1', 'get-usdh-per-susdh'),
          }
          decoded = {name: decode_ok_uint(payload) for name, payload in reads.items()}

          asset = urllib.parse.quote('SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG.susdh-token-v1::susdh', safe='')
          holders = request_json(f'{BASE}/extended/v1/tokens/ft/{asset}/holders?limit=200&offset=0')

          out = Path('public-data/hermetica-usdh')
          out.joinpath('snapshot.json').write_text(json.dumps({
              'source': 'Hiro public read-only APIs',
              'addresses': addresses,
              'balances': balances,
              'read_only_raw': reads,
              'decoded_uints': decoded,
              'susdh_holders': holders,
          }, indent=2, sort_keys=True), encoding='utf-8')
          PY
          sha256sum public-data/hermetica-usdh/snapshot.json > public-data/hermetica-usdh/SHA256SUMS

      - name: Commit public snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/hermetica-usdh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture public Hermetica USDh exposure snapshot [skip ci]'
          git push origin HEAD:hermetica-usdh-exposure-20260724
