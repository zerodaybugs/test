name: Hermetica USDh public state snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-usdh-public-state.yml'
      - 'public-data/hermetica-usdh-state-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install read-only client dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-state
          cd /tmp/hermetica-state
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0

      - name: Capture public contract state
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-state
          cat > snapshot.cjs <<'NODE'
          const fs = require('fs');
          const {
            principalCV,
            cvToHex,
            hexToCV,
            cvToJSON,
          } = require('@stacks/transactions');

          const API = 'https://api.hiro.so';
          const DEPLOYER = 'SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const names = [
            'hq-v1',
            'minting-state-v1',
            'minting-auto-state-v1',
            'minting-auto-v1-2',
            'minting-otc-v1-1',
            'redeeming-reserve-v1-2',
            'controller-v1-1',
            'emergency-recover-v1',
            'staking-v1-1',
            'staking-silo-v1-1',
            'staking-reserve-v1',
            'staking-state-v1',
            'usdh-token-v1',
            'susdh-token-v1',
          ];
          const contracts = Object.fromEntries(names.map(n => [n, `${DEPLOYER}.${n}`]));

          async function fetchRetry(url, options = {}, attempts = 6) {
            let last;
            for (let i = 0; i < attempts; i++) {
              try {
                const res = await fetch(url, options);
                if (res.ok) return res;
                last = new Error(`${res.status} ${res.statusText}: ${await res.text()}`);
                if (res.status < 500 && res.status !== 429) throw last;
              } catch (e) {
                last = e;
              }
              await new Promise(r => setTimeout(r, 1000 * (i + 1)));
            }
            throw last;
          }

          async function sourceExists(name) {
            const res = await fetch(`${API}/v2/contracts/source/${DEPLOYER}/${name}?proof=0`);
            if (!res.ok) return { exists: false, status: res.status };
            const body = await res.json();
            return { exists: true, source_length: (body.source || '').length };
          }

          async function callRead(contractName, functionName, cvs = []) {
            const res = await fetchRetry(`${API}/v2/contracts/call-read/${DEPLOYER}/${contractName}/${functionName}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ sender: DEPLOYER, arguments: cvs.map(cvToHex) }),
            });
            const body = await res.json();
            let decoded = null;
            if (body.result) {
              try { decoded = cvToJSON(hexToCV(body.result)); }
              catch (e) { decoded = { decode_error: String(e), raw: body.result }; }
            }
            return { okay: body.okay, cause: body.cause, result_raw: body.result, decoded };
          }

          async function getTransactions(principal, max = 1000) {
            const all = [];
            for (let offset = 0; offset < max; offset += 50) {
              const url = `${API}/extended/v1/address/${encodeURIComponent(principal)}/transactions?limit=50&offset=${offset}`;
              const res = await fetchRetry(url);
              const body = await res.json();
              const rows = body.results || [];
              all.push(...rows);
              if (rows.length < 50 || all.length >= (body.total || max)) break;
            }
            return all.slice(0, max);
          }

          async function getBalances(principal) {
            const res = await fetchRetry(`${API}/extended/v1/address/${encodeURIComponent(principal)}/balances`);
            return await res.json();
          }

          function directCalls(txs, contractId) {
            return txs.filter(tx => tx.tx_type === 'contract_call' && tx.contract_call?.contract_id === contractId);
          }

          function argsByName(tx) {
            const out = {};
            for (const a of tx.contract_call?.function_args || []) out[a.name || `arg${Object.keys(out).length}`] = a.repr;
            return out;
          }

          function principalsFrom(value) {
            const text = typeof value === 'string' ? value : JSON.stringify(value);
            const found = new Set();
            const re = /'?((?:SP|SM)[0-9A-HJKMNP-TV-Z]{20,50}(?:\.[a-zA-Z0-9-]{1,40})?)/g;
            let m;
            while ((m = re.exec(text))) found.add(m[1]);
            return [...found];
          }

          async function safeCall(out, key, contract, fn, cvs = []) {
            try { out[key] = await callRead(contract, fn, cvs); }
            catch (e) { out[key] = { error: String(e) }; }
          }

          (async () => {
            const output = {
              generated_at: new Date().toISOString(),
              source: 'Hiro public read-only APIs',
              deployer: DEPLOYER,
              contracts,
              source_status: {},
              transactions: {},
              current_state: {},
              balances: {},
            };

            for (const name of names) output.source_status[name] = await sourceExists(name);

            const allPrincipals = new Set([DEPLOYER, ...Object.values(contracts)]);
            const callIndex = {};
            for (const [name, cid] of Object.entries(contracts)) {
              if (!output.source_status[name].exists) continue;
              const txs = await getTransactions(cid, 1000);
              const calls = directCalls(txs, cid).map(tx => ({
                tx_id: tx.tx_id,
                status: tx.tx_status,
                block_height: tx.block_height,
                burn_block_time_iso: tx.burn_block_time_iso,
                sender_address: tx.sender_address,
                function_name: tx.contract_call.function_name,
                args: argsByName(tx),
                tx_result: tx.tx_result?.repr,
              }));
              output.transactions[name] = { total_address_txs: txs.length, direct_calls: calls };
              callIndex[name] = calls;
              for (const p of principalsFrom(calls)) allPrincipals.add(p);
              for (const c of calls) if (c.sender_address) allPrincipals.add(c.sender_address);
            }

            const principals = [...allPrincipals].sort();
            output.candidate_principals = principals;

            const hq = {};
            for (const fn of ['get-contracts-enabled','get-minting-enabled','get-owner','get-next-owner']) await safeCall(hq, fn, 'hq-v1', fn);
            hq.by_principal = {};
            for (const p of principals) {
              const row = {};
              for (const fn of ['get-contract-active','get-minting-contract','get-admin','get-guardian']) await safeCall(row, fn, 'hq-v1', fn, [principalCV(p)]);
              hq.by_principal[p] = row;
            }
            output.current_state.hq = hq;

            const autoState = {};
            for (const fn of ['get-mint-fee','get-redeem-fee','get-fee-address']) await safeCall(autoState, fn, 'minting-auto-state-v1', fn);
            const whitelistPairs = new Map();
            const supportedAssets = new Set();
            for (const c of callIndex['minting-auto-state-v1'] || []) {
              const ps = principalsFrom(c.args);
              if (c.function_name === 'set-whitelist' && ps.length >= 2) whitelistPairs.set(`${ps[0]}|${ps[1]}`, [ps[0], ps[1]]);
              if (c.function_name === 'set-supported-asset' && ps.length >= 1) supportedAssets.add(ps[0]);
            }
            autoState.supported_assets = {};
            for (const a of [...supportedAssets].sort()) await safeCall(autoState.supported_assets, a, 'minting-auto-state-v1', 'get-supported-asset', [principalCV(a)]);
            autoState.whitelist = {};
            for (const [k, [a, asset]] of [...whitelistPairs.entries()].sort()) await safeCall(autoState.whitelist, k, 'minting-auto-state-v1', 'get-whitelist', [principalCV(a), principalCV(asset)]);
            output.current_state.minting_auto_state = autoState;

            const auto = {};
            for (const fn of ['get-mint-limit','get-current-mint-limit','get-last-mint-limit-reset','get-mint-limit-reset-window']) await safeCall(auto, fn, 'minting-auto-v1-2', fn);
            output.current_state.minting_auto = auto;

            const mintState = {};
            for (const fn of ['get-mint-confirmation-window','get-redeem-confirmation-window','get-whitelist-enabled','get-mint-enabled','get-redeem-enabled','get-fee-address','get-min-amount-usdh-requested','get-mint-fee-usdh','get-redeem-fee-usdh','get-mint-fee-asset','get-redeem-fee-asset']) await safeCall(mintState, fn, 'minting-state-v1', fn);
            mintState.by_principal = {};
            for (const p of principals) {
              const row = {};
              await safeCall(row, 'get-gatekeeper-active', 'minting-state-v1', 'get-gatekeeper-active', [principalCV(p)]);
              await safeCall(row, 'get-whitelist', 'minting-state-v1', 'get-whitelist', [principalCV(p)]);
              mintState.by_principal[p] = row;
            }
            output.current_state.minting_state = mintState;

            const reserve = { by_principal: {} };
            for (const p of principals) {
              const row = {};
              await safeCall(row, 'get-manager', 'redeeming-reserve-v1-2', 'get-manager', [principalCV(p)]);
              await safeCall(row, 'get-authorized-recipient', 'redeeming-reserve-v1-2', 'get-authorized-recipient', [principalCV(p)]);
              reserve.by_principal[p] = row;
            }
            output.current_state.redeeming_reserve = reserve;

            const otc = {};
            for (const fn of ['get-mint-limit','get-current-mint-limit','get-mint-limit-reset-window','get-last-mint-limit-reset']) await safeCall(otc, fn, 'minting-otc-v1-1', fn);
            otc.by_principal = {};
            for (const p of principals) {
              const row = {};
              await safeCall(row, 'get-trader', 'minting-otc-v1-1', 'get-trader', [principalCV(p)]);
              otc.by_principal[p] = row;
            }
            output.current_state.minting_otc = otc;

            const controller = {};
            for (const fn of ['get-max-reward-per-window','get-update-window','get-last-log-block-height']) await safeCall(controller, fn, 'controller-v1-1', fn);
            controller.by_principal = {};
            for (const p of principals) {
              const row = {};
              await safeCall(row, 'get-rewarder', 'controller-v1-1', 'get-rewarder', [principalCV(p)]);
              controller.by_principal[p] = row;
            }
            output.current_state.controller = controller;

            const staking = {};
            for (const fn of ['get-cooldown-window','get-staking-enabled']) await safeCall(staking, fn, 'staking-state-v1', fn);
            staking.by_principal = {};
            for (const p of principals) {
              const row = {};
              await safeCall(row, 'get-custom-cooldown', 'staking-state-v1', 'get-custom-cooldown', [principalCV(p)]);
              staking.by_principal[p] = row;
            }
            output.current_state.staking_state = staking;

            for (const [name, cid] of Object.entries(contracts)) {
              if (!output.source_status[name].exists) continue;
              try { output.balances[name] = await getBalances(cid); }
              catch (e) { output.balances[name] = { error: String(e) }; }
            }

            fs.writeFileSync('hermetica-usdh-public-state.json', JSON.stringify(output, null, 2));
            console.log(JSON.stringify({ principals: principals.length, contracts_found: Object.values(output.source_status).filter(x => x.exists).length }, null, 2));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          node snapshot.cjs
          sha256sum hermetica-usdh-public-state.json > hermetica-usdh-public-state.json.sha256

      - name: Upload public state snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-usdh-public-state
          path: |
            /tmp/hermetica-state/hermetica-usdh-public-state.json
            /tmp/hermetica-state/hermetica-usdh-public-state.json.sha256
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
