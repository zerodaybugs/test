name: Hermetica USDh public state snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-usdh-public-state.yml'
      - 'public-data/hermetica-usdh-state-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install read-only client dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-state
          cd /tmp/hermetica-state
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0

      - name: Capture public staking and reward state
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-state
          cat > snapshot.cjs <<'NODE'
          const fs = require('fs');
          const { hexToCV, cvToJSON } = require('@stacks/transactions');

          const API = 'https://api.hiro.so';
          const DEPLOYER = 'SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const CONTRACTS = {
            controller: `${DEPLOYER}.controller-v1-1`,
            staking: `${DEPLOYER}.staking-v1-1`,
            stakingState: `${DEPLOYER}.staking-state-v1`,
            stakingReserve: `${DEPLOYER}.staking-reserve-v1`,
            stakingSilo: `${DEPLOYER}.staking-silo-v1-1`,
            usdh: `${DEPLOYER}.usdh-token-v1`,
            susdh: `${DEPLOYER}.susdh-token-v1`,
          };

          async function fetchRetry(url, options = {}, attempts = 8) {
            let last;
            for (let i = 0; i < attempts; i++) {
              try {
                const res = await fetch(url, options);
                if (res.ok) return res;
                const body = await res.text();
                last = new Error(`${res.status} ${res.statusText}: ${body}`);
                if (res.status < 500 && res.status !== 429) throw last;
              } catch (e) { last = e; }
              await new Promise(r => setTimeout(r, 750 * (i + 1)));
            }
            throw last;
          }

          async function callRead(contractName, functionName) {
            const res = await fetchRetry(`${API}/v2/contracts/call-read/${DEPLOYER}/${contractName}/${functionName}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ sender: DEPLOYER, arguments: [] }),
            });
            const body = await res.json();
            let decoded = null;
            if (body.result) {
              try { decoded = cvToJSON(hexToCV(body.result)); }
              catch (e) { decoded = { decode_error: String(e), raw: body.result }; }
            }
            return { okay: body.okay, cause: body.cause, result_raw: body.result, decoded };
          }

          async function sourceMeta(contractName) {
            const res = await fetchRetry(`${API}/v2/contracts/source/${DEPLOYER}/${contractName}?proof=0`);
            const body = await res.json();
            return { source_length: (body.source || '').length, publish_height: body.publish_height };
          }

          async function getBalance(principal) {
            const res = await fetchRetry(`${API}/extended/v1/address/${encodeURIComponent(principal)}/balances`);
            return await res.json();
          }

          async function getDirectCalls(contractId, max = 2000) {
            const out = [];
            for (let offset = 0; offset < max; offset += 50) {
              const res = await fetchRetry(`${API}/extended/v1/address/${encodeURIComponent(contractId)}/transactions?limit=50&offset=${offset}`);
              const body = await res.json();
              const rows = body.results || [];
              for (const tx of rows) {
                if (tx.tx_type !== 'contract_call' || tx.contract_call?.contract_id !== contractId) continue;
                out.push({
                  tx_id: tx.tx_id,
                  status: tx.tx_status,
                  sender_address: tx.sender_address,
                  nonce: tx.nonce,
                  fee_rate: tx.fee_rate,
                  block_height: tx.block_height,
                  burn_block_time: tx.burn_block_time,
                  burn_block_time_iso: tx.burn_block_time_iso,
                  function_name: tx.contract_call.function_name,
                  function_args: (tx.contract_call.function_args || []).map(a => ({ name: a.name, type: a.type, repr: a.repr })),
                  tx_result: tx.tx_result?.repr,
                });
              }
              if (rows.length < 50 || offset + rows.length >= (body.total || max)) break;
            }
            return out;
          }

          function ftBalance(balances, assetId) {
            return balances.fungible_tokens?.[assetId]?.balance ?? null;
          }

          (async () => {
            const output = {
              generated_at: new Date().toISOString(),
              source: 'Hiro public read-only APIs',
              deployer: DEPLOYER,
              contracts: CONTRACTS,
              source_meta: {},
              read_only: {},
              balances: {},
              history: {},
              errors: [],
            };

            for (const [key, cid] of Object.entries(CONTRACTS)) {
              const name = cid.split('.')[1];
              try { output.source_meta[key] = await sourceMeta(name); }
              catch (e) { output.errors.push({ step: `source:${key}`, error: String(e) }); }
            }

            const reads = [
              ['controller.maxRewardPerWindow', 'controller-v1-1', 'get-max-reward-per-window'],
              ['controller.updateWindow', 'controller-v1-1', 'get-update-window'],
              ['controller.lastLogBlockHeight', 'controller-v1-1', 'get-last-log-block-height'],
              ['staking.usdhPerSusdh', 'staking-v1-1', 'get-usdh-per-susdh'],
              ['stakingState.cooldownWindow', 'staking-state-v1', 'get-cooldown-window'],
              ['stakingState.stakingEnabled', 'staking-state-v1', 'get-staking-enabled'],
              ['usdh.totalSupply', 'usdh-token-v1', 'get-total-supply'],
              ['susdh.totalSupply', 'susdh-token-v1', 'get-total-supply'],
            ];
            for (const [key, contract, fn] of reads) {
              try { output.read_only[key] = await callRead(contract, fn); }
              catch (e) { output.errors.push({ step: `read:${key}`, error: String(e) }); }
            }

            for (const key of ['stakingReserve','stakingSilo','controller','staking']) {
              try { output.balances[key] = await getBalance(CONTRACTS[key]); }
              catch (e) { output.errors.push({ step: `balance:${key}`, error: String(e) }); }
            }

            for (const key of ['controller','staking','stakingSilo']) {
              try { output.history[key] = await getDirectCalls(CONTRACTS[key]); }
              catch (e) { output.errors.push({ step: `history:${key}`, error: String(e) }); }
            }

            const usdhAsset = `${CONTRACTS.usdh}::usdh`;
            const susdhAsset = `${CONTRACTS.susdh}::susdh`;
            output.summary = {
              controller_log_reward_calls: (output.history.controller || []).filter(x => x.function_name === 'log-reward' && x.status === 'success').length,
              staking_stake_calls: (output.history.staking || []).filter(x => x.function_name === 'stake' && x.status === 'success').length,
              staking_unstake_calls: (output.history.staking || []).filter(x => x.function_name === 'unstake' && x.status === 'success').length,
              silo_withdraw_calls: (output.history.stakingSilo || []).filter(x => x.function_name === 'withdraw' && x.status === 'success').length,
              staking_reserve_usdh: ftBalance(output.balances.stakingReserve || {}, usdhAsset),
              staking_silo_usdh: ftBalance(output.balances.stakingSilo || {}, usdhAsset),
              staking_contract_susdh: ftBalance(output.balances.staking || {}, susdhAsset),
            };

            fs.writeFileSync('hermetica-usdh-public-state.json', JSON.stringify(output, null, 2));
            if (output.errors.length) fs.writeFileSync('errors.json', JSON.stringify(output.errors, null, 2));
            console.log(JSON.stringify(output.summary, null, 2));
          })().catch(e => {
            fs.writeFileSync('fatal-error.txt', String(e && e.stack ? e.stack : e));
            console.error(e);
            process.exit(1);
          });
          NODE
          node snapshot.cjs
          sha256sum hermetica-usdh-public-state.json > hermetica-usdh-public-state.json.sha256

      - name: Upload public state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-usdh-public-state
          path: |
            /tmp/hermetica-state/hermetica-usdh-public-state.json
            /tmp/hermetica-state/hermetica-usdh-public-state.json.sha256
            /tmp/hermetica-state/errors.json
            /tmp/hermetica-state/fatal-error.txt
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
