name: Hermetica USDh trader map capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-usdh-trader-map.yml'
      - 'public-data/hermetica-usdh-trader-map-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install read-only client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermetica-usdh-traders
          cd /tmp/hermetica-usdh-traders
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @stacks/transactions@7.2.0

      - name: Capture public trader, whitelist and custody configuration
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hermetica-usdh-traders
          cat > capture.cjs <<'NODE'
          const fs = require('fs');
          const {principalCV, cvToHex, hexToCV, cvToJSON} = require('@stacks/transactions');
          const API='https://api.hiro.so';
          const DEP='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const contracts={
            hq:`${DEP}.hq-v1`,
            otc:`${DEP}.minting-otc-v1-1`,
            minting:`${DEP}.minting-v1`,
            state:`${DEP}.minting-state-v1`,
            reserve:`${DEP}.redeeming-reserve-v1-2`,
          };

          async function fetchRetry(url, options={}, attempts=7){let last;for(let i=0;i<attempts;i++){try{const r=await fetch(url,options);if(r.ok)return r;const t=await r.text();last=new Error(`${r.status} ${r.statusText}: ${t}`);if(r.status<500&&r.status!==429)throw last;}catch(e){last=e;}await new Promise(r=>setTimeout(r,1200*(i+1)));}throw last;}
          async function history(principal,max=2500){const all=[];for(let o=0;o<max;o+=50){const r=await fetchRetry(`${API}/extended/v1/address/${encodeURIComponent(principal)}/transactions?limit=50&offset=${o}`);const b=await r.json();const rows=b.results||[];all.push(...rows);if(rows.length<50||all.length>=(b.total||max))break;}return all.slice(0,max);}
          function direct(txs,cid){return txs.filter(t=>t.tx_type==='contract_call'&&t.contract_call?.contract_id===cid).map(t=>({tx_id:t.tx_id,status:t.tx_status,height:t.block_height,time:t.burn_block_time_iso,sender:t.sender_address,fn:t.contract_call.function_name,args:Object.fromEntries((t.contract_call.function_args||[]).map(a=>[a.name,a.repr])),result:t.tx_result?.repr}));}
          function principalsFrom(v){const s=typeof v==='string'?v:JSON.stringify(v);const out=new Set();const re=/'?((?:SP|SM)[0-9A-HJKMNP-TV-Z]{20,50}(?:\.[a-zA-Z0-9-]{1,50})?)/g;let m;while((m=re.exec(s)))out.add(m[1]);return [...out];}
          async function callRead(name,fn,args=[]){const r=await fetchRetry(`${API}/v2/contracts/call-read/${DEP}/${name}/${fn}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:DEP,arguments:args.map(cvToHex)})});const b=await r.json();let decoded=null;if(b.result){try{decoded=cvToJSON(hexToCV(b.result));}catch(e){decoded={error:String(e),raw:b.result};}}return {okay:b.okay,cause:b.cause,result_raw:b.result,decoded};}
          async function sourceMeta(p){if(!p.includes('.'))return {type:'standard'};const [a,...rest]=p.split('.');const n=rest.join('.');const r=await fetch(`${API}/v2/contracts/source/${a}/${n}?proof=0`);if(!r.ok)return {type:'contract',exists:false,status:r.status};const b=await r.json();return {type:'contract',exists:true,source_length:(b.source||'').length,publish_height:b.publish_height,source:b.source};}

          (async()=>{
            const histories={};
            for(const [k,cid] of Object.entries(contracts)) histories[k]=direct(await history(cid),cid);
            const candidates=new Set([DEP,...Object.values(contracts)]);
            for(const rows of Object.values(histories)) for(const x of rows){for(const p of principalsFrom(x))candidates.add(p);if(x.sender)candidates.add(x.sender);}
            const sorted=[...candidates].sort();
            const current={};
            for(const p of sorted){
              const row={source:await sourceMeta(p)};
              for(const [key,contract,fn] of [
                ['otc_trader','minting-otc-v1-1','get-trader'],
                ['minting_trader','minting-v1','get-trader'],
                ['state_whitelist','minting-state-v1','get-whitelist'],
                ['reserve_manager','redeeming-reserve-v1-2','get-manager'],
                ['reserve_recipient','redeeming-reserve-v1-2','get-authorized-recipient'],
                ['hq_active','hq-v1','get-contract-active'],
                ['hq_minting','hq-v1','get-minting-contract'],
                ['hq_admin','hq-v1','get-admin'],
                ['hq_guardian','hq-v1','get-guardian'],
              ]){
                try{row[key]=await callRead(contract,fn,[principalCV(p)]);}catch(e){row[key]={error:String(e)};}
              }
              current[p]=row;
            }
            const globals={};
            for(const [key,c,fn] of [
              ['whitelist_enabled','minting-state-v1','get-whitelist-enabled'],
              ['mint_enabled','minting-state-v1','get-mint-enabled'],
              ['redeem_enabled','minting-state-v1','get-redeem-enabled'],
              ['otc_mint_limit','minting-otc-v1-1','get-mint-limit'],
              ['otc_current_mint_limit','minting-otc-v1-1','get-current-mint-limit'],
              ['minting_mint_limit','minting-v1','get-mint-limit'],
              ['minting_current_mint_limit','minting-v1','get-current-mint-limit'],
              ['hq_contracts_enabled','hq-v1','get-contracts-enabled'],
              ['hq_minting_enabled','hq-v1','get-minting-enabled'],
            ]){try{globals[key]=await callRead(c,fn);}catch(e){globals[key]={error:String(e)};}}
            const out={generated_at:new Date().toISOString(),source:'Hiro public read-only APIs',contracts,counts:Object.fromEntries(Object.entries(histories).map(([k,v])=>[k,v.length])),globals,histories,current};
            fs.writeFileSync('hermetica-usdh-trader-map.json',JSON.stringify(out,null,2));
            const live=[];
            function v(x){return x?.decoded?.value;}
            for(const [p,r] of Object.entries(current)){
              const ot=v(r.otc_trader)||{};const mt=v(r.minting_trader)||{};const wl=v(r.state_whitelist)||{};
              if(ot.minter||ot.redeemer||mt.minter||mt.redeemer||wl.minter||wl.redeemer)live.push({principal:p,source:r.source,otc:ot,minting:mt,whitelist:wl});
            }
            fs.writeFileSync('summary.json',JSON.stringify({counts:out.counts,globals,live},null,2));
            console.log(JSON.stringify({counts:out.counts,live:live.length},null,2));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node capture.cjs
          sha256sum hermetica-usdh-trader-map.json summary.json > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-usdh-trader-map
          path: |
            /tmp/hermetica-usdh-traders/hermetica-usdh-trader-map.json
            /tmp/hermetica-usdh-traders/summary.json
            /tmp/hermetica-usdh-traders/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
