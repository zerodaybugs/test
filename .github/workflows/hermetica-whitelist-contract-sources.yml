name: Hermetica whitelisted contract source capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-whitelist-contract-sources.yml'
      - 'public-data/hermetica-whitelist-sources-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: hermetica-usdh-public-state-20260725
          fetch-depth: 0

      - name: Fetch immutable public sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-data/hermetica-whitelist-sources
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          contracts={
            'granite-liquidator':'SP1A4X1ZFXGE4J28ZQ9QG3JNRCQ4AK6R10PECHVVP/liquidator',
            'zest-flh':'SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7/flh',
          }
          out=Path('public-data/hermetica-whitelist-sources')
          for name,path in contracts.items():
            url=f'https://api.hiro.so/v2/contracts/source/{path}?proof=0'
            last=None
            for i in range(8):
              try:
                req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'public-security-research/1.0'})
                with urllib.request.urlopen(req,timeout=60) as r: body=json.load(r)
                source=body['source']
                out.joinpath(name+'.clar').write_text(source,encoding='utf-8')
                out.joinpath(name+'.meta.json').write_text(json.dumps({k:v for k,v in body.items() if k!='source'},indent=2),encoding='utf-8')
                break
              except Exception as e:
                last=e; time.sleep(i+1)
            else: raise last
          PY
          sha256sum public-data/hermetica-whitelist-sources/* > public-data/hermetica-whitelist-sources/SHA256SUMS

      - name: Commit public sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/hermetica-whitelist-sources
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture public whitelisted contract sources [skip ci]'
          git push origin HEAD:hermetica-usdh-public-state-20260725

      - name: Upload public sources
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-whitelist-contract-sources
          path: public-data/hermetica-whitelist-sources
          retention-days: 1
          if-no-files-found: error
