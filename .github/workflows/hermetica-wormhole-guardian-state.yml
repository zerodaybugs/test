name: Hermetica Wormhole guardian state snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hermetica-wormhole-guardian-state.yml'
      - 'public-data/hermetica-wormhole-guardian-state-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture public Wormhole guardian initialization history
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/hermetica-wormhole-guardian-state
          mkdir -p "$OUT"
          API='https://api.hiro.so'
          CID='SP1CGXWEAMG6P6FT04W66NVGJ7PQWMDAC19R7PJ0Y.wormhole-core-v4'
          python3 - <<'PY'
          import json, pathlib, time, urllib.parse, urllib.request
          out=pathlib.Path('/tmp/hermetica-wormhole-guardian-state')
          api='https://api.hiro.so'
          cid='SP1CGXWEAMG6P6FT04W66NVGJ7PQWMDAC19R7PJ0Y.wormhole-core-v4'
          def get(url, attempts=10):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'read-only-security-research/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
                  except Exception as e:
                      last=e; time.sleep(min(10,1+i))
              raise RuntimeError(f'{url}: {last}')
          rows=[]
          offset=0
          while True:
              body=get(f'{api}/extended/v1/address/{urllib.parse.quote(cid,safe="")}/transactions?limit=50&offset={offset}')
              batch=body.get('results') or []
              rows.extend(batch)
              if len(batch)<50 or len(rows)>=body.get('total',len(rows)):break
              offset+=50
          updates=[]
          for t in rows:
              cc=t.get('contract_call') or {}
              if cc.get('contract_id')==cid and cc.get('function_name')=='update-guardians-set':
                  updates.append({
                    'tx_id':t.get('tx_id'),'status':t.get('tx_status'),'sender':t.get('sender_address'),
                    'block_height':t.get('block_height'),'block_time':t.get('burn_block_time'),
                    'block_time_iso':t.get('burn_block_time_iso'),'result':(t.get('tx_result') or {}).get('repr'),
                    'function_args':cc.get('function_args') or [],'events':t.get('events') or [],
                  })
          summary={'generated_at':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'source':'Hiro public read-only APIs','contract':cid,'transaction_count':len(rows),'guardian_update_count':len(updates),'guardian_updates':updates}
          (out/'guardian-history.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps({'transaction_count':len(rows),'guardian_update_count':len(updates),'updates':[{'tx_id':u['tx_id'],'status':u['status'],'block_height':u['block_height'],'block_time_iso':u['block_time_iso'],'arg_count':len(u['function_args'])} for u in updates]},indent=2))
          PY
          curl --fail --location --retry 8 --retry-all-errors \
            -X POST -H 'content-type: application/json' \
            --data '{"sender":"SP1CGXWEAMG6P6FT04W66NVGJ7PQWMDAC19R7PJ0Y","arguments":[]}' \
            "$API/v2/contracts/call-read/SP1CGXWEAMG6P6FT04W66NVGJ7PQWMDAC19R7PJ0Y/wormhole-core-v4/get-active-guardian-set" \
            -o "$OUT/active-guardian-set.json"
          (cd "$OUT" && sha256sum *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-wormhole-guardian-state
          path: /tmp/hermetica-wormhole-guardian-state
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
