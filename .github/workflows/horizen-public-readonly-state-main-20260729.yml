name: Temporary Horizen public read-only state 20260729

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horizen-public-readonly-state-main-20260729.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Collect public state with read-only RPC calls
        shell: bash
        env:
          MAINNET_RPC: https://horizen.calderachain.xyz/http
          TESTNET_RPC: https://horizen-testnet.rpc.caldera.xyz/http
          STAKER: '0x6BF7CF29a8bcE11Aa62Cf593d165C244fA4d3E31'
          ACCUMULATOR: '0x06f5555fee73EDdc385b6d76FE00DB2D96ccDaE8'
          MAINNET_TOKEN: '0x57da2D504bf8b83Ef304759d9f2648522D7a9280'
          TESTNET_TOKEN: '0xb06EC4ce262D8dbDc24Fac87479A49A7DC4cFb87'
          DEPLOYER_NOTIFIER: '0x9B264B21ca7659C256aD09171f827976Acd5a1C3'
        run: |
          set -euo pipefail
          mkdir -p evidence
          forge --version | tee evidence/FOUNDRY_VERSION.txt
          cast --version | tee evidence/CAST_VERSION.txt

          first_word() {
            timeout 30s "$@" 2>&1 | awk 'NR==1 {print $1}'
          }

          collect() {
            local label="$1" rpc="$2" token="$3" from_block="$4"
            local out="evidence/${label}_STATE.txt"
            local logs="evidence/${label}_EVENTS.txt"
            local chain block ts window last next accumulated whitelist owner reward_end checkpoint rate total_staked total_power notifier deployer_notifier staker_bal acc_bal
            chain="$(first_word cast chain-id --rpc-url "$rpc")"
            block="$(first_word cast block-number --rpc-url "$rpc")"
            ts="$(first_word cast block latest --field timestamp --rpc-url "$rpc")"
            window="$(first_word cast call "$ACCUMULATOR" 'timeWindow()(uint256)' --rpc-url "$rpc")"
            last="$(first_word cast call "$ACCUMULATOR" 'lastRewardTime()(uint256)' --rpc-url "$rpc")"
            next="$(first_word cast call "$ACCUMULATOR" 'nextRewardTime()(uint256)' --rpc-url "$rpc")"
            accumulated="$(first_word cast call "$ACCUMULATOR" 'accumulatedRewards()(uint256)' --rpc-url "$rpc")"
            whitelist="$(first_word cast call "$ACCUMULATOR" 'whitelistEnabled()(bool)' --rpc-url "$rpc")"
            owner="$(first_word cast call "$ACCUMULATOR" 'owner()(address)' --rpc-url "$rpc")"
            reward_end="$(first_word cast call "$STAKER" 'rewardEndTime()(uint256)' --rpc-url "$rpc")"
            checkpoint="$(first_word cast call "$STAKER" 'lastCheckpointTime()(uint256)' --rpc-url "$rpc")"
            rate="$(first_word cast call "$STAKER" 'scaledRewardRate()(uint256)' --rpc-url "$rpc")"
            total_staked="$(first_word cast call "$STAKER" 'totalStaked()(uint256)' --rpc-url "$rpc")"
            total_power="$(first_word cast call "$STAKER" 'totalEarningPower()(uint256)' --rpc-url "$rpc")"
            notifier="$(first_word cast call "$STAKER" 'isRewardNotifier(address)(bool)' "$ACCUMULATOR" --rpc-url "$rpc")"
            deployer_notifier="$(first_word cast call "$STAKER" 'isRewardNotifier(address)(bool)' "$DEPLOYER_NOTIFIER" --rpc-url "$rpc")"
            staker_bal="$(first_word cast call "$token" 'balanceOf(address)(uint256)' "$STAKER" --rpc-url "$rpc")"
            acc_bal="$(first_word cast call "$token" 'balanceOf(address)(uint256)' "$ACCUMULATOR" --rpc-url "$rpc")"

            {
              echo "LABEL=$label"
              echo "PUBLIC_NETWORK_WRITES=0"
              echo "COLLECTED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "CHAIN_ID=$chain"
              echo "BLOCK_NUMBER=$block"
              echo "BLOCK_TIMESTAMP=$ts"
              echo "RA_TIME_WINDOW=$window"
              echo "RA_LAST_REWARD_TIME=$last"
              echo "RA_NEXT_REWARD_TIME=$next"
              echo "RA_ACCUMULATED_REWARDS=$accumulated"
              echo "RA_WHITELIST_ENABLED=$whitelist"
              echo "RA_OWNER=$owner"
              echo "STAKER_REWARD_END_TIME=$reward_end"
              echo "STAKER_LAST_CHECKPOINT_TIME=$checkpoint"
              echo "STAKER_SCALED_REWARD_RATE=$rate"
              echo "STAKER_TOTAL_STAKED=$total_staked"
              echo "STAKER_TOTAL_EARNING_POWER=$total_power"
              echo "STAKER_ACCUMULATOR_IS_NOTIFIER=$notifier"
              echo "STAKER_DEPLOYER_IS_NOTIFIER=$deployer_notifier"
              echo "TOKEN_STAKER_BALANCE=$staker_bal"
              echo "TOKEN_ACCUMULATOR_BALANCE=$acc_bal"
            } | tee "$out"

            python3 - "$out" <<'PY' | tee -a "$out"
import sys
p={}
for line in open(sys.argv[1], encoding='utf-8'):
    if '=' in line:
        k,v=line.rstrip().split('=',1); p[k]=v

def n(k):
    try: return int(p[k],0)
    except Exception: return None
window=n('RA_TIME_WINDOW'); last=n('RA_LAST_REWARD_TIME'); nxt=n('RA_NEXT_REWARD_TIME')
end=n('STAKER_REWARD_END_TIME'); now=n('BLOCK_TIMESTAMP')
if None not in (window,last,nxt,end,now):
    stream_start=end-2_592_000
    overlap=max(end-nxt,0)
    print(f'STAKER_CURRENT_STREAM_START={stream_start}')
    print(f'NEXT_BOUNDARY_OVERLAP_SECONDS={overlap}')
    print(f'NEXT_BOUNDARY_BEFORE_STREAM_END={str(nxt < end).lower()}')
    print(f'STREAM_SECONDS_REMAINING={max(end-now,0)}')
    print(f'BOUNDARY_SECONDS_REMAINING={max(nxt-now,0)}')
    print(f'LIVE_WINDOW_EQUALS_REWARD_DURATION={str(window == 2_592_000).lower()}')
    print(f'CURRENT_STREAM_START_MINUS_LAST_GRID={stream_start-last}')
PY

            {
              echo "LABEL=$label"
              echo "PUBLIC_NETWORK_WRITES=0"
              echo "--- TimeWindowSet ---"
              timeout 60s cast logs --from-block "$from_block" --to-block latest --address "$ACCUMULATOR" 'TimeWindowSet(uint256)' --rpc-url "$rpc" || true
              echo "--- RewardsSentToStaker ---"
              timeout 60s cast logs --from-block "$from_block" --to-block latest --address "$ACCUMULATOR" 'RewardsSentToStaker(uint256,uint256)' --rpc-url "$rpc" || true
              echo "--- RewardNotified ---"
              timeout 60s cast logs --from-block "$from_block" --to-block latest --address "$STAKER" 'RewardNotified(uint256,address)' --rpc-url "$rpc" || true
            } | tee "$logs"
          }

          collect MAINNET "$MAINNET_RPC" "$MAINNET_TOKEN" 21317419
          collect TESTNET "$TESTNET_RPC" "$TESTNET_TOKEN" 21842327

          {
            echo 'PUBLIC_NETWORK_WRITES=0'
            echo 'METHOD=eth_call/eth_getLogs only'
            sha256sum evidence/*
          } | tee evidence/SHA256SUMS.txt

      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: horizen-public-readonly-state-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
