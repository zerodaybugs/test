name: IC deployed minters public source package

on:
  push:
    branches:
      - ic-deployed-minters-source-public-20260826
    paths:
      - .github/workflows/ic-deployed-minters-source-public-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ic-deployed-minters-source-public-20260826
  cancel-in-progress: true

env:
  CKBTC_REV: 50ba5020d6d654d70a48d964969fef8443fb42ae
  CKETH_REV: a47e5434753752c1d2972fbc4407d14f88964285

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch exact public upstream source
        shell: bash
        run: |
          set -eEuo pipefail
          for spec in ckbtc:$CKBTC_REV cketh:$CKETH_REV; do
            name="${spec%%:*}"
            rev="${spec#*:}"
            dir="$RUNNER_TEMP/ic-$name"
            git init "$dir"
            git -C "$dir" remote add origin https://github.com/dfinity/ic.git
            git -C "$dir" -c protocol.version=2 fetch --no-tags --depth=1 origin "$rev"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$rev"
          done

      - name: Build integrity-pinned source archive
        shell: bash
        run: |
          set -eEuo pipefail
          out="$RUNNER_TEMP/deployed-minters"
          mkdir -p "$out/ckbtc" "$out/cketh"

          cp -a "$RUNNER_TEMP/ic-ckbtc/rs/bitcoin/ckbtc/minter" "$out/ckbtc/"
          cp -a "$RUNNER_TEMP/ic-ckbtc/rs/bitcoin/ckbtc/mainnet" "$out/ckbtc/"
          cp -a "$RUNNER_TEMP/ic-ckbtc/rs/bitcoin/ckbtc/checker" "$out/ckbtc/" 2>/dev/null || true
          cp -a "$RUNNER_TEMP/ic-ckbtc/rs/bitcoin/ckbtc/test_utils" "$out/ckbtc/" 2>/dev/null || true

          cp -a "$RUNNER_TEMP/ic-cketh/rs/ethereum/cketh/minter" "$out/cketh/"
          cp -a "$RUNNER_TEMP/ic-cketh/rs/ethereum/cketh/mainnet" "$out/cketh/"
          cp -a "$RUNNER_TEMP/ic-cketh/rs/ethereum/cketh/test_utils" "$out/cketh/" 2>/dev/null || true
          cp -a "$RUNNER_TEMP/ic-cketh/rs/ethereum/cketh/ledger_suite_orchestrator" "$out/cketh/" 2>/dev/null || true

          printf '%s\n' \
            "ckbtc_revision=$CKBTC_REV" \
            "ckbtc_module_hash=789d9e138796c30bb63bc6482918d529f24627c0b96ecb81196a642a5dd236bc" \
            "cketh_revision=$CKETH_REV" \
            "cketh_module_hash=5ca6c97d52cc3ab86f675674309255b62db91d1e2de592a44795088ba54d35c0" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            > "$out/PROVENANCE.txt"

          (
            cd "$out"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/ic-deployed-minters-source.tar.gz" deployed-minters
          sha256sum "$RUNNER_TEMP/ic-deployed-minters-source.tar.gz" > "$RUNNER_TEMP/ic-deployed-minters-source.tar.gz.sha256"
          du -sh "$out"
          ls -lh "$RUNNER_TEMP/ic-deployed-minters-source.tar.gz"*

      - name: Upload source archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ic-deployed-minters-source-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/ic-deployed-minters-source.tar.gz
            ${{ runner.temp }}/ic-deployed-minters-source.tar.gz.sha256
