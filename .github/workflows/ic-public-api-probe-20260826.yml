name: IC public deployment metadata probe

on:
  push:
    branches:
      - ic-public-api-probe-20260826
    paths:
      - .github/workflows/ic-public-api-probe-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ic-public-api-probe-20260826
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch public Dashboard API records
        shell: bash
        run: |
          set -eEuo pipefail
          echo 'probe_revision=2'
          mkdir -p "$RUNNER_TEMP/ic-public"
          base='https://ic-api.internetcomputer.org/api/v3'
          curl --fail --silent --show-error --location \
            "$base/proposals/141772" \
            -o "$RUNNER_TEMP/ic-public/proposal-141772.json"
          curl --fail --silent --show-error --location \
            "$base/canisters/mqygn-kiaaa-aaaar-qaadq-cai" \
            -o "$RUNNER_TEMP/ic-public/ckbtc-minter-canister.json"
          curl --fail --silent --show-error --location \
            "$base/canisters/sv3dd-oaaaa-aaaar-qacoa-cai" \
            -o "$RUNNER_TEMP/ic-public/cketh-minter-canister.json"

          : > "$RUNNER_TEMP/ic-public/recent-install-code-proposals.jsonl"
          for offset in $(seq 0 100 2000); do
            curl --fail --silent --show-error --location \
              "$base/proposals?limit=100&offset=$offset" \
              -o "$RUNNER_TEMP/ic-public/page-$offset.json"
            jq -c '.data[]?' "$RUNNER_TEMP/ic-public/page-$offset.json" \
              >> "$RUNNER_TEMP/ic-public/recent-install-code-proposals.jsonl"
            if grep -q '5ca6c97d52cc3ab86f675674309255b62db91d1e2de592a44795088ba54d35c0' \
              "$RUNNER_TEMP/ic-public/page-$offset.json"; then
              break
            fi
          done
          grep -F '5ca6c97d52cc3ab86f675674309255b62db91d1e2de592a44795088ba54d35c0' \
            "$RUNNER_TEMP/ic-public/recent-install-code-proposals.jsonl" \
            > "$RUNNER_TEMP/ic-public/cketh-deployment-proposal.jsonl" || true

          for file in "$RUNNER_TEMP/ic-public"/*.json "$RUNNER_TEMP/ic-public"/*.jsonl; do
            echo "===== $(basename "$file") ====="
            if [[ "$file" == *.json ]]; then jq . "$file"; else cat "$file"; fi
          done

          cd "$RUNNER_TEMP/ic-public"
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload public metadata
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ic-public-deployment-metadata-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/ic-public/
