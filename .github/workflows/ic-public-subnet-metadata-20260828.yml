name: ICP public Bitcoin subnet metadata

on:
  push:
    branches:
      - ic-public-subnet-metadata-20260828
    paths:
      - .github/workflows/ic-public-subnet-metadata-20260828.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query official public dashboard API
        shell: bash
        run: |
          set -eEuo pipefail
          endpoint='https://ic-api.internetcomputer.org/api/v3/subnets/w4rem-dv5e3-widiz-wbpea-kbttk-mnzfm-tzrc7-svcj3-kbxyb-zamch-hqe'
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -H 'accept: application/json' "$endpoint" \
            -o "$RUNNER_TEMP/w4rem-subnet.json"
          python3 -m json.tool "$RUNNER_TEMP/w4rem-subnet.json" \
            > "$RUNNER_TEMP/w4rem-subnet.pretty.json"
          sha256sum "$RUNNER_TEMP/w4rem-subnet.json" \
            "$RUNNER_TEMP/w4rem-subnet.pretty.json" \
            > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/w4rem-subnet.pretty.json"

      - name: Upload public metadata
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ic-public-w4rem-subnet-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/w4rem-subnet.json
            ${{ runner.temp }}/w4rem-subnet.pretty.json
            ${{ runner.temp }}/SHA256SUMS
