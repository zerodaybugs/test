name: Export ILSpy command-line tool

on:
  push:
    branches:
      - agent/dotnet-package-fetch-20260818
    paths:
      - '.github/workflows/ilspycmd-export-20260819.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install latest stable ilspycmd from NuGet
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out/tool out/evidence
          dotnet tool install ilspycmd --tool-path out/tool
          out/tool/ilspycmd --version | tee out/evidence/VERSION.txt
          find out/tool -type f -print0 | sort -z | xargs -0 sha256sum > out/evidence/SHA256SUMS.txt
          dotnet --info > out/evidence/DOTNET_INFO.txt

      - name: Upload ILSpy tool
        uses: actions/upload-artifact@v4
        with:
          name: ilspycmd-tool-20260819
          path: out
          if-no-files-found: error
          retention-days: 7
