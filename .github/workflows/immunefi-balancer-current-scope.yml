name: Immunefi Balancer current scope snapshot

on:
  push:
    branches:
      - tooling/foundry-download-bootstrap-20260802
    paths:
      - '.github/workflows/immunefi-balancer-current-scope.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/immunefi-balancer-current-scope.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and filter official public API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://immunefi.com/public-api/bounties.json -o bounties.json
          jq '[.[] | select(.slug == "balancer" or .id == "balancer" or .project == "Balancer" or .project == "Balancer Foundation")]' \
            bounties.json > balancer-current.json
          jq 'length' balancer-current.json
          jq -r '.[] | [.slug, .project, .updatedDate, (.maxBounty|tostring), (.assets|length|tostring)] | @tsv' \
            balancer-current.json > summary.tsv
          jq -r '.[] | .assets[] | [.description, .url, .type, (.addedAt // "")] | @tsv' \
            balancer-current.json > assets.tsv
          grep -iE 'FeeDistributor|D3cf852898b21fc233251427c2DC93d3d604F3BB' assets.tsv > fee-distributor-match.tsv || true
          cat summary.tsv
          cat fee-distributor-match.tsv
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: immunefi-balancer-current-scope
          path: |
            balancer-current.json
            summary.tsv
            assets.tsv
            fee-distributor-match.tsv
          if-no-files-found: error
          retention-days: 1
