name: internal secure multichain validation R42D

on:
  pull_request:
    branches:
      - internal/secure-r42c-base-20260802
    paths:
      - "secure-r42c-request/**"

permissions:
  contents: read

concurrency:
  group: internal-secure-r42d-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Generate one-time runner certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handshake-public
          umask 077
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes -days 1 \
            -subj '/CN=ephemeral-secure-multichain-runner' \
            -keyout /tmp/runner-private.pem \
            -out handshake-public/runner-certificate.pem \
            >/dev/null 2>&1
          openssl x509 -in handshake-public/runner-certificate.pem -noout -fingerprint -sha256 \
            > handshake-public/runner-certificate.sha256-fingerprint.txt
          printf '%s\n' "$GITHUB_RUN_ID" > handshake-public/run-id.txt
          chmod 600 /tmp/runner-private.pem
          chmod 644 handshake-public/*

      - name: Publish one-time certificate
        uses: actions/upload-artifact@v4
        with:
          name: secure-r42d-handshake-${{ github.run_id }}
          path: handshake-public/
          if-no-files-found: error
          retention-days: 1

      - name: Retrieve run-bound encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r42d-transport
          mkdir -p /tmp/r42d-transport
          found=0
          for attempt in $(seq 1 600); do
            rm -rf /tmp/r42d-transport/repo
            git clone --quiet --depth 1 --branch internal/secure-r42d-payload-20260802 \
              https://github.com/zerodaybugs/test.git /tmp/r42d-transport/repo 2>/dev/null || true
            payload_dir=/tmp/r42d-transport/repo/secure-r42d-payload
            if test -s "$payload_dir/payload.cms.sha256" \
               && test -s "$payload_dir/run-id.txt" \
               && test "$(tr -d '\r\n' < "$payload_dir/run-id.txt")" = "$GITHUB_RUN_ID"; then
              part_count=$(find "$payload_dir" -maxdepth 1 -type f -name 'payload.cms.hex.part-*' | wc -l)
              if test "$part_count" -eq 10; then
                python -c 'from pathlib import Path; import sys; root=Path(sys.argv[1]); parts=sorted(root.glob("payload.cms.hex.part-*")); assert len(parts)==10; text="".join(p.read_text(encoding="ascii").strip() for p in parts); assert len(text)%2==0; Path("/tmp/r42d-transport/payload.cms").write_bytes(bytes.fromhex(text))' "$payload_dir"
                cp "$payload_dir/payload.cms.sha256" /tmp/r42d-transport/
                cp "$payload_dir/run-id.txt" /tmp/r42d-transport/
                if (cd /tmp/r42d-transport && sha256sum --check --strict payload.cms.sha256); then
                  found=1
                  break
                fi
              fi
            fi
            sleep 4
          done
          test "$found" -eq 1
          test "$(tr -d '\r\n' < /tmp/r42d-transport/run-id.txt)" = "$GITHUB_RUN_ID"
          (cd /tmp/r42d-transport && sha256sum --check --strict payload.cms.sha256)

      - name: Decrypt, verify, and execute local-only proof
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -rf /tmp/r42d-work
          mkdir -p /tmp/r42d-work/lib encrypted-result
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/r42d-transport/payload.cms \
            -recip handshake-public/runner-certificate.pem \
            -inkey /tmp/runner-private.pem \
            -out /tmp/r42d-payload.tar.gz \
            >/dev/null 2>&1
          tar -xzf /tmp/r42d-payload.tar.gz -C /tmp/r42d-work
          (cd /tmp/r42d-work && sha256sum --check --strict INPUT_SHA256SUMS)
          git clone --quiet --depth 1 --branch v1.9.6 \
            https://github.com/foundry-rs/forge-std.git /tmp/r42d-work/lib/forge-std
          curl -fsSL --retry 4 --retry-all-errors \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.29+commit.ab55807c' \
            -o /tmp/r42d-work/solc
          echo '18d418a40dc04d17656b1b5c8a7b35cfbab8942b51f38d005d5b59e8aa6637e0  /tmp/r42d-work/solc' \
            | sha256sum --check --strict >/dev/null
          chmod 0755 /tmp/r42d-work/solc /tmp/r42d-work/RUN.sh
          set +e
          (cd /tmp/r42d-work && ./RUN.sh)
          run_status=$?
          set -e
          mkdir -p /tmp/r42d-work/evidence
          printf '%s\n' "$run_status" > /tmp/r42d-work/evidence/RUNNER_EXIT_STATUS.txt
          forge --version > /tmp/r42d-work/evidence/WORKFLOW_FORGE_VERSION.txt 2>&1
          /tmp/r42d-work/solc --version > /tmp/r42d-work/evidence/WORKFLOW_SOLC_VERSION.txt 2>&1
          (cd /tmp/r42d-work/evidence && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit "$run_status"

      - name: Encrypt evidence to researcher certificate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-result
          if [[ ! -d /tmp/r42d-work/evidence ]]; then
            mkdir -p /tmp/r42d-work/evidence
            printf 'proof-step-did-not-produce-evidence\n' > /tmp/r42d-work/evidence/TRANSPORT_ERROR.txt
            printf '99\n' > /tmp/r42d-work/evidence/RUNNER_EXIT_STATUS.txt
          fi
          test -s /tmp/r42d-work/researcher-certificate.pem
          tar -czf /tmp/r42d-evidence.tar.gz -C /tmp/r42d-work evidence
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in /tmp/r42d-evidence.tar.gz \
            -out encrypted-result/evidence.cms \
            /tmp/r42d-work/researcher-certificate.pem \
            >/dev/null 2>&1
          sha256sum encrypted-result/evidence.cms > encrypted-result/evidence.cms.sha256
          cp /tmp/r42d-work/evidence/RUNNER_EXIT_STATUS.txt encrypted-result/
          printf 'encrypted-evidence-complete\n' > encrypted-result/STATUS.txt
          shred -u /tmp/runner-private.pem /tmp/r42d-payload.tar.gz /tmp/r42d-evidence.tar.gz 2>/dev/null || true
          rm -rf /tmp/r42d-work /tmp/r42d-transport

      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-r42d-result-${{ github.run_id }}
          path: encrypted-result/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce proof result after encrypted upload
        if: always()
        shell: bash
        run: test "$(cat encrypted-result/RUNNER_EXIT_STATUS.txt 2>/dev/null || echo 99)" = 0
