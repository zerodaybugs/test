name: internal Veda exact source materialization

on:
  pull_request:
    branches:
      - internal/veda-source-base-20260803
    paths:
      - "internal-veda-source-request/**"

permissions:
  contents: read

concurrency:
  group: internal-veda-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize exact public source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output work
          mkdir -p output work
          git clone --quiet https://github.com/Veda-Labs/boring-vault.git work/boring-vault
          cd work/boring-vault
          git checkout --detach 77d6292bdfda606c9ffb7033db1332759b5568a3
          git submodule update --init --recursive --depth 1
          test "$(git rev-parse HEAD)" = "77d6292bdfda606c9ffb7033db1332759b5568a3"
          git rev-parse HEAD > ../../output/VEDA_COMMIT.txt
          git submodule status --recursive > ../../output/SUBMODULE_STATUS.txt
          find src script test audit deployments -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum > ../../output/SOURCE_SHA256SUMS.txt
          cd ..
          rm -rf boring-vault/.git
          find boring-vault -type d -name .git -prune -exec rm -rf {} +
          tar -czf ../output/veda-boring-vault-77d6292-source.tar.gz boring-vault
          cd ../output
          sha256sum veda-boring-vault-77d6292-source.tar.gz > ARCHIVE_SHA256.txt
          cat > PUBLIC_STATUS.json <<'JSON'
          {
            "repository": "Veda-Labs/boring-vault",
            "commit": "77d6292bdfda606c9ffb7033db1332759b5568a3",
            "source_only": true,
            "public_chain_transactions_signed": 0,
            "public_chain_transactions_broadcast": 0
          }
          JSON

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: veda-exact-source-77d6292
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
