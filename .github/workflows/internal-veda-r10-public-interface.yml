name: internal Veda R10 exact interface inventory

on:
  pull_request:
    branches:
      - internal/veda-r10-public-base-20260804
    paths:
      - "internal-veda-r10-public/**"

permissions:
  contents: read

concurrency:
  group: internal-veda-r10-public-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build exact public source and export interfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/veda-r10-public evidence
          mkdir -p /tmp/veda-r10-public evidence/method-identifiers evidence/abis evidence/storage-layouts
          git clone --quiet --recurse-submodules https://github.com/Veda-Labs/boring-vault.git /tmp/veda-r10-public/source
          cd /tmp/veda-r10-public/source
          git checkout --quiet 77d6292bdfda606c9ffb7033db1332759b5568a3
          git submodule update --init --recursive --quiet
          test "$(git rev-parse HEAD)" = "77d6292bdfda606c9ffb7033db1332759b5568a3"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/SOURCE_COMMIT.txt"
          git submodule status --recursive > "$GITHUB_WORKSPACE/evidence/SUBMODULE_STATUS.txt"
          forge --version > "$GITHUB_WORKSPACE/evidence/FOUNDRY_VERSION.txt"
          FOUNDRY_PROFILE=ci forge build > "$GITHUB_WORKSPACE/evidence/FORGE_BUILD.log" 2>&1

          contracts=(
            "BoringVault"
            "TellerWithMultiAssetSupport"
            "TellerWithYieldStreaming"
            "AccountantWithRateProviders"
            "AccountantWithYieldStreaming"
            "BoringOnChainQueue"
            "BoringSolver"
            "ManagerWithMerkleVerification"
            "LayerZeroTeller"
            "LayerZeroTellerWithRateLimiting"
            "AaveV3BufferHelper"
            "Pauser"
            "RolesAuthority"
          )
          for contract in "${contracts[@]}"; do
            forge inspect "$contract" methodIdentifiers --json > "$GITHUB_WORKSPACE/evidence/method-identifiers/${contract}.json"
            forge inspect "$contract" abi --json > "$GITHUB_WORKSPACE/evidence/abis/${contract}.json"
            forge inspect "$contract" storageLayout --json > "$GITHUB_WORKSPACE/evidence/storage-layouts/${contract}.json"
          done

          python3 - "$GITHUB_WORKSPACE/evidence" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          maps={p.stem:json.loads(p.read_text()) for p in sorted((out/'method-identifiers').glob('*.json'))}
          within=[]; global_map={}
          for contract, entries in maps.items():
              by={}
              for signature, selector in entries.items():
                  selector='0x'+selector.removeprefix('0x').lower()
                  by.setdefault(selector,[]).append(signature)
                  global_map.setdefault(selector,[]).append({'contract':contract,'signature':signature})
              for selector, signatures in by.items():
                  if len(signatures)>1:
                      within.append({'contract':contract,'selector':selector,'signatures':sorted(signatures)})
          cross=[{'selector':k,'entries':v} for k,v in sorted(global_map.items()) if len(v)>1]
          report={
            'source_commit':'77d6292bdfda606c9ffb7033db1332759b5568a3',
            'compiler_build_pass':True,
            'contract_count':len(maps),
            'method_count':sum(len(v) for v in maps.values()),
            'methods_by_contract':{k:len(v) for k,v in maps.items()},
            'within_contract_selector_collisions':within,
            'cross_contract_selector_reuse':cross,
            'within_contract_collision_count':len(within),
            'cross_contract_reuse_count':len(cross),
          }
          (out/'EXACT_INTERFACE_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          (out/'EXACT_INTERFACE_REPORT.md').write_text(
            '# Exact Veda interface inventory\n\n'
            f"- Source: `{report['source_commit']}`\n"
            f"- Contracts: {report['contract_count']}\n"
            f"- Methods: {report['method_count']}\n"
            f"- Within-contract selector collisions: {report['within_contract_collision_count']}\n"
            f"- Cross-contract selector reuse groups: {report['cross_contract_reuse_count']}\n"
          )
          PY
          cd "$GITHUB_WORKSPACE"
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload source-only interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-r10-exact-interface-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
