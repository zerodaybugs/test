name: IOTA CLI v1.27.0 bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/iota-cli-bootstrap-20260730.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download official release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/extracted output
          curl --fail --silent --show-error --location \
            'https://api.github.com/repos/iotaledger/iota/releases/tags/v1.27.0' \
            -o work/release.json
          asset_url=$(jq -r '
            .assets[]?
            | select(.name | test("linux-x86_64.*\\.tgz$"))
            | .browser_download_url
          ' work/release.json | head -n 1)
          if test -z "$asset_url" || test "$asset_url" = 'null'; then
            jq -r '.assets[]?.name' work/release.json
            exit 2
          fi
          printf '%s\n' "$asset_url" | tee output/asset-url.txt
          curl --fail --silent --show-error --location "$asset_url" \
            -o work/iota-v1.27.0-linux-x86_64.tgz
          tar -xzf work/iota-v1.27.0-linux-x86_64.tgz -C work/extracted
          iota_binary=$(find work/extracted -type f -name iota -perm -u+x | head -n 1)
          test -n "$iota_binary"
          cp "$iota_binary" output/iota
          chmod 0755 output/iota
          output/iota --version | tee output/iota-version.txt
          sha256sum work/iota-v1.27.0-linux-x86_64.tgz output/iota \
            | tee output/SHA256SUMS.txt
          jq '{tag_name, target_commitish, published_at, assets: [.assets[] | {name, size, digest, browser_download_url}]}' \
            work/release.json > output/release-metadata.json
          find output -type f -printf '%P\t%s bytes\n' | sort > output/FILE_INDEX.txt

      - name: Upload official CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: iota-cli-v1.27.0-linux-x86_64-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
