name: IOTA CLI v1.27.0 bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/iota-cli-bootstrap-20260730.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download official release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/raw artifact/bin
          curl --fail --silent --show-error --location \
            'https://api.github.com/repos/iotaledger/iota/releases/tags/v1.27.0' \
            -o artifact/raw/release.json
          asset_url=$(jq -r '
            .assets[]?
            | select(.name | test("linux-x86_64.*\\.tgz$"))
            | .browser_download_url
          ' artifact/raw/release.json | head -n 1)
          if test -z "$asset_url" || test "$asset_url" = 'null'; then
            jq -r '.assets[]?.name' artifact/raw/release.json
            exit 2
          fi
          printf '%s\n' "$asset_url" | tee artifact/raw/asset-url.txt
          curl --fail --silent --show-error --location "$asset_url" \
            -o artifact/raw/iota-v1.27.0-linux-x86_64.tgz
          tar -xzf artifact/raw/iota-v1.27.0-linux-x86_64.tgz -C artifact/bin
          iota_binary=$(find artifact/bin -type f -name iota -perm -u+x | head -n 1)
          test -n "$iota_binary"
          "$iota_binary" --version | tee artifact/raw/iota-version.txt
          sha256sum artifact/raw/iota-v1.27.0-linux-x86_64.tgz "$iota_binary" \
            | tee artifact/raw/SHA256SUMS.txt
          find artifact -type f -printf '%P\t%s bytes\n' | sort \
            > artifact/raw/FILE_INDEX.txt

      - name: Upload official CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: iota-cli-v1.27.0-linux-x86_64-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
