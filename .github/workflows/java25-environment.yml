name: Prepare Java 25 environment archive
on:
  push:
    paths:
      - '.github/workflows/java25-environment.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - shell: bash
        run: |
          set -euo pipefail
          java -version 2> JAVA_VERSION.txt
          tar -C "$JAVA_HOME" -czf java25-linux-x64.tar.gz .
          sha256sum java25-linux-x64.tar.gz > ARCHIVE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: java25-linux-x64
          path: |
            java25-linux-x64.tar.gz
            JAVA_VERSION.txt
            ARCHIVE_SHA256.txt
          retention-days: 1