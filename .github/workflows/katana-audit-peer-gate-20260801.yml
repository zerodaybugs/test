name: Temporary encrypted Katana audit and peer gate

on:
  pull_request:
    branches:
      - tmp/katana-audit-peer-gate-20260801
    paths:
      - '.katana-audit-peer-trigger/**'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ripgrep jq git

      - name: Verify exact cross-chain peers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          ETH_RPC=''
          for candidate in \
            'https://ethereum-rpc.publicnode.com' \
            'https://eth.llamarpc.com' \
            'https://cloudflare-eth.com'; do
            if out="$(cast chain-id --rpc-url "$candidate" 2>/dev/null)" && test "$out" = '1'; then
              ETH_RPC="$candidate"
              break
            fi
          done
          test -n "$ETH_RPC"

          KATANA_RPC=''
          for candidate in \
            'https://rpc.katana.network/' \
            'https://katana.gateway.tenderly.co/' \
            'https://rpc.katanarpc.com/'; do
            if out="$(cast chain-id --rpc-url "$candidate" 2>/dev/null)" && test "$out" = '747474'; then
              KATANA_RPC="$candidate"
              break
            fi
          done
          test -n "$KATANA_RPC"

          ETH_ADAPTERS=(
            'vbETH|0x8F45F7ACD4b9FC0B446902790F304d444dfF949b'
            'vbUSDC|0xb5bADA33542a05395d504a25885e02503A957Bb3'
            'vbUSDT|0x839dC0cFF5e263F56C9810560adF8Ea40E95Ab82'
            'vbUSDS|0x1E283d60537Dae87Bb63CFCae0Be574b50Ed0BBa'
            'vbWBTC|0x8d09c41229f07ad098ffb5fad239dd87d2c131d4'
          )
          KATANA_ADAPTERS=(
            'vbETH|0x694d1697F6909361775139357d99fb60b5caB683'
            'vbUSDC|0x807275727Dd3E640c5F2b5DE7d1eC72B4Dd293C0'
            'vbUSDT|0x4690f346337eD8737BeA462ac71Ff16Ef95B985E'
            'vbUSDS|0xB42ab636ac69f073970a94d1ACE13379E7621665'
            'vbWBTC|0x8169e532Bc781985e155037db1F96c267a520DFC'
          )

          {
            printf 'ethereum_rpc=%s\n' "$ETH_RPC"
            printf 'ethereum_block=%s\n' "$(cast block-number --rpc-url "$ETH_RPC")"
            printf 'katana_rpc=%s\n' "$KATANA_RPC"
            printf 'katana_block=%s\n' "$(cast block-number --rpc-url "$KATANA_RPC")"
            printf 'foundry=%s\n' "$(cast --version | head -n1)"
          } > evidence/ENV.txt

          printf 'side\tasset\tadapter\teid\tpeer\towner\tendpoint\tcounter\n' > evidence/PEERS.tsv
          for row in "${ETH_ADAPTERS[@]}"; do
            IFS='|' read -r asset adapter <<< "$row"
            peer="$(cast call "$adapter" 'peers(uint32)(bytes32)' 30375 --rpc-url "$ETH_RPC")"
            owner="$(cast call "$adapter" 'owner()(address)' --rpc-url "$ETH_RPC")"
            endpoint="$(cast call "$adapter" 'endpoint()(address)' --rpc-url "$ETH_RPC")"
            counter="$(cast call "$adapter" 'globalInitializationCounter()(uint64)' --rpc-url "$ETH_RPC")"
            printf 'ethereum\t%s\t%s\t30375\t%s\t%s\t%s\t%s\n' "$asset" "$adapter" "$peer" "$owner" "$endpoint" "$counter" >> evidence/PEERS.tsv
          done
          for row in "${KATANA_ADAPTERS[@]}"; do
            IFS='|' read -r asset adapter <<< "$row"
            peer="$(cast call "$adapter" 'peers(uint32)(bytes32)' 30101 --rpc-url "$KATANA_RPC")"
            owner="$(cast call "$adapter" 'owner()(address)' --rpc-url "$KATANA_RPC")"
            endpoint="$(cast call "$adapter" 'endpoint()(address)' --rpc-url "$KATANA_RPC")"
            counter="$(cast call "$adapter" 'globalInitializationCounter()(uint64)' --rpc-url "$KATANA_RPC")"
            printf 'katana\t%s\t%s\t30101\t%s\t%s\t%s\t%s\n' "$asset" "$adapter" "$peer" "$owner" "$endpoint" "$counter" >> evidence/PEERS.tsv
          done

      - name: Extract public audits and source delta
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vault-bridge"
          git clone --filter=blob:none https://github.com/agglayer/vault-bridge.git "$ROOT"
          git -C "$ROOT" checkout c2ece8a5a4618ba3b06412b58e2a063fb014aadb
          git -C "$ROOT" fetch origin archive/v0.5.1:refs/remotes/origin/archive/v0.5.1
          git -C "$ROOT" rev-parse HEAD > evidence/VAULT_BRIDGE_MAIN_COMMIT.txt
          git -C "$ROOT" rev-parse refs/remotes/origin/archive/v0.5.1 > evidence/VAULT_BRIDGE_051_COMMIT.txt

          for pdf in \
            audit/v0.5.0_Certora.pdf \
            audit/v0.5.0_Certora_Formal_Verification.pdf \
            audit/v1.0.0_Certora.pdf \
            audit/v1.1.0_Certora.pdf; do
            name="$(basename "$pdf" .pdf)"
            pdfinfo "$ROOT/$pdf" > "evidence/${name}.pdfinfo.txt"
            pdftotext -layout "$ROOT/$pdf" "evidence/${name}.txt"
            rg -n -i \
              'critical|high|medium|low|informational|acknowledged|resolved|unresolved|migration|address zero|layerzero|oft|native converter|custom token|reinitial|backing|insolven|freeze|mint|burn|claim' \
              "evidence/${name}.txt" > "evidence/${name}.relevant.txt" || true
          done

          git -C "$ROOT" log --oneline --decorate refs/remotes/origin/archive/v0.5.1..HEAD \
            -- src/secondary-chain src/primary-chain src/etc \
            > evidence/POST_051_SECURITY_HISTORY.txt

          for commit in \
            78f8929ef068eee0e0764d13c6644f4c180ab6f9 \
            158e45ecd319ef4aaf76358ad157d521c6d5d71f \
            4a50cdcacf9aa5beae9d19c074bf6ed69d015000 \
            96111d801e512e73b51cc0fc8bbfa6141ee3b43e \
            965aeadba4e0775752e1b47c6534c19822b2c031 \
            482757990b7664ea381235b3f043c8bb0e0ca0d1; do
            git -C "$ROOT" show --stat --format=fuller "$commit" > "evidence/COMMIT_${commit}.txt"
            git -C "$ROOT" show --format=fuller "$commit" >> "evidence/COMMIT_${commit}.txt"
          done

          git -C "$ROOT" diff --find-renames refs/remotes/origin/archive/v0.5.1..HEAD -- \
            src/NativeConverter.sol src/CustomToken.sol src/VaultBridgeToken.sol src/VaultBridgeTokenPart2.sol \
            src/secondary-chain/NativeConverter.sol src/secondary-chain/CustomToken.sol \
            src/secondary-chain/layerzero/NonDefaultMintBurnOftAdapter.sol \
            src/primary-chain/VaultBridgeToken.sol src/primary-chain/VaultBridgeTokenPart2.sol \
            src/primary-chain/MigrationManager.sol src/etc/InitializationCounterUpgradeable.sol \
            > evidence/DEPLOYED_051_TO_CURRENT_DIFF.patch || true

          sha256sum "$ROOT"/audit/*.pdf > evidence/AUDIT_PDF_SHA256SUMS.txt

      - name: Encrypt evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA0uDLu1CuAyIIjOnSblOQ
          bZFD2J2mN3/jk1RW7fwgjBQoBimnQXOdcjx1V3girebJgFQ14ND8+cgsCpm4Bnif
          nickD+AnZv+W05gtghG78NuifMMq4I+KZ5FDqJxYwrTrQq3s/sCg5YXlKFrMgH2k
          +CBZPG6OM6FuwDL5kECBUawyQrvtzqqbvHBn23wb8uUxVSSjlcM2YF7OXkbopH1P
          bqpq3wBFr401hYNbutSc2/DtU77rcrsLjGEBzfni2Mndf2moB7UCgPRDFeIpX1vA
          BSxsQtA9RvN+ACmxgIjZQb7cdFJ9ylpWARSDWD2Rbhy4kYMeRj3MP1EFczA/VlA2
          te7fSv1GM91WROdPHcKE04T4tnZZTW4ebQXKcn87hL4A2sfrxrv/5hP96KRlSUYQ
          MhaqeW2dHRIkptF4cgD1G7ZwU7Yv7M292KvBPQnhdZkMild607jQqV6PILaiWbuv
          pSyEoVkzvjpLR3bemuiU1MdoG6UTe1IiTbGU3BDPAUn9AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          find evidence -type f -printf '%P\t%s bytes\n' | sort > evidence/ARTIFACT_INDEX.txt
          (cd evidence && find . -type f ! -name PLAINTEXT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > PLAINTEXT_SHA256SUMS.txt)
          tar -C evidence -czf /tmp/plain.tar.gz .
          openssl rand -hex 32 > /tmp/key.hex
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/plain.tar.gz -out evidence/audit-peer.tar.gz.enc -pass file:/tmp/key.hex
          openssl pkeyutl -encrypt -pubin -inkey /tmp/public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/key.hex -out evidence/key.enc
          find evidence -type f ! -name 'audit-peer.tar.gz.enc' ! -name 'key.enc' -delete
          sha256sum evidence/audit-peer.tar.gz.enc evidence/key.enc > evidence/SHA256SUMS.txt
          rm -f /tmp/plain.tar.gz /tmp/key.hex /tmp/public.pem

      - name: Upload encrypted evidence
        uses: actions/upload-artifact@v4
        with:
          name: katana-audit-peer-gate-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
