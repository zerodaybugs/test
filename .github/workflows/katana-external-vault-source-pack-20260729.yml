name: Katana external vault pinned source pack

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-external-vault-source-pack-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: morpho-org/metamorpho-v1.1
          ref: bcc003108c0fbb9f715566207c52a1d3f279c5c3
          path: metamorpho
          persist-credentials: false
          fetch-depth: 1
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: yearn/tokenized-strategy
          ref: 90514f120fc3f500a2c8796da45a267dff5b8dce
          path: yearn-tokenized-strategy
          persist-credentials: false
          fetch-depth: 1
          submodules: recursive

      - name: Package reviewed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/metamorpho evidence/yearn
          cp -a metamorpho/src metamorpho/lib metamorpho/test metamorpho/README.md metamorpho/foundry.toml evidence/metamorpho/ 2>/dev/null || true
          cp -a yearn-tokenized-strategy/src yearn-tokenized-strategy/flattened yearn-tokenized-strategy/test yearn-tokenized-strategy/README.md yearn-tokenized-strategy/foundry.toml evidence/yearn/ 2>/dev/null || true
          printf '%s\n' 'MetaMorpho bcc003108c0fbb9f715566207c52a1d3f279c5c3' 'Yearn 90514f120fc3f500a2c8796da45a267dff5b8dce' > evidence/PINS.txt
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SOURCE_SHA256SUMS
          find evidence -type f -printf '%p\t%s bytes\n' | sort > evidence/INDEX.txt
          (cd evidence && sha256sum PINS.txt SOURCE_SHA256SUMS INDEX.txt > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: katana-external-vault-source-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
