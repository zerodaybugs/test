name: Katana global backing quick profile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-global-backing-quick-20260729.yml'
      - 'katana-global-backing-quick/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read direct latest-state accounting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/quick.py <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          ENDPOINTS=['https://rpc.katana.network/','https://rpc.katanarpc.com/','https://katana.gateway.tenderly.co/']
          ITEMS=[
            ('vbETH','0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62','0xa6b0db1293144ebe9478b6a84f75dd651e45914a','0x815955d051C6262c16A720b19D735426254bEC5B','0x694d1697F6909361775139357d99fb60b5caB683'),
            ('vbUSDC','0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36','0x97a3500083348a147f419b8a65717909762c389f','0xfd415d011ffaa8e6f17fa753cdb080d1de266784','0x807275727Dd3E640c5F2b5DE7d1eC72B4Dd293C0'),
            ('vbUSDT','0x2DCa96907fde857dd3D816880A0df407eeB2D2F2','0x053fa9b934b83E1E0ffc7e98a41aAdc3640bB462','0xf44e3bcb7a2461cc08185e127b324f2486a74e20','0x4690f346337eD8737BeA462ac71Ff16Ef95B985E'),
            ('vbUSDS','0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3','0x639f13D5f30B47c792b6851238c05D0b623C77DE','0x2134866886ce784fe2e0de819118e4d32b4be32c','0xB42ab636ac69f073970a94d1ACE13379E7621665'),
            ('vbWBTC','0x0913DA6Da4b42f538B445599b46Bb4622342Cf52','0xb00aa68b87256E2F22058fB2Ba3246EEc54A44fc','0xb33e43a3f276e8e75792b941bccc996ecb2c0bbd','0x8169e532Bc781985e155037db1F96c267a520DFC'),
          ]
          IMPL='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          ADMIN='0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103'
          rid=0
          def rq(url,m,p,t=30):
            global rid; rid+=1
            q=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':rid,'method':m,'params':p}).encode(),headers={'content-type':'application/json','user-agent':'katana-quick-profile/1.0'})
            with urllib.request.urlopen(q,timeout=t) as r: d=json.loads(r.read())
            if 'error' in d: raise RuntimeError(d['error'])
            return d['result']
          errors={}; RPC=None
          for e in ENDPOINTS:
            try:
              if int(rq(e,'eth_chainId',[]),16)!=747474: raise RuntimeError('wrong chain')
              rq(e,'eth_blockNumber',[]); RPC=e; break
            except Exception as x: errors[e]=repr(x)
          if not RPC: raise SystemExit(json.dumps(errors))
          def rpc(m,p,t=30): return rq(RPC,m,p,t)
          def sha3(s): return rpc('web3_sha3',['0x'+s.encode().hex()])
          def sel(s): return sha3(s)[:10]
          def pa(a): return a.lower().replace('0x','').rjust(64,'0')
          def call(a,s,args=''):
            return rpc('eth_call',[{'to':a,'data':sel(s)+args},'latest'])
          def u(a,s,args=''):
            r=call(a,s,args); return int(r,16) if r and r!='0x' else None
          def ad(a,s,args=''):
            r=call(a,s,args); return ('0x'+r[-40:]).lower() if r and r!='0x' and len(r)>=42 else None
          def bo(a,s,args=''):
            v=u(a,s,args); return bool(v) if v is not None else None
          def safe(f):
            try:return f()
            except Exception as e:return {'error':repr(e)}
          def slot(a,s):
            r=rpc('eth_getStorageAt',[a,s,'latest']); return ('0x'+r[-40:]).lower() if int(r,16) else None
          def code(a):
            r=rpc('eth_getCode',[a,'latest']); b=bytes.fromhex(r[2:]) if r and r!='0x' else b''
            return {'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest() if b else None,'impl':slot(a,IMPL),'admin':slot(a,ADMIN)}

          block=int(rpc('eth_blockNumber',[]),16); hdr=rpc('eth_getBlockByNumber',[hex(block),False])
          minter=sha3('MINTER_BURNER_ROLE'); pauser=sha3('PAUSER_ROLE'); migrator=sha3('MIGRATOR_ROLE')
          rows=[]
          for name,ct,nc,under,oa in ITEMS:
            row={'name':name,'custom':ct.lower(),'converter':nc.lower(),'underlying':under.lower(),'oft_adapter':oa.lower()}
            row['custom_code']=code(ct); row['converter_code']=code(nc); row['adapter_code']=code(oa)
            row['custom_total_supply']=safe(lambda a=ct:u(a,'totalSupply()'))
            row['custom_decimals']=safe(lambda a=ct:u(a,'decimals()'))
            row['custom_bridge']=safe(lambda a=ct:ad(a,'bridge()'))
            row['custom_native_converter']=safe(lambda a=ct:ad(a,'nativeConverter()'))
            row['custom_additional_net']=safe(lambda a=ct:u(a,'totalNetMintedByAdditionalMintersBurners()'))
            row['adapter_has_minter_role']=safe(lambda a=ct,o=oa:bo(a,'hasRole(bytes32,address)',minter[2:]+pa(o)))
            row['adapter_has_pauser_role']=safe(lambda a=ct,o=oa:bo(a,'hasRole(bytes32,address)',pauser[2:]+pa(o)))
            row['converter_has_migrator_role_adapter']=safe(lambda a=nc,o=oa:bo(a,'hasRole(bytes32,address)',migrator[2:]+pa(o)))
            row['converter_backing']=safe(lambda a=nc:u(a,'backingOnLayerY()'))
            if isinstance(row['converter_backing'],dict): row['converter_backing']=safe(lambda a=nc:u(a,'backingOnSecondaryChain()'))
            row['converter_migratable']=safe(lambda a=nc:u(a,'migratableBacking()'))
            row['converter_custom']=safe(lambda a=nc:ad(a,'customToken()'))
            row['converter_underlying']=safe(lambda a=nc:ad(a,'underlyingToken()'))
            row['physical_underlying']=safe(lambda a=under,c=nc:u(a,'balanceOf(address)',pa(c)))
            row['adapter_token']=safe(lambda a=oa:ad(a,'token()'))
            row['adapter_owner']=safe(lambda a=oa:ad(a,'owner()'))
            row['adapter_endpoint']=safe(lambda a=oa:ad(a,'endpoint()'))
            row['adapter_approval_required']=safe(lambda a=oa:bo(a,'approvalRequired()'))
            row['adapter_secondary_balance']=safe(lambda a=oa:u(a,'secondaryChainBalance()'))
            row['adapter_token_balance']=safe(lambda a=ct,o=oa:u(a,'balanceOf(address)',pa(o)))
            row['adapter_initialization_counter']=safe(lambda a=oa:u(a,'globalInitializationCounter()'))
            row['adapter_delegate']=safe(lambda a=oa:ad(a,'delegate()'))
            net=row['custom_additional_net']; sec=row['adapter_secondary_balance']
            row['net_equals_secondary']=isinstance(net,int) and isinstance(sec,int) and net==sec
            rows.append(row)
          result={'rpc':RPC,'endpoint_errors':errors,'block':block,'block_hash':hdr['hash'],'timestamp':int(hdr['timestamp'],16),'roles':{'minter':minter,'pauser':pauser,'migrator':migrator},'rows':rows}
          Path('evidence/QUICK_PROFILE.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          lines=['# Katana global backing quick profile','',f'- RPC: `{RPC}`',f'- block: `{block}`',f'- timestamp: `{result["timestamp"]}`','', '| token | total supply | converter backing | physical underlying | additional net | OA secondary balance | equal | OA minter role | custom impl | OA impl |','|---|---:|---:|---:|---:|---:|:---:|:---:|---|---|']
          for r in rows:
            lines.append(f"| {r['name']} | {r['custom_total_supply']} | {r['converter_backing']} | {r['physical_underlying']} | {r['custom_additional_net']} | {r['adapter_secondary_balance']} | {r['net_equals_secondary']} | {r['adapter_has_minter_role']} | {r['custom_code']['impl']} | {r['adapter_code']['impl']} |")
          lines+=['','## Adapter details','']
          for r in rows:
            lines.append(f"- **{r['name']}** OA `{r['oft_adapter']}`: token=`{r['adapter_token']}`, owner=`{r['adapter_owner']}`, endpoint=`{r['adapter_endpoint']}`, approvalRequired=`{r['adapter_approval_required']}`, initCounter=`{r['adapter_initialization_counter']}`, tokenBalance=`{r['adapter_token_balance']}`")
          Path('evidence/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/quick.py
          (cd evidence && sha256sum QUICK_PROFILE.json SUMMARY.md > SHA256SUMS)
          cat evidence/SUMMARY.md

      - uses: actions/upload-artifact@v4
        with:
          name: katana-global-backing-quick-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
