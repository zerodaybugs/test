name: Internal Katana KAT and governance critical gate v9

on:
  pull_request:
    branches: [main]
    paths:
      - '.katana-kat-v9/**'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      KAT_COMMIT: 548949891934a5d7a8d0b5fe5f75e3e983019413
      GOVERNANCE_COMMIT: 2fe29c49bfbd6c7c116ddf56a1228de450a62728
      KAT: '0x7f1f4b4b29f5058fa32cc7a97141b8d7e5abdc2d'
      VKAT_NFT: '0x106F7D67Ea25Cb9eFf5064CF604ebf6259Ff296d'
      VOTING_ESCROW: '0x4d6fC15Ca6258b168225D283262743C623c13Ead'
      AVKAT_VAULT: '0x7231dbaCdFc968E07656D12389AB20De82FbfCeB'
      GAUGE_VOTER: '0x5e755A3C5dc81A79DE7a7cEF192FFA60964c9352'
      COMPOUND_STRATEGY: '0x60233D1c150F9C08D886906d597aA79a205b0463'
      SWAPPER: '0x92D2e00b6D2BB50B87a9BE971a82B1F00ac44768'
      MERKL_DISTRIBUTOR: '0x3Ef3D8bA38EBe18DB133cEc108f4D14CE00Dd9Ae'
      VKAT_METADATA: '0xb2143cFC740356E5FeFB4488e01026cfBb0A328F'
      USDC: '0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36'
      ATTACKER: '0x1111111111111111111111111111111111111111'

    steps:
      - name: Checkout private trigger
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install deterministic tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq poppler-utils ripgrep tree python3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select Katana RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/live evidence/kat-token evidence/governance
          RPC=''
          for candidate in \
            'https://rpc.katana.network/' \
            'https://katana.gateway.tenderly.co/' \
            'https://rpc.katanarpc.com/'; do
            if chain_id="$(cast chain-id --rpc-url "$candidate" 2>/dev/null)" && test "$chain_id" = '747474'; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"
          printf 'KATANA_RPC=%s\n' "$RPC" >> "$GITHUB_ENV"
          printf '%s\n' "$RPC" > evidence/live/SELECTED_RPC.txt
          cast block-number --rpc-url "$RPC" > evidence/live/BLOCK_NUMBER.txt
          cast block latest --json --rpc-url "$RPC" > evidence/live/LATEST_BLOCK.json
          cast --version > evidence/live/FOUNDRY_VERSION.txt

      - name: Read exact live KAT state and simulate unauthorized calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from typing import Any

          rpc = os.environ['KATANA_RPC']
          kat = os.environ['KAT']
          attacker = os.environ['ATTACKER']

          def run(args: list[str]) -> str:
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout.strip()

          def call(to: str, signature: str, *args: str, sender: str | None = None) -> dict[str, Any]:
              cmd = ['cast', 'call', to, signature, *map(str, args), '--rpc-url', rpc]
              if sender:
                  cmd += ['--from', sender]
              try:
                  return {'status': 'SUCCESS', 'output': run(cmd)}
              except subprocess.CalledProcessError as exc:
                  return {
                      'status': 'REVERT',
                      'output': (exc.stderr or exc.stdout or str(exc)).strip(),
                  }

          def first(result: dict[str, Any]) -> str | None:
              if result['status'] != 'SUCCESS':
                  return None
              return result['output'].splitlines()[0].strip()

          def int_value(result: dict[str, Any]) -> int | None:
              value = first(result)
              if value is None:
                  return None
              return int(value.split()[0], 0)

          def addr_value(result: dict[str, Any]) -> str | None:
              value = first(result)
              return value.lower() if value else None

          def code_info(address: str | None) -> dict[str, Any] | None:
              if not address or int(address, 16) == 0:
                  return None
              code = run(['cast', 'code', address, '--rpc-url', rpc])
              return {
                  'bytes': (len(code) - 2) // 2,
                  'keccak': run(['cast', 'keccak', code]).lower(),
                  'safe_owners': call(address, 'getOwners()(address[])'),
                  'safe_threshold': call(address, 'getThreshold()(uint256)'),
                  'owner': call(address, 'owner()(address)'),
              }

          role_names = [
              'INFLATION_ADMIN',
              'INFLATION_BENEFICIARY',
              'UNLOCKER',
              'LOCK_EXEMPTION_ADMIN',
          ]
          roles = {
              name: run(['cast', 'keccak', name]).lower()
              for name in role_names
          }

          state_calls = {
              'name': call(kat, 'name()(string)'),
              'symbol': call(kat, 'symbol()(string)'),
              'decimals': call(kat, 'decimals()(uint8)'),
              'total_supply': call(kat, 'totalSupply()(uint256)'),
              'distributed_supply_cap': call(kat, 'distributedSupplyCap()(uint256)'),
              'last_mint_capacity_increase': call(kat, 'lastMintCapacityIncrease()(uint256)'),
              'inflation_factor': call(kat, 'inflationFactor()(uint256)'),
              'max_inflation': call(kat, 'MAX_INFLATION()(uint256)'),
              'cap': call(kat, 'cap()(uint256)'),
              'unlock_time': call(kat, 'unlockTime()(uint256)'),
              'locked': call(kat, 'locked()(bool)'),
              'is_unlocked': call(kat, 'isUnlocked()(bool)'),
              'domain_separator': call(kat, 'DOMAIN_SEPARATOR()(bytes32)'),
          }

          role_state: dict[str, Any] = {}
          for name, role in roles.items():
              holder_result = call(kat, 'roleHolder(bytes32)(address)', role)
              pending_result = call(kat, 'pendingRoleHolder(bytes32)(address)', role)
              holder = addr_value(holder_result)
              pending = addr_value(pending_result)
              role_state[name] = {
                  'role': role,
                  'holder_call': holder_result,
                  'pending_call': pending_result,
                  'holder': holder,
                  'pending': pending,
                  'holder_mint_capacity': (
                      call(kat, 'mintCapacity(address)(uint256)', holder)
                      if holder else None
                  ),
                  'pending_mint_capacity': (
                      call(kat, 'mintCapacity(address)(uint256)', pending)
                      if pending else None
                  ),
                  'holder_code': code_info(holder),
                  'pending_code': code_info(pending),
              }

          probes = []
          def probe(label: str, signature: str, *args: str) -> None:
              probes.append({
                  'label': label,
                  'signature': signature,
                  'args': list(args),
                  'result': call(kat, signature, *args, sender=attacker),
              })

          probe('unauthorized_mint', 'mint(address,uint256)', attacker, '1')
          probe('unauthorized_change_inflation', 'changeInflation(uint256)', '1')
          probe('unauthorized_unlock', 'unlockAndRenounceUnlocker()')
          probe('unauthorized_lock_exemption', 'setLockExemption(address,bool)', attacker, 'true')
          probe('unauthorized_renounce_inflation_admin', 'renounceInflationAdmin()')
          probe('unauthorized_renounce_inflation_beneficiary', 'renounceInflationBeneficiary()')
          probe('unauthorized_renounce_lock_admin', 'renounceLockExemptionAdmin()')
          probe('no_capacity_distribution', 'distributeMintCapacity(address,uint256)', attacker, '1')
          probe('public_distribute_inflation', 'distributeInflation()')
          for name, role in roles.items():
              probe(f'unauthorized_change_role_{name}', 'changeRoleHolder(address,bytes32)', attacker, role)
              probe(f'unauthorized_accept_role_{name}', 'acceptRole(bytes32)', role)

          total_supply = int_value(state_calls['total_supply'])
          distributed_cap = int_value(state_calls['distributed_supply_cap'])
          live_cap = int_value(state_calls['cap'])
          inflation_factor = int_value(state_calls['inflation_factor'])
          last_increase = int_value(state_calls['last_mint_capacity_increase'])
          unlock_time = int_value(state_calls['unlock_time'])
          latest = json.loads(Path('evidence/live/LATEST_BLOCK.json').read_text())
          timestamp_raw = latest.get('timestamp', 0)
          latest_timestamp = int(timestamp_raw, 16) if isinstance(timestamp_raw, str) else int(timestamp_raw)

          report = {
              'rpc': rpc,
              'kat': kat.lower(),
              'attacker': attacker.lower(),
              'roles': roles,
              'state_calls': state_calls,
              'role_state': role_state,
              'attacker_mint_capacity': call(kat, 'mintCapacity(address)(uint256)', attacker),
              'probes': probes,
              'derived': {
                  'total_supply': total_supply,
                  'distributed_supply_cap': distributed_cap,
                  'live_cap': live_cap,
                  'unrealized_inflation': (
                      None if live_cap is None or distributed_cap is None
                      else live_cap - distributed_cap
                  ),
                  'unminted_capacity_plus_unrealized': (
                      None if live_cap is None or total_supply is None
                      else live_cap - total_supply
                  ),
                  'inflation_factor': inflation_factor,
                  'last_mint_capacity_increase': last_increase,
                  'latest_timestamp': latest_timestamp,
                  'seconds_since_last_settlement': (
                      None if last_increase is None else latest_timestamp - last_increase
                  ),
                  'unlock_time': unlock_time,
                  'seconds_until_time_unlock': (
                      None if unlock_time is None else unlock_time - latest_timestamp
                  ),
                  'unauthorized_successes': [
                      probe['label'] for probe in probes
                      if probe['result']['status'] == 'SUCCESS'
                      and probe['label'] != 'public_distribute_inflation'
                  ],
                  'public_distribution_callable': any(
                      probe['label'] == 'public_distribute_inflation'
                      and probe['result']['status'] == 'SUCCESS'
                      for probe in probes
                  ),
              },
          }

          Path('evidence/kat-token/LIVE_KAT_STATE.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          Path('evidence/kat-token/LIVE_INFLATION_FACTOR.txt').write_text(
              str(inflation_factor or 0) + '\n'
          )
          rows = ['role\trole_hash\tholder\tpending\tholder_capacity']
          for name, item in role_state.items():
              capacity = item['holder_mint_capacity']
              rows.append('\t'.join(map(str, [
                  name,
                  item['role'],
                  item['holder'],
                  item['pending'],
                  int_value(capacity) if capacity else None,
              ])))
          Path('evidence/kat-token/LIVE_KAT_ROLES.tsv').write_text('\n'.join(rows) + '\n')
          PY

      - name: Build exact KAT source and stress-test public settlement cadence
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/kat-token"
          git clone --filter=blob:none https://github.com/katana-network/kat-token.git "$WORK"
          git -C "$WORK" checkout "$KAT_COMMIT"
          git -C "$WORK" rev-parse HEAD > evidence/kat-token/PINNED_COMMIT.txt
          git -C "$WORK" status --short > evidence/kat-token/SOURCE_STATUS.txt

          cd "$WORK"
          if ! forge build --force > "$GITHUB_WORKSPACE/evidence/kat-token/FORGE_BUILD_FIRST.log" 2>&1; then
            forge soldeer install > "$GITHUB_WORKSPACE/evidence/kat-token/SOLDEER_INSTALL.log" 2>&1
            forge build --force > "$GITHUB_WORKSPACE/evidence/kat-token/FORGE_BUILD.log" 2>&1
          else
            cp "$GITHUB_WORKSPACE/evidence/kat-token/FORGE_BUILD_FIRST.log" \
              "$GITHUB_WORKSPACE/evidence/kat-token/FORGE_BUILD.log"
          fi

          cat > test/KatCadenceResearch.t.sol <<'SOL'
          // SPDX-License-Identifier: UNLICENSED
          pragma solidity 0.8.28;

          import {Test, console2} from "dependencies/forge-std-1.9.4/src/Test.sol";
          import {KatToken} from "../src/KatToken.sol";

          contract KatCadenceResearch is Test {
              address internal constant ATTACKER = address(0xBEEF);
              uint256 internal constant TWO_PERCENT_FACTOR = 0.028569152196770894e18;

              function _deploy(uint256 start) internal returns (KatToken token) {
                  vm.warp(start);
                  token = new KatToken(
                      "Katana Network Token",
                      "KAT",
                      address(this),
                      address(this),
                      address(this),
                      start + 719 days,
                      address(this),
                      address(this)
                  );
              }

              function _settle(
                  uint256 factor,
                  uint256 step,
                  uint256 count,
                  uint256 start
              ) internal returns (uint256 capAfter, uint256 beneficiaryCapacity) {
                  KatToken token = _deploy(start);
                  token.changeInflation(factor);
                  for (uint256 i; i < count; ++i) {
                      vm.warp(block.timestamp + step);
                      vm.prank(ATTACKER);
                      token.distributeInflation();
                  }
                  capAfter = token.distributedSupplyCap();
                  beneficiaryCapacity = token.mintCapacity(address(this));
              }

              function _absDiff(uint256 a, uint256 b) internal pure returns (uint256) {
                  return a >= b ? a - b : b - a;
              }

              function _runFactor(uint256 factor, uint256 start) internal {
                  (uint256 oneShot,) = _settle(factor, 365 days, 1, start);
                  (uint256 monthly,) = _settle(factor, 365 days / 12, 12, start + 370 days);
                  (uint256 daily,) = _settle(factor, 1 days, 365, start + 740 days);
                  (uint256 hourly,) = _settle(factor, 1 hours, 8_760, start + 1_110 days);

                  console2.log("factor", factor);
                  console2.log("one_shot", oneShot);
                  console2.log("monthly", monthly);
                  console2.log("daily", daily);
                  console2.log("hourly", hourly);
                  console2.log("one_monthly_abs", _absDiff(oneShot, monthly));
                  console2.log("one_daily_abs", _absDiff(oneShot, daily));
                  console2.log("one_hourly_abs", _absDiff(oneShot, hourly));
              }

              function testPublicSettlementCadence() external {
                  uint256 liveFactor = vm.envUint("LIVE_FACTOR");
                  _runFactor(liveFactor, 1_000_000);
                  _runFactor(TWO_PERCENT_FACTOR, 2_000_000_000);

                  KatToken probe = _deploy(4_000_000_000);
                  uint256 maxFactor = probe.MAX_INFLATION();
                  _runFactor(maxFactor, 5_000_000_000);
              }

              function testUnauthorizedMutationsRevertButDistributionIsPublic() external {
                  KatToken token = _deploy(9_000_000_000);

                  vm.startPrank(ATTACKER);
                  vm.expectRevert();
                  token.mint(ATTACKER, 1);
                  vm.expectRevert();
                  token.changeInflation(1);
                  vm.expectRevert();
                  token.unlockAndRenounceUnlocker();
                  vm.expectRevert();
                  token.setLockExemption(ATTACKER, true);
                  vm.stopPrank();

                  token.changeInflation(TWO_PERCENT_FACTOR);
                  vm.warp(block.timestamp + 1 days);
                  vm.prank(ATTACKER);
                  token.distributeInflation();
                  assertGt(token.mintCapacity(address(this)), 0);
              }
          }
          SOL

          LIVE_FACTOR="$(cat "$GITHUB_WORKSPACE/evidence/kat-token/LIVE_INFLATION_FACTOR.txt")" \
            forge test --match-contract KatCadenceResearch -vv \
            > "$GITHUB_WORKSPACE/evidence/kat-token/CADENCE_TEST.log" 2>&1

          python3 - "$GITHUB_WORKSPACE/evidence/kat-token/CADENCE_TEST.log" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors='replace')
          records = []
          current = None
          for line in text.splitlines():
              match = re.search(r'factor\s+(\d+)', line)
              if match:
                  current = {'factor': int(match.group(1))}
                  records.append(current)
                  continue
              if current is None:
                  continue
              for key in [
                  'one_shot', 'monthly', 'daily', 'hourly',
                  'one_monthly_abs', 'one_daily_abs', 'one_hourly_abs',
              ]:
                  match = re.search(rf'{key}\s+(\d+)', line)
                  if match:
                      current[key] = int(match.group(1))
          report = {
              'records': records,
              'one_second_integer_floor_upper_bound_wei_per_year': 31_536_000,
              'one_second_integer_floor_upper_bound_KAT_per_year': 31_536_000 / 1e18,
              'note': (
                  'The upper bound covers less-than-one-smallest-unit flooring per public settlement. '
                  'The exact source PowUtil approximation is separately exercised at monthly, daily, and hourly cadence.'
              ),
          }
          Path('evidence/kat-token/CADENCE_RESULTS.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Pin, build, and extract the public governance audit
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/katana-governance"
          git clone --filter=blob:none https://github.com/aragon/katana-governance.git "$WORK"
          git -C "$WORK" checkout "$GOVERNANCE_COMMIT"
          git -C "$WORK" submodule update --init --recursive
          git -C "$WORK" rev-parse HEAD > evidence/governance/PINNED_COMMIT.txt
          git -C "$WORK" submodule status --recursive > evidence/governance/SUBMODULE_STATUS.txt
          git -C "$WORK" status --short > evidence/governance/SOURCE_STATUS.txt
          (cd "$WORK" && forge build --force) > evidence/governance/FORGE_BUILD.log 2>&1

          pdfinfo "$WORK/audits/audit-report.pdf" > evidence/governance/AUDIT_PDF_INFO.txt
          pdftotext -layout "$WORK/audits/audit-report.pdf" evidence/governance/AUDIT_REPORT.txt
          grep -niE \
            'critical|high|medium|low|informational|acknowledged|resolved|swapper|metadata|reward|claim|vault|strategy|operator|recipient|native|ether|reentran|initializ|delegate' \
            evidence/governance/AUDIT_REPORT.txt \
            > evidence/governance/AUDIT_RELEVANT_LINES.txt || true

          {
            printf '%s\n' '=== public/external functions ==='
            rg -n --glob '*.sol' 'function .*\b(public|external)\b' "$WORK/src" || true
            printf '%s\n' '=== calls, approvals, operator and recipient controls ==='
            rg -n --glob '*.sol' \
              'delegatecall|\.call\{|safeTransfer|transferFrom|approve\(|toggleOperator|setClaimRecipient|initializer|reinitializer|tx\.origin|selfdestruct' \
              "$WORK/src" || true
            printf '%s\n' '=== TODO/FIXME/security markers ==='
            rg -n --glob '*.sol' 'TODO|FIXME|audit|danger|unsafe|IMPORTANT' "$WORK/src" || true
          } > evidence/governance/STATIC_SINK_SCAN.txt

          git -C "$WORK" log --all --oneline --decorate -n 150 \
            > evidence/governance/RECENT_HISTORY.txt
          git -C "$WORK" log --all --oneline \
            --grep='audit\|fix\|security\|vulnerab\|recipient\|operator\|swapper\|claim' -i \
            > evidence/governance/SECURITY_HISTORY.txt || true

      - name: Collect live governance and Merkl bindings
        shell: bash
        run: |
          set -euo pipefail
          OUT='evidence/governance/LIVE_CALLS.txt'
          : > "$OUT"

          run_call() {
            local label="$1" address="$2" signature="$3"
            shift 3
            {
              printf '\n### %s\naddress=%s\nsignature=%s\n' "$label" "$address" "$signature"
              if output="$(cast call "$address" "$signature" "$@" --rpc-url "$KATANA_RPC" 2>&1)"; then
                printf 'status=SUCCESS\n%s\n' "$output"
              else
                printf 'status=REVERT_OR_UNSUPPORTED\n%s\n' "$output"
              fi
            } >> "$OUT"
          }

          run_call 'metadata.kat' "$VKAT_METADATA" 'kat()(address)'
          run_call 'metadata.allowedRewardTokens' "$VKAT_METADATA" 'allowedRewardTokens()(address[])'
          run_call 'metadata.getAllowedRewardTokens.docs' "$VKAT_METADATA" 'getAllowedRewardTokens()(address[])'
          run_call 'metadata.defaultPreferences' "$VKAT_METADATA" 'getDefaultPreferences()((uint16[],address[]))'
          run_call 'metadata.isRewardToken.KAT' "$VKAT_METADATA" 'isRewardToken(address)(bool)' "$KAT"
          run_call 'metadata.isRewardToken.vKAT' "$VKAT_METADATA" 'isRewardToken(address)(bool)' "$VKAT_NFT"
          run_call 'metadata.autocompoundReserved' "$VKAT_METADATA" 'AUTOCOMPOUND_RESERVED_ADDRESS()(address)'
          run_call 'metadata.implementation' "$VKAT_METADATA" 'implementation()(address)'

          run_call 'vault.asset' "$AVKAT_VAULT" 'asset()(address)'
          run_call 'vault.escrow' "$AVKAT_VAULT" 'escrow()(address)'
          run_call 'vault.lockNft' "$AVKAT_VAULT" 'lockNft()(address)'
          run_call 'vault.strategy' "$AVKAT_VAULT" 'strategy()(address)'
          run_call 'vault.defaultStrategy' "$AVKAT_VAULT" 'defaultStrategy()(address)'
          run_call 'vault.masterTokenId' "$AVKAT_VAULT" 'masterTokenId()(uint256)'
          run_call 'vault.totalAssets' "$AVKAT_VAULT" 'totalAssets()(uint256)'
          run_call 'vault.totalSupply' "$AVKAT_VAULT" 'totalSupply()(uint256)'
          run_call 'vault.paused' "$AVKAT_VAULT" 'paused()(bool)'
          run_call 'vault.oneShareInAssets' "$AVKAT_VAULT" 'convertToAssets(uint256)(uint256)' '1000000000000000000'
          run_call 'vault.implementation' "$AVKAT_VAULT" 'implementation()(address)'

          run_call 'strategy.owner' "$COMPOUND_STRATEGY" 'owner()(address)'
          run_call 'strategy.masterTokenId' "$COMPOUND_STRATEGY" 'masterTokenId()(uint256)'
          run_call 'strategy.escrow' "$COMPOUND_STRATEGY" 'escrow()(address)'
          run_call 'strategy.nft' "$COMPOUND_STRATEGY" 'nft()(address)'
          run_call 'strategy.voter' "$COMPOUND_STRATEGY" 'voter()(address)'
          run_call 'strategy.vault' "$COMPOUND_STRATEGY" 'vault()(address)'
          run_call 'strategy.swapper' "$COMPOUND_STRATEGY" 'swapper()(address)'
          run_call 'strategy.delegatee' "$COMPOUND_STRATEGY" 'delegatee()(address)'
          run_call 'strategy.rewardsDistributor' "$COMPOUND_STRATEGY" 'rewardsDistributor()(address)'
          run_call 'strategy.totalAssets' "$COMPOUND_STRATEGY" 'totalAssets()(uint256)'
          run_call 'strategy.implementation' "$COMPOUND_STRATEGY" 'implementation()(address)'

          run_call 'swapper.rewardDistributor' "$SWAPPER" 'rewardDistributor()(address)'
          run_call 'swapper.escrow' "$SWAPPER" 'escrow()(address)'
          run_call 'swapper.escrowToken' "$SWAPPER" 'escrowToken()(address)'
          cast balance "$SWAPPER" --rpc-url "$KATANA_RPC" \
            > evidence/governance/SWAPPER_NATIVE_BALANCE_WEI.txt
          run_call 'KAT.balanceOf.swapper' "$KAT" 'balanceOf(address)(uint256)' "$SWAPPER"
          run_call 'USDC.balanceOf.swapper' "$USDC" 'balanceOf(address)(uint256)' "$SWAPPER"
          run_call 'KAT.balanceOf.strategy' "$KAT" 'balanceOf(address)(uint256)' "$COMPOUND_STRATEGY"
          run_call 'KAT.balanceOf.vault' "$KAT" 'balanceOf(address)(uint256)' "$AVKAT_VAULT"

          run_call 'merkl.operator.strategy.swapper' "$MERKL_DISTRIBUTOR" \
            'operators(address,address)(uint256)' "$COMPOUND_STRATEGY" "$SWAPPER"
          run_call 'merkl.recipient.strategy.KAT' "$MERKL_DISTRIBUTOR" \
            'claimRecipient(address,address)(address)' "$COMPOUND_STRATEGY" "$KAT"
          run_call 'merkl.recipient.strategy.vKAT' "$MERKL_DISTRIBUTOR" \
            'claimRecipient(address,address)(address)' "$COMPOUND_STRATEGY" "$VKAT_NFT"
          run_call 'merkl.recipient.strategy.default' "$MERKL_DISTRIBUTOR" \
            'claimRecipient(address,address)(address)' "$COMPOUND_STRATEGY" \
            '0x0000000000000000000000000000000000000000'
          run_call 'merkl.root' "$MERKL_DISTRIBUTOR" 'getMerkleRoot()(bytes32)'

          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          : > evidence/governance/EIP1967_IMPLEMENTATIONS.tsv
          for address in "$VKAT_METADATA" "$AVKAT_VAULT" "$COMPOUND_STRATEGY"; do
            printf '%s\t%s\n' "$address" \
              "$(cast storage "$address" "$IMPL_SLOT" --rpc-url "$KATANA_RPC")" \
              >> evidence/governance/EIP1967_IMPLEMENTATIONS.tsv
          done

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path('evidence/governance/LIVE_CALLS.txt').read_text(errors='replace')
          sections = {}
          for part in text.split('\n### ')[1:]:
              header, *rest = part.splitlines()
              sections[header.strip()] = '\n'.join(rest)

          def final_value(label):
              section = sections.get(label, '')
              if 'status=SUCCESS' not in section:
                  return None
              lines = section.split('status=SUCCESS\n', 1)[1].strip().splitlines()
              return lines[-1].strip() if lines else None

          operator = final_value('merkl.operator.strategy.swapper')
          native = int(Path('evidence/governance/SWAPPER_NATIVE_BALANCE_WEI.txt').read_text().split()[0], 0)
          report = {
              'metadata_kat': final_value('metadata.kat'),
              'metadata_is_kat_reward': final_value('metadata.isRewardToken.KAT'),
              'metadata_is_vkat_reward': final_value('metadata.isRewardToken.vKAT'),
              'vault_strategy': final_value('vault.strategy'),
              'strategy_vault': final_value('strategy.vault'),
              'strategy_swapper': final_value('strategy.swapper'),
              'strategy_rewards_distributor': final_value('strategy.rewardsDistributor'),
              'merkl_operator_strategy_to_swapper': operator,
              'merkl_recipient_kat': final_value('merkl.recipient.strategy.KAT'),
              'merkl_recipient_vkat': final_value('merkl.recipient.strategy.vKAT'),
              'merkl_recipient_default': final_value('merkl.recipient.strategy.default'),
              'swapper_native_balance_wei': native,
              'leads': {
                  'operator_left_enabled': operator not in (None, '0', '0x0'),
                  'swapper_native_residue': native > 0,
                  'metadata_kat_mismatch': (
                      final_value('metadata.kat') or ''
                  ).lower() not in {
                      '0x7f1f4b4b29f5058fa32cc7a97141b8d7e5abdc2d',
                      '',
                  },
              },
          }
          Path('evidence/governance/LIVE_SUMMARY.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Package private evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f -printf '%P\t%s bytes\n' | sort \
            > evidence/ARTIFACT_INDEX.txt
          (
            cd evidence
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katana-kat-governance-v9-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
