name: Katana LayerZero peer and escrow solvency profile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-layerzero-solvency-20260729.yml'
      - 'katana-layerzero-solvency/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bind Katana secondary liabilities to Ethereum escrow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/profile.py <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          CHAINS={
            'katana':{
              'chain_id':747474,
              'endpoints':['https://rpc.katana.network/','https://rpc.katanarpc.com/','https://katana.gateway.tenderly.co/'],
              'from_block':18_000_000,
            },
            'ethereum':{
              'chain_id':1,
              'endpoints':['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://1rpc.io/eth'],
              'from_block':22_000_000,
            },
          }
          ITEMS=[
            {'name':'vbETH','katana_token':'0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62','katana_oa':'0x694d1697F6909361775139357d99fb60b5caB683','secondary':310095895000000000000,'eth_token':'0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF','eth_oa':'0x8F45F7ACD4b9FC0B446902790F304d444dfF949b'},
            {'name':'vbUSDC','katana_token':'0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36','katana_oa':'0x807275727Dd3E640c5F2b5DE7d1eC72B4Dd293C0','secondary':716499125,'eth_token':'0x53E82ABbb12638F09d9e624578ccB666217a765e','eth_oa':'0xb5bADA33542a05395d504a25885e02503A957Bb3'},
            {'name':'vbUSDT','katana_token':'0x2DCa96907fde857dd3D816880A0df407eeB2D2F2','katana_oa':'0x4690f346337eD8737BeA462ac71Ff16Ef95B985E','secondary':2346995049417,'eth_token':'0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC','eth_oa':'0x839dC0cFF5e263F56C9810560adF8Ea40E95Ab82'},
            {'name':'vbUSDS','katana_token':'0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3','katana_oa':'0xB42ab636ac69f073970a94d1ACE13379E7621665','secondary':0,'eth_token':'0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855','eth_oa':'0x1E283d60537Dae87Bb63CFCae0Be574b50Ed0BBa'},
            {'name':'vbWBTC','katana_token':'0x0913DA6Da4b42f538B445599b46Bb4622342Cf52','katana_oa':'0x8169e532Bc781985e155037db1F96c267a520DFC','secondary':1200,'eth_token':'0x2C24B57e2CCd1f273045Af6A5f632504C432374F','eth_oa':None},
          ]
          IMPL='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          ADMIN='0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103'
          rid=0; RPC={}; ERR={}
          def rq(url,m,p,t=45):
            global rid; rid+=1
            req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':rid,'method':m,'params':p}).encode(),headers={'content-type':'application/json','user-agent':'katana-lz-solvency/1.0'})
            with urllib.request.urlopen(req,timeout=t) as r: d=json.loads(r.read())
            if 'error' in d: raise RuntimeError(d['error'])
            return d['result']
          for n,c in CHAINS.items():
            ERR[n]={}
            for e in c['endpoints']:
              try:
                if int(rq(e,'eth_chainId',[]),16)!=c['chain_id']: raise RuntimeError('wrong chain')
                rq(e,'eth_blockNumber',[]); RPC[n]=e; break
              except Exception as x: ERR[n][e]=repr(x)
            if n not in RPC: raise SystemExit(f'no RPC for {n}: {ERR[n]}')
          def rpc(n,m,p,t=45): return rq(RPC[n],m,p,t)
          def sha3(n,s): return rpc(n,'web3_sha3',['0x'+s.encode().hex()])
          SEL={}
          def sel(n,s):
            k=(n,s)
            if k not in SEL: SEL[k]=sha3(n,s)[:10]
            return SEL[k]
          def pa(a): return a.lower().replace('0x','').rjust(64,'0')
          def pu(x): return hex(x)[2:].rjust(64,'0')
          def call(n,a,s,args=''):
            return rpc(n,'eth_call',[{'to':a,'data':sel(n,s)+args},'latest'])
          def u(n,a,s,args=''):
            r=call(n,a,s,args); return int(r,16) if r and r!='0x' else None
          def ad(n,a,s,args=''):
            r=call(n,a,s,args); return ('0x'+r[-40:]).lower() if r and r!='0x' and len(r)>=42 else None
          def b32(n,a,s,args=''):
            r=call(n,a,s,args); return r.lower() if r and r!='0x' else None
          def safe(f):
            try:return f()
            except Exception as e:return {'error':repr(e)}
          def slot(n,a,s):
            r=rpc(n,'eth_getStorageAt',[a,s,'latest']); return ('0x'+r[-40:]).lower() if int(r,16) else None
          def code(n,a):
            r=rpc(n,'eth_getCode',[a,'latest']); z=bytes.fromhex(r[2:]) if r and r!='0x' else b''
            return {'bytes':len(z),'sha256':hashlib.sha256(z).hexdigest() if z else None,'impl':slot(n,a,IMPL),'admin':slot(n,a,ADMIN)}
          def getlogs(n,addresses,topic,start,end,depth=0):
            try:return rpc(n,'eth_getLogs',[{'fromBlock':hex(start),'toBlock':hex(end),'address':addresses,'topics':[topic]}],90)
            except Exception:
              if start>=end or depth>=26: raise
              mid=(start+end)//2
              return getlogs(n,addresses,topic,start,mid,depth+1)+getlogs(n,addresses,topic,mid+1,end,depth+1)
          peer_topic=sha3('katana','PeerSet(uint32,bytes32)')
          events={}
          for n in CHAINS:
            latest=int(rpc(n,'eth_blockNumber',[]),16)
            addresses=[x['katana_oa'] for x in ITEMS] if n=='katana' else [x['eth_oa'] for x in ITEMS if x['eth_oa']]
            logs=getlogs(n,addresses,peer_topic,CHAINS[n]['from_block'],latest)
            parsed=[]
            for x in logs:
              raw=x['data'][2:].ljust(128,'0')
              eid=int(raw[:64],16); peer='0x'+raw[64:128]
              parsed.append({'contract':x['address'].lower(),'eid':eid,'peer':peer.lower(),'peer_address':'0x'+peer[-40:],'block':int(x['blockNumber'],16),'tx':x['transactionHash'],'log_index':int(x['logIndex'],16)})
            parsed.sort(key=lambda x:(x['block'],x['log_index']))
            events[n]=parsed
          latest_by={}
          for n,rows in events.items():
            for e in rows: latest_by[(n,e['contract'],e['eid'])]=e

          # Discover WBTC primary adapter from Katana's current peer(s) with code on Ethereum.
          wbtc=next(x for x in ITEMS if x['name']=='vbWBTC')
          for (n,c,eid),e in latest_by.items():
            if n=='katana' and c==wbtc['katana_oa'].lower():
              candidate=e['peer_address']
              if code('ethereum',candidate)['bytes']>0:
                wbtc['eth_oa']=candidate
                break

          rows=[]
          for x in ITEMS:
            r=dict(x)
            koa=x['katana_oa']; eoa=x['eth_oa']
            r['katana_oa_code']=code('katana',koa)
            r['katana_token_pointer']=safe(lambda a=koa:ad('katana',a,'token()'))
            r['katana_secondary_balance_live']=safe(lambda a=koa:u('katana',a,'secondaryChainBalance()'))
            r['katana_owner']=safe(lambda a=koa:ad('katana',a,'owner()'))
            r['katana_peers']=[]
            for (n,c,eid),ev in latest_by.items():
              if n=='katana' and c==koa.lower():
                current=safe(lambda a=koa,i=eid:b32('katana',a,'peers(uint32)',pu(i)))
                r['katana_peers'].append({'eid':eid,'event_peer':ev['peer'],'current_peer':current,'peer_address':ev['peer_address'],'event_block':ev['block']})
            if eoa:
              r['eth_oa_code']=code('ethereum',eoa)
              r['eth_token_pointer']=safe(lambda a=eoa:ad('ethereum',a,'token()'))
              r['eth_owner']=safe(lambda a=eoa:ad('ethereum',a,'owner()'))
              r['eth_escrow_balance']=safe(lambda t=x['eth_token'],a=eoa:u('ethereum',t,'balanceOf(address)',pa(a)))
              r['eth_token_supply']=safe(lambda t=x['eth_token']:u('ethereum',t,'totalSupply()'))
              r['eth_peers']=[]
              for (n,c,eid),ev in latest_by.items():
                if n=='ethereum' and c==eoa.lower():
                  current=safe(lambda a=eoa,i=eid:b32('ethereum',a,'peers(uint32)',pu(i)))
                  r['eth_peers'].append({'eid':eid,'event_peer':ev['peer'],'current_peer':current,'peer_address':ev['peer_address'],'event_block':ev['block']})
              sec=r['katana_secondary_balance_live']; esc=r['eth_escrow_balance']
              r['escrow_covers_katana']=isinstance(sec,int) and isinstance(esc,int) and esc>=sec
              r['escrow_minus_katana']=esc-sec if isinstance(sec,int) and isinstance(esc,int) else None
            rows.append(r)

          blocks={}
          for n in CHAINS:
            b=int(rpc(n,'eth_blockNumber',[]),16); h=rpc(n,'eth_getBlockByNumber',[hex(b),False])
            blocks[n]={'number':b,'hash':h['hash'],'timestamp':int(h['timestamp'],16),'rpc':RPC[n]}
          result={'blocks':blocks,'endpoint_errors':ERR,'peer_topic':peer_topic,'peer_events':events,'rows':rows}
          Path('evidence/PROFILE.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          lines=['# Katana LayerZero peer and escrow solvency profile','',f"- Katana block: `{blocks['katana']['number']}`",f"- Ethereum block: `{blocks['ethereum']['number']}`",'', '| token | Katana liability | Ethereum escrow | covers | surplus/other-chain | Katana peer(s) | Ethereum peer(s) |','|---|---:|---:|:---:|---:|---|---|']
          for r in rows:
            kp=','.join(f"{p['eid']}:{p['peer_address']}" for p in r['katana_peers']) or 'none'
            ep=','.join(f"{p['eid']}:{p['peer_address']}" for p in r.get('eth_peers',[])) or 'none'
            lines.append(f"| {r['name']} | {r['katana_secondary_balance_live']} | {r.get('eth_escrow_balance')} | {r.get('escrow_covers_katana')} | {r.get('escrow_minus_katana')} | `{kp}` | `{ep}` |")
          Path('evidence/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/profile.py
          (cd evidence && sha256sum PROFILE.json SUMMARY.md > SHA256SUMS)
          cat evidence/SUMMARY.md

      - uses: actions/upload-artifact@v4
        with:
          name: katana-layerzero-solvency-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
