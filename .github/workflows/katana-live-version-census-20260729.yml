name: Katana Vault Bridge exact live version census

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-live-version-census-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read live implementation and version surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/census.py <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          CHAINS={
            'katana':(747474,['https://rpc.katana.network/','https://rpc.katanarpc.com/','https://katana.gateway.tenderly.co/']),
            'ethereum':(1,['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://1rpc.io/eth','https://cloudflare-eth.com']),
          }
          TARGETS={
            'katana':[
              ('CT_vbETH','0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62'),('CT_vbUSDC','0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36'),('CT_vbUSDT','0x2DCa96907fde857dd3D816880A0df407eeB2D2F2'),('CT_vbUSDS','0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3'),('CT_vbWBTC','0x0913DA6Da4b42f538B445599b46Bb4622342Cf52'),
              ('NC_vbETH','0xa6b0db1293144ebe9478b6a84f75dd651e45914a'),('NC_vbUSDC','0x97a3500083348A147F419b8a65717909762c389f'),('NC_vbUSDT','0x053FA9b934b83E1E0ffc7e98a41aAdc3640bB462'),('NC_vbUSDS','0x639f13D5f30B47c792b6851238c05D0b623C77DE'),('NC_vbWBTC','0xb00aa68b87256E2F22058fB2Ba3246EEc54A44fc'),
              ('OA_vbETH','0x694d1697F6909361775139357d99fb60b5caB683'),('OA_vbUSDC','0x807275727Dd3E640c5F2b5DE7d1eC72B4Dd293C0'),('OA_vbUSDT','0x4690f346337eD8737BeA462ac71Ff16Ef95B985E'),('OA_vbUSDS','0xB42ab636ac69f073970a94d1ACE13379E7621665'),('OA_vbWBTC','0x8169e532Bc781985e155037db1F96c267a520DFC'),
            ],
            'ethereum':[
              ('VB_vbUSDC','0x53E82ABbb12638F09d9e624578ccB666217a765e'),('VB_vbETH','0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF'),('VB_vbWBTC','0x2C24B57e2CCd1f273045Af6A5f632504C432374F'),('VB_vbUSDT','0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC'),('VB_vbUSDS','0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855'),
              ('MM','0x417d01B64Ea30C4E163873f3a1f77b727c689e02'),
            ],
          }
          IMPL='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          ADMIN='0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103'
          rid=0; endpoints={}; errors={n:{} for n in CHAINS}
          def raw(url,m,p,t=35):
            global rid; rid+=1
            req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':rid,'method':m,'params':p}).encode(),headers={'content-type':'application/json','user-agent':'katana-version-census/1.0'})
            with urllib.request.urlopen(req,timeout=t) as r:d=json.loads(r.read())
            if 'error' in d:raise RuntimeError(d['error'])
            return d['result']
          for n,(cid,candidates) in CHAINS.items():
            for e in candidates:
              try:
                if int(raw(e,'eth_chainId',[]),16)!=cid:raise RuntimeError('wrong chain')
                raw(e,'eth_blockNumber',[]);endpoints[n]=e;break
              except Exception as x:errors[n][e]=repr(x)
            if n not in endpoints:raise SystemExit(json.dumps(errors[n]))
          def rpc(n,m,p,t=35):
            last=None
            for e in [endpoints[n]]+[x for x in CHAINS[n][1] if x!=endpoints[n]]:
              try:v=raw(e,m,p,t);endpoints[n]=e;return v
              except Exception as x:errors[n][e]=repr(x);last=x
            raise RuntimeError(repr(last))
          sels={}
          def sel(n,s):
            k=(n,s)
            if k not in sels:sels[k]=rpc(n,'web3_sha3',['0x'+s.encode().hex()])[:10]
            return sels[k]
          def call(n,a,s,args=''):return rpc(n,'eth_call',[{'to':a,'data':sel(n,s)+args},'latest'])
          def uint(n,a,s):
            v=call(n,a,s);return int(v,16) if v and v!='0x' else None
          def string(n,a,s):
            v=call(n,a,s)
            if not v or v=='0x':return None
            b=bytes.fromhex(v[2:])
            if len(b)<64:return None
            off=int.from_bytes(b[:32],'big');ln=int.from_bytes(b[off:off+32],'big')
            return b[off+32:off+32+ln].decode(errors='replace')
          def safe(f):
            try:return f()
            except Exception as x:return {'error':repr(x)}
          def storage(n,a,slot):
            v=rpc(n,'eth_getStorageAt',[a,slot,'latest']);return ('0x'+v[-40:]).lower() if int(v,16) else None
          def code(n,a):
            v=rpc(n,'eth_getCode',[a,'latest']);b=bytes.fromhex(v[2:]) if v and v!='0x' else b''
            return {'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest() if b else None}
          blocks={};rows=[]
          for n in CHAINS:
            bn=int(rpc(n,'eth_blockNumber',[]),16);h=rpc(n,'eth_getBlockByNumber',[hex(bn),False]);blocks[n]={'number':bn,'hash':h['hash'],'timestamp':int(h['timestamp'],16),'rpc':endpoints[n]}
            for label,address in TARGETS[n]:
              impl=safe(lambda n=n,a=address:storage(n,a,IMPL));admin=safe(lambda n=n,a=address:storage(n,a,ADMIN))
              row={'chain':n,'label':label,'proxy':address.lower(),'proxy_code':code(n,address),'implementation':impl,'proxy_admin':admin}
              if isinstance(impl,str):row['implementation_code']=code(n,impl)
              for key,sig,kind in [('version','version()','string'),('protocol','VAULT_BRIDGE_PROTOCOL()','string'),('global_counter','globalInitializationCounter()','uint'),('local_counter','localInitializationCounter()','uint'),('paused','paused()','uint')]:
                row[key]=safe((lambda n=n,a=address,s=sig:string(n,a,s)) if kind=='string' else (lambda n=n,a=address,s=sig:uint(n,a,s)))
              rows.append(row)
          result={'schema':'katana-live-version-census/v1','blocks':blocks,'endpoint_errors':errors,'rows':rows}
          Path('evidence/CENSUS.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          lines=['# Katana Vault Bridge exact live version census','', '| chain | label | proxy | implementation | version | protocol | global counter | local counter |','|---|---|---|---|---|---|---:|---:|']
          for r in rows:lines.append(f"| {r['chain']} | {r['label']} | `{r['proxy']}` | `{r['implementation']}` | {r['version']} | {r['protocol']} | {r['global_counter']} | {r['local_counter']} |")
          Path('evidence/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/census.py
          (cd evidence && sha256sum CENSUS.json SUMMARY.md > SHA256SUMS)
          cat evidence/SUMMARY.md

      - uses: actions/upload-artifact@v4
        with:
          name: katana-live-version-census-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
