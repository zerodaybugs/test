name: Internal Katana vKAT metadata live gate v11

on:
  pull_request:
    branches: [main]
    paths:
      - '.katana-metadata-v11/**'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      METADATA: '0xb2143cFC740356E5FeFB4488e01026cfBb0A328F'
      KAT: '0x7f1f4b4b29f5058fa32cc7a97141b8d7e5abdc2d'
      VKAT_NFT: '0x106F7D67Ea25Cb9eFf5064CF604ebf6259Ff296d'
      ATTACKER: '0x1111111111111111111111111111111111111111'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Read live metadata and simulate preference writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          RPC=''
          for candidate in 'https://rpc.katana.network/' 'https://katana.gateway.tenderly.co/' 'https://rpc.katanarpc.com/'; do
            if id="$(cast chain-id --rpc-url "$candidate" 2>/dev/null)" && test "$id" = '747474'; then RPC="$candidate"; break; fi
          done
          test -n "$RPC"
          export RPC
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          rpc=os.environ['RPC']; metadata=os.environ['METADATA']; kat=os.environ['KAT']; nft=os.environ['VKAT_NFT']; attacker=os.environ['ATTACKER']
          def run(args): return subprocess.run(args,check=True,text=True,capture_output=True).stdout.strip()
          def call(sig,*args,sender=None):
            cmd=['cast','call',metadata,sig,*map(str,args),'--rpc-url',rpc]
            if sender: cmd += ['--from',sender]
            try: return {'status':'SUCCESS','output':run(cmd)}
            except subprocess.CalledProcessError as exc: return {'status':'REVERT','output':(exc.stderr or exc.stdout or str(exc)).strip()}
          reserved=call('AUTOCOMPOUND_RESERVED_ADDRESS()(address)')
          report={
            'rpc':rpc,
            'metadata':metadata.lower(),
            'kat_expected':kat.lower(),
            'vkat_nft':nft.lower(),
            'kat_storage':call('kat()(address)'),
            'allowed_reward_tokens':call('allowedRewardTokens()(address[])'),
            'docs_get_allowed_reward_tokens':call('getAllowedRewardTokens()(address[])'),
            'is_kat_reward':call('isRewardToken(address)(bool)',kat),
            'is_vkat_nft_reward':call('isRewardToken(address)(bool)',nft),
            'is_zero_reward':call('isRewardToken(address)(bool)','0x0000000000000000000000000000000000000000'),
            'reserved_address':reserved,
            'default_preferences':call('getDefaultPreferences()((uint16[],address[]))'),
            'attacker_set_kat_only':call('setPreferences((uint16[],address[]))','([1],['+kat+'])',sender=attacker),
            'attacker_set_vkat_nft_only':call('setPreferences((uint16[],address[]))','([1],['+nft+'])',sender=attacker),
            'attacker_set_empty':call('setPreferences((uint16[],address[]))','([],[])',sender=attacker),
          }
          kat_storage=(report['kat_storage']['output'].splitlines()[0].lower() if report['kat_storage']['status']=='SUCCESS' else None)
          is_kat=(report['is_kat_reward']['output'].splitlines()[0].lower() if report['is_kat_reward']['status']=='SUCCESS' else None)
          is_nft=(report['is_vkat_nft_reward']['output'].splitlines()[0].lower() if report['is_vkat_nft_reward']['status']=='SUCCESS' else None)
          report['verdict']={
            'constructor_parameter_mismatch':kat_storage==nft.lower(),
            'real_kat_whitelisted_live':is_kat=='true',
            'nft_address_whitelisted_live':is_nft=='true',
            'user_can_select_real_kat':report['attacker_set_kat_only']['status']=='SUCCESS',
            'user_can_select_nft_address':report['attacker_set_vkat_nft_only']['status']=='SUCCESS',
            'docs_getter_exists':report['docs_get_allowed_reward_tokens']['status']=='SUCCESS',
          }
          Path('evidence/METADATA_GATE.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          Path('evidence/SHA256SUMS.txt').write_text('')
          PY
          (cd evidence && sha256sum METADATA_GATE.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: katana-metadata-live-v11-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
