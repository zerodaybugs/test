name: Katana OFT adapter quick production profile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-oft-adapter-quick-profile.yml'
      - 'katana-oft-quick/**'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read direct OFT state without historical scans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, urllib.request, time
          from pathlib import Path
          RPC='https://rpc.katana.network/'
          ADAPTERS={
            'vbUSDC':('0x807275727Dd3E640c5F2b5DE7d1eC72B4Dd293C0','0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36','0x97a3500083348A147F419b8a65717909762c389f','0xb5bADA33542a05395d504a25885e02503A957Bb3'),
            'vbUSDT':('0x4690f346337eD8737BeA462ac71Ff16Ef95B985E','0x2DCa96907fde857dd3D816880A0df407eeB2D2F2','0x053FA9b934b83E1E0ffc7e98a41aAdc3640bB462','0x839dC0cFF5e263F56C9810560adF8Ea40E95Ab82'),
            'vbWBTC':('0x8169e532Bc781985e155037db1F96c267a520DFC','0x0913DA6Da4b42f538B445599b46Bb4622342Cf52','0xb00aa68b87256E2F22058fB2Ba3246EEc54A44fc',None),
            'vbUSDS':('0xB42ab636ac69f073970a94d1ACE13379E7621665','0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3','0x639f13D5f30B47c792b6851238c05D0b623C77DE','0x1E283d60537Dae87Bb63CFCae0Be574b50Ed0BBa'),
            'vbETH': ('0x694d1697F6909361775139357d99fb60b5caB683','0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62','0xa6b0db1293144ebe9478b6a84f75dd651e45914a','0x8F45F7ACD4b9FC0B446902790F304d444dfF949b'),
          }
          IMPL='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          ADMIN='0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103'
          rid=0
          def rpc(method,params):
            global rid; rid+=1
            req=urllib.request.Request(RPC,data=json.dumps({'jsonrpc':'2.0','id':rid,'method':method,'params':params}).encode(),headers={'content-type':'application/json'})
            last=None
            for i in range(4):
              try:
                with urllib.request.urlopen(req,timeout=35) as r: x=json.loads(r.read())
                if 'error' in x: raise RuntimeError(x['error'])
                return x['result']
              except Exception as e: last=e; time.sleep(i+1)
            raise last
          def selector(s): return rpc('web3_sha3',['0x'+s.encode().hex()])[:10]
          def w(n): return hex(n)[2:].rjust(64,'0')
          def data(sig,args=[]):
            x=selector(sig)
            for typ,v in args:
              if typ.startswith('uint'): x+=w(int(v))
              elif typ=='address': x+=v.lower().replace('0x','').rjust(64,'0')
            return x
          def call(to,sig,args=[]):
            d=data(sig,args)
            try: return {'ok':True,'raw':rpc('eth_call',[{'to':to,'data':d},'latest']),'selector':d[:10]}
            except Exception as e: return {'ok':False,'error':repr(e),'selector':d[:10]}
          def addr(raw): return None if not isinstance(raw,str) or len(raw)<42 else '0x'+raw[-40:]
          def num(raw):
            try:return int(raw,16)
            except:return None
          def deco(kind,r):
            if not r['ok']: return r
            z=dict(r)
            if kind=='a':z['value']=addr(r['raw'])
            elif kind=='b':z['value']=bool(num(r['raw'])) if num(r['raw']) is not None else None
            elif kind=='n':z['value']=num(r['raw'])
            elif kind=='x':z['value']=r['raw'][-64:] if len(r['raw'])>=66 else r['raw']
            return z
          funcs={
            'token':('token()',[],'a'),'approvalRequired':('approvalRequired()',[],'b'),
            'secondaryChainBalance':('secondaryChainBalance()',[],'n'),'owner':('owner()',[],'a'),
            'delegate':('delegate()',[],'a'),'endpoint':('endpoint()',[],'a'),
            'sharedDecimals':('sharedDecimals()',[],'n'),'decimalConversionRate':('decimalConversionRate()',[],'n'),
            'globalInitializationCounter':('globalInitializationCounter()',[],'n'),
            'oftVersion':('oftVersion()',[],'x'),'oAppVersion':('oAppVersion()',[],'x'),
            'peer_eth':('peers(uint32)',[('uint32',30101)],'x'),'hasPeer_eth':('hasPeer(uint32)',[('uint32',30101)],'b'),
          }
          tokfunc={
            'totalSupply':('totalSupply()',[],'n'),
            'totalNetAdditional':('totalNetMintedByAdditionalMintersBurners()',[],'n'),
          }
          ncfunc={
            'backing':('backingOnLayerY()',[],'n'),
            'migratable':('migratableBacking()',[],'n'),
            'nonMigratablePct':('nonMigratableBackingPercentage()',[],'n'),
          }
          latest=int(rpc('eth_blockNumber',[]),16)
          out={'latest_block':latest,'adapters':{}}
          for label,(a,t,nc,expected_peer) in ADAPTERS.items():
            impl=addr(rpc('eth_getStorageAt',[a,IMPL,'latest']))
            admin=addr(rpc('eth_getStorageAt',[a,ADMIN,'latest']))
            pcode=rpc('eth_getCode',[a,'latest']); icode=rpc('eth_getCode',[impl,'latest']) if impl else '0x'
            e={'adapter':a,'token_expected':t,'converter':nc,'ethereum_peer_expected':expected_peer,'implementation':impl,'admin':admin,
               'proxy_code_bytes':(len(pcode)-2)//2,'implementation_code_bytes':(len(icode)-2)//2,
               'proxy_codehash':rpc('web3_sha3',[pcode]),'implementation_codehash':rpc('web3_sha3',[icode]) if icode!='0x' else None,
               'calls':{},'token_state':{},'converter_state':{}}
            for k,(s,args,kind) in funcs.items():e['calls'][k]=deco(kind,call(a,s,args))
            for k,(s,args,kind) in tokfunc.items():e['token_state'][k]=deco(kind,call(t,s,args))
            e['token_state']['adapterBalance']=deco('n',call(t,'balanceOf(address)',[('address',a)]))
            for k,(s,args,kind) in ncfunc.items():e['converter_state'][k]=deco(kind,call(nc,s,args))
            tok=e['calls']['token'].get('value'); peer=e['calls']['peer_eth'].get('value')
            peer_addr=('0x'+peer[-40:]) if isinstance(peer,str) and len(peer)>=40 else None
            sb=e['calls']['secondaryChainBalance'].get('value'); tn=e['token_state']['totalNetAdditional'].get('value')
            e['checks']={
              'token_matches':isinstance(tok,str) and tok.lower()==t.lower(),
              'peer_matches_expected': expected_peer is None or (isinstance(peer_addr,str) and peer_addr.lower()==expected_peer.lower()),
              'secondary_balance_equals_total_net': sb is not None and tn is not None and sb==tn,
              'adapter_functional_storage': isinstance(tok,str) and int(tok,16)!=0,
            }
            e['peer_eth_decoded_address']=peer_addr
            out['adapters'][label]=e
          Path('evidence/katana_oft_quick_profile.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload quick OFT profile
        uses: actions/upload-artifact@v4
        with:
          name: katana-oft-quick-profile-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
