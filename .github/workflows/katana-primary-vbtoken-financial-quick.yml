name: Katana primary vbToken financial quick profile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-primary-vbtoken-financial-quick.yml'
      - 'katana-primary-vbtoken/**'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read exact Ethereum vbToken and yield-vault state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path

          RPCS=['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://1rpc.io/eth','https://cloudflare-eth.com']
          TOKENS={
            'vbETH':'0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF',
            'vbUSDC':'0x53E82ABbb12638F09d9e624578ccB666217a765e',
            'vbUSDT':'0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC',
            'vbUSDS':'0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855',
            'vbWBTC':'0x2C24B57e2CCd1f273045Af6A5f632504C432374F',
          }
          IMPL='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          ADMIN='0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103'
          rid=0;selected=None;selcache={}
          def rpc(method,params):
            global rid,selected
            rid+=1; body=json.dumps({'jsonrpc':'2.0','id':rid,'method':method,'params':params}).encode()
            urls=([selected] if selected else [])+[u for u in RPCS if u!=selected]
            errs=[]
            for u in urls:
              for i in range(3):
                try:
                  req=urllib.request.Request(u,data=body,headers={'content-type':'application/json','user-agent':'katana-vbtoken-readonly/1.0'})
                  with urllib.request.urlopen(req,timeout=35) as r:x=json.loads(r.read())
                  if 'error' in x:raise RuntimeError(x['error'])
                  selected=u;return x['result']
                except Exception as e:errs.append(f'{u}:{e!r}');time.sleep(.5*(i+1))
            raise RuntimeError(' | '.join(errs))
          def selector(sig):
            if sig not in selcache:selcache[sig]=rpc('web3_sha3',['0x'+sig.encode().hex()])[:10]
            return selcache[sig]
          def w(n):return hex(int(n))[2:].rjust(64,'0')
          def encode(sig,args=()):
            x=selector(sig)
            for typ,v in args:
              if typ.startswith('uint'):x+=w(v)
              elif typ=='address':x+=v.lower().replace('0x','').rjust(64,'0')
              else:raise ValueError(typ)
            return x
          def call(to,sig,args=()):
            d=encode(sig,args)
            try:return {'ok':True,'raw':rpc('eth_call',[{'to':to,'data':d},'latest']),'selector':d[:10]}
            except Exception as e:return {'ok':False,'error':repr(e),'selector':d[:10]}
          def num(raw):
            try:return int(raw,16)
            except:return None
          def addr(raw):return None if not isinstance(raw,str) or len(raw)<42 else '0x'+raw[-40:]
          def decode(kind,r):
            z=dict(r)
            if not r.get('ok'):return z
            raw=r['raw']
            if kind=='uint':z['value']=num(raw)
            elif kind=='address':z['value']=addr(raw)
            elif kind=='bool':z['value']=bool(num(raw)) if num(raw) is not None else None
            elif kind=='booluint':
              h=raw[2:]
              z['positive']=bool(int(h[:64],16)) if len(h)>=128 else None
              z['difference']=int(h[64:128],16) if len(h)>=128 else None
            elif kind=='raw':z['value']=raw
            return z
          def storage(a,s):return rpc('eth_getStorageAt',[a,s,'latest'])
          def code(a):return rpc('eth_getCode',[a,'latest'])
          def codehash(c):return rpc('web3_sha3',[c]) if c!='0x' else None

          funcs={
            'underlyingToken':('underlyingToken()',(),'address'),
            'asset':('asset()',(),'address'),
            'totalSupply':('totalSupply()',(),'uint'),
            'totalAssets':('totalAssets()',(),'uint'),
            'reservedAssets':('reservedAssets()',(),'uint'),
            'stakedAssets':('stakedAssets()',(),'uint'),
            'yield':('yield()',(),'uint'),
            'backingDifference':('backingDifference()',(),'booluint'),
            'migrationFeesFund':('migrationFeesFund()',(),'uint'),
            'minimumReservePercentage':('minimumReservePercentage()',(),'uint'),
            'reservePercentage':('reservePercentage()',(),'uint'),
            'yieldVault':('yieldVault()',(),'address'),
            'yieldRecipient':('yieldRecipient()',(),'address'),
            'minimumYieldVaultDeposit':('minimumYieldVaultDeposit()',(),'uint'),
            'yieldVaultMaximumSlippagePercentage':('yieldVaultMaximumSlippagePercentage()',(),'uint'),
            'migrationManager':('migrationManager()',(),'address'),
            'lxlyBridge':('lxlyBridge()',(),'address'),
            'lxlyId':('lxlyId()',(),'uint'),
            'paused':('paused()',(),'bool'),
            'version':('version()',(),'raw'),
          }
          yfunc={
            'asset':('asset()',(),'address'),'totalAssets':('totalAssets()',(),'uint'),
            'totalSupply':('totalSupply()',(),'uint'),'decimals':('decimals()',(),'uint'),
          }
          latest=int(rpc('eth_blockNumber',[]),16);block=rpc('eth_getBlockByNumber',[hex(latest),False])
          out={'rpc':None,'block':latest,'timestamp':int(block['timestamp'],16),'tokens':{}}
          for label,a in TOKENS.items():
            imp=addr(storage(a,IMPL));admin=addr(storage(a,ADMIN));pc=code(a);ic=code(imp) if imp else '0x'
            e={'address':a,'implementation':imp,'admin':admin,'proxy_codehash':codehash(pc),'implementation_codehash':codehash(ic),
               'calls':{},'underlying_state':{},'yield_vault_state':{},'checks':{}}
            for k,(s,args,kind) in funcs.items():e['calls'][k]=decode(kind,call(a,s,args))
            underlying=e['calls']['underlyingToken'].get('value') or e['calls']['asset'].get('value')
            yv=e['calls']['yieldVault'].get('value')
            if underlying:
              e['underlying_state']['balanceOfVbToken']=decode('uint',call(underlying,'balanceOf(address)',(('address',a),)))
              e['underlying_state']['decimals']=decode('uint',call(underlying,'decimals()'))
              e['underlying_state']['totalSupply']=decode('uint',call(underlying,'totalSupply()'))
            if yv:
              for k,(s,args,kind) in yfunc.items():e['yield_vault_state'][k]=decode(kind,call(yv,s,args))
              e['yield_vault_state']['vbTokenShareBalance']=decode('uint',call(yv,'balanceOf(address)',(('address',a),)))
              shares=e['yield_vault_state']['vbTokenShareBalance'].get('value')
              if shares is not None:
                e['yield_vault_state']['assetsForHeldShares']=decode('uint',call(yv,'convertToAssets(uint256)',(('uint256',shares),)))
                e['yield_vault_state']['previewRedeemHeldShares']=decode('uint',call(yv,'previewRedeem(uint256)',(('uint256',shares),)))
              e['yield_vault_state']['maxWithdrawForVbToken']=decode('uint',call(yv,'maxWithdraw(address)',(('address',a),)))
              e['yield_vault_state']['maxRedeemForVbToken']=decode('uint',call(yv,'maxRedeem(address)',(('address',a),)))
              yc=code(yv);e['yield_vault_state']['codehash']=codehash(yc);e['yield_vault_state']['code_bytes']=(len(yc)-2)//2
              e['yield_vault_state']['implementation']=addr(storage(yv,IMPL))
            ts=e['calls']['totalSupply'].get('value');ta=e['calls']['totalAssets'].get('value');ra=e['calls']['reservedAssets'].get('value');sa=e['calls']['stakedAssets'].get('value');mf=e['calls']['migrationFeesFund'].get('value')
            physical=e['underlying_state'].get('balanceOfVbToken',{}).get('value')
            yassets=e['yield_vault_state'].get('assetsForHeldShares',{}).get('value')
            bd=e['calls']['backingDifference']
            e['checks']={
              'total_assets_cover_supply':ta is not None and ts is not None and ta>=ts,
              'reported_total_assets_equals_reserve_plus_staked':ta is not None and ra is not None and sa is not None and ta==ra+sa,
              'physical_underlying_covers_reserve_plus_migration_fund':physical is not None and ra is not None and mf is not None and physical>=ra+mf,
              'yield_vault_asset_value_matches_staked_assets':yassets is not None and sa is not None and yassets==sa,
              'backing_difference_consistent':ta is not None and ts is not None and bd.get('positive')==(ta>=ts) and bd.get('difference')==abs(ta-ts),
            }
            out['tokens'][label]=e
          out['rpc']=selected
          out['summary']={
            'all_solvent':all(v['checks']['total_assets_cover_supply'] for v in out['tokens'].values()),
            'all_internal_asset_equations_hold':all(v['checks']['reported_total_assets_equals_reserve_plus_staked'] for v in out['tokens'].values()),
            'all_physical_reserves_cover_accounting':all(v['checks']['physical_underlying_covers_reserve_plus_migration_fund'] for v in out['tokens'].values()),
            'all_yield_vault_valuations_match':all(v['checks']['yield_vault_asset_value_matches_staked_assets'] for v in out['tokens'].values()),
          }
          Path('evidence/katana_primary_vbtoken_financial_profile.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          compact={'rpc':selected,'block':latest,'timestamp':out['timestamp'],'summary':out['summary'],'tokens':{}}
          for k,v in out['tokens'].items():
            compact['tokens'][k]={
              'address':v['address'],'implementation':v['implementation'],'underlying':v['calls']['underlyingToken'].get('value'),
              'yield_vault':v['calls']['yieldVault'].get('value'),'yield_vault_implementation':v['yield_vault_state'].get('implementation'),
              'total_supply':v['calls']['totalSupply'].get('value'),'total_assets':v['calls']['totalAssets'].get('value'),
              'reserved_assets':v['calls']['reservedAssets'].get('value'),'staked_assets':v['calls']['stakedAssets'].get('value'),
              'uncollected_yield':v['calls']['yield'].get('value'),'backing_difference':v['calls']['backingDifference'],
              'migration_fees_fund':v['calls']['migrationFeesFund'].get('value'),
              'physical_underlying':v['underlying_state'].get('balanceOfVbToken',{}).get('value'),
              'yield_vault_shares':v['yield_vault_state'].get('vbTokenShareBalance',{}).get('value'),
              'yield_vault_assets_for_shares':v['yield_vault_state'].get('assetsForHeldShares',{}).get('value'),
              'yield_vault_max_withdraw':v['yield_vault_state'].get('maxWithdrawForVbToken',{}).get('value'),
              'yield_vault_max_redeem':v['yield_vault_state'].get('maxRedeemForVbToken',{}).get('value'),
              'checks':v['checks'],
            }
          Path('evidence/katana_primary_vbtoken_financial_compact.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          print(json.dumps(compact,indent=2,sort_keys=True))
          PY
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload read-only financial profile
        uses: actions/upload-artifact@v4
        with:
          name: katana-primary-vbtoken-financial-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
