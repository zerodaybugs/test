name: Katana primary vbToken financial-state inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-primary-vbtoken-state.yml'
      - 'katana-primary-state/**'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install authenticated Foundry toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foundry evidence
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz \
            --output /tmp/foundry.tar.gz
          echo 'cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  /tmp/foundry.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/foundry.tar.gz -C /tmp/foundry
          echo /tmp/foundry >> "$GITHUB_PATH"
          cast --version | tee evidence/CAST_VERSION.txt

      - name: Read exact production financial state
        shell: bash
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          rpc=os.environ['RPC_URL']
          tokens={
            'vbUSDS':'0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855',
            'vbUSDT':'0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC',
            'vbUSDC':'0x53E82ABbb12638F09d9e624578ccB666217a765e',
            'vbWBTC':'0x2C24B57e2CCd1f273045Af6A5f632504C432374F',
            'vbETH':'0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF',
          }
          migration_manager='0x417d01B64Ea30C4E163873f3a1f77b727c689e02'
          impl_slot='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          admin_slot='0xb53127684a568b3173ae13b9f8a6016e019a4f791a76d2f0a3b5c9f3b1e8a9c'

          def run(*args):
              p=subprocess.run(args,text=True,capture_output=True,timeout=45)
              return {'ok':p.returncode==0,'stdout':p.stdout.strip(),'stderr':p.stderr.strip(),'exit':p.returncode}
          def call(addr,sig,*args):
              return run('cast','call',addr,sig,*args,'--rpc-url',rpc)
          def value(x):
              return x['stdout'] if isinstance(x,dict) and x.get('ok') else None
          def uint(x):
              v=value(x)
              if v is None: return None
              try: return int(v.split()[0],0)
              except Exception: return None

          latest=run('cast','block-number','--rpc-url',rpc)
          chain_id=run('cast','chain-id','--rpc-url',rpc)
          report={'rpc':rpc,'chain_id':chain_id,'latest_block':latest,'migration_manager':migration_manager,'tokens':[]}

          for label,addr in tokens.items():
              row={'label':label,'address':addr}
              row['implementation']=run('cast','storage',addr,impl_slot,'--rpc-url',rpc)
              row['admin']=run('cast','storage',addr,admin_slot,'--rpc-url',rpc)
              row['codehash']=run('cast','codehash',addr,'--rpc-url',rpc)
              row['version']=call(addr,'version()(string)')
              row['protocol_version']=call(addr,'VAULT_BRIDGE_PROTOCOL()(string)')
              row['name']=call(addr,'name()(string)')
              row['symbol']=call(addr,'symbol()(string)')
              row['decimals']=call(addr,'decimals()(uint8)')
              row['asset']=call(addr,'asset()(address)')
              if not row['asset']['ok']:
                  row['asset']=call(addr,'underlyingToken()(address)')
              row['yieldVault']=call(addr,'yieldVault()(address)')
              row['yieldRecipient']=call(addr,'yieldRecipient()(address)')
              row['migrationManager']=call(addr,'migrationManager()(address)')
              row['agglayerBridge']=call(addr,'agglayerBridge()(address)')
              if not row['agglayerBridge']['ok']:
                  row['agglayerBridge']=call(addr,'lxlyBridge()(address)')
              row['totalSupply']=call(addr,'totalSupply()(uint256)')
              row['totalAssets']=call(addr,'totalAssets()(uint256)')
              row['reservedAssets']=call(addr,'reservedAssets()(uint256)')
              row['stakedAssets']=call(addr,'stakedAssets()(uint256)')
              row['yield']=call(addr,'yield()(uint256)')
              row['backingDifference']=call(addr,'backingDifference()(bool,uint256)')
              row['reservePercentage']=call(addr,'reservePercentage()(uint256)')
              row['minimumReservePercentage']=call(addr,'minimumReservePercentage()(uint256)')
              row['minimumYieldVaultDeposit']=call(addr,'minimumYieldVaultDeposit()(uint256)')
              row['yieldVaultMaximumSlippagePercentage']=call(addr,'yieldVaultMaximumSlippagePercentage()(uint256)')
              row['migrationFeesFund']=call(addr,'migrationFeesFund()(uint256)')
              row['paused']=call(addr,'paused()(bool)')

              asset=value(row['asset'])
              vault=value(row['yieldVault'])
              if asset:
                  row['physicalUnderlyingBalance']=call(asset,'balanceOf(address)(uint256)',addr)
                  row['assetName']=call(asset,'name()(string)')
                  row['assetSymbol']=call(asset,'symbol()(string)')
                  row['assetDecimals']=call(asset,'decimals()(uint8)')
                  row['assetImplementation']=run('cast','storage',asset,impl_slot,'--rpc-url',rpc)
              if vault:
                  row['yieldVaultCodehash']=run('cast','codehash',vault,'--rpc-url',rpc)
                  row['yieldVaultImplementation']=run('cast','storage',vault,impl_slot,'--rpc-url',rpc)
                  row['yieldVaultName']=call(vault,'name()(string)')
                  row['yieldVaultSymbol']=call(vault,'symbol()(string)')
                  row['yieldVaultAsset']=call(vault,'asset()(address)')
                  row['yieldVaultTotalAssets']=call(vault,'totalAssets()(uint256)')
                  row['yieldVaultTotalSupply']=call(vault,'totalSupply()(uint256)')
                  row['yieldVaultSharesHeld']=call(vault,'balanceOf(address)(uint256)',addr)
                  shares=uint(row['yieldVaultSharesHeld'])
                  if shares is not None:
                      row['yieldVaultAssetsForHeldShares']=call(vault,'convertToAssets(uint256)(uint256)',str(shares))
                      row['yieldVaultPreviewRedeemHeldShares']=call(vault,'previewRedeem(uint256)(uint256)',str(shares))
                  row['yieldVaultMaxWithdraw']=call(vault,'maxWithdraw(address)(uint256)',addr)
                  row['yieldVaultMaxRedeem']=call(vault,'maxRedeem(address)(uint256)',addr)

              report['tokens'].append(row)

          mm={
            'address':migration_manager,
            'implementation':run('cast','storage',migration_manager,impl_slot,'--rpc-url',rpc),
            'admin':run('cast','storage',migration_manager,admin_slot,'--rpc-url',rpc),
            'version':call(migration_manager,'version()(string)'),
            'protocol_version':call(migration_manager,'VAULT_BRIDGE_PROTOCOL()(string)'),
            'paused':call(migration_manager,'paused()(bool)'),
          }
          report['migration_manager_state']=mm
          Path('evidence/primary_vbtoken_state.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')

          compact=[]
          for row in report['tokens']:
              compact.append({
                'label':row['label'],
                'address':row['address'],
                'implementation':value(row['implementation']),
                'version':value(row['version']) or value(row['protocol_version']),
                'asset':value(row['asset']),
                'asset_symbol':value(row.get('assetSymbol')),
                'yield_vault':value(row['yieldVault']),
                'yield_vault_name':value(row.get('yieldVaultName')),
                'yield_vault_implementation':value(row.get('yieldVaultImplementation')),
                'total_supply':value(row['totalSupply']),
                'total_assets':value(row['totalAssets']),
                'reserved_assets':value(row['reservedAssets']),
                'physical_underlying_balance':value(row.get('physicalUnderlyingBalance')),
                'staked_assets':value(row['stakedAssets']),
                'uncollected_yield':value(row['yield']),
                'backing_difference':value(row['backingDifference']),
                'migration_fees_fund':value(row['migrationFeesFund']),
                'yield_vault_max_withdraw':value(row.get('yieldVaultMaxWithdraw')),
                'yield_vault_assets_for_held_shares':value(row.get('yieldVaultAssetsForHeldShares')),
                'yield_vault_preview_redeem':value(row.get('yieldVaultPreviewRedeemHeldShares')),
                'paused':value(row['paused']),
              })
          Path('evidence/primary_vbtoken_state_compact.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          print(json.dumps(compact,indent=2,sort_keys=True))
          PY
          (cd evidence && sha256sum * > SHA256SUMS)

      - name: Upload read-only financial state
        uses: actions/upload-artifact@v4
        with:
          name: katana-primary-vbtoken-state-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
