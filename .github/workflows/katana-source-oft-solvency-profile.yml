name: Katana source OFT solvency profile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-source-oft-solvency-profile.yml'
      - 'katana-source-oft/**'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compare Ethereum source escrow with Katana destination accounting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          ETH_RPCS=[
            'https://ethereum-rpc.publicnode.com',
            'https://eth.llamarpc.com',
            'https://1rpc.io/eth',
            'https://cloudflare-eth.com',
          ]
          KAT_RPCS=[
            'https://rpc.katana.network/',
            'https://rpc.katanarpc.com/',
          ]
          ASSETS={
            'vbETH': {
              'source_adapter':'0x8F45F7ACD4b9FC0B446902790F304d444dfF949b',
              'source_token':'0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF',
              'destination_adapter':'0x694d1697F6909361775139357d99fb60b5caB683',
              'destination_token':'0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62',
            },
            'vbUSDC': {
              'source_adapter':'0xb5bADA33542a05395d504a25885e02503A957Bb3',
              'source_token':'0x53E82ABbb12638F09d9e624578ccB666217a765e',
              'destination_adapter':'0x807275727Dd3E640c5F2b5DE7d1eC72B4Dd293C0',
              'destination_token':'0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36',
            },
            'vbUSDT': {
              'source_adapter':'0x839dC0cFF5e263F56C9810560adF8Ea40E95Ab82',
              'source_token':'0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC',
              'destination_adapter':'0x4690f346337eD8737BeA462ac71Ff16Ef95B985E',
              'destination_token':'0x2DCa96907fde857dd3D816880A0df407eeB2D2F2',
            },
            'vbUSDS': {
              'source_adapter':'0x1E283d60537Dae87Bb63CFCae0Be574b50Ed0BBa',
              'source_token':'0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855',
              'destination_adapter':'0xB42ab636ac69f073970a94d1ACE13379E7621665',
              'destination_token':'0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3',
            },
            'vbWBTC': {
              'source_adapter':'0x8d09c41229f07ad098ffb5fad239dd87d2c131d4',
              'source_token':'0x2C24B57e2CCd1f273045Af6A5f632504C432374F',
              'destination_adapter':'0x8169e532Bc781985e155037db1F96c267a520DFC',
              'destination_token':'0x0913DA6Da4b42f538B445599b46Bb4622342Cf52',
            },
          }
          ETH_EID=30101
          KATANA_EID=30375
          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          ADMIN_SLOT='0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103'
          OUT=Path('evidence')

          class RPC:
            def __init__(self, urls, name):
              self.urls=urls; self.name=name; self.id=0; self.selected=None
            def call(self, method, params):
              self.id += 1
              body=json.dumps({'jsonrpc':'2.0','id':self.id,'method':method,'params':params}).encode()
              errors=[]
              ordered=([self.selected] if self.selected else [])+[u for u in self.urls if u!=self.selected]
              for url in ordered:
                for attempt in range(3):
                  try:
                    req=urllib.request.Request(url,data=body,headers={'content-type':'application/json','user-agent':'katana-oft-solvency-readonly/1.0'})
                    with urllib.request.urlopen(req,timeout=35) as r:
                      obj=json.loads(r.read())
                    if 'error' in obj: raise RuntimeError(obj['error'])
                    self.selected=url
                    return obj['result']
                  except Exception as exc:
                    errors.append(f'{url} attempt {attempt+1}: {exc!r}')
                    time.sleep(0.5*(attempt+1))
              raise RuntimeError(f'{self.name} RPC failure: '+ ' | '.join(errors))

          eth=RPC(ETH_RPCS,'ethereum')
          kat=RPC(KAT_RPCS,'katana')

          def selector(rpc, signature):
            return rpc.call('web3_sha3',['0x'+signature.encode().hex()])[:10]
          def word_int(n): return hex(int(n))[2:].rjust(64,'0')
          def encode(rpc, signature, args=()):
            out=selector(rpc,signature)
            for typ,val in args:
              if typ.startswith('uint'): out+=word_int(val)
              elif typ=='address': out+=val.lower().replace('0x','').rjust(64,'0')
              else: raise ValueError(typ)
            return out
          def eth_call(rpc,to,signature,args=(),block='latest'):
            data=encode(rpc,signature,args)
            try: return {'ok':True,'raw':rpc.call('eth_call',[{'to':to,'data':data},block]),'selector':data[:10]}
            except Exception as exc: return {'ok':False,'error':repr(exc),'selector':data[:10]}
          def uint(raw):
            try:return int(raw,16)
            except:return None
          def addr(raw):
            if not isinstance(raw,str) or len(raw)<42:return None
            return '0x'+raw[-40:]
          def bytes32_addr(raw):
            if not isinstance(raw,str) or len(raw)<66:return None
            return '0x'+raw[-40:]
          def decode(kind,res):
            out=dict(res)
            if not res.get('ok'): return out
            raw=res.get('raw','0x')
            if kind=='uint':out['value']=uint(raw)
            elif kind=='bool':out['value']=bool(uint(raw)) if uint(raw) is not None else None
            elif kind=='address':out['value']=addr(raw)
            elif kind=='peer':out['value']=bytes32_addr(raw);out['bytes32']=raw[-64:] if len(raw)>=66 else raw
            elif kind=='raw':out['value']=raw
            return out
          def code(rpc,a):return rpc.call('eth_getCode',[a,'latest'])
          def storage(rpc,a,slot):return rpc.call('eth_getStorageAt',[a,slot,'latest'])
          def codehash(rpc,bytecode):return rpc.call('web3_sha3',[bytecode]) if bytecode!='0x' else None

          eth_latest=int(eth.call('eth_blockNumber',[]),16)
          kat_latest=int(kat.call('eth_blockNumber',[]),16)
          eth_block=eth.call('eth_getBlockByNumber',[hex(eth_latest),False])
          kat_block=kat.call('eth_getBlockByNumber',[hex(kat_latest),False])
          report={
            'ethereum_rpc':None,'katana_rpc':None,
            'ethereum_block':eth_latest,'ethereum_timestamp':int(eth_block['timestamp'],16),
            'katana_block':kat_latest,'katana_timestamp':int(kat_block['timestamp'],16),
            'katana_eid':KATANA_EID,'ethereum_eid':ETH_EID,'assets':{}
          }

          source_funcs={
            'token':('token()',(), 'address'),
            'approvalRequired':('approvalRequired()',(), 'bool'),
            'owner':('owner()',(), 'address'),
            'delegate':('delegate()',(), 'address'),
            'endpoint':('endpoint()',(), 'address'),
            'sharedDecimals':('sharedDecimals()',(), 'uint'),
            'decimalConversionRate':('decimalConversionRate()',(), 'uint'),
            'globalInitializationCounter':('globalInitializationCounter()',(), 'uint'),
            'peer_katana':('peers(uint32)',(('uint32',KATANA_EID),), 'peer'),
            'hasPeer_katana':('hasPeer(uint32)',(('uint32',KATANA_EID),), 'bool'),
          }
          dest_funcs={
            'token':('token()',(), 'address'),
            'approvalRequired':('approvalRequired()',(), 'bool'),
            'secondaryChainBalance':('secondaryChainBalance()',(), 'uint'),
            'owner':('owner()',(), 'address'),
            'delegate':('delegate()',(), 'address'),
            'endpoint':('endpoint()',(), 'address'),
            'sharedDecimals':('sharedDecimals()',(), 'uint'),
            'decimalConversionRate':('decimalConversionRate()',(), 'uint'),
            'globalInitializationCounter':('globalInitializationCounter()',(), 'uint'),
            'peer_ethereum':('peers(uint32)',(('uint32',ETH_EID),), 'peer'),
          }

          for label,cfg in ASSETS.items():
            sa,st,da,dt=cfg['source_adapter'],cfg['source_token'],cfg['destination_adapter'],cfg['destination_token']
            simp=addr(storage(eth,sa,IMPL_SLOT));sadmin=addr(storage(eth,sa,ADMIN_SLOT))
            dimp=addr(storage(kat,da,IMPL_SLOT));dadmin=addr(storage(kat,da,ADMIN_SLOT))
            scode=code(eth,sa);sicode=code(eth,simp) if simp else '0x'
            dcode=code(kat,da);dicode=code(kat,dimp) if dimp else '0x'
            entry={
              'addresses':cfg,
              'source':{
                'implementation':simp,'proxy_admin':sadmin,
                'proxy_codehash':codehash(eth,scode),'implementation_codehash':codehash(eth,sicode),
                'proxy_code_bytes':(len(scode)-2)//2,'implementation_code_bytes':(len(sicode)-2)//2,
                'calls':{},'token_state':{},
              },
              'destination':{
                'implementation':dimp,'proxy_admin':dadmin,
                'proxy_codehash':codehash(kat,dcode),'implementation_codehash':codehash(kat,dicode),
                'proxy_code_bytes':(len(dcode)-2)//2,'implementation_code_bytes':(len(dicode)-2)//2,
                'calls':{},'token_state':{},
              },
            }
            for k,(s,args,kind) in source_funcs.items():entry['source']['calls'][k]=decode(kind,eth_call(eth,sa,s,args))
            for k,(s,args,kind) in dest_funcs.items():entry['destination']['calls'][k]=decode(kind,eth_call(kat,da,s,args))
            for side,rpc,token,adapter in [('source',eth,st,sa),('destination',kat,dt,da)]:
              ts=entry[side]['token_state']
              ts['decimals']=decode('uint',eth_call(rpc,token,'decimals()'))
              ts['totalSupply']=decode('uint',eth_call(rpc,token,'totalSupply()'))
              ts['adapterBalance']=decode('uint',eth_call(rpc,token,'balanceOf(address)',(('address',adapter),)))
            entry['destination']['token_state']['totalNetAdditional']=decode(
              'uint',eth_call(kat,dt,'totalNetMintedByAdditionalMintersBurners()')
            )

            source_locked=entry['source']['token_state']['adapterBalance'].get('value')
            dest_accounted=entry['destination']['calls']['secondaryChainBalance'].get('value')
            dest_totalnet=entry['destination']['token_state']['totalNetAdditional'].get('value')
            source_token_actual=entry['source']['calls']['token'].get('value')
            dest_token_actual=entry['destination']['calls']['token'].get('value')
            source_peer=entry['source']['calls']['peer_katana'].get('value')
            dest_peer=entry['destination']['calls']['peer_ethereum'].get('value')
            entry['comparison']={
              'source_locked':source_locked,
              'destination_adapter_accounted':dest_accounted,
              'destination_token_total_net_additional':dest_totalnet,
              'source_minus_destination':None if source_locked is None or dest_accounted is None else source_locked-dest_accounted,
              'source_covers_destination':source_locked is not None and dest_accounted is not None and source_locked>=dest_accounted,
              'exact_source_destination_equality':source_locked is not None and dest_accounted is not None and source_locked==dest_accounted,
              'destination_internal_equality':dest_accounted is not None and dest_totalnet is not None and dest_accounted==dest_totalnet,
              'source_token_matches':isinstance(source_token_actual,str) and source_token_actual.lower()==st.lower(),
              'destination_token_matches':isinstance(dest_token_actual,str) and dest_token_actual.lower()==dt.lower(),
              'source_peer_matches_destination_adapter':isinstance(source_peer,str) and source_peer.lower()==da.lower(),
              'destination_peer_matches_source_adapter':isinstance(dest_peer,str) and dest_peer.lower()==sa.lower(),
              'source_approval_required':entry['source']['calls']['approvalRequired'].get('value'),
              'destination_approval_required':entry['destination']['calls']['approvalRequired'].get('value'),
            }
            report['assets'][label]=entry

          report['ethereum_rpc']=eth.selected
          report['katana_rpc']=kat.selected
          report['summary']={
            'all_source_cover_destination':all(v['comparison']['source_covers_destination'] for v in report['assets'].values()),
            'all_exactly_equal':all(v['comparison']['exact_source_destination_equality'] for v in report['assets'].values()),
            'all_destination_internal_equal':all(v['comparison']['destination_internal_equality'] for v in report['assets'].values()),
            'all_token_bindings_match':all(v['comparison']['source_token_matches'] and v['comparison']['destination_token_matches'] for v in report['assets'].values()),
            'all_peer_bindings_symmetric':all(v['comparison']['source_peer_matches_destination_adapter'] and v['comparison']['destination_peer_matches_source_adapter'] for v in report['assets'].values()),
          }
          OUT.joinpath('katana_source_oft_solvency_profile.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          compact={
            'ethereum_rpc':report['ethereum_rpc'],'katana_rpc':report['katana_rpc'],
            'ethereum_block':eth_latest,'katana_block':kat_latest,'summary':report['summary'],
            'assets':{
              k:{
                'source_adapter':v['addresses']['source_adapter'],
                'destination_adapter':v['addresses']['destination_adapter'],
                'source_implementation':v['source']['implementation'],
                'destination_implementation':v['destination']['implementation'],
                'source_owner':v['source']['calls']['owner'].get('value'),
                'destination_owner':v['destination']['calls']['owner'].get('value'),
                'source_peer':v['source']['calls']['peer_katana'].get('value'),
                'destination_peer':v['destination']['calls']['peer_ethereum'].get('value'),
                'source_locked':v['comparison']['source_locked'],
                'destination_accounted':v['comparison']['destination_adapter_accounted'],
                'destination_total_net':v['comparison']['destination_token_total_net_additional'],
                'source_minus_destination':v['comparison']['source_minus_destination'],
                'comparison':v['comparison'],
              } for k,v in report['assets'].items()
            }
          }
          OUT.joinpath('katana_source_oft_solvency_compact.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          print(json.dumps(compact,indent=2,sort_keys=True))
          PY
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload read-only source/destination profile
        uses: actions/upload-artifact@v4
        with:
          name: katana-source-oft-solvency-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
