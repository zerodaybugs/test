name: Katana scoped underlying migration matrix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-underlying-migration-matrix.yml'
      - 'katana-underlying/**'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install authenticated Foundry toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foundry evidence
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz \
            --output /tmp/foundry.tar.gz
          echo 'cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  /tmp/foundry.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/foundry.tar.gz -C /tmp/foundry
          echo /tmp/foundry >> "$GITHUB_PATH"

      - name: Read exact production token and bridge state
        shell: bash
        env:
          RPC_URL: https://rpc.katana.network/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          rpc=os.environ['RPC_URL']
          bridge='0x2a3dd3eb832af982ec71669e178424b10dca2ede'
          pairs=[
            ('USDC','0x97a3500083348a147f419b8a65717909762c389f','0xfd415D011FfaA8e6f17fa753CdB080d1dE266784','0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36'),
            ('USDT','0x053fa9b934b83e1e0ffc7e98a41aadc3640bb462','0xf44e3BCB7A2461CC08185E127B324f2486a74E20','0x2DCa96907fde857dd3D816880A0df407eeB2D2F2'),
            ('WBTC','0xb00aa68b87256e2f22058fb2ba3246eec54a44fc','0xB33e43A3F276e8e75792b941bccC996EcB2c0bBD','0x0913DA6Da4b42f538B445599b46Bb4622342Cf52'),
            ('USDS','0x639f13d5f30b47c792b6851238c05d0b623c77de','0x2134866886ce784fE2E0DE819118E4D32b4Be32C','0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3'),
            ('WETH','0xa6b0db1293144ebe9478b6a84f75dd651e45914a','0x815955d051C6262C16c720b19D735426254Bec5B','0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62'),
          ]
          impl_slot='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'

          def run(*args):
              p=subprocess.run(args,text=True,capture_output=True,timeout=45)
              return {'ok':p.returncode==0,'stdout':p.stdout.strip(),'stderr':p.stderr.strip(),'exit':p.returncode}
          def call(addr,sig,*args):
              return run('cast','call',addr,sig,*args,'--rpc-url',rpc)

          out={'latest_block':run('cast','block-number','--rpc-url',rpc),'bridge':bridge,'tokens':[]}
          for label,conv,under,custom in pairs:
              row={'label':label,'converter':conv,'underlying':under,'custom':custom}
              for address_key,address in [('underlying',under),('custom',custom),('converter',conv)]:
                  row[address_key+'_codehash']=run('cast','codehash',address,'--rpc-url',rpc)
                  row[address_key+'_implementation']=run('cast','storage',address,impl_slot,'--rpc-url',rpc)
              row['underlying_name']=call(under,'name()(string)')
              row['underlying_symbol']=call(under,'symbol()(string)')
              row['underlying_decimals']=call(under,'decimals()(uint8)')
              row['underlying_totalSupply']=call(under,'totalSupply()(uint256)')
              row['underlying_balance_converter']=call(under,'balanceOf(address)(uint256)',conv)
              row['underlying_balance_bridge']=call(under,'balanceOf(address)(uint256)',bridge)
              row['custom_name']=call(custom,'name()(string)')
              row['custom_symbol']=call(custom,'symbol()(string)')
              row['custom_totalSupply']=call(custom,'totalSupply()(uint256)')
              row['custom_nativeConverter']=call(custom,'nativeConverter()(address)')
              row['converter_backing']=call(conv,'backingOnLayerY()(uint256)')
              if not row['converter_backing']['ok']:
                  row['converter_backing']=call(conv,'backingOnSecondaryChain()(uint256)')
              row['converter_version']=call(conv,'version()(string)')
              row['bridge_wrappedAddressIsNotMintable']=call(bridge,'wrappedAddressIsNotMintable(address)(bool)',under)
              row['bridge_localBalanceTree_underlying']=call(bridge,'localBalanceTree(bytes32)(uint256)',run('cast','keccak',under)['stdout'])
              out['tokens'].append(row)

          Path('evidence/katana_underlying_migration_matrix.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          compact=[]
          for row in out['tokens']:
              def val(k):
                  x=row[k]
                  return x['stdout'] if isinstance(x,dict) and x.get('ok') else None
              compact.append({
                  'label':row['label'],
                  'converter':row['converter'],
                  'underlying':row['underlying'],
                  'underlying_name':val('underlying_name'),
                  'underlying_symbol':val('underlying_symbol'),
                  'underlying_decimals':val('underlying_decimals'),
                  'underlying_totalSupply':val('underlying_totalSupply'),
                  'underlying_balance_converter':val('underlying_balance_converter'),
                  'underlying_balance_bridge':val('underlying_balance_bridge'),
                  'underlying_impl_slot':val('underlying_implementation'),
                  'converter_backing':val('converter_backing'),
                  'converter_version':val('converter_version'),
                  'wrappedAddressIsNotMintable':val('bridge_wrappedAddressIsNotMintable'),
              })
          Path('evidence/katana_underlying_migration_compact.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          print(json.dumps(compact,indent=2,sort_keys=True))
          PY
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload read-only matrix
        uses: actions/upload-artifact@v4
        with:
          name: katana-underlying-matrix-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
