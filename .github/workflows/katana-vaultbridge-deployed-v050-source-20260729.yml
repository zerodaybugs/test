name: Katana deployed Vault Bridge v0.5.0 source and build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-vaultbridge-deployed-v050-source-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: agglayer/vault-bridge
          ref: 5851911e7cc02e9b9cb3f9546eb4e3be8ded6843
          path: deployed
          persist-credentials: false
          fetch-depth: 1

      - name: Create exact deployed-source review pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/repo
          cd deployed
          git log -1 --format=fuller > ../evidence/COMMIT.txt
          git status --porcelain=v1 > ../evidence/GIT_STATUS.txt
          printf '%s\n' 5851911e7cc02e9b9cb3f9546eb4e3be8ded6843 > ../evidence/PINNED_COMMIT.txt
          for p in src test script audit audits certora foundry.toml soldeer.lock README.md; do
            if [ -e "$p" ]; then cp -a --parents "$p" ../evidence/repo/; fi
          done
          find src -type f -name '*.sol' -print0 | sort -z | xargs -0 sha256sum > ../evidence/SOURCE_SHA256SUMS
          grep -RInE 'TODO|FIXME|remind|CAUTION|ATTENTION|IMPORTANT|delegatecall|call\{|assembly|unchecked|address\(0\)|forceApprove|totalSupply\(|convertToAssets|previewWithdraw|maxWithdraw|bridgeAsset|bridgeMessage|mint\(|burn\(' src > ../evidence/SECURITY_SURFACE.txt || true
          cd ../evidence
          sha256sum COMMIT.txt GIT_STATUS.txt PINNED_COMMIT.txt SOURCE_SHA256SUMS SECURITY_SURFACE.txt > SHA256SUMS
          find . -type f -printf '%p\t%s bytes\n' | sort > INDEX.txt

      - uses: actions/upload-artifact@v4
        with:
          name: katana-vaultbridge-deployed-v050-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
