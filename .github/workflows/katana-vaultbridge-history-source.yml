name: Katana Vault Bridge deployed-version history lookup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-vaultbridge-history-source.yml'
      - 'katana-vb-history/**'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Locate public source revisions declaring version 0.5.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence /tmp/work
          git clone --quiet --filter=blob:none https://github.com/agglayer/vault-bridge.git /tmp/work/vault-bridge
          cd /tmp/work/vault-bridge
          git fetch --quiet --all --tags --force

          {
            echo '=== refs ==='
            git show-ref --heads --tags || true
            echo '=== log -S 0.5.1 ==='
            git log --all --date=iso-strict --format='%H %ad %D %s' -S '0.5.1' -- . || true
            echo '=== log -G version ==='
            git log --all --date=iso-strict --format='%H %ad %D %s' -G '0[.]5[.]1' -- . || true
          } > "$GITHUB_WORKSPACE/evidence/history.txt"

          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          repo=Path('/tmp/work/vault-bridge')
          commits=subprocess.check_output(['git','-C',str(repo),'rev-list','--all'],text=True).splitlines()
          hits=[]
          probes=[
              'src/etc/Versioned.sol',
              'src/Versioned.sol',
              'src/secondary-chain/NativeConverter.sol',
              'src/secondary-chain/agglayer/GenericNativeConverterAgglayer.sol',
              'src/secondary-chain/agglayer/GenericNativeConverter.sol',
          ]
          for commit in commits:
              matched=[]
              for path in probes:
                  p=subprocess.run(['git','-C',str(repo),'show',f'{commit}:{path}'],text=True,capture_output=True)
                  if p.returncode==0 and '0.5.1' in p.stdout:
                      matched.append(path)
              if matched:
                  meta=subprocess.check_output(
                      ['git','-C',str(repo),'show','-s','--format=%H%n%aI%n%D%n%s',commit],text=True
                  ).splitlines()
                  hits.append({'commit':commit,'date':meta[1] if len(meta)>1 else None,'refs':meta[2] if len(meta)>2 else None,'subject':meta[3] if len(meta)>3 else None,'paths':matched})
          Path('evidence/version_hits.json').write_text(json.dumps(hits,indent=2,sort_keys=True)+'\n')
          print(json.dumps(hits,indent=2,sort_keys=True))
          PY

          hit=$(python3 - <<'PY'
          import json
          from pathlib import Path
          hits=json.loads(Path('evidence/version_hits.json').read_text())
          print(hits[0]['commit'] if hits else '')
          PY
          )
          if test -n "$hit"; then
            git archive --format=tar.gz --output="$GITHUB_WORKSPACE/evidence/vault-bridge-0.5.1-source.tar.gz" "$hit" src test script foundry.toml remappings.txt 2>/dev/null \
              || git archive --format=tar.gz --output="$GITHUB_WORKSPACE/evidence/vault-bridge-0.5.1-source.tar.gz" "$hit" src foundry.toml remappings.txt
            git show -s --format=fuller "$hit" > "$GITHUB_WORKSPACE/evidence/source-commit.txt"
            git ls-tree -r "$hit" > "$GITHUB_WORKSPACE/evidence/source-tree.txt"
          fi
          cd "$GITHUB_WORKSPACE"
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload public history evidence
        uses: actions/upload-artifact@v4
        with:
          name: katana-vaultbridge-history-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
