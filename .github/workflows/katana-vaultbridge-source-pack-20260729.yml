name: Katana Vault Bridge pinned source pack

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-vaultbridge-source-pack-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout pinned Vault Bridge source
        uses: actions/checkout@v4
        with:
          repository: agglayer/vault-bridge
          ref: c2ece8a5a4618ba3b06412b58e2a063fb014aadb
          path: vault-bridge
          persist-credentials: false
          fetch-depth: 1

      - name: Build review pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source
          cd vault-bridge
          printf '%s\n' "c2ece8a5a4618ba3b06412b58e2a063fb014aadb" > ../evidence/PINNED_COMMIT.txt
          git status --porcelain=v1 > ../evidence/GIT_STATUS.txt
          git log -1 --format=fuller > ../evidence/COMMIT.txt
          for p in src script test audit certora broadcast/README.md README.md foundry.toml soldeer.lock; do
            if [ -e "$p" ]; then cp -a --parents "$p" ../evidence/source/; fi
          done
          find src -type f -name '*.sol' -print0 | sort -z | xargs -0 sha256sum > ../evidence/SOURCE_SHA256SUMS
          grep -RInE 'TODO|FIXME|remind|CAUTION|ATTENTION|IMPORTANT|reentr|delegatecall|call\{|assembly|unchecked|address\(0\)|forceApprove|totalSupply\(|convertToAssets|previewWithdraw|maxWithdraw|bridgeAsset|bridgeMessage|mint\(|burn\(' src > ../evidence/SECURITY_SURFACE_GREP.txt || true
          cd ../evidence
          sha256sum PINNED_COMMIT.txt GIT_STATUS.txt COMMIT.txt SOURCE_SHA256SUMS SECURITY_SURFACE_GREP.txt > SHA256SUMS
          find . -maxdepth 4 -type f -printf '%p\t%s bytes\n' | sort > INDEX.txt

      - uses: actions/upload-artifact@v4
        with:
          name: katana-vaultbridge-source-pack-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
