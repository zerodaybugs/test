name: Katana Vault Bridge verified-source lookup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-vaultbridge-verified-source.yml'
      - 'katana-vb-source/**'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch public verified-contract records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for address in \
            0x9ef463c2c403d36ed508377c9bd899b4e33844a9 \
            0x4e741a698240bafe8ba2cbecda4a3d5959753fa3 \
            0x97a3500083348a147f419b8a65717909762c389f \
            0xa6b0db1293144ebe9478b6a84f75dd651e45914a
          do
            lower=$(echo "$address" | tr '[:upper:]' '[:lower:]')
            curl --silent --show-error --location --retry 3 --retry-all-errors \
              -w '\nHTTP_STATUS=%{http_code}\n' \
              "https://sourcify.dev/server/v2/contract/747474/$address?fields=all" \
              > "evidence/sourcify-${lower}.txt" || true
            curl --silent --show-error --location --retry 3 --retry-all-errors \
              -A 'Mozilla/5.0' \
              -w '\nHTTP_STATUS=%{http_code}\n' \
              "https://katanascan.com/address/$address?output=1" \
              > "evidence/katanascan-${lower}.html" || true
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence')
          summary=[]
          for p in sorted(root.glob('sourcify-*.txt')):
              text=p.read_text(errors='replace')
              body=text.rsplit('\nHTTP_STATUS=',1)[0]
              status=text.rsplit('HTTP_STATUS=',1)[-1].strip() if 'HTTP_STATUS=' in text else None
              row={'file':p.name,'http_status':status,'bytes':len(body.encode())}
              try:
                  obj=json.loads(body)
                  row['keys']=sorted(obj.keys()) if isinstance(obj,dict) else None
                  row['match']=obj.get('match') if isinstance(obj,dict) else None
                  row['contractName']=obj.get('contractName') if isinstance(obj,dict) else None
                  row['compiler']=obj.get('compiler') if isinstance(obj,dict) else None
                  row['sources_count']=len(obj.get('sources',{})) if isinstance(obj,dict) and isinstance(obj.get('sources'),dict) else None
                  row['abi_entries']=len(obj.get('abi',[])) if isinstance(obj,dict) and isinstance(obj.get('abi'),list) else None
              except Exception as exc:
                  row['json_error']=repr(exc)
              summary.append(row)
          (root/'verified_source_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload public verification records
        uses: actions/upload-artifact@v4
        with:
          name: katana-vaultbridge-source-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
