name: Katana vbToken stateful backing invariant fork fuzz

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-vbtoken-stateful-invariant-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariant:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build invariant harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inv
          mkdir -p inv/test
          cd inv
          forge install foundry-rs/forge-std@v1.9.4 --no-git --shallow
          cat > foundry.toml <<'EOF'
          [profile.default]
          test="test"
          libs=["lib"]
          solc_version="0.8.29"
          evm_version="cancun"
          optimizer=true
          optimizer_runs=833
          gas_limit=2000000000
          [invariant]
          runs=512
          depth=128
          fail_on_revert=false
          call_override=false
          shrink_run_limit=5000
          EOF
          cat > test/StatefulBackingInvariant.t.sol <<'SOL'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.29;
          import {Test, StdInvariant, console2} from "forge-std/Test.sol";

          interface IERC20 {
            function balanceOf(address) external view returns(uint256);
            function approve(address,uint256) external returns(bool);
            function transfer(address,uint256) external returns(bool);
            function decimals() external view returns(uint8);
          }
          interface IERC4626 {
            function balanceOf(address) external view returns(uint256);
            function deposit(uint256,address) external returns(uint256);
            function redeem(uint256,address,address) external returns(uint256);
            function convertToAssets(uint256) external view returns(uint256);
          }
          interface IVB {
            function asset() external view returns(address);
            function yieldVault() external view returns(address);
            function deposit(uint256,address) external returns(uint256);
            function mint(uint256,address) external returns(uint256);
            function withdraw(uint256,address,address) external returns(uint256);
            function redeem(uint256,address,address) external returns(uint256);
            function donateAsYield(uint256) external;
            function totalAssets() external view returns(uint256);
            function totalSupply() external view returns(uint256);
            function balanceOf(address) external view returns(uint256);
            function backingDifference() external view returns(bool,uint256);
          }

          contract Handler is Test {
            IVB public vb;
            IERC20 public asset;
            IERC4626 public ext;
            uint256 public unit;
            uint256 public maxAmount;
            uint256 public baselineDeficit;
            uint256 public maxDeficit;
            uint256 public maxDeficitIncrease;

            constructor(address vb_) {
              vb=IVB(vb_); asset=IERC20(vb.asset()); ext=IERC4626(vb.yieldVault());
              unit=10**asset.decimals();
              uint256 current=vb.totalAssets();
              maxAmount=current>0 ? current*2 : unit*1_000_000;
              if(maxAmount<unit*1000) maxAmount=unit*1000;
              deal(address(asset),address(this),type(uint128).max,true);
              asset.approve(address(vb),type(uint256).max);
              asset.approve(address(ext),type(uint256).max);
              (bool positive,uint256 difference)=vb.backingDifference();
              baselineDeficit=positive?0:difference;
              maxDeficit=baselineDeficit;
            }
            function _record() internal {
              (bool positive,uint256 difference)=vb.backingDifference();
              uint256 deficit=positive?0:difference;
              if(deficit>maxDeficit) maxDeficit=deficit;
              if(deficit>baselineDeficit && deficit-baselineDeficit>maxDeficitIncrease) maxDeficitIncrease=deficit-baselineDeficit;
            }
            function vbDeposit(uint128 raw) external { uint256 a=bound(uint256(raw),1,maxAmount); try vb.deposit(a,address(this)){}catch{} _record(); }
            function vbMint(uint128 raw) external { uint256 s=bound(uint256(raw),1,maxAmount); try vb.mint(s,address(this)){}catch{} _record(); }
            function vbRedeem(uint128 raw) external { uint256 b=vb.balanceOf(address(this)); if(b>0){uint256 s=bound(uint256(raw),1,b);try vb.redeem(s,address(this),address(this)){}catch{}} _record(); }
            function vbWithdraw(uint128 raw) external { uint256 b=vb.balanceOf(address(this)); if(b>0){uint256 a=bound(uint256(raw),1,b);try vb.withdraw(a,address(this),address(this)){}catch{}} _record(); }
            function donateAsYield(uint128 raw) external { uint256 a=bound(uint256(raw),1,maxAmount);try vb.donateAsYield(a){}catch{} _record(); }
            function directUnderlyingToVb(uint128 raw) external {uint256 a=bound(uint256(raw),1,maxAmount);asset.transfer(address(vb),a);_record();}
            function directUnderlyingToExternal(uint128 raw) external {uint256 a=bound(uint256(raw),1,maxAmount);asset.transfer(address(ext),a);_record();}
            function externalDeposit(uint128 raw) external {uint256 a=bound(uint256(raw),1,maxAmount);try ext.deposit(a,address(this)){}catch{} _record();}
            function externalRedeem(uint128 raw) external {uint256 b=ext.balanceOf(address(this));if(b>0){uint256 s=bound(uint256(raw),1,b);try ext.redeem(s,address(this),address(this)){}catch{}}_record();}
            function transferExternalSharesToVb(uint128 raw) external {uint256 b=ext.balanceOf(address(this));if(b>0){uint256 s=bound(uint256(raw),1,b);(bool ok,)=address(ext).call(abi.encodeWithSignature("transfer(address,uint256)",address(vb),s));ok;}_record();}
          }

          contract StatefulBackingInvariant is Test,StdInvariant {
            address[5] internal VBS=[0x53E82ABbb12638F09d9e624578ccB666217a765e,0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF,0x2C24B57e2CCd1f273045Af6A5f632504C432374F,0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC,0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855];
            Handler[] internal handlers;
            function setUp() public {
              vm.createSelectFork(vm.envString("ETH_RPC_URL"));
              for(uint256 i;i<VBS.length;i++){Handler h=new Handler(VBS[i]);handlers.push(h);targetContract(address(h));}
            }
            function invariant_NoAttackerDrivenBackingDeficitGrowth() public view {
              for(uint256 i;i<handlers.length;i++) assertEq(handlers[i].maxDeficitIncrease(),0,"attacker increased negative backing");
            }
            function invariant_Report() public view {
              for(uint256 i;i<handlers.length;i++){
                console2.log("HANDLER",address(handlers[i]));
                console2.log("BASELINE_DEFICIT",handlers[i].baselineDeficit());
                console2.log("MAX_DEFICIT",handlers[i].maxDeficit());
                console2.log("MAX_DEFICIT_INCREASE",handlers[i].maxDeficitIncrease());
              }
            }
          }
          SOL
      - name: Run invariant fuzz
        shell: bash
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        run: |
          set -o pipefail
          mkdir -p evidence
          cd inv
          forge test --match-contract StatefulBackingInvariant -vvvv 2>&1 | tee ../evidence/FOUNDRY.log
          status=${PIPESTATUS[0]}
          cd ..
          grep -E 'invariant_|MAX_DEFICIT|BASELINE_DEFICIT|Suite result|FAIL|PASS|counterexample' evidence/FOUNDRY.log > evidence/SUMMARY.txt || true
          if grep -q 'attacker increased negative backing' evidence/FOUNDRY.log; then echo GO > evidence/VERDICT.txt; else echo KILL > evidence/VERDICT.txt; fi
          printf '%s\n' "$status" > evidence/FORGE_EXIT_CODE.txt
          sha256sum evidence/* > evidence/SHA256SUMS
          cat evidence/VERDICT.txt
          cat evidence/SUMMARY.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katana-vbtoken-stateful-invariant-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
