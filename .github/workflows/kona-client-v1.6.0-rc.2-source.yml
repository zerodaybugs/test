name: Kona client v1.6.0-rc.2 exact respected-prestate source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kona-client-v1.6.0-rc.2-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact respected prestate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: kona-client/v1.6.0-rc.2
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          expected="d7cea91bc2f555a76b7720bf9c32f46c0b856119"
          actual="$(git -C upstream rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install locked Rust toolchain and fetch dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          cargo fetch --locked --manifest-path upstream/rust/Cargo.toml

      - name: Package immutable source and caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/kona-client-v1.6.0-rc.2-rust-source.tar.gz -C upstream rust
          tar --zstd -cf out/kona-client-v1.6.0-rc.2-cargo-registry.tar.zst -C "$HOME" .cargo/registry
          tar --zstd -cf out/kona-client-v1.6.0-rc.2-cargo-git.tar.zst -C "$HOME" .cargo/git
          {
            echo "source_tag=kona-client/v1.6.0-rc.2"
            echo "source_commit=$(git -C upstream rev-parse HEAD)"
            echo "source_tree=$(git -C upstream rev-parse HEAD^{tree})"
            rustc -Vv
            cargo -V
          } > out/MANIFEST.txt
          sha256sum out/*.tar.* out/MANIFEST.txt > out/SHA256SUMS
          ls -lh out

      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-client-v1.6.0-rc.2-source
          path: |
            out/kona-client-v1.6.0-rc.2-rust-source.tar.gz
            out/MANIFEST.txt
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload Cargo registry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-client-v1.6.0-rc.2-cargo-registry
          path: out/kona-client-v1.6.0-rc.2-cargo-registry.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload Cargo git cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-client-v1.6.0-rc.2-cargo-git
          path: out/kona-client-v1.6.0-rc.2-cargo-git.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
