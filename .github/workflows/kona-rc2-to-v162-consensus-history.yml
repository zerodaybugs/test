name: Kona rc2 to v1.6.2 consensus-history export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kona-rc2-to-v162-consensus-history.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Optimism history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: b40d2ce097b928fe1a4ec79a8a1925eb231c675e
          path: upstream
          fetch-depth: 0
          submodules: false

      - name: Export consensus-adjacent history and patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base=d7cea91bc2f555a76b7720bf9c32f46c0b856119
          head=b40d2ce097b928fe1a4ec79a8a1925eb231c675e
          paths=(
            rust/kona/bin/client
            rust/kona/crates/proof
            rust/kona/crates/protocol
            rust/op-revm
            rust/alloy-op-evm
            rust/op-alloy/crates/consensus
            op-node/rollup/derive
            op-service/eth
            op-core
          )
          git -C upstream log --reverse --date=iso-strict \
            --format='%H%x09%ad%x09%s' "$base..$head" -- "${paths[@]}" \
            > out/commit-list.tsv
          git -C upstream log --reverse --date=iso-strict --stat --summary \
            --format='===== %H %ad %s =====' "$base..$head" -- "${paths[@]}" \
            > out/history-stat.txt
          git -C upstream log --reverse --date=iso-strict -p --full-index --binary \
            --format='===== %H %ad %s =====' "$base..$head" -- "${paths[@]}" \
            > out/history.patch
          git -C upstream diff --name-status "$base..$head" -- "${paths[@]}" \
            > out/name-status.txt
          {
            echo "base=$base"
            echo "head=$head"
            echo "base_tree=$(git -C upstream rev-parse "$base^{tree}")"
            echo "head_tree=$(git -C upstream rev-parse "$head^{tree}")"
            echo "commit_count=$(wc -l < out/commit-list.tsv)"
          } > out/MANIFEST.txt
          sha256sum out/* > out/SHA256SUMS
          cat out/MANIFEST.txt

      - name: Upload history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-rc2-to-v162-consensus-history
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
