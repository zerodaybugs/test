name: Kona node v1.5.0 offline Rust cache

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kona-v1.5-offline-kit.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact Kona release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: kona-node/v1.5.0
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "317746fdf6ac6fd470089f714a8e908510f609be"

      - name: Install locked Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc -Vv
          cargo -V

      - name: Fetch exact locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path upstream/rust/Cargo.toml
          mkdir -p offline-kit
          printf 'tag=kona-node/v1.5.0\nsource_commit=317746fdf6ac6fd470089f714a8e908510f609be\n' > offline-kit/MANIFEST.txt
          rustc -Vv >> offline-kit/MANIFEST.txt
          cargo -V >> offline-kit/MANIFEST.txt
          du -sh "$HOME/.cargo/registry" "$HOME/.cargo/git"

      - name: Package split cache components
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -cf kona-v1.5-cargo-registry.tar.zst -C "$HOME/.cargo" registry
          tar --zstd -cf kona-v1.5-cargo-git.tar.zst -C "$HOME/.cargo" git
          tar --zstd -cf kona-v1.5-cache-manifest.tar.zst -C "$GITHUB_WORKSPACE" offline-kit
          sha256sum kona-v1.5-cargo-registry.tar.zst > kona-v1.5-cargo-registry.sha256
          sha256sum kona-v1.5-cargo-git.tar.zst > kona-v1.5-cargo-git.sha256
          sha256sum kona-v1.5-cache-manifest.tar.zst > kona-v1.5-cache-manifest.sha256
          ls -lh kona-v1.5-*.tar.zst kona-v1.5-*.sha256

      - name: Upload registry cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-v1.5-cargo-registry
          path: |
            kona-v1.5-cargo-registry.tar.zst
            kona-v1.5-cargo-registry.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload git cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-v1.5-cargo-git
          path: |
            kona-v1.5-cargo-git.tar.zst
            kona-v1.5-cargo-git.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload cache manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-v1.5-cache-manifest
          path: |
            kona-v1.5-cache-manifest.tar.zst
            kona-v1.5-cache-manifest.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
