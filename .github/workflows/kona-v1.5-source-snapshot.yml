name: Kona node v1.5.0 immutable Rust source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kona-v1.5-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Kona release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: kona-node/v1.5.0
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "317746fdf6ac6fd470089f714a8e908510f609be"

      - name: Package complete Rust workspace and relevant deployment material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/kona-node-v1.5.0-source.tar.gz \
            -C upstream \
            rust \
            op-service/rpc \
            op-node/node \
            op-node/p2p \
            docs/public-docs/node-operators
          printf 'tag=kona-node/v1.5.0\ncommit=317746fdf6ac6fd470089f714a8e908510f609be\n' \
            > out/SOURCE_LOCK.txt
          sha256sum out/kona-node-v1.5.0-source.tar.gz out/SOURCE_LOCK.txt > out/SHA256SUMS
          ls -lh out/kona-node-v1.5.0-source.tar.gz

      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-node-v1.5.0-source-snapshot
          path: out
          if-no-files-found: error
          retention-days: 3
