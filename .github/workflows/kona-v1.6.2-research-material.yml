name: Kona node v1.6.2 immutable research material

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kona-v1.6.2-research-material.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact Kona release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: kona-node/v1.6.2
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "b40d2ce097b928fe1a4ec79a8a1925eb231c675e"

      - name: Install locked Rust toolchain and fetch dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          cargo fetch --locked --manifest-path upstream/rust/Cargo.toml

      - name: Package immutable source and caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/kona-node-v1.6.2-rust-source.tar.gz \
            -C upstream rust op-core/nuts
          tar --zstd -cf out/kona-v1.6.2-cargo-registry.tar.zst -C "$HOME" .cargo/registry
          tar --zstd -cf out/kona-v1.6.2-cargo-git.tar.zst -C "$HOME" .cargo/git
          {
            echo "source_tag=kona-node/v1.6.2"
            echo "source_commit=$(git -C upstream rev-parse HEAD)"
            rustc -Vv
            cargo -V
          } > out/MANIFEST.txt
          sha256sum out/*.tar.* out/MANIFEST.txt > out/SHA256SUMS
          ls -lh out

      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-v1.6.2-source
          path: |
            out/kona-node-v1.6.2-rust-source.tar.gz
            out/MANIFEST.txt
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload Cargo registry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-v1.6.2-cargo-registry
          path: out/kona-v1.6.2-cargo-registry.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload Cargo git cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kona-v1.6.2-cargo-git
          path: out/kona-v1.6.2-cargo-git.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
