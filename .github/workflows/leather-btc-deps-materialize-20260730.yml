name: Leather Bitcoin dependency materialization 20260730

on:
  pull_request:
    paths:
      - "leather-btc-deps-trigger/**"

permissions:
  contents: read

concurrency:
  group: leather-btc-deps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Install exact public Bitcoin libraries
        run: |
          set -euo pipefail
          rm -rf leather-btc-deps-output leather-btc-deps-work
          mkdir -p leather-btc-deps-output leather-btc-deps-work
          cd leather-btc-deps-work
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact \
            @scure/btc-signer@1.6.0 \
            @scure/bip32@1.6.2 \
            @scure/bip39@1.5.4
          npm ls --all --json > ../leather-btc-deps-output/npm-tree.json
          cp package.json package-lock.json ../leather-btc-deps-output/
          tar -czf ../leather-btc-deps-output/node_modules.tar.gz node_modules
          cd ..
          sha256sum leather-btc-deps-output/node_modules.tar.gz \
            leather-btc-deps-output/package.json \
            leather-btc-deps-output/package-lock.json \
            leather-btc-deps-output/npm-tree.json \
            > leather-btc-deps-output/SHA256SUMS.txt

      - name: Upload dependency sandbox
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leather-btc-deps-20260730
          path: leather-btc-deps-output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
