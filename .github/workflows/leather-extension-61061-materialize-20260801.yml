name: Leather extension 6.106.1 source materialization 20260801

on:
  pull_request:
    paths:
      - "leather-extension-61061-trigger/**"

permissions:
  contents: read

concurrency:
  group: leather-extension-61061-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Materialize immutable current Chrome production source
        env:
          LEATHER_COMMIT: 841179602eadc9b60172bb5ce6d079a6902224cb
          LEATHER_TAG: "@leather.io/extension-v6.106.1"
        run: |
          set -euo pipefail
          rm -rf leather-mono leather-extension-output
          git clone --filter=blob:none --no-checkout https://github.com/leather-io/mono.git leather-mono
          cd leather-mono
          test "$(git rev-list -n 1 "$LEATHER_TAG")" = "$LEATHER_COMMIT"
          git checkout --detach "$LEATHER_COMMIT"
          test "$(git rev-parse HEAD)" = "$LEATHER_COMMIT"
          mkdir -p ../leather-extension-output/metadata
          git show -s --format=fuller HEAD > ../leather-extension-output/metadata/COMMIT.txt
          printf '%s\n' "$LEATHER_TAG" > ../leather-extension-output/metadata/PRODUCTION_TAG.txt
          git status --short --branch > ../leather-extension-output/metadata/GIT_STATUS.txt
          find apps/extension packages -type f -print | LC_ALL=C sort > ../leather-extension-output/metadata/FILE_TREE.txt
          git archive --format=tar --prefix=leather-extension-6.106.1/ HEAD apps/extension packages | gzip -9 > ../leather-extension-output/leather-extension-6.106.1.tar.gz
          sha256sum ../leather-extension-output/leather-extension-6.106.1.tar.gz > ../leather-extension-output/SHA256SUMS.txt

      - name: Upload public production source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leather-extension-6.106.1-source
          path: leather-extension-output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
