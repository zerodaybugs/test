name: Leather public source materialization 20260730

on:
  pull_request:
    paths:
      - "leather-source-trigger/**"

permissions:
  contents: read

concurrency:
  group: leather-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Materialize immutable Leather public source
        env:
          LEATHER_COMMIT: 612c860fa18934819ddac0c14f25c01d31fee58d
        run: |
          set -euo pipefail
          rm -rf leather-mono leather-source-output
          git clone --filter=blob:none --no-checkout https://github.com/leather-io/mono.git leather-mono
          cd leather-mono
          git checkout --detach "$LEATHER_COMMIT"
          test "$(git rev-parse HEAD)" = "$LEATHER_COMMIT"
          mkdir -p ../leather-source-output/metadata
          git show -s --format=fuller HEAD > ../leather-source-output/metadata/COMMIT.txt
          git for-each-ref --sort=-creatordate --format='%(creatordate:iso8601)%09%(refname:short)%09%(objectname)%09%(subject)' refs/tags refs/remotes/origin > ../leather-source-output/metadata/REFS.tsv
          git tag --sort=-creatordate > ../leather-source-output/metadata/TAGS.txt
          git status --short --branch > ../leather-source-output/metadata/GIT_STATUS.txt
          find . -path ./.git -prune -o -type f -print | LC_ALL=C sort > ../leather-source-output/metadata/FILE_TREE.txt
          find . -path ./.git -prune -o -name package.json -type f -print | LC_ALL=C sort > ../leather-source-output/metadata/PACKAGE_MANIFESTS.txt
          git archive --format=tar --prefix=leather-mono-612c860/ HEAD | gzip -9 > ../leather-source-output/leather-mono-612c860.tar.gz
          sha256sum ../leather-source-output/leather-mono-612c860.tar.gz > ../leather-source-output/SHA256SUMS.txt
          cd ..
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('leather-mono')
          manifests = {}
          for p in sorted(root.rglob('package.json')):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              manifests[str(p.relative_to(root))] = {
                  'name': data.get('name'),
                  'version': data.get('version'),
                  'private': data.get('private'),
                  'scripts': sorted((data.get('scripts') or {}).keys()),
              }
          Path('leather-source-output/metadata/MANIFEST_SUMMARY.json').write_text(
              json.dumps(manifests, indent=2, sort_keys=True), encoding='utf-8'
          )
          PY

      - name: Upload public source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leather-source-612c860
          path: leather-source-output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
