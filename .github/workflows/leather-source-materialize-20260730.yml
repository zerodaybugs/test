name: Leather iOS production source materialization 20260730

on:
  pull_request:
    paths:
      - "leather-source-trigger/**"

permissions:
  contents: read

concurrency:
  group: leather-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Materialize immutable Leather iOS production-tag source
        env:
          LEATHER_COMMIT: c6db17862a59506ac2e6808657c7894a7c11224b
          LEATHER_TAG: "@leather.io/mobile-v2.107.0"
        run: |
          set -euo pipefail
          rm -rf leather-mono leather-source-output
          git clone --filter=blob:none --no-checkout https://github.com/leather-io/mono.git leather-mono
          cd leather-mono
          test "$(git rev-list -n 1 "$LEATHER_TAG")" = "$LEATHER_COMMIT"
          git checkout --detach "$LEATHER_COMMIT"
          test "$(git rev-parse HEAD)" = "$LEATHER_COMMIT"
          mkdir -p ../leather-source-output/metadata
          git show -s --format=fuller HEAD > ../leather-source-output/metadata/COMMIT.txt
          printf '%s\n' "$LEATHER_TAG" > ../leather-source-output/metadata/PRODUCTION_TAG.txt
          git for-each-ref --sort=-creatordate --format='%(creatordate:iso8601)%09%(refname:short)%09%(objectname)%09%(subject)' refs/tags refs/remotes/origin > ../leather-source-output/metadata/REFS.tsv
          git status --short --branch > ../leather-source-output/metadata/GIT_STATUS.txt
          find . -path ./.git -prune -o -type f -print | LC_ALL=C sort > ../leather-source-output/metadata/FILE_TREE.txt
          git archive --format=tar --prefix=leather-mobile-ios-2.107.0/ HEAD | gzip -9 > ../leather-source-output/leather-mobile-ios-2.107.0.tar.gz
          sha256sum ../leather-source-output/leather-mobile-ios-2.107.0.tar.gz > ../leather-source-output/SHA256SUMS.txt

      - name: Upload public iOS production source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leather-mobile-ios-2.107.0
          path: leather-source-output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
