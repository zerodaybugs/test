name: Leather Stacks dependency materialization 20260801

on:
  pull_request:
    paths:
      - "leather-stacks-deps-trigger/**"

permissions:
  contents: read

concurrency:
  group: leather-stacks-deps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Install exact public Stacks libraries
        run: |
          set -euo pipefail
          rm -rf leather-stacks-deps-output leather-stacks-deps-work
          mkdir -p leather-stacks-deps-output leather-stacks-deps-work
          cd leather-stacks-deps-work
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact \
            @stacks/transactions@7.5.0 \
            @stacks/network@7.0.2 \
            @stacks/common@7.0.2
          npm ls --all --json > ../leather-stacks-deps-output/npm-tree.json
          cp package.json package-lock.json ../leather-stacks-deps-output/
          tar -czf ../leather-stacks-deps-output/node_modules.tar.gz node_modules
          cd ..
          sha256sum leather-stacks-deps-output/node_modules.tar.gz \
            leather-stacks-deps-output/package.json \
            leather-stacks-deps-output/package-lock.json \
            leather-stacks-deps-output/npm-tree.json \
            > leather-stacks-deps-output/SHA256SUMS.txt

      - name: Upload dependency sandbox
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leather-stacks-deps-20260801
          path: leather-stacks-deps-output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
