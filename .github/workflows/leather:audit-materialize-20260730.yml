name: Leather public audit materialization 20260730

on:
  pull_request:
    paths:
      - "leather-audit-trigger/**"

permissions:
  contents: read

concurrency:
  group: leather-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Copy public Leather audit from immutable repository history
        run: |
          set -euo pipefail
          rm -rf leather-extension leather-audit-output
          git clone --filter=blob:none --no-checkout https://github.com/leather-io/extension.git leather-extension
          cd leather-extension
          git checkout --detach origin/main
          mkdir -p ../leather-audit-output
          cp public/docs/least-authority-security-audit-report.pdf ../leather-audit-output/
          git log -1 --format=fuller -- public/docs/least-authority-security-audit-report.pdf > ../leather-audit-output/AUDIT_FILE_COMMIT.txt
          cd ..
          sha256sum leather-audit-output/least-authority-security-audit-report.pdf > leather-audit-output/SHA256SUMS.txt
          file leather-audit-output/least-authority-security-audit-report.pdf > leather-audit-output/FILE_TYPE.txt

      - name: Upload public audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leather-least-authority-audit-2021
          path: leather-audit-output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
