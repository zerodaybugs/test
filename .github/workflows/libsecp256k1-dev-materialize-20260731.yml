name: Public libsecp256k1 development materialization 20260731

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/libsecp256k1-dev-materialize-20260731.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install public development package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecp256k1-dev
          mkdir -p output/include output/lib
          cp /usr/include/secp256k1*.h output/include/
          cp /usr/lib/x86_64-linux-gnu/libsecp256k1.so* output/lib/
          dpkg-query -W -f='${Package} ${Version}\n' libsecp256k1-dev > output/PACKAGE_VERSION.txt
          find output -type f -print0 | sort -z | xargs -0 sha256sum > output/SHA256SUMS.txt

      - name: Upload public development files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libsecp256k1-dev-public-20260731
          path: output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
