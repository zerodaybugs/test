name: Linux Solidity Toolchain Cache

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Foundry release
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Download exact Solidity compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain/bin
          curl --fail --location --retry 4 --retry-all-errors \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.27+commit.40a35a09' \
            --output toolchain/bin/solc-0.8.27
          chmod 0755 toolchain/bin/solc-0.8.27

      - name: Collect binaries and attest versions
        shell: bash
        run: |
          set -euo pipefail
          for binary in forge cast anvil chisel; do
            source_path="$(command -v "$binary")"
            cp "$source_path" "toolchain/bin/$binary"
            chmod 0755 "toolchain/bin/$binary"
          done

          {
            echo 'Pinned Linux x86_64 Solidity execution toolchain'
            echo 'Generated by a generic public workflow; no project source or target data is included.'
            echo
            uname -a
            echo
            toolchain/bin/forge --version
            toolchain/bin/cast --version
            toolchain/bin/anvil --version
            toolchain/bin/chisel --version
            toolchain/bin/solc-0.8.27 --version
          } | tee toolchain/VERSIONS.txt

          sha256sum toolchain/bin/* | tee toolchain/SHA256SUMS.txt
          tar --sort=name --mtime='UTC 2026-08-05' --owner=0 --group=0 --numeric-owner \
            -czf solidity-linux-x86_64-toolchain.tar.gz toolchain
          sha256sum solidity-linux-x86_64-toolchain.tar.gz > solidity-linux-x86_64-toolchain.tar.gz.sha256

      - name: Upload toolchain archive
        uses: actions/upload-artifact@v4
        with:
          name: solidity-linux-x86_64-toolchain
          path: |
            solidity-linux-x86_64-toolchain.tar.gz
            solidity-linux-x86_64-toolchain.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
