name: Makina R12 Readonly Binding Probe

on:
  push:
    branches:
      - makina-r12-readonly-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public chain state without transactions
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error

          SELECTORS = {
              "caliber": "0xbb881ded",
              "allowedInstrRoot": "0x27f99dfe",
              "restrictedAccountingMode": "0xc926c98b",
          }
          WEIROLL_VM = "0xfd162a672928bf40e5a81f0d11501d2849841fa6"
          TARGETS = [
              {"chain":"ethereum","kvs":"0xa81fc382489f9560211ab15ad87f001b98c92e91","caliber":"0xd1a1c248b253f1fc60eacd90777b9a63f8c8c1bc","rpcs":["https://eth.blockscout.com/api/eth-rpc","https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com"]},
              {"chain":"ethereum","kvs":"0xe5a198558d132e7479900069647c7dc62939b5da","caliber":"0x3d8e2497497a3e29ad5391c08db2a1b3c32598c0","rpcs":["https://eth.blockscout.com/api/eth-rpc","https://ethereum-rpc.publicnode.com"]},
              {"chain":"ethereum","kvs":"0x22b0214f224ccc1ae6026a034929325a560423f6","caliber":"0xd36f095556d5717fd9231a2091e8e98beb7cb621","rpcs":["https://eth.blockscout.com/api/eth-rpc","https://ethereum-rpc.publicnode.com"]},
              {"chain":"ethereum","kvs":"0xf5b4df5e5a446a64c89294fd4a6a1caa56e77437","caliber":"0xd1a2d9df5db842da2ee81075fa441602b2352915","rpcs":["https://eth.blockscout.com/api/eth-rpc","https://ethereum-rpc.publicnode.com"]},
              {"chain":"ethereum","kvs":"0x1b52c5d62458675597ce9b25e81af89fdd8c4029","caliber":"0x5476f4e23daa093ce6700e1026013c55f7af9083","rpcs":["https://eth.blockscout.com/api/eth-rpc","https://ethereum-rpc.publicnode.com"]},
              {"chain":"ethereum","kvs":"0xc1af634aedad129238627b0315c1d269c09460c5","caliber":"0xa58cf14f5980c5f8726e10c5596ec1d91ad44efa","rpcs":["https://eth.blockscout.com/api/eth-rpc","https://ethereum-rpc.publicnode.com"]},
              {"chain":"ethereum","kvs":"0x7cb36b14244c7a68c4fe291c88f75bc915aac262","caliber":"0xd1a3c20488899c038b7daae1ede0c6da6c36c326","rpcs":["https://eth.blockscout.com/api/eth-rpc","https://ethereum-rpc.publicnode.com"]},
              {"chain":"base","kvs":"0x22b0214f224ccc1ae6026a034929325a560423f6","caliber":"0xd36f095556d5717fd9231a2091e8e98beb7cb621","rpcs":["https://base.blockscout.com/api/eth-rpc","https://mainnet.base.org"]},
              {"chain":"arbitrum","kvs":"0x6d7faa359a091d202c6358b37b5411329129b08a","caliber":"0x5476f4e23daa093ce6700e1026013c55f7af9083","rpcs":["https://arbitrum.blockscout.com/api/eth-rpc","https://arb1.arbitrum.io/rpc"]},
          ]

          def post_json(url, payload, timeout=25):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=body, headers={"Content-Type":"application/json","User-Agent":"Makina-R12-readonly"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode())

          def rpc(url, method, params):
              data = post_json(url, {"jsonrpc":"2.0","id":1,"method":method,"params":params})
              if "error" in data:
                  raise RuntimeError(data["error"])
              return data.get("result")

          def eth_call(url, to, data):
              return rpc(url, "eth_call", [{"to":to,"data":data}, "latest"])

          def decode_address(raw):
              if not isinstance(raw, str) or not raw.startswith("0x") or len(raw) < 42:
                  return None
              return "0x" + raw[-40:].lower()

          out = {"timestamp": int(time.time()), "weiroll_vm_expected": WEIROLL_VM, "targets": [], "metadata": {}}
          for target in TARGETS:
              row = {**target, "observations": []}
              for url in target["rpcs"]:
                  obs = {"rpc":url}
                  try:
                      owner_raw = eth_call(url, target["kvs"], SELECTORS["caliber"])
                      obs["kvs_caliber_raw"] = owner_raw
                      obs["kvs_caliber"] = decode_address(owner_raw)
                      obs["owner_is_weiroll_vm"] = obs["kvs_caliber"] == WEIROLL_VM
                      obs["owner_is_declared_caliber"] = obs["kvs_caliber"] == target["caliber"]
                      obs["kvs_code"] = rpc(url, "eth_getCode", [target["kvs"], "latest"])
                      obs["vm_code"] = rpc(url, "eth_getCode", [WEIROLL_VM, "latest"])
                      obs["caliber_code"] = rpc(url, "eth_getCode", [target["caliber"], "latest"])
                      try:
                          obs["allowed_root"] = eth_call(url, target["caliber"], SELECTORS["allowedInstrRoot"])
                      except Exception as e:
                          obs["allowed_root_error"] = repr(e)
                      try:
                          obs["restricted_accounting_mode"] = eth_call(url, target["caliber"], SELECTORS["restrictedAccountingMode"])
                      except Exception as e:
                          obs["restricted_accounting_error"] = repr(e)
                  except Exception as e:
                      obs["error"] = repr(e)
                  row["observations"].append(obs)
              out["targets"].append(row)

          for address, label in [
              ("0xa81fc382489f9560211ab15ad87f001b98c92e91", "dusd_kvs"),
              (WEIROLL_VM, "weiroll_vm")
          ]:
              url = f"https://eth.blockscout.com/api/v2/smart-contracts/{address}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Makina-R12-readonly"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      out["metadata"][label] = json.loads(r.read().decode())
              except Exception as e:
                  out["metadata"][label] = {"error":repr(e)}

          with open("makina-r12-binding.json", "w") as f:
              json.dump(out, f, indent=2, sort_keys=True)
          print("===MAKINA_R12_BINDING_JSON_BEGIN===")
          print(json.dumps(out, indent=2, sort_keys=True))
          print("===MAKINA_R12_BINDING_JSON_END===")
          PY
          python /tmp/probe.py

      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: makina-r12-binding
          path: makina-r12-binding.json
          if-no-files-found: error
          retention-days: 1
