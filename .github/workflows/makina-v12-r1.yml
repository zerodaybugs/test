name: Makina v1.2 isolated audit R1

on:
  push:
    branches:
      - research/makina-v12-r1-20260825

permissions:
  contents: read

env:
  CORE_REF: fe2d7e28c60829f2585cd683b56c6c9a185eb0ea
  PERIPHERY_REF: 392796cfaf86d8dc0e5b51f9530f6989211426e1

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install analysis toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq python3-pip pipx
          pipx install slither-analyzer
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -L https://foundry.paradigm.xyz | bash
          FOUNDRY_BIN="$HOME/.config/.foundry/bin"
          test -x "$FOUNDRY_BIN/foundryup"
          "$FOUNDRY_BIN/foundryup"
          echo "$FOUNDRY_BIN" >> "$GITHUB_PATH"

      - name: Fetch exact scoped releases
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/MakinaHQ/makina-core.git core
          git -C core checkout --detach "$CORE_REF"
          git -C core submodule update --init --recursive
          git clone --recurse-submodules https://github.com/MakinaHQ/makina-periphery.git periphery
          git -C periphery checkout --detach "$PERIPHERY_REF"
          git -C periphery submodule update --init --recursive
          test "$(git -C core rev-parse HEAD)" = "$CORE_REF"
          test "$(git -C periphery rev-parse HEAD)" = "$PERIPHERY_REF"

      - name: Baseline build and tests
        shell: bash
        run: |
          set +e
          mkdir -p results
          (cd core && forge build) >results/core_build.txt 2>&1
          echo $? >results/core_build.exit
          (cd periphery && forge build) >results/periphery_build.txt 2>&1
          echo $? >results/periphery_build.exit
          (cd core && forge test --no-match-path 'test/fork/**') >results/core_tests.txt 2>&1
          echo $? >results/core_tests.exit
          (cd periphery && forge test --no-match-path 'test/fork/**') >results/periphery_tests.txt 2>&1
          echo $? >results/periphery_tests.exit
          exit 0

      - name: Slither and structural differential scan
        shell: bash
        run: |
          set +e
          slither core --exclude-dependencies --json results/core_slither.json >results/core_slither.txt 2>&1
          echo $? >results/core_slither.exit
          slither periphery --exclude-dependencies --json results/periphery_slither.json >results/periphery_slither.txt 2>&1
          echo $? >results/periphery_slither.exit
          python3 scan.py core periphery results >results/custom_scan.txt 2>&1
          echo $? >results/custom_scan.exit
          exit 0

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          r=pathlib.Path('results')
          def code(name):
              p=r/name
              return int(p.read_text().strip()) if p.exists() else None
          summary={
            'core_ref':'${{ env.CORE_REF }}',
            'periphery_ref':'${{ env.PERIPHERY_REF }}',
            'core_build_exit':code('core_build.exit'),
            'periphery_build_exit':code('periphery_build.exit'),
            'core_tests_exit':code('core_tests.exit'),
            'periphery_tests_exit':code('periphery_tests.exit'),
            'core_slither_exit':code('core_slither.exit'),
            'periphery_slither_exit':code('periphery_slither.exit'),
            'custom_scan_exit':code('custom_scan.exit'),
          }
          (r/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: makina-v12-r1-results
          path: results
          if-no-files-found: error
          retention-days: 3
