name: Makina v1.2 rootfile commitment scan

on:
  push:
    branches:
      - research/makina-v12-r1-20260825

permissions:
  contents: read

env:
  CORE_REF: fe2d7e28c60829f2585cd683b56c6c9a185eb0ea
  PERIPHERY_REF: 392796cfaf86d8dc0e5b51f9530f6989211426e1
  INTEGRATIONS_REF: d574704339f4d313bbb6a28d6ec9e8d142dac023

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fetch public integration corpus at a fixed commit
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/MakinaHQ/makina-integrations.git integrations
          git -C integrations checkout --detach "$INTEGRATIONS_REF"
          test "$(git -C integrations rev-parse HEAD)" = "$INTEGRATIONS_REF"

      - name: Scan generated rootfiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 research/makina_rootfile_commitment_scan.py integrations --out results \
            | tee results/rootfile_commitment_scan.stdout.txt
          {
            echo "core_ref=$CORE_REF"
            echo "periphery_ref=$PERIPHERY_REF"
            echo "integrations_ref=$INTEGRATIONS_REF"
          } > results/source_binding.txt
          sha256sum research/makina_rootfile_commitment_scan.py \
            results/rootfile_commitment_scan.json \
            results/rootfile_instruction_summaries.json \
            results/rootfile_commitment_scan.txt \
            results/source_binding.txt \
            > results/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: makina-v12-r2-rootfile-commitment-scan
          path: results
          if-no-files-found: error
          retention-days: 3
