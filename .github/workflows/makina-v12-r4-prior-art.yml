name: Makina v1.2 public audit prior-art extraction

on:
  push:
    branches:
      - research/makina-v12-r1-20260825

permissions:
  contents: read

env:
  CORE_REF: fe2d7e28c60829f2585cd683b56c6c9a185eb0ea
  PERIPHERY_REF: 392796cfaf86d8dc0e5b51f9530f6989211426e1

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install PDF text tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils jq

      - name: Fetch exact public audit corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MakinaHQ/makina-core.git core
          git -C core checkout --detach "$CORE_REF" -- audits
          git clone --filter=blob:none --no-checkout https://github.com/MakinaHQ/makina-periphery.git periphery
          git -C periphery checkout --detach "$PERIPHERY_REF" -- audits
          mkdir -p results/pdfs results/text
          cp core/audits/*.pdf results/pdfs/
          cp periphery/audits/*.pdf results/pdfs/
          test "$(find results/pdfs -maxdepth 1 -name '*.pdf' | wc -l)" -ge 5

      - name: Extract and index findings
        shell: bash
        run: |
          set -euo pipefail
          for pdf in results/pdfs/*.pdf; do
            name="$(basename "$pdf" .pdf)"
            pdftotext -layout "$pdf" "results/text/${name}.txt"
          done
          python3 research/makina_audit_prior_art_extract.py results/text --out results/index \
            | tee results/index/audit_prior_art.stdout.txt
          {
            echo "core_ref=$CORE_REF"
            echo "periphery_ref=$PERIPHERY_REF"
            echo "pdf_count=$(find results/pdfs -maxdepth 1 -name '*.pdf' | wc -l)"
          } > results/source_binding.txt
          find results -type f -print0 | sort -z | xargs -0 sha256sum > results/SHA256SUMS.txt

      - name: Upload prior-art evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: makina-v12-r4-public-audit-prior-art
          path: results
          if-no-files-found: error
          retention-days: 3
