name: Public Monad 3dbbea BFT injector build kit 20260808

on:
  push:
    branches:
      - agent/monad-3dbbea-bft-injector-kit-20260808
    paths:
      - .github/workflows/monad-3dbbea-bft-injector-kit-20260808.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-3dbbea-bft-injector-kit-20260808.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Package clean 3dbbea BFT workspace and locked vendor tree
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -Eeuo pipefail
          bft_commit='3dbbea084128124cf12c137860dcbf615ff51fff'
          execution_gitlink='fa270aa470dd90f316f3326580dc2d4c9e6e12d1'
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

          mkdir -p kit
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git kit/monad-bft
          git -C kit/monad-bft checkout --detach "$bft_commit"
          git -C kit/monad-bft submodule sync monad-execution
          git -C kit/monad-bft submodule update --init --depth 1 monad-execution
          test "$(git -C kit/monad-bft rev-parse HEAD)" = "$bft_commit"
          test "$(git -C kit/monad-bft/monad-execution rev-parse HEAD)" = "$execution_gitlink"
          test "$(git -C kit/monad-bft ls-tree HEAD monad-execution | awk '{print $3}')" = "$execution_gitlink"

          cd kit/monad-bft
          cp Cargo.lock Cargo.lock.bft-3dbbea-pristine
          cp Cargo.lock Cargo.lock.before-fetch

          fetched=false
          for attempt in 1 2 3 4 5; do
            echo "cargo fetch attempt=$attempt"
            if cargo fetch --locked; then
              fetched=true
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$fetched" = true
          cmp Cargo.lock Cargo.lock.before-fetch

          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          cmp Cargo.lock Cargo.lock.before-fetch

          # cargo vendor omits the repository-root README that monoio's
          # src/lib.rs includes only as crate documentation via ../../README.md.
          # Restore that exact file from Cargo's lock-pinned git checkout. This
          # changes no Rust source, feature, dependency, or runtime behavior.
          monoio_readme="$(find "$HOME/.cargo/git/checkouts" -type f -path '*/monoio-*/README.md' -print -quit)"
          test -n "$monoio_readme"
          monoio_checkout="$(dirname "$monoio_readme")"
          monoio_commit="$(git -C "$monoio_checkout" rev-parse HEAD)"
          grep -Fq "git+https://github.com/category-labs/monoio.git?tag=0.2.4-category#$monoio_commit" Cargo.lock
          cp "$monoio_readme" vendor/README.md
          {
            echo "monoio_commit=$monoio_commit"
            sha256sum "$monoio_readme" vendor/README.md
            cmp "$monoio_readme" vendor/README.md
          } > MONOIO_VENDOR_DOC_REPAIR.txt

          cargo metadata --offline --locked --no-deps --format-version 1 \
            > PUBLIC_CARGO_METADATA.offline.json
          cargo check --offline --locked -p monad-raptorcast --lib
          cmp Cargo.lock Cargo.lock.before-fetch

          {
            echo "bft_commit=$bft_commit"
            echo "execution_gitlink=$execution_gitlink"
            echo 'purpose=current BFT/wire-compatible private-local injector build only'
            echo 'official_fullnode_execution=f4013c0157a250754eab8090a640c1789de8eb49'
            echo 'execution_divergence_acknowledged=true'
            echo 'monoio_vendor_doc_only_repair=true'
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } > PUBLIC_BFT_INJECTOR_KIT_METADATA.txt
          sha256sum \
            Cargo.lock \
            Cargo.lock.bft-3dbbea-pristine \
            Cargo.lock.before-fetch \
            .cargo/config.toml \
            vendor/README.md \
            MONOIO_VENDOR_DOC_REPAIR.txt \
            PUBLIC_CARGO_METADATA.offline.json \
            monad-consensus/src/vote_state.rs \
            monad-consensus/src/no_endorsement_state.rs \
            monad-consensus/src/messages/consensus_message.rs \
            monad-consensus/src/validation/signing.rs \
            monad-state/src/lib.rs \
            monad-raptorcast/src/lib.rs \
            > PUBLIC_BFT_INJECTOR_KIT_SHA256.txt

          rm -rf .git target
          find monad-execution -name .git -type f -delete
          find monad-execution -name .git -type d -prune -exec rm -rf {} +
          cd ../..
          tar --zstd -cf monad-3dbbea-bft-injector-kit.tar.zst -C kit monad-bft
          sha256sum monad-3dbbea-bft-injector-kit.tar.zst \
            > monad-3dbbea-bft-injector-kit.tar.zst.sha256
          du -h monad-3dbbea-bft-injector-kit.tar.zst

      - name: Upload clean BFT build kit
        uses: actions/upload-artifact@v4
        with:
          name: monad-3dbbea-bft-injector-kit-20260808
          path: |
            monad-3dbbea-bft-injector-kit.tar.zst
            monad-3dbbea-bft-injector-kit.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
