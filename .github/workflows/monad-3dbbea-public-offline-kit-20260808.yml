name: Public Monad 3dbbea offline source kit 20260808

on:
  push:
    branches:
      - agent/monad-3dbbea-public-offline-kit-20260808
    paths:
      - .github/workflows/monad-3dbbea-public-offline-kit-20260808.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-3dbbea-public-offline-kit-20260808.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public-source-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain and packaging tools
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Clone exact public source and vendor dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p kit
          git clone https://github.com/category-labs/monad-bft.git kit/monad-bft
          git -C kit/monad-bft checkout --detach 3dbbea084128124cf12c137860dcbf615ff51fff
          git -C kit/monad-bft submodule sync --recursive
          git -C kit/monad-bft submodule update --init --recursive
          test "$(git -C kit/monad-bft rev-parse HEAD)" = "3dbbea084128124cf12c137860dcbf615ff51fff"
          test "$(git -C kit/monad-bft/monad-execution rev-parse HEAD)" = "f4013c0157a250754eab8090a640c1789de8eb49"
          cd kit/monad-bft
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          {
            echo 'bft_commit=3dbbea084128124cf12c137860dcbf615ff51fff'
            echo 'execution_commit=f4013c0157a250754eab8090a640c1789de8eb49'
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            git submodule status --recursive
          } > PUBLIC_OFFLINE_KIT_METADATA.txt
          sha256sum Cargo.lock .cargo/config.toml > PUBLIC_OFFLINE_KIT_SHA256.txt
          rm -rf .git
          find . -name .git -type f -delete
          find . -name .git -type d -prune -exec rm -rf {} +
          cd ../..
          tar --zstd -cf monad-3dbbea-source-vendor.tar.zst -C kit monad-bft
          sha256sum monad-3dbbea-source-vendor.tar.zst > monad-3dbbea-source-vendor.tar.zst.sha256
          du -h monad-3dbbea-source-vendor.tar.zst

      - name: Upload exact public source kit
        uses: actions/upload-artifact@v4
        with:
          name: monad-3dbbea-source-vendor-20260808
          path: |
            monad-3dbbea-source-vendor.tar.zst
            monad-3dbbea-source-vendor.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
