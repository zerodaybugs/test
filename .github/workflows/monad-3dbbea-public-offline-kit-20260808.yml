name: Public Monad 3dbbea hybrid offline source kit 20260808

on:
  push:
    branches:
      - agent/monad-3dbbea-public-offline-kit-20260808
    paths:
      - .github/workflows/monad-3dbbea-public-offline-kit-20260808.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-3dbbea-public-offline-kit-20260808.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public-source-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain and packaging tools
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Clone exact public hybrid source and vendor dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          bft_commit='3dbbea084128124cf12c137860dcbf615ff51fff'
          image_execution_commit='f4013c0157a250754eab8090a640c1789de8eb49'
          mkdir -p kit
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git kit/monad-bft
          git -C kit/monad-bft checkout --detach "$bft_commit"
          git -C kit/monad-bft submodule sync monad-execution
          git -C kit/monad-bft submodule update --init --depth 1 monad-execution
          git -C kit/monad-bft/monad-execution fetch --depth 1 origin "$image_execution_commit"
          git -C kit/monad-bft/monad-execution checkout --detach "$image_execution_commit"

          test "$(git -C kit/monad-bft rev-parse HEAD)" = "$bft_commit"
          test "$(git -C kit/monad-bft/monad-execution rev-parse HEAD)" = "$image_execution_commit"
          upstream_gitlink="$(git -C kit/monad-bft ls-tree HEAD monad-execution | awk '{print $3}')"
          test "$upstream_gitlink" = 'fa270aa470dd90f316f3326580dc2d4c9e6e12d1'
          test "$upstream_gitlink" != "$image_execution_commit"
          test -f kit/monad-bft/monad-execution/rust/crates/monad-triedb/Cargo.toml

          cd kit/monad-bft
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          cargo metadata --offline --locked --no-deps --format-version 1 \
            > PUBLIC_CARGO_METADATA.json
          {
            echo "bft_commit=$bft_commit"
            echo "upstream_execution_gitlink=$upstream_gitlink"
            echo "image_execution_commit=$image_execution_commit"
            echo 'hybrid_source=true'
            echo 'hybrid_reason=official image reports BFT commit 3dbbea with modified=true while execution binary provenance resolves to f4013c'
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            git submodule status monad-execution
          } > PUBLIC_OFFLINE_KIT_METADATA.txt
          sha256sum Cargo.lock .cargo/config.toml PUBLIC_CARGO_METADATA.json \
            > PUBLIC_OFFLINE_KIT_SHA256.txt

          rm -rf .git
          find monad-execution -name .git -type f -delete
          find monad-execution -name .git -type d -prune -exec rm -rf {} +
          cd ../..
          tar --zstd -cf monad-3dbbea-f4013-source-vendor.tar.zst -C kit monad-bft
          sha256sum monad-3dbbea-f4013-source-vendor.tar.zst \
            > monad-3dbbea-f4013-source-vendor.tar.zst.sha256
          du -h monad-3dbbea-f4013-source-vendor.tar.zst

      - name: Upload exact public hybrid source kit
        uses: actions/upload-artifact@v4
        with:
          name: monad-3dbbea-f4013-source-vendor-20260808
          path: |
            monad-3dbbea-f4013-source-vendor.tar.zst
            monad-3dbbea-f4013-source-vendor.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
