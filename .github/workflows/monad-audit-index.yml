name: Monad public audit PDF index

on:
  push:
    branches:
      - research/monad-audit-index-20260807
    paths:
      - .github/workflows/monad-audit-index.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-audit-index.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-public-audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ripgrep

      - name: Fetch and index official public audits
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf monad-audits audit-index
          git clone --depth 1 https://github.com/category-labs/monad-audits.git
          mkdir -p audit-index/text audit-index/search

          find monad-audits/client -type f -iname '*.pdf' -print0 \
            | sort -z \
            | while IFS= read -r -d '' pdf; do
                rel="${pdf#monad-audits/}"
                safe="$(printf '%s' "$rel" | sed 's#[/ ]#_#g; s#[^A-Za-z0-9._-]#_#g')"
                out="audit-index/text/${safe%.pdf}.txt"
                printf '%s\t%s\n' "$(sha256sum "$pdf" | cut -d' ' -f1)" "$rel" \
                  >> audit-index/PDF_SHA256_MANIFEST.tsv
                pdftotext -layout -nopgbrk "$pdf" "$out"
              done

          cat > audit-index/search/TERMS.txt <<'EOF'
VoteState
vote_state
NoEndorsement
no_endorsement
pending_votes
invalid_voters
invalid_no_endorsement_senders
node_votes
equivocation
double vote
BLS
signature reuse
reused signature
unbounded
memory exhaustion
out of memory
OOM
resource exhaustion
network halt
liveness
RaptorCast
EOF

          while IFS= read -r term; do
            {
              printf '\n===== TERM: %s =====\n' "$term"
              rg -n -i -C 5 --fixed-strings "$term" audit-index/text || true
            } >> audit-index/search/ALL_MATCHES.txt
          done < audit-index/search/TERMS.txt

          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('audit-index/text')
          terms = [
              'VoteState', 'vote_state', 'NoEndorsement', 'no_endorsement',
              'pending_votes', 'invalid_voters', 'node_votes', 'equivocation',
              'double vote', 'BLS', 'signature reuse', 'reused signature',
              'unbounded', 'memory exhaustion', 'out of memory', 'OOM',
              'resource exhaustion', 'network halt', 'liveness', 'RaptorCast'
          ]
          index = {}
          for path in sorted(root.glob('*.txt')):
              text = path.read_text(errors='replace')
              per_term = {}
              for term in terms:
                  matches = [m.start() for m in re.finditer(re.escape(term), text, re.I)]
                  if matches:
                      per_term[term] = len(matches)
              index[path.name] = {
                  'characters': len(text),
                  'pages_markers': text.count('\f'),
                  'matches': per_term,
              }
          pathlib.Path('audit-index/search/INDEX.json').write_text(
              json.dumps(index, indent=2, sort_keys=True) + '\n'
          )
          PY

          find audit-index -type f -print0 | sort -z | xargs -0 sha256sum \
            > audit-index/SHA256SUMS
          tar -C audit-index -czf monad-public-audit-index.tar.gz .
          sha256sum monad-public-audit-index.tar.gz > monad-public-audit-index.tar.gz.sha256

      - name: Upload searchable audit index
        uses: actions/upload-artifact@v4
        with:
          name: monad-public-audit-index-${{ github.run_id }}
          path: |
            audit-index
            monad-public-audit-index.tar.gz
            monad-public-audit-index.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
