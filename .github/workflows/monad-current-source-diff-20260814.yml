name: Monad public current source and v0.16.0 diff

on:
  push:
    branches:
      - agent/monad-v0160-exact-vendor-20260811
    paths:
      - .github/workflows/monad-current-source-diff-20260814.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone public repositories and pin comparison commits
        shell: bash
        run: |
          set -Eeuo pipefail
          BFT_EXACT='c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
          EXEC_EXACT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          git clone --filter=blob:none https://github.com/category-labs/monad-bft.git monad-bft
          git clone --filter=blob:none https://github.com/category-labs/monad.git monad
          git -C monad-bft cat-file -e "${BFT_EXACT}^{commit}"
          git -C monad cat-file -e "${EXEC_EXACT}^{commit}"
          mkdir -p evidence
          {
            echo "bft_exact=${BFT_EXACT}"
            echo "bft_main=$(git -C monad-bft rev-parse origin/main)"
            echo "exec_exact=${EXEC_EXACT}"
            echo "exec_main=$(git -C monad rev-parse origin/main)"
          } | tee evidence/PROVENANCE.txt

      - name: Generate immutable source archives and diffs
        shell: bash
        run: |
          set -Eeuo pipefail
          BFT_EXACT='c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
          EXEC_EXACT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          BFT_MAIN="$(git -C monad-bft rev-parse origin/main)"
          EXEC_MAIN="$(git -C monad rev-parse origin/main)"

          git -C monad-bft archive --format=tar --prefix=monad-bft-main/ "$BFT_MAIN" \
            | zstd -T0 -19 -o monad-bft-main.tar.zst
          git -C monad archive --format=tar --prefix=monad-main/ "$EXEC_MAIN" \
            | zstd -T0 -19 -o monad-main.tar.zst

          git -C monad-bft diff --find-renames --stat "$BFT_EXACT..$BFT_MAIN" \
            > evidence/BFT_DIFF_STAT.txt
          git -C monad-bft diff --find-renames --name-status "$BFT_EXACT..$BFT_MAIN" \
            > evidence/BFT_DIFF_FILES.txt
          git -C monad-bft diff --find-renames "$BFT_EXACT..$BFT_MAIN" \
            > evidence/BFT_FULL.patch
          git -C monad-bft log --date=iso-strict --format='%H%x09%ad%x09%s' \
            "$BFT_EXACT..$BFT_MAIN" > evidence/BFT_COMMITS.tsv

          git -C monad diff --find-renames --stat "$EXEC_EXACT..$EXEC_MAIN" \
            > evidence/EXEC_DIFF_STAT.txt
          git -C monad diff --find-renames --name-status "$EXEC_EXACT..$EXEC_MAIN" \
            > evidence/EXEC_DIFF_FILES.txt
          git -C monad diff --find-renames "$EXEC_EXACT..$EXEC_MAIN" \
            > evidence/EXEC_FULL.patch
          git -C monad log --date=iso-strict --format='%H%x09%ad%x09%s' \
            "$EXEC_EXACT..$EXEC_MAIN" > evidence/EXEC_COMMITS.tsv

          grep -Ei 'fix|security|consensus|safety|liveness|halt|panic|abort|overflow|underflow|replay|epoch|validator|certificate|state root|divergen|race|conflict|rollback|revert|jit|compiler|interpreter|mip-8|page|storage|gas|balance' \
            evidence/BFT_COMMITS.tsv > evidence/BFT_SECURITY_FILTER.tsv || true
          grep -Ei 'fix|security|consensus|safety|liveness|halt|panic|abort|overflow|underflow|replay|epoch|validator|certificate|state root|divergen|race|conflict|rollback|revert|jit|compiler|interpreter|mip-8|page|storage|gas|balance' \
            evidence/EXEC_COMMITS.tsv > evidence/EXEC_SECURITY_FILTER.tsv || true

          sha256sum monad-bft-main.tar.zst monad-main.tar.zst evidence/* \
            | sort > SHA256SUMS

      - name: Upload public source/diff bundle
        uses: actions/upload-artifact@v4
        with:
          name: monad-current-source-diff-${{ github.run_id }}
          path: |
            monad-bft-main.tar.zst
            monad-main.tar.zst
            evidence
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
