name: Monad exact-scope source export 20260823

on:
  push:
    branches:
      - tooling/monad-exact-scope-source-20260823
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Export exact public in-scope source tags
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/src out/meta

          git clone --filter=blob:none --depth 1 --branch v0.15.2 \
            https://github.com/category-labs/monad-bft.git out/src/monad-bft-v0.15.2
          git clone --filter=blob:none --depth 1 --branch v0.16.0 \
            https://github.com/category-labs/monad.git out/src/monad-v0.16.0

          (
            cd out/src/monad-bft-v0.15.2
            git rev-parse HEAD > ../../meta/MONAD_BFT_COMMIT.txt
            git status --porcelain=v1 > ../../meta/MONAD_BFT_STATUS.txt
            git tag --points-at HEAD > ../../meta/MONAD_BFT_TAGS.txt
            git ls-tree HEAD monad-execution > ../../meta/MONAD_BFT_EXECUTION_SUBMODULE.txt || true
            git show -s --format=fuller HEAD > ../../meta/MONAD_BFT_COMMIT_METADATA.txt
          )
          (
            cd out/src/monad-v0.16.0
            git rev-parse HEAD > ../../meta/MONAD_EXECUTION_COMMIT.txt
            git status --porcelain=v1 > ../../meta/MONAD_EXECUTION_STATUS.txt
            git tag --points-at HEAD > ../../meta/MONAD_EXECUTION_TAGS.txt
            git show -s --format=fuller HEAD > ../../meta/MONAD_EXECUTION_COMMIT_METADATA.txt
          )

          rm -rf out/src/monad-bft-v0.15.2/.git out/src/monad-v0.16.0/.git
          tar --sort=name --mtime='UTC 2026-08-23' --owner=0 --group=0 --numeric-owner \
            -C out/src -czf out/monad-bft-v0.15.2-source.tar.gz monad-bft-v0.15.2
          tar --sort=name --mtime='UTC 2026-08-23' --owner=0 --group=0 --numeric-owner \
            -C out/src -czf out/monad-v0.16.0-source.tar.gz monad-v0.16.0
          sha256sum out/*.tar.gz out/meta/* > out/SHA256SUMS

          test "$(cat out/meta/MONAD_BFT_COMMIT.txt)" = "6373056bf37cce8dc13687c700f772db0c9622f6"
          test "$(cat out/meta/MONAD_EXECUTION_COMMIT.txt)" = "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          test -s out/monad-bft-v0.15.2-source.tar.gz
          test -s out/monad-v0.16.0-source.tar.gz

      - name: Upload exact-scope source artifact
        uses: actions/upload-artifact@v7
        with:
          name: monad-exact-scope-source-20260823
          path: |
            out/monad-bft-v0.15.2-source.tar.gz
            out/monad-v0.16.0-source.tar.gz
            out/meta
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
