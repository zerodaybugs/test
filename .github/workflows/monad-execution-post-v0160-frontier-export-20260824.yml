name: Monad execution post-v0.16 frontier export 20260824

on:
  push:
    branches:
      - tooling/monad-v0160-frontier-source-dossier-20260824
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4

      - name: Clone execution repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/category-labs/monad.git monad
          git -C monad fetch origin \
            e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0 \
            5fbba41ea3b7086d90a09ec7f9eb17d9e0fa0543
          test "$(git -C monad rev-parse e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0)" = \
            "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          test "$(git -C monad rev-parse 5fbba41ea3b7086d90a09ec7f9eb17d9e0fa0543)" = \
            "5fbba41ea3b7086d90a09ec7f9eb17d9e0fa0543"

      - name: Build exact source and diff dossier
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/monad"
          OUT="$PWD/out"
          BASE=e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
          HEAD=5fbba41ea3b7086d90a09ec7f9eb17d9e0fa0543
          MERGE_BASE="$(git -C "$ROOT" merge-base "$BASE" "$HEAD")"
          mkdir -p "$OUT/meta" "$OUT/patches" "$OUT/src/base" "$OUT/src/head"
          printf '%s\n' "$BASE" > "$OUT/meta/BASE.txt"
          printf '%s\n' "$HEAD" > "$OUT/meta/HEAD.txt"
          printf '%s\n' "$MERGE_BASE" > "$OUT/meta/MERGE_BASE.txt"
          git -C "$ROOT" log --reverse --date=iso-strict \
            --format='%H%x09%ad%x09%s' "$MERGE_BASE..$HEAD" \
            > "$OUT/meta/HEAD_COMMITS.tsv"
          git -C "$ROOT" log --reverse --date=iso-strict \
            --format='%H%x09%ad%x09%s' "$MERGE_BASE..$BASE" \
            > "$OUT/meta/BASE_ONLY_COMMITS.tsv"
          git -C "$ROOT" diff --stat "$BASE..$HEAD" -- \
            category/execution category/vm category/mpt category/statesync \
            > "$OUT/meta/DIFF_STAT.txt"
          git -C "$ROOT" diff --name-status "$BASE..$HEAD" -- \
            category/execution category/vm category/mpt category/statesync \
            > "$OUT/meta/CHANGED_FILES.tsv"
          git -C "$ROOT" diff --find-renames "$BASE..$HEAD" -- \
            category/execution category/vm category/mpt category/statesync \
            > "$OUT/patches/FULL_EXECUTION_FRONTIER.patch"

          files=(
            category/execution/ethereum/validate_block.cpp
            category/execution/ethereum/validate_block.hpp
            category/execution/ethereum/transaction_gas.cpp
            category/execution/ethereum/transaction_gas.hpp
            category/execution/ethereum/precompiles_impl.cpp
            category/execution/ethereum/core/ecrecover.cpp
            category/execution/ethereum/core/signature.hpp
            category/execution/ethereum/execute_block.cpp
            category/execution/ethereum/execute_block_header.cpp
            category/execution/ethereum/execute_transaction.cpp
            category/execution/ethereum/dispatch_transaction.cpp
            category/execution/ethereum/block_hash_history.cpp
            category/execution/ethereum/state3/state.cpp
            category/execution/monad/dispatch_transaction.cpp
            category/execution/monad/execute_system_transaction.cpp
            category/execution/monad/staking/staking_contract.cpp
            category/execution/runloop/runloop_monad.cpp
            category/execution/runloop/runloop_monad_ethblocks.cpp
            category/vm/vm.cpp
            category/vm/evm/traits.hpp
            category/vm/runtime/storage_costs.hpp
            category/mpt/update_aux.cpp
            category/statesync/statesync_server_context.cpp
          )
          for f in "${files[@]}"; do
            safe="${f//\//__}"
            if git -C "$ROOT" cat-file -e "$BASE:$f" 2>/dev/null; then
              mkdir -p "$OUT/src/base/$(dirname "$f")"
              git -C "$ROOT" show "$BASE:$f" > "$OUT/src/base/$f"
            fi
            if git -C "$ROOT" cat-file -e "$HEAD:$f" 2>/dev/null; then
              mkdir -p "$OUT/src/head/$(dirname "$f")"
              git -C "$ROOT" show "$HEAD:$f" > "$OUT/src/head/$f"
            fi
            git -C "$ROOT" diff "$BASE..$HEAD" -- "$f" > "$OUT/patches/$safe.patch" || true
          done

          grep -RInE --binary-files=without-match \
            'TODO|FIXME|assert|MONAD_ASSERT|MONAD_ABORT|overflow|underflow|gas|nonce|signature|recover|validate|invalid|revision|precompile|state_root|receipt|witness|parallel|conflict' \
            "$OUT/src/base" "$OUT/src/head" > "$OUT/meta/SECURITY_INDEX.txt" || true
          (cd "$OUT" && find src patches meta -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
            > "$OUT/SHA256SUMS"
          OUT="$OUT" python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['OUT'])
          result = {
              'base': 'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'head': '5fbba41ea3b7086d90a09ec7f9eb17d9e0fa0543',
              'changed_files': len((out/'meta'/'CHANGED_FILES.tsv').read_text().splitlines()),
              'head_commits': len((out/'meta'/'HEAD_COMMITS.tsv').read_text().splitlines()),
              'purpose': 'local-only distinct-root-cause candidate selection; public fixes are never submissions',
          }
          (out/'EXPORT_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          PY
          tar --sort=name --mtime='UTC 2026-08-24' --owner=0 --group=0 --numeric-owner \
            -C "$OUT" -czf monad-execution-post-v0160-frontier-20260824.tar.gz \
            EXPORT_RESULT.json SHA256SUMS meta patches src
          sha256sum monad-execution-post-v0160-frontier-20260824.tar.gz \
            > monad-execution-post-v0160-frontier-20260824.tar.gz.sha256

      - name: Upload execution frontier
        uses: actions/upload-artifact@v4
        with:
          name: monad-execution-post-v0160-frontier-20260824
          path: |
            monad-execution-post-v0160-frontier-20260824.tar.gz
            monad-execution-post-v0160-frontier-20260824.tar.gz.sha256
            out/EXPORT_RESULT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
