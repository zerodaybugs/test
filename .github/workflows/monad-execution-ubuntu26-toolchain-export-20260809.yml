name: Public Monad execution Ubuntu 26 toolchain export 20260809

on:
  push:
    branches:
      - agent/monad-execution-toolchain-20260809
    paths:
      - .github/workflows/monad-execution-ubuntu26-toolchain-export-20260809.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-execution-ubuntu26-toolchain-export-20260809.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-public-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build public Ubuntu 26.04 execution toolchain rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > Dockerfile.monad-toolchain <<'EOF'
          FROM ubuntu:26.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get upgrade -y && apt-get install -y --no-install-recommends \
              apt-utils ca-certificates clang-19 clang-tools-19 clang-tidy-19 cmake curl dialog \
              g++-15 gcc-15 gdb git gnupg libclang-common-19-dev libclang-rt-19-dev \
              llvm-19-dev make ninja-build pkg-config python-is-python3 python3-pytest \
              ripgrep software-properties-common valgrind wget \
              libarchive-dev libbenchmark-dev libbrotli-dev libcap-dev libcgroup-dev \
              libclang-19-dev libcli11-dev libcrypto++-dev libgmock-dev libgmp-dev \
              libgtest-dev libtbb-dev liburing-dev libzstd-dev \
              libboost1.83-dev libboost-context1.83.0 libboost-context1.83-dev \
              libboost-filesystem1.83.0 libboost-filesystem1.83-dev \
              libboost-json1.83.0 libboost-json1.83-dev \
              libboost-stacktrace1.83.0 libboost-stacktrace1.83-dev \
              libboost-test1.83.0 libboost-test1.83-dev zstd \
              && apt-get clean && rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          RUN printf 'toolchain_image=ubuntu:26.04\n' > /MONAD_TOOLCHAIN_METADATA.txt && \
              gcc-15 --version | head -1 >> /MONAD_TOOLCHAIN_METADATA.txt && \
              clang-19 --version | head -1 >> /MONAD_TOOLCHAIN_METADATA.txt && \
              cmake --version | head -1 >> /MONAD_TOOLCHAIN_METADATA.txt && \
              ninja --version >> /MONAD_TOOLCHAIN_METADATA.txt
          EOF

          docker build --pull -f Dockerfile.monad-toolchain \
            -t monad-execution-toolchain:ubuntu26 .
          mkdir -p export
          cid="$(docker create monad-execution-toolchain:ubuntu26)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | zstd -T0 -12 \
            -o export/monad-execution-ubuntu26-toolchain-rootfs.tar.zst
          sha256sum export/monad-execution-ubuntu26-toolchain-rootfs.tar.zst \
            > export/monad-execution-ubuntu26-toolchain-rootfs.tar.zst.sha256
          docker cp "$cid":/MONAD_TOOLCHAIN_METADATA.txt export/MONAD_TOOLCHAIN_METADATA.txt
          docker image inspect monad-execution-toolchain:ubuntu26 \
            > export/image-inspect.json
          find export -type f -print0 | sort -z | xargs -0 sha256sum \
            > export/SHA256SUMS
          du -h export/*

      - name: Upload public toolchain rootfs
        uses: actions/upload-artifact@v4
        with:
          name: monad-execution-ubuntu26-toolchain-20260809
          path: export
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
