name: Public Monad latest image provenance 20260809

on:
  push:
    branches:
      - agent/monad-latest-image-provenance-20260809
    paths:
      - .github/workflows/monad-latest-image-provenance-20260809.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-latest-image-provenance-20260809.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pull immutable public image and record provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          image='categoryxyz/monad:latest'
          mkdir -p provenance/bin provenance/text
          docker pull "$image"
          docker image inspect "$image" > provenance/image-inspect.json
          docker image inspect --format '{{json .RepoDigests}}' "$image" > provenance/repo-digests.json
          docker image inspect --format '{{.Id}}' "$image" > provenance/image-id.txt
          docker image inspect --format '{{json .Config.Labels}}' "$image" > provenance/image-labels.json
          docker image inspect --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' "$image" > provenance/entrypoint-cmd.txt

          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for b in monad monad-mpt monad-node monad-rpc; do
            if docker cp "$cid:/usr/local/bin/$b" "provenance/bin/$b" 2>/dev/null; then
              chmod a-x "provenance/bin/$b"
            fi
          done

          docker run --rm --entrypoint /bin/sh "$image" -lc '
            set +e
            echo "===== os-release ====="
            cat /etc/os-release
            echo "===== command paths ====="
            command -v monad monad-mpt monad-node monad-rpc
            for b in monad monad-mpt monad-node monad-rpc; do
              echo "===== $b --version ====="
              timeout 10 "$b" --version 2>&1
              echo "exit=$?"
              echo "===== $b --help ====="
              timeout 10 "$b" --help 2>&1 | head -160
              echo "exit=${PIPESTATUS[0]}"
            done
          ' > provenance/runtime-cli.txt 2>&1 || true

          sha256sum provenance/bin/* | sort > provenance/BINARY_SHA256SUMS
          for b in provenance/bin/*; do
            name="$(basename "$b")"
            file "$b" > "provenance/text/$name.file.txt"
            readelf -n "$b" > "provenance/text/$name.readelf-notes.txt" 2>&1 || true
            strings -a -n 8 "$b" > "provenance/text/$name.strings.txt"
            grep -Eio 'accept[_ -]?both[_ -]?publish[_ -]?v[01]|always[_ -]?v[01]|[0-9a-f]{40}' \
              "provenance/text/$name.strings.txt" | sort -u \
              > "provenance/text/$name.provenance-candidates.txt" || true
          done

          {
            echo "generated_utc=$(date -u +%FT%TZ)"
            echo "image=$image"
            echo "runner=$(uname -a)"
            echo "docker=$(docker --version)"
          } > provenance/METADATA.txt
          find provenance -type f -print0 | sort -z | xargs -0 sha256sum > provenance/SHA256SUMS

      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: monad-latest-image-provenance-${{ github.run_id }}
          path: provenance
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
