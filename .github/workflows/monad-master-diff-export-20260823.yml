name: Monad master diff export 20260823

on:
  push:
    branches:
      - tooling/monad-master-diff-export-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Export current public master and exact v0.16.0 delta
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/meta out/src
          git clone --recurse-submodules --shallow-submodules --branch master \
            https://github.com/category-labs/monad-bft.git repo
          cd repo
          git fetch --no-tags origin tag v0.16.0
          git rev-parse HEAD > ../out/meta/MASTER_COMMIT.txt
          git rev-parse v0.16.0 > ../out/meta/V0160_COMMIT.txt
          git submodule status --recursive > ../out/meta/MASTER_SUBMODULES.txt
          git diff --name-status v0.16.0..HEAD > ../out/meta/V0160_TO_MASTER_NAME_STATUS.txt
          git log --format='%H%x09%aI%x09%s' v0.16.0..HEAD > ../out/meta/V0160_TO_MASTER_COMMITS.tsv
          git diff --binary --full-index v0.16.0..HEAD > ../out/V0160_TO_MASTER.patch
          cd ..
          cp -a repo out/src/monad-bft-master
          rm -rf out/src/monad-bft-master/.git
          find out/src/monad-bft-master -type d -name .git -prune -exec rm -rf {} +
          tar --sort=name --mtime='UTC 2026-08-23' --owner=0 --group=0 --numeric-owner \
            -C out/src --zstd -cf out/monad-bft-master-full-source.tar.zst monad-bft-master
          sha256sum out/monad-bft-master-full-source.tar.zst out/V0160_TO_MASTER.patch out/meta/* > out/SHA256SUMS
          test "$(cat out/meta/MASTER_COMMIT.txt)" = "532472d5e930eafa358323f47f9949b06fbc9e7b"
          test "$(cat out/meta/V0160_COMMIT.txt)" = "c616743d1358186605e1c1b74a3d6c4fdd9dd48c"
          test -s out/V0160_TO_MASTER.patch
          test -s out/monad-bft-master-full-source.tar.zst

      - name: Upload master source and delta
        uses: actions/upload-artifact@v7
        with:
          name: monad-master-diff-export-20260823
          path: |
            out/monad-bft-master-full-source.tar.zst
            out/V0160_TO_MASTER.patch
            out/meta
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
