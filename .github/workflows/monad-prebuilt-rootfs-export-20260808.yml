name: Public Monad prebuilt rootfs export 20260808

on:
  push:
    branches:
      - agent/monad-prebuilt-rootfs-20260808
    paths:
      - .github/workflows/monad-prebuilt-rootfs-export-20260808.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-prebuilt-rootfs-export-20260808.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-public-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pull and identify official public image
        shell: bash
        run: |
          set -Eeuo pipefail
          image='categoryxyz/monad:latest'
          docker pull "$image"
          mkdir -p export/diagnostics
          docker image inspect "$image" > export/diagnostics/image-inspect.json
          docker image inspect --format '{{json .RepoDigests}}' "$image" \
            > export/diagnostics/repo-digests.json
          docker image inspect --format '{{.Id}}' "$image" \
            > export/diagnostics/image-id.txt
          docker run --rm --entrypoint /bin/sh "$image" -lc '
            set -eu
            for b in monad monad-mpt monad-node monad-rpc; do
              printf "%s=" "$b"
              command -v "$b" || true
            done
            uname -a
            cat /etc/os-release || true
          ' | tee export/diagnostics/runtime-inventory.txt

      - name: Export OCI root filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          image='categoryxyz/monad:latest'
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | zstd -T0 -12 -o export/monad-official-prebuilt-rootfs.tar.zst
          sha256sum export/monad-official-prebuilt-rootfs.tar.zst \
            > export/monad-official-prebuilt-rootfs.tar.zst.sha256
          du -h export/monad-official-prebuilt-rootfs.tar.zst

      - name: Record binary metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          image='categoryxyz/monad:latest'
          docker run --rm --entrypoint /bin/sh "$image" -lc '
            set -eu
            for b in monad monad-mpt monad-node monad-rpc; do
              p="$(command -v "$b" || true)"
              [ -n "$p" ] || continue
              echo "===== $b: $p ====="
              sha256sum "$p"
              file "$p"
              ldd "$p" || true
              "$p" --help 2>&1 | head -80 || true
            done
          ' > export/diagnostics/binary-metadata.txt
          sha256sum export/diagnostics/* > export/diagnostics/SHA256SUMS

      - name: Upload official public rootfs
        uses: actions/upload-artifact@v4
        with:
          name: monad-official-prebuilt-rootfs-20260808
          path: export
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
