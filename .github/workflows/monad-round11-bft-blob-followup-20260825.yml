name: Monad v0.16.0 BFT blob gate follow-up Round 11

on:
  push:
    branches:
      - tooling/monad-round11-authority-blob-gates-20260825
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4

      - name: Clone exact BFT source and execution submodule
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git bft
          git -C bft checkout c616743d1358186605e1c1b74a3d6c4fdd9dd48c
          git -C bft submodule update --init monad-execution
          test "$(git -C bft rev-parse HEAD)" = "c616743d1358186605e1c1b74a3d6c4fdd9dd48c"
          test "$(git -C bft/monad-execution rev-parse HEAD)" = "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          test -z "$(git -C bft status --porcelain=v1)"
          mkdir -p out/logs out/meta out/evidence
          git -C bft show -s --format=fuller HEAD > out/meta/BFT_COMMIT.txt
          git -C bft submodule status > out/meta/BFT_SUBMODULES.txt

      - name: Exact-source blob admission gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('bft')
          validator = (root/'monad-eth-block-validator/src/lib.rs').read_text()
          policy = (root/'monad-eth-block-policy/src/validation.rs').read_text()
          evidence = {
              'exact_bft_commit': 'c616743d1358186605e1c1b74a3d6c4fdd9dd48c',
              'exact_execution_submodule': 'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'eip4844_tx_rejected': 'if tx.is_eip4844()' in policy and 'UnsupportedTransactionType' in policy,
              'blob_gas_used_must_be_zero': re.search(r'if blob_gas_used != &0', validator) is not None,
              'excess_blob_gas_must_be_zero': re.search(r'if excess_blob_gas != &0', validator) is not None,
              'parent_beacon_root_must_be_zero': re.search(r'if parent_beacon_block_root != &\[0_u8; 32\]', validator) is not None,
          }
          evidence['all_blob_admission_controls_present'] = all(
              evidence[k] for k in (
                  'eip4844_tx_rejected',
                  'blob_gas_used_must_be_zero',
                  'excess_blob_gas_must_be_zero',
                  'parent_beacon_root_must_be_zero',
              )
          )
          pathlib.Path('out/evidence/BFT_BLOB_ADMISSION_GATE.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True)+'\n'
          )
          if not evidence['all_blob_admission_controls_present']:
              raise SystemExit(2)
          PY

      - name: Run exact validation package tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup override set 1.91.1
          cd bft
          cargo test --locked \
            -p monad-eth-block-policy \
            -p monad-eth-block-validator \
            > ../out/logs/bft_blob_and_validation_tests.log 2>&1
          cd ..
          printf '0\n' > out/evidence/BFT_PACKAGE_TESTS.rc

      - name: Adjudicate and package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          out = pathlib.Path('out')
          gate = json.loads((out/'evidence/BFT_BLOB_ADMISSION_GATE.json').read_text())
          rc = int((out/'evidence/BFT_PACKAGE_TESTS.rc').read_text().strip())
          result = {
              'project': 'Monad v0.16.0 Round 11 BFT blob follow-up',
              'exact_bft_commit': gate['exact_bft_commit'],
              'exact_execution_submodule': gate['exact_execution_submodule'],
              'blob_admission_controls_present': gate['all_blob_admission_controls_present'],
              'package_tests_passed': rc == 0,
              'candidate_signal': False,
              'submission_ready': False,
              'decision': 'KILL_BLOB_FIELDS_AND_EIP4844_REJECTED_AT_BFT',
          }
          (out/'ADJUDICATION.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          PY
          sha256sum out/evidence/* out/logs/* out/meta/* out/ADJUDICATION.json > out/SHA256SUMS
          tar --sort=name --mtime='UTC 2026-08-25' --owner=0 --group=0 --numeric-owner \
            -C out -czf monad-v0160-round11-bft-blob-followup-20260825.tar.gz \
            ADJUDICATION.json SHA256SUMS evidence logs meta
          sha256sum monad-v0160-round11-bft-blob-followup-20260825.tar.gz \
            > monad-v0160-round11-bft-blob-followup-20260825.tar.gz.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-round11-bft-blob-followup-20260825
          path: |
            monad-v0160-round11-bft-blob-followup-20260825.tar.gz
            monad-v0160-round11-bft-blob-followup-20260825.tar.gz.sha256
            out/ADJUDICATION.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
