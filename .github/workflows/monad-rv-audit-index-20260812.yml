name: Monad Runtime Verification public audit index

on:
  push:
    branches:
      - agent/monad-crossnet-key-overlap-20260812
    paths:
      - .github/workflows/monad-rv-audit-index-20260812.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-public-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and index immutable public audit PDF
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          mkdir -p evidence
          url='https://raw.githubusercontent.com/category-labs/monad-audits/main/client/202511/runtimeverification/RV_Monad_audit_report.pdf'
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            "$url" -o evidence/RV_Monad_audit_report.pdf
          pdfinfo evidence/RV_Monad_audit_report.pdf > evidence/PDFINFO.txt
          pdftotext -layout evidence/RV_Monad_audit_report.pdf evidence/RV_Monad_audit_report.txt
          cat > evidence/TERMS.txt <<'EOF'
epoch
validator set
safety
liveness
forkpoint
checkpoint
certificate
replay
chain id
domain separation
quorum
finality
state sync
EOF
          while IFS= read -r term; do
            {
              printf '\n===== TERM: %s =====\n' "$term"
              grep -in -C 5 -F "$term" evidence/RV_Monad_audit_report.txt || true
            } >> evidence/TERM_CONTEXTS.txt
          done < evidence/TERMS.txt
          sha256sum evidence/* | sort > evidence/SHA256SUMS

      - name: Upload public audit index
        uses: actions/upload-artifact@v4
        with:
          name: monad-rv-public-audit-index-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
