name: Monad v0.15.2 public offline kit

on:
  push:
    branches:
      - agent/monad-v0152-public-offline-kit-20260807
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - name: Build exact source and vendored dependency bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p kit/source
          git clone --depth 1 --branch v0.15.2 https://github.com/category-labs/monad-bft.git kit/source/monad-bft
          cd kit/source/monad-bft
          test "$(git rev-parse HEAD)" = "6373056bfa14318d2a6d7a371cc43c636bf0aab6"
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          {
            echo "target_tag=v0.15.2"
            echo "target_commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } > OFFLINE_KIT_METADATA.txt
          rm -rf .git
          cd ../../..
          tar --zstd -cf monad-v0152-source-vendor.tar.zst -C kit/source monad-bft
          sha256sum monad-v0152-source-vendor.tar.zst > monad-v0152-source-vendor.tar.zst.sha256

      - name: Package exact Rust sysroot
        shell: bash
        run: |
          set -euxo pipefail
          sysroot="$(rustc --print sysroot)"
          test -x "$sysroot/bin/rustc"
          test -x "$sysroot/bin/cargo"
          tar --zstd -cf rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst \
            -C "$(dirname "$sysroot")" "$(basename "$sysroot")"
          sha256sum rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst \
            > rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst.sha256

      - name: Download public Monad audit reports
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p audits
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/category-labs/monad-audits/main/client/202509/zellic/Monad%20Consensus%20-%20Zellic%20Audit%20Report.pdf' \
            -o 'audits/202509-Zellic-Monad-Consensus.pdf'
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/category-labs/monad-audits/main/client/202509/zellic/Monad%20Networking%20-%20Zellic%20Audit%20Report.pdf' \
            -o 'audits/202509-Zellic-Monad-Networking.pdf'
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/category-labs/monad-audits/main/client/202510/ottersec/monad_bft_audit_final.pdf' \
            -o 'audits/202510-OtterSec-Monad-BFT.pdf'
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/category-labs/monad-audits/main/client/202508/spearbit/report-cantinacode-monad-0702.pdf' \
            -o 'audits/202508-Spearbit-Monad.pdf'
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/category-labs/monad-audits/main/client/202509/code4rena/Code4rena%20x%20Monad%20audit%20report%202025-09.pdf' \
            -o 'audits/202509-Code4rena-Monad.pdf'
          sha256sum audits/*.pdf > audits/SHA256SUMS
          file audits/*.pdf

      - name: Upload exact source and vendor bundle
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0152-source-vendor
          path: |
            monad-v0152-source-vendor.tar.zst
            monad-v0152-source-vendor.tar.zst.sha256
          retention-days: 7

      - name: Upload exact Rust toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.91.1-linux-x64
          path: |
            rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst
            rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst.sha256
          retention-days: 7

      - name: Upload public audit PDFs
        uses: actions/upload-artifact@v4
        with:
          name: monad-public-audits
          path: audits
          retention-days: 7
