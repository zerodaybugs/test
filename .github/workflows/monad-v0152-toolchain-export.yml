name: Public Monad v0.15.2 toolchain export

on:
  push:
    branches:
      - monad-v0152-toolchain-export-20260806

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  MONAD_BFT_COMMIT: 6373056bfa14318d2a6d7a371cc43c636bf0aab6
  RUST_TOOLCHAIN: 1.91.1

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          id
          df -h
          free -h
          git --version
          rustup --version

      - name: Checkout pinned public Monad source
        uses: actions/checkout@v4
        with:
          repository: category-labs/monad-bft
          ref: 6373056bfa14318d2a6d7a371cc43c636bf0aab6
          path: monad-bft
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source and toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C monad-bft rev-parse HEAD)" = "$MONAD_BFT_COMMIT"
          git -C monad-bft submodule status --recursive | tee submodules.txt
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN" --path monad-bft
          rustc +"$RUST_TOOLCHAIN" --version --verbose | tee rustc-version.txt
          cargo +"$RUST_TOOLCHAIN" --version --verbose | tee cargo-version.txt

      - name: Populate exact dependency cache and compile existing consensus tests
        shell: bash
        run: |
          set -euxo pipefail
          cargo +"$RUST_TOOLCHAIN" fetch \
            --manifest-path monad-bft/Cargo.toml \
            --locked 2>&1 | tee cargo-fetch.log
          cargo +"$RUST_TOOLCHAIN" test \
            --manifest-path monad-bft/Cargo.toml \
            -p monad-consensus \
            --no-run \
            --locked 2>&1 | tee consensus-compile.log

      - name: Build portable public cache archives
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir -p export manifests

          TOOLCHAIN_DIR="$(rustup toolchain list -v | awk -v t="$RUST_TOOLCHAIN" '$1 ~ ("^" t) {print $NF; exit}')"
          test -n "$TOOLCHAIN_DIR"
          test -x "$TOOLCHAIN_DIR/bin/rustc"
          test -x "$TOOLCHAIN_DIR/bin/cargo"

          tar --zstd -cf export/rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.zst \
            -C "$(dirname "$TOOLCHAIN_DIR")" "$(basename "$TOOLCHAIN_DIR")"

          mkdir -p cargo-cache-root
          if test -d "$HOME/.cargo/registry"; then
            cp -a "$HOME/.cargo/registry" cargo-cache-root/registry
          fi
          if test -d "$HOME/.cargo/git"; then
            cp -a "$HOME/.cargo/git" cargo-cache-root/git
          fi
          tar --zstd -cf export/cargo-cache-v0152.tar.zst -C cargo-cache-root .

          tar --zstd --exclude='.git' --exclude='target' \
            -cf export/monad-bft-v0152-source.tar.zst -C monad-bft .

          cp rustc-version.txt cargo-version.txt submodules.txt cargo-fetch.log \
             consensus-compile.log manifests/
          printf '%s\n' "$MONAD_BFT_COMMIT" > manifests/MONAD_BFT_COMMIT.txt
          printf '%s\n' "$TOOLCHAIN_DIR" > manifests/ORIGINAL_TOOLCHAIN_DIR.txt
          (cd export && sha256sum * > SHA256SUMS.txt)
          (cd manifests && sha256sum * > SHA256SUMS.txt)
          du -h export/* manifests/* | tee archive-sizes.txt

      - name: Upload Rust toolchain
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0152-rust-toolchain
          path: export/rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.zst
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload Cargo dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0152-cargo-cache
          path: export/cargo-cache-v0152.tar.zst
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload exact public source
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0152-source
          path: export/monad-bft-v0152-source.tar.zst
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload manifests and compile logs
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0152-build-manifests
          path: |
            export/SHA256SUMS.txt
            manifests/
            archive-sizes.txt
          if-no-files-found: error
          retention-days: 3
