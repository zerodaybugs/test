name: Monad v0.16.0 exact full-node runtime bundle

on:
  push:
    branches:
      - agent/monad-v0160-exact-fullnode-runtime-20260817
    paths:
      - .github/workflows/monad-v0160-exact-fullnode-runtime-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monad-v0160-exact-fullnode-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exact-bft-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Clone and pin exact Monad v0.16.0 BFT source
        shell: bash
        run: |
          set -Eeuo pipefail
          BFT_COMMIT='c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
          EXEC_COMMIT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$BFT_COMMIT"
          git -C monad-bft submodule sync --recursive
          git -C monad-bft submodule update --init --recursive --depth 1
          test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"
          mkdir -p export-bft/diagnostics
          {
            echo "bft_commit=$(git -C monad-bft rev-parse HEAD)"
            echo "execution_commit=$(git -C monad-bft/monad-execution rev-parse HEAD)"
            git -C monad-bft submodule status --recursive
          } > export-bft/diagnostics/SOURCE_PROVENANCE.txt

      - name: Build exact public devnet runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file monad-bft/docker/devnet/Dockerfile \
            --target runner \
            --build-arg GIT_TAG_VERSION='v0.16.0' \
            --build-arg GIT_COMMIT='c616743d1358186605e1c1b74a3d6c4fdd9dd48c' \
            --build-arg GIT_BRANCH='' \
            --build-arg GIT_TAG='v0.16.0' \
            --build-arg GIT_MODIFIED='false' \
            --tag monad-v0160-exact-bft-runtime:local \
            monad-bft \
            2>&1 | tee export-bft/diagnostics/docker-build.log
          docker image inspect monad-v0160-exact-bft-runtime:local \
            > export-bft/diagnostics/image-inspect.json

      - name: Export exact BFT runtime and binary metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          cid="$(docker create monad-v0160-exact-bft-runtime:local)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | zstd -T0 -12 \
            -o export-bft/monad-v0160-exact-bft-runtime-rootfs.tar.zst
          docker cp "$cid:/usr/local/bin/monad-node" export-bft/monad-node-v0160-exact
          docker cp "$cid:/usr/local/lib" export-bft/usr-local-lib
          chmod +x export-bft/monad-node-v0160-exact
          sha256sum \
            export-bft/monad-v0160-exact-bft-runtime-rootfs.tar.zst \
            export-bft/monad-node-v0160-exact \
            > export-bft/SHA256SUMS
          file export-bft/monad-node-v0160-exact \
            > export-bft/diagnostics/monad-node.file.txt
          docker run --rm monad-v0160-exact-bft-runtime:local \
            /usr/local/bin/monad-node --version \
            > export-bft/diagnostics/monad-node.version.txt 2>&1
          docker run --rm monad-v0160-exact-bft-runtime:local \
            /usr/local/bin/monad-node --help \
            > export-bft/diagnostics/monad-node.help.txt 2>&1
          du -h export-bft/monad-v0160-exact-bft-runtime-rootfs.tar.zst \
            export-bft/monad-node-v0160-exact

      - name: Upload exact BFT runtime
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-exact-bft-runtime-${{ github.run_id }}
          path: export-bft
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  export-public-execution-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Pull and identify public execution image
        shell: bash
        run: |
          set -Eeuo pipefail
          image='categoryxyz/monad:latest'
          mkdir -p export-execution/diagnostics
          docker pull "$image"
          docker image inspect "$image" > export-execution/diagnostics/image-inspect.json
          docker image inspect --format '{{json .RepoDigests}}' "$image" \
            > export-execution/diagnostics/repo-digests.json
          docker run --rm --entrypoint /bin/sh "$image" -lc '
            set -eu
            for b in monad monad-mpt monad-node monad-rpc; do
              printf "%s=" "$b"
              command -v "$b" || true
            done
            uname -a
            cat /etc/os-release || true
          ' > export-execution/diagnostics/runtime-inventory.txt

      - name: Export execution runtime rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          image='categoryxyz/monad:latest'
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | zstd -T0 -12 \
            -o export-execution/monad-public-execution-runtime-rootfs.tar.zst
          for path in /usr/local/bin/monad /usr/local/bin/monad-mpt; do
            docker cp "$cid:$path" export-execution/ || true
          done
          sha256sum export-execution/*rootfs.tar.zst \
            > export-execution/SHA256SUMS
          sha256sum export-execution/monad export-execution/monad-mpt \
            >> export-execution/SHA256SUMS 2>/dev/null || true
          du -h export-execution/monad-public-execution-runtime-rootfs.tar.zst

      - name: Upload public execution runtime
        uses: actions/upload-artifact@v4
        with:
          name: monad-public-execution-runtime-${{ github.run_id }}
          path: export-execution
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
