name: Public Monad v0.16.0 exact Cargo vendor bundle

on:
  push:
    branches:
      - agent/monad-v0160-exact-vendor-20260811
    paths:
      - .github/workflows/monad-v0160-exact-vendor-20260811.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-v0160-exact-vendor-20260811.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monad-v0160-exact-vendor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-public-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out packaging workflow
        uses: actions/checkout@v4

      - name: Install pinned Rust and packaging tools
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          rustc --version --verbose
          cargo --version --verbose

      - name: Clone immutable public Monad v0.16.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          BFT_COMMIT='c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
          EXEC_COMMIT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'

          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$BFT_COMMIT"
          git -C monad-bft submodule sync --recursive
          git -C monad-bft submodule update --init --recursive --depth 1

          test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"

          mkdir -p evidence
          {
            echo "bft_commit=$(git -C monad-bft rev-parse HEAD)"
            echo "execution_commit=$(git -C monad-bft/monad-execution rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            git -C monad-bft submodule status --recursive
          } > evidence/SOURCE_PROVENANCE.txt

          sha256sum \
            monad-bft/Cargo.lock \
            monad-bft/monad-execution/rust/Cargo.lock \
            > evidence/LOCKFILES.sha256

      - name: Vendor and verify root BFT Cargo workspace
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -Eeuo pipefail
          cd monad-bft
          mkdir -p .cargo
          cargo vendor --locked vendor-root > .cargo/config.toml
          cargo metadata --offline --locked --no-deps --format-version 1 \
            > ../evidence/ROOT_METADATA.offline.json
          test -s ../evidence/ROOT_METADATA.offline.json
          find vendor-root -mindepth 1 -maxdepth 1 -type d | sort \
            > ../evidence/ROOT_VENDOR_DIRECTORIES.txt
          sha256sum .cargo/config.toml Cargo.lock \
            > ../evidence/ROOT_VENDOR_INPUTS.sha256

      - name: Vendor and verify nested execution Cargo workspace
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -Eeuo pipefail
          # The nested execution lockfile is an independent Cargo workspace.
          # Prevent the root workspace source replacement from being inherited.
          mv monad-bft/.cargo/config.toml monad-bft/.cargo/config.root.toml
          cd monad-bft/monad-execution/rust
          mkdir -p .cargo
          cargo vendor --locked vendor-exec > .cargo/config.toml
          cargo metadata --offline --locked --no-deps --format-version 1 \
            > ../../../evidence/EXECUTION_METADATA.offline.json
          test -s ../../../evidence/EXECUTION_METADATA.offline.json
          find vendor-exec -mindepth 1 -maxdepth 1 -type d | sort \
            > ../../../evidence/EXECUTION_VENDOR_DIRECTORIES.txt
          sha256sum .cargo/config.toml Cargo.lock \
            > ../../../evidence/EXECUTION_VENDOR_INPUTS.sha256
          cd ../../..
          mv .cargo/config.root.toml .cargo/config.toml

      - name: Build deterministic compressed vendor bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          BUNDLE='monad-v0160-exact-cargo-vendor-20260811.tar.zst'

          tar \
            --sort=name \
            --mtime='UTC 2026-08-11' \
            --owner=0 --group=0 --numeric-owner \
            -C . \
            --zstd -cf "$BUNDLE" \
            monad-bft/Cargo.lock \
            monad-bft/.cargo/config.toml \
            monad-bft/vendor-root \
            monad-bft/monad-execution/rust/Cargo.lock \
            monad-bft/monad-execution/rust/.cargo/config.toml \
            monad-bft/monad-execution/rust/vendor-exec \
            evidence

          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          du -h "$BUNDLE"
          sha256sum evidence/* | sort > evidence/SHA256SUMS

      - name: Upload exact public vendor bundle
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-exact-cargo-vendor-20260811-${{ github.run_id }}
          path: |
            monad-v0160-exact-cargo-vendor-20260811.tar.zst
            monad-v0160-exact-cargo-vendor-20260811.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
