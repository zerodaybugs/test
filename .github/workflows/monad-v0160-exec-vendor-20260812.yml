name: Monad v0.16.0 exact execution Cargo vendor

on:
  push:
    branches:
      - agent/monad-v0160-exact-vendor-20260811
    paths:
      - .github/workflows/monad-v0160-exec-vendor-20260812.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust and zstd
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Fetch exact execution source and vendor its independent lockfile
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -Eeuo pipefail
          BFT_COMMIT='c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
          EXEC_COMMIT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$BFT_COMMIT"
          git -C monad-bft submodule update --init --depth 1 monad-execution
          test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"

          cd monad-bft/monad-execution/rust
          mkdir -p .cargo
          cargo vendor --locked vendor-exec > .cargo/config.toml
          cargo metadata --offline --locked --no-deps --format-version 1 \
            > EXECUTION_METADATA.offline.json
          test -s EXECUTION_METADATA.offline.json
          sha256sum Cargo.lock .cargo/config.toml EXECUTION_METADATA.offline.json \
            > EXECUTION_VENDOR_INPUTS.sha256
          find vendor-exec -type f -print0 | sort -z | xargs -0 sha256sum \
            > EXECUTION_VENDOR_FILES.sha256
          {
            echo "bft_commit=$BFT_COMMIT"
            echo "execution_commit=$EXEC_COMMIT"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } > EXECUTION_VENDOR_METADATA.txt

          tar --sort=name --mtime='UTC 2026-08-12' \
            --owner=0 --group=0 --numeric-owner --zstd \
            -cf ../../../monad-v0160-execution-vendor-20260812.tar.zst \
            Cargo.lock .cargo/config.toml vendor-exec \
            EXECUTION_METADATA.offline.json EXECUTION_VENDOR_INPUTS.sha256 \
            EXECUTION_VENDOR_FILES.sha256 EXECUTION_VENDOR_METADATA.txt
          cd ../../..
          sha256sum monad-v0160-execution-vendor-20260812.tar.zst \
            > monad-v0160-execution-vendor-20260812.tar.zst.sha256
          du -h monad-v0160-execution-vendor-20260812.tar.zst

      - name: Upload exact execution vendor
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-execution-vendor-20260812-${{ github.run_id }}
          path: |
            monad-v0160-execution-vendor-20260812.tar.zst
            monad-v0160-execution-vendor-20260812.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
