name: Monad v0.16.0 execution duplicate ledger 20260823

on:
  push:
    branches:
      - tooling/monad-v0160-execution-duplicate-ledger-20260823
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          ref: tooling/monad-v0160-execution-duplicate-ledger-20260823
          fetch-depth: 0

      - name: Install audit text tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Search public issues, pull requests and audit reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p duplicate_scan/github duplicate_scan/audits/text duplicate_scan/audits/hits

          queries=(
            '"compiler" "interpreter" mismatch'
            '"state root" divergence'
            '"state root" mismatch'
            '"MONAD_TEN" compiler'
            '"MONAD_NINE" compiler'
            '"page-encoded" mismatch'
            '"slot-encoded" mismatch'
            '"MIP-8" state root'
            '"undefined behavior" VM'
            'AddressSanitizer VM'
            'execution nondeterminism'
            'parallel execution state root'
          )
          repos=(category-labs/monad category-labs/monad-bft)
          : > duplicate_scan/github/queries.tsv
          for repo in "${repos[@]}"; do
            for q in "${queries[@]}"; do
              safe=$(printf '%s_%s' "$repo" "$q" | tr '/ "' '____' | tr -cd '[:alnum:]_.-')
              gh api search/issues -f q="repo:${repo} ${q}" -f per_page=100 \
                > "duplicate_scan/github/${safe}.json" || true
              printf '%s\t%s\t%s\n' "$repo" "$q" "github/${safe}.json" >> duplicate_scan/github/queries.tsv
            done
          done

          git clone --depth 1 https://github.com/category-labs/monad-audits.git duplicate_scan/audits/repo
          find duplicate_scan/audits/repo -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' pdf; do
            rel=${pdf#duplicate_scan/audits/repo/}
            out="duplicate_scan/audits/text/${rel//\//__}.txt"
            pdftotext -layout "$pdf" "$out" || true
          done

          patterns=(
            'compiler.{0,80}interpreter|interpreter.{0,80}compiler'
            'state[ -]?root.{0,80}(diverg|mismatch|differ)'
            '(diverg|mismatch|differ).{0,80}state[ -]?root'
            'page[ -]?encoded.{0,100}(slot|mismatch|differ|diverg)'
            'slot[ -]?encoded.{0,100}(page|mismatch|differ|diverg)'
            'MIP-8.{0,120}(mismatch|differ|diverg|root)'
            'non[- ]?determin'
            'undefined behavior'
            'AddressSanitizer|ASan|UBSan'
            'parallel execution.{0,100}(mismatch|differ|diverg|root)'
          )
          : > duplicate_scan/audits/PATTERNS.txt
          printf '%s\n' "${patterns[@]}" > duplicate_scan/audits/PATTERNS.txt
          for i in "${!patterns[@]}"; do
            rg -n -i -C 3 --pcre2 "${patterns[$i]}" duplicate_scan/audits/text \
              > "duplicate_scan/audits/hits/pattern_${i}.txt" || true
          done

      - name: Build machine ledger and Proof Card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('duplicate_scan')
          github_hits = []
          for path in sorted((root/'github').glob('*.json')):
              try:
                  obj = json.loads(path.read_text())
              except Exception:
                  continue
              for item in obj.get('items', []):
                  github_hits.append({
                      'query_file': path.name,
                      'number': item.get('number'),
                      'title': item.get('title'),
                      'url': item.get('html_url'),
                      'state': item.get('state'),
                      'is_pull_request': 'pull_request' in item,
                      'created_at': item.get('created_at'),
                      'updated_at': item.get('updated_at'),
                      'body_excerpt': (item.get('body') or '')[:800],
                  })

          audit_hits = []
          for path in sorted((root/'audits'/'hits').glob('*.txt')):
              text = path.read_text(errors='replace')
              if text.strip():
                  audit_hits.append({
                      'pattern_file': path.name,
                      'match_lines': len(text.splitlines()),
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'excerpt': text[:5000],
                  })

          exact_terms = re.compile(
              r'(compiler.{0,80}interpreter|interpreter.{0,80}compiler|'
              r'state[ -]?root.{0,80}(diverg|mismatch)|'
              r'(diverg|mismatch).{0,80}state[ -]?root|'
              r'page[ -]?encoded.{0,100}(slot|mismatch|diverg)|'
              r'slot[ -]?encoded.{0,100}(page|mismatch|diverg))',
              re.I | re.S,
          )
          high_relevance = []
          for hit in github_hits:
              hay = f"{hit.get('title','')}\n{hit.get('body_excerpt','')}"
              if exact_terms.search(hay):
                  high_relevance.append(hit)

          result = {
              'scan_date': '2026-08-23',
              'repositories': ['category-labs/monad', 'category-labs/monad-bft'],
              'audit_repository': 'category-labs/monad-audits',
              'github_result_rows': len(github_hits),
              'github_high_relevance_rows': high_relevance,
              'audit_pattern_files_with_hits': audit_hits,
              'automatic_exact_duplicate_proven': False,
              'manual_review_required': bool(high_relevance or audit_hits),
              'decision': (
                  'MANUAL_ROOT_CAUSE_AND_NATURAL_FIX_COMPARISON_REQUIRED'
                  if high_relevance or audit_hits else
                  'NO_PUBLIC_FINGERPRINT_HIT_IN_BOUNDED_SCAN'
              ),
              'rule': (
                  'A hit is not a duplicate. FINAL KILL requires the same root cause, security primitive, '
                  'attacker trigger, and natural fix scope. Generic VM divergence or MIP-8 discussion is insufficient.'
              ),
          }
          (root/'MONAD_V0160_EXECUTION_PUBLIC_DUPLICATE_LEDGER_2026-08-23.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )

          md = [
              '# Monad v0.16.0 execution public duplicate ledger', '',
              f"**Decision:** `{result['decision']}`", '',
              f"- GitHub result rows: **{len(github_hits)}**",
              f"- High-relevance GitHub rows: **{len(high_relevance)}**",
              f"- Audit pattern files with hits: **{len(audit_hits)}**",
              '- Exact duplicate automatically proven: **no**', '',
              '## Duplicate rule', '', result['rule'], '',
              '## Proof Card', '',
              '**Unique wedge 1:** native `MONAD_NINE` / `MONAD_TEN` interpreter-versus-compiler equivalence, including page-encoded test state.', '',
              '**Unique wedge 2:** baseline-isolated sanitizer evidence bound to exact valid EVM seeds, followed by normal `monad-bft` admission and finality gates.', '',
              'Neither wedge is a vulnerability claim until an exact minimized differential and High/Critical impact are reproduced.', '',
          ]
          if high_relevance:
              md += ['## High-relevance GitHub candidates', '']
              for h in high_relevance:
                  md.append(f"- #{h['number']} — {h['title']} — {h['url']}")
              md.append('')
          if audit_hits:
              md += ['## Audit fingerprint hit groups', '']
              for h in audit_hits:
                  md.append(f"- `{h['pattern_file']}` — {h['match_lines']} context lines — SHA-256 `{h['sha256']}`")
              md.append('')
          (root/'MONAD_V0160_EXECUTION_PUBLIC_DUPLICATE_LEDGER_2026-08-23.md').write_text('\n'.join(md))

          sums=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name != 'SHA256SUMS':
                  sums.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}")
          (root/'SHA256SUMS').write_text('\n'.join(sums)+'\n')
          PY

      - name: Commit compact ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add duplicate_scan/MONAD_V0160_EXECUTION_PUBLIC_DUPLICATE_LEDGER_2026-08-23.json \
                  duplicate_scan/MONAD_V0160_EXECUTION_PUBLIC_DUPLICATE_LEDGER_2026-08-23.md \
                  duplicate_scan/SHA256SUMS duplicate_scan/github/queries.tsv \
                  duplicate_scan/audits/PATTERNS.txt duplicate_scan/audits/hits
          git commit -m 'research: add Monad execution duplicate ledger [skip ci]'
          git push origin HEAD:tooling/monad-v0160-execution-duplicate-ledger-20260823

      - name: Upload full duplicate scan
        uses: actions/upload-artifact@v7
        with:
          name: monad-v0160-execution-duplicate-ledger-20260823
          path: duplicate_scan
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
