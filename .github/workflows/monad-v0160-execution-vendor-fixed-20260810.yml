name: Public Monad v0.16.0 execution vendor fixed 20260810

on:
  push:
    branches:
      - agent/monad-v0160-execution-vendor-fixed-20260810
    paths:
      - .github/workflows/monad-v0160-execution-vendor-fixed-20260810.yml
      - monad-v0160-execution-vendor-fixed-20260810.txt
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-v0160-execution-vendor-fixed-20260810.yml
      - monad-v0160-execution-vendor-fixed-20260810.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-exact-execution-vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned public toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Export exact nested execution Cargo vendor
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -Eeuo pipefail
          bft_commit='c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
          execution_commit='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          git config --global http.version HTTP/1.1
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$bft_commit"
          git -C monad-bft submodule sync monad-execution
          git -C monad-bft submodule update --init --depth 1 monad-execution
          test "$(git -C monad-bft rev-parse HEAD)" = "$bft_commit"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$execution_commit"

          pushd monad-bft/monad-execution/rust
          cargo fetch --locked
          cargo vendor --locked --versioned-dirs execution-vendor \
            > execution-vendor.config.toml
          cargo metadata --offline --locked --no-deps --format-version 1 \
            --config 'source.crates-io.replace-with="vendored-sources"' \
            --config 'source.vendored-sources.directory="execution-vendor"' \
            > EXECUTION_CARGO_METADATA.offline.json
          {
            echo "bft_commit=$bft_commit"
            echo "execution_commit=$execution_commit"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "generated_utc=$(date -u +%FT%TZ)"
          } > EXECUTION_VENDOR_METADATA.txt
          sha256sum Cargo.lock execution-vendor.config.toml \
            EXECUTION_CARGO_METADATA.offline.json \
            > EXECUTION_VENDOR_INPUTS.sha256
          find execution-vendor -type f -print0 | sort -z | xargs -0 sha256sum \
            > EXECUTION_VENDOR_FILES.sha256
          tar --zstd -cf "$GITHUB_WORKSPACE/monad-v0160-public-execution-vendor.tar.zst" \
            execution-vendor execution-vendor.config.toml \
            EXECUTION_CARGO_METADATA.offline.json EXECUTION_VENDOR_METADATA.txt \
            EXECUTION_VENDOR_INPUTS.sha256 EXECUTION_VENDOR_FILES.sha256
          popd
          sha256sum monad-v0160-public-execution-vendor.tar.zst \
            > monad-v0160-public-execution-vendor.tar.zst.sha256
          test -s monad-v0160-public-execution-vendor.tar.zst
          du -h monad-v0160-public-execution-vendor.tar.zst

      - name: Upload exact public execution vendor
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-public-execution-vendor-fixed-20260810
          path: |
            monad-v0160-public-execution-vendor.tar.zst
            monad-v0160-public-execution-vendor.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
