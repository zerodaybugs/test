name: Monad v0.16.0 frontier source dossier 20260824

on:
  push:
    branches:
      - tooling/monad-v0160-frontier-source-dossier-20260824
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4

      - name: Clone exact scoped source only
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          cd monad-bft
          git checkout c616743d1358186605e1c1b74a3d6c4fdd9dd48c
          git submodule update --init monad-execution
          test "$(git rev-parse HEAD)" = "c616743d1358186605e1c1b74a3d6c4fdd9dd48c"
          test "$(git -C monad-execution rev-parse HEAD)" = "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          test -z "$(git status --porcelain=v1)"

      - name: Build bounded source dossier and indices
        shell: bash
        run: |
          set -euo pipefail
          WORK="$PWD"
          ROOT="$WORK/monad-bft"
          OUT="$WORK/out"
          mkdir -p "$OUT/src/bft" "$OUT/src/execution" "$OUT/index" "$OUT/meta"

          printf '%s\n' c616743d1358186605e1c1b74a3d6c4fdd9dd48c > "$OUT/meta/MONAD_BFT_COMMIT.txt"
          printf '%s\n' e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0 > "$OUT/meta/MONAD_EXECUTION_COMMIT.txt"
          git -C "$ROOT" status --porcelain=v1 > "$OUT/meta/BFT_STATUS.txt"
          git -C "$ROOT" submodule status > "$OUT/meta/SUBMODULES.txt"
          git -C "$ROOT" show -s --format=fuller HEAD > "$OUT/meta/BFT_COMMIT.txt"
          git -C "$ROOT/monad-execution" show -s --format=fuller HEAD > "$OUT/meta/EXECUTION_COMMIT.txt"

          bft_dirs=(
            monad-bls monad-crypto monad-validator monad-consensus-types
            monad-consensus monad-consensus-state monad-raptorcast
            monad-eth-block-policy monad-eth-block-validator
            monad-state monad-types monad-node monad-updaters
          )
          for d in "${bft_dirs[@]}"; do
            if [[ -d "$ROOT/$d" ]]; then
              rsync -a --exclude target --exclude .git "$ROOT/$d/" "$OUT/src/bft/$d/"
            fi
          done
          cp "$ROOT/Cargo.toml" "$ROOT/Cargo.lock" "$OUT/src/bft/"

          exec_dirs=(
            category/execution/ethereum category/execution/monad
            category/execution/runloop category/vm category/mpt category/core
            test/vm test/ethereum_test
          )
          for d in "${exec_dirs[@]}"; do
            if [[ -d "$ROOT/monad-execution/$d" ]]; then
              mkdir -p "$OUT/src/execution/$d"
              rsync -a --exclude build --exclude .git "$ROOT/monad-execution/$d/" "$OUT/src/execution/$d/"
            fi
          done
          cp "$ROOT/monad-execution/CMakeLists.txt" "$OUT/src/execution/"

          scan() {
            output="$1"; pattern="$2"; shift 2
            grep -RInE --binary-files=without-match \
              --exclude-dir=.git --exclude-dir=target --exclude-dir=third_party \
              "$pattern" "$@" > "$OUT/index/$output" || true
          }

          scan BLS_VALIDATOR_KEY_INDEX.txt \
            'Proof.?of.?Possession|proof.?of.?possession|PoP|rogue.?key|aggregate|fast_aggregate|Bls|certificate.?key|public.?key' \
            "$ROOT/monad-bls" "$ROOT/monad-crypto" "$ROOT/monad-validator" \
            "$ROOT/monad-consensus" "$ROOT/monad-consensus-types" "$ROOT/monad-updaters" \
            "$ROOT/monad-execution/category/execution/monad/staking"

          scan SIGNATURE_DOMAIN_INDEX.txt \
            'signing_domain|CertificateSignature.*sign|CertificateSignature.*verify|verify::<|Domain|Vote|Timeout|NoEndorsement|RoundSignature' \
            "$ROOT/monad-crypto" "$ROOT/monad-consensus" "$ROOT/monad-consensus-types" "$ROOT/monad-validator"

          scan RAPTOR_AND_CERT_CACHE_INDEX.txt \
            'cache|Cache|LRU|Lru|signature.*cache|verify.*cache|commitment|dedup|replay' \
            "$ROOT/monad-raptorcast" "$ROOT/monad-consensus" "$ROOT/monad-consensus-state" "$ROOT/monad-crypto"

          scan PARALLEL_CONFLICT_INDEX.txt \
            'conflict|read.?set|write.?set|parallel|scheduler|dependency|footprint|storage.?key|access.?list|speculative' \
            "$ROOT/monad-execution/category/execution" "$ROOT/monad-execution/category/vm" "$ROOT/monad-execution/category/mpt"

          scan BFT_FAILSTOP_INDEX.txt \
            'panic!|unwrap\(|expect\(|unreachable!|assert!\(|MONAD_ASSERT|MONAD_ABORT' \
            "$ROOT/monad-consensus" "$ROOT/monad-consensus-state" "$ROOT/monad-raptorcast" \
            "$ROOT/monad-validator" "$ROOT/monad-state" "$ROOT/monad-updaters"

          scan FRONTIER_MARKERS_INDEX.txt \
            'TODO|FIXME|XXX|unimplemented|not yet implemented' \
            "$ROOT/monad-consensus" "$ROOT/monad-consensus-state" "$ROOT/monad-raptorcast" \
            "$ROOT/monad-validator" "$ROOT/monad-state" "$ROOT/monad-updaters" \
            "$ROOT/monad-execution/category/execution" "$ROOT/monad-execution/category/vm" "$ROOT/monad-execution/category/mpt"

          (cd "$OUT/src" && find . -type f -printf '%P\n' | LC_ALL=C sort) \
            > "$OUT/meta/SOURCE_FILE_LIST.txt"
          (cd "$OUT/src" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
            > "$OUT/meta/SOURCE_SHA256SUMS.txt"

          OUT="$OUT" python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['OUT'])
          result = {
              'project': 'Monad v0.16.0 frontier source dossier',
              'monad_bft_commit': 'c616743d1358186605e1c1b74a3d6c4fdd9dd48c',
              'monad_execution_commit': 'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'source_files': sum(1 for p in (out/'src').rglob('*') if p.is_file()),
              'indices': {},
              'purpose': 'local-only fail-closed candidate selection; not a finding and not submission evidence',
          }
          for p in sorted((out/'index').glob('*.txt')):
              text = p.read_text(errors='replace')
              result['indices'][p.name] = {'lines': len(text.splitlines()), 'bytes': p.stat().st_size}
          (out/'DOSSIER_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          PY

          tar --sort=name --mtime='UTC 2026-08-24' --owner=0 --group=0 --numeric-owner \
            -C "$OUT" -czf "$WORK/monad-v0160-frontier-source-dossier-20260824.tar.gz" \
            DOSSIER_RESULT.json index meta src
          sha256sum "$WORK/monad-v0160-frontier-source-dossier-20260824.tar.gz" \
            > "$WORK/monad-v0160-frontier-source-dossier-20260824.tar.gz.sha256"

      - name: Upload source dossier
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-frontier-source-dossier-20260824
          path: |
            monad-v0160-frontier-source-dossier-20260824.tar.gz
            monad-v0160-frontier-source-dossier-20260824.tar.gz.sha256
            out/DOSSIER_RESULT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
