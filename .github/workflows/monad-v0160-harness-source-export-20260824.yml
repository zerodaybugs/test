name: Monad v0.16.0 adversarial harness source export 20260824

on:
  push:
    branches:
      - tooling/monad-v0160-frontier-source-dossier-20260824
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4

      - name: Clone exact scoped BFT source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout c616743d1358186605e1c1b74a3d6c4fdd9dd48c
          test "$(git -C monad-bft rev-parse HEAD)" = \
            "c616743d1358186605e1c1b74a3d6c4fdd9dd48c"
          test -z "$(git -C monad-bft status --porcelain=v1)"

      - name: Export adversarial harness source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/monad-bft"
          OUT="$PWD/out"
          mkdir -p "$OUT/src" "$OUT/meta"
          dirs=(
            monad-mock-swarm monad-randomized-tests monad-twins monad-fuzz
            monad-testutil monad-blocktree monad-blocksync monad-chain-config
            monad-router-multi monad-router-scheduler monad-consensus
            monad-consensus-state monad-consensus-types monad-validator
            monad-types monad-crypto monad-secp monad-bls monad-transformer
            monad-eth-testutil monad-eth-block-policy monad-eth-block-validator
          )
          for d in "${dirs[@]}"; do
            test -d "$ROOT/$d"
            rsync -a --exclude target --exclude .git "$ROOT/$d/" "$OUT/src/$d/"
          done
          cp "$ROOT/Cargo.toml" "$ROOT/Cargo.lock" "$ROOT/rust-toolchain.toml" "$OUT/src/"
          git -C "$ROOT" show -s --format=fuller HEAD > "$OUT/meta/COMMIT.txt"
          git -C "$ROOT" status --porcelain=v1 > "$OUT/meta/STATUS.txt"
          (cd "$OUT/src" && find . -type f -printf '%P\n' | LC_ALL=C sort) \
            > "$OUT/meta/FILE_LIST.txt"
          (cd "$OUT/src" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
            > "$OUT/meta/SHA256SUMS.txt"
          grep -RInE --binary-files=without-match \
            --exclude-dir=target --exclude-dir=.git \
            'Transformer|Swarm|Byzantine|equivoc|delay|partition|drop|duplicate|replay|finaliz|commit' \
            "$OUT/src/monad-mock-swarm" "$OUT/src/monad-randomized-tests" \
            "$OUT/src/monad-twins" "$OUT/src/monad-fuzz" \
            > "$OUT/meta/HARNESS_INDEX.txt" || true
          OUT="$OUT" python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['OUT'])
          result = {
              'monad_bft_commit': 'c616743d1358186605e1c1b74a3d6c4fdd9dd48c',
              'source_files': sum(p.is_file() for p in (out/'src').rglob('*')),
              'index_lines': len((out/'meta'/'HARNESS_INDEX.txt').read_text(errors='replace').splitlines()),
              'purpose': 'local-only valid-message adversarial harness development; not submission evidence',
          }
          (out/'HARNESS_EXPORT_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          PY
          tar --sort=name --mtime='UTC 2026-08-24' --owner=0 --group=0 --numeric-owner \
            -C "$OUT" -czf monad-v0160-adversarial-harness-source-20260824.tar.gz \
            HARNESS_EXPORT_RESULT.json meta src
          sha256sum monad-v0160-adversarial-harness-source-20260824.tar.gz \
            > monad-v0160-adversarial-harness-source-20260824.tar.gz.sha256

      - name: Upload harness source
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-adversarial-harness-source-20260824
          path: |
            monad-v0160-adversarial-harness-source-20260824.tar.gz
            monad-v0160-adversarial-harness-source-20260824.tar.gz.sha256
            out/HARNESS_EXPORT_RESULT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
