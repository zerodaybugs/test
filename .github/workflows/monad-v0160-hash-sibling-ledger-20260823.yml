name: Monad v0.16.0 hash sibling ledger 20260823

on:
  push:
    branches:
      - tooling/monad-v0160-hash-sibling-ledger-20260823
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          ref: tooling/monad-v0160-hash-sibling-ledger-20260823
          fetch-depth: 0

      - name: Clone exact scoped execution source
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/category-labs/monad.git source
          cd source
          git checkout e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          git status --porcelain=v1 > ../SOURCE_STATUS.txt
          test ! -s ../SOURCE_STATUS.txt
          cd ..
          mkdir -p hash_scan/raw hash_scan/meta
          cp SOURCE_STATUS.txt hash_scan/meta/

      - name: Export public known-fix exclusion set
        shell: bash
        run: |
          set -euo pipefail
          gh pr diff 2462 --repo category-labs/monad --patch > hash_scan/meta/PUBLIC_PR_2462.patch
          gh pr view 2462 --repo category-labs/monad \
            --json number,title,state,mergedAt,baseRefName,headRefName,headRefOid,url,body \
            > hash_scan/meta/PUBLIC_PR_2462.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          patch=Path('hash_scan/meta/PUBLIC_PR_2462.patch').read_text(errors='replace')
          files=sorted(set(re.findall(r'^diff --git a/(.*?) b/',patch,flags=re.M)))
          Path('hash_scan/meta/PUBLIC_PR_2462_FILES.txt').write_text('\n'.join(files)+'\n')
          PY

      - name: Build exact-source hash and map inventory
        shell: bash
        run: |
          set -euo pipefail
          rg -n -i -C 3 --glob '!third_party/**' --glob '!build/**' \
            '(wyhash|komihash|seeded_fast_hash|hash_seed|seed\s*=\s*0|seed\(0\)|std::hash|unordered_map|unordered_set|unordered_dense|HashMap|FxHash|ahash)' \
            source > hash_scan/raw/HASH_AND_MAP_CONTEXT.txt || true
          rg -n -i --glob '!third_party/**' --glob '!build/**' \
            '(struct|class).*Hash|operator\(\).*hash|hash<|using .*Map|typedef .*Map' \
            source > hash_scan/raw/HASHER_DEFINITIONS.txt || true
          rg -n -i --glob '!third_party/**' --glob '!build/**' \
            '(Address|bytes32|StorageKey|Transaction|tx_hash|code_hash|Block|NodeId|Account|Slot|Key).*unordered' \
            source > hash_scan/raw/SECURITY_KEY_MAP_CONTEXT.txt || true

      - name: Produce distinct-sibling candidates and kill exact public root cause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('hash_scan')
          excluded=set((root/'meta'/'PUBLIC_PR_2462_FILES.txt').read_text().splitlines())
          source=Path('source')
          deterministic=[]
          maps=[]
          patterns=[re.compile(x,re.I) for x in [
              r'wyhash',r'komihash',r'seed\s*[=(]\s*0',r'fixed.{0,20}seed',
              r'std::hash',r'unordered_(?:map|set)',r'unordered_dense',
          ]]
          key_terms=re.compile(r'(address|storage|slot|transaction|tx|code|block|node|account|hash|key)',re.I)
          attacker_terms=re.compile(r'(transaction|calldata|address|storage|slot|code|account|state|proposal|block)',re.I)
          for p in source.rglob('*'):
              if not p.is_file() or 'third_party' in p.parts or any(x.startswith('build') for x in p.parts):
                  continue
              if p.suffix.lower() not in {'.h','.hpp','.c','.cc','.cpp','.rs'}:
                  continue
              try:text=p.read_text(errors='replace')
              except Exception:continue
              rel=str(p.relative_to(source))
              lines=text.splitlines()
              for i,line in enumerate(lines,1):
                  if any(rx.search(line) for rx in patterns):
                      rec={'file':rel,'line':i,'text':line.strip()[:500],'excluded_by_public_pr_2462':rel in excluded,'security_key_signal':bool(key_terms.search(line)),'attacker_data_signal':bool(attacker_terms.search(line))}
                      if re.search(r'(seed|wyhash|komihash|std::hash)',line,re.I): deterministic.append(rec)
                      if re.search(r'(unordered_map|unordered_set|unordered_dense)',line,re.I): maps.append(rec)
          exact_known=[x for x in deterministic+maps if x['excluded_by_public_pr_2462']]
          siblings=[x for x in deterministic+maps if not x['excluded_by_public_pr_2462'] and (x['security_key_signal'] or x['attacker_data_signal'])]
          unique=[];seen=set()
          for x in siblings:
              k=(x['file'],x['line'],x['text'])
              if k not in seen: seen.add(k); unique.append(x)
          result={
              'scan_date':'2026-08-23',
              'scope_commit':'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'public_known_root_cause':{
                  'pr':'category-labs/monad#2462',
                  'decision':'FINAL_KILL_FOR_SAME_HASHER_KEY_TYPES_AND_NATURAL_FIX',
                  'excluded_files':sorted(excluded),
                  'matching_inventory_rows':exact_known,
              },
              'distinct_sibling_inventory':unique,
              'distinct_sibling_count':len(unique),
              'submission_ready':False,'high_proven':False,'critical_proven':False,
              'decision':'RESEARCH_ONLY_SIBLINGS_REQUIRE_DYNAMIC_COLLISION_AND_FULLNODE_IMPACT_GATE' if unique else 'NO_DISTINCT_HASH_SIBLING_STATIC_SIGNAL',
              'promotion_rule':'A sibling requires a different key type and map, attacker-controlled valid input, reproducible collision set, superlinear production-path cost, full-node progress impact below one-third Byzantine stake, a narrow distinct fix, and public duplicate clearance. A textual map/hasher hit is not a vulnerability.'
          }
          (root/'MONAD_V0160_HASH_SIBLING_LEDGER_2026-08-23.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          md=['# Monad v0.16.0 deterministic-hash sibling ledger','',f"**Decision:** `{result['decision']}`",'',f"- Public-known exact root-cause rows killed: **{len(exact_known)}**",f"- Distinct sibling static rows: **{len(unique)}**",'- Submission-ready: **no**','', '## Public known root cause','', '`category-labs/monad#2462` is an explicit prior-public fix. The same key types, maps, and per-process seeding remedy are FINAL KILL.','', '## Promotion boundary','',result['promotion_rule'],'']
          for x in unique[:100]: md.append(f"- `{x['file']}:{x['line']}` — `{x['text']}`")
          (root/'MONAD_V0160_HASH_SIBLING_LEDGER_2026-08-23.md').write_text('\n'.join(md)+'\n')
          sums=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS': sums.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}")
          (root/'SHA256SUMS').write_text('\n'.join(sums)+'\n')
          PY

      - name: Commit compact ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hash_scan/MONAD_V0160_HASH_SIBLING_LEDGER_2026-08-23.json \
                  hash_scan/MONAD_V0160_HASH_SIBLING_LEDGER_2026-08-23.md \
                  hash_scan/SHA256SUMS hash_scan/meta
          git commit -m 'research: add Monad hash sibling ledger [skip ci]'
          git push origin HEAD:tooling/monad-v0160-hash-sibling-ledger-20260823

      - name: Upload full hash scan
        uses: actions/upload-artifact@v7
        with:
          name: monad-v0160-hash-sibling-ledger-20260823
          path: hash_scan
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
