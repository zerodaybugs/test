name: Monad v0.16.0 canonical high-S control v2

on:
  push:
    branches:
      - agent/monad-v0160-highs-master-v6-20260818
    paths:
      - .github/workflows/monad-v0160-highs-canonical-v2-20260818.yml
      - scripts/monad_v0160_canonicalize_high_s_v2.py
      - scripts/run_monad_v0160_highs_canonical_v2.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-v0160-highs-canonical-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RESULT_DIR: results/monad-v0160-highs-canonical-v2
      BFT_COMMIT: c616743d1358186605e1c1b74a3d6c4fdd9dd48c
      EXEC_COMMIT: e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_MULTIPLEXING: "false"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libsecp256k1-dev libzstd-dev protobuf-compiler
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt
          rustup default 1.91.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Clone immutable exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$BFT_COMMIT"
          git -C monad-bft submodule sync --recursive
          git -C monad-bft submodule update --init --recursive --depth 1
          test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"

      - name: Restore exact Cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            monad-bft/target
          key: ubuntu-24.04-monad-v0160-highs-canonical-v2-c616743d

      - name: Run canonical high-S v2 matrix
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run_monad_v0160_highs_canonical_v2.sh 2>&1 | tee canonical-v2.log
          test -s evidence-canonical-v2/RESULT.json

      - name: Commit fail-closed result
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RESULT_DIR"
          if [ -s evidence-canonical-v2/RESULT.json ]; then
            cp -a evidence-canonical-v2/. "$RESULT_DIR/"
          else
            python3 - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ['RESULT_DIR'])
          root.mkdir(parents=True, exist_ok=True)
          result = {
              'decision': 'CANONICAL_V2_INFRASTRUCTURE_OR_RUNNER_FAILURE',
              'gate_outcome': os.environ.get('GATE_OUTCOME'),
              'submit_ready': False,
          }
          (root / 'RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          (root / 'REPORT.md').write_text('# Monad canonical high-S v2 failure\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
          fi
          [ ! -f canonical-v2.log ] || cp canonical-v2.log "$RESULT_DIR/canonical-v2.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record Monad canonical high-S v2 result"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-highs-canonical-v2-${{ github.run_id }}
          path: |
            evidence-canonical-v2
            canonical-v2.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
