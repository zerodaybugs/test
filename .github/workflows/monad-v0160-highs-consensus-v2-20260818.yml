name: Monad v0.16.0 RaptorCast high-S consensus v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monad-v0160-highs-consensus-v2-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-v0160-highs-consensus-v2
  cancel-in-progress: true

jobs:
  consensus-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RESEARCH_BRANCH: agent/monad-v0160-highs-master-v6-20260818
      RESULT_DIR: results/monad-v0160-highs-consensus-v2
      BFT_COMMIT: c616743d1358186605e1c1b74a3d6c4fdd9dd48c
      EXEC_COMMIT: e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_MULTIPLEXING: "false"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Record start heartbeat
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RESULT_DIR"
          printf '{"stage":"STARTED_CONSENSUS_V2","run_id":%s,"workflow_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RESULT_DIR/HEARTBEAT.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR/HEARTBEAT.json"
          git commit -m 'Record Monad high-S consensus-v2 heartbeat'
          git push origin "HEAD:$RESEARCH_BRANCH"

      - name: Install pinned toolchain and native dependencies
        id: toolchain
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libsecp256k1-dev libzstd-dev protobuf-compiler
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt
          rustup default 1.91.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Clone immutable exact v0.16.0 source
        id: clone
        if: steps.toolchain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$BFT_COMMIT"
          git -C monad-bft submodule sync --recursive
          git -C monad-bft submodule update --init --recursive --depth 1
          test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"
          mkdir -p evidence/consensus evidence/low-s evidence/regression
          {
            echo "bft_commit=$(git -C monad-bft rev-parse HEAD)"
            echo "execution_commit=$(git -C monad-bft/monad-execution rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            git -C monad-bft submodule status --recursive
          } > evidence/SOURCE_PROVENANCE.txt
          sha256sum \
            scripts/monad_v0160_highs_consensus_inject_v2.py \
            scripts/monad_v0160_fix_low_s_regression.py \
            monad-bft/Cargo.lock \
            > evidence/INPUTS.sha256

      - name: Restore exact Cargo cache
        if: steps.clone.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            monad-bft/target
          key: ubuntu-24.04-monad-v0160-highs-consensus-v2-c616743d
          restore-keys: |
            ubuntu-24.04-monad-v0160-highs-consensus-v1-c616743d
            ubuntu-24.04-monad-v0160-highs-

      - name: Fetch locked dependencies
        id: fetch
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5; do
            cargo fetch --manifest-path monad-bft/Cargo.toml --locked \
              2>&1 | tee -a evidence/cargo-fetch.log && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Inject corrected exact consensus finality A-B regression
        id: inject
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/monad_v0160_highs_consensus_inject_v2.py
          cargo fmt --manifest-path monad-bft/Cargo.toml --all
          git -C monad-bft diff --check
          git -C monad-bft diff -- \
            monad-mock-swarm/src/raptorcast.rs \
            monad-mock-swarm/tests/raptorcast_highs_network.rs \
            > evidence/MONAD_V0160_RAPTORCAST_V1_HIGHS_CONSENSUS_V2_TEST.patch
          test -s evidence/MONAD_V0160_RAPTORCAST_V1_HIGHS_CONSENSUS_V2_TEST.patch

      - name: Run corrected consensus finality A-B three times
        id: consensus
        if: steps.inject.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST='high_s_alias_relay_halts_finality_without_canonical_commitment'
          : > evidence/consensus/status.tsv
          for repetition in 1 2 3; do
            set +e
            /usr/bin/time -v cargo test --manifest-path monad-bft/Cargo.toml --locked \
              -p monad-mock-swarm --features raptorcast \
              --test raptorcast_highs_network "$TEST" \
              -- --exact --nocapture --test-threads=1 \
              > "evidence/consensus/run-${repetition}.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$repetition" "$status" >> evidence/consensus/status.tsv
            test "$status" -eq 0
            grep -Eq 'running[[:space:]]+1[[:space:]]+test' "evidence/consensus/run-${repetition}.log"
            grep -Fq "test ${TEST} ... ok" "evidence/consensus/run-${repetition}.log"
            grep -Fq 'MARKER_NETWORK_VULNERABLE_LEDGER_LENGTHS=[0, 0, 0, 0]' \
              "evidence/consensus/run-${repetition}.log"
            grep -Fq 'MARKER_NETWORK_TEST_COMPLETE=1' \
              "evidence/consensus/run-${repetition}.log"
          done

      - name: Run existing exact mock-swarm RaptorCast regression
        id: swarm_regression
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          # Use a pristine source tree so research fields cannot affect the baseline.
          git -C monad-bft reset --hard "$BFT_COMMIT"
          git -C monad-bft submodule update --init --recursive --depth 1
          set +e
          cargo test --manifest-path monad-bft/Cargo.toml --locked \
            -p monad-mock-swarm --features raptorcast \
            --test raptorcast raptorcast_smoke_four_nodes \
            -- --exact --nocapture --test-threads=1 \
            > evidence/regression/mock-swarm-raptorcast.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > evidence/regression/mock-swarm-raptorcast.exitcode
          test "$status" -eq 0
          grep -Eq 'running[[:space:]]+1[[:space:]]+test' evidence/regression/mock-swarm-raptorcast.log
          grep -Fq 'test raptorcast_smoke_four_nodes ... ok' evidence/regression/mock-swarm-raptorcast.log

      - name: Run actual canonical low-S parser and full regression matrix
        id: low_s
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C monad-bft reset --hard "$BFT_COMMIT"
          git -C monad-bft submodule update --init --recursive --depth 1
          python3 scripts/monad_v0160_fix_low_s_regression.py
          cargo fmt --manifest-path monad-bft/Cargo.toml --all
          git -C monad-bft diff --check
          git -C monad-bft diff -- monad-secp/src/secp.rs \
            > evidence/MONAD_V0160_CANONICAL_LOW_S_COMPLETE_FIX.patch
          test -s evidence/MONAD_V0160_CANONICAL_LOW_S_COMPLETE_FIX.patch

          : > evidence/low-s/targeted-status.tsv
          for repetition in 1 2 3 4 5; do
            set +e
            cargo test --manifest-path monad-bft/Cargo.toml --locked \
              -p monad-secp --lib test_non_malleability \
              -- --exact --nocapture --test-threads=1 \
              > "evidence/low-s/targeted-${repetition}.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$repetition" "$status" >> evidence/low-s/targeted-status.tsv
            test "$status" -eq 0
            grep -Eq 'running[[:space:]]+1[[:space:]]+test' \
              "evidence/low-s/targeted-${repetition}.log"
            grep -Fq 'test secp::tests::test_non_malleability ... ok' \
              "evidence/low-s/targeted-${repetition}.log"
          done

          : > evidence/low-s/full-status.tsv
          for repetition in 1 2 3; do
            set +e
            /usr/bin/time -v cargo test --manifest-path monad-bft/Cargo.toml --locked \
              -p monad-secp --lib -- --test-threads=1 \
              > "evidence/low-s/full-${repetition}.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$repetition" "$status" >> evidence/low-s/full-status.tsv
            test "$status" -eq 0
            grep -Eq 'test result: ok\.' "evidence/low-s/full-${repetition}.log"
          done

      - name: Classify exact v2 result fail-closed
        id: classify
        if: always()
        shell: bash
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
          CONSENSUS_OUTCOME: ${{ steps.consensus.outcome }}
          SWARM_REGRESSION_OUTCOME: ${{ steps.swarm_regression.outcome }}
          LOW_S_OUTCOME: ${{ steps.low_s.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence "$RESULT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          root = Path('evidence')

          def read_status(path):
              status = {}
              if path.exists():
                  for line in path.read_text().splitlines():
                      repetition, code = line.split('\t')
                      status[int(repetition)] = int(code)
              return status

          consensus_status = read_status(root / 'consensus' / 'status.tsv')
          consensus_runs = []
          for repetition in (1, 2, 3):
              path = root / 'consensus' / f'run-{repetition}.log'
              text = path.read_text(errors='replace') if path.exists() else ''
              vulnerable = re.findall(
                  r'MARKER_NETWORK_VULNERABLE_LEDGER_LENGTHS=\[([^]]+)\]', text
              )
              patched = re.findall(
                  r'MARKER_NETWORK_PATCHED_LEDGER_LENGTHS=\[([^]]+)\]', text
              )
              parse = lambda values: [int(x.strip()) for x in values[-1].split(',')] if values else None
              consensus_runs.append({
                  'repetition': repetition,
                  'exit_code': consensus_status.get(repetition),
                  'vulnerable_ledgers': parse(vulnerable),
                  'patched_ledgers': parse(patched),
                  'complete': 'MARKER_NETWORK_TEST_COMPLETE=1' in text,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None,
              })

          consensus_pass = all(
              run['exit_code'] == 0
              and run['complete']
              and run['vulnerable_ledgers'] == [0, 0, 0, 0]
              and run['patched_ledgers'] is not None
              and min(run['patched_ledgers']) >= 80
              and max(run['patched_ledgers']) - min(run['patched_ledgers']) <= 1
              for run in consensus_runs
          )

          low_targeted = read_status(root / 'low-s' / 'targeted-status.tsv')
          low_full = read_status(root / 'low-s' / 'full-status.tsv')
          low_s_pass = (
              len(low_targeted) == 5
              and all(low_targeted.get(i) == 0 for i in range(1, 6))
              and len(low_full) == 3
              and all(low_full.get(i) == 0 for i in range(1, 4))
          )

          regression_path = root / 'regression' / 'mock-swarm-raptorcast.exitcode'
          regression_pass = regression_path.exists() and int(regression_path.read_text()) == 0

          prior_path = Path('results/monad-v0160-highs-master-v4/RESULT.json')
          prior = json.loads(prior_path.read_text()) if prior_path.exists() else {}
          transport_pass = (
              prior.get('one_round_recovery') is True
              and prior.get('repeated_transport_poisoning') is True
              and prior.get('canonical_low_s_control') is True
          )

          outcomes = {
              'toolchain': os.environ.get('TOOLCHAIN_OUTCOME'),
              'clone': os.environ.get('CLONE_OUTCOME'),
              'fetch': os.environ.get('FETCH_OUTCOME'),
              'inject': os.environ.get('INJECT_OUTCOME'),
              'consensus': os.environ.get('CONSENSUS_OUTCOME'),
              'swarm_regression': os.environ.get('SWARM_REGRESSION_OUTCOME'),
              'low_s': os.environ.get('LOW_S_OUTCOME'),
          }
          infrastructure_pass = all(outcomes[key] == 'success' for key in ('toolchain', 'clone', 'fetch'))
          high_candidate = infrastructure_pass and transport_pass and consensus_pass and low_s_pass and regression_pass
          decision = (
              'EXACT_CONSENSUS_FINALITY_HALT_HIGH_CANDIDATE_OFFICIAL_FULLNODE_GATE_MISSING'
              if high_candidate else
              'CONSENSUS_OR_CONTROL_GATE_INCOMPLETE_OR_NEGATIVE'
          )
          result = {
              'bft_commit': os.environ.get('BFT_COMMIT'),
              'execution_commit': os.environ.get('EXEC_COMMIT'),
              'decision': decision,
              'severity_proven': 'HIGH_CANDIDATE' if high_candidate else 'NONE_NEW',
              'submit_ready': False,
              'outcomes': outcomes,
              'transport_pass': transport_pass,
              'consensus_pass': consensus_pass,
              'low_s_full_regression_pass': low_s_pass,
              'mock_swarm_raptorcast_regression_pass': regression_pass,
              'consensus_runs': consensus_runs,
              'official_monad_node_execution_halt': False,
              'previous_epoch_boundary_high': 'SEPARATE_UNCHANGED',
              'missing_before_submit_ready': [
                  'official monad-node + execution reproduction',
                  'at least two official full-node vulnerable halts',
                  'matched official full-node low-S recoveries',
                  'final scope and public duplicate clearance',
              ],
          }
          (root / 'RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          report = f'''# Monad v0.16.0 RaptorCast V1 high-S consensus v2

          ## Decision

          **{decision}**

          - Exact 12-round transport poisoning and low-S control: **{transport_pass}**
          - Corrected exact four-validator consensus/ledger A-B, 3/3: **{consensus_pass}**
          - Actual canonical low-S parser full regression, 3/3: **{low_s_pass}**
          - Pristine mock-swarm RaptorCast regression: **{regression_pass}**
          - Official monad-node + execution halt: **false**
          - Submit-ready: **false**

          A High candidate still requires official public-entrypoint full-node evidence.
          '''
          (root / 'REPORT.md').write_text(report)
          PY

          cp evidence/RESULT.json "$RESULT_DIR/RESULT.json"
          cp evidence/REPORT.md "$RESULT_DIR/REPORT.md"
          for file in \
            SOURCE_PROVENANCE.txt INPUTS.sha256 \
            MONAD_V0160_RAPTORCAST_V1_HIGHS_CONSENSUS_V2_TEST.patch \
            MONAD_V0160_CANONICAL_LOW_S_COMPLETE_FIX.patch; do
            [ ! -f "evidence/$file" ] || cp "evidence/$file" "$RESULT_DIR/$file"
          done
          mkdir -p "$RESULT_DIR/consensus" "$RESULT_DIR/low-s" "$RESULT_DIR/regression"
          [ ! -f evidence/consensus/status.tsv ] || cp evidence/consensus/status.tsv "$RESULT_DIR/consensus/status.tsv"
          [ ! -f evidence/low-s/targeted-status.tsv ] || cp evidence/low-s/targeted-status.tsv "$RESULT_DIR/low-s/targeted-status.tsv"
          [ ! -f evidence/low-s/full-status.tsv ] || cp evidence/low-s/full-status.tsv "$RESULT_DIR/low-s/full-status.tsv"
          [ ! -f evidence/regression/mock-swarm-raptorcast.exitcode ] || cp evidence/regression/mock-swarm-raptorcast.exitcode "$RESULT_DIR/regression/mock-swarm-raptorcast.exitcode"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('evidence')
          manifest = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  manifest.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}')
          (root / 'SHA256SUMS').write_text('\n'.join(manifest) + '\n')
          PY
          cp evidence/SHA256SUMS "$RESULT_DIR/SHA256SUMS"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'Record Monad high-S consensus-v2 machine result'
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi
          cat evidence/RESULT.json

      - name: Upload complete v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-highs-consensus-v2-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7
