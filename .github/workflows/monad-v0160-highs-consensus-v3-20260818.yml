name: Monad v0.16.0 RaptorCast high-S consensus v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monad-v0160-highs-consensus-v3-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-v0160-highs-consensus-v3
  cancel-in-progress: true

jobs:
  exact-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RESEARCH_BRANCH: agent/monad-v0160-highs-master-v6-20260818
      RESULT_DIR: results/monad-v0160-highs-consensus-v3
      BFT_COMMIT: c616743d1358186605e1c1b74a3d6c4fdd9dd48c
      EXEC_COMMIT: e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_MULTIPLEXING: "false"
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Heartbeat
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RESULT_DIR"
          printf '{"stage":"STARTED_CONSENSUS_V3","run_id":%s,"workflow_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RESULT_DIR/HEARTBEAT.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR/HEARTBEAT.json"
          git commit -m 'Record Monad high-S consensus-v3 heartbeat'
          git push origin "HEAD:$RESEARCH_BRANCH"

      - name: Install pinned toolchain
        id: setup
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libsecp256k1-dev libzstd-dev protobuf-compiler
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt
          rustup default 1.91.1

      - name: Clone exact source
        id: clone
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$BFT_COMMIT"
          git -C monad-bft submodule sync --recursive
          git -C monad-bft submodule update --init --recursive --depth 1
          test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"
          mkdir -p evidence/consensus evidence/low-s evidence/regression
          {
            echo "bft_commit=$(git -C monad-bft rev-parse HEAD)"
            echo "execution_commit=$(git -C monad-bft/monad-execution rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } > evidence/SOURCE_PROVENANCE.txt

      - if: steps.clone.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            monad-bft/target
          key: ubuntu-24.04-monad-v0160-highs-consensus-v3-c616743d
          restore-keys: |
            ubuntu-24.04-monad-v0160-highs-consensus-v2-c616743d
            ubuntu-24.04-monad-v0160-highs-consensus-v1-c616743d

      - name: Fetch locked dependencies
        id: fetch
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5; do
            cargo fetch --manifest-path monad-bft/Cargo.toml --locked \
              2>&1 | tee -a evidence/cargo-fetch.log && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Inject corrected consensus A-B
        id: inject
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/monad_v0160_highs_consensus_inject_v2.py
          # Healthy progress is the invariant. The prior fixed threshold of 80
          # incorrectly rejected a synchronized 77-block patched run.
          sed -i 's/\*length >= 80/\*length >= 50/' \
            monad-bft/monad-mock-swarm/tests/raptorcast_highs_network.rs
          cargo fmt --manifest-path monad-bft/Cargo.toml --all
          git -C monad-bft diff --check
          git -C monad-bft diff -- \
            monad-mock-swarm/src/raptorcast.rs \
            monad-mock-swarm/tests/raptorcast_highs_network.rs \
            > evidence/MONAD_V0160_RAPTORCAST_V1_HIGHS_CONSENSUS_V3_TEST.patch
          test -s evidence/MONAD_V0160_RAPTORCAST_V1_HIGHS_CONSENSUS_V3_TEST.patch

      - name: Run consensus A-B 3x
        id: consensus
        if: steps.inject.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST='high_s_alias_relay_halts_finality_without_canonical_commitment'
          : > evidence/consensus/status.tsv
          for repetition in 1 2 3; do
            set +e
            /usr/bin/time -v cargo test --manifest-path monad-bft/Cargo.toml --locked \
              -p monad-mock-swarm --features raptorcast \
              --test raptorcast_highs_network "$TEST" \
              -- --exact --nocapture --test-threads=1 \
              > "evidence/consensus/run-${repetition}.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$repetition" "$status" >> evidence/consensus/status.tsv
            test "$status" -eq 0
            grep -Eq 'running[[:space:]]+1[[:space:]]+test' "evidence/consensus/run-${repetition}.log"
            grep -Fq "test ${TEST} ... ok" "evidence/consensus/run-${repetition}.log"
            grep -Fq 'MARKER_NETWORK_VULNERABLE_LEDGER_LENGTHS=[0, 0, 0, 0]' \
              "evidence/consensus/run-${repetition}.log"
            grep -Fq 'MARKER_NETWORK_TEST_COMPLETE=1' \
              "evidence/consensus/run-${repetition}.log"
          done

      - name: Run pristine RaptorCast smoke control
        id: regression
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C monad-bft reset --hard "$BFT_COMMIT"
          git -C monad-bft submodule update --init --recursive --depth 1
          set +e
          cargo test --manifest-path monad-bft/Cargo.toml --locked \
            -p monad-mock-swarm --features raptorcast \
            --test raptorcast raptorcast_smoke_four_nodes \
            -- --exact --nocapture --test-threads=1 \
            > evidence/regression/raptorcast-smoke.log 2>&1
          status=$?
          set -e
          echo "$status" > evidence/regression/raptorcast-smoke.exitcode
          test "$status" -eq 0
          grep -Eq 'running[[:space:]]+1[[:space:]]+test' evidence/regression/raptorcast-smoke.log
          grep -Fq 'test raptorcast_smoke_four_nodes ... ok' evidence/regression/raptorcast-smoke.log

      - name: Run canonical low-S target 5x and full suite 3x
        id: low_s
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C monad-bft reset --hard "$BFT_COMMIT"
          git -C monad-bft submodule update --init --recursive --depth 1
          python3 scripts/monad_v0160_fix_low_s_regression.py
          cargo fmt --manifest-path monad-bft/Cargo.toml --all
          git -C monad-bft diff --check
          git -C monad-bft diff -- monad-secp/src/secp.rs \
            > evidence/MONAD_V0160_CANONICAL_LOW_S_COMPLETE_FIX.patch
          test -s evidence/MONAD_V0160_CANONICAL_LOW_S_COMPLETE_FIX.patch

          FULL='secp::tests::test_non_malleability'
          : > evidence/low-s/targeted-status.tsv
          for repetition in 1 2 3 4 5; do
            set +e
            cargo test --manifest-path monad-bft/Cargo.toml --locked \
              -p monad-secp --lib "$FULL" \
              -- --exact --nocapture --test-threads=1 \
              > "evidence/low-s/targeted-${repetition}.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$repetition" "$status" >> evidence/low-s/targeted-status.tsv
            test "$status" -eq 0
            grep -Eq 'running[[:space:]]+1[[:space:]]+test' "evidence/low-s/targeted-${repetition}.log"
            grep -Fq "test ${FULL} ... ok" "evidence/low-s/targeted-${repetition}.log"
          done

          : > evidence/low-s/full-status.tsv
          for repetition in 1 2 3; do
            set +e
            /usr/bin/time -v cargo test --manifest-path monad-bft/Cargo.toml --locked \
              -p monad-secp --lib -- --test-threads=1 \
              > "evidence/low-s/full-${repetition}.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$repetition" "$status" >> evidence/low-s/full-status.tsv
            test "$status" -eq 0
            grep -Eq 'test result: ok\.' "evidence/low-s/full-${repetition}.log"
          done

      - name: Classify and publish fail-closed result
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
          CONSENSUS_OUTCOME: ${{ steps.consensus.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          LOW_S_OUTCOME: ${{ steps.low_s.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence "$RESULT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          root = Path('evidence')
          def status(path):
              out = {}
              if path.exists():
                  for line in path.read_text().splitlines():
                      repetition, code = line.split('\t')
                      out[int(repetition)] = int(code)
              return out

          cstatus = status(root/'consensus/status.tsv')
          runs=[]
          for repetition in (1,2,3):
              path=root/'consensus'/f'run-{repetition}.log'
              text=path.read_text(errors='replace') if path.exists() else ''
              def marker(name):
                  matches=re.findall(rf'{name}=\[([^]]+)\]', text)
                  return [int(x.strip()) for x in matches[-1].split(',')] if matches else None
              runs.append({
                  'repetition':repetition,
                  'exit_code':cstatus.get(repetition),
                  'vulnerable_ledgers':marker('MARKER_NETWORK_VULNERABLE_LEDGER_LENGTHS'),
                  'patched_ledgers':marker('MARKER_NETWORK_PATCHED_LEDGER_LENGTHS'),
                  'complete':'MARKER_NETWORK_TEST_COMPLETE=1' in text,
                  'sha256':hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None,
              })
          consensus_pass=all(
              r['exit_code']==0 and r['complete']
              and r['vulnerable_ledgers']==[0,0,0,0]
              and r['patched_ledgers'] is not None
              and min(r['patched_ledgers'])>=50
              and max(r['patched_ledgers'])-min(r['patched_ledgers'])<=1
              for r in runs
          )
          targeted=status(root/'low-s/targeted-status.tsv')
          full=status(root/'low-s/full-status.tsv')
          low_s_pass=(len(targeted)==5 and all(targeted.get(i)==0 for i in range(1,6))
                      and len(full)==3 and all(full.get(i)==0 for i in range(1,4)))
          regression_path=root/'regression/raptorcast-smoke.exitcode'
          regression_pass=regression_path.exists() and int(regression_path.read_text())==0
          prior_path=Path('results/monad-v0160-highs-master-v4/RESULT.json')
          prior=json.loads(prior_path.read_text()) if prior_path.exists() else {}
          transport_pass=(prior.get('one_round_recovery') is True
                          and prior.get('repeated_transport_poisoning') is True
                          and prior.get('canonical_low_s_control') is True)
          outcomes={
              'setup':os.environ.get('SETUP_OUTCOME'),
              'clone':os.environ.get('CLONE_OUTCOME'),
              'fetch':os.environ.get('FETCH_OUTCOME'),
              'inject':os.environ.get('INJECT_OUTCOME'),
              'consensus':os.environ.get('CONSENSUS_OUTCOME'),
              'regression':os.environ.get('REGRESSION_OUTCOME'),
              'low_s':os.environ.get('LOW_S_OUTCOME'),
          }
          high_candidate=(transport_pass and consensus_pass and low_s_pass and regression_pass)
          decision=('EXACT_CONSENSUS_FINALITY_HALT_HIGH_CANDIDATE_OFFICIAL_FULLNODE_GATE_MISSING'
                    if high_candidate else 'CONSENSUS_OR_CONTROL_GATE_INCOMPLETE_OR_NEGATIVE')
          result={
              'bft_commit':os.environ.get('BFT_COMMIT'),
              'execution_commit':os.environ.get('EXEC_COMMIT'),
              'decision':decision,
              'severity_proven':'HIGH_CANDIDATE' if high_candidate else 'NONE_NEW',
              'submit_ready':False,
              'outcomes':outcomes,
              'transport_pass':transport_pass,
              'consensus_pass':consensus_pass,
              'low_s_full_regression_pass':low_s_pass,
              'pristine_raptorcast_control_pass':regression_pass,
              'consensus_runs':runs,
              'official_monad_node_execution_halt':False,
              'previous_epoch_boundary_high':'SEPARATE_UNCHANGED',
              'missing_before_submit_ready':[
                  'official monad-node + execution reproduction',
                  'two official vulnerable halts',
                  'matched official low-S recoveries',
                  'final scope and duplicate clearance',
              ],
          }
          (root/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (root/'REPORT.md').write_text(f'''# Monad v0.16.0 RaptorCast high-S consensus v3

## Decision

**{decision}**

- 12-round exact transport poisoning/control: **{transport_pass}**
- Four-validator consensus/ledger A-B 3/3: **{consensus_pass}**
- Canonical low-S full regression 3/3: **{low_s_pass}**
- Pristine RaptorCast control: **{regression_pass}**
- Official full-node halt: **false**
- Submit-ready: **false**
''')
          PY

          cp evidence/RESULT.json "$RESULT_DIR/RESULT.json"
          cp evidence/REPORT.md "$RESULT_DIR/REPORT.md"
          for file in SOURCE_PROVENANCE.txt INPUTS.sha256 \
            MONAD_V0160_RAPTORCAST_V1_HIGHS_CONSENSUS_V3_TEST.patch \
            MONAD_V0160_CANONICAL_LOW_S_COMPLETE_FIX.patch; do
            [ ! -f "evidence/$file" ] || cp "evidence/$file" "$RESULT_DIR/$file"
          done
          mkdir -p "$RESULT_DIR/consensus" "$RESULT_DIR/low-s" "$RESULT_DIR/regression"
          [ ! -f evidence/consensus/status.tsv ] || cp evidence/consensus/status.tsv "$RESULT_DIR/consensus/status.tsv"
          [ ! -f evidence/low-s/targeted-status.tsv ] || cp evidence/low-s/targeted-status.tsv "$RESULT_DIR/low-s/targeted-status.tsv"
          [ ! -f evidence/low-s/full-status.tsv ] || cp evidence/low-s/full-status.tsv "$RESULT_DIR/low-s/full-status.tsv"
          [ ! -f evidence/regression/raptorcast-smoke.exitcode ] || cp evidence/regression/raptorcast-smoke.exitcode "$RESULT_DIR/regression/raptorcast-smoke.exitcode"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('evidence')
          manifest=[]
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name!='SHA256SUMS':
                  manifest.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}')
          (root/'SHA256SUMS').write_text('\n'.join(manifest)+'\n')
          PY
          cp evidence/SHA256SUMS "$RESULT_DIR/SHA256SUMS"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'Record Monad high-S consensus-v3 result'
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi
          cat evidence/RESULT.json

      - name: Upload complete v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-highs-consensus-v3-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7
