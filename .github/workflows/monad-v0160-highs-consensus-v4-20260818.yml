name: Monad v0.16.0 RaptorCast high-S consensus v4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monad-v0160-highs-consensus-v4-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-v0160-highs-consensus-v4
  cancel-in-progress: true

jobs:
  exact-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monad-v0160-highs-master-v6-20260818
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            monad-bft-v4/target
          key: ubuntu-24.04-monad-v0160-highs-consensus-v4-c616743d
          restore-keys: |
            ubuntu-24.04-monad-v0160-highs-consensus-v3-c616743d
            ubuntu-24.04-monad-v0160-highs-consensus-v2-c616743d

      - name: Remove obsolete direct injector call from standalone script
        shell: bash
        run: |
          set -Eeuo pipefail
          # Second registration commit triggers this already-registered workflow.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_monad_v0160_highs_consensus_v4.sh')
          text = path.read_text()
          obsolete = '''python3 scripts/monad_v0160_highs_consensus_inject_v2.py
          # The injected script writes to monad-bft; move its output into this isolated tree.
          # Re-run it with a temporary path substitution so exact anchors remain unchanged.
          if [ -d monad-bft ] && [ "$SOURCE" != 'monad-bft' ]; then
            rm -rf monad-bft
          fi
          '''
          if obsolete not in text:
              raise SystemExit('obsolete injector block not found exactly once')
          path.write_text(text.replace(obsolete, '', 1))
          PY
          chmod +x scripts/run_monad_v0160_highs_consensus_v4.sh

      - name: Run exact standalone consensus, mitigation, and regression gate
        shell: bash
        run: scripts/run_monad_v0160_highs_consensus_v4.sh

      - name: Upload complete v4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-highs-consensus-v4-${{ github.run_id }}
          path: |
            evidence-v4
            results/monad-v0160-highs-consensus-v4
          if-no-files-found: warn
          retention-days: 7
