name: Monad v0.16.0 high-S master-v4 default runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monad-v0160-highs-default-diagnostic-20260818.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-v0160-highs-master-v4-default
  cancel-in-progress: true

jobs:
  master-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RESEARCH_BRANCH: agent/monad-v0160-highs-master-v6-20260818
      RESULT_DIR: results/monad-v0160-highs-master-v4
      BFT_COMMIT: c616743d1358186605e1c1b74a3d6c4fdd9dd48c
      EXEC_COMMIT: e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_MULTIPLEXING: "false"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out isolated master-v4 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_BRANCH }}
          fetch-depth: 0

      - name: Commit start heartbeat
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RESULT_DIR"
          printf '{"stage":"STARTED_MASTER_V4","run_id":%s,"workflow_sha":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RESULT_DIR/HEARTBEAT.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_DIR/HEARTBEAT.json"
          git commit -m "Record Monad high-S master-v4 heartbeat"
          git push origin "HEAD:$RESEARCH_BRANCH"

      - name: Install exact Rust toolchain
        id: rust
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostic
          {
            rustup toolchain install 1.91.1 --profile minimal --component rustfmt
            rustup default 1.91.1
            rustc --version --verbose
            cargo --version --verbose
          } 2>&1 | tee diagnostic/rust.log

      - name: Clone and pin exact source
        id: clone
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostic
          {
            git config --global advice.detachedHead false
            git clone --filter=blob:none --no-recurse-submodules https://github.com/category-labs/monad-bft.git monad-bft
            git -C monad-bft checkout --detach "$BFT_COMMIT"
            git -C monad-bft submodule sync --recursive
            git -C monad-bft submodule update --init --recursive --depth 1
            test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
            test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"
          } 2>&1 | tee diagnostic/clone.log

      - name: Restore exact Cargo build cache
        if: steps.clone.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            monad-bft/target
          key: ubuntu-24.04-monad-v0160-raptorcast-c616743d-v2

      - name: Run exact high-S master-v4 matrix
        id: gate
        if: steps.rust.outcome == 'success' && steps.clone.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run_monad_v0160_highs_master_v4.sh 2>&1 | tee diagnostic/master-v4.log
          test -s evidence/RESULT.json

      - name: Commit fail-closed master-v4 result
        if: always()
        shell: bash
        env:
          RUST_OUTCOME: ${{ steps.rust.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RESULT_DIR" diagnostic
          if [ -s evidence/RESULT.json ]; then
            cp evidence/RESULT.json "$RESULT_DIR/RESULT.json"
            cp evidence/REPORT.md "$RESULT_DIR/REPORT.md"
            cp evidence/SHA256SUMS "$RESULT_DIR/SHA256SUMS"
            for file in \
              MONAD_V0160_RAPTORCAST_V1_HIGHS_MASTER_V4_TEST.patch \
              MONAD_V0160_CANONICAL_LOW_S_NETWORK_CONTROL.patch; do
              [ ! -f "evidence/$file" ] || cp "evidence/$file" "$RESULT_DIR/$file"
            done
            for phase in recovery sustained-vulnerable sustained-low-s-control; do
              mkdir -p "$RESULT_DIR/$phase"
              [ ! -f "evidence/$phase/status.tsv" ] || cp "evidence/$phase/status.tsv" "$RESULT_DIR/$phase/status.tsv"
            done
            [ ! -f evidence/low-s-regression/exitcode ] || {
              mkdir -p "$RESULT_DIR/low-s-regression"
              cp evidence/low-s-regression/exitcode "$RESULT_DIR/low-s-regression/exitcode"
            }
          else
            python3 - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ['RESULT_DIR']); root.mkdir(parents=True, exist_ok=True)
          result = {
              'decision':'MASTER_V4_INFRASTRUCTURE_OR_RUNNER_FAILURE',
              'outcomes':{
                  'rust':os.environ.get('RUST_OUTCOME'),
                  'clone':os.environ.get('CLONE_OUTCOME'),
                  'gate':os.environ.get('GATE_OUTCOME'),
              },
              'submit_ready':False,
          }
          (root/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (root/'REPORT.md').write_text('# Monad high-S master-v4 failure\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
          fi
          for file in diagnostic/*.log; do
            [ ! -f "$file" ] || cp "$file" "$RESULT_DIR/$(basename "$file")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected Monad high-S master-v4 result"
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi

      - name: Upload complete master-v4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-highs-master-v4-${{ github.run_id }}
          path: |
            evidence
            diagnostic
          if-no-files-found: warn
          retention-days: 7
