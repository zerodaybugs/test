name: Monad v0.16.0 native VM consistency adjudicator 20260825

on:
  push:
    branches:
      - tooling/monad-v0160-native-diff-adjudicator-20260825
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout research tooling
        uses: actions/checkout@v4

      - name: Clone exact public execution source
        shell: bash
        run: |
          set -euo pipefail
          git config --global submodule.fetchJobs "$(nproc)"
          git clone --recurse-submodules https://github.com/category-labs/monad.git monad-execution
          cd monad-execution
          git checkout e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          git status --porcelain=v1 > ../SOURCE_STATUS.txt
          test ! -s ../SOURCE_STATUS.txt
          git submodule status --recursive > ../SUBMODULES.txt

      - name: Build official dependency image
        shell: bash
        run: |
          set -euo pipefail
          docker build --target base -t monad-v0160-base -f monad-execution/docker/Dockerfile monad-execution

      - name: Instrument exact differential harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bin out/meta out/logs out/rc out/focus out/diagnostics
          docker run --name monad-v0160-adjudicator \
            -v "$PWD/monad-execution:/src" \
            -v "$PWD/out:/out" \
            monad-v0160-base bash -lc '
              set -euo pipefail
              cd /src
              cp test/vm/fuzzer/fuzzer.cpp /tmp/fuzzer.original.cpp
              cp test/vm/fuzzer/assertions.cpp /tmp/assertions.original.cpp

              python3 - <<"PY"
          from pathlib import Path

          original = Path("/tmp/fuzzer.original.cpp").read_text()

          def render(revision: str) -> str:
              page = "true" if revision == "MONAD_TEN" else "false"
              s = original
              s = s.replace(
                  "#include <category/execution/ethereum/chain/ethereum_mainnet.hpp>",
                  "#include <category/execution/monad/chain/monad_mainnet.hpp>\n"
                  "#include <category/vm/evm/monad/revision.h>\n"
                  "#include <category/vm/evm/traits.hpp>",
              )
              marker = "using monad::vm::compiler::native::CompilerConfig;\n"
              insert = marker + (
                  f"\nstatic constexpr monad_revision MONAD_FUZZ_REVISION = {revision};\n"
                  f"static constexpr bool MONAD_FUZZ_PAGE_ENCODED = {page};\n"
              )
              if marker not in s:
                  raise SystemExit("compiler config marker missing")
              s = s.replace(marker, insert, 1)
              s = s.replace(
                  "monad::test::TestState<false> test_state = {};",
                  "monad::test::TestState<MONAD_FUZZ_PAGE_ENCODED> test_state = {};",
                  1,
              )
              s = s.replace("EthereumMainnet const chain{};", "MonadMainnet const chain{};", 1)
              old = (
                  "    MONAD_ASSERT(rev == MONAD_ETH_OSAKA); // TODO switch to monad revisions\n"
                  "    using traits = EvmTraits<MONAD_ETH_OSAKA>;"
              )
              new = (
                  "    MONAD_ASSERT(rev == MonadTraits<MONAD_FUZZ_REVISION>::evm_rev());\n"
                  "    using traits = MonadTraits<MONAD_FUZZ_REVISION>;"
              )
              if old not in s:
                  raise SystemExit("transition marker missing")
              s = s.replace(old, new, 1)

              start = s.index("    auto evmone_vm = evmc::VM(evmc_create_evmone());")
              end = s.index("    auto monad_state = [&] {", start)
              s = s[:start] + (
                  "    auto evmone_state =\n"
                  "        std::make_shared<FuzzerTestState>(vm::VM::InterpreterOnly);\n\n"
              ) + s[end:]

              old_config = "            s->vm.set_compiler_config(create_compiler_config(engine));"
              new_config = (
                  "            if (std::getenv(\"MONAD_FUZZ_NO_HOOK\") != nullptr) {\n"
                  "                s->vm.set_compiler_config(CompilerConfig{\n"
                  "                    .runtime_debug_trace =\n"
                  "                        vm::utils::is_compiler_runtime_debug_trace_enabled,\n"
                  "                    .max_code_size_offset =\n"
                  "                        vm::interpreter::code_size_t::max(),\n"
                  "                    .post_instruction_emit_hook = {},\n"
                  "                });\n"
                  "            }\n"
                  "            else {\n"
                  "                s->vm.set_compiler_config(create_compiler_config(engine));\n"
                  "            }"
              )
              if old_config not in s:
                  raise SystemExit("compiler setup marker missing")
              s = s.replace(old_config, new_config, 1)

              diag = r'''
          static std::vector<uint8_t> monad_diag_contract;
          static std::vector<uint8_t> monad_diag_input;
          static evmc_message monad_diag_message{};
          static BlockHeader monad_diag_header{};
          static uint64_t monad_diag_seed{};
          static int64_t monad_diag_iteration{-1};
          static int64_t monad_diag_message_index{-1};

          static void monad_diag_hex(uint8_t const *data, size_t size)
          {
              static constexpr char h[] = "0123456789abcdef";
              for (size_t i = 0; i < size; ++i) {
                  std::fputc(h[data[i] >> 4], stderr);
                  std::fputc(h[data[i] & 0x0f], stderr);
              }
          }

          static void monad_diag_address(evmc_address const &a)
          {
              monad_diag_hex(a.bytes, sizeof(a.bytes));
          }

          void monad_fuzz_dump_context()
          {
              std::fprintf(stderr,
                  "DIAG_CONTEXT seed=%llu iteration=%lld message=%lld kind=%d flags=%u depth=%d gas=%lld block=%llu timestamp=%llu contract_size=%zu input_size=%zu\\n",
                  static_cast<unsigned long long>(monad_diag_seed),
                  static_cast<long long>(monad_diag_iteration),
                  static_cast<long long>(monad_diag_message_index),
                  static_cast<int>(monad_diag_message.kind),
                  static_cast<unsigned>(monad_diag_message.flags),
                  static_cast<int>(monad_diag_message.depth),
                  static_cast<long long>(monad_diag_message.gas),
                  static_cast<unsigned long long>(monad_diag_header.number),
                  static_cast<unsigned long long>(monad_diag_header.timestamp),
                  monad_diag_contract.size(), monad_diag_input.size());
              std::fputs("DIAG_SENDER=", stderr);
              monad_diag_address(monad_diag_message.sender);
              std::fputs("\\nDIAG_RECIPIENT=", stderr);
              monad_diag_address(monad_diag_message.recipient);
              std::fputs("\\nDIAG_CODE_ADDRESS=", stderr);
              monad_diag_address(monad_diag_message.code_address);
              std::fputs("\\nDIAG_VALUE=", stderr);
              monad_diag_hex(monad_diag_message.value.bytes, sizeof(monad_diag_message.value.bytes));
              std::fputs("\\nDIAG_CONTRACT=", stderr);
              monad_diag_hex(monad_diag_contract.data(), monad_diag_contract.size());
              std::fputs("\\nDIAG_INPUT=", stderr);
              monad_diag_hex(monad_diag_input.data(), monad_diag_input.size());
              std::fputs("\\nDIAG_CONTEXT_END\\n", stderr);
              std::fflush(stderr);
          }
          '''
              insertion_point = s.index("struct FuzzerTestState")
              s = s[:insertion_point] + diag + "\n" + s[insertion_point:]

              s = s.replace(
                  "static void do_run(\n    monad::vm::MemoryPool &memory_pool, std::size_t const run_index,\n    arguments const &args)\n{\n    auto const rev = args.revision;",
                  "static void do_run(\n    monad::vm::MemoryPool &memory_pool, std::size_t const run_index,\n    arguments const &args)\n{\n    auto const rev = args.revision;\n    monad_diag_seed = args.seed;",
                  1,
              )
              s = s.replace(
                  "    for (auto i = 0; i < args.iterations_per_run; ++i) {\n        TimeoutWaitThread timeout_wait_thread;",
                  "    for (auto i = 0; i < args.iterations_per_run; ++i) {\n        monad_diag_iteration = i;\n        TimeoutWaitThread timeout_wait_thread;",
                  1,
              )
              s = s.replace(
                  "            auto const a = deploy_contracts(\n                evmone_state, monad_state, contract, block_counter.next());",
                  "            monad_diag_contract.assign(contract.begin(), contract.end());\n            auto const a = deploy_contracts(\n                evmone_state, monad_state, contract, block_counter.next());",
                  1,
              )
              s = s.replace(
                  "        for (auto j = 0u; j < args.messages; ++j) {\n            auto msg_memory = memory_pool.alloc_ref();",
                  "        for (auto j = 0u; j < args.messages; ++j) {\n            monad_diag_message_index = static_cast<int64_t>(j);\n            auto msg_memory = memory_pool.alloc_ref();",
                  1,
              )
              s = s.replace(
                  "            auto const block_header =\n                generate_block_header(engine, block_counter.next());",
                  "            monad_diag_message = *msg;\n            monad_diag_input.assign(msg->input_data, msg->input_data + msg->input_size);\n            auto const block_header =\n                generate_block_header(engine, block_counter.next());\n            monad_diag_header = block_header;",
                  1,
              )
              return s

          Path("/tmp/fuzzer.MONAD_NINE.cpp").write_text(render("MONAD_NINE"))
          Path("/tmp/fuzzer.MONAD_TEN.cpp").write_text(render("MONAD_TEN"))
          PY

              python3 - <<"PY"
          from pathlib import Path
          p = Path("test/vm/fuzzer/assertions.cpp")
          s = p.read_text()
          s = s.replace("#include <algorithm>\n", "#include <algorithm>\n#include <cstdio>\n#include <cstdlib>\n", 1)
          marker = "namespace monad::vm::fuzzing\n{\n"
          helper = r'''extern void monad_fuzz_dump_context();

          static void diag_address(char const *label, Address const &a)
          {
              static constexpr char h[] = "0123456789abcdef";
              std::fputs(label, stderr);
              for (auto const b : a.bytes) {
                  std::fputc(h[b >> 4], stderr);
                  std::fputc(h[b & 0x0f], stderr);
              }
              std::fputc('\n', stderr);
          }

          static void diag_account(char const *prefix, Address const &k, AccountState const &as)
          {
              diag_address(prefix, k);
              std::fprintf(stderr,
                  "DIAG_ACCOUNT has=%d nonce=%llu storage=%zu transient=%zu version_metadata_touched=%d\\n",
                  as.has_account() ? 1 : 0,
                  static_cast<unsigned long long>(as.get_nonce()),
                  as.storage_.size(), as.transient_storage_.size(),
                  as.touched_ ? 1 : 0);
          }

          [[noreturn]] static void diag_abort(State &a, State &b)
          {
              std::fprintf(stderr, "DIAG_STATE_MAP_SIZE interpreter=%zu compiler=%zu\\n",
                  a.current().size(), b.current().size());
              for (auto const &[k, v] : a.current()) {
                  if (b.current().find(k) == b.current().end()) {
                      diag_account("DIAG_ONLY_INTERPRETER=", k, v.recent());
                  }
              }
              for (auto const &[k, v] : b.current()) {
                  if (a.current().find(k) == a.current().end()) {
                      diag_account("DIAG_ONLY_COMPILER=", k, v.recent());
                  }
              }
              monad_fuzz_dump_context();
              std::fflush(stderr);
              std::abort();
          }

          '''
          if marker not in s:
              raise SystemExit("assertions namespace marker missing")
          s = s.replace(marker, marker + helper, 1)
          old = "        MONAD_ASSERT(a.current().size() == b.current().size());"
          new = "        if (a.current().size() != b.current().size()) { diag_abort(a, b); }"
          if s.count(old) != 1:
              raise SystemExit(f"state-size assertion count={s.count(old)}")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

              cp /tmp/fuzzer.MONAD_NINE.cpp test/vm/fuzzer/fuzzer.cpp
              rm -rf build-native
              CC=clang-19 CXX=clang++-19 cmake -S . -B build-native -GNinja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_TOOLCHAIN_FILE=category/core/toolchains/gcc-avx2.cmake \
                -DMONAD_COMPILER_TESTING=On
              cmake --build build-native -t monad-compiler-fuzzer --parallel "$(nproc)"
              cp build-native/test/vm/fuzzer/monad-compiler-fuzzer /out/bin/monad-nine-adjudicator

              cp /tmp/fuzzer.MONAD_TEN.cpp test/vm/fuzzer/fuzzer.cpp
              cmake --build build-native -t monad-compiler-fuzzer --parallel "$(nproc)"
              cp build-native/test/vm/fuzzer/monad-compiler-fuzzer /out/bin/monad-ten-adjudicator

              cp /tmp/fuzzer.original.cpp test/vm/fuzzer/fuzzer.cpp
              cp /tmp/assertions.original.cpp test/vm/fuzzer/assertions.cpp
              sha256sum /out/bin/* > /out/meta/BINARY_SHA256.txt
              clang-19 --version > /out/meta/CLANG_VERSION.txt
              cmake --version > /out/meta/CMAKE_VERSION.txt
              ninja --version > /out/meta/NINJA_VERSION.txt
            '

      - name: Execute exact candidate matrix three times
        shell: bash
        run: |
          set -euo pipefail
          cat > out/focus/stateheavy.json <<'JSON'
          {
            "valid_address_prob": 0.70,
            "random_constant_with_cleared_words_prob": 0.20,
            "meaningful_constant_prob": 0.20,
            "small_constant_prob": 0.20,
            "push_weight": 0.16,
            "dup_weight": 0.16,
            "call_weight": 0.02,
            "returndatacopy_weight": 0.02,
            "create_weight": 0.02,
            "uncommon_non_term_weight": 0.42,
            "valid_jump_prob": 0.95
          }
          JSON
          cat > out/focus/callcreate.json <<'JSON'
          {
            "valid_address_prob": 0.90,
            "meaningful_constant_prob": 0.20,
            "small_constant_prob": 0.20,
            "push_weight": 0.18,
            "dup_weight": 0.18,
            "call_weight": 0.20,
            "returndatacopy_weight": 0.10,
            "create_weight": 0.10,
            "uncommon_non_term_weight": 0.18,
            "valid_jump_prob": 0.95
          }
          JSON

          docker start monad-v0160-adjudicator >/dev/null
          docker exec monad-v0160-adjudicator bash -lc '
            set -uo pipefail
            run_one() {
              case_name="$1"; binary="$2"; seed="$3"; focus="$4"; nohook="$5"; rep="$6"
              args=(--implementation compiler --revision OSAKA --seed "$seed" --iterations-per-run 100 --messages 4 --runs 1 --print-stats --focus "$focus")
              log="/out/logs/${case_name}.rep${rep}.log"
              rcfile="/out/rc/${case_name}.rep${rep}.rc"
              if [[ "$nohook" == 1 ]]; then
                timeout --signal=TERM --kill-after=20s 900s \
                  env MONAD_COMPILER_FUZZING=1 MONAD_FUZZ_NO_HOOK=1 \
                  stdbuf -oL -eL "$binary" "${args[@]}" >"$log" 2>&1
              else
                timeout --signal=TERM --kill-after=20s 900s \
                  env MONAD_COMPILER_FUZZING=1 \
                  stdbuf -oL -eL "$binary" "${args[@]}" >"$log" 2>&1
              fi
              rc=$?
              printf "%s\n" "$rc" >"$rcfile"
              return 0
            }

            for rep in 1 2 3; do
              run_one nine_nohook_stateheavy /out/bin/monad-nine-adjudicator 11956999547095953342 /out/focus/stateheavy.json 1 "$rep"
              run_one nine_hook_callcreate /out/bin/monad-nine-adjudicator 2863043607998573456 /out/focus/callcreate.json 0 "$rep"
              run_one ten_nohook_stateheavy /out/bin/monad-ten-adjudicator 8255388444298519423 /out/focus/stateheavy.json 1 "$rep"
              run_one ten_hook_callcreate /out/bin/monad-ten-adjudicator 14820068421627436469 /out/focus/callcreate.json 0 "$rep"
            done
          '

      - name: Adjudicate reproducibility and context identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp SOURCE_STATUS.txt SUBMODULES.txt out/meta/
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('out')
          cases = [
              'nine_nohook_stateheavy',
              'nine_hook_callcreate',
              'ten_nohook_stateheavy',
              'ten_hook_callcreate',
          ]
          result_cases = []
          all_reproduced = True
          for case in cases:
              reps = []
              diag_hashes = []
              for rep in (1, 2, 3):
                  log_path = root/'logs'/f'{case}.rep{rep}.log'
                  rc_path = root/'rc'/f'{case}.rep{rep}.rc'
                  if not log_path.is_file() or not rc_path.is_file():
                      reps.append({'rep': rep, 'missing': True})
                      all_reproduced = False
                      continue
                  text = log_path.read_text(errors='replace')
                  rc = int(rc_path.read_text().strip())
                  start = text.find('DIAG_STATE_MAP_SIZE')
                  end = text.find('DIAG_CONTEXT_END', start)
                  diag = text[start:end + len('DIAG_CONTEXT_END')] if start >= 0 and end >= 0 else ''
                  dh = hashlib.sha256(diag.encode()).hexdigest() if diag else None
                  if dh:
                      diag_hashes.append(dh)
                  ctx_match = re.search(
                      r'DIAG_CONTEXT seed=(\d+) iteration=(-?\d+) message=(-?\d+) kind=(-?\d+) flags=(\d+) depth=(-?\d+) gas=(-?\d+) block=(\d+) timestamp=(\d+) contract_size=(\d+) input_size=(\d+)',
                      diag,
                  )
                  size_match = re.search(r'DIAG_STATE_MAP_SIZE interpreter=(\d+) compiler=(\d+)', diag)
                  only_i = re.findall(r'DIAG_ONLY_INTERPRETER=([0-9a-f]{40})', diag)
                  only_c = re.findall(r'DIAG_ONLY_COMPILER=([0-9a-f]{40})', diag)
                  reproduced = rc == 134 and bool(diag) and bool(size_match) and bool(ctx_match)
                  all_reproduced &= reproduced
                  reps.append({
                      'rep': rep,
                      'return_code': rc,
                      'reproduced': reproduced,
                      'diagnostic_sha256': dh,
                      'context': ({
                          'seed': ctx_match.group(1),
                          'iteration': int(ctx_match.group(2)),
                          'message': int(ctx_match.group(3)),
                          'kind': int(ctx_match.group(4)),
                          'flags': int(ctx_match.group(5)),
                          'depth': int(ctx_match.group(6)),
                          'gas': int(ctx_match.group(7)),
                          'block': int(ctx_match.group(8)),
                          'timestamp': ctx_match.group(9),
                          'contract_size': int(ctx_match.group(10)),
                          'input_size': int(ctx_match.group(11)),
                      } if ctx_match else None),
                      'state_map_sizes': ({
                          'interpreter': int(size_match.group(1)),
                          'compiler': int(size_match.group(2)),
                      } if size_match else None),
                      'only_interpreter': only_i,
                      'only_compiler': only_c,
                      'log_sha256': hashlib.sha256(log_path.read_bytes()).hexdigest(),
                  })
              stable = len(diag_hashes) == 3 and len(set(diag_hashes)) == 1
              all_reproduced &= stable
              result_cases.append({
                  'case': case,
                  'reproduced_3_of_3': all(r.get('reproduced') for r in reps),
                  'diagnostic_stable_3_of_3': stable,
                  'repetitions': reps,
              })

          decision = (
              'REPRODUCED_STATE_MAP_DIVERGENCE_REQUIRES_ROOT_CAUSE_MINIMIZATION'
              if all_reproduced else
              'NONDETERMINISTIC_OR_INFRASTRUCTURE_SIGNAL'
          )
          result = {
              'source_commit': 'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'reference_engine': 'Monad InterpreterOnly',
              'candidate_engine': 'Monad CompilerOnly',
              'cases': result_cases,
              'all_cases_reproduced_3_of_3': all_reproduced,
              'decision': decision,
              'submission_ready': False,
              'release_note': 'A reproducible internal state-map differential is not a bounty finding until minimized to a valid block/transaction, accepted post-state-root divergence, normal full-node ingress, matched fix, current scope, and duplicate clearance.',
          }
          (root/'ADJUDICATION.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          PY
          find out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
          tar --sort=name --mtime='UTC 2026-08-25' --owner=0 --group=0 --numeric-owner \
            -C out -czf monad-v0160-native-diff-adjudicator-20260825.tar.gz \
            ADJUDICATION.json SHA256SUMS bin diagnostics focus logs meta rc
          sha256sum monad-v0160-native-diff-adjudicator-20260825.tar.gz \
            > monad-v0160-native-diff-adjudicator-20260825.tar.gz.sha256

      - name: Upload adjudication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monad-v0160-native-diff-adjudicator-20260825
          path: |
            monad-v0160-native-diff-adjudicator-20260825.tar.gz
            monad-v0160-native-diff-adjudicator-20260825.tar.gz.sha256
            out/ADJUDICATION.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
