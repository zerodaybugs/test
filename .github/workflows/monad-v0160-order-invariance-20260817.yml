name: Monad v0.16.0 state commit order invariance

on:
  push:
    branches:
      - agent/monad-v0160-deep-hunt-20260817
    paths:
      - .github/workflows/monad-v0160-order-invariance-20260817.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monad-v0160-order-invariance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-order-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ubuntu:26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install exact build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            apt-utils ca-certificates cmake curl dialog g++-15 gcc-15 git gnupg \
            make ninja-build pkg-config python-is-python3 python3 ripgrep wget \
            libarchive-dev libbenchmark-dev libbrotli-dev libcap-dev libcgroup-dev \
            libcli11-dev libcrypto++-dev libgmock-dev libgmp-dev libgtest-dev \
            libtbb-dev liburing-dev libzstd-dev \
            libboost1.83-dev libboost-context1.83.0 libboost-context1.83-dev \
            libboost-filesystem1.83.0 libboost-filesystem1.83-dev \
            libboost-json1.83.0 libboost-json1.83-dev \
            libboost-stacktrace1.83.0 libboost-stacktrace1.83-dev \
            libboost-test1.83.0 libboost-test1.83-dev
          gcc-15 --version | head -1
          g++-15 --version | head -1

      - name: Clone exact in-scope execution source
        shell: bash
        run: |
          set -Eeuo pipefail
          EXEC_COMMIT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          git clone --filter=blob:none https://github.com/category-labs/monad.git monad-execution
          git -C monad-execution checkout --detach "$EXEC_COMMIT"
          git -C monad-execution submodule sync --recursive
          git -C monad-execution submodule update --init --recursive --depth 1
          test "$(git -C monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"
          mkdir -p evidence
          {
            echo "execution_commit=$(git -C monad-execution rev-parse HEAD)"
            echo "runner=$(uname -a)"
            echo "gcc=$(gcc-15 --version | head -1)"
            echo "gxx=$(g++-15 --version | head -1)"
            git -C monad-execution submodule status --recursive
          } > evidence/PROVENANCE.txt

      - name: Add exact-source permutation oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > monad-execution/category/execution/monad/test_order_invariance_research.cpp <<'CPP'
          #include <category/core/address.hpp>
          #include <category/core/bytes.hpp>
          #include <category/execution/ethereum/core/account.hpp>
          #include <category/execution/ethereum/db/commit_builder.hpp>
          #include <category/execution/ethereum/db/trie_db.hpp>
          #include <category/execution/ethereum/db/util.hpp>
          #include <category/execution/ethereum/state2/state_deltas.hpp>
          #include <category/execution/monad/db/page_commit_builder.hpp>
          #include <category/mpt/util.hpp>
          #include <gtest/gtest.h>
          #include <algorithm>
          #include <array>
          #include <cstdint>
          #include <cstring>
          #include <numeric>
          #include <optional>
          #include <random>
          #include <vector>

          using namespace monad;
          using namespace monad::mpt;

          namespace {
          constexpr size_t NACC = 48;
          constexpr std::array<uint64_t, 20> SLOTS = {
              0,1,2,63,64,126,127,128,129,130,
              255,256,257,511,512,1023,1024,1025,4095,4096};

          Address addr(size_t i) {
              Address a{};
              a.bytes[0] = static_cast<uint8_t>(0x40 + (i >> 8));
              a.bytes[18] = static_cast<uint8_t>(i >> 8);
              a.bytes[19] = static_cast<uint8_t>(i + 1);
              return a;
          }
          bytes32_t key(size_t a, size_t s) {
              bytes32_t k{SLOTS.at(s)};
              if ((a + s) % 5 == 0) {
                  k.bytes[0] = static_cast<uint8_t>(0x80 | (a & 0x3f));
                  k.bytes[7] = static_cast<uint8_t>(s + 1);
              }
              return k;
          }
          bytes32_t value(size_t a, size_t s, unsigned phase) {
              bytes32_t v{};
              v.bytes[0] = static_cast<uint8_t>(0xa0 + phase);
              v.bytes[28] = static_cast<uint8_t>(a >> 8);
              v.bytes[29] = static_cast<uint8_t>(a + 1);
              v.bytes[30] = static_cast<uint8_t>(s + 1);
              v.bytes[31] = static_cast<uint8_t>((a * 37 + s * 11 + phase) & 0xff);
              return v;
          }
          Account account(size_t i, unsigned phase) {
              return Account{
                  .nonce = static_cast<uint64_t>(i + 1 + phase),
                  .balance = static_cast<uint64_t>(100000 + i * 101 + phase * 17)};
          }
          StateDeltas deltas(uint64_t seed, unsigned phase) {
              std::mt19937_64 rng(seed);
              std::vector<size_t> ao(NACC);
              std::iota(ao.begin(), ao.end(), 0);
              std::shuffle(ao.begin(), ao.end(), rng);
              StateDeltas out;
              for (size_t a : ao) {
                  std::vector<size_t> so(SLOTS.size());
                  std::iota(so.begin(), so.end(), 0);
                  std::shuffle(so.begin(), so.end(), rng);
                  StorageDeltas storage;
                  for (size_t s : so) {
                      bytes32_t const prev = phase == 0 ? bytes32_t{} : value(a,s,0);
                      bytes32_t next = value(a,s,phase);
                      if (phase == 1 && ((a + s) % 7 == 0)) next = bytes32_t{};
                      storage.emplace(key(a,s), StorageDelta{prev,next});
                  }
                  std::optional<Account> const prev = phase == 0
                      ? std::nullopt : std::make_optional(account(a,0));
                  out.emplace(addr(a), StateDelta{
                      .account = {prev, std::make_optional(account(a,phase))},
                      .storage = std::move(storage)});
              }
              return out;
          }
          bool eq(bytes32_t const &a, bytes32_t const &b) {
              return std::memcmp(a.bytes,b.bytes,sizeof(a.bytes)) == 0;
          }
          struct Roots { bytes32_t r0; bytes32_t r1; };
          Roots run(bool page, uint64_t seed) {
              std::unique_ptr<StateMachine> sm = page
                  ? std::unique_ptr<StateMachine>{std::make_unique<MonadInMemoryMachine>()}
                  : std::unique_ptr<StateMachine>{std::make_unique<InMemoryMachine>()};
              mpt::Db db{std::move(sm)};
              TrieDb trie{db};
              EXPECT_EQ(trie.is_page_encoded(), page);

              auto d0 = deltas(seed ^ 0x9e3779b97f4a7c15ULL,0);
              auto b0 = make_commit_builder(0,trie);
              b0->add_state_deltas(d0);
              auto n0 = db.upsert(nullptr,b0->build(finalized_nibbles),0);
              trie.reset_root(std::move(n0),0);
              bytes32_t const r0 = trie.state_root();

              for (size_t a=0;a<NACC;++a) {
                  auto ac = trie.read_account(addr(a));
                  EXPECT_TRUE(ac.has_value());
                  ASSERT_TRUE(ac.has_value());
                  EXPECT_EQ(ac->nonce,account(a,0).nonce);
                  EXPECT_EQ(ac->balance,account(a,0).balance);
                  for (size_t s=0;s<SLOTS.size();++s)
                      EXPECT_TRUE(eq(trie.read_storage(addr(a),ac->incarnation,key(a,s)),value(a,s,0)));
              }

              auto d1 = deltas(seed ^ 0xd1b54a32d192ed03ULL,1);
              auto b1 = make_commit_builder(1,trie);
              b1->add_state_deltas(d1);
              auto n1 = db.upsert(trie.get_root(),b1->build(finalized_nibbles),1);
              trie.reset_root(std::move(n1),1);
              bytes32_t const r1 = trie.state_root();

              for (size_t a=0;a<NACC;++a) {
                  auto ac = trie.read_account(addr(a));
                  EXPECT_TRUE(ac.has_value());
                  ASSERT_TRUE(ac.has_value());
                  EXPECT_EQ(ac->nonce,account(a,1).nonce);
                  EXPECT_EQ(ac->balance,account(a,1).balance);
                  for (size_t s=0;s<SLOTS.size();++s) {
                      bytes32_t expected = ((a+s)%7 == 0) ? bytes32_t{} : value(a,s,1);
                      EXPECT_TRUE(eq(trie.read_storage(addr(a),ac->incarnation,key(a,s)),expected));
                  }
              }
              return {r0,r1};
          }
          void check(bool page) {
              constexpr std::array<uint64_t,24> seeds = {
                  0,1,2,3,7,11,31,63,64,127,128,255,
                  256,511,512,1023,1024,1337,0xdeadbeefULL,
                  0x123456789abcdef0ULL,0xffffffffffffffffULL,
                  0xa5a5a5a5a5a5a5a5ULL,0x55aa55aa55aa55aaULL,
                  0x3141592653589793ULL};
              Roots const baseline = run(page,seeds.front());
              for (size_t i=1;i<seeds.size();++i) {
                  Roots const candidate = run(page,seeds[i]);
                  EXPECT_TRUE(eq(candidate.r0,baseline.r0)) << "seed=" << seeds[i];
                  EXPECT_TRUE(eq(candidate.r1,baseline.r1)) << "seed=" << seeds[i];
              }
          }
          }

          TEST(MonadOrderInvariance, SlotEncoded) { check(false); }
          TEST(MonadOrderInvariance, PageEncoded) { check(true); }
          CPP
          sha256sum monad-execution/category/execution/monad/test_order_invariance_research.cpp \
            > evidence/TEST_SOURCE.sha256

      - name: Configure and build only the oracle
        shell: bash
        env:
          CC: gcc-15
          CXX: g++-15
          CMAKE_BUILD_TYPE: Release
          CMAKE_TOOLCHAIN_FILE: category/core/toolchains/gcc-avx2.cmake
          GIT_COMMIT_HASH: e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
        run: |
          set -Eeuo pipefail
          cd monad-execution
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee ../evidence/configure.log
          /usr/bin/time -v cmake --build build --target test_order_invariance_research --parallel 2 \
            2>&1 | tee ../evidence/build.log
          sha256sum build/category/execution/test_order_invariance_research \
            > ../evidence/BINARY.sha256

      - name: Run matched oracle three times
        shell: bash
        run: |
          set -Eeuo pipefail
          BIN="$PWD/monad-execution/build/category/execution/test_order_invariance_research"
          : > evidence/RUNS.tsv
          for r in 1 2 3; do
            before="$(cat /sys/fs/cgroup/memory.events 2>/dev/null || true)"
            set +e
            /usr/bin/time -v "$BIN" \
              --gtest_filter='MonadOrderInvariance.*' \
              --gtest_color=no \
              > "evidence/run-${r}.stdout.log" \
              2> "evidence/run-${r}.stderr.log"
            rc=$?
            set -e
            after="$(cat /sys/fs/cgroup/memory.events 2>/dev/null || true)"
            printf '%s\t%s\n' "$r" "$rc" >> evidence/RUNS.tsv
            printf '%s\n' "$before" > "evidence/run-${r}.memory.before"
            printf '%s\n' "$after" > "evidence/run-${r}.memory.after"
            test "$rc" -eq 0
            grep -q '\[  PASSED  \] 2 tests' "evidence/run-${r}.stdout.log"
          done
          grep -qv $'\t0$' evidence/RUNS.tsv && exit 1 || true

      - name: Package machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          e=Path('evidence')
          runs=[]
          for line in (e/'RUNS.tsv').read_text().splitlines():
              r,rc=line.split('\t')
              runs.append({'run':int(r),'returncode':int(rc)})
          result={
              'decision':'KILL_ORDER_DEPENDENCE_CANDIDATE',
              'exact_execution_commit':'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'slot_encoded_permutations':24,
              'page_encoded_permutations':24,
              'blocks_per_case':2,
              'accounts':48,
              'slots_per_account':20,
              'runs':runs,
              'state_root_mismatches':0,
              'logical_state_mismatches':0,
              'severity_proven':'NONE_NEW',
              'submit_ready_zip':False,
          }
          (e/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (e/'REPORT.md').write_text('''# Monad v0.16.0 state-commit insertion-order oracle\n\nDecision: **KILL — no state-root or logical-state divergence**.\n\nThe exact slot-encoded and page-encoded commit paths produced identical roots for\n24 insertion permutations across two consecutive blocks, 48 accounts, and 20 storage\nkeys per account. The complete oracle ran three times. This is negative research\nevidence and must not be submitted as a bounty finding.\n''')
          manifest=[]
          for p in sorted(e.rglob('*')):
              if p.is_file():
                  manifest.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(e)}')
          (e/'SHA256SUMS').write_text('\n'.join(manifest)+'\n')
          PY
          tar --sort=name --mtime='UTC 2026-08-17' --owner=0 --group=0 --numeric-owner \
            -I 'zstd -T0 -10' -cf monad-v0160-order-invariance-evidence.tar.zst evidence
          sha256sum monad-v0160-order-invariance-evidence.tar.zst \
            > monad-v0160-order-invariance-evidence.tar.zst.sha256

      - name: Upload exact oracle evidence
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-order-invariance-evidence-${{ github.run_id }}
          path: |
            monad-v0160-order-invariance-evidence.tar.zst
            monad-v0160-order-invariance-evidence.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
