name: Monad v0.16.0 generic packet replay binary

on:
  push:
    branches:
      - agent/monad-v0160-packet-replay-20260817
    paths:
      - .github/workflows/monad-v0160-packet-replay-20260817.yml
      - tools/monad_raptorcast_external_replay.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monad-v0160-packet-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-replay-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out generic harness source
        uses: actions/checkout@v4

      - name: Install build dependencies and pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake ninja-build pkg-config libssl-dev \
            protobuf-compiler zstd liburing-dev libnuma-dev
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Clone immutable public Monad v0.16.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          BFT_COMMIT='c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
          EXEC_COMMIT='e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach "$BFT_COMMIT"
          git -C monad-bft submodule sync --recursive
          git -C monad-bft submodule update --init --recursive --depth 1
          test "$(git -C monad-bft rev-parse HEAD)" = "$BFT_COMMIT"
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = "$EXEC_COMMIT"
          {
            echo "bft_commit=$(git -C monad-bft rev-parse HEAD)"
            echo "execution_commit=$(git -C monad-bft/monad-execution rev-parse HEAD)"
            git -C monad-bft submodule status --recursive
          } > SOURCE_PROVENANCE.txt

      - name: Inject generic environment-driven replay test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path('monad-bft/monad-raptorcast/src/udp.rs')
          harness = Path('tools/monad_raptorcast_external_replay.rs').read_text()
          text = target.read_text()
          marker = '\n}'
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('could not locate final module brace')
          target.write_text(text[:pos] + '\n\n' + harness + text[pos:])
          PY
          sha256sum \
            monad-bft/monad-raptorcast/src/udp.rs \
            tools/monad_raptorcast_external_replay.rs \
            > HARNESS_INPUTS.sha256

      - name: Build exact monad-raptorcast test executable
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cd monad-bft
          cargo test --locked -p monad-raptorcast \
            external_packet_replay_scenario --no-run

      - name: Locate executable and run authentic control
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact "$RUNNER_TEMP/corpus"
          BIN=''
          TEST_NAME=''
          while IFS= read -r candidate; do
            if [[ -x "$candidate" ]] && file "$candidate" | grep -q 'ELF'; then
              listed="$($candidate --list 2>/dev/null || true)"
              if grep -q 'external_packet_replay_scenario' <<<"$listed"; then
                BIN="$candidate"
                TEST_NAME="$(grep 'external_packet_replay_scenario' <<<"$listed" | head -1 | sed 's/: test$//')"
                break
              fi
            fi
          done < <(find monad-bft/target/debug/deps -maxdepth 1 -type f -name 'monad_raptorcast-*' | sort)
          test -n "$BIN"
          test -n "$TEST_NAME"
          cp "$BIN" artifact/monad-raptorcast-replay-v0160
          printf '%s\n' "$TEST_NAME" > artifact/TEST_NAME.txt
          file "$BIN" > artifact/BINARY.file.txt
          ldd "$BIN" > artifact/BINARY.ldd.txt
          sha256sum artifact/monad-raptorcast-replay-v0160 > artifact/BINARY.sha256

          MONAD_REPLAY_MODE=emit \
          MONAD_REPLAY_DIR="$RUNNER_TEMP/corpus" \
          MONAD_REPLAY_ROUNDS=42 \
          MONAD_REPLAY_APP_SIZE=131072 \
          "$BIN" --exact "$TEST_NAME" --nocapture \
            2>&1 | tee artifact/EMIT_CONTROL.log

          {
            printf 'round\t1\t42\n'
            awk -F '\t' '$4 == 42 && $5 == 0 {print "feed\t1\t0\t" $2 "\t" $3}' \
              "$RUNNER_TEMP/corpus/manifest.tsv"
            printf 'snapshot\tauthentic-control\n'
          } > "$RUNNER_TEMP/corpus/scenario.tsv"

          MONAD_REPLAY_MODE=replay \
          MONAD_REPLAY_DIR="$RUNNER_TEMP/corpus" \
          MONAD_REPLAY_STAGE=accept-both-publish-v0 \
          "$BIN" --exact "$TEST_NAME" --nocapture \
            2>&1 | tee artifact/REPLAY_CONTROL.log

          cp "$RUNNER_TEMP/corpus/manifest.tsv" artifact/CONTROL_MANIFEST.tsv
          cp "$RUNNER_TEMP/corpus/scenario.tsv" artifact/CONTROL_SCENARIO.tsv
          cp "$RUNNER_TEMP/corpus/replay_output.tsv" artifact/CONTROL_OUTPUT.tsv
          awk -F '\t' '$2 == "feed" && $4 > 0 {decoded += $4} END {exit decoded == 1 ? 0 : 1}' \
            artifact/CONTROL_OUTPUT.tsv

      - name: Upload generic replay executable
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-generic-packet-replay-${{ github.run_id }}
          path: |
            artifact
            SOURCE_PROVENANCE.txt
            HARNESS_INPUTS.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
