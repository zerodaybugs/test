name: Public Monad v0.16.0 execution dependency vendor 20260809

on:
  push:
    branches:
      - agent/monad-v0160-vendor-20260809
    paths:
      - .github/workflows/monad-v0160-public-execution-vendor-20260809.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-v0160-public-execution-vendor-20260809.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-public-execution-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install exact toolchain and packaging tools
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Vendor exact public execution workspace dependencies
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -Eeuo pipefail
          git config --global http.version HTTP/1.1
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach v0.16.0
          test "$(git -C monad-bft rev-parse HEAD)" = \
            "c616743d1358186605e1c1b74a3d6c4fdd9dd48c"
          git -C monad-bft submodule sync monad-execution
          git -C monad-bft submodule update --init --depth 1 monad-execution
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = \
            "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"

          cd monad-bft/monad-execution/rust
          cargo fetch --locked
          cargo vendor --locked --versioned-dirs execution-vendor \
            > execution-vendor.config.toml
          cargo metadata --offline --locked --no-deps --format-version 1 \
            --config 'source.crates-io.replace-with="vendored-sources"' \
            --config 'source.vendored-sources.directory="execution-vendor"' \
            > EXECUTION_CARGO_METADATA.offline.json
          {
            echo 'bft_commit=c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
            echo 'execution_commit=e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "generated_utc=$(date -u +%FT%TZ)"
          } > EXECUTION_VENDOR_METADATA.txt
          sha256sum Cargo.lock execution-vendor.config.toml \
            EXECUTION_CARGO_METADATA.offline.json \
            > EXECUTION_VENDOR_INPUTS.sha256
          find execution-vendor -type f -print0 | sort -z | xargs -0 sha256sum \
            > EXECUTION_VENDOR_FILES.sha256

          # From monad-bft/monad-execution/rust, three parents is the
          # checked-out workflow repository root. Keep the artifact inside the
          # checkout so actions/upload-artifact can resolve it deterministically.
          tar --zstd -cf ../../../monad-v0160-public-execution-vendor.tar.zst \
            execution-vendor execution-vendor.config.toml \
            EXECUTION_CARGO_METADATA.offline.json EXECUTION_VENDOR_METADATA.txt \
            EXECUTION_VENDOR_INPUTS.sha256 EXECUTION_VENDOR_FILES.sha256
          cd ../../..
          sha256sum monad-v0160-public-execution-vendor.tar.zst \
            > monad-v0160-public-execution-vendor.tar.zst.sha256
          du -h monad-v0160-public-execution-vendor.tar.zst

      - name: Upload public execution dependency vendor
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-public-execution-vendor-20260809
          path: |
            monad-v0160-public-execution-vendor.tar.zst
            monad-v0160-public-execution-vendor.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
