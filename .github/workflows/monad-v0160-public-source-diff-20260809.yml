name: Public Monad v0.16.0 source and release diff 20260809

on:
  push:
    branches:
      - agent/monad-v0160-source-diff-20260809
    paths:
      - .github/workflows/monad-v0160-public-source-diff-20260809.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-v0160-public-source-diff-20260809.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd ripgrep

      - name: Clone exact public release and generate public diff corpus
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='v0.16.0'
          previous='3dbbea084128124cf12c137860dcbf615ff51fff'
          mkdir -p out/source out/diff out/index

          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git out/source/monad-bft
          git -C out/source/monad-bft checkout --detach "$tag"
          git -C out/source/monad-bft submodule sync --recursive
          git -C out/source/monad-bft submodule update --init --recursive --depth 1

          release_commit="$(git -C out/source/monad-bft rev-parse HEAD)"
          execution_commit="$(git -C out/source/monad-bft/monad-execution rev-parse HEAD)"
          previous_execution="$(git -C out/source/monad-bft ls-tree "$previous" monad-execution | awk '{print $3}')"

          {
            echo "tag=$tag"
            echo "release_commit=$release_commit"
            echo "previous_bft_commit=$previous"
            echo "release_execution_commit=$execution_commit"
            echo "previous_execution_gitlink=$previous_execution"
            echo "generated_utc=$(date -u +%FT%TZ)"
          } > out/METADATA.txt

          git -C out/source/monad-bft diff --stat "$previous".."$release_commit" \
            > out/diff/BFT_DIFF_STAT.txt
          git -C out/source/monad-bft diff --numstat "$previous".."$release_commit" \
            > out/diff/BFT_DIFF_NUMSTAT.tsv
          git -C out/source/monad-bft diff --name-status "$previous".."$release_commit" \
            > out/diff/BFT_DIFF_NAME_STATUS.tsv
          git -C out/source/monad-bft log --date=iso-strict --format='%H%x09%ad%x09%s' \
            "$previous".."$release_commit" > out/diff/BFT_COMMITS.tsv
          git -C out/source/monad-bft diff --binary "$previous".."$release_commit" \
            > out/diff/BFT_FULL.patch

          # Export the previous execution source as a sibling worktree only for
          # an exact public execution-submodule comparison.
          git clone --filter=blob:none https://github.com/category-labs/monad.git out/previous-execution
          git -C out/previous-execution checkout --detach "$previous_execution"
          git -C out/previous-execution submodule update --init --recursive --depth 1
          git -C out/source/monad-bft/monad-execution diff --stat \
            "$previous_execution".."$execution_commit" > out/diff/EXEC_DIFF_STAT.txt || true
          git -C out/source/monad-bft/monad-execution diff --numstat \
            "$previous_execution".."$execution_commit" > out/diff/EXEC_DIFF_NUMSTAT.tsv || true
          git -C out/source/monad-bft/monad-execution diff --name-status \
            "$previous_execution".."$execution_commit" > out/diff/EXEC_DIFF_NAME_STATUS.tsv || true
          git -C out/source/monad-bft/monad-execution log --date=iso-strict --format='%H%x09%ad%x09%s' \
            "$previous_execution".."$execution_commit" > out/diff/EXEC_COMMITS.tsv || true
          git -C out/source/monad-bft/monad-execution diff --binary \
            "$previous_execution".."$execution_commit" > out/diff/EXEC_FULL.patch || true

          # Generic security-relevant index only; no private hypothesis or
          # crafted input is stored in this public workflow.
          terms=(
            'TODO.*DOS' 'TODO.*DoS' 'unbounded' 'panic!' 'unreachable!'
            'expect(' 'assert!' 'unsafe ' 'rate_limit' 'cache' 'equivocation'
            'signature' 'recover_pubkey' 'verify_force' 'prefilter' 'statesync'
            'blocksync' 'timeout' 'no_endorse' 'AdvanceRound' 'PublishToFullNodes'
          )
          for term in "${terms[@]}"; do
            printf '\n===== %s =====\n' "$term" >> out/index/SECURITY_TERMS.txt
            rg -n -i -C 2 "$term" out/source/monad-bft \
              --glob '!vendor/**' --glob '!target/**' --glob '!*.lock' \
              >> out/index/SECURITY_TERMS.txt || true
          done

          git -C out/source/monad-bft submodule status --recursive \
            > out/SUBMODULES.txt
          find out/source/monad-bft -type f -not -path '*/.git/*' -print0 \
            | sort -z | xargs -0 sha256sum > out/SOURCE_SHA256SUMS

          # Remove repository metadata and the auxiliary previous worktree.
          rm -rf out/source/monad-bft/.git out/previous-execution
          find out/source/monad-bft -name .git -type f -delete
          find out/source/monad-bft -name .git -type d -prune -exec rm -rf {} +

          tar --zstd -cf monad-v0160-public-source-diff.tar.zst -C out .
          sha256sum monad-v0160-public-source-diff.tar.zst \
            > monad-v0160-public-source-diff.tar.zst.sha256
          du -h monad-v0160-public-source-diff.tar.zst

      - name: Upload public source and diff corpus
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-public-source-diff-20260809
          path: |
            monad-v0160-public-source-diff.tar.zst
            monad-v0160-public-source-diff.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
