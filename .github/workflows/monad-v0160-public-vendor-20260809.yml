name: Public Monad v0.16.0 dependency vendor 20260809

on:
  push:
    branches:
      - agent/monad-v0160-vendor-20260809
    paths:
      - .github/workflows/monad-v0160-public-vendor-20260809.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/monad-v0160-public-vendor-20260809.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-public-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install exact toolchain and packaging tools
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Vendor exact public release dependencies
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -Eeuo pipefail
          git config --global http.version HTTP/1.1
          git clone --filter=blob:none --no-recurse-submodules \
            https://github.com/category-labs/monad-bft.git monad-bft
          git -C monad-bft checkout --detach v0.16.0
          test "$(git -C monad-bft rev-parse HEAD)" = \
            "c616743d1358186605e1c1b74a3d6c4fdd9dd48c"
          git -C monad-bft submodule sync --recursive
          git -C monad-bft submodule update --init --recursive --depth 1
          test "$(git -C monad-bft/monad-execution rev-parse HEAD)" = \
            "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"

          cd monad-bft
          mkdir -p .cargo
          cargo fetch --locked
          cargo vendor --locked vendor > .cargo/config.toml

          # category-labs/monoio includes its repository-root README from
          # source; cargo vendor omits that non-package parent file. Restore the
          # exact lock-pinned public README as a documentation-only input.
          monoio_readme="$(find "$HOME/.cargo/git/checkouts" -type f -path '*/monoio-*/README.md' -print -quit)"
          if [[ -n "$monoio_readme" ]]; then
            cp "$monoio_readme" vendor/README.md
            sha256sum "$monoio_readme" vendor/README.md \
              > MONOIO_VENDOR_DOC_REPAIR.txt
          fi

          cargo metadata --offline --locked --no-deps --format-version 1 \
            > CARGO_METADATA.offline.json
          {
            echo 'bft_commit=c616743d1358186605e1c1b74a3d6c4fdd9dd48c'
            echo 'execution_commit=e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0'
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "generated_utc=$(date -u +%FT%TZ)"
          } > VENDOR_METADATA.txt
          sha256sum Cargo.lock .cargo/config.toml CARGO_METADATA.offline.json \
            > VENDOR_INPUTS.sha256
          find vendor -type f -print0 | sort -z | xargs -0 sha256sum \
            > VENDOR_FILES.sha256

          tar --zstd -cf ../monad-v0160-public-vendor.tar.zst \
            vendor .cargo CARGO_METADATA.offline.json VENDOR_METADATA.txt \
            VENDOR_INPUTS.sha256 VENDOR_FILES.sha256 MONOIO_VENDOR_DOC_REPAIR.txt
          cd ..
          sha256sum monad-v0160-public-vendor.tar.zst \
            > monad-v0160-public-vendor.tar.zst.sha256
          du -h monad-v0160-public-vendor.tar.zst

      - name: Upload public dependency vendor
        uses: actions/upload-artifact@v4
        with:
          name: monad-v0160-public-vendor-20260809
          path: |
            monad-v0160-public-vendor.tar.zst
            monad-v0160-public-vendor.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
