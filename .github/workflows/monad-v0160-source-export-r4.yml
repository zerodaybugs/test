name: Monad v0.16.0 public source export R4

on:
  push:
    branches:
      - tooling/monad-v0160-source-20260823-r4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Export pinned public source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/src out/meta
          git clone --recurse-submodules --shallow-submodules --depth 1 --branch v0.16.0 \
            https://github.com/category-labs/monad-bft.git out/src/monad-bft-v0.16.0
          (
            cd out/src/monad-bft-v0.16.0
            git rev-parse HEAD > ../../meta/MONAD_BFT_COMMIT.txt
            git tag --points-at HEAD > ../../meta/MONAD_BFT_TAGS.txt
            git status --porcelain=v1 > ../../meta/MONAD_BFT_STATUS.txt
            git submodule status --recursive > ../../meta/SUBMODULES.txt
          )
          test "$(cat out/meta/MONAD_BFT_COMMIT.txt)" = "c616743d1358186605e1c1b74a3d6c4fdd9dd48c"
          grep -Fxq 'v0.16.0' out/meta/MONAD_BFT_TAGS.txt
          test ! -s out/meta/MONAD_BFT_STATUS.txt
          grep -Eq '^ e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0 monad-execution' out/meta/SUBMODULES.txt
          rm -rf out/src/monad-bft-v0.16.0/.git
          find out/src/monad-bft-v0.16.0 -type d -name .git -prune -exec rm -rf {} +
          tar --sort=name --mtime='UTC 2026-08-23' --owner=0 --group=0 --numeric-owner \
            -C out/src --zstd -cf out/monad-bft-v0.16.0-full-source.tar.zst monad-bft-v0.16.0
          sha256sum out/monad-bft-v0.16.0-full-source.tar.zst out/meta/* > out/SHA256SUMS
          test "$(stat -c '%s' out/monad-bft-v0.16.0-full-source.tar.zst)" -gt 100000000

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: monad-v0160-full-source-r4
          path: |
            out/monad-bft-v0.16.0-full-source.tar.zst
            out/meta
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
