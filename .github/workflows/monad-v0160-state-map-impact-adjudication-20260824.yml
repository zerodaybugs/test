name: Monad v0.16.0 state-map impact adjudication 20260824

on:
  push:
    branches:
      - tooling/monad-v0160-state-map-impact-adjudication-20260824
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4

      - name: Clone exact public execution source
        shell: bash
        run: |
          set -euo pipefail
          git config --global submodule.fetchJobs "$(nproc)"
          git clone --recurse-submodules https://github.com/category-labs/monad.git monad-execution
          cd monad-execution
          git checkout e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          git status --porcelain=v1 > ../SOURCE_STATUS.txt
          test ! -s ../SOURCE_STATUS.txt
          git submodule status --recursive > ../SUBMODULES.txt

      - name: Build official dependency image
        shell: bash
        run: |
          set -euo pipefail
          docker build --target base -t monad-v0160-base -f monad-execution/docker/Dockerfile monad-execution

      - name: Build diagnostic MONAD_NINE and MONAD_TEN binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bin out/logs out/rc out/meta out/focus
          docker run --name monad-v0160-state-map-adjudicator \
            -v "$PWD/monad-execution:/src" \
            -v "$PWD/out:/out" \
            monad-v0160-base bash -lc '
              set -euo pipefail
              cd /src
              cp test/vm/fuzzer/fuzzer.cpp /tmp/fuzzer.original.cpp
              cp test/vm/fuzzer/assertions.cpp /tmp/assertions.original.cpp
              python3 - <<"PY"
          from pathlib import Path

          assertions = Path("test/vm/fuzzer/assertions.cpp")
          s = assertions.read_text()
          needle = "        MONAD_ASSERT(a.current().size() == b.current().size());"
          replacement = """        if (a.current().size() != b.current().size()) {
                      std::cerr << \"STATE_MAP_SIZE_MISMATCH a=\"
                                << a.current().size() << \" b=\"
                                << b.current().size() << std::endl;
                      return;
                  }"""
          if s.count(needle) != 1:
              raise SystemExit("state-size assertion marker changed")
          s = s.replace("#include <unordered_map>", "#include <unordered_map>\n#include <iostream>", 1)
          s = s.replace(needle, replacement, 1)
          assertions.write_text(s)

          original = Path("/tmp/fuzzer.original.cpp").read_text()
          post = """    MONAD_ASSERT(
                  evmone_state->test_state.trie_db.state_root() ==
                  monad_state->test_state.trie_db.state_root());

              return evmone_result.status_code;"""
          post_diag = """    if (evmone_state->test_state.trie_db.state_root() !=
                  monad_state->test_state.trie_db.state_root()) {
                  std::cerr << \"POST_STATE_ROOT_MISMATCH status=\"
                            << static_cast<int>(monad_result.status_code)
                            << std::endl;
                  std::abort();
              }

              return evmone_result.status_code;"""
          if original.count(post) != 1:
              raise SystemExit("post-state-root marker changed")
          original = original.replace(post, post_diag, 1)

          def render(revision: str) -> str:
              page = "true" if revision == "MONAD_TEN" else "false"
              s = original
              s = s.replace(
                  "#include <category/execution/ethereum/chain/ethereum_mainnet.hpp>",
                  "#include <category/execution/monad/chain/monad_mainnet.hpp>\n"
                  "#include <category/vm/evm/monad/revision.h>\n"
                  "#include <category/vm/evm/traits.hpp>",
              )
              marker = "using monad::vm::compiler::native::CompilerConfig;\n"
              insert = marker + (
                  f"\nstatic constexpr monad_revision MONAD_FUZZ_REVISION = {revision};\n"
                  f"static constexpr bool MONAD_FUZZ_PAGE_ENCODED = {page};\n"
              )
              if marker not in s:
                  raise SystemExit("compiler config marker missing")
              s = s.replace(marker, insert, 1)
              s = s.replace(
                  "monad::test::TestState<false> test_state = {};",
                  "monad::test::TestState<MONAD_FUZZ_PAGE_ENCODED> test_state = {};",
                  1,
              )
              s = s.replace("EthereumMainnet const chain{};", "MonadMainnet const chain{};", 1)
              old = (
                  "    MONAD_ASSERT(rev == MONAD_ETH_OSAKA); // TODO switch to monad revisions\n"
                  "    using traits = EvmTraits<MONAD_ETH_OSAKA>;"
              )
              new = (
                  "    MONAD_ASSERT(rev == MonadTraits<MONAD_FUZZ_REVISION>::evm_rev());\n"
                  "    using traits = MonadTraits<MONAD_FUZZ_REVISION>;"
              )
              if old not in s:
                  raise SystemExit("transition marker missing")
              s = s.replace(old, new, 1)
              start = s.index("    auto evmone_vm = evmc::VM(evmc_create_evmone());")
              end = s.index("    auto monad_state = [&] {", start)
              s = s[:start] + (
                  "    auto evmone_state =\n"
                  "        std::make_shared<FuzzerTestState>(vm::VM::InterpreterOnly);\n\n"
              ) + s[end:]
              old_config = "            s->vm.set_compiler_config(create_compiler_config(engine));"
              new_config = (
                  "            if (std::getenv(\"MONAD_FUZZ_NO_HOOK\") != nullptr) {\n"
                  "                s->vm.set_compiler_config(CompilerConfig{\n"
                  "                    .runtime_debug_trace = vm::utils::is_compiler_runtime_debug_trace_enabled,\n"
                  "                    .max_code_size_offset = vm::interpreter::code_size_t::max(),\n"
                  "                    .post_instruction_emit_hook = {},\n"
                  "                });\n"
                  "            }\n"
                  "            else {\n"
                  "                s->vm.set_compiler_config(create_compiler_config(engine));\n"
                  "            }"
              )
              if old_config not in s:
                  raise SystemExit("compiler setup marker missing")
              return s.replace(old_config, new_config, 1)

          Path("/tmp/fuzzer.MONAD_NINE.cpp").write_text(render("MONAD_NINE"))
          Path("/tmp/fuzzer.MONAD_TEN.cpp").write_text(render("MONAD_TEN"))
          PY

              cp /tmp/fuzzer.MONAD_NINE.cpp test/vm/fuzzer/fuzzer.cpp
              rm -rf build-adjudicate
              CC=clang-19 CXX=clang++-19 cmake -S . -B build-adjudicate -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=category/core/toolchains/gcc-avx2.cmake \
                -DMONAD_COMPILER_TESTING=On
              cmake --build build-adjudicate -t monad-compiler-fuzzer --parallel "$(nproc)"
              cp build-adjudicate/test/vm/fuzzer/monad-compiler-fuzzer /out/bin/monad-nine-adjudicator

              cp /tmp/fuzzer.MONAD_TEN.cpp test/vm/fuzzer/fuzzer.cpp
              cmake --build build-adjudicate -t monad-compiler-fuzzer --parallel "$(nproc)"
              cp build-adjudicate/test/vm/fuzzer/monad-compiler-fuzzer /out/bin/monad-ten-adjudicator

              cp /tmp/fuzzer.original.cpp test/vm/fuzzer/fuzzer.cpp
              cp /tmp/assertions.original.cpp test/vm/fuzzer/assertions.cpp
              sha256sum /out/bin/* > /out/meta/BINARY_SHA256.txt
              clang-19 --version > /out/meta/CLANG_VERSION.txt
              cmake --version > /out/meta/CMAKE_VERSION.txt
              ninja --version > /out/meta/NINJA_VERSION.txt
            '

      - name: Run candidate and negative-control matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > out/focus/stateheavy.json <<'JSON'
          {
            "valid_address_prob": 0.70,
            "random_constant_with_cleared_words_prob": 0.20,
            "meaningful_constant_prob": 0.20,
            "small_constant_prob": 0.20,
            "push_weight": 0.16,
            "dup_weight": 0.16,
            "call_weight": 0.02,
            "returndatacopy_weight": 0.02,
            "create_weight": 0.02,
            "uncommon_non_term_weight": 0.42,
            "valid_jump_prob": 0.95
          }
          JSON
          cat > out/focus/callcreate.json <<'JSON'
          {
            "valid_address_prob": 0.90,
            "meaningful_constant_prob": 0.20,
            "small_constant_prob": 0.20,
            "push_weight": 0.18,
            "dup_weight": 0.18,
            "call_weight": 0.20,
            "returndatacopy_weight": 0.10,
            "create_weight": 0.10,
            "uncommon_non_term_weight": 0.18,
            "valid_jump_prob": 0.95
          }
          JSON
          docker start monad-v0160-state-map-adjudicator >/dev/null
          docker exec monad-v0160-state-map-adjudicator bash -lc '
            set -uo pipefail
            run_case() {
              name="$1"; binary="$2"; seed="$3"; focus="$4"; nohook="$5"
              args=(--implementation compiler --revision OSAKA --seed "$seed" --iterations-per-run 100 --messages 4 --runs 1 --print-stats)
              if [[ -n "$focus" ]]; then args+=(--focus "$focus"); fi
              if [[ "$nohook" == 1 ]]; then
                timeout --signal=TERM --kill-after=20s 180s env MONAD_COMPILER_FUZZING=1 MONAD_FUZZ_NO_HOOK=1 \
                  stdbuf -oL -eL "$binary" "${args[@]}" >"/out/logs/${name}.log" 2>&1
              else
                timeout --signal=TERM --kill-after=20s 180s env MONAD_COMPILER_FUZZING=1 \
                  stdbuf -oL -eL "$binary" "${args[@]}" >"/out/logs/${name}.log" 2>&1
              fi
              rc=$?
              printf "%s\n" "$rc" >"/out/rc/${name}.rc"
              return 0
            }
            wait_group() { local p; for p in "$@"; do wait "$p" || true; done; }

            run_case nine_state_candidate /out/bin/monad-nine-adjudicator 11956999547095953342 /out/focus/stateheavy.json 1 & p1=$!
            run_case nine_call_candidate /out/bin/monad-nine-adjudicator 2863043607998573456 /out/focus/callcreate.json 0 & p2=$!
            run_case ten_state_candidate /out/bin/monad-ten-adjudicator 8255388444298519423 /out/focus/stateheavy.json 1 & p3=$!
            run_case ten_call_candidate /out/bin/monad-ten-adjudicator 14820068421627436469 /out/focus/callcreate.json 0 & p4=$!
            wait_group "$p1" "$p2" "$p3" "$p4"

            run_case nine_generic_control /out/bin/monad-nine-adjudicator 7100003 "" 1 & p1=$!
            run_case ten_generic_control /out/bin/monad-ten-adjudicator 8100003 "" 1 & p2=$!
            wait_group "$p1" "$p2"

            test "$(find /out/rc -maxdepth 1 -type f -name "*.rc" | wc -l)" -eq 6
            test "$(find /out/logs -maxdepth 1 -type f -name "*.log" | wc -l)" -eq 6
          '

      - name: Derive fail-closed impact verdict
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          cp SOURCE_STATUS.txt SUBMODULES.txt out/meta/ 2>/dev/null || true
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('out')
          candidates = [
              'nine_state_candidate', 'nine_call_candidate',
              'ten_state_candidate', 'ten_call_candidate',
          ]
          controls = ['nine_generic_control', 'ten_generic_control']
          rows = []
          missing = []
          for name in candidates + controls:
              rp = root/'rc'/f'{name}.rc'
              lp = root/'logs'/f'{name}.log'
              if not rp.is_file() or not lp.is_file():
                  missing.append(name)
                  continue
              text = lp.read_text(errors='replace')
              rc = int(rp.read_text().strip())
              rows.append({
                  'name': name,
                  'role': 'candidate' if name in candidates else 'control',
                  'return_code': rc,
                  'state_map_mismatch_count': text.count('STATE_MAP_SIZE_MISMATCH'),
                  'post_state_root_mismatch_count': text.count('POST_STATE_ROOT_MISMATCH'),
                  'assertion_failure_count': text.count('Assertion') + text.count("Assertion '"),
                  'completed_run': rc == 0,
                  'log_sha256': hashlib.sha256(lp.read_bytes()).hexdigest(),
                  'log_bytes': lp.stat().st_size,
              })
          cmap = {r['name']: r for r in rows}
          candidate_reproduced = all(
              n in cmap and cmap[n]['state_map_mismatch_count'] > 0 for n in candidates)
          candidate_roots_clean = all(
              n in cmap and cmap[n]['post_state_root_mismatch_count'] == 0 and cmap[n]['return_code'] == 0
              for n in candidates)
          controls_clean = all(
              n in cmap and cmap[n]['state_map_mismatch_count'] == 0 and
              cmap[n]['post_state_root_mismatch_count'] == 0 and cmap[n]['return_code'] == 0
              for n in controls)
          if missing:
              decision = 'HARNESS_INCOMPLETE'
          elif any(r['post_state_root_mismatch_count'] > 0 for r in rows):
              decision = 'PERSISTENT_STATE_ROOT_DIVERGENCE_REQUIRES_MINIMIZATION'
          elif candidate_reproduced and candidate_roots_clean and controls_clean:
              decision = 'KILL_TRANSIENT_STATE_MATERIALIZATION_ONLY'
          else:
              decision = 'HOLD_AMBIGUOUS_DIAGNOSTIC'
          result = {
              'source_commit': 'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'candidate_count': len(candidates),
              'control_count': len(controls),
              'missing_cases': missing,
              'candidate_reproduced': candidate_reproduced,
              'candidate_roots_clean': candidate_roots_clean,
              'controls_clean': controls_clean,
              'cases': rows,
              'decision': decision,
              'high_proven': False,
              'critical_proven': False,
              'submission_ready': False,
          }
          (root/'ADJUDICATION_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          PY
          find out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
          tar --sort=name --mtime='UTC 2026-08-24' --owner=0 --group=0 --numeric-owner \
            -C out -czf monad-v0160-state-map-impact-adjudication-20260824.tar.gz \
            ADJUDICATION_RESULT.json SHA256SUMS bin logs rc focus meta
          sha256sum monad-v0160-state-map-impact-adjudication-20260824.tar.gz > monad-v0160-state-map-impact-adjudication-20260824.tar.gz.sha256

      - name: Upload adjudication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monad-v0160-state-map-impact-adjudication-20260824
          path: |
            monad-v0160-state-map-impact-adjudication-20260824.tar.gz
            monad-v0160-state-map-impact-adjudication-20260824.tar.gz.sha256
            out/ADJUDICATION_RESULT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
