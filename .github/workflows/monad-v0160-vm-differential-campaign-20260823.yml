name: Monad v0.16.0 VM differential campaign 20260823

on:
  push:
    branches:
      - tooling/monad-v0160-vm-differential-campaign-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4

      - name: Clone exact public execution source
        shell: bash
        run: |
          set -euo pipefail
          git config --global submodule.fetchJobs "$(nproc)"
          git clone --recurse-submodules https://github.com/category-labs/monad.git monad-execution
          cd monad-execution
          git checkout e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0"
          git status --porcelain=v1 > ../SOURCE_STATUS.txt
          test ! -s ../SOURCE_STATUS.txt
          git submodule status --recursive > ../SUBMODULES.txt

      - name: Build official dependency image
        shell: bash
        run: |
          set -euo pipefail
          docker build --target base -t monad-v0160-base -f monad-execution/docker/Dockerfile monad-execution

      - name: Build exact official differential fuzzer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/logs out/rc out/meta out/focus
          docker run --name monad-v0160-campaign \
            -v "$PWD/monad-execution:/src" \
            -v "$PWD/out:/out" \
            monad-v0160-base bash -lc '
              set -euo pipefail
              cd /src
              rm -rf build
              CC=gcc-15 CXX=g++-15 cmake -S . -B build -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=category/core/toolchains/gcc-avx2.cmake \
                -DMONAD_COMPILER_TESTING=On
              cmake --build build -t monad-compiler-fuzzer --parallel "$(nproc)"
              cp build/test/vm/fuzzer/monad-compiler-fuzzer /out/
              sha256sum /out/monad-compiler-fuzzer > /out/meta/FUZZER_SHA256.txt
              gcc-15 --version > /out/meta/GCC_VERSION.txt
              g++-15 --version > /out/meta/GXX_VERSION.txt
              cmake --version > /out/meta/CMAKE_VERSION.txt
              ninja --version > /out/meta/NINJA_VERSION.txt
              ldd /out/monad-compiler-fuzzer > /out/meta/FUZZER_LDD.txt
            '

      - name: Execute multi-lane campaigns
        shell: bash
        run: |
          set -euo pipefail
          cat > out/focus/pow2.json <<'JSON'
          {
            "power_of_two_constant_prob": 0.25,
            "power_of_32_constant_prob": 0.25,
            "negated_power_of_32_constant_prob": 0.15,
            "negated_power_of_two_constant_prob": 0.15,
            "valid_jump_prob": 1.0
          }
          JSON
          cat > out/focus/dynjump.json <<'JSON'
          {
            "valid_jumpdest_prob": 0.50,
            "meaningful_constant_prob": 0.20,
            "small_constant_prob": 0.20,
            "valid_jump_prob": 0.0,
            "block_dist_p1": 0.03,
            "block_dist_p2": 0.03,
            "block_dist_p3": 0.03
          }
          JSON
          cat > out/focus/callheavy.json <<'JSON'
          {
            "valid_address_prob": 0.80,
            "meaningful_constant_prob": 0.20,
            "small_constant_prob": 0.20,
            "push_weight": 0.20,
            "dup_weight": 0.20,
            "call_weight": 0.20,
            "returndatacopy_weight": 0.10,
            "create_weight": 0.10,
            "uncommon_non_term_weight": 0.15,
            "valid_jump_prob": 0.90
          }
          JSON
          cat > out/focus/stateheavy.json <<'JSON'
          {
            "valid_address_prob": 0.65,
            "random_constant_with_cleared_words_prob": 0.20,
            "meaningful_constant_prob": 0.20,
            "small_constant_prob": 0.20,
            "push_weight": 0.16,
            "dup_weight": 0.16,
            "call_weight": 0.02,
            "returndatacopy_weight": 0.02,
            "create_weight": 0.02,
            "uncommon_non_term_weight": 0.40,
            "valid_jump_prob": 0.95
          }
          JSON

          docker start monad-v0160-campaign >/dev/null
          docker exec monad-v0160-campaign bash -lc '
            set -uo pipefail
            F=/out/monad-compiler-fuzzer
            run_lane() {
              name="$1"; impl="$2"; seed="$3"; focus="$4"
              args=(--implementation "$impl" --revision OSAKA --seed "$seed" --iterations-per-run 100 --messages 4 --runs 100000000 --print-stats)
              if [[ -n "$focus" ]]; then args+=(--focus "$focus"); fi
              timeout --signal=TERM --kill-after=20s 300s \
                env MONAD_COMPILER_FUZZING=1 stdbuf -oL -eL "$F" "${args[@]}" \
                >"/out/logs/${name}.log" 2>&1
              rc=$?
              printf "%s\n" "$rc" >"/out/rc/${name}.rc"
              return 0
            }
            wait_group() {
              local pid
              for pid in "$@"; do
                wait "$pid" || true
              done
            }

            run_lane compiler_generic_a compiler 1000003 "" & p1=$!
            run_lane compiler_generic_b compiler 1000033 "" & p2=$!
            run_lane interpreter_generic_a interpreter 2000003 "" & p3=$!
            run_lane interpreter_generic_b interpreter 2000033 "" & p4=$!
            wait_group "$p1" "$p2" "$p3" "$p4"

            run_lane compiler_pow2 compiler 3000017 /out/focus/pow2.json & p1=$!
            run_lane compiler_dynjump compiler 4000037 /out/focus/dynjump.json & p2=$!
            run_lane compiler_callheavy compiler 5000087 /out/focus/callheavy.json & p3=$!
            run_lane compiler_stateheavy compiler 6000119 /out/focus/stateheavy.json & p4=$!
            wait_group "$p1" "$p2" "$p3" "$p4"

            test "$(find /out/rc -maxdepth 1 -type f -name "*.rc" | wc -l)" -eq 8
            test "$(find /out/logs -maxdepth 1 -type f -name "*.log" | wc -l)" -eq 8
          '

      - name: Analyze results fail-closed
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/meta out/logs out/rc
          cp SOURCE_STATUS.txt SUBMODULES.txt out/meta/ 2>/dev/null || true
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('out')
          expected = [
              'compiler_generic_a', 'compiler_generic_b',
              'interpreter_generic_a', 'interpreter_generic_b',
              'compiler_pow2', 'compiler_dynjump',
              'compiler_callheavy', 'compiler_stateheavy',
          ]
          lanes = []
          missing = []
          candidate = False
          expected_timeout_codes = {124, 137, 143}
          markers = [
              'MONAD_ASSERT', 'Assertion `', 'Assertion failed',
              'terminate called', 'Segmentation fault', 'Illegal instruction',
              'Aborted (core dumped)', 'AddressSanitizer', 'UndefinedBehaviorSanitizer',
          ]
          for name in expected:
              rc_path = root/'rc'/f'{name}.rc'
              log_path = root/'logs'/f'{name}.log'
              if not rc_path.is_file() or not log_path.is_file():
                  missing.append(name)
                  continue
              try:
                  rc = int(rc_path.read_text().strip())
              except Exception:
                  missing.append(name)
                  continue
              text = log_path.read_text(errors='replace')
              seeds = re.findall(r'Fuzzing with seed @ [^:]+: ([0-9]+)', text)
              hits = sorted({term for term in markers if term in text})
              lane_candidate = (rc not in expected_timeout_codes and rc != 0) or bool(hits)
              candidate |= lane_candidate
              lanes.append({
                  'name': name,
                  'return_code': rc,
                  'normal_timeout_or_success': rc in expected_timeout_codes or rc == 0,
                  'candidate_signal': lane_candidate,
                  'anomaly_markers': hits,
                  'seed_count': len(seeds),
                  'first_seed': seeds[0] if seeds else None,
                  'last_seed': seeds[-1] if seeds else None,
                  'log_sha256': hashlib.sha256(log_path.read_bytes()).hexdigest(),
                  'log_bytes': log_path.stat().st_size,
              })
          if missing:
              decision = 'HARNESS_INCOMPLETE'
          elif candidate:
              decision = 'CANDIDATE_REQUIRES_MINIMIZATION'
          else:
              decision = 'NO_DIFFERENTIAL_SIGNAL_IN_CAMPAIGN'
          result = {
              'source_commit': 'e81ffe31cd30fe3455d1233e4ee6c9b3f017bad0',
              'reference': 'evmone',
              'candidate_engine': 'Monad compiler/interpreter modes',
              'revision': 'OSAKA',
              'expected_lane_count': len(expected),
              'completed_lane_count': len(lanes),
              'missing_lanes': missing,
              'lanes': lanes,
              'candidate_signal': candidate,
              'decision': decision,
              'submission_ready': False,
          }
          (root/'CAMPAIGN_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          PY
          find out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
          tar --sort=name --mtime='UTC 2026-08-24' --owner=0 --group=0 --numeric-owner \
            -C out -czf monad-v0160-vm-differential-campaign-20260824.tar.gz \
            CAMPAIGN_RESULT.json SHA256SUMS logs rc focus meta monad-compiler-fuzzer 2>/dev/null || \
          tar --sort=name --mtime='UTC 2026-08-24' --owner=0 --group=0 --numeric-owner \
            -C out -czf monad-v0160-vm-differential-campaign-20260824.tar.gz \
            CAMPAIGN_RESULT.json SHA256SUMS logs rc focus meta
          sha256sum monad-v0160-vm-differential-campaign-20260824.tar.gz > monad-v0160-vm-differential-campaign-20260824.tar.gz.sha256

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monad-v0160-vm-differential-campaign-20260824
          path: |
            monad-v0160-vm-differential-campaign-20260824.tar.gz
            monad-v0160-vm-differential-campaign-20260824.tar.gz.sha256
            out/CAMPAIGN_RESULT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
