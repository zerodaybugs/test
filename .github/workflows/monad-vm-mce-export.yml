name: Export pinned Monad VM compiler

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  MONAD_EXECUTION_COMMIT: 2422a8592d12b91a8d97b7861f4f86bbc32af83d

jobs:
  build-mce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pinned public source
        uses: actions/checkout@v4
        with:
          repository: category-labs/monad
          ref: 2422a8592d12b91a8d97b7861f4f86bbc32af83d
          path: monad-execution
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source pin
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C monad-execution rev-parse HEAD)" = "$MONAD_EXECUTION_COMMIT"
          git -C monad-execution submodule status --recursive

      - name: Build upstream dependency image
        shell: bash
        run: |
          set -euxo pipefail
          docker build \
            --target base \
            --tag monad-mce-base:2422a859 \
            --file monad-execution/docker/Dockerfile \
            monad-execution

      - name: Compile upstream mce target
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          docker run --rm \
            --volume "$PWD/monad-execution:/src" \
            --volume "$PWD/out:/out" \
            --workdir /src \
            monad-mce-base:2422a859 \
            bash -lc '
              set -euxo pipefail
              rm -rf build
              CC=gcc-15 \
              CXX=g++-15 \
              CMAKE_BUILD_TYPE=Release \
              CMAKE_TOOLCHAIN_FILE=category/core/toolchains/gcc-avx2.cmake \
                ./scripts/configure.sh
              cmake --build build --target mce --parallel 2
              test -x build/cmd/vm/mce/mce
              cp build/cmd/vm/mce/mce /out/mce
              ldd build/cmd/vm/mce/mce | tee /out/ldd.txt

              mkdir -p /out/lib
              ldd build/cmd/vm/mce/mce \
                | awk '\''/=> \/|^\// {for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'\'' \
                | sort -u \
                | while read -r lib; do cp -L "$lib" /out/lib/; done
              loader=$(ldd build/cmd/vm/mce/mce | awk '\''/^\// {print $1; exit}'\'')
              test -n "$loader"
              cp -L "$loader" /out/lib/ld-linux-x86-64.so.2
              chmod +x /out/mce /out/lib/ld-linux-x86-64.so.2
            '

      - name: Add portable launcher and provenance
        shell: bash
        run: |
          set -euxo pipefail
          cat > out/run-mce.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$DIR/lib/ld-linux-x86-64.so.2" \
            --library-path "$DIR/lib" \
            "$DIR/mce" "$@"
          EOF
          chmod +x out/run-mce.sh
          {
            echo "repository=category-labs/monad"
            echo "commit=$MONAD_EXECUTION_COMMIT"
            echo "target=mce"
            echo "cmake_build_type=Release"
            echo "cc=gcc-15"
            echo "cxx=g++-15"
            echo "toolchain=category/core/toolchains/gcc-avx2.cmake"
            echo "runner=$(uname -a)"
          } > out/BUILD_INFO.txt
          ./out/run-mce.sh --help > out/mce-help.txt
          sha256sum out/mce out/run-mce.sh out/lib/* > out/SHA256SUMS
          tar -C out -czf monad-mce-2422a859-linux-x86_64.tar.gz .
          sha256sum monad-mce-2422a859-linux-x86_64.tar.gz \
            > monad-mce-2422a859-linux-x86_64.tar.gz.sha256
          ls -lh monad-mce-2422a859-linux-x86_64.tar.gz*

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: monad-mce-2422a859-linux-x86_64
          path: |
            monad-mce-2422a859-linux-x86_64.tar.gz
            monad-mce-2422a859-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
