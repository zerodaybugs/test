name: MS11 archive extraction boundary gate 20260819

on:
  push:
    branches:
      - agent/ms11-next-hunt-20260819
    paths:
      - '.github/workflows/ms11-archive-boundary-gate-20260819.yml'
      - 'security-research/ms11-archive-boundary/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ms11-archive-boundary-gate-20260819
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10
            sdk: 10.0.400
            tfm: net10.0
          - label: net8
            sdk: 8.0.129
            tfm: net8.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ms11-next-hunt-20260819

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Run archive boundary matrix
        env:
          TFM: ${{ matrix.tfm }}
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd security-research/ms11-archive-boundary
          sed "s/__TFM__/${TFM}/g" ArchiveBoundary.csproj.template > ArchiveBoundary.csproj
          rm -rf "evidence/${LABEL}"
          mkdir -p "evidence/${LABEL}"
          dotnet --info > "evidence/${LABEL}/DOTNET_INFO.txt"
          set +e
          dotnet run -c Release --no-restore -- "$LABEL" "evidence/${LABEL}/RESULT.json" 2>&1 | tee "evidence/${LABEL}/RUN.log"
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > "evidence/${LABEL}/EXITCODE.txt"
          test -s "evidence/${LABEL}/RESULT.json"

      - name: Commit matrix result
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "security-research/ms11-archive-boundary/evidence/${LABEL}"
          git commit -m "Record MS11 archive boundary ${LABEL} result" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin agent/ms11-next-hunt-20260819 && \
            git push origin HEAD:agent/ms11-next-hunt-20260819 && exit 0
            sleep $((i * 3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms11-archive-boundary-${{ matrix.label }}-${{ github.run_id }}
          path: security-research/ms11-archive-boundary/evidence/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
