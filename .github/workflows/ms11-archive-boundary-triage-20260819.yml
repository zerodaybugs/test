name: MS11 archive boundary triage 20260819

on:
  push:
    branches:
      - agent/ms11-next-hunt-20260819
    paths:
      - 'security-research/ms11-archive-boundary/evidence/**/RESULT.json'
      - 'scripts/ms11_archive_triage.py'
      - '.github/workflows/ms11-archive-boundary-triage-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ms11-archive-boundary-triage-20260819
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ms11-next-hunt-20260819
      - run: python3 scripts/ms11_archive_triage.py
      - name: Commit triage
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-research/ms11-archive-boundary/TRIAGE.json security-research/ms11-archive-boundary/TRIAGE.md
          git commit -m 'Record MS11 archive boundary triage' || true
          git pull --rebase origin agent/ms11-next-hunt-20260819
          git push origin HEAD:agent/ms11-next-hunt-20260819
