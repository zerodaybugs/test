name: MS11 archive-controlled symlink focused gate 20260819

on:
  push:
    branches:
      - agent/ms11-next-hunt-20260819
    paths:
      - '.github/workflows/ms11-archive-symlink-focused-20260819.yml'
      - 'security-research/ms11-archive-symlink-focused/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ms11-archive-symlink-focused-20260819
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-net10
            os: ubuntu-24.04
            sdk: 10.0.400
            tfm: net10.0
          - label: ubuntu-net8
            os: ubuntu-24.04
            sdk: 8.0.129
            tfm: net8.0
          - label: windows-net10
            os: windows-2025
            sdk: 10.0.400
            tfm: net10.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ms11-next-hunt-20260819

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Run focused matrix
        shell: pwsh
        env:
          TFM: ${{ matrix.tfm }}
          LABEL: ${{ matrix.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location security-research/ms11-archive-symlink-focused
          (Get-Content ArchiveSymlinkFocused.csproj.template -Raw).Replace('__TFM__', $env:TFM) | Set-Content ArchiveSymlinkFocused.csproj -NoNewline
          $evidence = "evidence/$($env:LABEL)"
          Remove-Item $evidence -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $evidence -ItemType Directory -Force | Out-Null
          dotnet --info | Out-File "$evidence/DOTNET_INFO.txt"
          dotnet restore *>&1 | Tee-Object "$evidence/RESTORE.log"
          dotnet run -c Release --no-restore -- $env:LABEL "$evidence/RESULT.json" *>&1 | Tee-Object "$evidence/RUN.log"
          if (-not (Test-Path "$evidence/RESULT.json")) { throw 'RESULT.json missing' }

      - name: Commit focused result
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "security-research/ms11-archive-symlink-focused/evidence/${LABEL}"
          git commit -m "Record focused archive symlink ${LABEL} result" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin agent/ms11-next-hunt-20260819 && \
            git push origin HEAD:agent/ms11-next-hunt-20260819 && exit 0
            sleep $((i * 3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms11-archive-symlink-${{ matrix.label }}-${{ github.run_id }}
          path: security-research/ms11-archive-symlink-focused/evidence/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
