name: MS11 public .NET toolchain export 20260819

on:
  push:
    branches:
      - agent/ms11-dotnet-toolchain-20260819
    paths:
      - '.github/workflows/ms11-dotnet-toolchain-export-20260819.yml'
      - 'tooling/ms11-dotnet-toolchain/trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10-sdk-10.0.400
            sdk: 10.0.400
          - label: net8-sdk-8.0.129
            sdk: 8.0.129
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Export installed SDK and public NuGet CLI
        env:
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root="tooling/ms11-dotnet-toolchain/${LABEL}"
          rm -rf "$root"
          mkdir -p "$root"
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          cp -a "$dotnet_root" "$root/dotnet"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$root/nuget.exe" https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          dotnet --info > "$root/DOTNET_INFO.txt"
          sha256sum "$root/nuget.exe" > "$root/SHA256SUMS.txt"
          find "$root/dotnet" -type f -print0 | sort -z | xargs -0 sha256sum >> "$root/SHA256SUMS.txt"
          tar -C "tooling/ms11-dotnet-toolchain" -czf "tooling/ms11-dotnet-toolchain/${LABEL}.tar.gz" "$LABEL"
          sha256sum "tooling/ms11-dotnet-toolchain/${LABEL}.tar.gz" > "tooling/ms11-dotnet-toolchain/${LABEL}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ms11-${{ matrix.label }}
          path: |
            tooling/ms11-dotnet-toolchain/${{ matrix.label }}.tar.gz
            tooling/ms11-dotnet-toolchain/${{ matrix.label }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
