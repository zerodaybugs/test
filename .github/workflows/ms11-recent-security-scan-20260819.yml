name: MS11 recent security-adjacent source scan 20260819

on:
  push:
    branches:
      - agent/ms11-next-hunt-20260819
    paths:
      - '.github/workflows/ms11-recent-security-scan-20260819.yml'
      - 'scripts/ms11_recent_security_scan.py'
      - 'tooling/ms11-next-hunt/trigger-scan.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ms11-recent-security-scan-20260819
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ms11-next-hunt-20260819

      - name: Run public-source scan
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ms11_recent_security_scan.py

      - name: Commit scan results
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/ms11-recent-security-scan
          git commit -m 'Record MS11 recent security-adjacent source scan' || true
          git push origin HEAD:agent/ms11-next-hunt-20260819

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms11-recent-security-scan-${{ github.run_id }}
          path: results/ms11-recent-security-scan
          if-no-files-found: error
          retention-days: 14
