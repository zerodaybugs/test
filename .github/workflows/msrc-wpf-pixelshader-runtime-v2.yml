name: msrc-wpf-pixelshader-runtime-v2

on:
  push:
    branches:
      - research/msrc-wpf-pixelshader-runtime-20260815-v2
    paths:
      - research/msrc-wpf-pixelshader-runtime-v2/**
      - .github/workflows/msrc-wpf-pixelshader-runtime-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-windows-runtime-gate:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out isolated private research branch
        uses: actions/checkout@v4

      - name: Install official .NET SDK used only to compile the harness
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Run exact .NET 10.0.11 Windows Desktop runtime matrix
        shell: pwsh
        run: ./research/msrc-wpf-pixelshader-runtime-v2/run-gate.ps1

      - name: Upload raw Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msrc-wpf-pixelshader-runtime-v2-evidence
          path: research/msrc-wpf-pixelshader-runtime-v2/evidence
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
