name: Nethermind 1.39.3 SNAP association exact gate V18

on:
  push:
    branches:
      - tmp/nethermind-snap-association-v18-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v6

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      - name: Checkout exact Nethermind release commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NethermindEth/nethermind.git upstream
          cd upstream
          git checkout --detach 28cbe2a0ae28373f66abdc584f3eaf21516e84b3
          test "$(git rev-parse HEAD)" = "28cbe2a0ae28373f66abdc584f3eaf21516e84b3"
          git status --short > ../GIT_STATUS_BEFORE.txt
          git rev-parse HEAD > ../EXACT_COMMIT.txt
          dotnet --info > ../DOTNET_INFO.txt

      - name: Add isolated regression and impact-control tests
        shell: bash
        run: |
          set -euo pipefail
          cp research/nethermind/V18SnapRefreshAssociationTests.cs \
            upstream/src/Nethermind/Nethermind.Synchronization.Test/SnapSync/V18SnapRefreshAssociationTests.cs
          cp research/nethermind/V18SnapHealingControlTests.cs \
            upstream/src/Nethermind/Nethermind.Synchronization.Test/FastSync/V18SnapHealingControlTests.cs
          sha256sum \
            research/nethermind/V18SnapRefreshAssociationTests.cs \
            research/nethermind/V18SnapHealingControlTests.cs > TEST_SHA256.txt
          sha256sum upstream/src/Nethermind/Nethermind.Synchronization/SnapSync/SnapProvider.cs > RELEASE_SOURCE_SHA256.txt

      - name: Build exact release test project
        id: exact_build
        working-directory: upstream/src/Nethermind/Nethermind.Synchronization.Test
        shell: bash
        run: |
          set -o pipefail
          set +e
          dotnet build Nethermind.Synchronization.Test.csproj -c release 2>&1 | tee ../../../../BUILD.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > ../../../../BUILD_EXIT_CODE.txt
          dotnet build-server shutdown || true
          exit "$rc"

      - name: Run exact release association and final-healing tests
        id: exact_test
        working-directory: upstream/src/Nethermind/Nethermind.Synchronization.Test
        shell: bash
        run: |
          set -o pipefail
          set +e
          dotnet test --project Nethermind.Synchronization.Test.csproj -c release \
            --no-build --no-restore \
            --filter 'FullyQualifiedName~V18SnapRefreshAssociationTests|FullyQualifiedName~V18SnapHealingControlTests' \
            2>&1 | tee ../../../../EXACT_TEST.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > ../../../../EXACT_TEST_EXIT_CODE.txt
          exit "$rc"

      - name: Record exact source excerpts and semantic verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sed -n '249,293p' upstream/src/Nethermind/Nethermind.Synchronization/SnapSync/SnapProvider.cs > REFRESH_ACCOUNTS_EXCERPT.txt
          sed -n '702,744p' upstream/src/Nethermind/Nethermind.Synchronization/FastSync/TreeSync.cs > FINAL_HEALING_EXCERPT.txt
          sed -n '237,274p' upstream/src/Nethermind/Nethermind.Network/P2P/Subprotocols/Snap/SnapProtocolHandler.cs > GET_PATH_GROUPS_EXCERPT.txt
          git -C upstream status --short > GIT_STATUS_AFTER.txt

          build_rc="$(cat BUILD_EXIT_CODE.txt 2>/dev/null || echo missing)"
          test_rc="$(cat EXACT_TEST_EXIT_CODE.txt 2>/dev/null || echo missing)"
          if [[ "$build_rc" == "0" && "$test_rc" == "0" ]]; then
            verdict="EXACT_RELEASE_ACCEPTS_WRONG_ASSOCIATION_BUT_FINAL_HEALING_REPAIRS_IT"
            gate="KILL_FOR_HIGH"
          elif [[ "$build_rc" == "0" ]]; then
            verdict="FINAL_HEALING_CONTROL_FAILED_REQUIRES_LOG_REVIEW"
            gate="HOLD_INVESTIGATE"
          else
            verdict="HARNESS_OR_BUILD_FAILED"
            gate="HOLD_FIX_HARNESS"
          fi

          cat > RESULT.json <<EOF
          {
            "schema": "nethermind-snap-association-v18-exact-gate-v3",
            "release": "1.39.3",
            "commit": "28cbe2a0ae28373f66abdc584f3eaf21516e84b3",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_number": "${GITHUB_RUN_NUMBER}",
            "build_exit_code": "${build_rc}",
            "exact_test_exit_code": "${test_rc}",
            "semantic_verdict": "${verdict}",
            "severity_gate": "${gate}",
            "interpretation": "The two association tests prove exact-release acceptance. The healing control passes only if full state sync reconstructs canonical storage roots and local/remote trees match."
          }
          EOF

      - name: Persist verdict for deterministic retrieval
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/nethermind/results
          cp RESULT.json research/nethermind/results/V18_LATEST_RESULT.json
          cp BUILD.log research/nethermind/results/V18_LATEST_BUILD.log 2>/dev/null || true
          cp EXACT_TEST.log research/nethermind/results/V18_LATEST_TEST.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nethermind/results
          if ! git diff --cached --quiet; then
            git commit -m "research: record V18 exact healing result [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-1.39.3-snap-association-v18-exact-v3
          retention-days: 1
          path: |
            EXACT_COMMIT.txt
            DOTNET_INFO.txt
            TEST_SHA256.txt
            RELEASE_SOURCE_SHA256.txt
            BUILD.log
            BUILD_EXIT_CODE.txt
            EXACT_TEST.log
            EXACT_TEST_EXIT_CODE.txt
            REFRESH_ACCOUNTS_EXCERPT.txt
            FINAL_HEALING_EXCERPT.txt
            GET_PATH_GROUPS_EXCERPT.txt
            GIT_STATUS_BEFORE.txt
            GIT_STATUS_AFTER.txt
            RESULT.json
            research/nethermind/V18SnapRefreshAssociationTests.cs
            research/nethermind/V18SnapHealingControlTests.cs
