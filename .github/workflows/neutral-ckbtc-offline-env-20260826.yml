name: Neutral pinned ckBTC offline environment

on:
  push:
    branches:
      - neutral-rust-source-snapshot-20260826
    paths:
      - .github/workflows/neutral-ckbtc-offline-env-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REV: a9ef6104790755ea520c0d4546e61fe130136805
  CARGO_INCREMENTAL: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build:
    name: Exact source, dependencies, toolchain, compiled cache
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout neutral harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reclaim disk and install native dependencies
        shell: bash
        run: |
          set -eEuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build pkg-config protobuf-compiler \
            libssl-dev libunwind-dev libudev-dev zstd
          df -h

      - name: Fetch exact complete source revision
        shell: bash
        run: |
          set -eEuo pipefail
          ROOT="$RUNNER_TEMP/ic"
          mkdir -p "$ROOT"
          git -C "$ROOT" init
          git -C "$ROOT" remote add origin https://github.com/dfinity/ic.git
          git -C "$ROOT" -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none \
            origin "$SOURCE_REV"
          git -C "$ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$SOURCE_REV"
          echo "IC_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -eEuo pipefail
          cd "$IC_ROOT"
          rustup set profile default
          rustup toolchain install 1.97.1 --target wasm32-unknown-unknown --no-self-update
          rustup default 1.97.1
          rustc --version --verbose
          cargo --version
          protoc --version

      - name: Fetch locked ckBTC dependency graph
        shell: bash
        run: |
          set -eEuo pipefail
          cd "$IC_ROOT"
          cargo fetch --locked --manifest-path rs/bitcoin/ckbtc/minter/Cargo.toml

      - name: Compile unmodified ckBTC library tests
        shell: bash
        run: |
          set -eEuo pipefail
          cd "$IC_ROOT"
          cargo test --locked -p ic-ckbtc-minter --lib --no-run

      - name: Verify offline rebuild
        shell: bash
        run: |
          set -eEuo pipefail
          cd "$IC_ROOT"
          CARGO_NET_OFFLINE=true cargo test --locked -p ic-ckbtc-minter --lib --no-run

      - name: Assemble neutral offline environment
        shell: bash
        run: |
          set -eEuo pipefail
          BUNDLE="$RUNNER_TEMP/bundle"
          mkdir -p "$BUNDLE/home" "$BUNDLE/bin"
          rm -rf "$IC_ROOT/.git"
          cp -a "$IC_ROOT" "$BUNDLE/ic"
          cp -a "$HOME/.cargo" "$BUNDLE/home/.cargo"
          cp -a "$HOME/.rustup" "$BUNDLE/home/.rustup"
          cp "$(command -v protoc)" "$BUNDLE/bin/protoc"
          {
            echo "repository=dfinity/ic"
            echo "revision=$SOURCE_REV"
            echo "workflow_repository=$GITHUB_REPOSITORY"
            echo "workflow_commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            rustc --version --verbose
            cargo --version
            protoc --version
          } > "$BUNDLE/PROVENANCE.txt"
          find "$BUNDLE" -type f -print0 | sort -z | xargs -0 sha256sum > "$BUNDLE/BUNDLE_SHA256SUMS"
          du -sh "$BUNDLE" "$BUNDLE/ic/target" "$BUNDLE/home/.cargo" "$BUNDLE/home/.rustup"
          tar --zstd -cf "$RUNNER_TEMP/ckbtc-offline-env.tar.zst" -C "$BUNDLE" .
          sha256sum "$RUNNER_TEMP/ckbtc-offline-env.tar.zst" > "$RUNNER_TEMP/ckbtc-offline-env.tar.zst.sha256"
          mkdir -p "$RUNNER_TEMP/chunks"
          split --bytes=300M --numeric-suffixes=0 --suffix-length=2 \
            "$RUNNER_TEMP/ckbtc-offline-env.tar.zst" \
            "$RUNNER_TEMP/chunks/ckbtc-offline-env.tar.zst.part-"
          {
            cat "$RUNNER_TEMP/ckbtc-offline-env.tar.zst.sha256"
            echo "reassembly=cat ckbtc-offline-env.tar.zst.part-* > ckbtc-offline-env.tar.zst"
            sha256sum "$RUNNER_TEMP/chunks"/*
            stat -c '%n %s bytes' "$RUNNER_TEMP/chunks"/*
          } > "$RUNNER_TEMP/chunks/MANIFEST.txt"
          ls -lh "$RUNNER_TEMP/chunks" | tail -n +1
          df -h

      - name: Upload manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-manifest-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/chunks/MANIFEST.txt

      - name: Upload part 00
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-00-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-00

      - name: Upload part 01
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-01-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-01

      - name: Upload part 02
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-02-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-02

      - name: Upload part 03
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-03-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-03

      - name: Upload part 04
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-04-${{ github.run_id }}
          compression-level: 0
