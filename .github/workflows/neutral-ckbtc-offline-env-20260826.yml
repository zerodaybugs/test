          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-05

      - name: Upload part 06
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-06-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-06

      - name: Upload part 07
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-07-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-07

      - name: Upload part 08
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-08-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-08

      - name: Upload part 09
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-09-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-09

      - name: Upload part 10
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-10-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-10

      - name: Upload part 11
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-offline-part-11-${{ github.run_id }}
