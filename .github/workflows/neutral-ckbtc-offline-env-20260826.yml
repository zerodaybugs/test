          retention-days: 1
          path: ${{ runner.temp }}/chunks/ckbtc-offline-env.tar.zst.part-04

      - name: Upload part 05
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
