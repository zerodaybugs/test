name: Neutral IC dashboard deployment binding

on:
  push:
    branches:
      - neutral-rust-source-snapshot-20260826
    paths:
      - .github/workflows/neutral-ic-dashboard-binding-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding:
    name: Capture public proposal and canister metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout neutral harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch public IC Dashboard API records
        shell: bash
        run: |
          set -eEuo pipefail
          OUT="$RUNNER_TEMP/binding"
          mkdir -p "$OUT"
          curl --fail --silent --show-error --location \
            'https://ic-api.internetcomputer.org/api/v3/proposals/141772' \
            -o "$OUT/proposal-141772.json"
          curl --fail --silent --show-error --location \
            'https://ic-api.internetcomputer.org/api/v3/canisters/mqygn-kiaaa-aaaar-qaadq-cai' \
            -o "$OUT/ckbtc-minter-canister.json"
          curl --fail --silent --show-error --location \
            'https://ic-api.internetcomputer.org/api/v3/proposals?limit=100&offset=0&include_action=InstallCode' \
            -o "$OUT/recent-install-code-proposals.json"
          python3 - <<'PY'
          import json
          import pathlib
          out = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'binding'
          for path in sorted(out.glob('*.json')):
              value = json.loads(path.read_text())
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum "$OUT"/*.json > "$OUT/SHA256SUMS"
          cat "$OUT/proposal-141772.json"
          cat "$OUT/ckbtc-minter-canister.json"

      - name: Upload binding evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ckbtc-public-binding-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/binding
