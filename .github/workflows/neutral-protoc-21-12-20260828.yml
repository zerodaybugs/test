name: Neutral protoc 21.12 runtime

on:
  push:
    branches:
      - neutral-protoc-21-12-20260828
    paths:
      - .github/workflows/neutral-protoc-21-12-20260828.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official prebuilt protoc
        shell: bash
        run: |
          set -eEuo pipefail
          mkdir -p "$RUNNER_TEMP/protoc"
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip \
            --output "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc"
          "$RUNNER_TEMP/protoc/bin/protoc" --version | tee "$RUNNER_TEMP/protoc/VERSION.txt"
          ldd "$RUNNER_TEMP/protoc/bin/protoc" | tee "$RUNNER_TEMP/protoc/LDD.txt" || true
          sha256sum "$RUNNER_TEMP/protoc.zip" "$RUNNER_TEMP/protoc/bin/protoc" \
            | tee "$RUNNER_TEMP/protoc/SHA256SUMS"

      - name: Upload portable protoc
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: neutral-protoc-21.12-linux-x86_64-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: ${{ runner.temp }}/protoc/**
