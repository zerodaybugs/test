name: Neutral protoc 21.12 artifact main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/neutral-protoc-21-12-artifact-main-20260828.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official protobuf release
        shell: bash
        run: |
          set -eEuo pipefail
          curl -fsSL --retry 5 \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip \
            -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc-21.12"
          "$RUNNER_TEMP/protoc-21.12/bin/protoc" --version
          test "$("$RUNNER_TEMP/protoc-21.12/bin/protoc" --version)" = "libprotoc 3.21.12"
          ldd "$RUNNER_TEMP/protoc-21.12/bin/protoc" || true
          sha256sum "$RUNNER_TEMP/protoc.zip" "$RUNNER_TEMP/protoc-21.12/bin/protoc" \
            > "$RUNNER_TEMP/protoc-21.12/SHA256SUMS"

      - name: Upload toolchain
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: neutral-protoc-21.12-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/protoc-21.12
            ${{ runner.temp }}/protoc.zip
