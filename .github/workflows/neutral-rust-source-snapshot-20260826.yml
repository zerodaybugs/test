name: Neutral Rust source snapshot

on:
  push:
    branches:
      - neutral-rust-source-snapshot-20260826
    paths:
      - .github/workflows/neutral-rust-source-snapshot-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REV: a9ef6104790755ea520c0d4546e61fe130136805

jobs:
  snapshot:
    name: Build pinned sparse source archive
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout neutral harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch pinned source with non-cone sparse checkout
        shell: bash
        run: |
          set -eEuo pipefail
          ROOT="$RUNNER_TEMP/source"
          mkdir -p "$ROOT"
          git -C "$ROOT" init
          git -C "$ROOT" remote add origin https://github.com/dfinity/ic.git
          git -C "$ROOT" config core.sparseCheckout true
          git -C "$ROOT" config core.sparseCheckoutCone false
          cat > "$ROOT/.git/info/sparse-checkout" <<'EOF'
          /rs/bitcoin/ckbtc/minter/
          /rs/dogecoin/ckdoge/minter/
          /rs/ethereum/cketh/minter/
          /rs/ledger_suite/
          /rs/nns/cmc/
          /rs/consensus/
          /rs/execution_environment/
          /rs/replicated_state/
          /rs/messaging/
          /rs/state_manager/
          /rs/types/
          /packages/icrc-ledger-types/
          /Cargo.toml
          /Cargo.lock
          /mainnet-canister-revisions.json
          /mainnet-icos-revisions.json
          /SECURITY.md
          EOF
          git -C "$ROOT" -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$SOURCE_REV"
          git -C "$ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$SOURCE_REV"
          find "$ROOT" -maxdepth 3 -type d | sort | head -100

      - name: Create integrity-bound archive
        shell: bash
        run: |
          set -eEuo pipefail
          ROOT="$RUNNER_TEMP/source"
          rm -rf "$ROOT/.git"
          {
            echo "repository=dfinity/ic"
            echo "revision=$SOURCE_REV"
            echo "workflow_repository=$GITHUB_REPOSITORY"
            echo "workflow_commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
          } > "$ROOT/PROVENANCE.txt"
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SOURCE_SHA256SUMS"
          OUT="$RUNNER_TEMP/rust-source-$SOURCE_REV.tar.zst"
          tar --zstd -cf "$OUT" -C "$ROOT" .
          sha256sum "$OUT" > "$OUT.sha256"
          du -sh "$ROOT"
          ls -lh "$OUT" "$OUT.sha256"

      - name: Upload source archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-source-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/rust-source-${{ env.SOURCE_REV }}.tar.zst
            ${{ runner.temp }}/rust-source-${{ env.SOURCE_REV }}.tar.zst.sha256
