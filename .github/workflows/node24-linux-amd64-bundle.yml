name: Node.js 24 Linux AMD64 toolchain bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/node24-linux-amd64-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          check-latest: false
      - name: Record and package exact setup-node toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node --version | tee out/NODE_VERSION.txt
          npm --version | tee out/NPM_VERSION.txt
          corepack --version | tee out/COREPACK_VERSION.txt
          node_path="$(readlink -f "$(command -v node)")"
          node_root="$(dirname "$(dirname "$node_path")")"
          printf 'node_path=%s\nnode_root=%s\n' "$node_path" "$node_root" | tee out/PROVENANCE.txt
          file "$node_path" | tee out/FILE.txt
          ldd "$node_path" | tee out/LDD.txt
          cp -a "$node_root" out/node24-linux-amd64
          find out/node24-linux-amd64 -type f -print0 | sort -z | xargs -0 sha256sum > out/TOOLCHAIN_SHA256SUMS
          tar -C out --zstd -cf node24-linux-amd64.tar.zst node24-linux-amd64
          sha256sum node24-linux-amd64.tar.zst > out/ARCHIVE_SHA256.txt
          du -sh out/node24-linux-amd64 node24-linux-amd64.tar.zst | tee out/SIZES.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node24.0.0-linux-amd64
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            node24-linux-amd64.tar.zst
            out/
