name: Neutral offline Chain Fusion Signer build environment

on:
  push:
    branches:
      - offline-cfs-build-env-20260826
    paths:
      - .github/workflows/offline-cfs-build-env-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-cfs-build-env-20260826
  cancel-in-progress: true

env:
  SIGNER_REV: 731c24961daa61e75febe392a5afd87883d1f1f4
  CARGO_INCREMENTAL: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  package:
    name: Exact release source, dependencies, Wasm and PocketIC cache
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout neutral harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Reclaim disk and install native prerequisites
        shell: bash
        run: |
          set -eEuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build pkg-config protobuf-compiler \
            libssl-dev libunwind-dev libudev-dev zstd gzip jq bc netcat-openbsd
          df -h

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main

      - name: Fetch exact released signer source
        shell: bash
        run: |
          set -eEuo pipefail
          SIGNER_DIR="$RUNNER_TEMP/chain-fusion-signer"
          mkdir -p "$SIGNER_DIR"
          git -C "$SIGNER_DIR" init
          git -C "$SIGNER_DIR" remote add origin https://github.com/dfinity/chain-fusion-signer.git
          git -C "$SIGNER_DIR" -c protocol.version=2 fetch --no-tags --depth=1 origin "$SIGNER_REV"
          git -C "$SIGNER_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$SIGNER_DIR" rev-parse HEAD)" = "$SIGNER_REV"
          echo "SIGNER_DIR=$SIGNER_DIR" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain and fetch locked graph
        shell: bash
        run: |
          set -eEuo pipefail
          cd "$SIGNER_DIR"
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          cargo fetch --locked

      - name: Prepare local canister artifacts
        shell: bash
        run: |
          set -eEuo pipefail
          cd "$SIGNER_DIR"
          ./scripts/setup cargo-binstall candid-extractor ic-wasm didc
          dfx start --clean --background
          trap 'dfx stop || true' EXIT
          dfx deploy
          ./scripts/test.signer.sh --no-run
          dfx stop
          trap - EXIT

      - name: Verify the compiled test graph offline
        shell: bash
        run: |
          set -eEuo pipefail
          cd "$SIGNER_DIR"
          export POCKET_IC_BIN="$SIGNER_DIR/target/pocket-ic"
          test -x "$POCKET_IC_BIN"
          test -f "$SIGNER_DIR/target/wasm32-unknown-unknown/release/signer.wasm"
          test -f "$SIGNER_DIR/ic-btc-canister.wasm.gz"
          CARGO_NET_OFFLINE=true cargo test --locked -p signer --no-run

      - name: Assemble, hash and split neutral offline bundle
        shell: bash
        run: |
          set -eEuo pipefail
          BUNDLE="$RUNNER_TEMP/offline-cfs-bundle"
          CHUNKS="$RUNNER_TEMP/offline-cfs-chunks"
          mkdir -p "$BUNDLE/home" "$CHUNKS"
          cp -a "$SIGNER_DIR" "$BUNDLE/chain-fusion-signer"
          cp -a "$HOME/.cargo" "$BUNDLE/home/.cargo"
          cp -a "$HOME/.rustup" "$BUNDLE/home/.rustup"

          {
            echo "repository=dfinity/chain-fusion-signer"
            echo "revision=$SIGNER_REV"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            rustc --version --verbose
            cargo --version
            dfx --version
            sha256sum "$SIGNER_DIR/target/wasm32-unknown-unknown/release/signer.wasm"
          } > "$BUNDLE/PROVENANCE.txt"

          du -sh "$BUNDLE" "$BUNDLE/chain-fusion-signer/target" "$BUNDLE/home/.cargo" "$BUNDLE/home/.rustup"
          tar --zstd -cf "$RUNNER_TEMP/cfs-offline-build-env.tar.zst" -C "$BUNDLE" .
          sha256sum "$RUNNER_TEMP/cfs-offline-build-env.tar.zst" \
            > "$RUNNER_TEMP/cfs-offline-build-env.tar.zst.sha256"

          split -n l/10 --numeric-suffixes=0 --suffix-length=2 \
            "$RUNNER_TEMP/cfs-offline-build-env.tar.zst" \
            "$CHUNKS/cfs-offline-build-env.tar.zst.part-"
          test "$(find "$CHUNKS" -maxdepth 1 -type f | wc -l)" -eq 10

          {
            echo "source_revision=$SIGNER_REV"
            cat "$RUNNER_TEMP/cfs-offline-build-env.tar.zst.sha256"
            echo "chunk_count=10"
            echo "reassembly=cat cfs-offline-build-env.tar.zst.part-* > cfs-offline-build-env.tar.zst"
            echo
            sha256sum "$CHUNKS"/cfs-offline-build-env.tar.zst.part-*
            echo
            stat -c '%n %s bytes' "$CHUNKS"/cfs-offline-build-env.tar.zst.part-*
          } > "$CHUNKS/MANIFEST.txt"
          cat "$CHUNKS/MANIFEST.txt"
          df -h

      - name: Upload manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cfs-offline-env-manifest-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/offline-cfs-chunks/MANIFEST.txt

      - name: Upload part 00
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-00-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-00" }
      - name: Upload part 01
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-01-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-01" }
      - name: Upload part 02
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-02-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-02" }
      - name: Upload part 03
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-03-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-03" }
      - name: Upload part 04
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-04-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-04" }
      - name: Upload part 05
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-05-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-05" }
      - name: Upload part 06
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-06-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-06" }
      - name: Upload part 07
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-07-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-07" }
      - name: Upload part 08
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-08-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-08" }
      - name: Upload part 09
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: { name: cfs-offline-env-part-09-${{ github.run_id }}, compression-level: 0, if-no-files-found: error, retention-days: 7, path: "${{ runner.temp }}/offline-cfs-chunks/cfs-offline-build-env.tar.zst.part-09" }
