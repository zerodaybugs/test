name: OKX PMM caller-trailer validation

on:
  push:
    branches:
      - okx-pmm-caller-trailer-20260822
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Tool versions
        run: |
          forge --version
          cast --version
      - name: Exact compiler and deterministic tests
        working-directory: okx-pmm-caller-trailer
        run: |
          set -euxo pipefail
          forge clean
          forge build --force
          forge test -vvv --fuzz-runs 10000
          forge test -vvv --fuzz-runs 10000
          forge test -vvv --fuzz-runs 10000
      - name: Fail-closed output scan
        working-directory: okx-pmm-caller-trailer
        run: |
          set -euxo pipefail
          test -f out/OkxCallerTrailer.t.sol/OkxCallerTrailerTest.json
          ! grep -RniE 'command not found|No such file|not executed' . --exclude-dir=out --exclude-dir=cache
