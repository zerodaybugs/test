name: OKX PMM caller-trailer validation

on:
  push:
    branches:
      - okx-pmm-caller-trailer-20260822
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundry-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Tool versions
        run: |
          forge --version
          cast --version
      - name: Exact compiler and deterministic model tests
        working-directory: okx-pmm-caller-trailer
        run: |
          set -euxo pipefail
          forge clean
          forge build --force
          forge test -vvv --fuzz-runs 10000
          forge test -vvv --fuzz-runs 10000
          forge test -vvv --fuzz-runs 10000
      - name: Fail-closed output scan
        working-directory: okx-pmm-caller-trailer
        run: |
          set -euxo pipefail
          test -f out/OkxCallerTrailer.t.sol/OkxCallerTrailerTest.json
          ! grep -RniE 'command not found|No such file|not executed' . --exclude-dir=out --exclude-dir=cache

  exact-pmm-v4-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Clone and pin current in-scope PMM source
        run: |
          set -euxo pipefail
          git clone https://github.com/okxlabs/Web3-DEX-EVM-PMM.git actual-pmm
          cd actual-pmm
          git checkout 60052a8a35b65bd4fb8a38212f124317756e5572
          test "$(git rev-parse HEAD)" = "60052a8a35b65bd4fb8a38212f124317756e5572"
          git submodule update --init --recursive
          find test -maxdepth 1 -type f -name '*.sol' -delete
          cp ../okx-pmm-caller-trailer/actual/PmmCallerTrailerActual.t.sol test/PmmCallerTrailerActual.t.sol
          sed -i 's#"../src/#"src/#g; s#"./mocks/#"test/mocks/#g' test/PmmCallerTrailerActual.t.sol
          grep '^import' test/PmmCallerTrailerActual.t.sol
          forge --version | tee exact-toolchain.log
          solc --version 2>&1 | tee -a exact-toolchain.log || true
      - name: Build exact source and run actual integration tests three times
        working-directory: actual-pmm
        run: |
          set -o pipefail
          forge clean 2>&1 | tee exact-clean.log
          forge test --match-path test/PmmCallerTrailerActual.t.sol -vvv 2>&1 | tee exact-run-1.log
          forge test --match-path test/PmmCallerTrailerActual.t.sol -vvv 2>&1 | tee exact-run-2.log
          forge test --match-path test/PmmCallerTrailerActual.t.sol -vvv 2>&1 | tee exact-run-3.log
      - name: Exact-source artifact and pin checks
        working-directory: actual-pmm
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "60052a8a35b65bd4fb8a38212f124317756e5572"
          test -f out/PmmCallerTrailerActual.t.sol/PmmCallerTrailerActualTest.json
          grep -q '4 passed; 0 failed' exact-run-1.log
          grep -q '4 passed; 0 failed' exact-run-2.log
          grep -q '4 passed; 0 failed' exact-run-3.log
          ! grep -RniE 'command not found|No such file|not executed' test/PmmCallerTrailerActual.t.sol out exact-run-*.log
      - name: Upload exact-source logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-pmm-exact-source-logs
          path: |
            actual-pmm/exact-*.log
            actual-pmm/test/PmmCallerTrailerActual.t.sol
            actual-pmm/out/PmmCallerTrailerActual.t.sol/PmmCallerTrailerActualTest.json
          if-no-files-found: warn
          retention-days: 7
