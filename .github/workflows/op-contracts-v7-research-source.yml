name: OP contracts v7 immutable research source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op-contracts-v7-research-source.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact OP contracts release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-contracts/v7.0.0
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Record source lock and initializer inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git -C upstream rev-parse HEAD | tee out/source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('upstream/packages/contracts-bedrock/src')
          records = []
          for path in sorted(root.rglob('*.sol')):
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'function\s+initialize\s*\(', text):
                  line = text.count('\n', 0, match.start()) + 1
                  next_function = text.find('\n    function ', match.end())
                  next_contract = text.find('\n}', match.end())
                  candidates = [value for value in (next_function, next_contract) if value >= 0]
                  end = min(candidates) if candidates else min(len(text), match.start() + 8000)
                  window = text[match.start():end]
                  records.append({
                      'path': path.relative_to(root.parent.parent).as_posix(),
                      'line': line,
                      'proxy_admin_guard': '_assertOnlyProxyAdminOrProxyAdminOwner' in window,
                      'proxy_admin_owner_guard': '_assertOnlyProxyAdminOwner' in window,
                      'initializer_modifier': bool(re.search(r'\b(?:re)?initializer\b', window)),
                      'excerpt': ' '.join(window[:700].split()),
                  })
          Path('out/initializer-inventory.json').write_text(json.dumps(records, indent=2) + '\n')
          print(f'initializers={len(records)}')
          PY

      - name: Package exact contracts source
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          paths=(packages/contracts-bedrock op-core/nuts)
          for optional in specs op-node/rollup/derive; do
            if [ -e "$optional" ]; then
              paths+=("$optional")
            fi
          done
          tar -czf ../out/op-contracts-v7.0.0-source.tar.gz "${paths[@]}"
          cd ..
          sha256sum out/op-contracts-v7.0.0-source.tar.gz \
            out/initializer-inventory.json out/source-commit.txt > out/SHA256SUMS
          ls -lh out

      - name: Upload research source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-contracts-v7.0.0-research-source
          path: out
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
