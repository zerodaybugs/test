name: OP contracts v7.1.17 exact live-release source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op-contracts-v7.1.17-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact live OP contracts release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-contracts/v7.1.17
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Package source with provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "source_tag=op-contracts/v7.1.17"
            echo "source_commit=$(git -C upstream rev-parse HEAD)"
            echo "source_tree=$(git -C upstream rev-parse HEAD^{tree})"
          } | tee out/MANIFEST.txt
          tar -czf out/op-contracts-v7.1.17-source.tar.gz -C upstream \
            packages/contracts-bedrock op-core/nuts specs
          sha256sum out/op-contracts-v7.1.17-source.tar.gz out/MANIFEST.txt > out/SHA256SUMS
          ls -lh out

      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-contracts-v7.1.17-source
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
