name: OP dispute monitor output-root regressions

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op-dispute-mon-output-root-regressions.yml"

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact public Optimism source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: 3fda355bfd97cb9a0ffc8642b5fc86b18eeea369
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          expected="3fda355bfd97cb9a0ffc8642b5fc86b18eeea369"
          actual="$(git -C upstream rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up repository Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Rebuild pinned Superchain config bundle
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zip yq
          upstream/op-core/superchain/sync-superchain.sh
          sha256sum upstream/op-core/superchain/superchain-configs.zip

      - name: Run Cannon-Kona output-root classification regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd upstream
          set -o pipefail
          go test ./op-dispute-mon/mon/extract \
            -run 'TestOutputAgreementEnricher/(FetchAllOutputRootGameTypes/GameType_8|AllNodesAgree_OutputDifferentFromClaim)$' \
            -count=1 -v 2>&1 | tee ../out/output-agreement.log

      - name: Run resolved mismatch forecast regression
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          set -o pipefail
          go test ./op-dispute-mon/mon \
            -run 'TestForecast_Forecast_BasicTests/DefenderWonGame_Disagree$' \
            -count=1 -v 2>&1 | tee ../out/forecast.log

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "source_commit=$(git -C upstream rev-parse HEAD 2>/dev/null || true)"
            echo "superchain_registry_commit=$(git -C upstream/superchain-registry rev-parse HEAD 2>/dev/null || true)"
            echo "go=$(go version 2>/dev/null || true)"
            echo "runner=$(uname -a)"
          } | tee out/MANIFEST.txt
          sha256sum out/*.log out/MANIFEST.txt > out/SHA256SUMS 2>/dev/null || true

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-dispute-mon-output-root-regressions
          path: out/
          if-no-files-found: error
          retention-days: 3
