name: OP Mainnet FDG live immutable inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op-fdg-live-immutables.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query exact live implementation read-only
        shell: bash
        env:
          RPC_URLS: "https://ethereum-rpc.publicnode.com https://eth.llamarpc.com"
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, urllib.error
          from pathlib import Path

          urls = os.environ['RPC_URLS'].split()
          address = '0x2DDA3584b51eF5236f7726Dea5A0FB6B3cA94AeC'
          block = '0x1871b7e'  # 25,630,846
          calls = {
              'maxGameDepth': '0xfa315aa9',
              'splitDepth': '0xec5e6308',
              'clockExtension': '0x6b6716c0',
              'maxClockDuration': '0xdabd396d',
              'version': '0x54fd4d50',
          }
          req_id = 0
          def rpc(method, params):
              global req_id
              req_id += 1
              body = json.dumps({'jsonrpc':'2.0','id':req_id,'method':method,'params':params}).encode()
              errors=[]
              for url in urls:
                  try:
                      req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json'},method='POST')
                      with urllib.request.urlopen(req,timeout=30) as r:
                          data=json.loads(r.read().decode())
                      if 'error' in data:
                          errors.append({'url':url,'error':data['error']}); continue
                      return data['result'], url
                  except Exception as exc:
                      errors.append({'url':url,'error':repr(exc)})
              raise SystemExit(errors)

          code, rpc_url = rpc('eth_getCode',[address,block])
          result={'address':address,'block':int(block,16),'rpc':rpc_url,'code_bytes':(len(code)-2)//2,
                  'code_sha256':hashlib.sha256(bytes.fromhex(code[2:])).hexdigest(),'calls':{}}
          for name, selector in calls.items():
              raw,_=rpc('eth_call',[{'to':address,'data':selector},block])
              result['calls'][name]={'raw':raw,'uint':int(raw,16) if name!='version' else None}
          Path('out/live-immutables.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          Path('out/runtime.bin').write_bytes(bytes.fromhex(code[2:]))
          Path('out/SHA256SUMS').write_text(
              f"{hashlib.sha256(Path('out/live-immutables.json').read_bytes()).hexdigest()}  live-immutables.json\n"
              f"{hashlib.sha256(Path('out/runtime.bin').read_bytes()).hexdigest()}  runtime.bin\n"
          )
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-mainnet-fdg-live-immutables
          path: out/
          if-no-files-found: error
          retention-days: 3
