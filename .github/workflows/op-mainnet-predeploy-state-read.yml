name: OP Mainnet read-only predeploy state inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op-mainnet-predeploy-state-read.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query and normalize read-only OP Mainnet state
        shell: bash
        env:
          RPC_URL: https://mainnet.optimism.io
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          rpc_url = os.environ['RPC_URL']
          addresses = {
              'L2CrossDomainMessenger': '0x4200000000000000000000000000000000000007',
              'GasPriceOracle': '0x420000000000000000000000000000000000000f',
              'L2StandardBridge': '0x4200000000000000000000000000000000000010',
              'SequencerFeeVault': '0x4200000000000000000000000000000000000011',
              'OptimismMintableERC20Factory': '0x4200000000000000000000000000000000000012',
              'L2ERC721Bridge': '0x4200000000000000000000000000000000000014',
              'L1Block': '0x4200000000000000000000000000000000000015',
              'L2ToL1MessagePasser': '0x4200000000000000000000000000000000000016',
              'OptimismMintableERC721Factory': '0x4200000000000000000000000000000000000017',
              'L2ProxyAdmin': '0x4200000000000000000000000000000000000018',
              'BaseFeeVault': '0x4200000000000000000000000000000000000019',
              'L1FeeVault': '0x420000000000000000000000000000000000001a',
              'OperatorFeeVault': '0x420000000000000000000000000000000000001b',
              'ConditionalDeployer': '0x420000000000000000000000000000000000002c',
              'L2DevFeatureFlags': '0x420000000000000000000000000000000000002d',
          }
          staking = '0xb5CB7a05DD1311195982A26DFC8222477f9D8179'
          op_token = '0x4200000000000000000000000000000000000042'
          impl_slot = '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          owner_slot = '0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103'
          oz_v5_slot = '0xf0c57e16840df040f15088dc2f81fe391c3923bec73e23a9662efc9c229c6a00'

          requests: list[dict[str, object]] = [
              {'jsonrpc': '2.0', 'id': 'blockNumber', 'method': 'eth_blockNumber', 'params': []}
          ]
          for name, address in addresses.items():
              requests.extend([
                  {'jsonrpc': '2.0', 'id': f'{name}.code', 'method': 'eth_getCode', 'params': [address, 'latest']},
                  {'jsonrpc': '2.0', 'id': f'{name}.implementation', 'method': 'eth_getStorageAt', 'params': [address, impl_slot, 'latest']},
                  {'jsonrpc': '2.0', 'id': f'{name}.slot0', 'method': 'eth_getStorageAt', 'params': [address, '0x0', 'latest']},
                  {'jsonrpc': '2.0', 'id': f'{name}.slot1', 'method': 'eth_getStorageAt', 'params': [address, '0x1', 'latest']},
                  {'jsonrpc': '2.0', 'id': f'{name}.ozV5Initializable', 'method': 'eth_getStorageAt', 'params': [address, oz_v5_slot, 'latest']},
                  {'jsonrpc': '2.0', 'id': f'{name}.version', 'method': 'eth_call', 'params': [{'to': address, 'data': '0x54fd4d50'}, 'latest']},
              ])
          padded_staking = staking[2:].lower().rjust(64, '0')
          requests.extend([
              {'jsonrpc': '2.0', 'id': 'L2ProxyAdmin.ownerSlot', 'method': 'eth_getStorageAt', 'params': [addresses['L2ProxyAdmin'], owner_slot, 'latest']},
              {'jsonrpc': '2.0', 'id': 'L2ProxyAdmin.owner', 'method': 'eth_call', 'params': [{'to': addresses['L2ProxyAdmin'], 'data': '0x8da5cb5b'}, 'latest']},
              {'jsonrpc': '2.0', 'id': 'PolicyEngineStaking.code', 'method': 'eth_getCode', 'params': [staking, 'latest']},
              {'jsonrpc': '2.0', 'id': 'PolicyEngineStaking.paused', 'method': 'eth_call', 'params': [{'to': staking, 'data': '0x5c975abb'}, 'latest']},
              {'jsonrpc': '2.0', 'id': 'PolicyEngineStaking.owner', 'method': 'eth_call', 'params': [{'to': staking, 'data': '0x8da5cb5b'}, 'latest']},
              {'jsonrpc': '2.0', 'id': 'PolicyEngineStaking.opBalance', 'method': 'eth_call', 'params': [{'to': op_token, 'data': '0x70a08231' + padded_staking}, 'latest']},
              {'jsonrpc': '2.0', 'id': 'OP.totalSupply', 'method': 'eth_call', 'params': [{'to': op_token, 'data': '0x18160ddd'}, 'latest']},
          ])
          Path('out/request.json').write_text(json.dumps(requests, indent=2) + '\n', encoding='utf-8')

          responses: list[dict[str, object]] = []
          for offset in range(0, len(requests), 10):
              batch = requests[offset:offset + 10]
              body = json.dumps(batch, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  rpc_url,
                  data=body,
                  headers={'Content-Type': 'application/json', 'User-Agent': 'read-only-security-inventory/1.1'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      parsed = json.loads(response.read().decode('utf-8'))
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                  raise SystemExit(f'RPC batch {offset // 10} failed: {exc}') from exc
              if not isinstance(parsed, list):
                  raise SystemExit(f'RPC batch {offset // 10} returned non-list: {parsed!r}')
              responses.extend(parsed)
              time.sleep(0.15)

          Path('out/raw-response.json').write_text(json.dumps(responses, indent=2) + '\n', encoding='utf-8')

          def decode_abi_string(value: object) -> str | None:
              if not isinstance(value, str) or not value.startswith('0x'):
                  return None
              try:
                  raw = bytes.fromhex(value[2:])
                  if len(raw) < 64:
                      return None
                  offset = int.from_bytes(raw[:32], 'big')
                  if offset + 32 > len(raw):
                      return None
                  length = int.from_bytes(raw[offset:offset + 32], 'big')
                  end = offset + 32 + length
                  if end > len(raw):
                      return None
                  return raw[offset + 32:end].decode('utf-8')
              except (ValueError, UnicodeDecodeError):
                  return None

          by_id: dict[str, object] = {}
          errors: list[dict[str, object]] = []
          for item in responses:
              ident = str(item.get('id'))
              if 'error' in item:
                  error = {'id': ident, 'error': item['error']}
                  errors.append(error)
                  by_id[ident] = error
              else:
                  result = item.get('result')
                  entry: dict[str, object] = {'raw': result}
                  if ident.endswith('.version'):
                      entry['decoded'] = decode_abi_string(result)
                  by_id[ident] = entry

          def raw_hex(ident: str) -> str:
              entry = by_id.get(ident)
              if not isinstance(entry, dict) or not isinstance(entry.get('raw'), str):
                  raise SystemExit(f'missing result for {ident}: {entry!r}')
              return entry['raw']

          staking_balance = int(raw_hex('PolicyEngineStaking.opBalance'), 16)
          total_supply = int(raw_hex('OP.totalSupply'), 16)
          staking_summary = {
              'address': staking,
              'block_number': int(raw_hex('blockNumber'), 16),
              'runtime_code_bytes': (len(raw_hex('PolicyEngineStaking.code')) - 2) // 2,
              'paused': bool(int(raw_hex('PolicyEngineStaking.paused'), 16)),
              'owner': '0x' + raw_hex('PolicyEngineStaking.owner')[-40:],
              'op_balance_wei': staking_balance,
              'op_balance_tokens': f'{staking_balance / 10**18:.18f}',
              'op_total_supply_wei': total_supply,
              'op_total_supply_tokens': f'{total_supply / 10**18:.18f}',
              'supply_fraction': staking_balance / total_supply if total_supply else None,
          }

          report = {
              'rpc': rpc_url,
              'request_count': len(requests),
              'response_count': len(responses),
              'block': by_id.get('blockNumber'),
              'errors': errors,
              'policy_engine_staking': staking_summary,
              'results': dict(sorted(by_id.items())),
          }
          report_path = Path('out/predeploy-state.json')
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          manifest = []
          for path in [Path('out/request.json'), Path('out/raw-response.json'), report_path]:
              manifest.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          Path('out/SHA256SUMS').write_text('\n'.join(manifest) + '\n', encoding='utf-8')

          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-mainnet-predeploy-state-read
          path: out
          if-no-files-found: error
          retention-days: 3
