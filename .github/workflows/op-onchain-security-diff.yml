name: OP onchain security diff export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op-onchain-security-diff.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact public Optimism source with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: 3fda355bfd97cb9a0ffc8642b5fc86b18eeea369
          path: upstream
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Verify refs and export focused history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/diffs out/history out/source
          test "$(git -C upstream rev-parse HEAD)" = "3fda355bfd97cb9a0ffc8642b5fc86b18eeea369"
          git -C upstream rev-parse op-contracts/v7.0.0 > out/base-commit.txt
          git -C upstream rev-parse HEAD > out/head-commit.txt

          files=(
            packages/contracts-bedrock/src/L1/OptimismPortal2.sol
            packages/contracts-bedrock/src/dispute/AnchorStateRegistry.sol
            packages/contracts-bedrock/src/dispute/DisputeGameFactory.sol
            packages/contracts-bedrock/src/dispute/FaultDisputeGame.sol
            packages/contracts-bedrock/src/dispute/DelayedWETH.sol
            packages/contracts-bedrock/src/L1/ETHLockbox.sol
            packages/contracts-bedrock/src/libraries/Hashing.sol
            packages/contracts-bedrock/src/libraries/trie/MerkleTrie.sol
            packages/contracts-bedrock/src/libraries/trie/SecureMerkleTrie.sol
          )

          for path in "${files[@]}"; do
            safe="${path//\//__}"
            git -C upstream diff --find-renames --find-copies --binary \
              op-contracts/v7.0.0..HEAD -- "$path" > "out/diffs/${safe}.diff"
            git -C upstream log --date=iso-strict --format='%H%x09%ad%x09%s' \
              op-contracts/v7.0.0..HEAD -- "$path" > "out/history/${safe}.log"
            if test -f "upstream/$path"; then
              mkdir -p "out/source/$(dirname "$path")"
              cp "upstream/$path" "out/source/$path"
            fi
          done

          git -C upstream log --date=iso-strict --format='%H%x09%ad%x09%s' \
            op-contracts/v7.0.0..HEAD -- packages/contracts-bedrock/src \
            > out/history/all-contracts.log

          sha256sum out/base-commit.txt out/head-commit.txt out/diffs/* out/history/* \
            > out/SHA256SUMS
          tar -czf out/op-onchain-security-diff.tar.gz \
            -C out base-commit.txt head-commit.txt SHA256SUMS diffs history source

      - name: Upload focused diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-onchain-security-diff
          path: out/op-onchain-security-diff.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
