name: OP shared consensus fix history

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op-shared-consensus-fix-history.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact public Optimism history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: 3fda355bfd97cb9a0ffc8642b5fc86b18eeea369
          path: upstream
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Export shared execution changes after production lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base="20636578d271888a492ecb566a788570cdc0d7f0"
          head="3fda355bfd97cb9a0ffc8642b5fc86b18eeea369"
          test "$(git -C upstream rev-parse HEAD)" = "$head"

          paths=(
            rust/alloy-op-evm
            rust/op-revm
            rust/op-alloy
            rust/alloy-op-hardforks
          )

          git -C upstream log --reverse --date=iso-strict \
            --format='%H%x09%ad%x09%s' "$base..$head" -- "${paths[@]}" \
            > out/commit-list.tsv
          git -C upstream log --reverse --stat --date=iso-strict \
            --format='COMMIT %H%nDATE %ad%nSUBJECT %s' "$base..$head" -- "${paths[@]}" \
            > out/history-stat.txt
          git -C upstream diff --find-renames --find-copies --binary \
            "$base..$head" -- "${paths[@]}" > out/history.patch
          git -C upstream diff --name-status "$base..$head" -- "${paths[@]}" \
            > out/name-status.txt
          {
            echo "base=$base"
            echo "head=$head"
            echo "commit_count=$(wc -l < out/commit-list.tsv)"
          } > out/MANIFEST.txt
          sha256sum out/* > out/SHA256SUMS
          tar -czf out/op-shared-consensus-fix-history.tar.gz -C out \
            commit-list.tsv history-stat.txt history.patch name-status.txt MANIFEST.txt SHA256SUMS

      - name: Upload history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op-shared-consensus-fix-history
          path: out/op-shared-consensus-fix-history.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
