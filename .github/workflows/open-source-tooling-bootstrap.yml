name: Open-source tooling bootstrap

on:
  push:
    branches:
      - tooling/foundry-download-bootstrap-20260802
    paths:
      - '.github/workflows/open-source-tooling-bootstrap.yml'
      - 'tooling-download-bootstrap.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/open-source-tooling-bootstrap.yml'
      - 'tooling-download-bootstrap.md'

permissions:
  contents: read

jobs:
  package-tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Foundry v1.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/foundry_v1.7.1_linux_amd64.tar.gz \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo 'cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  bootstrap/foundry_v1.7.1_linux_amd64.tar.gz' | sha256sum -c -

      - name: Download Solidity compilers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/solc-0.7.1-static-linux \
            https://github.com/ethereum/solidity/releases/download/v0.7.1/solc-static-linux
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/solc-0.8.27-static-linux \
            https://github.com/ethereum/solidity/releases/download/v0.8.27/solc-static-linux
          chmod +x bootstrap/solc-*-static-linux
          bootstrap/solc-0.7.1-static-linux --version | tee bootstrap/solc-0.7.1-version.txt
          bootstrap/solc-0.8.27-static-linux --version | tee bootstrap/solc-0.8.27-version.txt
          sha256sum bootstrap/solc-*-static-linux | tee bootstrap/solc-static-linux.sha256

      - name: Download exact Balancer V2 source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/balancer-v2-monorepo-f8b6f44.tar.gz \
            https://codeload.github.com/balancer/balancer-v2-monorepo/tar.gz/f8b6f44f21afaf3c802536ed478277f945e7f256
          sha256sum bootstrap/balancer-v2-monorepo-f8b6f44.tar.gz | tee bootstrap/balancer-v2-monorepo-f8b6f44.tar.gz.sha256

      - name: Download current Balancer deployments archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/balancer-deployments-c1c3038.tar.gz \
            https://codeload.github.com/balancer/balancer-deployments/tar.gz/c1c3038a4fa214231af9099e4438998fccc30d59
          sha256sum bootstrap/balancer-deployments-c1c3038.tar.gz | tee bootstrap/balancer-deployments-c1c3038.tar.gz.sha256

      - name: Download exact Balancer V3 source snapshots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/balancer-v3-composite-v2-68cc540.tar.gz \
            https://codeload.github.com/balancer/balancer-v3-monorepo/tar.gz/68cc540d16270044fc4ac6fbdcb24c2cf4fc87bf
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/balancer-v3-fixed-price-lbp-52a94c0.tar.gz \
            https://codeload.github.com/balancer/balancer-v3-monorepo/tar.gz/52a94c039e9fb319a51d9b047692337574a820fd
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/balancer-v3-current-7861ea2.tar.gz \
            https://codeload.github.com/balancer/balancer-v3-monorepo/tar.gz/7861ea2785b96dd10681ff1b8dfe56b36cc202b6
          sha256sum bootstrap/balancer-v3-*.tar.gz | tee bootstrap/balancer-v3-source-archives.sha256

      - name: Download exact Foundry test dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/forge-std-bb4ceea.tar.gz \
            https://codeload.github.com/foundry-rs/forge-std/tar.gz/bb4ceea94d6f10eeb5b41dc2391c6c8bf8e734ef
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/forge-gas-snapshot-ee8e1f0.tar.gz \
            https://codeload.github.com/ylv-io/forge-gas-snapshot/tar.gz/ee8e1f02009785ab81a5058a18c75d5d3b7a894d
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/permit2-cc56ad0.tar.gz \
            https://codeload.github.com/Uniswap/permit2/tar.gz/cc56ad0f3439c502c246fc5cfcc3db92bb8b7219
          curl --fail --location --retry 5 --retry-all-errors \
            -o bootstrap/openzeppelin-contracts-v5.0.0.tar.gz \
            https://codeload.github.com/OpenZeppelin/openzeppelin-contracts/tar.gz/v5.0.0
          sha256sum bootstrap/forge-*.tar.gz bootstrap/permit2-*.tar.gz bootstrap/openzeppelin-*.tar.gz \
            | tee bootstrap/foundry-test-dependencies.sha256

      - name: Inventory
        shell: bash
        run: |
          set -euo pipefail
          find bootstrap -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee bootstrap/INVENTORY.tsv

      - name: Upload open-source tool bundle
        uses: actions/upload-artifact@v4
        with:
          name: open-source-evm-tooling
          path: bootstrap/
          if-no-files-found: error
          retention-days: 1
