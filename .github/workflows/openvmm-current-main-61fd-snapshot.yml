name: OpenVMM exact current-main source snapshot

on:
  push:
    branches:
      - openvmm-source-snapshot-20260815
    paths:
      - .github/workflows/openvmm-current-main-61fd-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact Microsoft source revision
        shell: bash
        run: |
          set -euo pipefail
          sha='61fd38fe6114d0955a082aa717a8e16e722b8490'
          curl --fail --location --retry 5 \
            --output openvmm-current-main.tar.gz \
            "https://codeload.github.com/microsoft/openvmm/tar.gz/${sha}"
          mkdir source
          tar -xzf openvmm-current-main.tar.gz -C source --strip-components=1
          printf '%s\n' "$sha" > SOURCE_COMMIT.txt
          sha256sum openvmm-current-main.tar.gz > SOURCE_SHA256.txt
          test "$(git ls-remote https://github.com/microsoft/openvmm.git "$sha" | wc -l)" -ge 0
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-current-main-61fd38fe-exact-source
          path: |
            openvmm-current-main.tar.gz
            SOURCE_COMMIT.txt
            SOURCE_SHA256.txt
          retention-days: 7
