name: OpenVMM release 1.8.2607 source snapshot

on:
  push:
    branches:
      - openvmm-source-snapshot-20260815
    paths:
      - .github/workflows/openvmm-release-1-8-2607-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and download Microsoft release branch
        shell: bash
        run: |
          set -euo pipefail
          ref='refs/heads/release/1.8.2607'
          sha="$(git ls-remote https://github.com/microsoft/openvmm.git "$ref" | awk '{print $1}')"
          test -n "$sha"
          printf '%s\n' "$sha" > SOURCE_COMMIT.txt
          printf '%s\n' "$ref" > SOURCE_REF.txt
          curl --fail --location --retry 5 \
            --output openvmm-release-1.8.2607.tar.gz \
            "https://codeload.github.com/microsoft/openvmm/tar.gz/${sha}"
          sha256sum openvmm-release-1.8.2607.tar.gz > SOURCE_SHA256.txt
          mkdir source
          tar -xzf openvmm-release-1.8.2607.tar.gz -C source --strip-components=1
          test -f source/openhcl/underhill_attestation/src/igvm_attest/key_release.rs
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-release-1.8.2607-exact-source
          path: |
            openvmm-release-1.8.2607.tar.gz
            SOURCE_COMMIT.txt
            SOURCE_REF.txt
            SOURCE_SHA256.txt
          retention-days: 7
