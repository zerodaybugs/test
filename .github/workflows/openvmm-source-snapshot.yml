name: OpenVMM exact source snapshot

on:
  push:
    branches:
      - openvmm-source-snapshot-20260815
    paths:
      - '.github/workflows/openvmm-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact public OpenVMM commit
        uses: actions/checkout@v4
        with:
          repository: microsoft/openvmm
          ref: ee2fc3ffe2a816135374921d34b2fdf2990fd072
          path: openvmm
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and archive public source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C openvmm rev-parse HEAD)" = "ee2fc3ffe2a816135374921d34b2fdf2990fd072"
          rm -rf openvmm/.git
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf openvmm-v0.1.0-exact-source.tar.gz openvmm
          sha256sum openvmm-v0.1.0-exact-source.tar.gz > SHA256SUMS.txt
          printf '%s\n' 'commit=ee2fc3ffe2a816135374921d34b2fdf2990fd072' > SOURCE_IDENTITY.txt
          printf '%s\n' 'tag=openvmm-v0.1.0' >> SOURCE_IDENTITY.txt

      - name: Upload exact public source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-v0.1.0-exact-source
          path: |
            openvmm-v0.1.0-exact-source.tar.gz
            SHA256SUMS.txt
            SOURCE_IDENTITY.txt
          if-no-files-found: error
          retention-days: 7
