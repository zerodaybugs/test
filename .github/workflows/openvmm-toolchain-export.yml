name: Temporary Rust 1.95 toolchain export

on:
  push:
    branches:
      - agent/openvmm-rust195-ci-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out scratch repository
        uses: actions/checkout@v4

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version --verbose
          cargo +1.95.0 --version --verbose

      - name: Export toolchain and exact OpenVMM source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          toolchain_dir="$(dirname "$(dirname "$(rustup which --toolchain 1.95.0 rustc)")")"
          toolchain_parent="$(dirname "$toolchain_dir")"
          toolchain_name="$(basename "$toolchain_dir")"
          tar --zstd -cf export/rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst \
            -C "$toolchain_parent" "$toolchain_name"

          git clone --depth 1 --branch openvmm-v0.1.0 \
            https://github.com/microsoft/openvmm.git export/openvmm-v0.1.0
          test "$(git -C export/openvmm-v0.1.0 rev-parse HEAD)" = \
            "ee2fc3ffe2a816135374921d34b2fdf2990fd072"
          tar --zstd -cf export/openvmm-v0.1.0-source.tar.zst \
            -C export openvmm-v0.1.0

          printf '%s\n' 'rustc 1.95.0' > export/IDENTITY.txt
          rustc +1.95.0 --version --verbose >> export/IDENTITY.txt
          cargo +1.95.0 --version --verbose >> export/IDENTITY.txt
          git -C export/openvmm-v0.1.0 rev-parse HEAD >> export/IDENTITY.txt
          sha256sum export/*.tar.zst export/IDENTITY.txt > export/SHA256SUMS.txt

      - name: Upload deterministic export
        uses: actions/upload-artifact@v4
        with:
          name: rust195-openvmm-v010-export
          path: |
            export/rust-1.95.0-x86_64-unknown-linux-gnu.tar.zst
            export/openvmm-v0.1.0-source.tar.zst
            export/IDENTITY.txt
            export/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
