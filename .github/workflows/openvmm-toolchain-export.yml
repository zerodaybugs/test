name: Temporary protoc export

on:
  push:
    branches:
      - agent/openvmm-rust195-ci-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out scratch repository
        uses: actions/checkout@v4

      - name: Install and export protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

          mkdir -p export/protoc/bin export/protoc/lib
          cp "$(command -v protoc)" export/protoc/bin/protoc.real
          while read -r lib; do
            test -n "$lib" || continue
            cp -L "$lib" "export/protoc/lib/$(basename "$lib")"
          done < <(ldd "$(command -v protoc)" | awk '/=> \// {print $3} /^\// {print $1}')

          cat > export/protoc/bin/protoc <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "$0")/.." && pwd)"
          export LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$here/bin/protoc.real" "$@"
          SH
          chmod +x export/protoc/bin/protoc export/protoc/bin/protoc.real

          export/protoc/bin/protoc --version | tee export/IDENTITY.txt
          ldd export/protoc/bin/protoc.real >> export/IDENTITY.txt
          tar --zstd -cf export/protoc-ubuntu-24.04-x86_64.tar.zst -C export protoc
          sha256sum export/protoc-ubuntu-24.04-x86_64.tar.zst export/IDENTITY.txt \
            > export/SHA256SUMS.txt

      - name: Upload deterministic export
        uses: actions/upload-artifact@v4
        with:
          name: protoc-ubuntu2404-x86_64-export
          path: |
            export/protoc-ubuntu-24.04-x86_64.tar.zst
            export/IDENTITY.txt
            export/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
