name: Exact OpenVMM upstream UEFI smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/openvmm-upstream-uefi-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Capture runner baseline
        shell: bash
        run: |
          set -euo pipefail
          {
            date -u +%FT%TZ
            uname -a
            id
            nproc
            grep MemTotal /proc/meminfo
            ls -l /dev/kvm
            grep -m1 -Eo '(^| )(vmx|svm)( |$)' /proc/cpuinfo || true
          } | tee runner-baseline.txt
          sudo chmod 666 /dev/kvm

      - name: Install bootstrap dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang lld llvm pkg-config libssl-dev libudev-dev \
            libcap-dev libfdt-dev uuid-dev nasm jq curl unzip

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Checkout exact Microsoft source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/openvmm.git openvmm
          cd openvmm
          git checkout --detach 21dc2e64d599a0a8d7fe283f05bd75ea2e72ba46
          test "$(git rev-parse HEAD)" = 21dc2e64d599a0a8d7fe283f05bd75ea2e72ba46
          git status --short
          git rev-parse HEAD | tee ../source-commit.txt

      - name: Restore exact OpenVMM external packages
        shell: bash
        run: |
          set -euo pipefail
          cd openvmm
          cargo xflowey restore-packages 2>&1 | tee ../restore-packages.log
          test -x .packages/Google.Protobuf.Tools/tools/protoc
          .packages/Google.Protobuf.Tools/tools/protoc --version | tee ../protoc-version.txt

      - name: Download pinned Microsoft UEFI firmware
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/microsoft/mu_msvm/releases/download/v26.0.19/RELEASE-X64-VS2022-artifacts.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors -o mu_msvm-x64.tar.gz "$url"
          mkdir mu_msvm-x64
          tar -xzf mu_msvm-x64.tar.gz -C mu_msvm-x64
          test -f mu_msvm-x64/FV/MSVM.fd
          sha256sum mu_msvm-x64/FV/MSVM.fd | tee MSVM.fd.sha256

      - name: Run exact upstream UEFI guest smoke
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          cd openvmm
          rustc --version | tee ../rustc-version.txt
          cargo --version | tee ../cargo-version.txt
          cargo nextest --version | tee ../nextest-version.txt
          set +e
          cargo xflowey vmm-tests-run \
            --target linux-x64 \
            --filter 'test(guest_test_uefi) & test(openvmm_uefi_x64)' \
            --install-missing-deps \
            --skip-vhd-prompt \
            --custom-uefi-firmware "$GITHUB_WORKSPACE/mu_msvm-x64/FV/MSVM.fd" \
            2>&1 | tee ../openvmm-uefi-smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "return_code=$rc" | tee ../openvmm-uefi-smoke-status.txt
          exit "$rc"

      - name: Upload auditable logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-openvmm-upstream-uefi-smoke
          path: |
            runner-baseline.txt
            source-commit.txt
            MSVM.fd.sha256
            rustc-version.txt
            cargo-version.txt
            nextest-version.txt
            protoc-version.txt
            restore-packages.log
            openvmm-uefi-smoke.log
            openvmm-uefi-smoke-status.txt
          retention-days: 7
