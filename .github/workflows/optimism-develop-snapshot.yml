name: Optimism public production-to-develop snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/optimism-develop-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current public develop tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: develop
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Fetch immutable production tag
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream fetch --depth=1 origin \
            refs/tags/op-reth/v2.3.3:refs/tags/op-reth/v2.3.3
          test "$(git -C upstream rev-parse refs/tags/op-reth/v2.3.3^{commit})" = \
            "20636578d271888a492ecb566a788570cdc0d7f0"

      - name: Export public comparison material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/develop out/meta
          cd upstream
          git rev-parse HEAD > ../out/meta/develop-commit.txt
          git rev-parse refs/tags/op-reth/v2.3.3^{commit} > ../out/meta/production-commit.txt
          requested=(
            rust/Cargo.toml
            rust/Cargo.lock
            rust/op-revm
            rust/alloy-op-evm
            rust/alloy-op-hardforks
            rust/op-alloy
            rust/op-reth
            rust/revm-ee-tests
            rust/kona/bin/client
            rust/kona/bin/host
            rust/kona/crates/proof
            rust/kona/crates/protocol
            rust/kona/crates/node/engine
            rust/kona/crates/node/gossip
            rust/kona/crates/node/rpc
            rust/kona/crates/node/service
            rust/kona/sp1/crates/client
            op-node/rollup/derive
            op-node/rollup/engine
            op-core/interop
            op-supervisor
            op-preimage
            packages/contracts-bedrock/src/cannon
            packages/contracts-bedrock/src/dispute
            packages/contracts-bedrock/src/L1
            packages/contracts-bedrock/src/libraries
            packages/contracts-bedrock/src/universal
            packages/contracts-bedrock/interfaces/cannon
            specs
          )
          paths=()
          for p in "${requested[@]}"; do
            if test -e "$p"; then
              paths+=("$p")
            fi
          done
          printf '%s\n' "${paths[@]}" > ../out/meta/develop-existing-paths.txt
          tar -czf ../out/develop/optimism-develop-critical-source.tar.gz "${paths[@]}"
          git diff --no-ext-diff --binary refs/tags/op-reth/v2.3.3..HEAD -- "${requested[@]}" \
            > ../out/production-to-develop-critical.diff
          git diff --name-status refs/tags/op-reth/v2.3.3..HEAD -- "${requested[@]}" \
            > ../out/production-to-develop-name-status.txt
          cd ..
          sha256sum out/develop/optimism-develop-critical-source.tar.gz \
            out/production-to-develop-critical.diff \
            out/production-to-develop-name-status.txt > out/SHA256SUMS
          ls -lh out/develop/optimism-develop-critical-source.tar.gz \
            out/production-to-develop-critical.diff \
            out/production-to-develop-name-status.txt

      - name: Upload comparison snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimism-public-production-to-develop-snapshot
          path: out
          if-no-files-found: error
          retention-days: 3
