name: Optimism exact fault-proof source export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/optimism-exact-fault-proof-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact respected Kona prestate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: d7cea91bc2f555a76b7720bf9c32f46c0b856119
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          expected="d7cea91bc2f555a76b7720bf9c32f46c0b856119"
          actual="$(git -C upstream rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Create reproducible source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar --exclude='.git' --exclude='node_modules' --exclude='target' --exclude='forge-artifacts' \
            -czf out/optimism-fault-proof-d7cea91-source.tar.gz -C upstream .
          {
            echo "source_commit=$(git -C upstream rev-parse HEAD)"
            echo "source_tree=$(git -C upstream rev-parse HEAD^{tree})"
            echo "archive=optimism-fault-proof-d7cea91-source.tar.gz"
          } > out/MANIFEST.txt
          sha256sum out/optimism-fault-proof-d7cea91-source.tar.gz out/MANIFEST.txt > out/SHA256SUMS
          ls -lh out

      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimism-fault-proof-d7cea91-source
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
