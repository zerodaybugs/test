name: Optimism op-rbuilder and rollup-boost production baseline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/optimism-op-rbuilder-rollup-boost.yml"

permissions:
  contents: read

jobs:
  builder:
    name: op-rbuilder workspace
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout production tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-reth/v2.3.3
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify production lock
        run: test "$(git -C upstream rev-parse HEAD)" = "20636578d271888a492ecb566a788570cdc0d7f0"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libssl-dev pkg-config protobuf-compiler
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Test locked op-rbuilder workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd upstream/rust/op-rbuilder
          cargo fetch --locked
          set -o pipefail
          cargo test --locked --workspace --all-targets -- --nocapture \
            2>&1 | tee ../../../evidence/op-rbuilder-tests.log

      - name: Inventory candidate-execution tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd upstream/rust/op-rbuilder
          cargo test --locked --workspace -- --list > ../../../evidence/op-rbuilder-test-list.txt 2>&1 || true
          grep -Eini 'reject|discard|revert|warm|refund|post.?exec|state.?root|flashblock|commit|rollback|gas' \
            ../../../evidence/op-rbuilder-test-list.txt > ../../../evidence/op-rbuilder-critical-inventory.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimism-op-rbuilder-v2.3.3
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  boost:
    name: rollup-boost workspace
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout production tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-reth/v2.3.3
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify production lock
        run: test "$(git -C upstream rev-parse HEAD)" = "20636578d271888a492ecb566a788570cdc0d7f0"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libssl-dev pkg-config protobuf-compiler
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Test locked rollup-boost workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd upstream/rust/rollup-boost
          cargo fetch --locked
          set -o pipefail
          cargo test --locked --workspace --all-targets -- --nocapture \
            2>&1 | tee ../../../evidence/rollup-boost-tests.log

      - name: Inventory validation and fallback tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd upstream/rust/rollup-boost
          cargo test --locked --workspace -- --list > ../../../evidence/rollup-boost-test-list.txt 2>&1 || true
          grep -Eini 'validate|fallback|invalid|payload|flashblock|state.?root|timeout|builder|commit|rollback' \
            ../../../evidence/rollup-boost-test-list.txt > ../../../evidence/rollup-boost-critical-inventory.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimism-rollup-boost-v2.3.3
          path: evidence/
          if-no-files-found: error
          retention-days: 14
