name: Optimism op-reth v2.3.3 extended differential baseline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/optimism-op-reth-extended.yml"

permissions:
  contents: read

concurrency:
  group: optimism-op-reth-extended-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extended:
    name: Node, reorg, trie and test-engine coverage
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact Optimism production tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-reth/v2.3.3
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "20636578d271888a492ecb566a788570cdc0d7f0"

      - name: Install build dependencies and Rust 1.94.0
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libssl-dev pkg-config protobuf-compiler
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc -Vv
          cargo -V

      - name: Fetch locked graph
        working-directory: upstream/rust
        run: cargo fetch --locked

      - name: Run node, trie, ExEx and ephemeral-engine suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd upstream/rust
          set -o pipefail
          cargo test --locked \
            -p reth-optimism-node \
            -p reth-optimism-trie \
            -p reth-optimism-exex \
            -p op-reth-test-engine \
            -p reth-optimism-flashblocks \
            -p reth-optimism-rpc \
            --lib --tests -- --nocapture \
            2>&1 | tee ../../evidence/extended-tests.log

      - name: Extract consensus-adjacent test inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd upstream/rust
          cargo test --locked -p reth-optimism-node -- --list > ../../evidence/node-tests.txt 2>&1 || true
          cargo test --locked -p op-reth-test-engine -- --list > ../../evidence/test-engine-tests.txt 2>&1 || true
          cargo test --locked -p reth-optimism-trie -- --list > ../../evidence/trie-tests.txt 2>&1 || true
          grep -Eini 'reorg|unwind|parent|overlay|withdraw|state.?root|blockhash|fork|payload' \
            ../../evidence/*-tests.txt > ../../evidence/consensus-test-inventory.txt || true

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "source_tag=op-reth/v2.3.3"
            echo "source_commit=$(git -C upstream rev-parse HEAD 2>/dev/null || true)"
            echo "rustc=$(rustc --version 2>/dev/null || true)"
            echo "cargo=$(cargo --version 2>/dev/null || true)"
            echo "runner=$(uname -a)"
          } > evidence/provenance.txt

      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimism-op-reth-v2.3.3-extended
          path: evidence/
          if-no-files-found: error
          retention-days: 14
