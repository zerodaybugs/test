name: Optimism op-reth public baseline smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/optimism-op-reth-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner and network smoke
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          git --version

      - name: Checkout exact Optimism production tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-reth/v2.3.3
          path: upstream
          fetch-depth: 1
          submodules: false

      - name: Verify source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "20636578d271888a492ecb566a788570cdc0d7f0"
          git -C upstream rev-parse HEAD
