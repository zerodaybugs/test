name: Optimism Rust 1.94 offline build kit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/optimism-rust-offline-kit.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact Optimism production tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-reth/v2.3.3
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify immutable source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "20636578d271888a492ecb566a788570cdc0d7f0"

      - name: Install locked Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc -Vv
          cargo -V

      - name: Fetch exact locked Rust dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path upstream/rust/Cargo.toml
          mkdir -p offline-kit
          printf 'source_commit=20636578d271888a492ecb566a788570cdc0d7f0\n' > offline-kit/MANIFEST.txt
          rustc -Vv >> offline-kit/MANIFEST.txt
          cargo -V >> offline-kit/MANIFEST.txt
          du -sh "$HOME/.cargo/registry" "$HOME/.cargo/git" \
            "$HOME/.rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu"

      - name: Package relocatable toolchain and cargo cache
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -cf optimism-rust-offline-kit.tar.zst \
            -C "$HOME/.rustup/toolchains" 1.94.0-x86_64-unknown-linux-gnu \
            -C "$HOME" .cargo \
            -C "$GITHUB_WORKSPACE" offline-kit
          sha256sum optimism-rust-offline-kit.tar.zst > optimism-rust-offline-kit.sha256
          ls -lh optimism-rust-offline-kit.tar.zst optimism-rust-offline-kit.sha256

      - name: Upload offline build kit
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02
        with:
          name: optimism-rust-1.94-offline-kit
          path: |
            optimism-rust-offline-kit.tar.zst
            optimism-rust-offline-kit.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
