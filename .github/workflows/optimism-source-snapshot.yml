name: Optimism v2.3.3 research source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/optimism-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact production tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: op-reth/v2.3.3
          path: upstream
          fetch-depth: 1
          submodules: recursive

      - name: Verify source lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "20636578d271888a492ecb566a788570cdc0d7f0"

      - name: Build minimal analysis snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          paths=(
            rust/Cargo.toml
            rust/Cargo.lock
            rust/op-revm
            rust/alloy-op-evm
            rust/alloy-op-hardforks
            rust/op-alloy
            rust/op-reth
            rust/revm-ee-tests
            rust/kona/bin/client
            rust/kona/bin/host
            rust/kona/crates/proof
            rust/kona/crates/protocol
            rust/kona/crates/node/engine
            rust/kona/crates/node/gossip
            rust/kona/crates/node/rpc
            rust/kona/crates/node/service
            rust/kona/sp1/crates/client
            op-node/rollup/derive
            op-preimage
            packages/contracts-bedrock/src/cannon
            packages/contracts-bedrock/src/dispute
            packages/contracts-bedrock/src/L1
            packages/contracts-bedrock/src/libraries
            packages/contracts-bedrock/src/universal
            packages/contracts-bedrock/interfaces/cannon
            specs
          )
          tar -czf ../optimism-op-reth-v2.3.3-source.tar.gz "${paths[@]}"
          cd ..
          sha256sum optimism-op-reth-v2.3.3-source.tar.gz > optimism-op-reth-v2.3.3-source.sha256
          du -h optimism-op-reth-v2.3.3-source.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimism-op-reth-v2.3.3-source-snapshot
          path: |
            optimism-op-reth-v2.3.3-source.tar.gz
            optimism-op-reth-v2.3.3-source.sha256
          if-no-files-found: error
          retention-days: 7
