name: Package DeepBook main for Round 9

on:
  push:
    branches:
      - "sui-runtime-extract-*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact current DeepBook source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MystenLabs/deepbookv3.git /tmp/deepbook-main
          git -C /tmp/deepbook-main checkout --detach ed5eb7c25cacfeff606c815cf4dbbcfe0f97b0d6
          test "$(git -C /tmp/deepbook-main rev-parse HEAD)" = "ed5eb7c25cacfeff606c815cf4dbbcfe0f97b0d6"
          printf '%s\n' "ed5eb7c25cacfeff606c815cf4dbbcfe0f97b0d6" > /tmp/deepbook-main/EXACT_COMMIT.txt
          rm -rf /tmp/deepbook-main/.git

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: deepbook-main-ed5eb7c-round9
          path: /tmp/deepbook-main/
          compression-level: 6
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
