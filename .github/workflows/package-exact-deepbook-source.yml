name: Package exact DeepBook source

on:
  push:
    branches:
      - "sui-runtime-extract-*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact public source revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MystenLabs/deepbookv3.git /tmp/deepbookv3
          git -C /tmp/deepbookv3 checkout --detach 73253baacbcfb230987de180f55920ea869cfd0b
          test "$(git -C /tmp/deepbookv3 rev-parse HEAD)" = "73253baacbcfb230987de180f55920ea869cfd0b"
          printf '%s\n' "73253baacbcfb230987de180f55920ea869cfd0b" > /tmp/deepbookv3/EXACT_COMMIT.txt
          rm -rf /tmp/deepbookv3/.git

      - name: Upload exact public source tree
        uses: actions/upload-artifact@v4
        with:
          name: deepbookv3-margin-v6-exact-source
          path: /tmp/deepbookv3/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
