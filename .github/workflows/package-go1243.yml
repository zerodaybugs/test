name: Package Go 1.24.3 Linux AMD64

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-go1243.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Package verified GOROOT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          GOROOT_PATH="$(go env GOROOT)"
          go version | tee evidence/go-version.txt
          printf '%s\n' "$GOROOT_PATH" > evidence/goroot-path.txt
          tar -I 'zstd -T0 -3' -cf evidence/go1.24.3-linux-amd64-goroot.tar.zst -C "$(dirname "$GOROOT_PATH")" "$(basename "$GOROOT_PATH")"
          sha256sum evidence/* > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: go1.24.3-linux-amd64-goroot-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
