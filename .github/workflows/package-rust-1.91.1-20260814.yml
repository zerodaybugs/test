name: Package official Rust 1.91.1 toolchain

on:
  push:
    branches:
      - agent/monad-v0160-exact-vendor-20260811
    paths:
      - .github/workflows/package-rust-1.91.1-20260814.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install and package official toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.91.1-x86_64-unknown-linux-gnu --profile minimal
          toolchain="$(rustup which --toolchain 1.91.1-x86_64-unknown-linux-gnu rustc)"
          root="$(dirname "$(dirname "$toolchain")")"
          test -x "$root/bin/rustc"
          test -x "$root/bin/cargo"
          "$root/bin/rustc" --version --verbose | tee RUSTC_VERSION.txt
          "$root/bin/cargo" --version --verbose | tee CARGO_VERSION.txt
          tar --sort=name --mtime='UTC 2026-08-14' --owner=0 --group=0 --numeric-owner \
            -C "$root" --zstd -cf rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst .
          sha256sum rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst \
            | tee rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst.sha256

      - name: Upload official toolchain package
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.91.1-x86_64-unknown-linux-gnu-${{ github.run_id }}
          path: |
            rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst
            rust-1.91.1-x86_64-unknown-linux-gnu.tar.zst.sha256
            RUSTC_VERSION.txt
            CARGO_VERSION.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
