name: Package Sui security surface for Round 9

on:
  push:
    branches:
      - "sui-runtime-extract-*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Sparse-fetch exact Sui security surface
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MystenLabs/sui.git /tmp/sui
          git -C /tmp/sui sparse-checkout init --cone
          git -C /tmp/sui sparse-checkout set \
            external-crates/move \
            sui-execution/latest \
            sui-execution/v3 \
            crates/sui-adapter-transactional-tests \
            crates/sui-protocol-config \
            crates/sui-types \
            crates/sui-verifier \
            crates/sui-transaction-checks \
            crates/sui-core \
            crates/sui-execution \
            crates/sui-framework \
            crates/sui-framework-snapshot \
            crates/sui-move-build \
            crates/sui-move-natives \
            consensus/core \
            consensus/config
          git -C /tmp/sui checkout --detach d630b4452a884006f63bb66d3a0474bcf9efeea9
          test "$(git -C /tmp/sui rev-parse HEAD)" = "d630b4452a884006f63bb66d3a0474bcf9efeea9"
          printf '%s\n' "d630b4452a884006f63bb66d3a0474bcf9efeea9" > /tmp/sui/EXACT_COMMIT.txt
          cp /tmp/sui/Cargo.toml /tmp/sui/Cargo.lock /tmp/sui/rust-toolchain.toml /tmp/sui/EXACT_COMMIT.txt /tmp/ 2>/dev/null || true
          rm -rf /tmp/sui/.git

      - name: Inventory and hash source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sui
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256SUMS
          find . -type f | sort > SOURCE_FILE_LIST.txt
          du -sh . | tee SOURCE_SIZE.txt

      - name: Upload exact source surface
        uses: actions/upload-artifact@v4
        with:
          name: sui-security-surface-d630b445-round9
          path: /tmp/sui/
          compression-level: 6
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
