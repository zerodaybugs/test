name: Package exact Sui Testnet 1.77.2 source for Round 10

on:
  push:
    branches:
      - "sui-round10-release-1772-20260816"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact upstream commit
        shell: bash
        run: |
          set -euo pipefail
          SHA=51d177ad7d65102fc368b582408f466d97b31548
          git init /tmp/sui
          git -C /tmp/sui remote add origin https://github.com/MystenLabs/sui.git
          git -C /tmp/sui fetch --depth=1 origin "$SHA"
          git -C /tmp/sui checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sui rev-parse HEAD)" = "$SHA"
          mkdir -p /tmp/out
          git -C /tmp/sui rev-parse HEAD > /tmp/out/UPSTREAM_COMMIT.txt
          git -C /tmp/sui show -s --format=fuller HEAD > /tmp/out/UPSTREAM_COMMIT_METADATA.txt

      - name: Archive security-relevant exact source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sui
          requested=(
            Cargo.toml
            Cargo.lock
            deny.toml
            sui-execution/latest
            crates/sui-types
            crates/sui-core
            crates/sui-framework/packages/sui-framework/sources
            crates/sui-protocol-config
            crates/sui-adapter-transactional-tests
            crates/sui-transaction-checks
            crates/sui-rpc-api
            external-crates/move/crates/move-binary-format
            external-crates/move/crates/move-bytecode-verifier
            external-crates/move/crates/move-vm-runtime
            external-crates/move/crates/move-vm-types
            external-crates/move/crates/move-core-types
          )
          paths=()
          : > /tmp/out/MISSING_REQUESTED_PATHS.txt
          for p in "${requested[@]}"; do
            if [[ -e "$p" ]]; then
              paths+=("$p")
            else
              printf '%s\n' "$p" >> /tmp/out/MISSING_REQUESTED_PATHS.txt
            fi
          done
          (( ${#paths[@]} > 0 ))
          printf '%s\n' "${paths[@]}" > /tmp/out/ARCHIVED_PATHS.txt
          tar --sort=name --mtime='UTC 2026-08-16' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/out/sui-testnet-v1.77.2-security-source-51d177ad.tar.gz "${paths[@]}"
          find "${paths[@]}" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/out/SOURCE_FILE_SHA256SUMS.txt
          sha256sum /tmp/out/sui-testnet-v1.77.2-security-source-51d177ad.tar.gz > /tmp/out/ARCHIVE_SHA256.txt
          du -h /tmp/out/sui-testnet-v1.77.2-security-source-51d177ad.tar.gz | tee /tmp/out/ARCHIVE_SIZE.txt

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: sui-testnet-v1.77.2-security-source-51d177ad-round10
          path: /tmp/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
