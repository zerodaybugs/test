name: Paxos bridge exact interface discovery

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
    paths:
      - '.github/workflows/paxos-bridge-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      URL_ETH_MAINNET: http://127.0.0.1:8545
      URL_ETH_SEPOLIA: http://127.0.0.1:8545
      URL_INK_MAINNET: http://127.0.0.1:8545
      URL_INK_SEPOLIA: http://127.0.0.1:8545
      URL_ARB_MAINNET: http://127.0.0.1:8545
      URL_ARB_SEPOLIA: http://127.0.0.1:8545
      URL_XLAYER_TESTNET: http://127.0.0.1:8545
      URL_XLAYER_MAINNET: http://127.0.0.1:8545
      GAS_REPORTING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Clone and compile exact cross-chain source
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/cross-chain-contracts.git cc
          cd cc
          git checkout --detach b4a1c2b2537b187e63acf5c717b7d943abb0a75f
          npm ci --no-audit --no-fund
          npx hardhat compile
      - name: Extract interfaces, source bodies and artifact paths
        run: |
          set -euo pipefail
          mkdir -p paxos-results/bridge-discovery
          node <<'JS'
          const fs=require('fs');
          const path=require('path');
          const root='cc';
          function walk(d,out=[]){
            for(const e of fs.readdirSync(d,{withFileTypes:true})){
              const p=path.join(d,e.name);
              if(e.isDirectory()) walk(p,out); else out.push(p);
            }
            return out;
          }
          const files=walk(root);
          const wanted=['PaxosTokenFixture','OFTWrapperFixture','OFTWrapperUpgradeableFixture','OFTWrapper','OFTWrapperUpgradeable','PaxosTokenV2'];
          const artifacts={};
          for(const f of files){
            if(!f.endsWith('.json') || !f.includes('/artifacts/')) continue;
            try{
              const j=JSON.parse(fs.readFileSync(f));
              if(!j.contractName || !wanted.includes(j.contractName) || !Array.isArray(j.abi)) continue;
              artifacts[j.contractName]={
                path:f,
                constructor:j.abi.find(x=>x.type==='constructor')||null,
                functions:j.abi.filter(x=>x.type==='function').map(x=>({
                  name:x.name,
                  stateMutability:x.stateMutability,
                  inputs:x.inputs,
                  outputs:x.outputs
                })),
                events:j.abi.filter(x=>x.type==='event').map(x=>x.name)
              };
            }catch(e){}
          }
          const sourcePaths=[
            'cc/contracts/fixture/PaxosTokenFixture.sol',
            'cc/contracts/fixture/OFTWrapperFixture.sol',
            'cc/contracts/fixture/OFTWrapperUpgradeableFixture.sol',
            'cc/contracts/OFTWrapper.sol',
            'cc/contracts/OFTWrapperUpgradeable.sol'
          ];
          const sources={};
          for(const p of sourcePaths){ if(fs.existsSync(p)) sources[p]=fs.readFileSync(p,'utf8'); }
          const output={commit:'b4a1c2b2537b187e63acf5c717b7d943abb0a75f',artifacts,sources};
          fs.writeFileSync('paxos-results/bridge-discovery/DISCOVERY.json',JSON.stringify(output,null,2));
          fs.writeFileSync('paxos-results/bridge-discovery/ARTIFACT_INDEX.txt',Object.entries(artifacts).map(([k,v])=>`${k}\t${v.path}`).join('\n')+'\n');
          JS
          test -s paxos-results/bridge-discovery/DISCOVERY.json
      - name: Publish discovery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paxos-results/bridge-discovery
          git commit -m 'Publish Paxos bridge exact interface discovery'
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
