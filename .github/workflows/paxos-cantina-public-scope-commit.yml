name: Commit Paxos Cantina public scope snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
    paths:
      - '.github/workflows/paxos-cantina-public-scope-commit.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
      - name: Fetch and extract public page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-research/paxos-cantina-scope
          URL='https://cantina.xyz/bounties/6a6ef71c-383d-4357-85c1-a0d1dbb6659b'
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0 security-research-readonly' "$URL" -o /tmp/page.html
          python - <<'PY'
          from pathlib import Path
          import html, json, re
          raw=Path('/tmp/page.html').read_text(errors='replace')
          text=html.unescape(re.sub(r'<[^>]+>', '\n', raw))
          text=re.sub(r'\n\s*\n+', '\n', text)
          urls=sorted(set(re.findall(r'https://github\.com/paxosglobal/[^"\\s<]+',raw)))
          terms=r'(?i).{0,180}(?:privileged|trusted|admin|known issue|out of scope|scope|mainnet|audit|reward|critical|high|deposit).{0,360}'
          excerpts=[m.group(0) for m in re.finditer(terms,text)][:800]
          out=Path('public-research/paxos-cantina-scope')
          out.joinpath('PUBLIC_TEXT.txt').write_text(text)
          out.joinpath('PUBLIC_EXCERPTS.json').write_text(json.dumps({
            'url':'https://cantina.xyz/bounties/6a6ef71c-383d-4357-85c1-a0d1dbb6659b',
            'html_bytes':len(raw.encode()),
            'github_urls':urls,
            'excerpts':excerpts
          },indent=2))
          PY
          sha256sum public-research/paxos-cantina-scope/* > public-research/paxos-cantina-scope/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-research/paxos-cantina-scope
          git commit -m 'Snapshot public Paxos Cantina scope page' || exit 0
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
