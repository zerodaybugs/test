name: Paxos Cantina public scope snapshot

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public bounty page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cantina.xyz/bounties/6a6ef71c-383d-4357-85c1-a0d1dbb6659b'
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 security-research-readonly' "$URL" -o PAXOS_CANTINA_PUBLIC_PAGE.html
          python - <<'PY'
          from pathlib import Path
          import html, json, re
          raw=Path('PAXOS_CANTINA_PUBLIC_PAGE.html').read_text(errors='replace')
          text=html.unescape(re.sub(r'<[^>]+>', '\n', raw))
          text=re.sub(r'\n\s*\n+', '\n', text)
          Path('PAXOS_CANTINA_PUBLIC_TEXT.txt').write_text(text)
          patterns=[
            r'https://github\.com/paxosglobal/[^"\\s<]+',
            r'(?i).{0,180}(?:privileged|trusted|admin|known issue|out of scope|scope|mainnet|audit|reward|critical|high|deposit).{0,360}',
          ]
          excerpts=[]
          for pattern in patterns:
            for match in re.finditer(pattern, raw if pattern.startswith('https') else text):
              excerpts.append(match.group(0))
              if len(excerpts)>=500: break
          Path('PAXOS_CANTINA_PUBLIC_EXCERPTS.json').write_text(json.dumps({
            'url':'https://cantina.xyz/bounties/6a6ef71c-383d-4357-85c1-a0d1dbb6659b',
            'html_bytes':len(raw.encode()),
            'github_urls':sorted(set(re.findall(patterns[0], raw))),
            'excerpts':excerpts
          },indent=2))
          PY
          sha256sum PAXOS_CANTINA_PUBLIC_PAGE.html PAXOS_CANTINA_PUBLIC_TEXT.txt PAXOS_CANTINA_PUBLIC_EXCERPTS.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-cantina-public-scope-snapshot
          path: |
            PAXOS_CANTINA_PUBLIC_PAGE.html
            PAXOS_CANTINA_PUBLIC_TEXT.txt
            PAXOS_CANTINA_PUBLIC_EXCERPTS.json
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
