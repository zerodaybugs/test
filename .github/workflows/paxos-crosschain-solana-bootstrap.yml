name: Paxos cross-chain and Solana exact-source bootstrap

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      URL_ETH_MAINNET: http://127.0.0.1:8545
      URL_ETH_SEPOLIA: http://127.0.0.1:8545
      URL_INK_MAINNET: http://127.0.0.1:8545
      URL_INK_SEPOLIA: http://127.0.0.1:8545
      URL_ARB_MAINNET: http://127.0.0.1:8545
      URL_ARB_SEPOLIA: http://127.0.0.1:8545
      URL_XLAYER_TESTNET: http://127.0.0.1:8545
      URL_XLAYER_MAINNET: http://127.0.0.1:8545
      GAS_REPORTING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Clone exact public sources
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/cross-chain-contracts.git cross-chain-contracts
          git -C cross-chain-contracts checkout --detach b4a1c2b2537b187e63acf5c717b7d943abb0a75f
          test "$(git -C cross-chain-contracts rev-parse HEAD)" = "b4a1c2b2537b187e63acf5c717b7d943abb0a75f"

          git clone https://github.com/paxosglobal/paxos-token-contracts.git paxos-token-contracts
          git -C paxos-token-contracts checkout --detach 674ac1046a0a40bfd2b6b892192998af9ac3b171
          git -C paxos-token-contracts submodule update --init --recursive
          test "$(git -C paxos-token-contracts rev-parse HEAD)" = "674ac1046a0a40bfd2b6b892192998af9ac3b171"
      - name: Replace inaccessible private token dependency with exact public source
        working-directory: cross-chain-contracts
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.devDependencies.PaxosToken = 'file:../paxos-token-contracts';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          rm -f package-lock.json
      - name: Install dependencies
        working-directory: cross-chain-contracts
        run: npm install --no-audit --no-fund 2>&1 | tee ../CROSSCHAIN_NPM_INSTALL.log
      - name: Compile contracts
        working-directory: cross-chain-contracts
        run: npx hardhat compile --force 2>&1 | tee ../CROSSCHAIN_COMPILE.log
      - name: Record provenance
        run: |
          {
            echo "crosschain_repo=paxosglobal/cross-chain-contracts"
            echo "crosschain_commit=b4a1c2b2537b187e63acf5c717b7d943abb0a75f"
            echo "token_repo=paxosglobal/paxos-token-contracts"
            echo "token_commit=674ac1046a0a40bfd2b6b892192998af9ac3b171"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner=$(uname -a)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee CROSSCHAIN_PROVENANCE.txt
      - name: Package cross-chain offline toolchain
        run: |
          set -euo pipefail
          tar --zstd -cf paxos-crosschain-offline-b4a1c2b.tar.zst \
            cross-chain-contracts paxos-token-contracts \
            CROSSCHAIN_NPM_INSTALL.log CROSSCHAIN_COMPILE.log CROSSCHAIN_PROVENANCE.txt
          sha256sum paxos-crosschain-offline-b4a1c2b.tar.zst > paxos-crosschain-offline-b4a1c2b.tar.zst.sha256
          ls -lh paxos-crosschain-offline-b4a1c2b.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-crosschain-offline-b4a1c2b
          path: |
            paxos-crosschain-offline-b4a1c2b.tar.zst
            paxos-crosschain-offline-b4a1c2b.tar.zst.sha256
          compression-level: 0
          retention-days: 1

  solana:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact Solana source
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/solana-programs.git solana-programs
          git -C solana-programs checkout --detach 90325c53ddb2dc25d924a7f4aaf877eca1ea9f23
          test "$(git -C solana-programs rev-parse HEAD)" = "90325c53ddb2dc25d924a7f4aaf877eca1ea9f23"
      - name: Cargo test workspace
        working-directory: solana-programs
        run: cargo test --workspace --all-targets 2>&1 | tee ../SOLANA_CARGO_TEST.log
      - name: Record toolchain and provenance
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          {
            echo "repo=paxosglobal/solana-programs"
            echo "commit=90325c53ddb2dc25d924a7f4aaf877eca1ea9f23"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "sysroot=$SYSROOT"
            echo "runner=$(uname -a)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee SOLANA_PROVENANCE.txt
          printf '%s\n' "$SYSROOT" > SOLANA_SYSROOT_PATH.txt
      - name: Package portable Rust and Cargo cache
        run: |
          set -euo pipefail
          SYSROOT="$(cat SOLANA_SYSROOT_PATH.txt)"
          mkdir -p portable-rust portable-cargo
          cp -a "$SYSROOT"/. portable-rust/
          cp -a "$HOME/.cargo"/. portable-cargo/
          tar --zstd -cf paxos-solana-offline-90325c5.tar.zst \
            solana-programs portable-rust portable-cargo \
            SOLANA_CARGO_TEST.log SOLANA_PROVENANCE.txt SOLANA_SYSROOT_PATH.txt
          sha256sum paxos-solana-offline-90325c5.tar.zst > paxos-solana-offline-90325c5.tar.zst.sha256
          ls -lh paxos-solana-offline-90325c5.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-solana-offline-90325c5
          path: |
            paxos-solana-offline-90325c5.tar.zst
            paxos-solana-offline-90325c5.tar.zst.sha256
          compression-level: 0
          retention-days: 1
