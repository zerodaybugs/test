name: Paxos cross-chain and Solana exact-source bootstrap

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      URL_ETH_MAINNET: http://127.0.0.1:8545
      URL_ETH_SEPOLIA: http://127.0.0.1:8545
      URL_INK_MAINNET: http://127.0.0.1:8545
      URL_INK_SEPOLIA: http://127.0.0.1:8545
      URL_ARB_MAINNET: http://127.0.0.1:8545
      URL_ARB_SEPOLIA: http://127.0.0.1:8545
      URL_XLAYER_TESTNET: http://127.0.0.1:8545
      URL_XLAYER_MAINNET: http://127.0.0.1:8545
      GAS_REPORTING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Clone exact cross-chain source
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/cross-chain-contracts.git cross-chain-contracts
          cd cross-chain-contracts
          git checkout --detach b4a1c2b2537b187e63acf5c717b7d943abb0a75f
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "b4a1c2b2537b187e63acf5c717b7d943abb0a75f"
      - name: Install dependencies
        id: npm
        working-directory: cross-chain-contracts
        continue-on-error: true
        run: npm ci --no-audit --no-fund 2>&1 | tee ../CROSSCHAIN_NPM_CI.log
      - name: Compile contracts
        id: compile
        working-directory: cross-chain-contracts
        continue-on-error: true
        run: npx hardhat compile --force 2>&1 | tee ../CROSSCHAIN_COMPILE.log
      - name: Record provenance
        run: |
          {
            echo "repo=paxosglobal/cross-chain-contracts"
            echo "commit=b4a1c2b2537b187e63acf5c717b7d943abb0a75f"
            echo "npm_outcome=${{ steps.npm.outcome }}"
            echo "compile_outcome=${{ steps.compile.outcome }}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner=$(uname -a)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee CROSSCHAIN_PROVENANCE.txt
      - name: Package cross-chain toolchain
        run: |
          tar --zstd -cf paxos-crosschain-b4a1c2b-toolchain.tar.zst \
            cross-chain-contracts CROSSCHAIN_NPM_CI.log CROSSCHAIN_COMPILE.log CROSSCHAIN_PROVENANCE.txt
          sha256sum paxos-crosschain-b4a1c2b-toolchain.tar.zst > paxos-crosschain-b4a1c2b-toolchain.tar.zst.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-crosschain-b4a1c2b-toolchain
          path: |
            paxos-crosschain-b4a1c2b-toolchain.tar.zst
            paxos-crosschain-b4a1c2b-toolchain.tar.zst.sha256
          compression-level: 0
          retention-days: 1

  solana:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact Solana source
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/solana-programs.git solana-programs
          cd solana-programs
          git checkout --detach 90325c53ddb2dc25d924a7f4aaf877eca1ea9f23
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "90325c53ddb2dc25d924a7f4aaf877eca1ea9f23"
      - name: Rust versions
        run: |
          rustc --version | tee SOLANA_RUSTC_VERSION.txt
          cargo --version | tee SOLANA_CARGO_VERSION.txt
      - name: Cargo test workspace
        id: test
        working-directory: solana-programs
        continue-on-error: true
        run: cargo test --workspace --all-targets 2>&1 | tee ../SOLANA_CARGO_TEST.log
      - name: Cargo clippy
        id: clippy
        working-directory: solana-programs
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee ../SOLANA_CLIPPY.log
      - name: Record provenance
        run: |
          {
            echo "repo=paxosglobal/solana-programs"
            echo "commit=90325c53ddb2dc25d924a7f4aaf877eca1ea9f23"
            echo "test_outcome=${{ steps.test.outcome }}"
            echo "clippy_outcome=${{ steps.clippy.outcome }}"
            echo "runner=$(uname -a)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee SOLANA_PROVENANCE.txt
      - name: Package Solana toolchain
        run: |
          tar --zstd -cf paxos-solana-90325c5-toolchain.tar.zst \
            solana-programs SOLANA_CARGO_TEST.log SOLANA_CLIPPY.log SOLANA_PROVENANCE.txt SOLANA_RUSTC_VERSION.txt SOLANA_CARGO_VERSION.txt
          sha256sum paxos-solana-90325c5-toolchain.tar.zst > paxos-solana-90325c5-toolchain.tar.zst.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-solana-90325c5-toolchain
          path: |
            paxos-solana-90325c5-toolchain.tar.zst
            paxos-solana-90325c5-toolchain.tar.zst.sha256
          compression-level: 0
          retention-days: 1
