name: Paxos read-only SupplyControl mainnet census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Install read-only client
        run: npm install --no-save --no-audit --no-fund ethers@6.15.0

      - name: Query current mainnet state and recent configuration events
        shell: bash
        run: |
          cat > paxos_supplycontrol_census.mjs <<'NODE'
          import { Contract, Interface, JsonRpcProvider, ZeroAddress, getAddress } from "ethers";
          import { writeFile } from "node:fs/promises";

          const endpoints = [
            "https://ethereum-rpc.publicnode.com",
            "https://eth.llamarpc.com",
            "https://1rpc.io/eth"
          ];

          const tokens = {
            USDG: "0xe343167631d89b6ffc58b88d6b7fb0228795491d",
            PYUSD: "0x6c3ea9036406852006290770bedfcaba0e23a0e8",
            USDP: "0x8e870d67f660d95d5be530380d0ec0bd388289e1"
          };

          const tokenAbi = ["function supplyControl() view returns (address)"];
          const supplyAbi = [
            "function getAllSupplyControllerAddresses() view returns (address[])",
            "function getSupplyControllerConfig(address) view returns ((uint256 limitCapacity,uint256 refillPerSecond) limitConfig,address[] mintAddressWhitelist,bool allowAnyMintAndBurnAddress)",
            "function getRemainingMintAmount(address,uint256) view returns (uint256)",
            "event LimitConfigUpdated(address indexed supplyController,(uint256 limitCapacity,uint256 refillPerSecond) newLimitConfig,(uint256 limitCapacity,uint256 refillPerSecond) oldLimitConfig)",
            "event SupplyControllerAdded(address indexed newSupplyController,uint256 limitCapacity,uint256 refillPerSecond,address[] mintAddressWhitelist,bool allowAnyMintAndBurnAddress)",
            "event SupplyControllerRemoved(address indexed oldSupplyController)"
          ];

          let provider;
          let endpoint;
          for (const candidate of endpoints) {
            try {
              const p = new JsonRpcProvider(candidate, 1, { staticNetwork: true });
              const block = await p.getBlockNumber();
              if (block > 1) {
                provider = p;
                endpoint = candidate;
                break;
              }
            } catch (error) {
              console.error(`RPC failed: ${candidate}: ${error.message}`);
            }
          }
          if (!provider) throw new Error("No public RPC endpoint was available");

          const latestBlockNumber = await provider.getBlockNumber();
          const latestBlock = await provider.getBlock(latestBlockNumber);
          const result = {
            generatedAt: new Date().toISOString(),
            rpcEndpoint: endpoint,
            latestBlockNumber,
            latestTimestamp: latestBlock.timestamp,
            productionStateChangingTransactions: 0,
            tokens: {}
          };

          async function recentLogs(address, iface) {
            const start = Math.max(0, latestBlockNumber - 400_000);
            const chunk = 10_000;
            const topics = [
              iface.getEvent("LimitConfigUpdated").topicHash,
              iface.getEvent("SupplyControllerAdded").topicHash,
              iface.getEvent("SupplyControllerRemoved").topicHash
            ];
            const out = [];
            for (let from = start; from <= latestBlockNumber; from += chunk) {
              const to = Math.min(latestBlockNumber, from + chunk - 1);
              for (const topic0 of topics) {
                try {
                  const logs = await provider.getLogs({ address, fromBlock: from, toBlock: to, topics: [topic0] });
                  for (const log of logs) {
                    const parsed = iface.parseLog(log);
                    const block = await provider.getBlock(log.blockNumber);
                    out.push({
                      event: parsed.name,
                      blockNumber: log.blockNumber,
                      timestamp: block?.timestamp ?? null,
                      transactionHash: log.transactionHash,
                      args: parsed.name === "LimitConfigUpdated" ? {
                        supplyController: parsed.args.supplyController,
                        newLimitCapacity: parsed.args.newLimitConfig.limitCapacity.toString(),
                        newRefillPerSecond: parsed.args.newLimitConfig.refillPerSecond.toString(),
                        oldLimitCapacity: parsed.args.oldLimitConfig.limitCapacity.toString(),
                        oldRefillPerSecond: parsed.args.oldLimitConfig.refillPerSecond.toString()
                      } : parsed.name === "SupplyControllerAdded" ? {
                        supplyController: parsed.args.newSupplyController,
                        limitCapacity: parsed.args.limitCapacity.toString(),
                        refillPerSecond: parsed.args.refillPerSecond.toString(),
                        allowAnyMintAndBurnAddress: parsed.args.allowAnyMintAndBurnAddress
                      } : {
                        supplyController: parsed.args.oldSupplyController
                      }
                    });
                  }
                } catch (error) {
                  out.push({ scanError: `${from}-${to}: ${error.message}` });
                  return out;
                }
              }
            }
            return out.sort((a, b) => (a.blockNumber ?? 0) - (b.blockNumber ?? 0));
          }

          for (const [symbol, tokenAddressRaw] of Object.entries(tokens)) {
            const tokenAddress = getAddress(tokenAddressRaw);
            const token = new Contract(tokenAddress, tokenAbi, provider);
            const tokenEntry = { tokenAddress, errors: [] };
            try {
              const supplyControl = getAddress(await token.supplyControl());
              tokenEntry.supplyControl = supplyControl;
              tokenEntry.supplyControlCodeBytes = (await provider.getCode(supplyControl)).length / 2 - 1;
              if (supplyControl === ZeroAddress) throw new Error("supplyControl is zero");

              const supply = new Contract(supplyControl, supplyAbi, provider);
              const controllers = await supply.getAllSupplyControllerAddresses();
              tokenEntry.controllers = [];
              for (const controllerRaw of controllers) {
                const controller = getAddress(controllerRaw);
                try {
                  const config = await supply.getSupplyControllerConfig(controller);
                  const remaining = await supply.getRemainingMintAmount(controller, latestBlock.timestamp);
                  tokenEntry.controllers.push({
                    address: controller,
                    limitCapacity: config.limitConfig.limitCapacity.toString(),
                    refillPerSecond: config.limitConfig.refillPerSecond.toString(),
                    remainingMintAmount: remaining.toString(),
                    allowAnyMintAndBurnAddress: config.allowAnyMintAndBurnAddress,
                    whitelist: [...config.mintAddressWhitelist]
                  });
                } catch (error) {
                  tokenEntry.controllers.push({ address: controller, error: error.message });
                }
              }
              tokenEntry.recentEvents = await recentLogs(supplyControl, new Interface(supplyAbi));
            } catch (error) {
              tokenEntry.errors.push(error.message);
            }
            result.tokens[symbol] = tokenEntry;
          }

          await writeFile("PAXOS_SUPPLYCONTROL_MAINNET_CENSUS.json", JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          NODE

          node paxos_supplycontrol_census.mjs 2>&1 | tee PAXOS_SUPPLYCONTROL_MAINNET_CENSUS.log
          sha256sum PAXOS_SUPPLYCONTROL_MAINNET_CENSUS.json PAXOS_SUPPLYCONTROL_MAINNET_CENSUS.log > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: paxos-supplycontrol-mainnet-readonly-census
          path: |
            PAXOS_SUPPLYCONTROL_MAINNET_CENSUS.json
            PAXOS_SUPPLYCONTROL_MAINNET_CENSUS.log
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
