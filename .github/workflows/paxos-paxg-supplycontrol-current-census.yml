name: Paxos PAXG SupplyControl current-state census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - run: npm install --no-save --no-audit --no-fund ethers@6.15.0
      - name: Query PAXG SupplyControl state
        shell: bash
        run: |
          cat > paxg_sc_census.mjs <<'NODE'
          import { Contract, JsonRpcProvider, getAddress, id, zeroPadValue } from "ethers";
          import { writeFile } from "node:fs/promises";

          const RPC = "https://ethereum-rpc.publicnode.com";
          const provider = new JsonRpcProvider(RPC, 1, { staticNetwork: true });
          const tokenAddress = getAddress("0x45804880de22913dafe09f4980848ece6ecbaf78");
          const token = new Contract(tokenAddress, ["function supplyControl() view returns(address)"], provider);
          const supplyControlAddress = getAddress(await token.supplyControl());
          const abi = [
            "function getAllSupplyControllerAddresses() view returns(address[])",
            "function getSupplyControllerConfig(address) view returns((uint256 limitCapacity,uint256 refillPerSecond),address[],bool)",
            "function getRemainingMintAmount(address,uint256) view returns(uint256)",
            "function defaultAdmin() view returns(address)",
            "function defaultAdminDelay() view returns(uint48)",
            "function hasRole(bytes32,address) view returns(bool)",
            "function SUPPLY_CONTROLLER_MANAGER_ROLE() view returns(bytes32)",
            "function SUPPLY_CONTROLLER_ROLE() view returns(bytes32)",
            "function TOKEN_CONTRACT_ROLE() view returns(bytes32)"
          ];
          const sc = new Contract(supplyControlAddress, abi, provider);
          const latest = await provider.getBlockNumber();
          const block = await provider.getBlock(latest);
          const ERC1967_IMPL_SLOT = "0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc";
          const implWord = await provider.getStorage(supplyControlAddress, ERC1967_IMPL_SLOT);
          const implementation = implWord === "0x" + "0".repeat(64) ? null : getAddress("0x" + implWord.slice(-40));
          const controllers = await sc.getAllSupplyControllerAddresses();
          const roles = {
            manager: await sc.SUPPLY_CONTROLLER_MANAGER_ROLE(),
            controller: await sc.SUPPLY_CONTROLLER_ROLE(),
            token: await sc.TOKEN_CONTRACT_ROLE()
          };
          const result = {
            generatedAt: new Date().toISOString(),
            rpc: RPC,
            latestBlock: latest,
            latestTimestamp: block.timestamp,
            productionStateChangingTransactions: 0,
            tokenAddress,
            supplyControlAddress,
            implementation,
            proxyCode: await provider.getCode(supplyControlAddress),
            implementationCode: implementation ? await provider.getCode(implementation) : "0x",
            defaultAdmin: await sc.defaultAdmin(),
            defaultAdminDelay: (await sc.defaultAdminDelay()).toString(),
            roles,
            tokenHasTokenRole: await sc.hasRole(roles.token, tokenAddress),
            controllers: []
          };
          for (const raw of controllers) {
            const controller = getAddress(raw);
            try {
              const config = await sc.getSupplyControllerConfig(controller);
              const remaining = await sc.getRemainingMintAmount(controller, block.timestamp);
              const code = await provider.getCode(controller);
              result.controllers.push({
                address: controller,
                codeBytes: code.length / 2 - 1,
                codeHash: id(code),
                hasControllerRole: await sc.hasRole(roles.controller, controller),
                limitCapacity: config[0].limitCapacity.toString(),
                refillPerSecond: config[0].refillPerSecond.toString(),
                remainingMintAmount: remaining.toString(),
                whitelist: [...config[1]].map(getAddress),
                allowAnyMintAndBurnAddress: config[2]
              });
            } catch (error) {
              result.controllers.push({ address: controller, error: error.shortMessage || error.message });
            }
          }
          await writeFile("PAXOS_PAXG_SUPPLYCONTROL_CURRENT_CENSUS.json", JSON.stringify(result, null, 2));
          console.log(JSON.stringify({
            tokenAddress,
            supplyControlAddress,
            implementation,
            defaultAdmin: result.defaultAdmin,
            tokenHasTokenRole: result.tokenHasTokenRole,
            controllers: result.controllers
          }, null, 2));
          NODE
          node paxg_sc_census.mjs 2>&1 | tee PAXOS_PAXG_SUPPLYCONTROL_CURRENT_CENSUS.log
          sha256sum PAXOS_PAXG_SUPPLYCONTROL_CURRENT_CENSUS.json PAXOS_PAXG_SUPPLYCONTROL_CURRENT_CENSUS.log > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-paxg-supplycontrol-current-census
          path: |
            PAXOS_PAXG_SUPPLYCONTROL_CURRENT_CENSUS.json
            PAXOS_PAXG_SUPPLYCONTROL_CURRENT_CENSUS.log
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
