name: Paxos public exact-source toolchain bootstrap

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      URL_ETH_MAINNET: http://127.0.0.1:8545
      URL_ETH_SEPOLIA: http://127.0.0.1:8545
      URL_INK_MAINNET: http://127.0.0.1:8545
      URL_INK_SEPOLIA: http://127.0.0.1:8545
      URL_ARB_MAINNET: http://127.0.0.1:8545
      URL_ARB_SEPOLIA: http://127.0.0.1:8545
      URL_XLAYER_TESTNET: http://127.0.0.1:8545
      URL_XLAYER_MAINNET: http://127.0.0.1:8545
      GAS_REPORTING: 'false'
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Clone exact public Paxos source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/paxos-token-contracts.git paxos-token-contracts
          cd paxos-token-contracts
          git checkout --detach 674ac1046a0a40bfd2b6b892192998af9ac3b171
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "674ac1046a0a40bfd2b6b892192998af9ac3b171"

      - name: Install exact locked dependencies
        working-directory: paxos-token-contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Compile exact upstream source
        working-directory: paxos-token-contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run compile 2>&1 | tee ../BASELINE_COMPILE.log

      - name: Run focused upstream rewards tests
        working-directory: paxos-token-contracts
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat test \
            test/RateBasedMultiplierTest.js \
            test/MultiplierManagementTest.js \
            test/PayoutGroupDeletionTest.js \
            2>&1 | tee ../BASELINE_FOCUSED_TESTS.log

      - name: Record provenance and compiler cache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "paxos_commit=674ac1046a0a40bfd2b6b892192998af9ac3b171"
            echo "runner=$(uname -a)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee TOOLCHAIN_PROVENANCE.txt
          cd paxos-token-contracts
          npm ls --depth=0 --json > ../NPM_LS_DEPTH0.json || true
          cd ..
          test -d "$HOME/.cache/hardhat-nodejs/compilers-v2"
          cp -a "$HOME/.cache/hardhat-nodejs" hardhat-nodejs-cache
          find hardhat-nodejs-cache -maxdepth 3 -type f -printf '%P\n' | sort > HARDHAT_COMPILER_CACHE_FILES.txt

      - name: Package reusable offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -cf paxos-exact-toolchain-674ac104-with-compilers.tar.zst \
            paxos-token-contracts \
            hardhat-nodejs-cache \
            HARDHAT_COMPILER_CACHE_FILES.txt \
            BASELINE_COMPILE.log \
            BASELINE_FOCUSED_TESTS.log \
            TOOLCHAIN_PROVENANCE.txt \
            NPM_LS_DEPTH0.json
          sha256sum paxos-exact-toolchain-674ac104-with-compilers.tar.zst > paxos-exact-toolchain-674ac104-with-compilers.tar.zst.sha256
          ls -lh paxos-exact-toolchain-674ac104-with-compilers.tar.zst

      - name: Upload reusable toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: paxos-exact-toolchain-674ac104-with-compilers
          path: |
            paxos-exact-toolchain-674ac104-with-compilers.tar.zst
            paxos-exact-toolchain-674ac104-with-compilers.tar.zst.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
