name: Paxos R10 interprocedural supply rewards callgraph

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
    paths:
      - '.github/workflows/paxos-r10-callgraph.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  callgraph:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
      - name: Clone exact source
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/paxos-token-contracts.git token
          cd token && git checkout --detach 674ac1046a0a40bfd2b6b892192998af9ac3b171 && cd ..
          mkdir -p r10-callgraph
      - name: Build interprocedural graph
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          funcs={}
          for p in Path('token/contracts').rglob('*.sol'):
              text=p.read_text(errors='replace')
              for m in re.finditer(r'function\s+(\w+)\s*\(([^)]*)\)[^{;]*\{',text,re.S):
                  name=m.group(1); brace=text.find('{',m.start()); depth=0; end=None
                  for i in range(brace,len(text)):
                      if text[i]=='{': depth+=1
                      elif text[i]=='}':
                          depth-=1
                          if depth==0: end=i+1; break
                  if not end: continue
                  body=text[m.start():end]
                  calls=sorted(set(re.findall(r'(?<!function\s)\b([A-Za-z_]\w*)\s*\(',body)))
                  funcs.setdefault(name,[]).append({'file':str(p),'body':body,'calls':calls})
          roots=['increaseSupplyToAddress','decreaseSupplyFromAddress']
          reward_terms=['SharesLib','payoutData','payoutGroup','wallet.shares','balanceData','_setBalanceData','handleClaimAllDetection','updateShares','lastClaimAll']
          balance_terms=['balances[','totalSupply','wallet.balance','balanceData']
          out={}
          for root in roots:
              seen=set(); frontier=[root]; nodes=[]
              for depth in range(8):
                  nxt=[]
                  for name in frontier:
                      if name in seen: continue
                      seen.add(name)
                      for f in funcs.get(name,[]):
                          nodes.append({'depth':depth,'name':name,**f})
                          for c in f['calls']:
                              if c in funcs and c not in seen: nxt.append(c)
                  frontier=nxt
              allbody='\n'.join(x['body'] for x in nodes)
              out[root]={
                'nodes':nodes,
                'reachable_function_names':sorted(seen),
                'reward_accounting_reachable':any(t in allbody for t in reward_terms),
                'balance_write_reachable':any(t in allbody for t in balance_terms),
                'freeze_check_reachable':bool(re.search(r'frozen|_isAddrFrozen|AddressFrozen',allbody,re.I)),
                'pause_check_reachable':bool(re.search(r'whenNotPaused|paused\(',allbody,re.I)),
                'reward_term_hits':[t for t in reward_terms if t in allbody],
              }
          Path('r10-callgraph/CALLGRAPH.json').write_text(json.dumps(out,indent=2))
          decision={
            'increase_reward_accounting_reachable':out['increaseSupplyToAddress']['reward_accounting_reachable'],
            'decrease_reward_accounting_reachable':out['decreaseSupplyFromAddress']['reward_accounting_reachable'],
          }
          decision['technical_status']='KILL_COMMON_REWARD_ACCOUNTING_REACHABLE' if all(decision.values()) else 'STATIC_COMPOSITION_CANDIDATE'
          decision['submit_ready']=False
          decision['critical_supported']=False
          decision['decision']='KILL' if decision['technical_status'].startswith('KILL') else 'HOLD_NEEDS_RUNTIME_POC'
          Path('r10-callgraph/R10_CALLGRAPH_DECISION.json').write_text(json.dumps(decision,indent=2,sort_keys=True))
          PY
          sha256sum r10-callgraph/* > r10-callgraph/SHA256SUMS.txt
          mkdir -p paxos-results/r10-callgraph
          cp r10-callgraph/R10_CALLGRAPH_DECISION.json paxos-results/r10-callgraph/
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paxos-results/r10-callgraph
          git commit -m 'Publish Paxos R10 interprocedural decision'
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-r10-callgraph
          path: r10-callgraph
          retention-days: 1
          if-no-files-found: error
