name: Paxos R7 read-only mainnet binding gate

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - run: npm install --no-save --no-audit --no-fund ethers@6.15.0
      - name: Query exact current state and runtime bytecode
        shell: bash
        run: |
          cat > r7_binding.mjs <<'NODE'
          import { Contract, JsonRpcProvider, getAddress, id, keccak256 } from "ethers";
          import { writeFile } from "node:fs/promises";

          const RPCS = [
            "https://ethereum-rpc.publicnode.com",
            "https://1rpc.io/eth",
            "https://eth.llamarpc.com"
          ];
          const TOKEN = getAddress("0xe343167631d89b6ffc58b88d6b7fb0228795491d");
          const IMPL_SLOT = "0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc";
          const abi = [
            "function getFacet(bytes4) view returns (address)",
            "function getMinAPR() view returns (uint256)",
            "function getMaxAPR() view returns (uint256)",
            "function getClaimSource() view returns (address)",
            "function balanceOf(address) view returns (uint256)",
            "function getAllActiveMultipliers() view returns (uint32[])",
            "function getCurrentAPR(uint32) view returns (uint256)",
            "function getNextAPR(uint32) view returns (uint256)",
            "function getSwitchTime(uint32) view returns (uint256)",
            "function getActiveMultiplier(uint32) view returns (uint256)"
          ];

          let provider, rpc;
          for (const url of RPCS) {
            try {
              const candidate = new JsonRpcProvider(url, 1, { staticNetwork: true });
              const n = await candidate.getBlockNumber();
              if (n > 1) { provider = candidate; rpc = url; break; }
            } catch (error) { console.error(`${url}: ${error.message}`); }
          }
          if (!provider) throw new Error("No RPC available");

          const latestBlock = await provider.getBlockNumber();
          const latest = await provider.getBlock(latestBlock);
          const token = new Contract(TOKEN, abi, provider);
          const selector = id("setMultiplierRateByAPR(uint32,uint256)").slice(0, 10);
          const facet = getAddress(await token.getFacet(selector));
          const rawImplementation = await provider.getStorage(TOKEN, IMPL_SLOT);
          const implementation = getAddress("0x" + rawImplementation.slice(-40));
          const [tokenCode, implementationCode, facetCode] = await Promise.all([
            provider.getCode(TOKEN),
            provider.getCode(implementation),
            provider.getCode(facet)
          ]);
          const claimSource = getAddress(await token.getClaimSource());
          const ids = await token.getAllActiveMultipliers();
          const multipliers = [];
          for (const rawId of ids) {
            const multiplierId = Number(rawId);
            multipliers.push({
              multiplierId,
              currentAPR: (await token.getCurrentAPR(multiplierId)).toString(),
              nextAPR: (await token.getNextAPR(multiplierId)).toString(),
              switchTime: (await token.getSwitchTime(multiplierId)).toString(),
              activeMultiplier: (await token.getActiveMultiplier(multiplierId)).toString()
            });
          }

          const result = {
            generatedAt: new Date().toISOString(),
            productionStateChangingTransactions: 0,
            rpc,
            latestBlock,
            latestTimestamp: latest.timestamp,
            token: TOKEN,
            implementation,
            multiplierFacet: facet,
            selector,
            getMinAPR: (await token.getMinAPR()).toString(),
            getMaxAPR: (await token.getMaxAPR()).toString(),
            claimSource,
            claimSourceBalance: (await token.balanceOf(claimSource)).toString(),
            tokenCodeBytes: (tokenCode.length - 2) / 2,
            implementationCodeBytes: (implementationCode.length - 2) / 2,
            facetCodeBytes: (facetCode.length - 2) / 2,
            tokenCodeHash: keccak256(tokenCode),
            implementationCodeHash: keccak256(implementationCode),
            facetCodeHash: keccak256(facetCode),
            facetCode,
            multipliers
          };
          await writeFile("PAXOS_R7_MAINNET_BINDING.json", JSON.stringify(result, null, 2));
          console.log(JSON.stringify({ ...result, facetCode: `<${result.facetCodeBytes} bytes>` }, null, 2));
          NODE

          node r7_binding.mjs 2>&1 | tee PAXOS_R7_MAINNET_BINDING.log
          sha256sum PAXOS_R7_MAINNET_BINDING.json PAXOS_R7_MAINNET_BINDING.log > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-r7-mainnet-binding
          path: |
            PAXOS_R7_MAINNET_BINDING.json
            PAXOS_R7_MAINNET_BINDING.log
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
