name: Publish Paxos R9 validation result

on:
  workflow_run:
    workflows:
      - Paxos R9 exact-source Solana rate-limit validation
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
      - name: Download exact validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name paxos-r9-exact-validation --dir downloaded
          test -f downloaded/R9_DECISION.json
          test -f downloaded/R9_DECISION.txt
      - name: Publish sanitized decision and census
        run: |
          set -euo pipefail
          mkdir -p paxos-results/r9
          cp downloaded/R9_DECISION.json paxos-results/r9/R9_DECISION.json
          cp downloaded/R9_DECISION.txt paxos-results/r9/R9_DECISION.txt
          cp downloaded/R9_MAINNET_READONLY_CENSUS.json paxos-results/r9/R9_MAINNET_READONLY_CENSUS.json || true
          cp downloaded/PAXOS_R9_EXACT_VALIDATION_2026-08-15.tar.gz.sha256 paxos-results/r9/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paxos-results/r9
          git commit -m "Publish Paxos R9 exact validation result" || exit 0
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
