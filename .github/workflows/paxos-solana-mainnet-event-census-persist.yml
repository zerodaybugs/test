name: Persist Paxos Solana minter read-only event census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: write

jobs:
  events:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - run: npm install --no-save --no-audit --no-fund @solana/web3.js@1.98.4
      - name: Scan public program logs
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/solana-programs.git source
          cd source && git checkout --detach 90325c53ddb2dc25d924a7f4aaf877eca1ea9f23 && cd ..
          mkdir -p evidence
          cat > events.mjs <<'NODE'
          import {Connection,PublicKey} from '@solana/web3.js';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const src=fs.readFileSync('source/programs/minter-controller/src/lib.rs','utf8');
          const m=src.match(/declare_id!\(\s*"([1-9A-HJ-NP-Za-km-z]+)"\s*\)/);if(!m)throw new Error('program id missing');
          const programId=new PublicKey(m[1]);
          const urls=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];
          let c,rpc;for(const u of urls){try{const x=new Connection(u,'confirmed');if(await x.getSlot()>1){c=x;rpc=u;break;}}catch(e){}}
          if(!c)throw new Error('no RPC');
          const disc=n=>crypto.createHash('sha256').update(`event:${n}`).digest().subarray(0,8);
          const names=['MinterAdded','RateLimitUpdated','TokensMinted','WhitelistedAddressAdded','WhitelistedAddressRemoved','AdminTransferStarted','AdminTransferAccepted'];
          const discs=Object.fromEntries(names.map(n=>[n,disc(n)]));
          const pk=(b,o)=>[new PublicKey(b.subarray(o,o+32)).toBase58(),o+32];const u64=(b,o)=>[b.readBigUInt64LE(o),o+8];
          const result={generatedAt:new Date().toISOString(),repositoryCommit:'90325c53ddb2dc25d924a7f4aaf877eca1ea9f23',rpc,programId:programId.toBase58(),productionStateChangingTransactions:0,signatures:[],events:[],errors:[]};
          let before;
          for(let page=0;page<10;page++){
            let sigs;try{sigs=await c.getSignaturesForAddress(programId,{limit:1000,...(before?{before}:{})},'confirmed');}catch(e){result.errors.push(`signatures page ${page}: ${e.message}`);break;}
            if(!sigs.length)break;result.signatures.push(...sigs.map(s=>({signature:s.signature,slot:s.slot,blockTime:s.blockTime,err:s.err})));before=sigs.at(-1).signature;
            for(const s of sigs){let tx;try{tx=await c.getTransaction(s.signature,{commitment:'confirmed',maxSupportedTransactionVersion:0});}catch(e){continue;}
              for(const line of tx?.meta?.logMessages??[]){const prefix='Program data: ';if(!line.startsWith(prefix))continue;let b;try{b=Buffer.from(line.slice(prefix.length),'base64');}catch{continue;}
                for(const [name,d] of Object.entries(discs)){if(b.length<8||!b.subarray(0,8).equals(d))continue;try{let o=8;const e={name,signature:s.signature,slot:s.slot,blockTime:s.blockTime};if(name==='MinterAdded'){[e.minterAuthority,o]=pk(b,o);[e.mintAccount,o]=pk(b,o);[e.admin,o]=pk(b,o);let v;[v,o]=u64(b,o);e.capacity=v.toString();[v,o]=u64(b,o);e.refillPerSecond=v.toString();}else if(name==='RateLimitUpdated'){[e.minterAuthority,o]=pk(b,o);[e.mintAccount,o]=pk(b,o);let v;[v,o]=u64(b,o);e.capacity=v.toString();[v,o]=u64(b,o);e.refillPerSecond=v.toString();}else if(name==='TokensMinted'){[e.minterAuthority,o]=pk(b,o);[e.mintAccount,o]=pk(b,o);let v;[v,o]=u64(b,o);e.amount=v.toString();}else if(name.startsWith('WhitelistedAddress')){[e.minterAuthority,o]=pk(b,o);[e.mintAccount,o]=pk(b,o);[e.toAddress,o]=pk(b,o);}result.events.push(e);}catch(err){result.errors.push(`${name} ${s.signature}: ${err.message}`);}}
              }
            }
            if(sigs.length<1000)break;
          }
          result.events.sort((a,b)=>(a.slot??0)-(b.slot??0));result.rateLimitUpdates=result.events.filter(e=>e.name==='RateLimitUpdated');result.mints=result.events.filter(e=>e.name==='TokensMinted');
          fs.writeFileSync('evidence/PAXOS_SOLANA_MINTER_EVENT_CENSUS.json',JSON.stringify(result,null,2));
          NODE
          node events.mjs
          sha256sum evidence/PAXOS_SOLANA_MINTER_EVENT_CENSUS.json > evidence/PAXOS_SOLANA_MINTER_EVENT_CENSUS.json.sha256
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/PAXOS_SOLANA_MINTER_EVENT_CENSUS.json evidence/PAXOS_SOLANA_MINTER_EVENT_CENSUS.json.sha256
          git commit -m 'Persist Paxos Solana minter event census [skip ci]' || exit 0
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
