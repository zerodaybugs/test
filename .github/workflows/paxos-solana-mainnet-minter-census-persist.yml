name: Persist Paxos Solana minter read-only census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - run: npm install --no-save --no-audit --no-fund @solana/web3.js@1.98.4 bs58@6.0.0
      - name: Produce read-only census
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/solana-programs.git source
          cd source
          git checkout --detach 90325c53ddb2dc25d924a7f4aaf877eca1ea9f23
          cd ..
          mkdir -p evidence
          cat > census.mjs <<'NODE'
          import { Connection, PublicKey } from '@solana/web3.js';
          import bs58 from 'bs58';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const lib = fs.readFileSync('source/programs/minter-controller/src/lib.rs','utf8');
          const m = lib.match(/declare_id!\(\s*"([1-9A-HJ-NP-Za-km-z]+)"\s*\)/);
          if (!m) throw new Error('program ID missing');
          const programId = new PublicKey(m[1]);
          const urls=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];
          let connection,rpc;
          for (const u of urls) { try { const c=new Connection(u,'confirmed'); if(await c.getSlot()>1){connection=c;rpc=u;break;} } catch(e){} }
          if(!connection) throw new Error('no RPC');
          const disc=crypto.createHash('sha256').update('account:Minter').digest().subarray(0,8);
          const readPk=(b,o)=>[new PublicKey(b.subarray(o,o+32)).toBase58(),o+32];
          const readU64=(b,o)=>[b.readBigUInt64LE(o),o+8];
          const decode=(b)=>{let o=8,a,mint,admin,pending,bump,cap,rem,refill,last;[a,o]=readPk(b,o);[mint,o]=readPk(b,o);[admin,o]=readPk(b,o);const tag=b[o++];if(tag===1)[pending,o]=readPk(b,o);else pending=null;bump=b[o++];[cap,o]=readU64(b,o);[rem,o]=readU64(b,o);[refill,o]=readU64(b,o);[last,o]=readU64(b,o);return {minterAuthority:a,mintAccount:mint,admin,pendingAdmin:pending,bump,capacity:cap.toString(),remainingAmount:rem.toString(),refillPerSecond:refill.toString(),lastRefillTime:last.toString(),decodedBytes:o,accountBytes:b.length};};
          const info=await connection.getAccountInfo(programId,'confirmed');
          const result={generatedAt:new Date().toISOString(),repositoryCommit:'90325c53ddb2dc25d924a7f4aaf877eca1ea9f23',rpc,programId:programId.toBase58(),productionStateChangingTransactions:0,programAccount:info?{executable:info.executable,owner:info.owner.toBase58(),lamports:info.lamports,dataLength:info.data.length}:null,minters:[],errors:[]};
          try{const accounts=await connection.getProgramAccounts(programId,{commitment:'confirmed',filters:[{memcmp:{offset:0,bytes:bs58.encode(disc)}}]});for(const {pubkey,account} of accounts){try{result.minters.push({address:pubkey.toBase58(),...decode(account.data)});}catch(e){result.minters.push({address:pubkey.toBase58(),decodeError:e.message,dataLength:account.data.length});}}}catch(e){result.errors.push(e.message);}
          result.minters.sort((x,y)=>x.address.localeCompare(y.address));
          fs.writeFileSync('evidence/PAXOS_SOLANA_MINTER_MAINNET_CENSUS.json',JSON.stringify(result,null,2));
          NODE
          node census.mjs
          sha256sum evidence/PAXOS_SOLANA_MINTER_MAINNET_CENSUS.json > evidence/PAXOS_SOLANA_MINTER_MAINNET_CENSUS.json.sha256
      - name: Commit public census result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/PAXOS_SOLANA_MINTER_MAINNET_CENSUS.json evidence/PAXOS_SOLANA_MINTER_MAINNET_CENSUS.json.sha256
          git commit -m 'Persist Paxos Solana minter read-only census [skip ci]' || exit 0
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
