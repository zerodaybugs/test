name: Paxos Solana read-only minter state census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/solana-programs.git solana-programs
          git -C solana-programs checkout --detach 90325c53ddb2dc25d924a7f4aaf877eca1ea9f23
          test "$(git -C solana-programs rev-parse HEAD)" = "90325c53ddb2dc25d924a7f4aaf877eca1ea9f23"
      - name: Run finalized read-only census
        shell: bash
        run: |
          set -euo pipefail
          cat > census.py <<'PY'
          import base64, csv, hashlib, json, re, struct, time, urllib.request
          from pathlib import Path

          SRC = Path('solana-programs/programs/minter-controller/src/lib.rs').read_text()
          m = re.search(r'declare_id!\(\s*"([1-9A-HJ-NP-Za-km-z]+)"\s*\)', SRC)
          if not m:
              raise SystemExit('declare_id not found')
          program_id = m.group(1)

          endpoints = [
              'https://api.mainnet-beta.solana.com',
              'https://solana-rpc.publicnode.com',
              'https://rpc.ankr.com/solana',
          ]
          endpoint_used = None
          rpc_id = 0
          def rpc(method, params, endpoint=None, timeout=45):
              global rpc_id, endpoint_used
              eps = [endpoint] if endpoint else endpoints
              last = None
              for ep in eps:
                  if not ep:
                      continue
                  rpc_id += 1
                  body = json.dumps({'jsonrpc':'2.0','id':rpc_id,'method':method,'params':params}).encode()
                  req = urllib.request.Request(ep, data=body, headers={'content-type':'application/json','user-agent':'paxos-readonly-census/1.1'})
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          obj = json.loads(r.read())
                      if 'error' in obj:
                          raise RuntimeError(str(obj['error']))
                      endpoint_used = ep
                      return obj['result']
                  except Exception as e:
                      last = e
              raise RuntimeError(f'{method} failed: {last}')

          alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          def b58(data: bytes) -> str:
              n = int.from_bytes(data, 'big')
              out = ''
              while n:
                  n, rem = divmod(n, 58)
                  out = alphabet[rem] + out
              pad = 0
              for x in data:
                  if x == 0:
                      pad += 1
                  else:
                      break
              return '1' * pad + out

          disc = hashlib.sha256(b'account:Minter').digest()[:8]
          accounts = rpc('getProgramAccounts', [program_id, {'encoding':'base64','commitment':'finalized'}])
          rows = []
          for entry in accounts:
              raw = base64.b64decode(entry['account']['data'][0])
              if len(raw) < 8 or raw[:8] != disc:
                  continue
              pos = [8]
              def pk():
                  o = pos[0]; pos[0] += 32; return b58(raw[o:o+32])
              def u8():
                  o = pos[0]; pos[0] += 1; return raw[o]
              def u64():
                  o = pos[0]; pos[0] += 8; return struct.unpack_from('<Q', raw, o)[0]
              minter_authority = pk(); mint_account = pk(); admin = pk()
              tag = u8(); pending_admin = pk() if tag == 1 else None
              bump = u8(); capacity = u64(); remaining = u64(); refill = u64(); last_refill = u64()
              rows.append({
                  'account': entry['pubkey'], 'lamports': entry['account']['lamports'],
                  'minter_authority': minter_authority, 'mint_account': mint_account,
                  'admin': admin, 'pending_admin': pending_admin, 'bump': bump,
                  'capacity': capacity, 'remaining_amount': remaining,
                  'refill_per_second': refill, 'last_refill_time': last_refill,
                  'data_len': len(raw),
              })

          now = int(time.time())
          event_disc = hashlib.sha256(b'event:RateLimitUpdated').digest()[:8]
          signatures = rpc('getSignaturesForAddress', [program_id, {'limit': 300, 'commitment':'finalized'}])
          events = []
          for item in signatures:
              sig = item['signature']
              try:
                  tx = rpc('getTransaction', [sig, {'encoding':'json','commitment':'finalized','maxSupportedTransactionVersion':0}], endpoint=endpoint_used, timeout=30)
              except Exception:
                  continue
              if not tx:
                  continue
              logs = ((tx.get('meta') or {}).get('logMessages') or [])
              for line in logs:
                  if not line.startswith('Program data: '):
                      continue
                  try:
                      data = base64.b64decode(line.split(': ',1)[1])
                  except Exception:
                      continue
                  if not data.startswith(event_disc) or len(data) < 88:
                      continue
                  o = 8
                  ma = b58(data[o:o+32]); o += 32
                  mint = b58(data[o:o+32]); o += 32
                  capacity = struct.unpack_from('<Q', data, o)[0]; o += 8
                  refill = struct.unpack_from('<Q', data, o)[0]
                  events.append({
                      'signature': sig, 'slot': tx.get('slot'), 'block_time': tx.get('blockTime'),
                      'minter_authority': ma, 'mint_account': mint,
                      'capacity': capacity, 'refill_per_second': refill,
                  })

          latest = {}
          for ev in sorted(events, key=lambda x: (x.get('block_time') or 0, x.get('slot') or 0)):
              latest[(ev['minter_authority'], ev['mint_account'])] = ev

          for r in rows:
              ev = latest.get((r['minter_authority'], r['mint_account']))
              r['latest_rate_update_time'] = ev.get('block_time') if ev else None
              r['latest_rate_update_signature'] = ev.get('signature') if ev else None
              r['last_refill_predates_latest_update'] = bool(ev and r['last_refill_time'] < (ev.get('block_time') or 0))
              elapsed = max(0, now - r['last_refill_time'])
              r['elapsed_since_last_refill'] = elapsed
              r['current_amount_under_code'] = min(r['capacity'], r['remaining_amount'] + elapsed * r['refill_per_second'])

          out = {
              'source_commit':'90325c53ddb2dc25d924a7f4aaf877eca1ea9f23',
              'program_id': program_id,
              'rpc_endpoint_used': endpoint_used,
              'read_only': True,
              'production_transactions_sent': 0,
              'program_account_count': len(accounts),
              'minter_account_count': len(rows),
              'signatures_scanned': len(signatures),
              'rate_limit_update_events_found': len(events),
              'generated_at_unix': now,
              'minters': rows,
              'events': events,
          }
          Path('PAXOS_SOLANA_MAINNET_CENSUS.json').write_text(json.dumps(out, indent=2))
          with open('PAXOS_SOLANA_MAINNET_MINTERS.csv','w',newline='') as f:
              fields = list(rows[0].keys()) if rows else ['account']
              w = csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)
          print(json.dumps({k:v for k,v in out.items() if k not in ('minters','events')}, indent=2))
          PY
          python3 census.py
          sha256sum PAXOS_SOLANA_MAINNET_CENSUS.json PAXOS_SOLANA_MAINNET_MINTERS.csv > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-solana-mainnet-state-census
          path: |
            PAXOS_SOLANA_MAINNET_CENSUS.json
            PAXOS_SOLANA_MAINNET_MINTERS.csv
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
