name: Paxos Solana ProgramTest dependency cache

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/programtest-cargo
    steps:
      - uses: actions/checkout@v4
      - name: Create exact dependency manifest
        run: |
          set -euo pipefail
          mkdir -p programtest-prefetch/src
          cat > programtest-prefetch/Cargo.toml <<'TOML'
          [package]
          name = "paxos-solana-programtest-prefetch"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          anchor-lang = "=0.30.1"
          anchor-spl = { version = "=0.30.1", features = ["metadata"] }
          solana-program-test = "=1.18.18"
          solana-sdk = "=1.18.18"
          spl-associated-token-account = "=3.0.4"
          spl-token-2022 = "=3.0.4"
          tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
          TOML
          printf 'fn main() {}\n' > programtest-prefetch/src/main.rs
      - name: Fetch dependency graph
        working-directory: programtest-prefetch
        run: |
          set -euo pipefail
          cargo fetch --locked || cargo fetch
          cargo metadata --format-version=1 > ../PROGRAMTEST_METADATA.json
          cargo tree > ../PROGRAMTEST_TREE.txt
      - name: Record provenance
        run: |
          {
            echo "solana_program_test=1.18.18"
            echo "solana_sdk=1.18.18"
            echo "anchor_lang=0.30.1"
            echo "anchor_spl=0.30.1"
            echo "spl_associated_token_account=3.0.4"
            echo "spl_token_2022=3.0.4"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > PROGRAMTEST_PROVENANCE.txt
      - name: Package cache
        run: |
          set -euo pipefail
          tar --zstd -cf paxos-solana-programtest-cache.tar.zst \
            programtest-cargo programtest-prefetch PROGRAMTEST_METADATA.json PROGRAMTEST_TREE.txt PROGRAMTEST_PROVENANCE.txt
          sha256sum paxos-solana-programtest-cache.tar.zst > paxos-solana-programtest-cache.tar.zst.sha256
          ls -lh paxos-solana-programtest-cache.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-solana-programtest-cache
          path: |
            paxos-solana-programtest-cache.tar.zst
            paxos-solana-programtest-cache.tar.zst.sha256
          compression-level: 0
          retention-days: 1
