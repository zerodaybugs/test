name: Paxos Solana split portable toolchain

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Clone and build exact source
        run: |
          set -euo pipefail
          git clone https://github.com/paxosglobal/solana-programs.git solana-programs
          git -C solana-programs checkout --detach 90325c53ddb2dc25d924a7f4aaf877eca1ea9f23
          test "$(git -C solana-programs rev-parse HEAD)" = "90325c53ddb2dc25d924a7f4aaf877eca1ea9f23"
          cargo test --manifest-path solana-programs/Cargo.toml --workspace --all-targets 2>&1 | tee SOLANA_BASELINE_TEST.log
      - name: Prepare portable parts
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          mkdir -p portable-rust portable-cargo
          cp -a "$SYSROOT"/. portable-rust/
          cp -a "$HOME/.cargo"/. portable-cargo/
          {
            echo "repo=paxosglobal/solana-programs"
            echo "commit=90325c53ddb2dc25d924a7f4aaf877eca1ea9f23"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "runner=$(uname -a)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee SOLANA_SPLIT_PROVENANCE.txt
      - name: Package sysroot
        run: |
          set -euo pipefail
          tar --zstd -cf paxos-solana-rust-sysroot.tar.zst portable-rust SOLANA_SPLIT_PROVENANCE.txt
          sha256sum paxos-solana-rust-sysroot.tar.zst > paxos-solana-rust-sysroot.tar.zst.sha256
          ls -lh paxos-solana-rust-sysroot.tar.zst
      - name: Package cargo cache and source
        run: |
          set -euo pipefail
          tar --zstd -cf paxos-solana-cargo-source.tar.zst portable-cargo solana-programs SOLANA_BASELINE_TEST.log SOLANA_SPLIT_PROVENANCE.txt
          sha256sum paxos-solana-cargo-source.tar.zst > paxos-solana-cargo-source.tar.zst.sha256
          ls -lh paxos-solana-cargo-source.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-solana-rust-sysroot
          path: |
            paxos-solana-rust-sysroot.tar.zst
            paxos-solana-rust-sysroot.tar.zst.sha256
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: paxos-solana-cargo-source
          path: |
            paxos-solana-cargo-source.tar.zst
            paxos-solana-cargo-source.tar.zst.sha256
          compression-level: 0
          retention-days: 1
