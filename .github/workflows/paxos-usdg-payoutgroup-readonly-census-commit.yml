name: Commit Paxos USDG payout-group read-only census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
    paths:
      - '.github/workflows/paxos-usdg-payoutgroup-readonly-census-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      URL_ETH_MAINNET: http://127.0.0.1:8545
      URL_ETH_SEPOLIA: http://127.0.0.1:8545
      URL_INK_MAINNET: http://127.0.0.1:8545
      URL_INK_SEPOLIA: http://127.0.0.1:8545
      URL_ARB_MAINNET: http://127.0.0.1:8545
      URL_ARB_SEPOLIA: http://127.0.0.1:8545
      URL_XLAYER_TESTNET: http://127.0.0.1:8545
      URL_XLAYER_MAINNET: http://127.0.0.1:8545
      GAS_REPORTING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Clone and compile exact source
        run: |
          git clone https://github.com/paxosglobal/paxos-token-contracts.git /tmp/paxos-token-contracts
          cd /tmp/paxos-token-contracts
          git checkout --detach 674ac1046a0a40bfd2b6b892192998af9ac3b171
          git submodule update --init --recursive
          npm ci --no-audit --no-fund
          npm run compile
      - name: Census and commit
        shell: bash
        run: |
          cd /tmp/paxos-token-contracts
          cat > /tmp/census.js <<'NODE'
          const { ethers } = require('ethers');
          const fs=require('fs'),path=require('path');
          const TOKEN='0xe343167631d89b6ffc58b88d6b7fb0228795491d';
          const RPCS=['https://eth.llamarpc.com','https://1rpc.io/eth','https://ethereum-rpc.publicnode.com'];
          function walk(d){let o=[];for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())o=o.concat(walk(p));else if(e.name.endsWith('.json'))o.push(p);}return o;}
          function ser(v){if(typeof v==='bigint')return v.toString();if(Array.isArray(v))return v.map(ser);if(v&&typeof v==='object'){const o={};for(const[k,x]of Object.entries(v))if(!/^\d+$/.test(k))o[k]=ser(x);return Object.keys(o).length?o:v.toString();}return v;}
          (async()=>{let provider,rpc;for(const u of RPCS){try{const p=new ethers.JsonRpcProvider(u,1,{staticNetwork:true});if((await p.getBlockNumber())>1){provider=p;rpc=u;break;}}catch(e){}}if(!provider)throw new Error('no RPC');
          const a=[],seen=new Set();for(const f of walk('artifacts/contracts')){try{const j=JSON.parse(fs.readFileSync(f));for(const x of j.abi||[]){const k=JSON.stringify(x);if(!seen.has(k)){seen.add(k);a.push(x);}}}catch(e){}}
          a.push({type:'function',name:'getFacet',stateMutability:'view',inputs:[{name:'selector',type:'bytes4'}],outputs:[{name:'',type:'address'}]});
          const iface=new ethers.Interface(a),token=new ethers.Contract(TOKEN,a,provider),r={generatedAt:new Date().toISOString(),rpc,latestBlock:await provider.getBlockNumber(),token:TOKEN,productionStateChangingTransactions:0,functions:[],facets:{},zeroArgViews:{},idViews:{},errors:[]};
          const funcs=iface.fragments.filter(x=>x.type==='function'&&/payout|reward|manager|claimer/i.test(x.name));
          for(const f of funcs){const sig=f.format('sighash'),sel=ethers.id(sig).slice(0,10);r.functions.push({name:f.name,signature:sig,selector:sel,stateMutability:f.stateMutability,inputs:f.inputs.map(x=>x.type),outputs:f.outputs.map(x=>x.type)});try{r.facets[sig]=await token.getFacet(sel);}catch(e){r.facets[sig]={error:e.message};}}
          const ids=new Set();const scan=x=>{if(typeof x==='string'&&/^\d+$/.test(x)){const n=BigInt(x);if(n>0n&&n<=0xffffffffn)ids.add(Number(n));}else if(Array.isArray(x))x.forEach(scan);else if(x&&typeof x==='object')Object.values(x).forEach(scan);};
          for(const f of funcs.filter(x=>x.stateMutability==='view'&&x.inputs.length===0)){const sig=f.format('sighash');try{const v=ser(await token.getFunction(sig).staticCall());r.zeroArgViews[sig]=v;scan(v);}catch(e){r.zeroArgViews[sig]={error:e.message};}}
          for(const id of [...ids].slice(0,500)){r.idViews[id]={};for(const f of funcs.filter(x=>x.stateMutability==='view'&&x.inputs.length===1&&/^uint(16|32|64|256)?$/.test(x.inputs[0].type))){const sig=f.format('sighash');try{r.idViews[id][sig]=ser(await token.getFunction(sig).staticCall(id));}catch(e){}}}
          r.candidateIds=[...ids];fs.writeFileSync('/tmp/PAXOS_USDG_PAYOUTGROUP_MAINNET_CENSUS.json',JSON.stringify(r,null,2));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/census.js
          cd "$GITHUB_WORKSPACE"
          mkdir -p public-research/paxos-payoutgroup-census
          cp /tmp/PAXOS_USDG_PAYOUTGROUP_MAINNET_CENSUS.json public-research/paxos-payoutgroup-census/
          sha256sum public-research/paxos-payoutgroup-census/PAXOS_USDG_PAYOUTGROUP_MAINNET_CENSUS.json > public-research/paxos-payoutgroup-census/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-research/paxos-payoutgroup-census
          git commit -m 'Snapshot read-only USDG payout-group mainnet state' || exit 0
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
