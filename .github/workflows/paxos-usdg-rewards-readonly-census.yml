name: Paxos USDG rewards read-only mainnet census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - run: npm install --no-save --no-audit --no-fund ethers@6.15.0
      - name: Query USDG rewards state and rate history
        shell: bash
        run: |
          cat > usdg_rewards_census.mjs <<'NODE'
          import { Contract, Interface, JsonRpcProvider, getAddress, id } from "ethers";
          import { writeFile } from "node:fs/promises";

          const RPCS = [
            "https://eth.llamarpc.com",
            "https://1rpc.io/eth",
            "https://ethereum-rpc.publicnode.com"
          ];
          const TOKEN = getAddress("0xe343167631d89b6ffc58b88d6b7fb0228795491d");
          const IMPL_SLOT = "0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc";

          const abi = [
            "function getFacet(bytes4) view returns (address)",
            "function getAllActiveMultipliers() view returns (uint32[])",
            "function getActiveMultiplier(uint32) view returns (uint256)",
            "function getCurrentAPR(uint32) view returns (uint256)",
            "function getNextAPR(uint32) view returns (uint256)",
            "function getSwitchTime(uint32) view returns (uint256)",
            "function getMaturityPeriod() view returns (uint32)",
            "function getReferenceTime() view returns (uint40)",
            "event MultiplierCreated(uint32 indexed multiplierId,uint256 apr,uint256 timestamp)",
            "event MultiplierRateScheduled(uint32 indexed multiplierId,uint256 newRate,uint256 scheduledTime)",
            "event MultiplierDeleted(uint32 indexed multiplierId)",
            "event FacetUpdate(bytes4 indexed selector,address indexed facet)"
          ];
          const iface = new Interface(abi);
          const selectors = {
            getAllActiveMultipliers: id("getAllActiveMultipliers()").slice(0, 10),
            getActiveMultiplier: id("getActiveMultiplier(uint32)").slice(0, 10),
            getCurrentAPR: id("getCurrentAPR(uint32)").slice(0, 10),
            getNextAPR: id("getNextAPR(uint32)").slice(0, 10),
            getSwitchTime: id("getSwitchTime(uint32)").slice(0, 10),
            setMultiplierRateByAPR: id("setMultiplierRateByAPR(uint32,uint256)").slice(0, 10),
            scheduleNextMultRateByAPR: id("scheduleNextMultRateByAPR(uint32,uint256,uint32)").slice(0, 10),
            setRateBoundsByAPR: id("setRateBoundsByAPR(uint256,uint256)").slice(0, 10),
            getMaturityPeriod: id("getMaturityPeriod()").slice(0, 10),
            getReferenceTime: id("getReferenceTime()").slice(0, 10)
          };

          let provider, rpc;
          for (const url of RPCS) {
            try {
              const p = new JsonRpcProvider(url, 1, { staticNetwork: true });
              if ((await p.getBlockNumber()) > 1) { provider = p; rpc = url; break; }
            } catch (e) { console.error(`RPC ${url}: ${e.message}`); }
          }
          if (!provider) throw new Error("No RPC available");

          const latest = await provider.getBlockNumber();
          const block = await provider.getBlock(latest);
          const token = new Contract(TOKEN, abi, provider);
          const result = {
            generatedAt: new Date().toISOString(),
            rpc,
            latestBlock: latest,
            latestTimestamp: block.timestamp,
            token: TOKEN,
            productionStateChangingTransactions: 0,
            selectors,
            facets: {},
            multipliers: [],
            events: [],
            errors: []
          };

          const rawImpl = await provider.getStorage(TOKEN, IMPL_SLOT);
          result.implementation = rawImpl === "0x" + "0".repeat(64)
            ? null
            : getAddress("0x" + rawImpl.slice(-40));
          result.tokenCode = await provider.getCode(TOKEN);
          result.implementationCode = result.implementation ? await provider.getCode(result.implementation) : "0x";

          for (const [name, selector] of Object.entries(selectors)) {
            try { result.facets[name] = getAddress(await token.getFacet(selector)); }
            catch (e) { result.facets[name] = { error: e.message }; }
          }

          try {
            result.maturityPeriod = Number(await token.getMaturityPeriod());
            result.referenceTime = Number(await token.getReferenceTime());
            const ids = await token.getAllActiveMultipliers();
            for (const rawId of ids) {
              const multiplierId = Number(rawId);
              try {
                result.multipliers.push({
                  multiplierId,
                  activeMultiplier: (await token.getActiveMultiplier(multiplierId)).toString(),
                  currentAPR: (await token.getCurrentAPR(multiplierId)).toString(),
                  nextAPR: (await token.getNextAPR(multiplierId)).toString(),
                  switchTime: (await token.getSwitchTime(multiplierId)).toString()
                });
              } catch (e) {
                result.multipliers.push({ multiplierId, error: e.message });
              }
            }
          } catch (e) { result.errors.push(`state: ${e.message}`); }

          async function getLogsWithFallback(filter) {
            const errors = [];
            for (const url of RPCS) {
              try {
                const p = new JsonRpcProvider(url, 1, { staticNetwork: true });
                return { logs: await p.getLogs(filter), rpc: url };
              } catch (e) { errors.push(`${url}: ${e.message}`); }
            }
            throw new Error(errors.join(" | "));
          }

          const eventNames = ["MultiplierCreated", "MultiplierRateScheduled", "MultiplierDeleted", "FacetUpdate"];
          const start = Math.max(0, latest - 2_000_000);
          const chunk = 20_000;
          for (let fromBlock = start; fromBlock <= latest; fromBlock += chunk) {
            const toBlock = Math.min(latest, fromBlock + chunk - 1);
            for (const name of eventNames) {
              try {
                const { logs, rpc: logRpc } = await getLogsWithFallback({
                  address: TOKEN,
                  fromBlock,
                  toBlock,
                  topics: [iface.getEvent(name).topicHash]
                });
                for (const log of logs) {
                  const parsed = iface.parseLog(log);
                  const entry = {
                    event: parsed.name,
                    blockNumber: log.blockNumber,
                    transactionHash: log.transactionHash,
                    logRpc
                  };
                  if (parsed.name === "MultiplierCreated") entry.args = {
                    multiplierId: Number(parsed.args.multiplierId),
                    apr: parsed.args.apr.toString(),
                    declaredTimestamp: parsed.args.timestamp.toString()
                  };
                  else if (parsed.name === "MultiplierRateScheduled") entry.args = {
                    multiplierId: Number(parsed.args.multiplierId),
                    newRate: parsed.args.newRate.toString(),
                    scheduledTime: parsed.args.scheduledTime.toString()
                  };
                  else if (parsed.name === "MultiplierDeleted") entry.args = {
                    multiplierId: Number(parsed.args.multiplierId)
                  };
                  else entry.args = {
                    selector: parsed.args.selector,
                    facet: parsed.args.facet
                  };
                  result.events.push(entry);
                }
              } catch (e) {
                result.errors.push(`logs ${name} ${fromBlock}-${toBlock}: ${e.message}`);
                fromBlock = latest + 1;
                break;
              }
            }
          }
          result.events.sort((a,b) => a.blockNumber - b.blockNumber);
          const zeroRateEvents = result.events.filter(e => e.event === "MultiplierRateScheduled" && e.args.newRate === "0");
          result.zeroRateEventCount = zeroRateEvents.length;
          result.zeroRateEvents = zeroRateEvents;

          await writeFile("PAXOS_USDG_REWARDS_MAINNET_CENSUS.json", JSON.stringify(result, null, 2));
          console.log(JSON.stringify({
            latestBlock: result.latestBlock,
            implementation: result.implementation,
            facets: result.facets,
            multipliers: result.multipliers,
            eventCount: result.events.length,
            zeroRateEventCount: result.zeroRateEventCount,
            errors: result.errors
          }, null, 2));
          NODE

          node usdg_rewards_census.mjs 2>&1 | tee PAXOS_USDG_REWARDS_MAINNET_CENSUS.log
          sha256sum PAXOS_USDG_REWARDS_MAINNET_CENSUS.json PAXOS_USDG_REWARDS_MAINNET_CENSUS.log > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: paxos-usdg-rewards-mainnet-readonly-census
          path: |
            PAXOS_USDG_REWARDS_MAINNET_CENSUS.json
            PAXOS_USDG_REWARDS_MAINNET_CENSUS.log
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
