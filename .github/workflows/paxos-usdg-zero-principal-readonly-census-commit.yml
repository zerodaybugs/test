name: Commit Paxos USDG zero-principal rewards census

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
    paths:
      - '.github/workflows/paxos-usdg-zero-principal-readonly-census-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      URL_ETH_MAINNET: http://127.0.0.1:8545
      URL_ETH_SEPOLIA: http://127.0.0.1:8545
      URL_INK_MAINNET: http://127.0.0.1:8545
      URL_INK_SEPOLIA: http://127.0.0.1:8545
      URL_ARB_MAINNET: http://127.0.0.1:8545
      URL_ARB_SEPOLIA: http://127.0.0.1:8545
      URL_XLAYER_TESTNET: http://127.0.0.1:8545
      URL_XLAYER_MAINNET: http://127.0.0.1:8545
      GAS_REPORTING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paxos-public-toolchain-bootstrap-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Clone and compile exact source
        run: |
          git clone https://github.com/paxosglobal/paxos-token-contracts.git /tmp/paxos-token-contracts
          cd /tmp/paxos-token-contracts
          git checkout --detach 674ac1046a0a40bfd2b6b892192998af9ac3b171
          git submodule update --init --recursive
          npm ci --no-audit --no-fund
          npm run compile
      - name: Scan public events and current account state
        shell: bash
        run: |
          cd /tmp/paxos-token-contracts
          cat > /tmp/zero_principal_census.js <<'NODE'
          const { ethers }=require('ethers');const fs=require('fs'),path=require('path');
          const TOKEN='0xe343167631d89b6ffc58b88d6b7fb0228795491d';
          const RPCS=['https://eth.llamarpc.com','https://1rpc.io/eth','https://ethereum-rpc.publicnode.com'];
          function walk(d){let o=[];for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())o=o.concat(walk(p));else if(e.name.endsWith('.json'))o.push(p);}return o;}
          function ser(v){if(typeof v==='bigint')return v.toString();if(Array.isArray(v))return v.map(ser);if(v&&typeof v==='object'){const o={};for(const[k,x]of Object.entries(v))if(!/^\d+$/.test(k))o[k]=ser(x);return Object.keys(o).length?o:v.toString();}return v;}
          (async()=>{let provider,rpc;for(const u of RPCS){try{const p=new ethers.JsonRpcProvider(u,1,{staticNetwork:true});if((await p.getBlockNumber())>1){provider=p;rpc=u;break;}}catch(e){}}if(!provider)throw new Error('no RPC');
          const abi=[],seen=new Set();for(const f of walk('artifacts/contracts')){try{const j=JSON.parse(fs.readFileSync(f));for(const x of j.abi||[]){const k=JSON.stringify(x);if(!seen.has(k)){seen.add(k);abi.push(x);}}}catch(e){}}
          const iface=new ethers.Interface(abi),token=new ethers.Contract(TOKEN,abi,provider),latest=await provider.getBlockNumber();
          const events=iface.fragments.filter(x=>x.type==='event'&&/(account|payout|register|deregister|manager|claimer)/i.test(x.name));
          const addresses=new Set(),logsOut=[],errors=[];const start=Math.max(0,latest-2_000_000),chunk=10000;
          async function gl(f,t,topic){let es=[];for(const u of RPCS){try{const p=new ethers.JsonRpcProvider(u,1,{staticNetwork:true});return await p.getLogs({address:TOKEN,fromBlock:f,toBlock:t,topics:[topic]});}catch(e){es.push(e.message)}}throw new Error(es.join(' | '));}
          for(let from=start;from<=latest;from+=chunk){const to=Math.min(latest,from+chunk-1);for(const ev of events){try{for(const l of await gl(from,to,ev.topicHash)){const p=iface.parseLog(l);const args={};for(let i=0;i<ev.inputs.length;i++){const inp=ev.inputs[i],v=p.args[i];args[inp.name||String(i)]=ser(v);if(inp.type==='address'&&v!==ethers.ZeroAddress)addresses.add(ethers.getAddress(v));}logsOut.push({event:ev.name,blockNumber:l.blockNumber,transactionHash:l.transactionHash,args});}}catch(e){errors.push(`${ev.name} ${from}-${to}: ${e.message}`);from=latest+1;break;}}}
          const views=iface.fragments.filter(x=>x.type==='function'&&x.stateMutability==='view'&&x.inputs.length===1&&x.inputs[0].type==='address'&&x.outputs.length>0&&/(balance|reward|share|payout|frozen|account)/i.test(x.name));
          const accounts=[];for(const addr of [...addresses].slice(0,5000)){const state={address:addr,views:{}};for(const f of views){const sig=f.format('sighash');try{state.views[sig]=ser(await token.getFunction(sig).staticCall(addr));}catch(e){}}accounts.push(state);}
          function flatten(v,p='',o={}){if(v&&typeof v==='object'&&!Array.isArray(v)){for(const[k,x]of Object.entries(v))flatten(x,p?`${p}.${k}`:k,o);}else if(Array.isArray(v)){v.forEach((x,i)=>flatten(x,`${p}[${i}]`,o));}else o[p]=v;return o;}
          const candidates=[];for(const a of accounts){const f=flatten(a.views);let balanceZero=false,sharePositive=false,rewardPositive=false,groupPositive=false;for(const[k,v]of Object.entries(f)){let n;try{n=BigInt(v)}catch{continue}if(/balanceof|balance/i.test(k)&&n===0n)balanceZero=true;if(/share/i.test(k)&&n>0n)sharePositive=true;if(/reward/i.test(k)&&n>0n)rewardPositive=true;if(/payoutgroup|groupid/i.test(k)&&n>0n)groupPositive=true;}if(balanceZero&&(sharePositive||rewardPositive)&&groupPositive)candidates.push({address:a.address,views:a.views});}
          const out={generatedAt:new Date().toISOString(),rpc,latestBlock:latest,startBlock:start,productionStateChangingTransactions:0,eventFragments:events.map(x=>x.format()),eventLogCount:logsOut.length,addressCount:addresses.size,queriedAccountCount:accounts.length,candidateCount:candidates.length,candidates,errors};
          fs.writeFileSync('/tmp/PAXOS_USDG_ZERO_PRINCIPAL_MAINNET_CENSUS.json',JSON.stringify(out,null,2));console.log(JSON.stringify({latestBlock:latest,eventLogCount:out.eventLogCount,addressCount:out.addressCount,candidateCount:out.candidateCount,errors:errors.slice(0,5)},null,2));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/zero_principal_census.js
          cd "$GITHUB_WORKSPACE"
          mkdir -p public-research/paxos-zero-principal-census
          cp /tmp/PAXOS_USDG_ZERO_PRINCIPAL_MAINNET_CENSUS.json public-research/paxos-zero-principal-census/
          sha256sum public-research/paxos-zero-principal-census/PAXOS_USDG_ZERO_PRINCIPAL_MAINNET_CENSUS.json > public-research/paxos-zero-principal-census/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-research/paxos-zero-principal-census
          git commit -m 'Snapshot read-only USDG zero-principal reward states' || exit 0
          git push origin HEAD:paxos-public-toolchain-bootstrap-20260815
