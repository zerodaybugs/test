name: peer-enumeration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enumerate configured LayerZero EIDs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          CHAINS={
            'ethereum':{'id':1,'eps':['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://rpc.ankr.com/eth']},
            'scroll':{'id':534352,'eps':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']},
          }
          TELLERS={
            'liquidETH':'0x9AA79C84b79816ab920bBcE20f8f74557B514734',
            'liquidBTC':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353',
            'liquidUSD':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387',
          }
          ID_TO_CHAINS='d1822216'; PEERS='bb0b6a53'; OUTBOUND='51c32a88'; INBOUND='55b56c0c'
          def rq(ep,m,p):
            data=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode()
            r=urllib.request.Request(ep,data=data,method='POST',headers={'content-type':'application/json','user-agent':'peer-enumeration/1.0'})
            with urllib.request.urlopen(r,timeout=30) as f:o=json.loads(f.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          def select(c):
            bad={}
            for ep in c['eps']:
              try:
                if int(rq(ep,'eth_chainId',[]),16)==c['id']:return ep
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def uw(x):return hex(x)[2:].rjust(64,'0')
          def words(x):
            h=x[2:];return [int(h[i:i+64],16) for i in range(0,len(h),64)]
          def batch(ep,calls):
            payload=[]
            for i,(to,data,block) in enumerate(calls):payload.append({'jsonrpc':'2.0','id':i,'method':'eth_call','params':[{'to':to,'data':data},block]})
            req=urllib.request.Request(ep,data=json.dumps(payload).encode(),method='POST',headers={'content-type':'application/json','user-agent':'peer-enumeration/1.0'})
            with urllib.request.urlopen(req,timeout=60) as f:res=json.loads(f.read().decode())
            by={x['id']:x for x in res}
            out=[]
            for i in range(len(calls)):
              x=by[i]
              out.append(x.get('result') if 'result' in x else {'error':x.get('error')})
            return out
          result={'at':int(time.time()),'scan_range':[30000,30600],'chains':{}}
          for cn,c in CHAINS.items():
            ep=select(c); block=rq(ep,'eth_blockNumber',[])
            co={'endpoint':ep,'block':int(block,16),'tellers':{}}
            for name,teller in TELLERS.items():
              eids=list(range(30000,30601))
              calls=[]
              for eid in eids:
                calls.append((teller,'0x'+ID_TO_CHAINS+uw(eid),block))
                calls.append((teller,'0x'+PEERS+uw(eid),block))
                calls.append((teller,'0x'+OUTBOUND+uw(eid),block))
                calls.append((teller,'0x'+INBOUND+uw(eid),block))
              vals=[]
              chunk=120
              for i in range(0,len(calls),chunk):vals.extend(batch(ep,calls[i:i+chunk]))
              found=[]
              for j,eid in enumerate(eids):
                raw=vals[j*4:(j+1)*4]
                if any(isinstance(x,dict) for x in raw):continue
                chainw=words(raw[0]); peer='0x'+raw[1][-64:]; outw=words(raw[2]); inw=words(raw[3])
                nonzero=any(chainw) or int(peer,16)!=0 or any(outw) or any(inw)
                if nonzero:
                  found.append({'eid':eid,'chain_words':chainw,'peer':peer,'outbound_words':outw,'inbound_words':inw})
              co['tellers'][name]=found
            result['chains'][cn]=co
          text=json.dumps(result,indent=2,sort_keys=True)
          print('PEER_SUMMARY')
          for cn,c in result['chains'].items():
            for name,peers in c['tellers'].items():print(cn,name,json.dumps(peers,sort_keys=True))
          open('peer-enumeration.json','w').write(text+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: peer-enumeration
          path: peer-enumeration.json
          retention-days: 1
