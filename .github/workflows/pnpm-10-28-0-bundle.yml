name: pnpm 10.28.0 package bundle

on:
  workflow_dispatch:
  push:
    branches: [ci/pnpm-10-28-0-bundle-20260723]
    paths:
      - '.github/workflows/pnpm-10-28-0-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pnpm-10-28-0-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
      - name: Fetch exact npm package and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          npm pack pnpm@10.28.0 --pack-destination out | tee out/NPM_PACK_OUTPUT.txt
          pkg="$(find out -maxdepth 1 -type f -name 'pnpm-10.28.0.tgz' -print -quit)"
          test -n "$pkg"
          node --version > out/NODE_VERSION.txt
          npm --version > out/NPM_VERSION.txt
          npm view pnpm@10.28.0 dist.integrity dist.shasum --json > out/NPM_REGISTRY_METADATA.json
          tar -tzf "$pkg" > out/FILE_INVENTORY.txt
          sha256sum "$pkg" > out/SHA256SUMS
          printf 'PNPM_PACKAGE_BUNDLE_PASS\n' > out/PASS_MARKERS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-10.28.0-package
          path: out/
          if-no-files-found: error
          retention-days: 14
