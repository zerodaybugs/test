name: Podman static v5.4.2 toolchain bundle

on:
  workflow_dispatch:
  push:
    branches: [ci/podman-static-v5-4-2-20260722]
    paths:
      - '.github/workflows/podman-static-v5-4-2-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/podman-static-v5-4-2-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify signed static distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out unpacked
          version=v5.4.2
          base="https://github.com/mgoltzsche/podman-static/releases/download/${version}"
          curl --fail --location --retry 4 --retry-all-errors \
            "${base}/podman-linux-amd64.tar.gz" \
            -o out/podman-linux-amd64.tar.gz
          curl --fail --location --retry 4 --retry-all-errors \
            "${base}/podman-linux-amd64.tar.gz.asc" \
            -o out/podman-linux-amd64.tar.gz.asc
          gpg --batch --keyserver hkps://keyserver.ubuntu.com \
            --recv-keys 0CCF102C4F95D89E583FF1D4F8B5AF50344BB503
          gpg --batch --verify \
            out/podman-linux-amd64.tar.gz.asc \
            out/podman-linux-amd64.tar.gz \
            2>&1 | tee out/GPG_VERIFY.txt
          tar -xzf out/podman-linux-amd64.tar.gz -C unpacked
          find unpacked -maxdepth 5 -type f -printf '%P\t%s\n' | sort \
            > out/FILE_INVENTORY.txt
          find unpacked -type f -perm -111 -print0 | sort -z | xargs -0 -r file \
            > out/EXECUTABLE_FILE_TYPES.txt
          unpacked/usr/local/bin/podman --version | tee out/PODMAN_VERSION.txt
          grep -F 'podman version 5.4.2' out/PODMAN_VERSION.txt
          sha256sum out/podman-linux-amd64.tar.gz \
            out/podman-linux-amd64.tar.gz.asc \
            > out/DOWNLOAD_SHA256SUMS
          tar --zstd -cf out/podman-static-v5.4.2-unpacked.tar.zst -C unpacked .
          sha256sum out/podman-static-v5.4.2-unpacked.tar.zst \
            > out/UNPACKED_ARCHIVE_SHA256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podman-static-v5.4.2-linux-amd64
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: out/
