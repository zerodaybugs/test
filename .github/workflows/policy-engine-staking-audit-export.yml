name: PolicyEngineStaking public audit export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/policy-engine-staking-audit-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public Optimism source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ethereum-optimism/optimism
          ref: deeb32b3c62d44d6ba3c02c17b9521fde4ff7fb5
          path: upstream
          fetch-depth: 1

      - name: Verify and stage public audit
        shell: bash
        run: |
          set -euo pipefail
          file="upstream/docs/security-reviews/2026_03-PolicyEngineStaking-Cantina.pdf"
          test -s "$file"
          mkdir -p out
          cp "$file" out/
          sha256sum "$file" > out/SHA256SUMS
          pdfinfo "$file" > out/PDFINFO.txt

      - name: Upload public audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: policy-engine-staking-cantina-audit
          path: out/
          if-no-files-found: error
          retention-days: 3
