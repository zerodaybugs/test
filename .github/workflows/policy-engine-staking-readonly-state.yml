name: PolicyEngineStaking read-only OP Mainnet state

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/policy-engine-staking-readonly-state.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RPC_URL: https://mainnet.optimism.io
      STAKING: 0xb5CB7a05DD1311195982A26DFC8222477f9D8179
      OP_TOKEN: 0x4200000000000000000000000000000000000042
    steps:
      - name: Query public state without batching
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, os, subprocess
          rpc = os.environ['RPC_URL']
          staking = os.environ['STAKING']
          token = os.environ['OP_TOKEN']

          def call(method, params, ident):
              body = json.dumps({'jsonrpc':'2.0','id':ident,'method':method,'params':params})
              raw = subprocess.check_output([
                  'curl','--fail-with-body','--silent','--show-error',
                  '-H','Content-Type: application/json','--data-binary',body,rpc
              ], text=True)
              data = json.loads(raw)
              if 'error' in data:
                  raise SystemExit(f'{ident}: {data["error"]}')
              return data['result']

          padded = staking[2:].lower().rjust(64, '0')
          results = {
              'rpc': rpc,
              'block_number': call('eth_blockNumber', [], 'block'),
              'staking_code': call('eth_getCode', [staking, 'latest'], 'code'),
              'op_balance_raw': call('eth_call', [{'to': token, 'data': '0x70a08231' + padded}, 'latest'], 'balanceOf'),
              'op_total_supply_raw': call('eth_call', [{'to': token, 'data': '0x18160ddd'}, 'latest'], 'totalSupply'),
              'paused_raw': call('eth_call', [{'to': staking, 'data': '0x5c975abb'}, 'latest'], 'paused'),
              'owner_raw': call('eth_call', [{'to': staking, 'data': '0x8da5cb5b'}, 'latest'], 'owner'),
          }
          results['block_number_int'] = int(results['block_number'], 16)
          results['op_balance_wei'] = int(results['op_balance_raw'], 16)
          results['op_total_supply_wei'] = int(results['op_total_supply_raw'], 16)
          results['op_balance_tokens'] = str(results['op_balance_wei'] / 10**18)
          results['op_total_supply_tokens'] = str(results['op_total_supply_wei'] / 10**18)
          results['paused'] = bool(int(results['paused_raw'], 16))
          results['owner'] = '0x' + results['owner_raw'][-40:]
          # Avoid storing hundreds of kilobytes of bytecode in the normalized report.
          results['staking_code_bytes'] = (len(results.pop('staking_code')) - 2) // 2
          with open('out/state.json','w') as f:
              json.dump(results, f, indent=2, sort_keys=True)
              f.write('\n')
          print(json.dumps(results, indent=2, sort_keys=True))
          PY
          sha256sum out/state.json > out/SHA256SUMS

      - name: Upload read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: policy-engine-staking-mainnet-state
          path: out/
          if-no-files-found: error
          retention-days: 3
