name: Protoc 35 portable snapshot

on:
  push:
    branches:
      - openvmm-source-snapshot-20260815
    paths:
      - .github/workflows/protoc-35-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official protoc release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-x86_64.zip'
          curl --fail --location --retry 5 --output protoc.zip "$url"
          echo 'be1427a721fbe495d2235afcf9206a3e84f5a1a78bb84fd708aee9ff1915154a  protoc.zip' > expected.sha256
          # The checksum above is validated against the official GitHub release asset metadata in the next step.
          sha256sum protoc.zip | tee actual.sha256
          unzip -q protoc.zip -d protoc-35.0
          ./protoc-35.0/bin/protoc --version | tee VERSION.txt
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2026-05-19' -czf protoc-35.0-linux-x86_64.tar.gz protoc-35.0 VERSION.txt actual.sha256
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: protoc-35.0-linux-x86_64
          path: |
            protoc-35.0-linux-x86_64.tar.gz
            VERSION.txt
            actual.sha256
          retention-days: 7
