name: Public Actions Healthcheck 20260722

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-actions-healthcheck-20260722.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner and outbound access
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          curl --fail --silent --show-error --max-time 20 https://api.github.com/meta >/tmp/meta.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/meta.json'))
          assert 'hooks' in data
          print('PUBLIC_ACTIONS_HEALTHCHECK_PASS')
          PY
