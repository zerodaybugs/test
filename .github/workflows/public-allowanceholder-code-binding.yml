name: Record public AllowanceHolder code binding

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-allowanceholder-code-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Compare independent RPC runtime hashes with exact local build hash
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/code-binding"
          mkdir -p "$OUT"
          ADDRESS=0x0000000000001fF3684f28c67538d4D072C22734
          EXPECTED=0x99f5e8edaceacfdd183eb5f1da8a7757b322495b80cf7928db289a1b1a09f799
          cat > "$OUT/rpcs.tsv" <<'EOF'
          publicnode	https://ethereum-rpc.publicnode.com
          drpc	https://eth.drpc.org
          llama	https://eth.llamarpc.com
          EOF
          printf 'rpc\tchain_id\thead\tcodehash\tcode_bytes\texpected_match\n' > "$OUT/results.tsv"
          matches=0
          while IFS=$'\t' read -r name rpc; do
            chain=$(cast chain-id --rpc-url "$rpc" 2>/dev/null || true)
            head=$(cast block-number --rpc-url "$rpc" 2>/dev/null || true)
            code=$(cast code "$ADDRESS" --rpc-url "$rpc" 2>/dev/null || true)
            if [ -z "$code" ] || [ "$code" = 0x ]; then
              printf '%s\t%s\t%s\t\t0\tfalse\n' "$name" "$chain" "$head" >> "$OUT/results.tsv"
              continue
            fi
            hash=$(cast keccak "$code")
            bytes=$(( (${#code} - 2) / 2 ))
            ok=false
            if [ "${hash,,}" = "${EXPECTED,,}" ]; then ok=true; matches=$((matches+1)); fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$chain" "$head" "$hash" "$bytes" "$ok" >> "$OUT/results.tsv"
            printf '%s\n' "$code" > "$OUT/$name-code.hex"
          done < "$OUT/rpcs.tsv"
          printf 'address=%s\nexpected_runtime_hash=%s\nmatching_rpc_count=%s\n' "$ADDRESS" "$EXPECTED" "$matches" > "$OUT/summary.txt"
          test "$matches" -ge 2
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
      - name: Upload code binding
        uses: actions/upload-artifact@v4
        with:
          name: public-allowanceholder-code-binding-${{ github.run_id }}
          path: code-binding/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
