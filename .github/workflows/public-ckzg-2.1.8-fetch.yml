name: Public C-KZG 2.1.8 dependency fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-ckzg-2.1.8-fetch.yml'
      - '.tooling/ckzg-2.1.8-fetch/**'

permissions:
  contents: read

jobs:
  fetch-public-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch and verify the official CPython 3.13 Linux wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          wheel='ckzg-2.1.8-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl'
          url='https://files.pythonhosted.org/packages/b2/17/dc58a11e582de7906305690801b62faf1b18667521ce6439831472c7bdf8/ckzg-2.1.8-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl'
          expected='1f27d7d16be9debf173369248ff06e97fc45826bfb0a743519b49b38539ab6c7'

          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 \
            "$url" -o "artifact/$wheel"
          actual="$(sha256sum "artifact/$wheel" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" "$wheel" > artifact/WHEEL_SHA256.txt
          printf '%s\n' "$url" > artifact/WHEEL_SOURCE_URL.txt

      - name: Fetch the exact official C-KZG source tag and trusted setup
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch v2.1.8 \
            https://github.com/ethereum/c-kzg-4844.git ckzg-src
          (
            cd ckzg-src
            git describe --tags --exact-match HEAD | grep -Fx 'v2.1.8'
            git rev-parse HEAD > ../artifact/C_KZG_COMMIT.txt
            git describe --tags --exact-match HEAD > ../artifact/C_KZG_TAG.txt
          )
          cp ckzg-src/src/trusted_setup.txt artifact/trusted_setup.txt
          cp ckzg-src/bindings/python/tests.py artifact/upstream_python_tests.py
          sha256sum artifact/trusted_setup.txt artifact/upstream_python_tests.py \
            > artifact/UPSTREAM_FILES_SHA256.txt

      - name: Record provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 --version > artifact/RUNNER_PYTHON.txt
          cat > artifact/PROVENANCE.txt <<'EOF'
          Public, unmodified dependencies only.
          Wheel publisher: Ethereum Foundation via PyPI.
          Source repository: ethereum/c-kzg-4844, exact tag v2.1.8.
          No private research code, test vector, finding, or credential is present.
          EOF
          (
            cd artifact
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload public dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: public-ckzg-2.1.8-cp313-linux
          path: artifact/
          if-no-files-found: error
          retention-days: 1
