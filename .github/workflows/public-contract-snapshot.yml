name: Public contract snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-contract-snapshot.yml'
      - 'public-data/contract-snapshot-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect public read-only data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract-snapshot
          DEP='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D'
          API='https://api.hiro.so'
          curl --fail --location --retry 5 "$API/extended/v1/address/$DEP.reserve-hbtc-v1/balances" -o /tmp/contract-snapshot/reserve-balances.json
          curl --fail --location --retry 5 "$API/extended/v1/address/$DEP.vault-hbtc-v1/balances" -o /tmp/contract-snapshot/vault-balances.json
          for offset in 0 50 100 150 200 250 300 350 400 450; do
            curl --fail --location --retry 5 "$API/extended/v1/address/$DEP.controller-hbtc-v1/transactions?limit=50&offset=$offset" -o "/tmp/contract-snapshot/controller-$offset.json"
          done
          call_read() {
            local contract="$1" fn="$2" out="$3"
            curl --fail --location --retry 5 -X POST \
              -H 'content-type: application/json' \
              -d "{\"sender\":\"$DEP\",\"arguments\":[]}" \
              "$API/v2/contracts/call-read/$DEP/$contract/$fn" -o "/tmp/contract-snapshot/$out.json"
          }
          call_read state-hbtc-v1 get-total-assets total-assets
          call_read state-hbtc-v1 get-net-assets net-assets
          call_read state-hbtc-v1 get-share-price share-price
          call_read state-hbtc-v1 get-max-reward max-reward
          call_read state-hbtc-v1 get-update-window update-window
          call_read state-hbtc-v1 get-last-log-ts last-log-ts
          call_read state-hbtc-v1 get-deposit-cap deposit-cap
          call_read token-hbtc get-total-supply total-supply
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/contract-snapshot')
          rows=[]
          for p in sorted(root.glob('controller-*.json')):
            d=json.loads(p.read_text())
            rows.extend(d.get('results',[]))
          calls=[]
          for t in rows:
            cc=t.get('contract_call') or {}
            if cc.get('function_name')!='log-reward': continue
            calls.append({
              'tx_id':t.get('tx_id'), 'status':t.get('tx_status'),
              'block_height':t.get('block_height'), 'burn_block_time_iso':t.get('burn_block_time_iso'),
              'sender':t.get('sender_address'),
              'args':[{a.get('name',''):a.get('repr')} for a in cc.get('function_args',[])],
              'result':(t.get('tx_result') or {}).get('repr')
            })
          def load(n): return json.loads(root.joinpath(n+'.json').read_text())
          out={
            'generated_at':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
            'read_only':{n:load(n) for n in ['total-assets','net-assets','share-price','max-reward','update-window','last-log-ts','deposit-cap','total-supply']},
            'reserve_balances':load('reserve-balances'),
            'vault_balances':load('vault-balances'),
            'controller_log_reward_calls':calls,
            'controller_log_reward_count':len(calls)
          }
          root.joinpath('snapshot.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({'log_rewards':len(calls)},indent=2))
          PY
          sha256sum /tmp/contract-snapshot/* > /tmp/contract-snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-contract-snapshot
          path: /tmp/contract-snapshot
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
