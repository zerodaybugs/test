name: Public EVM Balance Snapshot

on:
  push:
    branches:
      - public-evm-balance-snapshot-20260722
    paths:
      - "tools/public_evm_snapshot.py"
      - ".github/workflows/public-evm-balance-snapshot.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/public_evm_snapshot.py"
      - ".github/workflows/public-evm-balance-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only snapshot
        run: |
          set -euo pipefail
          mkdir -p snapshot-output
          python3 tools/public_evm_snapshot.py | tee snapshot-output/summary.txt
      - name: Hash evidence
        if: always()
        run: |
          set -euo pipefail
          find snapshot-output -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > snapshot-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-evm-balance-snapshot-${{ github.run_id }}
          path: snapshot-output/
          if-no-files-found: warn
          retention-days: 7
