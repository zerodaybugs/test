name: public-evm-bytecode-export

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/public-evm-bytecode-export.yml'
      - 'public-evm-bytecode-trigger.txt'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Export public runtime bytecode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bytecode-output/code
          rpcs=(
            'https://bsc-testnet-rpc.publicnode.com'
            'https://data-seed-prebsc-1-s1.bnbchain.org:8545'
            'https://data-seed-prebsc-2-s1.bnbchain.org:8545'
            'https://bsc-testnet.public.blastapi.io'
            'https://bsc-testnet.drpc.org'
          )
          RPC=''
          for candidate in "${rpcs[@]}"; do
            if id=$(cast chain-id --rpc-url "$candidate" 2>/dev/null) && [ "$id" = '97' ]; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"
          cat > bytecode-output/addresses.txt <<'EOF'
          TCGVaultToken 0xba9e4d6b0b8c3bb13b28a3b3a2f09012674ed5c0
          TCGNexusToken 0xb11426b649404ef2df7f8f7acf3de3aa00e3ed60
          TCGVaultBuyRouter 0x3d5c49910f32ed78dc83141fabf1033d7b5e52e2
          TCGVaultStakingVault 0x8d2478b2901036a4a0f88c4dfe6b6075e02d197a
          TCGVaultBasicNFT 0xe901ec321c5aa78f080bf99cc31e7b83c7a0fd0d
          TCGVaultFounderNFT 0xb8a75c065556c95f7ce86eaefdce849afa8e6324
          TCGVaultInitialLaunch 0x411db8fa3638976b6802e76bb0789014eed4c1e9
          TCGVaultLiquidityWrapper 0xfdc1b93a80b56efd66dda8c82f1f5f70f3fa1178
          TCGRToken 0xd9be1afabdcc07faed8f64d9dbfe56459085bb0d
          TCGRToTCGVConverter 0xe150b30181d455c8a47a27dbebb1de41ec6d8d97
          MockUSDC 0xc6ace01ffc5b8925d5f4c2d427481f8612b4ca1b
          Pair 0xe7ebfbf0cadad62b03935b87ddf4bf570e9594e5
          EOF
          while read -r name address; do
            cast code "$address" --rpc-url "$RPC" > "bytecode-output/code/${name}.hex"
          done < bytecode-output/addresses.txt
          printf 'rpc=%s\nchain_id=%s\nblock=%s\n' "$RPC" "$(cast chain-id --rpc-url "$RPC")" "$(cast block-number --rpc-url "$RPC")" > bytecode-output/environment.txt
          sha256sum bytecode-output/code/*.hex | sort > bytecode-output/SHA256SUMS.txt
      - name: Upload bytecode
        uses: actions/upload-artifact@v4
        with:
          name: public-evm-bytecode-export
          path: bytecode-output/
          if-no-files-found: error
          retention-days: 1
