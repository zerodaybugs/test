name: Public EVM Snapshot 20260722

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-evm-snapshot-20260722.yml"
      - "tools/evm_public_snapshot_20260722.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only decoder dependencies
        run: |
          python -m pip install --disable-pip-version-check requests eth-abi eth-utils

      - name: Fetch and analyze public EVM data
        env:
          SNAPSHOT_OUT: snapshot-output
        run: |
          set -euo pipefail
          python tools/evm_public_snapshot_20260722.py \
            > snapshot.stdout.log \
            2> snapshot.stderr.log
          test -s snapshot-output/derived/summary.json
          python -m json.tool snapshot-output/derived/summary.json >/dev/null

      - name: Archive snapshot
        if: always()
        run: |
          set -euo pipefail
          tar -czf public-evm-snapshot.tgz snapshot-output snapshot.stdout.log snapshot.stderr.log
          sha256sum public-evm-snapshot.tgz > public-evm-snapshot.tgz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-evm-snapshot-${{ github.run_id }}
          path: |
            public-evm-snapshot.tgz
            public-evm-snapshot.tgz.sha256
            snapshot.stdout.log
            snapshot.stderr.log
            snapshot-output
          if-no-files-found: error
          retention-days: 7
