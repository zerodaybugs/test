name: public-evm-state-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/public-evm-state-inventory.yml'
      - 'public-evm-state-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Read public BSC testnet state
        shell: bash
        env:
          TCGV: '0xba9e4d6b0b8c3bb13b28a3b3a2f09012674ed5c0'
          NEXUS: '0xb11426b649404ef2df7f8f7acf3de3aa00e3ed60'
          BUY_ROUTER: '0x3d5c49910f32ed78dc83141fabf1033d7b5e52e2'
          STAKING: '0x8d2478b2901036a4a0f88c4dfe6b6075e02d197a'
          BASIC_NFT: '0xe901ec321c5aa78f080bf99cc31e7b83c7a0fd0d'
          FOUNDER_NFT: '0xb8a75c065556c95f7ce86eaefdce849afa8e6324'
          INITIAL_LAUNCH: '0x411db8fa3638976b6802e76bb0789014eed4c1e9'
          WRAPPER: '0xfdc1b93a80b56efd66dda8c82f1f5f70f3fa1178'
          TCGR: '0xd9be1afabdcc07faed8f64d9dbfe56459085bb0d'
          CONVERTER: '0xe150b30181d455c8a47a27dbebb1de41ec6d8d97'
          USDC: '0xc6ace01ffc5b8925d5f4c2d427481f8612b4ca1b'
          PAIR: '0xe7ebfbf0cadad62b03935b87ddf4bf570e9594e5'
        run: |
          set -euo pipefail
          mkdir -p state-output
          rpcs=(
            'https://bsc-testnet-rpc.publicnode.com'
            'https://data-seed-prebsc-1-s1.bnbchain.org:8545'
            'https://data-seed-prebsc-2-s1.bnbchain.org:8545'
            'https://bsc-testnet.public.blastapi.io'
            'https://bsc-testnet.drpc.org'
          )
          RPC=''
          for candidate in "${rpcs[@]}"; do
            if id=$(cast chain-id --rpc-url "$candidate" 2>/dev/null) && [ "$id" = '97' ]; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"

          call() {
            local label="$1" address="$2" signature="$3"
            shift 3
            local value
            if value=$(cast call "$address" "$signature" "$@" --rpc-url "$RPC" 2>&1); then
              printf '%s=%s\n' "$label" "$value" | tee -a state-output/state.txt
            else
              printf '%s=ERROR:%s\n' "$label" "$value" | tee -a state-output/state.txt
            fi
          }

          printf 'rpc=%s\nchain_id=%s\nblock=%s\n' "$RPC" "$(cast chain-id --rpc-url "$RPC")" "$(cast block-number --rpc-url "$RPC")" > state-output/state.txt
          for pair in \
            "TCGV:$TCGV" "NEXUS:$NEXUS" "BUY_ROUTER:$BUY_ROUTER" "STAKING:$STAKING" \
            "BASIC_NFT:$BASIC_NFT" "FOUNDER_NFT:$FOUNDER_NFT" "INITIAL_LAUNCH:$INITIAL_LAUNCH" \
            "WRAPPER:$WRAPPER" "TCGR:$TCGR" "CONVERTER:$CONVERTER" "USDC:$USDC" "PAIR:$PAIR"; do
            label=${pair%%:*}; address=${pair#*:}
            code=$(cast code "$address" --rpc-url "$RPC")
            printf '%s_code_bytes=%s\n%s_codehash=%s\n' "$label" "$(( (${#code} - 2) / 2 ))" "$label" "$(cast keccak "$code")" >> state-output/state.txt
          done

          call USDC_name "$USDC" 'name()(string)'
          call USDC_symbol "$USDC" 'symbol()(string)'
          call USDC_decimals "$USDC" 'decimals()(uint8)'
          call USDC_totalSupply "$USDC" 'totalSupply()(uint256)'

          call PAIR_token0 "$PAIR" 'token0()(address)'
          call PAIR_token1 "$PAIR" 'token1()(address)'
          call PAIR_reserves "$PAIR" 'getReserves()(uint112,uint112,uint32)'
          call PAIR_lpSupply "$PAIR" 'totalSupply()(uint256)'
          call PAIR_tcgvBalance "$TCGV" 'balanceOf(address)(uint256)' "$PAIR"
          call PAIR_usdcBalance "$USDC" 'balanceOf(address)(uint256)' "$PAIR"

          call CONVERTER_ratio "$CONVERTER" 'ratio()(uint256)'
          call CONVERTER_tcgr "$CONVERTER" 'tcgr()(address)'
          call CONVERTER_tcgv "$CONVERTER" 'tcgv()(address)'
          call CONVERTER_tcgvBalance "$TCGV" 'balanceOf(address)(uint256)' "$CONVERTER"

          call TCGR_minter "$TCGR" 'minter()(address)'
          call TCGR_converter "$TCGR" 'converter()(address)'
          call TCGR_qualifyingNft "$TCGR" 'qualifyingNft()(address)'
          call TCGR_totalSupply "$TCGR" 'totalSupply()(uint256)'

          call TCGV_nexus "$TCGV" 'nexusToken()(address)'
          call TCGV_staking "$TCGV" 'stakingVault()(address)'
          call TCGV_launch "$TCGV" 'initialLaunch()(address)'
          call TCGV_buyRouter "$TCGV" 'buyRouter()(address)'
          call TCGV_totalSupply "$TCGV" 'totalSupply()(uint256)'
          call TCGV_presaleActive "$TCGV" 'presaleActive()(bool)'
          call TCGV_supplyRecomputed "$TCGV" 'supplyRecomputed()(bool)'
          call TCGV_pairRegistered "$TCGV" 'isPair(address)(bool)' "$PAIR"
          call TCGV_buyRouterExcluded "$TCGV" 'isExcludedFromFees(address)(bool)' "$BUY_ROUTER"
          call TCGV_stakingExcluded "$TCGV" 'isExcludedFromFees(address)(bool)' "$STAKING"
          call TCGV_wrapperExcluded "$TCGV" 'isExcludedFromFees(address)(bool)' "$WRAPPER"
          call TCGV_vault "$TCGV" 'vaultAddress()(address)'
          call TCGV_marketing "$TCGV" 'marketingAddress()(address)'
          call TCGV_community "$TCGV" 'communityAddress()(address)'

          call NEXUS_minter "$NEXUS" 'minter()(address)'
          call NEXUS_founder "$NEXUS" 'founderNFTPresaleBonus()(address)'
          call NEXUS_launch "$NEXUS" 'initialLaunchPresaleBonus()(address)'
          call NEXUS_totalSupply "$NEXUS" 'totalSupply()(uint256)'

          call BUY_router "$BUY_ROUTER" 'router()(address)'
          call BUY_factory "$BUY_ROUTER" 'factory()(address)'
          call BUY_tcgv "$BUY_ROUTER" 'tcgv()(address)'
          call BUY_usdc "$BUY_ROUTER" 'usdc()(address)'
          call BUY_referral "$BUY_ROUTER" 'referralToken()(address)'
          call BUY_buyVaultBp "$BUY_ROUTER" 'buyVaultBp()(uint256)'
          call BUY_buyMarketingBp "$BUY_ROUTER" 'buyMarketingBp()(uint256)'
          call BUY_buyCommunityBp "$BUY_ROUTER" 'buyCommunityBp()(uint256)'
          call BUY_sellTaxBp "$BUY_ROUTER" 'sellTaxBp()(uint256)'

          call STAKING_asset "$STAKING" 'asset()(address)'
          call STAKING_basicNft "$STAKING" 'basicNFTContract()(address)'
          call STAKING_pricingRouter "$STAKING" 'basicNFTPricingRouter()(address)'
          call STAKING_pricingUsdc "$STAKING" 'basicNFTPricingUsdc()(address)'
          call STAKING_required "$STAKING" 'requiredStakeForBasicNFT()(uint256)'
          call STAKING_totalAssets "$STAKING" 'totalAssets()(uint256)'
          call STAKING_totalSupply "$STAKING" 'totalSupply()(uint256)'
          call STAKING_anchor "$STAKING" 'basicNFTPricingTwapAnchor()(uint32,uint256)'

          call BASIC_staking "$BASIC_NFT" 'stakingVault()(address)'
          call BASIC_totalSupply "$BASIC_NFT" 'totalSupply()(uint256)'
          call BASIC_totalMinted "$BASIC_NFT" 'totalMinted()(uint256)'
          call BASIC_required "$BASIC_NFT" 'requiredStake()(uint256)'

          call FOUNDER_usdc "$FOUNDER_NFT" 'usdc()(address)'
          call FOUNDER_nexus "$FOUNDER_NFT" 'nexusToken()(address)'
          call FOUNDER_sold "$FOUNDER_NFT" 'soldCount()(uint256)'
          call FOUNDER_wave "$FOUNDER_NFT" 'currentWave()(uint256)'
          call FOUNDER_price "$FOUNDER_NFT" 'currentPrice()(uint256)'
          call FOUNDER_wave2Start "$FOUNDER_NFT" 'wave2StartTimestamp()(uint256)'

          call LAUNCH_tcgv "$INITIAL_LAUNCH" 'tcgv()(address)'
          call LAUNCH_usdc "$INITIAL_LAUNCH" 'usdc()(address)'
          call LAUNCH_founder "$INITIAL_LAUNCH" 'founderNFT()(address)'
          call LAUNCH_nexus "$INITIAL_LAUNCH" 'nexusToken()(address)'
          call LAUNCH_allocated "$INITIAL_LAUNCH" 'totalTCGVAllocated()(uint256)'
          call LAUNCH_tge "$INITIAL_LAUNCH" 'tgeTimestamp()(uint256)'
          call LAUNCH_price "$INITIAL_LAUNCH" 'currentPrice()(uint256)'
          call LAUNCH_end "$INITIAL_LAUNCH" 'presaleEndTime()(uint256)'

          call WRAPPER_tcgv "$WRAPPER" 'tcgvToken()(address)'
          call WRAPPER_routerAllowed "$WRAPPER" 'allowedRouters(address)(bool)' "$(grep '^BUY_router=' state-output/state.txt | cut -d= -f2-)"

          sha256sum state-output/state.txt > state-output/SHA256SUMS.txt

      - name: Upload state inventory
        uses: actions/upload-artifact@v4
        with:
          name: public-evm-state-inventory
          path: state-output/
          if-no-files-found: error
          retention-days: 1
