name: Public Geth v1.17.5 Engine API dependency cache

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-geth-v1.17.5-engine-deps.yml'
      - '.tooling/geth-v1.17.5-engine-deps/**'

permissions:
  contents: read

jobs:
  build-public-engine-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Clone and pin the official Geth release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch v1.17.5 \
            https://github.com/ethereum/go-ethereum.git geth
          cd geth
          actual="$(git rev-parse HEAD)"
          expected='9621c6ad10934a01b5514886fb6fbd87640b6c05'
          test "$actual" = "$expected"
          git describe --tags --exact-match HEAD | grep -Fx 'v1.17.5'
          printf '%s\n' "$actual" > ../GETH_COMMIT.txt
          git describe --tags --exact-match HEAD > ../GETH_TAG.txt

      - name: Install the exact Go toolchain requested by Geth
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: false

      - name: Populate and verify the Engine API dependency cache
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/geth-engine-gomodcache"
          export GOCACHE="$RUNNER_TEMP/geth-engine-gocache"
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          cd geth
          go version | tee ../GO_VERSION.txt
          go env GOROOT GOOS GOARCH CGO_ENABLED GOMODCACHE GOCACHE \
            | tee ../GO_ENV.txt
          go test ./eth/catalyst -run '^$' -count=1
          CGO_ENABLED=1 go test -tags=ckzg ./eth/catalyst -run '^$' -count=1

      - name: Package public modules for offline use
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/geth-engine-gomodcache"
          mkdir -p artifact
          tar --zstd -cf artifact/geth-v1.17.5-engine-gomodcache.tar.zst -C "$GOMODCACHE" .
          cp GETH_COMMIT.txt GETH_TAG.txt GO_VERSION.txt GO_ENV.txt artifact/
          cat > artifact/PROVENANCE.txt <<'EOF'
          Public dependencies only.
          Exact source: ethereum/go-ethereum v1.17.5, commit 9621c6ad10934a01b5514886fb6fbd87640b6c05.
          The cache was populated by compiling eth/catalyst with both Go-KZG and C-KZG.
          No private research code, test vector, finding, or credential is present.
          EOF
          (
            cd artifact
            sha256sum * > SHA256SUMS.txt
          )
          du -h artifact/geth-v1.17.5-engine-gomodcache.tar.zst

      - name: Upload public Engine API cache
        uses: actions/upload-artifact@v4
        with:
          name: public-geth-v1.17.5-engine-gomodcache
          path: artifact/
          if-no-files-found: error
          retention-days: 1
