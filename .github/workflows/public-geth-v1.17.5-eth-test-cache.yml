name: Public Geth v1.17.5 eth test dependency cache

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-geth-v1.17.5-eth-test-cache.yml'

permissions:
  contents: read

jobs:
  build-public-eth-test-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Clone and pin official Geth release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch v1.17.5 https://github.com/ethereum/go-ethereum.git geth
          cd geth
          actual="$(git rev-parse HEAD)"
          expected='9621c6ad10934a01b5514886fb6fbd87640b6c05'
          test "$actual" = "$expected"
          git describe --tags --exact-match HEAD | grep -Fx 'v1.17.5'
          printf '%s\n' "$actual" > ../GETH_COMMIT.txt
          git describe --tags --exact-match HEAD > ../GETH_TAG.txt

      - name: Set up exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: false

      - name: Populate dependencies required to compile the eth test package
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/geth-eth-test-gomodcache"
          export GOCACHE="$RUNNER_TEMP/geth-eth-test-gocache"
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          cd geth
          go test -vet=off ./eth -run '^$' -count=1
          go test -vet=off -tags=ckzg ./eth -run '^$' -count=1
          go env GOOS GOARCH CGO_ENABLED GOROOT GOMODCACHE GOCACHE > ../GO_ENV.txt
          go version > ../GO_VERSION.txt

      - name: Package public dependency caches
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/geth-eth-test-cache-bundle"
          mkdir -p "$root/metadata"
          cp GETH_COMMIT.txt GETH_TAG.txt GO_ENV.txt GO_VERSION.txt "$root/metadata/"
          tar --zstd -cf "$root/gomodcache.tar.zst" -C "$RUNNER_TEMP/geth-eth-test-gomodcache" .
          tar --zstd -cf "$root/gocache.tar.zst" -C "$RUNNER_TEMP/geth-eth-test-gocache" .
          (
            cd "$root"
            sha256sum gomodcache.tar.zst gocache.tar.zst metadata/* > SHA256SUMS.txt
          )
          du -h "$root"/*.tar.zst

      - name: Upload public test dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: public-geth-v1.17.5-eth-test-cache
          path: ${{ runner.temp }}/geth-eth-test-cache-bundle/
          if-no-files-found: error
          retention-days: 1
