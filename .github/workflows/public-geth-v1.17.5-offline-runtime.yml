name: Public Geth v1.17.5 offline runtime bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-geth-v1.17.5-offline-runtime.yml'
      - '.tooling/geth-v1.17.5-runtime/**'

permissions:
  contents: read

jobs:
  build-public-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Clone and pin the official Geth release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch v1.17.5 \
            https://github.com/ethereum/go-ethereum.git geth
          cd geth
          actual="$(git rev-parse HEAD)"
          expected='9621c6ad10934a01b5514886fb6fbd87640b6c05'
          test "$actual" = "$expected"
          git describe --tags --exact-match HEAD | grep -Fx 'v1.17.5'
          printf '%s\n' "$actual" > ../GETH_COMMIT.txt
          git describe --tags --exact-match HEAD > ../GETH_TAG.txt

      - name: Install the exact Go toolchain requested by Geth
        uses: actions/setup-go@v5
        with:
          go-version-file: geth/go.mod
          cache: false

      - name: Populate the offline module cache and compile both KZG backends
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/geth-gomodcache"
          export GOCACHE="$RUNNER_TEMP/geth-gocache"
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          cd geth
          go version | tee ../GO_VERSION.txt
          go env GOROOT GOOS GOARCH CGO_ENABLED GOPATH GOMODCACHE GOCACHE \
            | tee ../GO_ENV.txt
          go test ./core/txpool/blobpool -run '^$' -count=1
          CGO_ENABLED=1 go test -tags=ckzg ./core/txpool/blobpool -run '^$' -count=1

      - name: Assemble an integrity-pinned offline build bundle
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/geth-gomodcache"
          export GOCACHE="$RUNNER_TEMP/geth-gocache"
          root="$RUNNER_TEMP/geth-offline-runtime"
          mkdir -p "$root/source" "$root/toolchain" "$root/gomodcache" "$root/metadata"

          (
            cd geth
            git archive --format=tar HEAD
          ) | tar -xf - -C "$root/source"
          cp -a "$(go env GOROOT)/." "$root/toolchain/"
          cp -a "$GOMODCACHE/." "$root/gomodcache/"
          cp GETH_COMMIT.txt GETH_TAG.txt GO_VERSION.txt GO_ENV.txt "$root/metadata/"

          cat > "$root/metadata/OFFLINE_USAGE.txt" <<'EOF'
          Public dependencies only.
          Set GOROOT to ./toolchain, prepend ./toolchain/bin to PATH, set
          GOMODCACHE to ./gomodcache, set GOTOOLCHAIN=local and GOPROXY=off,
          then run tests from ./source. The bundle contains no private test or finding.
          EOF

          find "$root/metadata" -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$root/metadata/METADATA_SHA256.txt"
          printf 'source_bytes=%s\n' "$(du -sb "$root/source" | cut -f1)" >> "$root/metadata/SIZES.txt"
          printf 'toolchain_bytes=%s\n' "$(du -sb "$root/toolchain" | cut -f1)" >> "$root/metadata/SIZES.txt"
          printf 'gomodcache_bytes=%s\n' "$(du -sb "$root/gomodcache" | cut -f1)" >> "$root/metadata/SIZES.txt"

          tar --zstd -cf geth-v1.17.5-offline-runtime.tar.zst -C "$root" .
          sha256sum geth-v1.17.5-offline-runtime.tar.zst > GET_RUNTIME_SHA256.txt
          du -h geth-v1.17.5-offline-runtime.tar.zst

      - name: Upload public offline runtime
        uses: actions/upload-artifact@v4
        with:
          name: public-geth-v1.17.5-offline-runtime
          path: |
            geth-v1.17.5-offline-runtime.tar.zst
            GET_RUNTIME_SHA256.txt
          if-no-files-found: error
          retention-days: 1
