name: Public Lodestar b3cb0f6 offline runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-lodestar-b3cb0f6-offline-runtime.yml'
      - '.tooling/lodestar-b3cb0f6-runtime/**'

permissions:
  contents: read

jobs:
  build-public-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Clone and pin exact current Lodestar source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ChainSafe/lodestar.git lodestar
          cd lodestar
          git checkout --detach b3cb0f603ba66032cf91bc5b0e3c0de8f3ac6418
          actual="$(git rev-parse HEAD)"
          expected='b3cb0f603ba66032cf91bc5b0e3c0de8f3ac6418'
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > ../LODESTAR_COMMIT.txt
          git show -s --format='%cI%n%s' HEAD > ../LODESTAR_COMMIT_META.txt

      - name: Set up exact Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: lodestar/pnpm-lock.yaml

      - name: Activate exact pnpm and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
          node --version | tee NODE_VERSION.txt
          pnpm --version | tee PNPM_VERSION.txt
          cd lodestar
          pnpm install --frozen-lockfile

      - name: Build beacon-node and all workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd lodestar
          pnpm --filter @lodestar/beacon-node... build
          node -e "Promise.all([import('./packages/beacon-node/lib/util/execution.js'), import('./packages/beacon-node/lib/util/dataColumns.js'), import('./packages/beacon-node/lib/chain/blocks/blockInput/blockInput.js')]).then(() => console.log('exact compiled modules import PASS'))"

      - name: Assemble portable public runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lodestar-runtime"
          mkdir -p "$root/repo/packages" "$root/node" "$root/metadata"

          cp lodestar/package.json lodestar/pnpm-lock.yaml lodestar/pnpm-workspace.yaml "$root/repo/"
          cp -a lodestar/node_modules "$root/repo/"
          for pkg in lodestar/packages/*; do
            test -f "$pkg/package.json" || continue
            name="$(basename "$pkg")"
            mkdir -p "$root/repo/packages/$name"
            cp "$pkg/package.json" "$root/repo/packages/$name/"
            test ! -d "$pkg/lib" || cp -a "$pkg/lib" "$root/repo/packages/$name/"
            test ! -d "$pkg/node_modules" || cp -a "$pkg/node_modules" "$root/repo/packages/$name/"
          done

          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          cp -a "$node_root/." "$root/node/"
          cp LODESTAR_COMMIT.txt LODESTAR_COMMIT_META.txt NODE_VERSION.txt PNPM_VERSION.txt "$root/metadata/"
          cat > "$root/metadata/OFFLINE_USAGE.txt" <<'EOF'
          Public, unmodified dependencies only.
          Exact source commit: ChainSafe/lodestar b3cb0f603ba66032cf91bc5b0e3c0de8f3ac6418.
          Prepend ./node/bin to PATH, then execute modules from ./repo.
          The runtime contains no private test vector, vulnerability detail, credential, or finding.
          EOF

          (
            cd "$root"
            find metadata -type f -print0 | sort -z | xargs -0 sha256sum > metadata/METADATA_SHA256.txt
            du -sb repo node > metadata/SIZES.txt
          )
          tar --zstd -cf lodestar-b3cb0f6-offline-runtime.tar.zst -C "$root" .
          sha256sum lodestar-b3cb0f6-offline-runtime.tar.zst > LODESTAR_RUNTIME_SHA256.txt
          du -h lodestar-b3cb0f6-offline-runtime.tar.zst

      - name: Upload public offline runtime
        uses: actions/upload-artifact@v4
        with:
          name: public-lodestar-b3cb0f6-offline-runtime
          path: |
            lodestar-b3cb0f6-offline-runtime.tar.zst
            LODESTAR_RUNTIME_SHA256.txt
          if-no-files-found: error
          retention-days: 1
