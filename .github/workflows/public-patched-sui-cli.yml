name: Public patched Sui CLI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/public-patched-sui-cli.yml
      - public-toolchain-trigger.txt

permissions:
  contents: read

concurrency:
  group: public-patched-sui-cli
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h > disk-before.txt
      - name: Build Sui CLI 1.72.5 using cached chain ID
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MystenLabs/sui.git sui-source
          git -C sui-source checkout mainnet-v1.72.5
          git -C sui-source rev-parse HEAD | tee SUI_SOURCE_COMMIT.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sui-source/crates/sui-sdk/src/wallet_context.rs')
          s = p.read_text()
          old = '''    pub async fn cache_chain_id(&self) -> Result<String, anyhow::Error> {
                  self.internal_load_or_cache_chain_id(true).await
              }'''
          new = '''    pub async fn cache_chain_id(&self) -> Result<String, anyhow::Error> {
                  // Generic local-fork compatibility patch: prefer a chain ID already
                  // pinned in client.yaml. The fork prototype does not implement the
                  // remote availableRange query used during forced recaching.
                  self.internal_load_or_cache_chain_id(false).await
              }'''
          if old not in s:
              raise SystemExit('expected cache_chain_id block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git -C sui-source diff -- crates/sui-sdk/src/wallet_context.rs | tee SUI_CLI_PATCH.diff
          cd sui-source
          cargo build --locked -p sui 2>&1 | tee "$GITHUB_WORKSPACE/SUI_CLI_BUILD_OUTPUT.txt"
          cd "$GITHUB_WORKSPACE"
          mkdir -p out
          cp sui-source/target/debug/sui out/sui
          chmod +x out/sui
          cp SUI_SOURCE_COMMIT.txt SUI_CLI_PATCH.diff out/
          out/sui --version | tee out/SUI_VERSION.txt
          sha256sum out/* > out/SHA256SUMS
          df -h > disk-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: public-cached-chain-sui-cli-1.72.5
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: |
            out/
            SUI_CLI_BUILD_OUTPUT.txt
            disk-before.txt
            disk-after.txt
