name: Public Pyth Cardano CLI discovery

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/public-pyth-cardano-cli-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
      - name: Clone pinned source and install workspace
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain checkout 85f56177471a8238d74ef1e2331e4c7204c266f5
          corepack enable
          cd pyth-crosschain
          if [ -f pnpm-lock.yaml ]; then
            corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile 2>&1 | tee ../INSTALL.txt
          elif [ -f yarn.lock ]; then
            yarn install --immutable 2>&1 | tee ../INSTALL.txt
          else
            npm install 2>&1 | tee ../INSTALL.txt
          fi
      - name: Capture public CLI and source surface
        run: |
          set -euo pipefail
          mkdir -p out
          cd pyth-crosschain/lazer/contracts/cardano/cli/js
          cat package.json > "$GITHUB_WORKSPACE/out/package.json"
          (pnpm run 2>&1 || npm run 2>&1 || true) > "$GITHUB_WORKSPACE/out/scripts.txt"
          (pnpm exec tsx src/cli.ts --help 2>&1 || npx tsx src/cli.ts --help 2>&1 || true) > "$GITHUB_WORKSPACE/out/help.txt"
          cp src/cli.ts src/transactions.ts src/offchain.ts src/wormhole.ts "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE"
          grep -RInE 'yaci|devnet|emulator|local.?ledger|Evolution|Blockfrost|Koios|initialize|governance|trusted.?signer' \
            pyth-crosschain/lazer/contracts/cardano/cli \
            pyth-crosschain/lazer/contracts/cardano/sdk \
            2>/dev/null | head -n 5000 > out/relevant-grep.txt || true
          sha256sum out/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pyth-cardano-cli-discovery
          retention-days: 7
          if-no-files-found: error
          path: |
            out/
            INSTALL.txt
