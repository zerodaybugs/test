name: Public Sui CLI 1.72.5

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/public-sui-cli-1725.yml
      - public-toolchain-trigger.txt

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Sui CLI
        run: |
          set -euo pipefail
          TAG="mainnet-v1.72.5"
          ARCHIVE="sui-${TAG}-ubuntu-x86_64.tgz"
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/MystenLabs/sui/releases/download/${TAG}/${ARCHIVE}"
          mkdir -p release out
          tar -xzf "$ARCHIVE" -C release
          cp release/sui out/sui
          chmod +x out/sui
          printf '%s\n' "$TAG" > out/SUI_TAG.txt
          sha256sum out/* > out/SHA256SUMS
          out/sui --version
      - uses: actions/upload-artifact@v4
        with:
          name: public-sui-cli-1.72.5
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: out/
