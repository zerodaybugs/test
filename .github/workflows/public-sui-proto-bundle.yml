name: Public Sui RPC proto bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/public-sui-proto-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact public RPC proto definitions
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MystenLabs/sui.git sui-source
          git -C sui-source checkout mainnet-v1.72.2
          mkdir -p out
          find sui-source -type f -name '*.proto' -print | sort | tee out/PROTO_FILES.txt
          grep -RIl 'TransactionExecutionService' sui-source --include='*.proto' | tee out/EXECUTION_PROTO_FILES.txt
          tar -czf out/sui-rpc-protos-mainnet-v1.72.2.tar.gz $(cat out/PROTO_FILES.txt)
          sha256sum out/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-sui-rpc-protos-1.72.2
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: out/
