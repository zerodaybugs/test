name: Public Sui toolchain bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-sui-toolchain-bundle.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/public-sui-toolchain-bundle.yml
      - public-toolchain-trigger.txt

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Extract public Sui binaries
        run: |
          set -euo pipefail
          SUI_TAG="mainnet-v1.72.2"
          SUI_ARCHIVE="sui-${SUI_TAG}-ubuntu-x86_64.tgz"
          curl -fsSL -o "$SUI_ARCHIVE" \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_TAG}/${SUI_ARCHIVE}"
          mkdir -p release binary-sui binary-sui-fork
          tar -xzf "$SUI_ARCHIVE" -C release
          cp release/sui binary-sui/sui
          cp release/sui-fork binary-sui-fork/sui-fork
          chmod +x binary-sui/sui binary-sui-fork/sui-fork
          printf '%s\n' "$SUI_TAG" > binary-sui/SUI_TAG.txt
          printf '%s\n' "$SUI_TAG" > binary-sui-fork/SUI_TAG.txt
          sha256sum binary-sui/* > binary-sui/SHA256SUMS
          sha256sum binary-sui-fork/* > binary-sui-fork/SHA256SUMS
          ls -lh binary-sui binary-sui-fork

      - name: Create targeted public source snapshots
        run: |
          set -euo pipefail
          mkdir -p source-pyth source-wormhole source-sui-framework work

          git clone --filter=blob:none --sparse \
            https://github.com/pyth-network/pyth-crosschain.git work/pyth-crosschain
          git -C work/pyth-crosschain checkout b0eca920b6498e0a84ffd5d6918581cc10d764e8
          git -C work/pyth-crosschain sparse-checkout set lazer/contracts/sui
          tar -C work/pyth-crosschain -czf source-pyth/pyth-lazer-sui-b0eca920.tar.gz \
            lazer/contracts/sui
          printf '%s\n' 'b0eca920b6498e0a84ffd5d6918581cc10d764e8' > source-pyth/PYTH_COMMIT.txt
          sha256sum source-pyth/* > source-pyth/SHA256SUMS

          git clone --filter=blob:none --sparse \
            https://github.com/wormhole-foundation/wormhole.git work/wormhole
          git -C work/wormhole checkout c5a2eabe0a48654fcb1d3c98537915c2fb671c80
          git -C work/wormhole sparse-checkout set sui/wormhole
          tar -C work/wormhole -czf source-wormhole/wormhole-sui-c5a2eabe.tar.gz \
            sui/wormhole
          printf '%s\n' 'c5a2eabe0a48654fcb1d3c98537915c2fb671c80' > source-wormhole/WORMHOLE_COMMIT.txt
          sha256sum source-wormhole/* > source-wormhole/SHA256SUMS

          git clone --filter=blob:none --sparse \
            https://github.com/MystenLabs/sui.git work/sui-framework
          git -C work/sui-framework checkout 367fd808279bed26f7c64fc63160062a2ee29ab7
          git -C work/sui-framework sparse-checkout set \
            crates/sui-framework/packages/move-stdlib \
            crates/sui-framework/packages/sui-framework
          tar -C work/sui-framework -czf source-sui-framework/sui-framework-367fd808.tar.gz \
            crates/sui-framework/packages/move-stdlib \
            crates/sui-framework/packages/sui-framework
          printf '%s\n' '367fd808279bed26f7c64fc63160062a2ee29ab7' > source-sui-framework/SUI_FRAMEWORK_COMMIT.txt
          sha256sum source-sui-framework/* > source-sui-framework/SHA256SUMS
          du -sh source-pyth source-wormhole source-sui-framework

      - name: Upload Sui CLI
        uses: actions/upload-artifact@v4
        with:
          name: public-sui-cli-1.72.2
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: binary-sui/

      - name: Upload sui-fork
        uses: actions/upload-artifact@v4
        with:
          name: public-sui-fork-1.72.2
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: binary-sui-fork/

      - name: Upload Pyth Sui source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: public-pyth-lazer-sui-source
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: source-pyth/

      - name: Upload Wormhole Sui source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: public-wormhole-sui-source
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: source-wormhole/

      - name: Upload exact Sui framework snapshot
        uses: actions/upload-artifact@v4
        with:
          name: public-sui-framework-source
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: source-sui-framework/
