name: Public Sui toolchain bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-sui-toolchain-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download public release and source snapshots
        run: |
          set -euo pipefail
          mkdir -p bundle/sources

          SUI_TAG="mainnet-v1.72.2"
          SUI_ARCHIVE="sui-${SUI_TAG}-ubuntu-x86_64.tgz"
          curl -fsSL -o "bundle/${SUI_ARCHIVE}" \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_TAG}/${SUI_ARCHIVE}"

          git clone --filter=blob:none --no-checkout \
            https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain checkout b0eca920b6498e0a84ffd5d6918581cc10d764e8
          git -C pyth-crosschain archive --format=tar.gz \
            --output="$GITHUB_WORKSPACE/bundle/sources/pyth-crosschain-b0eca920.tar.gz" HEAD

          git clone --filter=blob:none --no-checkout \
            https://github.com/wormhole-foundation/wormhole.git wormhole
          git -C wormhole checkout c5a2eabe0a48654fcb1d3c98537915c2fb671c80
          git -C wormhole archive --format=tar.gz \
            --output="$GITHUB_WORKSPACE/bundle/sources/wormhole-c5a2eabe.tar.gz" HEAD

          printf '%s\n' "$SUI_TAG" > bundle/SUI_TAG.txt
          printf '%s\n' 'b0eca920b6498e0a84ffd5d6918581cc10d764e8' > bundle/PYTH_COMMIT.txt
          printf '%s\n' 'c5a2eabe0a48654fcb1d3c98537915c2fb671c80' > bundle/WORMHOLE_COMMIT.txt
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/SHA256SUMS
          du -sh bundle

      - name: Upload generic bundle
        uses: actions/upload-artifact@v4
        with:
          name: public-sui-toolchain-bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: bundle/
