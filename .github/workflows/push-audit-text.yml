name: Extract public Push audit report text

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-audit-text.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download public audit PDF and extract text
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          URL='https://raw.githubusercontent.com/pushchain/push-chain-node/e4b746ac55e01c1d043ed314090df75082126568/audits/Hacken_Push%20Chain_%5BL1%5D%20Push%20Chain%20_%20Blockchain%20Audit%20_%20Apr2026_P-2025-1758_6_20260629%2017_10.pdf'
          curl --fail-with-body --retry 5 --retry-all-errors -L "$URL" -o audit.pdf
          pdfinfo audit.pdf | tee pdfinfo.txt
          pdftotext -layout audit.pdf audit.txt
          grep -nE 'F-2026-|Critical|High|Medium|Low|Informational' audit.txt > findings-index.txt || true
          sha256sum audit.pdf audit.txt pdfinfo.txt findings-index.txt > SHA256SUMS
          wc -lc audit.txt findings-index.txt | tee sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: push-public-audit-text-${{ github.run_id }}
          path: |
            audit.pdf
            audit.txt
            pdfinfo.txt
            findings-index.txt
            SHA256SUMS
            sizes.txt
          compression-level: 0
          retention-days: 3
