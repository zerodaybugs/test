name: Package exact public Push contract sources

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-contract-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pushchain/push-chain-core-contracts.git core
          git -C core checkout --detach 86e20e2d26819e7cc885549f08c66895221dfab0
          test "$(git -C core rev-parse HEAD)" = '86e20e2d26819e7cc885549f08c66895221dfab0'
          git clone https://github.com/pushchain/push-chain-gateway-contracts.git gateway
          git -C gateway checkout --detach d02070dc11aeb3a081d5d6363aa0d75d63eb7c1c
          test "$(git -C gateway rev-parse HEAD)" = 'd02070dc11aeb3a081d5d6363aa0d75d63eb7c1c'
          rm -rf core/.git gateway/.git
          tar -I 'zstd -T0 -5' -cf push-contract-sources.tar.zst core gateway
          sha256sum push-contract-sources.tar.zst > SHA256SUMS
          du -sh core gateway push-contract-sources.tar.zst | tee sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: push-contract-source-snapshot-${{ github.run_id }}
          path: |
            push-contract-sources.tar.zst
            SHA256SUMS
            sizes.txt
          compression-level: 0
          retention-days: 3
