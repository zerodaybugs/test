name: Package current Push Chain node source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-current-node-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clone and package current public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/pushchain/push-chain-node.git source
          git -C source rev-parse HEAD | tee CURRENT_COMMIT.txt
          git -C source status --short | tee CURRENT_STATUS.txt
          rm -rf source/.git
          tar -I 'zstd -T0 -6' -cf push-chain-node-current.tar.zst source
          sha256sum push-chain-node-current.tar.zst CURRENT_COMMIT.txt CURRENT_STATUS.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: push-chain-node-current-source-${{ github.run_id }}
          path: |
            push-chain-node-current.tar.zst
            CURRENT_COMMIT.txt
            CURRENT_STATUS.txt
            SHA256SUMS
          compression-level: 0
          retention-days: 3
