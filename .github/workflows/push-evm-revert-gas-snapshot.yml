name: Push EVM revert gas read-only snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-evm-revert-gas-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query public Push Donut UniversalCore quotes
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://evm.donut.rpc.push.org/'
          CORE='0x00000000000000000000000000000000000000C0'
          mkdir -p evidence/raw
          python3 - <<'PY'
          import json, subprocess

          rpc='https://evm.donut.rpc.push.org/'
          core='0x00000000000000000000000000000000000000C0'
          tokens={
            'pETH_eth':'0x90F4A15601E08570D6fFbaE883C44BDB85bDb7d1',
            'pETH_base':'0xc7007af2B24D4eb963fc9633B0c66e1d2D90Fc21',
            'pETH_arb':'0xc0a821a1AfEd1322c5e15f1F4586C0B8cE65400e',
            'pBNB':'0x7a9082dA308f3fa005beA7dB0d203b3b86664E36',
            'pSOL':'0x5D525Df2bD99a6e7ec58b76aF2fd95F39874EBed',
            'USDC_eth':'0x387b9C8Db60E74999aAAC5A2b7825b400F12d68E',
            'USDC_base':'0x84B62e44F667F692F7739Ca6040cD17DA02068A8',
            'USDC_arb':'0xa261A10e94aE4bA88EE8c5845CbE7266bD679DD6',
            'USDT_bsc':'0x2f98B4235FD2BA0173a2B056D722879360B12E7b',
          }
          def rpc_call(method, params):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params})
              out=subprocess.check_output(['curl','--fail-with-body','--retry','5','--retry-all-errors','--max-time','30','-sS',rpc,'-H','content-type: application/json','--data',body])
              return json.loads(out)
          def eth_call(to,data):
              return rpc_call('eth_call',[{'to':to,'data':data},'latest'])
          def call_data(addr):
              # getOutboundTxGasAndFees(address,uint256), second arg=0 uses base gas limit.
              return '0xdd19e755' + ('0'*24 + addr[2:].lower()) + ('0'*64)
          def decode_quote(resp):
              r=resp.get('result')
              if not r or r=='0x': return {'error':resp.get('error'),'raw':resp}
              b=bytes.fromhex(r[2:])
              words=[int.from_bytes(b[i:i+32],'big') for i in range(0,min(len(b),192),32)]
              if len(words)<6: return {'error':'short return','raw':r}
              return {
                'gas_token':'0x'+b[12:32].hex(),
                'gas_fee':words[1],
                'protocol_fee':words[2],
                'gas_price':words[3],
                'chain_string_offset':words[4],
                'gas_limit_used':words[5],
                'raw':r,
              }
          summary={
            'chain_id':rpc_call('eth_chainId',[]),
            'block_number':rpc_call('eth_blockNumber',[]),
            'quotes':{},
          }
          for name,addr in tokens.items():
              resp=eth_call(core,call_data(addr))
              open(f'evidence/raw/{name}.json','w').write(json.dumps(resp,indent=2)+'\n')
              summary['quotes'][name]={'prc20':addr,**decode_quote(resp)}
          open('evidence/summary.json','w').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          sha256sum evidence/summary.json evidence/raw/*.json > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: push-evm-revert-gas-snapshot-${{ github.run_id }}
          path: evidence/
          compression-level: 0
          retention-days: 3
