name: Warm Push Chain exact Go module cache

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-go-cache-warm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false

      - name: Clone exact public Push Chain source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pushchain/push-chain-node.git push-chain-node
          git -C push-chain-node checkout --detach 0648551281dada6e300f51baca0e7464cb210eef
          test "$(git -C push-chain-node rev-parse HEAD)" = '0648551281dada6e300f51baca0e7464cb210eef'
          mkdir -p dkls23-rs/wrapper/go-wrappers
          cat > dkls23-rs/wrapper/go-wrappers/go.mod <<'EOF'
          module go-wrapper

          go 1.23.8
          EOF

      - name: Download exact public dependencies and compile existing integration package
        shell: bash
        run: |
          set -euo pipefail
          cd push-chain-node
          export GOTOOLCHAIN=local
          export CGO_ENABLED=1
          go mod download 2>&1 | tee ../go-mod-download.log
          go test ./test/integration/uexecutor -run '^$' -count=1 -timeout 60m 2>&1 | tee ../package-compile.log

      - name: Package reusable module and build caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          go env > evidence/go-env.txt
          git -C push-chain-node rev-parse HEAD > evidence/source-head.txt
          sha256sum push-chain-node/go.sum > evidence/go-sum-sha256.txt
          printf 'GOMODCACHE=%s\nGOCACHE=%s\n' "$(go env GOMODCACHE)" "$(go env GOCACHE)" > evidence/cache-paths.txt
          du -sh "$(go env GOMODCACHE)" "$(go env GOCACHE)" > evidence/cache-sizes.txt
          cp go-mod-download.log package-compile.log evidence/
          tar -I 'zstd -T0 -3' -cf evidence/gomodcache.tar.zst -C "$(go env GOMODCACHE)" .
          tar -I 'zstd -T0 -3' -cf evidence/gocache.tar.zst -C "$(go env GOCACHE)" .
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload exact public dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: push-chain-go1243-cache-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
