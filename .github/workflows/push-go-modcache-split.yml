name: Export split Push Chain Go module cache

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-go-modcache-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false

      - name: Clone exact public source and populate module cache
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pushchain/push-chain-node.git push-chain-node
          git -C push-chain-node checkout --detach 0648551281dada6e300f51baca0e7464cb210eef
          test "$(git -C push-chain-node rev-parse HEAD)" = '0648551281dada6e300f51baca0e7464cb210eef'
          mkdir -p dkls23-rs/wrapper/go-wrappers
          cat > dkls23-rs/wrapper/go-wrappers/go.mod <<'EOF'
          module go-wrapper

          go 1.23.8
          EOF
          cd push-chain-node
          export GOTOOLCHAIN=local
          export CGO_ENABLED=1
          go mod download all
          go test ./test/integration/uexecutor -run '^$' -count=1 -timeout 60m

      - name: Compress and split module cache below connector limit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/parts
          MODCACHE="$(go env GOMODCACHE)"
          du -sh "$MODCACHE" | tee evidence/modcache-size.txt
          tar -I 'zstd -T0 -3' -cf evidence/gomodcache.tar.zst -C "$MODCACHE" .
          sha256sum evidence/gomodcache.tar.zst > evidence/gomodcache-full.sha256
          split -b 300M -d -a 2 evidence/gomodcache.tar.zst evidence/parts/gomodcache.part-
          sha256sum evidence/parts/* > evidence/parts.sha256
          ls -lh evidence/gomodcache.tar.zst evidence/parts/* | tee evidence/part-sizes.txt
          rm evidence/gomodcache.tar.zst

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-manifest-${{ github.run_id }}
          path: |
            evidence/modcache-size.txt
            evidence/gomodcache-full.sha256
            evidence/parts.sha256
            evidence/part-sizes.txt
          compression-level: 0
          retention-days: 3

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-part-00-${{ github.run_id }}
          path: evidence/parts/gomodcache.part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-part-01-${{ github.run_id }}
          path: evidence/parts/gomodcache.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-part-02-${{ github.run_id }}
          path: evidence/parts/gomodcache.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-part-03-${{ github.run_id }}
          path: evidence/parts/gomodcache.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-part-04-${{ github.run_id }}
          path: evidence/parts/gomodcache.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-part-05-${{ github.run_id }}
          path: evidence/parts/gomodcache.part-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: push-go-modcache-part-06-${{ github.run_id }}
          path: evidence/parts/gomodcache.part-06
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
