name: Export exact Push integration Go build cache

# Trigger 2026-07-22 run 2.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-integration-gocache-split.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-integration-gocache-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Compile exact public integration package
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pushchain/push-chain-node.git push-chain-node
          git -C push-chain-node checkout --detach 0648551281dada6e300f51baca0e7464cb210eef
          test "$(git -C push-chain-node rev-parse HEAD)" = '0648551281dada6e300f51baca0e7464cb210eef'
          mkdir -p dkls23-rs/wrapper/go-wrappers
          cat > dkls23-rs/wrapper/go-wrappers/go.mod <<'EOF'
          module go-wrapper

          go 1.23.8
          EOF
          cd push-chain-node
          export GOTOOLCHAIN=local
          export CGO_ENABLED=1
          go test -tags=test ./test/integration/uexecutor -run '^$' -count=1 -timeout 60m
      - name: Compress and split Go build cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/parts
          GOCACHE_DIR="$(go env GOCACHE)"
          du -sh "$GOCACHE_DIR" | tee evidence/gocache-size.txt
          tar -I 'zstd -T0 -3' -cf evidence/gocache.tar.zst -C "$GOCACHE_DIR" .
          sha256sum evidence/gocache.tar.zst > evidence/gocache-full.sha256
          split -b 450M -d -a 2 evidence/gocache.tar.zst evidence/parts/gocache.part-
          sha256sum evidence/parts/* > evidence/parts.sha256
          ls -lh evidence/gocache.tar.zst evidence/parts/* | tee evidence/part-sizes.txt
          test "$(find evidence/parts -type f | wc -l)" -le 8
          rm evidence/gocache.tar.zst
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: push-integration-gocache-manifest-${{ github.run_id }}
          path: |
            evidence/gocache-size.txt
            evidence/gocache-full.sha256
            evidence/parts.sha256
            evidence/part-sizes.txt
          compression-level: 0
          retention-days: 3
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-00-${{ github.run_id }}, path: evidence/parts/gocache.part-00, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-01-${{ github.run_id }}, path: evidence/parts/gocache.part-01, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-02-${{ github.run_id }}, path: evidence/parts/gocache.part-02, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-03-${{ github.run_id }}, path: evidence/parts/gocache.part-03, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-04-${{ github.run_id }}, path: evidence/parts/gocache.part-04, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-05-${{ github.run_id }}, path: evidence/parts/gocache.part-05, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-06-${{ github.run_id }}, path: evidence/parts/gocache.part-06, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with: {name: push-integration-gocache-part-07-${{ github.run_id }}, path: evidence/parts/gocache.part-07, if-no-files-found: ignore, compression-level: 0, retention-days: 3}
