name: Export exact pchaind Go build cache

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-pchaind-gocache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false

      - name: Clone and build exact public pchaind target
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pushchain/push-chain-node.git push-chain-node
          git -C push-chain-node checkout --detach 0648551281dada6e300f51baca0e7464cb210eef
          test "$(git -C push-chain-node rev-parse HEAD)" = '0648551281dada6e300f51baca0e7464cb210eef'
          mkdir -p dkls23-rs/wrapper/go-wrappers
          cat > dkls23-rs/wrapper/go-wrappers/go.mod <<'EOF'
          module go-wrapper

          go 1.23.8
          EOF
          cd push-chain-node
          export GOTOOLCHAIN=local
          export CGO_ENABLED=1
          LDFLAGS='-X github.com/cosmos/cosmos-sdk/version.Name=pchain -X github.com/cosmos/cosmos-sdk/version.AppName=pchaind -X github.com/cosmos/cosmos-sdk/version.Version=scope-0648551281dada6e300f51baca0e7464cb210eef -X github.com/cosmos/cosmos-sdk/version.Commit=0648551281dada6e300f51baca0e7464cb210eef'
          /usr/bin/time -v go build -mod=readonly -trimpath -ldflags "$LDFLAGS" -o ../pchaind-exact ./cmd/pchaind 2>&1 | tee ../pchaind-build.log
          ../pchaind-exact version --long > ../pchaind-version.txt 2>&1 || true
          sha256sum ../pchaind-exact > ../pchaind-sha256.txt

      - name: Compress and split Go build cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/parts
          CACHE="$(go env GOCACHE)"
          du -sh "$CACHE" | tee evidence/gocache-size.txt
          tar -I 'zstd -T0 -3' -cf evidence/gocache.tar.zst -C "$CACHE" .
          sha256sum evidence/gocache.tar.zst > evidence/gocache-full.sha256
          split -b 250M -d -a 2 evidence/gocache.tar.zst evidence/parts/gocache.part-
          sha256sum evidence/parts/* > evidence/parts.sha256
          ls -lh evidence/gocache.tar.zst evidence/parts/* | tee evidence/part-sizes.txt
          cp pchaind-build.log pchaind-version.txt pchaind-sha256.txt evidence/
          rm evidence/gocache.tar.zst

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: push-pchaind-gocache-manifest-${{ github.run_id }}
          path: |
            evidence/gocache-size.txt
            evidence/gocache-full.sha256
            evidence/parts.sha256
            evidence/part-sizes.txt
            evidence/pchaind-build.log
            evidence/pchaind-version.txt
            evidence/pchaind-sha256.txt
          compression-level: 0
          retention-days: 3

      - name: Upload exact vulnerable binary
        uses: actions/upload-artifact@v4
        with:
          name: push-pchaind-exact-binary-${{ github.run_id }}
          path: pchaind-exact
          compression-level: 0
          retention-days: 3

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: push-pchaind-gocache-part-00-${{ github.run_id }}
          path: evidence/parts/gocache.part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part 01
        uses: actions/upload-artifact@v4
