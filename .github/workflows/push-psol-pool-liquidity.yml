name: Push pSOL pool read-only liquidity snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-psol-pool-liquidity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query pool balances and exact-output quotes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts ethers@6.15.0
          cat > snapshot.mjs <<'JS'
          import { JsonRpcProvider, Contract, Interface, formatUnits } from 'ethers';
          import fs from 'node:fs';

          const RPC = 'https://evm.donut.rpc.push.org/';
          const provider = new JsonRpcProvider(RPC, 42101, { staticNetwork: true });
          const PSOL = '0x5D525Df2bD99a6e7ec58b76aF2fd95F39874EBed';
          const WPC = '0xE17DD2E0509f99E9ee9469Cf6634048Ec5a3ADe9';
          const POOL = '0x0E5914e3A7e2e6d18330Dd33fA387Ce33Da48b54';
          const QUOTER = '0x83316275f7C2F79BC4E26f089333e88E89093037';
          const erc20 = ['function balanceOf(address) view returns (uint256)','function decimals() view returns (uint8)'];
          const poolAbi = [
            'function liquidity() view returns (uint128)',
            'function slot0() view returns (uint160 sqrtPriceX96,int24 tick,uint16 observationIndex,uint16 observationCardinality,uint16 observationCardinalityNext,uint8 feeProtocol,bool unlocked)',
            'function token0() view returns (address)',
            'function token1() view returns (address)',
            'function fee() view returns (uint24)'
          ];
          const quoterAbi = ['function quoteExactOutputSingle((address tokenIn,address tokenOut,uint256 amount,uint24 fee,uint160 sqrtPriceLimitX96) params) returns (uint256 amountIn,uint160 sqrtPriceX96After,uint32 initializedTicksCrossed,uint256 gasEstimate)'];
          const psol = new Contract(PSOL, erc20, provider);
          const wpc = new Contract(WPC, erc20, provider);
          const pool = new Contract(POOL, poolAbi, provider);
          const quoter = new Contract(QUOTER, quoterAbi, provider);
          const [psolDec,wpcDec,psolBal,wpcBal,liq,slot0,token0,token1,fee,block] = await Promise.all([
            psol.decimals(),wpc.decimals(),psol.balanceOf(POOL),wpc.balanceOf(POOL),pool.liquidity(),pool.slot0(),pool.token0(),pool.token1(),pool.fee(),provider.getBlockNumber()
          ]);
          const amounts = [1n,10n,100n,500n,1000n,1300n].map(x=>x*10n**BigInt(psolDec));
          const quotes = [];
          for (const amount of amounts) {
            try {
              const r = await quoter.quoteExactOutputSingle.staticCall({tokenIn:WPC,tokenOut:PSOL,amount,fee,sqrtPriceLimitX96:0});
              quotes.push({amountOut:amount.toString(),amountOutPSOL:formatUnits(amount,psolDec),success:true,amountIn:r.amountIn.toString(),amountInWPC:formatUnits(r.amountIn,wpcDec),sqrtPriceX96After:r.sqrtPriceX96After.toString(),initializedTicksCrossed:Number(r.initializedTicksCrossed),gasEstimate:r.gasEstimate.toString()});
            } catch (e) {
              quotes.push({amountOut:amount.toString(),amountOutPSOL:formatUnits(amount,psolDec),success:false,error:String(e.shortMessage||e.message||e)});
            }
          }
          const out={rpc:RPC,chainId:42101,block,pool:POOL,psol:PSOL,wpc:WPC,quoter:QUOTER,token0,token1,fee:Number(fee),liquidity:liq.toString(),slot0:{sqrtPriceX96:slot0.sqrtPriceX96.toString(),tick:Number(slot0.tick),unlocked:slot0.unlocked},balances:{psol:psolBal.toString(),psolFormatted:formatUnits(psolBal,psolDec),wpc:wpcBal.toString(),wpcFormatted:formatUnits(wpcBal,wpcDec)},quotes};
          fs.writeFileSync('summary.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          JS
          node snapshot.mjs 2>&1 | tee snapshot.log
          sha256sum snapshot.mjs summary.json snapshot.log > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: push-psol-pool-liquidity-${{ github.run_id }}
          path: |
            snapshot.mjs
            summary.json
            snapshot.log
            SHA256SUMS
          compression-level: 0
          retention-days: 3
