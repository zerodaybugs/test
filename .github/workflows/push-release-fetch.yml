name: Push release artifact fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-release-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official v0.0.40 Linux AMD64 release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/pushchain/push-chain-node/releases/download/v0.0.40/push-chain_0.0.40_linux_amd64.tar.gz'
          curl --fail --location --retry 3 --output push-chain_0.0.40_linux_amd64.tar.gz "$url"
          echo '5d7241ae20c14785ed9a421cad77491a13dbc69b661fd4e9547b53423d09c0c2  push-chain_0.0.40_linux_amd64.tar.gz' | sha256sum -c -
          tar -tzf push-chain_0.0.40_linux_amd64.tar.gz | tee archive-contents.txt
          sha256sum push-chain_0.0.40_linux_amd64.tar.gz > SHA256SUMS
      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: push-chain-v0.0.40-linux-amd64
          path: |
            push-chain_0.0.40_linux_amd64.tar.gz
            archive-contents.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
