name: Push Solana read-only account snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/push-solana-account-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query public Solana Devnet accounts read-only
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://api.devnet.solana.com'
          query() {
            local addr="$1"
            curl --fail-with-body --retry 5 --retry-all-errors --max-time 30 \
              -sS "$RPC" -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountInfo\",\"params\":[\"${addr}\",{\"encoding\":\"base64\",\"commitment\":\"finalized\"}]}" \
              > "${addr}.json"
          }
          query 'CFVSincHYbETh2k7w6u1ENEkjbSLtveRCEBupKidw2VS'
          query '89q1AUFb7YREHtjc1aYaPywovPq6tb3GYNPyDUJ3rshi'
          query 'h3vsA6Dg7WHceae9YTJeUDMrh2HAcp6G8Vs6SJyQYKC'
          query '2urirovTZSgpEAEFyf2dMWjMTqfkgg1J3piTBeSEwV5P'
          jq -n \
            --slurpfile program CFVSincHYbETh2k7w6u1ENEkjbSLtveRCEBupKidw2VS.json \
            --slurpfile vault 89q1AUFb7YREHtjc1aYaPywovPq6tb3GYNPyDUJ3rshi.json \
            --slurpfile fee h3vsA6Dg7WHceae9YTJeUDMrh2HAcp6G8Vs6SJyQYKC.json \
            --slurpfile config 2urirovTZSgpEAEFyf2dMWjMTqfkgg1J3piTBeSEwV5P.json \
            '{program: $program[0].result.value, vault: $vault[0].result.value, fee_vault: $fee[0].result.value, config: $config[0].result.value}' \
            > snapshot.json
          jq '{
            program_lamports: .program.lamports,
            program_executable: .program.executable,
            program_owner: .program.owner,
            vault_lamports: .vault.lamports,
            vault_sol: ((.vault.lamports // 0) / 1000000000),
            vault_owner: .vault.owner,
            fee_vault_lamports: .fee_vault.lamports,
            fee_vault_sol: ((.fee_vault.lamports // 0) / 1000000000),
            fee_vault_owner: .fee_vault.owner,
            config_lamports: .config.lamports,
            config_owner: .config.owner
          }' snapshot.json | tee summary.json
          sha256sum *.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: push-solana-account-snapshot-${{ github.run_id }}
          path: |
            *.json
            SHA256SUMS
          compression-level: 0
          retention-days: 3
