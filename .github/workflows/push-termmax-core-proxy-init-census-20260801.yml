name: TermMax core proxy initialization census 20260801

on:
  push:
    branches: [termmax-market-liability-inventory-v2-20260729]
    paths:
      - '.github/workflows/push-termmax-core-proxy-init-census-20260801.yml'
      - 'monitor/termmax_core_proxy_init_census_20260801.py'
      - 'monitor/TRIGGER_CORE_PROXY_INIT_CENSUS_20260801.txt'

permissions:
  contents: read

concurrency:
  group: termmax-core-proxy-init-census-20260801
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base, b2, berachain, xlayer, pharos, hyperevm]
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          ref: termmax-market-liability-inventory-v2-20260729
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 eth-abi==5.2.0

      - name: Fetch exact public TermMax source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/termmax-contract-v2
          git init -q /tmp/termmax-contract-v2
          git -C /tmp/termmax-contract-v2 remote add origin https://github.com/term-structure/termmax-contract-v2.git
          git -C /tmp/termmax-contract-v2 fetch -q --depth 1 origin e314f3f849577dfecd4614f148c4df81fdf8c72d
          git -C /tmp/termmax-contract-v2 checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/termmax-contract-v2 rev-parse HEAD)" = e314f3f849577dfecd4614f148c4df81fdf8c72d

      - name: Run read-only core proxy census
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
          TERMMAX_REPO: /tmp/termmax-contract-v2
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_core_proxy_init_census_20260801.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN"
            python --version
            python -m pip freeze | sort
            uname -a
            git -C /tmp/termmax-contract-v2 rev-parse HEAD
            sha256sum monitor/termmax_core_proxy_init_census_20260801.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-core-proxy-init-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final execution gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
