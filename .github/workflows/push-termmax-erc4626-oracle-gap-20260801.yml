name: Push TermMax ERC4626 oracle redeem-gap scan 20260801

on:
  push:
    branches: [termmax-market-liability-inventory-v2-20260729]
    paths:
      - '.github/workflows/push-termmax-erc4626-oracle-gap-20260801.yml'
      - 'monitor/termmax_erc4626_oracle_redeem_gap_20260801.py'
      - 'monitor/termmax_erc4626_oracle_redeem_gap_v2_20260801.py'
      - 'monitor/TRIGGER_ERC4626_ORACLE_GAP_PUSH_20260801.txt'

permissions:
  contents: write

concurrency:
  group: push-termmax-erc4626-oracle-gap-20260801
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          ref: termmax-market-liability-inventory-v2-20260729
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Run indexed current-state scan
        shell: bash
        run: |
          set +e
          root="$GITHUB_WORKSPACE/public-results/termmax-erc4626-oracle-gap"
          rm -rf "$root"
          mkdir -p "$root"
          OUT_DIR="$root" python monitor/termmax_erc4626_oracle_redeem_gap_v2_20260801.py \
            > >(tee "$root/stdout.log") \
            2> >(tee "$root/stderr.log" >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/exit_code.txt"
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum \
              monitor/termmax_erc4626_oracle_redeem_gap_20260801.py \
              monitor/termmax_erc4626_oracle_redeem_gap_v2_20260801.py
          } > "$root/environment.txt"
          find "$root" -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt"
          exit 0

      - name: Commit read-only results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public-results/termmax-erc4626-oracle-gap/
          if git diff --cached --quiet; then
            echo 'Results unchanged'
          else
            git commit -m "Add TermMax ERC4626 oracle gap run ${GITHUB_RUN_ID}"
            git push origin HEAD:termmax-market-liability-inventory-v2-20260729
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-erc4626-oracle-gap-push-${{ github.run_id }}
          path: public-results/termmax-erc4626-oracle-gap/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat public-results/termmax-erc4626-oracle-gap/exit_code.txt 2>/dev/null || echo 99)" = 0
