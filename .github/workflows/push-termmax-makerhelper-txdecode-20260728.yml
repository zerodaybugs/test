name: Push TermMax MakerHelper public tx decode 20260728

on:
  push:
    branches:
      - termmax-makerhelper-txdecode-20260728
    paths:
      - .github/workflows/push-termmax-makerhelper-txdecode-20260728.yml
      - monitor/termmax_makerhelper_public_txdecode_20260728.py
      - monitor/PUSH_TXDECODE_TRIGGER.txt

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Decode public MakerHelper transaction inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_makerhelper_public_txdecode_20260728.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-makerhelper-push-txdecode-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
