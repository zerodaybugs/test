name: Push TermMax MakerHelper public tx decode 20260728

on:
  push:
    branches:
      - termmax-makerhelper-txdecode-20260728
    paths:
      - .github/workflows/push-termmax-makerhelper-txdecode-20260728.yml
      - monitor/termmax_makerhelper_public_txdecode_20260728.py
      - monitor/PUSH_TXDECODE_TRIGGER.txt

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termmax-makerhelper-txdecode-20260728
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Decode public MakerHelper transaction inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-results/termmax-makerhelper-txdecode
          mkdir -p public-results/termmax-makerhelper-txdecode
          OUT_DIR=public-results/termmax-makerhelper-txdecode \
            python monitor/termmax_makerhelper_public_txdecode_20260728.py \
            > >(tee public-results/termmax-makerhelper-txdecode/stdout.log) \
            2> >(tee public-results/termmax-makerhelper-txdecode/stderr.log >&2)
          find public-results/termmax-makerhelper-txdecode -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum \
            > public-results/termmax-makerhelper-txdecode/SHA256SUMS.txt
      - name: Commit public decoded evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public-results/termmax-makerhelper-txdecode/
          if git diff --cached --quiet; then
            echo 'Decoded evidence unchanged'
          else
            git commit -m "Add public TermMax MakerHelper tx decode run ${GITHUB_RUN_ID}"
            git push origin HEAD:termmax-makerhelper-txdecode-20260728
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-makerhelper-push-txdecode-${{ github.run_id }}
          path: public-results/termmax-makerhelper-txdecode/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
