name: Temporary TermMax Pendle PT live probe 20260801

on:
  push:
    branches: [termmax-market-liability-inventory-v2-20260729]
    paths:
      - '.github/workflows/push-termmax-pendle-pt-live-probe-20260801.yml'
      - 'monitor/termmax_pendle_pt_live_probe_20260801.py'
      - 'monitor/TRIGGER_PENDLE_PT_LIVE_PROBE_20260801.txt'

permissions:
  contents: read

concurrency:
  group: termmax-pendle-pt-live-probe-20260801
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          ref: termmax-market-liability-inventory-v2-20260729
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0
      - name: Run read-only Pendle PT probe
        shell: bash
        run: |
          set +e
          rm -rf evidence && mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_pendle_pt_live_probe_20260801.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum monitor/termmax_pendle_pt_live_probe_20260801.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-pendle-pt-live-probe-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
