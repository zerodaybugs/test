name: Isolated TermMax liquidity-capped pre-settlement exit gate 20260803

on:
  push:
    branches: [termmax-pre-settlement-exit-run-20260803]
    paths:
      - '.github/workflows/push-termmax-pre-settlement-exit-run-20260803.yml'
      - 'research/TRIGGER_TERMMAX_PRE_SETTLEMENT_EXIT_20260803.txt'

permissions:
  contents: read

concurrency:
  group: isolated-termmax-pre-settlement-exit-20260803
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: termmax-pre-settlement-exit-run-20260803
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependency
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0

      - name: Fetch pinned scanner source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/zerodaybugs/test/1f9a6737071db0ba9cafa3e7998396557878b4ef/research/termmax_pre_settlement_liquidity_capped_withdraw_20260803.py \
            -o /tmp/termmax_pre_settlement_liquidity_capped_withdraw_20260803.py
          python -m py_compile /tmp/termmax_pre_settlement_liquidity_capped_withdraw_20260803.py

      - name: Run current-state gate
        shell: bash
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python /tmp/termmax_pre_settlement_liquidity_capped_withdraw_20260803.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_pre_settlement_liquidity_capped_withdraw_20260803.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-pre-settlement-liquidity-capped-withdraw-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
