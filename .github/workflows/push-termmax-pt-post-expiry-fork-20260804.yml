name: TermMax PT-srUSDat post-expiry pinned-fork validation 20260804

on:
  push:
    branches: [termmax-pt-post-expiry-fork-20260804]
    paths:
      - '.github/workflows/push-termmax-pt-post-expiry-fork-20260804.yml'
      - 'research/TermMaxPtPostExpiryStandalone.t.sol'
      - 'research/TRIGGER_TERMMAX_PT_POST_EXPIRY_20260804.txt'

permissions:
  contents: read

concurrency:
  group: termmax-pt-post-expiry-fork-20260804
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: termmax-pt-post-expiry-fork-20260804
          persist-credentials: false
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build minimal fork project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fork-project evidence
          mkdir -p fork-project/test evidence
          cp research/TermMaxPtPostExpiryStandalone.t.sol fork-project/test/
          cat > fork-project/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          cache_path = "cache"
          solc_version = "0.8.29"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          EOF
          sha256sum research/TermMaxPtPostExpiryStandalone.t.sol fork-project/foundry.toml > evidence/INPUT_SHA256SUMS.txt

      - name: Run pinned post-expiry fork test
        shell: bash
        run: |
          set +e
          rpcs=(
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://1rpc.io/eth'
          )
          rc=99
          : > evidence/RPC_ATTEMPTS.txt
          : > evidence/forge.stdout.log
          : > evidence/forge.stderr.log
          for rpc in "${rpcs[@]}"; do
            printf 'rpc=%s\n' "$rpc" | tee -a evidence/RPC_ATTEMPTS.txt
            ETH_RPC_URL="$rpc" forge test \
              --root fork-project \
              --match-contract TermMaxPtPostExpiryStandaloneTest \
              -vvv \
              > >(tee evidence/forge.stdout.log) \
              2> >(tee evidence/forge.stderr.log >&2)
            rc=$?
            printf 'exit=%s\n' "$rc" | tee -a evidence/RPC_ATTEMPTS.txt
            if [ "$rc" = 0 ]; then
              printf '%s\n' "$rpc" > evidence/SELECTED_RPC.txt
              break
            fi
          done
          set -e
          verdict='TEST_FAILURE'
          if [ "$rc" = 0 ]; then
            verdict='POST_EXPIRY_OPERATIONAL'
          elif grep -q 'POST_EXPIRY_ORACLE_REVERT' evidence/forge.stdout.log evidence/forge.stderr.log; then
            verdict='POST_EXPIRY_ORACLE_REVERT'
          elif grep -q 'POST_EXPIRY_ZERO_PRICE' evidence/forge.stdout.log evidence/forge.stderr.log; then
            verdict='POST_EXPIRY_ZERO_PRICE'
          elif grep -q 'POST_EXPIRY_FEED_REVERT' evidence/forge.stdout.log evidence/forge.stderr.log; then
            verdict='POST_EXPIRY_FEED_REVERT'
          elif grep -q 'POST_EXPIRY_LIQUIDATION_INFO_REVERT' evidence/forge.stdout.log evidence/forge.stderr.log; then
            verdict='POST_EXPIRY_LIQUIDATION_INFO_REVERT'
          elif grep -q 'PT_EXPIRY_NOT_DISCOVERED' evidence/forge.stdout.log evidence/forge.stderr.log; then
            verdict='EXPIRY_DISCOVERY_FAILURE'
          fi
          printf '%s\n' "$verdict" > evidence/VERDICT.txt
          printf 'VERDICT=%s\n' "$verdict" >> "$GITHUB_ENV"
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            forge --version
            cast --version
            solc --version 2>/dev/null || true
            uname -a
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-pt-post-expiry-${{ env.VERDICT }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
