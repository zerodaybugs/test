name: TermMax PT post-expiry read-only fork gate 20260804

on:
  push:
    branches: [termmax-pt-postexpiry-gate-20260804]
    paths:
      - '.github/workflows/push-termmax-pt-postexpiry-gate-20260804.yml'
      - 'research/TermMaxPtPostExpiryGate.t.sol'
      - 'research/TRIGGER_TERMMAX_PT_POSTEXPIRY_20260804.txt'

permissions:
  contents: read

concurrency:
  group: termmax-pt-postexpiry-gate-20260804
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: termmax-pt-postexpiry-gate-20260804
          persist-credentials: false
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build minimal fork project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fork-project evidence
          mkdir -p fork-project/test fork-project/lib evidence
          cp research/TermMaxPtPostExpiryGate.t.sol fork-project/test/
          git clone --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std.git fork-project/lib/forge-std
          cat > fork-project/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          cache_path = "cache"
          libs = ["lib"]
          solc_version = "0.8.29"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          EOF
          sha256sum research/TermMaxPtPostExpiryGate.t.sol fork-project/foundry.toml > evidence/INPUT_SHA256SUMS.txt

      - name: Run pinned future-warp fork gate
        shell: bash
        run: |
          set +e
          rpcs=(
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://1rpc.io/eth'
          )
          rc=99
          : > evidence/RPC_ATTEMPTS.txt
          for rpc in "${rpcs[@]}"; do
            printf 'rpc=%s\n' "$rpc" | tee -a evidence/RPC_ATTEMPTS.txt
            ETH_RPC_URL="$rpc" forge test \
              --root fork-project \
              --match-contract TermMaxPtPostExpiryGate \
              --isolate -vvv \
              > >(tee evidence/forge.stdout.log) \
              2> >(tee evidence/forge.stderr.log >&2)
            rc=$?
            printf 'exit=%s\n' "$rc" | tee -a evidence/RPC_ATTEMPTS.txt
            if [ "$rc" = 0 ]; then
              printf '%s\n' "$rpc" > evidence/SELECTED_RPC.txt
              break
            fi
          done
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            forge --version
            cast --version
            uname -a
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-pt-postexpiry-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
