name: Push TermMax vault asset-debt census 20260730

on:
  push:
    branches: [termmax-vault-asset-debt-census-20260730]
    paths:
      - '.github/workflows/push-termmax-vault-asset-debt-census-20260730.yml'
      - 'monitor/termmax_vault_asset_debt_census_20260730.py'
      - 'monitor/TRIGGER_VAULT_ASSET_DEBT_PUSH.txt'

permissions:
  contents: write

concurrency:
  group: push-termmax-vault-asset-debt-census
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termmax-vault-asset-debt-census-20260730
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Clone exact public TermMax source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/termmax-contract-v2
          git clone --quiet https://github.com/term-structure/termmax-contract-v2.git /tmp/termmax-contract-v2
          cd /tmp/termmax-contract-v2
          git checkout --detach e314f3f849577dfecd4614f148c4df81fdf8c72d
          test "$(git rev-parse HEAD)" = e314f3f849577dfecd4614f148c4df81fdf8c72d
      - name: Run all-chain read-only census
        shell: bash
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/public-results/termmax-vault-asset-debt"
          rm -rf "$root"
          mkdir -p "$root"
          overall=0
          for chain in ethereum arbitrum bnb base b2 berachain xlayer pharos; do
            mkdir -p "$root/$chain"
            set +e
            CHAIN="$chain" TERMMAX_REPO=/tmp/termmax-contract-v2 OUT_DIR="$root/$chain" \
              python monitor/termmax_vault_asset_debt_census_20260730.py \
              > "$root/$chain/stdout.log" 2> "$root/$chain/stderr.log"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$root/$chain/exit_code.txt"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public-results/termmax-vault-asset-debt')
          chains = {}
          active = []
          failures = []
          for path in sorted(root.iterdir()):
              if not path.is_dir():
                  continue
              compact = path / 'VAULT_ASSET_DEBT_COMPACT.json'
              rc_file = path / 'exit_code.txt'
              rc = int(rc_file.read_text().strip()) if rc_file.exists() else 99
              if compact.exists():
                  data = json.loads(compact.read_text())
                  chains[path.name] = data.get('verdict', {})
                  active.extend(data.get('activeMismatches', []))
              else:
                  failures.append({'chain': path.name, 'exitCode': rc, 'stderr': (path/'stderr.log').read_text(errors='replace')[-4000:] if (path/'stderr.log').exists() else ''})
          aggregate = {'chains': chains, 'activeMismatchCount': len(active), 'activeMismatches': active, 'failures': failures}
          (root/'AGGREGATE.json').write_text(json.dumps(aggregate, indent=2))
          marker = root / ('ACTIVE_MISMATCH.marker' if active else 'NO_ACTIVE_MISMATCH.marker')
          marker.write_text(json.dumps(aggregate, indent=2))
          PY
          find "$root" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS.txt"
          exit "$overall"
      - name: Commit public read-only results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public-results/termmax-vault-asset-debt/
          if git diff --cached --quiet; then
            echo 'Results unchanged'
          else
            git commit -m "Add TermMax vault asset/debt census run ${GITHUB_RUN_ID}"
            git push origin HEAD:termmax-vault-asset-debt-census-20260730
          fi
