name: Isolated TermMax WFC1 global census 20260803

on:
  push:
    branches: [termmax-wfc1-global-run-20260803]
    paths:
      - '.github/workflows/push-termmax-wfc1-global-run-20260803.yml'
      - 'research/TRIGGER_TERMMAX_WFC1_GLOBAL_20260803.txt'

permissions:
  contents: read

concurrency:
  group: isolated-termmax-wfc1-global-20260803
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: termmax-wfc1-global-run-20260803
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Fetch and verify pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research
          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/zerodaybugs/test/ba94e97fb9cd844299ac34939f146604c9d03d2d/research/termmax_wfc1_global_census_20260803.py' \
            -o research/termmax_wfc1_global_census_20260803.py
          echo '29a2f43d87b457b46144112462db153f56a13acab0cff043ea110516274bcbc2  research/termmax_wfc1_global_census_20260803.py' \
            | sha256sum --check --strict
          python -m py_compile research/termmax_wfc1_global_census_20260803.py

      - name: Run global current-state WFC1 census
        shell: bash
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python research/termmax_wfc1_global_census_20260803.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum research/termmax_wfc1_global_census_20260803.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload global read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-wfc1-global-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
