name: Fetch pvsev public symbols

on:
  push:
    branches:
      - openvmm-runtime-binding-20260817
    paths:
      - .github/workflows/pvsev-public-symbols.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Fetch Microsoft public symbol payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $env:RUNNER_TEMP 'pvsev-symbols'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $key = 'FBC716E8F4E58713EE70601953AA26191'
          $base = "https://msdl.microsoft.com/download/symbols/pvsev.pdb/$key"
          $attempts = @(
            "$base/pvsev.pdb",
            "$base/pvsev.pd_"
          )
          $records = @()
          foreach ($url in $attempts) {
            $name = Split-Path $url -Leaf
            $dest = Join-Path $out $name
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest -MaximumRedirection 10
              $item = Get-Item $dest
              $records += [ordered]@{
                url = $url
                success = $true
                file = $name
                size = $item.Length
                sha256 = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
              }
            } catch {
              $records += [ordered]@{
                url = $url
                success = $false
                error = $_.Exception.Message
              }
              Remove-Item -Force -ErrorAction SilentlyContinue $dest
            }
          }
          $records | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $out 'RESULT.json')
          if (-not ($records | Where-Object success)) { throw 'No public symbol payload downloaded.' }
          Get-Content -Raw (Join-Path $out 'RESULT.json')
      - name: Upload public symbols
        uses: actions/upload-artifact@v4
        with:
          name: pvsev-public-symbols
          path: ${{ runner.temp }}\pvsev-symbols
          if-no-files-found: error
          retention-days: 7
