name: Dump pvsev public symbols

on:
  push:
    branches:
      - openvmm-runtime-binding-20260817
    paths:
      - .github/workflows/pvsev-symbol-dump.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Download public PDB and locate symbol tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $env:RUNNER_TEMP 'pvsev-symbol-dump'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $url = 'https://msdl.microsoft.com/download/symbols/pvsev.pdb/FBC716E8F4E58713EE70601953AA26191/pvsev.pdb'
          $pdb = Join-Path $out 'pvsev.pdb'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $pdb
          Get-FileHash -Algorithm SHA256 $pdb | Format-List | Out-String | Set-Content -Encoding utf8 (Join-Path $out 'PDB_SHA256.txt')

          $roots = @(
            'C:\Program Files\Microsoft Visual Studio',
            'C:\Program Files (x86)\Microsoft Visual Studio',
            'C:\Program Files (x86)\Windows Kits',
            'C:\Program Files\LLVM',
            'C:\Program Files\Microsoft SDKs'
          ) | Where-Object { Test-Path $_ }
          $toolNames = @('llvm-pdbutil.exe','cvdump.exe','dia2dump.exe','dia2dump.pdb','msdia*.dll')
          $found = @()
          foreach ($root in $roots) {
            foreach ($tool in $toolNames) {
              Get-ChildItem -LiteralPath $root -Filter $tool -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                $found += $_.FullName
              }
            }
          }
          $found | Sort-Object -Unique | Set-Content -Encoding utf8 (Join-Path $out 'TOOLS.txt')
          Get-Command llvm-pdbutil, cvdump, dia2dump, dumpbin, link -ErrorAction SilentlyContinue | Select-Object Name, Source | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $out 'PATH_TOOLS.json')

          $llvm = $found | Where-Object { $_ -match '(?i)llvm-pdbutil\.exe$' } | Select-Object -First 1
          $cvdump = $found | Where-Object { $_ -match '(?i)cvdump\.exe$' } | Select-Object -First 1
          $dia2dump = $found | Where-Object { $_ -match '(?i)dia2dump\.exe$' } | Select-Object -First 1
          $results = @()
          if ($llvm) {
            & $llvm dump -publics -globals -modules -symbols -section-contribs -lines $pdb *> (Join-Path $out 'LLVM_PDBUTIL_DUMP.txt')
            $results += [ordered]@{ tool='llvm-pdbutil'; path=$llvm; exit=$LASTEXITCODE }
          }
          if ($cvdump) {
            & $cvdump -s $pdb *> (Join-Path $out 'CVDUMP_SYMBOLS.txt')
            $rc1=$LASTEXITCODE
            & $cvdump -l $pdb *> (Join-Path $out 'CVDUMP_LINES.txt')
            $rc2=$LASTEXITCODE
            $results += [ordered]@{ tool='cvdump'; path=$cvdump; symbols_exit=$rc1; lines_exit=$rc2 }
          }
          if ($dia2dump) {
            & $dia2dump -all $pdb *> (Join-Path $out 'DIA2DUMP_ALL.txt')
            $results += [ordered]@{ tool='dia2dump'; path=$dia2dump; exit=$LASTEXITCODE }
          }
          $results | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $out 'RESULT.json')
          if (-not $results) { throw 'No PDB dump tool found.' }
          Get-Content -Raw (Join-Path $out 'RESULT.json')
      - name: Upload symbol dump
        uses: actions/upload-artifact@v4
        with:
          name: pvsev-symbol-dump
          path: ${{ runner.temp }}\pvsev-symbol-dump
          if-no-files-found: error
          retention-days: 7
