name: Pyth Cardano pinned Aiken build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyth-cardano-aiken.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Aiken compiler
        run: |
          set -euo pipefail
          npm install -g @aiken-lang/aikup
          if ! aikup v1.1.21; then
            if ! aikup 1.1.21; then
              aikup install v1.1.21
            fi
          fi
          export PATH="$HOME/.aiken/bin:$HOME/.local/bin:$PATH"
          command -v aiken
          aiken --version | tee AIKEN_VERSION.txt
          grep -q '1.1.21' AIKEN_VERSION.txt
          aiken check --help > AIKEN_CHECK_HELP.txt
          aiken build --help > AIKEN_BUILD_HELP.txt
      - name: Build and test pinned public source
        run: |
          set -euo pipefail
          export PATH="$HOME/.aiken/bin:$HOME/.local/bin:$PATH"
          PYTH_COMMIT=85f56177471a8238d74ef1e2331e4c7204c266f5
          LIB_COMMIT=217b5917228b17f015719b27dd616a75ad6bd800
          PROJECT="$GITHUB_WORKSPACE/pyth-crosschain/lazer/contracts/cardano"
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain checkout "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          git ls-remote https://github.com/pyth-network/pyth-lazer-cardano.git refs/heads/main | tee PYTH_LAZER_CARDANO_MAIN.txt
          test "$(cut -f1 PYTH_LAZER_CARDANO_MAIN.txt)" = "$LIB_COMMIT"
          cp "$PROJECT/aiken.toml" aiken.toml.original
          cp "$PROJECT/aiken.lock" aiken.lock.original
          aiken check "$PROJECT" --env default 2>&1 | tee AIKEN_CHECK_OUTPUT.txt
          aiken build "$PROJECT" --env default 2>&1 | tee AIKEN_BUILD_OUTPUT.txt
          cp "$PROJECT/plutus.json" plutus.json
          python3 - <<'PY'
          import json, pathlib
          bp=json.load(open('plutus.json'))
          vals=bp.get('validators', [])
          out=[]
          for v in vals:
              out.append({'title':v.get('title'),'hash':v.get('hash'),'compiledCodeBytes':len(bytes.fromhex(v.get('compiledCode','')))})
          pathlib.Path('BLUEPRINT_VALIDATORS.json').write_text(json.dumps(out,indent=2)+'\n')
          expected={
            'pyth_state.update.spend':'6d0b0ce6fc4336c208377ca85a99a7e18ad283a3b191b109befb9ab1',
            'pyth_price.pyth_price.withdraw':'032e15cd4abfd02b23fc1a07bf565d6f142b52f7e9d3d9fd8f722849',
            'pyth_state.init.mint':'ded87e048a401f1da051eaa68b253d85ce6a878405765f62b8f28202',
          }
          got={v['title']:v['hash'] for v in vals}
          for title,h in expected.items():
              if got.get(title)!=h:
                  raise SystemExit(f'{title}: got {got.get(title)}, expected {h}')
          off=pathlib.Path('pyth-crosschain/lazer/contracts/cardano/cli/js/src/offchain.ts').read_text()
          for title,h in expected.items():
              if h not in off:
                  raise SystemExit(f'expected hash absent from generated offchain.ts: {title} {h}')
          pathlib.Path('SOURCE_BUILD_BINDING.txt').write_text(
            'AIKEN_CHECK_PASS\nAIKEN_BUILD_PASS\nGENERATED_BLUEPRINT_HASHES_MATCH_REPOSITORY_BINDINGS\n'
          )
          PY
          sha256sum AIKEN_* plutus.json BLUEPRINT_VALIDATORS.json SOURCE_BUILD_BINDING.txt aiken.toml.original aiken.lock.original PYTH_LAZER_CARDANO_MAIN.txt > SHA256SUMS
          tar -czf pyth-cardano-aiken-build.tar.gz \
            AIKEN_VERSION.txt AIKEN_CHECK_HELP.txt AIKEN_BUILD_HELP.txt \
            AIKEN_CHECK_OUTPUT.txt AIKEN_BUILD_OUTPUT.txt \
            plutus.json BLUEPRINT_VALIDATORS.json SOURCE_BUILD_BINDING.txt \
            aiken.toml.original aiken.lock.original PYTH_LAZER_CARDANO_MAIN.txt SHA256SUMS
          sha256sum pyth-cardano-aiken-build.tar.gz > ARCHIVE_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-cardano-aiken-build
          retention-days: 7
          compression-level: 6
          path: |
            pyth-cardano-aiken-build.tar.gz
            ARCHIVE_SHA256.txt
            AIKEN_VERSION.txt
            AIKEN_CHECK_HELP.txt
            AIKEN_BUILD_HELP.txt
            AIKEN_CHECK_OUTPUT.txt
            AIKEN_BUILD_OUTPUT.txt
            plutus.json
            BLUEPRINT_VALIDATORS.json
            SOURCE_BUILD_BINDING.txt
            SHA256SUMS
            PYTH_LAZER_CARDANO_MAIN.txt
