name: Pyth Cardano all-asset custody census

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-cardano-all-assets-census-20260730.yml'
      - 'public_tools/pyth_cardano_all_assets_census.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run read-only asset and custody census
        shell: bash
        run: |
          set -euo pipefail
          python3 public_tools/pyth_cardano_all_assets_census.py

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence-cardano-assets -type f -printf '%P\t%s bytes\n' | sort \
            > evidence-cardano-assets/FILE_INDEX.txt
          (
            cd evidence-cardano-assets
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyth-cardano-assets-census-${{ github.run_id }}
          path: evidence-cardano-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
