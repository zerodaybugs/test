name: Pyth Cardano read-only live-state census

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-cardano-live-state-census-20260730.yml'
      - 'public_tools/pyth_cardano_live_state_census.py'

permissions:
  contents: read

concurrency:
  group: pyth-cardano-live-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run read-only public-state census
        shell: bash
        run: |
          set -euo pipefail
          python3 public_tools/pyth_cardano_live_state_census.py

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence-cardano-live -type f -printf '%P\t%s bytes\n' | sort \
            > evidence-cardano-live/FILE_INDEX.txt
          (
            cd evidence-cardano-live
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyth-cardano-live-census-${{ github.run_id }}
          path: evidence-cardano-live/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
