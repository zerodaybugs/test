name: Pyth Cardano read-only dual-provider live gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyth-cardano-livegate.yml

permissions:
  contents: read

jobs:
  livegate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Capture Pyth Cardano state from two public Koios clusters
        run: |
          set -euo pipefail
          POLICY=c935c937d0deda8975142c7b77aeef8f8cd48791e89a8ca7a0edc154
          STATE_NAME=50797468205374617465
          mkdir -p evidence
          printf '%s\n' "$POLICY" > evidence/POLICY_ID.txt
          printf '%s\n' "$STATE_NAME" > evidence/STATE_ASSET_NAME_HEX.txt
          cat > evidence/request.json <<JSON
          {"_asset_list":[["$POLICY","$STATE_NAME"]],"_extended":true}
          JSON
          bases=(
            'https://api.koios.rest/api/v1'
            'https://graph.xray.app/output/services/koios/mainnet/api/v1'
          )
          names=(koios xray)
          for i in 0 1; do
            base="${bases[$i]}"
            name="${names[$i]}"
            printf '%s\n' "$base" > "evidence/${name}_base_url.txt"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90 -fsSL \
              "$base/tip" -o "evidence/${name}_tip.json"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90 -fsSL \
              -H 'content-type: application/json' \
              --data-binary @evidence/request.json \
              "$base/asset_utxos" -o "evidence/${name}_asset_utxos.json"
            jq -e 'type == "array" and length == 1' "evidence/${name}_asset_utxos.json"
            jq -S '.[0]' "evidence/${name}_asset_utxos.json" > "evidence/${name}_state_utxo.canonical.json"
            jq -r '.[0] | (.tx_hash + "#" + (.tx_index|tostring))' \
              "evidence/${name}_asset_utxos.json" > "evidence/${name}_state_ref.txt"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90 -fsSL \
              "$base/policy_asset_list?_asset_policy=$POLICY" \
              -o "evidence/${name}_policy_assets.json"
          done
          diff -u evidence/koios_state_ref.txt evidence/xray_state_ref.txt
          jq -S '{tx_hash,tx_index,address,value,datum_hash,inline_datum,reference_script}' \
            evidence/koios_state_utxo.canonical.json > evidence/koios_consensus_fields.json
          jq -S '{tx_hash,tx_index,address,value,datum_hash,inline_datum,reference_script}' \
            evidence/xray_state_utxo.canonical.json > evidence/xray_consensus_fields.json
          diff -u evidence/koios_consensus_fields.json evidence/xray_consensus_fields.json
          REF=$(cat evidence/koios_state_ref.txt)
          jq -n --arg ref "$REF" '{_utxo_refs:[$ref],_extended:true}' > evidence/utxo_request.json
          for i in 0 1; do
            base="${bases[$i]}"
            name="${names[$i]}"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90 -fsSL \
              -H 'content-type: application/json' \
              --data-binary @evidence/utxo_request.json \
              "$base/utxo_info" -o "evidence/${name}_utxo_info.json"
            jq -S '.[0]' "evidence/${name}_utxo_info.json" > "evidence/${name}_utxo_info.canonical.json"
          done
          diff -u evidence/koios_utxo_info.canonical.json evidence/xray_utxo_info.canonical.json
          jq -r '.[0].tx_hash' evidence/koios_asset_utxos.json > evidence/STATE_ORIGIN_TX.txt
          TX=$(cat evidence/STATE_ORIGIN_TX.txt)
          jq -n --arg tx "$TX" '{_tx_hashes:[$tx],_inputs:true,_metadata:true,_assets:true,_withdrawals:true,_certs:true,_scripts:true,_bytecode:true}' > evidence/tx_request.json
          for i in 0 1; do
            base="${bases[$i]}"
            name="${names[$i]}"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90 -fsSL \
              -H 'content-type: application/json' \
              --data-binary @evidence/tx_request.json \
              "$base/tx_info" -o "evidence/${name}_origin_tx.json"
          done
          jq -S '.[0]' evidence/koios_origin_tx.json > evidence/koios_origin_tx.canonical.json
          jq -S '.[0]' evidence/xray_origin_tx.json > evidence/xray_origin_tx.canonical.json
          diff -u evidence/koios_origin_tx.canonical.json evidence/xray_origin_tx.canonical.json
          sha256sum evidence/* > evidence/SHA256SUMS
          cat > evidence/VERDICT.txt <<'EOF'
          DUAL_PROVIDER_STATE_UTXO_CONSENSUS_PASS
          READ_ONLY_MAINNET_CAPTURE_PASS
          EOF
          tar -czf pyth-cardano-livegate.tar.gz evidence
          sha256sum pyth-cardano-livegate.tar.gz > ARCHIVE_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-cardano-livegate
          retention-days: 7
          compression-level: 6
          path: |
            pyth-cardano-livegate.tar.gz
            ARCHIVE_SHA256.txt
            evidence/
