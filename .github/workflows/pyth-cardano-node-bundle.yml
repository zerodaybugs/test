name: Pyth Cardano Node dependency bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyth-cardano-node-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned public source and focused dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          PYTH_COMMIT=85f56177471a8238d74ef1e2331e4c7204c266f5
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain checkout "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          cd pyth-crosschain
          pnpm install --frozen-lockfile --filter @pythnetwork/pyth-lazer-cardano-cli... 2>&1 | tee "$GITHUB_WORKSPACE/PNPM_INSTALL_OUTPUT.txt"
          test -x node_modules/.bin/tsx || test -x lazer/contracts/cardano/cli/js/node_modules/.bin/tsx
          cd ..
          rm -rf pyth-crosschain/.git pyth-crosschain/.turbo || true
          find pyth-crosschain -type d -name .turbo -prune -exec rm -rf {} + || true
          tar --zstd -cf pyth-cardano-node-bundle.tar.zst pyth-crosschain
          sha256sum pyth-cardano-node-bundle.tar.zst > ARCHIVE_SHA256.txt
          du -sh pyth-crosschain pyth-cardano-node-bundle.tar.zst | tee SIZES.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-cardano-node-bundle
          retention-days: 7
          compression-level: 0
          path: |
            pyth-cardano-node-bundle.tar.zst
            ARCHIVE_SHA256.txt
            SIZES.txt
            PNPM_INSTALL_OUTPUT.txt
