name: Pyth Cardano offline build bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-cardano-offline-build-bundle-20260730.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout pinned Pyth source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: 6e6d6b52ecc31aab50004d9cfca9ca990d40d8fd
          path: pyth-crosschain
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Aiken compiler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @aiken-lang/aiken@1.1.21
          aiken --version

      - name: Resolve dependencies and verify baseline
        working-directory: pyth-crosschain/lazer/contracts/cardano
        shell: bash
        run: |
          set -euo pipefail
          aiken check --trace-level verbose 2>&1 | tee "$GITHUB_WORKSPACE/aiken-check.log"
          aiken build --trace-level verbose 2>&1 | tee "$GITHUB_WORKSPACE/aiken-build.log"

      - name: Package source, resolved dependencies and compiler
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/bundle"
          PROJECT="$GITHUB_WORKSPACE/pyth-crosschain/lazer/contracts/cardano"
          mkdir -p "$OUT/project" "$OUT/bin" "$OUT/provenance"
          cp -a "$PROJECT/." "$OUT/project/"
          NATIVE=/usr/local/lib/node_modules/@aiken-lang/aiken/node_modules/.bin_real/aiken
          test -x "$NATIVE"
          cp "$NATIVE" "$OUT/bin/aiken"
          chmod +x "$OUT/bin/aiken"
          (
            cd pyth-crosschain
            git rev-parse HEAD
            git status --short
          ) | tee "$OUT/provenance/source-git.txt"
          aiken --version | tee "$OUT/provenance/aiken-version.txt"
          cp aiken-check.log aiken-build.log "$OUT/provenance/"
          sha256sum "$OUT/bin/aiken" "$PROJECT/plutus.json" \
            | tee "$OUT/provenance/core-payload.sha256"
          find "$OUT" -type f -printf '%P\t%s bytes\n' | sort \
            > "$OUT/provenance/FILE_INDEX.txt"
          (
            cd "$OUT"
            find . -type f ! -path './provenance/SHA256SUMS.txt' -print0 | sort -z \
              | xargs -0 sha256sum > provenance/SHA256SUMS.txt
          )
          du -sh "$OUT" | tee "$OUT/provenance/SIZE.txt"

      - name: Upload offline build bundle
        uses: actions/upload-artifact@v4
        with:
          name: pyth-cardano-offline-build-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
