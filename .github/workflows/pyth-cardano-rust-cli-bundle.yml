name: Pyth Cardano exact Rust CLI bundle

on:
  workflow_dispatch:
  push:
    branches: [ci/pyth-cardano-rust-cli-20260722]
    paths:
      - '.github/workflows/pyth-cardano-rust-cli-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-cardano-rust-cli-bundle.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTH_COMMIT: 85f56177471a8238d74ef1e2331e4c7204c266f5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Build exact public Pyth Cardano evaluation CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git clone --filter=blob:none --no-checkout \
            https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          manifest=pyth-crosschain/lazer/contracts/cardano/cli/rust/Cargo.toml
          cargo build --release --locked --manifest-path "$manifest" \
            2>&1 | tee out/CARGO_BUILD_OUTPUT.txt
          binary=pyth-crosschain/target/release/pyth_lazer_cardano
          test -x "$binary"
          cp "$binary" out/pyth_lazer_cardano
          cp "$manifest" out/Cargo.toml
          cp pyth-crosschain/Cargo.lock out/Cargo.lock
          cp pyth-crosschain/lazer/contracts/cardano/cli/rust/src/main.rs out/main.rs
          cp pyth-crosschain/lazer/contracts/cardano/cli/rust/src/aiken_utils.rs out/aiken_utils.rs
          {
            rustc --version
            cargo --version
            git -C pyth-crosschain rev-parse HEAD
            file out/pyth_lazer_cardano
            ldd out/pyth_lazer_cardano || true
            out/pyth_lazer_cardano --help
          } > out/PROVENANCE_AND_SMOKE.txt 2>&1
          grep -F 'Usage:' out/PROVENANCE_AND_SMOKE.txt
          find out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
            > out/SHA256SUMS
          tar --zstd -cf out/pyth-cardano-rust-cli-v1.1.21.tar.zst \
            -C out pyth_lazer_cardano Cargo.toml Cargo.lock main.rs aiken_utils.rs \
            PROVENANCE_AND_SMOKE.txt CARGO_BUILD_OUTPUT.txt SHA256SUMS
          sha256sum out/pyth-cardano-rust-cli-v1.1.21.tar.zst \
            > out/ARCHIVE_SHA256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-cardano-rust-cli-v1.1.21-linux-amd64
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: out/
