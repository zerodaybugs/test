name: Pyth Cardano source bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-cardano-source-bundle-20260730.yml'

permissions:
  contents: read

concurrency:
  group: pyth-cardano-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout pinned Pyth crosschain repository
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: 6e6d6b52ecc31aab50004d9cfca9ca990d40d8fd
          path: pyth-crosschain
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current Cardano library repository
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-lazer-cardano
          ref: 217b5917228b17f015719b27dd616a75ad6bd800
          path: pyth-lazer-cardano
          persist-credentials: false
          fetch-depth: 1

      - name: Build immutable source bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/bundle"
          mkdir -p "$OUT/provenance" "$OUT/pyth-crosschain" "$OUT/pyth-lazer-cardano"

          (
            cd pyth-crosschain
            git rev-parse HEAD
            git status --short
          ) | tee "$OUT/provenance/pyth-crosschain-git.txt"
          (
            cd pyth-lazer-cardano
            git rev-parse HEAD
            git status --short
          ) | tee "$OUT/provenance/pyth-lazer-cardano-git.txt"

          cp -a pyth-crosschain/lazer/contracts/cardano \
            "$OUT/pyth-crosschain/lazer-cardano"
          cp -a pyth-lazer-cardano/. "$OUT/pyth-lazer-cardano/"

          mkdir -p "$OUT/pyth-crosschain/related"
          find pyth-crosschain/contract_manager -type f \
            \( -iname '*cardano*' -o -iname '*Cardano*' \) -print0 \
            | while IFS= read -r -d '' file; do
                rel=${file#pyth-crosschain/}
                mkdir -p "$OUT/pyth-crosschain/related/$(dirname "$rel")"
                cp "$file" "$OUT/pyth-crosschain/related/$rel"
              done
          find pyth-crosschain/apps -type f \
            \( -iname '*cardano*' -o -path '*cardano*' \) -print0 \
            | while IFS= read -r -d '' file; do
                rel=${file#pyth-crosschain/}
                mkdir -p "$OUT/pyth-crosschain/related/$(dirname "$rel")"
                cp "$file" "$OUT/pyth-crosschain/related/$rel"
              done
          find pyth-crosschain/governance -type f \
            \( -iname '*cardano*' -o -path '*cardano*' \) -print0 \
            | while IFS= read -r -d '' file; do
                rel=${file#pyth-crosschain/}
                mkdir -p "$OUT/pyth-crosschain/related/$(dirname "$rel")"
                cp "$file" "$OUT/pyth-crosschain/related/$rel"
              done

          (
            cd pyth-crosschain
            git ls-files '*cardano*' '*Cardano*'
          ) | sort > "$OUT/provenance/crosschain-cardano-files.txt"
          (
            cd pyth-lazer-cardano
            git ls-files
          ) | sort > "$OUT/provenance/library-files.txt"

          find "$OUT" -type f -printf '%P\t%s bytes\n' | sort \
            > "$OUT/provenance/FILE_INDEX.txt"
          (
            cd "$OUT"
            find . -type f ! -path './provenance/SHA256SUMS.txt' -print0 \
              | sort -z | xargs -0 sha256sum > provenance/SHA256SUMS.txt
          )
          du -sh "$OUT" | tee "$OUT/provenance/SIZE.txt"

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: pyth-cardano-source-bundle-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
