name: Public Pyth Cardano source snapshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyth-cardano-source.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive pinned public source
        run: |
          set -euo pipefail
          COMMIT=85f56177471a8238d74ef1e2331e4c7204c266f5
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain checkout "$COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$COMMIT"
          mkdir -p evidence/source
          cp -a pyth-crosschain/lazer/contracts/cardano evidence/source/
          cp -a pyth-crosschain/contract_manager evidence/source/contract_manager
          cp -a pyth-crosschain/apps/developer-hub/content/docs/price-feeds/pro/integrate-as-consumer/cardano.mdx evidence/source/ || true
          git -C pyth-crosschain rev-parse HEAD > evidence/PYTH_CROSSCHAIN_COMMIT.txt
          git -C pyth-crosschain ls-tree -r --name-only HEAD lazer/contracts/cardano > evidence/CARDANO_TREE.txt
          find evidence/source -type f -printf '%P %s bytes\n' | sort > evidence/FILES.txt
          grep -RInE 'cardano_mainnet|policyId|seen_sequence|UpdateTrustedSigner|GovernanceAction' evidence/source > evidence/KEYWORD_HITS.txt || true
          tar -czf pyth-cardano-source-85f561.tar.gz evidence
          sha256sum pyth-cardano-source-85f561.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-cardano-source-85f561
          retention-days: 7
          compression-level: 6
          path: |
            pyth-cardano-source-85f561.tar.gz
            SHA256SUMS
            evidence/
