name: Pyth Core EVM live source binding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pyth-core-evm-live-binding.yml'
      - 'tools/pyth_core_evm_live_binding.py'
      - 'tools/pyth_core_evm_live_state.py'
      - 'ci/pyth-core-evm-live-binding.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-core-evm-live-binding.yml'
      - 'tools/pyth_core_evm_live_binding.py'
      - 'tools/pyth_core_evm_live_state.py'
      - 'ci/pyth-core-evm-live-binding.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTH_PROXY: 0x4D7E825f80bDf85e913E0DD2A2D54927e9dE1594
      PYTH_CURRENT_COMMIT: 4a596e7adff552afaf5687ce791764019f2d3719
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4

      - name: Initialize provenance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR" toolchain pyth-crosschain
          mkdir -p "$OUT_DIR" toolchain
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_sha=$GITHUB_SHA"
            echo "proxy=$PYTH_PROXY"
            echo "current_source_commit=$PYTH_CURRENT_COMMIT"
            echo "mode=read-only public BSC RPC plus public verified-source API"
            echo "signed_or_broadcast_transactions=0"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          } > "$OUT_DIR/PROVENANCE.txt"

      - name: Install exact Solidity compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            https://github.com/ethereum/solidity/releases/download/v0.8.4/solc-static-linux \
            -o toolchain/solc-0.8.4
          chmod 0755 toolchain/solc-0.8.4
          toolchain/solc-0.8.4 --version | tee "$OUT_DIR/solc-version.txt"
          grep -F 'Version: 0.8.4+' "$OUT_DIR/solc-version.txt"
          sha256sum toolchain/solc-0.8.4 > "$OUT_DIR/solc-sha256.txt"

      - name: Capture current upstream governance source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_CURRENT_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_CURRENT_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_CURRENT_COMMIT"
          mkdir -p "$OUT_DIR/current-source"
          cp pyth-crosschain/target_chains/ethereum/contracts/contracts/pyth/{PythGovernance.sol,PythGovernanceInstructions.sol,PythState.sol,PythUpgradable.sol} \
            "$OUT_DIR/current-source/"
          git -C pyth-crosschain show -s --format='%H%n%aI%n%an%n%s' HEAD \
            > "$OUT_DIR/current-source-commit.txt"
          sha256sum "$OUT_DIR"/current-source/* > "$OUT_DIR/current-source-sha256.txt"
          grep -F 'vm.sequence <= lastExecutedGovernanceSequence()' \
            "$OUT_DIR/current-source/PythGovernance.sol"
          grep -F 'setLastExecutedGovernanceSequence(vm.sequence)' \
            "$OUT_DIR/current-source/PythGovernance.sol"

      - name: Bind live BSC implementation to verified source
        shell: bash
        run: |
          set +e
          python tools/pyth_core_evm_live_binding.py \
            --proxy "$PYTH_PROXY" \
            --solc "$GITHUB_WORKSPACE/toolchain/solc-0.8.4" \
            --out "$OUT_DIR" \
            > "$OUT_DIR/binding-console.log" 2>&1
          rc=$?
          cat "$OUT_DIR/binding-console.log"
          echo "$rc" > "$OUT_DIR/binding-exit-code.txt"
          exit 0

      - name: Capture current live governance state
        shell: bash
        run: |
          set +e
          python tools/pyth_core_evm_live_state.py \
            --proxy "$PYTH_PROXY" \
            --out "$OUT_DIR" \
            > "$OUT_DIR/live-state-console.log" 2>&1
          rc=$?
          cat "$OUT_DIR/live-state-console.log"
          echo "$rc" > "$OUT_DIR/live-state-exit-code.txt"
          exit 0

      - name: Finalize integrity evidence
        if: always()
        shell: bash
        run: |
          set +e
          {
            uname -a
            python --version
            git --version
            toolchain/solc-0.8.4 --version
          } > "$OUT_DIR/ENVIRONMENT.txt" 2>&1
          find "$OUT_DIR" -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT_DIR/SHA256SUMS"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-core-evm-live-binding-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Enforce exact binding and live state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$OUT_DIR/binding-exit-code.txt")" = '0'
          test "$(cat "$OUT_DIR/live-state-exit-code.txt")" = '0'
          grep -F 'PROVIDERS_IDENTICAL=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'IMPLEMENTATION_NONZERO=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'IMPLEMENTATION_RUNTIME_NONEMPTY=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'CBOR_STRIPPED_RUNTIME_MATCH=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'STATE_IDENTICAL=true' "$OUT_DIR/LIVE_STATE_MARKERS.txt"
          grep -F 'SIGNED_OR_BROADCAST_TRANSACTIONS=0' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'SIGNED_OR_BROADCAST_TRANSACTIONS=0' "$OUT_DIR/LIVE_STATE_MARKERS.txt"

      - name: Persist immutable evidence for deterministic retrieval
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TMP=/tmp/pyth-core-evm-live-binding-result
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cp -a "$OUT_DIR"/. "$TMP"/
          printf '%s\n' "$GITHUB_RUN_ID" > "$TMP/WORKFLOW_RUN_ID.txt"
          printf '%s\n' "$GITHUB_SHA" > "$TMP/WORKFLOW_SOURCE_SHA.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci-results/pyth-core-evm-live-binding
          DEST=ci-results/pyth-core-evm-live-binding
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$TMP"/. "$DEST"/
          git add "$DEST"
          git commit -m 'Record Pyth Core EVM live binding evidence [skip ci]' || true
          git push --force origin HEAD:ci-results/pyth-core-evm-live-binding
