name: Private Pyth cross-chain differential source mirror v2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-crosschain-differential-source-20260730-v2.yml'

permissions:
  contents: read

concurrency:
  group: pyth-crosschain-differential-source-20260730-v2
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current public Pyth crosschain source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: main
          path: upstream/pyth-crosschain
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /SECURITY.md
            /lazer/contracts/evm/
            /lazer/contracts/sui/
            /lazer/contracts/cardano/
            /lazer/contracts/iota/
            /governance/xc_admin/packages/xc_admin_common/src/
            /governance/remote_executor/
            /contract_manager/src/core/contracts/
            /contract_manager/src/store/contracts/
            /contract_manager/scripts/
            /apps/developer-hub/content/docs/price-feeds/pro/

      - name: Checkout current public Lazer protocol source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-lazer-public
          ref: main
          path: upstream/pyth-lazer-public
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current standalone Cardano helper
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-lazer-cardano
          ref: main
          path: upstream/pyth-lazer-cardano
          persist-credentials: false
          fetch-depth: 1

      - name: Export public source and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/provenance
          for repo in pyth-crosschain pyth-lazer-public pyth-lazer-cardano; do
            git -C "upstream/$repo" rev-parse HEAD | tee "output/provenance/$repo.commit.txt"
            git -C "upstream/$repo" show -s --format=%cI HEAD | tee "output/provenance/$repo.commit-time.txt"
            git -C "upstream/$repo" status --short | tee "output/provenance/$repo.status.txt"
            rm -rf "upstream/$repo/.git"
            cp -a "upstream/$repo" "output/source/$repo"
          done
          find output/source -type f -print0 | sort -z | xargs -0 sha256sum > output/provenance/source.sha256
          find output -type f -printf '%P\t%s bytes\n' | sort > output/provenance/FILE_INDEX.txt
          tar -C output -czf pyth-crosschain-differential-source.tar.gz source provenance
          sha256sum pyth-crosschain-differential-source.tar.gz > pyth-crosschain-differential-source.tar.gz.sha256

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: pyth-crosschain-differential-source-${{ github.run_id }}
          path: |
            pyth-crosschain-differential-source.tar.gz
            pyth-crosschain-differential-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
