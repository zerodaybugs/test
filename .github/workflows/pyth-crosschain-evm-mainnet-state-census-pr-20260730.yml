name: Pyth Crosschain EVM mainnet census PR 20260730

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-crosschain-evm-mainnet-state-census-pr-20260730.yml'
      - 'research/pyth_crosschain_evm_state_census_20260730.py'

permissions:
  contents: read

concurrency:
  group: pyth-crosschain-evm-mainnet-census-pr-20260730
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout private research runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current public Pyth source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: main
          path: pyth-crosschain
          persist-credentials: false
          fetch-depth: 1

      - name: Install deterministic dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-input pycryptodome==3.23.0

      - name: Run read-only census
        shell: bash
        run: |
          set -euo pipefail
          python3 research/pyth_crosschain_evm_state_census_20260730.py | tee census.log
          cp census.log evidence/run.log
          printf 'No transaction was signed or broadcast. JSON-RPC eth_call only.\n' > evidence/SAFETY.txt
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pyth-crosschain-evm-mainnet-census-pr-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
