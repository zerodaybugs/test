name: Pyth crosschain Solana verifier source history

on:
  push:
    branches: [ci/pyth-crosschain-solana-history-20260724]
    paths:
      - '.github/workflows/pyth-crosschain-solana-history.yml'
      - 'ci/pyth-crosschain-solana-history.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-crosschain-solana-history.yml'
      - 'ci/pyth-crosschain-solana-history.trigger'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT_DIR: ${{ github.workspace }}/out
      DEPLOY_TIME: '2025-04-01T10:30:45Z'
      SIG_PATH: lazer/contracts/solana/programs/pyth-lazer-solana-contract/src/signature.rs
      LIB_PATH: lazer/contracts/solana/programs/pyth-lazer-solana-contract/src/lib.rs
      TEST_PATH: lazer/contracts/solana/programs/pyth-lazer-solana-contract/tests/test1.rs
      CARGO_PATH: lazer/contracts/solana/programs/pyth-lazer-solana-contract/Cargo.toml
      LOCK_PATH: lazer/contracts/solana/Cargo.lock
    steps:
      - uses: actions/checkout@v4
      - name: Clone complete commit graph with lazy blobs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR" pyth-crosschain
          mkdir -p "$OUT_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain rev-parse origin/main > "$OUT_DIR/CURRENT_MAIN.txt"
          git -C pyth-crosschain rev-list --all --count > "$OUT_DIR/COMMIT_COUNT.txt"
      - name: Export focused path and pickaxe history
        shell: bash
        run: |
          set -euo pipefail
          ROOT=pyth-crosschain
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$SIG_PATH" > "$OUT_DIR/signature-history.tsv"
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$LIB_PATH" > "$OUT_DIR/lib-history.tsv"
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$TEST_PATH" > "$OUT_DIR/test-history.tsv"
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$CARGO_PATH" > "$OUT_DIR/cargo-history.tsv"

          git -C "$ROOT" log --all -S'expected_message_data' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -p -- "$SIG_PATH" \
            > "$OUT_DIR/pickaxe-expected-message.patch"
          git -C "$ROOT" log --all -S'test_rejects_wrong_offset' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -p -- "$TEST_PATH" "$SIG_PATH" \
            > "$OUT_DIR/pickaxe-wrong-offset.patch"
          git -C "$ROOT" log --all -S'VerifyEcdsaMessage' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -p -- "$LIB_PATH" "$TEST_PATH" \
            > "$OUT_DIR/pickaxe-ecdsa.patch"
          git -C "$ROOT" log --all -S'SPACE_FOR_TRUSTED_ECDSA_SIGNERS' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -p -- "$LIB_PATH" \
            > "$OUT_DIR/pickaxe-ecdsa-storage.patch"
          git -C "$ROOT" log --all -G'pyth-lazer-solana-contract' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -- "$CARGO_PATH" "$LOCK_PATH" \
            > "$OUT_DIR/package-history.txt"
      - name: Select deployment-era source candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=pyth-crosschain
          BEFORE_MAIN="$(git -C "$ROOT" rev-list -1 --before="$DEPLOY_TIME" origin/main)"
          AFTER_MAIN="$(git -C "$ROOT" log origin/main --after="$DEPLOY_TIME" --reverse --format='%H' | sed -n '1p')"
          printf '%s\n' "$BEFORE_MAIN" > "$OUT_DIR/MAIN_BEFORE_DEPLOY.txt"
          printf '%s\n' "$AFTER_MAIN" > "$OUT_DIR/MAIN_AFTER_DEPLOY.txt"

          git -C "$ROOT" log --all --until="$DEPLOY_TIME" --date=iso-strict \
            --format='%H%x09%aI%x09%s' -- "$LIB_PATH" "$SIG_PATH" "$CARGO_PATH" \
            > "$OUT_DIR/PATH_COMMITS_BEFORE_DEPLOY.tsv"
          sed -n '1,30p' "$OUT_DIR/PATH_COMMITS_BEFORE_DEPLOY.tsv" > "$OUT_DIR/TOP30_PATH_CANDIDATES.tsv"

          mkdir -p "$OUT_DIR/candidates"
          {
            printf '%s\n' "$BEFORE_MAIN"
            cut -f1 "$OUT_DIR/TOP30_PATH_CANDIDATES.tsv"
            printf '%s\n' 2efd5455ece38de57227108f27b20702574c2978
            printf '%s\n' 4e10ebe046608f5c864e7ea656c50d29fed6107b
          } | awk 'NF && !seen[$0]++' > "$OUT_DIR/CANDIDATE_COMMITS.txt"

          while IFS= read -r commit; do
            dir="$OUT_DIR/candidates/$commit"
            mkdir -p "$dir"
            git -C "$ROOT" show -s --format='%H%n%aI%n%an%n%s' "$commit" > "$dir/COMMIT.txt"
            for path in "$LIB_PATH" "$SIG_PATH" "$TEST_PATH" "$CARGO_PATH" "$LOCK_PATH"; do
              name="$(basename "$path")"
              case "$path" in
                "$LIB_PATH") name=lib.rs ;;
                "$SIG_PATH") name=signature.rs ;;
                "$TEST_PATH") name=test1.rs ;;
                "$CARGO_PATH") name=program-Cargo.toml ;;
                "$LOCK_PATH") name=solana-Cargo.lock ;;
              esac
              git -C "$ROOT" show "$commit:$path" > "$dir/$name" 2> "$dir/$name.error.txt" || true
              test -s "$dir/$name.error.txt" || rm -f "$dir/$name.error.txt"
            done
            if [ -s "$dir/program-Cargo.toml" ]; then
              awk -F' *= *' '/^version *=/{gsub(/"/,"",$2); print $2; exit}' "$dir/program-Cargo.toml" > "$dir/VERSION.txt"
            fi
            find "$dir" -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$dir/SHA256SUMS"
          done < "$OUT_DIR/CANDIDATE_COMMITS.txt"
      - name: Produce machine-readable candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$OUT_DIR" python - <<'PY'
          import json, os, re
          from pathlib import Path
          out=Path(os.environ['OUT_DIR'])
          rows=[]
          for commit in (out/'CANDIDATE_COMMITS.txt').read_text().split():
              d=out/'candidates'/commit
              meta=(d/'COMMIT.txt').read_text().splitlines() if (d/'COMMIT.txt').exists() else []
              lib=(d/'lib.rs').read_text(errors='replace') if (d/'lib.rs').exists() else ''
              sig=(d/'signature.rs').read_text(errors='replace') if (d/'signature.rs').exists() else ''
              tests=(d/'test1.rs').read_text(errors='replace') if (d/'test1.rs').exists() else ''
              cargo=(d/'program-Cargo.toml').read_text(errors='replace') if (d/'program-Cargo.toml').exists() else ''
              version=None
              m=re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M)
              if m: version=m.group(1)
              rows.append({
                  'commit':commit,
                  'author_date':meta[1] if len(meta)>1 else None,
                  'subject':meta[3] if len(meta)>3 else None,
                  'crate_version':version,
                  'has_expected_message_binding':'expected_message_data' in sig and 'slice_eq(expected_message_data, message_data)' in sig,
                  'has_wrong_offset_regression':'test_rejects_wrong_offset' in tests,
                  'has_ecdsa_verifier':'VerifyEcdsaMessage' in lib or 'verify_ecdsa_message' in lib,
                  'has_ecdsa_storage':'SPACE_FOR_TRUSTED_ECDSA_SIGNERS' in lib,
                  'program_id_present':'pytd2yyk641x7ak7mkaasSJVXh6YYZnC7wTmtgAyxPt' in lib,
                  'storage_id_present':'3rdJbqfnagQ4yx9HXJViD4zc4xpiSqmFsKpPuSCQVyQL' in lib,
              })
          (out/'CANDIDATE_MATRIX.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - name: Finalize integrity evidence
        if: always()
        shell: bash
        run: |
          set +e
          {
            git --version
            uname -a
          } > "$OUT_DIR/ENVIRONMENT.txt" 2>&1
          find "$OUT_DIR" -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT_DIR/SHA256SUMS"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-crosschain-solana-history-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
