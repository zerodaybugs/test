name: Private Pyth Entropy slot-alias PoC v2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-entropy-slot-alias-poc-v2-20260730.yml'
      - 'research/pyth/EntropySlotAliasPoC.t.sol'

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout private PoC harness
        uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact public Pyth source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: 56edfe66a3369a1e367c13cae627011a0abda839
          path: upstream
          persist-credentials: false
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v0.3.0

      - name: Assemble isolated exact-source Foundry project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p poc/src poc/test poc/node_modules/@pythnetwork evidence/provenance

          cp upstream/target_chains/ethereum/contracts/contracts/entropy/*.sol poc/src/
          cp runner/research/pyth/EntropySlotAliasPoC.t.sol poc/test/
          cp -a upstream/target_chains/ethereum/entropy_sdk/solidity \
            poc/node_modules/@pythnetwork/entropy-sdk-solidity

          mkdir -p /tmp/entropy-npm
          cd /tmp/entropy-npm
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            @openzeppelin/contracts@4.8.1 \
            @openzeppelin/contracts-upgradeable@4.8.1 \
            @nomad-xyz/excessively-safe-call@0.0.1-rc.1
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/entropy-npm/node_modules/@openzeppelin poc/node_modules/
          cp -a /tmp/entropy-npm/node_modules/@nomad-xyz poc/node_modules/

          cat > poc/foundry.toml <<'TOML'
          [profile.default]
          solc_version = '0.8.29'
          evm_version = 'paris'
          optimizer = true
          optimizer_runs = 200
          src = 'src'
          test = 'test'
          libs = ['lib', 'node_modules']
          remappings = [
            'forge-std/=lib/forge-std/src/',
            '@openzeppelin/=node_modules/@openzeppelin/',
            '@nomad-xyz/=node_modules/@nomad-xyz/',
            '@pythnetwork/=node_modules/@pythnetwork/'
          ]
          TOML

          git -C upstream rev-parse HEAD | tee evidence/provenance/upstream.commit.txt
          sha256sum poc/src/*.sol poc/test/EntropySlotAliasPoC.t.sol \
            > evidence/provenance/source.sha256

      - name: Install forge-std
        shell: bash
        working-directory: poc
        run: forge install foundry-rs/forge-std@v1.7.6 --no-git

      - name: Run exact local PoC
        shell: bash
        working-directory: poc
        run: |
          set -o pipefail
          forge test --match-contract EntropySlotAliasPoC -vvvv \
            | tee "$GITHUB_WORKSPACE/evidence/slot-alias-poc.log"
          cp test/EntropySlotAliasPoC.t.sol "$GITHUB_WORKSPACE/evidence/"
          sha256sum "$GITHUB_WORKSPACE/evidence/slot-alias-poc.log" \
            "$GITHUB_WORKSPACE/evidence/EntropySlotAliasPoC.t.sol" \
            > "$GITHUB_WORKSPACE/evidence/SHA256SUMS.txt"

      - name: Upload exact local PoC evidence
        uses: actions/upload-artifact@v4
        with:
          name: pyth-entropy-slot-alias-poc-v2-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
