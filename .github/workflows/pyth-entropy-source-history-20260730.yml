name: Private Pyth Entropy source and history mirror

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-entropy-source-history-20260730.yml'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public Pyth source with history
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: main
          path: upstream
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /target_chains/ethereum/contracts/
            /target_chains/ethereum/entropy_sdk/
            /apps/developer-hub/content/docs/entropy/
            /contract_manager/src/store/contracts/EntropyContracts.json
            /contract_manager/src/store/chains/EvmChains.json
            /contract_manager/scripts/

      - name: Export source, focused history and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/history output/provenance
          git -C upstream rev-parse HEAD > output/provenance/commit.txt
          git -C upstream show -s --format=%cI HEAD > output/provenance/commit-time.txt
          git -C upstream status --short > output/provenance/status.txt
          cp -a upstream/target_chains output/source/
          cp -a upstream/apps/developer-hub/content/docs/entropy output/source/entropy-docs
          cp -a upstream/contract_manager output/source/contract_manager
          git -C upstream log --date=iso-strict --format='%H%x09%aI%x09%s' -- \
            target_chains/ethereum/contracts/contracts/entropy \
            target_chains/ethereum/entropy_sdk \
            > output/history/entropy-commits.tsv
          git -C upstream log -p --follow -- \
            target_chains/ethereum/contracts/contracts/entropy/Entropy.sol \
            > output/history/Entropy.sol.log.patch
          git -C upstream log -p --follow -- \
            target_chains/ethereum/contracts/contracts/entropy/EntropyState.sol \
            > output/history/EntropyState.sol.log.patch
          git -C upstream log -p --follow -- \
            target_chains/ethereum/entropy_sdk/solidity/EntropyStructsV2.sol \
            > output/history/EntropyStructsV2.sol.log.patch
          find output/source -type f -print0 | sort -z | xargs -0 sha256sum \
            > output/provenance/source.sha256
          find output -type f -printf '%P\t%s bytes\n' | sort \
            > output/provenance/FILE_INDEX.txt

      - name: Upload Entropy source/history bundle
        uses: actions/upload-artifact@v4
        with:
          name: pyth-entropy-source-history-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
