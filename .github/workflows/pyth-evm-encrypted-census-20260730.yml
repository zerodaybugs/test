name: Encrypted Pyth EVM Lazer mainnet census

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-evm-encrypted-census-20260730.yml'
      - 'research/pyth_evm_encrypted_census_20260730.py'
      - 'research/pyth_evm_legacy_storage_followup_20260730.py'
      - 'research/pyth_census_recipient_cert_20260730.pem'

permissions:
  contents: read

concurrency:
  group: pyth-evm-encrypted-census-20260730
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current public Pyth deployment store
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/pyth-network/pyth-crosschain.git upstream
          git -C upstream sparse-checkout set --no-cone \
            /contract_manager/src/store/contracts/EvmLazerContracts.json \
            /contract_manager/src/store/chains/EvmChains.json \
            /lazer/contracts/evm/src/PythLazer.sol \
            /lazer/contracts/evm/src/PythLazerLib.sol \
            /lazer/contracts/evm/src/PythLazerStructs.sol

      - name: Execute read-only takeover census
        shell: bash
        run: |
          set -euo pipefail
          python research/pyth_evm_encrypted_census_20260730.py \
            >/tmp/census-status.txt
          grep -qx 'CENSUS_COMPLETE' /tmp/census-status.txt

      - name: Execute legacy signer storage follow-up
        shell: bash
        run: |
          set -euo pipefail
          python research/pyth_evm_legacy_storage_followup_20260730.py \
            >/tmp/legacy-status.txt
          grep -qx 'LEGACY_STORAGE_COMPLETE' /tmp/legacy-status.txt

      - name: Add integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          printf 'Public-chain transactions signed: 0\nPublic-chain transactions broadcast: 0\n' \
            > evidence/READ_ONLY_ATTESTATION.txt
          find evidence -type f \
            ! -name 'FILE_INDEX.txt' \
            ! -name 'SHA256SUMS.txt' \
            -printf '%P\t%s bytes\n' | sort \
            > evidence/FILE_INDEX.txt
          find evidence -type f \
            ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum \
            > evidence/SHA256SUMS.txt
          sha256sum -c evidence/SHA256SUMS.txt

      - name: Encrypt all evidence before upload
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/pyth-evm-census-evidence.tar.gz evidence
          openssl cms -encrypt -binary -aes256 \
            -in /tmp/pyth-evm-census-evidence.tar.gz \
            -out pyth-evm-census-evidence.cms \
            -outform DER \
            research/pyth_census_recipient_cert_20260730.pem
          sha256sum pyth-evm-census-evidence.cms \
            > pyth-evm-census-evidence.cms.sha256
          rm -rf \
            evidence \
            /tmp/pyth-evm-census-evidence.tar.gz \
            /tmp/census-status.txt \
            /tmp/legacy-status.txt
          printf '%s\n' \
            'Encrypted CMS artifact. Recipient certificate SHA-256 fingerprint:' \
            '1D:72:DF:A6:68:61:5E:74:88:F7:F6:BA:5A:11:B1:8A:B6:73:9B:DE:88:98:65:99:25:B8:64:BF:7A:A7:FE:48' \
            > ENCRYPTED_ARTIFACT_README.txt

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-pyth-evm-census-${{ github.run_id }}
          path: |
            pyth-evm-census-evidence.cms
            pyth-evm-census-evidence.cms.sha256
            ENCRYPTED_ARTIFACT_README.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
