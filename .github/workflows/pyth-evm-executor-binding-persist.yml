name: Pyth EVM Executor persistent source binding

on:
  push:
    branches: [research/encrypted-evm-proxy-init-snapshot-20260724]
    paths:
      - '.github/workflows/pyth-evm-executor-binding-persist.yml'
      - 'ci/pyth-evm-executor-binding-persist.trigger'

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTH_COMMIT: 4a596e7adff552afaf5687ce791764019f2d3719
      EXECUTOR_PROXY: 0x26dd80569a8b23768a1d80869ed7339e07595e85
      IMPLEMENTATION_SLOT: 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false
      - name: Prepare exact source and pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pyth-crosschain binding_out toolchain
          mkdir -p binding_out toolchain/bin
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          git -C pyth-crosschain show -s --format='%H%n%aI%n%an%n%s' HEAD > binding_out/source-commit.txt
          cd pyth-crosschain
          pnpm install --frozen-lockfile --filter @pythnetwork/pyth-evm-contract...
          cd ..
          curl -fL --retry 5 https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz -o toolchain/foundry.tar.gz
          tar -xzf toolchain/foundry.tar.gz -C toolchain/bin
          curl -fL --retry 5 https://github.com/ethereum/solidity/releases/download/v0.8.29/solc-static-linux -o toolchain/bin/solc-0.8.29
          chmod 0755 toolchain/bin/*
          toolchain/bin/forge --version > binding_out/forge-version.txt
          toolchain/bin/solc-0.8.29 --version > binding_out/solc-version.txt
      - name: Compile exact Executor runtime
        shell: bash
        working-directory: pyth-crosschain/target_chains/ethereum/contracts
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          rm -rf out cache
          forge build --use "$GITHUB_WORKSPACE/toolchain/bin/solc-0.8.29" --skip test -vv 2>&1 | tee "$GITHUB_WORKSPACE/binding_out/forge-build.log"
          cp out/ExecutorUpgradable.sol/ExecutorUpgradable.json "$GITHUB_WORKSPACE/binding_out/ExecutorUpgradable.json"
          test -s "$GITHUB_WORKSPACE/binding_out/ExecutorUpgradable.json"
      - name: Compare live BSC runtime after compiler-declared immutable normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path

          out = Path('binding_out')
          proxy = os.environ['EXECUTOR_PROXY'].lower()
          slot = os.environ['IMPLEMENTATION_SLOT']
          providers = [
              'https://bsc-dataseed.binance.org',
              'https://bsc-rpc.publicnode.com',
              'https://bsc-dataseed.bnbchain.org',
          ]

          def rpc(url, method, params, request_id):
              payload = json.dumps({'jsonrpc':'2.0','id':request_id,'method':method,'params':params}).encode()
              errors = []
              for attempt in range(4):
                  req = urllib.request.Request(url, data=payload, headers={'content-type':'application/json','accept':'application/json','user-agent':'pyth-readonly-binding/6.0'})
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          obj = json.load(response)
                      if 'error' in obj:
                          raise RuntimeError(obj['error'])
                      return obj['result']
                  except Exception as exc:
                      errors.append(repr(exc))
                      if attempt < 3:
                          time.sleep(1 + attempt)
              raise RuntimeError({'rpc':url,'method':method,'errors':errors})

          artifact = json.loads((out/'ExecutorUpgradable.json').read_text())
          compiled = bytes.fromhex(artifact['deployedBytecode']['object'].removeprefix('0x'))
          immutable_refs = sorted([
              {'start':int(ref['start']), 'length':int(ref['length'])}
              for refs in artifact['deployedBytecode'].get('immutableReferences', {}).values()
              for ref in refs
          ], key=lambda item:(item['start'], item['length']))

          def strip_cbor(data):
              if len(data) < 2:
                  return data
              size = int.from_bytes(data[-2:], 'big')
              return data[:-(size+2)] if size + 2 <= len(data) else data

          def zero_immutables(data):
              result = bytearray(data)
              for ref in immutable_refs:
                  start, length = ref['start'], ref['length']
                  if start + length > len(result):
                      raise ValueError({'immutable_reference':ref,'runtime_length':len(result)})
                  result[start:start+length] = bytes(length)
              return bytes(result)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          rows, failures = [], []
          for index, url in enumerate(providers):
              try:
                  impl_word = rpc(url, 'eth_getStorageAt', [proxy, slot, 'latest'], 100+index*10)
                  implementation = '0x' + impl_word[-40:]
                  runtime_hex = rpc(url, 'eth_getCode', [implementation, 'latest'], 101+index*10).lower()
                  proxy_hex = rpc(url, 'eth_getCode', [proxy, 'latest'], 102+index*10).lower()
                  block = rpc(url, 'eth_getBlockByNumber', ['latest', False], 103+index*10)
                  version_raw = rpc(url, 'eth_call', [{'to':proxy,'data':'0x54fd4d50'}, 'latest'], 104+index*10)
                  runtime = bytes.fromhex(runtime_hex.removeprefix('0x'))
                  values = ['0x'+runtime[r['start']:r['start']+r['length']].hex() for r in immutable_refs]
                  rows.append({'rpc':url,'implementation':implementation.lower(),'implementation_code_hex':runtime_hex,'proxy_code_hex':proxy_hex,'latest_block':block,'version_raw':version_raw,'runtime_bytes':len(runtime),'runtime_sha256':sha(runtime),'immutable_values':values,'normalized_full_sha256':sha(zero_immutables(runtime)),'normalized_stripped_sha256':sha(strip_cbor(zero_immutables(runtime)))})
              except Exception as exc:
                  failures.append({'rpc':url,'error':repr(exc)})

          if len(rows) < 2:
              raise RuntimeError({'successful_provider_count':len(rows),'provider_failures':failures})

          compiled_zero = zero_immutables(compiled)
          providers_identical = len({r['implementation'] for r in rows}) == 1 and len({r['implementation_code_hex'] for r in rows}) == 1 and len({r['proxy_code_hex'] for r in rows}) == 1
          immutables_match_impl = all(all((int(value,16) & ((1<<160)-1)) == int(row['implementation'],16) for value in row['immutable_values']) for row in rows)
          full_match = all(zero_immutables(bytes.fromhex(r['implementation_code_hex'][2:])) == compiled_zero for r in rows)
          stripped_match = all(strip_cbor(zero_immutables(bytes.fromhex(r['implementation_code_hex'][2:]))) == strip_cbor(compiled_zero) for r in rows)

          result = {'mode':'BSC_READ_ONLY_ETH_GETSTORAGEAT_ETH_GETCODE_ETH_CALL','signed_or_broadcast_transactions':0,'source_commit':os.environ['PYTH_COMMIT'],'executor_proxy':proxy,'immutable_references':immutable_refs,'successful_provider_count':len(rows),'provider_failures':failures,'compiled_runtime_bytes':len(compiled),'compiled_runtime_sha256':sha(compiled),'compiled_normalized_full_sha256':sha(compiled_zero),'compiled_normalized_stripped_sha256':sha(strip_cbor(compiled_zero)),'providers_identical':providers_identical,'immutable_values_are_live_implementation':immutables_match_impl,'full_normalized_runtime_match':full_match,'cbor_stripped_normalized_runtime_match':stripped_match,'rows':rows}
          (out/'SOURCE_DEPLOYMENT_BINDING.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          markers = ['PYTH_EVM_EXECUTOR_IMMUTABLE_AWARE_BINDING_CAPTURED','PUBLIC_CHAIN_MODE=READ_ONLY','SIGNED_OR_BROADCAST_TRANSACTIONS=0',f"SUCCESSFUL_PROVIDER_COUNT={len(rows)}",f"PROVIDERS_IDENTICAL={str(providers_identical).lower()}",f"IMMUTABLE_VALUES_ARE_LIVE_IMPLEMENTATION={str(immutables_match_impl).lower()}",f"FULL_NORMALIZED_RUNTIME_MATCH={str(full_match).lower()}",f"CBOR_STRIPPED_NORMALIZED_RUNTIME_MATCH={str(stripped_match).lower()}",f"EXECUTOR_IMPLEMENTATION={rows[0]['implementation']}"]
          (out/'BINDING_MARKERS.txt').write_text('\n'.join(markers)+'\n')
          print('\n'.join(markers))
          PY
      - name: Finalize, enforce, and persist evidence
        shell: bash
        run: |
          set -euo pipefail
          find binding_out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > binding_out/SHA256SUMS
          grep -F 'SIGNED_OR_BROADCAST_TRANSACTIONS=0' binding_out/BINDING_MARKERS.txt
          grep -F 'PROVIDERS_IDENTICAL=true' binding_out/BINDING_MARKERS.txt
          grep -F 'IMMUTABLE_VALUES_ARE_LIVE_IMPLEMENTATION=true' binding_out/BINDING_MARKERS.txt
          grep -F 'CBOR_STRIPPED_NORMALIZED_RUNTIME_MATCH=true' binding_out/BINDING_MARKERS.txt
          DEST=evidence/pyth-evm-executor-binding/latest
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp binding_out/BINDING_MARKERS.txt binding_out/SOURCE_DEPLOYMENT_BINDING.json binding_out/SHA256SUMS binding_out/source-commit.txt "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Record exact Pyth EVM Executor source binding'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-evm-executor-persistent-binding-${{ github.run_id }}
          path: binding_out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
