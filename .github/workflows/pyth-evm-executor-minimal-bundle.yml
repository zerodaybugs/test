name: Pyth EVM Executor minimal exact bundle

on:
  push:
    paths:
      - '.github/workflows/pyth-evm-executor-minimal-bundle.yml'
      - 'ci/pyth-evm-executor-minimal-bundle.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-evm-executor-minimal-bundle.yml'
      - 'ci/pyth-evm-executor-minimal-bundle.trigger'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTH_COMMIT: 4a596e7adff552afaf5687ce791764019f2d3719
      EXECUTOR_PROXY: 0x26dd80569a8b23768a1d80869ed7339e07595e85
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false
      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR" pyth-crosschain toolchain
          mkdir -p "$OUT_DIR" toolchain/bin
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "source_commit=${PYTH_COMMIT}"
            echo "executor_proxy=${EXECUTOR_PROXY}"
            echo "mode=read-only BSC RPC"
            echo "signed_or_broadcast_transactions=0"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          } > "$OUT_DIR/PROVENANCE.txt"
      - name: Install pinned Foundry and solc
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz \
            -o toolchain/foundry.tar.gz
          tar -xzf toolchain/foundry.tar.gz -C toolchain/bin
          curl -fL --retry 5 \
            https://github.com/ethereum/solidity/releases/download/v0.8.29/solc-static-linux \
            -o toolchain/bin/solc-0.8.29
          chmod 0755 toolchain/bin/*
          toolchain/bin/forge --version | tee "$OUT_DIR/forge-version.txt"
          toolchain/bin/solc-0.8.29 --version | tee "$OUT_DIR/solc-version.txt"
          sha256sum toolchain/bin/* > "$OUT_DIR/toolchain-sha256.txt"
      - name: Fetch exact Pyth source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          git -C pyth-crosschain status --porcelain=v1 > "$OUT_DIR/source-status.txt"
          test ! -s "$OUT_DIR/source-status.txt"
          git -C pyth-crosschain show -s --format='%H%n%aI%n%an%n%s' HEAD > "$OUT_DIR/source-commit.txt"
          cd pyth-crosschain
          pnpm install --frozen-lockfile --filter @pythnetwork/pyth-evm-contract...
      - name: Compile exact Executor runtime
        shell: bash
        working-directory: pyth-crosschain/target_chains/ethereum/contracts
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          rm -rf out cache
          forge build --use "$GITHUB_WORKSPACE/toolchain/bin/solc-0.8.29" --skip test -vv \
            2>&1 | tee "$OUT_DIR/forge-build.log"
          cp out/ExecutorUpgradable.sol/ExecutorUpgradable.json "$OUT_DIR/ExecutorUpgradable.json"
          test -s "$OUT_DIR/ExecutorUpgradable.json"
      - name: Run immutable-aware live source binding
        shell: bash
        run: |
          set +e
          python tools/pyth_evm_executor_binding.py \
            --artifact "$OUT_DIR/ExecutorUpgradable.json" \
            --proxy "$EXECUTOR_PROXY" \
            --out "$OUT_DIR" \
            > "$OUT_DIR/binding-console.log" 2>&1
          rc=$?
          cat "$OUT_DIR/binding-console.log"
          echo "$rc" > "$OUT_DIR/binding-exit-code.txt"
          exit 0
      - name: Preserve exact focused source and finalize manifest
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$OUT_DIR/source/contracts/executor" "$OUT_DIR/source/contracts/pyth" \
            "$OUT_DIR/source/contracts/wormhole/interfaces"
          cp pyth-crosschain/target_chains/ethereum/contracts/contracts/executor/{Executor.sol,ExecutorUpgradable.sol,ExecutorErrors.sol} \
            "$OUT_DIR/source/contracts/executor/" 2>/dev/null || true
          cp pyth-crosschain/target_chains/ethereum/contracts/contracts/pyth/{PythGovernanceInstructions.sol,PythInternalStructs.sol} \
            "$OUT_DIR/source/contracts/pyth/" 2>/dev/null || true
          cp pyth-crosschain/target_chains/ethereum/contracts/contracts/wormhole/{Structs.sol,Messages.sol} \
            "$OUT_DIR/source/contracts/wormhole/" 2>/dev/null || true
          cp pyth-crosschain/target_chains/ethereum/contracts/contracts/wormhole/interfaces/IWormhole.sol \
            "$OUT_DIR/source/contracts/wormhole/interfaces/" 2>/dev/null || true
          cp tools/pyth_evm_executor_binding.py "$OUT_DIR/"
          {
            uname -a
            git --version
            node --version
            pnpm --version
            toolchain/bin/forge --version
            toolchain/bin/solc-0.8.29 --version
          } > "$OUT_DIR/ENVIRONMENT.txt" 2>&1
          find "$OUT_DIR" -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT_DIR/SHA256SUMS"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-evm-executor-robust-binding-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Enforce binding result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT_DIR/binding-exit-code.txt"
          test "$(cat "$OUT_DIR/binding-exit-code.txt")" = '0'
          grep -F 'PROVIDERS_IDENTICAL=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'IMPLEMENTATION_NONZERO=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'IMPLEMENTATION_RUNTIME_NONEMPTY=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'IMMUTABLE_VALUES_ARE_LIVE_IMPLEMENTATION=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'CBOR_STRIPPED_NORMALIZED_RUNTIME_MATCH=true' "$OUT_DIR/BINDING_MARKERS.txt"
          grep -F 'SIGNED_OR_BROADCAST_TRANSACTIONS=0' "$OUT_DIR/BINDING_MARKERS.txt"
      - name: Persist successful binding on trigger branch
        if: ${{ success() && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          DEST=evidence/pyth-evm-executor-binding/latest
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$OUT_DIR/BINDING_MARKERS.txt" "$OUT_DIR/SOURCE_DEPLOYMENT_BINDING.json" \
            "$OUT_DIR/SHA256SUMS" "$OUT_DIR/source-commit.txt" "$OUT_DIR/binding-console.log" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Record exact Pyth EVM Executor source binding'
          git push origin "HEAD:${GITHUB_REF_NAME}"
