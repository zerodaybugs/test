name: Pyth EVM in-scope exact source bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-evm-inscope-source-bundle.yml'
      - 'ci/pyth-evm-inscope-source-bundle.trigger'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTH_COMMIT: 4a596e7adff552afaf5687ce791764019f2d3719
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pyth-crosschain stage out
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          mkdir -p stage/pyth-crosschain/target_chains/ethereum/contracts/contracts
          cp -a pyth-crosschain/target_chains/ethereum/contracts/contracts/pyth stage/pyth-crosschain/target_chains/ethereum/contracts/contracts/
          cp -a pyth-crosschain/target_chains/ethereum/contracts/contracts/wormhole stage/pyth-crosschain/target_chains/ethereum/contracts/contracts/
          cp -a pyth-crosschain/target_chains/ethereum/contracts/contracts/libraries stage/pyth-crosschain/target_chains/ethereum/contracts/contracts/
          cp -a pyth-crosschain/target_chains/ethereum/contracts/contracts/PythUpgradable.sol stage/pyth-crosschain/target_chains/ethereum/contracts/contracts/ || true
          cp -a pyth-crosschain/target_chains/ethereum/contracts/contracts/PythUpgradableWithCustomAddresses.sol stage/pyth-crosschain/target_chains/ethereum/contracts/contracts/ || true
          mkdir -p stage/pyth-crosschain/target_chains/ethereum/sdk
          cp -a pyth-crosschain/target_chains/ethereum/sdk/solidity stage/pyth-crosschain/target_chains/ethereum/sdk/
          cp pyth-crosschain/target_chains/ethereum/contracts/foundry.toml stage/pyth-crosschain/target_chains/ethereum/contracts/
          cp pyth-crosschain/target_chains/ethereum/contracts/remappings.txt stage/pyth-crosschain/target_chains/ethereum/contracts/
          printf '%s\n' "$PYTH_COMMIT" > stage/pyth-crosschain/SOURCE_COMMIT.txt
          git -C pyth-crosschain show -s --format='%H%n%aI%n%an%n%s' HEAD > stage/pyth-crosschain/SOURCE_COMMIT_METADATA.txt
      - name: Build integrity artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find stage -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/CONTENT_SHA256SUMS
          tar -C stage -czf out/pyth-evm-inscope-exact-source-${PYTH_COMMIT}.tar.gz pyth-crosschain
          sha256sum out/*.tar.gz > out/ARCHIVE_SHA256.txt
          tar -tzf out/pyth-evm-inscope-exact-source-${PYTH_COMMIT}.tar.gz | LC_ALL=C sort > out/ARCHIVE_FILE_LIST.txt
          { git --version; uname -a; } > out/ENVIRONMENT.txt
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-evm-inscope-exact-source-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
