name: Pyth EVM exact source and dependency bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-evm-source-deps-bundle.yml'
  push:
    branches: [research/encrypted-evm-proxy-init-snapshot-20260724]
    paths:
      - '.github/workflows/pyth-evm-source-deps-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTH_COMMIT: 4a596e7adff552afaf5687ce791764019f2d3719
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false
      - name: Fetch exact source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pyth-crosschain out
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          git -C pyth-crosschain status --porcelain=v1 > source-status.txt
          test ! -s source-status.txt
          cd pyth-crosschain
          pnpm install --frozen-lockfile --filter @pythnetwork/pyth-evm-contract...
          cd ..
      - name: Build portable exact-layout bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s\n' "$PYTH_COMMIT" > pyth-crosschain/SOURCE_COMMIT.txt
          git -C pyth-crosschain show -s --format='%H%n%aI%n%an%n%s' HEAD > pyth-crosschain/SOURCE_COMMIT_METADATA.txt
          {
            echo '--- root node_modules ---'
            du -sh pyth-crosschain/node_modules || true
            echo '--- package node_modules ---'
            find pyth-crosschain/target_chains/ethereum/contracts pyth-crosschain/lazer/contracts/evm \
              -maxdepth 2 -type d -name node_modules -print -exec du -sh {} \; || true
            echo '--- relevant dependency links ---'
            find pyth-crosschain -maxdepth 6 \( -path '*/node_modules/@openzeppelin*' -o -path '*/node_modules/@pythnetwork*' \) \
              -printf '%y %p -> %l\n' | LC_ALL=C sort | head -n 2000
          } > out/DEPENDENCY_LAYOUT.txt
          tar --exclude='pyth-crosschain/.git' --exclude='*/node_modules/.cache' \
            -C . -czf out/pyth-evm-exact-source-deps-${PYTH_COMMIT}.tar.gz pyth-crosschain
          sha256sum out/*.tar.gz > out/ARCHIVE_SHA256.txt
          tar -tzf out/pyth-evm-exact-source-deps-${PYTH_COMMIT}.tar.gz \
            | LC_ALL=C sort > out/ARCHIVE_FILE_LIST.txt
          {
            node --version
            pnpm --version
            git --version
            uname -a
          } > out/ENVIRONMENT.txt
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-evm-exact-source-deps-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
