name: Pyth EVM exact source and dependency bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-evm-source-deps-bundle.yml'
  push:
    branches: [research/encrypted-evm-proxy-init-snapshot-20260724]
    paths:
      - '.github/workflows/pyth-evm-source-deps-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTH_COMMIT: 4a596e7adff552afaf5687ce791764019f2d3719
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Pyth source and pinned Lazer submodules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pyth-crosschain out stage
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          git -C pyth-crosschain submodule update --init --depth 1 \
            lazer/contracts/evm/lib/openzeppelin-contracts \
            lazer/contracts/evm/lib/openzeppelin-contracts-upgradeable
          git -C pyth-crosschain status --porcelain=v1 > source-status.txt
          test ! -s source-status.txt
      - name: Build focused portable exact-layout bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT=stage/pyth-crosschain
          mkdir -p out "$ROOT/lazer/contracts/evm/lib" \
            "$ROOT/target_chains/ethereum/contracts/contracts" \
            "$ROOT/target_chains/ethereum/sdk/solidity"

          cp -a pyth-crosschain/lazer/contracts/evm/src "$ROOT/lazer/contracts/evm/"
          cp pyth-crosschain/lazer/contracts/evm/foundry.toml \
             pyth-crosschain/lazer/contracts/evm/foundry.lock \
             pyth-crosschain/lazer/contracts/evm/remappings.txt \
             "$ROOT/lazer/contracts/evm/"
          cp -a pyth-crosschain/lazer/contracts/evm/lib/openzeppelin-contracts \
             "$ROOT/lazer/contracts/evm/lib/"
          cp -a pyth-crosschain/lazer/contracts/evm/lib/openzeppelin-contracts-upgradeable \
             "$ROOT/lazer/contracts/evm/lib/"

          for rel in \
            executor/Executor.sol \
            executor/ExecutorErrors.sol \
            executor/ExecutorUpgradable.sol \
            pyth/PythGovernanceInstructions.sol \
            pyth/PythInternalStructs.sol \
            libraries/external/BytesLib.sol \
            wormhole/Structs.sol \
            wormhole/interfaces/IWormhole.sol; do
            mkdir -p "$ROOT/target_chains/ethereum/contracts/contracts/$(dirname "$rel")"
            cp "pyth-crosschain/target_chains/ethereum/contracts/contracts/$rel" \
               "$ROOT/target_chains/ethereum/contracts/contracts/$rel"
          done
          cp pyth-crosschain/target_chains/ethereum/contracts/foundry.toml \
             pyth-crosschain/target_chains/ethereum/contracts/remappings.txt \
             "$ROOT/target_chains/ethereum/contracts/"
          cp pyth-crosschain/target_chains/ethereum/sdk/solidity/PythErrors.sol \
             "$ROOT/target_chains/ethereum/sdk/solidity/"

          printf '%s\n' "$PYTH_COMMIT" > "$ROOT/SOURCE_COMMIT.txt"
          git -C pyth-crosschain show -s --format='%H%n%aI%n%an%n%s' HEAD > "$ROOT/SOURCE_COMMIT_METADATA.txt"
          git -C pyth-crosschain submodule status \
            lazer/contracts/evm/lib/openzeppelin-contracts \
            lazer/contracts/evm/lib/openzeppelin-contracts-upgradeable \
            > "$ROOT/SUBMODULE_STATUS.txt"

          tar -C stage -czf out/pyth-evm-focused-exact-source-${PYTH_COMMIT}.tar.gz pyth-crosschain
          sha256sum out/*.tar.gz > out/ARCHIVE_SHA256.txt
          tar -tzf out/pyth-evm-focused-exact-source-${PYTH_COMMIT}.tar.gz \
            | LC_ALL=C sort > out/ARCHIVE_FILE_LIST.txt
          find stage -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/CONTENT_SHA256SUMS
          {
            git --version
            uname -a
          } > out/ENVIRONMENT.txt
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-evm-focused-exact-source-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
