name: Pyth EVM exact source and dependency bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-evm-source-deps-bundle.yml'
  push:
    branches: [research/encrypted-evm-proxy-init-snapshot-20260724]
    paths:
      - '.github/workflows/pyth-evm-source-deps-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTH_COMMIT: 4a596e7adff552afaf5687ce791764019f2d3719
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false
      - name: Fetch exact source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pyth-crosschain out stage
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-crosschain.git pyth-crosschain
          git -C pyth-crosschain fetch --depth 1 origin "$PYTH_COMMIT"
          git -C pyth-crosschain checkout --detach "$PYTH_COMMIT"
          test "$(git -C pyth-crosschain rev-parse HEAD)" = "$PYTH_COMMIT"
          git -C pyth-crosschain status --porcelain=v1 > source-status.txt
          test ! -s source-status.txt
          cd pyth-crosschain
          pnpm install --frozen-lockfile --filter @pythnetwork/pyth-evm-contract...
          cd ..
      - name: Build portable focused bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out stage/pyth-crosschain
          cp -a pyth-crosschain/target_chains/ethereum/contracts stage/pyth-crosschain/target_chains-ethereum-contracts
          cp -a pyth-crosschain/lazer/contracts/evm stage/pyth-crosschain/lazer-evm
          mkdir -p stage/pyth-crosschain/node_modules/@openzeppelin stage/pyth-crosschain/node_modules/@pythnetwork
          cp -aL pyth-crosschain/node_modules/@openzeppelin/contracts stage/pyth-crosschain/node_modules/@openzeppelin/
          cp -aL pyth-crosschain/node_modules/@openzeppelin/contracts-upgradeable stage/pyth-crosschain/node_modules/@openzeppelin/
          cp -aL pyth-crosschain/node_modules/@pythnetwork/pyth-sdk-solidity stage/pyth-crosschain/node_modules/@pythnetwork/
          cp pyth-crosschain/package.json pyth-crosschain/pnpm-lock.yaml pyth-crosschain/pnpm-workspace.yaml stage/pyth-crosschain/
          printf '%s\n' "$PYTH_COMMIT" > stage/pyth-crosschain/SOURCE_COMMIT.txt
          git -C pyth-crosschain show -s --format='%H%n%aI%n%an%n%s' HEAD > stage/pyth-crosschain/SOURCE_COMMIT_METADATA.txt
          tar -C stage -czf out/pyth-evm-exact-source-deps-${PYTH_COMMIT}.tar.gz pyth-crosschain
          sha256sum out/*.tar.gz > out/ARCHIVE_SHA256.txt
          find stage -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/CONTENT_SHA256SUMS
          {
            node --version
            pnpm --version
            git --version
            uname -a
          } > out/ENVIRONMENT.txt
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-evm-exact-source-deps-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
