name: Pyth Flow read-only deployment census

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-flow-deployment-census-20260729.yml'
      - 'public_tools/pyth_flow_deployment_census.py'

permissions:
  contents: read

concurrency:
  group: pyth-flow-deployment-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Keccak implementation and patch the portable census
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input pycryptodome
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public_tools/pyth_flow_deployment_census.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import subprocess\n', 'from Crypto.Hash import keccak\n')
          old_selector = '''def selector(signature: str) -> str:\n    proc = subprocess.run(\n        ["openssl", "dgst", "-keccak-256"],\n        input=signature.encode(),\n        stdout=subprocess.PIPE,\n        check=True,\n    )\n    digest = proc.stdout.decode().strip().split("=")[-1].strip()\n    return "0x" + digest[:8]\n'''
          new_selector = '''def selector(signature: str) -> str:\n    digest = keccak.new(digest_bits=256)\n    digest.update(signature.encode())\n    return "0x" + digest.hexdigest()[:8]\n'''
          old_hash = '''def keccak_hex(hex_data: str) -> str | None:\n    if not hex_data or hex_data == "0x":\n        return None\n    raw = bytes.fromhex(hex_data.removeprefix("0x"))\n    proc = subprocess.run(\n        ["openssl", "dgst", "-keccak-256"],\n        input=raw,\n        stdout=subprocess.PIPE,\n        check=True,\n    )\n    return "0x" + proc.stdout.decode().strip().split("=")[-1].strip()\n'''
          new_hash = '''def keccak_hex(hex_data: str) -> str | None:\n    if not hex_data or hex_data == "0x":\n        return None\n    digest = keccak.new(digest_bits=256)\n    digest.update(bytes.fromhex(hex_data.removeprefix("0x")))\n    return "0x" + digest.hexdigest()\n'''
          assert text.count(old_selector) == 1
          assert text.count(old_hash) == 1
          path.write_text(
              text.replace(old_selector, new_selector).replace(old_hash, new_hash),
              encoding='utf-8',
          )
          PY

      - name: Run two-provider read-only census
        shell: bash
        run: |
          set -euo pipefail
          python3 public_tools/pyth_flow_deployment_census.py

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f -printf '%P\t%s bytes\n' | sort > evidence/FILE_INDEX.txt
          (
            cd evidence
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyth-flow-deployment-census-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
