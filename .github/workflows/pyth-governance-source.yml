name: Pyth governance source bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyth-governance-source.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive pinned public source
        run: |
          set -euo pipefail
          GOV_COMMIT=68a9a36ec3d41364490e71b056b422c99f13e0cf
          AUDIT_COMMIT=$(git ls-remote https://github.com/pyth-network/audit-reports.git refs/heads/main | cut -f1)
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/governance.git governance
          git -C governance checkout "$GOV_COMMIT"
          test "$(git -C governance rev-parse HEAD)" = "$GOV_COMMIT"
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/audit-reports.git audit-reports
          git -C audit-reports checkout "$AUDIT_COMMIT"
          rm -rf governance/.git audit-reports/.git
          printf '%s\n' "$GOV_COMMIT" > GOVERNANCE_COMMIT.txt
          printf '%s\n' "$AUDIT_COMMIT" > AUDIT_COMMIT.txt
          tar -czf pyth-governance-source.tar.gz governance audit-reports GOVERNANCE_COMMIT.txt AUDIT_COMMIT.txt
          sha256sum pyth-governance-source.tar.gz > ARCHIVE_SHA256.txt
          find governance/staking -type f -print0 | sort -z | xargs -0 sha256sum > STAKING_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-governance-source
          retention-days: 7
          compression-level: 0
          path: |
            pyth-governance-source.tar.gz
            ARCHIVE_SHA256.txt
            STAKING_SHA256SUMS
            GOVERNANCE_COMMIT.txt
            AUDIT_COMMIT.txt
