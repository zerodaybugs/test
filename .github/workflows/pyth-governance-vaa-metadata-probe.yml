name: Pyth governance VAA metadata probe

on:
  workflow_dispatch:
  push:
    branches: [infra/pyth-cardano-vaa-inventory-20260723]
    paths:
      - '.github/workflows/pyth-governance-vaa-metadata-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-governance-vaa-metadata-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EMITTER_HEX: 5635979a221c34931e32620b9293a463065555ea71fe97cd6237ade875b12e9e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture public list endpoint metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/probe.py <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          emitter=os.environ['EMITTER_HEX'].lower()
          out=Path('out')
          urls=[
            f'https://api.wormholescan.io/api/v1/vaas/1/{emitter}?pageSize=1000&sortOrder=ASC',
            f'https://api.wormholescan.io/api/v1/vaas/1/{emitter}?pageSize=1000',
            f'https://api.wormholescan.io/api/v1/vaas?emitterChain=1&emitterAddr={emitter}&pageSize=1000&sortOrder=ASC',
            f'https://api.wormholescan.io/api/v1/operations?emitterChain=1&emitterAddress={emitter}&pageSize=1000',
          ]
          summary=[]
          for index,url in enumerate(urls):
            req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'read-only-governance-metadata-probe/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                body=r.read(); status=r.status; headers=dict(r.headers)
              (out/f'response-{index}.json').write_bytes(body)
              try:
                obj=json.loads(body)
                if isinstance(obj,dict):
                  keys=sorted(obj.keys())
                  data=obj.get('data')
                  data_type=type(data).__name__
                  data_len=len(data) if isinstance(data,list) else None
                  first=data[0] if isinstance(data,list) and data else None
                else:
                  keys=[]; data_type=type(obj).__name__; data_len=len(obj) if isinstance(obj,list) else None; first=obj[0] if isinstance(obj,list) and obj else None
                summary.append({'url':url,'status':status,'keys':keys,'data_type':data_type,'data_len':data_len,'first_item':first})
              except Exception as exc:
                summary.append({'url':url,'status':status,'json_error':repr(exc),'bytes':len(body)})
            except urllib.error.HTTPError as exc:
              body=exc.read()
              (out/f'response-{index}-http-{exc.code}.txt').write_bytes(body)
              summary.append({'url':url,'http_error':exc.code,'body_prefix':body[:500].decode('utf-8','replace')})
            except Exception as exc:
              summary.append({'url':url,'error':repr(exc)})
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2,default=str)+'\n')
          print(json.dumps(summary,indent=2,default=str))
          if not any(item.get('status') == 200 for item in summary):
            raise SystemExit('no list endpoint returned HTTP 200')
          PY
          python /tmp/probe.py | tee out/console.log
          find out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-governance-vaa-metadata-probe-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
