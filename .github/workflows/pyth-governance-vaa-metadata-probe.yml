name: Pyth governance VAA metadata probe

on:
  workflow_dispatch:
  push:
    branches: [infra/pyth-cardano-vaa-inventory-20260723]
    paths:
      - '.github/workflows/pyth-governance-vaa-metadata-probe.yml'
      - 'tools/pyth_vaa_metadata_probe.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-governance-vaa-metadata-probe.yml'
      - 'tools/pyth_vaa_metadata_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EMITTER_HEX: 5635979a221c34931e32620b9293a463065555ea71fe97cd6237ade875b12e9e
      OUT_DIR: out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture paginated metadata, production bursts, and selected Solana transactions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/pyth_vaa_metadata_probe.py | tee out/console.log
          {
            echo 'VAA_METADATA_PAGINATION_PASS'
            jq -r '"TOTAL_ITEMS=" + (.total_items|tostring)' out/SUMMARY.json
            jq -r '"MAX_SEQUENCE=" + (.max_sequence|tostring)' out/SUMMARY.json
            jq -r '"RAPID_CONSECUTIVE_BURST_COUNT=" + (.rapid_consecutive_burst_count|tostring)' out/SUMMARY.json
            jq -r '"LARGEST_BURST_COUNT=" + (.largest_burst_count|tostring)' out/SUMMARY.json
            jq -r '"SELECTED_TRANSACTION_COMMON_ACCOUNT_COUNT=" + (.selected_transaction_common_accounts|length|tostring)' out/SUMMARY.json
          } | tee out/PASS_MARKERS.txt
          find out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-governance-vaa-metadata-probe-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
