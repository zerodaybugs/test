name: Pyth public governance VAA API probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-governance-vaa-probe-20260729.yml'
      - 'public_tools/pyth_governance_vaa_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Probe public Wormholescan VAA endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 public_tools/pyth_governance_vaa_probe.py

      - name: Build manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence-vaa-probe -type f -printf '%P\t%s bytes\n' | sort \
            > evidence-vaa-probe/FILE_INDEX.txt
          (
            cd evidence-vaa-probe
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyth-governance-vaa-probe-${{ github.run_id }}
          path: evidence-vaa-probe/
          if-no-files-found: error
          retention-days: 1
