name: Pyth IOTA local tooling bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-iota-local-tooling-20260730.yml'

permissions:
  contents: read

env:
  PYTH_COMMIT: 9425f76fb4504b801dde3dee824bb350c5b0cb98

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned public Pyth source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: ${{ env.PYTH_COMMIT }}
          path: pyth-crosschain
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Export IOTA package and offline crypto wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/wheels output/provenance
          cp -a pyth-crosschain/lazer/contracts/iota output/source/
          rm -rf output/source/iota/build
          python3 -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --dest output/wheels \
            coincurve==21.0.0 pycryptodome==3.23.0
          python3 --version | tee output/provenance/python-version.txt
          (
            cd pyth-crosschain
            git rev-parse HEAD
            git status --short
          ) | tee output/provenance/pyth-git.txt
          find output/source -type f -print0 | sort -z | xargs -0 sha256sum \
            > output/provenance/source.sha256
          find output/wheels -type f -print0 | sort -z | xargs -0 sha256sum \
            > output/provenance/wheels.sha256
          find output -type f -printf '%P\t%s bytes\n' | sort \
            > output/provenance/FILE_INDEX.txt

      - name: Upload local tooling bundle
        uses: actions/upload-artifact@v4
        with:
          name: pyth-iota-local-tooling-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
