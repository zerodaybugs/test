name: Private Pyth Lazer audit reports mirror

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-lazer-audit-reports-20260730.yml'

permissions:
  contents: read

jobs:
  mirror-audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public Zellic Pyth Lazer reports
        uses: actions/checkout@v4
        with:
          repository: Zellic/publications
          ref: master
          path: zellic
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Pyth Lazer EVM - Zellic Audit Report.pdf
            /Pyth Lazer Solana - Zellic Audit Report.pdf

      - name: Export reports with provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports output/provenance
          cp 'zellic/Pyth Lazer EVM - Zellic Audit Report.pdf' output/reports/
          cp 'zellic/Pyth Lazer Solana - Zellic Audit Report.pdf' output/reports/
          git -C zellic rev-parse HEAD > output/provenance/zellic.commit.txt
          sha256sum output/reports/*.pdf > output/provenance/SHA256SUMS.txt
          find output -type f -printf '%P\t%s bytes\n' | sort > output/provenance/FILE_INDEX.txt

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: pyth-lazer-audit-reports-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
