name: Pyth Lazer Cardano library source bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyth-lazer-cardano-source.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive pinned public source
        run: |
          set -euo pipefail
          COMMIT=217b5917228b17f015719b27dd616a75ad6bd800
          git clone https://github.com/pyth-network/pyth-lazer-cardano.git source
          git -C source checkout "$COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$COMMIT"
          rm -rf source/.git
          tar -czf pyth-lazer-cardano-217b5917.tar.gz source
          sha256sum pyth-lazer-cardano-217b5917.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-lazer-cardano-source
          retention-days: 7
          path: |
            pyth-lazer-cardano-217b5917.tar.gz
            SHA256SUMS
