name: Pyth Lazer public source bundle

on:
  push:
    branches: [ci/pyth-lazer-public-source-20260724]
    paths:
      - '.github/workflows/pyth-lazer-public-source-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-lazer-public-source-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTH_LAZER_COMMIT: 9c3811199468b91d60fc62b12870d53a7b12d8fb
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact public source and create deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/pyth-lazer-public.git pyth-lazer-public
          git -C pyth-lazer-public fetch --depth 1 origin "$PYTH_LAZER_COMMIT"
          git -C pyth-lazer-public checkout --detach "$PYTH_LAZER_COMMIT"
          test "$(git -C pyth-lazer-public rev-parse HEAD)" = "$PYTH_LAZER_COMMIT"

          mkdir -p out
          git -C pyth-lazer-public rev-parse HEAD > out/SOURCE_COMMIT.txt
          git -C pyth-lazer-public status --porcelain=v1 > out/SOURCE_STATUS.txt
          test ! -s out/SOURCE_STATUS.txt
          find pyth-lazer-public/contracts/solana pyth-lazer-public/sdk/rust/protocol pyth-lazer-public/sdk/js-solana \
            -type f -printf '%P\n' | LC_ALL=C sort > out/FOCUSED_FILE_LIST.txt
          git -C pyth-lazer-public archive --format=tar --prefix=pyth-lazer-public/ "$PYTH_LAZER_COMMIT" \
            | zstd -T0 -19 -o out/pyth-lazer-public-${PYTH_LAZER_COMMIT}.tar.zst
          sha256sum out/pyth-lazer-public-${PYTH_LAZER_COMMIT}.tar.zst > out/ARCHIVE_SHA256.txt
          {
            git --version
            zstd --version
            uname -a
          } > out/ENVIRONMENT.txt
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: pyth-lazer-public-source-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
