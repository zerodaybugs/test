name: Pyth Lazer Solana public audit text

on:
  push:
    branches: [ci/pyth-lazer-solana-audit-text-20260724]
    paths:
      - '.github/workflows/pyth-lazer-solana-audit-text.yml'
      - 'ci/pyth-lazer-solana-audit-text.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-lazer-solana-audit-text.yml'
      - 'ci/pyth-lazer-solana-audit-text.trigger'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract public audit report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://raw.githubusercontent.com/pyth-network/audit-reports/main/2025_01_17/pyth_lazer_solana_audit_final.pdf'
          curl --fail --location --retry 4 --retry-all-errors "$URL" -o out/pyth_lazer_solana_audit_final.pdf
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null
          pdfinfo out/pyth_lazer_solana_audit_final.pdf > out/PDFINFO.txt
          pdftotext -layout out/pyth_lazer_solana_audit_final.pdf out/AUDIT_TEXT_LAYOUT.txt
          pdftotext out/pyth_lazer_solana_audit_final.pdf out/AUDIT_TEXT.txt
          grep -Ein 'treasury|writable|denial|service|fee|contention|lock|compute|offset|signature|replay|malleab' \
            out/AUDIT_TEXT_LAYOUT.txt > out/FOCUSED_MATCHES.txt || true
          sha256sum out/pyth_lazer_solana_audit_final.pdf > out/PDF_SHA256.txt
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-lazer-solana-audit-text-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
