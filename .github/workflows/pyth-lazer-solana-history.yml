name: Pyth Lazer Solana public source history

on:
  push:
    branches: [ci/pyth-lazer-solana-history-20260724]
    paths:
      - '.github/workflows/pyth-lazer-solana-history.yml'
      - 'ci/pyth-lazer-solana-history.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-lazer-solana-history.yml'
      - 'ci/pyth-lazer-solana-history.trigger'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUT_DIR: ${{ github.workspace }}/out
      PROGRAM_DEPLOY_SLOT: '330575503'
    steps:
      - uses: actions/checkout@v4
      - name: Clone full public mirror history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR" pyth-lazer-public
          mkdir -p "$OUT_DIR"
          git clone https://github.com/pyth-network/pyth-lazer-public.git pyth-lazer-public
          git -C pyth-lazer-public rev-parse HEAD > "$OUT_DIR/HEAD.txt"
          git -C pyth-lazer-public rev-list --all --count > "$OUT_DIR/COMMIT_COUNT.txt"
          git -C pyth-lazer-public bundle create "$OUT_DIR/pyth-lazer-public-all.bundle" --all
      - name: Export focused Solana verifier history
        shell: bash
        run: |
          set -euo pipefail
          ROOT=pyth-lazer-public
          SIG=contracts/solana/programs/pyth-lazer-solana-contract/src/signature.rs
          LIB=contracts/solana/programs/pyth-lazer-solana-contract/src/lib.rs
          TEST=contracts/solana/programs/pyth-lazer-solana-contract/tests/test1.rs
          LOCK=contracts/solana/Cargo.lock
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$SIG" > "$OUT_DIR/signature-history.tsv"
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$LIB" > "$OUT_DIR/lib-history.tsv"
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$TEST" > "$OUT_DIR/test-history.tsv"
          git -C "$ROOT" log --all --follow --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' -- "$LOCK" > "$OUT_DIR/lock-history.tsv"
          git -C "$ROOT" log --all --follow --full-index --binary -p -- "$SIG" > "$OUT_DIR/signature-history.patch"
          git -C "$ROOT" log --all --follow --full-index --binary -p -- "$LIB" > "$OUT_DIR/lib-history.patch"
          git -C "$ROOT" log --all --follow --full-index --binary -p -- "$TEST" > "$OUT_DIR/test-history.patch"
          git -C "$ROOT" log --all -S'test_rejects_wrong_offset' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -p -- "$TEST" "$SIG" \
            > "$OUT_DIR/pickaxe-wrong-offset.patch"
          git -C "$ROOT" log --all -S'expected_message_data' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -p -- "$SIG" \
            > "$OUT_DIR/pickaxe-expected-message.patch"
          git -C "$ROOT" log --all -S'VerifyEcdsaMessage' --date=iso-strict \
            --format='commit %H%nAuthorDate: %aI%nSubject: %s' -p -- "$LIB" "$TEST" \
            > "$OUT_DIR/pickaxe-ecdsa.patch"
          git -C "$ROOT" log --all --reverse --date=iso-strict \
            --format='%H%x09%aI%x09%s' > "$OUT_DIR/all-commits.tsv"
      - name: Map public deploy slot to block time
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          slot=int(os.environ['PROGRAM_DEPLOY_SLOT'])
          urls=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com']
          results={}
          for i,url in enumerate(urls,1):
              body=json.dumps({'jsonrpc':'2.0','id':i,'method':'getBlockTime','params':[slot]}).encode()
              req=urllib.request.Request(url,data=body,headers={'content-type':'application/json','user-agent':'read-only-slot-time/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      obj=json.loads(r.read())
                  ts=obj.get('result')
                  results[url]={'response':obj,'iso':datetime.fromtimestamp(ts,timezone.utc).isoformat() if isinstance(ts,int) else None}
              except Exception as exc:
                  results[url]={'error':repr(exc)}
          Path(os.environ['OUT_DIR'],'DEPLOY_SLOT_TIME.json').write_text(json.dumps({'slot':slot,'providers':results},indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
          exit 0
      - name: Finalize manifests
        if: always()
        shell: bash
        run: |
          set +e
          {
            git --version
            uname -a
          } > "$OUT_DIR/ENVIRONMENT.txt" 2>&1
          find "$OUT_DIR" -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT_DIR/SHA256SUMS"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-lazer-solana-history-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
