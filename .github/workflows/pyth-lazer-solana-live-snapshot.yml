name: Pyth Lazer Solana read-only live snapshot

on:
  push:
    branches: [ci/pyth-lazer-solana-live-snapshot-20260724]
    paths:
      - '.github/workflows/pyth-lazer-solana-live-snapshot.yml'
      - 'tools/pyth_lazer_solana_snapshot.py'
      - 'ci/pyth-lazer-solana-live-snapshot.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-lazer-solana-live-snapshot.yml'
      - 'tools/pyth_lazer_solana_snapshot.py'
      - 'ci/pyth-lazer-solana-live-snapshot.trigger'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROGRAM_ID: pytd2yyk641x7ak7mkaasSJVXh6YYZnC7wTmtgAyxPt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Query finalized deployment state from independent public RPC providers
        shell: bash
        env:
          OUT_DIR: out
        run: |
          set -euo pipefail
          python tools/pyth_lazer_solana_snapshot.py | tee snapshot-console.log
          cp snapshot-console.log out/
          grep -F 'PYTH_LAZER_SOLANA_LIVE_SNAPSHOT_PASS' out/PASS_MARKERS.txt
          grep -F 'PROGRAM_BYTES_IDENTICAL=true' out/PASS_MARKERS.txt
          grep -F 'STORAGE_BYTES_IDENTICAL=true' out/PASS_MARKERS.txt
          grep -F 'PROGRAMDATA_BYTES_IDENTICAL=true' out/PASS_MARKERS.txt
          grep -F 'STORAGE_OWNER_IS_PROGRAM=true' out/PASS_MARKERS.txt
          grep -F 'AT_LEAST_ONE_ACTIVE_SIGNER=true' out/PASS_MARKERS.txt
      - name: Capture public verified-build registry status
        if: always()
        shell: bash
        run: |
          set +e
          curl --location --silent --show-error --max-time 60 \
            --write-out '%{http_code}\n' \
            --output out/OTTERSEC_STATUS.json \
            "https://verify.osec.io/status/${PROGRAM_ID}" \
            > out/OTTERSEC_STATUS.http.txt 2> out/OTTERSEC_STATUS.stderr.txt
          echo "$?" > out/OTTERSEC_STATUS.curl-exit.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/OTTERSEC_STATUS.json')
          try:
              obj=json.loads(p.read_text())
          except Exception as exc:
              obj={'parse_error':repr(exc),'raw':p.read_text(errors='replace')[:2000] if p.exists() else None}
          Path('out/OTTERSEC_STATUS.normalized.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          print(json.dumps(obj,indent=2,sort_keys=True))
          PY
          exit 0
      - name: Finalize integrity manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-lazer-solana-live-snapshot-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
