name: Public Pyth market-window scan

on:
  pull_request:
    paths:
      - "pyth-scan-trigger/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyth-market-window-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Run focused public read-only data collection
        env:
          SCAN_OUT: pyth-scan-output
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 --version
          python3 .github/scripts/pyth_market_window_scan_fast.py | tee pyth-scan-console.log
          test -s pyth-scan-output/SUMMARY.json
          test -s pyth-scan-output/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pyth-market-window-scan
          path: |
            pyth-scan-output
            pyth-scan-console.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
