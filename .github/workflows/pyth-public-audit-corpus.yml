name: Pyth public audit corpus extraction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pyth-public-audit-corpus.yml'
  push:
    branches: [research/encrypted-evm-proxy-init-snapshot-20260724]
    paths:
      - '.github/workflows/pyth-public-audit-corpus.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone canonical public audit repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-reports out
          mkdir -p out/text
          git clone --filter=blob:none https://github.com/pyth-network/audit-reports.git audit-reports
          git -C audit-reports rev-parse HEAD > out/AUDIT_REPO_COMMIT.txt
          find audit-reports -type f -printf '%P\n' | LC_ALL=C sort > out/FILE_LIST.txt
      - name: Extract every public PDF and build exact-term index
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          while IFS= read -r -d '' pdf; do
            rel="${pdf#audit-reports/}"
            safe="$(printf '%s' "$rel" | tr '/ ' '__')"
            pdftotext -layout "$pdf" "out/text/${safe}.txt" || true
          done < <(find audit-reports -type f -iname '*.pdf' -print0)
          python - <<'PY'
          import json,re
          from pathlib import Path
          out=Path('out')
          terms=[
            'lastExecutedSequence','MessageOutOfOrder','out-of-order','out of order',
            'high-water','high water','sequence number','replay protection',
            'EvmExecutor','ExecutorUpgradable','governance ordering','skipped governance',
            'front-run governance','front run governance'
          ]
          hits=[]
          for path in sorted((out/'text').glob('*.txt')):
            text=path.read_text(errors='replace')
            lower=text.lower()
            for term in terms:
              start=0
              while True:
                i=lower.find(term.lower(),start)
                if i<0: break
                snippet=text[max(0,i-300):min(len(text),i+500)].replace('\x00','')
                hits.append({'file':path.name,'term':term,'offset':i,'snippet':snippet})
                start=i+max(1,len(term))
          (out/'TERM_HITS.json').write_text(json.dumps(hits,indent=2)+'\n')
          (out/'SUMMARY.json').write_text(json.dumps({
            'pdf_count':len(list(Path('audit-reports').rglob('*.pdf'))),
            'text_count':len(list((out/'text').glob('*.txt'))),
            'hit_count':len(hits),
            'terms':terms,
          },indent=2)+'\n')
          print(json.dumps(json.loads((out/'SUMMARY.json').read_text()),indent=2))
          PY
          find out -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-public-audit-corpus-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
