name: Pyth Solana receiver config census 20260730

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-solana-receiver-config-census-20260730.yml'
      - 'research/pyth_solana_receiver_config_census_20260730.py'

permissions:
  contents: read

concurrency:
  group: pyth-solana-receiver-config-census-20260730
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private research runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install deterministic Solana dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-input solders==0.26.0

      - name: Run read-only Solana config census
        shell: bash
        run: |
          set -euo pipefail
          python3 research/pyth_solana_receiver_config_census_20260730.py | tee census.log
          cp census.log evidence/run.log
          printf 'No transaction was constructed, signed, simulated, or broadcast.\n' > evidence/SAFETY.txt
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pyth-solana-receiver-config-census-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
