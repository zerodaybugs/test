name: Pyth public security source mirror 20260730B

on:
  push:
    branches:
      - research/pyth-source-mirror-20260730-b
    paths:
      - '.github/workflows/pyth-source-mirror-20260730-b.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pyth-source-mirror-20260730-b.yml'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current pyth-crosschain
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: main
          path: pyth-crosschain
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current pyth-lazer-public
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-lazer-public
          ref: main
          path: pyth-lazer-public
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current pyth-lazer-cardano
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-lazer-cardano
          ref: main
          path: pyth-lazer-cardano
          persist-credentials: false
          fetch-depth: 1

      - name: Export selected source and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/source bundle/provenance

          git -C pyth-crosschain rev-parse HEAD > bundle/provenance/pyth-crosschain.commit
          git -C pyth-lazer-public rev-parse HEAD > bundle/provenance/pyth-lazer-public.commit
          git -C pyth-lazer-cardano rev-parse HEAD > bundle/provenance/pyth-lazer-cardano.commit

          mkdir -p bundle/source/pyth-crosschain/lazer/contracts
          cp -a pyth-crosschain/lazer/contracts/evm bundle/source/pyth-crosschain/lazer/contracts/
          cp -a pyth-crosschain/lazer/contracts/sui bundle/source/pyth-crosschain/lazer/contracts/
          cp -a pyth-crosschain/lazer/contracts/cardano bundle/source/pyth-crosschain/lazer/contracts/
          cp -a pyth-crosschain/lazer/contracts/iota bundle/source/pyth-crosschain/lazer/contracts/

          mkdir -p bundle/source/pyth-crosschain/target_chains/ethereum/contracts/contracts
          cp -a pyth-crosschain/target_chains/ethereum/contracts/contracts/executor bundle/source/pyth-crosschain/target_chains/ethereum/contracts/contracts/
          cp -a pyth-crosschain/target_chains/ethereum/contracts/contracts/pyth bundle/source/pyth-crosschain/target_chains/ethereum/contracts/contracts/

          mkdir -p bundle/source/pyth-crosschain/governance/xc_admin/packages/xc_admin_common
          cp -a pyth-crosschain/governance/xc_admin/packages/xc_admin_common/src bundle/source/pyth-crosschain/governance/xc_admin/packages/xc_admin_common/

          mkdir -p bundle/source/pyth-crosschain/contract_manager
          cp -a pyth-crosschain/contract_manager/src bundle/source/pyth-crosschain/contract_manager/
          cp -a pyth-crosschain/contract_manager/scripts bundle/source/pyth-crosschain/contract_manager/

          mkdir -p bundle/source/pyth-crosschain/apps/developer-hub/content/docs/price-feeds
          cp -a pyth-crosschain/apps/developer-hub/content/docs/price-feeds/pro bundle/source/pyth-crosschain/apps/developer-hub/content/docs/price-feeds/

          rm -rf pyth-lazer-public/.git pyth-lazer-public/target
          mv pyth-lazer-public bundle/source/pyth-lazer-public
          rm -rf pyth-lazer-cardano/.git pyth-lazer-cardano/build
          mv pyth-lazer-cardano bundle/source/pyth-lazer-cardano

          find bundle/source -type f -print0 | sort -z | xargs -0 sha256sum > bundle/provenance/SOURCE_SHA256SUMS.txt
          find bundle -type f -printf '%P\t%s bytes\n' | sort > bundle/provenance/FILE_INDEX.txt
          printf 'No production or public-testnet transaction was signed or broadcast.\n' > bundle/provenance/SAFETY.txt
          tar -C bundle -czf pyth-security-source-bundle.tar.gz source provenance
          sha256sum pyth-security-source-bundle.tar.gz > pyth-security-source-bundle.tar.gz.sha256

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: pyth-security-source-bundle-${{ github.run_id }}
          path: |
            pyth-security-source-bundle.tar.gz
            pyth-security-source-bundle.tar.gz.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
