name: Pyth staking source bundle

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyth-staking-source-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTH_GOVERNANCE_COMMIT: 68a9a36ec3d41364490e71b056b422c99f13e0cf
    steps:
      - uses: actions/checkout@v4
      - name: Clone and bundle pinned public source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pyth-network/governance.git pyth-governance
          git -C pyth-governance checkout "$PYTH_GOVERNANCE_COMMIT"
          test "$(git -C pyth-governance rev-parse HEAD)" = "$PYTH_GOVERNANCE_COMMIT"
          git -C pyth-governance rev-parse HEAD > PYTH_GOVERNANCE_COMMIT.txt
          rm -rf pyth-governance/.git
          tar -czf pyth-staking-source.tar.gz pyth-governance/staking
          sha256sum pyth-staking-source.tar.gz > SHA256SUMS
          du -sh pyth-staking-source.tar.gz pyth-governance/staking | tee SIZES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-staking-source
          retention-days: 7
          compression-level: 0
          path: |
            pyth-staking-source.tar.gz
            PYTH_GOVERNANCE_COMMIT.txt
            SHA256SUMS
            SIZES.txt
