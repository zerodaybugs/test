name: readonly-chain-state

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pinned read-only JSON-RPC probe
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request

          endpoints = [
              "https://rpc-gel.inkonchain.com",
              "https://rpc-qnd.inkonchain.com",
              "https://rpc.nodeflare.app/ink/public",
              "https://ink.drpc.org",
          ]

          def req(ep, method, params):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              r = urllib.request.Request(ep, data=body, method="POST", headers={
                  "content-type":"application/json", "user-agent":"readonly-probe/1.0"
              })
              with urllib.request.urlopen(r, timeout=20) as f:
                  out = json.loads(f.read().decode())
              if "error" in out:
                  raise RuntimeError(out["error"])
              return out["result"]

          selected = None
          failures = {}
          for ep in endpoints:
              try:
                  if int(req(ep, "eth_chainId", []), 16) != 57073:
                      raise RuntimeError("wrong chain")
                  selected = ep
                  break
              except Exception as exc:
                  failures[ep] = repr(exc)
          if not selected:
              raise RuntimeError(failures)

          block = req(selected, "eth_blockNumber", [])
          def rpc(method, params): return req(selected, method, params)
          def call(to, data): return rpc("eth_call", [{"to":to,"data":data}, block])
          def code(to): return rpc("eth_getCode", [to, block])
          def aw(a): return a.lower().removeprefix("0x").rjust(64,"0")
          def uw(n): return hex(n)[2:].rjust(64,"0")
          def b4w(v): return v.removeprefix("0x").ljust(64,"0")
          def c0(to, sel): return call(to, "0x"+sel)
          def ca(to, sel, a): return call(to, "0x"+sel+aw(a))
          def uint(x): return int(x,16)
          def boolean(x): return bool(int(x,16))
          def address(x): return "0x"+x[-40:]
          def words(x):
              h=x[2:]
              return [int(h[i:i+64],16) for i in range(0,len(h),64)]
          def safe(f):
              try: return f()
              except Exception as exc: return {"error":repr(exc)}
          def can(auth,user,target,sel):
              return boolean(call(auth,"0xb7009613"+aw(user)+aw(target)+b4w(sel)))
          def public(auth,target,sel):
              return boolean(call(auth,"0x2f47571f"+aw(target)+b4w(sel)))
          def has_role(auth,user,role):
              return boolean(call(auth,"0xea7ca276"+aw(user)+uw(role)))

          S={
              "vault":"fbfa77cf","accountant":"4fb3ccc5","authority":"bf7e214f",
              "owner":"8da5cb5b","hook":"7f5a7c7b","paused":"b187bd26",
              "lock":"9fdb11b6","asset":"41fee44a","rate":"679aefce",
              "safe_rate":"282a8700","supply":"18160ddd","balance":"70a08231",
              "deposit":"8b6099db","permit":"33f60f8f","withdraw":"16762eed",
              "enter":"39d6ba32","exit":"18457e61"
          }
          attacker="0x1111111111111111111111111111111111111111"
          usdc="0x2D270e6886d130d724215a266106e6832161EAEd"
          usdt="0x0200C29006150606B650577BBE7B6248F58470c1"
          sets={
              "a":{
                  "v":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f",
                  "r":"0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B",
                  "ot":"0x1d8016AEdE8Bd0143C311Bb28CCdd8af8a245df9",
                  "nt":"0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC",
                  "oa":"0x727929AF06Fa4f6E96cbC3fF7F4b60A65E168e23",
                  "na":"0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67"},
              "b":{
                  "v":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271",
                  "r":"0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77",
                  "ot":"0x4E0292caa97128e35a695dCd53c465E56F69c3A0",
                  "nt":"0xc46f2443b3521632E2E2a903D6da8f965B46f6a0",
                  "oa":"0x62A88Bea6fe527b5DEfAA103A3f8b5010205aF92",
                  "na":"0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9"}
          }
          out={"rpc":selected,"block":int(block,16),"sets":{}}
          for name,x in sets.items():
              v,r=x["v"],x["r"]
              z={"addresses":x}
              z["vault"]={
                  "code":safe(lambda:(len(code(v))-2)//2),
                  "hook":safe(lambda:address(c0(v,S["hook"]))),
                  "authority":safe(lambda:address(c0(v,S["authority"]))),
                  "supply":safe(lambda:uint(c0(v,S["supply"]))),
                  "usdc":safe(lambda:uint(ca(usdc,S["balance"],v))),
                  "usdt":safe(lambda:uint(ca(usdt,S["balance"],v)))}
              for k in ("ot","nt"):
                  t=x[k]
                  z[k]={
                      "code":safe(lambda t=t:(len(code(t))-2)//2),
                      "vault":safe(lambda t=t:address(c0(t,S["vault"]))),
                      "accountant":safe(lambda t=t:address(c0(t,S["accountant"]))),
                      "authority":safe(lambda t=t:address(c0(t,S["authority"]))),
                      "paused":safe(lambda t=t:boolean(c0(t,S["paused"]))),
                      "lock":safe(lambda t=t:uint(c0(t,S["lock"]))),
                      "usdc_asset":safe(lambda t=t:words(ca(t,S["asset"],usdc))),
                      "usdt_asset":safe(lambda t=t:words(ca(t,S["asset"],usdt))),
                      "attacker_deposit":safe(lambda t=t:can(r,attacker,t,S["deposit"])),
                      "deposit_public":safe(lambda t=t:public(r,t,S["deposit"])),
                      "attacker_permit":safe(lambda t=t:can(r,attacker,t,S["permit"])),
                      "attacker_withdraw":safe(lambda t=t:can(r,attacker,t,S["withdraw"])),
                      "withdraw_public":safe(lambda t=t:public(r,t,S["withdraw"])),
                      "can_enter":safe(lambda t=t:can(r,t,v,S["enter"])),
                      "can_exit":safe(lambda t=t:can(r,t,v,S["exit"])),
                      "role2":safe(lambda t=t:has_role(r,t,2)),
                      "role3":safe(lambda t=t:has_role(r,t,3))}
              for k in ("oa","na"):
                  a=x[k]
                  z[k]={
                      "code":safe(lambda a=a:(len(code(a))-2)//2),
                      "authority":safe(lambda a=a:address(c0(a,S["authority"]))),
                      "rate":safe(lambda a=a:uint(c0(a,S["rate"]))),
                      "safe_rate":safe(lambda a=a:uint(c0(a,S["safe_rate"])))}
              out["sets"][name]=z
          text=json.dumps(out,indent=2,sort_keys=True)
          print("STATE_BEGIN")
          print(text)
          print("STATE_END")
          open("readonly-state.json","w").write(text+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: readonly-state
          path: readonly-state.json
          retention-days: 1
