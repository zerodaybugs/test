name: reserve-hyusd-binding-r21-marker

on:
  pull_request:
    branches: [main]
    paths:
      - .research/triggers/reserve-hyusd-r21.txt

permissions:
  contents: read

jobs:
  production-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_VERSION: v1.7.1
      FOUNDRY_SHA256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
    steps:
      - uses: actions/checkout@v4

      - name: Install verified Foundry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundry-bin evidence
          url="https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o foundry.tar.gz
          echo "${FOUNDRY_SHA256}  foundry.tar.gz" | sha256sum -c -
          tar -xzf foundry.tar.gz -C foundry-bin
          foundry-bin/cast --version | tee evidence/cast-version.txt

      - name: Select public Base RPC
        shell: bash
        run: |
          set -euo pipefail
          RPC=""
          for candidate in https://base-rpc.publicnode.com https://mainnet.base.org https://base.llamarpc.com https://base.gateway.tenderly.co; do
            if timeout 15 foundry-bin/cast chain-id --rpc-url "$candidate" 2>/dev/null | grep -qx '8453'; then RPC="$candidate"; break; fi
          done
          test -n "$RPC"
          echo "RPC_URL=$RPC" >> "$GITHUB_ENV"

      - name: Run read-only production binding
        shell: bash
        env:
          CAST: ${{ github.workspace }}/foundry-bin/cast
        run: bash .research/tools/reserve_hyusd_r21.sh

      - name: Seal and triple-test artifact
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          tar -czf reserve-hyusd-binding-r21.tar.gz evidence
          sha256sum reserve-hyusd-binding-r21.tar.gz > reserve-hyusd-binding-r21.tar.gz.sha256
          for i in 1 2 3; do tar -tzf reserve-hyusd-binding-r21.tar.gz >/dev/null; done

      - uses: actions/upload-artifact@v4
        with:
          name: reserve-hyusd-binding-r21
          path: |
            reserve-hyusd-binding-r21.tar.gz
            reserve-hyusd-binding-r21.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
