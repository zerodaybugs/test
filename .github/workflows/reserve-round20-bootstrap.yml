name: reserve-round20-bootstrap-public-data-only

on:
  push:
    branches:
      - bootstrap/reserve-round20-toolchain-20260818
    paths:
      - .github/workflows/reserve-round20-bootstrap.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reserve-round20-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap-offline-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_VERSION: v1.7.1
      FOUNDRY_SHA256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
      RESERVE_COMMIT: 241f0d244c45a311a4cd2af2c383a4f3bbe56265
      STAKINGVAULT_BLOB: efacd7e47e1f367624f5222bceb235314cfe59df
      UNSTAKINGMANAGER_BLOB: 3deae71885f6c9ae9e315f76452c4290b7b4d662
    steps:
      - name: Checkout bootstrap workflow only
        uses: actions/checkout@v4

      - name: Download and verify official Foundry release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap/foundry-bin bootstrap/meta
          url="https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o bootstrap/foundry.tar.gz
          echo "${FOUNDRY_SHA256}  bootstrap/foundry.tar.gz" | sha256sum -c -
          tar -xzf bootstrap/foundry.tar.gz -C bootstrap/foundry-bin
          bootstrap/foundry-bin/forge --version | tee bootstrap/meta/forge-version.txt
          bootstrap/foundry-bin/cast --version | tee bootstrap/meta/cast-version.txt
          bootstrap/foundry-bin/anvil --version | tee bootstrap/meta/anvil-version.txt
          echo "$GITHUB_WORKSPACE/bootstrap/foundry-bin" >> "$GITHUB_PATH"

      - name: Clone exact public Reserve r5 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/reserve-protocol/reserve-index-dtf.git bootstrap/reserve-index-dtf
          git -C bootstrap/reserve-index-dtf checkout --detach "$RESERVE_COMMIT"
          test "$(git -C bootstrap/reserve-index-dtf rev-parse HEAD)" = "$RESERVE_COMMIT"
          test "$(git -C bootstrap/reserve-index-dtf hash-object contracts/staking/StakingVault.sol)" = "$STAKINGVAULT_BLOB"
          test "$(git -C bootstrap/reserve-index-dtf hash-object contracts/staking/UnstakingManager.sol)" = "$UNSTAKINGMANAGER_BLOB"
          {
            echo "reserve_commit=$RESERVE_COMMIT"
            echo "stakingvault_blob=$STAKINGVAULT_BLOB"
            echo "unstakingmanager_blob=$UNSTAKINGMANAGER_BLOB"
          } | tee bootstrap/meta/reserve-source-identity.txt

      - name: Install exact public dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd bootstrap/reserve-index-dtf
          yarn install --immutable

      - name: Build exact source and populate pinned solc cache
        shell: bash
        run: |
          set -euo pipefail
          cd bootstrap/reserve-index-dtf
          forge clean
          forge build 2>&1 | tee ../meta/exact-build.log
          git diff --exit-code
          git status --short | tee ../meta/repo-status.txt
          forge --version >> ../meta/tool-versions.txt

      - name: Package complete offline bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/reserve-index-dtf/.git bootstrap/reserve-index-dtf/out bootstrap/reserve-index-dtf/cache
          mkdir -p bootstrap/svm
          if [ -d "$HOME/.svm" ]; then cp -a "$HOME/.svm/." bootstrap/svm/; fi
          find bootstrap -type f -print0 | sort -z | xargs -0 sha256sum > bootstrap/meta/SHA256SUMS.txt
          tar -czf reserve-round20-offline-bootstrap.tar.gz bootstrap
          sha256sum reserve-round20-offline-bootstrap.tar.gz > reserve-round20-offline-bootstrap.tar.gz.sha256
          for run in 1 2 3; do
            tar -tzf reserve-round20-offline-bootstrap.tar.gz >/dev/null
          done
          test -s reserve-round20-offline-bootstrap.tar.gz
          du -h reserve-round20-offline-bootstrap.tar.gz

      - name: Upload verified public-data-only bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: reserve-round20-offline-bootstrap
          path: |
            reserve-round20-offline-bootstrap.tar.gz
            reserve-round20-offline-bootstrap.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
