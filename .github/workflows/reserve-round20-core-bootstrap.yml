name: reserve-round20-core-bootstrap-public-data-only

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reserve-round20-core-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap-offline-core-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RESERVE_COMMIT: 3ad40fa2c79482b73e9dbd7f54c66298da6cdb4a
      MAIN_BLOB: eee2dd00023a78ae9c2b7cb895279ac64e8c4ef6
      BROKER_BLOB: a13b0c63a1d2f92ace5fb22f13c8caf5e5630ca2
      DUTCH_TRADE_BLOB: 473ba957bdbc6f6196cd02138c4ad59c57ef092e
      BACKING_MANAGER_BLOB: c2ddf852d487c36b08effa6e762218608c6f7fd1
    steps:
      - name: Checkout bootstrap workflow only
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone exact scoped Reserve core rc-4.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap/meta
          git clone https://github.com/reserve-protocol/protocol.git bootstrap/protocol
          git -C bootstrap/protocol checkout --detach "$RESERVE_COMMIT"
          test "$(git -C bootstrap/protocol rev-parse HEAD)" = "$RESERVE_COMMIT"
          test "$(git -C bootstrap/protocol hash-object contracts/p1/Main.sol)" = "$MAIN_BLOB"
          test "$(git -C bootstrap/protocol hash-object contracts/p1/Broker.sol)" = "$BROKER_BLOB"
          test "$(git -C bootstrap/protocol hash-object contracts/plugins/trading/DutchTrade.sol)" = "$DUTCH_TRADE_BLOB"
          test "$(git -C bootstrap/protocol hash-object contracts/p1/BackingManager.sol)" = "$BACKING_MANAGER_BLOB"
          {
            echo "reserve_commit=$RESERVE_COMMIT"
            echo "main_blob=$MAIN_BLOB"
            echo "broker_blob=$BROKER_BLOB"
            echo "dutch_trade_blob=$DUTCH_TRADE_BLOB"
            echo "backing_manager_blob=$BACKING_MANAGER_BLOB"
            echo "node=$(node --version)"
          } | tee bootstrap/meta/source-identity.txt

      - name: Install exact public dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd bootstrap/protocol
          yarn install --immutable

      - name: Compile exact scoped source and populate compiler cache
        shell: bash
        run: |
          set -euo pipefail
          cd bootstrap/protocol
          yarn compile 2>&1 | tee ../meta/exact-compile.log
          git diff --exit-code
          git status --short | tee ../meta/repo-status.txt
          test -d artifacts
          test -d cache
          test -d typechain

      - name: Run exact existing core regression suites
        shell: bash
        run: |
          set -euo pipefail
          cd bootstrap/protocol
          for suite in test/Broker.test.ts test/Main.test.ts test/RToken.test.ts; do
            test -f "$suite"
          done
          PROTO_IMPL=1 npx hardhat test --no-compile \
            test/Broker.test.ts \
            test/Main.test.ts \
            test/RToken.test.ts \
            2>&1 | tee ../meta/targeted-original-tests.log
          grep -E '[0-9]+ passing' ../meta/targeted-original-tests.log >/dev/null

      - name: Package and triple-test complete offline bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/protocol/.git
          mkdir -p bootstrap/hardhat-cache
          if [ -d "$HOME/.cache/hardhat-nodejs" ]; then cp -a "$HOME/.cache/hardhat-nodejs/." bootstrap/hardhat-cache/; fi
          find bootstrap -type f -print0 | sort -z | xargs -0 sha256sum > bootstrap/meta/SHA256SUMS.txt
          tar -czf reserve-round20-core-offline-bootstrap-compiled.tar.gz bootstrap
          sha256sum reserve-round20-core-offline-bootstrap-compiled.tar.gz > reserve-round20-core-offline-bootstrap-compiled.tar.gz.sha256
          for run in 1 2 3; do tar -tzf reserve-round20-core-offline-bootstrap-compiled.tar.gz >/dev/null; done
          test -s reserve-round20-core-offline-bootstrap-compiled.tar.gz
          du -h reserve-round20-core-offline-bootstrap-compiled.tar.gz

      - name: Upload verified public-data-only compiled core bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: reserve-round20-core-offline-bootstrap-compiled
          path: |
            reserve-round20-core-offline-bootstrap-compiled.tar.gz
            reserve-round20-core-offline-bootstrap-compiled.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
