name: reserve-round21-audit-corpus-public-data-only

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reserve-round21-audit-corpus.yml

permissions:
  contents: read

jobs:
  export-current-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bootstrap workflow only
        uses: actions/checkout@v4

      - name: Clone current public Reserve repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/reserve-protocol/protocol.git reserve-current
          git -C reserve-current rev-parse HEAD | tee reserve-current-head.txt

      - name: Install PDF text extraction
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Extract the current 4.2 duplicate-control corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-corpus/pdf audit-corpus/text audit-corpus/meta
          files=(
            "Certora Formal Verification FixLib.pdf"
            "Oak Security - 2026-03-12 Audit Report - Reserve Updates.pdf"
            "Trust Security - Reserve Audit Report 4_2_0.pdf"
          )
          for name in "${files[@]}"; do
            src="reserve-current/audits/$name"
            test -s "$src"
            cp "$src" "audit-corpus/pdf/$name"
            pdftotext -layout "$src" "audit-corpus/text/${name%.pdf}.txt"
            test -s "audit-corpus/text/${name%.pdf}.txt"
          done
          cp reserve-current-head.txt audit-corpus/meta/repository-head.txt
          {
            echo 'Expected Git blob identities:'
            echo '659dd78c09a429e94bbe456a603b319141e4c2a2  Certora Formal Verification FixLib.pdf'
            echo '0aaa8fd0d27d355a124e60048e2f31c55deb15e3  Oak Security - 2026-03-12 Audit Report - Reserve Updates.pdf'
            echo 'd6a53bbf96ddf689db219bfcd4e49409cf49b850  Trust Security - Reserve Audit Report 4_2_0.pdf'
          } > audit-corpus/meta/expected-git-blobs.txt
          for name in "${files[@]}"; do
            git -C reserve-current hash-object "audits/$name"
          done > audit-corpus/meta/observed-git-blobs.txt
          sed -n '1p' audit-corpus/meta/observed-git-blobs.txt | grep '^659dd78c09a429e94bbe456a603b319141e4c2a2$'
          sed -n '2p' audit-corpus/meta/observed-git-blobs.txt | grep '^0aaa8fd0d27d355a124e60048e2f31c55deb15e3$'
          sed -n '3p' audit-corpus/meta/observed-git-blobs.txt | grep '^d6a53bbf96ddf689db219bfcd4e49409cf49b850$'
          find audit-corpus -type f -print0 | sort -z | xargs -0 sha256sum > audit-corpus/meta/SHA256SUMS.txt

      - name: Build searchable finding index and triple-check archive
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'critical|high|medium|minor|informational|finding|reentran|registry|trusted filler|issuance|redemption|auction|storage|upgrade' audit-corpus/text \
            > audit-corpus/meta/security-term-index.txt || true
          tar -czf reserve-round21-audit-corpus.tar.gz audit-corpus
          sha256sum reserve-round21-audit-corpus.tar.gz > reserve-round21-audit-corpus.tar.gz.sha256
          for run in 1 2 3; do tar -tzf reserve-round21-audit-corpus.tar.gz >/dev/null; done
          test -s reserve-round21-audit-corpus.tar.gz

      - name: Upload verified public audit corpus
        uses: actions/upload-artifact@v4
        with:
          name: reserve-round21-audit-corpus
          path: |
            reserve-round21-audit-corpus.tar.gz
            reserve-round21-audit-corpus.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
