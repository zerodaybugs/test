name: Rewards Public State Snapshot 20260722

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rewards-public-state-snapshot-20260722.yml"
      - "tools/rewards_public_state_snapshot_20260722.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only decoder dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests eth-abi eth-utils "eth-hash[pycryptodome]"

      - name: Fetch exact source, production transactions, logs, and current state
        run: |
          set -euo pipefail
          python tools/rewards_public_state_snapshot_20260722.py \
            > rewards-snapshot.stdout.log \
            2> rewards-snapshot.stderr.log
          test -s rewards-state-output/derived/summary.json
          python -m json.tool rewards-state-output/derived/summary.json >/dev/null

      - name: Archive evidence
        if: always()
        run: |
          set -euo pipefail
          tar -czf rewards-public-state-snapshot.tgz \
            rewards-state-output \
            rewards-snapshot.stdout.log \
            rewards-snapshot.stderr.log
          sha256sum rewards-public-state-snapshot.tgz \
            > rewards-public-state-snapshot.tgz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewards-public-state-snapshot-${{ github.run_id }}
          path: |
            rewards-public-state-snapshot.tgz
            rewards-public-state-snapshot.tgz.sha256
            rewards-snapshot.stdout.log
            rewards-snapshot.stderr.log
            rewards-state-output
          if-no-files-found: error
          retention-days: 7
