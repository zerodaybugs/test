name: Rootless Docker static bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rootless-docker-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download official static Docker and rootless extras
        run: |
          set -euo pipefail
          VERSION=29.6.2
          BASE=https://download.docker.com/linux/static/stable/x86_64
          mkdir -p out
          curl -fL --retry 3 "$BASE/docker-$VERSION.tgz" -o out/docker.tgz
          curl -fL --retry 3 "$BASE/docker-rootless-extras-$VERSION.tgz" -o out/docker-rootless-extras.tgz
          tar -tzf out/docker.tgz > out/docker-contents.txt
          tar -tzf out/docker-rootless-extras.tgz > out/rootless-contents.txt
          sha256sum out/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rootless-docker-29.6.2
          retention-days: 7
          compression-level: 0
          path: out/
