name: Rootstock Blockscout PegOut history read-only 20260728

on:
  push:
    branches:
      - ci/dependency-snapshot-20260727
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only historical decoder
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/rootstock-blockscout-pegout-history"
          NODEDIR="$RUNNER_TEMP/rootstock-blockscout-node"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT" "$NODEDIR"
          cd "$NODEDIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ethers@6.15.0 2>&1 | tee "$OUT/npm-install.log"
          NODE_PATH="$NODEDIR/node_modules" OUT="$OUT" \
            node "$GITHUB_WORKSPACE/research/rootstock/pegout_history_blockscout.js" 2>&1 | tee "$OUT/run.log"
          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "blockscout=https://rootstock.blockscout.com"
            echo "rpc=https://public-node.rsk.co"
            echo "mode=read-only GET and JSON-RPC reads only"
            echo "transactions_submitted=0"
            echo "quotes_requested=0"
          } > "$OUT/MANIFEST.txt"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootstock-blockscout-pegout-history-readonly-20260728
          path: ${{ runner.temp }}/rootstock-blockscout-pegout-history/evidence
          if-no-files-found: error
          retention-days: 1
