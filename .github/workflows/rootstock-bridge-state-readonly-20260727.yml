name: Rootstock bridge public state snapshot 20260727

on:
  push:
    branches:
      - ci/dependency-snapshot-20260727
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public Rootstock mainnet state read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/rootstock-bridge-state"
          RPC="https://public-node.rsk.co"
          BRIDGE="0x0000000000000000000000000000000001000006"
          mkdir -p "$OUT"

          rpc() {
            local name="$1"
            local payload="$2"
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
              -H 'content-type: application/json' \
              --data "$payload" "$RPC" | tee "$OUT/$name.json"
            printf '\n'
          }

          rpc chain_id '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          rpc block_number '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}'
          rpc latest_block '{"jsonrpc":"2.0","id":3,"method":"eth_getBlockByNumber","params":["latest",false]}'
          rpc bridge_rbtc_balance "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"eth_getBalance\",\"params\":[\"$BRIDGE\",\"latest\"]}"

          eth_call() {
            local name="$1"
            local selector="$2"
            rpc "$name" "{\"jsonrpc\":\"2.0\",\"id\":10,\"method\":\"eth_call\",\"params\":[{\"to\":\"$BRIDGE\",\"data\":\"$selector\",\"gas\":\"0x989680\"},\"latest\"]}"
          }

          eth_call queued_pegouts 0xf4e4f963
          eth_call next_pegout_block 0xe34f834f
          eth_call estimated_next_pegout_fee 0x7817d854
          eth_call state_for_btc_release_client 0xc4fbca20
          eth_call state_for_debugging 0x0d0cee93

          python3 - "$OUT" <<'PY'
          import json
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          summary = []
          for name in [
              "chain_id",
              "block_number",
              "bridge_rbtc_balance",
              "queued_pegouts",
              "next_pegout_block",
              "estimated_next_pegout_fee",
          ]:
              obj = json.loads((out / f"{name}.json").read_text())
              value = obj.get("result")
              if isinstance(value, str) and value.startswith("0x"):
                  try:
                      summary.append(f"{name}_hex={value}")
                      summary.append(f"{name}_int={int(value, 16)}")
                  except ValueError:
                      summary.append(f"{name}={value}")
              else:
                  summary.append(f"{name}={value!r}")

          for name in ["state_for_btc_release_client", "state_for_debugging"]:
              obj = json.loads((out / f"{name}.json").read_text())
              value = obj.get("result")
              summary.append(f"{name}_rpc_error={obj.get('error')!r}")
              if isinstance(value, str) and value.startswith("0x"):
                  summary.append(f"{name}_abi_result_bytes={(len(value)-2)//2}")
                  (out / f"{name}.hex").write_text(value + "\n")

          (out / "SUMMARY.txt").write_text("\n".join(summary) + "\n")
          print("\n".join(summary))
          PY

          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rpc=$RPC"
            echo "bridge=$BRIDGE"
            echo "mode=read-only JSON-RPC; no transaction submitted"
          } > "$OUT/MANIFEST.txt"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload public state snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rootstock-bridge-public-state-20260727
          path: ${{ runner.temp }}/rootstock-bridge-state
          if-no-files-found: error
          compression-level: 9
          retention-days: 1

# trigger after initial workflow registration
