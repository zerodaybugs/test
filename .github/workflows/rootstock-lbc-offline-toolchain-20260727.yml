name: Rootstock LBC offline toolchain 20260727

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build exact public LBC offline environment
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/rootstock-lbc-offline"
          LBC="$ROOT/liquidity-bridge-contract"
          LBC_COMMIT="4066b8fb726bb6c7cf9c0fb7d2761ff6739c8793"
          mkdir -p "$ROOT/toolchain"

          git clone https://github.com/rsksmart/liquidity-bridge-contract.git "$LBC"
          git -C "$LBC" checkout --detach "$LBC_COMMIT"
          test "$(git -C "$LBC" rev-parse HEAD)" = "$LBC_COMMIT"
          git -C "$LBC" submodule update --init --recursive

          cd "$LBC"
          npm ci --ignore-scripts
          forge --version | tee "$ROOT/forge-version.txt"
          cast --version | tee "$ROOT/cast-version.txt"
          anvil --version | tee "$ROOT/anvil-version.txt"
          node --version | tee "$ROOT/node-version.txt"
          npm --version | tee "$ROOT/npm-version.txt"
          forge build --force -vv 2>&1 | tee "$ROOT/forge-build.log"
          forge test --match-path test/pegin/RegisterPegIn.t.sol --list 2>&1 | tee "$ROOT/forge-test-list.log"

          cp "$(command -v forge)" "$ROOT/toolchain/forge"
          cp "$(command -v cast)" "$ROOT/toolchain/cast"
          cp "$(command -v anvil)" "$ROOT/toolchain/anvil"
          cp "$(command -v chisel)" "$ROOT/toolchain/chisel" 2>/dev/null || true
          cp -a "$HOME/.svm" "$ROOT/toolchain/svm"

          git -C "$LBC" show -s \
            --format='repository=rsksmart/liquidity-bridge-contract%ncommit=%H%ncommit_date=%cI%nsubject=%s' HEAD \
            > "$ROOT/lbc-commit.txt"
          git -C "$LBC" status --porcelain=v1 > "$ROOT/lbc-status.txt"
          test ! -s "$ROOT/lbc-status.txt"

          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=$(uname -a)"
            echo "lbc_commit=$LBC_COMMIT"
            echo "purpose=public exact-source offline test environment"
          } > "$ROOT/MANIFEST.txt"

          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/ALL_FILES_SHA256.txt"
          tar -C "$ROOT" --zstd -cf "$RUNNER_TEMP/rootstock-lbc-offline-toolchain-20260727.tar.zst" .
          sha256sum "$RUNNER_TEMP/rootstock-lbc-offline-toolchain-20260727.tar.zst" \
            > "$RUNNER_TEMP/rootstock-lbc-offline-toolchain-20260727.tar.zst.sha256"

      - name: Upload exact public offline environment
        uses: actions/upload-artifact@v4
        with:
          name: rootstock-lbc-offline-toolchain-20260727
          path: |
            ${{ runner.temp }}/rootstock-lbc-offline-toolchain-20260727.tar.zst
            ${{ runner.temp }}/rootstock-lbc-offline-toolchain-20260727.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
