name: Rootstock locking-cap read-only snapshot 20260727

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Query public Rootstock state without transactions
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/rootstock-locking-cap"
          RPC="https://public-node.rsk.co"
          BRIDGE="0x0000000000000000000000000000000001000006"
          COLLATERAL="0xBe4D93B3aFD9921CAC66704fFD3Caf662886fb73"
          PEGOUT="0x9A0678742cfb567874eb4e99Df2106BDED78F5E4"
          DEFAULT_PROVIDER="0x4202bAC9919C3412Fc7c8BE4e678e26279386603"
          TEKS_PROVIDER="0x82a06eBDB97776a2da4041dF8f2b2ea8D3257852"
          mkdir -p "$OUT"

          rpc() {
            local name="$1"
            local payload="$2"
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
              -H 'content-type: application/json' --data "$payload" "$RPC" \
              | tee "$OUT/$name.json"
            printf '\n'
          }

          eth_call() {
            local name="$1"
            local to="$2"
            local data="$3"
            rpc "$name" "{\"jsonrpc\":\"2.0\",\"id\":10,\"method\":\"eth_call\",\"params\":[{\"to\":\"$to\",\"data\":\"$data\"},\"latest\"]}"
          }

          encode_address() {
            local address="${1#0x}"
            printf '%064s' "$address" | tr ' ' '0'
          }

          encode_uint_address() {
            local value="$1"
            local address="${2#0x}"
            printf '%064x%064s' "$value" "$address" | tr ' ' '0'
          }

          rpc chain_id '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          rpc block_number '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}'
          rpc gas_price '{"jsonrpc":"2.0","id":3,"method":"eth_gasPrice","params":[]}'
          rpc bridge_balance "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"eth_getBalance\",\"params\":[\"$BRIDGE\",\"latest\"]}"
          rpc collateral_contract_balance "{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"eth_getBalance\",\"params\":[\"$COLLATERAL\",\"latest\"]}"
          rpc pegout_contract_balance "{\"jsonrpc\":\"2.0\",\"id\":6,\"method\":\"eth_getBalance\",\"params\":[\"$PEGOUT\",\"latest\"]}"
          eth_call locking_cap "$BRIDGE" 0x3f9db977
          eth_call minimum_lock "$BRIDGE" 0x2f8d158f
          eth_call min_collateral "$COLLATERAL" 0xe830b690
          eth_call reward_percentage "$COLLATERAL" 0xc7213163
          eth_call resign_delay_blocks "$COLLATERAL" 0x27887ffc

          for spec in "default:$DEFAULT_PROVIDER" "teks:$TEKS_PROVIDER"; do
            name="${spec%%:*}"
            addr="${spec#*:}"
            arg="$(encode_address "$addr")"
            enum_arg="$(encode_uint_address 1 "$addr")"
            eth_call "${name}_pegout_collateral" "$COLLATERAL" "0x82b90e93${arg}"
            eth_call "${name}_resignation_block" "$COLLATERAL" "0xd36933d3${arg}"
            eth_call "${name}_pegout_sufficient" "$COLLATERAL" "0x718c5aa8${enum_arg}"
            rpc "${name}_rbtc_balance" "{\"jsonrpc\":\"2.0\",\"id\":20,\"method\":\"eth_getBalance\",\"params\":[\"$addr\",\"latest\"]}"
          done

          python3 - "$OUT" <<'PY'
          import json
          import pathlib
          import sys
          out = pathlib.Path(sys.argv[1])

          def result(name):
              obj = json.loads((out / f"{name}.json").read_text())
              if obj.get("error"):
                  raise SystemExit(f"{name} rpc error: {obj['error']}")
              raw = obj["result"]
              if not isinstance(raw, str) or not raw.startswith("0x"):
                  raise SystemExit(f"{name} invalid result: {raw!r}")
              return int(raw, 16)

          values = {name: result(name) for name in [
              "chain_id", "block_number", "gas_price", "bridge_balance",
              "collateral_contract_balance", "pegout_contract_balance",
              "locking_cap", "minimum_lock", "min_collateral",
              "reward_percentage", "resign_delay_blocks",
              "default_pegout_collateral", "default_resignation_block",
              "default_pegout_sufficient", "default_rbtc_balance",
              "teks_pegout_collateral", "teks_resignation_block",
              "teks_pegout_sufficient", "teks_rbtc_balance",
          ]}

          sat_to_wei = 10_000_000_000
          max_rbtc_sat = 21_000_000 * 100_000_000
          bridge_balance_sat = values["bridge_balance"] // sat_to_wei
          locked_sat = max_rbtc_sat - bridge_balance_sat
          remaining_sat = values["locking_cap"] - locked_sat
          penalty_fee = 10_000_000_000_000
          reward_per_quote = penalty_fee * values["reward_percentage"] // 10_000

          lines = [
              f"chain_id={values['chain_id']}",
              f"block_number={values['block_number']}",
              f"gas_price_wei={values['gas_price']}",
              f"bridge_balance_wei={values['bridge_balance']}",
              f"bridge_balance_sat={bridge_balance_sat}",
              f"max_rbtc_sat={max_rbtc_sat}",
              f"locked_sat={locked_sat}",
              f"locking_cap_sat={values['locking_cap']}",
              f"remaining_cap_sat={remaining_sat}",
              f"locked_btc={locked_sat / 100_000_000:.8f}",
              f"locking_cap_btc={values['locking_cap'] / 100_000_000:.8f}",
              f"remaining_cap_btc={remaining_sat / 100_000_000:.8f}",
              f"minimum_lock_sat={values['minimum_lock']}",
              f"collateral_contract_balance_wei={values['collateral_contract_balance']}",
              f"pegout_contract_balance_wei={values['pegout_contract_balance']}",
              f"min_collateral_wei={values['min_collateral']}",
              f"min_collateral_rbtc={values['min_collateral'] / 1e18:.18f}",
              f"reward_percentage_bps={values['reward_percentage']}",
              f"reward_percentage_percent={values['reward_percentage'] / 100:.2f}",
              f"resign_delay_blocks={values['resign_delay_blocks']}",
              f"historical_penalty_fee_wei={penalty_fee}",
              f"historical_penalty_fee_rbtc={penalty_fee / 1e18:.8f}",
              f"reward_per_poisoned_quote_wei={reward_per_quote}",
              f"reward_per_poisoned_quote_rbtc={reward_per_quote / 1e18:.18f}",
          ]

          for provider in ["default", "teks"]:
              collateral = values[f"{provider}_pegout_collateral"]
              min_collateral = values["min_collateral"]
              quotes_to_below_min = ((collateral - min_collateral) // penalty_fee + 1) if collateral >= min_collateral else 0
              quotes_to_zero = (collateral + penalty_fee - 1) // penalty_fee
              lines.extend([
                  f"{provider}_pegout_collateral_wei={collateral}",
                  f"{provider}_pegout_collateral_rbtc={collateral / 1e18:.18f}",
                  f"{provider}_resignation_block={values[f'{provider}_resignation_block']}",
                  f"{provider}_pegout_sufficient={bool(values[f'{provider}_pegout_sufficient'])}",
                  f"{provider}_rbtc_balance_wei={values[f'{provider}_rbtc_balance']}",
                  f"{provider}_quotes_to_below_min={quotes_to_below_min}",
                  f"{provider}_quotes_to_zero={quotes_to_zero}",
                  f"{provider}_rewards_to_below_min_wei={quotes_to_below_min * reward_per_quote}",
                  f"{provider}_rewards_to_below_min_rbtc={quotes_to_below_min * reward_per_quote / 1e18:.18f}",
              ])

          (out / "SUMMARY.txt").write_text("\n".join(lines) + "\n")
          (out / "VALUES.json").write_text(json.dumps(values, indent=2) + "\n")
          print("\n".join(lines))
          PY

          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rpc=$RPC"
            echo "bridge=$BRIDGE"
            echo "collateral=$COLLATERAL"
            echo "pegout=$PEGOUT"
            echo "mode=read-only; no transaction or quote submitted"
          } > "$OUT/MANIFEST.txt"
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload read-only snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rootstock-locking-cap-readonly-20260727
          path: ${{ runner.temp }}/rootstock-locking-cap
          if-no-files-found: error
          retention-days: 3
