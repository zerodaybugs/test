name: Rootstock locking-cap read-only snapshot 20260727

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Query public Rootstock state without transactions
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/rootstock-locking-cap"
          RPC="https://public-node.rsk.co"
          BRIDGE="0x0000000000000000000000000000000001000006"
          mkdir -p "$OUT"

          rpc() {
            local name="$1"
            local payload="$2"
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
              -H 'content-type: application/json' --data "$payload" "$RPC" \
              | tee "$OUT/$name.json"
            printf '\n'
          }

          rpc chain_id '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          rpc block_number '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}'
          rpc bridge_balance "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"eth_getBalance\",\"params\":[\"$BRIDGE\",\"latest\"]}"
          rpc locking_cap "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"eth_call\",\"params\":[{\"to\":\"$BRIDGE\",\"data\":\"0x3f9db977\"},\"latest\"]}"
          rpc minimum_lock "{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"eth_call\",\"params\":[{\"to\":\"$BRIDGE\",\"data\":\"0x2f8d158f\"},\"latest\"]}"

          python3 - "$OUT" <<'PY'
          import json
          import pathlib
          import sys
          out = pathlib.Path(sys.argv[1])
          def result(name):
              obj = json.loads((out / f"{name}.json").read_text())
              if obj.get("error"):
                  raise SystemExit(f"{name} rpc error: {obj['error']}")
              return obj["result"]
          chain_id = int(result("chain_id"), 16)
          block = int(result("block_number"), 16)
          balance_wei = int(result("bridge_balance"), 16)
          cap_sat = int(result("locking_cap"), 16)
          minimum_sat = int(result("minimum_lock"), 16)
          sat_to_wei = 10_000_000_000
          max_rbtc_sat = 21_000_000 * 100_000_000
          bridge_balance_sat = balance_wei // sat_to_wei
          locked_sat = max_rbtc_sat - bridge_balance_sat
          remaining_sat = cap_sat - locked_sat
          lines = [
              f"chain_id={chain_id}",
              f"block_number={block}",
              f"bridge_balance_wei={balance_wei}",
              f"bridge_balance_sat={bridge_balance_sat}",
              f"max_rbtc_sat={max_rbtc_sat}",
              f"locked_sat={locked_sat}",
              f"locking_cap_sat={cap_sat}",
              f"remaining_cap_sat={remaining_sat}",
              f"locked_btc={locked_sat / 100_000_000:.8f}",
              f"locking_cap_btc={cap_sat / 100_000_000:.8f}",
              f"remaining_cap_btc={remaining_sat / 100_000_000:.8f}",
              f"minimum_lock_sat={minimum_sat}",
          ]
          (out / "SUMMARY.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rpc=$RPC"
            echo "bridge=$BRIDGE"
            echo "mode=read-only; no transaction submitted"
          } > "$OUT/MANIFEST.txt"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload read-only snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rootstock-locking-cap-readonly-20260727
          path: ${{ runner.temp }}/rootstock-locking-cap
          if-no-files-found: error
          retention-days: 1
