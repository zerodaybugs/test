name: Rootstock LPS event-emitter confusion PoC 20260728

on:
  push:
    branches:
      - ci/dependency-snapshot-20260727
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-lps-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.8'
          cache: false

      - name: Run exact LPS v2.5.1 exploit and fixed control
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/rootstock-lps-event-emitter-confusion"
          LPS="$ROOT/liquidity-provider-server"
          OUT="$ROOT/evidence"
          COMMIT="50ade621592a3eec48f431f282d074ce08a7781a"
          mkdir -p "$OUT"

          git clone https://github.com/rsksmart/liquidity-provider-server.git "$LPS"
          git -C "$LPS" checkout --detach "$COMMIT"
          test "$(git -C "$LPS" rev-parse HEAD)" = "$COMMIT"

          cp "$GITHUB_WORKSPACE/research/rootstock/lps_event_emitter_confusion_test.go" \
             "$LPS/internal/usecases/pegout/lps_event_emitter_confusion_test.go"

          cd "$LPS"
          go version | tee "$OUT/go-version.txt"
          git show -s \
            --format='repository=rsksmart/liquidity-provider-server%ncommit=%H%ncommit_date=%cI%nsubject=%s' HEAD \
            | tee "$OUT/lps-commit.txt"

          go test ./internal/usecases/pegout \
            -run '^TestAudit(ForgedPrecedingDepositEventCausesTerminalPegoutFailure|EmitterBoundParserSelectsLegitimateEvent)$' \
            -count=1 -v 2>&1 | tee "$OUT/lps-event-emitter-confusion-poc.log"

          cp internal/usecases/pegout/lps_event_emitter_confusion_test.go "$OUT/"
          cp internal/adapters/dataproviders/rootstock/parsing.go "$OUT/production-parsing.go"
          cp internal/usecases/pegout/send_pegout.go "$OUT/production-send-pegout.go"
          git diff -- internal/usecases/pegout/lps_event_emitter_confusion_test.go \
            > "$OUT/poc.patch"

          {
            echo "RESULT=PASS"
            echo "production_parser_selects_first_matching_signature=true"
            echo "legitimate_lbc_event_present_later=true"
            echo "terminal_state=SendPegoutFailed"
            echo "btc_send_attempted=false"
            echo "fixed_emitter_bound_control=PASS"
          } > "$OUT/RESULT.txt"

          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "mode=local unit test against exact public source"
            echo "transactions_submitted=0"
            echo "live_provider_requests=0"
          } > "$OUT/MANIFEST.txt"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootstock-lps-event-emitter-confusion-20260728
          path: ${{ runner.temp }}/rootstock-lps-event-emitter-confusion/evidence
          if-no-files-found: error
          retention-days: 3
