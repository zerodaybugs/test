name: Rootstock public PowHSM source and TCPSigner materialization 20260731

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rootstock-powhsm-materialize-20260731.yml"

permissions:
  contents: read

concurrency:
  group: rootstock-powhsm-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install public build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git libsecp256k1-dev file ca-certificates

      - name: Fetch immutable public sources and build TCPSigner targets
        run: |
          set -euo pipefail
          rm -rf rsk-powhsm output
          git clone https://github.com/rsksmart/rsk-powhsm.git rsk-powhsm
          mkdir -p output/source output/bin

          build_one() {
            label="$1"
            expected="$2"

            git -C rsk-powhsm checkout --detach "$expected"
            git -C rsk-powhsm clean -ffdx
            actual="$(git -C rsk-powhsm rev-parse HEAD)"
            test "$actual" = "$expected"

            git -C rsk-powhsm archive \
              --format=tar.gz \
              --prefix="rsk-powhsm-${label}/" \
              -o "../output/source/rsk-powhsm-${label}-${actual}.tar.gz" \
              "$actual"

            make -C rsk-powhsm/firmware/src/tcpsigner clean || true
            make -C rsk-powhsm/firmware/src/tcpsigner HSM_AFL=1 -j2

            mkdir -p "output/bin/${label}/lib"
            cp rsk-powhsm/firmware/src/tcpsigner/tcpsigner \
              "output/bin/${label}/tcpsigner"
            file "output/bin/${label}/tcpsigner" \
              > "output/bin/${label}/FILE_TYPE.txt"
            ldd "output/bin/${label}/tcpsigner" \
              > "output/bin/${label}/LDD.txt"
            cp /usr/lib/x86_64-linux-gnu/libsecp256k1.so.* \
              "output/bin/${label}/lib/"
            printf '%s\n' "$actual" > "output/bin/${label}/SOURCE_COMMIT.txt"
          }

          build_one release-5.6.1 ab0bee9c25394f862ae75bc7c6618c25bdb9bbeb
          build_one release-5.6.2 b58f634520a81700d6f067ab19f897afacb9b29d
          build_one master-20260731 e967c3071ee23f60bed4d565124b9e6e35b403ec

          find output -type f -print0 | sort -z | xargs -0 sha256sum \
            > output/SHA256SUMS.txt

      - name: Upload public source and binary material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rootstock-powhsm-public-material-20260731
          path: output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
