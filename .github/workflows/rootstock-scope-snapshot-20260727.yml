name: Rootstock public scope snapshot 20260727

on:
  push:
    branches:
      - ci/dependency-snapshot-20260727
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Snapshot public Rootstock scope sources
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/rootstock-scope"
          SRC="$ROOT/sources"
          mkdir -p "$SRC"

          clone_head() {
            local repo="$1"
            local dir="$2"
            git clone --depth 1 --filter=blob:none "https://github.com/$repo.git" "$SRC/$dir"
            git -C "$SRC/$dir" show -s --format='repository=%s%ncommit=%H%ncommit_date=%cI%nsubject=%s' HEAD > "$SRC/$dir/SNAPSHOT_COMMIT.txt"
            rm -rf "$SRC/$dir/.git"
          }

          clone_exact() {
            local repo="$1"
            local commit="$2"
            local dir="$3"
            git init "$SRC/$dir"
            git -C "$SRC/$dir" remote add origin "https://github.com/$repo.git"
            git -C "$SRC/$dir" fetch --depth 1 origin "$commit"
            git -C "$SRC/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$SRC/$dir" rev-parse HEAD)" = "$commit"
            git -C "$SRC/$dir" show -s --format='repository=%s%ncommit=%H%ncommit_date=%cI%nsubject=%s' HEAD > "$SRC/$dir/SNAPSHOT_COMMIT.txt"
            rm -rf "$SRC/$dir/.git"
          }

          clone_head rsksmart/rskj rskj-head
          clone_head rsksmart/powpeg-node powpeg-node-head
          clone_head rsksmart/rsk-powhsm rsk-powhsm-head
          clone_head rsksmart/liquidity-bridge-contract liquidity-bridge-contract-head
          clone_head rsksmart/liquidity-provider-server liquidity-provider-server-head
          clone_head rsksmart/flyover-sdk flyover-sdk-head
          clone_head rsksmart/bridges-core-sdk bridges-core-sdk-head
          clone_head rsksmart/2wp-api 2wp-api-head
          clone_head rsksmart/2wp-app 2wp-app-head

          clone_exact rsksmart/liquidity-bridge-contract 4066b8fb726bb6c7cf9c0fb7d2761ff6739c8793 liquidity-bridge-contract-deployed
          clone_exact rsksmart/liquidity-provider-server 50ade621592a3eec48f431f282d074ce08a7781a liquidity-provider-server-target
          clone_exact rsksmart/bitcoinj-thin 91cdadae0b740f0f5282795c683b038cf385ec2f bitcoinj-thin-0.14.4-rsk-18

          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=$(uname -a)"
            echo "purpose=public source snapshot for local authorized bounty review"
          } > "$ROOT/MANIFEST.txt"

          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/ALL_FILES_SHA256.txt"
          tar -C "$ROOT" --zstd -cf "$RUNNER_TEMP/rootstock-public-scope-20260727.tar.zst" .
          sha256sum "$RUNNER_TEMP/rootstock-public-scope-20260727.tar.zst" > "$RUNNER_TEMP/rootstock-public-scope-20260727.tar.zst.sha256"

      - name: Upload public source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rootstock-public-scope-20260727
          path: |
            ${{ runner.temp }}/rootstock-public-scope-20260727.tar.zst
            ${{ runner.temp }}/rootstock-public-scope-20260727.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
