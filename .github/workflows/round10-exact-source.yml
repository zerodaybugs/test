name: Round 10 exact Sui DeepBook Seal source

on:
  push:
    branches:
      - "sui-runtime-extract-20260815"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone exact public heads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/round10/repos /tmp/round10/evidence
          git clone --depth=1 https://github.com/MystenLabs/sui.git /tmp/round10/repos/sui
          git clone --depth=1 https://github.com/MystenLabs/deepbookv3.git /tmp/round10/repos/deepbookv3
          git clone --depth=1 https://github.com/MystenLabs/seal.git /tmp/round10/repos/seal

          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('/tmp/round10/repos')
          out = {}
          for name in ('sui', 'deepbookv3', 'seal'):
              repo = root / name
              def g(*args):
                  return subprocess.check_output(['git', '-C', str(repo), *args], text=True).strip()
              out[name] = {
                  'head': g('rev-parse', 'HEAD'),
                  'commit_date': g('show', '-s', '--format=%cI', 'HEAD'),
                  'subject': g('show', '-s', '--format=%s', 'HEAD'),
                  'remote': g('remote', 'get-url', 'origin'),
              }
              (Path('/tmp/round10/evidence') / f'{name.upper()}_LOG.txt').write_text(
                  g('log', '-50', '--date=iso-strict', '--format=%H\t%aI\t%cI\t%s') + '\n'
              )
          Path('/tmp/round10/evidence/HEADS.json').write_text(json.dumps(out, indent=2) + '\n')
          PY

      - name: Build compact security corpus
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/round10
          mkdir -p "$ROOT/corpus"

          # Full Move sources and security-critical Rust/TS surfaces only.
          for repo in sui deepbookv3 seal; do
            cd "$ROOT/repos/$repo"
            mkdir -p "$ROOT/corpus/$repo"
            find . -type f \
              \( -name '*.move' -o -name 'Move.toml' -o -name '*.rs' -o -name '*.proto' -o -name '*.ts' -o -name '*.tsx' -o -name 'package.json' -o -name 'Cargo.toml' \) \
              ! -path './.git/*' ! -path '*/target/*' ! -path '*/node_modules/*' \
              -print0 | while IFS= read -r -d '' f; do
                case "$f" in
                  *.move|*/Move.toml) keep=1 ;;
                  *)
                    if grep -Eqi 'signature|zklogin|passkey|multisig|alias|allowance|withdraw|liquidat|bad.?debt|insurance|margin|accumulator|settle|rebate|overflow|underflow|replay|nonce|authorization|permission|cache|decrypt|key.?server|consensus|checkpoint|effects' "$f"; then keep=1; else keep=0; fi
                    ;;
                esac
                if [[ "$keep" == 1 ]]; then
                  mkdir -p "$ROOT/corpus/$repo/$(dirname "$f")"
                  cp "$f" "$ROOT/corpus/$repo/$f"
                fi
              done
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('/tmp/round10')
          rows = []
          for p in sorted((root/'corpus').rglob('*')):
              if p.is_file():
                  rows.append({
                      'path': str(p.relative_to(root)),
                      'size': p.stat().st_size,
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  })
          (root/'evidence'/'CORPUS_MANIFEST.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY

      - name: Package exact source artifact
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/round10
          tar --sort=name --mtime='UTC 2026-08-16' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/round10-exact-source.tar.gz evidence corpus
          sha256sum /tmp/round10-exact-source.tar.gz > /tmp/round10-exact-source.tar.gz.sha256

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: round10-exact-sui-deepbook-seal
          path: |
            /tmp/round10-exact-source.tar.gz
            /tmp/round10-exact-source.tar.gz.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
