name: Runner virtualization capability

on:
  push:
    branches:
      - openvmm-source-snapshot-20260815
    paths:
      - .github/workflows/runner-virtualization-capability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture virtualization capability
        shell: bash
        run: |
          set -euxo pipefail
          uname -a | tee capability.txt
          lscpu | tee -a capability.txt
          ls -l /dev/kvm | tee -a capability.txt || true
          test -e /dev/kvm && echo KVM_DEVICE_PRESENT | tee -a capability.txt || echo KVM_DEVICE_MISSING | tee -a capability.txt
          grep -E 'vmx|svm' /proc/cpuinfo | head -1 | tee -a capability.txt || true
      - name: Upload capability record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-virtualization-capability
          path: capability.txt
          retention-days: 1
