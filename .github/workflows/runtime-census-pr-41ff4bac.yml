name: Temporary encrypted runtime census PR

on:
  pull_request:
    branches:
      - tmp/runtime-census-41ff4bac
    paths:
      - '.runtime-trigger/**'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Execute embedded read-only collectors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input pyyaml
          python3 - <<'PY'
          import subprocess
          import yaml

          with open('.github/workflows/runtime-census-41ff4bac.yml', 'r', encoding='utf-8') as fh:
              workflow = yaml.safe_load(fh)

          steps = workflow['jobs']['census']['steps']
          for step in steps:
              script = step.get('run')
              if not script:
                  continue
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY

      - name: Upload encrypted evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-census-pr-41ff4bac-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
