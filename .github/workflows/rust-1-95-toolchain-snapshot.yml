name: Rust 1.95 portable toolchain snapshot

on:
  push:
    branches:
      - openvmm-source-snapshot-20260815
    paths:
      - '.github/workflows/rust-1-95-toolchain-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustc +1.95.0 --version
          cargo +1.95.0 --version

      - name: Archive exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc +1.95.0 --print sysroot)"
          parent="$(dirname "$sysroot")"
          base="$(basename "$sysroot")"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz -C "$parent" "$base"
          sha256sum rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz > SHA256SUMS-RUST.txt
          {
            rustc +1.95.0 --version --verbose
            cargo +1.95.0 --version --verbose
            echo "sysroot_basename=$base"
          } > RUST_IDENTITY.txt

      - name: Upload exact public toolchain snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.95.0-x86_64-unknown-linux-gnu
          path: |
            rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz
            SHA256SUMS-RUST.txt
            RUST_IDENTITY.txt
          if-no-files-found: error
          retention-days: 7
