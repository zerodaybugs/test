name: Export Rust 1.91.1 toolchain

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pinned minimal toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.91.1-x86_64-unknown-linux-gnu --profile minimal --no-self-update
          "$HOME/.rustup/toolchains/1.91.1-x86_64-unknown-linux-gnu/bin/rustc" --version --verbose
          "$HOME/.rustup/toolchains/1.91.1-x86_64-unknown-linux-gnu/bin/cargo" --version --verbose

      - name: Package toolchain with permissions and symlinks preserved
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$HOME/.rustup/toolchains" \
            -czf rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.gz \
            1.91.1-x86_64-unknown-linux-gnu
          sha256sum rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.gz \
            > rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.gz.sha256
          ls -lh rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.gz*

      - name: Upload toolchain archive
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-1.91.1-x86_64-unknown-linux-gnu
          path: |
            rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.gz
            rust-toolchain-1.91.1-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
