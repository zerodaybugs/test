name: rust-toolchain-relay-1911

on:
  push:
    branches:
      - tooling/rust-1.91-relay-20260822
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download and package pinned Rust 1.91.1 Ubuntu toolchain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base='https://repos.interior.edu.uy/ubuntu/pool/universe/r/rustc-1.91'
          files=(
            'cargo-1.91_1.91.1+dfsg~22.04-0ubuntu0.22.04.3_amd64.deb'
            'libstd-rust-1.91-dev_1.91.1+dfsg~22.04-0ubuntu0.22.04.3_amd64.deb'
            'libstd-rust-1.91_1.91.1+dfsg~22.04-0ubuntu0.22.04.3_amd64.deb'
            'rustc-1.91_1.91.1+dfsg~22.04-0ubuntu0.22.04.3_amd64.deb'
          )
          mkdir -p dist/pkgs
          for file in "${files[@]}"; do
            curl --proto '=https' --tlsv1.2 --fail --show-error --location \
              --retry 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              --output "dist/pkgs/${file}.part" "${base}/${file}"
            test "$(stat -c '%s' "dist/pkgs/${file}.part")" -gt 1000000
            mv "dist/pkgs/${file}.part" "dist/pkgs/${file}"
            dpkg-deb --info "dist/pkgs/${file}" >/dev/null
          done
          (
            cd dist/pkgs
            TZ=UTC touch -t 202608220000.00 "${files[@]}"
            zip -X -9 ../rust-toolchain-packages-1.91.1.zip "${files[@]}"
          )
          sha256sum dist/pkgs/*.deb dist/rust-toolchain-packages-1.91.1.zip > dist/SHA256SUMS
          printf '%s\n' "${files[@]}" > dist/FILES.txt
          test "$(stat -c '%s' dist/rust-toolchain-packages-1.91.1.zip)" -gt 100000000

      - name: Upload relay artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-toolchain-packages-1.91.1
          path: |
            dist/rust-toolchain-packages-1.91.1.zip
            dist/SHA256SUMS
            dist/FILES.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
