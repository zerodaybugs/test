name: sBTC token deployed source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sbtc-token-deployed-source-snapshot.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch public deployed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbtc-source
          node <<'NODE'
          const fs = require('node:fs');
          const address = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4';
          const name = 'sbtc-token';
          const url = `https://api.mainnet.hiro.so/v2/contracts/source/${address}/${name}?proof=0`;
          (async () => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${response.status}: ${await response.text()}`);
            const json = await response.json();
            if (typeof json.source !== 'string') throw new Error('missing source');
            fs.writeFileSync('sbtc-source/sbtc-token.clar', json.source);
            fs.writeFileSync('sbtc-source/manifest.json', JSON.stringify({
              captured_at: new Date().toISOString(),
              address,
              name,
              publish_height: json.publish_height,
              source_length: json.source.length,
            }, null, 2) + '\n');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          sha256sum sbtc-source/sbtc-token.clar sbtc-source/manifest.json > sbtc-source/SHA256SUMS

      - name: Upload deployed source
        uses: actions/upload-artifact@v4
        with:
          name: sbtc-token-deployed-source-${{ github.run_id }}
          path: sbtc-source/
          if-no-files-found: error
          retention-days: 1
