name: Public schema export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fsSL https://raw.githubusercontent.com/alchemy-run/distilled/e70eb61de27ae2d197d6b24cd3031d1519bf7307/packages/vercel/.generated-specs/sandboxes.json -o out/sandboxes.json
          git clone --depth 1 https://github.com/vercel/sdk.git out/vercel-sdk
          git -C out/vercel-sdk rev-parse HEAD > out/vercel-sdk-commit.txt
          rm -rf out/vercel-sdk/.git
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: public-schema-export
          path: out/
          retention-days: 1
