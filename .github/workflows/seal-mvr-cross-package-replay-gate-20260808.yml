name: Seal MVR cross-package replay gate 20260808

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUST_BACKTRACE: short
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Clone exact public Seal source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/MystenLabs/seal.git seal
          git -C seal checkout 0654ba380e92bd1ee3634cd5b9c8df446f433cd5
          test "$(git -C seal rev-parse HEAD)" = "0654ba380e92bd1ee3634cd5b9c8df446f433cd5"
          git -C seal rev-parse HEAD | tee SEAL_SOURCE_COMMIT.txt

      - name: Inject exact regression test
        shell: bash
        run: |
          set -euo pipefail
          cat research/seal_mvr_cross_package_replay_test.rs >> seal/crates/key-server/src/tests/externals.rs
          rustup update
          rustup toolchain install
          rustfmt --edition 2024 seal/crates/key-server/src/tests/externals.rs
          cp seal/crates/key-server/src/tests/externals.rs EXACT_TEST_SOURCE.rs
          sha256sum research/seal_mvr_cross_package_replay_test.rs EXACT_TEST_SOURCE.rs | tee TEST_SOURCE_SHA256.txt

      - name: Compile and execute exact key-server request-path PoC
        shell: bash
        run: |
          set -o pipefail
          cd seal
          cargo test -p key-server test_mvr_session_certificate_cross_package_replay -- --nocapture 2>&1 | tee ../EXACT_GATE.log

      - name: Extract gate markers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -E 'SEAL_MVR_CROSS_PACKAGE_CERT_REPLAY_(PASS|FAIL)|test result:|error\[E[0-9]+\]|panicked at' EXACT_GATE.log > GATE_MARKERS.txt || true
          cat GATE_MARKERS.txt
          sha256sum EXACT_GATE.log GATE_MARKERS.txt SEAL_SOURCE_COMMIT.txt TEST_SOURCE_SHA256.txt > EVIDENCE_SHA256SUMS.txt

      - name: Upload exact gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-mvr-cross-package-replay-gate-20260808
          path: |
            EXACT_GATE.log
            GATE_MARKERS.txt
            SEAL_SOURCE_COMMIT.txt
            TEST_SOURCE_SHA256.txt
            EVIDENCE_SHA256SUMS.txt
            EXACT_TEST_SOURCE.rs
            research/seal_mvr_cross_package_replay_test.rs
          retention-days: 1
