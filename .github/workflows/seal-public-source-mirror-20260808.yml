name: Seal public source mirror 20260808

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone current public Seal main
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/MystenLabs/seal.git seal
          git -C seal checkout main
          git -C seal rev-parse HEAD | tee SEAL_HEAD.txt
          git -C seal status --porcelain=v1 | tee SEAL_STATUS.txt
          test ! -s SEAL_STATUS.txt
      - name: Create provenance archive
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(cat SEAL_HEAD.txt)"
          printf '%s\n' "$head_sha" > seal/SOURCE_COMMIT
          tar --exclude='seal/.git' -czf "seal-${head_sha}-public-source.tar.gz" seal
          sha256sum "seal-${head_sha}-public-source.tar.gz" > "seal-${head_sha}-public-source.tar.gz.sha256"
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: seal-public-source-20260808
          path: |
            seal-*-public-source.tar.gz
            seal-*-public-source.tar.gz.sha256
            SEAL_HEAD.txt
          retention-days: 1
