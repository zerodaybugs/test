name: Seal public source mirror 20260808

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact public Seal source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/MystenLabs/seal.git seal
          cd seal
          git checkout 0654ba380e92bd1ee3634cd5b9c8df446f433cd5
          test "$(git rev-parse HEAD)" = "0654ba380e92bd1ee3634cd5b9c8df446f433cd5"
          git rev-parse HEAD > ../SEAL_COMMIT.txt
          git status --porcelain=v1 > ../SEAL_STATUS.txt
          cd ..
          tar --exclude='seal/.git' -czf seal-0654ba380e92bd1ee3634cd5b9c8df446f433cd5.tar.gz seal
          sha256sum seal-0654ba380e92bd1ee3634cd5b9c8df446f433cd5.tar.gz > SHA256SUMS.txt
      - name: Upload exact public source
        uses: actions/upload-artifact@v4
        with:
          name: seal-0654ba38-public-source
          path: |
            seal-0654ba380e92bd1ee3634cd5b9c8df446f433cd5.tar.gz
            SEAL_COMMIT.txt
            SEAL_STATUS.txt
            SHA256SUMS.txt
          retention-days: 1
