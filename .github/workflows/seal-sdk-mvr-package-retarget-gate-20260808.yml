name: Seal SDK MVR package retarget gate 20260808

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sdk-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Clone exact public TypeScript SDK source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/MystenLabs/ts-sdks.git ts-sdks
          git -C ts-sdks checkout 5fd97fb14fd15d96735064abe52522627b8c0358
          test "$(git -C ts-sdks rev-parse HEAD)" = "5fd97fb14fd15d96735064abe52522627b8c0358"
          git -C ts-sdks rev-parse HEAD | tee TS_SDK_SOURCE_COMMIT.txt

      - name: Inject exact regression test
        shell: bash
        run: |
          set -euo pipefail
          cp research/seal_sdk_mvr_package_retarget.test.ts \
            ts-sdks/packages/seal/test/unit/mvr-package-retarget.test.ts
          sha256sum research/seal_sdk_mvr_package_retarget.test.ts \
            ts-sdks/packages/seal/test/unit/mvr-package-retarget.test.ts \
            | tee TEST_SOURCE_SHA256.txt

      - name: Install workspace dependencies
        shell: bash
        working-directory: ts-sdks
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build and link exact workspace Sui peer
        shell: bash
        working-directory: ts-sdks
        run: |
          set -euo pipefail
          pnpm --filter @mysten/sui build
          mkdir -p packages/seal/node_modules/@mysten
          ln -sfn ../../../sui packages/seal/node_modules/@mysten/sui
          test -f packages/sui/dist/keypairs/ed25519/index.mjs
          test -L packages/seal/node_modules/@mysten/sui
          readlink packages/seal/node_modules/@mysten/sui | tee ../SUI_PEER_LINK.txt

      - name: Compile and execute exact SDK PoC
        shell: bash
        run: |
          set -o pipefail
          cd ts-sdks
          pnpm --filter @mysten/seal exec vitest run test/unit/mvr-package-retarget.test.ts \
            --reporter=verbose 2>&1 | tee ../EXACT_SDK_GATE.log

      - name: Extract gate markers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -E 'SEAL_SDK_MVR_PACKAGE_RETARGET_(PASS|FAIL)|Test Files|Tests|FAIL|Error:' \
            EXACT_SDK_GATE.log > SDK_GATE_MARKERS.txt || true
          cat SDK_GATE_MARKERS.txt
          sha256sum EXACT_SDK_GATE.log SDK_GATE_MARKERS.txt TS_SDK_SOURCE_COMMIT.txt \
            TEST_SOURCE_SHA256.txt SUI_PEER_LINK.txt > SDK_EVIDENCE_SHA256SUMS.txt

      - name: Upload exact SDK gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-sdk-mvr-package-retarget-gate-20260808
          path: |
            EXACT_SDK_GATE.log
            SDK_GATE_MARKERS.txt
            TS_SDK_SOURCE_COMMIT.txt
            TEST_SOURCE_SHA256.txt
            SUI_PEER_LINK.txt
            SDK_EVIDENCE_SHA256SUMS.txt
            research/seal_sdk_mvr_package_retarget.test.ts
          retention-days: 1
