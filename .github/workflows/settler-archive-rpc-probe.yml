name: Probe public Ethereum archive RPCs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/settler-archive-rpc-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Probe exact historical state
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          TARGET_BLOCK=25180132
          REGISTRY=0x00000000000004533Fe15556B1E086BB1A72cEae
          TELLER=0xeE98730AAAdA5e6e092cA69F1AC1B9B554c059dF
          PASS_COUNT=0
          INDEX=0

          probe() {
            RPC="$1"
            INDEX=$((INDEX + 1))
            HOST="$(printf '%s' "$RPC" | sed -E 's#https?://([^/]+).*#\1#')"
            LOG="evidence/probe-${INDEX}.log"
            {
              echo "index=$INDEX"
              echo "host=$HOST"
              echo "target_block=$TARGET_BLOCK"
              echo "registry=$REGISTRY"
              echo "teller=$TELLER"
              echo
            } > "$LOG"

            timeout 20s cast chain-id --rpc-url "$RPC" >> "$LOG" 2>&1
            CHAIN_RC=$?
            timeout 25s cast code "$REGISTRY" --block "$TARGET_BLOCK" --rpc-url "$RPC" \
              > "evidence/probe-${INDEX}-registry-code.txt" 2>> "$LOG"
            REGISTRY_RC=$?
            timeout 25s cast code "$TELLER" --block "$TARGET_BLOCK" --rpc-url "$RPC" \
              > "evidence/probe-${INDEX}-teller-code.txt" 2>> "$LOG"
            TELLER_RC=$?

            REGISTRY_CODE="$(tr -d '\r\n' < "evidence/probe-${INDEX}-registry-code.txt" 2>/dev/null)"
            TELLER_CODE="$(tr -d '\r\n' < "evidence/probe-${INDEX}-teller-code.txt" 2>/dev/null)"
            if [ "$CHAIN_RC" = 0 ] && [ "$REGISTRY_RC" = 0 ] && [ "$TELLER_RC" = 0 ] \
               && [ "$REGISTRY_CODE" != "0x" ] && [ "$TELLER_CODE" != "0x" ]; then
              STATUS=PASS
              PASS_COUNT=$((PASS_COUNT + 1))
              printf '%s\n' "$RPC" >> evidence/passing-endpoints.txt
            else
              STATUS=FAIL
            fi
            {
              echo "chain_rc=$CHAIN_RC"
              echo "registry_rc=$REGISTRY_RC"
              echo "teller_rc=$TELLER_RC"
              echo "registry_code_bytes=$(( (${#REGISTRY_CODE} > 2 ? ${#REGISTRY_CODE} - 2 : 0) / 2 ))"
              echo "teller_code_bytes=$(( (${#TELLER_CODE} > 2 ? ${#TELLER_CODE} - 2 : 0) / 2 ))"
              echo "status=$STATUS"
            } >> "$LOG"
          }

          probe https://eth.drpc.org
          probe https://eth-mainnet.public.blastapi.io
          probe https://ethereum.blockpi.network/v1/rpc/public
          probe https://eth-mainnet-public.unifra.io
          probe https://api.zan.top/eth-mainnet
          probe https://eth-pokt.nodies.app
          probe https://rpc.payload.de
          probe https://gateway.tenderly.co/public/mainnet
          probe https://mainnet.gateway.tenderly.co
          probe https://rpc.mevblocker.io
          probe https://rpc.flashbots.net
          probe https://eth-mainnet.g.alchemy.com/v2/demo
          probe https://rpc.ankr.com/eth
          probe https://cloudflare-eth.com
          probe https://ethereum.publicnode.com
          probe https://ethereum-rpc.publicnode.com
          probe https://eth.llamarpc.com
          probe https://1rpc.io/eth
          probe https://eth.merkle.io
          probe https://endpoints.omniatech.io/v1/eth/mainnet/public
          probe https://rpc.eth.gateway.fm
          probe https://eth.rpc.blxrbdn.com

          {
            echo "pass_count=$PASS_COUNT"
            echo "probe_count=$INDEX"
          } > evidence/summary.txt
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
          exit 0

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settler-archive-rpc-probe-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Require at least one archive endpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^pass_count=[1-9][0-9]*$' evidence/summary.txt
