name: Run exact Nucleus refund-state export

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/settler-refund-state-export/**'
      - '.github/workflows/settler-refund-export-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exporter
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run exact upstream fork path and export state
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/evidence"
          TARGET=/tmp/0x-settler
          COMMIT=92bc8f11836fa96eaa7c5f0b1c371205dcafe245
          TEST_PATH=test/integration/NucleusRefundStateExport.t.sol
          mkdir -p "$ROOT"

          clone_rc=99
          checkout_rc=99
          submodule_rc=99
          copy_rc=99
          solc34_rc=99
          solc25_rc=99
          test_rc=99
          selected_rpc=''

          {
            echo "target_repository=0xProject/0x-settler"
            echo "target_commit=$COMMIT"
            echo "fork_block=25180132"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            forge --version
          } > "$ROOT/PROVENANCE.txt" 2>&1

          rm -rf "$TARGET"
          git clone https://github.com/0xProject/0x-settler.git "$TARGET" > "$ROOT/clone.log" 2>&1
          clone_rc=$?
          if [ "$clone_rc" = 0 ]; then
            git -C "$TARGET" checkout --detach "$COMMIT" >> "$ROOT/clone.log" 2>&1
            checkout_rc=$?
            git -C "$TARGET" submodule update --init --recursive >> "$ROOT/clone.log" 2>&1
            submodule_rc=$?
          fi

          if [ "$checkout_rc" = 0 ] && [ "$submodule_rc" = 0 ]; then
            cp "$GITHUB_WORKSPACE/infra/settler-refund-state-export/NucleusRefundStateExport.t.sol" "$TARGET/$TEST_PATH"
            copy_rc=$?
          fi

          if [ "$copy_rc" = 0 ]; then
            (
              cd "$TARGET"
              FOUNDRY_SOLC_VERSION=0.8.34 forge build -- src/chains/Mainnet/BridgeSettler.sol
            ) > "$ROOT/solc-0.8.34-build.log" 2>&1
            solc34_rc=$?
            (
              cd "$TARGET"
              FOUNDRY_SOLC_VERSION=0.8.25 forge build -- \
                src/allowanceholder/AllowanceHolder.sol src/deployer/Deployer.sol
            ) > "$ROOT/solc-0.8.25-build.log" 2>&1
            solc25_rc=$?
          fi

          if [ "$solc34_rc" = 0 ] && [ "$solc25_rc" = 0 ]; then
            index=0
            for rpc in \
              https://eth.drpc.org \
              https://eth-mainnet.public.blastapi.io \
              https://api.zan.top/eth-mainnet \
              https://eth-pokt.nodies.app \
              https://gateway.tenderly.co/public/mainnet \
              https://mainnet.gateway.tenderly.co \
              https://rpc.mevblocker.io \
              https://eth.merkle.io \
              https://rpc.eth.gateway.fm
            do
              index=$((index + 1))
              host="$(printf '%s' "$rpc" | sed -E 's#https?://([^/]+).*#\1#')"
              log="$ROOT/forge-test-${index}-${host}.log"
              (
                cd "$TARGET"
                rm -rf artifacts
                FOUNDRY_PROFILE=integration \
                MAINNET_RPC_URL="$rpc" \
                forge test \
                  --match-path "$TEST_PATH" \
                  --match-contract NucleusRefundStateExport \
                  --match-test testExportOfficialRefundState \
                  --skip 'src/*' \
                  --skip 'test/unit/*' \
                  --skip 'test/0.8.28/*' \
                  --skip 'test/integration/arbitrum/*' \
                  -vvvv
              ) > "$log" 2>&1
              attempt_rc=$?
              echo "exit_code=$attempt_rc" >> "$log"
              if [ "$attempt_rc" = 0 ] && [ -s "$TARGET/artifacts/refund-state-alloc.json" ]; then
                test_rc=0
                selected_rpc="$host"
                cp -a "$TARGET/artifacts/." "$ROOT/"
                break
              fi
              test_rc=$attempt_rc
            done
          fi

          printf '%s\n' \
            "clone_rc=$clone_rc" \
            "checkout_rc=$checkout_rc" \
            "submodule_rc=$submodule_rc" \
            "copy_rc=$copy_rc" \
            "solc34_rc=$solc34_rc" \
            "solc25_rc=$solc25_rc" \
            "test_rc=$test_rc" \
            "selected_rpc_host=$selected_rpc" \
            > "$ROOT/exit-codes.txt"
          find "$ROOT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS"
          exit 0

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settler-refund-exact-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Enforce exact fork gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'clone_rc=0' evidence/exit-codes.txt
          grep -Fx 'checkout_rc=0' evidence/exit-codes.txt
          grep -Fx 'submodule_rc=0' evidence/exit-codes.txt
          grep -Fx 'copy_rc=0' evidence/exit-codes.txt
          grep -Fx 'solc34_rc=0' evidence/exit-codes.txt
          grep -Fx 'solc25_rc=0' evidence/exit-codes.txt
          grep -Fx 'test_rc=0' evidence/exit-codes.txt
          grep -R -F '[PASS] testExportOfficialRefundState()' evidence/forge-test-*.log
          test -s evidence/refund-state-alloc.json
          test -s evidence/bridge-settler-address.txt
          test -s evidence/refund-amount.txt
