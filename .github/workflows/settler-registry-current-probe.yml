name: Record current 0x bridge registry bindings

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/settler-registry-current-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Query feature 5 from independent RPCs
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          REGISTRY=0x00000000000004533Fe15556B1E086BB1A72cEae
          AFFECTED=0xD7185c486dD88eb9F3573B878a1469485644091F
          INDEX=0
          PASS=0

          for rpc in \
            https://eth.drpc.org \
            https://eth-mainnet.public.blastapi.io \
            https://api.zan.top/eth-mainnet \
            https://eth-pokt.nodies.app \
            https://gateway.tenderly.co/public/mainnet \
            https://rpc.mevblocker.io \
            https://eth.merkle.io
          do
            INDEX=$((INDEX + 1))
            host="$(printf '%s' "$rpc" | sed -E 's#https?://([^/]+).*#\1#')"
            log="evidence/registry-${INDEX}-${host}.txt"
            owner="$(timeout 20s cast call "$REGISTRY" 'ownerOf(uint256)(address)' 5 --rpc-url "$rpc" 2>&1)"
            owner_rc=$?
            prev="$(timeout 20s cast call "$REGISTRY" 'prev(uint128)(address)' 5 --rpc-url "$rpc" 2>&1)"
            prev_rc=$?
            next="$(timeout 20s cast call "$REGISTRY" 'next(uint128)(address)' 5 --rpc-url "$rpc" 2>&1)"
            next_rc=$?
            head="$(timeout 20s cast block-number --rpc-url "$rpc" 2>&1)"
            head_rc=$?
            code="$(timeout 20s cast code "$AFFECTED" --rpc-url "$rpc" 2>&1)"
            code_rc=$?
            codehash="$(timeout 20s cast codehash "$AFFECTED" --rpc-url "$rpc" 2>&1)"
            codehash_rc=$?
            balance="$(timeout 20s cast balance "$AFFECTED" --rpc-url "$rpc" 2>&1)"
            balance_rc=$?
            {
              echo "queried_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "rpc_host=$host"
              echo "head_block=$head"
              echo "owner_of_feature_5=$owner"
              echo "prev_feature_5=$prev"
              echo "next_feature_5=$next"
              echo "affected=$AFFECTED"
              echo "affected_codehash=$codehash"
              echo "affected_balance_wei=$balance"
              echo "affected_runtime_bytes=$(( (${#code} > 2 ? ${#code} - 2 : 0) / 2 ))"
              echo "owner_rc=$owner_rc"
              echo "prev_rc=$prev_rc"
              echo "next_rc=$next_rc"
              echo "head_rc=$head_rc"
              echo "code_rc=$code_rc"
              echo "codehash_rc=$codehash_rc"
              echo "balance_rc=$balance_rc"
            } > "$log"
            if [ "$owner_rc" = 0 ] && [ "$prev_rc" = 0 ] && [ "$next_rc" = 0 ] \
              && [ "$head_rc" = 0 ] && [ "$code_rc" = 0 ] && [ "$codehash_rc" = 0 ] \
              && [ "$balance_rc" = 0 ] && [ "$code" != "0x" ]; then
              PASS=$((PASS + 1))
            fi
          done

          echo "successful_independent_rpc_results=$PASS" > evidence/summary.txt
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
          exit 0

      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settler-registry-current-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2

      - name: Enforce quorum
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^successful_independent_rpc_results=[3-9][0-9]*$|^successful_independent_rpc_results=[3-9]$' evidence/summary.txt
