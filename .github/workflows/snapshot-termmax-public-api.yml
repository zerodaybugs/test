name: Snapshot public TermMax API metadata

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-termmax-public-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query read-only public API endpoints
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/api-snapshot"
          BASE='https://api.termmax.ts.finance'
          mkdir -p "$OUT"

          python3 - "$OUT" "$BASE" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, ssl, sys, urllib.parse, urllib.request

          out = pathlib.Path(sys.argv[1])
          base = sys.argv[2].rstrip('/')
          ctx = ssl.create_default_context()
          endpoints = [
              ('market_config_general_eth', '/market/config/general', {'chainId': 1}),
              ('market_config_list_eth_v2_active', '/market/config/list', {
                  'chainId': 1, 'version': 'v2', 'includeInactive': 'false',
                  'onlyUnmatured': 'true', 'take': 200, 'page': 1,
              }),
              ('market_v2_list_collection_eth', '/v2/market/list-with-collection', {
                  'chainId': 1, 'version': 'v2', 'includeInactive': 'false',
              }),
              ('vault_list_eth_v2', '/vault/list', {
                  'chainId': 1, 'version': 'v2', 'includeInactive': 'false',
              }),
          ]
          inventory = []
          for name, path, query in endpoints:
              url = base + path + '?' + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 TermMax-public-metadata-snapshot',
                  'Accept': 'application/json',
              })
              try:
                  with urllib.request.urlopen(request, timeout=60, context=ctx) as response:
                      body = response.read()
                      status = response.status
                      headers = dict(response.headers.items())
              except Exception as exc:
                  inventory.append({'name': name, 'url': url, 'error': repr(exc)})
                  continue
              target = out / f'{name}.json'
              target.write_bytes(body)
              inventory.append({
                  'name': name, 'url': url, 'status': status,
                  'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest(),
                  'content_type': headers.get('Content-Type', ''),
              })
              try:
                  parsed = json.loads(body)
                  (out / f'{name}.pretty.json').write_text(json.dumps(parsed, indent=2) + '\n')
              except Exception:
                  pass
          (out / 'INVENTORY.json').write_text(json.dumps(inventory, indent=2) + '\n')
          with (out / 'SHA256SUMS.txt').open('w') as f:
              for p in sorted(out.glob('*')):
                  if p.is_file() and p.name != 'SHA256SUMS.txt':
                      f.write(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n')
          print(json.dumps(inventory, indent=2))
          if not any(item.get('status') == 200 for item in inventory):
              raise SystemExit('No public API endpoint returned HTTP 200')
          PY

      - name: Upload API snapshot
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-api-${{ github.run_id }}
          path: api-snapshot/
          if-no-files-found: error
          retention-days: 3
