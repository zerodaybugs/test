name: Public Solana Bankrun analysis runtime snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/solana-bankrun-runtime-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install and archive exact public runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/evidence
          cd runtime
          npm init -y >/dev/null
          npm config set registry https://registry.npmjs.org/
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 \
            @solana/spl-token@0.4.13 \
            solana-bankrun@0.4.0 \
            anchor-bankrun@0.5.0 \
            bs58@4.0.1 > evidence/NPM_INSTALL.log 2>&1
          npm ls --all --json > evidence/NPM_DEPENDENCY_TREE.json 2> evidence/NPM_LS_STDERR.log || true
          node - <<'NODE' > evidence/RESOLUTION.txt
          for (const moduleName of [
            '@velocity-exchange/sdk',
            '@solana/web3.js',
            '@solana/spl-token',
            'solana-bankrun',
            'anchor-bankrun',
            'bs58',
          ]) {
            console.log(moduleName, require.resolve(moduleName));
          }
          NODE
          tar -czf node_modules-runtime.tar.gz node_modules package.json package-lock.json
          sha256sum node_modules-runtime.tar.gz > evidence/RUNTIME_SHA256.txt
          printf 'public_chain_transactions=0\n' > evidence/SNAPSHOT_STATUS.txt

      - name: Upload exact runtime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: solana-bankrun-runtime-node24
          path: runtime
          if-no-files-found: error
          retention-days: 1
