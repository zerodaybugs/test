name: Generic solc 0.8.28 offline toolchain

on:
  push:
    branches:
      - paxos-public-toolchain-bootstrap-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Install pinned compiler
        run: |
          mkdir solc-toolchain
          cd solc-toolchain
          npm init -y
          npm install --save-exact --no-audit --no-fund solc@0.8.28
          node -e 'const s=require("solc"); console.log(s.version()); if(!s.version().startsWith("0.8.28+commit.7893614a")) process.exit(1)' | tee SOLC_VERSION.txt
          sha256sum package.json package-lock.json SOLC_VERSION.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: solc-0.8.28-offline-toolchain
          path: solc-toolchain
          retention-days: 1
          if-no-files-found: error
