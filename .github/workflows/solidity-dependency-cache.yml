name: Solidity Dependency Cache

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned Solidity source dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependencies
          curl --fail --location --retry 4 --retry-all-errors \
            'https://codeload.github.com/OpenZeppelin/openzeppelin-contracts/tar.gz/refs/tags/v5.6.1' \
            --output dependencies/openzeppelin-contracts-v5.6.1.tar.gz
          curl --fail --location --retry 4 --retry-all-errors \
            'https://codeload.github.com/foundry-rs/forge-std/tar.gz/refs/tags/v1.9.4' \
            --output dependencies/forge-std-v1.9.4.tar.gz
          sha256sum dependencies/* | tee dependencies/SHA256SUMS.txt

      - name: Validate expected source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validate/oz validate/forge-std
          tar -xzf dependencies/openzeppelin-contracts-v5.6.1.tar.gz -C validate/oz --strip-components=1
          tar -xzf dependencies/forge-std-v1.9.4.tar.gz -C validate/forge-std --strip-components=1
          test -f validate/oz/contracts/token/ERC20/extensions/ERC4626.sol
          test -f validate/oz/contracts/utils/ReentrancyGuardTransient.sol
          test -f validate/forge-std/src/Test.sol
          {
            echo 'OpenZeppelin Contracts v5.6.1'
            git -C validate/oz rev-parse --is-inside-work-tree 2>/dev/null || true
            grep -m1 'last updated' validate/oz/contracts/token/ERC20/extensions/ERC4626.sol || true
            echo 'forge-std v1.9.4'
            grep -m1 '^abstract contract Test' validate/forge-std/src/Test.sol || true
          } | tee dependencies/VALIDATION.txt

      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: solidity-source-dependencies
          path: dependencies
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
