name: source-snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone public target repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Veda-Labs/boring-vault.git target
          cd target
          git rev-parse HEAD > ../TARGET_COMMIT.txt
          tar -czf ../veda-source-snapshot.tar.gz \
            --exclude='.git' \
            --exclude='lib' \
            --exclude='cache' \
            --exclude='out' \
            --exclude='broadcast' \
            src test script certora deployments foundry.toml remappings.txt package.json 2>/dev/null || \
          tar -czf ../veda-source-snapshot.tar.gz \
            --exclude='.git' --exclude='lib' --exclude='cache' --exclude='out' --exclude='broadcast' \
            src test script deployments foundry.toml
      - uses: actions/upload-artifact@v4
        with:
          name: veda-source-snapshot
          path: |
            veda-source-snapshot.tar.gz
            TARGET_COMMIT.txt
          retention-days: 1
