name: StackingDAO cross-version withdrawal exact PoC

on:
  pull_request:
    branches: [main]
    paths:
      - "security_research/stackingdao_cross_version_withdrawal/**"
      - ".github/workflows/stackingdao-cross-version-withdrawal-poc.yml"

permissions:
  contents: read

jobs:
  exact-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout private validation material
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build exact mixed-generation local project and run PoC
        shell: bash
        run: |
          set +e
          mkdir -p evidence/source evidence/poc

          clone_rc=99
          checkout_rc=99
          legacy_st_rc=99
          legacy_btc_rc=99
          copy_test_rc=99
          npm_rc=99
          rollup_rc=99
          test_rc_1=99
          test_rc_2=99
          test_rc_3=99

          git clone --no-tags https://github.com/StackingDAO/contracts.git upstream \
            > evidence/source-checkout.log 2>&1
          clone_rc=$?

          if [ "$clone_rc" = 0 ]; then
            git -C upstream checkout --detach a8d7d2a2dcffa0b4759bc8411f9d1369fc44b736 \
              >> evidence/source-checkout.log 2>&1
            checkout_rc=$?
            git -C upstream rev-parse HEAD > evidence/current-head.txt 2>&1
          fi

          if [ "$checkout_rc" = 0 ]; then
            git -C upstream show 29dc1e58774e2971497cffb40a5f4f1db653c64b:contracts/version-3/stacking-dao-core-v5.clar \
              > upstream/contracts/version-3/stacking-dao-core-v5.clar 2> evidence/legacy-st-source.log
            legacy_st_rc=$?
            git -C upstream show 29dc1e58774e2971497cffb40a5f4f1db653c64b:contracts/version-3/stacking-dao-core-btc-v2.clar \
              > upstream/contracts/version-3/stacking-dao-core-btc-v2.clar 2> evidence/legacy-btc-source.log
            legacy_btc_rc=$?
          fi

          if [ "$legacy_st_rc" = 0 ] && [ "$legacy_btc_rc" = 0 ]; then
            cat >> upstream/Clarinet.toml <<'EOF'

          [contracts.stacking-dao-core-v5]
          path = "contracts/version-3/stacking-dao-core-v5.clar"
          clarity_version = 2
          epoch = 2.4

          [contracts.stacking-dao-core-btc-v2]
          path = "contracts/version-3/stacking-dao-core-btc-v2.clar"
          clarity_version = 2
          epoch = 2.4
          EOF

            cp security_research/stackingdao_cross_version_withdrawal/cross-version-withdrawal_poc_test.ts \
              upstream/tests/version-3/cross-version-withdrawal_poc_test.ts
            copy_test_rc=$?
          fi

          if [ "$copy_test_rc" = 0 ]; then
            (
              cd upstream
              npm ci
            ) > evidence/npm-ci.log 2>&1
            npm_rc=$?
          fi

          if [ "$npm_rc" = 0 ]; then
            (
              cd upstream
              npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu
            ) > evidence/rollup-install.log 2>&1
            rollup_rc=$?
          fi

          if [ "$rollup_rc" = 0 ]; then
            for run in 1 2 3; do
              (
                cd upstream
                npx vitest run tests/version-3/cross-version-withdrawal_poc_test.ts --reporter=verbose
              ) > "evidence/exact-run-${run}.log" 2>&1
              eval "test_rc_${run}=$?"
            done
          fi

          if [ -d upstream ]; then
            for f in \
              contracts/version-3/stacking-dao-core-v5.clar \
              contracts/version-3/stacking-dao-core-v6.clar \
              contracts/version-3/stacking-dao-core-btc-v2.clar \
              contracts/version-3/stacking-dao-core-btc-v3.clar \
              contracts/version-2/data-core-v1.clar \
              contracts/version-2/data-core-v2.clar \
              contracts/core/ststx-withdraw-nft-v2.clar \
              contracts/core/ststxbtc-withdraw-nft.clar \
              contracts/core/ststx-token.clar \
              contracts/core/ststxbtc-token-v2.clar \
              contracts/core/dao.clar; do
              if [ -f "upstream/$f" ]; then cp "upstream/$f" evidence/source/; fi
            done
            if [ -f upstream/tests/version-3/cross-version-withdrawal_poc_test.ts ]; then
              cp upstream/tests/version-3/cross-version-withdrawal_poc_test.ts evidence/poc/
            fi
            for f in Clarinet.toml package.json package-lock.json; do
              if [ -f "upstream/$f" ]; then cp "upstream/$f" evidence/poc/; fi
            done
          fi

          {
            echo "current_source_commit=a8d7d2a2dcffa0b4759bc8411f9d1369fc44b736"
            echo "legacy_source_commit=29dc1e58774e2971497cffb40a5f4f1db653c64b"
            node --version
            npm --version
          } > evidence/environment.txt 2>&1

          cat > evidence/exit-codes.txt <<EOF
          clone_rc=$clone_rc
          checkout_rc=$checkout_rc
          legacy_st_rc=$legacy_st_rc
          legacy_btc_rc=$legacy_btc_rc
          copy_test_rc=$copy_test_rc
          npm_rc=$npm_rc
          rollup_rc=$rollup_rc
          test_rc_1=$test_rc_1
          test_rc_2=$test_rc_2
          test_rc_3=$test_rc_3
          EOF

          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
          exit 0

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-cross-version-withdrawal-poc-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exploit and control markers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -Fx 'clone_rc=0' evidence/exit-codes.txt
          grep -Fx 'checkout_rc=0' evidence/exit-codes.txt
          grep -Fx 'legacy_st_rc=0' evidence/exit-codes.txt
          grep -Fx 'legacy_btc_rc=0' evidence/exit-codes.txt
          grep -Fx 'copy_test_rc=0' evidence/exit-codes.txt
          grep -Fx 'npm_rc=0' evidence/exit-codes.txt
          grep -Fx 'rollup_rc=0' evidence/exit-codes.txt
          grep -Fx 'test_rc_1=0' evidence/exit-codes.txt
          grep -Fx 'test_rc_2=0' evidence/exit-codes.txt
          grep -Fx 'test_rc_3=0' evidence/exit-codes.txt
          for run in 1 2 3; do
            grep -F 'VULNERABLE_STSTX currentEscrowConsumedMicro=100000000' "evidence/exact-run-${run}.log"
            grep -F 'VULNERABLE_STSTX victimWithdrawReverted=true' "evidence/exact-run-${run}.log"
            grep -F 'VULNERABLE_STSTXBTC currentEscrowConsumedMicro=100000000' "evidence/exact-run-${run}.log"
            grep -F 'VULNERABLE_STSTXBTC victimWithdrawReverted=true' "evidence/exact-run-${run}.log"
            grep -F 'CONTROL currentClaimsSettled=2' "evidence/exact-run-${run}.log"
            grep -F 'CONTROL currentEscrowResidualMicro=0' "evidence/exact-run-${run}.log"
          done
