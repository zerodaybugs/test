name: StackingDAO exact current withdrawal ledger reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-current-ledger-exact.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Reconcile every post-upgrade live withdrawal record read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence && cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import {contractPrincipalCV,cvToHex,cvToString,hexToCV,uintCV} from '@stacks/transactions';
          import {writeFile} from 'node:fs/promises';
          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG',A='https://api.mainnet.hiro.so';
          const P={stNft:`${O}.ststx-withdraw-nft-v2`,btcNft:`${O}.ststxbtc-withdraw-nft`,stData:`${O}.data-core-v1`,btcData:`${O}.data-core-v2`,stToken:`${O}.ststx-token`,btcToken:`${O}.ststxbtc-token-v2`};
          const S=ms=>new Promise(r=>setTimeout(r,ms));
          async function J(u,o={},n=14){let e;for(let i=1;i<=n;i++){try{let r=await fetch(u,o),t=await r.text();if(!r.ok)throw Error(`${r.status}:${t.slice(0,300)}`);return JSON.parse(t)}catch(x){e=x;if(i<n)await S(Math.min(8000,500*i))}}throw e}
          function Q(p){let i=p.indexOf('.');return[p.slice(0,i),p.slice(i+1)]}
          async function C(p,f,a=[]){let[x,n]=Q(p),j=await J(`${A}/v2/contracts/call-read/${x}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:a.map(cvToHex)})});return j.result?cvToString(hexToCV(j.result)):null}
          async function mapLimit(items,limit,fn){let out=new Array(items.length),next=0;async function w(){while(true){let i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i);if(i%50===0)await S(150)}}await Promise.all(Array.from({length:Math.min(limit,items.length)},w));return out}
          const ru=s=>{let m=String(s??'').match(/^\(ok u(\d+)\)$/)||String(s??'').match(/^u(\d+)$/);return m?.[1]??null};
          const owner=s=>{let t=String(s??''),m=t.match(/^\(ok \(some ('?[^)]+)\)\)$/)||t.match(/^\(some ('?[^)]+)\)$/);return m?m[1].replace(/^'/,''):null};
          const tu=(s,k)=>String(s??'').match(new RegExp(`\\(${k} u(\\d+)\\)`))?.[1]??null;
          async function scan(nft,data,token,coreName,kind,firstId){let last=Number(ru(await C(nft,'get-last-token-id'))??0),ids=[];for(let id=firstId;id<last;id++)ids.push(id);let rows=await mapLimit(ids,6,async id=>{let [or,dr]=await Promise.all([C(nft,'get-owner',[uintCV(id)]),C(data,kind==='st'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(id)])]),o=owner(or),stx=tu(dr,'stx-amount'),burn=kind==='st'?tu(dr,'ststx-amount'):tu(dr,'stx-amount');return{nft_id:id,owner:o,stx_amount:stx,burn_amount:burn,unlock_burn_height:tu(dr,'unlock-burn-height'),live:Boolean(o)&&BigInt(stx??0)>0n&&BigInt(burn??0)>0n}});let live=rows.filter(x=>x.live),liability=live.reduce((s,x)=>s+BigInt(x.burn_amount),0n),escrow=BigInt(ru(await C(token,'get-balance',[contractPrincipalCV(O,coreName)]))??0);return{first_id:firstId,last_token_id:last,checked:rows.length,live_count:live.length,liability_micro:liability.toString(),escrow_micro:escrow.toString(),escrow_minus_liability_micro:(escrow-liability).toString(),live}}
          let st=await scan(P.stNft,P.stData,P.stToken,'stacking-dao-core-v6','st',102732),bt=await scan(P.btcNft,P.btcData,P.btcToken,'stacking-dao-core-btc-v3','btc',233);
          let summary={captured_at:new Date().toISOString(),st_checked:st.checked,st_current_live_count:st.live_count,st_current_liability_micro:st.liability_micro,st_current_escrow_micro:st.escrow_micro,st_escrow_minus_liability_micro:st.escrow_minus_liability_micro,btc_checked:bt.checked,btc_current_live_count:bt.live_count,btc_current_liability_micro:bt.liability_micro,btc_current_escrow_micro:bt.escrow_micro,btc_escrow_minus_liability_micro:bt.escrow_minus_liability_micro};
          let out={summary,principals:P,st,btc:bt};await writeFile('snapshot.json',JSON.stringify(out,null,2)+'\n');let text=Object.entries(summary).map(([k,v])=>`${k}=${v}`).join('\n')+'\n';await writeFile('summary.txt',text);console.log(text)
          NODE
          node query.mjs
          sha256sum snapshot.json summary.txt query.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-current-ledger-exact-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_escrow_minus_liability_micro=' evidence/summary.txt
          grep -F 'btc_escrow_minus_liability_micro=' evidence/summary.txt
