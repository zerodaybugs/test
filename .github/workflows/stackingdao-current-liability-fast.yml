name: StackingDAO focused current withdrawal liability gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-current-liability-fast.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query recent post-upgrade NFT liabilities read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence && cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import {contractPrincipalCV,cvToHex,cvToString,hexToCV,uintCV} from '@stacks/transactions';
          import {writeFile} from 'node:fs/promises';
          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG',A='https://api.mainnet.hiro.so';
          const P={stCore:`${O}.stacking-dao-core-v6`,btcCore:`${O}.stacking-dao-core-btc-v3`,stNft:`${O}.ststx-withdraw-nft-v2`,btcNft:`${O}.ststxbtc-withdraw-nft`,stData:`${O}.data-core-v1`,btcData:`${O}.data-core-v2`,stToken:`${O}.ststx-token`,btcToken:`${O}.ststxbtc-token-v2`};
          const S=ms=>new Promise(r=>setTimeout(r,ms));
          async function J(u,o={},n=10){let e;for(let i=1;i<=n;i++){try{let r=await fetch(u,o),t=await r.text();if(!r.ok)throw Error(`${r.status}:${t.slice(0,300)}`);return JSON.parse(t)}catch(x){e=x;if(i<n)await S(i*1000)}}throw e}
          function Q(p){let i=p.indexOf('.');return[p.slice(0,i),p.slice(i+1)]}
          async function C(p,f,a=[]){let[x,n]=Q(p),j=await J(`${A}/v2/contracts/call-read/${x}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:a.map(cvToHex)})});return j.result?cvToString(hexToCV(j.result)):null}
          const ru=s=>{let m=String(s??'').match(/^\(ok u(\d+)\)$/)||String(s??'').match(/^u(\d+)$/);return m?.[1]??null};
          const owner=s=>{let t=String(s??''),m=t.match(/^\(ok \(some ('?[^)]+)\)\)$/)||t.match(/^\(some ('?[^)]+)\)$/);return m?m[1].replace(/^'/,''):null};
          const tu=(s,k)=>String(s??'').match(new RegExp(`\\(${k} u(\\d+)\\)`))?.[1]??null;
          const tx=r=>r.tx??r,cc=r=>tx(r).contract_call??r.contract_call,ok=r=>(tx(r).tx_status??r.tx_status)==='success';
          async function recent(p,max=250){let z=[];for(let o=0;o<max;o+=50){let j=await J(`${A}/extended/v1/address/${p}/transactions?limit=50&offset=${o}`),r=j.results??[];z.push(...r);if(r.length<50)break;await S(150)}return z}
          async function sample(core,nft,data,kind,legacyMax){let rows=await recent(core),inits=[];for(let r of rows){let c=cc(r);if(!c||c.contract_id!==core||c.function_name!=='init-withdraw'||!ok(r))continue;let id=ru(tx(r).tx_result?.repr??r.tx_result?.repr);if(id&&Number(id)>legacyMax&&!inits.some(x=>x.nft_id===Number(id)))inits.push({nft_id:Number(id),tx_id:tx(r).tx_id??r.tx_id,sender:tx(r).sender_address??r.sender_address,time:tx(r).burn_block_time_iso??r.burn_block_time_iso})}let live=[];for(let x of inits){let o=owner(await C(nft,'get-owner',[uintCV(x.nft_id)]));if(o){await S(80);let d=await C(data,kind==='st'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(x.nft_id)]),stx=tu(d,'stx-amount'),burn=kind==='st'?tu(d,'ststx-amount'):tu(d,'stx-amount');if(BigInt(stx??0)>0n&&BigInt(burn??0)>0n)live.push({...x,owner:o,stx_amount:stx,burn_amount:burn,unlock_burn_height:tu(d,'unlock-burn-height'),data_result:d})}await S(120);if(live.length>=12)break}return{transaction_rows:rows.length,post_upgrade_inits:inits,live}}
          let st=await sample(P.stCore,P.stNft,P.stData,'st',102731),bt=await sample(P.btcCore,P.btcNft,P.btcData,'btc',232);
          let stEsc=ru(await C(P.stToken,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-v6')])),btEsc=ru(await C(P.btcToken,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-btc-v3')]));
          let blocks=await J(`${A}/extended/v1/block?limit=1&offset=0`),burnHeight=blocks.results?.[0]?.burn_block_height??null;
          const sum=(a,k)=>a.reduce((s,x)=>s+BigInt(x[k]??0),0n).toString();
          let summary={captured_at:new Date().toISOString(),current_burn_height:burnHeight,st_recent_transaction_rows:st.transaction_rows,st_post_upgrade_init_count:st.post_upgrade_inits.length,st_current_live_sample_count:st.live.length,st_current_live_sample_stx_micro:sum(st.live,'stx_amount'),st_current_live_sample_burn_micro:sum(st.live,'burn_amount'),st_v6_escrow_micro:stEsc,btc_recent_transaction_rows:bt.transaction_rows,btc_post_upgrade_init_count:bt.post_upgrade_inits.length,btc_current_live_sample_count:bt.live.length,btc_current_live_sample_stx_micro:sum(bt.live,'stx_amount'),btc_current_live_sample_burn_micro:sum(bt.live,'burn_amount'),btc_v3_escrow_micro:btEsc};
          let out={summary,principals:P,st,btc:bt,block_tip:blocks.results?.[0]??null};await writeFile('snapshot.json',JSON.stringify(out,null,2)+'\n');let text=Object.entries(summary).map(([k,v])=>`${k}=${v}`).join('\n')+'\nST_CURRENT_LIVE\n'+st.live.map(JSON.stringify).join('\n')+'\nBTC_CURRENT_LIVE\n'+bt.live.map(JSON.stringify).join('\n')+'\n';await writeFile('summary.txt',text);console.log(text)
          NODE
          node query.mjs
          sha256sum snapshot.json summary.txt query.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-current-liability-fast-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_current_live_sample_count=' evidence/summary.txt
          grep -F 'btc_current_live_sample_count=' evidence/summary.txt
