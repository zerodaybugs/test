name: StackingDAO focused current withdrawal liability gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-current-liability-fast.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query latest post-upgrade NFT liabilities read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence && cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import {contractPrincipalCV,cvToHex,cvToString,hexToCV,uintCV} from '@stacks/transactions';
          import {writeFile} from 'node:fs/promises';
          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG',A='https://api.mainnet.hiro.so';
          const P={stNft:`${O}.ststx-withdraw-nft-v2`,btcNft:`${O}.ststxbtc-withdraw-nft`,stData:`${O}.data-core-v1`,btcData:`${O}.data-core-v2`,stToken:`${O}.ststx-token`,btcToken:`${O}.ststxbtc-token-v2`};
          const S=ms=>new Promise(r=>setTimeout(r,ms));
          async function J(u,o={},n=10){let e;for(let i=1;i<=n;i++){try{let r=await fetch(u,o),t=await r.text();if(!r.ok)throw Error(`${r.status}:${t.slice(0,300)}`);return JSON.parse(t)}catch(x){e=x;if(i<n)await S(i*800)}}throw e}
          function Q(p){let i=p.indexOf('.');return[p.slice(0,i),p.slice(i+1)]}
          async function C(p,f,a=[]){let[x,n]=Q(p),j=await J(`${A}/v2/contracts/call-read/${x}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:a.map(cvToHex)})});return j.result?cvToString(hexToCV(j.result)):null}
          const ru=s=>{let m=String(s??'').match(/^\(ok u(\d+)\)$/)||String(s??'').match(/^u(\d+)$/);return m?.[1]??null};
          const owner=s=>{let t=String(s??''),m=t.match(/^\(ok \(some ('?[^)]+)\)\)$/)||t.match(/^\(some ('?[^)]+)\)$/);return m?m[1].replace(/^'/,''):null};
          const tu=(s,k)=>String(s??'').match(new RegExp(`\\(${k} u(\\d+)\\)`))?.[1]??null;
          async function scan(nft,data,kind,legacyMax){let last=Number(ru(await C(nft,'get-last-token-id'))??0),rows=[];for(let id=Math.max(legacyMax+1,last-45);id<last;id++){let o=owner(await C(nft,'get-owner',[uintCV(id)]));if(o){await S(70);let d=await C(data,kind==='st'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(id)]),stx=tu(d,'stx-amount'),burn=kind==='st'?tu(d,'ststx-amount'):tu(d,'stx-amount');if(BigInt(stx??0)>0n&&BigInt(burn??0)>0n)rows.push({nft_id:id,owner:o,stx_amount:stx,burn_amount:burn,unlock_burn_height:tu(d,'unlock-burn-height'),data_result:d})}await S(100)}return{last_token_id:last,scanned_from:Math.max(legacyMax+1,last-45),live:rows}}
          let st=await scan(P.stNft,P.stData,'st',102731),bt=await scan(P.btcNft,P.btcData,'btc',232);
          let stEsc=ru(await C(P.stToken,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-v6')])),btEsc=ru(await C(P.btcToken,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-btc-v3')]));
          let tip=await J(`${A}/extended/v2/burn-blocks?limit=1&offset=0`).catch(async()=>await J(`${A}/extended/v1/block?limit=1&offset=0`));
          const sum=(a,k)=>a.reduce((s,x)=>s+BigInt(x[k]??0),0n).toString();
          let burnHeight=tip.results?.[0]?.burn_block_height??tip.burn_block_height??null;
          let summary={captured_at:new Date().toISOString(),current_burn_height:burnHeight,st_last_token_id:st.last_token_id,st_scanned_from:st.scanned_from,st_current_live_sample_count:st.live.length,st_current_live_sample_stx_micro:sum(st.live,'stx_amount'),st_current_live_sample_burn_micro:sum(st.live,'burn_amount'),st_v6_escrow_micro:stEsc,btc_last_token_id:bt.last_token_id,btc_scanned_from:bt.scanned_from,btc_current_live_sample_count:bt.live.length,btc_current_live_sample_stx_micro:sum(bt.live,'stx_amount'),btc_current_live_sample_burn_micro:sum(bt.live,'burn_amount'),btc_v3_escrow_micro:btEsc};
          let out={summary,principals:P,tip,st,btc:bt};await writeFile('snapshot.json',JSON.stringify(out,null,2)+'\n');let text=Object.entries(summary).map(([k,v])=>`${k}=${v}`).join('\n')+'\nST_CURRENT_LIVE\n'+st.live.map(JSON.stringify).join('\n')+'\nBTC_CURRENT_LIVE\n'+bt.live.map(JSON.stringify).join('\n')+'\n';await writeFile('summary.txt',text);console.log(text)
          NODE
          node query.mjs
          sha256sum snapshot.json summary.txt query.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-current-liability-fast-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_current_live_sample_count=' evidence/summary.txt
          grep -F 'btc_current_live_sample_count=' evidence/summary.txt
