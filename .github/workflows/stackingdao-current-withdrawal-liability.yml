name: StackingDAO current withdrawal liability sample

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-current-withdrawal-liability.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query recent current-core withdrawal liabilities read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence && cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import {contractPrincipalCV,cvToHex,cvToString,hexToCV,uintCV} from '@stacks/transactions';
          import {writeFile} from 'node:fs/promises';
          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG',A='https://api.mainnet.hiro.so';
          const P={stCore:`${O}.stacking-dao-core-v6`,btcCore:`${O}.stacking-dao-core-btc-v3`,stNft:`${O}.ststx-withdraw-nft-v2`,btcNft:`${O}.ststxbtc-withdraw-nft`,stData:`${O}.data-core-v1`,btcData:`${O}.data-core-v2`,stToken:`${O}.ststx-token`,btcToken:`${O}.ststxbtc-token-v2`};
          const S=ms=>new Promise(r=>setTimeout(r,ms));
          async function J(u,o={},n=10){let e;for(let i=1;i<=n;i++){try{let r=await fetch(u,o),t=await r.text();if(!r.ok)throw Error(`${r.status}:${t.slice(0,300)}`);return JSON.parse(t)}catch(x){e=x;if(i<n)await S(i*1000)}}throw e}
          function Q(p){let i=p.indexOf('.');return[p.slice(0,i),p.slice(i+1)]}
          async function C(p,f,a=[]){let[x,n]=Q(p),j=await J(`${A}/v2/contracts/call-read/${x}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:a.map(cvToHex)})});return j.result?cvToString(hexToCV(j.result)):null}
          async function recentTx(p,max=600){let z=[];for(let o=0;o<max;o+=50){let j=await J(`${A}/extended/v1/address/${p}/transactions?limit=50&offset=${o}`),r=j.results??[];z.push(...r);if(r.length<50)break;await S(180)}return z}
          const tx=r=>r.tx??r,cc=r=>tx(r).contract_call??r.contract_call,ok=r=>(tx(r).tx_status??r.tx_status)==='success';
          const ur=s=>{let m=String(s??'').match(/^\(ok u(\d+)\)$/)||String(s??'').match(/^u(\d+)$/);return m?.[1]??null};
          const ua=(c,i)=>String(c?.function_args?.[i]?.repr??'').match(/^u(\d+)$/)?.[1]??null;
          const owner=s=>{let t=String(s??''),m=t.match(/^\(ok \(some ('?[^)]+)\)\)$/)||t.match(/^\(some ('?[^)]+)\)$/);return m?m[1].replace(/^'/,''):null};
          const tu=(s,k)=>String(s??'').match(new RegExp(`\\(${k} u(\\d+)\\)`))?.[1]??null;
          async function sample(core,nft,data,kind){let rows=await recentTx(core),ids=[],seen=new Set();for(let r of rows){let c=cc(r);if(!c||c.contract_id!==core||c.function_name!=='init-withdraw'||!ok(r))continue;let id=ur(tx(r).tx_result?.repr??r.tx_result?.repr);if(id&&!seen.has(id)){seen.add(id);ids.push({id:Number(id),amount:ua(c,2),tx_id:tx(r).tx_id??r.tx_id,sender:tx(r).sender_address??r.sender_address,time:tx(r).burn_block_time_iso??r.burn_block_time_iso})}}let live=[];for(let x of ids){let o=owner(await C(nft,'get-owner',[uintCV(x.id)]));if(o){await S(90);let d=await C(data,kind==='st'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(x.id)]),stx=tu(d,'stx-amount'),burn=kind==='st'?tu(d,'ststx-amount'):tu(d,'stx-amount');if(BigInt(stx??0)>0n&&BigInt(burn??0)>0n)live.push({...x,owner:o,stx_amount:stx,burn_amount:burn,unlock_burn_height:tu(d,'unlock-burn-height'),data:d})}await S(130);if(live.length>=25)break}return{transaction_rows:rows.length,init_ids_checked:ids.length,live}}
          let st=await sample(P.stCore,P.stNft,P.stData,'st'),bt=await sample(P.btcCore,P.btcNft,P.btcData,'btc');
          let stEsc=BigInt(ur(await C(P.stToken,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-v6')]))??0),btEsc=BigInt(ur(await C(P.btcToken,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-btc-v3')]))??0);
          const sum=(a,k)=>a.reduce((s,x)=>s+BigInt(x[k]??0),0n).toString();
          let summary={captured_at:new Date().toISOString(),st_recent_tx_rows:st.transaction_rows,st_recent_init_ids:st.init_ids_checked,st_live_sample_count:st.live.length,st_live_sample_stx_micro:sum(st.live,'stx_amount'),st_live_sample_burn_micro:sum(st.live,'burn_amount'),st_current_escrow_micro:stEsc.toString(),btc_recent_tx_rows:bt.transaction_rows,btc_recent_init_ids:bt.init_ids_checked,btc_live_sample_count:bt.live.length,btc_live_sample_stx_micro:sum(bt.live,'stx_amount'),btc_live_sample_burn_micro:sum(bt.live,'burn_amount'),btc_current_escrow_micro:btEsc.toString()};
          let out={summary,principals:P,st,btc:bt};await writeFile('snapshot.json',JSON.stringify(out,null,2)+'\n');let text=Object.entries(summary).map(([k,v])=>`${k}=${v}`).join('\n')+'\nST_CURRENT_LIVE_SAMPLE\n'+st.live.map(JSON.stringify).join('\n')+'\nBTC_CURRENT_LIVE_SAMPLE\n'+bt.live.map(JSON.stringify).join('\n')+'\n';await writeFile('summary.txt',text);console.log(text)
          NODE
          node query.mjs
          sha256sum snapshot.json summary.txt query.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-current-liability-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_live_sample_count=' evidence/summary.txt
          grep -F 'btc_live_sample_count=' evidence/summary.txt
