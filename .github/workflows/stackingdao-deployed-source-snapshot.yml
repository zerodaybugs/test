name: StackingDAO deployed source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-deployed-source-snapshot.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch public deployed contract sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployed-source/contracts
          cd deployed-source
          cat > fetch.mjs <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';

          const address = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const api = 'https://api.mainnet.hiro.so';
          const names = [
            'rewards-v7',
            'swap-ststx-ststxbtc-v2',
            'data-core-v3',
            'reserve-v1',
            'dao',
            'ststx-token',
            'ststxbtc-token',
            'ststxbtc-token-v2',
            'ststxbtc-tracking-v2',
            'ststxbtc-tracking-data-v2',
            'commission-v2',
            'commission-btc-v1',
            'staking-v0',
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          await mkdir('contracts', { recursive: true });
          const manifest = { captured_at: new Date().toISOString(), address, contracts: {} };

          for (const name of names) {
            let response;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              response = await fetch(`${api}/v2/contracts/source/${address}/${name}?proof=0`);
              if (response.ok) break;
              if (response.status === 429 && attempt < 6) {
                await sleep(attempt * 3000);
                continue;
              }
              throw new Error(`${name}: ${response.status} ${await response.text()}`);
            }
            const json = await response.json();
            if (typeof json.source !== 'string') throw new Error(`${name}: missing source`);
            await writeFile(`contracts/${name}.clar`, json.source);
            manifest.contracts[name] = {
              publish_height: json.publish_height,
              marf_proof_present: Boolean(json.proof),
              source_length: json.source.length,
            };
            await sleep(1150);
          }

          await writeFile('manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify(manifest, null, 2));
          NODE

          node fetch.mjs
          find contracts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum manifest.json fetch.mjs >> SHA256SUMS

      - name: Upload deployed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-deployed-source-${{ github.run_id }}
          path: deployed-source/
          if-no-files-found: error
          retention-days: 1
