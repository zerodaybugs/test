name: StackingDAO FOMO fast ownership gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-fomo-fast-gate.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query focused public state read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-fast
          cd evidence-fast
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1

          cat > query.mjs <<'NODE'
          import { contractPrincipalCV, cvToHex, cvToString, hexToCV, uintCV } from '@stacks/transactions';
          import { writeFile } from 'node:fs/promises';

          const address = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const api = 'https://api.mainnet.hiro.so';
          const sender = address;
          const games = [
            { name: 'stacking-dao-fomo', nft: 'stacking-dao-fomo-nft', loserBps: 2500 },
            { name: 'stacking-dao-fomo-v1', nft: 'stacking-dao-fomo-nft', loserBps: 2500 },
            { name: 'stacking-dao-fomo-eoy-v1', nft: 'stacking-dao-fomo-eoy-nft', loserBps: 4500 },
          ];
          const out = { captured_at: new Date().toISOString(), games: {}, nfts: {}, flags: {} };
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function fetchJson(url, options = {}, attempts = 5) {
            let last;
            for (let i = 1; i <= attempts; i++) {
              try {
                const r = await fetch(url, options);
                const text = await r.text();
                if (!r.ok) throw new Error(`${r.status}: ${text}`);
                return JSON.parse(text);
              } catch (e) {
                last = e;
                if (i < attempts) await sleep(i * 1000);
              }
            }
            throw last;
          }

          async function call(contract, fn, args = []) {
            const raw = await fetchJson(`${api}/v2/contracts/call-read/${address}/${contract}/${fn}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ sender, arguments: args.map(cvToHex) }),
            });
            return { okay: !!raw.okay, decoded: raw.result ? cvToString(hexToCV(raw.result)) : null, raw };
          }

          function u(text) {
            const m = String(text ?? '').match(/u(\d+)/);
            return m ? Number(m[1]) : null;
          }

          async function txs(principal) {
            const rows = [];
            const limit = 50;
            for (let offset = 0; offset < 2000; offset += limit) {
              const page = await fetchJson(`${api}/extended/v1/address/${principal}/transactions?limit=${limit}&offset=${offset}`);
              rows.push(...(page.results ?? []));
              if ((page.results ?? []).length < limit || rows.length >= (page.total ?? rows.length)) break;
            }
            return rows;
          }

          for (const name of [...games.map(x => x.name), 'stacking-dao-fomo-nft', 'stacking-dao-fomo-eoy-nft', 'ststx-token']) {
            out.flags[name] = await call('dao', 'get-contract-active', [contractPrincipalCV(address, name)]);
          }

          for (const nft of ['stacking-dao-fomo-nft', 'stacking-dao-fomo-eoy-nft']) {
            const last = await call(nft, 'get-last-token-id');
            const lastId = u(last.decoded) ?? 0;
            const history = await txs(`${address}.${nft}`);
            const calls = history.filter(x => x.tx_type === 'contract_call' && x.tx_status === 'success');
            const counts = {};
            for (const row of calls) {
              const fn = row.contract_call?.function_name ?? 'unknown';
              counts[fn] = (counts[fn] ?? 0) + 1;
            }
            const candidates = new Set();
            for (let i = 0; i < Math.min(lastId, 30); i++) candidates.add(i);
            for (let i = Math.max(0, lastId - 30); i < lastId; i++) candidates.add(i);
            if (lastId > 60) {
              for (let n = 1; n <= 20; n++) candidates.add(Math.floor((lastId - 1) * n / 21));
            }
            const owners = [];
            for (const id of [...candidates].sort((a, b) => a - b)) {
              try {
                const owner = await call(nft, 'get-owner', [uintCV(id)]);
                if (owner.decoded && !owner.decoded.includes('none')) owners.push({ id, owner: owner.decoded });
              } catch (e) {
                owners.push({ id, error: String(e) });
              }
            }
            out.nfts[nft] = {
              last,
              last_id: lastId,
              successful_call_counts: counts,
              inferred_live_count: Math.max(0, (counts['mint-for-protocol'] ?? 0) - (counts['burn-for-protocol'] ?? 0)),
              sampled_live_owners: owners,
            };
          }

          for (const game of games) {
            const state = {};
            for (const fn of ['get-current-winner','get-claim-cost','get-increment','get-total-treasure','get-last-claim-burn-block-height','has-game-started','has-game-ended']) {
              try { state[fn] = await call(game.name, fn); } catch (e) { state[fn] = { error: String(e) }; }
            }
            state.ststx_balance = await call('ststx-token', 'get-balance', [contractPrincipalCV(address, game.name)]);
            const history = await txs(`${address}.${game.name}`);
            const counts = {};
            for (const row of history.filter(x => x.tx_type === 'contract_call' && x.tx_status === 'success')) {
              const fn = row.contract_call?.function_name ?? 'unknown';
              counts[fn] = (counts[fn] ?? 0) + 1;
            }
            const treasure = u(state['get-total-treasure']?.decoded);
            const balance = u(state.ststx_balance?.decoded);
            const minted = counts['buy-claim'] ?? 0;
            const avg = treasure !== null && minted > 1 ? Math.floor(Math.floor(treasure * game.loserBps / 10000) / (minted - 1)) : null;
            out.games[game.name] = { nft: game.nft, loser_bps: game.loserBps, state, successful_call_counts: counts, inferred_minted_claims: minted, computed_average_payout: avg, actual_ststx_balance: balance, funded: avg !== null && balance !== null ? balance >= avg : null };
          }

          await writeFile('snapshot.json', JSON.stringify(out, null, 2) + '\n');
          const lines = [`captured_at=${out.captured_at}`];
          for (const [n, f] of Object.entries(out.flags)) lines.push(`DAO ${n}=${f.decoded}`);
          for (const [n, x] of Object.entries(out.nfts)) {
            lines.push(`NFT ${n} last_id=${x.last_id} inferred_live_count=${x.inferred_live_count} sampled_live=${x.sampled_live_owners.length} counts=${JSON.stringify(x.successful_call_counts)}`);
            for (const o of x.sampled_live_owners) lines.push(`NFT_OWNER ${n} id=${o.id} owner=${o.owner ?? o.error}`);
          }
          for (const [n, x] of Object.entries(out.games)) lines.push(`GAME ${n} started=${x.state['has-game-started']?.decoded} ended=${x.state['has-game-ended']?.decoded} treasure=${x.state['get-total-treasure']?.decoded} balance=${x.state.ststx_balance?.decoded} buy_claims=${x.inferred_minted_claims} avg=${x.computed_average_payout} funded=${x.funded} counts=${JSON.stringify(x.successful_call_counts)}`);
          await writeFile('snapshot.txt', lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

          node query.mjs
          sha256sum snapshot.json snapshot.txt query.mjs > SHA256SUMS

      - name: Upload focused evidence
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-fomo-fast-${{ github.run_id }}
          path: evidence-fast/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          cd evidence-fast
          sha256sum -c SHA256SUMS
          grep -F 'GAME stacking-dao-fomo ' snapshot.txt
          grep -F 'GAME stacking-dao-fomo-v1 ' snapshot.txt
          grep -F 'GAME stacking-dao-fomo-eoy-v1 ' snapshot.txt
