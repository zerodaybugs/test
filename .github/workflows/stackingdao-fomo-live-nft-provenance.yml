name: StackingDAO FOMO live NFT provenance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-fomo-live-nft-provenance.yml"

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve recent mint provenance and current ownership read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1

          cat > query.mjs <<'NODE'
          import { cvToHex, cvToString, hexToCV, uintCV } from '@stacks/transactions';
          import { writeFile } from 'node:fs/promises';

          const address = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const api = 'https://api.mainnet.hiro.so';
          const sender = address;
          const targets = [
            { game: 'stacking-dao-fomo-v1', nft: 'stacking-dao-fomo-nft', token: 'stacking-dao-fomo' },
            { game: 'stacking-dao-fomo-eoy-v1', nft: 'stacking-dao-fomo-eoy-nft', token: 'stacking-dao-fomo-eoy' },
          ];
          const out = { captured_at: new Date().toISOString(), targets: {} };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchJson(url, options = {}, attempts = 6) {
            let last;
            for (let i = 1; i <= attempts; i += 1) {
              try {
                const response = await fetch(url, options);
                const text = await response.text();
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text}`);
                return JSON.parse(text);
              } catch (error) {
                last = error;
                if (i < attempts) await sleep(1500 * i);
              }
            }
            throw last;
          }

          async function call(contract, fn, args = []) {
            const raw = await fetchJson(`${api}/v2/contracts/call-read/${address}/${contract}/${fn}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ sender, arguments: args.map(cvToHex) }),
            });
            return { okay: !!raw.okay, decoded: raw.result ? cvToString(hexToCV(raw.result)) : null, raw };
          }

          async function transactionHistory(principal) {
            const rows = [];
            const limit = 50;
            for (let offset = 0; offset < 500; offset += limit) {
              const page = await fetchJson(`${api}/extended/v1/address/${principal}/transactions?limit=${limit}&offset=${offset}`);
              rows.push(...(page.results ?? []));
              if ((page.results ?? []).length < limit || rows.length >= (page.total ?? rows.length)) break;
              await sleep(250);
            }
            return rows;
          }

          function collectMintEvents(node, path = '$', found = []) {
            if (Array.isArray(node)) {
              node.forEach((value, index) => collectMintEvents(value, `${path}[${index}]`, found));
              return found;
            }
            if (!node || typeof node !== 'object') return found;
            const serialized = JSON.stringify(node);
            const eventType = node.event_type ?? node.type ?? node.asset_event_type ?? '';
            if (/mint/i.test(String(eventType)) && /non.?fungible|nft/i.test(serialized)) {
              found.push({ path, value: node });
            } else if (node.asset_event_type === 'mint' || node.asset?.asset_event_type === 'mint') {
              found.push({ path, value: node });
            }
            for (const [key, value] of Object.entries(node)) collectMintEvents(value, `${path}.${key}`, found);
            return found;
          }

          function extractTokenId(node) {
            const candidates = [];
            function visit(value) {
              if (Array.isArray(value)) return value.forEach(visit);
              if (!value || typeof value !== 'object') return;
              for (const [key, child] of Object.entries(value)) {
                if (typeof child === 'string' && /(repr|value|hex)/i.test(key)) candidates.push(child);
                visit(child);
              }
            }
            visit(node);
            for (const text of candidates) {
              const match = text.match(/u(\d+)/);
              if (match) return Number(match[1]);
            }
            return null;
          }

          for (const target of targets) {
            const principal = `${address}.${target.game}`;
            const history = await transactionHistory(principal);
            const buys = history.filter(tx => tx.tx_type === 'contract_call' && tx.tx_status === 'success' && tx.contract_call?.function_name === 'buy-claim');
            const selected = buys.slice(0, 12);
            const details = [];
            for (const tx of selected) {
              const full = await fetchJson(`${api}/extended/v1/tx/${tx.tx_id}?event_limit=100&event_offset=0`);
              const mintEvents = collectMintEvents(full);
              const ids = [...new Set(mintEvents.map(event => extractTokenId(event.value)).filter(Number.isInteger))];
              const resolved = [];
              for (const id of ids) {
                let owner;
                try { owner = await call(target.nft, 'get-owner', [uintCV(id)]); }
                catch (error) { owner = { error: String(error) }; }
                resolved.push({ id, owner });
              }
              details.push({
                tx_id: tx.tx_id,
                sender_address: tx.sender_address,
                block_height: tx.block_height,
                burn_block_height: tx.burn_block_height,
                block_time_iso: tx.block_time_iso,
                mint_events: mintEvents,
                resolved,
                raw_transaction: full,
              });
              await sleep(700);
            }
            out.targets[target.game] = {
              nft: target.nft,
              token: target.token,
              total_history_rows: history.length,
              successful_buy_claims_seen: buys.length,
              selected_details: details,
            };
          }

          await writeFile('provenance.json', JSON.stringify(out, null, 2) + '\n');
          const lines = [`captured_at=${out.captured_at}`];
          for (const [game, target] of Object.entries(out.targets)) {
            lines.push(`GAME ${game} buy_claims_seen=${target.successful_buy_claims_seen}`);
            for (const item of target.selected_details) {
              for (const resolved of item.resolved) {
                lines.push(`MINT game=${game} tx=${item.tx_id} block=${item.block_height} sender=${item.sender_address} nft_id=${resolved.id} current_owner=${resolved.owner.decoded ?? resolved.owner.error}`);
              }
            }
          }
          await writeFile('provenance.txt', lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

          node query.mjs
          sha256sum provenance.json provenance.txt query.mjs > SHA256SUMS

      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-fomo-provenance-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce evidence integrity
        shell: bash
        run: |
          set -euo pipefail
          cd evidence
          sha256sum -c SHA256SUMS
          grep -F 'GAME stacking-dao-fomo-v1 ' provenance.txt
          grep -F 'GAME stacking-dao-fomo-eoy-v1 ' provenance.txt
          grep -F 'MINT game=' provenance.txt
