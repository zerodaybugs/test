name: StackingDAO legacy withdrawal live candidates

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-legacy-live-candidates.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query known legacy withdrawal IDs read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1

          cat > query.mjs <<'NODE'
          import { contractPrincipalCV, cvToHex, cvToString, hexToCV, uintCV } from '@stacks/transactions';
          import { writeFile } from 'node:fs/promises';

          const O = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const API = 'https://api.mainnet.hiro.so';
          const ST_IDS = [102731,102730,102729,102728,102727,102726,102725,102724,102723,102722,102721,102720,102719,102718,102717,102716,102715,102714,102713,102712,102711,102710,102709,102708,102707,102706,102705,102704,102703,102702,102701,102700,102699,102698,102697,102696,102695,102694,102693,102692,102691,102690,102689,102688,102687,102686,102685,102684,102683,102682,102681,102680,102679,102678,102677,102676,102675,102674,102673,102672,102671,102670,102669,102668,102667,102666,102665,102664,102663,102662];
          const BTC_IDS = [232,231,230,229,228,227,226,225,224,223,222,221,220,219,218,217,216,215,214,213,212];
          const P = {
            dao: `${O}.dao`,
            stOld: `${O}.stacking-dao-core-v5`,
            stNew: `${O}.stacking-dao-core-v6`,
            btcOld: `${O}.stacking-dao-core-btc-v2`,
            btcNew: `${O}.stacking-dao-core-btc-v3`,
            stNft: `${O}.ststx-withdraw-nft-v2`,
            btcNft: `${O}.ststxbtc-withdraw-nft`,
            stData: `${O}.data-core-v1`,
            btcData: `${O}.data-core-v2`,
            stToken: `${O}.ststx-token`,
            btcToken: `${O}.ststxbtc-token-v2`,
            reserve: `${O}.reserve-v1`,
          };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchJson(url, options = {}, attempts = 10) {
            let last;
            for (let i = 1; i <= attempts; i += 1) {
              try {
                const response = await fetch(url, options);
                const text = await response.text();
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 400)}`);
                return JSON.parse(text);
              } catch (error) {
                last = error;
                if (i < attempts) await sleep(1200 * i);
              }
            }
            throw last;
          }

          function split(principal) {
            const i = principal.indexOf('.');
            return [principal.slice(0, i), principal.slice(i + 1)];
          }
          async function call(principal, fn, args = []) {
            const [address, contract] = split(principal);
            const body = JSON.stringify({ sender: O, arguments: args.map(cvToHex) });
            const json = await fetchJson(`${API}/v2/contracts/call-read/${address}/${contract}/${fn}`, {
              method: 'POST', headers: { 'content-type': 'application/json' }, body,
            });
            return {
              okay: Boolean(json.okay),
              decoded: json.result ? cvToString(hexToCV(json.result)) : null,
              raw: json,
            };
          }
          function ownerFrom(value) {
            const text = String(value ?? '');
            const match = text.match(/^\(ok \(some ('?[^)]+)\)\)$/) || text.match(/^\(some ('?[^)]+)\)$/);
            return match ? match[1].replace(/^'/, '') : null;
          }
          function tupleUint(value, key) {
            const m = String(value ?? '').match(new RegExp(`\\(${key} u(\\d+)\\)`));
            return m ? m[1] : null;
          }
          function responseUint(value) {
            const m = String(value ?? '').match(/^\(ok u(\d+)\)$/) || String(value ?? '').match(/^u(\d+)$/);
            return m ? m[1] : null;
          }

          async function inspect(ids, nft, data, kind) {
            const rows = [];
            for (const id of ids) {
              const ownerResult = await call(nft, 'get-owner', [uintCV(id)]);
              await sleep(100);
              const dataResult = await call(data, kind === 'st' ? 'get-withdrawals-by-nft' : 'get-ststxbtc-withdrawals-by-nft', [uintCV(id)]);
              const owner = ownerFrom(ownerResult.decoded);
              const stxAmount = tupleUint(dataResult.decoded, 'stx-amount');
              const burnAmount = kind === 'st' ? tupleUint(dataResult.decoded, 'ststx-amount') : tupleUint(dataResult.decoded, 'stx-amount');
              rows.push({
                nft_id: id,
                owner,
                owner_result: ownerResult.decoded,
                data_result: dataResult.decoded,
                stx_amount: stxAmount,
                burn_amount: burnAmount,
                unlock_burn_height: tupleUint(dataResult.decoded, 'unlock-burn-height'),
                live: Boolean(owner) && BigInt(stxAmount ?? '0') > 0n && BigInt(burnAmount ?? '0') > 0n,
              });
              await sleep(160);
            }
            return rows;
          }

          const stRows = await inspect(ST_IDS, P.stNft, P.stData, 'st');
          const btcRows = await inspect(BTC_IDS, P.btcNft, P.btcData, 'btc');
          const stLive = stRows.filter(row => row.live);
          const btcLive = btcRows.filter(row => row.live);

          const state = {
            st_v5_active: await call(P.dao, 'get-contract-active', [contractPrincipalCV(O, 'stacking-dao-core-v5')]),
            st_v6_active: await call(P.dao, 'get-contract-active', [contractPrincipalCV(O, 'stacking-dao-core-v6')]),
            btc_v2_active: await call(P.dao, 'get-contract-active', [contractPrincipalCV(O, 'stacking-dao-core-btc-v2')]),
            btc_v3_active: await call(P.dao, 'get-contract-active', [contractPrincipalCV(O, 'stacking-dao-core-btc-v3')]),
            st_v6_escrow: await call(P.stToken, 'get-balance', [contractPrincipalCV(O, 'stacking-dao-core-v6')]),
            btc_v3_escrow: await call(P.btcToken, 'get-balance', [contractPrincipalCV(O, 'stacking-dao-core-btc-v3')]),
            reserve_balance: await call(P.reserve, 'get-stx-balance'),
            reserve_withdrawals: await call(P.reserve, 'get-stx-for-withdrawals'),
            st_last_token_id: await call(P.stNft, 'get-last-token-id'),
            btc_last_token_id: await call(P.btcNft, 'get-last-token-id'),
          };

          const sum = (rows, key) => rows.reduce((acc, row) => acc + BigInt(row[key] ?? '0'), 0n).toString();
          const summary = {
            captured_at: new Date().toISOString(),
            st_legacy_checked: stRows.length,
            st_legacy_live_count: stLive.length,
            st_legacy_live_stx_micro: sum(stLive, 'stx_amount'),
            st_legacy_live_burn_micro: sum(stLive, 'burn_amount'),
            btc_legacy_checked: btcRows.length,
            btc_legacy_live_count: btcLive.length,
            btc_legacy_live_stx_micro: sum(btcLive, 'stx_amount'),
            btc_legacy_live_burn_micro: sum(btcLive, 'burn_amount'),
            st_v5_active: state.st_v5_active.decoded,
            st_v6_active: state.st_v6_active.decoded,
            btc_v2_active: state.btc_v2_active.decoded,
            btc_v3_active: state.btc_v3_active.decoded,
            st_v6_escrow_micro: responseUint(state.st_v6_escrow.decoded),
            btc_v3_escrow_micro: responseUint(state.btc_v3_escrow.decoded),
            reserve_balance_micro: responseUint(state.reserve_balance.decoded),
            reserve_withdrawals_micro: responseUint(state.reserve_withdrawals.decoded),
            st_last_token_id: responseUint(state.st_last_token_id.decoded),
            btc_last_token_id: responseUint(state.btc_last_token_id.decoded),
            st_immediately_executable_live_count: stLive.filter(row => BigInt(row.burn_amount ?? '0') <= BigInt(responseUint(state.st_v6_escrow.decoded) ?? '0')).length,
            btc_immediately_executable_live_count: btcLive.filter(row => BigInt(row.burn_amount ?? '0') <= BigInt(responseUint(state.btc_v3_escrow.decoded) ?? '0')).length,
          };

          const output = { summary, principals: P, state, stRows, btcRows, stLive, btcLive };
          await writeFile('snapshot.json', `${JSON.stringify(output, null, 2)}\n`);
          const text = [
            ...Object.entries(summary).map(([key, value]) => `${key}=${value}`),
            '', 'ST_LIVE', ...stLive.map(row => JSON.stringify(row)),
            '', 'BTC_LIVE', ...btcLive.map(row => JSON.stringify(row)),
          ].join('\n') + '\n';
          await writeFile('summary.txt', text);
          console.log(text);
          NODE

          node query.mjs
          sha256sum snapshot.json summary.txt query.mjs > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-legacy-live-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3

      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_legacy_live_count=' evidence/summary.txt
          grep -F 'btc_legacy_live_count=' evidence/summary.txt
