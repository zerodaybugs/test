name: StackingDAO short legacy live-claim gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-legacy-live-short.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Query unresolved legacy IDs and current escrows read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence && cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import {contractPrincipalCV,cvToHex,cvToString,hexToCV,uintCV} from '@stacks/transactions';
          import {writeFile} from 'node:fs/promises';
          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG',A='https://api.mainnet.hiro.so';
          const ST=[102662,102663,102664,102665,102666,102668,102672,102676,102679,102680,102681,102682,102685,102686,102687,102689,102702,102706,102707,102710,102711,102712,102713,102714,102715,102716,102717,102718,102719,102720,102721,102722,102723,102724,102725,102726,102727,102728,102729,102730,102731];
          const BT=[212,213,220,221,227,228,229,230,231,232];
          const P={dao:`${O}.dao`,sf:`${O}.ststx-withdraw-nft-v2`,bf:`${O}.ststxbtc-withdraw-nft`,sd:`${O}.data-core-v1`,bd:`${O}.data-core-v2`,st:`${O}.ststx-token`,bt:`${O}.ststxbtc-token-v2`,r:`${O}.reserve-v1`};
          const S=ms=>new Promise(r=>setTimeout(r,ms));
          async function J(u,o={},n=10){let e;for(let i=1;i<=n;i++){try{let r=await fetch(u,o),t=await r.text();if(!r.ok)throw Error(`${r.status}:${t.slice(0,300)}`);return JSON.parse(t)}catch(x){e=x;if(i<n)await S(i*900)}}throw e}
          function Q(p){let i=p.indexOf('.');return[p.slice(0,i),p.slice(i+1)]}
          async function C(p,f,a=[]){let[x,n]=Q(p),j=await J(`${A}/v2/contracts/call-read/${x}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:a.map(cvToHex)})});return j.result?cvToString(hexToCV(j.result)):null}
          const owner=s=>{let t=String(s??''),m=t.match(/^\(ok \(some ('?[^)]+)\)\)$/)||t.match(/^\(some ('?[^)]+)\)$/);return m?m[1].replace(/^'/,''):null};
          const tu=(s,k)=>String(s??'').match(new RegExp(`\\(${k} u(\\d+)\\)`))?.[1]??null;
          const ru=s=>{let m=String(s??'').match(/^\(ok u(\d+)\)$/)||String(s??'').match(/^u(\d+)$/);return m?.[1]??null};
          async function scan(ids,nft,data,kind){let rows=[];for(let id of ids){let oresult=await C(nft,'get-owner',[uintCV(id)]),o=owner(oresult),row={nft_id:id,owner:o,owner_result:oresult};if(o){await S(100);let d=await C(data,kind==='st'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(id)]);row.data_result=d;row.stx_amount=tu(d,'stx-amount');row.burn_amount=kind==='st'?tu(d,'ststx-amount'):tu(d,'stx-amount');row.unlock_burn_height=tu(d,'unlock-burn-height');row.live=BigInt(row.stx_amount??0)>0n&&BigInt(row.burn_amount??0)>0n}else row.live=false;rows.push(row);await S(180)}return rows}
          let sr=await scan(ST,P.sf,P.sd,'st'),br=await scan(BT,P.bf,P.bd,'btc'),sl=sr.filter(x=>x.live),bl=br.filter(x=>x.live);
          let state={st_v5_active:await C(P.dao,'get-contract-active',[contractPrincipalCV(O,'stacking-dao-core-v5')]),st_v6_active:await C(P.dao,'get-contract-active',[contractPrincipalCV(O,'stacking-dao-core-v6')]),btc_v2_active:await C(P.dao,'get-contract-active',[contractPrincipalCV(O,'stacking-dao-core-btc-v2')]),btc_v3_active:await C(P.dao,'get-contract-active',[contractPrincipalCV(O,'stacking-dao-core-btc-v3')]),st_escrow:await C(P.st,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-v6')]),btc_escrow:await C(P.bt,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-btc-v3')]),reserve_balance:await C(P.r,'get-stx-balance'),reserve_withdrawals:await C(P.r,'get-stx-for-withdrawals')};
          const sum=(a,k)=>a.reduce((s,x)=>s+BigInt(x[k]??0),0n).toString(),se=BigInt(ru(state.st_escrow)??0),be=BigInt(ru(state.btc_escrow)??0);
          let summary={captured_at:new Date().toISOString(),st_unresolved_checked:sr.length,st_live_count:sl.length,st_live_stx_micro:sum(sl,'stx_amount'),st_live_burn_micro:sum(sl,'burn_amount'),st_executable_count:sl.filter(x=>BigInt(x.burn_amount??0)<=se).length,st_v6_escrow_micro:se.toString(),btc_unresolved_checked:br.length,btc_live_count:bl.length,btc_live_stx_micro:sum(bl,'stx_amount'),btc_live_burn_micro:sum(bl,'burn_amount'),btc_executable_count:bl.filter(x=>BigInt(x.burn_amount??0)<=be).length,btc_v3_escrow_micro:be.toString(),reserve_balance_micro:ru(state.reserve_balance),reserve_withdrawals_micro:ru(state.reserve_withdrawals),st_v5_active:state.st_v5_active,st_v6_active:state.st_v6_active,btc_v2_active:state.btc_v2_active,btc_v3_active:state.btc_v3_active};
          let out={summary,state,stRows:sr,btcRows:br,stLive:sl,btcLive:bl};await writeFile('snapshot.json',JSON.stringify(out,null,2)+'\n');let text=Object.entries(summary).map(([k,v])=>`${k}=${v}`).join('\n')+'\nST_LIVE\n'+sl.map(JSON.stringify).join('\n')+'\nBTC_LIVE\n'+bl.map(JSON.stringify).join('\n')+'\n';await writeFile('summary.txt',text);console.log(text)
          NODE
          node query.mjs
          sha256sum snapshot.json summary.txt query.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-legacy-live-short-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_live_count=' evidence/summary.txt
          grep -F 'btc_live_count=' evidence/summary.txt
