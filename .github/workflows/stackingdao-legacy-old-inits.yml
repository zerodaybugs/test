name: StackingDAO legacy withdrawal initiation history

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-legacy-old-inits.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export successful legacy init-withdraw calls read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/raw
          O=SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG
          A=https://api.mainnet.hiro.so
          for C in stacking-dao-core-v5 stacking-dao-core-btc-v2; do
            FIRST="evidence/raw/$C-0000.json"
            curl --retry 10 --retry-delay 2 --fail-with-body -sS "$A/extended/v1/address/$O.$C/transactions?limit=50&offset=0" -o "$FIRST"
            TOTAL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("total",0))' "$FIRST")
            for ((OFF=50; OFF<TOTAL; OFF+=50)); do
              printf -v PAD '%04d' "$OFF"
              curl --retry 10 --retry-delay 2 --fail-with-body -sS "$A/extended/v1/address/$O.$C/transactions?limit=50&offset=$OFF" -o "evidence/raw/$C-$PAD.json"
              sleep 0.15
            done
          done
          python3 - <<'PY'
          import glob,json,os
          O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG'
          out={}
          for c in ['stacking-dao-core-v5','stacking-dao-core-btc-v2']:
            rows=[]
            for p in sorted(glob.glob(f'evidence/raw/{c}-*.json')):
              rows.extend(json.load(open(p)).get('results',[]))
            inits=[]
            withdrawals=[]
            for row in rows:
              tx=row.get('tx',row)
              cc=tx.get('contract_call') or row.get('contract_call')
              if not cc or cc.get('contract_id')!=f'{O}.{c}' or (tx.get('tx_status') or row.get('tx_status'))!='success':
                continue
              if cc.get('function_name')=='init-withdraw':
                repr_=(tx.get('tx_result') or row.get('tx_result') or {}).get('repr','')
                if repr_.startswith('(ok u') and repr_.endswith(')'):
                  nft_id=repr_[5:-1]
                  args=cc.get('function_args') or []
                  amount=args[2].get('repr') if len(args)>2 else None
                  inits.append({'nft_id':nft_id,'amount_repr':amount,'tx_id':tx.get('tx_id') or row.get('tx_id'),'sender':tx.get('sender_address') or row.get('sender_address'),'burn_block_time_iso':tx.get('burn_block_time_iso') or row.get('burn_block_time_iso'),'block_height':tx.get('block_height') or row.get('block_height')})
              elif cc.get('function_name')=='withdraw':
                args=cc.get('function_args') or []
                if len(args)>3:
                  withdrawals.append(args[3].get('repr'))
            out[c]={'transaction_rows':len(rows),'init_count':len(inits),'withdraw_count':len(withdrawals),'inits':inits,'withdrawals':withdrawals}
          json.dump(out,open('evidence/legacy-inits.json','w'),indent=2); open('evidence/legacy-inits.json','a').write('\n')
          with open('evidence/summary.txt','w') as f:
            for c,v in out.items():
              f.write(f'{c}_transaction_rows={v["transaction_rows"]}\n{c}_init_count={v["init_count"]}\n{c}_withdraw_count={v["withdraw_count"]}\n')
          PY
          cat evidence/summary.txt
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-legacy-inits-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          test -s evidence/legacy-inits.json
