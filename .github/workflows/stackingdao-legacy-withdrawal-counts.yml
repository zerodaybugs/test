name: StackingDAO legacy withdrawal count diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-legacy-withdrawal-counts.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Query transaction totals and escrow balances read-only
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          O=SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG
          A=https://api.mainnet.hiro.so
          : > evidence/summary.txt
          for C in stacking-dao-core-v5 stacking-dao-core-v6 stacking-dao-core-btc-v2 stacking-dao-core-btc-v3; do
            URL="$A/extended/v1/address/$O.$C/transactions?limit=1&offset=0"
            curl --retry 8 --retry-delay 2 --fail-with-body -sS "$URL" -o "evidence/$C.json"
            python3 - "$C" "evidence/$C.json" <<'PY' >> evidence/summary.txt
          import json,sys
          name,path=sys.argv[1:]
          x=json.load(open(path))
          print(f"{name}_total={x.get('total')}")
          print(f"{name}_results={len(x.get('results',[]))}")
          PY
          done
          for C in stacking-dao-core-v6 stacking-dao-core-btc-v3 reserve-v1; do
            curl --retry 8 --retry-delay 2 --fail-with-body -sS "$A/extended/v1/address/$O.$C/stx" -o "evidence/$C-stx.json"
          done
          cat evidence/summary.txt
          (cd evidence && sha256sum *.json summary.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stackingdao-legacy-counts-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
      - name: Enforce diagnostics
        if: always()
        shell: bash
        run: |
          test -s evidence/summary.txt
