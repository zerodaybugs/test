name: StackingDAO legacy withdrawal focused gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-legacy-withdrawal-fast.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query focused legacy and current escrow state read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1

          cat > query.mjs <<'NODE'
          import { contractPrincipalCV, cvToHex, cvToString, hexToCV, uintCV } from '@stacks/transactions';
          import { writeFile } from 'node:fs/promises';

          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const A='https://api.mainnet.hiro.so';
          const I={
            so:`${O}.stacking-dao-core-v5`,sn:`${O}.stacking-dao-core-v6`,
            bo:`${O}.stacking-dao-core-btc-v2`,bn:`${O}.stacking-dao-core-btc-v3`,
            sf:`${O}.ststx-withdraw-nft-v2`,bf:`${O}.ststxbtc-withdraw-nft`,
            sd:`${O}.data-core-v1`,bd:`${O}.data-core-v2`,
            st:`${O}.ststx-token`,bt:`${O}.ststxbtc-token-v2`,r:`${O}.reserve-v1`};
          const S=ms=>new Promise(r=>setTimeout(r,ms));
          async function J(u,o={},n=8){let e;for(let i=1;i<=n;i++){try{let r=await fetch(u,o),t=await r.text();if(!r.ok)throw Error(`${r.status}:${t.slice(0,300)}`);return JSON.parse(t)}catch(x){e=x;if(i<n)await S(i*1000)}}throw e}
          function Q(p){let i=p.indexOf('.');return[p.slice(0,i),p.slice(i+1)]}
          async function C(p,f,a=[]){let[x,n]=Q(p),b=JSON.stringify({sender:O,arguments:a.map(cvToHex)}),j=await J(`${A}/v2/contracts/call-read/${x}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:b});return j.result?cvToString(hexToCV(j.result)):null}
          async function T(p){let z=[],first=await J(`${A}/extended/v1/address/${p}/transactions?limit=50&offset=0`),total=Number(first.total??first.results?.length??0);z.push(...(first.results??[]));for(let o=50;o<total;o+=50){let j=await J(`${A}/extended/v1/address/${p}/transactions?limit=50&offset=${o}`);z.push(...(j.results??[]));await S(150)}return{total,rows:z}}
          const tx=r=>r.tx??r,cc=r=>tx(r).contract_call??r.contract_call,ok=r=>(tx(r).tx_status??r.tx_status)==='success';
          const ur=s=>{let m=String(s??'').match(/^\(ok u(\d+)\)$/);return m?.[1]??null};
          const ua=(c,i)=>String(c?.function_args?.[i]?.repr??'').match(/^u(\d+)$/)?.[1]??null;
          const tu=(s,k)=>String(s??'').match(new RegExp(`\\(${k} u(\\d+)\\)`))?.[1]??null;
          const ow=s=>String(s??'').match(/^\(ok \(some ('?[^)]+)\)\)$/)?.[1]?.replace(/^'/,'')??null;
          async function H(p){let q=await T(p),ini=[];for(let r of q.rows){let c=cc(r);if(c?.contract_id===p&&c.function_name==='init-withdraw'&&ok(r)){let id=ur(tx(r).tx_result?.repr??r.tx_result?.repr);if(id)ini.push({id,amount:ua(c,2),tx:tx(r).tx_id??r.tx_id,time:tx(r).burn_block_time_iso??r.burn_block_time_iso})}}return{total:q.total,inits:ini}}
          let hs=await H(I.so),hb=await H(I.bo);
          async function L(hist,nft,data,kind){let live=[];for(let x of hist.inits){let id=Number(x.id),ownerResult=await C(nft,'get-owner',[uintCV(id)]),d=await C(data,kind==='st'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(id)]),owner=ow(ownerResult),stx=tu(d,'stx-amount'),burn=kind==='st'?tu(d,'ststx-amount'):tu(d,'stx-amount');if(owner&&BigInt(stx??0)>0n&&BigInt(burn??0)>0n)live.push({...x,owner,stx,burn,unlock:tu(d,'unlock-burn-height'),data:d});await S(80)}return live}
          let sl=await L(hs,I.sf,I.sd,'st'),bl=await L(hb,I.bf,I.bd,'btc');
          let stEsc=ur(await C(I.st,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-v6')])),btEsc=ur(await C(I.bt,'get-balance',[contractPrincipalCV(O,'stacking-dao-core-btc-v3')]));
          let stLast=ur(await C(I.sf,'get-last-token-id')),btLast=ur(await C(I.bf,'get-last-token-id'));
          let reserveBal=ur(await C(I.r,'get-stx-balance')),reserveW=ur(await C(I.r,'get-stx-for-withdrawals'));
          async function recent(nft,data,last,kind,oldSet){let out=[];let hi=Number(last??0),lo=Math.max(kind==='st'?100000:0,hi-80);for(let id=lo;id<hi;id++){if(oldSet.has(String(id)))continue;let o=ow(await C(nft,'get-owner',[uintCV(id)]));if(!o)continue;let d=await C(data,kind==='st'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(id)]),stx=tu(d,'stx-amount'),burn=kind==='st'?tu(d,'ststx-amount'):tu(d,'stx-amount');if(BigInt(stx??0)>0n&&BigInt(burn??0)>0n)out.push({id:String(id),owner:o,stx,burn,unlock:tu(d,'unlock-burn-height'),data:d});await S(70)}return out}
          let sr=await recent(I.sf,I.sd,stLast,'st',new Set(hs.inits.map(x=>x.id))),br=await recent(I.bf,I.bd,btLast,'btc',new Set(hb.inits.map(x=>x.id)));
          const sum=(a,k)=>a.reduce((s,x)=>s+BigInt(x[k]??0),0n).toString();
          let summary={captured_at:new Date().toISOString(),st_old_tx_total:hs.total,st_old_init_count:hs.inits.length,st_old_live_count:sl.length,st_old_live_stx:sum(sl,'stx'),st_old_live_burn:sum(sl,'burn'),st_current_escrow:stEsc,st_recent_current_live_count:sr.length,st_recent_current_stx:sum(sr,'stx'),btc_old_tx_total:hb.total,btc_old_init_count:hb.inits.length,btc_old_live_count:bl.length,btc_old_live_stx:sum(bl,'stx'),btc_old_live_burn:sum(bl,'burn'),btc_current_escrow:btEsc,btc_recent_current_live_count:br.length,btc_recent_current_stx:sum(br,'stx'),reserve_balance:reserveBal,reserve_withdrawals:reserveW,st_last_token_id:stLast,btc_last_token_id:btLast};
          let out={summary,ids:I,stOld:hs,btcOld:hb,stOldLive:sl,btcOldLive:bl,stRecentCurrent:sr,btcRecentCurrent:br};
          await writeFile('snapshot.json',JSON.stringify(out,null,2)+'\n');let text=Object.entries(summary).map(([k,v])=>`${k}=${v}`).join('\n')+'\nST_OLD_LIVE\n'+sl.map(JSON.stringify).join('\n')+'\nBTC_OLD_LIVE\n'+bl.map(JSON.stringify).join('\n')+'\n';await writeFile('summary.txt',text);console.log(text)
          NODE

          node query.mjs
          sha256sum snapshot.json summary.txt query.mjs > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-legacy-focused-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3

      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_old_live_count=' evidence/summary.txt
          grep -F 'btc_old_live_count=' evidence/summary.txt
