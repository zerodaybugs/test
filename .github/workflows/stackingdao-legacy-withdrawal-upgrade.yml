name: StackingDAO legacy withdrawal upgrade liveness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-legacy-withdrawal-upgrade.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query public mainnet state read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1

          cat > query.mjs <<'NODE'
          import {
            contractPrincipalCV,
            cvToHex,
            cvToString,
            hexToCV,
            uintCV,
          } from '@stacks/transactions';
          import { writeFile } from 'node:fs/promises';

          const OWNER = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const API = 'https://api.mainnet.hiro.so';
          const ids = {
            stOld: `${OWNER}.stacking-dao-core-v5`,
            stNew: `${OWNER}.stacking-dao-core-v6`,
            btcOld: `${OWNER}.stacking-dao-core-btc-v2`,
            btcNew: `${OWNER}.stacking-dao-core-btc-v3`,
            stNft: `${OWNER}.ststx-withdraw-nft-v2`,
            btcNft: `${OWNER}.ststxbtc-withdraw-nft`,
            stData: `${OWNER}.data-core-v1`,
            btcData: `${OWNER}.data-core-v2`,
            stToken: `${OWNER}.ststx-token`,
            btcToken: `${OWNER}.ststxbtc-token-v2`,
            reserve: `${OWNER}.reserve-v1`,
          };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchJson(url, options = {}, attempts = 10) {
            let last;
            for (let i = 1; i <= attempts; i += 1) {
              try {
                const response = await fetch(url, options);
                const text = await response.text();
                if (!response.ok) {
                  if ((response.status === 429 || response.status >= 500) && i < attempts) {
                    await sleep(1200 * i);
                    continue;
                  }
                  throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 500)}`);
                }
                return JSON.parse(text);
              } catch (error) {
                last = error;
                if (i < attempts) await sleep(1200 * i);
              }
            }
            throw last;
          }

          function splitPrincipal(principal) {
            const i = principal.indexOf('.');
            return [principal.slice(0, i), principal.slice(i + 1)];
          }

          async function call(principal, fn, args = []) {
            const [address, contract] = splitPrincipal(principal);
            const body = JSON.stringify({ sender: OWNER, arguments: args.map(cvToHex) });
            const json = await fetchJson(`${API}/v2/contracts/call-read/${address}/${contract}/${fn}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body,
            });
            return {
              okay: Boolean(json.okay),
              decoded: json.result ? cvToString(hexToCV(json.result)) : null,
              raw: json,
            };
          }

          async function allTransactions(principal) {
            const rows = [];
            let offset = 0;
            while (true) {
              const page = await fetchJson(`${API}/extended/v1/address/${principal}/transactions?limit=50&offset=${offset}`);
              const batch = page.results ?? [];
              rows.push(...batch);
              if (batch.length < 50) break;
              offset += batch.length;
              await sleep(250);
            }
            return rows;
          }

          function tx(row) { return row.tx ?? row; }
          function contractCall(row) { return tx(row).contract_call ?? row.contract_call ?? null; }
          function successful(row) { return (tx(row).tx_status ?? row.tx_status) === 'success'; }
          function uintResult(repr) {
            const m = String(repr ?? '').match(/^\(ok u(\d+)\)$/);
            return m ? m[1] : null;
          }
          function uintArg(callData, index) {
            const m = String(callData?.function_args?.[index]?.repr ?? '').match(/^u(\d+)$/);
            return m ? m[1] : null;
          }
          function tupleUint(repr, key) {
            const m = String(repr ?? '').match(new RegExp(`\\(${key} u(\\d+)\\)`));
            return m ? m[1] : null;
          }
          function ownerFrom(repr) {
            const m = String(repr ?? '').match(/^\(ok \(some ('?[^)]+)\)\)$/);
            return m ? m[1].replace(/^'/, '') : null;
          }

          async function history(principal) {
            const rows = await allTransactions(principal);
            const inits = [];
            const withdrawals = [];
            for (const row of rows) {
              const c = contractCall(row);
              if (!c || c.contract_id !== principal || !successful(row)) continue;
              if (c.function_name === 'init-withdraw') {
                const nftId = uintResult(tx(row).tx_result?.repr ?? row.tx_result?.repr);
                if (nftId !== null) {
                  inits.push({
                    nft_id: nftId,
                    amount: uintArg(c, 2),
                    tx_id: tx(row).tx_id ?? row.tx_id,
                    sender: tx(row).sender_address ?? row.sender_address,
                    burn_block_time_iso: tx(row).burn_block_time_iso ?? row.burn_block_time_iso,
                    block_height: tx(row).block_height ?? row.block_height,
                  });
                }
              }
              if (c.function_name === 'withdraw') {
                const nftId = uintArg(c, 3);
                if (nftId !== null) withdrawals.push(nftId);
              }
            }
            return { transaction_count: rows.length, inits, withdrawals };
          }

          const histories = {
            stOld: await history(ids.stOld),
            stNew: await history(ids.stNew),
            btcOld: await history(ids.btcOld),
            btcNew: await history(ids.btcNew),
          };

          async function classify({ oldKey, newKey, nft, data, token, newCore, kind }) {
            const used = new Set([
              ...histories[oldKey].withdrawals,
              ...histories[newKey].withdrawals,
            ]);
            const candidates = histories[oldKey].inits.filter(row => !used.has(row.nft_id));
            const live = [];
            const burnedOrMissing = [];

            for (const candidate of candidates) {
              const id = Number(candidate.nft_id);
              const ownerResult = await call(nft, 'get-owner', [uintCV(id)]);
              const dataResult = await call(
                data,
                kind === 'stx' ? 'get-withdrawals-by-nft' : 'get-ststxbtc-withdrawals-by-nft',
                [uintCV(id)],
              );
              const owner = ownerFrom(ownerResult.decoded);
              const record = {
                ...candidate,
                owner,
                owner_result: ownerResult.decoded,
                data_result: dataResult.decoded,
                stx_amount: tupleUint(dataResult.decoded, 'stx-amount'),
                burn_amount: kind === 'stx'
                  ? tupleUint(dataResult.decoded, 'ststx-amount')
                  : tupleUint(dataResult.decoded, 'stx-amount'),
                unlock_burn_height: tupleUint(dataResult.decoded, 'unlock-burn-height'),
              };
              if (owner && BigInt(record.stx_amount ?? '0') > 0n && BigInt(record.burn_amount ?? '0') > 0n) {
                live.push(record);
              } else {
                burnedOrMissing.push(record);
              }
              await sleep(100);
            }

            const newEscrow = await call(token, 'get-balance', [contractPrincipalCV(...splitPrincipal(newCore))]);
            return {
              old_init_count: histories[oldKey].inits.length,
              old_withdraw_count: histories[oldKey].withdrawals.length,
              new_init_count: histories[newKey].inits.length,
              new_withdraw_count: histories[newKey].withdrawals.length,
              candidate_count: candidates.length,
              live,
              burned_or_missing: burnedOrMissing,
              new_core_escrow_result: newEscrow.decoded,
            };
          }

          const st = await classify({
            oldKey: 'stOld', newKey: 'stNew', nft: ids.stNft, data: ids.stData,
            token: ids.stToken, newCore: ids.stNew, kind: 'stx',
          });
          const btc = await classify({
            oldKey: 'btcOld', newKey: 'btcNew', nft: ids.btcNft, data: ids.btcData,
            token: ids.btcToken, newCore: ids.btcNew, kind: 'btc',
          });

          const stCurrentLive = [];
          for (const candidate of histories.stNew.inits) {
            if (histories.stNew.withdrawals.includes(candidate.nft_id)) continue;
            const owner = ownerFrom((await call(ids.stNft, 'get-owner', [uintCV(Number(candidate.nft_id))])).decoded);
            if (owner) stCurrentLive.push(candidate);
            await sleep(75);
          }
          const btcCurrentLive = [];
          for (const candidate of histories.btcNew.inits) {
            if (histories.btcNew.withdrawals.includes(candidate.nft_id)) continue;
            const owner = ownerFrom((await call(ids.btcNft, 'get-owner', [uintCV(Number(candidate.nft_id))])).decoded);
            if (owner) btcCurrentLive.push(candidate);
            await sleep(75);
          }

          function sum(rows, field) {
            return rows.reduce((acc, row) => acc + BigInt(row[field] ?? '0'), 0n).toString();
          }
          function okUint(repr) {
            const m = String(repr ?? '').match(/^\(ok u(\d+)\)$/);
            return m ? m[1] : null;
          }

          const reserveBalance = await call(ids.reserve, 'get-stx-balance');
          const reserveLocked = await call(ids.reserve, 'get-stx-for-withdrawals');
          const summary = {
            captured_at: new Date().toISOString(),
            st_old_live_count: st.live.length,
            st_old_live_stx_micro: sum(st.live, 'stx_amount'),
            st_old_live_burn_micro: sum(st.live, 'burn_amount'),
            st_new_live_count: stCurrentLive.length,
            st_new_live_requested_micro: sum(stCurrentLive, 'amount'),
            st_new_core_escrow_micro: okUint(st.new_core_escrow_result),
            btc_old_live_count: btc.live.length,
            btc_old_live_stx_micro: sum(btc.live, 'stx_amount'),
            btc_old_live_burn_micro: sum(btc.live, 'burn_amount'),
            btc_new_live_count: btcCurrentLive.length,
            btc_new_live_requested_micro: sum(btcCurrentLive, 'amount'),
            btc_new_core_escrow_micro: okUint(btc.new_core_escrow_result),
            reserve_balance_micro: okUint(reserveBalance.decoded),
            reserve_withdrawals_micro: okUint(reserveLocked.decoded),
          };

          const output = { captured_at: summary.captured_at, ids, histories, st, btc, stCurrentLive, btcCurrentLive, summary };
          await writeFile('snapshot.json', `${JSON.stringify(output, null, 2)}\n`);
          const text = [
            ...Object.entries(summary).map(([key, value]) => `${key}=${value}`),
            '',
            'ST_OLD_LIVE',
            ...st.live.map(row => JSON.stringify(row)),
            '',
            'BTC_OLD_LIVE',
            ...btc.live.map(row => JSON.stringify(row)),
          ].join('\n') + '\n';
          await writeFile('snapshot.txt', text);
          console.log(text);
          NODE

          node query.mjs
          sha256sum snapshot.json snapshot.txt query.mjs > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-legacy-withdrawal-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3

      - name: Enforce integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_old_live_count=' evidence/snapshot.txt
          grep -F 'btc_old_live_count=' evidence/snapshot.txt
