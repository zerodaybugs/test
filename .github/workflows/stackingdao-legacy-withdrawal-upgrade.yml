name: StackingDAO legacy withdrawal upgrade liveness
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/stackingdao-legacy-withdrawal-upgrade.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Query public mainnet state read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence && cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import{cvToHex,cvToString,hexToCV,principalCV,uintCV}from'@stacks/transactions';import{writeFile}from'node:fs/promises';
          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG',A='https://api.mainnet.hiro.so',S=ms=>new Promise(r=>setTimeout(r,ms));
          const I={so:`${O}.stacking-dao-core-v5`,sn:`${O}.stacking-dao-core-v6`,bo:`${O}.stacking-dao-core-btc-v2`,bn:`${O}.stacking-dao-core-btc-v3`,sf:`${O}.ststx-withdraw-nft-v2`,bf:`${O}.ststxbtc-withdraw-nft`,sd:`${O}.data-core-v1`,bd:`${O}.data-core-v2`,st:`${O}.ststx-token`,bt:`${O}.ststxbtc-token-v2`};
          async function J(u,o={},n=10){let e;for(let i=1;i<=n;i++)try{let r=await fetch(u,o),t=await r.text();if(!r.ok){if((r.status==429||r.status>=500)&&i<n){await S(i*1400);continue}throw Error(`${r.status}:${t.slice(0,300)}`)}return JSON.parse(t)}catch(x){e=x;if(i<n)await S(i*1400)}throw e}
          function Q(id){let i=id.indexOf('.');return[id.slice(0,i),id.slice(i+1)]}async function C(id,f,a=[]){let[x,n]=Q(id),b=JSON.stringify({sender:O,arguments:a.map(cvToHex)}),j=await J(`${A}/v2/contracts/call-read/${x}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:b});return j.result?cvToString(hexToCV(j.result)):null}
          async function T(p){let z=[],o=0,t=1e9;while(o<t){let j=await J(`${A}/extended/v2/addresses/${p}/transactions?limit=50&offset=${o}`),r=j.results??[];z.push(...r);t=Number(j.total??z.length);if(!r.length)break;o+=r.length;await S(220)}return z}
          const cr=r=>r.tx??r,cc=r=>cr(r).contract_call??r.contract_call,ok=r=>(cr(r).tx_status??r.tx_status)=='success',ru=s=>{let m=String(s??'').match(/^\(ok u(\d+)\)$/);return m?m[1]:null},au=(c,i)=>{let m=String(c?.function_args?.[i]?.repr??'').match(/^u(\d+)$/);return m?m[1]:null},tu=(s,k)=>{let m=String(s??'').match(new RegExp(`\\(${k} u(\\d+)\\)`));return m?m[1]:null};
          async function R(k){let rows=await T(I[k]),ini=[],wd=[];for(let r of rows){let c=cc(r);if(!c||c.contract_id!=I[k]||!ok(r))continue;if(c.function_name=='init-withdraw'){let id=ru(cr(r).tx_result?.repr);if(id)ini.push({id,tx:cr(r).tx_id,time:cr(r).burn_block_time_iso,amount:au(c,2)})}if(c.function_name=='withdraw'){let id=au(c,3);if(id)wd.push(id)}}return{ini,wd}}
          let H={};for(let k of['so','sn','bo','bn'])H[k]=await R(k);
          async function E(kind,oldKey,newKey,nft,data,token,newcore){let used=new Set([...H[oldKey].wd,...H[newKey].wd]),cand=H[oldKey].ini.filter(x=>!used.has(x.id)),live=[];for(let x of cand){let id=Number(x.id),own=await C(nft,'get-owner',[uintCV(id)]),dat=await C(data,kind=='s'?'get-withdrawals-by-nft':'get-ststxbtc-withdrawals-by-nft',[uintCV(id)]),m=own?.match(/\(ok \(some ([^)]+)\)\)/);if(m)live.push({...x,owner:m[1],data:dat,stx:tu(dat,'stx-amount'),burn:kind=='s'?tu(dat,'ststx-amount'):tu(dat,'stx-amount')});await S(100)}return{old_inits:H[oldKey].ini.length,old_withdraws:H[oldKey].wd.length,new_withdraws:H[newKey].wd.length,candidates:cand.length,live,new_core_escrow:await C(token,'get-balance',[principalCV(newcore)])}}
          let st=await E('s','so','sn',I.sf,I.sd,I.st,I.sn),bt=await E('b','bo','bn',I.bf,I.bd,I.bt,I.bn),sum={st_live:st.live.length,st_stx:st.live.reduce((a,x)=>a+BigInt(x.stx??0),0n).toString(),st_burn:st.live.reduce((a,x)=>a+BigInt(x.burn??0),0n).toString(),st_escrow:st.new_core_escrow,btc_live:bt.live.length,btc_stx:bt.live.reduce((a,x)=>a+BigInt(x.stx??0),0n).toString(),btc_burn:bt.live.reduce((a,x)=>a+BigInt(x.burn??0),0n).toString(),btc_escrow:bt.new_core_escrow};
          let out={captured_at:new Date().toISOString(),ids:I,histories:H,st,btc:bt,summary:sum};await writeFile('snapshot.json',JSON.stringify(out,null,2)+'\n');let txt=[`captured_at=${out.captured_at}`,...Object.entries(sum).map(([k,v])=>`${k}=${v}`),'ST',...st.live.map(JSON.stringify),'BTC',...bt.live.map(JSON.stringify)].join('\n')+'\n';await writeFile('snapshot.txt',txt);console.log(txt)
          NODE
          node query.mjs
          sha256sum snapshot.json snapshot.txt query.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-legacy-withdrawal-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Enforce integrity
        run: |
          set -euo pipefail
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'st_live=' evidence/snapshot.txt
          grep -F 'btc_live=' evidence/snapshot.txt
