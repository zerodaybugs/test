name: StackingDAO pinned toolchain bundle

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-pinned-toolchain-bundle.yml"

permissions:
  contents: read

concurrency:
  group: stackingdao-toolchain-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build pinned generic toolchain bundle
        shell: bash
        run: |
          mkdir -p metadata
          set +e

          clone_rc=98
          checkout_rc=98
          npm_rc=98
          clarinet_download_rc=98
          clarinet_checksum_rc=98
          clarinet_extract_rc=98
          clarinet_install_rc=98
          clarinet_check_rc=98
          smoke_rc=98

          git clone --filter=blob:none --no-tags https://github.com/StackingDAO/contracts.git stackingdao \
            > metadata/source-checkout.log 2>&1
          clone_rc=$?

          if [ "$clone_rc" = 0 ]; then
            git -C stackingdao checkout --detach a8d7d2a2dcffa0b4759bc8411f9d1369fc44b736 \
              >> metadata/source-checkout.log 2>&1
            checkout_rc=$?
            git -C stackingdao rev-parse HEAD > metadata/stackingdao-head.txt 2>&1
          fi

          if [ "$checkout_rc" = 0 ]; then
            (
              cd stackingdao
              npm ci
            ) > metadata/npm-ci.log 2>&1
            npm_rc=$?
          fi

          curl --fail --location --silent --show-error \
            https://github.com/stx-labs/clarinet/releases/download/v3.21.1/clarinet-linux-x64-glibc.tar.gz \
            --output /tmp/clarinet-linux-x64-glibc.tar.gz \
            > metadata/clarinet-download.log 2>&1
          clarinet_download_rc=$?

          if [ "$clarinet_download_rc" = 0 ]; then
            echo "bf94c841fe660de1db8403324e70c80994d9402e77f436ce99769c156e208e36  /tmp/clarinet-linux-x64-glibc.tar.gz" \
              | sha256sum --check > metadata/clarinet-checksum.log 2>&1
            clarinet_checksum_rc=$?

            mkdir -p /tmp/clarinet-dist stackingdao/toolchain
            tar -tzf /tmp/clarinet-linux-x64-glibc.tar.gz > metadata/clarinet-archive.txt 2>&1
            tar -xzf /tmp/clarinet-linux-x64-glibc.tar.gz -C /tmp/clarinet-dist \
              >> metadata/clarinet-archive.txt 2>&1
            clarinet_extract_rc=$?

            clarinet_bin=$(find /tmp/clarinet-dist -type f -name clarinet -print -quit)
            if [ -z "$clarinet_bin" ]; then
              clarinet_bin=$(find /tmp/clarinet-dist -type f -name 'clarinet-*' -print -quit)
            fi
            if [ -n "$clarinet_bin" ]; then
              install -m 0755 "$clarinet_bin" stackingdao/toolchain/clarinet \
                > metadata/clarinet-install.log 2>&1
              clarinet_install_rc=$?
              stackingdao/toolchain/clarinet --version > metadata/clarinet-version.txt 2>&1
            else
              echo "No Clarinet executable found" > metadata/clarinet-install.log
              clarinet_install_rc=97
            fi
          fi

          if [ "$clarinet_install_rc" = 0 ] && [ "$checkout_rc" = 0 ]; then
            (
              cd stackingdao
              ./toolchain/clarinet check
            ) > metadata/clarinet-check.log 2>&1
            clarinet_check_rc=$?
          fi

          if [ "$npm_rc" = 0 ]; then
            (
              cd stackingdao
              npx vitest run tests/version-3/swap-ststx-ststxbtc_test.ts --reporter=verbose
            ) > metadata/smoke-test.log 2>&1
            smoke_rc=$?
          fi

          if [ -d stackingdao/.git ]; then
            rm -rf stackingdao/.git
          fi
          if [ -f stackingdao/toolchain/clarinet ]; then
            sha256sum stackingdao/toolchain/clarinet > metadata/clarinet-binary.sha256
          fi

          cat > metadata/exit-codes.txt <<EOF
          clone_rc=$clone_rc
          checkout_rc=$checkout_rc
          npm_rc=$npm_rc
          clarinet_download_rc=$clarinet_download_rc
          clarinet_checksum_rc=$clarinet_checksum_rc
          clarinet_extract_rc=$clarinet_extract_rc
          clarinet_install_rc=$clarinet_install_rc
          clarinet_check_rc=$clarinet_check_rc
          smoke_rc=$smoke_rc
          EOF

          find metadata -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > metadata/SHA256SUMS
          exit 0

      - name: Upload generic toolchain bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-pinned-toolchain-${{ github.run_id }}
          path: |
            stackingdao/
            metadata/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 1

      - name: Enforce toolchain integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'clone_rc=0' metadata/exit-codes.txt
          grep -Fx 'checkout_rc=0' metadata/exit-codes.txt
          grep -Fx 'npm_rc=0' metadata/exit-codes.txt
          grep -Fx 'clarinet_download_rc=0' metadata/exit-codes.txt
          grep -Fx 'clarinet_checksum_rc=0' metadata/exit-codes.txt
          grep -Fx 'clarinet_extract_rc=0' metadata/exit-codes.txt
          grep -Fx 'clarinet_install_rc=0' metadata/exit-codes.txt
          grep -Fx 'a8d7d2a2dcffa0b4759bc8411f9d1369fc44b736' metadata/stackingdao-head.txt
