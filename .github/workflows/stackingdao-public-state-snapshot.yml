name: StackingDAO public state snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-public-state-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query public mainnet state read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          cd snapshot
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1

          cat > query.mjs <<'NODE'
          import {
            contractPrincipalCV,
            cvToHex,
            cvToString,
            hexToCV,
            uintCV,
          } from '@stacks/transactions';
          import { writeFile } from 'node:fs/promises';

          const address = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const api = 'https://api.mainnet.hiro.so';
          const sender = address;
          const results = {
            captured_at: new Date().toISOString(),
            endpoint: api,
            address,
            calls: {},
            accounts: {},
          };

          async function fetchJson(url, options = {}, attempts = 4) {
            let last;
            for (let i = 1; i <= attempts; i += 1) {
              try {
                const response = await fetch(url, options);
                const text = await response.text();
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text}`);
                return JSON.parse(text);
              } catch (error) {
                last = error;
                if (i < attempts) await new Promise(resolve => setTimeout(resolve, 1500 * i));
              }
            }
            throw last;
          }

          async function call(contract, fn, args = []) {
            const key = `${contract}.${fn}(${args.map(cvToHex).join(',')})`;
            try {
              const body = JSON.stringify({ sender, arguments: args.map(cvToHex) });
              const json = await fetchJson(
                `${api}/v2/contracts/call-read/${address}/${contract}/${fn}`,
                { method: 'POST', headers: { 'content-type': 'application/json' }, body },
              );
              const decoded = json.result ? cvToString(hexToCV(json.result)) : null;
              results.calls[key] = { ok: Boolean(json.okay), decoded, raw: json };
              return decoded;
            } catch (error) {
              results.calls[key] = { ok: false, error: String(error) };
              return null;
            }
          }

          async function account(principal) {
            try {
              results.accounts[principal] = await fetchJson(
                `${api}/extended/v1/address/${principal}/stx`,
              );
            } catch (error) {
              results.accounts[principal] = { error: String(error) };
            }
          }

          const contracts = [
            'reserve-v1',
            'data-core-v3',
            'swap-ststx-ststxbtc-v2',
            'rewards-v5',
            'rewards-v7',
            'ststx-token',
            'ststxbtc-token',
            'ststxbtc-token-v2',
            'commission-v2',
            'commission-btc-v1',
            'staking-v0',
            'staking-v1',
          ];

          await call('dao', 'get-contracts-enabled');
          for (const name of contracts) {
            await call('dao', 'get-contract-active', [contractPrincipalCV(address, name)]);
          }

          await call('reserve-v1', 'get-total-stx');
          await call('reserve-v1', 'get-stx-balance');
          await call('reserve-v1', 'get-stx-stacking');
          await call('reserve-v1', 'get-stx-for-withdrawals');
          await call('ststx-token', 'get-total-supply');
          await call('ststxbtc-token', 'get-total-supply');
          await call('ststxbtc-token-v2', 'get-total-supply');
          await call('data-core-v3', 'get-stx-per-ststx', [contractPrincipalCV(address, 'reserve-v1')]);

          let currentCycle;
          for (const rewards of ['rewards-v5', 'rewards-v7']) {
            await call(rewards, 'get-rewards-interval-length');
            await call(rewards, 'get-ststx-commission-contract');
            await call(rewards, 'get-ststxbtc-commission-contract');
            await call(rewards, 'get-staking-contract-address');
            const cycleText = await call(rewards, 'get-pox-cycle');
            if (rewards === 'rewards-v7' && cycleText) {
              const match = cycleText.match(/u(\d+)/);
              if (match) currentCycle = Number(match[1]);
            }
          }

          if (Number.isSafeInteger(currentCycle)) {
            results.current_cycle = currentCycle;
            for (const rewards of ['rewards-v5', 'rewards-v7']) {
              for (let cycle = Math.max(0, currentCycle - 4); cycle <= currentCycle; cycle += 1) {
                await call(rewards, 'get-cycle-rewards-ststx', [uintCV(cycle)]);
                await call(rewards, 'get-cycle-rewards-ststxbtc', [uintCV(cycle)]);
                await call(rewards, 'should-process-rewards', [uintCV(cycle)]);
              }
            }
          }

          for (const name of ['reserve-v1', 'rewards-v5', 'rewards-v7']) {
            await account(`${address}.${name}`);
          }

          await writeFile('snapshot.json', `${JSON.stringify(results, null, 2)}\n`);
          const lines = [
            `captured_at=${results.captured_at}`,
            `current_cycle=${results.current_cycle ?? 'unknown'}`,
            ...Object.entries(results.calls).map(([key, value]) =>
              `${key} => ${value.decoded ?? value.error ?? JSON.stringify(value.raw)}`,
            ),
          ];
          await writeFile('snapshot.txt', `${lines.join('\n')}\n`);
          console.log(lines.join('\n'));
          NODE

          node query.mjs
          sha256sum snapshot.json snapshot.txt query.mjs > SHA256SUMS

      - name: Upload public state snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-public-state-${{ github.run_id }}
          path: |
            snapshot/snapshot.json
            snapshot/snapshot.txt
            snapshot/query.mjs
            snapshot/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
