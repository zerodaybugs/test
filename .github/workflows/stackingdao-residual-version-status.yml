name: StackingDAO residual version status gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-residual-version-status.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query DAO active flags read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import { contractPrincipalCV, cvToHex, cvToString, hexToCV } from '@stacks/transactions';
          import { writeFile } from 'node:fs/promises';

          const address = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const api = 'https://api.mainnet.hiro.so';
          const names = [
            'stacking-dao-core-v4',
            'stacking-dao-core-v5',
            'stacking-dao-core-v6',
            'stacking-dao-core-btc-v1',
            'stacking-dao-core-btc-v2',
            'stacking-dao-core-btc-v3',
            'swap-ststx-ststxbtc-v2',
            'reserve-v1',
            'data-core-v3',
            'ststx-token',
            'ststxbtc-token-v2',
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function post(fn, args = []) {
            const body = JSON.stringify({ sender: address, arguments: args.map(cvToHex) });
            let last;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(`${api}/v2/contracts/call-read/${address}/dao/${fn}`, {
                  method: 'POST', headers: { 'content-type': 'application/json' }, body,
                });
                const text = await response.text();
                if (!response.ok) throw new Error(`${response.status}: ${text}`);
                const json = JSON.parse(text);
                if (!json.result) throw new Error(text);
                return { decoded: cvToString(hexToCV(json.result)), raw: json };
              } catch (error) {
                last = error;
                if (attempt < 6) await sleep(attempt * 1200);
              }
            }
            throw last;
          }

          const enabled = await post('get-contracts-enabled');
          const rows = [];
          for (const name of names) {
            const result = await post('get-contract-active', [contractPrincipalCV(address, name)]);
            rows.push({ name, ...result });
            await sleep(200);
          }
          const output = { captured_at: new Date().toISOString(), address, enabled, rows };
          await writeFile('evidence/status.json', `${JSON.stringify(output, null, 2)}\n`);
          const lines = [
            `captured_at=${output.captured_at}`,
            `dao_enabled=${enabled.decoded}`,
            ...rows.map(row => `${row.name}=${row.decoded}`),
          ];
          await writeFile('evidence/status.txt', `${lines.join('\n')}\n`);
          console.log(lines.join('\n'));
          NODE
          node query.mjs
          sha256sum evidence/status.json evidence/status.txt query.mjs > evidence/SHA256SUMS

      - name: Upload focused status evidence
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-residual-status-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce read-only gate integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'dao_enabled=true' evidence/status.txt
          grep -E '^stacking-dao-core-v5=(true|false)$' evidence/status.txt
          grep -E '^stacking-dao-core-btc-v2=(true|false)$' evidence/status.txt
