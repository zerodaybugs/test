name: StackingDAO strategy nested reward event history

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-strategy-event-history.yml"

permissions:
  contents: read

concurrency:
  group: stackingdao-strategy-event-history-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query public transaction events read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd evidence

          cat > query.mjs <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const owner = 'SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG';
          const strategy = `${owner}.strategy-v4`;
          const handler = `${owner}.delegates-handler-v1`;
          const rewards2 = `${owner}.rewards-v2`;
          const api = 'https://api.mainnet.hiro.so';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchJson(url, options = {}, attempts = 8) {
            let last;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, options);
                const text = await response.text();
                if (!response.ok) {
                  const retryAfter = Number(response.headers.get('retry-after') ?? 0);
                  if ((response.status === 429 || response.status >= 500) && attempt < attempts) {
                    await sleep(Math.max(retryAfter * 1000, attempt * 1500));
                    continue;
                  }
                  throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 600)}`);
                }
                return JSON.parse(text);
              } catch (error) {
                last = error;
                if (attempt < attempts) await sleep(attempt * 1500);
              }
            }
            throw last;
          }

          async function fetchStrategyRows(maxRows = 160) {
            const rows = [];
            const limit = 50;
            let offset = 0;
            let total = Infinity;
            while (offset < total && rows.length < maxRows) {
              const page = await fetchJson(
                `${api}/extended/v2/addresses/${strategy}/transactions?limit=${limit}&offset=${offset}`,
              );
              const pageRows = page.results ?? [];
              rows.push(...pageRows);
              total = Number(page.total ?? rows.length);
              if (pageRows.length === 0) break;
              offset += pageRows.length;
              await sleep(250);
            }
            return rows;
          }

          function core(row) { return row.tx ?? row; }
          function topCall(row) { return core(row).contract_call ?? row.contract_call ?? null; }
          function txid(row) { return core(row).tx_id ?? row.tx_id ?? null; }
          function status(row) { return core(row).tx_status ?? row.tx_status ?? null; }
          function time(row) { const tx=core(row); return tx.burn_block_time_iso ?? tx.block_time_iso ?? null; }
          function height(row) { const tx=core(row); return tx.block_height ?? row.block_height ?? null; }

          const rows = await fetchStrategyRows();
          const candidates = rows.filter(row => {
            const c = topCall(row);
            return status(row) === 'success' && c?.contract_id === strategy && c?.function_name === 'perform-pool-delegation';
          }).slice(0, 130);

          const transactions = [];
          for (const [index, row] of candidates.entries()) {
            const id = txid(row);
            const detail = await fetchJson(`${api}/extended/v1/tx/${id}`);
            const logs = [];
            const transfers = [];
            for (const event of detail.events ?? []) {
              if (event.event_type === 'smart_contract_log') {
                const log = event.contract_log ?? event.smart_contract_log ?? {};
                const contractId = log.contract_id ?? null;
                const repr = log.value?.repr ?? null;
                if (
                  contractId === handler ||
                  contractId === rewards2 ||
                  String(contractId ?? '').includes('.stacking-delegate-')
                ) {
                  logs.push({ event_index: event.event_index, contract_id: contractId, topic: log.topic, repr });
                }
              }
              if (event.event_type === 'stx_asset') {
                const asset = event.asset ?? {};
                const sender = asset.sender ?? null;
                const recipient = asset.recipient ?? null;
                if (
                  String(sender ?? '').includes(owner) ||
                  String(recipient ?? '').includes(owner)
                ) {
                  transfers.push({ event_index: event.event_index, asset_event_type: event.asset_event_type, sender, recipient, amount: asset.amount });
                }
              }
            }
            transactions.push({
              tx_id: id,
              block_height: height(row),
              block_time_iso: time(row),
              sender_address: core(row).sender_address ?? null,
              args: topCall(row)?.function_args ?? [],
              logs,
              transfers,
            });
            if ((index + 1) % 10 === 0) console.log(`fetched=${index + 1}`);
            await sleep(220);
          }

          function uintValues(repr, field) {
            const re = new RegExp(`\\(${field} u(\\d+)\\)`, 'g');
            return [...String(repr ?? '').matchAll(re)].map(match => BigInt(match[1]));
          }

          const rewardEvents = [];
          const addEvents = [];
          for (const tx of transactions) {
            for (const log of tx.logs) {
              if (log.contract_id === handler && String(log.repr).includes('(rewards u')) {
                for (const amount of uintValues(log.repr, 'rewards')) {
                  rewardEvents.push({ tx_id: tx.tx_id, block_height: tx.block_height, block_time_iso: tx.block_time_iso, amount: amount.toString(), repr: log.repr });
                }
              }
              if (log.contract_id === rewards2 && String(log.repr).includes('(stx-amount u')) {
                for (const amount of uintValues(log.repr, 'stx-amount')) {
                  addEvents.push({ tx_id: tx.tx_id, block_height: tx.block_height, block_time_iso: tx.block_time_iso, amount: amount.toString(), repr: log.repr });
                }
              }
            }
          }

          const positiveRewards = rewardEvents.filter(event => BigInt(event.amount) > 0n);
          const positiveAdds = addEvents.filter(event => BigInt(event.amount) > 0n);
          const byBlock = {};
          for (const event of positiveRewards) {
            const key = String(event.block_height);
            byBlock[key] ??= { block_height: event.block_height, block_time_iso: event.block_time_iso, count: 0, total: 0n };
            byBlock[key].count += 1;
            byBlock[key].total += BigInt(event.amount);
          }
          const batches = Object.values(byBlock)
            .map(batch => ({ ...batch, total: batch.total.toString() }))
            .sort((a, b) => Number(b.block_height) - Number(a.block_height));

          const output = {
            captured_at: new Date().toISOString(),
            strategy,
            handler,
            rewards2,
            candidate_transactions: candidates.length,
            fetched_transactions: transactions.length,
            summary: {
              reward_events: rewardEvents.length,
              positive_reward_events: positiveRewards.length,
              positive_reward_total: positiveRewards.reduce((sum, event) => sum + BigInt(event.amount), 0n).toString(),
              rewards2_add_events: addEvents.length,
              positive_rewards2_add_events: positiveAdds.length,
              positive_rewards2_add_total: positiveAdds.reduce((sum, event) => sum + BigInt(event.amount), 0n).toString(),
              positive_batches: batches.length,
              latest_positive_batch: batches[0] ?? null,
            },
            positive_batches: batches,
            positive_reward_events: positiveRewards,
            positive_rewards2_add_events: positiveAdds,
            transactions,
          };

          await writeFile('events.json', `${JSON.stringify(output, null, 2)}\n`);
          const lines = [
            `captured_at=${output.captured_at}`,
            `candidate_transactions=${output.candidate_transactions}`,
            `fetched_transactions=${output.fetched_transactions}`,
            ...Object.entries(output.summary).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`),
            '',
            'POSITIVE BATCHES',
            ...batches.map(batch => `${batch.block_time_iso}\t${batch.block_height}\tcount=${batch.count}\ttotal=${batch.total}`),
            '',
            'LATEST POSITIVE EVENTS',
            ...positiveRewards.slice(0, 100).map(event => `${event.block_time_iso}\t${event.block_height}\t${event.amount}\t${event.tx_id}`),
          ];
          await writeFile('events.txt', `${lines.join('\n')}\n`);
          console.log(lines.join('\n'));
          NODE

          node query.mjs
          sha256sum events.json events.txt query.mjs > SHA256SUMS

      - name: Upload nested event evidence
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-strategy-event-history-${{ github.run_id }}
          path: |
            evidence/events.json
            evidence/events.txt
            evidence/query.mjs
            evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 3

      - name: Enforce event integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/events.json
          test -s evidence/events.txt
          (cd evidence && sha256sum -c SHA256SUMS)
          grep -F 'positive_reward_events=' evidence/events.txt
