name: StackingDAO current withdrawal flags
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/stackingdao-withdrawal-flags.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Query read-only flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence && cd evidence
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @stacks/transactions@6.17.0 >/dev/null 2>&1
          cat > query.mjs <<'NODE'
          import{cvToString,hexToCV}from'@stacks/transactions';import{writeFile}from'node:fs/promises';
          const O='SP4SZE494VC2YC5JYG7AYFQ44F5Q4PYV7DVMDPBG',A='https://api.mainnet.hiro.so';
          async function c(k,f){let r=await fetch(`${A}/v2/contracts/call-read/${O}/${k}/${f}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:[]})}),j=await r.json();if(!r.ok||!j.result)throw Error(JSON.stringify(j));return cvToString(hexToCV(j.result))}
          let x={captured_at:new Date().toISOString(),dao_enabled:await c('dao','get-contracts-enabled'),st_v6_shutdown_withdraw:await c('stacking-dao-core-v6','get-shutdown-withdraw'),btc_v3_shutdown_withdraw:await c('stacking-dao-core-btc-v3','get-shutdown-withdraw')};let t=Object.entries(x).map(([k,v])=>`${k}=${v}`).join('\n')+'\n';await writeFile('flags.json',JSON.stringify(x,null,2)+'\n');await writeFile('flags.txt',t);console.log(t)
          NODE
          node query.mjs
          sha256sum flags.json flags.txt query.mjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stackingdao-withdrawal-flags-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
      - run: (cd evidence && sha256sum -c SHA256SUMS)
