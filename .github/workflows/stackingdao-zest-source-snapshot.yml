name: StackingDAO Zest integration source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stackingdao-zest-source-snapshot.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch public deployed integration sources read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          api = "https://api.mainnet.hiro.so/v2/contracts/source"
          contracts = [
              ("SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7", "v0-vault-ststxbtc"),
              ("SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7", "v0-1-data"),
              ("SP2VCQJGH7PHP2DJK7Z0V48AGBHQAW3R3ZW1QF4N", "zststxbtc-v2-token"),
              ("SP2VCQJGH7PHP2DJK7Z0V48AGBHQAW3R3ZW1QF4N", "zststxbtc-v2_v2-0"),
          ]
          metadata = []
          for address, name in contracts:
              url = f"{api}/{address}/{name}?proof=0"
              last = None
              for attempt in range(1, 7):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          payload = json.load(response)
                      break
                  except Exception as exc:
                      last = exc
                      if attempt == 6:
                          raise
                      time.sleep(attempt * 2)
              source = payload.get("source")
              if not isinstance(source, str) or not source:
                  raise RuntimeError(f"missing source for {address}.{name}: {payload}")
              filename = f"{address}.{name}.clar"
              Path("source", filename).write_text(source + "\n", encoding="utf-8")
              metadata.append({
                  "contract_id": f"{address}.{name}",
                  "endpoint": url,
                  "publish_height": payload.get("publish_height"),
                  "clarity_version": payload.get("clarity_version"),
                  "filename": filename,
              })
          Path("source/metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          find source -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > source/SHA256SUMS

      - name: Upload public source evidence
        uses: actions/upload-artifact@v4
        with:
          name: stackingdao-zest-source-${{ github.run_id }}
          path: source/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce source integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s source/SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.v0-vault-ststxbtc.clar
          grep -F '(define-public (redeem' source/SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.v0-vault-ststxbtc.clar
          grep -F "ststxbtc-token-v2 transfer" source/SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.v0-vault-ststxbtc.clar
