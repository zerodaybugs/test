name: Public hBTC accounting timeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/stacks_accounting_timeline.py'
      - '.github/workflows/stacks-accounting-timeline.yml'
      - 'public-data/stacks-accounting-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout collector branch
        uses: actions/checkout@v4
        with:
          ref: stacks-public-history-20260724
          fetch-depth: 0

      - name: Produce accounting timeline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stacks_accounting_timeline.py
          sha256sum public-data/stacks-accounting-timeline.json > public-data/stacks-accounting-timeline.sha256

      - name: Commit public timeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/stacks-accounting-timeline.json public-data/stacks-accounting-timeline.sha256
          if git diff --cached --quiet; then
            echo 'No accounting timeline changes.'
            exit 0
          fi
          git commit -m 'chore: capture public hBTC accounting timeline [skip ci]'
          git push origin HEAD:stacks-public-history-20260724
