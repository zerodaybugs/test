name: Public Stacks history collector

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/stacks_contract_history.py'
      - 'scripts/stacks_contract_key_findings.py'
      - 'scripts/stacks_contract_decision_summary.py'
      - 'scripts/stacks_selected_tx_events.py'
      - 'public-data/stacks-history-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout collector branch
        uses: actions/checkout@v4
        with:
          ref: stacks-public-history-20260724
          fetch-depth: 0

      - name: Collect public Stacks history
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stacks_contract_history.py
          python3 scripts/stacks_contract_key_findings.py
          python3 scripts/stacks_contract_decision_summary.py
          python3 scripts/stacks_selected_tx_events.py

      - name: Record checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' \
              public-data/stacks-contract-history.json \
              public-data/stacks-contract-history-summary.json \
              public-data/stacks-contract-key-findings.json \
              public-data/stacks-contract-decision-summary.json
            find public-data/selected-transactions -maxdepth 1 -type f -name '*.json' -print | LC_ALL=C sort
          } | xargs sha256sum > public-data/stacks-contract-history.sha256

      - name: Commit public data to collector branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public-data/stacks-contract-history.json \
            public-data/stacks-contract-history-summary.json \
            public-data/stacks-contract-key-findings.json \
            public-data/stacks-contract-decision-summary.json \
            public-data/selected-transactions \
            public-data/stacks-contract-history.sha256
          if git diff --cached --quiet; then
            echo 'No public data changes.'
            exit 0
          fi
          git commit -m 'chore: capture public Stacks contract history [skip ci]'
          git push origin HEAD:stacks-public-history-20260724
