name: Selected public Stacks evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/stacks_selected_tx_events.py'
      - 'scripts/stacks_config_summary.py'
      - 'public-data/stacks-history-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout collector branch
        uses: actions/checkout@v4
        with:
          ref: stacks-public-history-20260724
          fetch-depth: 0

      - name: Produce selected evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stacks_selected_tx_events.py
          python3 scripts/stacks_config_summary.py

      - name: Record checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            find public-data/selected-transactions -maxdepth 1 -type f -name '*.json' -print | LC_ALL=C sort
            printf '%s\n' public-data/stacks-state-config-summary.json
          } | xargs sha256sum > public-data/selected-evidence.sha256

      - name: Commit selected evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public-data/selected-transactions \
            public-data/stacks-state-config-summary.json \
            public-data/selected-evidence.sha256
          if git diff --cached --quiet; then
            echo 'No selected evidence changes.'
            exit 0
          fi
          git commit -m 'chore: capture selected public Stacks evidence [skip ci]'
          git push origin HEAD:stacks-public-history-20260724
