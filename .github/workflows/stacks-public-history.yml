name: Public Stacks history collector

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/stacks_contract_history.py'
      - 'public-data/stacks-history-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout collector branch
        uses: actions/checkout@v4
        with:
          ref: stacks-public-history-20260724
          fetch-depth: 0

      - name: Collect public Stacks history
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stacks_contract_history.py

      - name: Record checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum public-data/stacks-contract-history.json > public-data/stacks-contract-history.sha256

      - name: Commit public data to collector branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/stacks-contract-history.json public-data/stacks-contract-history.sha256
          if git diff --cached --quiet; then
            echo 'No public data changes.'
            exit 0
          fi
          git commit -m 'chore: capture public Stacks contract history [skip ci]'
          git push origin HEAD:stacks-public-history-20260724
