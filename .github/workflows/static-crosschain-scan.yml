name: static-crosschain-scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone public source and scan configuration invariants
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Veda-Labs/boring-vault.git target
          cd target
          python3 - <<'PY'
          import json, pathlib, subprocess

          root = pathlib.Path('.')
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          rows=[]
          errors=[]

          candidates=[]
          for pattern in (
              'deployments/skeletons/configurations/**/*.json',
              'deployments/configurations/**/*.json',
          ):
              candidates.extend(root.glob(pattern))

          def pick_kind(kind):
              if not isinstance(kind, dict): return []
              return sorted([k for k,v in kind.items() if v is True])

          def resolve_address_file(cfg, path):
              p=(cfg.get('deploymentParameters') or {}).get('deploymentFileName')
              if not p: return None, {}
              pp=pathlib.Path(p)
              options=[root/'deployments'/pp, root/pp]
              for op in options:
                  if op.exists():
                      try:
                          d=json.loads(op.read_text())
                          return str(op), (d.get('contractAddresses') or {})
                      except Exception: pass
              return p, {}

          for path in sorted(set(candidates)):
              try:
                  cfg=json.loads(path.read_text())
              except Exception as exc:
                  errors.append({'path':str(path),'error':repr(exc)})
                  continue
              dep=cfg.get('deploymentParameters') or {}
              bv=cfg.get('boringVaultConfiguration') or {}
              tc=cfg.get('tellerConfiguration') or {}
              tp=tc.get('tellerParameters') or {}
              kind=pick_kind(tp.get('kind') or {})
              address_file, addresses=resolve_address_file(cfg,path)
              lz=tp.get('layerZero') or {}
              ccip=tp.get('ccip') or {}
              lzchains=lz.get('lzChains') or tp.get('lzChains') or []
              ccipchains=ccip.get('ccipChains') or tp.get('ccipChains') or []
              cross=any(k in kind for k in ('tellerWithLayerZero','tellerWithLayerZeroRateLimiting','tellerWithCcip'))
              if not cross and not lzchains and not ccipchains:
                  continue
              row={
                  'path':str(path),
                  'chain':dep.get('chainName'),
                  'name':bv.get('boringVaultName'),
                  'symbol':bv.get('boringVaultSymbol'),
                  'decimals':bv.get('boringVaultDecimals'),
                  'teller_kinds':kind,
                  'allow_public_deposits':tp.get('allowPublicDeposits'),
                  'share_lock_period':tp.get('shareLockPeriod'),
                  'lz_chains':lzchains,
                  'ccip_chains':ccipchains,
                  'address_file':address_file,
                  'vault_address':addresses.get('BoringVault'),
                  'teller_addresses':{k:v for k,v in addresses.items() if 'Teller' in k},
                  'accountant_addresses':{k:v for k,v in addresses.items() if 'Accountant' in k},
              }
              rows.append(row)

          groups={}
          for r in rows:
              key=r.get('symbol') or r.get('name') or r.get('path')
              groups.setdefault(key,[]).append(r)

          mismatches=[]
          for key,items in groups.items():
              decimals=sorted({i.get('decimals') for i in items if i.get('decimals') is not None})
              if len(decimals)>1:
                  mismatches.append({'group':key,'decimals':decimals,'items':items})

          peer_edges=[]
          for r in rows:
              for x in r.get('lz_chains') or []:
                  peer_edges.append({'protocol':'lz','source_path':r['path'],'source_chain':r['chain'],'source_symbol':r['symbol'],'source_decimals':r['decimals'],'peer':x})
              for x in r.get('ccip_chains') or []:
                  peer_edges.append({'protocol':'ccip','source_path':r['path'],'source_chain':r['chain'],'source_symbol':r['symbol'],'source_decimals':r['decimals'],'peer':x})

          out={
              'head':head,
              'cross_chain_config_count':len(rows),
              'rows':rows,
              'groups':groups,
              'decimal_mismatches':mismatches,
              'peer_edges':peer_edges,
              'parse_errors':errors,
          }
          text=json.dumps(out,indent=2,sort_keys=True)
          pathlib.Path('../static-crosschain-scan.json').write_text(text+'\n')
          print('SCAN_SUMMARY',json.dumps({
              'head':head,'rows':len(rows),'groups':len(groups),
              'decimal_mismatches':len(mismatches),'peer_edges':len(peer_edges),
              'parse_errors':len(errors)
          },sort_keys=True))
          for m in mismatches:
              print('DECIMAL_MISMATCH',json.dumps({'group':m['group'],'decimals':m['decimals']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: static-crosschain-scan
          path: static-crosschain-scan.json
          retention-days: 1
