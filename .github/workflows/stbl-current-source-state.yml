name: STBL current source and state inventory

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/stbl-current-source-state.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install pinned read-only tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work evidence
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund ethers@6.15.0 >/dev/null

      - name: Capture current in-scope deployment, source and accounting state
        shell: bash
        run: |
          set -euo pipefail
          cd work
          cat > inventory.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {
            Contract,
            Interface,
            JsonRpcProvider,
            ZeroAddress,
            getAddress,
            id,
            keccak256,
            toBeHex,
          } from 'ethers';

          const OUT = path.resolve('../evidence');
          const SOURCE = path.join(OUT, 'verified_source');
          fs.mkdirSync(SOURCE, { recursive: true });

          const targets = [
            {chain:'ethereum', address:'0xb3116013c55d49f575ace3cb0d123f3dbf6cac35'},
            {chain:'bsc',      address:'0x8dedf84656fa932157e27c060d8613824e7979e3'},
            {chain:'ethereum', address:'0xf9d82660828d8f5d121b14a9dc9c677d91f60065'},
            {chain:'ethereum', address:'0xd33c37a90155be8fcab769e38a563e74bfd70e0b'},
            {chain:'ethereum', address:'0xa58b634c10df2665a3de1680675d5bb9065847d2'},
            {chain:'ethereum', address:'0x3c316bcf47c991ba09622d4c2f40f786ab4f46db'},
            {chain:'ethereum', address:'0xa0e2b352118f9983f3a75ddc9abd996983c93764'},
            {chain:'ethereum', address:'0xd238e964b557bd8f39feba8c2c93d6f428007232'},
            {chain:'ethereum', address:'0x97fb98a7a7400bc651dec6a02640a36f8bdfaa0b'},
            {chain:'ethereum', address:'0x916442ebaa1cef4b3f5cd9b7a62170b50c3305c1'},
            {chain:'ethereum', address:'0x5766b5d21bea4de3dda1b935f1740d194babab1f'},
            {chain:'ethereum', address:'0xcc14f2eddeae2a3c450c7afe328fd7331355dd73'},
            {chain:'ethereum', address:'0xf8acf255854c8d36010c849f1702eb350c8c4087'},
            {chain:'ethereum', address:'0x64bef4478942d8fd62be281707076442aa2d055e'},
            {chain:'ethereum', address:'0x447a8f3608fb2002c1aa8e44b076b7d62b6fa618'},
            {chain:'ethereum', address:'0xbac1f4f20847669ba12841a534b2aa053d65373c'},
            {chain:'ethereum', address:'0x0437ee84ca723ceb7052a8cc73360e21427c42ea'},
            {chain:'ethereum', address:'0x50eda4294d9a57b35a9d836faaeb88d1c4fab6c9'},
            {chain:'bsc',      address:'0x1171ce10262a60c17507580a3b70b956f20a35de'},
          ].map((row) => ({...row, address:getAddress(row.address)}));

          const endpoints = {
            ethereum: [
              'https://ethereum-rpc.publicnode.com',
              'https://eth.llamarpc.com',
              'https://1rpc.io/eth',
            ],
            bsc: [
              'https://bsc-rpc.publicnode.com',
              'https://bsc.drpc.org',
              'https://1rpc.io/bnb',
            ],
          };
          const blockscout = {
            ethereum:'https://eth.blockscout.com',
            bsc:'https://bsc.blockscout.com',
          };

          const IMPLEMENTATION_SLOT = '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc';
          const ADMIN_SLOT = '0xb53127684a568b3173ae13b9f8a6016e01988f79166d0d6a717850b5d6103';
          const BEACON_SLOT = '0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50';

          const commonFragments = [
            'function version() view returns (uint256)',
            'function trustedForwarder() view returns (address)',
            'function fetchCounter() view returns (uint256)',
            'function fetchCore() view returns (address)',
            'function fetchYLDToken() view returns (address)',
            'function fetchUSSTToken() view returns (address)',
            'function fetchTreasury() view returns (address)',
            'function fetchDeposits(uint256) view returns (uint256)',
            'function assetID() view returns (uint256)',
            'function registry() view returns (address)',
            'function previousDistribution() view returns (uint256)',
            'function totalSupply() view returns (uint256)',
            'function nftCtr() view returns (uint256)',
            'function paused() view returns (bool)',
            'function symbol() view returns (string)',
            'function name() view returns (string)',
            'function decimals() view returns (uint8)',
            'function fetchPrice() view returns (uint256)',
            'function getPriceDecimals() view returns (uint256)',
            'function VaultData() view returns (uint256 depositFees,uint256 withdrawFees,uint256 insuranceFees,uint256 yieldFees,uint256 cumilativeHairCutValue,uint256 depositValueUSD,uint256 assetDepositGross,uint256 assetDepositNet)',
            'function balanceOf(address) view returns (uint256)',
          ];
          const commonIface = new Interface(commonFragments);
          const assetIface = new Interface([
            'function fetchAssetData(uint256) view returns ((uint256 id,string name,string description,uint8 contractType,bool isAggreagated,uint8 status,uint256 cut,uint256 limit,address token,address issuer,address rewardDistributor,address oracle,address vault,uint256 depositFees,uint256 withdrawFees,uint256 yieldFees,uint256 insuranceFees,uint256 duration,uint256 yieldDuration,bytes additionalBuffer))',
            'function fetchDeposits(uint256) view returns (uint256)',
          ]);

          const replacer = (_key, value) => typeof value === 'bigint' ? value.toString() : value;
          const writeJson = (name, value) => fs.writeFileSync(path.join(OUT, name), JSON.stringify(value, replacer, 2) + '\n');
          const sha256 = (data) => crypto.createHash('sha256').update(data).digest('hex');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const cleanName = (value) => String(value).replace(/[^A-Za-z0-9_.-]+/g, '_').slice(0, 100);
          const slotAddress = (word) => {
            if (!word || /^0x0+$/.test(word)) return null;
            return getAddress('0x' + word.slice(-40));
          };

          async function selectProvider(chain) {
            const attempts=[];
            for (const endpoint of endpoints[chain]) {
              const provider = new JsonRpcProvider(endpoint, undefined, {staticNetwork:false});
              try {
                const [block, network] = await Promise.all([provider.getBlockNumber(), provider.getNetwork()]);
                attempts.push({endpoint,ok:true,block,chainId:network.chainId.toString()});
                return {provider,endpoint,block,chainId:network.chainId.toString(),attempts};
              } catch (error) {
                attempts.push({endpoint,ok:false,error:`${error.name}: ${error.message}`});
              }
            }
            throw new Error(`${chain}: no RPC endpoint succeeded: ${JSON.stringify(attempts)}`);
          }

          async function safeCall(provider, address, fragment, args=[]) {
            try {
              const fn = commonIface.getFunction(fragment);
              const data = commonIface.encodeFunctionData(fn, args);
              const raw = await provider.call({to:address,data});
              const decoded = commonIface.decodeFunctionResult(fn, raw);
              if (decoded.length === 1) return {ok:true,value:decoded[0]};
              return {ok:true,value:Array.from(decoded)};
            } catch (error) {
              return {ok:false,error:`${error.name}: ${error.shortMessage ?? error.message}`};
            }
          }

          async function fetchExplorer(chain, address) {
            const url = `${blockscout[chain]}/api/v2/smart-contracts/${address}`;
            try {
              const response = await fetch(url, {headers:{'user-agent':'ZeroDayBugs-STBL-Inventory/1.0'}});
              const text = await response.text();
              if (!response.ok) return {ok:false,url,status:response.status,body:text.slice(0,500)};
              const parsed = JSON.parse(text);
              const dir = path.join(SOURCE, chain);
              fs.mkdirSync(dir,{recursive:true});
              fs.writeFileSync(path.join(dir,`${address}.blockscout.json`), JSON.stringify(parsed,null,2)+'\n');
              if (typeof parsed.source_code === 'string' && parsed.source_code.length) {
                fs.writeFileSync(path.join(dir,`${address}.${cleanName(parsed.name ?? 'contract')}.sol`), parsed.source_code);
              }
              if (parsed.abi) fs.writeFileSync(path.join(dir,`${address}.abi.json`), JSON.stringify(parsed.abi,null,2)+'\n');
              return {
                ok:true,url,
                name:parsed.name ?? null,
                compilerVersion:parsed.compiler_version ?? null,
                optimizationEnabled:parsed.optimization_enabled ?? null,
                proxyType:parsed.proxy_type ?? null,
                implementations:parsed.implementations ?? null,
                sourceBytes:typeof parsed.source_code === 'string' ? Buffer.byteLength(parsed.source_code) : 0,
              };
            } catch (error) {
              return {ok:false,url,error:`${error.name}: ${error.message}`};
            }
          }

          async function inspectAddress(chainCtx, row, kind='target') {
            const {provider,block} = chainCtx;
            const address = getAddress(row.address);
            const [code, implWord, adminWord, beaconWord] = await Promise.all([
              provider.getCode(address, block),
              provider.getStorage(address, IMPLEMENTATION_SLOT, block),
              provider.getStorage(address, ADMIN_SLOT, block),
              provider.getStorage(address, BEACON_SLOT, block),
            ]);
            const implementation = slotAddress(implWord);
            const admin = slotAddress(adminWord);
            const beacon = slotAddress(beaconWord);
            const calls={};
            for (const fragment of [
              'version','trustedForwarder','fetchCounter','fetchCore','fetchYLDToken','fetchUSSTToken','fetchTreasury',
              'assetID','registry','previousDistribution','totalSupply','nftCtr','paused','symbol','name','decimals',
              'fetchPrice','getPriceDecimals','VaultData',
            ]) calls[fragment] = await safeCall(provider,address,fragment,[]);
            const explorer = await fetchExplorer(row.chain,address);
            return {
              kind,chain:row.chain,address,block,
              codeBytes:(code.length-2)/2,
              codeKeccak256:code === '0x' ? null : keccak256(code),
              implementation,admin,beacon,calls,explorer,
            };
          }

          async function callAssetData(provider, registry, index) {
            try {
              const data=assetIface.encodeFunctionData('fetchAssetData',[index]);
              const raw=await provider.call({to:registry,data});
              const [a]=assetIface.decodeFunctionResult('fetchAssetData',raw);
              const keys=['id','name','description','contractType','isAggreagated','status','cut','limit','token','issuer','rewardDistributor','oracle','vault','depositFees','withdrawFees','yieldFees','insuranceFees','duration','yieldDuration','additionalBuffer'];
              return {ok:true,value:Object.fromEntries(keys.map((k,i)=>[k,a[i]]))};
            } catch (error) {
              return {ok:false,error:`${error.name}: ${error.shortMessage ?? error.message}`};
            }
          }

          async function main() {
            const chainContexts={};
            for (const chain of Object.keys(endpoints)) chainContexts[chain]=await selectProvider(chain);
            writeJson('RPC_CONTEXT.json',Object.fromEntries(Object.entries(chainContexts).map(([k,v])=>[k,{endpoint:v.endpoint,block:v.block,chainId:v.chainId,attempts:v.attempts}])));

            const inspected=[];
            const implementationSet=new Map();
            for (const row of targets) {
              const result=await inspectAddress(chainContexts[row.chain],row,'target');
              inspected.push(result);
              if (result.implementation) implementationSet.set(`${row.chain}:${result.implementation}`,{chain:row.chain,address:result.implementation,parent:row.address});
            }
            for (const implRow of implementationSet.values()) {
              const result=await inspectAddress(chainContexts[implRow.chain],implRow,'implementation');
              result.parent=implRow.parent;
              inspected.push(result);
            }
            writeJson('DEPLOYMENT_INVENTORY.json',inspected);

            const eth=chainContexts.ethereum;
            const registryCandidates=inspected.filter((x)=>x.chain==='ethereum'&&x.kind==='target'&&x.calls.fetchCounter?.ok&&BigInt(x.calls.fetchCounter.value)>0n&&BigInt(x.calls.fetchCounter.value)<100n);
            const assets=[];
            for (const candidate of registryCandidates) {
              const count=Number(candidate.calls.fetchCounter.value);
              for (let i=1;i<=count;i++) {
                const decoded=await callAssetData(eth.provider,candidate.address,i);
                if (!decoded.ok) { assets.push({registry:candidate.address,index:i,error:decoded.error}); continue; }
                const value=decoded.value;
                const deposits=await safeCall(eth.provider,candidate.address,'fetchDeposits',[i]);
                const componentCalls={};
                for (const [label,address] of [['token',value.token],['issuer',value.issuer],['rewardDistributor',value.rewardDistributor],['oracle',value.oracle],['vault',value.vault]]) {
                  componentCalls[label]={};
                  for (const fragment of ['symbol','name','decimals','totalSupply','assetID','registry','trustedForwarder','fetchPrice','getPriceDecimals','VaultData','previousDistribution']) {
                    componentCalls[label][fragment]=await safeCall(eth.provider,address,fragment,[]);
                  }
                }
                const balances={};
                for (const holderLabel of ['vault','rewardDistributor']) {
                  balances[holderLabel]=await safeCall(eth.provider,value.token,'balanceOf',[value[holderLabel]]);
                }
                if (candidate.calls.fetchTreasury?.ok) balances.treasury=await safeCall(eth.provider,value.token,'balanceOf',[candidate.calls.fetchTreasury.value]);
                assets.push({registry:candidate.address,index:i,asset:value,deposits,componentCalls,balances});
              }
            }
            writeJson('ASSET_STATE.json',assets);

            const findings=[];
            for (const item of inspected.filter((x)=>x.kind==='target')) {
              if (item.calls.trustedForwarder?.ok && item.calls.trustedForwarder.value !== ZeroAddress) findings.push({type:'NONZERO_TRUSTED_FORWARDER',chain:item.chain,address:item.address,value:item.calls.trustedForwarder.value});
              if (item.codeBytes===0) findings.push({type:'NO_CODE',chain:item.chain,address:item.address});
            }
            for (const row of assets.filter((x)=>x.asset)) {
              const a=row.asset;
              const sum=BigInt(a.depositFees)+BigInt(a.withdrawFees)+BigInt(a.insuranceFees)+BigInt(a.cut);
              if (BigInt(a.yieldDuration)>BigInt(a.duration)) findings.push({type:'INVALID_DURATION',asset:a.id,name:a.name});
              if (sum>1000000000n) findings.push({type:'INVALID_FEE_SUM',asset:a.id,name:a.name,sum});
              if ([a.token,a.issuer,a.rewardDistributor,a.oracle,a.vault].some((x)=>x===ZeroAddress)) findings.push({type:'ZERO_COMPONENT',asset:a.id,name:a.name});
              for (const label of ['issuer','rewardDistributor','oracle','vault']) {
                const idCall=row.componentCalls[label]?.assetID;
                if (idCall?.ok && BigInt(idCall.value)!==BigInt(a.id)) findings.push({type:'ASSET_ID_DRIFT',asset:a.id,name:a.name,component:label,componentAssetID:idCall.value});
                const regCall=row.componentCalls[label]?.registry;
                if (regCall?.ok && getAddress(regCall.value)!==getAddress(row.registry)) findings.push({type:'REGISTRY_DRIFT',asset:a.id,name:a.name,component:label,componentRegistry:regCall.value});
              }
            }

            const sourceManifest=[];
            for (const file of fs.readdirSync(SOURCE,{recursive:true})) {
              const full=path.join(SOURCE,file);
              if (!fs.statSync(full).isFile()) continue;
              const data=fs.readFileSync(full);
              sourceManifest.push({file,bytes:data.length,sha256:sha256(data)});
            }
            writeJson('SOURCE_MANIFEST.json',sourceManifest);
            writeJson('DERIVED_FINDINGS.json',findings);
            writeJson('FINAL_GATE.json',{
              status:'PASS_READ_ONLY_STBL_CURRENT_INVENTORY',
              targets:targets.length,
              implementations:implementationSet.size,
              registryCandidates:registryCandidates.map((x)=>x.address),
              decodedAssets:assets.filter((x)=>x.asset).length,
              derivedFindings:findings.length,
              publicChainTransactions:0,
            });
            console.log(JSON.stringify({status:'PASS_READ_ONLY_STBL_CURRENT_INVENTORY',targets:targets.length,implementations:implementationSet.size,registryCandidates:registryCandidates.map((x)=>x.address),decodedAssets:assets.filter((x)=>x.asset).length,derivedFindings:findings.length,publicChainTransactions:0},null,2));
          }

          main().catch((error)=>{console.error(error.stack||error);process.exit(1);});
          NODE
          node inventory.mjs

      - name: Package immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('evidence')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='MANIFEST.json'):
              data=p.read_bytes()
              rows.append({'file':str(p.relative_to(root)),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          PY
          tar -czf stbl-current-source-state.tar.gz evidence
          sha256sum stbl-current-source-state.tar.gz > evidence/ARCHIVE_SHA256.txt

      - name: Upload one-day read-only STBL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stbl-current-source-state-${{ github.run_id }}
          path: |
            evidence
            stbl-current-source-state.tar.gz
          if-no-files-found: error
          retention-days: 1
