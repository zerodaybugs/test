name: STBL current deployment and role map

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/stbl/current_state_map.mjs'
      - '.github/workflows/stbl-current-state-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install pinned read-only EVM client
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm config set registry https://registry.npmjs.org/
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund ethers@6.15.0 >/dev/null

      - name: Apply deterministic tuple-decoding and EIP-1967 corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('research/stbl/current_state_map.mjs')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              "const ADMIN_SLOT_CANONICAL = '0xb53127684a568b3173ae13b9f8a6016e019a6a0f3a13e0a4f0f8f9a5f9e8d6a';",
              "const ADMIN_SLOT_CANONICAL = '0xb53127684a568b3173ae13b9f8a6016e019a6a0f3a13e0a3210667c82849298';",
          )

          old = """      const d = definition.value;
      const token = new Contract(d.token, COMMON_ABI, ethProvider);
      const oracle = new Contract(d.oracle, ORACLE_ABI, ethProvider);
      row.token = {
        address: d.token,
        codeHash: keccak256(await ethProvider.getCode(d.token)),
        name: await tryCall(token, 'name'),
        symbol: await tryCall(token, 'symbol'),
        decimals: await tryCall(token, 'decimals'),
        vaultBalance: await tryCall(token, 'balanceOf', [d.vault]),
        distributorBalance: await tryCall(token, 'balanceOf', [d.rewardDistributor]),
      };
      row.oracle = { address: d.oracle, codeHash: keccak256(await ethProvider.getCode(d.oracle)) };
      for (const method of ['fetchPrice', 'fetchPriceDecimals', 'getPriceDecimals', 'priceDecimals', 'fetchPriceThreshold', 'getPriceThreshold', 'priceThreshold', 'isOracleEnabled', 'isEnabled', 'enabled', 'latestAnswer', 'latestRoundData', 'decimals', 'description']) {
        row.oracle[method] = await tryCall(oracle, method);
      }
"""
          new = """      const v = definition.value;
      const d = {
        id: v[0], name: v[1], description: v[2], contractType: v[3],
        isAggregated: v[4], status: v[5], cut: v[6], limit: v[7],
        token: v[8], issuer: v[9], rewardDistributor: v[10], oracle: v[11], vault: v[12],
        depositFees: v[13], withdrawFees: v[14], yieldFees: v[15], insuranceFees: v[16],
        duration: v[17], yieldDuration: v[18], additionalBuffer: v[19],
      };
      row.definitionDecoded = d;
      if (d.token && d.token !== ZeroAddress) {
        const token = new Contract(d.token, COMMON_ABI, ethProvider);
        const tokenCode = await ethProvider.getCode(d.token);
        row.token = {
          address: d.token,
          codeHash: tokenCode === '0x' ? null : keccak256(tokenCode),
          name: await tryCall(token, 'name'),
          symbol: await tryCall(token, 'symbol'),
          decimals: await tryCall(token, 'decimals'),
          vaultBalance: d.vault && d.vault !== ZeroAddress ? await tryCall(token, 'balanceOf', [d.vault]) : { ok: false, error: 'zero vault' },
          distributorBalance: d.rewardDistributor && d.rewardDistributor !== ZeroAddress ? await tryCall(token, 'balanceOf', [d.rewardDistributor]) : { ok: false, error: 'zero distributor' },
        };
      }
      if (d.oracle && d.oracle !== ZeroAddress) {
        const oracleCode = await ethProvider.getCode(d.oracle);
        const oracle = new Contract(d.oracle, ORACLE_ABI, ethProvider);
        row.oracle = { address: d.oracle, codeHash: oracleCode === '0x' ? null : keccak256(oracleCode) };
        for (const method of ['fetchPrice', 'fetchPriceDecimals', 'getPriceDecimals', 'priceDecimals', 'fetchPriceThreshold', 'getPriceThreshold', 'priceThreshold', 'isOracleEnabled', 'isEnabled', 'enabled', 'latestAnswer', 'latestRoundData', 'decimals', 'description']) {
          row.oracle[method] = await tryCall(oracle, method);
        }
      } else {
        row.oracle = { address: d.oracle ?? null, skipped: 'zero or missing oracle' };
      }
"""
          if old not in source:
              raise SystemExit('asset tuple patch anchor not found')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
          node --check research/stbl/current_state_map.mjs

      - name: Capture current STBL state without sending transactions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence-stbl-state
          node research/stbl/current_state_map.mjs

      - name: Upload immutable STBL state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stbl-current-state-map-${{ github.run_id }}
          path: evidence-stbl-state
          if-no-files-found: error
          retention-days: 1
