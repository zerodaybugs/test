name: Sui address-balance accounting source export 20260808

on:
  push:
    branches:
      - research/sui-vm-bounty-20260808
    paths:
      - '.github/workflows/sui-address-balance-source-export-20260808.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sui-address-balance-source-export-20260808.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUI_COMMIT: 5a9f37431c473fa2f6d49abecbcc6a6d7190f533

jobs:
  source-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Clone exact public Sui source
        shell: bash
        run: |
          set -euo pipefail
          git init sui
          git -C sui remote add origin https://github.com/MystenLabs/sui.git
          git -C sui fetch --depth=1 origin "${SUI_COMMIT}"
          git -C sui checkout --detach FETCH_HEAD
          test "$(git -C sui rev-parse HEAD)" = "${SUI_COMMIT}"
          git -C sui rev-parse HEAD | tee SUI_SOURCE_COMMIT.txt

      - name: Export exact accounting and test corpus
        shell: bash
        run: |
          set -euo pipefail
          cd sui
          tar --zstd -cf ../sui-address-balance-accounting-source-20260808.tar.zst \
            Cargo.toml Cargo.lock rust-toolchain.toml \
            crates/test-cluster/src/addr_balance_test_env.rs \
            crates/test-cluster/src/lib.rs \
            crates/sui-e2e-tests/Cargo.toml \
            crates/sui-e2e-tests/tests/address_balance_tests.rs \
            crates/sui-e2e-tests/tests/address_balance_compatibility_tests.rs \
            crates/sui-e2e-tests/tests/data/coins \
            crates/sui-types/src/coin_reservation.rs \
            crates/sui-types/src/transaction.rs \
            crates/sui-types/src/unit_tests/address_balance_gas_tests.rs \
            crates/sui-types/src/unit_tests/balance_withdraw_tests.rs \
            crates/sui-test-transaction-builder \
            crates/sui-adapter-transactional-tests/tests/address_balances \
            crates/sui-adapter-transactional-tests/tests/gasless \
            crates/sui-core/src/accumulators \
            sui-execution/latest/sui-adapter/src/execution_engine.rs \
            sui-execution/latest/sui-adapter/src/gas_charger.rs \
            sui-execution/latest/sui-adapter/src/temporary_store.rs \
            sui-execution/latest/sui-adapter/src/temporary_store/invariants.rs \
            sui-execution/latest/sui-adapter/src/static_programmable_transactions/execution/context.rs \
            sui-execution/latest/sui-move-natives/src/funds_accumulator.rs \
            sui-execution/latest/sui-move-natives/src/accumulator.rs \
            crates/sui-types/src/accumulator_event.rs \
            crates/sui-types/src/accumulator_root.rs \
            crates/sui-types/src/balance.rs \
            crates/sui-types/src/gas.rs \
            crates/sui-types/src/gas_coin.rs \
            crates/sui-types/src/inner_temporary_store.rs
          cd ..
          sha256sum sui-address-balance-accounting-source-20260808.tar.zst \
            > sui-address-balance-accounting-source-20260808.tar.zst.sha256
          du -h sui-address-balance-accounting-source-20260808.tar.zst

      - name: Upload exact source corpus
        uses: actions/upload-artifact@v4
        with:
          name: sui-address-balance-accounting-source-20260808
          path: |
            SUI_SOURCE_COMMIT.txt
            sui-address-balance-accounting-source-20260808.tar.zst
            sui-address-balance-accounting-source-20260808.tar.zst.sha256
          retention-days: 2
