name: Sui Bridge security source export 20260808

on:
  push:
    branches:
      - research/sui-vm-bounty-20260808
    paths:
      - '.github/workflows/sui-bridge-security-source-export-20260808.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sui-bridge-security-source-export-20260808.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUI_COMMIT: 5a9f37431c473fa2f6d49abecbcc6a6d7190f533

jobs:
  source-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Clone exact public Sui source
        shell: bash
        run: |
          set -euo pipefail
          git init sui
          git -C sui remote add origin https://github.com/MystenLabs/sui.git
          git -C sui fetch --depth=1 origin "${SUI_COMMIT}"
          git -C sui checkout --detach FETCH_HEAD
          test "$(git -C sui rev-parse HEAD)" = "${SUI_COMMIT}"
          git -C sui rev-parse HEAD | tee SUI_SOURCE_COMMIT.txt

      - name: Export exact bridge corpus
        shell: bash
        run: |
          set -euo pipefail
          cd sui
          tar --zstd -cf ../sui-bridge-security-source-20260808.tar.zst \
            Cargo.toml Cargo.lock rust-toolchain.toml \
            crates/sui-bridge \
            crates/sui-framework/packages/bridge \
            crates/sui-framework/packages/sui-framework/sources/bridge \
            crates/sui-framework/packages/sui-framework/sources/committee.move \
            crates/sui-framework/packages/sui-framework/sources/crypto \
            crates/sui-bridge-indexer \
            crates/sui-bridge-indexer-alt \
            crates/sui-types/src/bridge.rs \
            crates/sui-types/src/crypto.rs \
            crates/sui-types/src/digests.rs \
            crates/sui-types/src/event.rs \
            crates/sui-types/src/transaction.rs \
            crates/sui-types/src/message_envelope.rs \
            crates/sui-protocol-config/src/lib.rs
          cd ..
          sha256sum sui-bridge-security-source-20260808.tar.zst \
            > sui-bridge-security-source-20260808.tar.zst.sha256
          du -h sui-bridge-security-source-20260808.tar.zst

      - name: Upload exact source corpus
        uses: actions/upload-artifact@v4
        with:
          name: sui-bridge-security-source-20260808
          path: |
            SUI_SOURCE_COMMIT.txt
            sui-bridge-security-source-20260808.tar.zst
            sui-bridge-security-source-20260808.tar.zst.sha256
          retention-days: 2
