name: Sui VM publication validation mutator 20260808

on:
  push:
    branches:
      - research/sui-vm-bounty-20260808
    paths:
      - '.github/workflows/sui-vm-validation-mutator-20260808.yml'
      - 'research/sui_vm_validation_mutator.rs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sui-vm-validation-mutator-20260808.yml'
      - 'research/sui_vm_validation_mutator.rs'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUI_COMMIT: 5a9f37431c473fa2f6d49abecbcc6a6d7190f533
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  deterministic-release-mutator:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Clone exact public Sui source
        shell: bash
        run: |
          set -euo pipefail
          git init sui
          git -C sui remote add origin https://github.com/MystenLabs/sui.git
          git -C sui fetch --depth=1 origin "${SUI_COMMIT}"
          git -C sui checkout --detach FETCH_HEAD
          test "$(git -C sui rev-parse HEAD)" = "${SUI_COMMIT}"
          git -C sui rev-parse HEAD | tee SUI_SOURCE_COMMIT.txt

      - name: Construct isolated exact-source harness crate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vm-mutator/src mutation-results
          cp research/sui_vm_validation_mutator.rs vm-mutator/src/main.rs
          cat > vm-mutator/Cargo.toml <<'TOML'
          [package]
          name = "zdb-sui-vm-validation-mutator"
          version = "0.1.0"
          edition = "2024"
          publish = false

          [dependencies]
          move-binary-format = { path = "../sui/external-crates/move/crates/move-binary-format" }
          move-bytecode-verifier = { path = "../sui/external-crates/move/crates/move-bytecode-verifier" }
          move-core-types = { path = "../sui/external-crates/move/crates/move-core-types" }
          move-vm-config = { path = "../sui/external-crates/move/crates/move-vm-config" }
          move-vm-runtime = { path = "../sui/external-crates/move/crates/move-vm-runtime" }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          TOML
          sha256sum research/sui_vm_validation_mutator.rs vm-mutator/src/main.rs \
            > mutation-results/HARNESS_SHA256.txt

      - name: Compile and execute release-mode mutation sweep
        shell: bash
        run: |
          set +e
          cd sui
          MALLOC_CHECK_=3 \
          timeout 4800 cargo run --release \
            --manifest-path ../vm-mutator/Cargo.toml -- \
            --out ../mutation-results \
            --random-cases 75000 \
            --seed 0x5a1720260808cafe \
            2>&1 | tee ../mutation-results/VALIDATION_MUTATOR_RUN.log
          rc=${PIPESTATUS[0]}
          echo "${rc}" > ../mutation-results/VALIDATION_MUTATOR_RUN.exit_code
          exit 0

      - name: Apply fail-closed candidate gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('mutation-results')
          result_path = root / 'VALIDATION_MUTATOR_RESULT.json'
          if not result_path.exists():
              payload = {
                  'gate': 'INFRA_FAILURE_NO_RESULT',
                  'run_exit_code': int((root / 'VALIDATION_MUTATOR_RUN.exit_code').read_text().strip()) if (root / 'VALIDATION_MUTATOR_RUN.exit_code').exists() else None,
              }
          else:
              result = json.loads(result_path.read_text())
              baseline_ok = bool(result.get('corpus')) and all(
                  item.get('baseline_deserializes')
                  and item.get('baseline_verifies')
                  and item.get('baseline_runtime_accepts')
                  for item in result['corpus']
              )
              candidates = result.get('candidates') or []
              payload = {
                  'gate': (
                      'CANDIDATE_REQUIRES_EXACT_SUI_PUBLICATION_REPLAY'
                      if candidates
                      else ('PASS_NO_CANDIDATE' if baseline_ok else 'INFRA_BASELINE_FAILURE')
                  ),
                  'baseline_ok': baseline_ok,
                  'candidate_count': len(candidates),
                  'candidate_classes': sorted({c['outcome']['class'] for c in candidates}),
                  'counters': result.get('counters'),
                  'random_seed': result.get('random_seed'),
                  'requested_random_cases': result.get('requested_random_cases'),
                  'run_exit_code': int((root / 'VALIDATION_MUTATOR_RUN.exit_code').read_text().strip()),
              }
          (root / 'RELEASE_GATE.json').write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY
          find mutation-results -type f -print0 | sort -z | xargs -0 sha256sum \
            > mutation-results/EVIDENCE_SHA256SUMS.txt

      - name: Upload exact mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sui-vm-publication-validation-mutator-20260808
          path: |
            SUI_SOURCE_COMMIT.txt
            vm-mutator/Cargo.toml
            mutation-results/
          retention-days: 2
