name: Sui new VM variant gates 20260808

on:
  push:
    branches:
      - research/sui-vm-bounty-20260808
    paths:
      - '.github/workflows/sui-vm-variant-gates-20260808.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sui-vm-variant-gates-20260808.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUI_COMMIT: 5a9f37431c473fa2f6d49abecbcc6a6d7190f533
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  exact-unit-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Clone exact public Sui source
        shell: bash
        run: |
          set -euo pipefail
          git init sui
          git -C sui remote add origin https://github.com/MystenLabs/sui.git
          git -C sui fetch --depth=1 origin "${SUI_COMMIT}"
          git -C sui checkout --detach FETCH_HEAD
          test "$(git -C sui rev-parse HEAD)" = "${SUI_COMMIT}"
          git -C sui rev-parse HEAD | tee SUI_SOURCE_COMMIT.txt
          mkdir -p variant-results

      - name: Run exact latest Move runtime argument tests
        shell: bash
        run: |
          set +e
          cd sui
          timeout 3000 cargo test \
            --manifest-path external-crates/move/crates/move-vm-runtime/Cargo.toml \
            --lib function_arg_tests -- --nocapture \
            2>&1 | tee ../variant-results/MOVE_VM_FUNCTION_ARG_TESTS.log
          rc=${PIPESTATUS[0]}
          echo "${rc}" > ../variant-results/MOVE_VM_FUNCTION_ARG_TESTS.exit_code
          exit 0

      - name: Run exact latest Move runtime package-cache tests
        shell: bash
        run: |
          set +e
          cd sui
          timeout 3000 cargo test \
            --manifest-path external-crates/move/crates/move-vm-runtime/Cargo.toml \
            --lib package_cache_tests -- --nocapture \
            2>&1 | tee ../variant-results/MOVE_VM_PACKAGE_CACHE_TESTS.log
          rc=${PIPESTATUS[0]}
          echo "${rc}" > ../variant-results/MOVE_VM_PACKAGE_CACHE_TESTS.exit_code
          exit 0

      - name: Run exact latest Move runtime entry-point tests
        shell: bash
        run: |
          set +e
          cd sui
          timeout 2400 cargo test \
            --manifest-path external-crates/move/crates/move-vm-runtime/Cargo.toml \
            --lib bad_entry_point_tests -- --nocapture \
            2>&1 | tee ../variant-results/MOVE_VM_BAD_ENTRY_POINT_TESTS.log
          rc=${PIPESTATUS[0]}
          echo "${rc}" > ../variant-results/MOVE_VM_BAD_ENTRY_POINT_TESTS.exit_code
          exit 0

      - name: Compile exact latest bytecode verifier tests
        shell: bash
        run: |
          set +e
          cd sui
          timeout 2400 cargo test \
            --manifest-path external-crates/move/crates/move-bytecode-verifier/Cargo.toml \
            --lib --no-run \
            2>&1 | tee ../variant-results/MOVE_BYTECODE_VERIFIER_BUILD.log
          rc=${PIPESTATUS[0]}
          echo "${rc}" > ../variant-results/MOVE_BYTECODE_VERIFIER_BUILD.exit_code
          exit 0

      - name: Compile exact latest Sui verifier and adapter tests
        shell: bash
        run: |
          set +e
          cd sui
          timeout 2400 cargo test -p sui-verifier-latest --lib --no-run \
            2>&1 | tee ../variant-results/SUI_VERIFIER_LATEST_BUILD.log
          rc1=${PIPESTATUS[0]}
          echo "${rc1}" > ../variant-results/SUI_VERIFIER_LATEST_BUILD.exit_code
          timeout 2400 cargo test -p sui-adapter-latest --lib --no-run \
            2>&1 | tee ../variant-results/SUI_ADAPTER_LATEST_BUILD.log
          rc2=${PIPESTATUS[0]}
          echo "${rc2}" > ../variant-results/SUI_ADAPTER_LATEST_BUILD.exit_code
          exit 0

      - name: Summarize exact variant gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('variant-results')
          gates = {}
          for path in sorted(root.glob('*.exit_code')):
              try:
                  code = int(path.read_text().strip())
              except Exception:
                  code = None
              name = path.name.removesuffix('.exit_code')
              gates[name] = {'exit_code': code, 'pass': code == 0}
          payload = {
              'source_commit': Path('SUI_SOURCE_COMMIT.txt').read_text().strip(),
              'gates': gates,
              'all_pass': bool(gates) and all(item['pass'] for item in gates.values()),
          }
          (root / 'VARIANT_GATES.json').write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY
          find variant-results -type f -print0 | sort -z | xargs -0 sha256sum \
            > variant-results/EVIDENCE_SHA256SUMS.txt

      - name: Upload exact variant-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sui-new-vm-exact-variant-gates-20260808
          path: |
            SUI_SOURCE_COMMIT.txt
            variant-results/
          retention-days: 2

  source-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Clone exact public Sui source
        shell: bash
        run: |
          set -euo pipefail
          git init sui
          git -C sui remote add origin https://github.com/MystenLabs/sui.git
          git -C sui fetch --depth=1 origin "${SUI_COMMIT}"
          git -C sui checkout --detach FETCH_HEAD
          test "$(git -C sui rev-parse HEAD)" = "${SUI_COMMIT}"
          git -C sui rev-parse HEAD | tee SUI_SOURCE_COMMIT.txt

      - name: Export security-relevant source corpus
        shell: bash
        run: |
          set -euo pipefail
          cd sui
          tar --zstd -cf ../sui-new-vm-security-source-20260808.tar.zst \
            Cargo.toml Cargo.lock rust-toolchain.toml \
            external-crates/move/crates/move-vm-runtime \
            external-crates/move/crates/move-bytecode-verifier \
            external-crates/move/crates/move-binary-format \
            external-crates/move/crates/move-core-types \
            external-crates/move/crates/move-vm-config \
            external-crates/move/crates/move-vm-types \
            external-crates/move/move-execution/v3/crates/move-vm-runtime \
            external-crates/move/move-execution/v3/crates/move-bytecode-verifier \
            sui-execution/latest/sui-adapter \
            sui-execution/latest/sui-verifier \
            sui-execution/latest/sui-move-natives \
            sui-execution/v3/sui-adapter \
            sui-execution/v3/sui-verifier \
            sui-execution/v3/sui-move-natives \
            crates/sui-adapter-transactional-tests \
            crates/sui-types/src/move_package.rs \
            crates/sui-types/src/object.rs \
            crates/sui-types/src/transaction.rs \
            crates/sui-types/src/execution_status.rs \
            crates/sui-protocol-config/src/lib.rs
          cd ..
          sha256sum sui-new-vm-security-source-20260808.tar.zst \
            > sui-new-vm-security-source-20260808.tar.zst.sha256
          du -h sui-new-vm-security-source-20260808.tar.zst

      - name: Upload exact source corpus
        uses: actions/upload-artifact@v4
        with:
          name: sui-new-vm-security-source-20260808
          path: |
            SUI_SOURCE_COMMIT.txt
            sui-new-vm-security-source-20260808.tar.zst
            sui-new-vm-security-source-20260808.tar.zst.sha256
          retention-days: 2
