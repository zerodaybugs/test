name: Superhuman allowed-auth metadata exact isolated-vm gate

on:
  push:
    branches: [research/superhuman-allowed-auth-e2e-20260809]
    paths: [.github/workflows/superhuman-allowed-auth-metadata-ivm-e2e.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Install exact stable SDK and native isolate runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf allowed-auth-ivm
          mkdir -p allowed-auth-ivm/evidence public-intake-status
          cd allowed-auth-ivm
          npm init -y >/dev/null
          npm install --no-audit --no-fund @codahq/packs-sdk@1.17.1
          node - <<'NODE'
          const sdk = require('./node_modules/@codahq/packs-sdk/package.json');
          if (sdk.version !== '1.17.1') throw new Error(`wrong SDK ${sdk.version}`);
          const ivm = require('isolated-vm');
          console.log(JSON.stringify({sdk:sdk.version, isolatedVm:require('isolated-vm/package.json').version, isolateType:typeof ivm.Isolate}));
          NODE

      - name: Run canonical bootstrap, thunk and host-fetcher gate
        shell: bash
        run: |
          set -euo pipefail
          cd allowed-auth-ivm
          cat > pack-bundle.js <<'PACK'
          const DEFAULT = 'defaultUserAuthentication';
          const restrictedFormula = {
            name: 'RestrictedAction',
            description: 'Restricted to default user authentication',
            parameters: [{
              name: 'target',
              type: 'string',
              description: 'Synthetic target',
              autocomplete: {
                execute: async (_params, context) => {
                  const response = await context.fetcher.fetch({method:'GET', url: globalThis.__LAB_BASE_URL + '/autocomplete'});
                  return [{display: response.body.sentinel, value: response.body.sentinel}];
                },
              },
            }],
            resultType: 'string',
            connectionRequirement: 'required',
            allowedAuthenticationNames: [DEFAULT],
            execute: async (_params, context) => {
              const response = await context.fetcher.fetch({method:'GET', url: globalThis.__LAB_BASE_URL + '/standard'});
              return response.body.sentinel;
            },
            validateParameters: {
              execute: async (_params, context) => {
                const response = await context.fetcher.fetch({method:'GET', url: globalThis.__LAB_BASE_URL + '/validate'});
                return {isValid:true, message:response.body.sentinel};
              },
            },
          };
          const restrictedSyncGetter = {
            name: 'RestrictedSync',
            description: 'Restricted sync getter',
            parameters: [],
            connectionRequirement: 'required',
            allowedAuthenticationNames: [DEFAULT],
            execute: async () => ({result:[]}),
          };
          module.exports = {pack: {
            defaultAuthentication: {type:'HeaderBearerToken'},
            systemConnectionAuthentication: {type:'HeaderBearerToken'},
            adminAuthentications: [{
              name:'LabAdmin', displayName:'Lab Admin', description:'Synthetic admin auth', isServiceAccount:true,
              authentication:{type:'HeaderBearerToken', canSyncPermissions:true},
            }],
            formulas:[restrictedFormula],
            syncTables:[{
              name:'RestrictedDynamicSyncTable', isDynamic:true, getter:restrictedSyncGetter,
              listDynamicUrls:{execute:async(_params,context)=>{
                const response=await context.fetcher.fetch({method:'GET',url:globalThis.__LAB_BASE_URL+'/dynamic-urls'});
                return [{display:response.body.sentinel,value:response.body.sentinel}];
              }},
              searchDynamicUrls:{execute:async()=>[]},
              getDisplayUrl:{execute:async()=> 'https://synthetic.invalid/'},
              getName:{execute:async()=> 'Synthetic'},
              getSchema:{execute:async()=>({type:'object',id:'id',primary:'name',properties:{id:{type:'string'},name:{type:'string'}}})},
              namedPropertyOptions:{sensitiveOptions:{execute:async(_params,context)=>{
                const response=await context.fetcher.fetch({method:'GET',url:globalThis.__LAB_BASE_URL+'/property-options'});
                return [{display:response.body.sentinel,value:response.body.sentinel}];
              }}},
            }],
          }};
          PACK
          cat > pack-bundle.js.map <<'MAP'
          {"version":3,"file":"pack-bundle.js","sources":["pack-source.js"],"names":[],"mappings":""}
          MAP
          cat > gate.js <<'NODE'
          'use strict';
          const assert = require('assert');
          const crypto = require('crypto');
          const fs = require('fs');
          const http = require('http');
          const path = require('path');

          const sdkRoot = path.dirname(require.resolve('@codahq/packs-sdk/package.json'));
          const bootstrap = require(path.join(sdkRoot, 'dist/runtime/bootstrap/index.js'));
          const {AuthenticatingFetcher} = require(path.join(sdkRoot, 'dist/testing/fetcher.js'));
          const thunkPath = bootstrap.getThunkPath();
          const packPath = path.resolve('pack-bundle.js');
          const mapPath = path.resolve('pack-bundle.js.map');

          const DEFAULT='defaultUserAuthentication', SYSTEM='systemAuthentication', ADMIN='LabAdmin';
          const TOKENS={
            [DEFAULT]:'LAB_DEFAULT_BEARER_20260809',
            [SYSTEM]:'LAB_SYSTEM_BEARER_20260809',
            [ADMIN]:'LAB_ADMIN_BEARER_20260809',
          };
          const SENTINELS={
            [DEFAULT]:'LAB_DEFAULT_PRIVATE_DATA_20260809',
            [SYSTEM]:'LAB_SYSTEM_PRIVATE_DATA_20260809',
            [ADMIN]:'LAB_ADMIN_PRIVATE_DATA_20260809',
          };
          const captured=[];
          let server;

          function listen(s){return new Promise((ok,no)=>{s.once('error',no);s.listen(0,'127.0.0.1',()=>ok(s.address().port));});}
          function close(s){return new Promise(ok=>s.close(()=>ok()));}
          function principalFor(value){for(const [name,token] of Object.entries(TOKENS)){if(value===`Bearer ${token}`)return name;}return 'unknown';}
          const logger={trace(){},debug(){},info(){},warn(){},error(){}};
          const blob={async storeUrl(){throw new Error('not used')},async storeBlob(){throw new Error('not used')}};

          async function makeRuntime(principal, baseUrl, port){
            const isolate=bootstrap.createIsolate({memoryLimit:64});
            const context=await bootstrap.createIsolateContext(isolate);
            await bootstrap.registerBundles(isolate,context,packPath,thunkPath,true);
            await context.global.set('__LAB_BASE_URL',baseUrl,{copy:true});
            const fetcher=new AuthenticatingFetcher(()=>{}, {type:'HeaderBearerToken'}, [`127.0.0.1:${port}`], {token:TOKENS[principal]}, `LAB_INV_${principal}`);
            await bootstrap.injectExecutionContext({
              context,fetcher,temporaryBlobStorage:blob,syncStateService:undefined,logger,
              endpoint:undefined,invocationLocation:{protocolAndHost:'https://coda.io'},timezone:'UTC',
              invocationToken:`LAB_INV_${principal}`,sync:undefined,authenticationName:principal,
              executionId:`LAB_EXEC_${principal}`,previousAttemptError:undefined,
            });
            return {isolate,context};
          }
          async function invoke(runtime,spec){
            return bootstrap.executeThunk(runtime.context,{params:[],formulaSpec:spec},packPath,mapPath);
          }
          async function blockedStandard(runtime,principal){
            const before=captured.length;let error;
            try{await invoke(runtime,{type:'Standard',formulaName:'RestrictedAction'});}catch(e){error=e;}
            assert(error,`standard unexpectedly succeeded for ${principal}`);
            assert.match(error.message,/not allowed for connection with authentication/);
            assert.equal(captured.length,before,'blocked standard reached server');
            return error.message;
          }
          async function metadata(runtime,principal){
            const expected=SENTINELS[principal];
            const standardError=await blockedStandard(runtime,principal);
            const start=captured.length;
            const autocomplete=await invoke(runtime,{type:'Metadata',metadataFormulaType:'ParameterAutocomplete',parentFormulaName:'RestrictedAction',parentFormulaType:'Standard',parameterName:'target'});
            const validation=await invoke(runtime,{type:'Metadata',metadataFormulaType:'ValidateParameters',parentFormulaName:'RestrictedAction',parentFormulaType:'Standard'});
            const dynamicUrls=await invoke(runtime,{type:'Metadata',metadataFormulaType:'SyncListDynamicUrls',syncTableName:'RestrictedDynamicSyncTable'});
            const propertyOptions=await invoke(runtime,{type:'Metadata',metadataFormulaType:'PropertyOptions',syncTableName:'RestrictedDynamicSyncTable',optionsFormulaKey:'sensitiveOptions',propertyName:'name',propertyValues:{},propertySchema:{type:'string'},search:'lab'});
            assert.equal(autocomplete[0].value,expected);
            assert.equal(validation.message,expected);
            assert.equal(dynamicUrls[0].value,expected);
            assert.equal(propertyOptions.packResult.results[0].value,expected);
            const requests=captured.slice(start);
            assert.equal(requests.length,4);
            assert(requests.every(r=>r.principal===principal));
            return {standardError,autocomplete,validation,dynamicUrls,propertyOptions,requests};
          }

          async function main(){
            server=http.createServer((req,res)=>{
              const authorization=req.headers.authorization||'';
              const principal=principalFor(authorization);
              captured.push({method:req.method,url:req.url,authorization,principal});
              res.writeHead(200,{'content-type':'application/json'});
              res.end(JSON.stringify({principal,sentinel:SENTINELS[principal]||'UNKNOWN'}));
            });
            const port=await listen(server);const baseUrl=`http://127.0.0.1:${port}`;
            const def=await makeRuntime(DEFAULT,baseUrl,port);
            const sys=await makeRuntime(SYSTEM,baseUrl,port);
            const adm=await makeRuntime(ADMIN,baseUrl,port);
            const defaultResult=await invoke(def,{type:'Standard',formulaName:'RestrictedAction'});
            assert.equal(defaultResult,SENTINELS[DEFAULT]);
            const system=await metadata(sys,SYSTEM);
            const admin=await metadata(adm,ADMIN);
            const result={
              pass:true,sdkVersion:require(path.join(sdkRoot,'package.json')).version,
              isolatedVmVersion:require('isolated-vm/package.json').version,nodeVersion:process.version,
              thunkBundleSha256:crypto.createHash('sha256').update(fs.readFileSync(thunkPath)).digest('hex'),
              packBundleSha256:crypto.createHash('sha256').update(fs.readFileSync(packPath)).digest('hex'),
              canonicalPath:'runtime/bootstrap.createIsolateContext -> registerBundles(thunk,pack) -> injectExecutionContext -> executeThunk -> coda.findAndExecutePackFunction',
              positiveControl:{defaultStandardResult:defaultResult},
              disallowedPrincipals:{systemAuthentication:system,LabAdmin:admin},
              capturedRequestCount:captured.length,captured,syntheticOnly:true,productionRequestCount:0,
            };
            fs.writeFileSync('evidence/RESULT.json',JSON.stringify(result,null,2)+'\n');
            def.isolate.dispose();sys.isolate.dispose();adm.isolate.dispose();
          }
          main().then(async()=>{await close(server);console.log(fs.readFileSync('evidence/RESULT.json','utf8'));}).catch(async e=>{try{if(server)await close(server)}catch(_){};console.error(e&&e.stack||e);process.exit(1);});
          NODE
          node gate.js | tee evidence/TEST_OUTPUT.txt
          jq -e '.pass == true and .capturedRequestCount == 9 and .isolatedVmVersion == "6.0.2"' evidence/RESULT.json >/dev/null
          sha256sum gate.js pack-bundle.js pack-bundle.js.map package.json package-lock.json node_modules/@codahq/packs-sdk/bundles/thunk_bundle.js evidence/RESULT.json evidence/TEST_OUTPUT.txt > evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-allowed-auth-metadata-exact-ivm-e2e
          path: allowed-auth-ivm/evidence/
          retention-days: 1
          if-no-files-found: error

      - name: Commit compact result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          jq '{pass,sdkVersion,isolatedVmVersion,nodeVersion,thunkBundleSha256,packBundleSha256,canonicalPath,positiveControl,capturedRequestCount,syntheticOnly,productionRequestCount,disallowedPrincipals:{systemAuthentication:{standardError:.disallowedPrincipals.systemAuthentication.standardError,requestCount:(.disallowedPrincipals.systemAuthentication.requests|length)},LabAdmin:{standardError:.disallowedPrincipals.LabAdmin.standardError,requestCount:(.disallowedPrincipals.LabAdmin.requests|length)}}}' allowed-auth-ivm/evidence/RESULT.json > public-intake-status/superhuman-allowed-auth-metadata-exact-ivm-e2e.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-allowed-auth-metadata-exact-ivm-e2e.json
          git commit -m 'chore: record exact isolated-vm allowed-auth gate'
          git push
