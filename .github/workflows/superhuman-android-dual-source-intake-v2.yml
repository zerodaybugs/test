name: Superhuman Android dual-source provenance intake v2

on:
  push:
    branches: [research/superhuman-android-intake-20260810]
    paths: [.github/workflows/superhuman-android-dual-source-intake-v2.yml]

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-intake-v2
          mkdir -p android-intake-v2/raw android-intake-v2/downloads android-intake-v2/extracted android-intake-v2/evidence public-intake-status
          npm install --no-save google-play-scraper@10.1.2
          python -m pip install --disable-pip-version-check --quiet beautifulsoup4 requests

      - name: Capture current Google Play metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const mod = require('google-play-scraper');
          const gplay = mod.default || mod;
          (async () => {
            const app = await gplay.app({appId:'com.superhuman.mail', country:'us', lang:'en'});
            const out = {
              appId: app.appId,
              title: app.title,
              developer: app.developer,
              developerId: app.developerId,
              version: app.version,
              updated: app.updated,
              released: app.released,
              url: app.url,
              installs: app.installs,
              minInstalls: app.minInstalls,
              maxInstalls: app.maxInstalls,
              score: app.score,
              androidVersion: app.androidVersion,
              androidVersionText: app.androidVersionText,
              contentRating: app.contentRating,
              privacyPolicy: app.privacyPolicy,
            };
            fs.writeFileSync('android-intake-v2/evidence/GOOGLE_PLAY_METADATA.json', JSON.stringify(out,null,2)+'\n');
          })().catch(e => {
            fs.writeFileSync('android-intake-v2/evidence/GOOGLE_PLAY_METADATA_ERROR.txt', String(e && e.stack || e)+'\n');
          });
          NODE

      - name: Scrape APKCombo and APKPure public download surfaces
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json, pathlib, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          root=pathlib.Path('android-intake-v2'); raw=root/'raw'; downloads=root/'downloads'; ev=root/'evidence'
          session=requests.Session()
          session.headers.update({'User-Agent':'curl/8.0.1','Accept':'*/*','Connection':'keep-alive'})
          results={'sources':{},'candidateUrls':[]}

          def save(name,r):
              (raw/f'{name}.body').write_bytes(r.content)
              (raw/f'{name}.headers.json').write_text(json.dumps(dict(r.headers),indent=2)+'\n')
              return {'status':r.status_code,'url':r.url,'size':len(r.content),'contentType':r.headers.get('content-type')}

          combo_base=None
          for i,url in enumerate([
              'https://apkcombo.com/superhuman-mail/com.superhuman.mail/',
              'https://apkcombo.com/superhuman/com.superhuman.mail/',
          ]):
              try:
                  r=session.get(url,timeout=45,allow_redirects=True)
                  results['sources'][f'apkcombo_page_{i}']=save(f'apkcombo-page-{i}',r)
                  if r.status_code==200 and 'com.superhuman.mail' in r.text:
                      combo_base=r.url.rstrip('/'); break
              except Exception as e:
                  results['sources'][f'apkcombo_page_{i}']={'error':repr(e)}

          if combo_base:
              try:
                  r=session.get(combo_base+'/download/apk',timeout=45,allow_redirects=True)
                  results['sources']['apkcombo_download']=save('apkcombo-download',r)
                  if r.status_code==200:
                      soup=BeautifulSoup(r.text,'html.parser')
                      for li in soup.select('#variants-tab > div > ul > li'):
                          code=li.select_one('code')
                          arch=code.get_text(' ',strip=True) if code else 'unknown'
                          for a in li.select('a[href]'):
                              href=a.get('href')
                              if not href: continue
                              parsed=urllib.parse.urlparse(href); q=urllib.parse.parse_qs(parsed.query)
                              if parsed.path=='/r2' and q.get('u'): href=q['u'][0]
                              elif href.startswith('/'): href=urllib.parse.urljoin(combo_base+'/',href)
                              if urllib.parse.urlparse(href).path.lower().endswith(('.apk','.xapk','.apks','.zip')):
                                  results['candidateUrls'].append({'source':'apkcombo','arch':arch,'url':href}); break
              except Exception as e:
                  results['sources']['apkcombo_download']={'error':repr(e)}

          pure_endpoints=[
              ('apkpure_apk','https://d.apkpure.com/b/APK/com.superhuman.mail?version=latest','.apk'),
              ('apkpure_xapk','https://d.apkpure.com/b/XAPK/com.superhuman.mail?version=latest','.xapk'),
          ]
          for name,url,suffix in pure_endpoints:
              try:
                  r=session.get(url,timeout=90,allow_redirects=True)
                  results['sources'][name]=save(name.replace('_','-'),r)
                  if r.status_code==200 and len(r.content)>100000:
                      dest=downloads/f'{name}{suffix}'; dest.write_bytes(r.content)
                      results['candidateUrls'].append({'source':'apkpure','arch':'latest','url':r.url,'local':str(dest)})
              except Exception as e:
                  results['sources'][name]={'error':repr(e)}

          seen=set(); n=0
          for row in list(results['candidateUrls']):
              if row['source']!='apkcombo' or row['url'] in seen or n>=8: continue
              seen.add(row['url']); n+=1
              try:
                  r=session.get(row['url'],timeout=120,allow_redirects=True)
                  row.update(downloadStatus=r.status_code,downloadSize=len(r.content),finalUrl=r.url)
                  if r.status_code==200 and len(r.content)>100000:
                      ext=pathlib.Path(urllib.parse.urlparse(r.url).path).suffix.lower()
                      if ext not in {'.apk','.xapk','.apks','.zip'}: ext='.apk'
                      safe=re.sub(r'[^A-Za-z0-9_.-]+','_',row['arch'])[:80]
                      dest=downloads/f'apkcombo_{n:02d}_{safe}{ext}'; dest.write_bytes(r.content); row['local']=str(dest)
              except Exception as e:
                  row['downloadError']=repr(e)

          (ev/'DOWNLOAD_INDEX.json').write_text(json.dumps(results,indent=2)+'\n')
          PY

      - name: Extract containers and inspect APK signatures
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"; APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"; test -x "$APKSIGNER"

          python <<'PY'
          import os, pathlib, zipfile
          root=pathlib.Path('android-intake-v2')
          for p in list((root/'downloads').iterdir()):
              if not p.is_file() or p.suffix.lower() not in {'.xapk','.apks','.zip'}: continue
              out=root/'extracted'/p.stem; out.mkdir(parents=True,exist_ok=True)
              try:
                  with zipfile.ZipFile(p) as z:
                      for info in z.infolist():
                          target=(out/info.filename).resolve()
                          if not str(target).startswith(str(out.resolve())+os.sep): continue
                          z.extract(info,out)
              except zipfile.BadZipFile:
                  pass
          PY

          : > android-intake-v2/evidence/APK_SHA256SUMS.txt
          find android-intake-v2/downloads android-intake-v2/extracted -type f -name '*.apk' -print0 | sort -z | while IFS= read -r -d '' apk; do
            safe="$(printf '%s' "$apk" | sed 's#[^A-Za-z0-9_.-]#_#g')"
            "$AAPT" dump badging "$apk" > "android-intake-v2/evidence/${safe}.badging.txt" 2>&1 || true
            if "$APKSIGNER" verify --verbose --print-certs "$apk" > "android-intake-v2/evidence/${safe}.apksigner.txt" 2>&1; then
              touch "android-intake-v2/evidence/${safe}.verify.ok"
            fi
            sha256sum "$apk" >> android-intake-v2/evidence/APK_SHA256SUMS.txt
          done

          python <<'PY'
          import json, pathlib, re
          ev=pathlib.Path('android-intake-v2/evidence')
          rows=[]
          for badging in sorted(ev.glob('*.badging.txt')):
              text=badging.read_text(errors='replace')
              m=re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']*)'",text)
              key=badging.name[:-len('.badging.txt')]
              sigfile=ev/f'{key}.apksigner.txt'; sig=sigfile.read_text(errors='replace') if sigfile.exists() else ''
              sha256=re.search(r"Signer #1 certificate SHA-256 digest: ([0-9a-fA-F:]+)",sig)
              sha1=re.search(r"Signer #1 certificate SHA-1 digest: ([0-9a-fA-F:]+)",sig)
              rows.append({
                  'artifactKey':key,
                  'packageName':m.group(1) if m else None,
                  'versionCode':m.group(2) if m else None,
                  'versionName':m.group(3) if m else None,
                  'certSha256':sha256.group(1).lower().replace(':','') if sha256 else None,
                  'certSha1':sha1.group(1).lower().replace(':','') if sha1 else None,
                  'signatureVerified':(ev/f'{key}.verify.ok').exists(),
              })
          target=[r for r in rows if r['packageName']=='com.superhuman.mail' and r['signatureVerified']]
          groups={}
          for r in target:
              key=(r['versionCode'],r['certSha256']); groups.setdefault(str(key),[]).append(r['artifactKey'])
          matching=[{'key':k,'artifacts':v} for k,v in groups.items() if len(v)>=2 and 'None' not in k]
          independent=[]
          for g in matching:
              names=g['artifacts']
              if any('apkcombo' in n for n in names) and any('apkpure' in n for n in names): independent.append(g)
          result={
              'package':'com.superhuman.mail','inspectedApkCount':len(rows),'validTargetApkCount':len(target),
              'rows':rows,'matchingVersionAndCertificateGroups':matching,
              'independentMatchingGroups':independent,
              'dualSourceProvenancePass':bool(independent),
              'decision':'DUAL_SOURCE_PROVENANCE_PASS' if independent else 'NO_DUAL_SOURCE_MATCH',
          }
          (ev/'APK_PROVENANCE_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

          find android-intake-v2/evidence -type f -print0 | sort -z | xargs -0 sha256sum > android-intake-v2/evidence/EVIDENCE_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superhuman-android-dual-source-intake-v2
          path: |
            android-intake-v2/downloads/
            android-intake-v2/extracted/
            android-intake-v2/evidence/
          retention-days: 1
          if-no-files-found: warn

      - name: Commit compact intake status
        shell: bash
        run: |
          set -euo pipefail
          cp android-intake-v2/evidence/APK_PROVENANCE_RESULT.json public-intake-status/superhuman-android-provenance-result-v2.json
          test ! -f android-intake-v2/evidence/GOOGLE_PLAY_METADATA.json || cp android-intake-v2/evidence/GOOGLE_PLAY_METADATA.json public-intake-status/superhuman-android-play-metadata-v2.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-android-provenance-result-v2.json
          test ! -f public-intake-status/superhuman-android-play-metadata-v2.json || git add public-intake-status/superhuman-android-play-metadata-v2.json
          git commit -m 'chore: record Superhuman Android provenance intake v2'
          git push
