name: Temporary Superhuman CRX intake

on:
  push:
    branches:
      - research/superhuman-crx-intake-20260808
    paths:
      - .github/workflows/superhuman-crx-intake-20260808.yml

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download current CRX from Google update service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crx-intake/extracted
          URL='https://clients2.google.com/service/update2/crx?response=redirect&prod=chromium&prodversion=144.0.7559.96&acceptformat=crx3&x=id%3Ddcgcnpooblobhncpnddnhoendgbnglpn%26installsource%3Dondemand%26uc'
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0 Chrome/144.0.7559.96' \
            "$URL" -o crx-intake/superhuman-mail-current.crx
          test "$(head -c 4 crx-intake/superhuman-mail-current.crx)" = 'Cr24'

      - name: Parse CRX3 and extract source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, struct, hashlib
          root = pathlib.Path('crx-intake')
          crx = root / 'superhuman-mail-current.crx'
          data = crx.read_bytes()
          if data[:4] != b'Cr24':
              raise SystemExit('bad CRX magic')
          version = struct.unpack_from('<I', data, 4)[0]
          if version != 3:
              raise SystemExit(f'expected CRX3, got {version}')
          header_len = struct.unpack_from('<I', data, 8)[0]
          zip_offset = 12 + header_len
          payload = data[zip_offset:]
          if payload[:2] != b'PK':
              raise SystemExit('ZIP payload not found')
          (root / 'superhuman-mail-current.zip').write_bytes(payload)
          metadata = {
              'crx_format_version': version,
              'crx_header_length': header_len,
              'zip_offset': zip_offset,
              'crx_size': len(data),
              'zip_size': len(payload),
              'crx_sha256': hashlib.sha256(data).hexdigest(),
              'zip_sha256': hashlib.sha256(payload).hexdigest(),
          }
          (root / 'crx-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          unzip -q crx-intake/superhuman-mail-current.zip -d crx-intake/extracted
          test -f crx-intake/extracted/manifest.json
          cp crx-intake/extracted/manifest.json crx-intake/manifest.json
          python3 - <<'PY'
          import json, pathlib, os
          root = pathlib.Path('crx-intake')
          manifest = json.loads((root/'manifest.json').read_text())
          meta = json.loads((root/'crx-metadata.json').read_text())
          status = {
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_commit': os.environ['GITHUB_SHA'],
              'extension_id': 'dcgcnpooblobhncpnddnhoendgbnglpn',
              'manifest_version': manifest.get('manifest_version'),
              'extension_version': manifest.get('version'),
              **meta,
          }
          (root/'status.json').write_text(json.dumps(status, indent=2) + '\n')
          PY
          find crx-intake/extracted -type f -print0 | sort -z | xargs -0 sha256sum > crx-intake/SOURCE_SHA256SUMS.txt
          (cd crx-intake && zip -q -r superhuman-mail-source.zip extracted manifest.json crx-metadata.json SOURCE_SHA256SUMS.txt)
          sha256sum crx-intake/superhuman-mail-source.zip > crx-intake/superhuman-mail-source.zip.sha256

      - name: Upload provenance-preserving artifact
        uses: actions/upload-artifact@v4
        with:
          name: superhuman-mail-current-crx-intake
          path: |
            crx-intake/superhuman-mail-current.crx
            crx-intake/superhuman-mail-current.zip
            crx-intake/superhuman-mail-source.zip
            crx-intake/superhuman-mail-source.zip.sha256
            crx-intake/manifest.json
            crx-intake/crx-metadata.json
            crx-intake/status.json
            crx-intake/SOURCE_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Commit non-binary intake status for polling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crx-intake/status.json crx-intake/manifest.json crx-intake/crx-metadata.json
          git commit -m 'chore: record temporary Superhuman CRX intake status'
          git push
