name: Current Superhuman CRX external trust map 20260809

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-current-crx-external-map-20260809.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Download official current CRX and map external trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf current-crx-map
          mkdir -p current-crx-map/raw current-crx-map/evidence public-intake-status
          URL='https://clients2.google.com/service/update2/crx?response=redirect&prod=chromium&prodversion=144.0.7559.96&acceptformat=crx3&x=id%3Ddcgcnpooblobhncpnddnhoendgbnglpn%26installsource%3Dondemand%26uc'
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0 Chrome/144.0.7559.96' "$URL" -o current-crx-map/raw/current.crx
          test "$(head -c 4 current-crx-map/raw/current.crx)" = 'Cr24'
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,struct,zipfile
          root=pathlib.Path('current-crx-map'); raw=root/'raw'; ev=root/'evidence'
          data=(raw/'current.crx').read_bytes()
          version=struct.unpack_from('<I',data,4)[0]
          if version!=3: raise SystemExit(f'expected CRX3 got {version}')
          header_len=struct.unpack_from('<I',data,8)[0]
          payload=data[12+header_len:]
          (raw/'payload.zip').write_bytes(payload)
          with zipfile.ZipFile(raw/'payload.zip') as z: z.extractall(raw/'source')
          manifest=json.loads((raw/'source/manifest.json').read_text())

          patterns={
            'onMessageExternal':r'onMessageExternal',
            'onConnectExternal':r'onConnectExternal',
            'runtimeOnMessage':r'(?:chrome|browser)\.runtime\.onMessage',
            'runtimeOnConnect':r'(?:chrome|browser)\.runtime\.onConnect',
            'windowMessage':r'addEventListener\s*\(\s*["\']message["\']',
            'postMessage':r'\.postMessage\s*\(',
            'BroadcastChannel':r'BroadcastChannel\s*\(',
            'executeScript':r'(?:chrome|browser)\.scripting\.executeScript',
            'cookies':r'(?:chrome|browser)\.cookies\.',
            'identity':r'(?:chrome|browser)\.identity\.',
            'nativeMessaging':r'connectNative|sendNativeMessage',
          }
          contexts=[]; counts={k:0 for k in patterns}; scanned=0
          for p in sorted((raw/'source').rglob('*')):
            if not p.is_file() or p.stat().st_size>25_000_000 or p.suffix.lower() not in {'.js','.mjs','.cjs','.html','.json'}: continue
            scanned+=1
            text=p.read_text(errors='ignore')
            for name,pat in patterns.items():
              matches=list(re.finditer(pat,text,re.I)); counts[name]+=len(matches)
              for m in matches[:30]:
                contexts.append({
                  'file':str(p.relative_to(raw/'source')),
                  'pattern':name,
                  'offset':m.start(),
                  'context':text[max(0,m.start()-700):m.start()+1700].replace('\n',' ')[:2800],
                })
          external_contexts=[x for x in contexts if x['pattern'] in ('onMessageExternal','onConnectExternal','windowMessage','BroadcastChannel')]
          result={
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_commit':os.environ['GITHUB_SHA'],
            'extension_id':'dcgcnpooblobhncpnddnhoendgbnglpn',
            'extension_version':manifest.get('version'),
            'manifest_version':manifest.get('manifest_version'),
            'crx_sha256':hashlib.sha256(data).hexdigest(),
            'crx_size':len(data),
            'permissions':manifest.get('permissions',[]),
            'host_permissions':manifest.get('host_permissions',[]),
            'optional_permissions':manifest.get('optional_permissions',[]),
            'externally_connectable':manifest.get('externally_connectable'),
            'content_scripts':manifest.get('content_scripts',[]),
            'background':manifest.get('background'),
            'web_accessible_resources':manifest.get('web_accessible_resources',[]),
            'files_scanned':scanned,
            'pattern_counts':counts,
            'external_context_count':len(external_contexts),
            'external_contexts':external_contexts[:80],
            'arbitrary_origin_privileged_response_proven':False,
            'submit_ready':False,
            'decision':'STATIC_EXTERNAL_MAP_REVIEW_REQUIRED',
          }
          (ev/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (ev/'ALL_CONTEXTS.json').write_text(json.dumps(contexts,indent=2)+'\n')
          compact={k:v for k,v in result.items() if k not in ('content_scripts','web_accessible_resources','external_contexts')}
          compact['external_contexts']=[{'file':x['file'],'pattern':x['pattern'],'offset':x['offset'],'context':x['context'][:900]} for x in external_contexts[:25]]
          pathlib.Path('public-intake-status/superhuman-current-crx-external-map-20260809.json').write_text(json.dumps(compact,indent=2)+'\n')
          PY
          find current-crx-map/evidence -type f -print0 | sort -z | xargs -0 sha256sum > current-crx-map/evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-current-crx-external-map-20260809
          path: current-crx-map/evidence/
          retention-days: 1
          if-no-files-found: error

      - name: Commit compact result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-current-crx-external-map-20260809.json
          git commit -m 'chore: record current Superhuman CRX external map'
          git push
