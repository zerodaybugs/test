name: Temporary Superhuman HubSpot preload intake

on:
  push:
    branches: [research/superhuman-desktop-20260808]
    paths: [.github/workflows/superhuman-desktop-hubspot-preload-intake-20260808.yml]

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Extract exact HubSpot preload and IPC definitions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hubspot-preload-intake
          mkdir -p hubspot-preload-intake/raw hubspot-preload-intake/evidence
          URL='https://storage.googleapis.com/download.superhuman.com/supertron-update/Superhuman-1041.0.29-latest-mac.zip'
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors "$URL" -o hubspot-preload-intake/raw/release.zip
          echo '5b753f4c31dd0e5732f0e555bbd76e595c573445bf93b91fd25320e29bf2f014  hubspot-preload-intake/raw/release.zip' | sha256sum -c -
          unzip -q hubspot-preload-intake/raw/release.zip -d hubspot-preload-intake/raw/unpacked
          APP="$(find hubspot-preload-intake/raw/unpacked -name 'Superhuman.app' -type d | head -1)"
          test -n "$APP"
          npm --silent --no-progress install --global @electron/asar@3.4.1
          asar extract "$APP/Contents/Resources/app.asar" hubspot-preload-intake/raw/source
          test -f hubspot-preload-intake/raw/source/dist/hubspot_create_contact_popup_preload.js
          cp hubspot-preload-intake/raw/source/dist/hubspot_create_contact_popup_preload.js hubspot-preload-intake/evidence/
          cp hubspot-preload-intake/raw/source/dist/main.js hubspot-preload-intake/evidence/main.js
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib,os
          root=Path('hubspot-preload-intake/evidence')
          preload=(root/'hubspot_create_contact_popup_preload.js').read_text(errors='ignore')
          main=(root/'main.js').read_text(errors='ignore')
          terms=['contextBridge','ipcRenderer','send(','invoke(','HUBSPOT_CONTACT_CREATED','HUBSPOT_FORM_ELEMENT_NOT_FOUND','NativeApi','exposeInMainWorld','OPEN_EXTERNAL_URL','CHECK_FILE_EXISTS','CLEAR_CACHE','FORCE_UPDATE']
          hits=[]
          for filename,text in [('hubspot_create_contact_popup_preload.js',preload),('main.js',main)]:
            for term in terms:
              start=0
              while True:
                i=text.find(term,start)
                if i<0: break
                hits.append({'file':filename,'term':term,'offset':i,'context':text[max(0,i-500):i+1500].replace('\n',' ')})
                start=i+len(term)
                if sum(1 for h in hits if h['file']==filename and h['term']==term)>=30: break
          status={
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_commit':os.environ['GITHUB_SHA'],
            'desktop_version':'1041.0.29',
            'preload_size':len(preload.encode()),
            'preload_sha256':hashlib.sha256(preload.encode()).hexdigest(),
            'main_sha256':hashlib.sha256(main.encode()).hexdigest(),
            'hit_count':len(hits),
          }
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          (root/'hits.json').write_text(json.dumps(hits,indent=2)+'\n')
          PY
          sha256sum hubspot-preload-intake/evidence/* > hubspot-preload-intake/evidence/SHA256SUMS.txt
          rm -rf hubspot-preload-intake/raw
      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-desktop-hubspot-preload-1041.0.29
          path: hubspot-preload-intake/evidence/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
      - name: Commit status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-intake-status
          cp hubspot-preload-intake/evidence/status.json public-intake-status/superhuman-desktop-hubspot-preload-1041.0.29.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-desktop-hubspot-preload-1041.0.29.json
          git commit -m 'chore: record Superhuman HubSpot preload intake status'
          git push
