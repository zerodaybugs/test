name: Temporary Superhuman HubSpot preload intake

on:
  push:
    branches: [research/superhuman-desktop-20260808]
    paths: [.github/workflows/superhuman-desktop-hubspot-preload-intake-20260808.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inventory exact HubSpot popup preload and update config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hubspot-preload-intake
          mkdir -p hubspot-preload-intake/raw hubspot-preload-intake/evidence
          URL='https://storage.googleapis.com/download.superhuman.com/supertron-update/Superhuman-1041.0.29-latest-mac.zip'
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors "$URL" -o hubspot-preload-intake/raw/release.zip
          echo '5b753f4c31dd0e5732f0e555bbd76e595c573445bf93b91fd25320e29bf2f014  hubspot-preload-intake/raw/release.zip' | sha256sum -c -
          unzip -q hubspot-preload-intake/raw/release.zip -d hubspot-preload-intake/raw/unpacked
          APP="$(find hubspot-preload-intake/raw/unpacked -name 'Superhuman.app' -type d | head -1)"
          test -n "$APP"
          npm --silent --no-progress install --global @electron/asar@3.4.1
          asar extract "$APP/Contents/Resources/app.asar" hubspot-preload-intake/raw/source
          find hubspot-preload-intake/raw/source/dist -maxdepth 1 -type f -printf '%f\t%s\n' | sort > hubspot-preload-intake/evidence/DIST_FILES.tsv
          find hubspot-preload-intake/raw/source -type f \( -iname '*hubspot*' -o -iname '*preload*' \) -printf '%P\t%s\n' | sort > hubspot-preload-intake/evidence/HUBSPOT_AND_PRELOAD_FILES.tsv
          cp hubspot-preload-intake/raw/source/dist/main.js hubspot-preload-intake/evidence/main.js
          cp hubspot-preload-intake/raw/source/dist/foreground_preload.js hubspot-preload-intake/evidence/foreground_preload.js
          cp "$APP/Contents/Resources/app-update.yml" hubspot-preload-intake/evidence/app-update.yml 2>/dev/null || true
          while IFS= read -r file; do
            cp "$file" "hubspot-preload-intake/evidence/$(basename "$file")"
          done < <(find hubspot-preload-intake/raw/source -type f -iname '*hubspot*preload*')
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          root=Path('hubspot-preload-intake/evidence')
          all_rows=(root/'HUBSPOT_AND_PRELOAD_FILES.tsv').read_text().splitlines()
          matches=[row for row in all_rows if 'hubspot' in row.lower() and 'preload' in row.lower()]
          main=(root/'main.js').read_text(errors='ignore')
          foreground=(root/'foreground_preload.js').read_text(errors='ignore')
          status={
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_commit':os.environ['GITHUB_SHA'],
            'desktop_version':'1041.0.29',
            'configured_hubspot_preload_path_present':bool(matches),
            'hubspot_preload_matches':matches,
            'main_sha256':hashlib.sha256(main.encode()).hexdigest(),
            'foreground_preload_sha256':hashlib.sha256(foreground.encode()).hexdigest(),
            'app_update_yml_present':(root/'app-update.yml').exists(),
            'main_references_configured_preload': 'hubspot_create_contact_popup_preload.js' in main,
            'foreground_exposes_use_upgrade_channel': 'USE_UPGRADE_CHANNEL' in foreground,
            'main_registers_unvalidated_upgrade_channel_listener': "ipcMain.on('USE_UPGRADE_CHANNEL'" in main,
            'external_hubspot_origin_in_ipc_allowlist': 'https://app.hubspot.com/object-builder/' in main,
          }
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
          sha256sum hubspot-preload-intake/evidence/* > hubspot-preload-intake/evidence/SHA256SUMS.txt
          rm -rf hubspot-preload-intake/raw
      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-desktop-hubspot-preload-1041.0.29
          path: hubspot-preload-intake/evidence/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
      - name: Commit status
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-intake-status
          cp hubspot-preload-intake/evidence/status.json public-intake-status/superhuman-desktop-hubspot-preload-1041.0.29.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-desktop-hubspot-preload-1041.0.29.json
          git commit -m 'chore: record Superhuman HubSpot preload inventory'
          git push
