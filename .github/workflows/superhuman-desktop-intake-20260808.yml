name: Temporary Superhuman desktop release intake

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-desktop-intake-20260808.yml]

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Fetch official update metadata and artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop-intake
          mkdir -p desktop-intake public-intake-status
          base='https://storage.googleapis.com/download.superhuman.com/supertron-update'
          for metadata in latest.yml latest-mac.yml latest-linux.yml; do
            code=$(curl --show-error --silent --location --retry 3 --retry-all-errors \
              -o "desktop-intake/$metadata" -w '%{http_code}' "$base/$metadata" || true)
            size=$(stat -c '%s' "desktop-intake/$metadata" 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\n' "$metadata" "$code" "$size" >> desktop-intake/metadata-status.tsv
            if [[ "$code" != 200 || "$size" -eq 0 ]]; then rm -f "desktop-intake/$metadata"; fi
          done

          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.parse, urllib.request
          root=pathlib.Path('desktop-intake')
          base='https://storage.googleapis.com/download.superhuman.com/supertron-update/'
          status={'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'source_commit':os.environ['GITHUB_SHA'],'metadata':{},'artifacts':[]}
          candidates=[]
          for p in sorted(root.glob('latest*.yml')):
              text=p.read_text(errors='replace')
              info={'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'preview':text[:2000]}
              status['metadata'][p.name]=info
              # electron-builder yml: path:, url:, files: - url:
              for line in text.splitlines():
                  m=re.match(r'^\s*(?:path|url):\s*["\']?([^"\'\s]+)',line)
                  if m:
                      value=m.group(1).strip()
                      if value and not value.startswith(('http://','https://')):
                          value=urllib.parse.urljoin(base,value)
                      if value.startswith('https://'):
                          candidates.append((p.name,value))
          seen=set()
          for source,url in candidates:
              if url in seen: continue
              seen.add(url)
              name=urllib.parse.unquote(urllib.parse.urlparse(url).path.rsplit('/',1)[-1]) or 'artifact.bin'
              dest=root/name
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Superhuman authorized static audit'})
                  with urllib.request.urlopen(req,timeout=180) as r, dest.open('wb') as f:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          f.write(chunk)
                  data=dest.read_bytes()
                  status['artifacts'].append({'source_metadata':source,'url':url,'name':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'ok':True})
              except Exception as e:
                  status['artifacts'].append({'source_metadata':source,'url':url,'name':name,'ok':False,'error':repr(e)})
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          pathlib.Path('public-intake-status/superhuman-desktop-intake.json').write_text(json.dumps(status,indent=2)+'\n')
          PY

          find desktop-intake -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > desktop-intake/SHA256SUMS.txt

      - name: Extract supported desktop packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-intake/extracted
          shopt -s nullglob
          for file in desktop-intake/*.AppImage; do
            chmod +x "$file"
            (cd desktop-intake/extracted && "../$(basename "$file")" --appimage-extract >/dev/null 2>&1) || true
          done
          for file in desktop-intake/*.zip; do
            dir="desktop-intake/extracted/$(basename "$file" .zip)"
            mkdir -p "$dir"
            unzip -q "$file" -d "$dir" || true
          done
          for file in desktop-intake/*.exe; do
            dir="desktop-intake/extracted/$(basename "$file" .exe)"
            mkdir -p "$dir"
            7z x -y -o"$dir" "$file" >/dev/null 2>&1 || true
          done
          find desktop-intake/extracted -type f -printf '%p\t%s\n' | sort > desktop-intake/extracted-files.tsv
          find desktop-intake/extracted -type f -print0 | sort -z | xargs -0 -r sha256sum > desktop-intake/EXTRACTED_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-desktop-current-release-intake
          path: desktop-intake/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record non-sensitive intake status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-intake-status/superhuman-desktop-intake.json
          git commit -m 'chore: record Superhuman desktop intake status'
          git push
