name: Temporary Superhuman desktop intake

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-desktop-intake-20260808.yml]

permissions:
  contents: write

jobs:
  intake:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Download and verify official Superhuman desktop build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop-intake
          mkdir -p desktop-intake
          URL='https://storage.googleapis.com/download.superhuman.com/supertron-update/Superhuman-1041.0.29-latest-mac.zip'
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors "$URL" -o desktop-intake/Superhuman-1041.0.29-latest-mac.zip
          echo '5b753f4c31dd0e5732f0e555bbd76e595c573445bf93b91fd25320e29bf2f014  desktop-intake/Superhuman-1041.0.29-latest-mac.zip' | shasum -a 256 -c -
          ditto -x -k desktop-intake/Superhuman-1041.0.29-latest-mac.zip desktop-intake/unpacked
          APP="$(find desktop-intake/unpacked -maxdepth 3 -name 'Superhuman.app' -type d | head -1)"
          test -n "$APP"
          ASAR="$APP/Contents/Resources/app.asar"
          test -f "$ASAR"
          cp "$ASAR" desktop-intake/app.asar
          if [ -d "$APP/Contents/Resources/app.asar.unpacked" ]; then
            cp -R "$APP/Contents/Resources/app.asar.unpacked" desktop-intake/app.asar.unpacked
          fi
          plutil -convert json -o desktop-intake/Info.json "$APP/Contents/Info.plist"

      - name: Extract ASAR and audit privileged boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-progress install --global @electron/asar@3.4.1
          asar extract desktop-intake/app.asar desktop-intake/source
          find desktop-intake/source -type f -print0 | sort -z | xargs -0 shasum -a 256 > desktop-intake/SOURCE_SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib, os
          root=Path('desktop-intake')
          src=root/'source'
          pats={
            'protocol_registration': re.compile(r'setAsDefaultProtocolClient|registerSchemesAsPrivileged|open-url|second-instance|protocol\.handle|protocol\.register',re.I),
            'native_api': re.compile(r'contextBridge|ipcMain|ipcRenderer|webContents\.send|executeJavaScript|setWindowOpenHandler',re.I),
            'navigation': re.compile(r'will-navigate|will-redirect|new-window|shell\.openExternal|loadURL|window\.open',re.I),
            'oauth': re.compile(r'native-login|ios-login|superhuman://auth|loginUuid|pendingAuthProvider|authorization_code|oauth2',re.I),
            'dangerous': re.compile(r'nodeIntegration|contextIsolation|webSecurity|allowRunningInsecureContent|sandbox\s*:',re.I),
          }
          findings=[]
          for p in src.rglob('*'):
            if not p.is_file() or p.stat().st_size>20_000_000: continue
            try: text=p.read_text(errors='ignore')
            except Exception: continue
            for name,rx in pats.items():
              for m in list(rx.finditer(text))[:100]:
                findings.append({'kind':name,'path':str(p.relative_to(src)),'offset':m.start(),'context':text[max(0,m.start()-240):m.start()+520].replace('\n',' ')})
          status={
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_commit':os.environ['GITHUB_SHA'],
            'desktop_version':'1041.0.29',
            'zip_sha256':hashlib.sha256((root/'Superhuman-1041.0.29-latest-mac.zip').read_bytes()).hexdigest(),
            'asar_sha256':hashlib.sha256((root/'app.asar').read_bytes()).hexdigest(),
            'source_file_count':sum(1 for p in src.rglob('*') if p.is_file()),
            'hit_count':len(findings),
          }
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          (root/'privileged_boundary_hits.json').write_text(json.dumps(findings,indent=2)+'\n')
          PY
          grep -RInaE --binary-files=without-match 'AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|client_secret["'"'[:space:]]*[:=]' desktop-intake/source > desktop-intake/secret_hits.txt || true
          rm -f desktop-intake/Superhuman-1041.0.29-latest-mac.zip
          rm -rf desktop-intake/unpacked

      - name: Upload source and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: superhuman-desktop-1041.0.29-intake
          path: desktop-intake/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9

      - name: Commit status for polling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-intake-status
          cp desktop-intake/status.json public-intake-status/superhuman-desktop-1041.0.29.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-desktop-1041.0.29.json
          git commit -m 'chore: record temporary Superhuman desktop intake status'
          git push
