name: Superhuman desktop exact preload delta export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export exact first-party files from official builds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preload-delta-export
          mkdir -p preload-delta-export/raw preload-delta-export/evidence
          npm --silent --no-progress install --global @electron/asar@3.4.1
          base='https://storage.googleapis.com/download.superhuman.com/supertron-update'
          for version in 1041.0.28 1041.0.29; do
            curl --fail --show-error --silent --location --retry 3 --retry-all-errors "$base/Superhuman-${version}-latest-mac.zip" -o "preload-delta-export/raw/${version}.zip"
            mkdir -p "preload-delta-export/raw/${version}"
            unzip -q "preload-delta-export/raw/${version}.zip" -d "preload-delta-export/raw/${version}"
            app="$(find "preload-delta-export/raw/${version}" -name 'Superhuman.app' -type d | head -1)"
            asar extract "$app/Contents/Resources/app.asar" "preload-delta-export/raw/${version}-source"
            mkdir -p "preload-delta-export/evidence/${version}"
            cp "preload-delta-export/raw/${version}-source/dist/background_preload.js" "preload-delta-export/evidence/${version}/"
            cp "preload-delta-export/raw/${version}-source/dist/foreground_preload.js" "preload-delta-export/evidence/${version}/"
            cp "preload-delta-export/raw/${version}-source/dist/window_preload.js" "preload-delta-export/evidence/${version}/"
            cp "preload-delta-export/raw/${version}-source/package.json" "preload-delta-export/evidence/${version}/"
          done
          python3 - <<'PY'
          from pathlib import Path
          import difflib,json,hashlib
          ev=Path('preload-delta-export/evidence')
          result={'files':{}}
          for name in ['background_preload.js','foreground_preload.js','window_preload.js','package.json']:
            a=(ev/'1041.0.28'/name).read_text(errors='replace'); b=(ev/'1041.0.29'/name).read_text(errors='replace')
            sm=difflib.SequenceMatcher(None,a,b,autojunk=False)
            changes=[]
            for tag,i1,i2,j1,j2 in sm.get_opcodes():
              if tag=='equal': continue
              changes.append({'tag':tag,'old_start':i1,'old_end':i2,'new_start':j1,'new_end':j2,'old':a[i1:i2][:4000],'new':b[j1:j2][:4000]})
              if len(changes)>=500: break
            result['files'][name]={'old_sha256':hashlib.sha256(a.encode()).hexdigest(),'new_sha256':hashlib.sha256(b.encode()).hexdigest(),'old_size':len(a.encode()),'new_size':len(b.encode()),'opcode_change_count':len(changes),'changes':changes}
          (ev/'SEMANTIC_DELTA.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          find preload-delta-export/evidence -type f -print0 | sort -z | xargs -0 sha256sum > preload-delta-export/evidence/SHA256SUMS.txt
          rm -rf preload-delta-export/raw
      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-desktop-exact-preload-delta-export
          path: preload-delta-export/evidence/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
