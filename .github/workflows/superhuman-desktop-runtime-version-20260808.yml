name: Temporary Superhuman desktop runtime metadata

on:
  push:
    branches: [research/superhuman-desktop-20260808]
    paths: [.github/workflows/superhuman-desktop-runtime-version-20260808.yml]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official release and inspect embedded Electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-metadata/raw runtime-metadata/evidence
          URL='https://storage.googleapis.com/download.superhuman.com/supertron-update/Superhuman-1041.0.29-latest-mac.zip'
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors "$URL" -o runtime-metadata/raw/release.zip
          echo '5b753f4c31dd0e5732f0e555bbd76e595c573445bf93b91fd25320e29bf2f014  runtime-metadata/raw/release.zip' | shasum -a 256 -c -
          ditto -x -k runtime-metadata/raw/release.zip runtime-metadata/raw/unpacked
          APP="$(find runtime-metadata/raw/unpacked -name 'Superhuman.app' -type d | head -1)"
          test -n "$APP"
          FRAMEWORK_PLIST="$APP/Contents/Frameworks/Electron Framework.framework/Resources/Info.plist"
          test -f "$FRAMEWORK_PLIST"
          plutil -convert xml1 -o runtime-metadata/evidence/ElectronFramework-Info.plist "$FRAMEWORK_PLIST"
          plutil -convert xml1 -o runtime-metadata/evidence/App-Info.plist "$APP/Contents/Info.plist"
          BIN="$APP/Contents/MacOS/Superhuman"
          file "$BIN" > runtime-metadata/evidence/executable-file.txt
          codesign -dv --verbose=4 "$APP" > runtime-metadata/evidence/codesign.txt 2>&1 || true
          python3 - <<'PY'
          import json, os, pathlib, plistlib, hashlib, subprocess
          root=pathlib.Path('runtime-metadata/evidence')
          ep=plistlib.loads((root/'ElectronFramework-Info.plist').read_bytes())
          ap=plistlib.loads((root/'App-Info.plist').read_bytes())
          result={
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_commit':os.environ['GITHUB_SHA'],
            'app_version':ap.get('CFBundleShortVersionString'),
            'electron_framework_version':ep.get('CFBundleShortVersionString'),
            'electron_framework_build':ep.get('CFBundleVersion'),
            'electron_bundle_identifier':ep.get('CFBundleIdentifier'),
            'release_sha256':'5b753f4c31dd0e5732f0e555bbd76e595c573445bf93b91fd25320e29bf2f014',
          }
          (root/'status.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          find runtime-metadata/evidence -type f -print0 | sort -z | xargs -0 shasum -a 256 > runtime-metadata/evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-desktop-runtime-metadata-1041.0.29
          path: runtime-metadata/evidence/
          if-no-files-found: error
          retention-days: 1
