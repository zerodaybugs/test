name: Temporary Superhuman Go current CRX intake

on:
  push:
    branches: [research/superhuman-go-crx-20260810]
    paths: [.github/workflows/superhuman-go-current-crx-intake.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Download and extract current official Chrome Web Store package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf go-crx-intake
          mkdir -p go-crx-intake/extracted go-crx-intake/evidence public-intake-status
          URL='https://clients2.google.com/service/update2/crx?response=redirect&prod=chromium&prodversion=151.0.0.0&acceptformat=crx3&x=id%3Dkbfnbcaeplbcioakkpcpgfkobkghlhen%26installsource%3Dondemand%26uc'
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0 Chrome/151.0.0.0' "$URL" \
            -o go-crx-intake/superhuman-go-current.crx
          test "$(head -c 4 go-crx-intake/superhuman-go-current.crx)" = 'Cr24'
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          root=pathlib.Path('go-crx-intake')
          data=(root/'superhuman-go-current.crx').read_bytes()
          version=struct.unpack_from('<I',data,4)[0]
          header_len=struct.unpack_from('<I',data,8)[0]
          offset=12+header_len
          payload=data[offset:]
          if version != 3 or payload[:2] != b'PK':
              raise SystemExit(f'invalid CRX3: version={version} offset={offset}')
          (root/'superhuman-go-current.zip').write_bytes(payload)
          (root/'evidence'/'CRX_METADATA.json').write_text(json.dumps({
              'extension_id':'kbfnbcaeplbcioakkpcpgfkobkghlhen',
              'crx_format_version':version,
              'crx_header_length':header_len,
              'zip_offset':offset,
              'crx_size':len(data),
              'zip_size':len(payload),
              'crx_sha256':hashlib.sha256(data).hexdigest(),
              'zip_sha256':hashlib.sha256(payload).hexdigest(),
          },indent=2)+'\n')
          PY
          unzip -q go-crx-intake/superhuman-go-current.zip -d go-crx-intake/extracted
          test -f go-crx-intake/extracted/manifest.json

      - name: Scan exact build for confirmation and MCP annotation logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root=pathlib.Path('go-crx-intake')
          ext=root/'extracted'; ev=root/'evidence'
          manifest=json.loads((ext/'manifest.json').read_text(errors='replace'))
          terms=[
              'readOnlyHint','destructiveHint','idempotentHint','openWorldHint',
              'requiresConfirmation','requireConfirmation','confirmation',
              'toolAnnotations','ToolAnnotations','mcpServers','MCP',
          ]
          hits=[]
          scanned=0
          for p in sorted(ext.rglob('*')):
              if not p.is_file() or p.stat().st_size > 80_000_000:
                  continue
              if p.suffix.lower() not in {'.js','.mjs','.cjs','.json','.html','.ts','.map'}:
                  continue
              scanned+=1
              text=p.read_text(errors='replace')
              for term in terms:
                  start=0; per=0
                  while True:
                      i=text.find(term,start)
                      if i<0: break
                      hits.append({
                          'file':str(p.relative_to(ext)),
                          'term':term,
                          'offset':i,
                          'snippet':text[max(0,i-800):i+1800].replace('\n',' '),
                      })
                      per+=1; start=i+len(term)
                      if per>=40: break
          result={
              'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
              'source_commit':os.environ['GITHUB_SHA'],
              'extension_id':'kbfnbcaeplbcioakkpcpgfkobkghlhen',
              'extension_name':manifest.get('name'),
              'extension_version':manifest.get('version'),
              'manifest_version':manifest.get('manifest_version'),
              'files_scanned':scanned,
              'hit_count':len(hits),
              'readOnlyHint_hit_count':sum(h['term']=='readOnlyHint' for h in hits),
              'destructiveHint_hit_count':sum(h['term']=='destructiveHint' for h in hits),
              'confirmation_hit_count':sum('confirmation' in h['term'].lower() for h in hits),
              'production_request_count':0,
              'decision':'STATIC_REVIEW_REQUIRED',
          }
          (ev/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (ev/'SCAN_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          (ev/'HITS.json').write_text(json.dumps(hits,indent=2)+'\n')
          pathlib.Path('public-intake-status/superhuman-go-current-crx-result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          find go-crx-intake/extracted -type f -print0 | sort -z | xargs -0 sha256sum > go-crx-intake/evidence/SOURCE_SHA256SUMS.txt
          (cd go-crx-intake && zip -q -r superhuman-go-source.zip extracted evidence/MANIFEST.json evidence/CRX_METADATA.json)
          sha256sum go-crx-intake/superhuman-go-current.crx go-crx-intake/superhuman-go-current.zip go-crx-intake/superhuman-go-source.zip > go-crx-intake/evidence/ARCHIVE_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-go-current-crx-intake
          path: |
            go-crx-intake/superhuman-go-current.crx
            go-crx-intake/superhuman-go-current.zip
            go-crx-intake/superhuman-go-source.zip
            go-crx-intake/evidence/
          retention-days: 1
          if-no-files-found: error

      - name: Commit compact result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-go-current-crx-result.json
          git commit -m 'chore: record current Superhuman Go CRX intake'
          git push
