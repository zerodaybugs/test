name: Superhuman host parser boundary gate

on:
  push:
    branches: [research/superhuman-sdk-source-20260809]
    paths: [.github/workflows/superhuman-host-parser-boundary-gate-20260810.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Install exact stable SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf parser-gate
          mkdir -p parser-gate/evidence public-intake-status
          cd parser-gate
          npm init -y >/dev/null
          npm install --no-audit --no-fund @codahq/packs-sdk@1.17.1

      - name: Exercise XML, JSONPath and canonical isolate boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd parser-gate
          cat > pack-bundle.js <<'PACK'
          module.exports = {pack: {
            formulas: [{
              name: 'FetchXml', description: 'Synthetic parser boundary gate', parameters: [], resultType: 'string',
              execute: async (_params, context) => {
                const response = await context.fetcher.fetch({method:'GET', url: globalThis.__LAB_URL + '/xml-proto'});
                return JSON.stringify({
                  body: response.body,
                  isolateObjectPolluted: ({}).SUPERHUMAN_XML_POLLUTED,
                  isolateArrayPolluted: [].SUPERHUMAN_XML_POLLUTED,
                });
              },
            }],
          }};
          PACK
          cat > pack-bundle.js.map <<'MAP'
          {"version":3,"file":"pack-bundle.js","sources":["pack-source.js"],"names":[],"mappings":""}
          MAP

          cat > gate.js <<'NODE'
          'use strict';
          const assert = require('assert');
          const crypto = require('crypto');
          const fs = require('fs');
          const http = require('http');
          const path = require('path');

          const sdkRoot = path.dirname(require.resolve('@codahq/packs-sdk/package.json'));
          const {AuthenticatingFetcher} = require(path.join(sdkRoot, 'dist/testing/fetcher.js'));
          const bootstrap = require(path.join(sdkRoot, 'dist/runtime/bootstrap/index.js'));
          const marshaling = require(path.join(sdkRoot, 'dist/runtime/common/marshaling.js'));
          const {JSONPath} = require('jsonpath-plus');
          const clone = require('clone');
          const thunkPath = bootstrap.getThunkPath();
          const packPath = path.resolve('pack-bundle.js');
          const mapPath = path.resolve('pack-bundle.js.map');

          const POLLUTED = 'SUPERHUMAN_XML_POLLUTED';
          const XML_PROTO = `<?xml version="1.0"?><root><__proto__><${POLLUTED}>PROTO_XML</${POLLUTED}></__proto__></root>`;
          const XML_CTOR = `<?xml version="1.0"?><root><constructor><prototype><${POLLUTED}>CTOR_XML</${POLLUTED}></prototype></constructor></root>`;
          const JSON_PROTO = JSON.stringify({root:{'__proto__':{[POLLUTED]:'PROTO_JSON'}}});
          const requests = [];
          let server;

          const logger={trace(){},debug(){},info(){},warn(){},error(){}};
          const blob={async storeUrl(){throw new Error('unused')},async storeBlob(){throw new Error('unused')}};
          const clean = () => {
            try { delete Object.prototype[POLLUTED]; } catch (_) {}
            try { delete Array.prototype[POLLUTED]; } catch (_) {}
            delete globalThis.__JSONPATH_RCE_SENTINEL;
          };
          const state = () => ({
            objectPrototype: ({} )[POLLUTED],
            arrayPrototype: [][POLLUTED],
            jsonPathSentinel: globalThis.__JSONPATH_RCE_SENTINEL,
          });
          const own = (obj, key) => Boolean(obj && Object.prototype.hasOwnProperty.call(obj, key));
          const describe = value => {
            if (value === null) return {type:'null'};
            const type = typeof value;
            if (type !== 'object') return {type, value:String(value).slice(0,500)};
            const out = {type, isArray:Array.isArray(value), keys:Object.keys(value).slice(0,100)};
            for (const key of ['root','__proto__','constructor','prototype',POLLUTED]) {
              out[`own_${key}`] = own(value,key);
            }
            return out;
          };
          function listen(s){return new Promise((ok,no)=>{s.once('error',no);s.listen(0,'127.0.0.1',()=>ok(s.address().port));});}
          function close(s){return new Promise(ok=>s.close(()=>ok()));}

          async function fetchPath(base, route) {
            const fetcher = new AuthenticatingFetcher(
              () => {},
              {type:'None'},
              [`127.0.0.1:${new URL(base).port}`],
              {},
              'LAB_INVOCATION_PARSER',
            );
            return fetcher.fetch({method:'GET',url:base+route});
          }

          async function canonicalIsolate(base, port) {
            const isolate=bootstrap.createIsolate({memoryLimit:64});
            const context=await bootstrap.createIsolateContext(isolate);
            await bootstrap.registerBundles(isolate,context,packPath,thunkPath,true);
            await context.global.set('__LAB_URL',base,{copy:true});
            const fetcher=new AuthenticatingFetcher(()=>{}, {type:'None'}, [`127.0.0.1:${port}`], {}, 'LAB_INVOCATION_PARSER');
            await bootstrap.injectExecutionContext({
              context,fetcher,temporaryBlobStorage:blob,syncStateService:undefined,logger,
              endpoint:undefined,invocationLocation:{protocolAndHost:'https://coda.io'},timezone:'UTC',
              invocationToken:'LAB_INVOCATION_PARSER',sync:undefined,authenticationName:undefined,
              executionId:'LAB_EXEC_PARSER',previousAttemptError:undefined,
            });
            const result=await bootstrap.executeThunk(context,{params:[],formulaSpec:{type:'Standard',formulaName:'FetchXml'}},packPath,mapPath);
            isolate.dispose();
            return JSON.parse(result);
          }

          async function main(){
            clean();
            server=http.createServer((req,res)=>{
              requests.push(req.url);
              if(req.url==='/xml-proto'){
                res.writeHead(200,{'content-type':'application/xml'});res.end(XML_PROTO);return;
              }
              if(req.url==='/xml-ctor'){
                res.writeHead(200,{'content-type':'application/xml'});res.end(XML_CTOR);return;
              }
              if(req.url==='/json-proto'){
                res.writeHead(200,{'content-type':'application/json'});res.end(JSON_PROTO);return;
              }
              res.writeHead(404);res.end('not found');
            });
            const port=await listen(server);const base=`http://127.0.0.1:${port}`;
            const result={
              pass:true,
              sdkVersion:require(path.join(sdkRoot,'package.json')).version,
              xml2jsVersion:require('xml2js/package.json').version,
              jsonPathPlusVersion:require('jsonpath-plus/package.json').version,
              cloneVersion:require('clone/package.json').version,
              nodeVersion:process.version,
              initialState:state(),
              cases:{},
              productionRequestCount:0,
              syntheticOnly:true,
            };

            for (const [name,route] of [['xmlProto','/xml-proto'],['xmlCtor','/xml-ctor'],['jsonProto','/json-proto']]) {
              clean();
              const response=await fetchPath(base,route);
              const afterFetch=state();
              let cloned, marshaled, unmarshaled;
              try { cloned=clone(response.body); } catch(e) { cloned={error:String(e)}; }
              const afterClone=state();
              try {
                marshaled=marshaling.marshalValue(response.body);
                unmarshaled=marshaling.unmarshalValue(marshaled);
              } catch(e) { unmarshaled={error:String(e)}; }
              const afterMarshalRoundTrip=state();
              result.cases[name]={
                body:describe(response.body),
                root:describe(response.body && response.body.root),
                cloned:describe(cloned),
                unmarshaled:describe(unmarshaled),
                afterFetch,afterClone,afterMarshalRoundTrip,
              };
              clean();
            }

            clean();
            result.canonicalIsolate=await canonicalIsolate(base,port);
            result.afterCanonicalIsolate=state();
            clean();

            const jsonPathPayloads=[
              '$[?(@.constructor.constructor("globalThis.__JSONPATH_RCE_SENTINEL=\'CTOR\'")())]',
              '$[?(@.__proto__.constructor.constructor("globalThis.__JSONPATH_RCE_SENTINEL=\'PROTO\'")())]',
              '$..[?(@ && @.constructor && @.constructor.constructor("globalThis.__JSONPATH_RCE_SENTINEL=\'DEEP\'")())]',
            ];
            result.jsonPath=[];
            for(const jp of jsonPathPayloads){
              clean();let error=null,output=null;
              try{output=JSONPath({path:jp,json:[{x:1}],eval:'safe'});}catch(e){error=String(e&&e.message||e);}
              result.jsonPath.push({path:jp,error,output,state:state()});
              clean();
            }

            const hostPollutionObserved = Object.values(result.cases).some(c =>
              [c.afterFetch,c.afterClone,c.afterMarshalRoundTrip].some(s => s.objectPrototype !== undefined || s.arrayPrototype !== undefined)
            ) || result.afterCanonicalIsolate.objectPrototype !== undefined || result.afterCanonicalIsolate.arrayPrototype !== undefined;
            const jsonPathCodeExecutionObserved = result.jsonPath.some(x => x.state.jsonPathSentinel !== undefined);
            result.hostPollutionObserved=hostPollutionObserved;
            result.jsonPathCodeExecutionObserved=jsonPathCodeExecutionObserved;
            result.securityDecision = hostPollutionObserved || jsonPathCodeExecutionObserved
              ? 'ESCALATE_DISTINCT_HOST_BOUNDARY_CANDIDATE'
              : 'KILL_NO_HOST_POLLUTION_OR_JSONPATH_CODE_EXECUTION';
            result.requests=requests;
            result.thunkBundleSha256=crypto.createHash('sha256').update(fs.readFileSync(thunkPath)).digest('hex');
            fs.writeFileSync('evidence/RESULT.json',JSON.stringify(result,null,2)+'\n');
          }
          main().then(async()=>{await close(server);console.log(fs.readFileSync('evidence/RESULT.json','utf8'));}).catch(async e=>{try{if(server)await close(server)}catch(_){};console.error(e&&e.stack||e);process.exit(1);});
          NODE

          node gate.js | tee evidence/TEST_OUTPUT.txt
          jq -e '.pass == true and .sdkVersion == "1.17.1" and .productionRequestCount == 0' evidence/RESULT.json >/dev/null
          sha256sum gate.js pack-bundle.js pack-bundle.js.map package.json package-lock.json evidence/RESULT.json evidence/TEST_OUTPUT.txt > evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superhuman-host-parser-boundary-gate
          path: parser-gate/evidence/
          retention-days: 1
          if-no-files-found: warn

      - name: Commit compact result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          jq '{pass,sdkVersion,xml2jsVersion,jsonPathPlusVersion,cloneVersion,nodeVersion,hostPollutionObserved,jsonPathCodeExecutionObserved,securityDecision,canonicalIsolate,afterCanonicalIsolate,productionRequestCount,syntheticOnly}' parser-gate/evidence/RESULT.json > public-intake-status/superhuman-host-parser-boundary-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-host-parser-boundary-result.json
          git commit -m 'chore: record Superhuman host parser boundary gate'
          git push
