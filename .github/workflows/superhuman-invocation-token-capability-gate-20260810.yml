name: Superhuman invocation-token capability boundary gate

on:
  push:
    branches: [research/superhuman-sdk-source-20260809]
    paths: [.github/workflows/superhuman-invocation-token-capability-gate-20260810.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Install exact stable SDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf invocation-token-gate
          mkdir -p invocation-token-gate/evidence public-intake-status
          cd invocation-token-gate
          npm init -y >/dev/null
          npm install --no-audit --no-fund @codahq/packs-sdk@1.17.1

      - name: Run canonical isolate and Coda API authentication identity gate
        shell: bash
        run: |
          set -euo pipefail
          cd invocation-token-gate
          cat > pack-bundle.js <<'PACK'
          module.exports = {pack: {
            formulas: [{
              name:'ReadInvocationToken', description:'Synthetic hidden capability gate', parameters:[], resultType:'string',
              execute:async(_params,context)=>JSON.stringify({
                token:context.invocationToken,
                executionId:context.executionId,
                hasInvocationToken:Object.prototype.hasOwnProperty.call(context,'invocationToken'),
              }),
            },{
              name:'FetchWithCodaApiAuth', description:'Synthetic auth identity gate', parameters:[], resultType:'string',
              execute:async(_params,context)=>JSON.stringify((await context.fetcher.fetch({method:'GET',url:globalThis.__LAB_URL+'/capture'})).body),
            }],
          }};
          PACK
          cat > pack-bundle.js.map <<'MAP'
          {"version":3,"file":"pack-bundle.js","sources":["pack-source.js"],"names":[],"mappings":""}
          MAP

          cat > gate.js <<'NODE'
          'use strict';
          const assert=require('assert');
          const crypto=require('crypto');
          const fs=require('fs');
          const http=require('http');
          const path=require('path');
          const sdk=require('@codahq/packs-sdk');
          const sdkRoot=path.dirname(require.resolve('@codahq/packs-sdk/package.json'));
          const bootstrap=require(path.join(sdkRoot,'dist/runtime/bootstrap/index.js'));
          const {AuthenticatingFetcher}=require(path.join(sdkRoot,'dist/testing/fetcher.js'));
          const {compilePackMetadata}=require(path.join(sdkRoot,'dist/helpers/metadata.js'));
          const {validatePackVersionMetadata}=require(path.join(sdkRoot,'dist/testing/upload_validation.js'));
          const thunkPath=bootstrap.getThunkPath();
          const packPath=path.resolve('pack-bundle.js');
          const mapPath=path.resolve('pack-bundle.js.map');
          const TOKEN='LAB_FIRST_PARTY_INVOCATION_BEARER_20260810';
          const EXEC='LAB_EXECUTION_ID_20260810';
          const captured=[];let server;
          const logger={trace(){},debug(){},info(){},warn(){},error(){}};
          const blob={async storeUrl(){throw new Error('unused')},async storeBlob(){throw new Error('unused')}};
          function listen(s){return new Promise((ok,no)=>{s.once('error',no);s.listen(0,'127.0.0.1',()=>ok(s.address().port));});}
          function close(s){return new Promise(ok=>s.close(()=>ok()));}
          async function runtime(fetcher,base){
            const isolate=bootstrap.createIsolate({memoryLimit:64});
            const context=await bootstrap.createIsolateContext(isolate);
            await bootstrap.registerBundles(isolate,context,packPath,thunkPath,true);
            await context.global.set('__LAB_URL',base,{copy:true});
            await bootstrap.injectExecutionContext({
              context,fetcher,temporaryBlobStorage:blob,syncStateService:undefined,logger,
              endpoint:undefined,invocationLocation:{protocolAndHost:'https://coda.io'},timezone:'UTC',
              invocationToken:TOKEN,sync:undefined,authenticationName:'defaultUserAuthentication',
              executionId:EXEC,previousAttemptError:undefined,
            });
            return {isolate,context};
          }
          async function invoke(rt,name){return bootstrap.executeThunk(rt.context,{params:[],formulaSpec:{type:'Standard',formulaName:name}},packPath,mapPath);}
          async function main(){
            server=http.createServer((req,res)=>{
              const row={url:req.url,authorization:req.headers.authorization||null,headers:req.headers};captured.push(row);
              res.writeHead(200,{'content-type':'application/json'});res.end(JSON.stringify(row));
            });
            const port=await listen(server);const base=`http://127.0.0.1:${port}`;
            const codaFetcher=new AuthenticatingFetcher(
              ()=>{},
              {type:sdk.AuthenticationType.CodaApiHeaderBearerToken,networkDomain:`127.0.0.1:${port}`},
              [`127.0.0.1:${port}`],
              {},
              TOKEN,
            );
            const rt=await runtime(codaFetcher,base);
            const contextExposure=JSON.parse(await invoke(rt,'ReadInvocationToken'));
            const fetchResult=JSON.parse(await invoke(rt,'FetchWithCodaApiAuth'));
            assert.equal(contextExposure.token,TOKEN);
            assert.equal(contextExposure.executionId,EXEC);
            assert.equal(contextExposure.hasInvocationToken,true);
            assert.equal(fetchResult.authorization,`Bearer ${TOKEN}`);
            assert.equal(captured.length,1);

            const pack=sdk.newPack();
            pack.setVersion('1.0.0');
            pack.addNetworkDomain('coda.io');
            pack.setUserAuthentication({
              type:sdk.AuthenticationType.CodaApiHeaderBearerToken,
              networkDomain:'coda.io',
            });
            pack.addFormula({
              name:'ReturnToken',description:'Return hidden context field',parameters:[],resultType:sdk.ValueType.String,
              connectionRequirement:sdk.ConnectionRequirement.Required,
              execute:async(_params,context)=>String(context.invocationToken),
            });
            const metadata=compilePackMetadata(pack);
            let uploadValidation={accepted:false,error:null};
            try{
              const validated=await validatePackVersionMetadata(metadata,'1.17.1');
              uploadValidation={accepted:true,defaultAuthentication:validated.defaultAuthentication,networkDomains:validated.networkDomains};
            }catch(e){uploadValidation={accepted:false,error:String(e&&e.message||e)};}

            const result={
              pass:true,sdkVersion:require(path.join(sdkRoot,'package.json')).version,
              isolatedVmVersion:require('isolated-vm/package.json').version,nodeVersion:process.version,
              canonicalPath:'injectExecutionContext(copy invocationToken) -> untrusted Pack context.invocationToken; AuthenticatingFetcher(CodaApiHeaderBearerToken) -> Authorization Bearer invocationToken',
              contextExposure,fetchResult,captured,uploadValidation,
              sameValueExposedAndUsedAsBearer:contextExposure.token===TOKEN && fetchResult.authorization===`Bearer ${TOKEN}`,
              syntheticOnly:true,productionRequestCount:0,
              securityDecision:uploadValidation.accepted
                ? 'ESCALATE_RAW_FIRST_PARTY_BEARER_EXPOSURE_CANDIDATE'
                : 'HOLD_INTERNAL_AUTH_TYPE_UPLOAD_REJECTED',
              thunkBundleSha256:crypto.createHash('sha256').update(fs.readFileSync(thunkPath)).digest('hex'),
            };
            fs.writeFileSync('evidence/RESULT.json',JSON.stringify(result,null,2)+'\n');
            fs.writeFileSync('evidence/COMPILED_METADATA.json',JSON.stringify(metadata,null,2)+'\n');
            rt.isolate.dispose();
          }
          main().then(async()=>{await close(server);console.log(fs.readFileSync('evidence/RESULT.json','utf8'));}).catch(async e=>{try{if(server)await close(server)}catch(_){};console.error(e&&e.stack||e);process.exit(1);});
          NODE

          node gate.js | tee evidence/TEST_OUTPUT.txt
          jq -e '.pass == true and .sameValueExposedAndUsedAsBearer == true and .productionRequestCount == 0' evidence/RESULT.json >/dev/null
          sha256sum gate.js pack-bundle.js pack-bundle.js.map package.json package-lock.json evidence/RESULT.json evidence/COMPILED_METADATA.json evidence/TEST_OUTPUT.txt > evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superhuman-invocation-token-capability-gate
          path: invocation-token-gate/evidence/
          retention-days: 1
          if-no-files-found: warn

      - name: Commit compact result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          jq '{pass,sdkVersion,isolatedVmVersion,nodeVersion,canonicalPath,contextExposure,fetchResult,uploadValidation,sameValueExposedAndUsedAsBearer,syntheticOnly,productionRequestCount,securityDecision,thunkBundleSha256}' invocation-token-gate/evidence/RESULT.json > public-intake-status/superhuman-invocation-token-capability-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-invocation-token-capability-result.json
          git commit -m 'chore: record invocation-token capability boundary gate'
          git push
