name: Temporary Superhuman Iterable link public gate

on:
  push:
    branches: [research/superhuman-desktop-20260808]
    paths: [.github/workflows/superhuman-iterable-link-public-gate-20260808.yml]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Query public archives and one synthetic non-following request
        shell: bash
        run: |
          set -euo pipefail
          rm -rf iterable-gate
          mkdir -p iterable-gate/raw iterable-gate/evidence

          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request, urllib.error

          root = pathlib.Path('iterable-gate')
          raw = root / 'raw'
          evidence = root / 'evidence'
          ua = 'Mozilla/5.0 authorized-security-research bounded-public-gate'

          def fetch(name, url, *, follow=True, max_bytes=5_000_000):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener() if follow else urllib.request.build_opener(NoRedirect)
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': '*/*'})
              out = {'url': url, 'follow_redirects': follow}
              try:
                  with opener.open(req, timeout=30) as r:
                      body = r.read(max_bytes)
                      out.update({
                          'status': r.status,
                          'final_url': r.geturl(),
                          'headers': dict(r.headers.items()),
                          'size': len(body),
                          'sha256': hashlib.sha256(body).hexdigest(),
                      })
              except urllib.error.HTTPError as e:
                  body = e.read(max_bytes)
                  out.update({
                      'status': e.code,
                      'final_url': e.geturl(),
                      'headers': dict(e.headers.items()) if e.headers else {},
                      'size': len(body),
                      'sha256': hashlib.sha256(body).hexdigest(),
                      'http_error': str(e),
                  })
              except Exception as e:
                  out['error'] = repr(e)
                  body = b''
              (raw / f'{name}.body').write_bytes(body)
              (raw / f'{name}.json').write_text(json.dumps(out, indent=2) + '\n')
              return out, body

          results = {}
          # Public archive/search APIs only; no authentication and no scan submission.
          results['urlscan'], _ = fetch(
              'urlscan',
              'https://urlscan.io/api/v1/search/?q=domain%3Aiterable-links.superhuman.com&size=100',
          )
          results['commoncrawl_catalog'], catalog_body = fetch(
              'commoncrawl-catalog',
              'https://index.commoncrawl.org/collinfo.json',
          )
          indexes = []
          try:
              catalog = json.loads(catalog_body)
              indexes = [row['id'] for row in catalog[:4] if row.get('id')]
          except Exception:
              pass
          results['commoncrawl_indexes'] = indexes
          cc_rows = []
          for index in indexes:
              query = urllib.parse.urlencode({
                  'url': 'iterable-links.superhuman.com/a/*',
                  'output': 'json',
                  'filter': 'status:200|301|302|303|307|308',
              })
              meta, body = fetch(f'cc-{index}', f'https://index.commoncrawl.org/{index}-index?{query}')
              text = body.decode('utf-8', 'replace')
              for line in text.splitlines()[:1000]:
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  cc_rows.append({
                      'index': index,
                      'url': row.get('url'),
                      'status': row.get('status'),
                      'timestamp': row.get('timestamp'),
                      'redirect': row.get('redirect'),
                      'digest': row.get('digest'),
                  })
          results['commoncrawl_row_count'] = len(cc_rows)
          (evidence / 'commoncrawl-rows.json').write_text(json.dumps(cc_rows, indent=2) + '\n')

          # Bounded direct checks. Redirects are disabled; the synthetic path contains no real token.
          direct_urls = {
              'root': 'https://iterable-links.superhuman.com/',
              'aasa': 'https://iterable-links.superhuman.com/.well-known/apple-app-site-association',
              'assetlinks': 'https://iterable-links.superhuman.com/.well-known/assetlinks.json',
              'synthetic_a': 'https://iterable-links.superhuman.com/a/LAB_ONLY_SUPERHUMAN_SECURITY_RESEARCH_20260808',
          }
          direct = {}
          for name, url in direct_urls.items():
              direct[name], _ = fetch(f'direct-{name}', url, follow=False, max_bytes=1_000_000)
          results['direct'] = direct

          # Extract public URL candidates from urlscan response without following them.
          candidates = []
          try:
              urlscan = json.loads((raw / 'urlscan.body').read_text(errors='replace'))
              for row in urlscan.get('results', []):
                  page = row.get('page') or {}
                  task = row.get('task') or {}
                  for candidate in [page.get('url'), page.get('redirected'), task.get('url')]:
                      if isinstance(candidate, str) and candidate.startswith('https://iterable-links.superhuman.com/a/'):
                          candidates.append(candidate)
          except Exception:
              pass
          results['public_candidate_count'] = len(set(candidates))
          (evidence / 'public-candidates.json').write_text(json.dumps(sorted(set(candidates)), indent=2) + '\n')

          verdict = {
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_commit': os.environ['GITHUB_SHA'],
              'domain': 'iterable-links.superhuman.com',
              'commoncrawl_row_count': len(cc_rows),
              'public_candidate_count': len(set(candidates)),
              'synthetic_status': direct.get('synthetic_a', {}).get('status'),
              'synthetic_location': (direct.get('synthetic_a', {}).get('headers') or {}).get('Location'),
              'attacker_destination_control_proven': False,
              'submit_ready': False,
              'decision': 'HOLD_PUBLIC_LINK_PRIMITIVE_NOT_PROVEN',
              'results': results,
          }
          (evidence / 'RESULT.json').write_text(json.dumps(verdict, indent=2) + '\n')
          PY
          find iterable-gate/evidence -type f -print0 | sort -z | xargs -0 sha256sum > iterable-gate/evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superhuman-iterable-link-public-gate
          path: iterable-gate/evidence/
          if-no-files-found: warn
          retention-days: 1
