name: Temporary Superhuman isolated-vm error-boundary gate

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-ivm-error-boundary-gate-20260808-v6.yml]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install exact runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ivm-error-gate/work ivm-error-gate/evidence
          cd ivm-error-gate/work
          npm init -y >/dev/null
          npm install --no-audit --no-fund isolated-vm@6.0.2

      - name: Test host Error and rejection-object property transfer
        shell: bash
        run: |
          set -euo pipefail
          cat > ivm-error-gate/work/gate.js <<'NODE'
          'use strict';
          const fs = require('fs');
          const ivm = require('isolated-vm');

          const LAB = 'LAB_ONLY_AUTHORIZATION_BEARER_20260808';

          async function runCase(kind) {
            const isolate = new ivm.Isolate({memoryLimit: 64});
            const context = await isolate.createContext();
            const jail = context.global;
            await jail.set('global', jail.derefInto());

            const hostThrower = async () => {
              if (kind === 'plain-object') {
                throw {
                  message: 'plain object rejection',
                  secret: LAB,
                  options: {headers: {Authorization: `Bearer ${LAB}`}},
                  nested: {token: LAB},
                };
              }
              const error = new Error(`host failure ${kind}`);
              error.name = kind === 'status-error' ? 'StatusCodeError' : 'Error';
              error.secret = LAB;
              error.options = {
                uri: 'https://api.example.invalid/resource',
                headers: {Authorization: `Bearer ${LAB}`, 'X-Lab': LAB},
              };
              error.response = {statusCode: 500, headers: {'x-reflect': LAB}, body: 'failure'};
              error.nested = {token: LAB};
              throw error;
            };

            await context.evalClosure(
              `global.callHost = async function() {
                 return $0.apply(undefined, [], {
                   arguments: {copy: true},
                   result: {copy: true, promise: true},
                 });
               };`,
              [hostThrower],
              {arguments: {reference: true}},
            );

            const result = await context.eval(
              `(async () => {
                 try {
                   await callHost();
                   return {caught: false};
                 } catch (error) {
                   const safe = value => {
                     try { return JSON.parse(JSON.stringify(value)); }
                     catch (_) { return String(value); }
                   };
                   return {
                     caught: true,
                     constructorName: error && error.constructor && error.constructor.name,
                     name: error && error.name,
                     message: error && error.message,
                     ownNames: error ? Object.getOwnPropertyNames(error) : [],
                     enumerableKeys: error ? Object.keys(error) : [],
                     secret: error && error.secret,
                     options: safe(error && error.options),
                     response: safe(error && error.response),
                     nested: safe(error && error.nested),
                     serialized: safe(error),
                     stackContainsLab: Boolean(error && error.stack && error.stack.includes('${LAB}')),
                   };
                 }
               })()`,
              {promise: true, copy: true},
            );
            isolate.dispose();
            return result;
          }

          (async () => {
            const cases = {};
            for (const kind of ['error', 'status-error', 'plain-object']) {
              try { cases[kind] = await runCase(kind); }
              catch (error) { cases[kind] = {gateError: String(error && (error.stack || error))}; }
            }
            const text = JSON.stringify(cases);
            const leaked = text.includes(LAB);
            const result = {
              dependency: 'isolated-vm@6.0.2',
              labMarker: LAB,
              leakedAcrossBoundary: leaked,
              cases,
              decision: leaked
                ? 'POSITIVE_CUSTOM_HOST_ERROR_DATA_CROSSES_TO_UNTRUSTED_ISOLATE'
                : 'NEGATIVE_CUSTOM_HOST_ERROR_PROPERTIES_ARE_NOT_EXPOSED',
            };
            fs.writeFileSync('../evidence/result.json', JSON.stringify(result, null, 2) + '\n');
            fs.writeFileSync('../evidence/decision.txt', result.decision + '\n');
          })().catch(error => {
            fs.writeFileSync('../evidence/fatal.txt', String(error && (error.stack || error)) + '\n');
            process.exitCode = 2;
          });
          NODE
          cd ivm-error-gate/work
          node gate.js
          test -s ../evidence/result.json

      - name: Create integrity data
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ivm-error-gate/evidence/* | sort > ivm-error-gate/evidence/SHA256SUMS.txt
          python3 - <<'PY'
          import json, pathlib, os
          root = pathlib.Path('ivm-error-gate/evidence')
          result = json.loads((root/'result.json').read_text())
          status = {
            'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
            'source_commit': os.environ['GITHUB_SHA'],
            'dependency': result['dependency'],
            'leakedAcrossBoundary': result['leakedAcrossBoundary'],
            'decision': result['decision'],
          }
          pathlib.Path('public-intake-status/superhuman-ivm-error-boundary.json').parent.mkdir(parents=True, exist_ok=True)
          pathlib.Path('public-intake-status/superhuman-ivm-error-boundary.json').write_text(json.dumps(status, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-ivm-error-boundary-gate
          path: ivm-error-gate/evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Commit concise status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-intake-status/superhuman-ivm-error-boundary.json
          git commit -m 'chore: record isolated-vm error-boundary result'
          git push
