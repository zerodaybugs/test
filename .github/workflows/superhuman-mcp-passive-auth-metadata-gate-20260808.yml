name: Temporary Superhuman MCP passive auth metadata gate

on:
  push:
    branches: [research/superhuman-desktop-20260808]
    paths: [.github/workflows/superhuman-mcp-passive-auth-metadata-gate-20260808.yml]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Perform bounded unauthenticated metadata and protocol checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mcp-passive-gate
          mkdir -p mcp-passive-gate/raw mcp-passive-gate/evidence

          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, urllib.parse

          root = pathlib.Path('mcp-passive-gate')
          raw = root / 'raw'
          evidence = root / 'evidence'
          base = 'https://mcp.mail.superhuman.com'
          attacker_origin = 'https://attacker.example'
          ua = 'Superhuman-authorized-security-research/2026-08-08'

          cases = [
              ('mcp_get', 'GET', base + '/mcp', [], None),
              ('mcp_options', 'OPTIONS', base + '/mcp', [
                  'Origin: ' + attacker_origin,
                  'Access-Control-Request-Method: POST',
                  'Access-Control-Request-Headers: authorization,content-type,mcp-protocol-version,mcp-session-id',
              ], None),
              ('mcp_initialize_noauth', 'POST', base + '/mcp', [
                  'Origin: ' + attacker_origin,
                  'Content-Type: application/json',
                  'Accept: application/json, text/event-stream',
                  'MCP-Protocol-Version: 2025-06-18',
              ], json.dumps({
                  'jsonrpc':'2.0','id':'lab-init-noauth','method':'initialize',
                  'params':{
                      'protocolVersion':'2025-06-18',
                      'capabilities':{},
                      'clientInfo':{'name':'bounded-security-gate','version':'1.0'}
                  }
              })),
              ('mcp_initialize_bogus_bearer', 'POST', base + '/mcp', [
                  'Origin: ' + attacker_origin,
                  'Authorization: Bearer LAB_ONLY_INVALID_TOKEN_20260808',
                  'Content-Type: application/json',
                  'Accept: application/json, text/event-stream',
                  'MCP-Protocol-Version: 2025-06-18',
              ], json.dumps({
                  'jsonrpc':'2.0','id':'lab-init-bogus','method':'initialize',
                  'params':{
                      'protocolVersion':'2025-06-18',
                      'capabilities':{},
                      'clientInfo':{'name':'bounded-security-gate','version':'1.0'}
                  }
              })),
              ('protected_resource_root', 'GET', base + '/.well-known/oauth-protected-resource', [], None),
              ('protected_resource_mcp_suffix', 'GET', base + '/.well-known/oauth-protected-resource/mcp', [], None),
              ('protected_resource_mcp_prefix', 'GET', base + '/mcp/.well-known/oauth-protected-resource', [], None),
              ('authorization_server', 'GET', base + '/.well-known/oauth-authorization-server', [], None),
              ('openid_configuration', 'GET', base + '/.well-known/openid-configuration', [], None),
          ]

          def run_case(name, method, url, headers, body):
              header_path = raw / f'{name}.headers'
              body_path = raw / f'{name}.body'
              cmd = [
                  'curl','--silent','--show-error','--max-time','25','--max-redirs','0',
                  '--request',method,'--user-agent',ua,
                  '--dump-header',str(header_path),'--output',str(body_path),
                  '--write-out','%{http_code}',url
              ]
              for header in headers:
                  cmd += ['--header', header]
              if body is not None:
                  cmd += ['--data-binary', body]
              proc = subprocess.run(cmd, text=True, capture_output=True)
              status_text = proc.stdout.strip()[-3:] if proc.stdout.strip() else '000'
              try: status = int(status_text)
              except Exception: status = 0
              header_text = header_path.read_text(errors='replace') if header_path.exists() else ''
              body_bytes = body_path.read_bytes()[:1_000_000] if body_path.exists() else b''
              if body_path.exists() and body_path.stat().st_size > 1_000_000:
                  body_path.write_bytes(body_bytes)
              header_map = {}
              for line in header_text.splitlines():
                  if ':' in line:
                      k,v = line.split(':',1)
                      header_map.setdefault(k.strip().lower(), []).append(v.strip())
              parsed_json = None
              try: parsed_json = json.loads(body_bytes.decode('utf-8'))
              except Exception: pass
              result = {
                  'name': name, 'method': method, 'url': url,
                  'status': status, 'curl_exit': proc.returncode,
                  'curl_stderr': proc.stderr[-2000:],
                  'headers': header_map,
                  'body_size_capped': len(body_bytes),
                  'body_sha256': hashlib.sha256(body_bytes).hexdigest(),
                  'json': parsed_json,
              }
              (raw / f'{name}.json').write_text(json.dumps(result, indent=2) + '\n')
              return result

          results = [run_case(*case) for case in cases]

          # Follow only metadata URLs explicitly disclosed by the server, never authorization or registration actions.
          disclosed = set()
          for row in results:
              auth_headers = row.get('headers', {}).get('www-authenticate', [])
              for value in auth_headers:
                  for match in re.findall(r'(?:resource_metadata|authorization_uri)="([^"]+)"', value):
                      if match.startswith('https://'):
                          disclosed.add(match)
              obj = row.get('json')
              if isinstance(obj, dict):
                  for key in ('authorization_servers','issuer'):
                      val = obj.get(key)
                      values = val if isinstance(val, list) else [val]
                      for item in values:
                          if isinstance(item, str) and item.startswith('https://'):
                              disclosed.add(item)

          metadata_results = []
          for index, url in enumerate(sorted(disclosed)[:8]):
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != 'https':
                  continue
              metadata_results.append(run_case(f'disclosed_{index}', 'GET', url, [], None))
              if parsed.path in ('','/'):
                  for suffix in ('/.well-known/oauth-authorization-server','/.well-known/openid-configuration'):
                      metadata_results.append(run_case(f'disclosed_{index}_{suffix.rsplit("/",1)[-1]}','GET',urllib.parse.urljoin(url,suffix),[],None))

          all_results = results + metadata_results
          reflected_origins = []
          wildcard_with_credentials = []
          unauthorized_success = []
          session_ids_without_auth = []
          registration_endpoints = []
          redirect_uris = []
          for row in all_results:
              h = row.get('headers', {})
              acao = h.get('access-control-allow-origin', [])
              acac = [v.lower() for v in h.get('access-control-allow-credentials', [])]
              if attacker_origin in acao:
                  reflected_origins.append(row['name'])
              if '*' in acao and 'true' in acac:
                  wildcard_with_credentials.append(row['name'])
              if row['name'].startswith('mcp_initialize') and 200 <= row.get('status',0) < 300:
                  unauthorized_success.append(row['name'])
              if row['name'].startswith('mcp_') and row.get('status') in (401,403):
                  if h.get('mcp-session-id'):
                      session_ids_without_auth.append(row['name'])
              obj = row.get('json')
              if isinstance(obj, dict):
                  if isinstance(obj.get('registration_endpoint'), str):
                      registration_endpoints.append(obj['registration_endpoint'])
                  rus = obj.get('redirect_uris')
                  if isinstance(rus, list): redirect_uris.extend([x for x in rus if isinstance(x,str)])

          verdict = {
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_commit': os.environ['GITHUB_SHA'],
              'endpoint': base + '/mcp',
              'request_count': len(all_results),
              'reflected_attacker_origin_cases': reflected_origins,
              'wildcard_origin_with_credentials_cases': wildcard_with_credentials,
              'unauthenticated_initialize_success_cases': unauthorized_success,
              'session_id_issued_on_unauthorized_cases': session_ids_without_auth,
              'registration_endpoints_disclosed': sorted(set(registration_endpoints)),
              'attacker_controlled_redirect_accepted': False,
              'cross_account_or_mailbox_access_proven': False,
              'submit_ready': False,
              'decision': 'PASSIVE_METADATA_ONLY_REVIEW_REQUIRED',
              'results': all_results,
          }
          (evidence / 'RESULT.json').write_text(json.dumps(verdict, indent=2) + '\n')
          PY

          find mcp-passive-gate/evidence -type f -print0 | sort -z | xargs -0 sha256sum > mcp-passive-gate/evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superhuman-mcp-passive-auth-metadata-gate
          path: |
            mcp-passive-gate/evidence/
            mcp-passive-gate/raw/*.json
            mcp-passive-gate/raw/*.headers
          if-no-files-found: warn
          retention-days: 1
