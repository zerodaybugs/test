name: Isolated Superhuman MCP passive gate

on:
  push:
    branches: [research/superhuman-mcp-passive-20260808]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded unauthenticated checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mcp-gate/raw mcp-gate/evidence
          cat > mcp-gate/run.py <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,urllib.parse
          out=pathlib.Path('mcp-gate'); raw=out/'raw'; ev=out/'evidence'
          base='https://mcp.mail.superhuman.com'; origin='https://attacker.example'
          cases=[
            ('get','GET',base+'/mcp',[],None),
            ('options','OPTIONS',base+'/mcp',[f'Origin: {origin}','Access-Control-Request-Method: POST','Access-Control-Request-Headers: authorization,content-type,mcp-protocol-version,mcp-session-id'],None),
            ('init_noauth','POST',base+'/mcp',[f'Origin: {origin}','Content-Type: application/json','Accept: application/json, text/event-stream','MCP-Protocol-Version: 2025-06-18'],json.dumps({'jsonrpc':'2.0','id':'lab-noauth','method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'bounded-gate','version':'1'}}})),
            ('init_bogus','POST',base+'/mcp',[f'Origin: {origin}','Authorization: Bearer LAB_ONLY_INVALID_20260808','Content-Type: application/json','Accept: application/json, text/event-stream','MCP-Protocol-Version: 2025-06-18'],json.dumps({'jsonrpc':'2.0','id':'lab-bogus','method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'bounded-gate','version':'1'}}})),
            ('pr_root','GET',base+'/.well-known/oauth-protected-resource',[],None),
            ('pr_mcp','GET',base+'/.well-known/oauth-protected-resource/mcp',[],None),
            ('auth_meta','GET',base+'/.well-known/oauth-authorization-server',[],None),
            ('oidc','GET',base+'/.well-known/openid-configuration',[],None),
          ]
          def run(name,method,url,headers,body):
            hp=raw/f'{name}.headers'; bp=raw/f'{name}.body'
            cmd=['curl','-sS','--max-time','20','--max-redirs','0','-X',method,'-A','bounded-authorized-research','-D',str(hp),'-o',str(bp),'-w','%{http_code}',url]
            for h in headers: cmd+=['-H',h]
            if body is not None: cmd+=['--data-binary',body]
            p=subprocess.run(cmd,text=True,capture_output=True)
            try: status=int(p.stdout.strip()[-3:])
            except: status=0
            ht=hp.read_text(errors='replace') if hp.exists() else ''; bb=bp.read_bytes()[:1000000] if bp.exists() else b''
            hm={}
            for line in ht.splitlines():
              if ':' in line:
                k,v=line.split(':',1); hm.setdefault(k.strip().lower(),[]).append(v.strip())
            try: obj=json.loads(bb.decode())
            except: obj=None
            r={'name':name,'method':method,'url':url,'status':status,'curl_exit':p.returncode,'headers':hm,'body_size':len(bb),'body_sha256':hashlib.sha256(bb).hexdigest(),'json':obj}
            (raw/f'{name}.json').write_text(json.dumps(r,indent=2)+'\n'); return r
          rows=[run(*c) for c in cases]
          disclosed=set()
          for r in rows:
            for h in r['headers'].get('www-authenticate',[]):
              disclosed.update(x for x in re.findall(r'(?:resource_metadata|authorization_uri)="([^"]+)"',h) if x.startswith('https://'))
            if isinstance(r['json'],dict):
              vals=r['json'].get('authorization_servers',[])
              if isinstance(vals,str): vals=[vals]
              disclosed.update(x for x in vals if isinstance(x,str) and x.startswith('https://'))
          for i,url in enumerate(sorted(disclosed)[:6]): rows.append(run(f'disclosed_{i}','GET',url,[],None))
          reflected=[]; wildcard_cred=[]; unauth2xx=[]; unauth_session=[]; registrations=[]
          for r in rows:
            h=r['headers']; acao=h.get('access-control-allow-origin',[]); acac=[x.lower() for x in h.get('access-control-allow-credentials',[])]
            if origin in acao: reflected.append(r['name'])
            if '*' in acao and 'true' in acac: wildcard_cred.append(r['name'])
            if r['name'].startswith('init_') and 200<=r['status']<300: unauth2xx.append(r['name'])
            if r['name'].startswith('init_') and h.get('mcp-session-id'): unauth_session.append(r['name'])
            if isinstance(r['json'],dict) and isinstance(r['json'].get('registration_endpoint'),str): registrations.append(r['json']['registration_endpoint'])
          result={'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'source_commit':os.environ['GITHUB_SHA'],'request_count':len(rows),'reflected_attacker_origin_cases':reflected,'wildcard_origin_with_credentials_cases':wildcard_cred,'unauthenticated_initialize_success_cases':unauth2xx,'session_id_issued_without_valid_auth_cases':unauth_session,'registration_endpoints_disclosed':sorted(set(registrations)),'cross_account_or_mailbox_access_proven':False,'submit_ready':False,'decision':'REVIEW_PASSIVE_RESULT','results':rows}
          (ev/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          python3 mcp-gate/run.py
          sha256sum mcp-gate/evidence/RESULT.json mcp-gate/raw/*.json mcp-gate/raw/*.headers > mcp-gate/evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-superhuman-mcp-passive-gate
          path: mcp-gate/
          retention-days: 1
          if-no-files-found: error
