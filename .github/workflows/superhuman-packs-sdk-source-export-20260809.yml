name: Temporary Superhuman Packs SDK source export

on:
  push:
    branches: [research/superhuman-sdk-source-20260809]
    paths: [.github/workflows/superhuman-packs-sdk-source-export-20260809.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: coda/packs-sdk
          ref: v1.17.1
          path: source/v1.17.1
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: coda/packs-sdk
          ref: main
          path: source/main
          fetch-depth: 1

      - name: Seal revisions and build provenance-preserving archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export public-intake-status
          stable_sha="$(git -C source/v1.17.1 rev-parse HEAD)"
          main_sha="$(git -C source/main rev-parse HEAD)"
          stable_tree="$(git -C source/v1.17.1 rev-parse HEAD^{tree})"
          main_tree="$(git -C source/main rev-parse HEAD^{tree})"
          rm -rf source/v1.17.1/.git source/main/.git
          python3 - <<PY
          import json, pathlib
          result = {
            'stable_ref': 'v1.17.1',
            'stable_commit': '$stable_sha',
            'stable_tree': '$stable_tree',
            'main_ref': 'main',
            'main_commit': '$main_sha',
            'main_tree': '$main_tree',
          }
          pathlib.Path('export/PROVENANCE.json').write_text(json.dumps(result, indent=2) + '\n')
          pathlib.Path('public-intake-status/superhuman-packs-sdk-source-export.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          find source -type f -print0 | sort -z | xargs -0 sha256sum > export/SOURCE_SHA256SUMS.txt
          tar --sort=name --mtime='UTC 2026-08-09' --owner=0 --group=0 --numeric-owner \
            -czf export/superhuman-packs-sdk-v1.17.1-and-main-source.tar.gz source export/PROVENANCE.json export/SOURCE_SHA256SUMS.txt
          sha256sum export/superhuman-packs-sdk-v1.17.1-and-main-source.tar.gz > export/superhuman-packs-sdk-v1.17.1-and-main-source.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-packs-sdk-v1.17.1-and-main-source
          path: export/
          retention-days: 1
          if-no-files-found: error

      - name: Commit compact provenance
        if: github.event_name == 'push'
        shell: bash
        working-directory: control
        run: |
          set -euo pipefail
          cp ../public-intake-status/superhuman-packs-sdk-source-export.json public-intake-status/superhuman-packs-sdk-source-export.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-packs-sdk-source-export.json
          git commit -m 'chore: record official Packs SDK source provenance'
          git push
