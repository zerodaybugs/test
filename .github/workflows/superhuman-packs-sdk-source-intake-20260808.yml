name: Temporary Superhuman Packs SDK source intake

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-packs-sdk-source-intake-20260808.yml]

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Acquire exact public source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdk-intake
          mkdir -p sdk-intake
          git clone --depth 1 --branch v1.17.1 https://github.com/coda/packs-sdk.git sdk-intake/packs-sdk-v1.17.1
          git -C sdk-intake/packs-sdk-v1.17.1 rev-parse HEAD > sdk-intake/TAG_COMMIT.txt
          git -C sdk-intake/packs-sdk-v1.17.1 status --porcelain=v1 > sdk-intake/WORKTREE_STATUS.txt
          test ! -s sdk-intake/WORKTREE_STATUS.txt
          find sdk-intake/packs-sdk-v1.17.1 -type f -not -path '*/.git/*' -print0 | sort -z | xargs -0 sha256sum > sdk-intake/SOURCE_SHA256SUMS.txt
          (cd sdk-intake && zip -q -r packs-sdk-v1.17.1-source.zip packs-sdk-v1.17.1 TAG_COMMIT.txt SOURCE_SHA256SUMS.txt)
          sha256sum sdk-intake/packs-sdk-v1.17.1-source.zip > sdk-intake/packs-sdk-v1.17.1-source.zip.sha256
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('sdk-intake')
          archive=root/'packs-sdk-v1.17.1-source.zip'
          status={
            'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
            'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'source_commit': os.environ['GITHUB_SHA'],
            'tag': 'v1.17.1',
            'tag_commit': (root/'TAG_COMMIT.txt').read_text().strip(),
            'archive_size': archive.stat().st_size,
            'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
          }
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-packs-sdk-v1.17.1-source
          path: |
            sdk-intake/packs-sdk-v1.17.1-source.zip
            sdk-intake/packs-sdk-v1.17.1-source.zip.sha256
            sdk-intake/TAG_COMMIT.txt
            sdk-intake/SOURCE_SHA256SUMS.txt
            sdk-intake/status.json
          if-no-files-found: error
          retention-days: 1

      - name: Record run id for polling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-intake-status
          cp sdk-intake/status.json public-intake-status/superhuman-packs-sdk-v1.17.1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-intake-status/superhuman-packs-sdk-v1.17.1.json
          git commit -m 'chore: record Superhuman Packs SDK source intake status'
          git push
