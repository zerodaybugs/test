name: Temporary Superhuman Packs URL credential error leak gate V2

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-packs-url-credential-error-leak-gate-v2-20260808.yml]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact stable SDK including isolated-vm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf url-secret-gate
          mkdir -p url-secret-gate
          git clone --depth 1 --branch v1.17.1 https://github.com/coda/packs-sdk.git url-secret-gate/packs-sdk
          cd url-secret-gate/packs-sdk
          git rev-parse HEAD > ../TAG_COMMIT.txt
          npm install --no-audit --no-fund --legacy-peer-deps
          node -e "const ivm=require('isolated-vm'); console.log('isolated-vm loaded', !!ivm.Isolate)" | tee ../IVM_STATUS.txt

      - name: Run host and exact isolated-vm bridge matrix
        shell: bash
        run: |
          set -euo pipefail
          cd url-secret-gate/packs-sdk
          cat > url_credential_error_leak_gate_v2.ts <<'TS'
          import assert from 'assert';
          import fs from 'fs';
          import {AuthenticatingFetcher} from './testing/fetcher';
          import {AuthenticationType} from './types';
          import {createIsolate, createIsolateContext, getThunkPath, injectExecutionContext, registerBundle} from './runtime/bootstrap';

          const SECRET='LAB_URL_CREDENTIAL_SECRET_20260808';
          const DOMAIN='example.invalid';
          const HOST=`zd-nxdomain-${Date.now()}.${DOMAIN}`;
          const BASE=`https://${HOST}/unreachable`;

          type Case={name:string,fetcher:any,url:string,expectLeak:boolean};
          function makeCases(): Case[] {
            const inv='LAB_INVOCATION_TOKEN_20260808';
            return [
              {name:'QueryParamToken',expectLeak:true,url:BASE,fetcher:new AuthenticatingFetcher(()=>{},
                {type:AuthenticationType.QueryParamToken,paramName:'api_key'} as any,[DOMAIN],{paramValue:SECRET} as any,inv)},
              {name:'MultiQueryParamToken',expectLeak:true,url:BASE,fetcher:new AuthenticatingFetcher(()=>{},
                {type:AuthenticationType.MultiQueryParamToken,params:[{name:'api_key'}]} as any,[DOMAIN],{params:{api_key:SECRET}} as any,inv)},
              {name:'OAuth2_tokenQueryParam',expectLeak:true,url:BASE,fetcher:new AuthenticatingFetcher(()=>{},
                {type:AuthenticationType.OAuth2,authorizationUrl:'https://oauth.example.invalid/auth',tokenUrl:'https://oauth.example.invalid/token',scopes:['read'],tokenQueryParam:'access_token'} as any,
                [DOMAIN],{clientId:'lab',clientSecret:'lab',accessToken:SECRET,refreshToken:'LAB_REFRESH',scopes:['read']} as any,inv)},
              {name:'Custom_URL_template',expectLeak:true,url:`${BASE}?credential={{secret-${inv}}}`,fetcher:new AuthenticatingFetcher(()=>{},
                {type:AuthenticationType.Custom} as any,[DOMAIN],{params:{secret:SECRET}} as any,inv)},
              {name:'HeaderBearerToken_negative',expectLeak:false,url:BASE,fetcher:new AuthenticatingFetcher(()=>{},
                {type:AuthenticationType.HeaderBearerToken} as any,[DOMAIN],{token:SECRET} as any,inv)},
              {name:'Custom_header_negative',expectLeak:false,url:BASE,fetcher:new AuthenticatingFetcher(()=>{},
                {type:AuthenticationType.Custom} as any,[DOMAIN],{params:{secret:SECRET}} as any,inv)},
            ];
          }

          async function hostError(c:Case){
            const request:any={method:'GET',url:c.url};
            if(c.name==='Custom_header_negative') request.headers={'X-Lab-Secret':'{{secret-LAB_INVOCATION_TOKEN_20260808}}'};
            try{await c.fetcher.fetch(request);throw new Error('unexpected success');}
            catch(error:any){return {name:String(error?.name||''),message:String(error?.message||error),stack:String(error?.stack||''),own:Object.getOwnPropertyNames(error||{})};}
          }

          async function ivmError(c:Case){
            const isolate=createIsolate({memoryLimit:128});
            const context=await createIsolateContext(isolate);
            await registerBundle(isolate,context,getThunkPath(),'coda',false);
            await injectExecutionContext({
              context,fetcher:c.fetcher,
              temporaryBlobStorage:{async storeBlob(){throw new Error('unused')},async storeUrl(){throw new Error('unused')}} as any,
              syncStateService:undefined,logger:console,endpoint:undefined,invocationLocation:{protocolAndHost:'https://coda.io'},
              timezone:'UTC',invocationToken:'LAB_IVM',sync:undefined,authenticationName:undefined,executionId:'LAB_EXEC',previousAttemptError:undefined,
            });
            const request:any={method:'GET',url:c.url};
            if(c.name==='Custom_header_negative') request.headers={'X-Lab-Secret':'{{secret-LAB_INVOCATION_TOKEN_20260808}}'};
            try{
              return await context.evalClosure(`return (async()=>{try{await executionContext.fetcher.fetch($0);return {unexpectedSuccess:true}}catch(error){return {name:String(error&&error.name||''),message:String(error&&error.message||error),stack:String(error&&error.stack||''),own:Object.getOwnPropertyNames(error||{})}}})()`,[request],{arguments:{copy:true},result:{copy:true,promise:true}});
            }finally{isolate.dispose()}
          }

          function redact(text:string){return text.split(SECRET).join('<<REDACTED BY CODA>>')}
          async function main(){
            const rows=[];
            for(const c of makeCases()){
              const h=await hostError(c); const i=await ivmError(c);
              const hostLeak=h.message.includes(SECRET)||h.stack.includes(SECRET);
              const ivmLeak=i.message.includes(SECRET)||i.stack.includes(SECRET);
              assert.equal(hostLeak,c.expectLeak,`${c.name} host mismatch: ${h.message}`);
              assert.equal(ivmLeak,c.expectLeak,`${c.name} ivm mismatch: ${i.message}`);
              const patched=redact(i.message+'\n'+i.stack);
              assert(!patched.includes(SECRET));
              rows.push({name:c.name,expectLeak:c.expectLeak,hostLeak,ivmLeak,hostErrorName:h.name,ivmErrorName:i.name,
                hostMessage:h.message,ivmMessage:i.message,hostOwnProperties:h.own,ivmOwnProperties:i.own,
                patchedRedactionRemovesSecret:!patched.includes(SECRET)});
            }
            const result={pass:true,exactSdkTag:'v1.17.1',exactSdkCommit:fs.readFileSync('../TAG_COMMIT.txt','utf8').trim(),
              reservedNxdomainHost:HOST,declaredNetworkDomain:DOMAIN,secretMarker:SECRET,rows,
              summary:{leakingCases:rows.filter(x=>x.ivmLeak).map(x=>x.name),cleanNegativeControls:rows.filter(x=>!x.expectLeak&& !x.ivmLeak).map(x=>x.name),
                allExpectedOutcomesMatched:rows.every(x=>x.ivmLeak===x.expectLeak&&x.hostLeak===x.expectLeak)}};
            fs.writeFileSync('../RESULT.json',JSON.stringify(result,null,2)+'\n'); console.log(JSON.stringify(result,null,2));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          npx ts-node --transpile-only url_credential_error_leak_gate_v2.ts | tee ../TEST_OUTPUT.txt
          jq -e '.pass==true and .summary.allExpectedOutcomesMatched==true and (.summary.leakingCases|length)==4 and (.summary.cleanNegativeControls|length)==2' ../RESULT.json >/dev/null
          sha256sum testing/fetcher.ts testing/node_fetcher.ts runtime/bootstrap/index.ts runtime/thunk/thunk.ts \
            url_credential_error_leak_gate_v2.ts ../RESULT.json ../TEST_OUTPUT.txt ../TAG_COMMIT.txt ../IVM_STATUS.txt > ../SHA256SUMS.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superhuman-packs-url-credential-error-leak-v2
          path: |
            url-secret-gate/RESULT.json
            url-secret-gate/TEST_OUTPUT.txt
            url-secret-gate/TAG_COMMIT.txt
            url-secret-gate/IVM_STATUS.txt
            url-secret-gate/SHA256SUMS.txt
            url-secret-gate/packs-sdk/url_credential_error_leak_gate_v2.ts
            url-secret-gate/packs-sdk/testing/fetcher.ts
            url-secret-gate/packs-sdk/testing/node_fetcher.ts
            url-secret-gate/packs-sdk/runtime/bootstrap/index.ts
            url-secret-gate/packs-sdk/runtime/thunk/thunk.ts
          if-no-files-found: warn
          retention-days: 1
