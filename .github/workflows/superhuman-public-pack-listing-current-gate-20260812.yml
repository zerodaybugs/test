name: Temporary Superhuman public Pack listing current gate

on:
  push:
    branches: [research/superhuman-public-pack-listing-20260812]
    paths: [.github/workflows/superhuman-public-pack-listing-current-gate-20260812.yml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Query current public Pack listings and current official Go CRX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf superhuman-current-gate public-intake-status
          mkdir -p superhuman-current-gate/raw superhuman-current-gate/evidence public-intake-status
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, struct, urllib.error, urllib.parse, urllib.request, zipfile

          root = pathlib.Path('superhuman-current-gate')
          raw = root / 'raw'
          evidence = root / 'evidence'
          ua = 'Mozilla/5.0 authorized Superhuman bug-bounty public read-only gate'

          def fetch(name, url, max_bytes=50_000_000):
              request = urllib.request.Request(url, headers={
                  'User-Agent': ua,
                  'Accept': 'application/json,text/plain,*/*',
              })
              meta = {'name': name, 'url': url}
              body = b''
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      body = response.read(max_bytes)
                      meta.update({
                          'status': response.status,
                          'final_url': response.geturl(),
                          'headers': dict(response.headers.items()),
                      })
              except urllib.error.HTTPError as exc:
                  body = exc.read(max_bytes)
                  meta.update({
                      'status': exc.code,
                      'final_url': exc.geturl(),
                      'headers': dict(exc.headers.items()) if exc.headers else {},
                      'error': str(exc),
                  })
              except Exception as exc:
                  meta.update({'status': 0, 'error': repr(exc)})
              meta.update({
                  'size': len(body),
                  'sha256': hashlib.sha256(body).hexdigest(),
              })
              (raw / f'{name}.body').write_bytes(body)
              (raw / f'{name}.json').write_text(json.dumps(meta, indent=2) + '\n')
              return meta, body

          hosts = ['https://coda.io', 'https://docs.superhuman.com']
          pack_ids = [1003, 1004, 1013, 1052, 33623]
          listing_rows = []
          external_urls = set()

          for host in hosts:
              host_key = urllib.parse.urlparse(host).hostname.replace('.', '_')
              list_url = host + '/apis/v1/packs/listings?' + urllib.parse.urlencode({
                  'packIds': ','.join(map(str, pack_ids)),
                  'limit': '100',
              })
              meta, body = fetch(f'{host_key}_listings', list_url)
              try:
                  obj = json.loads(body)
              except Exception:
                  obj = None
              if isinstance(obj, dict):
                  for item in obj.get('items') or []:
                      if isinstance(item, dict):
                          listing_rows.append({'host': host, 'source': 'list', **item})
                          if isinstance(item.get('externalMetadataUrl'), str):
                              external_urls.add(item['externalMetadataUrl'])

              for pack_id in pack_ids:
                  meta, body = fetch(
                      f'{host_key}_pack_{pack_id}',
                      f'{host}/apis/v1/packs/{pack_id}/listing',
                  )
                  try:
                      obj = json.loads(body)
                  except Exception:
                      obj = None
                  row = {
                      'host': host,
                      'source': 'detail',
                      'requestedPackId': pack_id,
                      'status': meta.get('status'),
                      'finalUrl': meta.get('final_url'),
                  }
                  if isinstance(obj, dict):
                      for key in (
                          'packId', 'id', 'name', 'packVersion', 'sdkVersion',
                          'releaseId', 'lastReleasedAt', 'externalMetadataUrl',
                          'disabled', 'certifiedAgent', 'packCategoryType'
                      ):
                          if key in obj:
                              row[key] = obj[key]
                      if isinstance(obj.get('externalMetadataUrl'), str):
                          external_urls.add(obj['externalMetadataUrl'])
                  listing_rows.append(row)

          metadata_rows = []
          version_markers = re.compile(
              r'(?:^|/)(?:v?\d+\.\d+\.\d+|releases?|versions?)/|'
              r'[a-f0-9]{32,}|(?:release|version)[=_/-]?\d+',
              re.I,
          )
          for index, url in enumerate(sorted(external_urls)):
              if not url.startswith('https://'):
                  continue
              meta, body = fetch(f'external_metadata_{index}', url)
              try:
                  obj = json.loads(body)
              except Exception:
                  obj = None
              metadata_rows.append({
                  'url': url,
                  'status': meta.get('status'),
                  'finalUrl': meta.get('final_url'),
                  'size': meta.get('size'),
                  'sha256': meta.get('sha256'),
                  'urlLooksVersionBound': bool(version_markers.search(url)),
                  'topLevelKeys': sorted(obj.keys())[:100] if isinstance(obj, dict) else [],
                  'formulaCount': len(obj.get('formulas') or []) if isinstance(obj, dict) else None,
                  'syncTableCount': len(obj.get('syncTables') or []) if isinstance(obj, dict) else None,
              })

          crx_url = (
              'https://clients2.google.com/service/update2/crx'
              '?response=redirect&prod=chromium&prodversion=151.0.0.0'
              '&acceptformat=crx3'
              '&x=id%3Dkbfnbcaeplbcioakkpcpgfkobkghlhen%26installsource%3Dondemand%26uc'
          )
          crx_meta, crx = fetch('current_go_crx', crx_url, 250_000_000)
          crx_result = {
              'status': crx_meta.get('status'),
              'finalUrl': crx_meta.get('final_url'),
              'size': len(crx),
              'sha256': hashlib.sha256(crx).hexdigest(),
              'validCrx3': False,
          }
          if crx[:4] == b'Cr24' and len(crx) >= 12:
              version = struct.unpack_from('<I', crx, 4)[0]
              header_length = struct.unpack_from('<I', crx, 8)[0]
              payload = crx[12 + header_length:]
              if version == 3 and payload[:2] == b'PK':
                  crx_result['validCrx3'] = True
                  archive = raw / 'current_go_payload.zip'
                  archive.write_bytes(payload)
                  extracted = root / 'current_go_extracted'
                  extracted.mkdir()
                  with zipfile.ZipFile(archive) as zf:
                      zf.extractall(extracted)
                  manifest = json.loads((extracted / 'manifest.json').read_text())
                  crx_result.update({
                      'manifestVersion': manifest.get('manifest_version'),
                      'extensionVersion': manifest.get('version'),
                      'extensionName': manifest.get('name'),
                  })
                  pattern_counts = {
                      'packIsActionMapping': 0,
                      'approvalDefaultMapping': 0,
                      'externalMetadataCache': 0,
                  }
                  for path in extracted.rglob('*.js'):
                      text = path.read_text(errors='ignore')
                      pattern_counts['packIsActionMapping'] += text.count('readOnly:!e.isAction')
                      pattern_counts['approvalDefaultMapping'] += len(re.findall(r'readOnly\?[^;]{0,160}Auto[^;]{0,160}AlwaysAsk', text))
                      pattern_counts['externalMetadataCache'] += text.count('externalPackMetadataCache=new Map')
                  crx_result['patternCounts'] = pattern_counts

          stable_external_urls = [row for row in metadata_rows if not row['urlLooksVersionBound']]
          result = {
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'capturedAtUtc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'packIds': pack_ids,
              'listingRows': listing_rows,
              'externalMetadataRows': metadata_rows,
              'externalMetadataUrlCount': len(metadata_rows),
              'apparentlyStableExternalMetadataUrlCount': len(stable_external_urls),
              'apparentlyStableExternalMetadataUrls': [row['url'] for row in stable_external_urls],
              'currentGoCrx': crx_result,
              'productionStateChanges': 0,
              'authenticatedRequests': 0,
              'decision': (
                  'STABLE_METADATA_URL_WEDGE_SURVIVES'
                  if stable_external_urls
                  else 'VERSION_BOUND_URL_OR_PUBLIC_LISTING_INCONCLUSIVE'
              ),
          }
          (evidence / 'RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          (evidence / 'LISTING_ROWS.json').write_text(json.dumps(listing_rows, indent=2) + '\n')
          (evidence / 'EXTERNAL_METADATA_ROWS.json').write_text(json.dumps(metadata_rows, indent=2) + '\n')
          pathlib.Path('public-intake-status/superhuman-public-pack-listing-current-result.json').write_text(
              json.dumps(result, indent=2) + '\n'
          )
          print(json.dumps(result, indent=2))
          PY
          find superhuman-current-gate/evidence -type f -print0 | sort -z | xargs -0 sha256sum > superhuman-current-gate/evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-public-pack-listing-current-gate
          path: superhuman-current-gate/evidence/
          retention-days: 1
          if-no-files-found: error

      - name: Commit compact current result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-public-pack-listing-current-result.json
          git commit -m 'chore: record current public Superhuman Pack listing gate'
          git push
