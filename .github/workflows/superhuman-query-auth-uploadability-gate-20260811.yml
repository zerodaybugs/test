name: Temporary Superhuman query auth uploadability gate

on:
  push:
    branches: [research/superhuman-index-attachment-20260811]
    paths: [.github/workflows/superhuman-query-auth-uploadability-gate-20260811.yml]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate QueryParam, MultiQueryParam, and OAuth tokenQueryParam
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sh-auth-uploadability
          mkdir -p sh-auth-uploadability/evidence public-intake-status
          cd sh-auth-uploadability
          npm init -y >/dev/null
          npm install --no-audit --no-fund @codahq/packs-sdk@1.17.1
          cat > gate.js <<'NODE'
          'use strict';
          const assert=require('assert');const fs=require('fs');const path=require('path');const sdk=require('@codahq/packs-sdk');
          const sdkRoot=path.dirname(require.resolve('@codahq/packs-sdk/package.json'));const {compilePackMetadata}=require(path.join(sdkRoot,'dist/helpers/metadata.js'));const {validatePackVersionMetadata}=require(path.join(sdkRoot,'dist/testing/upload_validation.js'));
          function base(auth){const p=sdk.newPack();p.setVersion('1.0.0');p.addNetworkDomain('example.invalid');p.setUserAuthentication(auth);p.addFormula({name:'Probe',description:'probe',parameters:[],resultType:sdk.ValueType.String,connectionRequirement:sdk.ConnectionRequirement.Required,execute:async()=>''});return p}
          (async()=>{
            const defs={
              QueryParamToken:{type:sdk.AuthenticationType.QueryParamToken,paramName:'api_key'},
              MultiQueryParamToken:{type:sdk.AuthenticationType.MultiQueryParamToken,params:[{name:'key',description:'API key'},{name:'secret',description:'API secret'}]},
              OAuthTokenQueryParam:{type:sdk.AuthenticationType.OAuth2,authorizationUrl:'https://auth.example.invalid/authorize',tokenUrl:'https://auth.example.invalid/token',scopes:[],tokenQueryParam:'access_token'},
            };
            const results={};for(const [name,def] of Object.entries(defs)){const compiled=compilePackMetadata(base(def));const validated=await validatePackVersionMetadata(compiled,'1.17.1');results[name]={accepted:true,type:validated.defaultAuthentication.type,tokenQueryParam:validated.defaultAuthentication.tokenQueryParam||null,paramName:validated.defaultAuthentication.paramName||null,params:validated.defaultAuthentication.params||null}}
            assert(results.QueryParamToken.accepted&&results.MultiQueryParamToken.accepted&&results.OAuthTokenQueryParam.accepted);assert.equal(results.OAuthTokenQueryParam.tokenQueryParam,'access_token');
            const out={pass:true,sdkVersion:require(path.join(sdkRoot,'package.json')).version,officialUploadValidatorAcceptedAllAffectedConfigurations:true,results,syntheticOnly:true,productionRequestCount:0};fs.writeFileSync('evidence/RESULT.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
          node gate.js | tee evidence/OUTPUT.txt
          jq -e '.pass == true and .officialUploadValidatorAcceptedAllAffectedConfigurations == true' evidence/RESULT.json >/dev/null
          sha256sum gate.js evidence/RESULT.json evidence/OUTPUT.txt > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-query-auth-uploadability-gate
          path: sh-auth-uploadability/evidence/
          retention-days: 1
          if-no-files-found: error
      - name: Commit compact result
        shell: bash
        run: |
          set -euo pipefail
          cp sh-auth-uploadability/evidence/RESULT.json public-intake-status/superhuman-query-auth-uploadability-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-query-auth-uploadability-result.json
          git commit -m 'chore: record Superhuman query auth uploadability gate'
          git push
