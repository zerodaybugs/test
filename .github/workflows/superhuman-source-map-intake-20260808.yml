name: Temporary Superhuman source-map intake

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-source-map-intake-20260808.yml]

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fetch exact public source maps and record availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-maps public-intake-status
          base='https://mail.superhuman.com/~backend/build'
          : > source-maps/status.tsv
          for file in \
            31a82a8bcd38240c8180.page.js.map \
            31a82a8bcd38240c8180.background.js.map \
            31a82a8bcd38240c8180.oauth2redirect.js.map \
            31a82a8bcd38240c8180.loader.js.map; do
            code=$(curl --show-error --silent --location --retry 2 --retry-all-errors \
              --user-agent 'Mozilla/5.0 Chrome/144.0.7559.96' \
              -o "source-maps/$file" -w '%{http_code}' "$base/$file" || true)
            size=$(stat -c '%s' "source-maps/$file" 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\n' "$file" "$code" "$size" >> source-maps/status.tsv
            if [[ "$code" != 200 || "$size" -eq 0 ]]; then
              rm -f "source-maps/$file"
            fi
          done
          find source-maps -maxdepth 1 -type f ! -name status.tsv -print0 | sort -z | xargs -0 -r sha256sum > source-maps/SHA256SUMS.txt
          python3 - <<'PY'
          import json, os, pathlib
          rows=[]
          for line in pathlib.Path('source-maps/status.tsv').read_text().splitlines():
              name,code,size=line.split('\t')
              rows.append({'name':name,'http_status':int(code or 0),'size':int(size)})
          status={
              'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
              'source_commit':os.environ['GITHUB_SHA'],
              'files':rows,
              'available_count':sum(r['http_status']==200 and r['size']>0 for r in rows),
          }
          p=pathlib.Path('public-intake-status/superhuman-source-maps.json')
          p.write_text(json.dumps(status,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-web-source-maps-20260807T190608Z
          path: source-maps/
          if-no-files-found: warn
          retention-days: 1
      - name: Commit non-sensitive availability status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-intake-status/superhuman-source-maps.json
          git commit -m 'chore: record Superhuman source-map availability'
          git push
