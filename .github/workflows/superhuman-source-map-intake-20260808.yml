name: Temporary Superhuman source-map intake

on:
  push:
    branches: [research/superhuman-crx-intake-20260808]
    paths: [.github/workflows/superhuman-source-map-intake-20260808.yml]

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact public source maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-maps
          base='https://mail.superhuman.com/~backend/build'
          for file in \
            31a82a8bcd38240c8180.page.js.map \
            31a82a8bcd38240c8180.background.js.map \
            31a82a8bcd38240c8180.oauth2redirect.js.map \
            31a82a8bcd38240c8180.loader.js.map; do
            curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
              --user-agent 'Mozilla/5.0 Chrome/144.0.7559.96' \
              "$base/$file" -o "source-maps/$file"
            test -s "source-maps/$file"
          done
          sha256sum source-maps/* | sort > source-maps/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: superhuman-web-source-maps-20260807T190608Z
          path: source-maps/
          if-no-files-found: error
          retention-days: 1
