name: Temporary Superhuman web build intake

on:
  push:
    branches:
      - research/superhuman-crx-intake-20260808
    paths:
      - .github/workflows/superhuman-web-build-intake-20260808.yml

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact web assets referenced by official CRX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-intake
          base='https://mail.superhuman.com/~backend/build'
          files=(
            '31a82a8bcd38240c8180.page.js'
            '31a82a8bcd38240c8180.loader.js'
            '31a82a8bcd38240c8180.oauth2redirect.js'
            '31a82a8bcd38240c8180.background.js'
            'e9629008197357876c89.index.html'
            'a502ce66b5842b0cbbce.background_page.html'
          )
          for file in "${files[@]}"; do
            curl --fail --show-error --silent --location \
              --retry 3 --retry-all-errors \
              --user-agent 'Mozilla/5.0 Chrome/144.0.7559.96' \
              "$base/$file" -o "web-intake/$file"
            test -s "web-intake/$file"
          done
          sha256sum web-intake/* | sort > web-intake/SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('web-intake')
          status = {
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_commit': os.environ['GITHUB_SHA'],
              'asset_manifest_commit': 'a23d64da8a2057bcd60a0cc39973c3e90cc44205',
              'asset_manifest_version': '2026-08-07T19:06:08Z',
              'files': {}
          }
          for p in sorted(root.iterdir()):
              if p.name == 'status.json' or not p.is_file():
                  continue
              data = p.read_bytes()
              status['files'][p.name] = {
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          (root/'status.json').write_text(json.dumps(status, indent=2) + '\n')
          PY

      - name: Upload exact web-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: superhuman-web-build-20260807T190608Z
          path: web-intake/
          if-no-files-found: error
          retention-days: 1

      - name: Commit non-binary intake status for polling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-intake/status.json
          git commit -m 'chore: record temporary Superhuman web-build intake status'
          git push
