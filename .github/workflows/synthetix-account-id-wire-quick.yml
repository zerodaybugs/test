name: synthetix-account-id-wire-quick

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-account-id-wire-quick.yml
      - audit_tools/synthetix_account_id_wire_quick.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query exact production and test wire formats
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_account_id_wire_quick
          python -m py_compile audit_tools/synthetix_account_id_wire_quick.py
          python audit_tools/synthetix_account_id_wire_quick.py
      - name: Upload exact wire-format evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-account-id-wire-quick
          path: synthetix_account_id_wire_quick/
          if-no-files-found: error
          retention-days: 1
