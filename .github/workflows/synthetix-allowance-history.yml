name: synthetix-allowance-history

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-allowance-history.yml
      - audit_tools/synthetix_allowance_history.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect public approval and spender history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf allowance_history
          python3 audit_tools/synthetix_allowance_history.py

      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-allowance-history
          path: allowance_history/
          if-no-files-found: error
          retention-days: 1
