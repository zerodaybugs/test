name: synthetix-api-alias-replay

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-api-alias-replay.yml
      - audit_tools/synthetix_api_alias_replay.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7' 'eth-utils==5.3.1'

      - name: Run synthetic API alias replay differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf api_alias_replay
          python -m py_compile audit_tools/synthetix_api_alias_replay.py
          python audit_tools/synthetix_api_alias_replay.py

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-api-alias-replay
          path: api_alias_replay/
          if-no-files-found: error
          retention-days: 1
