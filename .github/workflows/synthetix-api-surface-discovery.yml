name: synthetix-api-surface-discovery

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-api-surface-discovery.yml
      - audit_tools/synthetix_api_surface_discovery.py

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run curated production-test API surface discovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf api_surface_discovery
          python audit_tools/synthetix_api_surface_discovery.py

      - name: Upload redacted surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-api-surface-discovery
          path: api_surface_discovery/
          if-no-files-found: error
          retention-days: 1
