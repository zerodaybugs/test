name: synthetix-artifact-status

on:
  push:
    branches:
      - audit/synthetix-artifact-status-20260727
    paths:
      - .github/workflows/synthetix-artifact-status.yml
      - audit_tools/synthetix_artifact_status.py

permissions:
  contents: write
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/synthetix-artifact-status-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract sanitized artifact status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf audit_status
          python audit_tools/synthetix_artifact_status.py
      - name: Commit sanitized status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit_status/summary.json
          if git diff --cached --quiet; then
            echo 'No status changes'
          else
            git commit -m 'Record sanitized Synthetix artifact status'
            git push origin HEAD:audit/synthetix-artifact-status-20260727
          fi
