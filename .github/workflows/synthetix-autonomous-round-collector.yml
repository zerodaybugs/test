name: synthetix-autonomous-round-collector

on:
  push:
    branches:
      - audit/synthetix-autonomous-round-collector-20260727
    paths:
      - .github/workflows/synthetix-autonomous-round-collector.yml
      - audit_tools/synthetix_autonomous_round_collector.py

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/synthetix-autonomous-round-collector-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for and consolidate runtime artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_autonomous_round
          python audit_tools/synthetix_autonomous_round_collector.py
      - name: Commit sanitized status and consolidated result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add synthetix_autonomous_round/ROUND_STATUS.md synthetix_autonomous_round/round_summary.json synthetix_autonomous_round/Synthetix_Autonomous_Runtime_Round_Result.zip
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Record Synthetix autonomous runtime round result'
            git push origin HEAD:audit/synthetix-autonomous-round-collector-20260727
          fi
      - name: Upload consolidated evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-autonomous-runtime-round
          path: synthetix_autonomous_round/
          if-no-files-found: error
          retention-days: 2
