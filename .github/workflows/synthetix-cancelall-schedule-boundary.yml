name: synthetix-cancelall-schedule-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-cancelall-schedule-boundary.yml
      - audit_tools/synthetix_cancelall_schedule_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned EIP-712 dependency
        run: python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Run cancel-all, schedule-cancel and leverage differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_cancelall_schedule_boundary
          python -m py_compile audit_tools/synthetix_cancelall_schedule_boundary.py
          python audit_tools/synthetix_cancelall_schedule_boundary.py
      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-cancelall-schedule-boundary
          path: synthetix_cancelall_schedule_boundary/
          if-no-files-found: error
          retention-days: 1
