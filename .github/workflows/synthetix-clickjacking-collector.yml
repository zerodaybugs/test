name: synthetix-clickjacking-collector
on:
  push:
    branches: [audit/synthetix-clickjacking-collector-20260727]
    paths:
      - .github/workflows/synthetix-clickjacking-collector.yml
      - audit_tools/synthetix_clickjacking_collector.py
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/synthetix-clickjacking-collector-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for and collect frame/session artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_clickjacking_round
          python audit_tools/synthetix_clickjacking_collector.py
      - name: Commit clickjacking/session result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add synthetix_clickjacking_round/ROUND_STATUS.md synthetix_clickjacking_round/round_summary.json synthetix_clickjacking_round/Synthetix_Clickjacking_Session_Round_Result.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Record Synthetix clickjacking session round result'
            git push origin HEAD:audit/synthetix-clickjacking-collector-20260727
          fi
      - name: Upload consolidated clickjacking evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-clickjacking-session-round
          path: synthetix_clickjacking_round/
          if-no-files-found: error
          retention-days: 2
