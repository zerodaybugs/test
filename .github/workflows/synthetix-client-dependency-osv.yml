name: synthetix-client-dependency-osv
on:
  pull_request:
    paths:
      - .github/workflows/synthetix-client-dependency-osv.yml
      - audit_tools/synthetix_client_dependency_osv.py
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory exact client versions and public advisories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_client_dependency_osv
          python audit_tools/synthetix_client_dependency_osv.py
      - name: Upload public dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-client-dependency-osv
          path: synthetix_client_dependency_osv/
          if-no-files-found: error
          retention-days: 2
