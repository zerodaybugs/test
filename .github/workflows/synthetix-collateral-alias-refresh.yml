name: synthetix-collateral-alias-refresh

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-collateral-alias-refresh.yml
      - audit_tools/synthetix_collateral_alias_refresh.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Run synthetic collateral alias and hidden-action differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_collateral_alias_refresh
          python -m py_compile audit_tools/synthetix_collateral_alias_refresh.py
          python audit_tools/synthetix_collateral_alias_refresh.py
      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-collateral-alias-refresh
          path: synthetix_collateral_alias_refresh/
          if-no-files-found: error
          retention-days: 1
