name: synthetix-create-subaccount-case-alias

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-create-subaccount-case-alias.yml
      - audit_tools/synthetix_create_subaccount_case_alias.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Compile and run createSubaccount alias differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf create_subaccount_case_alias create_subaccount_case_alias_diagnostics
          mkdir -p create_subaccount_case_alias_diagnostics
          python -m py_compile audit_tools/synthetix_create_subaccount_case_alias.py \
            > create_subaccount_case_alias_diagnostics/py_compile.log 2>&1
          set +e
          python audit_tools/synthetix_create_subaccount_case_alias.py \
            > create_subaccount_case_alias_diagnostics/run.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > create_subaccount_case_alias_diagnostics/exit_code.txt
          if [ -d create_subaccount_case_alias ]; then
            cp -R create_subaccount_case_alias create_subaccount_case_alias_diagnostics/output
          fi
          cat create_subaccount_case_alias_diagnostics/run.log
          exit 0

      - name: Upload createSubaccount alias evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-create-subaccount-case-alias
          path: create_subaccount_case_alias_diagnostics/
          if-no-files-found: error
          retention-days: 1
