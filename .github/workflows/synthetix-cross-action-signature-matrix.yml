name: synthetix-cross-action-signature-matrix

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-cross-action-signature-matrix.yml
      - audit_tools/synthetix_cross_action_signature_matrix.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Run synthetic cross-action signature differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_cross_action_signature_matrix
          python -m py_compile audit_tools/synthetix_cross_action_signature_matrix.py
          python audit_tools/synthetix_cross_action_signature_matrix.py
      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-cross-action-signature-matrix
          path: synthetix_cross_action_signature_matrix/
          if-no-files-found: error
          retention-days: 1
