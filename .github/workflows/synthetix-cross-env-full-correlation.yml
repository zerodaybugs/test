name: synthetix-cross-env-full-correlation

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-cross-env-full-correlation.yml
      - audit_tools/synthetix_cross_env_full_correlation.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned checksum dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1' 'eth-hash[pycryptodome]==0.7.1'

      - name: Correlate all public beneficiaries across environments
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cross_env_full_correlation
          python -m py_compile audit_tools/synthetix_cross_env_full_correlation.py
          python audit_tools/synthetix_cross_env_full_correlation.py

      - name: Upload redacted correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-cross-env-full-correlation
          path: cross_env_full_correlation/
          if-no-files-found: error
          retention-days: 1
