name: synthetix-cross-environment-account-correlation-v2

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-cross-environment-account-correlation-v2.yml
      - audit_tools/synthetix_cross_environment_boundary.py
      - audit_tools/synthetix_cross_environment_account_correlation_v2.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7' 'eth-utils==5.3.1'

      - name: Run checksummed account correlation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cross_environment_account_correlation_v2
          PYTHONPATH=audit_tools python audit_tools/synthetix_cross_environment_account_correlation_v2.py

      - name: Upload redacted correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-cross-environment-account-correlation-v2
          path: cross_environment_account_correlation_v2/
          if-no-files-found: error
          retention-days: 1
