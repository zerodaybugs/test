name: synthetix-cross-environment-discovery

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-cross-environment-discovery.yml
      - audit_tools/synthetix_cross_environment_discovery.py

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run passive low-noise environment discovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cross_environment_discovery
          python audit_tools/synthetix_cross_environment_discovery.py

      - name: Upload redacted discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-cross-environment-discovery
          path: cross_environment_discovery/
          if-no-files-found: error
          retention-days: 1
