name: synthetix-cross-environment-nonce-sharing

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-cross-environment-nonce-sharing.yml
      - audit_tools/synthetix_cross_environment_nonce_sharing.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run cross-environment nonce sharing probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cross_environment_nonce_sharing
          python audit_tools/synthetix_cross_environment_nonce_sharing.py

      - name: Upload redacted nonce-sharing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-cross-environment-nonce-sharing
          path: cross_environment_nonce_sharing/
          if-no-files-found: error
          retention-days: 1
