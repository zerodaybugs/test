name: synthetix-cross-transport-nonce

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-cross-transport-nonce.yml
      - audit_tools/synthetix_cross_transport_nonce.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 and WebSocket dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7' 'websockets==15.0.1'

      - name: Run REST-WebSocket nonce-sharing probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cross_transport_nonce
          python audit_tools/synthetix_cross_transport_nonce.py

      - name: Upload redacted cross-transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-cross-transport-nonce
          path: cross_transport_nonce/
          if-no-files-found: error
          retention-days: 1
