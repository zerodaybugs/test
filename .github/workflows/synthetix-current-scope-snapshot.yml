name: synthetix-current-scope-snapshot

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-current-scope-snapshot.yml
      - audit_tools/synthetix_current_scope_snapshot.py

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot public program pages
        run: |
          set -euo pipefail
          rm -rf synthetix_current_scope_snapshot
          python audit_tools/synthetix_current_scope_snapshot.py
      - name: Upload public scope evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-current-scope-snapshot
          path: synthetix_current_scope_snapshot/
          if-no-files-found: error
          retention-days: 2
