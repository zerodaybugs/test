name: synthetix-deep-round-collector
on:
  push:
    branches: [audit/synthetix-deep-round-collector-20260727]
    paths:
      - .github/workflows/synthetix-deep-round-collector.yml
      - audit_tools/synthetix_deep_round_collector.py
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/synthetix-deep-round-collector-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for and collect deep-round artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_deep_round
          python audit_tools/synthetix_deep_round_collector.py
      - name: Commit deep-round result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add synthetix_deep_round/ROUND_STATUS.md synthetix_deep_round/round_summary.json synthetix_deep_round/Synthetix_Deep_Research_Round_Result.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Record Synthetix deep research round result'
            git push origin HEAD:audit/synthetix-deep-round-collector-20260727
          fi
      - name: Upload consolidated deep-round evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-deep-research-round
          path: synthetix_deep_round/
          if-no-files-found: error
          retention-days: 2
