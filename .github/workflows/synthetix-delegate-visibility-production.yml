name: synthetix-delegate-visibility-production

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-delegate-visibility-production.yml
      - audit_tools/synthetix_delegate_visibility_production.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and verify current production assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delegate_visibility_production
          python audit_tools/synthetix_delegate_visibility_production.py

      - name: Upload production visibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-delegate-visibility-production
          path: delegate_visibility_production/
          if-no-files-found: error
          retention-days: 1
