name: synthetix-delegation-alias-boundary-v2

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-delegation-alias-boundary-v2.yml
      - audit_tools/synthetix_delegation_alias_boundary.py
      - audit_tools/synthetix_delegation_alias_boundary_v2.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run synthetic delegation differential with diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delegation_alias_boundary_v2
          PYTHONPATH=audit_tools python audit_tools/synthetix_delegation_alias_boundary_v2.py

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-delegation-alias-boundary-v2
          path: delegation_alias_boundary_v2/
          if-no-files-found: error
          retention-days: 1
