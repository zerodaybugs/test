name: synthetix-delegation-alias-boundary-v3

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-delegation-alias-boundary-v3.yml
      - audit_tools/synthetix_delegation_alias_boundary_v3.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Compile and run corrected delegation differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delegation_alias_boundary_v3 delegation_alias_v3_diagnostics
          mkdir -p delegation_alias_v3_diagnostics
          python -m py_compile audit_tools/synthetix_delegation_alias_boundary_v3.py \
            > delegation_alias_v3_diagnostics/py_compile.log 2>&1
          set +e
          python audit_tools/synthetix_delegation_alias_boundary_v3.py \
            > delegation_alias_v3_diagnostics/run.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > delegation_alias_v3_diagnostics/exit_code.txt
          if [ -d delegation_alias_boundary_v3 ]; then
            cp -R delegation_alias_boundary_v3 delegation_alias_v3_diagnostics/output
          fi
          cat delegation_alias_v3_diagnostics/run.log
          exit 0

      - name: Upload corrected delegation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-delegation-alias-boundary-v3
          path: delegation_alias_v3_diagnostics/
          if-no-files-found: error
          retention-days: 1
