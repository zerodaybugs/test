name: synthetix-delegation-alias-diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-delegation-alias-diagnostics.yml
      - audit_tools/synthetix_delegation_alias_boundary.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run probe and preserve complete diagnostics
        shell: bash
        run: |
          set -u
          rm -rf delegation_alias_diagnostics delegation_alias_boundary
          mkdir -p delegation_alias_diagnostics
          set +e
          PYTHONPATH=audit_tools python audit_tools/synthetix_delegation_alias_boundary.py \
            > delegation_alias_diagnostics/run.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > delegation_alias_diagnostics/exit_code.txt
          if [ -d delegation_alias_boundary ]; then
            cp -R delegation_alias_boundary delegation_alias_diagnostics/output
          fi
          python -m py_compile audit_tools/synthetix_delegation_alias_boundary.py \
            > delegation_alias_diagnostics/py_compile.log 2>&1 || true
          cat delegation_alias_diagnostics/run.log
          exit 0

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-delegation-alias-diagnostics
          path: delegation_alias_diagnostics/
          if-no-files-found: error
          retention-days: 1
