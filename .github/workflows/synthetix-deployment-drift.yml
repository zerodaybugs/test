name: synthetix-deployment-drift

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-deployment-drift.yml
      - audit_tools/synthetix_deployment_drift.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned ABI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-abi==5.2.0' 'eth-utils==5.3.1'

      - name: Collect passive deployment and role-code drift evidence
        shell: bash
        run: |
          set -uo pipefail
          rm -rf synthetix_deployment_drift
          mkdir -p synthetix_deployment_drift
          set +e
          python audit_tools/synthetix_deployment_drift.py > synthetix_deployment_drift/run.log 2>&1
          status=$?
          set -e
          cat synthetix_deployment_drift/run.log
          exit "$status"

      - name: Upload passive drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-deployment-drift
          path: synthetix_deployment_drift/
          if-no-files-found: error
          retention-days: 1
