name: synthetix-deposit-identity-correlation-diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-deposit-identity-correlation-diagnostics.yml
      - audit_tools/synthetix_deposit_identity_correlation_v2.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checksum dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1'

      - name: Run and preserve complete diagnostics
        shell: bash
        run: |
          set +e
          rm -rf deposit_identity_correlation_v2
          mkdir -p deposit_identity_correlation_v2
          python audit_tools/synthetix_deposit_identity_correlation_v2.py \
            > deposit_identity_correlation_v2/run.log 2>&1
          code=$?
          printf '%s\n' "$code" > deposit_identity_correlation_v2/exit_code.txt
          exit 0

      - name: Upload complete diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-deposit-identity-correlation-diagnostics
          path: deposit_identity_correlation_v2/
          if-no-files-found: error
          retention-days: 1
