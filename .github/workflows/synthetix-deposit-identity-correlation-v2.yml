name: synthetix-deposit-identity-correlation-v2

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-deposit-identity-correlation-v2.yml
      - audit_tools/synthetix_deposit_identity_correlation_v2.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checksum dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1'

      - name: Correlate checksummed public deposit identities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deposit_identity_correlation_v2
          python audit_tools/synthetix_deposit_identity_correlation_v2.py

      - name: Upload redacted correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-deposit-identity-correlation-v2
          path: deposit_identity_correlation_v2/
          if-no-files-found: error
          retention-days: 1
