name: synthetix-deposit-identity-correlation

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-deposit-identity-correlation.yml
      - audit_tools/synthetix_deposit_identity_correlation.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correlate public deposit identity fields
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deposit_identity_correlation
          python audit_tools/synthetix_deposit_identity_correlation.py

      - name: Upload redacted correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-deposit-identity-correlation
          path: deposit_identity_correlation/
          if-no-files-found: error
          retention-days: 1
