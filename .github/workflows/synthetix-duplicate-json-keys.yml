name: synthetix-duplicate-json-keys

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-duplicate-json-keys.yml
      - audit_tools/synthetix_duplicate_json_keys.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run duplicate JSON key verifier-handler differential
        shell: bash
        run: |
          set -uo pipefail
          rm -rf duplicate_json_keys
          mkdir -p duplicate_json_keys
          set +e
          python -m py_compile audit_tools/synthetix_duplicate_json_keys.py > duplicate_json_keys/run.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python audit_tools/synthetix_duplicate_json_keys.py >> duplicate_json_keys/run.log 2>&1
            status=$?
          fi
          set -e
          cat duplicate_json_keys/run.log
          exit "$status"

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-duplicate-json-keys
          path: duplicate_json_keys/
          if-no-files-found: error
          retention-days: 1
