name: synthetix-dynamic-browser-origin

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-dynamic-browser-origin.yml
      - audit_tools/synthetix_dynamic_browser_origin.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Run browser-enforced origin and OAuth probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dynamic_browser_origin
          python -m py_compile audit_tools/synthetix_dynamic_browser_origin.py
          python audit_tools/synthetix_dynamic_browser_origin.py

      - name: Upload redacted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-dynamic-browser-origin
          path: dynamic_browser_origin/
          if-no-files-found: error
          retention-days: 1
