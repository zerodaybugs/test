name: synthetix-dynamic-origin-match

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-dynamic-origin-match.yml
      - audit_tools/synthetix_dynamic_origin_match.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run origin allowlist matching matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dynamic_origin_match
          python -m py_compile audit_tools/synthetix_dynamic_origin_match.py
          python audit_tools/synthetix_dynamic_origin_match.py

      - name: Upload read-only origin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-dynamic-origin-match
          path: dynamic_origin_match/
          if-no-files-found: error
          retention-days: 1
