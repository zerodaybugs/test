name: synthetix-dynamic-origin-oauth

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-dynamic-origin-oauth.yml
      - audit_tools/synthetix_dynamic_origin_oauth.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run passive Dynamic origin and OAuth differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dynamic_origin_oauth
          python -m py_compile audit_tools/synthetix_dynamic_origin_oauth.py
          python audit_tools/synthetix_dynamic_origin_oauth.py

      - name: Upload redacted passive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-dynamic-origin-oauth
          path: dynamic_origin_oauth/
          if-no-files-found: error
          retention-days: 1
