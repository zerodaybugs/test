name: synthetix-dynamic-project-settings

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-dynamic-project-settings.yml
      - audit_tools/synthetix_dynamic_project_settings.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and redact the public Dynamic project settings
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_dynamic_project_settings
          python audit_tools/synthetix_dynamic_project_settings.py

      - name: Upload redacted settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-dynamic-project-settings
          path: synthetix_dynamic_project_settings/
          if-no-files-found: error
          retention-days: 1
