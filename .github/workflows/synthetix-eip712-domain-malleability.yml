name: synthetix-eip712-domain-malleability

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-eip712-domain-malleability.yml
      - audit_tools/synthetix_eip712_domain_malleability.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run domain separation and malleability differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eip712_domain_malleability
          python -m py_compile audit_tools/synthetix_eip712_domain_malleability.py
          python audit_tools/synthetix_eip712_domain_malleability.py

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-eip712-domain-malleability
          path: eip712_domain_malleability/
          if-no-files-found: error
          retention-days: 1
