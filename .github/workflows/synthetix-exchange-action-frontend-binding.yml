name: synthetix-exchange-action-frontend-binding

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-exchange-action-frontend-binding.yml
      - audit_tools/synthetix_exchange_frontend_binding.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current same-origin Exchange action graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_exchange_frontend_binding
          python -m py_compile audit_tools/synthetix_exchange_frontend_binding.py
          python audit_tools/synthetix_exchange_frontend_binding.py
      - name: Upload read-only action-binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-exchange-action-frontend-binding
          path: synthetix_exchange_frontend_binding/
          if-no-files-found: error
          retention-days: 1
