name: synthetix-failed-write-atomicity

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-failed-write-atomicity.yml
      - audit_tools/synthetix_failed_write_atomicity.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned EIP-712 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'eth-account==0.13.7' \
            'eth-hash[pycryptodome]==0.7.1'
      - name: Run synthetic rejected-write atomicity differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_failed_write_atomicity
          python -m py_compile audit_tools/synthetix_failed_write_atomicity.py
          python audit_tools/synthetix_failed_write_atomicity.py
      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-failed-write-atomicity
          path: synthetix_failed_write_atomicity/
          if-no-files-found: error
          retention-days: 1
