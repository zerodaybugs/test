name: synthetix-final-probe

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-final-probe.yml
      - audit_tools/synthetix_final_probe.py
      - audit_tools/synthetix_state_read.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run focused public read-only probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          python3 audit_tools/synthetix_final_probe.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-focused-probe
          path: out/
          if-no-files-found: error
          retention-days: 1
