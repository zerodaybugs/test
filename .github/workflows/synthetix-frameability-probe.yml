name: synthetix-frameability-probe
on:
  pull_request:
    paths:
      - .github/workflows/synthetix-frameability-probe.yml
      - audit_tools/synthetix_frameability_probe.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.54.0'
          python -m playwright install --with-deps chromium
      - name: Test cross-origin frameability
        run: |
          set -euo pipefail
          rm -rf synthetix_frameability_probe
          python audit_tools/synthetix_frameability_probe.py
      - name: Upload redacted frame evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-frameability-probe
          path: synthetix_frameability_probe/
          if-no-files-found: error
          retention-days: 2
