name: synthetix-frontend-release-diff
on:
  pull_request:
    paths:
      - .github/workflows/synthetix-frontend-release-diff.yml
      - audit_tools/synthetix_frontend_release_diff.py
permissions:
  contents: read
  actions: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare previous and current public frontend surfaces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_frontend_release_diff
          python audit_tools/synthetix_frontend_release_diff.py
      - name: Upload read-only release diff
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-frontend-release-diff
          path: synthetix_frontend_release_diff/
          if-no-files-found: error
          retention-days: 2
