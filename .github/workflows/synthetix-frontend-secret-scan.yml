name: synthetix-frontend-secret-scan
on:
  pull_request:
    paths:
      - .github/workflows/synthetix-frontend-secret-scan.yml
      - audit_tools/synthetix_frontend_secret_scan.py
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public frontend graph for private credential patterns
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_frontend_secret_scan
          python audit_tools/synthetix_frontend_secret_scan.py
      - name: Upload redacted secret-pattern evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-frontend-secret-scan
          path: synthetix_frontend_secret_scan/
          if-no-files-found: error
          retention-days: 2
