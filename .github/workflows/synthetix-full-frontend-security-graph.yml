name: synthetix-full-frontend-security-graph

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-full-frontend-security-graph.yml
      - audit_tools/synthetix_full_frontend_security_graph.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect complete current frontend graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_full_frontend_security_graph
          python -m py_compile audit_tools/synthetix_full_frontend_security_graph.py
          python audit_tools/synthetix_full_frontend_security_graph.py
      - name: Upload read-only security inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-full-frontend-security-graph
          path: synthetix_full_frontend_security_graph/
          if-no-files-found: error
          retention-days: 1
