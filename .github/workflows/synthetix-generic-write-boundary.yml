name: synthetix-generic-write-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-generic-write-boundary.yml
      - audit_tools/synthetix_generic_write_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run generic SubAccountAction to write-handler differential
        shell: bash
        run: |
          set -uo pipefail
          rm -rf generic_write_boundary
          mkdir -p generic_write_boundary
          set +e
          python audit_tools/synthetix_generic_write_boundary.py > generic_write_boundary/run.log 2>&1
          status=$?
          set -e
          cat generic_write_boundary/run.log
          exit "$status"

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-generic-write-boundary
          path: generic_write_boundary/
          if-no-files-found: error
          retention-days: 1
