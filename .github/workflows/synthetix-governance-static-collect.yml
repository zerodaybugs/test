name: synthetix-governance-static-collect

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-governance-static-collect.yml
      - audit_tools/synthetix_governance_static_collect.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect current public governance assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf governance_static
          python -m py_compile audit_tools/synthetix_governance_static_collect.py
          python audit_tools/synthetix_governance_static_collect.py

      - name: Upload exact public asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-governance-static
          path: governance_static/
          if-no-files-found: error
          retention-days: 1
