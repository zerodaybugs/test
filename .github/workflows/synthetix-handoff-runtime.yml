name: synthetix-handoff-runtime

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-handoff-runtime.yml
      - audit_tools/synthetix_handoff_runtime_probe.py

permissions:
  contents: read

jobs:
  passive-runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Observe production frontend with synthetic handoff secret
        shell: bash
        run: |
          set -euo pipefail
          rm -rf handoff_runtime_probe
          python audit_tools/synthetix_handoff_runtime_probe.py

      - name: Upload passive probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-handoff-runtime-evidence
          path: handoff_runtime_probe/
          if-no-files-found: error
          retention-days: 1
