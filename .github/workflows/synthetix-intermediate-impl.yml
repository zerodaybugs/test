name: synthetix-intermediate-impl

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-intermediate-impl.yml
      - audit_tools/fetch_synthetix_intermediate_impl.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public verification artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf intermediate_impl
          python3 audit_tools/fetch_synthetix_intermediate_impl.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-intermediate-impl
          path: intermediate_impl/
          if-no-files-found: error
          retention-days: 1
