name: synthetix-legacy-exchange-signature

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-legacy-exchange-signature.yml
      - audit_tools/synthetix_legacy_exchange_signature.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned EIP-712 dependency
        run: python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Infer legacy exchangeCollateral signature boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_legacy_exchange_signature
          python -m py_compile audit_tools/synthetix_legacy_exchange_signature.py
          python audit_tools/synthetix_legacy_exchange_signature.py
      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-legacy-exchange-signature
          path: synthetix_legacy_exchange_signature/
          if-no-files-found: error
          retention-days: 1
