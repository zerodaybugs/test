name: synthetix-local-invariants

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-local-invariants.yml
      - audit_tools/prepare_synthetix_local_fixture.py
      - audit_tools/SynthetixDepositLocal.t.sol

permissions:
  contents: read

jobs:
  exact-source-local-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build exact deployed-source fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix-local-fixture local-invariant-evidence
          mkdir -p local-invariant-evidence
          python audit_tools/prepare_synthetix_local_fixture.py \
            | tee local-invariant-evidence/fixture-build.txt
          forge --version | tee local-invariant-evidence/forge-version.txt
          python --version | tee local-invariant-evidence/python-version.txt

      - name: Compile exact verified implementation and record layout
        shell: bash
        run: |
          set -euo pipefail
          cd synthetix-local-fixture
          forge build --sizes 2>&1 | tee ../local-invariant-evidence/forge-build.txt
          forge inspect SynthetixDepositContract storage-layout --json \
            > ../local-invariant-evidence/storage-layout.json
          forge inspect SynthetixDepositContract deployedBytecode \
            > ../local-invariant-evidence/compiled-runtime.txt

      - name: Run full unit and invariant-control suite
        shell: bash
        run: |
          set -euo pipefail
          cd synthetix-local-fixture
          forge test -vvv 2>&1 | tee ../local-invariant-evidence/forge-test-full.txt

      - name: Run extended deposit fuzzing
        shell: bash
        run: |
          set -euo pipefail
          cd synthetix-local-fixture
          forge test \
            --match-test testFuzz_DepositConservation \
            --fuzz-runs 5000 \
            -vv 2>&1 | tee ../local-invariant-evidence/forge-test-deposit-fuzz.txt

      - name: Run focused CoW and withdrawal boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd synthetix-local-fixture
          forge test --match-test 'test_Cow.*' -vvvv \
            2>&1 | tee ../local-invariant-evidence/forge-test-cow.txt
          forge test --match-test 'test_.*Withdrawal.*|test_DifferentDestinations.*' -vvvv \
            2>&1 | tee ../local-invariant-evidence/forge-test-withdrawal.txt

      - name: Generate checksums and verdict matrix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('local-invariant-evidence')
          fixture = pathlib.Path('synthetix-local-fixture')
          verdict = {
              'exactSourceRuntimeMatch': json.loads((fixture / 'provenance.json').read_text()).get('runtimeMatch'),
              'tests': {
                  'depositConservation': 'executed',
                  'batchAtomicity': 'executed',
                  'tokenCallbackReentrancy': 'executed',
                  'permit2CallerBinding': 'executed',
                  'feeOnTransferDeficitControl': 'executed',
                  'withdrawalDestinationLedger': 'executed',
                  'parallelDestinationOverbooking': 'executed',
                  'disputedExpiry': 'executed',
                  'cowFeeAmountBoundary': 'executed',
                  'cowOracleNegativeControl': 'executed',
              },
          }
          (root / 'verdict-matrix.json').write_text(json.dumps(verdict, indent=2))
          lines = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}")
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY

      - name: Upload local-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-local-invariants
          path: |
            local-invariant-evidence/
            synthetix-local-fixture/provenance.json
            synthetix-local-fixture/source-manifest.json
            synthetix-local-fixture/test/SynthetixDepositLocal.t.sol
          if-no-files-found: error
          retention-days: 1
