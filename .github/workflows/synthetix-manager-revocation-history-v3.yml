name: synthetix-manager-revocation-history-v3

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-manager-revocation-history-v3.yml
      - audit_tools/synthetix_manager_revocation_history.py
      - audit_tools/synthetix_manager_revocation_history_v3.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned hashing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'eth-utils==5.3.1' 'eth-hash[pycryptodome]==0.7.1'

      - name: Correlate using checksummed manager identities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf manager_revocation_history_v3 manager_revocation_history_v3_diagnostics
          mkdir -p manager_revocation_history_v3_diagnostics
          python -m py_compile \
            audit_tools/synthetix_manager_revocation_history.py \
            audit_tools/synthetix_manager_revocation_history_v3.py \
            > manager_revocation_history_v3_diagnostics/py_compile.log 2>&1
          set +e
          PYTHONPATH=audit_tools python audit_tools/synthetix_manager_revocation_history_v3.py \
            > manager_revocation_history_v3_diagnostics/run.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > manager_revocation_history_v3_diagnostics/exit_code.txt
          if [ -d manager_revocation_history_v3 ]; then
            cp -R manager_revocation_history_v3 manager_revocation_history_v3_diagnostics/output
          fi
          cat manager_revocation_history_v3_diagnostics/run.log
          exit 0

      - name: Upload redacted correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-manager-revocation-history-v3
          path: manager_revocation_history_v3_diagnostics/
          if-no-files-found: error
          retention-days: 1
