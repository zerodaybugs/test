name: synthetix-manager-revocation-history

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-manager-revocation-history.yml
      - audit_tools/synthetix_manager_revocation_history.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned hashing dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1'

      - name: Correlate manager revocations with unsigned account discovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf manager_revocation_history manager_revocation_diagnostics
          mkdir -p manager_revocation_diagnostics
          python -m py_compile audit_tools/synthetix_manager_revocation_history.py \
            > manager_revocation_diagnostics/py_compile.log 2>&1
          set +e
          python audit_tools/synthetix_manager_revocation_history.py \
            > manager_revocation_diagnostics/run.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > manager_revocation_diagnostics/exit_code.txt
          if [ -d manager_revocation_history ]; then
            cp -R manager_revocation_history manager_revocation_diagnostics/output
          fi
          cat manager_revocation_diagnostics/run.log
          exit 0

      - name: Upload redacted correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-manager-revocation-history
          path: manager_revocation_diagnostics/
          if-no-files-found: error
          retention-days: 1
