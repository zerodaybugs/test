name: synthetix-market-query-xss

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-market-query-xss.yml
      - audit_tools/synthetix_market_query_xss.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Run GET-only market-query DOM XSS probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_market_query_xss
          python -m py_compile audit_tools/synthetix_market_query_xss.py
          python audit_tools/synthetix_market_query_xss.py
      - name: Upload redacted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-market-query-xss
          path: synthetix_market_query_xss/
          if-no-files-found: error
          retention-days: 1
