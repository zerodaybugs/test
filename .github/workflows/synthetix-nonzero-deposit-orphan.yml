name: synthetix-nonzero-deposit-orphan

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-nonzero-deposit-orphan.yml
      - audit_tools/synthetix_nonzero_deposit_orphan.py

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ethereum decoding dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1' 'eth-hash[pycryptodome]==0.7.1'
      - name: Reconstruct anomalous explicit-subaccount deposit
        shell: bash
        run: |
          set -uo pipefail
          rm -rf synthetix_nonzero_deposit_orphan
          mkdir -p synthetix_nonzero_deposit_orphan
          set +e
          python -m py_compile audit_tools/synthetix_nonzero_deposit_orphan.py > synthetix_nonzero_deposit_orphan/run.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python audit_tools/synthetix_nonzero_deposit_orphan.py >> synthetix_nonzero_deposit_orphan/run.log 2>&1
            status=$?
          fi
          set -e
          cat synthetix_nonzero_deposit_orphan/run.log
          exit "$status"
      - name: Upload read-only historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-nonzero-deposit-orphan
          path: synthetix_nonzero_deposit_orphan/
          if-no-files-found: error
          retention-days: 1
