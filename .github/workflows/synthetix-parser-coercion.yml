name: synthetix-parser-coercion

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-parser-coercion.yml
      - audit_tools/synthetix_parser_coercion.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run synthetic parser-coercion differential
        shell: bash
        run: |
          set -uo pipefail
          rm -rf parser_coercion
          mkdir -p parser_coercion
          set +e
          python -m py_compile audit_tools/synthetix_parser_coercion.py > parser_coercion/run.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python audit_tools/synthetix_parser_coercion.py >> parser_coercion/run.log 2>&1
            status=$?
          fi
          set -e
          cat parser_coercion/run.log
          exit "$status"

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-parser-coercion
          path: parser_coercion/
          if-no-files-found: error
          retention-days: 1
