name: synthetix-passive-dns

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-passive-dns.yml
      - audit_tools/synthetix_passive_dns.py

permissions:
  contents: read

jobs:
  passive-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query public CT logs and DNS-over-HTTPS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf passive_dns
          python3 audit_tools/synthetix_passive_dns.py
      - name: Upload passive inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-passive-dns
          path: passive_dns/
          if-no-files-found: error
          retention-days: 1
