name: synthetix-permissions-upgrade-history

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-permissions-upgrade-history.yml
      - audit_tools/synthetix_permissions_upgrade_history.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned hashing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1' 'eth-hash[pycryptodome]==0.7.1'

      - name: Collect implementation and storage history
        shell: bash
        run: |
          set -uo pipefail
          rm -rf permissions_upgrade_history
          mkdir -p permissions_upgrade_history
          set +e
          python -m py_compile audit_tools/synthetix_permissions_upgrade_history.py > permissions_upgrade_history/run.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python audit_tools/synthetix_permissions_upgrade_history.py >> permissions_upgrade_history/run.log 2>&1
            status=$?
          fi
          set -e
          cat permissions_upgrade_history/run.log
          exit "$status"

      - name: Upload read-only upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-permissions-upgrade-history
          path: permissions_upgrade_history/
          if-no-files-found: error
          retention-days: 1
