name: synthetix-postmessage-fuzz

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-postmessage-fuzz.yml
      - audit_tools/synthetix_postmessage_fuzz.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.54.0'
          python -m playwright install --with-deps chromium
      - name: Run cross-origin postMessage differential
        run: |
          set -uo pipefail
          rm -rf synthetix_postmessage_fuzz
          mkdir -p synthetix_postmessage_fuzz
          set +e
          python audit_tools/synthetix_postmessage_fuzz.py > synthetix_postmessage_fuzz/run.log 2>&1
          status=$?
          set -e
          cat synthetix_postmessage_fuzz/run.log
          exit "$status"
      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-postmessage-fuzz
          path: synthetix_postmessage_fuzz/
          if-no-files-found: error
          retention-days: 1
