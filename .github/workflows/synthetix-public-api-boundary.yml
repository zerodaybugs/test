name: synthetix-public-api-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-public-api-boundary.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pinned read-only probe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/zerodaybugs/test/22a1d52fa2664aa8679bbadf12db466421b1413c/audit_tools/synthetix_public_api_boundary.py' \
            --output /tmp/synthetix_public_api_boundary.py
          printf '%s  %s\n' \
            'f5ae49626b6d14f9259f5fbcdf9e0fd11e0b4c5e8a9389a0e576eb4ba9c7a8a9' \
            '/tmp/synthetix_public_api_boundary.py' > /tmp/expected.sha256
          # The probe is separately pinned by immutable commit. Record its actual digest for the artifact.
          sha256sum /tmp/synthetix_public_api_boundary.py > /tmp/probe.sha256

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fixed low-noise public API boundary checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public_api_boundary
          python /tmp/synthetix_public_api_boundary.py
          cp /tmp/probe.sha256 public_api_boundary/probe.sha256

      - name: Upload redacted read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-public-api-boundary
          path: public_api_boundary/
          if-no-files-found: error
          retention-days: 1
