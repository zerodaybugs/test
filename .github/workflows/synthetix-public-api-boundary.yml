name: synthetix-public-api-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-public-api-boundary.yml
      - audit_tools/synthetix_public_api_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fixed low-noise public API boundary checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public_api_boundary
          python audit_tools/synthetix_public_api_boundary.py

      - name: Upload redacted read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-public-api-boundary
          path: public_api_boundary/
          if-no-files-found: error
          retention-days: 1
