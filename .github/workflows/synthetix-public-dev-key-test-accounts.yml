name: synthetix-public-dev-key-test-accounts

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-public-dev-key-test-accounts.yml
      - audit_tools/synthetix_public_dev_key_test_accounts.py

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ethereum derivation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'eth-account==0.13.7' \
            'eth-hash[pycryptodome]==0.7.1'
      - name: Query public development identities against official test API
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_public_dev_key_test_accounts
          python -m py_compile audit_tools/synthetix_public_dev_key_test_accounts.py
          python audit_tools/synthetix_public_dev_key_test_accounts.py
      - name: Upload redacted read-only discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-public-dev-key-test-accounts
          path: synthetix_public_dev_key_test_accounts/
          if-no-files-found: error
          retention-days: 1
