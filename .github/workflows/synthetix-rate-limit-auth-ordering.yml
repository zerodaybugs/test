name: synthetix-rate-limit-auth-ordering

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-rate-limit-auth-ordering.yml
      - audit_tools/synthetix_rate_limit_auth_ordering.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run synthetic rate-limit authorization ordering probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rate_limit_auth_ordering
          python audit_tools/synthetix_rate_limit_auth_ordering.py

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-rate-limit-auth-ordering
          path: rate_limit_auth_ordering/
          if-no-files-found: error
          retention-days: 1
