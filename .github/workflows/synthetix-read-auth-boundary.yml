name: synthetix-read-auth-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-read-auth-boundary.yml
      - audit_tools/synthetix_read_auth_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EIP-712 signing dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Run redacted read-only authorization checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf read_auth_boundary
          python audit_tools/synthetix_read_auth_boundary.py
      - name: Upload redacted summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-read-auth-boundary
          path: read_auth_boundary/summary.json
          if-no-files-found: error
          retention-days: 1
