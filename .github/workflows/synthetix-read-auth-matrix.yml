name: synthetix-read-auth-matrix

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-read-auth-matrix.yml
      - audit_tools/synthetix_read_auth_matrix.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run exhaustive read authorization matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf read_auth_matrix
          python audit_tools/synthetix_read_auth_matrix.py

      - name: Upload redacted authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-read-auth-matrix
          path: read_auth_matrix/
          if-no-files-found: error
          retention-days: 1
