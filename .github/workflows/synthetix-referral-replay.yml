name: synthetix-referral-replay

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-referral-replay.yml
      - audit_tools/synthetix_referral_replay_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run controlled empty-account replay boundary check
        shell: bash
        run: |
          set -euo pipefail
          rm -rf referral_replay_probe
          python audit_tools/synthetix_referral_replay_probe.py

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-referral-replay
          path: referral_replay_probe/
          if-no-files-found: error
          retention-days: 1
