name: synthetix-referral-valid-code-controls

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-referral-valid-code-controls.yml
      - audit_tools/synthetix_referral_valid_code_controls.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Discover one public code and run non-mutating referral controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf referral_valid_code_controls
          python audit_tools/synthetix_referral_valid_code_controls.py

      - name: Upload redacted control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-referral-valid-code-controls
          path: referral_valid_code_controls/
          if-no-files-found: error
          retention-days: 1
