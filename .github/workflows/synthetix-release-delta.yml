name: synthetix-release-delta

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-release-delta.yml
      - audit_tools/synthetix_release_delta.py

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare current and prior production asset graphs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_release_delta
          python -m py_compile audit_tools/synthetix_release_delta.py
          python audit_tools/synthetix_release_delta.py
      - name: Upload read-only release-delta evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-release-delta
          path: synthetix_release_delta/
          if-no-files-found: error
          retention-days: 1
