name: synthetix-rest-route-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-rest-route-boundary.yml
      - audit_tools/synthetix_rest_route_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run redacted REST dispatcher boundary checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rest_route_boundary
          python audit_tools/synthetix_rest_route_boundary.py

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-rest-route-boundary
          path: rest_route_boundary/summary.json
          if-no-files-found: error
          retention-days: 1
