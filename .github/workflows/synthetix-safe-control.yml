name: synthetix-safe-control

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-safe-control.yml
      - audit_tools/synthetix_safe_control_plane.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic ABI/hash dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1'

      - name: Collect public Safe configuration and control-plane evidence
        shell: bash
        run: |
          set -u
          rm -rf safe_control_plane
          mkdir -p safe_control_plane
          python -m py_compile audit_tools/synthetix_safe_control_plane.py >safe_control_plane/compile.stdout.txt 2>safe_control_plane/compile.stderr.txt
          compile_status=$?
          echo "$compile_status" > safe_control_plane/compile.exit_code.txt
          if [ "$compile_status" -eq 0 ]; then
            python -u audit_tools/synthetix_safe_control_plane.py >safe_control_plane/run.stdout.txt 2>safe_control_plane/run.stderr.txt
            run_status=$?
          else
            run_status=125
          fi
          echo "$run_status" > safe_control_plane/run.exit_code.txt
          exit 0

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-safe-control-plane
          path: safe_control_plane/
          if-no-files-found: error
          retention-days: 1
