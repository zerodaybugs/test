name: synthetix-scope-coverage
on:
  push:
    branches: [audit/synthetix-scope-coverage-20260727]
    paths:
      - .github/workflows/synthetix-scope-coverage.yml
      - audit_tools/synthetix_scope_coverage.py
permissions:
  contents: write
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/synthetix-scope-coverage-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare current public scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_scope_coverage
          python audit_tools/synthetix_scope_coverage.py
      - name: Commit coverage result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add synthetix_scope_coverage/
          if ! git diff --cached --quiet; then
            git commit -m 'Record current Synthetix scope coverage'
            git push origin HEAD:audit/synthetix-scope-coverage-20260727
          fi
