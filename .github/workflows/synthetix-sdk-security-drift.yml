name: synthetix-sdk-security-drift
on:
  pull_request:
    paths:
      - .github/workflows/synthetix-sdk-security-drift.yml
      - audit_tools/synthetix_sdk_security_drift.py
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public SDK drift
        run: |
          set -euo pipefail
          rm -rf synthetix_sdk_security_drift
          python audit_tools/synthetix_sdk_security_drift.py
      - name: Upload public drift evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-sdk-security-drift
          path: synthetix_sdk_security_drift/
          if-no-files-found: error
          retention-days: 2
