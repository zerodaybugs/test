name: synthetix-segment-handoff-runtime

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-segment-handoff-runtime.yml
      - audit_tools/synthetix_segment_handoff_runtime.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Run intercepted synthetic-wallet handoff probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf segment_handoff_runtime
          python audit_tools/synthetix_segment_handoff_runtime.py

      - name: Upload intercepted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-segment-handoff-runtime
          path: segment_handoff_runtime/
          if-no-files-found: error
          retention-days: 1
