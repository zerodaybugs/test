name: synthetix-server-route-injection

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-server-route-injection.yml
      - audit_tools/synthetix_server_route_injection.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run low-noise server-route injection matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf server_route_injection
          python audit_tools/synthetix_server_route_injection.py

      - name: Upload redacted route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-server-route-injection
          path: server_route_injection/
          if-no-files-found: error
          retention-days: 1
