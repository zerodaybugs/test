name: synthetix-session-frame-runtime
on:
  pull_request:
    paths:
      - .github/workflows/synthetix-session-frame-runtime.yml
      - audit_tools/synthetix_session_frame_runtime.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.54.0'
          python -m playwright install --with-deps chromium
      - name: Run synthetic session/frame differential
        run: |
          set -uo pipefail
          rm -rf synthetix_session_frame_runtime
          mkdir -p synthetix_session_frame_runtime
          set +e
          python audit_tools/synthetix_session_frame_runtime.py > synthetix_session_frame_runtime/run.log 2>&1
          status=$?
          set -e
          cat synthetix_session_frame_runtime/run.log
          exit "$status"
      - name: Upload redacted session/frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-session-frame-runtime
          path: synthetix_session_frame_runtime/
          if-no-files-found: error
          retention-days: 2
