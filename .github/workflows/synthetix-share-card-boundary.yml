name: synthetix-share-card-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-share-card-boundary.yml
      - audit_tools/synthetix_share_card_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fixed low-noise share-card renderer matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf share_card_boundary
          python -m py_compile audit_tools/synthetix_share_card_boundary.py
          python audit_tools/synthetix_share_card_boundary.py

      - name: Upload redacted renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-share-card-boundary
          path: share_card_boundary/
          if-no-files-found: error
          retention-days: 1
