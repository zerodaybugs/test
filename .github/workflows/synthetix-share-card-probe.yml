name: synthetix-share-card-probe

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-share-card-probe.yml
      - audit_tools/synthetix_share_card_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run six read-only share-card requests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf share_card_probe
          python3 audit_tools/synthetix_share_card_probe.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-share-card-probe
          path: share_card_probe/
          if-no-files-found: error
          retention-days: 1
