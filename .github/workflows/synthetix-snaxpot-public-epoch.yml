name: synthetix-snaxpot-public-epoch

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-snaxpot-public-epoch.yml
      - audit_tools/synthetix_snaxpot_public_epoch.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Query public Snaxpot epoch and statistics data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snaxpot_public_epoch
          python audit_tools/synthetix_snaxpot_public_epoch.py

      - name: Upload public read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-snaxpot-public-epoch
          path: snaxpot_public_epoch/
          if-no-files-found: error
          retention-days: 1
