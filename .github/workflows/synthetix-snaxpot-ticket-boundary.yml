name: synthetix-snaxpot-ticket-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-snaxpot-ticket-boundary.yml
      - audit_tools/synthetix_snaxpot_ticket_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Run synthetic Snaxpot ticket-binding differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snaxpot_ticket_boundary
          python audit_tools/synthetix_snaxpot_ticket_boundary.py

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-snaxpot-ticket-boundary
          path: snaxpot_ticket_boundary/
          if-no-files-found: error
          retention-days: 1
