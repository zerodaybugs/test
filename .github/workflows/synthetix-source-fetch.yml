name: synthetix-source-fetch

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-source-fetch.yml

permissions:
  contents: read

jobs:
  fetch-public-verified-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public verification artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.error
          import urllib.request

          targets = {
              "deposit_proxy": "0xD62595c3c23B690BAEE0935e107A209Cb1Dbd37B",
              "deposit_current_impl": "0xff6611190b48Cc920EF3c5DCbD356bF2C20D731F",
              "deposit_previous_impl": "0x985814a3057cc631e145199db599adde77a7ca4b",
              "lens": "0x99E61877aF9Bc6805BCc3813F655D94Ed5f3782A",
              "permissions_registry_proxy": "0x45F91031b33Da2585932c8f1cdFF0faa6cD329ae",
          }

          out = pathlib.Path("out")
          manifest = []
          headers = {"User-Agent": "Mozilla/5.0 source-audit/1.0"}

          for name, address in targets.items():
              endpoints = {
                  "sourcify_v2": f"https://sourcify.dev/server/v2/contract/1/{address}?fields=all",
                  "sourcify_full_metadata": f"https://repo.sourcify.dev/contracts/full_match/1/{address}/metadata.json",
                  "sourcify_partial_metadata": f"https://repo.sourcify.dev/contracts/partial_match/1/{address}/metadata.json",
                  "etherscan_html": f"https://etherscan.io/address/{address}#code",
              }
              for kind, url in endpoints.items():
                  suffix = "json" if "sourcify" in kind else "html"
                  path = out / f"{name}__{kind}.{suffix}"
                  record = {"name": name, "address": address, "kind": kind, "url": url, "path": str(path)}
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=45) as response:
                          body = response.read()
                          path.write_bytes(body)
                          record.update({"status": response.status, "bytes": len(body), "content_type": response.headers.get("content-type")})
                  except urllib.error.HTTPError as exc:
                      body = exc.read()
                      path.write_bytes(body)
                      record.update({"status": exc.code, "bytes": len(body), "error": str(exc)})
                  except Exception as exc:
                      path.write_text(str(exc), encoding="utf-8")
                      record.update({"status": None, "bytes": path.stat().st_size, "error": repr(exc)})
                  manifest.append(record)

          (out / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload fetched public artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-public-verification-artifacts
          path: out/
          if-no-files-found: error
          retention-days: 1
