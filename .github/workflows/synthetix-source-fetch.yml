name: synthetix-source-fetch

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-source-fetch.yml
      - audit_tools/synthetix_state_read.py

permissions:
  contents: read

jobs:
  fetch-public-verified-sources-and-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary audit branch
        uses: actions/checkout@v4

      - name: Fetch public verified sources and read-only on-chain state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          python3 audit_tools/synthetix_state_read.py

      - name: Upload public audit inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-public-audit-inputs-v2
          path: out/
          if-no-files-found: error
          retention-days: 1
