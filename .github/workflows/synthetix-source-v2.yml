name: synthetix-source-v2

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-source-v2.yml
      - audit_tools/synthetix_source_v2_collect.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect exact verified source artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_source_v2
          python audit_tools/synthetix_source_v2_collect.py

      - name: Upload read-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-source-v2
          path: synthetix_source_v2/
          if-no-files-found: error
          retention-days: 1
