name: synthetix-state-read-v2

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-state-read-v2.yml
      - audit_tools/run_synthetix_state_read.py
      - audit_tools/synthetix_state_read.py

permissions:
  contents: read

jobs:
  collect-read-only-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary audit branch
        uses: actions/checkout@v4

      - name: Collect public verified sources and read-only state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          python3 audit_tools/run_synthetix_state_read.py

      - name: Upload collector outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-public-audit-inputs-v2
          path: out/
          if-no-files-found: error
          retention-days: 1
