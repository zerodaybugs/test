name: synthetix-state-read-v3

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-state-read-v3.yml
      - audit_tools/synthetix_state_quick.py
      - audit_tools/synthetix_state_read.py

permissions:
  contents: read

jobs:
  collect-read-only-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary audit branch
        uses: actions/checkout@v4

      - name: Collect public verified sources and scalar on-chain state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          python3 audit_tools/synthetix_state_quick.py

      - name: Upload read-only snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-public-audit-inputs-v3
          path: out/
          if-no-files-found: error
          retention-days: 1
