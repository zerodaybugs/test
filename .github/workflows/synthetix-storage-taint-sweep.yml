name: synthetix-storage-taint-sweep

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-storage-taint-sweep.yml
      - audit_tools/synthetix_storage_taint_sweep.py

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.54.0'
          python -m playwright install --with-deps chromium
      - name: Run storage taint sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          rm -rf synthetix_storage_taint_sweep
          mkdir -p synthetix_storage_taint_sweep
          set +e
          python audit_tools/synthetix_storage_taint_sweep.py > synthetix_storage_taint_sweep/run.log 2>&1
          status=$?
          set -e
          cat synthetix_storage_taint_sweep/run.log
          exit "$status"
      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-storage-taint-sweep
          path: synthetix_storage_taint_sweep/
          if-no-files-found: error
          retention-days: 1
