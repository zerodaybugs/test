name: synthetix-subdomain-fingerprint

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-subdomain-fingerprint.yml
      - audit_tools/synthetix_subdomain_fingerprint.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run one-request-per-host ownership fingerprint audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf subdomain_fingerprint
          python3 audit_tools/synthetix_subdomain_fingerprint.py

      - name: Upload read-only fingerprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-subdomain-fingerprint
          path: subdomain_fingerprint/
          if-no-files-found: error
          retention-days: 1
