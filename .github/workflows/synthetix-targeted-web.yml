name: synthetix-targeted-web

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-targeted-web.yml
      - audit_tools/fetch_synthetix_targeted_chunks.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch explicitly referenced public assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf targeted_web_assets
          python3 audit_tools/fetch_synthetix_targeted_chunks.py
      - name: Upload targeted assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-targeted-web-assets
          path: targeted_web_assets/
          if-no-files-found: error
          retention-days: 1
