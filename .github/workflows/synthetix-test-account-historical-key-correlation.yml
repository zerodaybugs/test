name: synthetix-test-account-historical-key-correlation

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-test-account-historical-key-correlation.yml
      - audit_tools/synthetix_test_account_historical_key_correlation.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ethereum derivation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7' 'eth-utils==5.3.1'
      - name: Scan public history for a controlled official test account
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_test_account_historical_key_correlation
          python -m py_compile audit_tools/synthetix_test_account_historical_key_correlation.py
          python audit_tools/synthetix_test_account_historical_key_correlation.py
      - name: Upload redacted read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-test-account-historical-key-correlation
          path: synthetix_test_account_historical_key_correlation/
          if-no-files-found: error
          retention-days: 1
