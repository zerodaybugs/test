name: synthetix-test-dev-account-discovery

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-test-dev-account-discovery.yml
      - audit_tools/synthetix_test_dev_account_discovery.py

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned account derivation dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Query public deterministic development accounts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test_dev_account_discovery
          python audit_tools/synthetix_test_dev_account_discovery.py

      - name: Upload read-only test account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-test-dev-account-discovery
          path: test_dev_account_discovery/
          if-no-files-found: error
          retention-days: 1
