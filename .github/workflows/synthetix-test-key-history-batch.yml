name: synthetix-test-key-history-batch

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-test-key-history-batch.yml
      - audit_tools/synthetix_test_key_history_batch.py

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        repo:
          - Synthetixio/synthetix-exchange
          - Synthetixio/js-monorepo
          - Synthetixio/staking
          - Synthetixio/perps-keepers
          - Synthetixio/kwenta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned address derivation dependency
        run: python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Scan full public history
        env:
          SOURCE_REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          rm -rf synthetix_test_key_history_batch
          python -m py_compile audit_tools/synthetix_test_key_history_batch.py
          python audit_tools/synthetix_test_key_history_batch.py
      - name: Upload redacted read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-test-key-history-${{ strategy.job-index }}
          path: synthetix_test_key_history_batch/
          if-no-files-found: error
          retention-days: 1
