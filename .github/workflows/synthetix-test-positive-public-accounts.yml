name: synthetix-test-positive-public-accounts

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-test-positive-public-accounts.yml
      - audit_tools/synthetix_test_positive_public_accounts.py

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checksum dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1'

      - name: Enumerate public test-positive wallets
        shell: bash
        run: |
          set -uo pipefail
          rm -rf test_positive_public_accounts
          mkdir -p test_positive_public_accounts
          set +e
          python -m py_compile audit_tools/synthetix_test_positive_public_accounts.py > test_positive_public_accounts/run.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python audit_tools/synthetix_test_positive_public_accounts.py >> test_positive_public_accounts/run.log 2>&1
            status=$?
          fi
          set -e
          cat test_positive_public_accounts/run.log
          exit "$status"

      - name: Upload public read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-test-positive-public-accounts
          path: test_positive_public_accounts/
          if-no-files-found: error
          retention-days: 1
