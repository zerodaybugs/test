name: synthetix-unsigned-identity-probe

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-unsigned-identity-probe.yml
      - audit_tools/synthetix_unsigned_identity_probe.py
      - audit_tools/synthetix_read_auth_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EIP-712 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Run controlled read-only identity-binding checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unsigned_identity_probe
          python audit_tools/synthetix_unsigned_identity_probe.py
      - name: Upload redacted summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-unsigned-identity-probe
          path: unsigned_identity_probe/summary.json
          if-no-files-found: error
          retention-days: 1
