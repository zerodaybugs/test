name: synthetix-vce-field-binding

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-vce-field-binding.yml
      - audit_tools/synthetix_vce_field_binding.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned EIP-712 dependency
        run: python -m pip install --disable-pip-version-check 'eth-account==0.13.7'
      - name: Run exact VCE field-binding differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_vce_field_binding
          python -m py_compile audit_tools/synthetix_vce_field_binding.py
          python audit_tools/synthetix_vce_field_binding.py
      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-vce-field-binding
          path: synthetix_vce_field_binding/
          if-no-files-found: error
          retention-days: 1
