name: synthetix-vendored-api-review

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-vendored-api-review.yml
      - audit_tools/synthetix_vendored_api_review.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and index public V4 API-adjacent source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_vendored_api_review
          python -m py_compile audit_tools/synthetix_vendored_api_review.py
          python audit_tools/synthetix_vendored_api_review.py
      - name: Upload immutable public-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-vendored-api-review
          path: synthetix_vendored_api_review/
          if-no-files-found: error
          retention-days: 1
