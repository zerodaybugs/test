name: synthetix-waas-message-origin-runtime

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-waas-message-origin-runtime.yml
      - audit_tools/synthetix_waas_message_origin_runtime.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Run intercepted production message-origin probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf waas_message_origin_runtime
          python audit_tools/synthetix_waas_message_origin_runtime.py

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-waas-message-origin-runtime
          path: waas_message_origin_runtime/
          if-no-files-found: error
          retention-days: 1
