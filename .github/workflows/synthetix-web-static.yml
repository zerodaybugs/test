name: synthetix-web-static

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-web-static.yml
      - audit_tools/fetch_synthetix_web_assets.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect same-origin public assets referenced by in-scope pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web_assets
          python3 audit_tools/fetch_synthetix_web_assets.py
      - name: Upload static inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-web-static-assets
          path: web_assets/
          if-no-files-found: error
          retention-days: 1
