name: synthetix-web-supplychain-collector
on:
  push:
    branches: [audit/synthetix-web-supplychain-collector-20260727]
    paths:
      - .github/workflows/synthetix-web-supplychain-collector.yml
      - audit_tools/synthetix_web_supplychain_collector.py
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/synthetix-web-supplychain-collector-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for and collect web/supply-chain artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf synthetix_web_supplychain_round
          python audit_tools/synthetix_web_supplychain_collector.py
      - name: Commit web/supply-chain result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add synthetix_web_supplychain_round/ROUND_STATUS.md synthetix_web_supplychain_round/round_summary.json synthetix_web_supplychain_round/Synthetix_Web_SupplyChain_Round_Result.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Record Synthetix web supply-chain round result'
            git push origin HEAD:audit/synthetix-web-supplychain-collector-20260727
          fi
      - name: Upload consolidated web/supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-web-supplychain-round
          path: synthetix_web_supplychain_round/
          if-no-files-found: error
          retention-days: 2
