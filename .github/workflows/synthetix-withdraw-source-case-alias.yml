name: synthetix-withdraw-source-case-alias

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-withdraw-source-case-alias.yml
      - audit_tools/synthetix_withdraw_source_case_alias.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Compile and run source case-alias differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf withdraw_source_case_alias withdraw_source_case_alias_diagnostics
          mkdir -p withdraw_source_case_alias_diagnostics
          python -m py_compile audit_tools/synthetix_withdraw_source_case_alias.py \
            > withdraw_source_case_alias_diagnostics/py_compile.log 2>&1
          set +e
          python audit_tools/synthetix_withdraw_source_case_alias.py \
            > withdraw_source_case_alias_diagnostics/run.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > withdraw_source_case_alias_diagnostics/exit_code.txt
          if [ -d withdraw_source_case_alias ]; then
            cp -R withdraw_source_case_alias withdraw_source_case_alias_diagnostics/output
          fi
          cat withdraw_source_case_alias_diagnostics/run.log
          exit 0

      - name: Upload source case-alias evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-withdraw-source-case-alias
          path: withdraw_source_case_alias_diagnostics/
          if-no-files-found: error
          retention-days: 1
