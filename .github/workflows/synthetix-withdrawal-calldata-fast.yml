name: synthetix-withdrawal-calldata-fast

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-withdrawal-calldata-fast.yml
      - audit_tools/synthetix_withdrawal_calldata_fast.py

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ABI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-abi==5.2.0' 'eth-utils==5.3.1'
      - name: Reconstruct targeted withdrawal calldata history
        shell: bash
        run: |
          set -uo pipefail
          rm -rf synthetix_withdrawal_calldata_fast
          mkdir -p synthetix_withdrawal_calldata_fast
          set +e
          python -m py_compile audit_tools/synthetix_withdrawal_calldata_fast.py > synthetix_withdrawal_calldata_fast/run.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python audit_tools/synthetix_withdrawal_calldata_fast.py >> synthetix_withdrawal_calldata_fast/run.log 2>&1
            status=$?
          fi
          set -e
          cat synthetix_withdrawal_calldata_fast/run.log
          exit "$status"
      - name: Upload read-only structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-withdrawal-calldata-fast
          path: synthetix_withdrawal_calldata_fast/
          if-no-files-found: error
          retention-days: 1
