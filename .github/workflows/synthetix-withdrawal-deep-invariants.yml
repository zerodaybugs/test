name: synthetix-withdrawal-deep-invariants

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-withdrawal-deep-invariants.yml
      - research/synthetix-withdrawal-deep-invariants/**

permissions:
  contents: read

jobs:
  local-fork-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/synthetix-withdrawal-deep-invariants
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install isolated test dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib/forge-std
          mkdir -p lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Run production-proxy deep invariant suite on local fork
        shell: bash
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir -p evidence
          forge --version | tee evidence/foundry-version.txt
          forge test -vvvv --match-path test/SynthetixWithdrawalDeepInvariants.t.sol 2>&1 | tee evidence/forge-test.txt
          sha256sum foundry.toml test/SynthetixWithdrawalDeepInvariants.t.sol evidence/forge-test.txt > evidence/SHA256SUMS
          cat > evidence/SAFETY.txt <<'EOF'
          All state changes occur only inside an ephemeral local Ethereum fork. The workflow signs and broadcasts no transaction to Ethereum mainnet or any public testnet. Role impersonation, time travel and test-address generation are Foundry VM operations confined to the local process.
          EOF

      - name: Upload local-fork invariant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-withdrawal-deep-invariants
          path: research/synthetix-withdrawal-deep-invariants/evidence/
          if-no-files-found: error
          retention-days: 1
