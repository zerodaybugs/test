name: synthetix-withdrawal-edge-fork

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-withdrawal-edge-fork.yml
      - audit_tools/synthetix_withdrawal_edge_fork.py

permissions:
  contents: read

jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'web3==7.13.0'
      - name: Install Foundry
        run: |
          set -euo pipefail
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup --install v1.7.1
          anvil --version
      - name: Start isolated mainnet fork
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.foundry/bin:$PATH"
          providers=(
            'https://ethereum-rpc.publicnode.com'
            'https://eth.llamarpc.com'
          )
          ok=0
          for provider in "${providers[@]}"; do
            nohup anvil --fork-url "$provider" --host 127.0.0.1 --port 8545 --silent > /tmp/anvil.log 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              if curl -sS -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' http://127.0.0.1:8545 | grep -q 'result'; then
                echo "$pid" > /tmp/anvil.pid
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" -eq 1 ]; then break; fi
            kill "$pid" 2>/dev/null || true
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/anvil.log; exit 1; fi
      - name: Run withdrawal edge-case probe
        run: |
          set -uo pipefail
          rm -rf synthetix_withdrawal_edge_fork
          mkdir -p synthetix_withdrawal_edge_fork
          set +e
          python audit_tools/synthetix_withdrawal_edge_fork.py > synthetix_withdrawal_edge_fork/run.log 2>&1
          status=$?
          set -e
          cat synthetix_withdrawal_edge_fork/run.log
          exit "$status"
      - name: Upload local-fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-withdrawal-edge-fork
          path: synthetix_withdrawal_edge_fork/
          if-no-files-found: error
          retention-days: 2
