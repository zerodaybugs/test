name: synthetix-withdrawal-lifecycle

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-withdrawal-lifecycle.yml
      - research/synthetix-withdrawal-overcommit/analyze_withdrawal_lifecycle.py

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned ABI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-abi==5.2.0' 'eth-utils==5.3.1'

      - name: Reconstruct public withdrawal lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lifecycle_evidence
          python research/synthetix-withdrawal-overcommit/analyze_withdrawal_lifecycle.py

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-withdrawal-lifecycle
          path: lifecycle_evidence/
          if-no-files-found: error
          retention-days: 1
