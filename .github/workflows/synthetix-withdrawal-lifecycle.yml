name: synthetix-withdrawal-lifecycle

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-withdrawal-lifecycle.yml
      - research/synthetix-withdrawal-overcommit/analyze_withdrawal_lifecycle.py

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned ABI and hashing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'eth-abi==5.2.0' \
            'eth-utils==5.3.1' \
            'eth-hash[pycryptodome]==0.7.1'

      - name: Reconstruct public withdrawal lifecycle and preserve diagnostics
        shell: bash
        run: |
          set -u
          rm -rf lifecycle_evidence
          mkdir -p lifecycle_evidence
          set +e
          python research/synthetix-withdrawal-overcommit/analyze_withdrawal_lifecycle.py > lifecycle_evidence/runtime.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > lifecycle_evidence/exit-code.txt
          cat lifecycle_evidence/runtime.log
          exit 0

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-withdrawal-lifecycle
          path: lifecycle_evidence/
          if-no-files-found: error
          retention-days: 1
