name: synthetix-withdrawal-overcommit-fork

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-withdrawal-overcommit-fork.yml
      - research/synthetix-withdrawal-overcommit/**

permissions:
  contents: read

jobs:
  local-fork-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/synthetix-withdrawal-overcommit
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install isolated test dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib/forge-std
          mkdir -p lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Run production-proxy test on local Ethereum fork
        shell: bash
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir -p evidence
          forge --version | tee evidence/foundry-version.txt
          forge test -vvv --match-path test/SynthetixWithdrawalOvercommit.t.sol 2>&1 | tee evidence/forge-test.txt
          sha256sum foundry.toml test/SynthetixWithdrawalOvercommit.t.sol evidence/forge-test.txt > evidence/SHA256SUMS
          cat > evidence/SAFETY.txt <<'EOF'
          The test executes only against an ephemeral local fork. It signs and broadcasts no transaction to Ethereum mainnet or any public testnet. Role impersonation and token balance seeding are Foundry VM operations confined to the local test process.
          EOF

      - name: Upload local-fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-withdrawal-overcommit-fork
          path: research/synthetix-withdrawal-overcommit/evidence/
          if-no-files-found: error
          retention-days: 1
