name: synthetix-withdrawal-project-inventory

on:
  push:
    branches:
      - audit/synthetix-withdrawal-state-machine-20260727
    paths:
      - .github/workflows/synthetix-withdrawal-project-inventory.yml
      - audit_tools/inventory_synthetix_withdrawal_project.sh

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/synthetix-withdrawal-state-machine-20260727
      - name: Build public project inventory
        run: bash audit_tools/inventory_synthetix_withdrawal_project.sh
      - name: Commit inventory
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add synthetix_withdrawal_project_inventory/
          if git diff --cached --quiet; then
            echo 'No inventory changes'
          else
            git commit -m 'Record Synthetix withdrawal project inventory'
            git push origin HEAD:audit/synthetix-withdrawal-state-machine-20260727
          fi
