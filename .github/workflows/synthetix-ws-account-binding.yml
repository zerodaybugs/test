name: synthetix-ws-account-binding

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-ws-account-binding.yml
      - audit_tools/synthetix_ws_account_binding.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned signing and WebSocket dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'eth-account==0.13.7' \
            'websockets==15.0.1'

      - name: Run read-only account-binding checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ws_account_binding
          python audit_tools/synthetix_ws_account_binding.py

      - name: Upload redacted summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-ws-account-binding
          path: ws_account_binding/summary.json
          if-no-files-found: error
          retention-days: 1
