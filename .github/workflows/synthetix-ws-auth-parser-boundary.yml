name: synthetix-ws-auth-parser-boundary

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-ws-auth-parser-boundary.yml
      - audit_tools/synthetix_ws_auth_parser_boundary.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EIP-712 and WebSocket dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-account==0.13.7' 'websockets==15.0.1'

      - name: Run synthetic WebSocket auth parser differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ws_auth_parser_boundary
          python audit_tools/synthetix_ws_auth_parser_boundary.py

      - name: Upload redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-ws-auth-parser-boundary
          path: ws_auth_parser_boundary/
          if-no-files-found: error
          retention-days: 1
