name: synthetix-ws-auth-telemetry-direct

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-ws-auth-telemetry-direct.yml
      - audit_tools/synthetix_ws_auth_telemetry_direct.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser and signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0' 'eth-account==0.13.7'
          python -m playwright install --with-deps chromium
      - name: Run direct production-manager telemetry differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_ws_auth_telemetry_direct
          python -m py_compile audit_tools/synthetix_ws_auth_telemetry_direct.py
          python audit_tools/synthetix_ws_auth_telemetry_direct.py
      - name: Upload redacted synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-ws-auth-telemetry-direct
          path: synthetix_ws_auth_telemetry_direct/
          if-no-files-found: error
          retention-days: 1
