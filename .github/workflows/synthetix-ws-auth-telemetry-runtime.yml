name: synthetix-ws-auth-telemetry-runtime

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-ws-auth-telemetry-runtime.yml
      - audit_tools/synthetix_ws_auth_telemetry_runtime.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Run intercepted private WebSocket auth telemetry differential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf synthetix_ws_auth_telemetry_runtime
          python -m py_compile audit_tools/synthetix_ws_auth_telemetry_runtime.py
          python audit_tools/synthetix_ws_auth_telemetry_runtime.py
      - name: Upload redacted synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-ws-auth-telemetry-runtime
          path: synthetix_ws_auth_telemetry_runtime/
          if-no-files-found: error
          retention-days: 1
