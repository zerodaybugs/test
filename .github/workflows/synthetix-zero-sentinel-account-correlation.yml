name: synthetix-zero-sentinel-account-correlation

on:
  pull_request:
    paths:
      - .github/workflows/synthetix-zero-sentinel-account-correlation.yml
      - audit_tools/synthetix_zero_sentinel_account_correlation.py

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checksum dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'eth-utils==5.3.1'

      - name: Correlate zero-sentinel deposit identities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf zero_sentinel_account_correlation
          python -m py_compile audit_tools/synthetix_zero_sentinel_account_correlation.py
          python audit_tools/synthetix_zero_sentinel_account_correlation.py

      - name: Upload redacted correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetix-zero-sentinel-account-correlation
          path: zero_sentinel_account_correlation/
          if-no-files-found: error
          retention-days: 1
