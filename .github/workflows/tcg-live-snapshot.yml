name: tcg-live-snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/tcg-live-snapshot.yml'
      - 'tcg-live-snapshot-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Read public BSC Chapel state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export

          RPC=''
          for candidate in \
            'https://bsc-testnet-rpc.publicnode.com' \
            'https://data-seed-prebsc-1-s1.binance.org:8545/' \
            'https://data-seed-prebsc-2-s1.binance.org:8545/' \
            'https://bsc-testnet-dataseed.bnbchain.org' \
            'https://bsc-testnet.rpc.thirdweb.com'; do
            if chain_id="$(cast chain-id --rpc-url "$candidate" 2>/dev/null)" && [ "$chain_id" = '97' ]; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"

          TCGV='0xBA9E4d6b0b8C3BB13b28a3b3A2F09012674eD5C0'
          NEXUS='0xb11426B649404EF2dF7F8F7ACf3dE3Aa00E3Ed60'
          BUY='0x3D5c49910f32ed78dC83141fABf1033d7B5e52e2'
          STAKING='0x8d2478b2901036a4a0F88c4dfE6b6075E02d197A'
          BASIC='0xE901ec321C5aA78f080Bf99CC31e7b83c7a0fD0D'
          FOUNDER='0xB8a75c065556c95f7Ce86eAefdCE849aFA8e6324'
          LAUNCH='0x411db8fA3638976b6802e76Bb0789014eED4C1e9'
          TCGR='0xd9Be1AFaBDcc07FaeD8f64d9dbfe56459085BB0D'
          CONVERTER='0xE150B30181D455c8A47A27DBEbB1de41Ec6d8d97'
          USDC='0xC6aCe01fFc5B8925d5F4C2D427481F8612B4CA1B'
          FACTORY='0x6725F303b657a9451d8BA641348b6761A6CC7a17'

          call() {
            local label="$1" address="$2" signature="$3"; shift 3
            local value
            if value="$(cast call "$address" "$signature" "$@" --rpc-url "$RPC" 2>&1)"; then
              printf '%s=%s\n' "$label" "$value"
            else
              printf '%s=ERROR:%s\n' "$label" "$(printf '%s' "$value" | tr '\n' ' ')"
            fi
          }

          code_fingerprint() {
            local label="$1" address="$2" code hash bytes
            code="$(cast code "$address" --rpc-url "$RPC")"
            hash="$(cast keccak "$code")"
            bytes=$(( (${#code} - 2) / 2 ))
            printf '%s_address=%s\n%s_code_bytes=%s\n%s_codehash=%s\n' "$label" "$address" "$label" "$bytes" "$label" "$hash"
          }

          {
            printf 'snapshot_utc=%s\n' "$(date -u +%FT%TZ)"
            printf 'rpc=%s\n' "$RPC"
            printf 'chain_id=%s\n' "$(cast chain-id --rpc-url "$RPC")"
            printf 'block=%s\n' "$(cast block-number --rpc-url "$RPC")"

            for item in \
              "TCGV:$TCGV" "NEXUS:$NEXUS" "BUY:$BUY" "STAKING:$STAKING" \
              "BASIC:$BASIC" "FOUNDER:$FOUNDER" "LAUNCH:$LAUNCH" \
              "TCGR:$TCGR" "CONVERTER:$CONVERTER" "USDC:$USDC"; do
              code_fingerprint "${item%%:*}" "${item#*:}"
            done

            PAIR="$(cast call "$FACTORY" 'getPair(address,address)(address)' "$TCGV" "$USDC" --rpc-url "$RPC")"
            printf 'PAIR_address=%s\n' "$PAIR"
            code_fingerprint 'PAIR' "$PAIR"

            call USDC_decimals "$USDC" 'decimals()(uint8)'
            call USDC_totalSupply "$USDC" 'totalSupply()(uint256)'

            call PAIR_token0 "$PAIR" 'token0()(address)'
            call PAIR_token1 "$PAIR" 'token1()(address)'
            call PAIR_reserves "$PAIR" 'getReserves()(uint112,uint112,uint32)'
            call PAIR_lpSupply "$PAIR" 'totalSupply()(uint256)'
            call PAIR_tcgvBalance "$TCGV" 'balanceOf(address)(uint256)' "$PAIR"
            call PAIR_usdcBalance "$USDC" 'balanceOf(address)(uint256)' "$PAIR"

            call TCGV_totalSupply "$TCGV" 'totalSupply()(uint256)'
            call TCGV_presaleActive "$TCGV" 'presaleActive()(bool)'
            call TCGV_supplyRecomputed "$TCGV" 'supplyRecomputed()(bool)'
            call TCGV_staking "$TCGV" 'stakingVault()(address)'
            call TCGV_launch "$TCGV" 'initialLaunch()(address)'
            call TCGV_buyRouter "$TCGV" 'buyRouter()(address)'
            call TCGV_pairRegistered "$TCGV" 'isPair(address)(bool)' "$PAIR"
            call TCGV_buyRouterExcluded "$TCGV" 'isExcludedFromFees(address)(bool)' "$BUY"
            call TCGV_stakingExcluded "$TCGV" 'isExcludedFromFees(address)(bool)' "$STAKING"
            call TCGV_pendingAutolp "$TCGV" 'pendingAutolp()(uint256)'
            call TCGV_contractBalance "$TCGV" 'balanceOf(address)(uint256)' "$TCGV"

            call NEXUS_totalSupply "$NEXUS" 'totalSupply()(uint256)'
            call NEXUS_minter "$NEXUS" 'minter()(address)'
            call NEXUS_founder "$NEXUS" 'founderNFTPresaleBonus()(address)'
            call NEXUS_launch "$NEXUS" 'initialLaunchPresaleBonus()(address)'

            call BUY_router "$BUY" 'router()(address)'
            call BUY_factory "$BUY" 'factory()(address)'
            call BUY_tcgv "$BUY" 'tcgv()(address)'
            call BUY_usdc "$BUY" 'usdc()(address)'
            call BUY_referral "$BUY" 'referralToken()(address)'
            call BUY_buyVaultBp "$BUY" 'buyVaultBp()(uint256)'
            call BUY_buyMarketingBp "$BUY" 'buyMarketingBp()(uint256)'
            call BUY_buyCommunityBp "$BUY" 'buyCommunityBp()(uint256)'
            call BUY_sellTaxBp "$BUY" 'sellTaxBp()(uint256)'
            call BUY_usdcBalance "$USDC" 'balanceOf(address)(uint256)' "$BUY"

            call STAKING_asset "$STAKING" 'asset()(address)'
            call STAKING_basicNft "$STAKING" 'basicNFTContract()(address)'
            call STAKING_pricingRouter "$STAKING" 'basicNFTPricingRouter()(address)'
            call STAKING_pricingUsdc "$STAKING" 'basicNFTPricingUsdc()(address)'
            call STAKING_required "$STAKING" 'requiredStakeForBasicNFT()(uint256)'
            call STAKING_totalAssets "$STAKING" 'totalAssets()(uint256)'
            call STAKING_totalSupply "$STAKING" 'totalSupply()(uint256)'
            call STAKING_anchor "$STAKING" 'basicNFTPricingTwapAnchor()(uint32,uint256)'

            call BASIC_staking "$BASIC" 'stakingVault()(address)'
            call BASIC_totalSupply "$BASIC" 'totalSupply()(uint256)'
            call BASIC_totalMinted "$BASIC" 'totalMinted()(uint256)'
            call BASIC_required "$BASIC" 'requiredStake()(uint256)'

            call FOUNDER_usdc "$FOUNDER" 'usdc()(address)'
            call FOUNDER_nexus "$FOUNDER" 'nexusToken()(address)'
            call FOUNDER_sold "$FOUNDER" 'soldCount()(uint256)'
            call FOUNDER_reserveMinted "$FOUNDER" 'strategicReserveMinted()(uint256)'
            call FOUNDER_wave "$FOUNDER" 'currentWave()(uint256)'
            call FOUNDER_price "$FOUNDER" 'currentPrice()(uint256)'
            call FOUNDER_wave2Start "$FOUNDER" 'wave2StartTimestamp()(uint256)'

            call LAUNCH_tcgv "$LAUNCH" 'tcgv()(address)'
            call LAUNCH_usdc "$LAUNCH" 'usdc()(address)'
            call LAUNCH_founder "$LAUNCH" 'founderNFT()(address)'
            call LAUNCH_nexus "$LAUNCH" 'nexusToken()(address)'
            call LAUNCH_allocated "$LAUNCH" 'totalTCGVAllocated()(uint256)'
            call LAUNCH_tge "$LAUNCH" 'tgeTimestamp()(uint256)'
            call LAUNCH_price "$LAUNCH" 'currentPrice()(uint256)'
            call LAUNCH_end "$LAUNCH" 'presaleEndTime()(uint256)'

            call TCGR_totalSupply "$TCGR" 'totalSupply()(uint256)'
            call TCGR_minter "$TCGR" 'minter()(address)'
            call TCGR_converter "$TCGR" 'converter()(address)'
            call TCGR_qualifyingNft "$TCGR" 'qualifyingNft()(address)'

            call CONVERTER_ratio "$CONVERTER" 'ratio()(uint256)'
            call CONVERTER_tcgr "$CONVERTER" 'tcgr()(address)'
            call CONVERTER_tcgv "$CONVERTER" 'tcgv()(address)'
            call CONVERTER_tcgvBalance "$TCGV" 'balanceOf(address)(uint256)' "$CONVERTER"
          } | tee export/TCG_LIVE_STATE.txt

          sha256sum export/TCG_LIVE_STATE.txt > export/SHA256SUMS.txt

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tcg-live-state-20260809
          path: export/
          if-no-files-found: error
          retention-days: 1
