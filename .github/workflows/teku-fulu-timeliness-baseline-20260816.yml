name: Teku Fulu timeliness exact release versus public fix

on:
  push:
    branches:
      - tmp/teku-fulu-timeliness-baseline-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone Teku and run exact 26.8.0 release test
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/Consensys/teku.git teku-release
          git -C teku-release checkout --detach 26.8.0
          cp research/teku/V19FuluDaTimelinessTest.java \
            teku-release/storage/src/test/java/tech/pegasys/teku/storage/client/V19FuluDaTimelinessTest.java
          git -C teku-release rev-parse HEAD > RELEASE_COMMIT.txt
          set +e
          (cd teku-release && ./gradlew :storage:test \
            --tests tech.pegasys.teku.storage.client.V19FuluDaTimelinessTest \
            --no-daemon --stacktrace) 2>&1 | tee RELEASE_TEST.log
          release_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$release_rc" > RELEASE_TEST_EXIT_CODE.txt

      - name: Run same test after public fix
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/Consensys/teku.git teku-fixed
          git -C teku-fixed checkout --detach 81a995613f9838062e1c01d7fc195a34965a6a95
          cp research/teku/V19FuluDaTimelinessTest.java \
            teku-fixed/storage/src/test/java/tech/pegasys/teku/storage/client/V19FuluDaTimelinessTest.java
          git -C teku-fixed rev-parse HEAD > FIX_COMMIT.txt
          set +e
          (cd teku-fixed && ./gradlew :storage:test \
            --tests tech.pegasys.teku.storage.client.V19FuluDaTimelinessTest \
            --no-daemon --stacktrace) 2>&1 | tee FIX_TEST.log
          fix_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$fix_rc" > FIX_TEST_EXIT_CODE.txt

      - name: Record differential verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          release_rc="$(cat RELEASE_TEST_EXIT_CODE.txt 2>/dev/null || echo missing)"
          fix_rc="$(cat FIX_TEST_EXIT_CODE.txt 2>/dev/null || echo missing)"
          if [[ "$release_rc" != "0" && "$fix_rc" == "0" ]]; then
            verdict="PUBLIC_BASELINE_CONFIRMED_RELEASE_VULNERABLE_FIX_PASSES"
            gate="DO_NOT_SUBMIT_PUBLIC_FIX_ORACLE_ONLY"
          else
            verdict="BASELINE_NOT_CONFIRMED_REVIEW_LOGS"
            gate="HOLD"
          fi
          mkdir -p research/teku/results
          cat > research/teku/results/V19_RESULT.json <<EOF
          {
            "schema": "teku-fulu-da-timeliness-baseline-v1",
            "exact_release": "26.8.0",
            "release_commit": "$(cat RELEASE_COMMIT.txt 2>/dev/null || echo missing)",
            "public_fix_commit": "$(cat FIX_COMMIT.txt 2>/dev/null || echo missing)",
            "release_test_exit_code": "${release_rc}",
            "fixed_test_exit_code": "${fix_rc}",
            "verdict": "${verdict}",
            "severity_gate": "${gate}"
          }
          EOF
          cp RELEASE_TEST.log research/teku/results/V19_RELEASE_TEST.log 2>/dev/null || true
          cp FIX_TEST.log research/teku/results/V19_FIX_TEST.log 2>/dev/null || true

      - name: Persist baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/teku/results
          if ! git diff --cached --quiet; then
            git commit -m "research: record Teku Fulu timeliness baseline [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teku-fulu-timeliness-release-vs-fix
          retention-days: 1
          path: |
            RELEASE_COMMIT.txt
            FIX_COMMIT.txt
            RELEASE_TEST_EXIT_CODE.txt
            FIX_TEST_EXIT_CODE.txt
            RELEASE_TEST.log
            FIX_TEST.log
            research/teku/V19FuluDaTimelinessTest.java
            research/teku/results/V19_RESULT.json
