name: Temporary public TermMax toolchain bootstrap v2 20260728

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    if: github.head_ref == 'bootstrap/termmax-toolchain-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TERMMAX_COMMIT: e314f3f849577dfecd4614f148c4df81fdf8c72d
      EVIDENCE: evidence
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/pr_head.txt"
          uname -a > "$EVIDENCE/runner.txt"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Record Foundry
        shell: bash
        run: |
          set -euo pipefail
          forge --version | tee "$EVIDENCE/forge_version.txt"
          cast --version | tee "$EVIDENCE/cast_version.txt"
          anvil --version | tee "$EVIDENCE/anvil_version.txt"

      - name: Clone exact public TermMax source
        shell: bash
        run: |
          set +e
          rm -rf /tmp/termmax-contract-v2
          {
            git clone https://github.com/term-structure/termmax-contract-v2.git /tmp/termmax-contract-v2 &&
            cd /tmp/termmax-contract-v2 &&
            git checkout --detach "$TERMMAX_COMMIT" &&
            git submodule update --init --recursive &&
            git rev-parse HEAD
          } > >(tee "$GITHUB_WORKSPACE/$EVIDENCE/clone.stdout.log") \
            2> >(tee "$GITHUB_WORKSPACE/$EVIDENCE/clone.stderr.log" >&2)
          rc=$?
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/$EVIDENCE/clone.exit_code.txt"
          exit 0

      - name: Resolve public dependencies
        shell: bash
        run: |
          set +e
          cd /tmp/termmax-contract-v2 2>/dev/null || exit 0
          forge soldeer update \
            > >(tee "$GITHUB_WORKSPACE/$EVIDENCE/soldeer.stdout.log") \
            2> >(tee "$GITHUB_WORKSPACE/$EVIDENCE/soldeer.stderr.log" >&2)
          rc=$?
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/$EVIDENCE/soldeer.exit_code.txt"
          exit 0

      - name: Compile exact public source
        shell: bash
        run: |
          set +e
          cd /tmp/termmax-contract-v2 2>/dev/null || exit 0
          forge build --use 0.8.30 --optimizer-runs 1 --via-ir \
            > >(tee "$GITHUB_WORKSPACE/$EVIDENCE/build.stdout.log") \
            2> >(tee "$GITHUB_WORKSPACE/$EVIDENCE/build.stderr.log" >&2)
          rc=$?
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/$EVIDENCE/build.exit_code.txt"
          exit 0

      - name: Package portable public toolchain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/termmax-bootstrap
          mkdir -p /tmp/termmax-bootstrap/bin /tmp/termmax-bootstrap/home
          for tool in forge cast anvil chisel; do
            if command -v "$tool" >/dev/null; then cp "$(command -v "$tool")" "/tmp/termmax-bootstrap/bin/$tool"; fi
          done
          if [ -d /tmp/termmax-contract-v2 ]; then cp -a /tmp/termmax-contract-v2 /tmp/termmax-bootstrap/termmax-contract-v2; fi
          if [ -d "$HOME/.svm" ]; then cp -a "$HOME/.svm" /tmp/termmax-bootstrap/home/.svm; fi
          cp -a "$EVIDENCE" /tmp/termmax-bootstrap/bootstrap-evidence
          tar -C /tmp -czf "$GITHUB_WORKSPACE/termmax-public-toolchain-v2-20260728.tar.gz" termmax-bootstrap
          sha256sum "$GITHUB_WORKSPACE/termmax-public-toolchain-v2-20260728.tar.gz" > "$GITHUB_WORKSPACE/termmax-public-toolchain-v2-20260728.tar.gz.sha256"

      - name: Upload public-source toolchain and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-toolchain-v2-20260728
          path: |
            termmax-public-toolchain-v2-20260728.tar.gz
            termmax-public-toolchain-v2-20260728.tar.gz.sha256
            evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Final bootstrap gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          clone=$(cat "$EVIDENCE/clone.exit_code.txt" 2>/dev/null || echo 99)
          soldeer=$(cat "$EVIDENCE/soldeer.exit_code.txt" 2>/dev/null || echo 99)
          build=$(cat "$EVIDENCE/build.exit_code.txt" 2>/dev/null || echo 99)
          echo "clone=$clone soldeer=$soldeer build=$build"
          test "$clone" = 0
          test "$soldeer" = 0
          test "$build" = 0
