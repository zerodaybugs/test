name: Temporary exact .NET SDK pair 20260830

on:
  push:
    branches:
      - tooling/dotnet-sdk-pair-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify official SDK archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          for version in 10.0.302 10.0.111; do
            archive="dotnet-sdk-${version}-linux-x64.tar.gz"
            patch_version="$(case "$version" in 10.0.302) echo 10.0.10 ;; 10.0.111) echo 10.0.11 ;; esac)"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/${archive}" \
              --output "toolchain/${archive}"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "https://builds.dotnet.microsoft.com/dotnet/checksums/${patch_version}-sha.txt" \
              --output "toolchain/${patch_version}-sha.txt"
            expected="$(grep -F " $archive" "toolchain/${patch_version}-sha.txt" | awk '{print $1}' | head -n1)"
            actual="$(sha256sum "toolchain/$archive" | awk '{print $1}')"
            test -n "$expected"
            test "$actual" = "$expected"
            printf '%s  %s\n' "$actual" "$archive" >> toolchain/SHA256SUMS.txt
          done
          sha256sum --check toolchain/SHA256SUMS.txt

      - name: Smoke exact runtimes
        shell: bash
        run: |
          set -euo pipefail
          for version in 10.0.302 10.0.111; do
            mkdir -p "toolchain/extracted-$version"
            tar -xzf "toolchain/dotnet-sdk-${version}-linux-x64.tar.gz" -C "toolchain/extracted-$version"
            "toolchain/extracted-$version/dotnet" --info > "toolchain/dotnet-info-$version.txt"
            rm -rf "toolchain/extracted-$version"
          done

      - name: Upload verified generic toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DOTNET_SDK_10_0_10_AND_10_0_11_LINUX_X64
          path: toolchain
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
