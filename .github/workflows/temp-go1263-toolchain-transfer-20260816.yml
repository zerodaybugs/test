name: Temporary Go 1.26.3 toolchain transfer

on:
  push:
    branches:
      - go-toolchain-transfer-20260816
    paths:
      - '.github/workflows/temp-go1263-toolchain-transfer-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and verify official Go archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          curl -fL --retry 5 --retry-all-errors \
            -o export/go1.26.3.linux-amd64.tar.gz \
            https://go.dev/dl/go1.26.3.linux-amd64.tar.gz
          printf '%s  %s\n' \
            '2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556' \
            'export/go1.26.3.linux-amd64.tar.gz' \
            > export/go1.26.3.linux-amd64.tar.gz.sha256
          sha256sum -c export/go1.26.3.linux-amd64.tar.gz.sha256
          tar -tzf export/go1.26.3.linux-amd64.tar.gz >/dev/null
          printf '%s\n' 'OFFICIAL_GO_TOOLCHAIN_ARCHIVE_VERIFY=PASS' > export/VERDICT.txt

      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: official-go1.26.3-linux-amd64
          path: export
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
