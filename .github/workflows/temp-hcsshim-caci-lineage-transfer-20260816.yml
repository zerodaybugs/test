name: Temporary hcsshim C-ACI lineage source transfer

on:
  push:
    branches:
      - go-toolchain-transfer-20260816
    paths:
      - '.github/workflows/temp-hcsshim-caci-lineage-transfer-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download public source lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          COMMIT=2e97c9bb3ff26f9bf2fb6b776099d099eb9ecffd
          curl -fL --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -o "export/hcsshim-${COMMIT}.tar.gz" \
            "https://api.github.com/repos/microsoft/hcsshim/tarball/${COMMIT}"
          tar -tzf "export/hcsshim-${COMMIT}.tar.gz" > export/TAR_CONTENTS.txt
          head -100 export/TAR_CONTENTS.txt > export/TAR_HEAD.txt
          sha256sum "export/hcsshim-${COMMIT}.tar.gz" > export/SHA256SUMS.txt
          printf '%s\n' "$COMMIT" > export/COMMIT.txt
          printf '%s\n' 'PUBLIC_SOURCE_ARCHIVE_VERIFY=PASS' > export/VERDICT.txt

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hcsshim-caci-lineage-2e97c9bb
          path: export
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
