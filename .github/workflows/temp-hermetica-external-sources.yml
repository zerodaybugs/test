name: Temporary Hermetica external sources

on:
  pull_request:
    branches: [main]
    paths:
      - 'security_research/hermetica_external_sources/**'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact public Stacks sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/contracts.txt <<'EOF'
          SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7 v0-3-market
          SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7 v0-vault-sbtc
          SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7 v0-vault-usdh
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG staking-v1-1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG staking-silo-v1-1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG staking-state-v1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG staking-reserve-v1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG susdh-token-v1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG usdh-token-v1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG minting-auto-v1-2
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG minting-auto-state-v1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG minting-v1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG minting-state-v1
          SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG redeeming-reserve-v1-2
          EOF
          while read -r addr name; do
            key="${addr}.${name}"
            curl -fsSL --retry 5 "https://api.hiro.so/v2/contracts/source/${addr}/${name}?proof=0" -o "evidence/${key}.source.json" || true
            curl -fsSL --retry 5 "https://api.hiro.so/v2/contracts/interface/${addr}/${name}" -o "evidence/${key}.interface.json" || true
            python3 - "$key" <<'PY'
          import json, pathlib, sys
          key=sys.argv[1]; p=pathlib.Path('evidence')
          f=p/(key+'.source.json')
          if f.exists():
              try:
                  d=json.loads(f.read_text()); src=d.get('source','')
                  if src: (p/(key+'.clar')).write_text(src)
                  f.write_text(json.dumps(d,indent=2,sort_keys=True))
              except Exception as e: (p/(key+'.source-error.txt')).write_text(repr(e))
          f=p/(key+'.interface.json')
          if f.exists():
              try: f.write_text(json.dumps(json.loads(f.read_text()),indent=2,sort_keys=True))
              except Exception as e: (p/(key+'.interface-error.txt')).write_text(repr(e))
          PY
          done < /tmp/contracts.txt
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
          tar -czf hermetica-external-sources.tar.gz evidence
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-external-sources-${{ github.run_id }}
          path: hermetica-external-sources.tar.gz
          retention-days: 1
          if-no-files-found: error
