name: Temporary Hermetica live inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'security_research/hermetica_live_inventory/**'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read public Stacks deployment inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/sources evidence/interfaces
          BASE="https://api.hiro.so"
          DEPLOYER="SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D"

          python3 - <<'PY'
          import json, urllib.request, urllib.parse, pathlib, time
          BASE='https://api.hiro.so'
          DEPLOYER='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D'
          out=pathlib.Path('evidence')
          all_txs=[]
          offset=0
          while True:
              url=f'{BASE}/extended/v1/address/{DEPLOYER}/transactions?limit=50&offset={offset}'
              with urllib.request.urlopen(url, timeout=30) as r:
                  d=json.load(r)
              results=d.get('results',[])
              all_txs.extend(results)
              offset += len(results)
              if not results or offset >= d.get('total',0): break
              time.sleep(0.1)
          (out/'address-transactions.json').write_text(json.dumps({'total':len(all_txs),'results':all_txs},indent=2,sort_keys=True))
          deployments=[]
          for tx in all_txs:
              if tx.get('tx_type')=='smart_contract' and tx.get('tx_status')=='success':
                  sc=tx.get('smart_contract') or {}
                  cid=sc.get('contract_id')
                  if cid and cid.startswith(DEPLOYER+'.'):
                      deployments.append({'contract_id':cid,'tx_id':tx.get('tx_id'),'block_height':tx.get('block_height'),'burn_block_time_iso':tx.get('burn_block_time_iso')})
          deployments.sort(key=lambda x:(x.get('block_height') or 0,x['contract_id']))
          (out/'deployments.json').write_text(json.dumps(deployments,indent=2,sort_keys=True))
          for item in deployments:
              cid=item['contract_id']; addr,name=cid.split('.',1)
              safe=name.replace('/','_')
              for kind,url in [
                  ('sources',f'{BASE}/v2/contracts/source/{addr}/{name}?proof=0'),
                  ('interfaces',f'{BASE}/v2/contracts/interface/{addr}/{name}'),
              ]:
                  try:
                      with urllib.request.urlopen(url,timeout=30) as r: payload=r.read()
                      (out/kind/f'{safe}.json').write_bytes(payload)
                      if kind=='sources':
                          source=json.loads(payload).get('source','')
                          (out/kind/f'{safe}.clar').write_text(source)
                  except Exception as e:
                      (out/kind/f'{safe}.error.txt').write_text(repr(e))
              balurl=f'{BASE}/extended/v1/address/{urllib.parse.quote(cid,safe="")}/balances'
              try:
                  with urllib.request.urlopen(balurl,timeout=30) as r: payload=r.read()
                  (out/f'balances-{safe}.json').write_bytes(payload)
              except Exception as e:
                  (out/f'balances-{safe}.error.txt').write_text(repr(e))
          print('deployments',len(deployments))
          PY

          find evidence -type f -name '*.json' -print0 | while IFS= read -r -d '' f; do
            python3 - "$f" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1]); p.write_text(json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True))
          PY
          done
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
          tar -czf hermetica-live-inventory.tar.gz evidence

      - name: Upload live inventory
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-live-inventory-${{ github.run_id }}
          path: hermetica-live-inventory.tar.gz
          retention-days: 1
          if-no-files-found: error
