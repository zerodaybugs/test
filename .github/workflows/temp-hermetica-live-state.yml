name: Temporary Hermetica live state

on:
  pull_request:
    branches: [main]
    paths:
      - 'security_research/hermetica_live_state/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install serializer
        run: npm install --no-save @stacks/transactions@7.2.0
      - name: Read public contract state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > snapshot.mjs <<'JS'
          import { Cl, serializeCV, cvToValue } from '@stacks/transactions';
          import fs from 'node:fs';

          const BASE='https://api.hiro.so';
          const A='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const sender='SP000000000000000000002Q6VF78';
          const contracts=[
            'hq-v1','blacklist-v1','token-hbtc','state-hbtc-v1','reserve-fund-hbtc-v1','reserve-hbtc-v1',
            'controller-hbtc-v1','fee-collector-hbtc-v1','hermetica-interface-hbtc-v1','zest-interface-hbtc-v1',
            'trading-hbtc-v1','vault-hbtc-v1','vault-hbtc-v1-1','vault-hbtc-v1-2','airdrop-v1'
          ];
          const hex = cv => '0x'+Buffer.from(serializeCV(cv)).toString('hex');
          async function call(contract, fn, args=[]) {
            const r=await fetch(`${BASE}/v2/contracts/call-read/${A}/${contract}/${fn}`,{
              method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({sender,arguments:args.map(hex)})
            });
            const t=await r.text();
            let j; try{j=JSON.parse(t)}catch{j={raw:t}}
            return {http:r.status,...j};
          }
          const q=[];
          const add=(label,contract,fn,args=[])=>q.push({label,contract,fn,args});
          add('hq.owner','hq-v1','get-owner');
          add('hq.timelock','hq-v1','get-timelock');
          add('hq.enabled','hq-v1','get-protocol-enabled');
          for (const fn of ['get-total-assets','get-net-assets','get-share-price','get-pending','get-fees','get-deposit-cap','get-min-deposit','get-min-redeem','get-max-reward','get-max-deviation','get-cooldown','get-express-cooldown','get-express-limit','get-effective-express-limit','get-update-window','get-reserve-rate','get-claim-id','get-last-log-ts','get-vault-enabled','get-transfer-enabled','get-deposit-enabled','get-redeem-enabled','get-request-redeem-enabled','get-trading-enabled','get-express-enabled','get-express-limit-enabled','get-reward-enabled','get-swap-enabled']) add('state.'+fn,'state-hbtc-v1',fn);
          add('token.supply','token-hbtc','get-total-supply');
          add('token.dead','token-hbtc','get-balance',[Cl.principal('SP000000000000000000002Q6VF78')]);
          for (const c of ['vault-hbtc-v1','vault-hbtc-v1-1','vault-hbtc-v1-2','airdrop-v1']) add('token.balance.'+c,'token-hbtc','get-balance',[Cl.principal(`${A}.${c}`)]);
          for (const c of contracts) {
            const p=Cl.principal(`${A}.${c}`);
            for (const role of ['get-protocol','get-trader','get-rewarder','get-manager','get-guardian','get-fee-setter']) add(`role.${role}.${c}`,'hq-v1',role,[p]);
          }
          const out={generatedAt:new Date().toISOString(),queries:{}};
          for (const item of q) {
            const r=await call(item.contract,item.fn,item.args);
            out.queries[item.label]=r;
            await new Promise(res=>setTimeout(res,25));
          }
          fs.writeFileSync('evidence/live-state.json',JSON.stringify(out,null,2));
          JS
          node snapshot.mjs
          sha256sum evidence/live-state.json > evidence/SHA256SUMS
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-live-state-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
