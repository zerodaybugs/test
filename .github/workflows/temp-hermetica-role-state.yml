name: Temporary Hermetica role state

on:
  pull_request:
    branches: [main]
    paths:
      - 'security_research/hermetica_role_state/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @stacks/transactions@7.2.0
      - name: Query roles and balances
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > roles.mjs <<'JS'
          import { Cl, cvToHex } from '@stacks/transactions';
          import fs from 'node:fs';
          const BASE='https://api.hiro.so';
          const A='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const sender='SP000000000000000000002Q6VF78';
          async function call(contract,fn,args=[]) {
            for(let attempt=0;attempt<5;attempt++){
              const r=await fetch(`${BASE}/v2/contracts/call-read/${A}/${contract}/${fn}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender,arguments:args.map(cvToHex)})});
              const text=await r.text();
              let body; try{body=JSON.parse(text)}catch{body={raw:text}}
              if(r.status!==429 && r.status!==503) return {http:r.status,...body};
              await new Promise(res=>setTimeout(res,35000));
            }
            return {http:599,raw:'retry exhausted'};
          }
          const out={generatedAt:new Date().toISOString(),queries:{}};
          const vaults=['vault-hbtc-v1','vault-hbtc-v1-1','vault-hbtc-v1-2'];
          const protocols=['state-hbtc-v1','reserve-fund-hbtc-v1','reserve-hbtc-v1','controller-hbtc-v1','fee-collector-hbtc-v1','hermetica-interface-hbtc-v1','zest-interface-hbtc-v1','trading-hbtc-v1',...vaults];
          const jobs=[];
          for(const c of protocols) jobs.push([`protocol.${c}`,'hq-v1','get-protocol',[Cl.contractPrincipal(A,c)]]);
          for(const role of ['get-trader','get-rewarder','get-manager']) jobs.push([`${role}.trading-hbtc-v1`,'hq-v1',role,[Cl.contractPrincipal(A,'trading-hbtc-v1')]]);
          for(const c of [...vaults,'airdrop-v1']) jobs.push([`hbtc-balance.${c}`,'token-hbtc','get-balance',[Cl.contractPrincipal(A,c)]]);
          jobs.push(['hbtc-balance.dead','token-hbtc','get-balance',[Cl.standardPrincipal('SP000000000000000000002Q6VF78')]]);
          for(const [label,c,f,args] of jobs){out.queries[label]=await call(c,f,args); await new Promise(res=>setTimeout(res,3500));}
          fs.writeFileSync('evidence/role-state.json',JSON.stringify(out,null,2));
          JS
          node roles.mjs
          sha256sum evidence/role-state.json > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermetica-role-state-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
