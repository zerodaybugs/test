name: Temporary Hermetica source bundle

on:
  pull_request:
    branches: [main]
    paths:
      - 'security_research/hermetica_source_bundle/**'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hermetica-fi/hermetica-contracts.git target
          git -C target rev-parse HEAD | tee target/HEAD_PIN.txt
          test "$(cat target/HEAD_PIN.txt)" = "5e13e431f69dd840fe297791fa2a73d9993a27e0"
          find target/mainnet/contracts/hbtc -type f -print0 | sort -z | xargs -0 sha256sum > target/HBTC_SHA256SUMS
          tar -C target -czf hermetica-source.tar.gz \
            HEAD_PIN.txt HBTC_SHA256SUMS \
            mainnet/contracts/hbtc mainnet/README.md \
            tests/hbtc tests/helpers \
            package.json package-lock.json Clarinet.toml Clarigen.toml vitest.config.js
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-source-bundle-${{ github.run_id }}
          path: hermetica-source.tar.gz
          retention-days: 1
          if-no-files-found: error
