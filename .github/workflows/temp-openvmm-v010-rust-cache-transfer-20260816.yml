name: Temporary OpenVMM v0.1.0 Rust cache transfer

on:
  push:
    branches:
      - go-toolchain-transfer-20260816
    paths:
      - '.github/workflows/temp-openvmm-v010-rust-cache-transfer-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Prepare public release source and Rust build cache
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=ee2fc3ffe2a816135374921d34b2fdf2990fd072
          TOOLCHAIN=1.95.0
          mkdir -p export work/source

          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$TOOLCHAIN"
          rustc --version | tee export/rustc-version.txt
          cargo --version | tee export/cargo-version.txt

          curl -fL --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -o work/openvmm.tar.gz \
            "https://api.github.com/repos/microsoft/openvmm/tarball/${COMMIT}"
          tar -xzf work/openvmm.tar.gz -C work/source --strip-components=1
          test "$(git hash-object work/source/vm/vmcore/guestmem/src/lib.rs)" = \
            61dc0d0b263463c9053d194140de3c0458117c2d

          cd work/source
          cargo test --locked -p guestmem --features bitmap --no-run
          cargo test --locked -p guestmem --features bitmap -- --list \
            > ../../export/guestmem-test-list.txt
          cd ../..

          tar -czf export/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz \
            -C "$HOME/.rustup/toolchains" \
            1.95.0-x86_64-unknown-linux-gnu

          tar -czf export/cargo-home-registry-git.tar.gz \
            -C "$HOME/.cargo" registry git

          tar -czf export/openvmm-v0.1.0-source.tar.gz \
            -C work/source .

          printf '%s\n' "$COMMIT" > export/COMMIT.txt
          printf '%s\n' 'PUBLIC_RELEASE_TOOLCHAIN_AND_CACHE=PASS' > export/VERDICT.txt
          sha256sum export/* > export/SHA256SUMS.txt

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-v010-rust195-cache
          path: export
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
