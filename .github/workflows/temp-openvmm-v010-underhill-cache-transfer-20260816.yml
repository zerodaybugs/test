name: Temporary OpenVMM v0.1.0 underhill cache transfer

on:
  push:
    branches:
      - go-toolchain-transfer-20260816
    paths:
      - '.github/workflows/temp-openvmm-v010-underhill-cache-transfer-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Build unmodified public underhill_mem release crate
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=ee2fc3ffe2a816135374921d34b2fdf2990fd072
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          mkdir -p export source
          curl -fL --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -o openvmm.tar.gz \
            "https://api.github.com/repos/microsoft/openvmm/tarball/${COMMIT}"
          tar -xzf openvmm.tar.gz -C source --strip-components=1
          cd source
          cargo test --locked -p underhill_mem --no-run 2>&1 | tee ../export/underhill-no-run.log
          cd ..
          tar -czf export/cargo-home-registry-git-underhill.tar.gz \
            -C "$HOME/.cargo" registry git
          printf '%s\n' "$COMMIT" > export/COMMIT.txt
          printf '%s\n' 'UNDERHILL_PUBLIC_RELEASE_BUILD_CACHE=PASS' > export/VERDICT.txt
          sha256sum export/* > export/SHA256SUMS.txt

      - name: Upload cache
        uses: actions/upload-artifact@v4
        with:
          name: openvmm-v010-underhill-cargo-cache
          path: export
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
