name: Temporary protoc 27.1 transfer

on:
  push:
    branches:
      - go-toolchain-transfer-20260816
    paths:
      - '.github/workflows/temp-protoc-271-transfer-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download official protoc 27.1 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          curl -fL --retry 5 --retry-all-errors \
            -o export/protoc-27.1-linux-x86_64.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v27.1/protoc-27.1-linux-x86_64.zip
          unzip -t export/protoc-27.1-linux-x86_64.zip
          sha256sum export/protoc-27.1-linux-x86_64.zip > export/SHA256SUMS.txt
          printf '%s\n' 'PROTOC_OFFICIAL_ARCHIVE_VERIFY=PASS' > export/VERDICT.txt

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: protoc-27.1-linux-x86_64
          path: export
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
