name: Temporary public-chain source fetch

on:
  pull_request:
    branches: [main]
    paths:
      - 'security_research/public_chain_fetch/**'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public chain data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CONTRACT="SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D"
          NAME="airdrop-v1"
          TXID="0x0aa4b2f507740057a21a55c8067e169e3e7ebe00ccaf66469a1eac79521a40b8"
          BASE="https://api.hiro.so"
          PRINCIPAL="${CONTRACT}.${NAME}"
          curl -fsSL --retry 5 "${BASE}/v2/contracts/source/${CONTRACT}/${NAME}?proof=0" -o evidence/source-response.json
          curl -fsSL --retry 5 "${BASE}/v2/contracts/interface/${CONTRACT}/${NAME}" -o evidence/interface.json
          curl -fsSL --retry 5 "${BASE}/extended/v1/tx/${TXID}" -o evidence/deployment-tx.json
          curl -fsSL --retry 5 "${BASE}/extended/v1/address/${PRINCIPAL}/balances" -o evidence/contract-balances.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence')
          source_payload = json.loads((p/'source-response.json').read_text())
          source = source_payload.get('source', '')
          if not source:
              raise SystemExit('missing source')
          (p/'contract.clar').write_text(source)
          for name in ('source-response.json','interface.json','deployment-tx.json','contract-balances.json'):
              f=p/name
              f.write_text(json.dumps(json.loads(f.read_text()),indent=2,sort_keys=True))
          print('source_bytes',len(source.encode()))
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-chain-source-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
