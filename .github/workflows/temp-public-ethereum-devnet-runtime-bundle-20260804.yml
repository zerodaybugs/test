name: Temporary public Ethereum devnet runtime bundle 20260804

on:
  pull_request:
    branches: [main]
    paths:
      - '.runtime-bootstrap-20260804/**'
      - '.github/workflows/temp-public-ethereum-devnet-runtime-bundle-20260804.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out/debs out/runtime out/images

      - name: Download Debian 13 rootless container runtime packages
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull debian:13-slim
          docker run --rm -v "$PWD/out/debs:/out" debian:13-slim bash -lc '
            set -Eeuo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get -y --download-only --no-install-recommends install \
              podman buildah crun conmon slirp4netns passt fuse-overlayfs uidmap \
              containernetworking-plugins iptables iproute2 dbus-user-session \
              docker.io rootlesskit zstd ca-certificates
            cp -a /var/cache/apt/archives/*.deb /out/
          '
          tar --zstd -cf out/runtime/debian13-rootless-runtime-debs.tar.zst -C out/debs .
          sha256sum out/runtime/debian13-rootless-runtime-debs.tar.zst > out/runtime/DEBS_SHA256SUMS.txt

      - name: Fetch Kurtosis 1.20.0 CLI and exact ethereum-package source
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/1.20.0/kurtosis-cli_1.20.0_linux_amd64.tar.gz'
          curl -fsSL "$url" -o /tmp/kurtosis.tar.gz
          mkdir -p /tmp/kurtosis
          tar -xzf /tmp/kurtosis.tar.gz -C /tmp/kurtosis
          cli="$(find /tmp/kurtosis -type f -name 'kurtosis*' -perm -111 | head -1)"
          test -n "$cli"
          cp "$cli" out/runtime/kurtosis
          chmod 0755 out/runtime/kurtosis
          out/runtime/kurtosis version || true

          git clone https://github.com/ethpandaops/ethereum-package.git out/runtime/ethereum-package
          git -C out/runtime/ethereum-package checkout 27a33b90d159de24eb05f8ff27b8ddf0beb813d5
          test "$(git -C out/runtime/ethereum-package rev-parse HEAD)" = '27a33b90d159de24eb05f8ff27b8ddf0beb813d5'
          rm -rf out/runtime/ethereum-package/.git
          printf 'ETHEREUM_PACKAGE_COMMIT=27a33b90d159de24eb05f8ff27b8ddf0beb813d5\nKURTOSIS_VERSION=1.20.0\n' > out/runtime/IDENTITY.txt

      - name: Pull and pin public runtime images
        shell: bash
        run: |
          set -Eeuo pipefail
          pull_tag() {
            ref="$1"; tag="$2"
            docker pull "$ref"
            docker tag "$ref" "$tag"
          }
          pull_tag 'ethpandaops/ethereum-genesis-generator@sha256:e0cf05600642ace1c53bed84a5c03284a88671afda8032482f664d82df776730' 'ethpandaops/ethereum-genesis-generator:6.1.4'
          pull_tag 'chainsafe/lodestar@sha256:9560dedafce15d1b165114672258f30c2f6f66c1dec93d273bc43d00fdbb16f3' 'chainsafe/lodestar:v1.45.0'
          pull_tag 'ethereum/client-go@sha256:523d3ba26623a619e912019068dc2784f02934070ac46bdae4d5b9df0d917814' 'ethereum/client-go:v1.17.5'
          pull_tag 'protolambda/eth2-val-tools@sha256:46147228f291266148a6a21a2b9541367ad5f70e619d79cd5393459baf539f58' 'protolambda/eth2-val-tools:latest'
          pull_tag 'badouralix/curl-jq@sha256:1e7c0284e24572ace7170df9fc91f15fd3b79ebf056d4dde17244d5d74bbfabc' 'badouralix/curl-jq:latest'
          pull_tag 'kurtosistech/engine@sha256:b798d5c40972cf1f8f1ce86851a83416c554ac66effb7d351bdb2b3f219a1a69' 'kurtosistech/engine:1.20.0'
          pull_tag 'kurtosistech/core@sha256:d41a7f004fca1932e4d94dc3f21b0c66dd1be5a5a47c63b78752de73de5546b3' 'kurtosistech/core:1.20.0'
          pull_tag 'kurtosistech/files-artifacts-expander@sha256:7c2a750a3f7d812069c425c6afb30d8a9c0a1321874b4e14c65a10682a14a443' 'kurtosistech/files-artifacts-expander:1.20.0'
          pull_tag 'fluent/fluent-bit@sha256:3cabd4bd59596931cd99d812c99200e12fa08758fd08dfb0549c96ae97a70ddd' 'fluent/fluent-bit:4.0.0'
          pull_tag 'timberio/vector@sha256:987a15ebfb2eac3a4d5efb26252d140f799553feffb753dc215bdf738a7d4174' 'timberio/vector:0.45.0-debian'
          pull_tag 'alpine@sha256:8fc3dacfb6d69da8d44e42390de777e48577085db99aa4e4af35f483eb08b989' 'alpine:3.17'
          pull_tag 'traefik@sha256:1957e3314f435c85b3a19f7babd53c630996aa1af65d1f479d75539251b1e112' 'traefik:2.10.6'

          images=(
            ethpandaops/ethereum-genesis-generator:6.1.4
            chainsafe/lodestar:v1.45.0
            ethereum/client-go:v1.17.5
            protolambda/eth2-val-tools:latest
            badouralix/curl-jq:latest
            kurtosistech/engine:1.20.0
            kurtosistech/core:1.20.0
            kurtosistech/files-artifacts-expander:1.20.0
            fluent/fluent-bit:4.0.0
            timberio/vector:0.45.0-debian
            alpine:3.17
            traefik:2.10.6
          )
          docker image inspect "${images[@]}" > out/images/IMAGE_INSPECT.json
          docker save "${images[@]}" | zstd -T0 -10 -o out/images/ethereum-devnet-images.tar.zst
          sha256sum out/images/ethereum-devnet-images.tar.zst > out/images/IMAGES_SHA256SUMS.txt
          ls -lh out/images/ethereum-devnet-images.tar.zst out/runtime/debian13-rootless-runtime-debs.tar.zst

      - name: Upload public runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-devnet-runtime-bundle-20260804
          path: |
            out/runtime/
            out/images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
