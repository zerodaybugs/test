name: Temporary public Go and Geth bootstrap 20260804

on:
  push:
    branches: [main]
    paths:
      - '.toolchain-bootstrap-20260804/**'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Fetch exact public Geth source and dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 022
          git clone --filter=blob:none --depth 1 --branch v1.17.5 \
            https://github.com/ethereum/go-ethereum.git go-ethereum
          actual="$(git -C go-ethereum rev-parse HEAD)"
          expected='9621c6ad10934a01b5514886fb6fbd87640b6c05'
          test "$actual" = "$expected"
          test "$(git -C go-ethereum describe --tags --exact-match HEAD)" = 'v1.17.5'
          (
            cd go-ethereum
            go mod download all
          )
          rm -rf go-ethereum/.git

      - name: Build portable bootstrap archive
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/bootstrap"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -aL "$(go env GOROOT)" "$stage/go"
          cp -a "$(go env GOMODCACHE)" "$stage/gomodcache"
          cp -a go-ethereum "$stage/go-ethereum"
          {
            printf 'GO_VERSION=%s\n' "$(go version)"
            printf 'GETH_COMMIT=%s\n' '9621c6ad10934a01b5514886fb6fbd87640b6c05'
            printf 'GETH_TAG=%s\n' 'v1.17.5'
          } > "$stage/IDENTITY.txt"
          tar --zstd -cf go-geth-bootstrap-20260804.tar.zst -C "$stage" .
          sha256sum go-geth-bootstrap-20260804.tar.zst > SHA256SUMS.txt
          ls -lh go-geth-bootstrap-20260804.tar.zst

      - name: Upload bootstrap archive
        uses: actions/upload-artifact@v4
        with:
          name: go-geth-bootstrap-20260804
          path: |
            go-geth-bootstrap-20260804.tar.zst
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
