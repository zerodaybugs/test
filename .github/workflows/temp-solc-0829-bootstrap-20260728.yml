name: Temporary official solc 0.8.29 bootstrap 20260728

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    if: github.head_ref == 'termmax-vault-asset-debt-census-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download official Solidity 0.8.29 static Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.29+commit.ab55807c' \
            -o solc-0.8.29
          echo '18d418a40dc04d17656b1b5c8a7b35cfbab8942b51f38d005d5b59e8aa6637e0  solc-0.8.29' | sha256sum -c -
          chmod 0755 solc-0.8.29
          ./solc-0.8.29 --version | tee solc-0.8.29.version.txt
          sha256sum solc-0.8.29 > solc-0.8.29.sha256
      - name: Upload verified official compiler
        uses: actions/upload-artifact@v4
        with:
          name: official-solc-0.8.29-linux-amd64-${{ github.run_id }}
          path: |
            solc-0.8.29
            solc-0.8.29.sha256
            solc-0.8.29.version.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
