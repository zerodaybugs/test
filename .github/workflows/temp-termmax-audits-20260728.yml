name: Temporary TermMax public audits corpus 20260728

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  corpus:
    if: github.head_ref == 'monitor/termmax-public-state-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install PDF utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Download and index public TermMax audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pdfs evidence/text evidence/grep evidence/render
          base='https://raw.githubusercontent.com/term-structure/audits/main/TermMax'
          files=(
            'TermMax-ABDK-audit-report-Phase1-v2.pdf'
            'TermMax-ABDK-audit-report-Phase2.pdf'
            'TermMax-ABDK-audit-report-Phase3-v2.pdf'
            'TermMax-ABDK-audit-report-TMX-v-1-0.pdf'
            'TermMax-Cantina-competition-20250320.pdf'
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-all-errors \
              "$base/$file" -o "evidence/pdfs/$file"
            pdfinfo "evidence/pdfs/$file" > "evidence/text/$file.pdfinfo.txt"
            pdftotext -layout "evidence/pdfs/$file" "evidence/text/$file.txt"
            grep -Ein -C 5 \
              'withdrawFts|withdraw[[:space:]_-]*ft|dealBadDebt|bad[[:space:]_-]*debt|physical[[:space:]_-]*delivery|late[[:space:]_-]*deposit|new[[:space:]_-]*depositor|vault[[:space:]_-]*share|collateral.*share|share.*collateral|cherry[[:space:]_-]*pick|recovery[[:space:]_-]*surplus|stale[[:space:]_-]*NAV|pro[[:space:]_-]*rata|withdraw[[:space:]_-]*queue|order[[:space:]_-]*quality|fungible' \
              "evidence/text/$file.txt" > "evidence/grep/$file.matches.txt" || true
            pdftoppm -f 1 -singlefile -png -r 100 "evidence/pdfs/$file" "evidence/render/${file%.pdf}-page1"
          done
          sha256sum evidence/pdfs/*.pdf > evidence/PDF_SHA256SUMS.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload public audit corpus
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-audits-20260728-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
