name: Temporary TermMax BNB market liability retry 20260729

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bnb:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Reassemble scanner with stable BNB RPCs
        shell: bash
        run: |
          set -euo pipefail
          cat monitor/termmax-market-liability-v2/part-*.txt | tr -d '\r\n' | base64 --decode > /tmp/scanner.py.gz
          gzip -dc /tmp/scanner.py.gz > /tmp/termmax_market_liability_inventory_v2.py
          cp monitor/termmax_crosschain_delegated_newgt_inventory_20260728.py /tmp/termmax_crosschain_delegated_newgt_inventory_20260728.py
          echo '88967fc46f77eb0fb7c3503a083ed8689b014ae022a25ac51fea8fd5af5bb24a  /tmp/termmax_market_liability_inventory_v2.py' | sha256sum --check --strict
          cat > /tmp/run_bnb.py <<'PY'
          import importlib.util
          path='/tmp/termmax_market_liability_inventory_v2.py'
          spec=importlib.util.spec_from_file_location('inventory',path)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.base.CHAINS=[c for c in m.base.CHAINS if c['name']=='bnb']
          c=m.base.CHAINS[0]
          c['rpcs']=[
            'https://bsc-dataseed1.binance.org/',
            'https://bsc-dataseed2.binance.org/',
            'https://bsc-dataseed.binance.org/',
            'https://binance.llamarpc.com',
            'https://bsc.drpc.org',
          ]
          raise SystemExit(m.main())
          PY
          python -m py_compile /tmp/run_bnb.py
      - name: Run BNB current-state inventory
        shell: bash
        run: |
          set +e
          rm -rf evidence; mkdir -p evidence
          OUT_DIR=evidence python /tmp/run_bnb.py > >(tee evidence/stdout.log) 2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-bnb-market-liability-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
