name: Temporary TermMax cross-chain oracle floor probe 20260802

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-termmax-crosschain-oracle-floor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast_floor_gate:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        chain: [base, b2, berachain, pharos]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0

      - name: Run fast oracle-floor kill gate
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_crosschain_oracle_floor_fast_20260802.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN"
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum monitor/termmax_crosschain_oracle_floor_fast_20260802.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-oracle-floor-fast-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final fast gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0

  full_probe:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        chain: [base, b2, berachain, pharos]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0

      - name: Run cross-chain oracle-floor probe
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_crosschain_oracle_floor_probe_20260802.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN"
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum monitor/termmax_crosschain_oracle_floor_probe_20260802.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-crosschain-oracle-floor-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
