name: Temporary TermMax DUSD exposure monitor 20260728

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  monitor:
    if: github.head_ref == 'monitor/termmax-public-state-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install monitor dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0

      - name: Run TermMax DUSD exposure monitor
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_dusd_exposure_20260728.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          printf '%s\n' "$rc" > evidence/exit_code.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload DUSD exposure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-dusd-exposure-20260728-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
