name: Temporary TermMax ERC4626 oracle redeem-gap scan 20260801

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-termmax-erc4626-oracle-gap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Run normalized current ERC4626 oracle redeem-gap census
        shell: bash
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_erc4626_oracle_redeem_gap_v3_20260801.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum \
              monitor/termmax_erc4626_oracle_redeem_gap_20260801.py \
              monitor/termmax_erc4626_oracle_redeem_gap_v3_20260801.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-erc4626-oracle-gap-v3-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
