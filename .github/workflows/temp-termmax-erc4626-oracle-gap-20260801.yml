name: Temporary TermMax live oracle and settlement gates 20260801

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-termmax-live-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  oracle_gap:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Run normalized current ERC4626 oracle redeem-gap census
        shell: bash
        run: |
          set +e
          rm -rf oracle-evidence
          mkdir -p oracle-evidence
          OUT_DIR=oracle-evidence python monitor/termmax_erc4626_oracle_redeem_gap_v3_20260801.py \
            > >(tee oracle-evidence/stdout.log) \
            2> >(tee oracle-evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > oracle-evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum \
              monitor/termmax_erc4626_oracle_redeem_gap_20260801.py \
              monitor/termmax_erc4626_oracle_redeem_gap_v3_20260801.py
          } > oracle-evidence/environment.txt
          find oracle-evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > oracle-evidence/SHA256SUMS.txt
          exit 0

      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-erc4626-oracle-gap-v3-${{ github.run_id }}
          path: oracle-evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final oracle gate
        if: always()
        shell: bash
        run: test "$(cat oracle-evidence/exit_code.txt 2>/dev/null || echo 99)" = 0

  settlement_surplus:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 eth-abi==5.2.0

      - name: Run current settlement-surplus gate
        shell: bash
        run: |
          set +e
          rm -rf settlement-evidence
          mkdir -p settlement-evidence
          OUT_DIR=settlement-evidence python monitor/termmax_settlement_surplus_live_gate_20260801.py \
            > >(tee settlement-evidence/stdout.log) \
            2> >(tee settlement-evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > settlement-evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum monitor/termmax_settlement_surplus_live_gate_20260801.py
          } > settlement-evidence/environment.txt
          find settlement-evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > settlement-evidence/SHA256SUMS.txt
          exit 0

      - name: Upload settlement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-settlement-surplus-live-gate-${{ github.run_id }}
          path: settlement-evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final settlement gate
        if: always()
        shell: bash
        run: test "$(cat settlement-evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
