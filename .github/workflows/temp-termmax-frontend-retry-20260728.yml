name: Temporary TermMax public frontend retry semantics 20260728

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    if: github.head_ref == 'termmax-makerhelper-txdecode-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input requests==2.32.4
      - name: Scan public frontend bundles for retry and salt semantics
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_frontend_retry_semantics_20260728.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          printf '%s\n' "$rc" > evidence/exit_code.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termmax-frontend-retry-semantics-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
