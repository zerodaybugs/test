name: Temporary TermMax latest delegated flow binding 20260728

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bind:
    if: github.head_ref == 'termmax-makerhelper-txdecode-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Run latest delegated-flow read-only binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_latest_delegated_flow_binding_20260728.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-latest-delegated-binding-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
