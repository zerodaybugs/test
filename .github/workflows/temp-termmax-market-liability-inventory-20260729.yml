name: Temporary TermMax current market liability inventory 20260729

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temp-termmax-market-liability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only scanner dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Reassemble and verify inventory scanner
        shell: bash
        run: |
          set -euo pipefail
          cat monitor/termmax-market-liability-v2/part-*.txt \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/termmax-market-liability.py.gz
          gzip -dc /tmp/termmax-market-liability.py.gz \
            > /tmp/termmax_market_liability_inventory_v2.py
          cp monitor/termmax_crosschain_delegated_newgt_inventory_20260728.py \
            /tmp/termmax_crosschain_delegated_newgt_inventory_20260728.py
          echo '88967fc46f77eb0fb7c3503a083ed8689b014ae022a25ac51fea8fd5af5bb24a  /tmp/termmax_market_liability_inventory_v2.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/termmax_market_liability_inventory_v2.py
          python -m py_compile /tmp/termmax_crosschain_delegated_newgt_inventory_20260728.py

      - name: Run cross-chain current-state inventory
        shell: bash
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python /tmp/termmax_market_liability_inventory_v2.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_market_liability_inventory_v2.py
            sha256sum /tmp/termmax_crosschain_delegated_newgt_inventory_20260728.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-market-liability-inventory-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0

  oracle_binding:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base, b2, berachain, xlayer, pharos]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only scanner dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Reassemble and verify oracle-market scanner
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < monitor/termmax-oracle-market-binding-20260731.py.gz.b64 \
            | base64 --decode > /tmp/termmax-oracle-market-binding.py.gz
          gzip -dc /tmp/termmax-oracle-market-binding.py.gz \
            > /tmp/termmax_oracle_market_binding_20260731.py
          echo '3ed83e63713d6950031604d57326ec5e90793130f7059e8f8ef2076a9603164c  /tmp/termmax_oracle_market_binding_20260731.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/termmax_oracle_market_binding_20260731.py

      - name: Run active-market oracle binding census
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf oracle-evidence
          mkdir -p oracle-evidence
          OUT_DIR=oracle-evidence python /tmp/termmax_oracle_market_binding_20260731.py \
            > >(tee oracle-evidence/stdout.log) \
            2> >(tee oracle-evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > oracle-evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN"
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_oracle_market_binding_20260731.py
          } > oracle-evidence/environment.txt
          find oracle-evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > oracle-evidence/SHA256SUMS.txt
          exit 0

      - name: Upload oracle-market evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-oracle-market-${{ matrix.chain }}-${{ github.run_id }}
          path: oracle-evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final oracle gate
        if: always()
        shell: bash
        run: test "$(cat oracle-evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
