name: Temporary TermMax market liability matrix 20260729

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base, b2, berachain, xlayer, hyperevm, pharos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only scanner dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Reassemble exact scanner
        shell: bash
        run: |
          set -euo pipefail
          cat monitor/termmax-market-liability-v2/part-*.txt \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/scanner.py.gz
          gzip -dc /tmp/scanner.py.gz > /tmp/termmax_market_liability_inventory_v2.py
          cp monitor/termmax_crosschain_delegated_newgt_inventory_20260728.py \
            /tmp/termmax_crosschain_delegated_newgt_inventory_20260728.py
          echo '88967fc46f77eb0fb7c3503a083ed8689b014ae022a25ac51fea8fd5af5bb24a  /tmp/termmax_market_liability_inventory_v2.py' \
            | sha256sum --check --strict
          cat > /tmp/run_one_chain.py <<'PY'
          import importlib.util, os
          path='/tmp/termmax_market_liability_inventory_v2.py'
          spec=importlib.util.spec_from_file_location('inventory', path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          wanted=os.environ['CHAIN_FILTER']
          module.base.CHAINS=[c for c in module.base.CHAINS if c['name']==wanted]
          if len(module.base.CHAINS)!=1:
              raise SystemExit(f'chain not found: {wanted}')
          raise SystemExit(module.main())
          PY
          python -m py_compile /tmp/termmax_market_liability_inventory_v2.py /tmp/run_one_chain.py

      - name: Run one-chain inventory
        shell: bash
        env:
          CHAIN_FILTER: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python /tmp/run_one_chain.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN_FILTER"
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_market_liability_inventory_v2.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-market-liability-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
