name: Temporary TermMax production settlement-surplus census 20260801

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-termmax-production-settlement-surplus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  census:
    if: github.head_ref == 'termmax-market-liability-inventory-v2-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 eth-abi==5.2.0

      - name: Reassemble and verify scanner
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < monitor/termmax_production_settlement_surplus_census_20260801.py.gz.b64 \
            | base64 --decode > /tmp/termmax_production_settlement_surplus_census_20260801.py.gz
          gzip -dc /tmp/termmax_production_settlement_surplus_census_20260801.py.gz \
            > /tmp/termmax_production_settlement_surplus_census_20260801.py
          echo '6563d4702d58669f4b85a9c4970ec8d47f27af10148a8ac3b185549e2156e377  /tmp/termmax_production_settlement_surplus_census_20260801.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/termmax_production_settlement_surplus_census_20260801.py

      - name: Run read-only production settlement-surplus census
        shell: bash
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python /tmp/termmax_production_settlement_surplus_census_20260801.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_production_settlement_surplus_census_20260801.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-production-settlement-surplus-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
