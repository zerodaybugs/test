name: Temporary TermMax public PDF excerpt publisher 20260728

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'monitor/termmax-public-state-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: monitor/termmax-public-state-20260728
          persist-credentials: true
          fetch-depth: 1

      - name: Install PDF utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Generate public audit excerpt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/termmax /tmp/termmax-pdf-pages
          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/term-structure/audits/main/TermMax/TermMax-Cantina-competition-20250320.pdf' \
            -o /tmp/termmax-cantina.pdf
          for page in 10 11 12 29 30 31; do
            pdfseparate -f "$page" -l "$page" /tmp/termmax-cantina.pdf "/tmp/termmax-pdf-pages/page-${page}-%d.pdf"
          done
          pdfunite \
            /tmp/termmax-pdf-pages/page-10-10.pdf \
            /tmp/termmax-pdf-pages/page-11-11.pdf \
            /tmp/termmax-pdf-pages/page-12-12.pdf \
            /tmp/termmax-pdf-pages/page-29-29.pdf \
            /tmp/termmax-pdf-pages/page-30-30.pdf \
            /tmp/termmax-pdf-pages/page-31-31.pdf \
            public/termmax/TermMax-Cantina-public-dedup-excerpt.pdf
          sha256sum public/termmax/TermMax-Cantina-public-dedup-excerpt.pdf \
            > public/termmax/TermMax-Cantina-public-dedup-excerpt.pdf.sha256
          pdfinfo public/termmax/TermMax-Cantina-public-dedup-excerpt.pdf \
            > public/termmax/TermMax-Cantina-public-dedup-excerpt.pdf.info.txt

      - name: Commit public excerpt to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public/termmax/
          if git diff --cached --quiet; then
            echo 'Public excerpt already current'
          else
            git commit -m 'Add public TermMax audit dedup excerpt'
            git push origin HEAD:monitor/termmax-public-state-20260728
          fi
