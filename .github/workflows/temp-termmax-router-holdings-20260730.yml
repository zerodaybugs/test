name: Temporary TermMax Router holdings census 20260730

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    if: github.head_ref == 'termmax-router-holdings-census-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base, b2, berachain, xlayer, pharos]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Scan current Router holdings
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_router_holdings_census_20260730.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum monitor/termmax_router_holdings_census_20260730.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - name: Upload current-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-router-holdings-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
