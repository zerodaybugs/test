name: Temporary TermMax targeted cross-chain census 20260728

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  census:
    if: github.head_ref == 'monitor/termmax-public-state-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: termmax-targeted-crosschain-20260728
      cancel-in-progress: true
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install monitor dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Run targeted read-only census
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_targeted_crosschain_vaults_20260728.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          printf '%s\n' "$rc" > evidence/exit_code.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload targeted census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-targeted-crosschain-20260728-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
