name: Temporary TermMax Terminal adapter live binding 20260730

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    if: github.head_ref == 'termmax-router-holdings-census-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Reassemble and run scanner
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode monitor/termmax_terminal_live_scan_20260730.py.gz.b64 | gunzip > /tmp/termmax_terminal_live_scan.py
          echo '19492ba934dea3ff6c5bae7227544335de3ed6a7b8097d260561e7ecc034f17c  /tmp/termmax_terminal_live_scan.py' | sha256sum --check --strict
          python -m py_compile /tmp/termmax_terminal_live_scan.py
          rm -rf evidence && mkdir -p evidence
          OUT_DIR=evidence python /tmp/termmax_terminal_live_scan.py > >(tee evidence/stdout.log) 2> >(tee evidence/stderr.log >&2)
          printf '0\n' > evidence/exit_code.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-terminal-live-binding-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
