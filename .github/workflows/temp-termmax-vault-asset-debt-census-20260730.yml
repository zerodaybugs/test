name: Temporary TermMax vault asset-debt census 20260730

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    if: github.head_ref == 'termmax-vault-asset-debt-census-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base, b2, berachain, xlayer, pharos]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Clone exact public TermMax source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/termmax-contract-v2
          git clone --quiet https://github.com/term-structure/termmax-contract-v2.git /tmp/termmax-contract-v2
          cd /tmp/termmax-contract-v2
          git checkout --detach e314f3f849577dfecd4614f148c4df81fdf8c72d
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/source_commit.txt"
      - name: Run read-only vault asset/debt consistency census
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
          TERMMAX_REPO: /tmp/termmax-contract-v2
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_vault_asset_debt_census_20260730.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          cp source_commit.txt evidence/
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum monitor/termmax_vault_asset_debt_census_20260730.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - name: Upload current-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-vault-asset-debt-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final execution gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0

  settlement_state:
    if: github.head_ref == 'termmax-vault-asset-debt-census-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Reassemble and verify current settlement probe
        shell: bash
        run: |
          set -euo pipefail
          cat monitor/termmax-current-settlement-probe-v2/part-*.txt \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/termmax-current-settlement-probe.py.gz
          gzip -dc /tmp/termmax-current-settlement-probe.py.gz \
            > /tmp/termmax_current_settlement_probe_20260801.py
          echo '4b2788ec7473fd578fc34af9646f2abf41799f60dd58c5030ef5f509a827cf9e  /tmp/termmax_current_settlement_probe_20260801.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/termmax_current_settlement_probe_20260801.py
      - name: Run current read-only settlement probe
        shell: bash
        run: |
          set +e
          rm -rf settlement-evidence
          mkdir -p settlement-evidence
          OUT_DIR=settlement-evidence python /tmp/termmax_current_settlement_probe_20260801.py \
            > >(tee settlement-evidence/stdout.log) \
            2> >(tee settlement-evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > settlement-evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_current_settlement_probe_20260801.py
          } > settlement-evidence/environment.txt
          find settlement-evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > settlement-evidence/SHA256SUMS.txt
          exit 0
      - name: Upload settlement-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-current-settlement-${{ github.run_id }}
          path: settlement-evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final settlement-state gate
        if: always()
        shell: bash
        run: test "$(cat settlement-evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
