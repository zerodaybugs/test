name: Temporary TermMax wrapper backing scan 20260730

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    if: github.head_ref == 'termmax-wrapper-backing-scan-20260730'
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base, berachain, b2, xlayer, pharos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Reassemble and verify scanner
        shell: bash
        run: |
          set -euo pipefail
          cat monitor/termmax-wrapper-backing-scan/part-*.txt \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/termmax_wrapper_backing_scan.py.gz
          gzip -dc /tmp/termmax_wrapper_backing_scan.py.gz > /tmp/termmax_wrapper_backing_scan.py
          echo '04bcf8c7f39864fd4d28450b18c44d791a2c6b2f906fc99d259b5889fba3c9de  /tmp/termmax_wrapper_backing_scan.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/termmax_wrapper_backing_scan.py

      - name: Run one-chain read-only backing census
        shell: bash
        env:
          CHAIN_FILTER: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python /tmp/termmax_wrapper_backing_scan.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN_FILTER"
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_wrapper_backing_scan.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-wrapper-backing-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
