name: Temporary TermMax zero-price cross-chain v3 20260802

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-termmax-zero-price-crosschain-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.head_ref == 'termmax-zero-price-live-binding-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        chain: [base, b2, berachain, pharos]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Run canonical V2 market and oracle scan
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence && mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_zero_price_live_binding_v3_20260802.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN"
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum \
              monitor/termmax_zero_price_live_binding_20260802.py \
              monitor/termmax_zero_price_live_binding_v3_20260802.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-zero-price-live-binding-v3-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
