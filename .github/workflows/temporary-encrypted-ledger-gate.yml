name: temporary encrypted ledger consistency gate

on:
  pull_request:
    paths:
      - ".github/temporary_ledger_consistency_gate.py"
      - ".github/workflows/temporary-encrypted-ledger-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run read-only gate
        id: gate
        continue-on-error: true
        run: python3 .github/temporary_ledger_consistency_gate.py

      - name: Encrypt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d ledger-gate-evidence ]]; then
            mkdir -p ledger-gate-evidence
            printf '{"runner":"failed-before-output"}\n' > ledger-gate-evidence/runner-error.json
          fi
          tar -czf evidence.tar.gz ledger-gate-evidence
          openssl rand -hex 32 > evidence.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -pass file:evidence.key -in evidence.tar.gz -out evidence.tar.gz.enc
          cat > evidence-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAlG+ezrD2ucEyJxrxlfH2
          o+yyJGLFultgx0eE8rombJGNUE5X70itodDWKujijMbdjdqJc6SeaGgdjmZVX1Pl
          66tkOK4gu/YDuBmcihlKEZGviNddau/3CJGZSDT9JzYDn0lafIrby0NZ/Xk9ln3c
          gws9/FWNaj7B2PKDsx0OyOtVjZ7RMJ8QQmGPJ9MupvEfHKJhTxH6QADcl+BUBCgd
          RgTocLw0hQgtfany1tXjgpP+qSsTKfkXsS0gpbq423bIYlvBRuSvFx+MyTqYDl+P
          PO2MlD/j44aetzIGA+o8r3CQKhXfTZZM2g/cjJKF2dZq/T9btmSPawWVN3CGakTk
          pUH/gGn4Ne3VcD/k3COJy+x6YugNGwGX/+xR77CwNr973OhSEsSoENXclrGCuhll
          0XQ538tptH0RkBhQDJGkRXN+UtulQn+paf38C8ER4UKmoXnbZJgTqqJ+cLonvhcZ
          t2rVxro+hhEr1lah78bYND7cI4GbOTregNNCiPWSOo6BAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey evidence-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in evidence.key -out evidence.key.enc
          mkdir encrypted-output
          mv evidence.tar.gz.enc evidence.key.enc encrypted-output/
          sha256sum encrypted-output/* > encrypted-output/cipher.sha256
          rm -rf ledger-gate-evidence evidence.tar.gz evidence.key evidence-public.pem

      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-ledger-gate-evidence
          path: encrypted-output/
          if-no-files-found: error
          retention-days: 1

      - name: Propagate failure after encrypted upload
        if: steps.gate.outcome != 'success'
        run: exit 1
