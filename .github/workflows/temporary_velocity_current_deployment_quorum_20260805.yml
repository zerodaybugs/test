name: Temporary Velocity current deployment quorum 20260805

on:
  pull_request:
    paths:
      - '.github/workflows/temporary_velocity_current_deployment_quorum_20260805.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Finalized read-only two-RPC deployment verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import base64, datetime as dt, hashlib, json, struct, urllib.request
          from pathlib import Path

          PROGRAM='vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P'
          STATE='2etx5NvPNxeMZ7EfHE6GjJfW2imRYEUANehNS1WB4CVW'
          EXPECTED_PROGRAMDATA='HkRf36jvUB32dnHjHqpMnPcKJhUP2TUKJTH7RDTifJm7'
          EXPECTED_DEPLOYMENT_SLOT=435978201
          EXPECTED_ELF='1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80'
          EXPECTED_ELF_BYTES=4523208
          EXPECTED_STATE='2f977edfc33a5ef725963d844137f52721c6a1897d80417f1b1fc336af5be40f'
          EXPECTED_STATE_BYTES=1752
          FEATURE_OFFSET=1374
          ENDPOINTS=['https://moltnode.ag/solana','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com']
          ALPHABET='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'

          def b58encode(raw):
              zeros=len(raw)-len(raw.lstrip(b'\0'))
              number=int.from_bytes(raw,'big')
              out=''
              while number:
                  number,rem=divmod(number,58)
                  out=ALPHABET[rem]+out
              return '1'*zeros+(out or ('' if zeros else '1'))

          def request(url, method, params, timeout=90):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(url,data=body,method='POST',headers={'content-type':'application/json','user-agent':'velocity-current-deployment-quorum/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  result=json.loads(response.read())
              if result.get('error'):
                  raise RuntimeError(result['error'])
              return result['result']

          def account(url, pubkey):
              result=request(url,'getAccountInfo',[pubkey,{'encoding':'base64','commitment':'finalized'}])
              if not result.get('value'):
                  raise RuntimeError(f'missing account {pubkey}')
              value=result['value']
              return value,base64.b64decode(value['data'][0])

          def elf_size(data):
              if len(data)<64 or data[:4]!=b'\x7fELF' or data[4]!=2 or data[5]!=1:
                  raise RuntimeError('not ELF64LE')
              phoff=struct.unpack_from('<Q',data,0x20)[0]
              shoff=struct.unpack_from('<Q',data,0x28)[0]
              eh=struct.unpack_from('<H',data,0x34)[0]
              phe=struct.unpack_from('<H',data,0x36)[0]
              phn=struct.unpack_from('<H',data,0x38)[0]
              she=struct.unpack_from('<H',data,0x3a)[0]
              shn=struct.unpack_from('<H',data,0x3c)[0]
              maximum=max(64,eh)
              if phoff and phe and phn:
                  maximum=max(maximum,phoff+phe*phn)
                  for index in range(phn):
                      offset=phoff+index*phe
                      maximum=max(maximum,struct.unpack_from('<Q',data,offset+8)[0]+struct.unpack_from('<Q',data,offset+32)[0])
              if shoff and she and shn:
                  maximum=max(maximum,shoff+she*shn)
                  for index in range(shn):
                      offset=shoff+index*she
                      if struct.unpack_from('<I',data,offset+4)[0] != 8:
                          maximum=max(maximum,struct.unpack_from('<Q',data,offset+24)[0]+struct.unpack_from('<Q',data,offset+32)[0])
              if maximum>len(data):
                  raise RuntimeError('ELF extent exceeds ProgramData payload')
              return maximum

          records=[]
          errors=[]
          for endpoint in ENDPOINTS:
              try:
                  finalized_slot=request(endpoint,'getSlot',[{'commitment':'finalized'}])
                  program_value,program_data=account(endpoint,PROGRAM)
                  if len(program_data)<36 or struct.unpack_from('<I',program_data,0)[0] != 2:
                      raise RuntimeError('invalid upgradeable Program account')
                  programdata=b58encode(program_data[4:36])
                  pd_value,pd_data=account(endpoint,programdata)
                  if len(pd_data)<45 or struct.unpack_from('<I',pd_data,0)[0] != 3:
                      raise RuntimeError('invalid ProgramData account')
                  deployment_slot=struct.unpack_from('<Q',pd_data,4)[0]
                  payload=pd_data[45:]
                  canonical_bytes=elf_size(payload)
                  canonical=payload[:canonical_bytes]
                  state_value,state_data=account(endpoint,STATE)
                  record={
                    'endpoint':endpoint,
                    'checkedAtUtc':dt.datetime.now(dt.timezone.utc).isoformat(),
                    'finalizedSlot':finalized_slot,
                    'programData':programdata,
                    'programDataMatches':programdata==EXPECTED_PROGRAMDATA,
                    'deploymentSlot':deployment_slot,
                    'deploymentSlotMatches':deployment_slot==EXPECTED_DEPLOYMENT_SLOT,
                    'programOwner':program_value['owner'],
                    'programDataOwner':pd_value['owner'],
                    'canonicalElfBytes':canonical_bytes,
                    'canonicalElfSha256':hashlib.sha256(canonical).hexdigest(),
                    'canonicalElfMatches':canonical_bytes==EXPECTED_ELF_BYTES and hashlib.sha256(canonical).hexdigest()==EXPECTED_ELF,
                    'programDataPayloadBytes':len(payload),
                    'programDataPayloadSha256':hashlib.sha256(payload).hexdigest(),
                    'stateOwner':state_value['owner'],
                    'stateOwnerMatches':state_value['owner']==PROGRAM,
                    'stateBytes':len(state_data),
                    'stateSha256':hashlib.sha256(state_data).hexdigest(),
                    'stateMatches':len(state_data)==EXPECTED_STATE_BYTES and hashlib.sha256(state_data).hexdigest()==EXPECTED_STATE,
                    'featureByteOffset':FEATURE_OFFSET,
                    'featureByteValue':state_data[FEATURE_OFFSET],
                    'publicChainTransactions':0,
                    'transactionsConstructed':0,
                    'transactionsSigned':0,
                    'transactionsSent':0,
                  }
                  record['gate']=all([
                    record['programDataMatches'],record['deploymentSlotMatches'],record['canonicalElfMatches'],
                    record['stateOwnerMatches'],record['stateMatches']
                  ])
                  records.append(record)
                  if len(records)>=2:
                      break
              except Exception as exc:
                  errors.append({'endpoint':endpoint,'error':f'{type(exc).__name__}: {exc}'})

          fields=['programData','deploymentSlot','canonicalElfBytes','canonicalElfSha256','programDataPayloadBytes','programDataPayloadSha256','stateBytes','stateSha256','featureByteValue']
          quorum_agrees=len(records)>=2 and all(records[0][field]==records[1][field] for field in fields)
          output={
            'status':'PASS_FINALIZED_TWO_RPC_FULL_PROGRAM_QUORUM' if len(records)>=2 and quorum_agrees and all(row['gate'] for row in records) else 'FAIL_FINALIZED_TWO_RPC_FULL_PROGRAM_QUORUM',
            'checkedAtUtc':dt.datetime.now(dt.timezone.utc).isoformat(),
            'requiredQuorum':2,
            'successfulRpcCount':len(records),
            'quorumAgrees':quorum_agrees,
            'records':records,
            'errors':errors,
            'publicChainTransactions':0,
            'transactionsConstructed':0,
            'transactionsSigned':0,
            'transactionsSent':0,
          }
          output['gate']=output['status'].startswith('PASS')
          Path('evidence/CURRENT_DEPLOYMENT_QUORUM.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output,indent=2))
          if not output['gate']:
              raise SystemExit(2)
          PY
      - name: Create manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('evidence').glob('*')):
              if path.is_file():
                  data=path.read_bytes(); rows.append({'name':path.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          Path('evidence/MANIFEST.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Upload temporary evidence
        uses: actions/upload-artifact@v4
        with:
          name: velocity-current-deployment-quorum-${{ github.run_id }}
          path: evidence
          retention-days: 1
          if-no-files-found: error
