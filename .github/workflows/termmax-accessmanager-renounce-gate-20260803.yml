name: Temporary TermMax AccessManager renounce gate 20260803

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: termmax-accessmanager-renounce-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.head_ref == 'termmax-accessmanager-renounce-gate-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base, berachain, hyperevm, xlayer]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependency
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0
      - name: Run direct behavior probe
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python research/termmax_accessmanager_fast_probe_20260803.py \
            > >(tee evidence/stdout.log) 2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            printf 'chain=%s\n' "$CHAIN"
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum research/termmax_accessmanager_fast_probe_20260803.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-accessmanager-renounce-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
