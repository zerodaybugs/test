name: Temporary TermMax AccessManager renounce gate 20260803

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: termmax-accessmanager-renounce-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.head_ref == 'termmax-accessmanager-renounce-gate-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0

      - name: Reassemble and verify scanner
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < research/termmax_accessmanager_renounce_gate_20260803.py.gz.b64 \
            | base64 --decode > /tmp/termmax_accessmanager_renounce_gate_20260803.py.gz
          gzip -dc /tmp/termmax_accessmanager_renounce_gate_20260803.py.gz \
            > /tmp/termmax_accessmanager_renounce_gate_20260803.py
          echo '14525b29ff40b404067623e468f9453677e38d4032327f4a5c3d810a530b8196  /tmp/termmax_accessmanager_renounce_gate_20260803.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/termmax_accessmanager_renounce_gate_20260803.py

      - name: Run current-state gate
        shell: bash
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python /tmp/termmax_accessmanager_renounce_gate_20260803.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum /tmp/termmax_accessmanager_renounce_gate_20260803.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-accessmanager-renounce-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
