name: termmax-afterswap-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-afterswap-gate-trigger.txt'

permissions:
  contents: write

jobs:
  afterswap-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install Foundry and source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax
          cd termmax
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d
          forge soldeer install || true
          mkdir -p ../termmax-afterswap-result
          forge inspect TermMaxVaultV2 abi > ../termmax-afterswap-result/VAULT_ABI.json
          rg -n -C 30 'function afterSwap' contracts > ../termmax-afterswap-result/AFTER_SWAP_SOURCE.txt || true

      - name: Generate exact attacker-call test
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          out=Path('termmax-afterswap-result')
          abi=json.loads((out/'VAULT_ABI.json').read_text())
          funcs=[x for x in abi if x.get('type')=='function' and x.get('name')=='afterSwap']
          if not funcs:
              (out/'RESULT.txt').write_text('CLOSED: afterSwap not present in TermMaxVaultV2 ABI\n')
              Path('termmax/test/v2/AfterSwapExternalGate.t.sol').write_text('// no afterSwap ABI\n')
              raise SystemExit(0)
          f=funcs[0]
          types=[x['type'] for x in f['inputs']]
          names=[x.get('name','') for x in f['inputs']]
          sig='afterSwap('+','.join(types)+')'
          decl=[]; args=[]
          for i,(t,n) in enumerate(zip(types,names)):
              low=n.lower()
              if t=='address':
                  if 'order' in low: v='address(res.order)'
                  elif 'ft' in low: v='address(res.ft)'
                  elif 'xt' in low: v='address(res.xt)'
                  elif 'coll' in low: v='address(res.collateral)'
                  else: v='address(res.debt)'
                  args.append(v)
              elif t.startswith('uint'):
                  args.append('uint256(100e8)')
              elif t.startswith('int'):
                  args.append('int256(100e8)')
              elif t=='bool': args.append('true')
              elif t=='bytes': args.append('bytes("")')
              elif t=='bytes32': args.append('bytes32(0)')
              elif t.endswith('[]'):
                  base=t[:-2]
                  var=f'a{i}'
                  decl.append(f'        {base}[] memory {var} = new {base}[](0);')
                  args.append(var)
              else:
                  # Unsupported tuple/complex type: static source verdict only.
                  (out/'RESULT.txt').write_text('ACTIVE: afterSwap has unsupported complex ABI for autogenerated call: '+sig+'\n')
                  Path('termmax/test/v2/AfterSwapExternalGate.t.sol').write_text('// unsupported '+sig+'\n')
                  raise SystemExit(0)
          src=f'''// SPDX-License-Identifier: MIT
pragma solidity ^0.8.27;
import {{VaultTestV2}} from "./VaultV2.t.sol";
import {{console}} from "forge-std/console.sol";

contract AfterSwapExternalGate is VaultTestV2 {{
    function test_AfterSwapExternalAttackerCallAndStorageWrites() public {{
        address attacker = makeAddr("afterswap-attacker");
{chr(10).join(decl)}
        bytes memory data = abi.encodeWithSignature("{sig}", {', '.join(args)});
        uint256 assetsBefore = vault.totalAssets();
        uint256 supplyBefore = vault.totalSupply();
        vm.record();
        vm.prank(attacker);
        (bool ok, bytes memory ret) = address(vault).call(data);
        (, bytes32[] memory writes) = vm.accesses(address(vault));
        uint256 assetsAfter = vault.totalAssets();
        uint256 supplyAfter = vault.totalSupply();
        console.log("AFTERSWAP_OK", ok);
        console.log("AFTERSWAP_WRITES", writes.length);
        console.log("ASSETS_BEFORE", assetsBefore);
        console.log("ASSETS_AFTER", assetsAfter);
        console.log("SUPPLY_BEFORE", supplyBefore);
        console.log("SUPPLY_AFTER", supplyAfter);
        console.logBytes(ret);
        if (ok && writes.length > 0) console.log("AFTERSWAP_UNAUTHORIZED_STATE_WRITE_CANDIDATE");
        else console.log("AFTERSWAP_GATE_CLOSED");
    }}
}}
'''
          Path('termmax/test/v2/AfterSwapExternalGate.t.sol').write_text(src)
          (out/'GENERATED_SIGNATURE.txt').write_text(sig+'\n')
          PY

      - name: Run exact test and classify
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.foundry/bin:$PATH"
          if grep -q '^// no afterSwap ABI' termmax/test/v2/AfterSwapExternalGate.t.sol; then exit 0; fi
          if grep -q '^// unsupported' termmax/test/v2/AfterSwapExternalGate.t.sol; then exit 0; fi
          cd termmax
          forge test --match-contract AfterSwapExternalGate --match-test test_AfterSwapExternalAttackerCallAndStorageWrites -vvvv > ../termmax-afterswap-result/FOUNDRY.log 2>&1
          st=$?
          echo "$st" > ../termmax-afterswap-result/FOUNDRY_EXIT.txt
          cd ..
          if grep -q 'AFTERSWAP_UNAUTHORIZED_STATE_WRITE_CANDIDATE' termmax-afterswap-result/FOUNDRY.log; then
            echo 'ACTIVE: attacker afterSwap call succeeded and wrote Vault storage; manual economic exploit required' > termmax-afterswap-result/RESULT.txt
            touch termmax-afterswap-result/ACTIVE_CANDIDATE.marker
          elif grep -q 'AFTERSWAP_GATE_CLOSED' termmax-afterswap-result/FOUNDRY.log; then
            echo 'CLOSED: attacker afterSwap call reverted or produced no Vault storage writes' > termmax-afterswap-result/RESULT.txt
            touch termmax-afterswap-result/CLOSED.marker
          else
            echo 'UNRESOLVED: test/build did not produce a decisive sentinel' > termmax-afterswap-result/RESULT.txt
            touch termmax-afterswap-result/UNRESOLVED.marker
          fi
          cat termmax-afterswap-result/FOUNDRY.log
          exit 0

      - name: Persist and upload
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum termmax-afterswap-result/* | sort > termmax-afterswap-result/SHA256SUMS.txt
          git config user.name termmax-research-bot
          git config user.email actions@users.noreply.github.com
          git add termmax-afterswap-result
          git commit -m 'Persist TermMax afterSwap gate result' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termmax-afterswap-gate-result
          path: termmax-afterswap-result/
          retention-days: 7
