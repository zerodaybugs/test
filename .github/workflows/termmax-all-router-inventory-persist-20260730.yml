name: TermMax all Router inventory persistent result 20260730

on:
  push:
    branches: [termmax-all-router-inventory-20260730]
    paths:
      - '.github/workflows/termmax-all-router-inventory-persist-20260730.yml'
      - 'monitor/termmax_all_router_inventory_20260730.py'
      - 'monitor/TRIGGER_ALL_ROUTER_INVENTORY_PERSIST.txt'

permissions:
  contents: write

jobs:
  scan-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termmax-all-router-inventory-20260730
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Inventory every official Router generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-results/termmax-all-router-inventory /tmp/termmax-contract-v2
          mkdir -p public-results/termmax-all-router-inventory
          CHAIN=all OUT_DIR=public-results/termmax-all-router-inventory TERMMAX_REPO=/tmp/termmax-contract-v2 \
            python monitor/termmax_all_router_inventory_20260730.py \
            > public-results/termmax-all-router-inventory/stdout.log \
            2> public-results/termmax-all-router-inventory/stderr.log
          find public-results/termmax-all-router-inventory -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum \
            > public-results/termmax-all-router-inventory/SHA256SUMS.txt
      - name: Commit public read-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public-results/termmax-all-router-inventory/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add TermMax all Router inventory result ${GITHUB_RUN_ID}"
          git push origin HEAD:termmax-all-router-inventory-20260730
