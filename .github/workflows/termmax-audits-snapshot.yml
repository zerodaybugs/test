name: termmax-audits-snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-live-gate-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone TermMax audits
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/term-structure/audits.git termmax-audits
          cd termmax-audits
          git rev-parse HEAD > AUDITS_COMMIT.txt
          rm -rf .git
          find . -type f -printf '%p\t%s bytes\n' | sort > FILE_LIST.txt
      - name: Upload audit corpus
        uses: actions/upload-artifact@v4
        with:
          name: termmax-audits-corpus
          path: termmax-audits/
          retention-days: 7
