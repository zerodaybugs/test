name: TermMax bad-debt bucket persistent census 20260730

on:
  push:
    branches: [termmax-bad-debt-bucket-census-20260730]
    paths:
      - '.github/workflows/termmax-bad-debt-bucket-persist-20260730.yml'
      - 'monitor/termmax_vault_asset_binding_census_20260730.py'
      - 'monitor/termmax_bad_debt_bucket_census_20260730.py'
      - 'monitor/TRIGGER_BAD_DEBT_BUCKET_PERSIST.txt'

permissions:
  contents: write

jobs:
  scan-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termmax-bad-debt-bucket-census-20260730
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4 eth-abi==5.2.0
      - name: Scan current bad-debt recovery buckets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-results/termmax-bad-debt-buckets
          mkdir -p public-results/termmax-bad-debt-buckets
          CHAIN=all OUT_DIR=public-results/termmax-bad-debt-buckets \
            python monitor/termmax_bad_debt_bucket_census_20260730.py \
            > public-results/termmax-bad-debt-buckets/stdout.log \
            2> public-results/termmax-bad-debt-buckets/stderr.log
          find public-results/termmax-bad-debt-buckets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum \
            > public-results/termmax-bad-debt-buckets/SHA256SUMS.txt
      - name: Commit public read-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public-results/termmax-bad-debt-buckets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add TermMax bad-debt bucket census result ${GITHUB_RUN_ID}"
          git push origin HEAD:termmax-bad-debt-bucket-census-20260730
