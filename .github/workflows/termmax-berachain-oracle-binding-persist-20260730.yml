name: TermMax Berachain oracle binding persistent result 20260730

on:
  push:
    branches: [termmax-berachain-oracle-binding-20260730]
    paths:
      - '.github/workflows/termmax-berachain-oracle-binding-persist-20260730.yml'
      - 'monitor/termmax_berachain_oracle_binding_20260730.py'
      - 'monitor/TRIGGER_BERACHAIN_ORACLE_BINDING_PERSIST.txt'

permissions:
  contents: write

jobs:
  scan-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termmax-berachain-oracle-binding-20260730
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0
      - name: Resolve current bindings
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-results/termmax-berachain-oracle-binding /tmp/termmax-contract-v2
          mkdir -p public-results/termmax-berachain-oracle-binding
          OUT_DIR=public-results/termmax-berachain-oracle-binding TERMMAX_REPO=/tmp/termmax-contract-v2 \
            python monitor/termmax_berachain_oracle_binding_20260730.py \
            > public-results/termmax-berachain-oracle-binding/stdout.log \
            2> public-results/termmax-berachain-oracle-binding/stderr.log
          find public-results/termmax-berachain-oracle-binding -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum \
            > public-results/termmax-berachain-oracle-binding/SHA256SUMS.txt
      - name: Commit public read-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public-results/termmax-berachain-oracle-binding/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add TermMax Berachain oracle binding result ${GITHUB_RUN_ID}"
          git push origin HEAD:termmax-berachain-oracle-binding-20260730
