name: termmax-bnb-current-markets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-bnb-current-markets.yml'
      - 'termmax-bnb-current-markets-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ethers
        run: npm install --no-audit --no-fund ethers@5.7.2
      - name: Enumerate current BNB TermMax V2 markets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-bnb-markets
          node - <<'NODE' 2>&1 | tee evidence-bnb-markets/EXECUTION.log
          const fs=require('fs');
          const {ethers}=require('ethers');
          const RPCS=['https://bsc-rpc.publicnode.com','https://bsc-dataseed.binance.org','https://1rpc.io/bnb'];
          const factories=[
            {address:'0x4a34b4cAaA6AD23B95d6ec6394472fbB857eB064',from:92629573,label:'factoryV2'},
            {address:'0x22105089AFC8F35D55a9Efb19785fd350ADdd7C3',from:92629573,label:'alphaFactory'}
          ];
          const marketEvent='event MarketCreated(address indexed market,address indexed collateral,address indexed debtToken,tuple(address collateral,address debtToken,address admin,address gtImplementation,tuple(address treasurer,uint64 maturity,tuple(uint32 lendTakerFeeRatio,uint32 lendMakerFeeRatio,uint32 borrowTakerFeeRatio,uint32 borrowMakerFeeRatio,uint32 mintGtFeeRatio,uint32 mintGtFeeRef) feeConfig) marketConfig,tuple(address oracle,uint32 liquidationLtv,uint32 maxLtv,bool liquidatable) loanConfig,bytes gtInitalParams,string tokenName,string tokenSymbol) params)';
          const marketAbi=['function name() view returns(string)','function tokens() view returns(address ft,address xt,address gt,address collateral,address debtToken)','function config() view returns(tuple(address treasurer,uint64 maturity,tuple(uint32 lendTakerFeeRatio,uint32 lendMakerFeeRatio,uint32 borrowTakerFeeRatio,uint32 borrowMakerFeeRatio,uint32 mintGtFeeRatio,uint32 mintGtFeeRef) feeConfig))'];
          const gtAbi=['function getGtConfig() view returns(tuple(address collateral,address debtToken,address ft,address treasurer,uint64 maturity,tuple(address oracle,uint32 liquidationLtv,uint32 maxLtv,bool liquidatable) loanConfig))','function totalSupply() view returns(uint256)'];
          const tokenAbi=['function symbol() view returns(string)','function decimals() view returns(uint8)','function totalSupply() view returns(uint256)','function balanceOf(address) view returns(uint256)'];
          const oracleV2Abi=['function getPrice(address asset) view returns(uint256 price,uint8 decimals)','function oracles(address asset) view returns(address aggregator,address backupAggregator,int256 maxPrice,int256 minPrice,uint32 heartbeat,uint32 backupHeartbeat)'];
          async function provider(){for(const u of RPCS){try{const p=new ethers.providers.JsonRpcProvider(u,56);if((await p.getNetwork()).chainId===56)return {p,u}}catch(e){}}throw Error('no rpc')}
          async function safe(p){try{return {ok:true,value:await p}}catch(e){return {ok:false,error:String(e)}}}
          function ser(x){if(ethers.BigNumber.isBigNumber(x))return x.toString();if(Array.isArray(x))return x.map(ser);if(x&&typeof x==='object'){const o={};for(const[k,v]of Object.entries(x))if(!/^\d+$/.test(k))o[k]=ser(v);return o}return x}
          async function logsAdaptive(p,address,from,to,topic){let out=[],cur=from,span=250000,progress=[];while(cur<=to){const end=Math.min(to,cur+span-1);try{const x=await p.getLogs({address,fromBlock:cur,toBlock:end,topics:[topic]});out.push(...x);progress.push({from:cur,to:end,count:x.length,span});cur=end+1;if(x.length<100&&span<1000000)span*=2}catch(e){progress.push({from:cur,to:end,error:String(e),span});if(span<=100)throw e;span=Math.max(100,Math.floor(span/2))}}return {out,progress}}
          (async()=>{
            const {p,u}=await provider();const latest=await p.getBlockNumber();const block=await p.getBlock(latest);const iface=new ethers.utils.Interface([marketEvent]);const topic=iface.getEventTopic('MarketCreated');const seen=new Map();const progress={};
            for(const f of factories){const s=await logsAdaptive(p,f.address,f.from,latest,topic);progress[f.label]=s.progress;for(const l of s.out){const x=iface.parseLog(l);seen.set(x.args.market.toLowerCase(),{market:x.args.market,collateralEvent:x.args.collateral,debtEvent:x.args.debtToken,factory:f.address,block:l.blockNumber,tx:l.transactionHash})}}
            const markets=[];
            for(const base of seen.values()){
              const m=new ethers.Contract(base.market,marketAbi,p);
              try{
                const [name,tokens,config]=await Promise.all([m.name(),m.tokens(),m.config()]);const gt=new ethers.Contract(tokens.gt,gtAbi,p);const [gcfg,gtsup]=await Promise.all([gt.getGtConfig(),gt.totalSupply()]);const debt=new ethers.Contract(tokens.debtToken,tokenAbi,p);const coll=new ethers.Contract(tokens.collateral,tokenAbi,p);const ft=new ethers.Contract(tokens.ft,tokenAbi,p);const [ds,dd,cs,cd,fts,dbal,gtcbal]=await Promise.all([debt.symbol().catch(()=>''),debt.decimals(),coll.symbol().catch(()=>''),coll.decimals(),ft.totalSupply(),debt.balanceOf(base.market),coll.balanceOf(tokens.gt)]);const o=new ethers.Contract(gcfg.loanConfig.oracle,oracleV2Abi,p);const [dp,cp,dcfg,ccfg]=await Promise.all([safe(o.getPrice(tokens.debtToken)),safe(o.getPrice(tokens.collateral)),safe(o.oracles(tokens.debtToken)),safe(o.oracles(tokens.collateral))]);markets.push(ser({...base,name,tokens,config,gtConfig:gcfg,gtSupply:gtsup,ftSupply:fts,debtMarketBalance:dbal,collateralGtBalance:gtcbal,debt:{symbol:ds,decimals:dd,price:dp,oracleConfig:dcfg},collateral:{symbol:cs,decimals:cd,price:cp,oracleConfig:ccfg}}));
              }catch(e){markets.push({...base,fatalError:String(e)})}
            }
            const result={rpc:u,snapshot:{block:latest,hash:block.hash,timestamp:block.timestamp},marketCount:markets.length,markets,progress};fs.writeFileSync('evidence-bnb-markets/STATE.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          })().catch(e=>{fs.writeFileSync('evidence-bnb-markets/ERROR.txt',String(e.stack||e));console.error(e);process.exit(1)});
          NODE
          sha256sum evidence-bnb-markets/* | sort > evidence-bnb-markets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termmax-bnb-current-markets
          path: evidence-bnb-markets/
          if-no-files-found: warn
          retention-days: 3
