name: termmax-commit-metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-commit-metadata.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture public commit metadata
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/term-structure/termmax-contract-v2.git termmax
          cd termmax
          git show -s --format='commit=%H%nparents=%P%nauthorDate=%aI%ncommitDate=%cI%nsubject=%s' \
            52045eaabddb65c2cdc58418e25a9e0f9474fd94 | tee "$GITHUB_WORKSPACE/COMMIT_METADATA.txt"
          git show -s --format='headCommit=%H%nheadAuthorDate=%aI%nheadCommitDate=%cI%nheadSubject=%s' \
            e314f3f849577dfecd4614f148c4df81fdf8c72d | tee -a "$GITHUB_WORKSPACE/COMMIT_METADATA.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-commit-metadata
          path: COMMIT_METADATA.txt
          retention-days: 1
