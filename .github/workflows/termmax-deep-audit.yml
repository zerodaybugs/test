name: termmax-deep-audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-deep-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep jq poppler-utils tree
          python3 -m pip install --user semgrep slither-analyzer
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup

      - name: Clone pinned source and audit corpus
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax
          cd termmax
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d
          git submodule update --init --recursive || true
          forge soldeer install || true
          cd ..
          git clone https://github.com/term-structure/audits.git audits
          mkdir -p evidence/audits-text
          find audits -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' f; do
            out="evidence/audits-text/$(echo "$f" | tr '/' '_').txt"
            pdftotext -layout "$f" "$out" 2>/dev/null || true
          done

      - name: Build structural security inventory
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence
          cd termmax
          git rev-parse HEAD > ../evidence/SOURCE_COMMIT.txt
          forge --version > ../evidence/FOUNDRY_VERSION.txt
          solc --version > ../evidence/SOLC_VERSION.txt || true
          rg -n -C 12 'function afterSwap|function .*Callback|executeOperation|onMorphoFlashLoan|reinitializer\(|delegatecall|\.call\{|safeTransfer\(|safeTransferFrom\(' contracts > ../evidence/SECURITY_SURFACE.txt || true
          rg -n -C 8 'function afterSwap' contracts > ../evidence/AFTER_SWAP_SOURCE.txt || true
          rg -n -C 8 'reinitializer\(' contracts > ../evidence/REINITIALIZERS.txt || true
          rg -n -C 8 'function withdrawFts|function dealBadDebt|function redeemOrder' contracts/v2/vault > ../evidence/VAULT_SELECTIVE_WITHDRAWAL.txt || true
          rg -n -C 12 '_getLiquidationInfo|function liquidate|LtvIncreasedAfterLiquidation' contracts/v2/tokens > ../evidence/LIQUIDATION_SOURCE.txt || true
          rg -n -C 8 'external|public' contracts/v2 | rg 'transfer|withdraw|redeem|burn|mint|callback|afterSwap|initialize|upgrade' > ../evidence/EXTERNAL_MUTATORS.txt || true
          git diff --unified=80 64bd47b98e064c7fb91ab4a59b70520e0ec285d5..e314f3f849577dfecd4614f148c4df81fdf8c72d -- contracts > ../evidence/POST_AUDIT_DIFF.patch

      - name: Automated caller-auth and state-write analysis
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('termmax/contracts')
          findings=[]
          callback_terms=('afterSwap','Callback','executeOperation','onMorphoFlashLoan','onERC721Received')
          asset_terms=('safeTransfer','safeTransferFrom','transfer(','transferFrom(','_mint(','_burn(','delegatecall','.call{','.call(')
          for p in root.rglob('*.sol'):
              text=p.read_text(errors='ignore')
              # Lightweight function extraction with balanced braces.
              for m in re.finditer(r'function\s+([A-Za-z0-9_]+)\s*\((.*?)\)([^;{]*)\{', text, re.S):
                  name,args,tail=m.group(1),m.group(2),m.group(3)
                  start=m.start(); brace=m.end()-1; depth=0; end=None
                  for i in range(brace,len(text)):
                      if text[i]=='{': depth+=1
                      elif text[i]=='}':
                          depth-=1
                          if depth==0: end=i+1; break
                  if end is None: continue
                  body=text[brace:end]
                  vis=('external' if 'external' in tail else 'public' if 'public' in tail else '')
                  if not vis: continue
                  auth_tokens=('onlyOwner','onlyRole','hasRole','onlyMarket','onlyOrder','onlyCallbackAddress','onlyWhitelisted','msg.sender ==','msg.sender !=','_msgSender() ==','_msgSender() !=','ownerOf(','isOwnerOrDelegate','_checkWhitelisted')
                  has_auth=any(x in tail or x in body[:900] for x in auth_tokens)
                  state_or_asset=any(x in body for x in asset_terms) or bool(re.search(r'\b_[A-Za-z0-9_]+\s*(?:\+=|-=|=|\+\+|--)',body))
                  callbackish=any(t in name for t in callback_terms)
                  if (callbackish or state_or_asset) and not has_auth:
                      line=text.count('\n',0,start)+1
                      findings.append({'file':str(p.relative_to(root.parent)),'line':line,'name':name,'visibility':vis,'tail':' '.join(tail.split()),'callbackish':callbackish,'asset_or_state':state_or_asset,'snippet':text[start:min(end,start+3500)]})
          Path('evidence/UNAUTHENTICATED_MUTATOR_CANDIDATES.json').write_text(json.dumps(findings,indent=2))
          md=['# Unauthenticated mutator candidates','',f'Count: {len(findings)}','']
          for x in findings:
              md += [f"## {x['file']}:{x['line']} — `{x['name']}`",'',f"Tail: `{x['tail']}`",'','```solidity',x['snippet'][:1800],'```','']
          Path('evidence/UNAUTHENTICATED_MUTATOR_CANDIDATES.md').write_text('\n'.join(md))
          PY

      - name: Slither and Semgrep
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd termmax
          slither . --exclude-dependencies --json ../evidence/SLITHER.json > ../evidence/SLITHER.log 2>&1
          echo $? > ../evidence/SLITHER_EXIT.txt
          semgrep --config p/smart-contracts --json contracts > ../evidence/SEMGREP.json 2> ../evidence/SEMGREP.err
          echo $? > ../evidence/SEMGREP_EXIT.txt
          exit 0

      - name: Dedup search across audits
        shell: bash
        run: |
          set -euxo pipefail
          rg -ni -C 5 'afterSwap|callback|unauthenticated|authorization|withdrawFts|specific order|order selection|bad debt|physical delivery|cherry|liquidat|half liquidation|reinitializer|arbitrary call|delegatecall|oracle|decimal|rounding' evidence/audits-text > evidence/AUDIT_DEDUP_HITS.txt || true
          rg -ni -C 5 'afterSwap|withdrawFts|dealBadDebt|liquidat|callback|reentr|oracle|decimal' audits > evidence/AUDIT_FILENAMES_AND_TEXT_HITS.txt || true

      - name: Build triage report
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          ev=Path('evidence')
          c=[]
          p=ev/'UNAUTHENTICATED_MUTATOR_CANDIDATES.json'
          if p.exists():
              xs=json.loads(p.read_text())
              c.append(f'Unauthenticated mutator candidates: {len(xs)}')
              for x in xs[:30]: c.append(f"- {x['file']}:{x['line']} {x['name']}")
          c += ['', 'Artifacts requiring manual exploit validation:', '- AFTER_SWAP_SOURCE.txt', '- VAULT_SELECTIVE_WITHDRAWAL.txt', '- LIQUIDATION_SOURCE.txt', '- POST_AUDIT_DIFF.patch', '- AUDIT_DEDUP_HITS.txt', '- SLITHER.json', '- SEMGREP.json']
          (ev/'TRIAGE.md').write_text('# TermMax autonomous deep-audit triage\n\n'+'\n'.join(c)+'\n')
          PY
          find evidence -type f -maxdepth 3 -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          tree -a evidence > evidence/FILE_TREE.txt

      - name: Upload deep-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-deep-audit-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
