name: termmax-defillama-adapter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-defillama-adapter.yml'
      - 'termmax-defillama-adapter-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Execute pinned upstream adapter unchanged
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/DefiLlama/yield-server.git yield-server
          cd yield-server
          git fetch --depth 1 origin 5d6b76c72a5f152b588b2ad385d21c0a00b8558a
          git checkout 5d6b76c72a5f152b588b2ad385d21c0a00b8558a
          npm ci --omit=dev
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          node - <<'NODE' | tee "$GITHUB_WORKSPACE/evidence/EXECUTION.log"
          const fs = require('fs');
          const adapter = require('./src/adaptors/termmax');
          (async () => {
            const pools = await adapter.apy();
            pools.sort((a,b)=>(b.tvlUsd||0)-(a.tvlUsd||0));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/evidence/ADAPTER_OUTPUT.json', JSON.stringify(pools,null,2));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/evidence/SUMMARY.json', JSON.stringify({
              count:pools.length,
              totalTvlUsd:pools.reduce((s,p)=>s+(p.tvlUsd||0),0),
              pools:pools.map(p=>({pool:p.pool,chain:p.chain,symbol:p.symbol,tvlUsd:p.tvlUsd,apyBase:p.apyBase,poolMeta:p.poolMeta,url:p.url,underlyingTokens:p.underlyingTokens}))
            },null,2));
            console.log(JSON.stringify(pools,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          printf '%s\n' 5d6b76c72a5f152b588b2ad385d21c0a00b8558a > "$GITHUB_WORKSPACE/evidence/ADAPTER_COMMIT.txt"
          sha256sum "$GITHUB_WORKSPACE"/evidence/* | sort > "$GITHUB_WORKSPACE/evidence/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-defillama-adapter
          path: evidence/
          if-no-files-found: error
          retention-days: 3
