name: termmax-defillama-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-defillama-inventory.yml'
      - 'termmax-defillama-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current public TermMax pool inventory
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence
          curl --retry 5 --retry-all-errors -fsSL https://yields.llama.fi/pools -o evidence/ALL_POOLS.json
          jq '[.data[] | select((.project // "") | ascii_downcase == "termmax") | {pool,chain,symbol,tvlUsd,apy,apyBase,apyReward,underlyingTokens,poolMeta,exposure,stablecoin,ilRisk,predictions}] | sort_by(-(.tvlUsd // 0))' evidence/ALL_POOLS.json > evidence/TERMMAX_POOLS.json
          jq '{count:length,totalTvlUsd:(map(.tvlUsd // 0)|add),byChain:(group_by(.chain)|map({chain:.[0].chain,count:length,tvlUsd:(map(.tvlUsd // 0)|add)})),pools:.}' evidence/TERMMAX_POOLS.json > evidence/SUMMARY.json
          jq . evidence/SUMMARY.json
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-defillama-inventory
          path: evidence/
          if-no-files-found: error
          retention-days: 3
