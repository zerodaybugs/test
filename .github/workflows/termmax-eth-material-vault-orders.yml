name: termmax-eth-material-vault-orders

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-eth-material-vault-orders.yml'
      - 'termmax-eth-material-vault-orders-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: coinshift-rlusd
            vault: '0x7A84fCB839BEb377861001c6339a986B9e6d6D68'
            from_block: '24338283'
          - label: termmax-usdc
            vault: '0xF488ccdf04079cC03183cDB6A147d12Cf97F9317'
            from_block: '23490022'
          - label: termmax-weth
            vault: '0x95fB87609f80c47e3102B976455023D2B9BE9b8F'
            from_block: '23490023'
          - label: prime-yield
            vault: '0x17337c22CF8b7C1B6fC86F0ef7Fcf05a7fA93f48'
            from_block: '23516443'
          - label: mezencap
            vault: '0x394ec054e8275C40c45F116683f250a3E40Ea34d'
            from_block: '24036283'
          - label: xaue-xaut
            vault: '0x7fB02AeA6f04d44a61E413FA220CaF18DCD626Fb'
            from_block: '24832207'
          - label: ellen-usdc
            vault: '0xE3e545abfA18019bcd74abA2C13dC569d6D018A8'
            from_block: '24832165'
          - label: edge-usdc
            vault: '0xBbf747e83f2f1650F7B303F6166Fc3fE8a5B0cE5'
            from_block: '23540487'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK
        run: |
          mkdir sdk && cd sdk
          npm init -y
          npm install --no-audit --no-fund @defillama/sdk@5.0.219
      - name: Read current vault and order state
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          VAULT: ${{ matrix.vault }}
          FROM_BLOCK: ${{ matrix.from_block }}
        run: |
          set -euxo pipefail
          mkdir -p evidence
          cd sdk
          node - <<'NODE' | tee ../evidence/EXECUTION.log
          const fs=require('fs'); const sdk=require('@defillama/sdk'); const chain='ethereum';
          const vault=process.env.VAULT; const from=Number(process.env.FROM_BLOCK); const label=process.env.LABEL;
          const N='event NewOrderCreated(address indexed caller,address indexed market,address indexed order)';
          const R='event RedeemOrder(address indexed caller,address indexed order,uint256 badDebt,uint256 diliveryAmount)';
          const W='event WithdrawFts(address indexed caller,address indexed recipient,address indexed order,uint256 amount,uint256 shares)';
          const normal=v=>JSON.parse(JSON.stringify(v,(_,x)=>typeof x==='bigint'?x.toString():x));
          const dump=v=>JSON.stringify(v,(_,x)=>typeof x==='bigint'?x.toString():x,2);
          const err=e=>String(e?.message||e);
          const call=async(target,abi,params=[])=>{try{return normal((await sdk.api.abi.call({target,abi,params,chain})).output)}catch(e){return {error:err(e)}}};
          (async()=>{
            const latest=(await sdk.api.util.getLatestBlock(chain)).number;
            const [nl,rl,wl]=await Promise.all([
              sdk.getEventLogs({target:vault,eventAbi:N,fromBlock:from,toBlock:latest,chain}),
              sdk.getEventLogs({target:vault,eventAbi:R,fromBlock:from,toBlock:latest,chain}),
              sdk.getEventLogs({target:vault,eventAbi:W,fromBlock:from,toBlock:latest,chain}),
            ]);
            const redeemed=new Map(rl.map(x=>[x.args.order.toLowerCase(),{badDebt:String(x.args.badDebt),delivery:String(x.args.diliveryAmount),block:Number(x.blockNumber||0),tx:x.transactionHash}]));
            const map=new Map(); for(const l of nl) map.set(l.args.order.toLowerCase(),{order:l.args.order,marketEvent:l.args.market,createdBlock:Number(l.blockNumber||0),tx:l.transactionHash});
            const asset=await call(vault,'address:asset'); const decimals=await call(asset,'uint8:decimals');
            const orders=[];
            for(const o of map.values()){
              const market=await call(o.order,'address:market');
              const tokens=await call(market,'function tokens() view returns (address ft,address xt,address gt,address collateral,address debtToken)');
              let ft=null,xt=null,gt=null,collateral=null,debt=null;
              if(tokens&&!tokens.error){ft=tokens.ft||tokens[0];xt=tokens.xt||tokens[1];gt=tokens.gt||tokens[2];collateral=tokens.collateral||tokens[3];debt=tokens.debtToken||tokens[4]}
              const [maturity,reserves,realReserves,virtualXt,expiry,apr,bad,ftBal,xtBal,marketDebt,gtCollateral,gtSupply]=await Promise.all([
                call(vault,'function orderMaturity(address) view returns (uint256)',[o.order]),
                call(o.order,'function tokenReserves() view returns (uint256 ftReserve,uint256 xtReserve)'),
                call(o.order,'function getRealReserves() view returns (uint256 ftReserve,uint256 xtReserve)'),
                call(o.order,'uint256:virtualXtReserve'),
                call(o.order,'uint256:orderExpiryTimestamp'),
                call(o.order,'function apr() view returns (uint256 lendApr,uint256 borrowApr)'),
                collateral?call(vault,'function badDebtMapping(address) view returns (uint256)',[collateral]):null,
                ft?call(ft,'function balanceOf(address) view returns (uint256)',[o.order]):null,
                xt?call(xt,'function balanceOf(address) view returns (uint256)',[o.order]):null,
                debt?call(debt,'function balanceOf(address) view returns (uint256)',[market]):null,
                collateral&&gt?call(collateral,'function balanceOf(address) view returns (uint256)',[gt]):null,
                gt?call(gt,'uint256:totalSupply'):null,
              ]);
              orders.push({...o,market,tokens,maturity:String(maturity),reserves,realReserves,virtualXt:String(virtualXt),expiry:String(expiry),apr,badDebtForCollateral:bad===null?null:String(bad),ftBalance:ftBal===null?null:String(ftBal),xtBalance:xtBal===null?null:String(xtBal),marketDebtBalance:marketDebt===null?null:String(marketDebt),gtCollateralBalance:gtCollateral===null?null:String(gtCollateral),gtTotalSupply:gtSupply===null?null:String(gtSupply),redeemed:redeemed.get(o.order.toLowerCase())||null});
            }
            const num=x=>typeof x==='string'&&/^\d+$/.test(x)?BigInt(x):0n;
            const state={label,vault,latest,name:await call(vault,'string:name'),symbol:await call(vault,'string:symbol'),asset,assetDecimals:decimals,totalAssets:String(await call(vault,'uint256:totalAssets')),totalSupply:String(await call(vault,'uint256:totalSupply')),maxDeposit:String(await call(vault,'function maxDeposit(address) view returns (uint256)',[vault])),paused:await call(vault,'bool:paused'),pool:await call(vault,'address:pool'),apy:String(await call(vault,'uint256:apy')),orderCount:orders.length,activeOrderCount:orders.filter(o=>!o.redeemed).length,activeNonzeroFtOrders:orders.filter(o=>!o.redeemed&&num(o.ftBalance)>0n).length,totalActiveFtRaw:orders.filter(o=>!o.redeemed).reduce((s,o)=>s+num(o.ftBalance),0n).toString(),positiveBadDebtRaw:[...new Set(orders.map(o=>o.badDebtForCollateral).filter(x=>num(x)>0n))],withdrawFtsEventCount:wl.length,withdrawFtsEvents:wl.map(x=>({order:x.args.order,amount:String(x.args.amount),shares:String(x.args.shares),block:Number(x.blockNumber||0),tx:x.transactionHash})),orders};
            fs.writeFileSync('../evidence/STATE.json',dump(state)); console.log(dump(state));
          })().catch(e=>{console.error(e);fs.writeFileSync('../evidence/ERROR.txt',String(e.stack||e));process.exit(1)});
          NODE
          sha256sum ../evidence/* | sort > ../evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termmax-eth-orders-${{ matrix.label }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
