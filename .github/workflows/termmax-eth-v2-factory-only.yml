name: termmax-eth-v2-factory-only

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-eth-v2-factory-only.yml'
      - 'termmax-eth-v2-factory-only-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK
        run: |
          mkdir sdk && cd sdk
          npm init -y
          npm install --no-audit --no-fund @defillama/sdk@5.0.219
      - name: Enumerate factory vaults and basic state
        shell: bash
        run: |
          mkdir -p evidence
          cd sdk
          node - <<'NODE' | tee ../evidence/EXECUTION.log
          const fs=require('fs'); const sdk=require('@defillama/sdk'); const chain='ethereum';
          const eventAbi='event VaultCreated(address indexed vault,address indexed creator,(address admin,address curator,address guardian,uint256 timelock,address asset,address pool,uint256 maxCapacity,string name,string symbol,uint64 performanceFeeRate,uint64 minApy) initialParams)';
          const factories=[['0xF2BDa87CA467eB90A1b68f824cB136baA68a8177',23430000],['0x5b8B26a6734B5eABDBe6C5A19580Ab2D0424f027',23430000]];
          const normal=v=>JSON.parse(JSON.stringify(v,(_,x)=>typeof x==='bigint'?x.toString():x));
          const call=async(target,abi,params=[])=>{try{return normal((await sdk.api.abi.call({target,abi,params,chain})).output)}catch(e){return {error:String(e?.message||e)}}};
          (async()=>{
            const latest=(await sdk.api.util.getLatestBlock(chain)).number; const map=new Map();
            for(const [f,from] of factories){const ls=await sdk.getEventLogs({target:f,eventAbi,fromBlock:from,toBlock:latest,chain}); for(const l of ls) map.set(l.args.vault.toLowerCase(),{vault:l.args.vault,creator:l.args.creator,factory:f,createdBlock:Number(l.blockNumber||0),initialParams:normal(l.args.initialParams||l.args[2])});}
            const vaults=[];
            for(const v of map.values()) vaults.push({...v,name:await call(v.vault,'string:name'),symbol:await call(v.vault,'string:symbol'),asset:await call(v.vault,'address:asset'),pool:await call(v.vault,'address:pool'),totalAssets:String(await call(v.vault,'uint256:totalAssets')),totalSupply:String(await call(v.vault,'uint256:totalSupply')),maxDeposit:String(await call(v.vault,'function maxDeposit(address) view returns (uint256)',[v.vault])),paused:await call(v.vault,'bool:paused'),apy:String(await call(v.vault,'uint256:apy'))});
            const out={latest,count:vaults.length,vaults}; fs.writeFileSync('../evidence/STATE.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);fs.writeFileSync('../evidence/ERROR.txt',String(e.stack||e));process.exit(1)});
          NODE
          sha256sum ../evidence/* | sort > ../evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termmax-eth-v2-factory-only
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
