name: TermMax expired order recovery quality read-only scan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-expired-order-quality.yml'
      - 'infra/termmax_expired_order_quality.py'

permissions:
  contents: read

jobs:
  scan-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute expired order recovery previews
        shell: bash
        run: |
          set +e
          rm -rf termmax-expired-order-quality
          python3 infra/termmax_expired_order_quality.py > order-quality.stdout 2> order-quality.stderr
          rc=$?
          echo "$rc" > order-quality.exit
          mkdir -p termmax-expired-order-quality
          cp order-quality.stdout order-quality.stderr order-quality.exit termmax-expired-order-quality/
          find termmax-expired-order-quality -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > termmax-expired-order-quality/SHA256SUMS
          zip -qr TERMMAX_EXPIRED_ORDER_QUALITY.zip termmax-expired-order-quality
          sha256sum TERMMAX_EXPIRED_ORDER_QUALITY.zip > TERMMAX_EXPIRED_ORDER_QUALITY.zip.sha256
          exit 0
      - name: Upload evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-expired-order-quality
          path: |
            TERMMAX_EXPIRED_ORDER_QUALITY.zip
            TERMMAX_EXPIRED_ORDER_QUALITY.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Enforce scan gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat order-quality.exit)" = '0'
          grep -F '"status": "PASS"' order-quality.stdout
