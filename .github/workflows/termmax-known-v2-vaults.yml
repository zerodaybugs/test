name: termmax-known-v2-vaults

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-known-v2-vaults.yml'
      - 'termmax-known-v2-vaults-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: eth-usdc-v2
            chain: ethereum
            rpc: https://ethereum-rpc.publicnode.com
            vault: '0xf488ccdf04079cc03183cdb6a147d12cf97f9317'
            from_block: '23430000'
          - label: eth-weth-v2
            chain: ethereum
            rpc: https://ethereum-rpc.publicnode.com
            vault: '0x95fB87609f80c47e3102B976455023D2B9BE9b8F'
            from_block: '23430000'
          - label: base-usdc-v2
            chain: base
            rpc: https://base-rpc.publicnode.com
            vault: '0xd42c1bf2aca1dd771795453277cc14f6c3b2c388'
            from_block: '43289755'
          - label: arb-usdc-v2
            chain: arbitrum
            rpc: https://arbitrum-one-rpc.publicnode.com
            vault: '0xcb94abcffbf5cc76a55f9c1496632a26d19f9947'
            from_block: '385228046'
          - label: bsc-usdc-v2
            chain: bsc
            rpc: https://bsc-rpc.publicnode.com
            vault: '0xe0188f026c90f7b6d410149d21046d33f144de26'
            from_block: '63100000'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned live vault and order state
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          CHAIN: ${{ matrix.chain }}
          RPC: ${{ matrix.rpc }}
          VAULT: ${{ matrix.vault }}
          FROM_BLOCK: ${{ matrix.from_block }}
        run: |
          set -euxo pipefail
          mkdir -p evidence
          python3 - <<'PY' | tee evidence/EXECUTION.log
          import json, os, re, time, urllib.request
          from pathlib import Path

          rpc=os.environ['RPC']; vault=os.environ['VAULT']; start=int(os.environ['FROM_BLOCK']); label=os.environ['LABEL']
          out=Path('evidence'); rid=0; raw=[]
          topics={
            'new':'0x3ca4bef6cb680238d8c3dcdcca83a5aadcadff2571d3a2c67ee85b2750944b97',
            'redeem':'0x21f71f6609f50b01dbe90a67add86958b134ef6fa7e8c668df45730004806242',
            'withdraw':'0x53239297447654f3a1c8342314051bc2fe9134b7bbe4a390eade008bb5eca1f2'}
          sel={'name':'0x06fdde03','symbol':'0x95d89b41','asset':'0x38d52e0f','totalAssets':'0x01e1d114','totalSupply':'0x18160ddd','maxDeposit':'0x402d267d','paused':'0x5c975abb','apy':'0x3bcfc4b8','pool':'0x16f0115b','market':'0x80f55605','tokenReserves':'0x4bad9510','expiry':'0x3a0d3561','tokens':'0x9d63848a','config':'0x79502c55','badDebt':'0x618f9694','orderMaturity':'0xac33207f','balanceOf':'0x70a08231','decimals':'0x313ce567'}
          def req(method,params,timeout=60):
            global rid; rid+=1
            body=json.dumps({'jsonrpc':'2.0','id':rid,'method':method,'params':params}).encode()
            r=urllib.request.Request(rpc,data=body,headers={'content-type':'application/json','user-agent':'termmax-readonly-vault-gate/1.0'})
            last=None
            for i in range(5):
              try:
                with urllib.request.urlopen(r,timeout=timeout) as h: obj=json.loads(h.read().decode())
                raw.append({'method':method,'params':params,'response':obj})
                if 'error' in obj: raise RuntimeError(obj['error'])
                return obj['result']
              except Exception as e: last=e; time.sleep(min(2**i,10))
            raise last
          def words(x):
            if not x or x=='0x': return []
            s=x[2:]; return [s[i:i+64] for i in range(0,len(s),64)]
          def addr(x):
            s=x.lower().replace('0x',''); return '0x'+s[-40:]
          def u(x,i=0):
            w=words(x); return int(w[i],16) if len(w)>i else None
          def a(x,i=0):
            w=words(x); return addr(w[i]) if len(w)>i else None
          def st(x):
            if not x or x=='0x': return None
            b=bytes.fromhex(x[2:])
            try:
              off=int.from_bytes(b[:32],'big'); n=int.from_bytes(b[off:off+32],'big'); return b[off+32:off+32+n].decode(errors='replace').strip('\0')
            except Exception: return None
          def arg(selector,address): return selector+address.lower().replace('0x','').rjust(64,'0')
          latest=int(req('eth_blockNumber',[]),16); tag=hex(latest); block=req('eth_getBlockByNumber',[tag,False])
          def call(to,data):
            try: return req('eth_call',[{'to':to,'data':data},tag])
            except Exception as e: return {'error':repr(e)}
          def scan(t0):
            logs=[]; cur=start; span=250000; progress=[]
            while cur<=latest:
              end=min(cur+span-1,latest); f={'fromBlock':hex(cur),'toBlock':hex(end),'address':vault,'topics':[[t0]]}
              try:
                p=req('eth_getLogs',[f],90); logs+=p; progress.append({'from':cur,'to':end,'count':len(p),'span':span}); cur=end+1
                if len(p)<100 and span<1000000: span*=2
              except Exception as e:
                progress.append({'from':cur,'to':end,'span':span,'error':repr(e)})
                if span<=100: raise
                span=max(100,span//2)
            return logs,progress
          all_logs=[]; prog={}
          for k,t in topics.items():
            ls,pr=scan(t); all_logs+=ls; prog[k]=pr
          code=req('eth_getCode',[vault,tag]); body=code[2:].lower(); impl=None
          m=re.search(r'363d3d373d3d3d363d73([0-9a-f]{40})5af43d82803e903d91602b57fd5bf3',body)
          if m: impl='0x'+m.group(1)
          implcode=req('eth_getCode',[impl,tag]) if impl else code
          def cv(key,kind='u',argument=None):
            data=sel[key] if argument is None else arg(sel[key],argument); x=call(vault,data)
            if isinstance(x,dict): return x
            return {'u':u,'a':a,'s':st}[kind](x)
          asset=cv('asset','a'); decimals=None
          if isinstance(asset,str):
            x=call(asset,sel['decimals']); decimals=x if isinstance(x,dict) else u(x)
          new={}; redeemed={}; withdrawals=[]
          for l in all_logs:
            ts=l.get('topics',[]); t0=ts[0].lower(); dw=words(l.get('data'))
            if t0==topics['new'] and len(ts)>=4:
              o=addr(ts[3]); new[o.lower()]={'order':o,'marketEvent':addr(ts[2]),'block':int(l['blockNumber'],16),'tx':l['transactionHash']}
            elif t0==topics['redeem'] and len(ts)>=3:
              o=addr(ts[2]); redeemed[o.lower()]={'block':int(l['blockNumber'],16),'tx':l['transactionHash'],'badDebt':int(dw[0],16) if dw else None,'delivery':int(dw[1],16) if len(dw)>1 else None}
            elif t0==topics['withdraw'] and len(ts)>=4:
              withdrawals.append({'order':addr(ts[3]),'amount':int(dw[0],16) if dw else None,'shares':int(dw[1],16) if len(dw)>1 else None,'block':int(l['blockNumber'],16),'tx':l['transactionHash']})
          orders=[]
          for ob in new.values():
            order=ob['order']; mx=call(order,sel['market']); market=a(mx) if isinstance(mx,str) else ob['marketEvent']
            tx=call(market,sel['tokens']); tw=words(tx) if isinstance(tx,str) else []; toks=[addr(x) for x in tw[:5]] if len(tw)>=5 else [None]*5
            ft,xt,gt,collateral,debt=toks; cr=call(market,sel['config']); cw=words(cr) if isinstance(cr,str) else []; maturity=int(cw[1],16) if len(cw)>1 else None
            rr=call(order,sel['tokenReserves']); rw=words(rr) if isinstance(rr,str) else []
            bad=call(vault,arg(sel['badDebt'],collateral)) if collateral else None
            ftbal=call(ft,arg(sel['balanceOf'],order)) if ft else None
            orders.append({**ob,'market':market,'tokens':{'ft':ft,'xt':xt,'gt':gt,'collateral':collateral,'debt':debt},'maturity':maturity,'matured':maturity is not None and int(block['timestamp'],16)>=maturity,'ftReserve':int(rw[0],16) if rw else None,'xtReserve':int(rw[1],16) if len(rw)>1 else None,'ftBalance':u(ftbal) if isinstance(ftbal,str) else ftbal,'expiry':u(call(order,sel['expiry'])) if isinstance(call(order,sel['expiry']),str) else call(order,sel['expiry']),'badDebtForCollateral':u(bad) if isinstance(bad,str) else bad,'redeemed':redeemed.get(order.lower())})
          state={'label':label,'chain':os.environ['CHAIN'],'vault':vault,'snapshot':{'block':latest,'hash':block['hash'],'timestamp':int(block['timestamp'],16),'rpc':rpc},'name':cv('name','s'),'symbol':cv('symbol','s'),'asset':asset,'assetDecimals':decimals,'totalAssets':cv('totalAssets'),'totalSupply':cv('totalSupply'),'maxDeposit':cv('maxDeposit',argument=vault),'paused':cv('paused'),'apy':cv('apy'),'pool':cv('pool','a'),'codeBytes':(len(code)-2)//2,'cloneImplementation':impl,'implementationCodeBytes':(len(implcode)-2)//2,'supportsWithdrawFtsSelector':'94e854f2' in implcode.lower().replace('0x',''),'orderCount':len(orders),'activeOrderCount':sum(1 for o in orders if not o['redeemed']),'withdrawFtsEventCount':len(withdrawals),'redeemOrderEventCount':len(redeemed),'orders':orders,'withdrawFtsEvents':withdrawals}
          (out/'STATE.json').write_text(json.dumps(state,indent=2)); (out/'RPC_RAW.json').write_text(json.dumps(raw,indent=2)); (out/'PROGRESS.json').write_text(json.dumps(prog,indent=2)); print(json.dumps(state,indent=2))
          PY
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-known-v2-${{ matrix.label }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
