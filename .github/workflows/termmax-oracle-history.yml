name: termmax-oracle-history

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-oracle-history.yml'
      - 'termmax-oracle-history-trigger.txt'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture public source history
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax
          cd termmax
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d
          mkdir -p "$GITHUB_WORKSPACE/evidence-oracle-history"
          git log --all --date=iso-strict --format='%H %ad %an %s' -- contracts/v2/oracle/OracleAggregatorV2.sol \
            > "$GITHUB_WORKSPACE/evidence-oracle-history/FILE_HISTORY.txt"
          git log --all -p -S 'answer > 0' -- contracts/v2/oracle/OracleAggregatorV2.sol \
            > "$GITHUB_WORKSPACE/evidence-oracle-history/ANSWER_GT_ZERO_HISTORY.patch"
          git log --all -p -S '_checkAnswer' -- contracts/v2/oracle/OracleAggregatorV2.sol \
            > "$GITHUB_WORKSPACE/evidence-oracle-history/CHECK_ANSWER_HISTORY.patch"
          git log --all -p -G 'answer < 0|answer <= 0|answer > 0' -- contracts/v2/oracle/OracleAggregatorV2.sol \
            > "$GITHUB_WORKSPACE/evidence-oracle-history/ANSWER_COMPARISON_HISTORY.patch"
          git blame -L 198,245 e314f3f849577dfecd4614f148c4df81fdf8c72d -- contracts/v2/oracle/OracleAggregatorV2.sol \
            > "$GITHUB_WORKSPACE/evidence-oracle-history/CURRENT_BLAME.txt"
          git show e314f3f849577dfecd4614f148c4df81fdf8c72d:contracts/v2/oracle/OracleAggregatorV2.sol \
            > "$GITHUB_WORKSPACE/evidence-oracle-history/CURRENT_SOURCE.sol"
          sha256sum "$GITHUB_WORKSPACE"/evidence-oracle-history/* | sort \
            > "$GITHUB_WORKSPACE/evidence-oracle-history/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-oracle-history
          path: evidence-oracle-history/
          if-no-files-found: error
          retention-days: 3
