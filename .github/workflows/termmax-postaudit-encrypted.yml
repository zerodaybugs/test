name: termmax-postaudit-encrypted

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-postaudit-encrypted.yml'
      - 'security/termmax_postaudit_scan.js'
      - 'security/termmax_postaudit_public.pem'
      - 'security/termmax-postaudit-trigger.txt'

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ethereum
            rpcs: 'https://ethereum-rpc.publicnode.com,https://eth.llamarpc.com,https://eth.drpc.org,https://1rpc.io/eth'
            factories: '0xF2BDa87CA467eB90A1b68f824cB136baA68a8177:23430000,0x5b8B26a6734B5eABDBe6C5A19580Ab2D0424f027:23430000,0xc1E9640F04B802Bbf0B02a4e9Fe394039AbE8B59:24883366'
          - label: b2
            rpcs: 'https://rpc.bsquared.network,https://223.rpc.thirdweb.com'
            factories: '0x5BA2d33fB50d08D7755787E729183FedD6a3F3e7:31535305'
          - label: berachain
            rpcs: 'https://rpc.berachain.com'
            factories: '0x2A15CC106bCa1Ee17a411d77A9C53eC3509d47C2:19609794'
          - label: pharos
            rpcs: 'https://rpc.pharos.xyz'
            factories: '0xEDC206E67eAc5C949c0a90A02E29B4b2791c8395:5278169'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scan-deps
          mkdir scan-deps
          cd scan-deps
          npm init -y
          npm install --no-audit --no-fund ethers@5.7.2
      - name: Execute read-only scan
        env:
          LABEL: ${{ matrix.label }}
          RPCS: ${{ matrix.rpcs }}
          FACTORIES: ${{ matrix.factories }}
        shell: bash
        run: |
          set -o pipefail
          rm -rf "termmax-postaudit-${LABEL}" "encrypted-${LABEL}"
          mkdir -p "termmax-postaudit-${LABEL}" "encrypted-${LABEL}"
          export NODE_PATH="$GITHUB_WORKSPACE/scan-deps/node_modules"
          node security/termmax_postaudit_scan.js > "termmax-postaudit-${LABEL}/EXECUTION.stdout" 2> "termmax-postaudit-${LABEL}/EXECUTION.stderr"
          status=$?
          find "termmax-postaudit-${LABEL}" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "termmax-postaudit-${LABEL}/SHA256SUMS.txt"
          tar -czf "${LABEL}.tar.gz" "termmax-postaudit-${LABEL}"
          exit "$status"
      - name: Encrypt evidence
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "encrypted-${LABEL}"
          if [ ! -f "${LABEL}.tar.gz" ]; then
            tar -czf "${LABEL}.tar.gz" "termmax-postaudit-${LABEL}" || true
          fi
          ENC_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s:%s:%s' "$ENC_KEY" "$MAC_KEY" "$IV" > key-material.txt
          openssl enc -aes-256-cbc -K "$ENC_KEY" -iv "$IV" -in "${LABEL}.tar.gz" -out "encrypted-${LABEL}/evidence.enc"
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$MAC_KEY" "encrypted-${LABEL}/evidence.enc" | awk '{print $2}' > "encrypted-${LABEL}/evidence.hmac"
          openssl pkeyutl -encrypt -pubin -inkey security/termmax_postaudit_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key-material.txt -out "encrypted-${LABEL}/key-material.enc"
          sha256sum "encrypted-${LABEL}"/* > "encrypted-${LABEL}/CIPHERTEXT_SHA256SUMS.txt"
          printf '%s\n' 'RSA-OAEP-SHA256 + AES-256-CBC + HMAC-SHA256' > "encrypted-${LABEL}/FORMAT.txt"
          rm -rf "termmax-postaudit-${LABEL}" "${LABEL}.tar.gz" key-material.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termmax-postaudit-encrypted-${{ matrix.label }}
          path: encrypted-${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 3
