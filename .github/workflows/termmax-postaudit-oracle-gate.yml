name: termmax-postaudit-oracle-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-postaudit-oracle-gate-trigger.txt'

permissions:
  contents: write

jobs:
  oracle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fetch source and tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y ripgrep jq
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax
          cd termmax && git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d && forge soldeer install || true && cd ..
          rm -rf termmax-oracle-result && mkdir termmax-oracle-result

      - name: Capture exact post-audit oracle delta
        shell: bash
        run: |
          set -euxo pipefail
          cp termmax/contracts/v2/oracle/adapters/xaue/TermMaxXauePricefeedAdapter.sol termmax-oracle-result/
          cp termmax/contracts/v2/oracle/adapters/pharos/TermMaxPharosPriceFeedAdapter.sol termmax-oracle-result/
          cp termmax/contracts/v2/oracle/adapters/pharos/IPharosOracle.sol termmax-oracle-result/
          git -C termmax diff --unified=100 64bd47b98e064c7fb91ab4a59b70520e0ec285d5..e314f3f849577dfecd4614f148c4df81fdf8c72d -- contracts/v2/oracle > termmax-oracle-result/POST_AUDIT_ORACLE_DIFF.patch
          rg -n -C 10 'latestRoundData|getPrice|decimals|answer|timestamp|updatedAt|uint256\(|int256\(|10 \*\*|mulDiv|heartbeat|stale' termmax/contracts/v2/oracle/adapters/xaue termmax/contracts/v2/oracle/adapters/pharos > termmax-oracle-result/PRICE_PATHS.txt || true

      - name: Static risk classification
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('termmax-oracle-result')
          rows=[]
          for p in root.glob('*.sol'):
              s=p.read_text(errors='ignore')
              risks=[]
              if re.search(r'uint(?:128|256)?\s*\(\s*answer\s*\)',s) and not re.search(r'answer\s*>\s*0|answer\s*<=\s*0|Invalid.*Price',s,re.I): risks.append('signed answer cast without explicit positivity check')
              if 'latestRoundData' in s and 'updatedAt' not in s and 'heartbeat' not in s: risks.append('latestRoundData consumed without local freshness check')
              if re.search(r'/\s*10\s*\*\*|\*\s*10\s*\*\*',s): risks.append('explicit decimal rescaling requires fuzz verification')
              if 'decimals()' in s and re.search(r'return\s+8|return\s+18',s): risks.append('hard-coded output decimals')
              rows.append({'file':p.name,'risks':risks,'source':s})
          (root/'STATIC_RISK.json').write_text(json.dumps([{k:v for k,v in x.items() if k!='source'} for x in rows],indent=2))
          md=['# Post-audit oracle static gate','']
          for x in rows:
              md += [f"## {x['file']}",''] + ([f"- {r}" for r in x['risks']] if x['risks'] else ['- No simple high-risk pattern detected']) + ['']
          (root/'STATIC_RISK.md').write_text('\n'.join(md))
          PY

      - name: Run official adapter tests
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.foundry/bin:$PATH"
          cd termmax
          forge test --match-path 'test/v2/integration/ForkXauePriceFeedAdapter.t.sol' -vvvv > ../termmax-oracle-result/XAUE_TEST.log 2>&1
          echo $? > ../termmax-oracle-result/XAUE_TEST.exit
          forge test --match-path 'test/v2/integration/ForkPharosPriceFeedAdapter.t.sol' -vvvv > ../termmax-oracle-result/PHAROS_TEST.log 2>&1
          echo $? > ../termmax-oracle-result/PHAROS_TEST.exit
          cd ..
          exit 0

      - name: Deployment and audit dedup scan
        shell: bash
        run: |
          set -euxo pipefail
          rg -n -i -C 5 'xaue|pharos|pricefeed|oracle' termmax/deployments termmax/script > termmax-oracle-result/DEPLOYMENT_HITS.txt || true
          git clone https://github.com/term-structure/audits.git audits
          find audits -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' f; do pdftotext -layout "$f" - 2>/dev/null; done | rg -ni -C 5 'xaue|pharos|price feed|oracle|negative price|stale|decimal' > termmax-oracle-result/AUDIT_DEDUP_HITS.txt || true
          sha256sum termmax-oracle-result/* | sort > termmax-oracle-result/SHA256SUMS.txt

      - name: Persist and upload
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name termmax-research-bot
          git config user.email actions@users.noreply.github.com
          git add termmax-oracle-result
          git commit -m 'Persist TermMax post-audit oracle gate result' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: termmax-postaudit-oracle-gate-result
          path: termmax-oracle-result/
          retention-days: 7
