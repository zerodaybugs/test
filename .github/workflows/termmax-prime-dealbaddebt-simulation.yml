name: TermMax Prime Yield dealBadDebt read-only simulation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-prime-dealbaddebt-simulation.yml'
      - 'infra/termmax_prime_dealbaddebt_simulation.py'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Simulate live bucket with eth_call
        shell: bash
        run: |
          set +e
          rm -rf termmax-prime-dealbaddebt-simulation
          python3 infra/termmax_prime_dealbaddebt_simulation.py > dealbaddebt.stdout 2> dealbaddebt.stderr
          rc=$?
          echo "$rc" > dealbaddebt.exit
          mkdir -p termmax-prime-dealbaddebt-simulation
          cp dealbaddebt.stdout dealbaddebt.stderr dealbaddebt.exit termmax-prime-dealbaddebt-simulation/
          find termmax-prime-dealbaddebt-simulation -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > termmax-prime-dealbaddebt-simulation/SHA256SUMS
          zip -qr TERMMAX_PRIME_DEALBADDEBT_SIMULATION.zip termmax-prime-dealbaddebt-simulation
          sha256sum TERMMAX_PRIME_DEALBADDEBT_SIMULATION.zip > TERMMAX_PRIME_DEALBADDEBT_SIMULATION.zip.sha256
          exit 0
      - name: Upload evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-prime-dealbaddebt-simulation
          path: |
            TERMMAX_PRIME_DEALBADDEBT_SIMULATION.zip
            TERMMAX_PRIME_DEALBADDEBT_SIMULATION.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Enforce simulation gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dealbaddebt.exit)" = '0'
          grep -F '"status": "PASS"' dealbaddebt.stdout
