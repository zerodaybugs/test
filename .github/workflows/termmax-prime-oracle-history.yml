name: TermMax Prime Yield oracle history read-only scan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-prime-oracle-history.yml'
      - 'infra/termmax_prime_oracle_history.py'

permissions:
  contents: read

jobs:
  scan-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan OracleAggregator configuration history
        shell: bash
        run: |
          set +e
          rm -rf termmax-prime-oracle-history
          python3 infra/termmax_prime_oracle_history.py > prime-oracle-history.stdout 2> prime-oracle-history.stderr
          rc=$?
          echo "$rc" > prime-oracle-history.exit
          mkdir -p termmax-prime-oracle-history
          cp prime-oracle-history.stdout prime-oracle-history.stderr prime-oracle-history.exit termmax-prime-oracle-history/
          find termmax-prime-oracle-history -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > termmax-prime-oracle-history/SHA256SUMS
          zip -qr TERMMAX_PRIME_ORACLE_HISTORY.zip termmax-prime-oracle-history
          sha256sum TERMMAX_PRIME_ORACLE_HISTORY.zip > TERMMAX_PRIME_ORACLE_HISTORY.zip.sha256
          exit 0
      - name: Upload evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-prime-oracle-history
          path: |
            TERMMAX_PRIME_ORACLE_HISTORY.zip
            TERMMAX_PRIME_ORACLE_HISTORY.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Enforce history gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat prime-oracle-history.exit)" = '0'
          grep -F '"status": "PASS"' prime-oracle-history.stdout
