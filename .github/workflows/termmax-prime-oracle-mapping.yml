name: TermMax Prime Yield oracle mapping read-only diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-prime-oracle-mapping.yml'
      - 'infra/termmax_prime_oracle_mapping.py'

permissions:
  contents: read

jobs:
  inspect-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute OracleAggregator mapping diagnostics
        shell: bash
        run: |
          set +e
          rm -rf termmax-prime-oracle-mapping
          python3 infra/termmax_prime_oracle_mapping.py > prime-oracle.stdout 2> prime-oracle.stderr
          rc=$?
          echo "$rc" > prime-oracle.exit
          mkdir -p termmax-prime-oracle-mapping
          cp prime-oracle.stdout prime-oracle.stderr prime-oracle.exit termmax-prime-oracle-mapping/
          find termmax-prime-oracle-mapping -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > termmax-prime-oracle-mapping/SHA256SUMS
          zip -qr TERMMAX_PRIME_ORACLE_MAPPING.zip termmax-prime-oracle-mapping
          sha256sum TERMMAX_PRIME_ORACLE_MAPPING.zip > TERMMAX_PRIME_ORACLE_MAPPING.zip.sha256
          exit 0
      - name: Upload evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-prime-oracle-mapping
          path: |
            TERMMAX_PRIME_ORACLE_MAPPING.zip
            TERMMAX_PRIME_ORACLE_MAPPING.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Enforce diagnostics gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat prime-oracle.exit)" = '0'
          grep -F '"status": "PASS"' prime-oracle.stdout
