name: TermMax Prime Yield recovery bucket read-only valuation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-prime-yield-bucket-value.yml'
      - 'infra/termmax_prime_yield_bucket_value.py'

permissions:
  contents: read

jobs:
  value-bucket:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute protocol-oracle read-only valuation
        shell: bash
        run: |
          set +e
          rm -rf termmax-prime-yield-bucket
          python3 infra/termmax_prime_yield_bucket_value.py > prime-bucket.stdout 2> prime-bucket.stderr
          rc=$?
          echo "$rc" > prime-bucket.exit
          mkdir -p termmax-prime-yield-bucket
          cp prime-bucket.stdout prime-bucket.stderr prime-bucket.exit termmax-prime-yield-bucket/
          find termmax-prime-yield-bucket -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > termmax-prime-yield-bucket/SHA256SUMS
          zip -qr TERMMAX_PRIME_YIELD_BUCKET_VALUE.zip termmax-prime-yield-bucket
          sha256sum TERMMAX_PRIME_YIELD_BUCKET_VALUE.zip > TERMMAX_PRIME_YIELD_BUCKET_VALUE.zip.sha256
          exit 0
      - name: Upload evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-prime-yield-bucket-value
          path: |
            TERMMAX_PRIME_YIELD_BUCKET_VALUE.zip
            TERMMAX_PRIME_YIELD_BUCKET_VALUE.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Enforce valuation verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat prime-bucket.exit)" = '0'
          grep -F '"status": "PASS"' prime-bucket.stdout
