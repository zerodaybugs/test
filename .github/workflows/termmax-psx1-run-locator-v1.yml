name: TermMax PSX1 run locator v1

on:
  push:
    branches:
      - runner/termmax-psx1-push-v3-20260804
    paths:
      - '.trigger/termmax-psx1-locator-v1.txt'

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Locate latest PSX1 replay run and publish public run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .tooling/termmax-psx1-push-v3
          run_id=''
          for _ in $(seq 1 60); do
            json="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/actions/workflows/termmax-psx1-encrypted-push-v3.yml/runs?branch=${BRANCH}&event=push&per_page=5")"
            run_id="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((str(x["id"]) for x in d.get("workflow_runs",[]) if x.get("status") in {"queued","in_progress","completed"}), ""))' <<<"$json")"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" > .tooling/termmax-psx1-push-v3/RUN_ID.txt
          git config user.name 'zerodaybugs-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add .tooling/termmax-psx1-push-v3/RUN_ID.txt
          git commit -m "research: publish TermMax PSX1 run ${run_id}" || exit 0
          git push origin HEAD:${BRANCH}
