name: Capture public TermMax API schema

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-public-api-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Capture read-only public API responses
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/termmax-api"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json, pathlib, ssl, urllib.error, urllib.request

          out = pathlib.Path('termmax-api')
          bases = [
              'https://api.termmax.ts.finance',
              'https://api-v2.termmax.ts.finance',
          ]
          paths = [
              '/', '/health', '/openapi.json', '/swagger.json', '/api-json',
              '/docs', '/docs-json', '/redoc',
              '/v2/market/list-with-collection?chainId=1&includeInactive=false&version=v2',
              '/market/config/general?chainId=1',
          ]
          manifest = []
          ctx = ssl.create_default_context()
          for bi, base in enumerate(bases, 1):
              for pi, path in enumerate(paths, 1):
                  url = base + path
                  req = urllib.request.Request(url, headers={'User-Agent': 'TermMax-public-compatibility-snapshot/1.0', 'Accept': '*/*'})
                  status = None; headers = {}; body = b''; error = None
                  try:
                      with urllib.request.urlopen(req, timeout=30, context=ctx) as resp:
                          status = resp.status
                          headers = dict(resp.headers.items())
                          body = resp.read(20_000_000)
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                      headers = dict(exc.headers.items()) if exc.headers else {}
                      body = exc.read(20_000_000)
                  except Exception as exc:
                      error = repr(exc)
                  stem = f'b{bi:02d}_p{pi:02d}'
                  (out / f'{stem}.body').write_bytes(body)
                  (out / f'{stem}.meta.json').write_text(json.dumps({
                      'base_index': bi, 'path_index': pi, 'base': base, 'path': path,
                      'status': status, 'headers': headers, 'error': error, 'body_bytes': len(body)
                  }, indent=2) + '\n')
                  manifest.append({'stem': stem, 'base': base, 'path': path, 'status': status, 'body_bytes': len(body), 'error': error})
          (out / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          cd "$OUT"
          sha256sum * > SHA256SUMS.txt

      - name: Upload public API snapshot
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-api-${{ github.run_id }}
          path: termmax-api/
          if-no-files-found: error
          retention-days: 3
