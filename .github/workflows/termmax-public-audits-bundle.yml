name: Bundle public TermMax audit reports

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-public-audits-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch official public audit reports and extract text
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/termmax-audits"
          git clone --depth 1 https://github.com/term-structure/audits.git "$ROOT/repo"
          mkdir -p "$ROOT/pdf" "$ROOT/text"
          cp "$ROOT"/repo/TermMax/*.pdf "$ROOT/pdf/"
          command -v pdftotext
          for pdf in "$ROOT"/pdf/*.pdf; do
            name="$(basename "$pdf" .pdf)"
            pdftotext -layout "$pdf" "$ROOT/text/${name}.txt"
            pdfinfo "$pdf" > "$ROOT/text/${name}.pdfinfo.txt"
          done
          {
            echo 'source_repository=https://github.com/term-structure/audits'
            echo "source_commit=$(git -C "$ROOT/repo" rev-parse HEAD)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'security_material=public_audit_reports_only'
          } > "$ROOT/PROVENANCE.txt"
          find "$ROOT/pdf" "$ROOT/text" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
          rm -rf "$ROOT/repo"

      - name: Upload public audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-audits-${{ github.run_id }}
          path: termmax-audits/
          if-no-files-found: error
          retention-days: 3
