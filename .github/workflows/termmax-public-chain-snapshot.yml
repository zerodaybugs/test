name: Capture public TermMax Ethereum runtime snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-public-chain-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Capture read-only Ethereum state
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/snapshot"
          ROUTER='0x324596C1682a5675008f6e58F9C4E0A894b079c7'
          IMPLEMENTATION_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          INITIALIZABLE_SLOT='0xf0c57e16840df040f15088dc2f81fe391c3923bec73e23a9662efc9c229c6a00'
          REENTRANCY_SLOT='0x9b779b17422d0df92223018b32b4d1fa46e071723d6817e2486d003becc55f00'
          PAUSABLE_SLOT='0xcd5ed15c6e187e77e9aee88184c21f4f2182ab5827cb3b7e07fbedcd63f03300'
          OWNABLE_SLOT='0x9016d09d72d40fdae2fd8ceac6b6234c7706214fd39c1cd1e609a0528c199300'
          mkdir -p "$OUT"

          RPC=''
          for candidate in \
            https://ethereum-rpc.publicnode.com \
            https://eth.llamarpc.com \
            https://rpc.flashbots.net \
            https://1rpc.io/eth
          do
            if [ "$(cast chain-id --rpc-url "$candidate" 2>/dev/null || true)" = '1' ]; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"

          BLOCK="$(cast block-number --rpc-url "$RPC")"
          BLOCK_JSON="$(cast block "$BLOCK" --json --rpc-url "$RPC")"
          IMPLEMENTATION_STORAGE="$(cast storage "$ROUTER" "$IMPLEMENTATION_SLOT" --block "$BLOCK" --rpc-url "$RPC")"
          IMPLEMENTATION="0x${IMPLEMENTATION_STORAGE: -40}"
          INITIALIZABLE_STORAGE="$(cast storage "$ROUTER" "$INITIALIZABLE_SLOT" --block "$BLOCK" --rpc-url "$RPC")"
          REENTRANCY_STORAGE="$(cast storage "$ROUTER" "$REENTRANCY_SLOT" --block "$BLOCK" --rpc-url "$RPC")"
          PAUSABLE_STORAGE="$(cast storage "$ROUTER" "$PAUSABLE_SLOT" --block "$BLOCK" --rpc-url "$RPC")"
          OWNABLE_STORAGE="$(cast storage "$ROUTER" "$OWNABLE_SLOT" --block "$BLOCK" --rpc-url "$RPC")"
          PROXY_CODE="$(cast code "$ROUTER" --block "$BLOCK" --rpc-url "$RPC")"
          IMPLEMENTATION_CODE="$(cast code "$IMPLEMENTATION" --block "$BLOCK" --rpc-url "$RPC")"
          PAUSED="$(cast call "$ROUTER" 'paused()(bool)' --block "$BLOCK" --rpc-url "$RPC")"
          OWNER="$(cast call "$ROUTER" 'owner()(address)' --block "$BLOCK" --rpc-url "$RPC" || true)"

          test "$PROXY_CODE" != '0x'
          test "$IMPLEMENTATION_CODE" != '0x'

          printf '%s\n' "$PROXY_CODE" > "$OUT/proxy_runtime.hex"
          printf '%s\n' "$IMPLEMENTATION_CODE" > "$OUT/implementation_runtime.hex"
          printf '%s\n' "$BLOCK_JSON" > "$OUT/block.json"

          PROXY_HASH="$(cast keccak "$PROXY_CODE")"
          IMPLEMENTATION_HASH="$(cast keccak "$IMPLEMENTATION_CODE")"
          PROXY_BYTES=$(( (${#PROXY_CODE} - 2) / 2 ))
          IMPLEMENTATION_BYTES=$(( (${#IMPLEMENTATION_CODE} - 2) / 2 ))

          python3 - "$OUT" "$BLOCK" "$ROUTER" \
            "$IMPLEMENTATION_SLOT" "$IMPLEMENTATION_STORAGE" "$IMPLEMENTATION" \
            "$INITIALIZABLE_SLOT" "$INITIALIZABLE_STORAGE" \
            "$REENTRANCY_SLOT" "$REENTRANCY_STORAGE" \
            "$PAUSABLE_SLOT" "$PAUSABLE_STORAGE" \
            "$OWNABLE_SLOT" "$OWNABLE_STORAGE" \
            "$PROXY_HASH" "$IMPLEMENTATION_HASH" "$PROXY_BYTES" "$IMPLEMENTATION_BYTES" "$PAUSED" "$OWNER" <<'PY'
          import json, pathlib, sys
          (out, block, router,
           implementation_slot, implementation_storage, implementation,
           initializable_slot, initializable_storage,
           reentrancy_slot, reentrancy_storage,
           pausable_slot, pausable_storage,
           ownable_slot, ownable_storage,
           proxy_hash, implementation_hash, proxy_bytes,
           implementation_bytes, paused, owner) = sys.argv[1:]
          block_data = json.loads(pathlib.Path(out, 'block.json').read_text())
          result = {
              'chain_id': 1,
              'block_number': int(block),
              'block_hash': block_data.get('hash'),
              'block_timestamp': block_data.get('timestamp'),
              'router_proxy': router,
              'implementation_slot': implementation_slot,
              'implementation_storage': implementation_storage,
              'implementation': implementation,
              'initializable_slot': initializable_slot,
              'initializable_storage': initializable_storage,
              'reentrancy_slot': reentrancy_slot,
              'reentrancy_storage': reentrancy_storage,
              'pausable_slot': pausable_slot,
              'pausable_storage': pausable_storage,
              'ownable_slot': ownable_slot,
              'ownable_storage': ownable_storage,
              'proxy_runtime_keccak256': proxy_hash,
              'implementation_runtime_keccak256': implementation_hash,
              'proxy_runtime_bytes': int(proxy_bytes),
              'implementation_runtime_bytes': int(implementation_bytes),
              'paused': paused.lower() == 'true',
              'owner': owner,
              'rpc': 'read-only public Ethereum endpoint; URL intentionally omitted',
              'transactions_broadcast': 0,
          }
          pathlib.Path(out, 'CHAIN_SNAPSHOT.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

          {
            forge --version
            cast --version
          } > "$OUT/toolchain.txt"
          cd "$OUT"
          sha256sum CHAIN_SNAPSHOT.json block.json proxy_runtime.hex implementation_runtime.hex toolchain.txt > SHA256SUMS.txt
          cat CHAIN_SNAPSHOT.json

      - name: Upload public runtime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-runtime-${{ github.run_id }}
          path: snapshot/
          if-no-files-found: error
          retention-days: 3
