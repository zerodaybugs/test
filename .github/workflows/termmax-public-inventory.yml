name: termmax-public-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-public-inventory.yml'
      - 'scripts/termmax_public_inventory.py'
      - 'termmax-public-inventory-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run read-only Ethereum inventory
        shell: bash
        env:
          OUT_DIR: termmax-public-inventory
          START_BLOCK: '22000000'
          RPC_CANDIDATES: 'https://eth.llamarpc.com https://eth.drpc.org https://1rpc.io/eth https://ethereum.publicnode.com'
        run: |
          mkdir -p termmax-public-inventory
          set +e
          python3 scripts/termmax_public_inventory.py 2>&1 | tee termmax-public-inventory/EXECUTION.log
          status=${PIPESTATUS[0]}
          echo "$status" > termmax-public-inventory/EXIT_STATUS.txt
          sha256sum termmax-public-inventory/* | sort > termmax-public-inventory/SHA256SUMS.txt
          exit 0

      - name: Upload public inventory
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-inventory
          path: termmax-public-inventory/
          if-no-files-found: error
          retention-days: 3
