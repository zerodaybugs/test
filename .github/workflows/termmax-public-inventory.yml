name: termmax-public-inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-public-inventory.yml'
      - 'scripts/termmax_public_inventory.py'
      - 'termmax-public-inventory-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run read-only Ethereum inventory
        shell: bash
        env:
          OUT_DIR: termmax-public-inventory
          START_BLOCK: '22000000'
        run: |
          set -euxo pipefail
          python3 scripts/termmax_public_inventory.py | tee termmax-public-inventory/EXECUTION.log
          sha256sum termmax-public-inventory/* | sort > termmax-public-inventory/SHA256SUMS.txt

      - name: Upload public inventory
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-inventory
          path: termmax-public-inventory/
          if-no-files-found: error
          retention-days: 3
