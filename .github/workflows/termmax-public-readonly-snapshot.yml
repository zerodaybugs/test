name: TermMax multi-chain public read-only state snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-public-readonly-snapshot.yml'
      - 'infra/termmax_multivault_readonly.py'
      - 'infra/termmax-readonly-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute multi-chain read-only public-chain inventory
        shell: bash
        run: |
          set +e
          rm -rf termmax-multivault-readonly
          python3 infra/termmax_multivault_readonly.py \
            > termmax-multivault.stdout 2> termmax-multivault.stderr
          rc=$?
          echo "$rc" > termmax-multivault.exit
          mkdir -p termmax-multivault-readonly
          cp termmax-multivault.stdout termmax-multivault.stderr termmax-multivault.exit \
            termmax-multivault-readonly/
          find termmax-multivault-readonly -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > termmax-multivault-readonly/SHA256SUMS
          zip -qr TERMMAX_MULTIVAULT_READONLY_SNAPSHOT.zip termmax-multivault-readonly
          sha256sum TERMMAX_MULTIVAULT_READONLY_SNAPSHOT.zip \
            > TERMMAX_MULTIVAULT_READONLY_SNAPSHOT.zip.sha256
          exit 0

      - name: Upload read-only evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-multivault-readonly-snapshot
          path: |
            TERMMAX_MULTIVAULT_READONLY_SNAPSHOT.zip
            TERMMAX_MULTIVAULT_READONLY_SNAPSHOT.zip.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Enforce read-only snapshot verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat termmax-multivault.exit)" = '0'
          grep -F '"status": "PASS"' termmax-multivault.stdout
