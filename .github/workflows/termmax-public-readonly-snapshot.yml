name: TermMax public read-only state snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-public-readonly-snapshot.yml'
      - 'infra/termmax_public_readonly_snapshot_v2.py'
      - 'infra/termmax-readonly-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute failover read-only public-chain inventory
        shell: bash
        run: |
          set +e
          rm -rf termmax-public-readonly
          python3 infra/termmax_public_readonly_snapshot_v2.py \
            > termmax-readonly.stdout 2> termmax-readonly.stderr
          rc=$?
          echo "$rc" > termmax-readonly.exit
          mkdir -p termmax-public-readonly
          cp termmax-readonly.stdout termmax-readonly.stderr termmax-readonly.exit \
            termmax-public-readonly/
          find termmax-public-readonly -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > termmax-public-readonly/SHA256SUMS
          zip -qr TERMMAX_PUBLIC_READONLY_SNAPSHOT.zip termmax-public-readonly
          sha256sum TERMMAX_PUBLIC_READONLY_SNAPSHOT.zip \
            > TERMMAX_PUBLIC_READONLY_SNAPSHOT.zip.sha256
          exit 0

      - name: Upload read-only evidence before verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-readonly-snapshot
          path: |
            TERMMAX_PUBLIC_READONLY_SNAPSHOT.zip
            TERMMAX_PUBLIC_READONLY_SNAPSHOT.zip.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Enforce read-only snapshot verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat termmax-readonly.exit)" = '0'
          grep -F '"status": "PASS"' termmax-readonly.stdout
