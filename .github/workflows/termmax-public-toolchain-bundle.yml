name: Build public TermMax toolchain bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/termmax-public-toolchain-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Runner health
        shell: bash
        run: |
          set -euo pipefail
          printf 'PUBLIC_RUNNER_HEALTH_PASS\n'
          uname -a
          git --version

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Clone and hydrate public TermMax source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/bundle"
          REPO="$ROOT/termmax-contract-v2"
          PIN='e314f3f849577dfecd4614f148c4df81fdf8c72d'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/bin" "$ROOT/logs"

          git clone --recursive https://github.com/term-structure/termmax-contract-v2.git "$REPO" \
            > "$ROOT/logs/clone.log" 2>&1
          git -C "$REPO" checkout --detach "$PIN" >> "$ROOT/logs/clone.log" 2>&1
          git -C "$REPO" submodule update --init --recursive >> "$ROOT/logs/clone.log" 2>&1
          test "$(git -C "$REPO" rev-parse HEAD)" = "$PIN"

          {
            forge --version
            cast --version
            anvil --version
            echo "source_commit=$(git -C "$REPO" rev-parse HEAD)"
          } > "$ROOT/PROVENANCE.txt"

          cp "$(command -v forge)" "$ROOT/bin/forge"
          cp "$(command -v cast)" "$ROOT/bin/cast"
          cp "$(command -v anvil)" "$ROOT/bin/anvil"
          command -v chisel >/dev/null 2>&1 && cp "$(command -v chisel)" "$ROOT/bin/chisel" || true

          cd "$REPO"
          set +e
          forge soldeer install > "$ROOT/logs/soldeer-install.log" 2>&1
          soldeer_rc=$?
          set -e
          echo "soldeer_rc=$soldeer_rc" >> "$ROOT/PROVENANCE.txt"

          # Compile the public upstream Router test to force the relevant source and compiler into cache.
          set +e
          forge test --use 0.8.30 --optimizer-runs 200 --via-ir \
            --match-contract RouterTestV2 \
            --match-test testSwap_WithV1OrderWithoutPool \
            -vvv > "$ROOT/logs/upstream-router-test.log" 2>&1
          test_rc=$?
          set -e
          echo "upstream_router_test_rc=$test_rc" >> "$ROOT/PROVENANCE.txt"

          # Retain the exact compiler selected/downloaded by svm when present.
          find "$HOME/.svm" -type f -name 'solc-0.8.30' -exec cp -f '{}' "$ROOT/bin/solc-0.8.30" ';' 2>/dev/null || true
          find "$HOME/.svm" -type f -name 'solc-0.8.30*' -printf '%p\n' > "$ROOT/logs/solc-files.txt" 2>/dev/null || true

          chmod 0755 "$ROOT"/bin/*
          sha256sum "$ROOT"/bin/* > "$ROOT/BINARY_SHA256SUMS.txt"
          find "$REPO/dependencies" -maxdepth 2 -type d -printf '%P\n' 2>/dev/null | sort > "$ROOT/DEPENDENCY_DIRS.txt" || true

          test -x "$ROOT/bin/forge"
          test -x "$ROOT/bin/cast"
          test -x "$ROOT/bin/anvil"
          test -d "$REPO/contracts"
          test -f "$REPO/contracts/v2/router/TermMaxRouterV2.sol"
          test -f "$REPO/test/v2/RouterV2.t.sol"

      - name: Build checksums
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload public toolchain/source bundle
        uses: actions/upload-artifact@v4
        with:
          name: termmax-public-toolchain-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 3
