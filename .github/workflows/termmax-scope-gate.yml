name: termmax-scope-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-scope-gate-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture current repository and bounty scope
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax-current
          cd termmax-current
          git rev-parse HEAD > ../evidence/CURRENT_MAIN_SHA.txt
          git log -30 --date=iso --pretty=format:'%H%x09%ad%x09%s' > ../evidence/CURRENT_MAIN_LOG.tsv
          if test -f contracts/v2/router/TermMaxRouterV2_02.sol; then
            echo PRESENT > ../evidence/ROUTER_V2_02_STATUS.txt
            cp contracts/v2/router/TermMaxRouterV2_02.sol ../evidence/
          else
            echo ABSENT > ../evidence/ROUTER_V2_02_STATUS.txt
          fi
          find deployments -type f -name '*.json' -print0 | xargs -0 rg -n -i 'routerV2_02|flashRollover|routerV2' > ../evidence/DEPLOYMENT_ROUTER_HITS.txt || true
          git branch -a > ../evidence/BRANCHES.txt
          cd ..
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://immunefi.com/bug-bounty/termstructurelabs/scope/' -o evidence/IMMUNEFI_SCOPE.html || true
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://immunefi.com/bug-bounty/termstructurelabs/information/' -o evidence/IMMUNEFI_INFORMATION.html || true
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          for n in ('IMMUNEFI_SCOPE','IMMUNEFI_INFORMATION'):
              p=Path('evidence/'+n+'.html')
              if p.exists():
                  s=p.read_text(errors='ignore')
                  s=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.S|re.I)
                  s=re.sub(r'<[^>]+>',' ',s)
                  s=html.unescape(re.sub(r'\s+',' ',s))
                  Path('evidence/'+n+'.txt').write_text(s)
          PY
          rg -ni -C 4 'commit|github|asset|v2_02|router|updated|scope' evidence/IMMUNEFI_*.txt > evidence/SCOPE_KEY_HITS.txt || true
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-scope-gate-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
