name: termmax-source-snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-live-gate-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax-source
          cd termmax-source
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d
          git rev-parse HEAD > PINNED_COMMIT.txt
          rm -rf .git broadcast cache out dependencies
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: termmax-source-e314f3f
          path: termmax-source/
          retention-days: 7
