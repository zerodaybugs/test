name: termmax-targeted-vault-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/termmax-targeted-vault-gate.yml'
      - 'scripts/termmax_targeted_vault_gate.py'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Execute targeted read-only gate
        shell: bash
        env:
          OUT_DIR: termmax-targeted-vault-gate
          START_BLOCK: '22000000'
        run: |
          mkdir -p termmax-targeted-vault-gate
          set +e
          python3 scripts/termmax_targeted_vault_gate.py 2>&1 | tee termmax-targeted-vault-gate/EXECUTION.log
          status=${PIPESTATUS[0]}
          echo "$status" > termmax-targeted-vault-gate/EXIT_STATUS.txt
          sha256sum termmax-targeted-vault-gate/* | sort > termmax-targeted-vault-gate/SHA256SUMS.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: termmax-targeted-vault-gate
          path: termmax-targeted-vault-gate/
          if-no-files-found: error
          retention-days: 3
