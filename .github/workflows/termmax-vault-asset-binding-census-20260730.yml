name: TermMax V2 vault asset binding census 20260730

on:
  push:
    branches: [termmax-vault-asset-binding-census-20260730]
    paths:
      - '.github/workflows/termmax-vault-asset-binding-census-20260730.yml'
      - 'monitor/termmax_vault_asset_binding_census_20260730.py'
      - 'monitor/TRIGGER_VAULT_ASSET_BINDING.txt'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum, bnb, base]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termmax-vault-asset-binding-census-20260730
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Scan current vault asset/debt bindings
        shell: bash
        env:
          CHAIN: ${{ matrix.chain }}
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python monitor/termmax_vault_asset_binding_census_20260730.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum monitor/termmax_vault_asset_binding_census_20260730.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          exit 0
      - name: Upload current-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-vault-asset-binding-${{ matrix.chain }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Final gate
        if: always()
        shell: bash
        run: test "$(cat evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
