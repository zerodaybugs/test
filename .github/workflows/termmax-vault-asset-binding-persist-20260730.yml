name: TermMax vault asset binding persistent result 20260730

on:
  push:
    branches: [termmax-vault-asset-binding-census-20260730]
    paths:
      - '.github/workflows/termmax-vault-asset-binding-persist-20260730.yml'
      - 'monitor/termmax_vault_asset_binding_census_20260730.py'
      - 'monitor/TRIGGER_VAULT_ASSET_BINDING_PERSIST.txt'

permissions:
  contents: write

jobs:
  scan-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termmax-vault-asset-binding-census-20260730
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4
      - name: Run all-chain binding census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-results/termmax-vault-asset-binding
          mkdir -p public-results/termmax-vault-asset-binding
          CHAIN=all OUT_DIR=public-results/termmax-vault-asset-binding \
            python monitor/termmax_vault_asset_binding_census_20260730.py \
            > public-results/termmax-vault-asset-binding/stdout.log \
            2> public-results/termmax-vault-asset-binding/stderr.log
          find public-results/termmax-vault-asset-binding -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum \
            > public-results/termmax-vault-asset-binding/SHA256SUMS.txt
      - name: Commit public read-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zerodaybugs-public-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public-results/termmax-vault-asset-binding/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add TermMax vault asset binding census result ${GITHUB_RUN_ID}"
          git push origin HEAD:termmax-vault-asset-binding-census-20260730
