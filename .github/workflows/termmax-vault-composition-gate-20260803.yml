name: Temporary TermMax vault composition gate 20260803

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: termmax-vault-composition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  census:
    if: github.head_ref == 'termmax-vault-composition-gate-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Run resilient current-state composition census
        shell: bash
        run: |
          set +e
          rm -rf evidence
          mkdir -p evidence
          OUT_DIR=evidence python research/termmax_vault_composition_gate_v2_20260803.py \
            > >(tee evidence/stdout.log) \
            2> >(tee evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/composition_exit_code.txt
          exit 0

      - name: Simulate caller-selected FT withdrawal at pinned state
        shell: bash
        run: |
          set +e
          OUT_DIR=evidence python research/termmax_withdrawfts_live_call_20260803.py \
            > >(tee evidence/withdrawfts_stdout.log) \
            2> >(tee evidence/withdrawfts_stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/withdrawfts_exit_code.txt
          exit 0

      - name: Simulate ordinary LP exit before deterministic settlement loss
        shell: bash
        run: |
          set +e
          OUT_DIR=evidence python research/termmax_pre_settlement_exit_live_gate_20260803.py \
            > >(tee evidence/pre_settlement_exit_stdout.log) \
            2> >(tee evidence/pre_settlement_exit_stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > evidence/pre_settlement_exit_exit_code.txt
          exit 0

      - name: Record environment and integrity
        if: always()
        shell: bash
        run: |
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum \
              research/termmax_vault_composition_gate_20260803.py \
              research/termmax_vault_composition_gate_v2_20260803.py \
              research/termmax_withdrawfts_live_call_20260803.py \
              research/termmax_pre_settlement_exit_live_gate_20260803.py
          } > evidence/environment.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-vault-composition-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        shell: bash
        run: |
          test "$(cat evidence/composition_exit_code.txt 2>/dev/null || echo 99)" = 0
          test "$(cat evidence/withdrawfts_exit_code.txt 2>/dev/null || echo 99)" = 0
          test "$(cat evidence/pre_settlement_exit_exit_code.txt 2>/dev/null || echo 99)" = 0
