name: Temporary TermMax WFC1 global census 20260803

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: termmax-wfc1-global-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  census:
    if: github.head_ref == 'termmax-vault-composition-gate-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input web3==7.13.0 requests==2.32.4

      - name: Run global current-state WFC1 census
        shell: bash
        run: |
          set +e
          rm -rf global-evidence
          mkdir -p global-evidence
          OUT_DIR=global-evidence python research/termmax_wfc1_global_census_20260803.py \
            > >(tee global-evidence/stdout.log) \
            2> >(tee global-evidence/stderr.log >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > global-evidence/exit_code.txt
          {
            python --version
            python -m pip freeze | sort
            uname -a
            sha256sum research/termmax_wfc1_global_census_20260803.py
          } > global-evidence/environment.txt
          find global-evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > global-evidence/SHA256SUMS.txt
          exit 0

      - name: Upload global read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termmax-wfc1-global-${{ github.run_id }}
          path: global-evidence/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Final gate
        if: always()
        run: test "$(cat global-evidence/exit_code.txt 2>/dev/null || echo 99)" = 0
