name: test-unmodified-aspnetcore-components-server-v10-0-10

on:
  push:
    branches:
      - tooling/dotnet-sdk-10.0.302-cache-20260811
    paths:
      - .github/workflows/test-unmodified-aspnetcore-components-server-v10-0-10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-product-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact official ASP.NET Core tag with submodules
        uses: actions/checkout@v4
        with:
          repository: dotnet/aspnetcore
          ref: v10.0.10
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "2adedfc51f57ce4f0e98616fa0eb1e65283dd6af"
          test -z "$(git -C source status --porcelain=v1)"

      - name: Run complete unmodified Components.Server test project
        id: product_tests
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          ./eng/build.sh \
            --configuration Release \
            --projects "$PWD/src/Components/Server/test/Microsoft.AspNetCore.Components.Server.Tests.csproj" \
            --test \
            --no-build-native \
            --no-build-nodejs \
            --no-build-java \
            --no-build-installers \
            --verbosity minimal \
            2>&1 | tee ../components-server-tests-unmodified.log

      - name: Collect baseline test evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact/test-results artifact/environment
          [[ -d source/artifacts/TestResults ]] && cp -a source/artifacts/TestResults/. artifact/test-results/
          cp components-server-tests-unmodified.log artifact/
          source/.dotnet/dotnet --info > artifact/environment/dotnet-info.txt
          git -C source rev-parse HEAD > artifact/source-commit.txt
          git -C source status --porcelain=v1 > artifact/source-status-after.txt
          printf 'product_tests_outcome=%s\n' '${{ steps.product_tests.outcome }}' > artifact/TEST_OUTCOME.txt
          find artifact -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Upload unmodified full-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-components-server-v10.0.10-unmodified-full-tests
          path: artifact
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
