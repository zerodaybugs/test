name: Temporary advertised address code probe 2026-08-23

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp/address-code-probe-20260823.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Read code at compatibility-probe address
        shell: bash
        run: |
          set -euo pipefail
          probe='0x0000000000000001000000000000000000000000'
          mkdir -p artifact
          cat > artifact/endpoints.tsv <<'EOF'
          ethereum	https://ethereum-rpc.publicnode.com
          base	https://base-rpc.publicnode.com
          arbitrum	https://arbitrum-one-rpc.publicnode.com
          optimism	https://optimism-rpc.publicnode.com
          bsc	https://bsc-rpc.publicnode.com
          polygon	https://polygon-bor-rpc.publicnode.com
          xlayer	https://rpc.xlayer.tech
          EOF
          printf 'chain\tblock\tcode_bytes\tcode_sha256\n' > artifact/summary.tsv
          while IFS=$'\t' read -r chain rpc; do
            block="$(cast block-number --rpc-url "$rpc")"
            code="$(cast code "$probe" --rpc-url "$rpc")"
            printf '%s\n' "$code" > "artifact/${chain}.hex"
            bytes=$(( (${#code} - 2) / 2 ))
            hash="$(printf '%s' "$code" | sha256sum | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$chain" "$block" "$bytes" "$hash" >> artifact/summary.tsv
          done < artifact/endpoints.tsv
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: advertised-address-code-probe
          path: artifact
          retention-days: 1
          if-no-files-found: error
