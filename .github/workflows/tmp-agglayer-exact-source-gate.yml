name: Temporary Agglayer exact-source and initializer gate

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-agglayer-exact-source-trigger.txt"
      - ".github/workflows/tmp-agglayer-exact-source-gate.yml"

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select RPC and capture live bytecode
        id: live
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-exact-source"
          mkdir -p "$OUT/live" "$OUT/exact" "$OUT/probes"
          RPC=""
          for candidate in \
            "https://ethereum-rpc.publicnode.com" \
            "https://eth.llamarpc.com" \
            "https://rpc.flashbots.net" \
            "https://1rpc.io/eth"; do
            if cast block-number --rpc-url "$candidate" >/dev/null 2>&1; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"
          BLOCK=$(cast block-number --rpc-url "$RPC")
          echo "rpc=$RPC" >> "$GITHUB_OUTPUT"
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"

          python3 - "$RPC" "$BLOCK" "$OUT" <<'PY'
          import json, pathlib, sys, urllib.parse, urllib.request
          rpc, block, out_s = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          out = pathlib.Path(out_s)
          impl_slot = '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          proxies = {
              'AgglayerBridge': '0x2a3DD3EB832aF982ec71669E178424b10Dca2EDe',
              'AgglayerGER': '0x580bda1e7A0CFAe92Fa7F6c20A3794F169CE3CFb',
              'AgglayerManager': '0x5132A183E9F3CB7C848b0AAC5Ae0c4f0491B7aB2',
          }
          def call(method, params):
              body = json.dumps({'jsonrpc':'2.0','method':method,'params':params,'id':1}).encode()
              req = urllib.request.Request(rpc, data=body, headers={'content-type':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  obj = json.loads(r.read())
              if 'error' in obj:
                  raise RuntimeError(obj['error'])
              return obj['result']
          tag = hex(block)
          rows = []
          for name, proxy in proxies.items():
              raw = call('eth_getStorageAt', [proxy, impl_slot, tag])
              impl = '0x' + raw[-40:]
              proxy_code = call('eth_getCode', [proxy, tag])
              impl_code = call('eth_getCode', [impl, tag])
              (out/'live'/f'{name}.proxy.hex').write_text(proxy_code)
              (out/'live'/f'{name}.implementation.hex').write_text(impl_code)
              rows.append({'name':name,'proxy':proxy,'implementation':impl,'proxy_bytes':(len(proxy_code)-2)//2,'implementation_bytes':(len(impl_code)-2)//2})
          (out/'live-state.json').write_text(json.dumps(rows,indent=2)+'\n')
          meta = {
              'block': block,
              'rpc_host': urllib.parse.urlparse(rpc).hostname,
              'captured_at': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'mode': 'eth_call_eth_getCode_eth_getStorageAt_only',
              'transactions_sent': 0,
          }
          (out/'metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY

      - name: Run read-only initializer probes
        shell: bash
        env:
          RPC: ${{ steps.live.outputs.rpc }}
          BLOCK: ${{ steps.live.outputs.block }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-exact-source"
          FROM="0x000000000000000000000000000000000000dEaD"
          BRIDGE="0x2a3DD3EB832aF982ec71669E178424b10Dca2EDe"
          GER="0x580bda1e7A0CFAe92Fa7F6c20A3794F169CE3CFb"
          MANAGER="0x5132A183E9F3CB7C848b0AAC5Ae0c4f0491B7aB2"
          TAG="0x$(printf '%x' "$BLOCK")"

          probe() {
            local name="$1" to="$2" data="$3"
            curl -sS --retry 3 -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_call\",\"params\":[{\"from\":\"$FROM\",\"to\":\"$to\",\"data\":\"$data\"},\"$TAG\"],\"id\":1}" \
              "$RPC" | jq -c '.' > "$OUT/probes/$name.json"
          }

          INIT0=$(cast calldata 'initialize()')
          INIT_BRIDGE=$(cast calldata \
            'initialize(uint32,address,uint32,address,address,bytes)' \
            0 0x0000000000000000000000000000000000000000 0 \
            "$GER" "$MANAGER" 0x)

          probe bridge_initialize_zero "$BRIDGE" "$INIT0"
          probe bridge_initialize_parameters "$BRIDGE" "$INIT_BRIDGE"
          probe ger_initialize_zero "$GER" "$INIT0"
          probe manager_initialize_zero "$MANAGER" "$INIT0"

          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          rows=[]
          for p in sorted((out/'probes').glob('*.json')):
              obj=json.loads(p.read_text())
              rows.append({'probe':p.stem,'success':'result' in obj,'result':obj.get('result'),'error':obj.get('error')})
          (out/'initializer-probe-summary.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - name: Recover exact verified source bundles from live metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-exact-source"
          python3 -m pip install --disable-pip-version-check --quiet cbor2 base58 requests 'eth-hash[pycryptodome]'
          python3 - "$OUT" <<'PY'
          import base58, cbor2, json, pathlib, re, requests, sys, time
          from eth_hash.auto import keccak

          out = pathlib.Path(sys.argv[1])
          session = requests.Session()
          session.headers.update({'User-Agent':'authorized-security-research/1.0'})
          gateways = [
              'https://ipfs.io/ipfs/',
              'https://dweb.link/ipfs/',
              'https://w3s.link/ipfs/',
              'https://gateway.pinata.cloud/ipfs/',
          ]

          def code_bytes(path):
              s=path.read_text().strip()
              if s.startswith('0x'): s=s[2:]
              return bytes.fromhex(s)

          def fetch_ipfs(cid, suffix=''):
              errors=[]
              for base in gateways:
                  url=base+cid+suffix
                  try:
                      r=session.get(url,timeout=35)
                      if r.status_code==200 and r.content:
                          return r.content, url
                      errors.append(f'{url}: HTTP {r.status_code}')
                  except Exception as e:
                      errors.append(f'{url}: {type(e).__name__}: {e}')
                  time.sleep(0.4)
              raise RuntimeError('; '.join(errors))

          def cid_from_ipfs_bytes(raw):
              return base58.b58encode(raw).decode()

          def source_from_url(url):
              if url.startswith('dweb:/ipfs/'):
                  cid_path=url[len('dweb:/ipfs/'):]
                  cid, _, suffix=cid_path.partition('/')
                  return fetch_ipfs(cid, '/'+suffix if suffix else '')
              if url.startswith('ipfs://'):
                  cid_path=url[len('ipfs://'):]
                  cid, _, suffix=cid_path.partition('/')
                  return fetch_ipfs(cid, '/'+suffix if suffix else '')
              if '/ipfs/' in url:
                  cid_path=url.split('/ipfs/',1)[1]
                  cid, _, suffix=cid_path.partition('/')
                  return fetch_ipfs(cid, '/'+suffix if suffix else '')
              if url.startswith('https://') or url.startswith('http://'):
                  r=session.get(url,timeout=35)
                  r.raise_for_status()
                  return r.content, url
              raise RuntimeError(f'unsupported source URL: {url}')

          manifest=[]
          for live_path in sorted((out/'live').glob('*.implementation.hex')):
              name=live_path.name.split('.')[0]
              code=code_bytes(live_path)
              if len(code)<2:
                  raise RuntimeError(f'empty runtime for {name}')
              n=int.from_bytes(code[-2:],'big')
              if n<=0 or n+2>len(code):
                  raise RuntimeError(f'invalid CBOR length for {name}: {n}')
              cbor_blob=code[-(n+2):-2]
              decoded=cbor2.loads(cbor_blob)
              ipfs_raw=decoded.get('ipfs') or decoded.get(b'ipfs')
              if not isinstance(ipfs_raw,(bytes,bytearray)):
                  raise RuntimeError(f'no IPFS metadata hash in {name}: {decoded}')
              cid=cid_from_ipfs_bytes(bytes(ipfs_raw))
              metadata_bytes, metadata_url=fetch_ipfs(cid)
              metadata=json.loads(metadata_bytes)
              bundle=out/'exact'/name
              sources_dir=bundle/'sources'
              sources_dir.mkdir(parents=True,exist_ok=True)
              (bundle/'metadata.json').write_bytes(metadata_bytes)
              (bundle/'runtime-cbor.json').write_text(json.dumps({str(k): (v.hex() if isinstance(v,(bytes,bytearray)) else v) for k,v in decoded.items()},indent=2)+'\n')

              compiler_version=metadata.get('compiler',{}).get('version')
              source_input={}
              source_rows=[]
              for source_name, entry in metadata.get('sources',{}).items():
                  content=None; used_url=None; errs=[]
                  for url in entry.get('urls',[]):
                      if url.startswith('bzz-raw://'):
                          continue
                      try:
                          raw, used_url=source_from_url(url)
                          expected=entry.get('keccak256')
                          actual='0x'+keccak(raw).hex()
                          if expected and actual.lower()!=expected.lower():
                              raise RuntimeError(f'keccak mismatch expected={expected} actual={actual}')
                          content=raw.decode('utf-8')
                          break
                      except Exception as e:
                          errs.append(f'{url}: {e}')
                  if content is None:
                      raise RuntimeError(f'could not fetch {name}:{source_name}: {errs}')
                  source_input[source_name]={'content':content}
                  target_path=sources_dir/source_name
                  target_path.parent.mkdir(parents=True,exist_ok=True)
                  target_path.write_text(content)
                  source_rows.append({'source':source_name,'url':used_url,'keccak256':entry.get('keccak256'),'bytes':len(content.encode())})

              settings=json.loads(json.dumps(metadata.get('settings',{})))
              output_selection=settings.setdefault('outputSelection',{})
              output_selection['*']={'*':['abi','metadata','evm.bytecode.object','evm.deployedBytecode.object','evm.deployedBytecode.immutableReferences','evm.deployedBytecode.linkReferences','evm.methodIdentifiers']}
              standard_input={'language':metadata.get('language','Solidity'),'sources':source_input,'settings':settings}
              (bundle/'standard-input.json').write_text(json.dumps(standard_input,indent=2)+'\n')
              (bundle/'source-manifest.json').write_text(json.dumps(source_rows,indent=2)+'\n')
              manifest.append({'name':name,'metadata_cid':cid,'metadata_url':metadata_url,'compiler_version':compiler_version,'sources':len(source_rows),'compilation_target':metadata.get('settings',{}).get('compilationTarget')})

          (out/'exact-source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Compile exact metadata inputs and compare live runtimes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-exact-source"
          mkdir -p "$RUNNER_TEMP/solc-runner"
          cd "$RUNNER_TEMP/solc-runner"
          npm init -y >/dev/null 2>&1
          npm install --silent solc@0.8.28
          cat > compile.js <<'JS'
          const fs = require('fs');
          const path = require('path');
          const solc = require('solc');
          const out = process.argv[2];
          for (const name of ['AgglayerBridge','AgglayerGER','AgglayerManager']) {
            const dir = path.join(out,'exact',name);
            const input = JSON.parse(fs.readFileSync(path.join(dir,'standard-input.json'),'utf8'));
            const output = JSON.parse(solc.compile(JSON.stringify(input)));
            fs.writeFileSync(path.join(dir,'compiler-output.json'), JSON.stringify(output,null,2)+'\n');
            const target = input.settings.compilationTarget;
            const sourceName = Object.keys(target)[0];
            const contractName = target[sourceName];
            const obj = output.contracts?.[sourceName]?.[contractName];
            if (!obj) {
              console.error(JSON.stringify(output.errors || [], null, 2));
              throw new Error(`missing compilation target ${sourceName}:${contractName}`);
            }
            fs.writeFileSync(path.join(dir,'compiled-runtime.hex'),'0x'+obj.evm.deployedBytecode.object);
            fs.writeFileSync(path.join(dir,'compiled-creation.hex'),'0x'+obj.evm.bytecode.object);
            fs.writeFileSync(path.join(dir,'immutable-references.json'),JSON.stringify(obj.evm.deployedBytecode.immutableReferences || {},null,2)+'\n');
            fs.writeFileSync(path.join(dir,'link-references.json'),JSON.stringify(obj.evm.deployedBytecode.linkReferences || {},null,2)+'\n');
          }
          JS
          node compile.js "$OUT"

          python3 - "$OUT" <<'PY'
          import hashlib, json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          names=['AgglayerBridge','AgglayerGER','AgglayerManager']
          def read_hex(p):
              s=p.read_text().strip(); s=s[2:] if s.startswith('0x') else s
              return bytes.fromhex(s)
          def refs(obj):
              result=[]
              def walk(v):
                  if isinstance(v,dict):
                      if 'start' in v and 'length' in v:
                          result.append((int(v['start']),int(v['length'])))
                      else:
                          for x in v.values(): walk(x)
                  elif isinstance(v,list):
                      for x in v: walk(x)
              walk(obj)
              return sorted(set(result))
          def normalize(data,ranges):
              b=bytearray(data)
              for start,length in ranges:
                  if start>=0 and start+length<=len(b):
                      b[start:start+length]=b'\x00'*length
              return bytes(b)
          rows=[]
          for name in names:
              d=out/'exact'/name
              live=read_hex(out/'live'/f'{name}.implementation.hex')
              compiled=read_hex(d/'compiled-runtime.hex')
              ranges=refs(json.loads((d/'immutable-references.json').read_text()))+refs(json.loads((d/'link-references.json').read_text()))
              ranges=sorted(set(ranges))
              ln=normalize(live,ranges); cn=normalize(compiled,ranges)
              rows.append({
                  'name':name,
                  'full_equal':live==compiled,
                  'normalized_equal':ln==cn,
                  'live_bytes':len(live),
                  'compiled_bytes':len(compiled),
                  'normalization_ranges':ranges,
                  'live_normalized_sha256':hashlib.sha256(ln).hexdigest(),
                  'compiled_normalized_sha256':hashlib.sha256(cn).hexdigest(),
              })
          (out/'exact-runtime-binding.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - name: Determine compiler-bug trigger and initializer verdicts
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-exact-source"
          python3 - "$OUT" <<'PY'
          import json, pathlib, re, sys
          out=pathlib.Path(sys.argv[1])

          def strip_comments_and_strings(text):
              pattern=r'("(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'|//[^\n]*|/\*.*?\*/)'
              def repl(m):
                  s=m.group(0)
                  return '\n'*s.count('\n') if s.startswith(('//','/*')) else '""'
              return re.sub(pattern,repl,text,flags=re.S)

          trigger_rows=[]
          for name in ['AgglayerBridge','AgglayerGER','AgglayerManager']:
              root=out/'exact'/name/'sources'
              transient=[]; deletes=[]; persistent_clears=[]
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  text=p.read_text(errors='replace')
                  clean=strip_comments_and_strings(text)
                  rel=str(p.relative_to(root))
                  for i,line in enumerate(clean.splitlines(),1):
                      if re.search(r'\btransient\b',line):
                          transient.append({'source':rel,'line':i,'text':line.strip()})
                      if re.search(r'\bdelete\b',line):
                          deletes.append({'source':rel,'line':i,'text':line.strip()})
                      if re.search(r'\.(?:pop|push)\s*\(|\bdelete\b',line):
                          persistent_clears.append({'source':rel,'line':i,'text':line.strip()})
              trigger_rows.append({
                  'name':name,
                  'transient_keyword_occurrences':transient,
                  'delete_occurrences':deletes,
                  'persistent_clear_occurrences':persistent_clears,
                  'compiler_bug_language_trigger_present':bool(transient and deletes),
              })
          (out/'compiler-bug-trigger-scan.json').write_text(json.dumps(trigger_rows,indent=2)+'\n')

          probes=json.loads((out/'initializer-probe-summary.json').read_text())
          bindings=json.loads((out/'exact-runtime-binding.json').read_text())
          verdict={
              'runtime_binding_all_pass':all(x['normalized_equal'] for x in bindings),
              'initializer_probes':probes,
              'compiler_bug_scan':trigger_rows,
              'compiler_warning_exploitable_from_source_trigger':any(x['compiler_bug_language_trigger_present'] for x in trigger_rows),
              'transactions_sent':0,
          }
          (out/'GATE_VERDICT.json').write_text(json.dumps(verdict,indent=2)+'\n')
          lines=['# Agglayer exact-source and initializer gate','',f"- Exact runtime binding all pass: `{verdict['runtime_binding_all_pass']}`",f"- Compiler warning source trigger present: `{verdict['compiler_warning_exploitable_from_source_trigger']}`",'- Transactions sent: `0`','','## Initializer probes','']
          for p in probes:
              lines.append(f"- {p['probe']}: `{'SUCCESS' if p['success'] else 'REVERT/ERROR'}`")
          lines += ['','## Runtime binding','']
          for b in bindings:
              lines.append(f"- {b['name']}: normalized `{'MATCH' if b['normalized_equal'] else 'MISMATCH'}`, full `{'MATCH' if b['full_equal'] else 'MISMATCH'}`")
          (out/'RESULT.md').write_text('\n'.join(lines)+'\n')
          PY

      - name: Integrity and safety gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-exact-source"
          mkdir -p "$OUT"
          if grep -RInE '(PRIVATE_KEY|MNEMONIC|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' "$OUT"; then
            echo 'Sensitive material detected' >&2
            exit 1
          fi
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agglayer-exact-source-gate
          path: ${{ runner.temp }}/agglayer-exact-source/
          retention-days: 3
          if-no-files-found: error
