name: Temporary Agglayer manager baseline v1

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-agglayer-manager-baseline-v1-trigger.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agglayer/agglayer-contracts
          ref: 110bda5a03e70ee7331bc06407a8e79226d3e520
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Local compile and regression suites
        shell: bash
        run: |
          set +e
          set -o pipefail
          OUT="$RUNNER_TEMP/agglayer-manager-baseline-v1"
          mkdir -p "$OUT"
          cd target
          git rev-parse HEAD > "$OUT/source-commit.txt"
          npm ci --ignore-scripts 2>&1 | tee "$OUT/npm-ci.log"
          echo "${PIPESTATUS[0]}" > "$OUT/npm-ci.exit"
          npx hardhat compile --force 2>&1 | tee "$OUT/compile.log"
          echo "${PIPESTATUS[0]}" > "$OUT/compile.exit"
          for file in \
            test/contractsv2/PolygonRollupManager.test.ts \
            test/contractsv2/PolygonRollupManager-Pessimistic.test.ts \
            test/contractsv2/PolygonRollupManagerUpgrade.test.ts \
            test/contractsv2/UpgradeToPP.test.ts; do
            label=$(basename "$file" .test.ts)
            npx hardhat test "$file" 2>&1 | tee "$OUT/$label.log"
            echo "${PIPESTATUS[0]}" > "$OUT/$label.exit"
          done
          python3 - "$OUT" <<'PY'
          import json,pathlib,re,sys
          out=pathlib.Path(sys.argv[1]);suites=[]
          for p in sorted(out.glob('*.exit')):
              if p.name in {'npm-ci.exit','compile.exit'}:continue
              label=p.stem;txt=(out/f'{label}.log').read_text(errors='replace')
              pm=re.findall(r'(\d+) passing',txt);fm=re.findall(r'(\d+) failing',txt)
              suites.append({'label':label,'exit':int(p.read_text()),'passing':int(pm[-1]) if pm else None,'failing':int(fm[-1]) if fm else None})
          result={'source_commit':(out/'source-commit.txt').read_text().strip(),'npm_ci_exit':int((out/'npm-ci.exit').read_text()),'compile_exit':int((out/'compile.exit').read_text()),'suites':suites,'all_pass':all(x['exit']==0 for x in suites),'transactions_sent':0}
          (out/'VERDICT.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agglayer-manager-baseline-v1
          path: ${{ runner.temp }}/agglayer-manager-baseline-v1/
          retention-days: 3
          if-no-files-found: error
