name: Temporary Agglayer manager static-analysis gate v3

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-agglayer-manager-static-v3-trigger.txt"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agglayer/agglayer-contracts
          ref: 110bda5a03e70ee7331bc06407a8e79226d3e520
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact source and install Slither
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-manager-static-v3"; mkdir -p "$OUT"
          cd target
          git rev-parse HEAD > "$OUT/source-commit.txt"
          npm ci --ignore-scripts > "$OUT/npm-ci.log" 2>&1
          npx hardhat compile --force > "$OUT/compile.log" 2>&1
          python -m pip install --disable-pip-version-check slither-analyzer > "$OUT/pip-slither.log" 2>&1
          slither --version > "$OUT/slither-version.txt"
          test -d artifacts/build-info
          find artifacts/build-info -type f -name '*.json' | wc -l > "$OUT/build-info-count.txt"
      - name: Force Hardhat artifact analysis
        shell: bash
        run: |
          set +e
          set -o pipefail
          OUT="$RUNNER_TEMP/agglayer-manager-static-v3"
          cd target
          slither . \
            --compile-force-framework hardhat \
            --ignore-compile \
            --exclude-dependencies \
            --filter-paths '(^|/)(test|script|scripts|mocks|previousVersions|node_modules)(/|$)' \
            --json "$OUT/slither.json" \
            > "$OUT/slither.stdout.log" 2> "$OUT/slither.stderr.log"
          echo "$?" > "$OUT/slither.exit"
          python3 - "$OUT" <<'PY'
          import json,pathlib,sys
          out=pathlib.Path(sys.argv[1]); parse_error=None
          try:data=json.loads((out/'slither.json').read_text())
          except Exception as e:data={'success':False,'results':{'detectors':[]}};parse_error=repr(e)
          dets=(data.get('results') or {}).get('detectors') or []
          manager=[]
          for d in dets:
              files=set()
              for e in d.get('elements') or []:
                  sm=e.get('source_mapping') or {}; f=sm.get('filename_relative') or sm.get('filename_absolute') or ''
                  if f:files.add(f)
              if any(f.endswith('contracts/AgglayerManager.sol') or f=='contracts/AgglayerManager.sol' for f in files):
                  manager.append({'check':d.get('check'),'impact':d.get('impact'),'confidence':d.get('confidence'),'description':d.get('description'),'files':sorted(files)})
          result={'source_commit':(out/'source-commit.txt').read_text().strip(),'slither_exit':int((out/'slither.exit').read_text()),'slither_json_success':bool(data.get('success')),'parse_error':parse_error,'all_detector_count':len(dets),'manager_detector_count':len(manager),'manager_high_count':sum(str(x.get('impact')).lower()=='high' for x in manager),'manager_medium_count':sum(str(x.get('impact')).lower()=='medium' for x in manager),'manager_findings':manager,'valid_run':parse_error is None and (out/'slither.json').exists(),'transactions_sent':0}
          (out/'VERDICT.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0|sort -z|xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agglayer-manager-static-gate-v3
          path: ${{ runner.temp }}/agglayer-manager-static-v3/
          retention-days: 3
          if-no-files-found: error
