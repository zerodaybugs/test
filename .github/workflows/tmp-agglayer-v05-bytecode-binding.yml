name: Temporary Agglayer v0.5 historical bytecode binding gate

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-agglayer-v05-bytecode-trigger.txt"
      - ".github/workflows/tmp-agglayer-v05-bytecode-binding.yml"

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact deployment commit
        uses: actions/checkout@v4
        with:
          repository: agglayer/vault-bridge
          ref: 595c6328203c7a10ac2ae91cf5daaa677f853b8f
          path: target
          fetch-depth: 1

      - name: Resolve deployment-era Foundry nightly
        id: nightly
        shell: bash
        run: |
          set -euo pipefail
          cutoff='2025-05-22T10:35:17Z'
          best_tag=''
          best_time=''
          for page in $(seq 1 12); do
            body=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/foundry-rs/foundry/releases?per_page=100&page=$page")
            count=$(jq 'length' <<<"$body")
            [[ "$count" -gt 0 ]] || break
            while IFS=$'\t' read -r published tag; do
              [[ -n "$published" && -n "$tag" ]] || continue
              if [[ "$published" < "$cutoff" || "$published" == "$cutoff" ]]; then
                if [[ -z "$best_time" || "$published" > "$best_time" ]]; then
                  best_time="$published"
                  best_tag="$tag"
                fi
              fi
            done < <(jq -r '.[] | select(.prerelease == true) | [.published_at,.tag_name] | @tsv' <<<"$body")
            [[ -z "$best_tag" ]] || break
          done
          test -n "$best_tag"
          echo "tag=$best_tag" >> "$GITHUB_OUTPUT"
          echo "published=$best_time" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$best_tag" "$best_time" > "$RUNNER_TEMP/resolved-nightly.txt"

      - name: Install historical Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ steps.nightly.outputs.tag }}

      - name: Build deployment source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-v05-bytecode-binding"
          mkdir -p "$OUT/compiled" "$OUT/live" "$OUT/broadcast"
          cp "$RUNNER_TEMP/resolved-nightly.txt" "$OUT/resolved-nightly.txt"
          cd target
          git rev-parse HEAD > "$OUT/source-commit.txt"
          forge --version > "$OUT/foundry-version.txt"
          forge soldeer install 2>&1 | tee "$OUT/soldeer-output.txt"
          forge build --force 2>&1 | tee "$OUT/build-output.txt"

      - name: Export compiled and broadcast bytecode
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-v05-bytecode-binding"
          cd target
          declare -A SPECS=(
            [MigrationManager]='src/MigrationManager.sol:MigrationManager'
            [GenericVaultBridgeToken]='src/vault-bridge-tokens/GenericVaultBridgeToken.sol:GenericVaultBridgeToken'
            [VbETH]='src/vault-bridge-tokens/vbETH/VbETH.sol:VbETH'
            [VaultBridgeTokenPart2]='src/VaultBridgeTokenPart2.sol:VaultBridgeTokenPart2'
            [VaultBridgeTokenInitializer]='src/VaultBridgeTokenInitializer.sol:VaultBridgeTokenInitializer'
          )
          for name in MigrationManager GenericVaultBridgeToken VbETH VaultBridgeTokenPart2 VaultBridgeTokenInitializer; do
            spec="${SPECS[$name]}"
            forge inspect "$spec" bytecode | tr -d '\r\n ' > "$OUT/compiled/$name.creation.hex"
            forge inspect "$spec" deployedBytecode | tr -d '\r\n ' > "$OUT/compiled/$name.runtime.hex"
            forge inspect "$spec" metadata --json > "$OUT/compiled/$name.metadata.json"
          done

          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          data = json.loads(pathlib.Path('broadcast/DeployLayerX.s.sol/1/run-1747910117.json').read_text())
          targets = {
              'MigrationManager': '0xc6dd6399eae419a0a33a8dc307f4c1db26d30e45',
              'GenericVaultBridgeToken': '0xcc865b0324121b43728176024f58bdbb3afd6f29',
              'VbETH': '0x81c16f89222c32806daf01f5129937dfe19d525e',
              'VaultBridgeTokenPart2': '0x1c8565f454f8239b854fe62c99b90b3fc9298e80',
              'VaultBridgeTokenInitializer': '0xb2ec4d99c82417257f41b2c8ceda0962c03945f5',
          }
          summary = {
              'top_level_commit': data.get('commit'),
              'timestamp': data.get('timestamp'),
              'chain': data.get('chain'),
              'transactions': {},
          }
          by_address = {
              str(tx.get('contractAddress','')).lower(): tx
              for tx in data.get('transactions', [])
              if tx.get('contractAddress')
          }
          for name, address in targets.items():
              tx = by_address.get(address)
              if not tx:
                  summary['transactions'][name] = {'address': address, 'found': False}
                  continue
              raw = tx.get('transaction', {}).get('input', '')
              (out/'broadcast'/f'{name}.creation.hex').write_text(raw)
              summary['transactions'][name] = {
                  'address': address,
                  'found': True,
                  'contractName': tx.get('contractName'),
                  'transactionType': tx.get('transactionType'),
                  'txHash': tx.get('hash'),
                  'input_hex_length': len(raw),
              }
          (out/'broadcast-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

      - name: Fetch block-pinned live runtimes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-v05-bytecode-binding"
          RPC='https://ethereum-rpc.publicnode.com'
          BLOCK=25809501
          declare -A ADDRS=(
            [MigrationManager]='0xc6dd6399eae419a0a33a8dc307f4c1db26d30e45'
            [GenericVaultBridgeToken]='0xcc865b0324121b43728176024f58bdbb3afd6f29'
            [VbETH]='0x81c16f89222c32806daf01f5129937dfe19d525e'
            [VaultBridgeTokenPart2]='0x1c8565f454f8239b854fe62c99b90b3fc9298e80'
            [VaultBridgeTokenInitializer]='0xb2ec4d99c82417257f41b2c8ceda0962c03945f5'
          )
          for name in MigrationManager GenericVaultBridgeToken VbETH VaultBridgeTokenPart2 VaultBridgeTokenInitializer; do
            cast code "${ADDRS[$name]}" --block "$BLOCK" --rpc-url "$RPC" | tr -d '\r\n ' > "$OUT/live/$name.runtime.hex"
          done
          printf 'block=%s\nmode=eth_getCode_only\ntransactions_sent=0\n' "$BLOCK" > "$OUT/live-binding.txt"

      - name: Compare full, semantic and creation bytecode
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-v05-bytecode-binding"
          python3 - "$OUT" <<'PY'
          import hashlib, json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          names = ['MigrationManager','GenericVaultBridgeToken','VbETH','VaultBridgeTokenPart2','VaultBridgeTokenInitializer']

          def raw(path):
              s = path.read_text().strip()
              if s.startswith('0x'): s = s[2:]
              return bytes.fromhex(s)

          def keccakish(b):
              # SHA-256 is only used as a local comparison digest; equality is byte-for-byte.
              return hashlib.sha256(b).hexdigest()

          def strip_cbor(b):
              if len(b) < 2:
                  return b, b''
              n = int.from_bytes(b[-2:], 'big')
              if n + 2 > len(b) or n == 0:
                  return b, b''
              meta = b[-(n+2):]
              # Solidity metadata starts with a CBOR map (major type 5).
              if meta[0] >> 5 != 5:
                  return b, b''
              return b[:-(n+2)], meta

          def solc_from_meta(meta):
              h = meta.hex()
              marker = '64736f6c6343'
              pos = h.find(marker)
              if pos < 0:
                  return None
              v = h[pos+len(marker):pos+len(marker)+6]
              if len(v) != 6:
                  return None
              return '.'.join(str(int(v[i:i+2],16)) for i in (0,2,4))

          tx_summary = json.loads((out/'broadcast-summary.json').read_text())
          result = {
              'source_commit': (out/'source-commit.txt').read_text().strip(),
              'foundry_version': (out/'foundry-version.txt').read_text().strip(),
              'resolved_nightly': (out/'resolved-nightly.txt').read_text().splitlines(),
              'broadcast': tx_summary,
              'contracts': {},
          }
          for name in names:
              compiled = raw(out/'compiled'/f'{name}.runtime.hex')
              live = raw(out/'live'/f'{name}.runtime.hex')
              c_sem, c_meta = strip_cbor(compiled)
              l_sem, l_meta = strip_cbor(live)
              creation = raw(out/'compiled'/f'{name}.creation.hex')
              broadcast_path = out/'broadcast'/f'{name}.creation.hex'
              broadcast = raw(broadcast_path) if broadcast_path.exists() else b''
              result['contracts'][name] = {
                  'runtime_full_equal': compiled == live,
                  'runtime_semantic_equal': c_sem == l_sem,
                  'compiled_runtime_bytes': len(compiled),
                  'live_runtime_bytes': len(live),
                  'compiled_semantic_bytes': len(c_sem),
                  'live_semantic_bytes': len(l_sem),
                  'compiled_metadata_bytes': len(c_meta),
                  'live_metadata_bytes': len(l_meta),
                  'compiled_solc_metadata': solc_from_meta(c_meta),
                  'live_solc_metadata': solc_from_meta(l_meta),
                  'compiled_semantic_sha256': keccakish(c_sem),
                  'live_semantic_sha256': keccakish(l_sem),
                  'creation_exact_equal_broadcast': creation == broadcast,
                  'compiled_creation_bytes': len(creation),
                  'broadcast_creation_bytes': len(broadcast),
                  'compiled_creation_is_prefix': bool(creation and broadcast.startswith(creation)),
              }
          (out/'comparison.json').write_text(json.dumps(result, indent=2) + '\n')

          lines = ['# Agglayer v0.5 historical bytecode binding', '']
          lines.append(f"- Source commit: `{result['source_commit']}`")
          lines.append(f"- Foundry: `{result['foundry_version']}`")
          lines.append(f"- Resolved nightly: `{result['resolved_nightly'][0]}` ({result['resolved_nightly'][1]})")
          lines.append(f"- Broadcast commit: `{tx_summary.get('top_level_commit')}`")
          lines += ['', '## Contract binding', '']
          for name, item in result['contracts'].items():
              lines.append(
                  f"- {name}: full={'MATCH' if item['runtime_full_equal'] else 'MISMATCH'}, "
                  f"semantic={'MATCH' if item['runtime_semantic_equal'] else 'MISMATCH'}, "
                  f"creation={'MATCH' if item['creation_exact_equal_broadcast'] else 'MISMATCH'}, "
                  f"solc compiled/live={item['compiled_solc_metadata']}/{item['live_solc_metadata']}"
              )
          (out/'RESULT.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Integrity manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-v05-bytecode-binding"
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agglayer-v05-bytecode-binding
          path: ${{ runner.temp }}/agglayer-v05-bytecode-binding/
          retention-days: 3
          if-no-files-found: error
