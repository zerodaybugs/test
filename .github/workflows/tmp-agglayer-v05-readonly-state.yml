name: Temporary Agglayer v0.5 read-only state snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-agglayer-v05-trigger.txt"
      - ".github/workflows/tmp-agglayer-v05-readonly-state.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Capture block-pinned read-only state
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/agglayer-v05-state"
          mkdir -p "$OUT"

          RPC=""
          for candidate in \
            "https://ethereum-rpc.publicnode.com" \
            "https://eth.llamarpc.com" \
            "https://rpc.flashbots.net"; do
            if cast block-number --rpc-url "$candidate" >/dev/null 2>&1; then
              RPC="$candidate"
              break
            fi
          done
          test -n "$RPC"

          BLOCK=$(cast block-number --rpc-url "$RPC")
          cast block "$BLOCK" --json --rpc-url "$RPC" > "$OUT/block.json"
          {
            echo "rpc_host=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.urlparse(sys.argv[1]).hostname)' "$RPC")"
            echo "block=$BLOCK"
            echo "captured_at=$(date -u +%FT%TZ)"
            echo "mode=eth_call_and_eth_getStorageAt_only"
            echo "transactions_sent=0"
          } > "$OUT/metadata.txt"

          : > "$OUT/state.tsv"
          emit() {
            local kind="$1" name="$2" addr="$3" key="$4" value="$5"
            value=$(printf '%s' "$value" | tr '\t\r\n' '   ')
            printf '%s\t%s\t%s\t%s\t%s\n' "$kind" "$name" "$addr" "$key" "$value" >> "$OUT/state.tsv"
          }
          call0() {
            local addr="$1" sig="$2" result=""
            for _ in 1 2 3; do
              if result=$(cast call "$addr" "$sig" --block "$BLOCK" --rpc-url "$RPC" 2>&1); then
                printf '%s' "$result"
                return 0
              fi
              sleep 1
            done
            printf 'ERROR: %s' "$result"
          }
          call1() {
            local addr="$1" sig="$2" arg="$3" result=""
            for _ in 1 2 3; do
              if result=$(cast call "$addr" "$sig" "$arg" --block "$BLOCK" --rpc-url "$RPC" 2>&1); then
                printf '%s' "$result"
                return 0
              fi
              sleep 1
            done
            printf 'ERROR: %s' "$result"
          }
          storage() {
            local addr="$1" slot="$2" result=""
            if result=$(cast storage "$addr" "$slot" --block "$BLOCK" --rpc-url "$RPC" 2>&1); then
              printf '%s' "$result"
            else
              printf 'ERROR: %s' "$result"
            fi
          }
          codehash() {
            local addr="$1" code=""
            if code=$(cast code "$addr" --block "$BLOCK" --rpc-url "$RPC" 2>/dev/null); then
              cast keccak "$code"
            else
              printf 'ERROR'
            fi
          }

          IMPL_SLOT="0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc"
          declare -A TOKENS=(
            [vbUSDC]="0x53E82ABbb12638F09d9e624578ccB666217a765e"
            [vbETH]="0x2DC70fb75b88d2eB4715bc06E1595E6D97c34DFF"
            [vbWBTC]="0x2C24B57e2CCd1f273045Af6A5f632504C432374F"
            [vbUSDT]="0x6d4f9f9f8f0155509ecd6Ac6c544fF27999845CC"
            [vbUSDS]="0x3DD459dE96F9C28e3a343b831cbDC2B93c8C4855"
          )

          for name in vbUSDC vbETH vbWBTC vbUSDT vbUSDS; do
            addr="${TOKENS[$name]}"
            emit proxy "$name" "$addr" proxy_codehash "$(codehash "$addr")"
            raw_impl=$(storage "$addr" "$IMPL_SLOT")
            emit proxy "$name" "$addr" eip1967_implementation_slot "$raw_impl"
            if [[ "$raw_impl" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
              impl="0x${raw_impl: -40}"
              emit proxy "$name" "$addr" implementation "$impl"
              emit implementation "$name" "$impl" codehash "$(codehash "$impl")"
            fi

            for sig in \
              'version()(string)' \
              'name()(string)' \
              'symbol()(string)' \
              'decimals()(uint8)' \
              'underlyingToken()(address)' \
              'asset()(address)' \
              'yieldVault()(address)' \
              'yieldRecipient()(address)' \
              'migrationManager()(address)' \
              'lxlyBridge()(address)' \
              'minimumReservePercentage()(uint256)' \
              'minimumYieldVaultDeposit()(uint256)' \
              'yieldVaultMaximumSlippagePercentage()(uint256)' \
              'reservedAssets()(uint256)' \
              'stakedAssets()(uint256)' \
              'totalAssets()(uint256)' \
              'totalSupply()(uint256)' \
              'yield()(uint256)' \
              'backingDifference()(bool,uint256)' \
              'migrationFeesFund()(uint256)' \
              'paused()(bool)'; do
              emit proxy "$name" "$addr" "$sig" "$(call0 "$addr" "$sig")"
            done

            underlying=$(call0 "$addr" 'underlyingToken()(address)')
            vault=$(call0 "$addr" 'yieldVault()(address)')
            if [[ "$underlying" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              emit underlying "$name" "$underlying" codehash "$(codehash "$underlying")"
              emit underlying "$name" "$underlying" decimals "$(call0 "$underlying" 'decimals()(uint8)')"
              emit underlying "$name" "$underlying" vbToken_balance "$(call1 "$underlying" 'balanceOf(address)(uint256)' "$addr")"
            fi
            if [[ "$vault" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              emit yield_vault "$name" "$vault" codehash "$(codehash "$vault")"
              yv_impl=$(storage "$vault" "$IMPL_SLOT")
              emit yield_vault "$name" "$vault" eip1967_implementation_slot "$yv_impl"
              for sig in \
                'name()(string)' \
                'symbol()(string)' \
                'asset()(address)' \
                'decimals()(uint8)' \
                'totalAssets()(uint256)' \
                'totalSupply()(uint256)'; do
                emit yield_vault "$name" "$vault" "$sig" "$(call0 "$vault" "$sig")"
              done
              yv_shares=$(call1 "$vault" 'balanceOf(address)(uint256)' "$addr")
              emit yield_vault "$name" "$vault" vbToken_share_balance "$yv_shares"
              emit yield_vault "$name" "$vault" maxWithdraw_vbToken "$(call1 "$vault" 'maxWithdraw(address)(uint256)' "$addr")"
              emit yield_vault "$name" "$vault" maxRedeem_vbToken "$(call1 "$vault" 'maxRedeem(address)(uint256)' "$addr")"
              if [[ "$yv_shares" =~ ^[0-9]+$ ]]; then
                emit yield_vault "$name" "$vault" convertToAssets_vbShares "$(call1 "$vault" 'convertToAssets(uint256)(uint256)' "$yv_shares")"
                emit yield_vault "$name" "$vault" previewRedeem_vbShares "$(call1 "$vault" 'previewRedeem(uint256)(uint256)' "$yv_shares")"
              fi
            fi
          done

          MM="0x417d01B64Ea30C4E163873f3a1f77b727c689e02"
          emit proxy MigrationManager "$MM" proxy_codehash "$(codehash "$MM")"
          mm_impl=$(storage "$MM" "$IMPL_SLOT")
          emit proxy MigrationManager "$MM" eip1967_implementation_slot "$mm_impl"
          if [[ "$mm_impl" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            impl="0x${mm_impl: -40}"
            emit proxy MigrationManager "$MM" implementation "$impl"
            emit implementation MigrationManager "$impl" codehash "$(codehash "$impl")"
          fi
          for sig in 'version()(string)' 'lxlyBridge()(address)' 'paused()(bool)'; do
            emit proxy MigrationManager "$MM" "$sig" "$(call0 "$MM" "$sig")"
          done

          for entry in \
            'VaultBridgeTokenInitializer:0xb2ec4d99c82417257f41b2c8ceda0962c03945f5' \
            'VaultBridgeTokenPart2:0x1C8565F454F8239B854fe62C99B90b3FC9298E80'; do
            name="${entry%%:*}"; addr="${entry#*:}"
            emit singleton "$name" "$addr" codehash "$(codehash "$addr")"
            emit singleton "$name" "$addr" version "$(call0 "$addr" 'version()(string)')"
          done

          python3 - "$OUT" <<'PY'
          import csv, json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          rows = []
          with (out/'state.tsv').open() as f:
              for kind, name, address, key, value in csv.reader(f, delimiter='\t'):
                  rows.append({'kind':kind,'name':name,'address':address,'key':key,'value':value})
          (out/'state.json').write_text(json.dumps(rows, indent=2) + '\n')
          errors = [r for r in rows if r['value'].startswith('ERROR:')]
          meta = dict(line.strip().split('=',1) for line in (out/'metadata.txt').read_text().splitlines() if '=' in line)
          lines = [
              '# Agglayer Vault Bridge v0.5 read-only state snapshot', '',
              f"- Block: `{meta.get('block')}`",
              f"- Captured: `{meta.get('captured_at')}`",
              f"- Mode: `{meta.get('mode')}`",
              f"- Transactions sent: `{meta.get('transactions_sent')}`",
              f"- Rows: `{len(rows)}`",
              f"- Call errors: `{len(errors)}`", '',
              '## Error rows', ''
          ]
          lines += [f"- `{r['name']}` / `{r['key']}`: {r['value']}" for r in errors] or ['- None']
          (out/'RESULT.md').write_text('\n'.join(lines) + '\n')
          PY

          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"

      - name: Upload snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agglayer-v05-readonly-state
          path: ${{ runner.temp }}/agglayer-v05-state/
          retention-days: 3
          if-no-files-found: error
