name: Temporary Chronicle Scribe exact-commit export 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-export-trigger-20260823.txt"
      - ".github/workflows/tmp-chronicle-export-20260823.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact Chronicle bounty source
        uses: actions/checkout@v4
        with:
          repository: chronicleprotocol/scribe
          ref: a5e0da3a498cb5883502a8fe05e16096254ec3ab
          path: scribe
          submodules: recursive
          fetch-depth: 1

      - name: Install Foundry nightly
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build exact source and run bounded official baseline
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-export"
          mkdir -p "$OUT/logs" "$OUT/toolchain"
          cd scribe
          git rev-parse HEAD | tee "$OUT/target-commit.txt"
          git submodule status | tee "$OUT/submodules.txt"
          forge --version | tee "$OUT/forge-version.txt"
          set +e
          forge build --force 2>&1 | tee "$OUT/logs/forge-build.log"
          build_rc=${PIPESTATUS[0]}
          FOUNDRY_PROFILE=ci forge test --nmt 'FuzzDifferentialOracleSuite' -vv 2>&1 | tee "$OUT/logs/forge-test-bounded.log"
          test_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$build_rc" > "$OUT/forge-build.exit"
          printf '%s\n' "$test_rc" > "$OUT/forge-test-bounded.exit"
          test "$build_rc" -eq 0
          test "$test_rc" -eq 0

      - name: Export source and complete local toolchain
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-export"
          mkdir -p "$OUT/source" "$OUT/toolchain/bin" "$OUT/toolchain/svm"
          rsync -a \
            --exclude='.git' \
            --exclude='out' \
            --exclude='cache' \
            --exclude='node_modules' \
            scribe/ "$OUT/source/"
          for bin in forge cast anvil chisel; do
            path=$(command -v "$bin" || true)
            if [[ -n "$path" ]]; then cp "$path" "$OUT/toolchain/bin/$bin"; fi
          done
          if [[ -d "$HOME/.svm" ]]; then rsync -a "$HOME/.svm/" "$OUT/toolchain/svm/"; fi
          if [[ -d "$HOME/.foundry" ]]; then
            find "$HOME/.foundry" -maxdepth 3 -type f -printf '%p\n' > "$OUT/foundry-files.txt" || true
          fi
          find "$OUT/source" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SOURCE_SHA256SUMS.txt"
          find "$OUT/toolchain" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/TOOLCHAIN_SHA256SUMS.txt"

      - name: Safety and integrity gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-export"
          if grep -RInE '(PRIVATE_KEY|MNEMONIC|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' "$OUT" --exclude='*.example' --exclude='*.log'; then
            echo 'Sensitive material detected' >&2
            exit 1
          fi
          find "$OUT" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/EXPORT_VERDICT.json" <<JSON
          {
            "target_commit": "a5e0da3a498cb5883502a8fe05e16096254ec3ab",
            "build_exit": $(cat "$OUT/forge-build.exit"),
            "bounded_test_exit": $(cat "$OUT/forge-test-bounded.exit"),
            "transactions_sent": 0,
            "public_chain_testing": false
          }
          JSON

      - name: Upload exact source and toolchain
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-scribe-exact-export-20260823
          path: ${{ runner.temp }}/chronicle-export/
          retention-days: 3
          if-no-files-found: error
