name: Temporary Chronicle Scribe fast exact-source export 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-export-fast-trigger-20260823.txt"
      - ".github/workflows/tmp-chronicle-export-fast-20260823.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact Chronicle bounty source
        uses: actions/checkout@v4
        with:
          repository: chronicleprotocol/scribe
          ref: a5e0da3a498cb5883502a8fe05e16096254ec3ab
          path: scribe
          submodules: recursive
          fetch-depth: 1

      - name: Install Foundry nightly
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Export source and toolchain first
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-fast-export"
          mkdir -p "$OUT/source" "$OUT/toolchain/bin" "$OUT/toolchain/svm" "$OUT/logs"
          cd scribe
          git rev-parse HEAD | tee "$OUT/target-commit.txt"
          git submodule status | tee "$OUT/submodules.txt"
          forge --version | tee "$OUT/forge-version.txt"
          cd ..
          rsync -a --exclude='.git' --exclude='out' --exclude='cache' --exclude='node_modules' scribe/ "$OUT/source/"
          for bin in forge cast anvil chisel; do
            path=$(command -v "$bin" || true)
            if [[ -n "$path" ]]; then cp "$path" "$OUT/toolchain/bin/$bin"; fi
          done
          if [[ -d "$HOME/.svm" ]]; then rsync -a "$HOME/.svm/" "$OUT/toolchain/svm/"; fi

      - name: Exact-commit build gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-fast-export"
          cd scribe
          set +e
          forge build --force 2>&1 | tee "$OUT/logs/forge-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$OUT/forge-build.exit"
          test "$rc" -eq 0

      - name: Integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-fast-export"
          mkdir -p "$OUT"
          find "$OUT/source" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SOURCE_SHA256SUMS.txt"
          find "$OUT/toolchain" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/TOOLCHAIN_SHA256SUMS.txt"
          find "$OUT" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/EXPORT_VERDICT.json" <<JSON
          {
            "target_commit": "a5e0da3a498cb5883502a8fe05e16096254ec3ab",
            "build_exit": $(cat "$OUT/forge-build.exit" 2>/dev/null || echo -1),
            "transactions_sent": 0,
            "public_chain_testing": false
          }
          JSON

      - name: Upload exact source and toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-scribe-fast-exact-export-20260823
          path: ${{ runner.temp }}/chronicle-fast-export/
          retention-days: 3
          if-no-files-found: error
