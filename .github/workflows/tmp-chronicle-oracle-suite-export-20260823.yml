name: Temporary Chronicle oracle-suite source export 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-oracle-suite-export-trigger.txt"
      - ".github/workflows/tmp-chronicle-oracle-suite-export-20260823.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Export immutable public Go module source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-oracle-suite"
          mkdir -p "$OUT/source"
          TMP="$RUNNER_TEMP/gomod"
          mkdir -p "$TMP"
          cd "$TMP"
          go mod init local-export >/dev/null 2>&1
          go mod download -json github.com/chronicleprotocol/oracle-suite@v0.23.1 > "$OUT/module.json"
          DIR=$(jq -r '.Dir' "$OUT/module.json")
          test -d "$DIR"
          cp -a "$DIR/." "$OUT/source/"
          go env > "$OUT/go-env.txt"
          printf 'module=github.com/chronicleprotocol/oracle-suite\nversion=v0.23.1\ntransactions_sent=0\npublic_chain_testing=false\n' > "$OUT/metadata.txt"
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-oracle-suite-v0.23.1-source
          path: ${{ runner.temp }}/chronicle-oracle-suite/
          retention-days: 3
          if-no-files-found: error
