name: Temporary Chronicle oracle-suite latest export 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-oracle-suite-latest-trigger.txt"
      - ".github/workflows/tmp-chronicle-oracle-suite-latest-20260823.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Resolve versions and export latest immutable source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-oracle-suite-latest"
          mkdir -p "$OUT/source"
          TMP="$RUNNER_TEMP/gomod-latest"
          mkdir -p "$TMP"
          cd "$TMP"
          go mod init local-export >/dev/null 2>&1
          go list -m -versions github.com/chronicleprotocol/oracle-suite > "$OUT/versions.txt"
          go list -m -json github.com/chronicleprotocol/oracle-suite@latest > "$OUT/latest.json"
          VERSION=$(jq -r '.Version' "$OUT/latest.json")
          test -n "$VERSION" -a "$VERSION" != "null"
          go mod download -json "github.com/chronicleprotocol/oracle-suite@$VERSION" > "$OUT/module.json"
          DIR=$(jq -r '.Dir' "$OUT/module.json")
          test -d "$DIR"
          cp -a "$DIR/." "$OUT/source/"
          printf 'module=github.com/chronicleprotocol/oracle-suite\nversion=%s\ntransactions_sent=0\npublic_chain_testing=false\n' "$VERSION" > "$OUT/metadata.txt"
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-oracle-suite-latest-source
          path: ${{ runner.temp }}/chronicle-oracle-suite-latest/
          retention-days: 3
          if-no-files-found: error
