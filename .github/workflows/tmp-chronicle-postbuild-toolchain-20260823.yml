name: Temporary Chronicle post-build toolchain export 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-postbuild-toolchain-trigger.txt"
      - ".github/workflows/tmp-chronicle-postbuild-toolchain-20260823.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Chronicle bounty source
        uses: actions/checkout@v4
        with:
          repository: chronicleprotocol/scribe
          ref: a5e0da3a498cb5883502a8fe05e16096254ec3ab
          path: target
          submodules: recursive
          fetch-depth: 1
      - name: Install Foundry nightly
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Build and export post-build toolchain
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-postbuild-toolchain"
          mkdir -p "$OUT/bin" "$OUT/svm" "$OUT/out" "$OUT/cache" "$OUT/logs"
          cd target
          git rev-parse HEAD > "$OUT/target-commit.txt"
          forge --version > "$OUT/forge-version.txt"
          set +e
          set -o pipefail
          forge build --force 2>&1 | tee "$OUT/logs/forge-build.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$OUT/forge-build.exit"
          test "$status" -eq 0
          cp "$(command -v forge)" "$OUT/bin/forge"
          cp "$(command -v cast)" "$OUT/bin/cast"
          cp "$(command -v anvil)" "$OUT/bin/anvil"
          if command -v chisel >/dev/null 2>&1; then cp "$(command -v chisel)" "$OUT/bin/chisel"; fi
          if [ -d "$HOME/.svm" ]; then cp -a "$HOME/.svm/." "$OUT/svm/"; fi
          cp -a out/. "$OUT/out/"
          cp -a cache/. "$OUT/cache/"
          chmod +x "$OUT/bin"/*
          python3 - "$OUT" <<'PY'
          import json,pathlib,sys
          out=pathlib.Path(sys.argv[1])
          obj={
            'target_commit':(out/'target-commit.txt').read_text().strip(),
            'build_exit':int((out/'forge-build.exit').read_text().strip()),
            'solc_files':[str(p.relative_to(out)) for p in sorted((out/'svm').rglob('*')) if p.is_file()],
            'transactions_sent':0,
            'public_chain_testing':False,
          }
          (out/'EXPORT_VERDICT.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
      - name: Upload post-build toolchain
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-postbuild-toolchain-20260823
          path: ${{ runner.temp }}/chronicle-postbuild-toolchain/
          retention-days: 3
          if-no-files-found: error
