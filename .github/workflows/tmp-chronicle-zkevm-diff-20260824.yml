name: Temporary Chronicle cross-EVM signature differential gate 20260824

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-zkevm-diff-trigger.txt"
      - ".github/workflows/tmp-chronicle-zkevm-diff-20260824.yml"

permissions:
  contents: read

jobs:
  zkevm-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact Chronicle Scribe bounty source
        uses: actions/checkout@v4
        with:
          repository: chronicleprotocol/scribe
          ref: a5e0da3a498cb5883502a8fe05e16096254ec3ab
          path: target
          submodules: recursive
          fetch-depth: 1

      - name: Install pinned foundry-zksync v0.1.9
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-zkevm-diff"
          mkdir -p "$OUT"
          URL="https://github.com/matter-labs/foundry-zksync/releases/download/foundry-zksync-v0.1.9/foundry_zksync_v0.1.9_linux_amd64.tar.gz"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/foundry-zksync.tar.gz"
          mkdir -p "$RUNNER_TEMP/foundry-zksync-bin"
          tar -xzf "$RUNNER_TEMP/foundry-zksync.tar.gz" -C "$RUNNER_TEMP/foundry-zksync-bin"
          chmod +x "$RUNNER_TEMP/foundry-zksync-bin"/*
          echo "$RUNNER_TEMP/foundry-zksync-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/foundry-zksync-bin/forge" --version | tee "$OUT/foundry-zksync-version.txt"
          sha256sum "$RUNNER_TEMP/foundry-zksync.tar.gz" > "$OUT/foundry-zksync-archive.sha256"

      - name: Add fixed-vector exact-source differential harness
        shell: bash
        run: |
          set -euo pipefail
          cd target
          cat > test/Round2CrossEvmFixedVectors.t.sol <<'SOL'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.16;

          import {Test} from "forge-std/Test.sol";
          import {Scribe} from "src/Scribe.sol";
          import {IScribe} from "src/IScribe.sol";
          import {LibSchnorr} from "src/libs/LibSchnorr.sol";
          import {LibSecp256k1} from "src/libs/LibSecp256k1.sol";

          contract LibSchnorrHarness {
              using LibSchnorr for LibSecp256k1.Point;
              function verify(
                  LibSecp256k1.Point memory p,
                  bytes32 m,
                  bytes32 s,
                  address c
              ) external pure returns (bool) {
                  return p.verifySignature(m, s, c);
              }
          }

          contract ScribeSeedHarness is Scribe {
              using LibSecp256k1 for LibSecp256k1.Point;
              constructor() Scribe(msg.sender, "ETH/USD") {}
              function seed(uint8 id, LibSecp256k1.Point memory p) external {
                  require(uint8(uint(uint160(p.toAddress())) >> 152) == id);
                  _pubKeys[id] = p;
              }
          }

          contract Round2CrossEvmFixedVectorsTest is Test {
              LibSchnorrHarness internal verifier;

              function setUp() public {
                  verifier = new LibSchnorrHarness();
              }

              function _assertVector(
                  uint x,
                  uint y,
                  bytes32 message,
                  bytes32 signature,
                  address commitment
              ) internal {
                  LibSecp256k1.Point memory p = LibSecp256k1.Point(x, y);
                  assertTrue(verifier.verify(p, message, signature, commitment));
                  assertFalse(verifier.verify(p, message, bytes32(uint(signature) + 1), commitment));
                  assertFalse(verifier.verify(p, message, signature, address(uint160(commitment) ^ 1)));
                  assertFalse(verifier.verify(LibSecp256k1.Point(x, y ^ 1), message, signature, commitment));
              }

              function test_FixedValidAndNegativeVectors() public {
                  _assertVector(
                      89565891926547004231252920425935692360644145829622209833684329913297188986597,
                      12158399299693830322967808612713398636155367887041628176798871954788371653930,
                      0x33a4d6993f2a79b85666ad28b221b61016864d686a1ff487c29040633ae76ae1,
                      0x15920c90768256eb76899599d012d98077f124be494b3f51e57b9f886576edd3,
                      0x30f3e3F59231e158Dd3e846281904a9619cFC4d8
                  );
                  _assertVector(
                      21505829891763648114329055987619236494102133314575206970830385799158076338148,
                      98003708678762621233683240503080860129026887322874138805529884920309963580118,
                      0x3e51d56c58606c61e97f45a6936d230250bf9c071466733f2823c72dc7a10000,
                      0x1e594379b6da12131627419c2eb48940bf42d8ab192f16f8803d12807db10f51,
                      0x70790EfF23958375B8d51bd75A464D98E22bE595
                  );
                  _assertVector(
                      42072772011086351294328511389423850314698152445154323541536957340534349973349,
                      99133657745585934968186133288050721248258413615930917407282740640761199917928,
                      0x037c78396eb50148228e3af8375a4fcad1bdddafb2d79465a55bf6f84289108a,
                      0xc8eea15bbcbc8d93c07fccb3bd24f8d73882accee707dea9461a0689a29c9294,
                      0x3052255F3feA2d3f206dFeBa329608594e5F85A7
                  );
                  _assertVector(
                      8135422981253095627867053328236338379654363492279684577013952862650734523381,
                      96428639260437697058464084371980563319994305932424023166987305905608652704390,
                      0x72e7b482e2b441495bd8b4711f9f77e3a66b477dfb21602ce9121ff51aa14dfb,
                      0x1193ce270e2aa755ba14d69bdeedeebaf005e1b42f222c647d76598a93185737,
                      0xE41B5e7211684beee8349CD63cBFd62CCAf4cd44
                  );
              }

              function test_ScribeOneAndTwoFeedAcceptance() public {
                  ScribeSeedHarness s = new ScribeSeedHarness();
                  LibSecp256k1.Point memory p2 = LibSecp256k1.Point(
                      89565891926547004231252920425935692360644145829622209833684329913297188986597,
                      12158399299693830322967808612713398636155367887041628176798871954788371653930
                  );
                  LibSecp256k1.Point memory p3 = LibSecp256k1.Point(
                      112711660439710606056748659173929673102114977341539408544630613555209775888121,
                      25583027980570883691656905877401976406448868254816295069919888960541586679410
                  );
                  s.seed(43, p2);
                  s.setBar(1);
                  assertTrue(s.isAcceptableSchnorrSignatureNow(
                      0x33a4d6993f2a79b85666ad28b221b61016864d686a1ff487c29040633ae76ae1,
                      IScribe.SchnorrData(
                          0x15920c90768256eb76899599d012d98077f124be494b3f51e57b9f886576edd3,
                          0x30f3e3F59231e158Dd3e846281904a9619cFC4d8,
                          hex"2b"
                      )
                  ));
                  s.seed(104, p3);
                  s.setBar(2);
                  assertTrue(s.isAcceptableSchnorrSignatureNow(
                      0x3e51d56c58606c61e97f45a6936d230250bf9c071466733f2823c72dc7a10000,
                      IScribe.SchnorrData(
                          0x1e594379b6da12131627419c2eb48940bf42d8ab192f16f8803d12807db10f51,
                          0x70790EfF23958375B8d51bd75A464D98E22bE595,
                          hex"2b68"
                      )
                  ));
              }

              function test_HighFeedIdsAndBloomBoundaries() public {
                  ScribeSeedHarness s = new ScribeSeedHarness();
                  s.seed(255, LibSecp256k1.Point(
                      53566794082043239731631458522702919010529639281102255921088692156396552332442,
                      52600923530647757045878761903221944743155065681530260944723915263453709490582
                  ));
                  s.seed(128, LibSecp256k1.Point(
                      106424249689785792809434743491778818298150289868329582003793750155851559913753,
                      49930311026718593748365085023583718822918480166988780383065338740169345896747
                  ));
                  s.setBar(2);
                  IScribe.SchnorrData memory d = IScribe.SchnorrData(
                      0x78b97936046c64e92502285b26cfcdfbf6b7362d24ad737937228ad94017e681,
                      0x3802bCC210e6dff585C2808e09c2A208537754Ab,
                      hex"ff80"
                  );
                  assertTrue(s.isAcceptableSchnorrSignatureNow(
                      0x344a091a62ea69b20bc857768d3c224683eff3b39ed219ddd51d7050435f50ac,
                      d
                  ));
                  d.feedIds = hex"ffff";
                  assertFalse(s.isAcceptableSchnorrSignatureNow(
                      0x344a091a62ea69b20bc857768d3c224683eff3b39ed219ddd51d7050435f50ac,
                      d
                  ));
              }

              function test_EcrecoverBoundarySemantics() public {
                  bytes32 h = 0xc6fb13dbbd9f6e2ffd6f08eb6e794be5b0f7ff70ab1bf976179f278f3585baa3;
                  bytes32 r = bytes32(uint(89565891926547004231252920425935692360644145829622209833684329913297188986597));
                  bytes32 s = bytes32(uint(54667901849455189736696558442858576019481466411467428024683808318142889309223));
                  assertEq(ecrecover(h, 27, r, s), 0x6239b700472b7Cb44edf1820300066e984Ebd1bA);
                  assertEq(ecrecover(h, 26, r, s), address(0));
                  assertEq(ecrecover(h, 29, r, s), address(0));
                  assertEq(ecrecover(h, 27, bytes32(0), s), address(0));
                  assertEq(ecrecover(h, 27, r, bytes32(0)), address(0));
                  assertEq(ecrecover(h, 27, r, bytes32(LibSecp256k1.Q())), address(0));
              }
          }
          SOL

      - name: Run exact-source zkEVM build and tests
        shell: bash
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/chronicle-zkevm-diff"
          cd target
          git rev-parse HEAD > "$OUT/target-commit.txt"
          set +e
          forge build --zksync --force 2>&1 | tee "$OUT/zk-build.log"
          build_rc=${PIPESTATUS[0]}
          forge test --zksync --match-contract Round2CrossEvmFixedVectorsTest -vvv 2>&1 | tee "$OUT/zk-tests.log"
          test_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$build_rc" > "$OUT/zk-build.exit"
          printf '%s\n' "$test_rc" > "$OUT/zk-tests.exit"
          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          build=int((out/'zk-build.exit').read_text())
          test=int((out/'zk-tests.exit').read_text())
          obj={
            'target_commit':(out/'target-commit.txt').read_text().strip(),
            'foundry_zksync_version':(out/'foundry-zksync-version.txt').read_text().strip(),
            'zk_build_exit':build,
            'zk_test_exit':test,
            'cross_evm_acceptance_differential_found': test != 0,
            'transactions_sent':0,
            'verdict':'PASS_NO_DIFFERENTIAL' if build==0 and test==0 else 'REVIEW_FAILURE'
          }
          (out/'VERDICT.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY

      - name: Integrity and artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-zkevm-diff"
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-zkevm-signature-differential-20260824
          path: ${{ runner.temp }}/chronicle-zkevm-diff/
          retention-days: 3
          if-no-files-found: error
