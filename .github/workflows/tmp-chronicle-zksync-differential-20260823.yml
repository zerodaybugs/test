name: Temporary Chronicle zkSync differential gate 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-zksync-trigger-20260823.txt"
      - ".github/workflows/tmp-chronicle-zksync-differential-20260823.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact in-scope Chronicle source
        uses: actions/checkout@v4
        with:
          repository: chronicleprotocol/scribe
          ref: a5e0da3a498cb5883502a8fe05e16096254ec3ab
          path: target
          submodules: recursive
          fetch-depth: 1

      - name: Install foundry-zksync v0.1.9
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-zksync"
          mkdir -p "$OUT/bin" "$OUT/logs"
          URL="https://github.com/matter-labs/foundry-zksync/releases/download/foundry-zksync-v0.1.9/foundry_zksync_v0.1.9_linux_amd64.tar.gz"
          curl -fL --retry 3 "$URL" -o "$OUT/foundry_zksync.tar.gz"
          tar -xzf "$OUT/foundry_zksync.tar.gz" -C "$OUT/bin"
          chmod +x "$OUT/bin/forge" "$OUT/bin/cast"
          echo "$OUT/bin" >> "$GITHUB_PATH"
          "$OUT/bin/forge" --version | tee "$OUT/logs/forge-version.txt"
          "$OUT/bin/cast" --version | tee "$OUT/logs/cast-version.txt"

      - name: Create isolated in-scope differential harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/zktest
          cat > target/zktest/ChronicleEvmDifferential.t.sol <<'SOL'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.16;

          import {Test} from "forge-std/Test.sol";
          import {IToll} from "chronicle-std/toll/IToll.sol";
          import {IScribe} from "src/IScribe.sol";
          import {Scribe} from "src/Scribe.sol";
          import {LibFeed} from "script/libs/LibFeed.sol";
          import {LibSchnorr} from "src/libs/LibSchnorr.sol";
          import {LibSecp256k1} from "src/libs/LibSecp256k1.sol";

          contract ChronicleEvmDifferentialTest is Test {
              using LibFeed for LibFeed.Feed;
              using LibFeed for LibFeed.Feed[];
              using LibSchnorr for LibSecp256k1.Point;

              uint internal constant Q =
                  0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141;

              function _uniqueFeeds(uint count)
                  internal
                  returns (LibFeed.Feed[] memory feeds)
              {
                  feeds = new LibFeed.Feed[](count);
                  uint bloom;
                  uint key = 2;
                  uint found;
                  while (found < count) {
                      LibFeed.Feed memory feed = LibFeed.newFeed({privKey: key++});
                      uint mask = uint(1) << feed.id;
                      if (bloom & mask != 0) continue;
                      bloom |= mask;
                      feeds[found++] = feed;
                  }
              }

              function _configuredScribe(uint count)
                  internal
                  returns (Scribe scribe, LibFeed.Feed[] memory feeds)
              {
                  scribe = new Scribe(address(this), "ETH/USD");
                  feeds = _uniqueFeeds(count);
                  bytes32 registration = scribe.feedRegistrationMessage();
                  for (uint i; i < feeds.length; ++i) {
                      scribe.lift(
                          feeds[i].pubKey,
                          feeds[i].signECDSA(registration)
                      );
                  }
                  scribe.setBar(uint8(count));
                  IToll(address(scribe)).kiss(address(this));
              }

              function _signedPoke(
                  Scribe scribe,
                  LibFeed.Feed[] memory feeds,
                  uint128 value
              ) internal returns (IScribe.PokeData memory, IScribe.SchnorrData memory) {
                  IScribe.PokeData memory pokeData = IScribe.PokeData({
                      val: value,
                      age: uint32(block.timestamp)
                  });
                  IScribe.SchnorrData memory data =
                      feeds.signSchnorr(scribe.constructPokeMessage(pokeData));
                  return (pokeData, data);
              }

              function test_ValidSingleSignerSchnorrAccepted() public {
                  LibFeed.Feed memory feed = LibFeed.newFeed({privKey: 2});
                  bytes32 message = keccak256("chronicle-zksync-valid");
                  IScribe.SchnorrData memory data = feed.signSchnorr(message);
                  assertTrue(
                      feed.pubKey.verifySignature(
                          message, data.signature, data.commitment
                      )
                  );
              }

              function test_FullThreeSignerPokeAcceptedAndStored() public {
                  (Scribe scribe, LibFeed.Feed[] memory feeds) =
                      _configuredScribe(3);
                  vm.warp(1_700_000_000);
                  (IScribe.PokeData memory pokeData, IScribe.SchnorrData memory data) =
                      _signedPoke(scribe, feeds, 2_345e18);
                  scribe.poke(pokeData, data);
                  (uint value, uint age) = scribe.readWithAge();
                  assertEq(value, pokeData.val);
                  assertEq(age, block.timestamp);
              }

              function test_OptimizedLowSelectorPokeAccepted() public {
                  (Scribe scribe, LibFeed.Feed[] memory feeds) =
                      _configuredScribe(3);
                  vm.warp(1_700_000_001);
                  (IScribe.PokeData memory pokeData, IScribe.SchnorrData memory data) =
                      _signedPoke(scribe, feeds, 2_346e18);
                  scribe.poke_optimized_7136211(pokeData, data);
                  (uint value,) = scribe.readWithAge();
                  assertEq(value, pokeData.val);
              }

              function test_FeedIdZeroIsNotTruncated() public {
                  Scribe scribe = new Scribe(address(this), "ETH/USD");
                  LibFeed.Feed memory feed;
                  for (uint key = 2; key < 20_000; ++key) {
                      LibFeed.Feed memory candidate = LibFeed.newFeed({privKey: key});
                      if (candidate.id == 0) {
                          feed = candidate;
                          break;
                      }
                  }
                  assertEq(feed.id, 0);
                  scribe.lift(
                      feed.pubKey,
                      feed.signECDSA(scribe.feedRegistrationMessage())
                  );
                  scribe.setBar(1);
                  IToll(address(scribe)).kiss(address(this));
                  vm.warp(1_700_000_002);
                  LibFeed.Feed[] memory feeds = new LibFeed.Feed[](1);
                  feeds[0] = feed;
                  (IScribe.PokeData memory pokeData, IScribe.SchnorrData memory data) =
                      _signedPoke(scribe, feeds, 2_347e18);
                  assertEq(data.feedIds.length, 1);
                  assertEq(uint8(data.feedIds[0]), 0);
                  scribe.poke(pokeData, data);
                  (uint value,) = scribe.readWithAge();
                  assertEq(value, pokeData.val);
              }

              function test_EcrecoverAcceptsHighSLikeEthereum() public {
                  uint privateKey = 0xA11CE;
                  bytes32 digest = keccak256("chronicle-high-s");
                  (uint8 v, bytes32 r, bytes32 lowS) = vm.sign(privateKey, digest);
                  address expected = vm.addr(privateKey);
                  assertEq(ecrecover(digest, v, r, lowS), expected);
                  uint highSValue = Q - uint(lowS);
                  uint8 flippedV = v == 27 ? 28 : 27;
                  assertEq(
                      ecrecover(digest, flippedV, r, bytes32(highSValue)),
                      expected
                  );
              }

              function test_EcrecoverRejectsSAtOrAboveQ() public {
                  bytes32 digest = keccak256("chronicle-range");
                  (, bytes32 r,) = vm.sign(2, digest);
                  assertEq(ecrecover(digest, 27, r, bytes32(Q)), address(0));
                  assertEq(ecrecover(digest, 28, r, bytes32(Q)), address(0));
              }
          }
          SOL

      - name: Run vanilla and zkSync differential tests
        shell: bash
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/chronicle-zksync"
          cd target
          git rev-parse HEAD | tee "$OUT/logs/target-commit.txt"
          set +e
          FOUNDRY_TEST=zktest forge test --match-contract ChronicleEvmDifferentialTest -vvv 2>&1 | tee "$OUT/logs/focused-vanilla.log"
          vanilla_rc=${PIPESTATUS[0]}
          FOUNDRY_TEST=zktest forge test --zksync --match-contract ChronicleEvmDifferentialTest -vvv 2>&1 | tee "$OUT/logs/focused-zksync.log"
          zksync_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$vanilla_rc" > "$OUT/logs/focused-vanilla.exit"
          printf '%s\n' "$zksync_rc" > "$OUT/logs/focused-zksync.exit"

          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          def rc(name):
              return int((out/'logs'/name).read_text().strip())
          result = {
              'target_commit': (out/'logs'/'target-commit.txt').read_text().strip(),
              'vanilla_exit': rc('focused-vanilla.exit'),
              'zksync_exit': rc('focused-zksync.exit'),
              'transactions_sent': 0,
          }
          result['all_pass'] = result['vanilla_exit'] == 0 and result['zksync_exit'] == 0
          result['differential'] = result['vanilla_exit'] != result['zksync_exit']
          (out/'RESULT.json').write_text(json.dumps(result, indent=2)+'\n')
          (out/'RESULT.md').write_text(
              '# Chronicle isolated zkSync differential gate\n\n' +
              '\n'.join(f'- {k}: `{v}`' for k,v in result.items()) + '\n'
          )
          PY

      - name: Integrity manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-zksync"
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-zksync-differential-20260823-r3
          path: ${{ runner.temp }}/chronicle-zksync/
          retention-days: 3
          if-no-files-found: error
