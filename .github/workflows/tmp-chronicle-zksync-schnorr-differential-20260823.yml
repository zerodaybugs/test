name: Temporary Chronicle ZKsync Schnorr differential gate 20260823

on:
  pull_request:
    branches: [main]
    paths:
      - "tmp-chronicle-zksync-trigger-20260823.txt"
      - ".github/workflows/tmp-chronicle-zksync-schnorr-differential-20260823.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact Chronicle Scribe v2 source
        uses: actions/checkout@v4
        with:
          repository: chronicleprotocol/scribe
          ref: a5e0da3a498cb5883502a8fe05e16096254ec3ab
          submodules: recursive
          path: scribe
          fetch-depth: 1

      - name: Install vanilla Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install official foundry-zksync v0.1.10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundry-zksync"
          curl -fL --retry 3 \
            https://github.com/matter-labs/foundry-zksync/releases/download/foundry-zksync-v0.1.10/foundry_zksync_v0.1.10_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/foundry-zksync.tar.gz"
          tar -xzf "$RUNNER_TEMP/foundry-zksync.tar.gz" -C "$RUNNER_TEMP/foundry-zksync"
          mv "$RUNNER_TEMP/foundry-zksync/forge" "$RUNNER_TEMP/foundry-zksync/forge-zksync"
          chmod +x "$RUNNER_TEMP/foundry-zksync/forge-zksync"
          "$RUNNER_TEMP/foundry-zksync/forge-zksync" --version

      - name: Prepare isolated exact-source harness
        shell: bash
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/chronicle-zk-diff"
          OUT="$RUNNER_TEMP/chronicle-zk-results"
          mkdir -p "$H/src" "$H/test" "$H/script/libs" "$H/lib" "$OUT"
          cp -a scribe/src/. "$H/src/"
          cp -a scribe/lib/chronicle-std "$H/lib/"
          cp -a scribe/lib/forge-std "$H/lib/"
          cp scribe/script/libs/LibFeed.sol "$H/script/libs/"
          cp scribe/script/libs/LibSchnorrExtended.sol "$H/script/libs/"
          cp scribe/script/libs/LibSecp256k1Extended.sol "$H/script/libs/"
          git -C scribe rev-parse HEAD > "$OUT/target-commit.txt"
          forge --version > "$OUT/vanilla-forge-version.txt"
          "$RUNNER_TEMP/foundry-zksync/forge-zksync" --version > "$OUT/zksync-forge-version.txt"

          cat > "$H/remappings.txt" <<'EOF'
          forge-std/=lib/forge-std/src/
          ds-test/=lib/forge-std/lib/ds-test/src/
          chronicle-std/=lib/chronicle-std/src/
          EOF

          cat > "$H/foundry.toml" <<'EOF'
          [profile.default]
          src = 'src'
          test = 'test'
          out = 'out'
          libs = ['lib']
          solc_version = '0.8.16'
          optimizer = false
          via_ir = false
          ffi = false
          block_timestamp = 1680220800
          fuzz = { runs = 2048 }
          
          [profile.default.zksync]
          zksolc = '1.5.15'
          EOF

          cat > "$H/test/ChronicleZkDifferential.t.sol" <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.16;

          import {Test} from "forge-std/Test.sol";
          import {Scribe} from "src/Scribe.sol";
          import {IScribe} from "src/IScribe.sol";
          import {LibSecp256k1} from "src/libs/LibSecp256k1.sol";
          import {LibSchnorr} from "src/libs/LibSchnorr.sol";
          import {LibFeed} from "script/libs/LibFeed.sol";

          contract ChronicleZkDifferentialTest is Test {
              using LibFeed for LibFeed.Feed;
              using LibFeed for LibFeed.Feed[];
              using LibSchnorr for LibSecp256k1.Point;

              uint256 constant Q = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141;
              Scribe internal scribe;

              function setUp() public {
                  scribe = new Scribe(address(this), "ETH/USD");
                  scribe.kiss(address(this));
              }

              function _feeds(uint8 count) internal returns (LibFeed.Feed[] memory fs) {
                  fs = new LibFeed.Feed[](count);
                  uint256 key = 2;
                  uint256 seen;
                  uint256 n;
                  while (n < count) {
                      LibFeed.Feed memory f = LibFeed.newFeed(key++);
                      uint256 mask = uint256(1) << f.id;
                      if (seen & mask == 0) {
                          seen |= mask;
                          fs[n++] = f;
                          scribe.lift(f.pubKey, f.signECDSA(scribe.feedRegistrationMessage()));
                      }
                  }
                  scribe.setBar(count);
              }

              function test_ecrecover_boundary_matrix() public pure {
                  bytes32 h = keccak256("chronicle-ecrecover-boundary");
                  bytes32 r = bytes32(uint256(1));
                  bytes32 s = bytes32(uint256(1));
                  assertEq(ecrecover(h, 27, bytes32(0), s), address(0));
                  assertEq(ecrecover(h, 28, bytes32(0), s), address(0));
                  assertEq(ecrecover(h, 27, bytes32(Q), s), address(0));
                  assertEq(ecrecover(h, 28, bytes32(Q), s), address(0));
                  assertEq(ecrecover(h, 27, r, bytes32(0)), address(0));
                  assertEq(ecrecover(h, 28, r, bytes32(0)), address(0));
                  assertEq(ecrecover(h, 27, r, bytes32(Q)), address(0));
                  assertEq(ecrecover(h, 28, r, bytes32(Q)), address(0));
                  assertEq(ecrecover(h, 26, r, s), address(0));
                  assertEq(ecrecover(h, 29, r, s), address(0));
              }

              function testFuzz_valid_ecdsa_and_high_s(uint256 keySeed, bytes32 h) public {
                  uint256 key = bound(keySeed, 1, Q - 1);
                  (uint8 v, bytes32 r, bytes32 s) = vm.sign(key, h);
                  address signer = vm.addr(key);
                  assertEq(ecrecover(h, v, r, s), signer);
                  uint256 highS = Q - uint256(s);
                  uint8 flippedV = v == 27 ? 28 : 27;
                  assertEq(ecrecover(h, flippedV, r, bytes32(highS)), signer);
              }

              function testFuzz_single_valid_and_mutations(uint256 keySeed, bytes32 message) public {
                  uint256 key = bound(keySeed, 1, Q - 1);
                  LibFeed.Feed memory f = LibFeed.newFeed(key);
                  (uint256 sigRaw, address commitment) = _signSingle(f, message);
                  assertTrue(f.pubKey.verifySignature(message, bytes32(sigRaw), commitment));
                  assertFalse(f.pubKey.verifySignature(bytes32(uint256(message) ^ 1), bytes32(sigRaw), commitment));
                  assertFalse(f.pubKey.verifySignature(message, bytes32(sigRaw ^ 1), commitment));
                  assertFalse(f.pubKey.verifySignature(message, bytes32(sigRaw), address(uint160(commitment) ^ 1)));
              }

              function _signSingle(LibFeed.Feed memory f, bytes32 message)
                  internal
                  returns (uint256 sigRaw, address commitment)
              {
                  IScribe.SchnorrData memory sd = f.signSchnorr(message);
                  return (uint256(sd.signature), sd.commitment);
              }

              function testFuzz_multisig_valid_and_mutations(uint8 countSeed, uint128 val, uint32 ageSeed) public {
                  uint8 count = uint8(bound(countSeed, 1, 8));
                  LibFeed.Feed[] memory fs = _feeds(count);
                  uint32 age = uint32(bound(ageSeed, 1, block.timestamp));
                  IScribe.PokeData memory p = IScribe.PokeData({val: val, age: age});
                  bytes32 m = scribe.constructPokeMessage(p);
                  IScribe.SchnorrData memory sd = fs.signSchnorr(m);
                  assertTrue(scribe.isAcceptableSchnorrSignatureNow(m, sd));

                  IScribe.SchnorrData memory bad = sd;
                  bad.signature = bytes32(uint256(sd.signature) ^ 1);
                  assertFalse(scribe.isAcceptableSchnorrSignatureNow(m, bad));

                  bad = sd;
                  bad.commitment = address(uint160(sd.commitment) ^ 1);
                  assertFalse(scribe.isAcceptableSchnorrSignatureNow(m, bad));

                  assertFalse(scribe.isAcceptableSchnorrSignatureNow(bytes32(uint256(m) ^ 1), sd));
              }

              function testFuzz_feed_order_permutation(uint128 val, uint32 ageSeed) public {
                  LibFeed.Feed[] memory fs = _feeds(4);
                  uint32 age = uint32(bound(ageSeed, 1, block.timestamp));
                  IScribe.PokeData memory p = IScribe.PokeData({val: val, age: age});
                  bytes32 m = scribe.constructPokeMessage(p);
                  IScribe.SchnorrData memory sd = fs.signSchnorr(m);
                  assertTrue(scribe.isAcceptableSchnorrSignatureNow(m, sd));
                  bytes memory ids = sd.feedIds;
                  (ids[0], ids[3]) = (ids[3], ids[0]);
                  (ids[1], ids[2]) = (ids[2], ids[1]);
                  sd.feedIds = ids;
                  assertTrue(scribe.isAcceptableSchnorrSignatureNow(m, sd));
              }

              function test_malformed_calldata_rejected() public {
                  bytes memory selectorOnly = abi.encodePacked(Scribe.poke.selector);
                  (bool ok,) = address(scribe).call(selectorOnly);
                  assertFalse(ok);

                  bytes memory shortCall = abi.encodePacked(Scribe.poke.selector, bytes32(0));
                  (ok,) = address(scribe).call(shortCall);
                  assertFalse(ok);

                  bytes memory optimizedSelectorOnly = abi.encodePacked(bytes4(0x00000082));
                  (ok,) = address(scribe).call(optimizedSelectorOnly);
                  assertFalse(ok);
              }
          }
          EOF

      - name: Run vanilla EVM matrix
        shell: bash
        run: |
          set +e
          set -o pipefail
          H="$RUNNER_TEMP/chronicle-zk-diff"
          OUT="$RUNNER_TEMP/chronicle-zk-results"
          cd "$H"
          FOUNDRY_FUZZ_RUNS=2048 forge test -vvv 2>&1 | tee "$OUT/vanilla.log"
          echo "${PIPESTATUS[0]}" > "$OUT/vanilla.exit"
          exit 0

      - name: Run official ZKsync EraVM matrix
        shell: bash
        run: |
          set +e
          set -o pipefail
          H="$RUNNER_TEMP/chronicle-zk-diff"
          OUT="$RUNNER_TEMP/chronicle-zk-results"
          cd "$H"
          FOUNDRY_FUZZ_RUNS=2048 "$RUNNER_TEMP/foundry-zksync/forge-zksync" test --zksync -vvv 2>&1 | tee "$OUT/zksync.log"
          echo "${PIPESTATUS[0]}" > "$OUT/zksync.exit"
          exit 0

      - name: Build differential verdict
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chronicle-zk-results"
          python3 - "$OUT" <<'PY'
          import hashlib, json, pathlib, re, sys
          out = pathlib.Path(sys.argv[1])
          ve = int((out/'vanilla.exit').read_text().strip())
          ze = int((out/'zksync.exit').read_text().strip())
          vl = (out/'vanilla.log').read_text(errors='replace')
          zl = (out/'zksync.log').read_text(errors='replace')
          def suites(text):
              passed = sum(int(x) for x in re.findall(r'(\d+) tests passed', text))
              failed = sum(int(x) for x in re.findall(r'(\d+) failed', text))
              return {'passed_tokens':passed,'failed_tokens':failed}
          result = {
              'target_commit': (out/'target-commit.txt').read_text().strip(),
              'vanilla_exit': ve,
              'zksync_exit': ze,
              'vanilla_summary': suites(vl),
              'zksync_summary': suites(zl),
              'false_acceptance_candidate': ze != 0 and ve == 0,
              'both_pass': ve == 0 and ze == 0,
              'transactions_sent': 0,
              'public_chain_testing': False,
          }
          (out/'VERDICT.json').write_text(json.dumps(result,indent=2)+'\n')
          lines=['# Chronicle EVM / ZKsync Schnorr differential','',f"- Vanilla exit: `{ve}`",f"- ZKsync exit: `{ze}`",f"- Both pass: `{result['both_pass']}`",f"- False-acceptance candidate: `{result['false_acceptance_candidate']}`",'- Transactions sent: `0`']
          (out/'VERDICT.md').write_text('\n'.join(lines)+'\n')
          for p in out.iterdir():
              if p.is_file() and p.name != 'SHA256SUMS.txt':
                  pass
          with (out/'SHA256SUMS.txt').open('w') as f:
              for p in sorted(x for x in out.iterdir() if x.is_file() and x.name!='SHA256SUMS.txt'):
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n")
          PY

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-zksync-schnorr-differential-20260823
          path: ${{ runner.temp }}/chronicle-zk-results/
          retention-days: 3
          if-no-files-found: error
