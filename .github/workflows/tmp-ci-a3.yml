name: Temporary isolated validation a3

on:
  push:
    branches:
      - tmp-ci-20260815-a3
    paths:
      - ".github/workflows/tmp-ci-a3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-ci-20260815-a3
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout relay repository
        uses: actions/checkout@v4

      - name: Install repository build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version

      - name: Generate one-time runner key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runner-public"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out "$RUNNER_TEMP/runner-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/runner-private.pem" -pubout \
            -out "$RUNNER_TEMP/runner-public/runner-public.pem" >/dev/null 2>&1
          chmod 600 "$RUNNER_TEMP/runner-private.pem"
          sha256sum "$RUNNER_TEMP/runner-public/runner-public.pem" \
            > "$RUNNER_TEMP/runner-public/runner-public.pem.sha256"

      - name: Publish runner public key
        uses: actions/upload-artifact@v4
        with:
          name: runner-public-key-a3
          path: ${{ runner.temp }}/runner-public/
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/secure-ci-a3"
          found=0
          for _ in $(seq 1 240); do
            p=$(curl -sS -o "$RUNNER_TEMP/payload.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/payload.enc.b64?ref=${GITHUB_REF_NAME}")
            k=$(curl -sS -o "$RUNNER_TEMP/key.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/payload.key.enc.b64?ref=${GITHUB_REF_NAME}")
            s=$(curl -sS -o "$RUNNER_TEMP/sums.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/payload.SHA256SUMS.txt?ref=${GITHUB_REF_NAME}")
            if [[ "$p" == 200 && "$k" == 200 && "$s" == 200 ]]; then
              jq -r '.content' "$RUNNER_TEMP/payload.json" | tr -d '\n' | base64 -d \
                > "$RUNNER_TEMP/payload.enc.b64"
              jq -r '.content' "$RUNNER_TEMP/key.json" | tr -d '\n' | base64 -d \
                > "$RUNNER_TEMP/payload.key.enc.b64"
              jq -r '.content' "$RUNNER_TEMP/sums.json" | tr -d '\n' | base64 -d \
                > "$RUNNER_TEMP/payload.SHA256SUMS.txt"
              base64 -d "$RUNNER_TEMP/payload.enc.b64" > "$RUNNER_TEMP/payload.enc"
              base64 -d "$RUNNER_TEMP/payload.key.enc.b64" > "$RUNNER_TEMP/payload.key.enc"
              found=1
              break
            fi
            sleep 5
          done
          [[ "$found" == 1 ]]
          cd "$RUNNER_TEMP"
          sha256sum -c payload.SHA256SUMS.txt
          test -s payload.enc
          test -s payload.key.enc

      - name: Decrypt and execute payload
        shell: bash
        env:
          SECURE_RESULT_DIR: ${{ runner.temp }}/secure-result
        run: |
          set -u
          mkdir -p "$SECURE_RESULT_DIR" "$RUNNER_TEMP/payload"
          rc=0
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/runner-private.pem" \
            -in "$RUNNER_TEMP/payload.key.enc" \
            -out "$RUNNER_TEMP/payload.pass" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            >"$SECURE_RESULT_DIR/relay.stdout.log" \
            2>"$SECURE_RESULT_DIR/relay.stderr.log" || rc=10
          if [[ "$rc" == 0 ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "$RUNNER_TEMP/payload.enc" \
              -out "$RUNNER_TEMP/payload.tar.gz" \
              -pass file:"$RUNNER_TEMP/payload.pass" || rc=11
          fi
          if [[ "$rc" == 0 ]]; then gzip -t "$RUNNER_TEMP/payload.tar.gz" || rc=12; fi
          if [[ "$rc" == 0 ]]; then
            tar -tzf "$RUNNER_TEMP/payload.tar.gz" | \
              awk 'BEGIN{bad=0} /^\//{bad=1} /(^|\/)\.\.($|\/)/{bad=1} END{exit bad}' || rc=13
          fi
          if [[ "$rc" == 0 ]]; then
            tar -xzf "$RUNNER_TEMP/payload.tar.gz" \
              -C "$RUNNER_TEMP/payload" --no-same-owner --no-same-permissions || rc=14
          fi
          if [[ "$rc" == 0 && ! -f "$RUNNER_TEMP/payload/run.sh" ]]; then rc=15; fi
          if [[ "$rc" == 0 ]]; then
            chmod +x "$RUNNER_TEMP/payload/run.sh"
            set +e
            bash "$RUNNER_TEMP/payload/run.sh" \
              >"$SECURE_RESULT_DIR/driver.stdout.log" \
              2>"$SECURE_RESULT_DIR/driver.stderr.log"
            rc=$?
            set -e
          fi
          printf '%s\n' "$rc" > "$SECURE_RESULT_DIR/driver.exit"
          printf 'run_id=%s\ncommit=%s\nbranch=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            > "$SECURE_RESULT_DIR/relay.env"
          exit 0

      - name: Encrypt result for researcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secure-result" "$RUNNER_TEMP/encrypted-result"
          tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/secure-result" .
          openssl rand -hex 32 > "$RUNNER_TEMP/result.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/result.tar.gz" \
            -out "$RUNNER_TEMP/encrypted-result/result.enc" \
            -pass file:"$RUNNER_TEMP/result.pass"
          openssl pkeyutl -encrypt -pubin \
            -inkey secure-ci-a3/researcher-public.pem \
            -in "$RUNNER_TEMP/result.pass" \
            -out "$RUNNER_TEMP/encrypted-result/result.key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum "$RUNNER_TEMP/encrypted-result/result.enc" \
            "$RUNNER_TEMP/encrypted-result/result.key.enc" \
            > "$RUNNER_TEMP/encrypted-result/SHA256SUMS.txt"

      - name: Upload encrypted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-result-a3
          path: ${{ runner.temp }}/encrypted-result/
          if-no-files-found: error
          retention-days: 1
