name: Temporary isolated ICP validation icp13

on:
  push:
    branches: [tmp-ci-20260817-icp13]
    paths:
      - ".github/workflows/tmp-ci-icp13.yml"
      - "secure-ci-icp13/bootstrap.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-ci-20260817-icp13
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev pkg-config cmake clang lld libssl-dev libunwind-dev libdw-dev liblzma-dev libzstd-dev ripgrep gzip
      - name: Generate runner key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runner-public"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/runner-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/runner-private.pem" -pubout -out "$RUNNER_TEMP/runner-public/runner-public.pem" >/dev/null 2>&1
          sha256sum "$RUNNER_TEMP/runner-public/runner-public.pem" > "$RUNNER_TEMP/runner-public/runner-public.pem.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: runner-public-key-icp13
          path: ${{ runner.temp }}/runner-public/
          retention-days: 1
      - name: Wait for payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/secure-ci-icp13"
          for _ in $(seq 1 3000); do
            a=$(curl -sS -o "$RUNNER_TEMP/a.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/payload.enc.b64?ref=${GITHUB_REF_NAME}")
            b=$(curl -sS -o "$RUNNER_TEMP/b.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/payload.key.enc.b64?ref=${GITHUB_REF_NAME}")
            if [[ "$a" == 200 && "$b" == 200 ]]; then
              jq -r '.content' "$RUNNER_TEMP/a.json" | tr -d '\n' | base64 -d | base64 -d > "$RUNNER_TEMP/payload.enc"
              jq -r '.content' "$RUNNER_TEMP/b.json" | tr -d '\n' | base64 -d | base64 -d > "$RUNNER_TEMP/payload.key.enc"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Execute payload
        shell: bash
        env:
          SECURE_RESULT_DIR: ${{ runner.temp }}/secure-result
        run: |
          set -euo pipefail
          mkdir -p "$SECURE_RESULT_DIR" "$RUNNER_TEMP/payload"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/runner-private.pem" -in "$RUNNER_TEMP/payload.key.enc" -out "$RUNNER_TEMP/pass" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/payload.enc" -out "$RUNNER_TEMP/payload.tar.gz" -pass file:"$RUNNER_TEMP/pass"
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C "$RUNNER_TEMP/payload" --no-same-owner --no-same-permissions
          chmod 700 "$RUNNER_TEMP/payload/run.sh"
          set +e
          bash "$RUNNER_TEMP/payload/run.sh" >"$SECURE_RESULT_DIR/driver.stdout.log" 2>"$SECURE_RESULT_DIR/driver.stderr.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$SECURE_RESULT_DIR/driver.exit"
      - name: Encrypt result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted-result" "$RUNNER_TEMP/secure-result"
          tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/secure-result" .
          openssl rand -hex 32 > "$RUNNER_TEMP/result.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/result.tar.gz" -out "$RUNNER_TEMP/encrypted-result/result.enc" -pass file:"$RUNNER_TEMP/result.pass"
          openssl pkeyutl -encrypt -pubin -inkey secure-ci-icp13/researcher-public.pem -in "$RUNNER_TEMP/result.pass" -out "$RUNNER_TEMP/encrypted-result/result.key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum "$RUNNER_TEMP/encrypted-result/result.enc" "$RUNNER_TEMP/encrypted-result/result.key.enc" > "$RUNNER_TEMP/encrypted-result/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-result-icp13
          path: ${{ runner.temp }}/encrypted-result/
          retention-days: 1
