name: Temporary ICP14 generic-run discovery

on:
  push:
    branches:
      - tmp-ci-20260818-icp14
    paths:
      - ".github/workflows/tmp-ci-icp14-generic-discovery.yml"
      - "trigger-icp14-generic-discovery-**"

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish latest generic validation run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tmp-ci-icp14.yml/runs?branch=${GITHUB_REF_NAME}&per_page=10"
          for _ in $(seq 1 60); do
            curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$runs_api" > "$RUNNER_TEMP/runs.json"
            run_id=$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/runs.json")
            if [[ -n "$run_id" ]]; then
              printf '%s\n' "$run_id" > "$RUNNER_TEMP/generic-run-id.txt"
              break
            fi
            sleep 2
          done
          test -s "$RUNNER_TEMP/generic-run-id.txt"
          path="secure-ci-icp14/generic-run-id.txt"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          content=$(base64 -w0 < "$RUNNER_TEMP/generic-run-id.txt")
          code=$(curl -sS -o "$RUNNER_TEMP/get.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}?ref=${GITHUB_REF_NAME}")
          if [[ "$code" == 200 ]]; then
            sha=$(jq -r '.sha' "$RUNNER_TEMP/get.json")
            jq -n --arg message 'ci: publish latest ICP14 generic run id' --arg content "$content" --arg branch "$GITHUB_REF_NAME" --arg sha "$sha" '{message:$message,content:$content,branch:$branch,sha:$sha}' > "$RUNNER_TEMP/put.json"
          else
            jq -n --arg message 'ci: publish latest ICP14 generic run id' --arg content "$content" --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > "$RUNNER_TEMP/put.json"
          fi
          curl -fsS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" --data-binary @"$RUNNER_TEMP/put.json" >/dev/null
