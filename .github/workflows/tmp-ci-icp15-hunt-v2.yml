name: Temporary isolated ICP15 security hunt v2

on:
  push:
    branches:
      - tmp-ci-20260818-icp15
    paths:
      - ".github/workflows/tmp-ci-icp15-hunt-v2.yml"
      - "secure-ci-icp15/hunt.py"
      - "secure-ci-icp15/researcher-public.pem"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ci-20260818-icp15

      - name: Publish workflow run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > secure-ci-icp15/run-id-v2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secure-ci-icp15/run-id-v2.txt
          git commit -m 'ci: publish ICP15 hunt run id' || true
          git push origin HEAD:tmp-ci-20260818-icp15

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends git ripgrep jq openssl python3 tar gzip

      - name: Clone current DFINITY IC high-value source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/dfinity/ic.git "$RUNNER_TEMP/ic"
          cd "$RUNNER_TEMP/ic"
          git sparse-checkout set \
            rs/bitcoin/ckbtc \
            rs/ethereum/cketh \
            rs/ledger_suite \
            rs/nns/governance \
            rs/sns/governance \
            rs/nns/cmc \
            rs/nns/handlers/root \
            rs/nns/sns-wasm \
            rs/sns/root \
            rs/sns/swap \
            rs/execution_environment \
            rs/cycles_account_manager \
            rs/consensus \
            rs/registry \
            rs/crypto \
            rs/rosetta-api
          mkdir -p "$RUNNER_TEMP/result"
          git rev-parse HEAD > "$RUNNER_TEMP/result/IC_HEAD.txt"
          git log -1 --format='%H%n%cI%n%s' > "$RUNNER_TEMP/result/IC_HEAD_META.txt"

      - name: Run authority and rollback scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 secure-ci-icp15/hunt.py

      - name: Collect targeted source transitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ic"
          rg -n -i 'TODO|FIXME|BUG:|should never|must not|double (mint|spend|refund)|idempot|quarantin|rollback|reimburse|refund' \
            rs/bitcoin/ckbtc rs/ethereum/cketh rs/ledger_suite rs/nns/governance rs/sns/governance rs/nns/cmc rs/sns/swap \
            --glob '*.rs' | head -n 7000 > "$RUNNER_TEMP/result/TARGETED_GREP.txt" || true
          rg -n '\.remove\(|set_last|update_last|last_.*=|next_.*=|mark_|record_|process_event|quarantin' \
            rs/bitcoin/ckbtc rs/ethereum/cketh rs/ledger_suite rs/nns/governance rs/sns/governance rs/nns/cmc rs/sns/swap \
            --glob '*.rs' | head -n 10000 > "$RUNNER_TEMP/result/STATE_TRANSITIONS.txt" || true
          rg -n '\.(await|try_send|transfer|call|send)|sign_with|ecdsa_public_key|get_utxos|get_logs|get_transaction_receipt' \
            rs/bitcoin/ckbtc rs/ethereum/cketh rs/ledger_suite rs/nns/cmc rs/sns/swap \
            --glob '*.rs' | head -n 10000 > "$RUNNER_TEMP/result/EXTERNAL_CALLS.txt" || true

      - name: Encrypt result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted" "$RUNNER_TEMP/result"
          tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/result" .
          openssl rand -hex 32 > "$RUNNER_TEMP/result.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/result.tar.gz" \
            -out "$RUNNER_TEMP/encrypted/result.enc" \
            -pass file:"$RUNNER_TEMP/result.pass"
          openssl pkeyutl -encrypt -pubin \
            -inkey secure-ci-icp15/researcher-public.pem \
            -in "$RUNNER_TEMP/result.pass" \
            -out "$RUNNER_TEMP/encrypted/result.key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum "$RUNNER_TEMP/encrypted/result.enc" "$RUNNER_TEMP/encrypted/result.key.enc" \
            > "$RUNNER_TEMP/encrypted/SHA256SUMS.txt"

      - name: Upload encrypted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-result-icp15-hunt-v2
          path: ${{ runner.temp }}/encrypted/
          if-no-files-found: error
          retention-days: 1
