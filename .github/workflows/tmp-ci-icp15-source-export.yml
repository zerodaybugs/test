name: Temporary ICP15 encrypted source export

on:
  push:
    branches:
      - tmp-ci-20260818-icp15
    paths:
      - ".github/workflows/tmp-ci-icp15-source-export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ci-20260818-icp15

      - name: Publish workflow run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > secure-ci-icp15/source-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secure-ci-icp15/source-run-id.txt
          git commit -m 'ci: publish ICP15 source-export run id' || true
          git push origin HEAD:tmp-ci-20260818-icp15

      - name: Clone current DFINITY IC source subset
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/dfinity/ic.git "$RUNNER_TEMP/ic"
          cd "$RUNNER_TEMP/ic"
          git sparse-checkout set \
            packages/icrc-ledger-client \
            packages/icrc-ledger-client-cdk \
            packages/icrc-ledger-types \
            rs/bitcoin/ckbtc \
            rs/ethereum/cketh \
            rs/ledger_suite \
            rs/nns/governance \
            rs/sns/governance \
            rs/nns/cmc \
            rs/nns/handlers/root \
            rs/nns/sns-wasm \
            rs/sns/root \
            rs/sns/swap \
            rs/execution_environment \
            rs/cycles_account_manager
          git rev-parse HEAD > IC_HEAD.txt
          git log -1 --format='%H%n%cI%n%s' > IC_HEAD_META.txt
          tar --exclude=.git -czf "$RUNNER_TEMP/source.tar.gz" \
            Cargo.toml Cargo.lock MODULE.bazel WORKSPACE.bazel IC_HEAD.txt IC_HEAD_META.txt \
            packages/icrc-ledger-client packages/icrc-ledger-client-cdk packages/icrc-ledger-types \
            rs/bitcoin/ckbtc rs/ethereum/cketh rs/ledger_suite rs/nns/governance rs/sns/governance \
            rs/nns/cmc rs/nns/handlers/root rs/nns/sns-wasm rs/sns/root rs/sns/swap \
            rs/execution_environment rs/cycles_account_manager

      - name: Encrypt source subset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted"
          openssl rand -hex 32 > "$RUNNER_TEMP/source.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/source.tar.gz" \
            -out "$RUNNER_TEMP/encrypted/source.enc" \
            -pass file:"$RUNNER_TEMP/source.pass"
          openssl pkeyutl -encrypt -pubin \
            -inkey secure-ci-icp15/researcher-public.pem \
            -in "$RUNNER_TEMP/source.pass" \
            -out "$RUNNER_TEMP/encrypted/source.key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum "$RUNNER_TEMP/encrypted/source.enc" "$RUNNER_TEMP/encrypted/source.key.enc" \
            > "$RUNNER_TEMP/encrypted/SHA256SUMS.txt"

      - name: Upload encrypted source subset
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-source-icp15
          path: ${{ runner.temp }}/encrypted/
          if-no-files-found: error
          retention-days: 1
