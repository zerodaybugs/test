name: Temporary isolated ICP validation icp9

on:
  push:
    branches: [tmp-ci-20260817-icp9]
    paths:
      - ".github/workflows/tmp-ci-icp9.yml"
      - "secure-ci-icp9/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-ci-20260817-icp9
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev pkg-config cmake clang lld libssl-dev libunwind-dev libdw-dev liblzma-dev libzstd-dev ripgrep
      - name: Run isolated analysis
        shell: bash
        env:
          SECURE_RESULT_DIR: ${{ runner.temp }}/secure-result
        run: |
          set -euo pipefail
          mkdir -p "$SECURE_RESULT_DIR"
          chmod 700 secure-ci-icp9/run.sh
          set +e
          bash secure-ci-icp9/run.sh >"$SECURE_RESULT_DIR/driver.stdout.log" 2>"$SECURE_RESULT_DIR/driver.stderr.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$SECURE_RESULT_DIR/driver.exit"
          printf 'run_id=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$SECURE_RESULT_DIR/relay.env"
      - name: Encrypt result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/secure-result"
          mkdir -p "$result_dir" "$RUNNER_TEMP/encrypted-result"
          test -f "$result_dir/driver.exit" || printf 'driver did not start\n' > "$result_dir/relay_failure.txt"
          tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$result_dir" .
          openssl rand -hex 32 > "$RUNNER_TEMP/result.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/result.tar.gz" \
            -out "$RUNNER_TEMP/encrypted-result/result.enc" \
            -pass file:"$RUNNER_TEMP/result.pass"
          openssl pkeyutl -encrypt -pubin \
            -inkey secure-ci-icp9/researcher-public.pem \
            -in "$RUNNER_TEMP/result.pass" \
            -out "$RUNNER_TEMP/encrypted-result/result.key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum "$RUNNER_TEMP/encrypted-result/result.enc" "$RUNNER_TEMP/encrypted-result/result.key.enc" > "$RUNNER_TEMP/encrypted-result/SHA256SUMS.txt"
      - name: Upload encrypted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-result-icp9
          path: ${{ runner.temp }}/encrypted-result/
          if-no-files-found: error
          retention-days: 1
