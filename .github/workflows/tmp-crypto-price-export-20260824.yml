name: Temporary crypto price snapshot 2026-08-24

on:
  push:
    paths:
      - .github/workflows/tmp-crypto-price-export-20260824.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public USD price snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          url='https://api.coingecko.com/api/v3/simple/price?ids=ethereum,binancecoin,avalanche-2,polygon-ecosystem-token,sonic-3,fantom,crypto-com-chain,conflux-token,mantle,metis-token,sei-network,apecoin,iotex,zeta-chain,okb,wrapped-bitcoin&vs_currencies=usd&include_last_updated_at=true'
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            -H 'accept: application/json' "$url" -o artifact/prices.json
          python3 - <<'PY'
          import json,time,pathlib
          p=pathlib.Path('artifact/prices.json')
          d=json.loads(p.read_text())
          assert d and all('usd' in v for v in d.values())
          pathlib.Path('artifact/captured_at_utc.txt').write_text(time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())+'\n')
          PY
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: public-crypto-usd-price-snapshot-20260824
          path: artifact
          retention-days: 1
          if-no-files-found: error
