name: Temporary current Solana protocol surface census push 20260806

on:
  push:
    branches:
      - tmp/current-solana-protocol-surface-census-20260806
    paths:
      - .github/workflows/tmp-current-solana-protocol-surface-census-push-20260806.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-current-solana-protocol-surface-census-push-20260806.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read finalized public account surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work evidence
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 >/dev/null
          cat > census.cjs <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const {Connection,Keypair,PublicKey}=require('@solana/web3.js');
          const sdk=require('@velocity-exchange/sdk');

          const PROGRAM=new PublicKey(Buffer.from('dkVMb0MxYXVkWWJTWVZSWG4xdlBhVjhBeG9hOW9VNkJZbU5HWlpCRFoxUA==','base64').toString());
          const EXPECTED_PD=Buffer.from('SGtSZjM2anZVQjMyZG5IakhxcE1uUGNLSmhVUDJUVUtKVEg3UkRUaWZKbTc=','base64').toString();
          const EXPECTED_DEPLOYMENT_SLOT=435978201;
          const EXPECTED_ELF='1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80';
          const RPCS=['https://moltnode.ag/solana','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com','https://api.mainnet-beta.solana.com','https://solana.drpc.org','https://1rpc.io/solana'];
          const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const norm=v=>{
            if(v===null||v===undefined)return v;
            if(typeof v==='bigint')return v.toString();
            if(v?.constructor?.name==='BN')return v.toString(10);
            if(typeof v?.toBase58==='function')return v.toBase58();
            if(Buffer.isBuffer(v)||v instanceof Uint8Array)return Buffer.from(v).toString('hex');
            if(Array.isArray(v))return v.map(norm);
            if(typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,norm(x)]));
            return v;
          };
          const name=x=>Buffer.from(x||[]).toString('utf8').replace(/\0/g,'').trim();
          const tokenAmount=data=>data&&data.length>=72?data.readBigUInt64LE(64).toString():null;
          function elfSize(data){
            if(data.length<64||data.subarray(0,4).toString('hex')!=='7f454c46'||data[4]!==2||data[5]!==1)throw new Error('NOT_ELF64LE');
            const phoff=Number(data.readBigUInt64LE(0x20)),shoff=Number(data.readBigUInt64LE(0x28));
            const eh=data.readUInt16LE(0x34),phe=data.readUInt16LE(0x36),phn=data.readUInt16LE(0x38),she=data.readUInt16LE(0x3a),shn=data.readUInt16LE(0x3c);let max=Math.max(64,eh);
            if(phoff&&phe&&phn){max=Math.max(max,phoff+phe*phn);for(let i=0;i<phn;i++){const o=phoff+i*phe;max=Math.max(max,Number(data.readBigUInt64LE(o+8)+data.readBigUInt64LE(o+32)));}}
            if(shoff&&she&&shn){max=Math.max(max,shoff+she*shn);for(let i=0;i<shn;i++){const o=shoff+i*she;if(data.readUInt32LE(o+4)!==8)max=Math.max(max,Number(data.readBigUInt64LE(o+24)+data.readBigUInt64LE(o+32)));}}
            if(max>data.length)throw new Error('ELF_EXTENT');return max;
          }
          const positive=v=>{try{return BigInt(v||0)>0n}catch{return false}};

          (async()=>{
            let connection,endpoint,finalizedSlot,last;
            for(const url of RPCS){try{const c=new Connection(url,'finalized');const s=await c.getSlot('finalized');connection=c;endpoint=url;finalizedSlot=s;break;}catch(e){last=String(e);}}
            if(!connection)throw new Error('RPC_UNAVAILABLE '+last);
            const pi=await connection.getAccountInfo(PROGRAM,'finalized');if(!pi)throw new Error('PROGRAM_MISSING');
            const pd=new PublicKey(pi.data.subarray(4,36));const pdi=await connection.getAccountInfo(pd,'finalized');if(!pdi)throw new Error('PROGRAMDATA_MISSING');
            const deploymentSlot=Number(Buffer.from(pdi.data).readBigUInt64LE(4));const payload=Buffer.from(pdi.data).subarray(45);const canonical=payload.subarray(0,elfSize(payload));
            const deployment={programId:PROGRAM.toBase58(),programData:pd.toBase58(),programDataMatches:pd.toBase58()===EXPECTED_PD,deploymentSlot,deploymentSlotMatches:deploymentSlot===EXPECTED_DEPLOYMENT_SLOT,canonicalElfBytes:canonical.length,canonicalElfSha256:sha256(canonical),canonicalElfMatches:sha256(canonical)===EXPECTED_ELF,rpcEndpoint:endpoint,finalizedSlot};

            const wallet=new sdk.Wallet(Keypair.generate());
            const client=new sdk.VelocityClient({connection,wallet,programID:PROGRAM,skipLoadUsers:true,opts:{commitment:'finalized',preflightCommitment:'finalized'}});
            const a=client.program.account;
            const fetchAll=async key=>a[key]&&typeof a[key].all==='function'?await a[key].all():[];
            const [spots,perps,lpPools,constituents,ammCaches,mappings,revenueShares,revenueEscrows,ifStakes,users,userStats]=await Promise.all([
              fetchAll('spotMarket'),fetchAll('perpMarket'),fetchAll('lpPool'),fetchAll('constituent'),fetchAll('ammCache'),fetchAll('ammConstituentMapping'),fetchAll('revenueShare'),fetchAll('revenueShareEscrow'),fetchAll('insuranceFundStake'),fetchAll('user'),fetchAll('userStats')
            ]);
            const vaultKeys=[];for(const {account} of spots){vaultKeys.push(account.vault,account.insuranceFund.vault);}
            const vaultInfos=await connection.getMultipleAccountsInfo(vaultKeys,'finalized');
            const vaultMap=new Map(vaultKeys.map((k,i)=>[k.toBase58(),vaultInfos[i]?tokenAmount(Buffer.from(vaultInfos[i].data)):null]));
            const spotRows=spots.map(({publicKey,account})=>({publicKey:publicKey.toBase58(),marketIndex:Number(account.marketIndex),name:name(account.name),mint:account.mint.toBase58(),vault:account.vault.toBase58(),vaultAmount:vaultMap.get(account.vault.toBase58()),insuranceVault:account.insuranceFund.vault.toBase58(),insuranceVaultAmount:vaultMap.get(account.insuranceFund.vault.toBase58()),insuranceFund:norm(account.insuranceFund),ifLastSettleVaultAmount:norm(account.ifLastSettleVaultAmount),revenuePool:norm(account.revenuePool),protocolFeePool:norm(account.protocolFeePool),status:norm(account.status),pausedOperations:Number(account.pausedOperations),ifPausedOperations:Number(account.ifPausedOperations)}));
            const perpRows=perps.map(({publicKey,account})=>({publicKey:publicKey.toBase58(),marketIndex:Number(account.marketIndex),name:name(account.name),status:norm(account.status),feeLedger:norm(account.feeLedger),pnlPool:norm(account.pnlPool),protocolFeePool:norm(account.protocolFeePool),feePoolBufferTarget:norm(account.feePoolBufferTarget),bankruptcyIfFloorPct:Number(account.bankruptcyIfFloorPct),pendingRevenueShare:norm(account.pendingRevenueShare),lpPoolId:Number(account.lpPoolId),lpStatus:Number(account.lpStatus),lpPausedOperations:Number(account.lpPausedOperations)}));
            const ifStakeRows=ifStakes.map(({account})=>({marketIndex:Number(account.marketIndex),ifShares:norm(account.ifShares),ifBase:norm(account.ifBase),lastWithdrawRequestShares:norm(account.lastWithdrawRequestShares),lastWithdrawRequestValue:norm(account.lastWithdrawRequestValue)}));
            const aggregateIfStakeByMarket={};for(const r of ifStakeRows){const k=String(r.marketIndex);if(!aggregateIfStakeByMarket[k])aggregateIfStakeByMarket[k]={count:0,shares:'0',pendingRequests:0};aggregateIfStakeByMarket[k].count++;aggregateIfStakeByMarket[k].shares=(BigInt(aggregateIfStakeByMarket[k].shares)+BigInt(r.ifShares||0)).toString();if(positive(r.lastWithdrawRequestShares))aggregateIfStakeByMarket[k].pendingRequests++;}
            const pendingFeeLedgers=perpRows.filter(x=>positive(x.feeLedger?.pendingProtocolFee)||positive(x.feeLedger?.pendingIfFee)||positive(x.feeLedger?.pendingAmmProvision));
            const out={capturedAt:new Date().toISOString(),deployment,counts:{spots:spots.length,perps:perps.length,lpPools:lpPools.length,constituents:constituents.length,ammCaches:ammCaches.length,ammConstituentMappings:mappings.length,revenueShares:revenueShares.length,revenueEscrows:revenueEscrows.length,insuranceFundStakes:ifStakes.length,users:users.length,userStats:userStats.length},spotMarkets:spotRows,perpMarkets:perpRows,lpPools:lpPools.map(x=>norm(x.account)),constituents:constituents.map(x=>norm(x.account)),ammCaches:ammCaches.map(x=>norm(x.account)),ammConstituentMappings:mappings.map(x=>norm(x.account)),aggregateIfStakeByMarket,pendingFeeLedgers,releaseGates:{deploymentExact:deployment.programDataMatches&&deployment.deploymentSlotMatches&&deployment.canonicalElfMatches,vlpCurrentlyActive:lpPools.length>0||constituents.length>0||mappings.length>0,feeLedgerPendingMaterial:pendingFeeLedgers.length>0,revenueShareCurrentlyActive:revenueShares.length>0||revenueEscrows.length>0},publicChainTransactions:0,transactionsConstructed:0,transactionsSigned:0,transactionsSent:0};
            fs.writeFileSync('../evidence/CURRENT_SURFACE_CENSUS.json',JSON.stringify(out,null,2)+'\n');
            fs.writeFileSync('../evidence/SUMMARY.json',JSON.stringify({capturedAt:out.capturedAt,deployment:out.deployment,counts:out.counts,releaseGates:out.releaseGates,aggregateIfStakeByMarket:out.aggregateIfStakeByMarket,pendingFeeLedgers:out.pendingFeeLedgers,publicChainTransactions:0},null,2)+'\n');
            console.log(JSON.stringify({capturedAt:out.capturedAt,deployment:out.deployment,counts:out.counts,releaseGates:out.releaseGates,aggregateIfStakeByMarket:out.aggregateIfStakeByMarket,pendingFeeLedgers:out.pendingFeeLedgers,publicChainTransactions:0},null,2));
          })().catch(e=>{const out={status:'FAIL',error:String(e?.stack||e),publicChainTransactions:0};fs.writeFileSync('../evidence/SUMMARY.json',JSON.stringify(out,null,2)+'\n');console.error(out.error);process.exit(1);});
          NODE
          node census.cjs

      - name: Manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('evidence');rows=[]
          for p in sorted(r.glob('*')):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (r/'MANIFEST.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-solana-protocol-surface-census-${{ github.run_id }}
          path: evidence
          retention-days: 1
          if-no-files-found: error
