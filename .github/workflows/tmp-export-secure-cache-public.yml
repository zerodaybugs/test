name: Temporary export encrypted-runner public key

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-export-secure-cache-public.yml'
      - 'tmp-secure/export-public.trigger'

permissions:
  contents: read

jobs:
  export-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Restore existing one-time private key cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/katana-secure-private.pem
          key: katana-secure-poc-key-56fe0ca7762997ce47d5ae1706bf8af29cbc71202b28c498
          fail-on-cache-miss: true
      - name: Derive public key only
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/katana-secure-private.pem
          mkdir -p public-output
          openssl pkey -in /tmp/katana-secure-private.pem -pubout \
            -out public-output/runner-input-public.pem
          openssl pkey -pubin -in public-output/runner-input-public.pem -text -noout \
            > public-output/runner-input-public-info.txt
          sha256sum public-output/* > public-output/SHA256SUMS
          rm -f /tmp/katana-secure-private.pem
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-runner-input-public-key-${{ github.run_id }}
          path: public-output/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
