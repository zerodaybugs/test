name: Temporary Hermetica PR171-current source bundle

on:
  pull_request:
    branches: [main]
    paths: ['tmp-hermetica-pr171-current-trigger.txt']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone reviewed-baseline and current public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/hermetica-fi/hermetica-contracts.git baseline
          git -C baseline checkout --quiet --detach 09393e69a57db59e071b622d3e8cb7dfb5fcc426
          git clone --quiet --filter=blob:none --no-tags https://github.com/hermetica-fi/hermetica-contracts.git current
          git -C current checkout --quiet --detach 5e13e431f69dd840fe297791fa2a73d9993a27e0
          rm -rf baseline/.git current/.git
          printf '%s\n' 09393e69a57db59e071b622d3e8cb7dfb5fcc426 > BASELINE_HEAD
          printf '%s\n' 5e13e431f69dd840fe297791fa2a73d9993a27e0 > CURRENT_HEAD
          tar -czf hermetica-pr171-and-current.tar.gz baseline current BASELINE_HEAD CURRENT_HEAD
          sha256sum hermetica-pr171-and-current.tar.gz > SHA256SUMS
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-pr171-current-${{ github.run_id }}
          path: |
            hermetica-pr171-and-current.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
