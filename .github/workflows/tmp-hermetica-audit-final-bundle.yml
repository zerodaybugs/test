name: Temporary Hermetica audit-final source bundle

on:
  pull_request:
    branches: [main]
    paths: ['tmp-hermetica-audit-final-trigger.txt']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone audited and current public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/hermetica-fi/hermetica-contracts.git audited
          git -C audited checkout --quiet --detach 135b453e1b9c4bc4784640f99cac49f9532d4bff
          git clone --quiet --filter=blob:none --no-tags https://github.com/hermetica-fi/hermetica-contracts.git current
          git -C current checkout --quiet --detach 5e13e431f69dd840fe297791fa2a73d9993a27e0
          rm -rf audited/.git current/.git
          printf '%s\n' 135b453e1b9c4bc4784640f99cac49f9532d4bff > AUDITED_HEAD
          printf '%s\n' 5e13e431f69dd840fe297791fa2a73d9993a27e0 > CURRENT_HEAD
          tar -czf hermetica-audit-final-and-current.tar.gz audited current AUDITED_HEAD CURRENT_HEAD
          sha256sum hermetica-audit-final-and-current.tar.gz > SHA256SUMS
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-audit-final-current-${{ github.run_id }}
          path: |
            hermetica-audit-final-and-current.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
