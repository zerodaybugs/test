name: Temporary Hermetica final live gates

on:
  pull_request:
    branches: [main]
    paths: ['tmp-hermetica-final-live-gates-trigger.txt']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect final read-only role, allowlist and Zest v0-4 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/v0-4-market
          npm init -y >/dev/null 2>&1
          npm install --silent @stacks/transactions@7.2.0
          cat > fetch.mjs <<'JS'
          import { Cl, cvToHex, hexToCV, cvToString } from '@stacks/transactions';
          import fs from 'node:fs';
          const API='https://api.hiro.so', ZERO='SP000000000000000000002Q6VF78';
          const H='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const Z='SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7';
          const U='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const S='SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4';
          const roleAddresses=['SM1QXYXZG78DCWJZJKY0901KTK3350071W9YYRPMT','SP1C72K3FP2VCMW6814TGPG2Q07A54597WW6HB1YR','SP20V8SG811G6CT2QMZQNX6XCN20YAX36DYD1BAE0','SP292YFARYZZ46EJY8GYRPN94Q1Q7DEBJ2QF7AA6F','SP2AS467J369H67HK3TS2TDH1YB0XNN7YZ8M7FM1B'];
          const roles=['guardian','trader','rewarder','manager','fee-setter','protocol'];
          const externals=[`${Z}.v0-3-market`,`${Z}.v0-4-market`,`${Z}.v0-vault-sbtc`,`${Z}.v0-vault-usdh`,`${U}.staking-v1`,`${U}.staking-v1-1`,`${U}.staking-silo-v1`,`${U}.staking-silo-v1-1`,`${U}.minting-auto-v1-2`];
          const assets=[`${S}.sbtc-token`,`${U}.usdh-token-v1`,`${U}.susdh-token-v1`,`${Z}.v0-vault-sbtc`,`${Z}.v0-vault-usdh`];
          const hbtcZest=`${H}.zest-interface-hbtc-v1`;
          const out={generatedAt:new Date().toISOString(),constants:{H,Z,U,S,hbtcZest},queries:{}};
          async function call(addr,name,fn,args=[]){const r=await fetch(`${API}/v2/contracts/call-read/${addr}/${name}/${fn}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({sender:ZERO,arguments:args.map(cvToHex)})});const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};const x={http:r.status,body};if(body&&typeof body==='object'&&typeof body.result==='string'){try{x.decoded=cvToString(hexToCV(body.result))}catch(e){x.decodeError=String(e)}}return x}
          async function get(url){const r=await fetch(url,{headers:{accept:'application/json'}});const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};return{http:r.status,body}}
          async function q(k,p){try{out.queries[k]=await p}catch(e){out.queries[k]={error:String(e),stack:e?.stack}}}
          for(const a of roleAddresses) for(const role of roles) await q(`role.${role}.${a}`,call(H,'hq-v1',`get-${role}`,[Cl.principal(a)]));
          for(const e of externals) await q(`external.${e}`,call(H,'state-hbtc-v1','get-external',[Cl.principal(e)]));
          for(const a of assets) await q(`asset.${a}`,call(H,'state-hbtc-v1','get-asset',[Cl.principal(a)]));
          await q('zest.marketVault.impl',call(Z,'v0-market-vault','get-impl'));
          await q('zest.position.resolve',call(Z,'v0-market-vault','resolve-safe',[Cl.principal(hbtcZest)]));
          await q('zest.position.full',call(Z,'v0-market-vault','get-position',[Cl.principal(hbtcZest),Cl.uint((1n<<128n)-1n)]));
          await q('zest.v04.pause',call(Z,'v0-4-market','get-pause-liquidation'));
          await q('zest.v04.graceEnd',call(Z,'v0-4-market','get-liquidation-grace-end'));
          await q('zest.v04.source',get(`${API}/v2/contracts/source/${Z}/v0-4-market?proof=0`));
          await q('zest.v04.interface',get(`${API}/v2/contracts/interface/${Z}/v0-4-market`));
          await q('zest.v04.balances',get(`${API}/extended/v1/address/${Z}.v0-4-market/balances`));
          await q('hbtc.trading.history',get(`${API}/extended/v1/address/${H}.trading-hbtc-v1/transactions?limit=50&offset=0`));
          fs.writeFileSync('evidence/final-live-gates.json',JSON.stringify(out,null,2));
          const src=out.queries['zest.v04.source']?.body?.source;
          if(src) fs.writeFileSync('evidence/v0-4-market/v0-4-market.clar',src);
          fs.writeFileSync('evidence/v0-4-market/interface.json',JSON.stringify(out.queries['zest.v04.interface'],null,2));
          JS
          node fetch.mjs
          sha256sum evidence/final-live-gates.json evidence/v0-4-market/* > evidence/SHA256SUMS
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-final-live-gates-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
