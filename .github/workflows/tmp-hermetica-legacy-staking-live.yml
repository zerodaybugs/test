name: Temporary Hermetica legacy staking live gate

on:
  pull_request:
    branches: [main]
    paths: ['tmp-hermetica-legacy-staking-trigger.txt']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect read-only legacy staking state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm init -y >/dev/null 2>&1
          npm install --silent @stacks/transactions@7.2.0
          cat > fetch.mjs <<'JS'
          import { Cl, cvToHex, hexToCV, cvToString } from '@stacks/transactions';
          import fs from 'node:fs';
          const API='https://api.hiro.so';
          const ZERO='SP000000000000000000002Q6VF78';
          const A='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const names=['staking-v1','staking-silo-v1','staking-v1-1','staking-silo-v1-1','staking-reserve-v1','staking-state-v1'];
          const out={generatedAt:new Date().toISOString(),address:A,queries:{}};
          const arg=cv=>cvToHex(cv);
          async function call(contract,fn,args=[]){
            const r=await fetch(`${API}/v2/contracts/call-read/${A}/${contract}/${fn}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({sender:ZERO,arguments:args.map(arg)})});
            const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};const x={http:r.status,body};
            if(body&&typeof body==='object'&&typeof body.result==='string'){try{x.decoded=cvToString(hexToCV(body.result))}catch(e){x.decodeError=String(e)}}return x;
          }
          async function get(url){const r=await fetch(url);const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};const x={http:r.status,body};if(body&&typeof body==='object'&&typeof body.data==='string'){try{x.decoded=cvToString(hexToCV(body.data))}catch(e){x.decodeError=String(e)}}return x}
          async function q(k,p){try{out.queries[k]=await p}catch(e){out.queries[k]={error:String(e),stack:e?.stack}}}
          for(const n of names){
            const p=`${A}.${n}`;
            await q(`hq.contractActive.${n}`,call('hq-v1','get-contract-active',[Cl.principal(p)]));
            await q(`hq.minting.${n}`,call('hq-v1','get-minting-contract',[Cl.principal(p)]));
            await q(`usdh.balance.${n}`,call('usdh-token-v1','get-balance',[Cl.principal(p)]));
            await q(`susdh.balance.${n}`,call('susdh-token-v1','get-balance',[Cl.principal(p)]));
          }
          await q('old.ratio',call('staking-v1','get-usdh-per-susdh'));
          await q('new.ratio',call('staking-v1-1','get-usdh-per-susdh'));
          await q('old.initialized',get(`${API}/v2/data_var/${A}/staking-v1/initialized?proof=0`));
          await q('usdh.migrationStart',get(`${API}/v2/data_var/${A}/usdh-token-v1/migration-start-height?proof=0`));
          await q('susdh.migrationStart',get(`${API}/v2/data_var/${A}/susdh-token-v1/migration-start-height?proof=0`));
          await q('old.source',get(`${API}/v2/contracts/source/${A}/staking-v1?proof=0`));
          await q('old.interface',get(`${API}/v2/contracts/interface/${A}/staking-v1`));
          fs.writeFileSync('evidence/legacy-staking-live.json',JSON.stringify(out,null,2));
          JS
          node fetch.mjs
          sha256sum evidence/legacy-staking-live.json > evidence/SHA256SUMS
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-legacy-staking-live-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
