name: Temporary Hermetica same-tip reconciliation

on:
  pull_request:
    branches: [main]
    paths: ['tmp-hermetica-reconciliation-trigger.txt']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect same-tip accounting and physical balances
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm init -y >/dev/null 2>&1
          npm install --silent @stacks/transactions@7.2.0
          cat > fetch.mjs <<'JS'
          import { Cl, cvToHex, hexToCV, cvToString } from '@stacks/transactions';
          import fs from 'node:fs';
          const API='https://api.hiro.so', ZERO='SP000000000000000000002Q6VF78';
          const H='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const SB='SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4';
          const U='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const principals=['reserve-hbtc-v1','reserve-fund-hbtc-v1','vault-hbtc-v1','vault-hbtc-v1-1','vault-hbtc-v1-2','fee-collector-hbtc-v1','airdrop-v1','hermetica-interface-hbtc-v1','zest-interface-hbtc-v1','trading-hbtc-v1'];
          const out={generatedAt:new Date().toISOString(),queries:{}};
          async function get(url){const r=await fetch(url);const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};return{http:r.status,body}}
          async function call(a,n,f,args=[]){const r=await fetch(`${API}/v2/contracts/call-read/${a}/${n}/${f}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({sender:ZERO,arguments:args.map(cvToHex)})});const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};const x={http:r.status,body};if(body&&typeof body==='object'&&typeof body.result==='string'){try{x.decoded=cvToString(hexToCV(body.result))}catch(e){x.decodeError=String(e)}}return x}
          async function q(k,p){try{out.queries[k]=await p}catch(e){out.queries[k]={error:String(e),stack:e?.stack}}}
          await q('chain.info',get(`${API}/v2/info`));
          for(const f of ['get-total-assets','get-net-assets','get-pending','get-share-price','get-deposit-cap','get-fees','get-reserve-rate','get-max-reward','get-max-deviation','get-last-log-ts','get-claim-id']) await q(`state.${f}`,call(H,'state-hbtc-v1',f));
          await q('hbtc.totalSupply',call(H,'token-hbtc','get-total-supply'));
          for(const n of principals){const p=`${H}.${n}`;await q(`sbtc.${n}`,call(SB,'sbtc-token','get-balance',[Cl.principal(p)]));await q(`sbtcAvailable.${n}`,call(SB,'sbtc-token','get-balance-available',[Cl.principal(p)]));await q(`hbtc.${n}`,call(H,'token-hbtc','get-balance',[Cl.principal(p)]));await q(`usdh.${n}`,call(U,'usdh-token-v1','get-balance',[Cl.principal(p)]));await q(`susdh.${n}`,call(U,'susdh-token-v1','get-balance',[Cl.principal(p)]));}
          fs.writeFileSync('evidence/same-tip-reconciliation.json',JSON.stringify(out,null,2));
          JS
          node fetch.mjs
          sha256sum evidence/same-tip-reconciliation.json > evidence/SHA256SUMS
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-same-tip-reconciliation-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
