name: Temporary Hermetica full role graph

on:
  pull_request:
    branches: [main]
    paths: ['tmp-hermetica-role-graph-trigger.txt']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect read-only role graph and contract histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm init -y >/dev/null 2>&1
          npm install --silent @stacks/transactions@7.2.0
          cat > fetch.mjs <<'JS'
          import { Cl, cvToHex, hexToCV, cvToString } from '@stacks/transactions';
          import fs from 'node:fs';
          const API='https://api.hiro.so';
          const ZERO='SP000000000000000000002Q6VF78';
          const A='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const names=['hq-v1','blacklist-v1','token-hbtc','state-hbtc-v1','reserve-fund-hbtc-v1','reserve-hbtc-v1','controller-hbtc-v1','fee-collector-hbtc-v1','hermetica-interface-hbtc-v1','zest-interface-hbtc-v1','trading-hbtc-v1','vault-hbtc-v1','vault-hbtc-v1-1','vault-hbtc-v1-2','airdrop-v1'];
          const roles=['guardian','trader','rewarder','manager','fee-setter','protocol'];
          const out={generatedAt:new Date().toISOString(),address:A,queries:{},histories:{}};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function call(fn,args=[]){
            const r=await fetch(`${API}/v2/contracts/call-read/${A}/hq-v1/${fn}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({sender:ZERO,arguments:args.map(cvToHex)})});
            const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};const x={http:r.status,body};
            if(body&&typeof body==='object'&&typeof body.result==='string'){try{x.decoded=cvToString(hexToCV(body.result))}catch(e){x.decodeError=String(e)}}return x;
          }
          async function get(url){const r=await fetch(url);const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};return{http:r.status,body}}
          for(const n of names){
            const p=`${A}.${n}`;
            for(const role of roles){
              out.queries[`${role}.${n}`]=await call(`get-${role}`,[Cl.principal(p)]);
              await sleep(850);
            }
          }
          out.queries.owner=await call('get-owner'); await sleep(850);
          out.queries.nextOwner=await call('get-next-owner'); await sleep(850);
          out.queries.timelock=await call('get-timelock'); await sleep(850);
          out.queries.nextTimelock=await call('get-next-timelock');
          for(const c of ['hq-v1','state-hbtc-v1','trading-hbtc-v1']){
            out.histories[c]=await get(`${API}/extended/v1/address/${A}.${c}/transactions?limit=50&offset=0`);
          }
          fs.writeFileSync('evidence/full-role-graph.json',JSON.stringify(out,null,2));
          JS
          node fetch.mjs
          sha256sum evidence/full-role-graph.json > evidence/SHA256SUMS
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-full-role-graph-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
