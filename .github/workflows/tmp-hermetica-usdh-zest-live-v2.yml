name: Temporary Hermetica USDh and Zest live state v2

on:
  pull_request:
    branches: [main]
    paths: ['tmp-hermetica-usdh-zest-trigger.txt']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect exact read-only state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm init -y >/dev/null 2>&1
          npm install --silent @stacks/transactions@7.2.0
          cat > fetch.mjs <<'JS'
          import { Cl, cvToHex, hexToCV, cvToString } from '@stacks/transactions';
          import fs from 'node:fs';

          const API='https://api.hiro.so';
          const ZERO='SP000000000000000000002Q6VF78';
          const USDH='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const HBTC='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const ZEST='SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7';
          const P={
            stakingReserve:`${USDH}.staking-reserve-v1`,
            hbtcReserve:`${HBTC}.reserve-hbtc-v1`,
            hbtcHermetica:`${HBTC}.hermetica-interface-hbtc-v1`,
            hbtcZest:`${HBTC}.zest-interface-hbtc-v1`,
          };
          const MAX=(1n<<128n)-1n;
          const out={generatedAt:new Date().toISOString(),constants:{USDH,HBTC,ZEST,...P},queries:{}};
          const arg=cv=>cvToHex(cv);
          async function call(address,name,fn,args=[]){
            const r=await fetch(`${API}/v2/contracts/call-read/${address}/${name}/${fn}`,{
              method:'POST',headers:{'content-type':'application/json','accept':'application/json'},
              body:JSON.stringify({sender:ZERO,arguments:args.map(arg)})});
            const text=await r.text(); let body; try{body=JSON.parse(text)}catch{body=text}
            const x={http:r.status,body};
            if(body&&typeof body==='object'&&typeof body.result==='string'){
              try{x.decoded=cvToString(hexToCV(body.result))}catch(e){x.decodeError=String(e)}
            }
            return x;
          }
          async function get(url){const r=await fetch(url);const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text};return{http:r.status,body}}
          async function q(key,promise){try{out.queries[key]=await promise}catch(e){out.queries[key]={error:String(e),stack:e?.stack}}}

          await q('chain.info',get(`${API}/v2/info`));
          for(const [k,c,n,f,a] of [
            ['staking.ratio',USDH,'staking-v1-1','get-usdh-per-susdh',[]],
            ['usdh.totalSupply',USDH,'usdh-token-v1','get-total-supply',[]],
            ['usdh.stakingReserve',USDH,'usdh-token-v1','get-balance',[Cl.principal(P.stakingReserve)]],
            ['usdh.hbtcReserve',USDH,'usdh-token-v1','get-balance',[Cl.principal(P.hbtcReserve)]],
            ['usdh.hbtcHermetica',USDH,'usdh-token-v1','get-balance',[Cl.principal(P.hbtcHermetica)]],
            ['susdh.totalSupply',USDH,'susdh-token-v1','get-total-supply',[]],
            ['susdh.hbtcReserve',USDH,'susdh-token-v1','get-balance',[Cl.principal(P.hbtcReserve)]],
            ['susdh.hbtcHermetica',USDH,'susdh-token-v1','get-balance',[Cl.principal(P.hbtcHermetica)]],
            ['controller.lastLog',USDH,'controller-v1-1','get-last-log-block-height',[]],
            ['controller.window',USDH,'controller-v1-1','get-update-window',[]],
            ['controller.maxReward',USDH,'controller-v1-1','get-max-reward-per-window',[]],
            ['staking.cooldown',USDH,'staking-state-v1','get-cooldown-window',[]],
            ['staking.hbtcCooldown',USDH,'staking-state-v1','get-custom-cooldown',[Cl.principal(P.hbtcHermetica)]],
            ['staking.enabled',USDH,'staking-state-v1','get-staking-enabled',[]],
            ['zest.resolve',ZEST,'v0-market-vault','resolve-safe',[Cl.principal(P.hbtcZest)]],
            ['zest.position',ZEST,'v0-market-vault','get-position',[Cl.principal(P.hbtcZest),Cl.uint(MAX)]],
            ['zest.usdhScaledDebt',ZEST,'v0-market-vault','get-account-scaled-debt',[Cl.principal(P.hbtcZest),Cl.uint(8n)]],
            ['zest.pauseLiquidation',ZEST,'v0-3-market','get-pause-liquidation',[]],
            ['zest.graceEnd',ZEST,'v0-3-market','get-liquidation-grace-end',[]],
          ]) await q(k,call(c,n,f,a));

          for(const [label,id] of [['sbtc',2n],['zsbtc',3n],['usdh',8n],['zusdh',9n]])
            await q(`zest.grace.${label}`,call(ZEST,'v0-3-market','get-liquidation-grace-period-asset',[Cl.uint(id)]));

          for(const v of ['v0-vault-sbtc','v0-vault-usdh']){
            for(const f of ['get-assets','get-available-assets','get-debt','get-index','get-liquidity-index','get-next-index','get-total-assets','get-total-supply','get-utilization','get-pause-states'])
              await q(`zest.${v}.${f}`,call(ZEST,v,f));
            await q(`zest.${v}.hbtcReserve`,call(ZEST,v,'get-balance',[Cl.principal(P.hbtcReserve)]));
            await q(`zest.${v}.hbtcZest`,call(ZEST,v,'get-balance',[Cl.principal(P.hbtcZest)]));
          }
          fs.writeFileSync('evidence/live-usdh-zest-v2.json',JSON.stringify(out,null,2));
          JS
          node fetch.mjs
          sha256sum evidence/live-usdh-zest-v2.json > evidence/SHA256SUMS
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-usdh-zest-live-v2-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
