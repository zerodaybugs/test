name: Temporary Hermetica USDh and Zest live state

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-hermetica-usdh-zest-trigger.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect read-only public Stacks state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm init -y >/dev/null 2>&1
          npm install --silent @stacks/transactions@7.2.0
          cat > fetch.mjs <<'JS'
          import { Cl, serializeCV, deserializeCV, cvToString } from '@stacks/transactions';
          import fs from 'node:fs';

          const BASE = 'https://api.hiro.so';
          const ZERO = 'SP000000000000000000002Q6VF78';
          const USDH = 'SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const HBTC = 'SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const ZEST = 'SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7';
          const HBTC_RESERVE = `${HBTC}.reserve-hbtc-v1`;
          const HBTC_HERMETICA = `${HBTC}.hermetica-interface-hbtc-v1`;
          const HBTC_ZEST = `${HBTC}.zest-interface-hbtc-v1`;
          const STAKING_RESERVE = `${USDH}.staking-reserve-v1`;
          const MAX_U128 = (1n << 128n) - 1n;

          function arg(cv) {
            return `0x${Buffer.from(serializeCV(cv)).toString('hex')}`;
          }
          function decodeResult(hex) {
            try { return cvToString(deserializeCV(hex)); }
            catch (e) { return `DECODE_ERROR:${e.message}`; }
          }
          async function getJson(url) {
            const r = await fetch(url, {headers: {'accept':'application/json'}});
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }
            return {http:r.status, body};
          }
          async function call(address, name, fn, args=[]) {
            const url = `${BASE}/v2/contracts/call-read/${address}/${name}/${fn}`;
            const r = await fetch(url, {
              method: 'POST',
              headers: {'content-type':'application/json','accept':'application/json'},
              body: JSON.stringify({sender: ZERO, arguments: args.map(arg)})
            });
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }
            const out = {http:r.status, body};
            if (body && typeof body === 'object' && typeof body.result === 'string') {
              out.decoded = decodeResult(body.result);
            }
            return out;
          }

          const q = {};
          async function add(key, promise) {
            try { q[key] = await promise; }
            catch (e) { q[key] = {error: String(e), stack: e?.stack}; }
          }

          await add('chain.info', getJson(`${BASE}/v2/info`));

          // USDh / sUSDh accounting and reward state.
          await add('staking.ratio', call(USDH,'staking-v1-1','get-usdh-per-susdh'));
          await add('usdh.totalSupply', call(USDH,'usdh-token-v1','get-total-supply'));
          await add('usdh.stakingReserveBalance', call(USDH,'usdh-token-v1','get-balance',[Cl.principal(STAKING_RESERVE)]));
          await add('usdh.hbtcReserveBalance', call(USDH,'usdh-token-v1','get-balance',[Cl.principal(HBTC_RESERVE)]));
          await add('usdh.hbtcHermeticaBalance', call(USDH,'usdh-token-v1','get-balance',[Cl.principal(HBTC_HERMETICA)]));
          await add('susdh.totalSupply', call(USDH,'susdh-token-v1','get-total-supply'));
          await add('susdh.hbtcReserveBalance', call(USDH,'susdh-token-v1','get-balance',[Cl.principal(HBTC_RESERVE)]));
          await add('susdh.hbtcHermeticaBalance', call(USDH,'susdh-token-v1','get-balance',[Cl.principal(HBTC_HERMETICA)]));
          await add('controller.lastLogHeight', call(USDH,'controller-v1-1','get-last-log-block-height'));
          await add('controller.updateWindow', call(USDH,'controller-v1-1','get-update-window'));
          await add('controller.maxRewardPerWindow', call(USDH,'controller-v1-1','get-max-reward-per-window'));
          await add('stakingState.cooldown', call(USDH,'staking-state-v1','get-cooldown-window'));
          await add('stakingState.hbtcCustomCooldown', call(USDH,'staking-state-v1','get-custom-cooldown',[Cl.principal(HBTC_HERMETICA)]));
          await add('stakingState.enabled', call(USDH,'staking-state-v1','get-staking-enabled'));

          // Exact hBTC-owned Zest position and market state.
          await add('zest.position.resolve', call(ZEST,'v0-market-vault','resolve-safe',[Cl.principal(HBTC_ZEST)]));
          await add('zest.position.full', call(ZEST,'v0-market-vault','get-position',[Cl.principal(HBTC_ZEST),Cl.uint(MAX_U128)]));
          await add('zest.position.usdhScaledDebt', call(ZEST,'v0-market-vault','get-account-scaled-debt',[Cl.principal(HBTC_ZEST),Cl.uint(8n)]));
          await add('zest.market.pauseLiquidation', call(ZEST,'v0-3-market','get-pause-liquidation'));
          await add('zest.market.liquidationGraceEnd', call(ZEST,'v0-3-market','get-liquidation-grace-end'));
          for (const [name, asset] of [['sbtc',2n],['zsbtc',3n],['usdh',8n],['zusdh',9n]]) {
            await add(`zest.market.grace.${name}`, call(ZEST,'v0-3-market','get-liquidation-grace-period-asset',[Cl.uint(asset)]));
          }

          for (const vault of ['v0-vault-sbtc','v0-vault-usdh']) {
            for (const fn of ['get-assets','get-available-assets','get-debt','get-index','get-liquidity-index','get-next-index','get-total-assets','get-total-supply','get-utilization','get-pause-states']) {
              await add(`zest.${vault}.${fn}`, call(ZEST,vault,fn));
            }
            await add(`zest.${vault}.hbtcReserveBalance`, call(ZEST,vault,'get-balance',[Cl.principal(HBTC_RESERVE)]));
            await add(`zest.${vault}.hbtcZestBalance`, call(ZEST,vault,'get-balance',[Cl.principal(HBTC_ZEST)]));
          }

          const output = {generatedAt:new Date().toISOString(), constants:{USDH,HBTC,ZEST,HBTC_RESERVE,HBTC_HERMETICA,HBTC_ZEST,STAKING_RESERVE}, queries:q};
          fs.writeFileSync('evidence/live-usdh-zest.json', JSON.stringify(output,null,2));
          JS
          node fetch.mjs
          sha256sum evidence/live-usdh-zest.json > evidence/SHA256SUMS

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hermetica-usdh-zest-live-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
