name: Temporary Horizen handler-only sanitized status

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-horizen-handler-only-status.yml"
      - "tmp-horizen-r2/HorizenHandlerOnlyInvariants.t.sol"

permissions:
  contents: write

jobs:
  invariant:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: horizen-live-state-20260728-a
          persist-credentials: true
          fetch-depth: 1

      - name: Install Foundry v1.7.1
        id: foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Execute exact handler-only invariant privately in runner logs
        if: always()
        shell: bash
        env:
          FOUNDRY_ACTION_OUTCOME: ${{ steps.foundry.outcome }}
        run: |
          set +e
          ROOT=/tmp/horizen-handler-only
          rm -rf "$ROOT" /tmp/horizen-handler-summary.txt /tmp/horizen-handler.log

          forge_rc=127
          clone_rc=99
          checkout_rc=99
          deps_rc=99
          build_rc=99
          invariant_rc=99

          forge --version > /tmp/horizen-foundry-version.log 2>&1
          forge_rc=$?

          git clone --no-checkout https://github.com/HorizenOfficial/staker.git "$ROOT" \
            > /tmp/horizen-clone.log 2>&1
          clone_rc=$?
          if [ "$clone_rc" = 0 ]; then
            git -C "$ROOT" checkout --detach ab92502e9da98784dfe3bd3ef933d4e9345ff628 \
              >> /tmp/horizen-clone.log 2>&1
            checkout_rc=$?
          fi
          if [ "$checkout_rc" = 0 ]; then
            git -C "$ROOT" submodule update --init --recursive \
              > /tmp/horizen-dependencies.log 2>&1
            deps_rc=$?
          fi
          if [ "$deps_rc" = 0 ]; then
            cp tmp-horizen-r2/HorizenHandlerOnlyInvariants.t.sol \
              "$ROOT/test/HorizenHandlerOnlyInvariants.t.sol"
            (cd "$ROOT" && forge build) > /tmp/horizen-build.log 2>&1
            build_rc=$?
          fi
          if [ "$build_rc" = 0 ]; then
            (cd "$ROOT" && \
              FOUNDRY_PROFILE=ci \
              FOUNDRY_FUZZ_SEED=2026072802 \
              FOUNDRY_INVARIANT_RUNS=2000 \
              FOUNDRY_INVARIANT_DEPTH=100 \
              FOUNDRY_INVARIANT_FAIL_ON_REVERT=false \
              forge test --match-contract HorizenHandlerOnlyInvariants -vvv) \
              > /tmp/horizen-handler.log 2>&1
            invariant_rc=$?
          fi

          {
            echo "foundry_action_outcome=${FOUNDRY_ACTION_OUTCOME}"
            echo "forge_rc=${forge_rc}"
            echo "clone_rc=${clone_rc}"
            echo "checkout_rc=${checkout_rc}"
            echo "deps_rc=${deps_rc}"
            echo "build_rc=${build_rc}"
            echo "invariant_rc=${invariant_rc}"
            echo "target_commit=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || true)"
            echo "public_network_writes=0"
            echo '--- sanitized invariant summary ---'
            grep -E 'Suite result:|runs, [0-9]+ calls|reverts:|invariant_' \
              /tmp/horizen-handler.log 2>/dev/null | tail -n 120 || true
          } > /tmp/horizen-handler-summary.txt
          exit 0

      - name: Persist sanitized result only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/horizen-handler-summary.txt
          cp /tmp/horizen-handler-summary.txt tmp-horizen-r2/latest-handler-only-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-horizen-r2/latest-handler-only-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record sanitized Horizen handler-only result [skip ci]'
            git push origin HEAD:horizen-live-state-20260728-a
          fi
