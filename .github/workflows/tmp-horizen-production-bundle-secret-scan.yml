name: Temporary encrypted Horizen production bundle credential scan

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-horizen-production-bundle-secret-scan.yml"
      - "tmp-research/horizen-runtime-diff-20260728/production_bundle_secret_scan.py"
      - "tmp-research/horizen-runtime-diff-20260728/output-public.pem"

permissions:
  contents: read

jobs:
  bundle-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout sanitized harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch and scan the deployed static bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf private-evidence sanitized-bundle-scan encrypted-bundle-scan
          mkdir -p private-evidence sanitized-bundle-scan encrypted-bundle-scan
          python3 tmp-research/horizen-runtime-diff-20260728/production_bundle_secret_scan.py
          printf '%s\n' 'Passive same-origin HTTP GET requests only; no credential was used and no deployment or account state was changed.' \
            > sanitized-bundle-scan/network-safety.txt
          sha256sum sanitized-bundle-scan/* > sanitized-bundle-scan/SHA256SUMS

      - name: Encrypt complete technical evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-bundle-scan private-evidence sanitized-bundle-scan
          test -s tmp-research/horizen-runtime-diff-20260728/output-public.pem
          tar --sort=name --mtime='UTC 2026-07-28' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/horizen-production-bundle-scan.tar.gz private-evidence
          sha256sum /tmp/horizen-production-bundle-scan.tar.gz | awk '{print $1}' \
            > encrypted-bundle-scan/evidence-plaintext.sha256
          openssl rand 32 > /tmp/key.bin
          openssl rand 16 > /tmp/iv.bin
          cat /tmp/key.bin /tmp/iv.bin > /tmp/keyinfo.bin
          KEY=$(od -An -tx1 -v /tmp/key.bin | tr -d ' \n')
          IV=$(od -An -tx1 -v /tmp/iv.bin | tr -d ' \n')
          openssl enc -aes-256-cbc -K "$KEY" -iv "$IV" \
            -in /tmp/horizen-production-bundle-scan.tar.gz \
            -out encrypted-bundle-scan/evidence.tar.gz.enc
          openssl pkeyutl -encrypt \
            -pubin -inkey tmp-research/horizen-runtime-diff-20260728/output-public.pem \
            -in /tmp/keyinfo.bin -out encrypted-bundle-scan/evidence-keyinfo.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted-bundle-scan/* > encrypted-bundle-scan/SHA256SUMS
          rm -rf private-evidence
          rm -f /tmp/key.bin /tmp/iv.bin /tmp/keyinfo.bin /tmp/horizen-production-bundle-scan.tar.gz

      - name: Upload sanitized bundle verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizen-production-bundle-scan-sanitized-${{ github.run_id }}
          path: sanitized-bundle-scan/
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizen-production-bundle-scan-encrypted-${{ github.run_id }}
          path: encrypted-bundle-scan/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Verify result materialization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s sanitized-bundle-scan/RESULT.json
          test -s sanitized-bundle-scan/RESULT.md
          test -s encrypted-bundle-scan/evidence.tar.gz.enc
          test -s encrypted-bundle-scan/evidence-keyinfo.enc
          jq -e '.public_network_writes == 0' sanitized-bundle-scan/RESULT.json >/dev/null
