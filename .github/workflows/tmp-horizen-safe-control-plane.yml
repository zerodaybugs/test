name: Temporary encrypted Horizen Safe control-plane gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-horizen-safe-control-plane.yml"
      - "tmp-research/horizen-runtime-diff-20260728/safe_control_plane.py"
      - "tmp-research/horizen-runtime-diff-20260728/output-public.pem"

permissions:
  contents: read

jobs:
  safe-attestation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout sanitized harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run read-only Safe attestation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf private-evidence sanitized-safe encrypted-safe
          mkdir -p private-evidence sanitized-safe encrypted-safe
          python3 tmp-research/horizen-runtime-diff-20260728/safe_control_plane.py
          printf '%s\n' 'No transaction was signed or broadcast to mainnet or public testnet.' \
            > sanitized-safe/network-safety.txt
          sha256sum sanitized-safe/* > sanitized-safe/SHA256SUMS

      - name: Encrypt technical Safe evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-safe private-evidence sanitized-safe
          test -s tmp-research/horizen-runtime-diff-20260728/output-public.pem
          tar --sort=name --mtime='UTC 2026-07-28' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/horizen-safe-control-plane.tar.gz private-evidence
          sha256sum /tmp/horizen-safe-control-plane.tar.gz | awk '{print $1}' \
            > encrypted-safe/evidence-plaintext.sha256
          openssl rand 32 > /tmp/key.bin
          openssl rand 16 > /tmp/iv.bin
          cat /tmp/key.bin /tmp/iv.bin > /tmp/keyinfo.bin
          KEY=$(od -An -tx1 -v /tmp/key.bin | tr -d ' \n')
          IV=$(od -An -tx1 -v /tmp/iv.bin | tr -d ' \n')
          openssl enc -aes-256-cbc -K "$KEY" -iv "$IV" \
            -in /tmp/horizen-safe-control-plane.tar.gz \
            -out encrypted-safe/evidence.tar.gz.enc
          openssl pkeyutl -encrypt \
            -pubin -inkey tmp-research/horizen-runtime-diff-20260728/output-public.pem \
            -in /tmp/keyinfo.bin -out encrypted-safe/evidence-keyinfo.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted-safe/* > encrypted-safe/SHA256SUMS
          rm -rf private-evidence
          rm -f /tmp/key.bin /tmp/iv.bin /tmp/keyinfo.bin /tmp/horizen-safe-control-plane.tar.gz

      - name: Upload sanitized Safe verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizen-safe-control-plane-sanitized-${{ github.run_id }}
          path: sanitized-safe/
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted Safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizen-safe-control-plane-encrypted-${{ github.run_id }}
          path: encrypted-safe/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Enforce result materialization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s sanitized-safe/RESULT.json
          test -s sanitized-safe/RESULT.md
          test -s encrypted-safe/evidence.tar.gz.enc
          test -s encrypted-safe/evidence-keyinfo.enc
          jq -e '.public_network_writes == 0' sanitized-safe/RESULT.json >/dev/null
