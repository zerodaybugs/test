name: Temporary Horizen Snapshot strategy attestation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-horizen-snapshot-strategy.yml"
      - "tmp-research/horizen-snapshot-strategy/**"

permissions:
  contents: read

concurrency:
  group: horizen-snapshot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  snapshot-strategy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sanitized harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query current and recent Snapshot strategy configuration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf snapshot-output sanitized-snapshot
          python3 tmp-research/horizen-snapshot-strategy/query_snapshot.py
          printf '%s\n' \
            'Only a read-only GraphQL query was sent to the public Snapshot Hub.' \
            'No vote, signature, wallet connection, transaction or public-chain write was used.' \
            > sanitized-snapshot/network-safety.txt

      - name: Upload sanitized verdict
        uses: actions/upload-artifact@v4
        with:
          name: horizen-snapshot-strategy-${{ github.run_id }}
          path: sanitized-snapshot/
          if-no-files-found: error
          retention-days: 7

      - name: Verify result materialization
        shell: bash
        run: |
          set -euo pipefail
          test -s sanitized-snapshot/RESULT.json
          test -s sanitized-snapshot/RESULT.md
          test -s sanitized-snapshot/network-safety.txt
          jq -e '.public_network_writes == 0' sanitized-snapshot/RESULT.json >/dev/null
