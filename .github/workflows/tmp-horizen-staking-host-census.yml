name: Temporary encrypted Horizen staking host census

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-horizen-staking-host-census.yml"
      - "tmp-research/horizen-runtime-diff-20260728/staking_host_census.py"
      - "tmp-research/horizen-runtime-diff-20260728/output-public.pem"

permissions:
  contents: read

jobs:
  host-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sanitized harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install passive DNS utility
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Run passive CT, DNS, and HTTP census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf private-evidence sanitized-hosts encrypted-hosts
          mkdir -p private-evidence sanitized-hosts encrypted-hosts
          python3 tmp-research/horizen-runtime-diff-20260728/staking_host_census.py
          printf '%s\n' 'Passive CT/DNS/HTTP requests only; no authentication, upload, claim, or state-changing action was attempted.' \
            > sanitized-hosts/network-safety.txt
          sha256sum sanitized-hosts/* > sanitized-hosts/SHA256SUMS

      - name: Encrypt full host evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-hosts private-evidence sanitized-hosts
          test -s tmp-research/horizen-runtime-diff-20260728/output-public.pem
          tar --sort=name --mtime='UTC 2026-07-28' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/horizen-host-census.tar.gz private-evidence
          sha256sum /tmp/horizen-host-census.tar.gz | awk '{print $1}' \
            > encrypted-hosts/evidence-plaintext.sha256
          openssl rand 32 > /tmp/key.bin
          openssl rand 16 > /tmp/iv.bin
          cat /tmp/key.bin /tmp/iv.bin > /tmp/keyinfo.bin
          KEY=$(od -An -tx1 -v /tmp/key.bin | tr -d ' \n')
          IV=$(od -An -tx1 -v /tmp/iv.bin | tr -d ' \n')
          openssl enc -aes-256-cbc -K "$KEY" -iv "$IV" \
            -in /tmp/horizen-host-census.tar.gz \
            -out encrypted-hosts/evidence.tar.gz.enc
          openssl pkeyutl -encrypt \
            -pubin -inkey tmp-research/horizen-runtime-diff-20260728/output-public.pem \
            -in /tmp/keyinfo.bin -out encrypted-hosts/evidence-keyinfo.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted-hosts/* > encrypted-hosts/SHA256SUMS
          rm -rf private-evidence
          rm -f /tmp/key.bin /tmp/iv.bin /tmp/keyinfo.bin /tmp/horizen-host-census.tar.gz

      - name: Upload sanitized host verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizen-staking-host-census-sanitized-${{ github.run_id }}
          path: sanitized-hosts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizen-staking-host-census-encrypted-${{ github.run_id }}
          path: encrypted-hosts/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Verify result materialization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s sanitized-hosts/RESULT.json
          test -s sanitized-hosts/RESULT.md
          test -s encrypted-hosts/evidence.tar.gz.enc
          test -s encrypted-hosts/evidence-keyinfo.enc
          jq -e '.public_network_writes == 0' sanitized-hosts/RESULT.json >/dev/null
