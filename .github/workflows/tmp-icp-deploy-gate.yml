name: Temporary ICP deployed revision gate

on:
  push:
    branches: [tmp-ci-20260817-icp-deploy-gate]
    paths: [".github/workflows/tmp-icp-deploy-gate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Query subnet revisions and test ancestry
        shell: bash
        run: |
          set -euo pipefail
          target=a87fac145f0faa1f13fe4a8aa866dab7b9fbd52d
          mkdir -p result
          curl -fsSL 'https://ic-api.internetcomputer.org/api/v3/subnets?limit=1000' -o result/subnets.json
          curl -fsSL 'https://ic-api.internetcomputer.org/api/v3/subnet-replica-versions?limit=1000' -o result/versions.json || true
          git clone --filter=blob:none --no-tags https://github.com/dfinity/ic.git ic
          git -C ic fetch --all --prune
          python3 - <<'PY'
          import json,re,subprocess,pathlib
          target='a87fac145f0faa1f13fe4a8aa866dab7b9fbd52d'
          root=pathlib.Path('result')
          raw=(root/'subnets.json').read_text(errors='replace')
          try: data=json.loads(raw)
          except Exception: data={}
          hex40=set(re.findall(r'\b[0-9a-f]{40}\b',raw))
          # Also recursively collect fields whose key names suggest replica version.
          vals=[]
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}.{k}' if path else k
                      if 'replica' in k.lower() and 'version' in k.lower(): vals.append((p,v))
                      walk(v,p)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(data)
          for _,v in vals:
              if isinstance(v,str) and re.fullmatch(r'[0-9a-f]{40}',v): hex40.add(v)
          rows=[]
          for rev in sorted(hex40):
              fetched=subprocess.run(['git','-C','ic','cat-file','-e',rev+'^{commit}'],capture_output=True).returncode==0
              if not fetched:
                  subprocess.run(['git','-C','ic','fetch','origin',rev],capture_output=True)
                  fetched=subprocess.run(['git','-C','ic','cat-file','-e',rev+'^{commit}'],capture_output=True).returncode==0
              contains=False
              if fetched:
                  contains=subprocess.run(['git','-C','ic','merge-base','--is-ancestor',target,rev]).returncode==0
              rows.append({'replica_revision':rev,'known_commit':fetched,'contains_target':contains})
          out={'target_commit':target,'replica_version_fields':vals,'unique_revision_count':len(rows),'rows':rows,'deployed_on_any_revision':any(r['contains_target'] for r in rows)}
          (root/'DEPLOYMENT_GATE.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          sha256sum result/* > result/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: icp-deployment-gate
          path: result/
          retention-days: 1
