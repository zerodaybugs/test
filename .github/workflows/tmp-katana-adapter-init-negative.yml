name: Temporary Katana adapter initializer negative control

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-adapter-init-negative.yml'
      - 'tmp-katana-adapter-init-negative-trigger.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Simulate hostile adapter reinitialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          RPC='https://rpc.katana.network/'
          ATTACKER='0x00000000000000000000000000000000BEEFCAFE'
          EXPECTED='0xf92ee8a9'
          printf '[\n' > evidence/adapter-init-negative.json
          first=1
          while IFS='|' read -r name adapter token; do
            set +e
            output=$(cast call "$adapter" 'reinitialize1(address,bool,address,address)' "$token" false "$ATTACKER" "$ATTACKER" --from "$ATTACKER" --rpc-url "$RPC" 2>&1)
            status=$?
            set -e
            slot=$(cast storage "$adapter" 0xf0c57e16840df040f15088dc2f81fe391c3923bec73e23a9662efc9c229c6a00 --rpc-url "$RPC")
            counter=$(cast call "$adapter" 'globalInitializationCounter()(uint64)' --rpc-url "$RPC")
            [[ $first -eq 0 ]] && printf ',\n' >> evidence/adapter-init-negative.json
            first=0
            NAME="$name" ADAPTER="$adapter" STATUS="$status" OUTPUT="$output" SLOT="$slot" COUNTER="$counter" EXPECTED="$EXPECTED" python3 - <<'PY' >> evidence/adapter-init-negative.json
          import json, os
          output=os.environ['OUTPUT']
          print(json.dumps({
            'name':os.environ['NAME'],
            'adapter':os.environ['ADAPTER'],
            'exitCode':int(os.environ['STATUS']),
            'output':output,
            'initializableSlot':os.environ['SLOT'],
            'globalInitializationCounter':int(os.environ['COUNTER'].split()[0]),
            'reverted':int(os.environ['STATUS']) != 0,
            'invalidInitializationSelectorObserved':os.environ['EXPECTED'].lower() in output.lower(),
          }, sort_keys=True), end='')
          PY
            test "$status" -ne 0
            echo "$output" | grep -qi "$EXPECTED"
            test "$(printf '%d' "$slot")" -eq 1
            test "$(printf '%d' "$counter")" -eq 1
          done <<'EOF'
          eth|0x694d1697f6909361775139357d99fb60b5cab683|0xEE7D8BCFb72bC1880D0Cf19822eB0A2e6577aB62
          usdc|0x807275727dd3e640c5f2b5de7d1ec72b4dd293c0|0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36
          usdt|0x4690f346337ed8737bea462ac71ff16ef95b985e|0x2DCa96907fde857dd3D816880A0df407eeB2D2F2
          wbtc|0x8169e532bc781985e155037db1f96c267a520dfc|0x0913DA6Da4b42f538B445599b46Bb4622342Cf52
          usds|0xb42ab636ac69f073970a94d1ace13379e7621665|0x62D6A123E8D19d06d68cf0d2294F9A3A0362c6b3
          EOF
          printf '\n]\n' >> evidence/adapter-init-negative.json
          sha256sum evidence/adapter-init-negative.json > evidence/SHA256SUMS
          cat evidence/adapter-init-negative.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: katana-adapter-init-negative-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
