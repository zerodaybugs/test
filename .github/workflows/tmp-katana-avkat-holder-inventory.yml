name: Temporary Katana avKAT holder inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-avkat-holder-inventory.yml'
      - 'tmp-katana-avkat-holder-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Collect current avKAT holders and identify pool-like contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/raw
          RPC='https://rpc.katana.network/'
          TOKEN='0x7231dbaCdFc968E07656D12389AB20De82FbfCeB'
          BLOCK=$(cast block-number --rpc-url "$RPC")
          printf '%s\n' "$BLOCK" > evidence/block.txt

          curl -sS --retry 5 --max-time 120 \
            "https://explorer.katanarpc.com/api/v2/tokens/$TOKEN/holders" \
            -o evidence/raw/holders-page1.json

          python3 - <<'PY'
          from __future__ import annotations
          import json, subprocess
          from pathlib import Path

          RPC='https://rpc.katana.network/'
          TOKEN='0x7231dbaCdFc968E07656D12389AB20De82FbfCeB'
          raw=json.loads(Path('evidence/raw/holders-page1.json').read_text())
          items=raw.get('items') or []

          def run(*args):
              p=subprocess.run([*map(str,args)], text=True, capture_output=True)
              return {'ok':p.returncode==0,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}

          rows=[]
          for item in items:
              ah=item.get('address') or item.get('address_hash') or {}
              address=ah.get('hash') if isinstance(ah,dict) else ah
              value=item.get('value')
              if not address: continue
              code=run('cast','code',address,'--rpc-url',RPC)
              balance=run('cast','call',TOKEN,'balanceOf(address)(uint256)',address,'--rpc-url',RPC)
              probes={}
              for label,sig in [
                  ('token0','token0()(address)'),('token1','token1()(address)'),
                  ('factory','factory()(address)'),('slot0','slot0()((uint160,int24,uint16,uint16,uint16,uint8,bool))'),
                  ('getReserves','getReserves()((uint112,uint112,uint32))'),
                  ('asset','asset()(address)'),('totalAssets','totalAssets()(uint256)'),
                  ('name','name()(string)'),('symbol','symbol()(string)')]:
                  probes[label]=run('cast','call',address,sig,'--rpc-url',RPC)
              rows.append({
                  'address':address,
                  'reportedValue':value,
                  'balanceCall':balance,
                  'isContract':code['ok'] and code['stdout']!='0x',
                  'codeHash':run('cast','keccak',code['stdout'])['stdout'] if code['ok'] and code['stdout']!='0x' else None,
                  'explorerMetadata':ah if isinstance(ah,dict) else {},
                  'probes':probes,
              })
          out={'token':TOKEN,'block':Path('evidence/block.txt').read_text().strip(),'holders':rows,'nextPage':raw.get('next_page_params')}
          Path('evidence/holder-inventory.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: katana-avkat-holder-inventory-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
