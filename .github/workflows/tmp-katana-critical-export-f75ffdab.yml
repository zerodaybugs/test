name: Temporary Katana Critical complete export f75ffdab

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-critical-export-f75ffdab.yml'
      - 'tmp-secure/katana-critical-output-public-f75ffdab.pem'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/katana-critical-input-private.pem
          key: katana-critical-vote-erasure-key-20260726-ec91f657
          fail-on-cache-miss: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Decrypt exact tested payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base64 -d tmp-secure/katana-payload.enc.b64 > /tmp/payload.enc
          base64 -d tmp-secure/katana-keyinfo.enc.b64 > /tmp/keyinfo.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/katana-critical-input-private.pem \
            -in /tmp/keyinfo.enc -out /tmp/keyinfo.bin \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PY'
          from pathlib import Path
          x=Path('/tmp/keyinfo.bin').read_bytes()
          if len(x)!=48: raise SystemExit('bad keyinfo length')
          Path('/tmp/key.hex').write_text(x[:32].hex())
          Path('/tmp/iv.hex').write_text(x[32:].hex())
          PY
          openssl enc -d -aes-256-cbc \
            -K "$(cat /tmp/key.hex)" -iv "$(cat /tmp/iv.hex)" \
            -in /tmp/payload.enc -out /tmp/payload.tar.gz
          EXPECTED=$(tr -d '[:space:]' < tmp-secure/katana-payload.sha256)
          printf '%s  %s\n' "$EXPECTED" /tmp/payload.tar.gz | sha256sum -c -
          tar -xzf /tmp/payload.tar.gz
          test -f katana_secure_payload/run.sh
          mv katana_secure_payload payload
          chmod +x payload/run.sh
      - name: Execute and collect complete evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          FOUNDRY_VIA_IR=true bash payload/run.sh > evidence/runner-console.log 2>&1
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > evidence/runner-exit-code.txt
          printf '%s\n' "$STATUS" > /tmp/status
          printf '%s\n' "${GITHUB_RUN_ID}" > evidence/github-run-id.txt
          printf '%s\n' "${GITHUB_SHA}" > evidence/github-sha.txt
          cp -a payload evidence/payload-source
          if [ -d payload/evidence ]; then cp -a payload/evidence evidence/payload-evidence; fi
          exit 0
      - name: Encrypt export to unique local-review key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-output evidence
          if [ ! -f evidence/runner-exit-code.txt ]; then
            printf '%s\n' '125' > evidence/runner-exit-code.txt
            printf '%s\n' '125' > /tmp/status
          fi
          tar --sort=name --mtime='UTC 2026-07-26' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/complete.tar.gz evidence
          sha256sum /tmp/complete.tar.gz | awk '{print $1}' > encrypted-output/plaintext.sha256
          openssl rand 32 > /tmp/outkey
          openssl rand 16 > /tmp/outiv
          cat /tmp/outkey /tmp/outiv > /tmp/outinfo
          openssl enc -aes-256-cbc -K "$(xxd -p -c256 /tmp/outkey)" -iv "$(xxd -p -c256 /tmp/outiv)" \
            -in /tmp/complete.tar.gz -out encrypted-output/complete.tar.gz.enc
          openssl pkeyutl -encrypt -pubin -inkey tmp-secure/katana-critical-output-public-f75ffdab.pem \
            -in /tmp/outinfo -out encrypted-output/complete-keyinfo.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted-output/* > encrypted-output/SHA256SUMS
          rm -rf evidence payload katana_secure_payload
          rm -f /tmp/payload* /tmp/keyinfo* /tmp/key.hex /tmp/iv.hex /tmp/complete.tar.gz /tmp/outkey /tmp/outiv /tmp/outinfo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katana-critical-complete-f75ffdab-${{ github.run_id }}
          path: encrypted-output/
          retention-days: 2
          if-no-files-found: error
      - name: Enforce successful PoC
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f encrypted-output/complete.tar.gz.enc
          test -f /tmp/status
          test "$(cat /tmp/status)" = '0'
