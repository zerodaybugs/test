name: Temporary export Katana Critical cached public key

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-critical-export-public-20260726.yml'
      - 'tmp-secure/katana-critical-export-public-20260726.trigger'

permissions:
  contents: read

jobs:
  export-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Restore actual cached private key
        uses: actions/cache/restore@v4
        with:
          path: /tmp/katana-critical-input-private.pem
          key: katana-critical-vote-erasure-key-20260726-ec91f657
          fail-on-cache-miss: true
      - name: Derive public key only
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/katana-critical-input-private.pem
          mkdir -p public-output
          openssl pkey -in /tmp/katana-critical-input-private.pem -pubout \
            -out public-output/katana-critical-cache-public.pem
          openssl pkey -pubin -in public-output/katana-critical-cache-public.pem \
            -outform DER | sha256sum | awk '{print $1}' \
            > public-output/public-key-fingerprint.txt
          printf '%s\n' 'katana-critical-vote-erasure-key-20260726-ec91f657' \
            > public-output/cache-key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: katana-critical-cache-public-key-${{ github.run_id }}
          path: public-output/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
