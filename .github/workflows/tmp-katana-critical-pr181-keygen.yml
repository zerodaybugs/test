name: Temporary Katana Critical PR181 key bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-critical-pr181-keygen.yml'
      - 'tmp-secure/katana-critical-pr181-keygen.trigger'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Restore or initialize PR181 private key
        id: key-cache
        uses: actions/cache@v4
        with:
          path: /tmp/katana-critical-pr181-private.pem
          key: katana-critical-pr181-input-key-v1
      - name: Generate key on first run
        if: steps.key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out /tmp/katana-critical-pr181-private.pem
      - name: Export public key only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-output
          openssl pkey -in /tmp/katana-critical-pr181-private.pem -pubout \
            -out public-output/katana-critical-pr181-public.pem
          openssl pkey -pubin -in public-output/katana-critical-pr181-public.pem \
            -outform DER | sha256sum | awk '{print $1}' \
            > public-output/public-key-fingerprint.txt
          printf '%s\n' 'katana-critical-pr181-input-key-v1' > public-output/cache-key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: katana-critical-pr181-public-key-${{ github.run_id }}
          path: public-output/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
