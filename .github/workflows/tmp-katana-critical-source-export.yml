name: Temporary Katana Critical source export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-critical-source-export.yml'
      - 'tmp-secure/katana-final-output-public.pem'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/katana-critical-input-private.pem
          key: katana-critical-vote-erasure-key-20260726-ec91f657
          fail-on-cache-miss: true
      - name: Decrypt exact tested payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base64 -d tmp-secure/katana-payload.enc.b64 > /tmp/payload.enc
          base64 -d tmp-secure/katana-keyinfo.enc.b64 > /tmp/keyinfo.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/katana-critical-input-private.pem \
            -in /tmp/keyinfo.enc -out /tmp/keyinfo.bin \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PY'
          from pathlib import Path
          x=Path('/tmp/keyinfo.bin').read_bytes()
          if len(x)!=48: raise SystemExit('bad keyinfo')
          Path('/tmp/key.hex').write_text(x[:32].hex())
          Path('/tmp/iv.hex').write_text(x[32:].hex())
          PY
          openssl enc -d -aes-256-cbc \
            -K "$(cat /tmp/key.hex)" -iv "$(cat /tmp/iv.hex)" \
            -in /tmp/payload.enc -out /tmp/payload.tar.gz
          EXPECTED=$(tr -d '[:space:]' < tmp-secure/katana-payload.sha256)
          printf '%s  %s\n' "$EXPECTED" /tmp/payload.tar.gz | sha256sum -c -
          mkdir -p export
          tar -xzf /tmp/payload.tar.gz -C export
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS
      - name: Encrypt source export for local assembly
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 2026-07-26' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/source-export.tar.gz export
          mkdir -p encrypted-output
          sha256sum /tmp/source-export.tar.gz | awk '{print $1}' > encrypted-output/plaintext.sha256
          openssl rand 32 > /tmp/outkey
          openssl rand 16 > /tmp/outiv
          cat /tmp/outkey /tmp/outiv > /tmp/outinfo
          openssl enc -aes-256-cbc -K "$(xxd -p -c256 /tmp/outkey)" -iv "$(xxd -p -c256 /tmp/outiv)" \
            -in /tmp/source-export.tar.gz -out encrypted-output/source-export.tar.gz.enc
          openssl pkeyutl -encrypt -pubin -inkey tmp-secure/katana-final-output-public.pem \
            -in /tmp/outinfo -out encrypted-output/source-export-keyinfo.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted-output/* > encrypted-output/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: katana-critical-source-export-${{ github.run_id }}
          path: encrypted-output/
          retention-days: 2
          if-no-files-found: error
