name: Temporary Katana governance permission gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-governance-role-gate.yml'
      - 'tmp-katana-governance-role-gate-trigger.txt'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Collect read-only permissions and hostile-call outcomes
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          RPC='https://rpc.katana.network/'
          ATTACKER='0x00000000000000000000000000000000BEEFCAFE'
          VAULT='0x7231dbaCdFc968E07656D12389AB20De82FbfCeB'
          ACTIVE='0x60233D1c150F9C08D886906d597aA79a205b0463'
          DEFAULT='0xe64F2304135079EEDD74B7313E10a5E6A0251e0E'
          ESCROW='0x4d6fC15Ca6258b168225D283262743C623c13Ead'
          NFT='0x106F7D67Ea25Cb9eFf5064CF604ebf6259Ff296d'
          VOTER='0x5e755A3C5dc81A79DE7a7cEF192FFA60964c9352'
          QUEUE='0x6dE9cAAb658C744aD337Ca5d92D084c97ffF578d'
          ANY='0xD7a029DB2585553978190dB5E85eC724Aa4dF23f'

          run() { local label="$1"; shift; { printf 'command='; printf '%q ' "$@"; echo; "$@"; echo "exit=$?"; } > "evidence/$label.txt" 2>&1 || true; }
          call() { local label="$1" addr="$2" sig="$3"; shift 3; run "$label" cast call "$addr" "$sig" "$@" --rpc-url "$RPC"; }
          hostile() { local label="$1" addr="$2" sig="$3"; shift 3; run "$label" cast call "$addr" "$sig" "$@" --from "$ATTACKER" --rpc-url "$RPC"; }

          call vault-dao "$VAULT" 'dao()(address)'
          call active-dao "$ACTIVE" 'dao()(address)'
          call active-voter "$ACTIVE" 'voter()(address)'
          call active-adapter "$ACTIVE" 'ivotesAdapter()(address)'
          call active-delegatee "$ACTIVE" 'delegatee()(address)'
          call active-owner "$ACTIVE" 'owner()(address)'
          call active-master "$ACTIVE" 'masterTokenId()(uint256)'
          call active-rewards "$ACTIVE" 'rewardsDistributor()(address)'
          call active-swapper "$ACTIVE" 'swapper()(address)'

          call voter-escrow "$VOTER" 'escrow()(address)'
          call voter-adapter "$VOTER" 'ivotesAdapter()(address)'
          call voter-hook "$VOTER" 'enableUpdateVotingPowerHook()(bool)'
          call voter-active "$VOTER" 'votingActive()(bool)'
          call voter-epoch "$VOTER" 'epochId()(uint256)'
          call voter-is-active-strategy-voting "$VOTER" 'isVoting(address)(bool)' "$ACTIVE"
          call voter-used-power "$VOTER" 'usedVotingPower(address)(uint256)' "$ACTIVE"
          call voter-total-cast "$VOTER" 'totalVotingPowerCast()(uint256)'
          call voter-gauges "$VOTER" 'getAllGauges()(address[])'

          ADAPTER=$(grep -Eom1 '0x[0-9a-fA-F]{40}' evidence/active-adapter.txt | tail -1)
          DAO=$(grep -Eom1 '0x[0-9a-fA-F]{40}' evidence/vault-dao.txt | tail -1)
          printf 'adapter=%s\ndao=%s\n' "$ADAPTER" "$DAO" > evidence/derived-addresses.txt
          if [ -n "$ADAPTER" ]; then
            call adapter-delegates-active "$ADAPTER" 'delegates(address)(address)' "$ACTIVE"
            call adapter-master-delegated "$ADAPTER" 'tokenIsDelegated(uint256)(bool)' 1
            call adapter-active-votes "$ADAPTER" 'getVotes(address)(uint256)' "$ACTIVE"
            call adapter-active-count "$ADAPTER" 'numberOfDelegatedTokens(address)(uint256)' "$ACTIVE"
            call adapter-active-autodelegation-disabled "$ADAPTER" 'autoDelegationDisabled(address)(bool)' "$ACTIVE"
          fi

          call escrow-voter "$ESCROW" 'voter()(address)'
          call escrow-adapter "$ESCROW" 'ivotesAdapter()(address)'
          call escrow-queue "$ESCROW" 'queue()(address)'
          call escrow-lock "$ESCROW" 'lockNFT()(address)'
          call escrow-total-locked "$ESCROW" 'totalLocked()(uint256)'
          call escrow-total-vp "$ESCROW" 'totalVotingPower()(uint256)'
          for pair in "vault:$VAULT" "active:$ACTIVE" "default:$DEFAULT" "any:$ANY" "attacker:$ATTACKER"; do
            name=${pair%%:*}; addr=${pair#*:}
            call "escrow-can-split-$name" "$ESCROW" 'canSplit(address)(bool)' "$addr"
            call "nft-whitelisted-$name" "$NFT" 'whitelisted(address)(bool)' "$addr"
          done

          # Permission identifiers and direct DAO checks.
          for role in VAULT_ADMIN_ROLE SWEEPER_ROLE AUTOCOMPOUND_STRATEGY_ADMIN_ROLE AUTOCOMPOUND_STRATEGY_VOTE_ROLE AUTOCOMPOUND_STRATEGY_CLAIM_COMPOUND_ROLE ESCROW_ADMIN PAUSER SWEEPER GAUGE_ADMIN LOCK_ADMIN; do
            cast keccak "$role" > "evidence/role-$role.txt"
          done
          if [ -n "$DAO" ]; then
            checkperm() {
              local label="$1" where="$2" rolefile="$3"
              role=$(head -1 "evidence/role-$rolefile.txt")
              call "$label" "$DAO" 'hasPermission(address,address,bytes32,bytes)(bool)' "$where" "$ATTACKER" "$role" 0x
            }
            checkperm perm-vault-admin "$VAULT" VAULT_ADMIN_ROLE
            checkperm perm-vault-sweeper "$VAULT" SWEEPER_ROLE
            checkperm perm-strategy-admin "$ACTIVE" AUTOCOMPOUND_STRATEGY_ADMIN_ROLE
            checkperm perm-strategy-vote "$ACTIVE" AUTOCOMPOUND_STRATEGY_VOTE_ROLE
            checkperm perm-strategy-claim "$ACTIVE" AUTOCOMPOUND_STRATEGY_CLAIM_COMPOUND_ROLE
            checkperm perm-escrow-admin "$ESCROW" ESCROW_ADMIN
            checkperm perm-voter-admin "$VOTER" GAUGE_ADMIN
            checkperm perm-lock-admin "$NFT" LOCK_ADMIN
          fi

          hostile hostile-active-delegate "$ACTIVE" 'delegate(address)' "$ATTACKER"
          hostile hostile-active-vote-empty "$ACTIVE" 'vote((uint256,address)[])' '[]'
          hostile hostile-vault-pause "$VAULT" 'pause()'
          hostile hostile-vault-set-strategy "$VAULT" 'setStrategy(address)' "$ATTACKER"
          hostile hostile-voter-hook-off "$VOTER" 'setEnableUpdateVotingPowerHook(bool)' false
          hostile hostile-escrow-enable-split "$ESCROW" 'enableSplit()'
          hostile hostile-nft-enable-transfers "$NFT" 'enableTransfers()'

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('evidence')
          rows={}
          for p in sorted(root.glob('*.txt')):
              text=p.read_text(errors='replace')
              rows[p.stem]={
                'text':text.strip(),
                'exit':next((int(m.group(1)) for m in re.finditer(r'^exit=(\d+)$',text,re.M)),None),
                'reverted':bool(re.search(r'error|revert',text,re.I)),
              }
          (root/'summary.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katana-governance-role-gate-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
