name: Temporary Katana governance source bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-governance-source.yml'
      - 'tmp-katana-governance-source-trigger.txt'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Pin and build exact sources
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          git clone --quiet --recurse-submodules https://github.com/aragon/katana-governance.git katana-governance
          git -C katana-governance checkout --quiet --detach 2fe29c49bfbd6c7c116ddf56a1228de450a62728
          git -C katana-governance submodule sync --recursive
          git -C katana-governance submodule update --init --recursive --force
          git -C katana-governance rev-parse HEAD > evidence/katana-governance-head.txt
          git -C katana-governance submodule status --recursive > evidence/submodules.txt
          forge --version > evidence/foundry-version.txt
          (
            cd katana-governance
            forge build --build-info --sizes
          ) > evidence/build.log 2>&1 || true
          tar -czf evidence/katana-governance-source.tgz \
            --exclude='.git' --exclude='cache' --exclude='out' katana-governance
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katana-governance-source-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
