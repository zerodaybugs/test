name: Temporary Katana encrypted PoC key bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-secure-keygen.yml'
      - 'tmp-katana-secure-keygen-trigger.txt'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restore one-time private key cache
        id: key-cache
        uses: actions/cache@v4
        with:
          path: /tmp/katana-secure-private.pem
          key: katana-secure-poc-key-56fe0ca7762997ce47d5ae1706bf8af29cbc71202b28c498

      - name: Generate key pair on first run
        if: steps.key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/katana-secure-private.pem

      - name: Export public key and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          openssl pkey -in /tmp/katana-secure-private.pem -pubout -out evidence/public.pem
          openssl pkey -in /tmp/katana-secure-private.pem -pubout -outform DER | sha256sum | awk '{print $1}' > evidence/public-key-fingerprint.txt
          printf '%s\n' 'katana-secure-poc-key-56fe0ca7762997ce47d5ae1706bf8af29cbc71202b28c498' > evidence/cache-key.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > evidence/keygen-run-id.txt

      - name: Upload public encryption key
        uses: actions/upload-artifact@v4
        with:
          name: katana-secure-public-key-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
