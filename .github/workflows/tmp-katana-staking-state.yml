name: Temporary Katana staking state inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-staking-state.yml'
      - 'tmp-katana-staking-state-trigger.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Collect read-only state
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          RPC='https://rpc.katana.network/'
          VAULT='0x7231dbaCdFc968E07656D12389AB20De82FbfCeB'
          INIT_SLOT='0xf0c57e16840df040f15088dc2f81fe391c3923bec73e23a9662efc9c229c6a00'
          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'

          call() {
            local label="$1" address="$2" sig="$3"; shift 3
            { echo "address=$address"; echo "signature=$sig"; cast call "$address" "$sig" "$@" --rpc-url "$RPC"; } > "evidence/$label.txt" 2>&1 || true
          }
          store() {
            local label="$1" address="$2" slot="$3"
            { echo "address=$address"; echo "slot=$slot"; cast storage "$address" "$slot" --rpc-url "$RPC"; } > "evidence/$label.txt" 2>&1 || true
          }

          cast block-number --rpc-url "$RPC" > evidence/block.txt 2>&1 || true
          call vault-strategy "$VAULT" 'strategy()(address)'
          call vault-default "$VAULT" 'defaultStrategy()(address)'
          call vault-master "$VAULT" 'masterTokenId()(uint256)'
          call vault-total-assets "$VAULT" 'totalAssets()(uint256)'
          call vault-total-supply "$VAULT" 'totalSupply()(uint256)'
          call vault-escrow "$VAULT" 'escrow()(address)'
          call vault-nft "$VAULT" 'lockNft()(address)'
          store vault-init "$VAULT" "$INIT_SLOT"
          store vault-impl "$VAULT" "$IMPL_SLOT"

          strategy=$(grep -Eom1 '0x[0-9a-fA-F]{40}' evidence/vault-strategy.txt || true)
          default=$(grep -Eom1 '0x[0-9a-fA-F]{40}' evidence/vault-default.txt || true)
          master=$(grep -Eom1 '^[0-9]+' evidence/vault-master.txt || true)
          nft=$(grep -Eom1 '0x[0-9a-fA-F]{40}' evidence/vault-nft.txt || true)
          printf 'strategy=%s\ndefault=%s\nmaster=%s\nnft=%s\n' "$strategy" "$default" "$master" "$nft" > evidence/parsed-addresses.txt

          for pair in "active:$strategy" "default:$default"; do
            name=${pair%%:*}; addr=${pair#*:}
            [ -n "$addr" ] || continue
            call "$name-owner" "$addr" 'owner()(address)'
            call "$name-master" "$addr" 'masterTokenId()(uint256)'
            call "$name-total-assets" "$addr" 'totalAssets()(uint256)'
            call "$name-escrow" "$addr" 'escrow()(address)'
            call "$name-nft" "$addr" 'nft()(address)'
            store "$name-init" "$addr" "$INIT_SLOT"
            store "$name-impl" "$addr" "$IMPL_SLOT"
          done

          if [ -n "$nft" ] && [ -n "$master" ]; then
            call nft-master-owner "$nft" 'ownerOf(uint256)(address)' "$master"
            call nft-master-approved "$nft" 'getApproved(uint256)(address)' "$master"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('evidence')
          data={p.stem:p.read_text(errors='replace').strip() for p in root.glob('*.txt')}
          def iv(key):
              m=re.findall(r'0x[0-9a-fA-F]{64}',data.get(key,''))
              return None if not m else int(m[-1],16)&((1<<64)-1)
          data['parsed']={'vaultInit':iv('vault-init'),'activeInit':iv('active-init'),'defaultInit':iv('default-init')}
          (root/'summary.json').write_text(json.dumps(data,indent=2,sort_keys=True))
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katana-staking-state-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
