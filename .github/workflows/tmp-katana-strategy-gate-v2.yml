name: Temporary Katana strategy ownership gate v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-katana-strategy-gate-v2.yml'
      - 'tmp-katana-strategy-gate-v2-trigger.txt'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify live ownership and hostile calls
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          RPC='https://rpc.katana.network/'
          VAULT='0x7231dbaCdFc968E07656D12389AB20De82FbfCeB'
          ACTIVE='0x60233D1c150F9C08D886906d597aA79a205b0463'
          DEFAULT='0xe64F2304135079EEDD74B7313E10a5E6A0251e0E'
          NFT='0x106F7D67Ea25Cb9eFf5064CF604ebf6259Ff296d'
          MASTER='1'
          ATTACKER='0x00000000000000000000000000000000BEEFCAFE'
          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'

          run() { local label="$1"; shift; { printf 'command='; printf '%q ' "$@"; echo; "$@"; echo "exit=$?"; } > "evidence/$label.txt" 2>&1 || true; }

          run block cast block-number --rpc-url "$RPC"
          for pair in "vault:$VAULT" "active:$ACTIVE" "default:$DEFAULT"; do
            name=${pair%%:*}; addr=${pair#*:}
            run "$name-code" cast code "$addr" --rpc-url "$RPC"
            run "$name-impl" cast storage "$addr" "$IMPL_SLOT" --rpc-url "$RPC"
            run "$name-slot0" cast storage "$addr" 0 --rpc-url "$RPC"
          done

          run vault-strategy cast call "$VAULT" 'strategy()(address)' --rpc-url "$RPC"
          run vault-default cast call "$VAULT" 'defaultStrategy()(address)' --rpc-url "$RPC"
          run vault-master cast call "$VAULT" 'masterTokenId()(uint256)' --rpc-url "$RPC"
          run vault-totalAssets cast call "$VAULT" 'totalAssets()(uint256)' --rpc-url "$RPC"
          run vault-totalSupply cast call "$VAULT" 'totalSupply()(uint256)' --rpc-url "$RPC"

          for pair in "active:$ACTIVE" "default:$DEFAULT"; do
            name=${pair%%:*}; addr=${pair#*:}
            run "$name-owner" cast call "$addr" 'owner()(address)' --rpc-url "$RPC"
            run "$name-master" cast call "$addr" 'masterTokenId()(uint256)' --rpc-url "$RPC"
            run "$name-totalAssets" cast call "$addr" 'totalAssets()(uint256)' --rpc-url "$RPC"
            run "$name-escrow" cast call "$addr" 'escrow()(address)' --rpc-url "$RPC"
            run "$name-nft" cast call "$addr" 'nft()(address)' --rpc-url "$RPC"
            run "$name-hostile-init-owner" cast call "$addr" 'initializeOwner(address)' "$ATTACKER" --from "$ATTACKER" --rpc-url "$RPC"
            run "$name-hostile-retire" cast call "$addr" 'retireStrategy()' --from "$ATTACKER" --rpc-url "$RPC"
            run "$name-hostile-receive-master" cast call "$addr" 'receiveMasterToken(uint256)' "$MASTER" --from "$ATTACKER" --rpc-url "$RPC"
          done

          run nft-master-owner cast call "$NFT" 'ownerOf(uint256)(address)' "$MASTER" --rpc-url "$RPC"
          run nft-master-approved cast call "$NFT" 'getApproved(uint256)(address)' "$MASTER" --rpc-url "$RPC"

          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('evidence')
          rows={}
          for p in sorted(root.glob('*.txt')):
              text=p.read_text(errors='replace')
              rows[p.stem]={
                  'text':text.strip(),
                  'reverted': bool(re.search(r'error|revert',text,re.I)),
                  'exit': next((int(m.group(1)) for m in re.finditer(r'^exit=(\d+)$',text,re.M)),None),
                  'addresses': re.findall(r'0x[0-9a-fA-F]{40}',text),
                  'words': re.findall(r'0x[0-9a-fA-F]{64}',text),
              }
          (root/'summary.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katana-strategy-gate-v2-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
