name: Temporary public OKX audit text export 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-okx-audit-trigger.txt'
      - '.github/workflows/tmp-okx-audit-text-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-public-audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install PDF utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download and extract official public audit reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pdfs evidence/text evidence/pages
          base='https://raw.githubusercontent.com/okxlabs/okx-smart-wallet-evm/95aa59bbc22acd4573a9932e959384fe56c7b543/docs/audits'
          for name in \
            blocksec_okx_smart_wallet_v1.0-signed.pdf \
            certik_okx_smart_wallet.pdf \
            okx_security_audit_report.pdf; do
            curl -L --fail --retry 3 "$base/$name" -o "evidence/pdfs/$name"
            pdfinfo "evidence/pdfs/$name" > "evidence/text/${name%.pdf}.pdfinfo.txt"
            pdftotext -layout "evidence/pdfs/$name" "evidence/text/${name%.pdf}.txt"
            pages="$(pdfinfo "evidence/pdfs/$name" | awk '/^Pages:/ {print $2}')"
            for p in $(seq 1 "$pages"); do
              page_text="$(pdftotext -f "$p" -l "$p" "evidence/pdfs/$name" - 2>/dev/null || true)"
              if printf '%s' "$page_text" | grep -Eiq 'executeUserOp|EntryPoint|validateUserOp|revocation|removeOwner|owner removal|hook'; then
                printf '%s\t%s\n' "$name" "$p" >> evidence/text/MATCHED_PAGES.tsv
                pdftoppm -f "$p" -l "$p" -png -r 144 -singlefile \
                  "evidence/pdfs/$name" "evidence/pages/${name%.pdf}_page_${p}"
              fi
            done
          done
          grep -RniE 'executeUserOp|EntryPoint|validateUserOp|revocation|removeOwner|owner removal|hook' evidence/text/*.txt \
            > evidence/text/KEYWORD_HITS.txt || true
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload public audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: okx-smart-wallet-public-audit-text-20260822
          path: evidence/
          if-no-files-found: error
          retention-days: 1
