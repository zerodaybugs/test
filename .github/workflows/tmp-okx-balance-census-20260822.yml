name: Temporary public OKX production balance census v2 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-okx-balance-trigger-v2.txt'
      - '.github/workflows/tmp-okx-balance-census-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Collect public Blockscout balances and recent transfer history
        shell: bash
        env:
          ROUTER: '0x5E1f62Dac767b0491e3CE72469C217365D5B48cC'
          ADAPTER: '0x4ecD468E1010E006f768EC034e5a6d8803183469'
          PROTOCOL: '0x73b920dC64ab6156f2D22b85AB9A9b06E597e154'
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from decimal import Decimal, getcontext
          from pathlib import Path

          getcontext().prec = 80
          BASE = 'https://eth.blockscout.com/api/v2'
          TARGETS = {
              'ROUTER': os.environ['ROUTER'],
              'ADAPTER': os.environ['ADAPTER'],
              'PROTOCOL': os.environ['PROTOCOL'],
          }

          def get_json(url):
              last = None
              for i in range(6):
                  try:
                      req = urllib.request.Request(url, headers={
                          'Accept':'application/json',
                          'User-Agent':'public-readonly-production-census/2.0',
                      })
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return json.loads(response.read())
                  except Exception as exc:
                      last = exc
                      time.sleep(1 + i)
              raise RuntimeError(f'GET failed {url}: {last}')

          balances = []
          addresses = {}
          transfers = {}
          for name, address in TARGETS.items():
              info = get_json(f'{BASE}/addresses/{address}')
              addresses[name] = info
              Path(f'evidence/{name}_ADDRESS_INFO.json').write_text(json.dumps(info, indent=2, sort_keys=True) + '\n')

              items = get_json(f'{BASE}/addresses/{address}/token-balances')
              Path(f'evidence/{name}_TOKEN_BALANCES_RAW.json').write_text(json.dumps(items, indent=2, sort_keys=True) + '\n')
              for item in items if isinstance(items, list) else []:
                  token = item.get('token') or {}
                  if token.get('type') != 'ERC-20':
                      continue
                  raw = int(item.get('value') or 0)
                  if raw == 0:
                      continue
                  try:
                      decimals = int(token.get('decimals') or 0)
                  except Exception:
                      decimals = 0
                  human = Decimal(raw) / (Decimal(10) ** decimals)
                  try:
                      rate = Decimal(str(token.get('exchange_rate'))) if token.get('exchange_rate') not in (None, '') else None
                  except Exception:
                      rate = None
                  usd = human * rate if rate is not None else None
                  balances.append({
                      'target': name,
                      'target_address': address,
                      'token': token.get('address_hash') or '',
                      'symbol': token.get('symbol') or '',
                      'name': token.get('name') or '',
                      'decimals': decimals,
                      'raw_balance': str(raw),
                      'human_balance': str(human),
                      'exchange_rate_usd': '' if rate is None else str(rate),
                      'estimated_usd': '' if usd is None else str(usd),
                  })

              url = f'{BASE}/addresses/{address}/token-transfers'
              collected = []
              for _ in range(12):
                  page = get_json(url)
                  page_items = page.get('items') or [] if isinstance(page, dict) else []
                  collected.extend(page_items)
                  nxt = page.get('next_page_params') if isinstance(page, dict) else None
                  if not nxt:
                      break
                  url = f'{BASE}/addresses/{address}/token-transfers?' + urllib.parse.urlencode(nxt)
              transfers[name] = collected
              Path(f'evidence/{name}_RECENT_TOKEN_TRANSFERS.json').write_text(json.dumps(collected, indent=2, sort_keys=True) + '\n')

          def write_tsv(path, rows):
              if not rows:
                  Path(path).write_text('NO_ROWS\n')
                  return
              keys = list(rows[0].keys())
              with open(path, 'w', encoding='utf-8') as f:
                  f.write('\t'.join(keys) + '\n')
                  for row in rows:
                      f.write('\t'.join(str(row.get(k,'')) for k in keys) + '\n')

          balances.sort(key=lambda x: (x['target'], -(Decimal(x['estimated_usd']) if x['estimated_usd'] else Decimal(0)), x['symbol']))
          write_tsv('evidence/CURRENT_ERC20_BALANCES.tsv', balances)

          eth_rows = []
          for name, info in addresses.items():
              raw = int(info.get('coin_balance') or 0)
              rate = Decimal(str(info.get('exchange_rate'))) if info.get('exchange_rate') not in (None, '') else None
              human = Decimal(raw) / (Decimal(10) ** 18)
              eth_rows.append({
                  'target':name,
                  'address':TARGETS[name],
                  'raw_wei':str(raw),
                  'human_eth':str(human),
                  'exchange_rate_usd':'' if rate is None else str(rate),
                  'estimated_usd':'' if rate is None else str(human * rate),
              })
          write_tsv('evidence/CURRENT_ETH_BALANCES.tsv', eth_rows)

          known_usd = sum((Decimal(x['estimated_usd']) for x in balances if x['estimated_usd']), Decimal(0))
          known_eth_usd = sum((Decimal(x['estimated_usd']) for x in eth_rows if x['estimated_usd']), Decimal(0))
          verdict = {
              'captured_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'erc20_nonzero_count': len(balances),
              'native_nonzero_count': sum(1 for x in eth_rows if int(x['raw_wei']) > 0),
              'known_erc20_usd': str(known_usd),
              'known_native_usd': str(known_eth_usd),
              'balances': balances,
              'eth_balances': eth_rows,
              'recent_transfer_items': {k:len(v) for k,v in transfers.items()},
              'decision': (
                  'MATERIAL_CURRENT_BALANCE_SIGNAL' if known_usd + known_eth_usd >= Decimal('1000')
                  else 'NONZERO_BALANCE_SIGNAL' if balances or any(int(x['raw_wei']) > 0 for x in eth_rows)
                  else 'NO_CURRENT_BALANCE_SIGNAL'
              ),
          }
          Path('evidence/CENSUS_VERDICT.json').write_text(json.dumps(verdict, indent=2, sort_keys=True) + '\n')
          print(json.dumps(verdict, indent=2, sort_keys=True))
          PY

      - name: Cross-check common ERC-20 balances at one fixed block
        shell: bash
        env:
          ROUTER: '0x5E1f62Dac767b0491e3CE72469C217365D5B48cC'
          ADAPTER: '0x4ecD468E1010E006f768EC034e5a6d8803183469'
          PROTOCOL: '0x73b920dC64ab6156f2D22b85AB9A9b06E597e154'
        run: |
          set -euo pipefail
          for candidate in \
            'https://ethereum-rpc.publicnode.com' \
            'https://eth.llamarpc.com' \
            'https://eth-mainnet.public.blastapi.io'; do
            if test "$(curl -sS --max-time 20 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$candidate" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("result",""))' 2>/dev/null || true)" = '0x1'; then
              RPC="$candidate"; break
            fi
          done
          test -n "${RPC:-}"
          HEAD="$(curl -sS --max-time 20 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$RPC" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"])')"
          printf '%s\n' "$RPC" > evidence/RPC_ENDPOINT.txt
          printf '%s\n' "$HEAD" > evidence/RPC_BLOCK_HEX.txt
          python3 - "$RPC" "$HEAD" <<'PY'
          import json, sys, urllib.request
          from pathlib import Path
          rpc, block = sys.argv[1:]
          targets = {
              'ROUTER':'0x5E1f62Dac767b0491e3CE72469C217365D5B48cC',
              'ADAPTER':'0x4ecD468E1010E006f768EC034e5a6d8803183469',
              'PROTOCOL':'0x73b920dC64ab6156f2D22b85AB9A9b06E597e154',
          }
          tokens = {
              'WETH':'0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2',
              'USDT':'0xdAC17F958D2ee523a2206206994597C13D831ec7',
              'USDC':'0xA0b86991c6218b36c1d19d4a2e9Eb0cE3606eB48',
              'DAI':'0x6B175474E89094C44Da98b954EedeAC495271d0F',
              'WBTC':'0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599',
              'cbBTC':'0xcbb7C0000aB88B473b1f5AFd9ef808440eed33Bf',
              'USDS':'0xdC035D45d973E3EC169d2276DDab16f1e407384F',
              'stETH':'0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84',
              'wstETH':'0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0',
              '0xBTC':'0xB6eD7644C69416d67B522e20BC294A9a9B405B31',
          }
          rid=0
          def call(method, params):
              global rid
              rid += 1
              body=json.dumps({'jsonrpc':'2.0','id':rid,'method':method,'params':params}).encode()
              req=urllib.request.Request(rpc,data=body,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r: obj=json.loads(r.read())
              if 'error' in obj: raise RuntimeError(obj['error'])
              return obj['result']
          rows=[]
          for tn,ta in targets.items():
              for sn,token in tokens.items():
                  data='0x70a08231' + '0'*24 + ta[2:].lower()
                  raw=int(call('eth_call',[{'to':token,'data':data},block]),16)
                  rows.append({'target':tn,'token_symbol':sn,'token':token,'raw_balance':str(raw)})
          with open('evidence/RPC_COMMON_BALANCE_CROSSCHECK.tsv','w') as f:
              f.write('target\ttoken_symbol\ttoken\traw_balance\n')
              for r in rows: f.write('\t'.join(r.values())+'\n')
          Path('evidence/RPC_COMMON_BALANCE_CROSSCHECK.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          find evidence -type f -printf '%P\t%s bytes\n' | sort > evidence/ARTIFACT_INDEX.txt
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload public balance census
        uses: actions/upload-artifact@v4
        with:
          name: okx-production-balance-census-v2-20260822
          path: evidence/
          if-no-files-found: error
          retention-days: 1
