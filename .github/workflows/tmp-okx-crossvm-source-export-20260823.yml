name: Temporary OKX cross-VM exact-source export 2026-08-23

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp/okx-crossvm-source-export-20260823.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Export pinned public repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source artifact

          clone_pin() {
            local repo="$1"
            local dir="$2"
            local commit="$3"
            git clone --filter=blob:none "$repo" "source/$dir"
            git -C "source/$dir" checkout --detach "$commit"
            test "$(git -C "source/$dir" rev-parse HEAD)" = "$commit"
            git -C "source/$dir" status --short > "artifact/${dir}-status.txt"
            printf '%s\n' "$commit" > "artifact/${dir}-commit.txt"
          }

          clone_pin https://github.com/okxlabs/Web3-DEX-Router-Solana-V1.git solana 677d3eced859d12629e354eb320ab301710002e5
          clone_pin https://github.com/okxlabs/Web3-DEX-Router-Sui-V1.git sui 30843f92ad6ec86e7418d41df1a630ad53ff4262
          clone_pin https://github.com/okxlabs/Web3-DEX-Router-Aptos-V1.git aptos c78b8b9d4266e5d28587bb80590eb18cf15471fd

          tar --exclude='.git' --exclude='*/.git' -czf artifact/okx-crossvm-exact-public-source.tar.gz -C source solana sui aptos
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: okx-crossvm-exact-public-source
          path: artifact
          retention-days: 1
          if-no-files-found: error
