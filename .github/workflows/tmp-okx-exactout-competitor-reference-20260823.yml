name: Temporary exact-out reference source export 2026-08-23

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp/okx-exactout-competitor-reference-20260823.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Export official Uniswap V3 exact-output scratch-state reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact source
          git clone --quiet https://github.com/Uniswap/v3-periphery.git source/v3-periphery
          head="$(git -C source/v3-periphery rev-parse HEAD)"
          printf '%s\n' "$head" > artifact/uniswap-v3-periphery-head.txt
          cp source/v3-periphery/contracts/SwapRouter.sol artifact/UniswapV3_SwapRouter.sol
          grep -n -C 14 -E 'DEFAULT_AMOUNT_IN_CACHED|amountInCached' \
            source/v3-periphery/contracts/SwapRouter.sol \
            > artifact/UniswapV3_amountInCached_excerpt.txt
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exactout-reference-source
          path: artifact
          retention-days: 1
          if-no-files-found: error
