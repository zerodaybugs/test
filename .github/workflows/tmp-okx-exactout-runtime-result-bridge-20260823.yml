name: Temporary OKX Exact-Out runtime result bridge 2026-08-23

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp/okx-exactout-runtime-result-bridge-20260823.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Capture current read-only deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/okx-exactout-probe
          mkdir -p /tmp/okx-exactout-probe/source /tmp/okx-exactout-probe/artifact
          router_commit='1fc1508df3caeb18a8179dfc0ea4e956099ab481'
          git clone --quiet https://github.com/okxlabs/Web3-DEX-Router-EVM-V1.git /tmp/okx-exactout-probe/source/router
          git -C /tmp/okx-exactout-probe/source/router checkout --quiet --detach "$router_commit"
          test "$(git -C /tmp/okx-exactout-probe/source/router rev-parse HEAD)" = "$router_commit"
          cp /tmp/okx-exactout-probe/source/router/DEPLOYMENT.md /tmp/okx-exactout-probe/artifact/DEPLOYMENT.md
          printf '%s\n' "$router_commit" > /tmp/okx-exactout-probe/artifact/source-commit.txt

          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess, hashlib, datetime

          root = Path('/tmp/okx-exactout-probe')
          deployment = (root/'source/router/DEPLOYMENT.md').read_text()
          section = deployment.split('## Exact-Out Router Deployments', 1)[1]
          section = section.split('\n## ', 1)[0]
          rows = []
          for line in section.splitlines():
              if not line.startswith('|') or '---' in line or 'Network' in line:
                  continue
              cells = [c.strip() for c in line.strip('|').split('|')]
              if len(cells) < 3:
                  continue
              try:
                  chain_id = int(cells[1].replace(',', ''))
              except ValueError:
                  continue
              match = re.search(r'0x[0-9a-fA-F]{40}', cells[2])
              if match:
                  rows.append((cells[0], chain_id, match.group(0)))

          rpc_by_chain = {
              1: 'https://ethereum-rpc.publicnode.com',
              42161: 'https://arbitrum-one-rpc.publicnode.com',
              8453: 'https://base-rpc.publicnode.com',
              56: 'https://bsc-rpc.publicnode.com',
              10: 'https://optimism-rpc.publicnode.com',
              137: 'https://polygon-bor-rpc.publicnode.com',
              43114: 'https://avalanche-c-chain-rpc.publicnode.com',
          }
          impl_slot = '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'

          selectors = {
              'uniswapV3SwapExactOutTo': subprocess.check_output([
                  'cast','sig','uniswapV3SwapExactOutTo(uint256,uint256,uint256,uint256[])'
              ], text=True).strip(),
              'unxswapExactOutTo': subprocess.check_output([
                  'cast','sig','unxswapExactOutTo(uint256,uint256,uint256,address,bytes32[])'
              ], text=True).strip(),
          }

          def run(args, timeout=35):
              cp = subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT, timeout=timeout)
              return cp.returncode, cp.stdout.strip()

          def slot_address(raw):
              raw = raw.strip().lower()
              if not raw.startswith('0x') or len(raw) != 66:
                  return None
              value = '0x' + raw[-40:]
              return None if int(value, 16) == 0 else value

          results = []
          for network, chain_id, proxy in rows:
              rpc = rpc_by_chain.get(chain_id)
              if not rpc:
                  continue
              item = {'network': network, 'chain_id': chain_id, 'proxy': proxy, 'rpc': rpc}
              try:
                  rc, block = run(['cast','block-number','--rpc-url',rpc])
                  item['block'] = int(block) if rc == 0 and block.isdigit() else block
                  rc, proxy_code = run(['cast','code',proxy,'--rpc-url',rpc])
                  item['proxy_code_ok'] = rc == 0 and proxy_code not in ('','0x')
                  item['proxy_code_bytes'] = (len(proxy_code)-2)//2 if item['proxy_code_ok'] else 0
                  item['proxy_code_sha256'] = hashlib.sha256(proxy_code.encode()).hexdigest() if item['proxy_code_ok'] else None

                  rc, raw_impl = run(['cast','storage',proxy,impl_slot,'--rpc-url',rpc])
                  impl = slot_address(raw_impl) if rc == 0 else None
                  item['implementation_slot_raw'] = raw_impl if rc == 0 else None
                  item['implementation'] = impl
                  target = impl or proxy
                  rc, code = run(['cast','code',target,'--rpc-url',rpc])
                  item['code_target'] = target
                  item['implementation_code_ok'] = rc == 0 and code not in ('','0x')
                  item['implementation_code_bytes'] = (len(code)-2)//2 if item['implementation_code_ok'] else 0
                  item['implementation_code_sha256'] = hashlib.sha256(code.encode()).hexdigest() if item['implementation_code_ok'] else None
                  low = code.lower()
                  item['selectors_present'] = {k: v[2:].lower() in low for k,v in selectors.items()}

                  rc, version = run(['cast','call',proxy,'version()(string)','--rpc-url',rpc])
                  item['version_call_ok'] = rc == 0
                  item['version_raw'] = version
                  rc, paused = run(['cast','call',proxy,'paused()(bool)','--rpc-url',rpc])
                  item['paused_call_ok'] = rc == 0
                  item['paused_raw'] = paused
              except Exception as exc:
                  item['error'] = repr(exc)
              results.append(item)

          payload = {
              'captured_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source_commit': '1fc1508df3caeb18a8179dfc0ea4e956099ab481',
              'selectors': selectors,
              'results': results,
          }
          artifact = root/'artifact'
          (artifact/'runtime-binding.json').write_text(json.dumps(payload, indent=2))
          with (artifact/'runtime-binding.tsv').open('w') as f:
              f.write('network\tchain_id\tblock\tproxy\timplementation\tproxy_bytes\timplementation_bytes\tversion_ok\tselectors_ok\terror\n')
              for r in results:
                  f.write('\t'.join(map(str, [
                      r.get('network'), r.get('chain_id'), r.get('block'), r.get('proxy'),
                      r.get('implementation'), r.get('proxy_code_bytes'),
                      r.get('implementation_code_bytes'), r.get('version_call_ok'),
                      all(r.get('selectors_present', {}).values()), r.get('error','')
                  ])) + '\n')
          PY

          sha256sum /tmp/okx-exactout-probe/artifact/* > /tmp/okx-exactout-probe/artifact/SHA256SUMS.txt

      - name: Commit public result snapshot to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          dest='.tmp/results/okx-exactout-runtime-20260823'
          rm -rf "$dest"
          mkdir -p "$dest"
          cp /tmp/okx-exactout-probe/artifact/* "$dest/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git commit -m 'ci: record temporary OKX exact-out runtime binding'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
