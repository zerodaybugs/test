name: Temporary OKX Router PMM source export 2026-08-23

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp/okx-router-pmm-export-20260823.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Export exact public sources and dependencies
        shell: bash
        run: |
          set -euo pipefail
          router_commit='1fc1508df3caeb18a8179dfc0ea4e956099ab481'
          pmm_commit='60052a8a35b65bd4fb8a38212f124317756e5572'
          mkdir -p source artifact

          git clone https://github.com/okxlabs/Web3-DEX-Router-EVM-V1.git source/router
          git -C source/router checkout --detach "$router_commit"
          git -C source/router submodule update --init --recursive
          npm --prefix source/router ci
          test "$(git -C source/router rev-parse HEAD)" = "$router_commit"

          git clone https://github.com/okxlabs/Web3-DEX-EVM-PMM.git source/pmm
          git -C source/pmm checkout --detach "$pmm_commit"
          git -C source/pmm submodule update --init --recursive
          test "$(git -C source/pmm rev-parse HEAD)" = "$pmm_commit"

          printf '%s\n' "$router_commit" > artifact/router-commit.txt
          printf '%s\n' "$pmm_commit" > artifact/pmm-commit.txt
          git -C source/router status --short > artifact/router-status.txt
          git -C source/pmm status --short > artifact/pmm-status.txt
          git -C source/router submodule status --recursive > artifact/router-submodules.txt
          git -C source/pmm submodule status --recursive > artifact/pmm-submodules.txt

          tar --exclude='.git' --exclude='*/.git' -czf artifact/okx-router-pmm-exact-public-source-with-dependencies.tar.gz -C source router pmm
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: okx-router-pmm-exact-public-source-with-dependencies
          path: artifact
          retention-days: 1
          if-no-files-found: error
