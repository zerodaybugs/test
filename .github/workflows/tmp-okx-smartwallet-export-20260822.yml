name: Temporary public OKX smart-wallet source export 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-okx-smartwallet-trigger.txt'
      - '.github/workflows/tmp-okx-smartwallet-export-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Materialize exact public source and dependencies
        shell: bash
        env:
          SMARTWALLET_COMMIT: '95aa59bbc22acd4573a9932e959384fe56c7b543'
        run: |
          set -euo pipefail
          mkdir -p export
          git clone https://github.com/okxlabs/okx-smart-wallet-evm.git export/project
          git -C export/project checkout --detach "$SMARTWALLET_COMMIT"
          git -C export/project submodule update --init --recursive
          npm --prefix export/project ci --ignore-scripts --no-audit --no-fund
          test "$(git -C export/project rev-parse HEAD)" = "$SMARTWALLET_COMMIT"
          printf 'SMARTWALLET_COMMIT=%s\n' "$SMARTWALLET_COMMIT" > export/PINS.txt
          forge --version > export/FOUNDRY_VERSION.txt
          (cd export/project && forge build --force -vv > ../BASELINE_BUILD.log 2>&1)
          (cd export/project && forge test -vv > ../BASELINE_TEST.log 2>&1)
          find export/project -type d -name .git -prune -exec rm -rf {} +
          find export/project -type f -name '.DS_Store' -delete
          find export -type f -printf '%P\t%s bytes\n' | sort > export/ARTIFACT_INDEX.txt
          (cd export && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: okx-smartwallet-source-95aa59b-20260822
          path: export/
          if-no-files-found: error
          retention-days: 1
