name: Temporary OKX Solana authority read-only census 2026-08-23

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp/okx-solana-sa-census-20260823.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public Solana mainnet RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime
          from pathlib import Path

          RPCS = [
              'https://api.mainnet-beta.solana.com',
              'https://solana-rpc.publicnode.com',
          ]
          ADDRESSES = {
              'router_program': '6m2CDdhRgxpH4WjvdzxAYbGxwdGUz5MziiL5jek2kBma',
              'authority_pda': 'HV1KXxWFaSeriyFvXyx48FqG9BoFbfinB8njCJonqP7K',
              'wsol_sa': '2rikd7tzPbmowhUJzPNVtX7fuUGcnBa8jqJnx6HbtHeE',
              'claim_authority': 'CjoV5B96reuCfPh2rRK11G1QptG97jZdyZArTn3EN1Mj',
              'sol_rfq_program': 'RFQ1uATMXfRXemLnbYCF8JZhVfELp2K53jSEAGbsAKX',
          }
          out = Path('artifact')

          def rpc(method, params):
              payload = json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              errors=[]
              for url in RPCS:
                  req=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json','User-Agent':'okx-readonly-census/1.0'})
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          body=r.read()
                          obj=json.loads(body)
                          if 'error' not in obj:
                              return url,obj
                          errors.append((url,obj['error']))
                  except Exception as e:
                      errors.append((url,repr(e)))
              raise RuntimeError(errors)

          summary={}
          for name,address in ADDRESSES.items():
              rec={'address':address}
              for method,params,key in [
                  ('getAccountInfo',[address,{'encoding':'base64','commitment':'finalized'}],'account_info'),
                  ('getBalance',[address,{'commitment':'finalized'}],'balance'),
                  ('getSignaturesForAddress',[address,{'limit':100,'commitment':'finalized'}],'signatures'),
              ]:
                  try:
                      url,obj=rpc(method,params)
                      rec[key]=obj.get('result')
                      rec[key+'_rpc']=url
                      (out/f'{name}-{key}.json').write_text(json.dumps(obj,indent=2,sort_keys=True))
                  except Exception as e:
                      rec[key+'_error']=repr(e)
              summary[name]=rec

          for owner_name in ['authority_pda','wsol_sa','claim_authority']:
              address=ADDRESSES[owner_name]
              for program_name,program_id in [
                  ('spl_token','TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'),
                  ('token_2022','TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb'),
              ]:
                  try:
                      url,obj=rpc('getTokenAccountsByOwner',[address,{'programId':program_id},{'encoding':'jsonParsed','commitment':'finalized'}])
                      summary[owner_name][program_name+'_token_accounts']=obj.get('result')
                      summary[owner_name][program_name+'_token_accounts_rpc']=url
                      (out/f'{owner_name}-{program_name}-token-accounts.json').write_text(json.dumps(obj,indent=2,sort_keys=True))
                  except Exception as e:
                      summary[owner_name][program_name+'_token_accounts_error']=repr(e)

          # Token-largest account inventory for mints actually held by the authority, if any.
          held=[]
          for owner_name in ['authority_pda','wsol_sa']:
              for k,v in summary[owner_name].items():
                  if not k.endswith('_token_accounts') or not isinstance(v,dict): continue
                  for item in v.get('value',[]):
                      info=(((item.get('account') or {}).get('data') or {}).get('parsed') or {}).get('info') or {}
                      amt=((info.get('tokenAmount') or {}).get('amount'))
                      held.append({
                          'owner_name':owner_name,
                          'pubkey':item.get('pubkey'),
                          'mint':info.get('mint'),
                          'token_owner':info.get('owner'),
                          'raw_amount':amt,
                          'ui_amount_string':(info.get('tokenAmount') or {}).get('uiAmountString'),
                          'decimals':(info.get('tokenAmount') or {}).get('decimals'),
                          'program':(item.get('account') or {}).get('owner'),
                      })
          summary['held_token_accounts']=held
          (out/'held-token-accounts.json').write_text(json.dumps(held,indent=2,sort_keys=True))
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          (out/'captured-at-utc.txt').write_text(datetime.datetime.now(datetime.timezone.utc).isoformat()+'\n')
          PY
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: okx-solana-authority-readonly-census
          path: artifact
          retention-days: 1
          if-no-files-found: error
