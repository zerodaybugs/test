name: Temporary public OKX transfer-boundary census v3 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-okx-boundary-trigger-v3.txt'
      - '.github/workflows/tmp-okx-transfer-boundary-census-v3-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruct public post-transaction token-balance boundaries
        shell: bash
        env:
          ROUTER: '0x5E1f62Dac767b0491e3CE72469C217365D5B48cC'
          ADAPTER: '0x4ecD468E1010E006f768EC034e5a6d8803183469'
          PROTOCOL: '0x73b920dC64ab6156f2D22b85AB9A9b06E597e154'
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from collections import defaultdict
          from decimal import Decimal, getcontext
          from pathlib import Path

          getcontext().prec = 100
          BASE = 'https://eth.blockscout.com/api/v2'
          TARGETS = {
              'ROUTER': os.environ['ROUTER'],
              'ADAPTER': os.environ['ADAPTER'],
              'PROTOCOL': os.environ['PROTOCOL'],
          }
          COMMON = {
              'WETH': '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2',
              'USDT': '0xdac17f958d2ee523a2206206994597c13d831ec7',
              'USDC': '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48',
              'DAI': '0x6b175474e89094c44da98b954eedeac495271d0f',
              'WBTC': '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599',
              'cbBTC': '0xcbb7c0000ab88b473b1f5afd9ef808440eed33bf',
              'USDS': '0xdc035d45d973e3ec169d2276ddab16f1e407384f',
              'stETH': '0xae7ab96520de3a18e5e111b5eaab095312d7fe84',
              'wstETH': '0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0',
              'LINK': '0x514910771af9ca656af840dff83e8264ecf986ca',
              'UNI': '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984',
              'AAVE': '0x7fc66500c84a76ad7e9c93437bfc5ac33e2ddae9',
              'FRAX': '0x853d955acef822db058eb8505911ed77f175b99e',
              'LUSD': '0x5f98805a4e8be255a32880fdec7f6728c6568ba0',
          }
          COMMON_BY_ADDRESS = {v.lower(): k for k, v in COMMON.items()}

          def get_json(url):
              last = None
              for attempt in range(8):
                  try:
                      req = urllib.request.Request(url, headers={
                          'Accept':'application/json',
                          'User-Agent':'public-readonly-transfer-boundary-census/3.0',
                      })
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return json.loads(response.read())
                  except Exception as exc:
                      last = exc
                      time.sleep(min(10, 1 + attempt))
              raise RuntimeError(f'GET failed {url}: {last}')

          def addr(value):
              if isinstance(value, dict):
                  return str(value.get('hash') or value.get('address_hash') or value.get('address') or '').lower()
              return str(value or '').lower()

          def integer(value, default=0):
              try:
                  if isinstance(value, str) and value.startswith('0x'):
                      return int(value, 16)
                  return int(value)
              except Exception:
                  return default

          def token_meta(item):
              token = item.get('token') or {}
              total = item.get('total') or {}
              token_address = str(token.get('address_hash') or token.get('address') or '').lower()
              decimals = integer(token.get('decimals'), integer(total.get('decimals'), 0))
              raw = integer(total.get('value'), integer(item.get('value'), 0))
              rate = None
              try:
                  if token.get('exchange_rate') not in (None, ''):
                      rate = Decimal(str(token.get('exchange_rate')))
              except Exception:
                  rate = None
              return token_address, decimals, raw, rate, token

          current_balances = defaultdict(dict)
          token_catalog = {}
          all_transfers = {}

          for target_name, target in TARGETS.items():
              balance_items = get_json(f'{BASE}/addresses/{target}/token-balances')
              Path(f'evidence/{target_name}_TOKEN_BALANCES_RAW.json').write_text(json.dumps(balance_items, indent=2, sort_keys=True) + '\n')
              if isinstance(balance_items, list):
                  for item in balance_items:
                      token_address, decimals, raw, rate, token = token_meta(item)
                      if not token_address or token.get('type') != 'ERC-20':
                          continue
                      current_balances[target_name][token_address] = raw
                      token_catalog[token_address] = {
                          'address': token_address,
                          'symbol': token.get('symbol') or COMMON_BY_ADDRESS.get(token_address, ''),
                          'name': token.get('name') or '',
                          'decimals': decimals,
                          'exchange_rate': '' if rate is None else str(rate),
                          'common_name': COMMON_BY_ADDRESS.get(token_address, ''),
                      }

              url = f'{BASE}/addresses/{target}/token-transfers'
              collected = []
              for page_no in range(40):
                  page = get_json(url)
                  items = (page.get('items') or []) if isinstance(page, dict) else []
                  for item in items:
                      item['_capture_sequence'] = len(collected)
                      collected.append(item)
                      token_address, decimals, _raw, rate, token = token_meta(item)
                      if token_address:
                          existing = token_catalog.setdefault(token_address, {
                              'address': token_address,
                              'symbol': '', 'name': '', 'decimals': decimals,
                              'exchange_rate': '', 'common_name': COMMON_BY_ADDRESS.get(token_address, ''),
                          })
                          existing['symbol'] = existing['symbol'] or token.get('symbol') or existing['common_name']
                          existing['name'] = existing['name'] or token.get('name') or ''
                          existing['decimals'] = decimals or existing['decimals']
                          if not existing['exchange_rate'] and rate is not None:
                              existing['exchange_rate'] = str(rate)
                  nxt = page.get('next_page_params') if isinstance(page, dict) else None
                  if not nxt:
                      break
                  url = f'{BASE}/addresses/{target}/token-transfers?' + urllib.parse.urlencode(nxt)
                  time.sleep(0.15)
              all_transfers[target_name] = collected
              Path(f'evidence/{target_name}_TOKEN_TRANSFERS_RAW.json').write_text(json.dumps(collected, indent=2, sort_keys=True) + '\n')

          boundary_rows = []
          summaries = []
          material_signals = []

          for target_name, target in TARGETS.items():
              target_lower = target.lower()
              events_by_token = defaultdict(list)
              for item in all_transfers[target_name]:
                  token_address, decimals, raw, rate, token = token_meta(item)
                  if not token_address or raw < 0:
                      continue
                  from_address = addr(item.get('from'))
                  to_address = addr(item.get('to'))
                  incoming = raw if to_address == target_lower else 0
                  outgoing = raw if from_address == target_lower else 0
                  if incoming == 0 and outgoing == 0:
                      continue
                  events_by_token[token_address].append({
                      'sequence': integer(item.get('_capture_sequence')),
                      'block_number': integer(item.get('block_number')),
                      'transaction_index': integer(item.get('transaction_index'), -1),
                      'log_index': integer(item.get('log_index'), -1),
                      'tx_hash': str(item.get('transaction_hash') or ''),
                      'timestamp': str(item.get('timestamp') or ''),
                      'incoming_raw': incoming,
                      'outgoing_raw': outgoing,
                      'from': from_address,
                      'to': to_address,
                  })

              token_set = set(events_by_token) | set(current_balances[target_name])
              for token_address in sorted(token_set):
                  meta = token_catalog.get(token_address, {
                      'address':token_address, 'symbol':'', 'name':'', 'decimals':0,
                      'exchange_rate':'', 'common_name':COMMON_BY_ADDRESS.get(token_address,''),
                  })
                  groups = {}
                  for event in events_by_token.get(token_address, []):
                      key = event['tx_hash'] or f"{event['block_number']}:{event['sequence']}"
                      group = groups.setdefault(key, {
                          'tx_hash':event['tx_hash'],
                          'block_number':event['block_number'],
                          'timestamp':event['timestamp'],
                          'first_sequence':event['sequence'],
                          'incoming_raw':0,
                          'outgoing_raw':0,
                          'event_count':0,
                      })
                      group['first_sequence'] = min(group['first_sequence'], event['sequence'])
                      group['incoming_raw'] += event['incoming_raw']
                      group['outgoing_raw'] += event['outgoing_raw']
                      group['event_count'] += 1
                  ordered = sorted(groups.values(), key=lambda x: x['first_sequence'])

                  running_after = int(current_balances[target_name].get(token_address, 0))
                  max_after = running_after
                  positive_boundaries = 1 if running_after > 0 else 0
                  longest_positive_block_gap = 0
                  last_positive_block = None
                  earliest_block = None
                  latest_block = None

                  for group in ordered:
                      net = group['incoming_raw'] - group['outgoing_raw']
                      balance_after = running_after
                      balance_before = balance_after - net
                      if balance_before < 0:
                          # The capture window is finite. Preserve the observed boundary and mark truncation.
                          truncated = True
                      else:
                          truncated = False
                      max_after = max(max_after, balance_after)
                      if balance_after > 0:
                          positive_boundaries += 1
                          if last_positive_block is not None and group['block_number'] > 0:
                              longest_positive_block_gap = max(longest_positive_block_gap, abs(last_positive_block - group['block_number']))
                          last_positive_block = group['block_number']
                      earliest_block = group['block_number'] if earliest_block is None else min(earliest_block, group['block_number'])
                      latest_block = group['block_number'] if latest_block is None else max(latest_block, group['block_number'])
                      boundary_rows.append({
                          'target':target_name,
                          'token':token_address,
                          'symbol':meta.get('symbol',''),
                          'common_name':meta.get('common_name',''),
                          'decimals':meta.get('decimals',0),
                          'tx_hash':group['tx_hash'],
                          'block_number':group['block_number'],
                          'timestamp':group['timestamp'],
                          'incoming_raw':group['incoming_raw'],
                          'outgoing_raw':group['outgoing_raw'],
                          'net_raw':net,
                          'balance_before_raw':balance_before,
                          'balance_after_raw':balance_after,
                          'capture_truncated_before':truncated,
                      })
                      running_after = balance_before

                  decimals = integer(meta.get('decimals'), 0)
                  scale = Decimal(10) ** decimals
                  rate = Decimal(str(meta['exchange_rate'])) if meta.get('exchange_rate') not in (None, '') else None
                  max_human = Decimal(max_after) / scale
                  max_usd = max_human * rate if rate is not None else None
                  summary = {
                      'target':target_name,
                      'token':token_address,
                      'symbol':meta.get('symbol',''),
                      'name':meta.get('name',''),
                      'common_name':meta.get('common_name',''),
                      'decimals':decimals,
                      'current_raw':str(current_balances[target_name].get(token_address,0)),
                      'current_human':str(Decimal(current_balances[target_name].get(token_address,0))/scale),
                      'transfer_transactions_captured':len(ordered),
                      'earliest_block':earliest_block or 0,
                      'latest_block':latest_block or 0,
                      'max_post_tx_raw':str(max_after),
                      'max_post_tx_human':str(max_human),
                      'exchange_rate_usd':'' if rate is None else str(rate),
                      'max_post_tx_estimated_usd':'' if max_usd is None else str(max_usd),
                      'positive_post_tx_boundaries':positive_boundaries,
                      'longest_observed_positive_block_gap':longest_positive_block_gap,
                  }
                  summaries.append(summary)
                  if meta.get('common_name') and max_usd is not None and max_usd >= Decimal('1000') and positive_boundaries > 0:
                      material_signals.append(summary)

          def write_tsv(path, rows):
              if not rows:
                  Path(path).write_text('NO_ROWS\n')
                  return
              keys = list(rows[0].keys())
              with open(path, 'w', encoding='utf-8') as f:
                  f.write('\t'.join(keys) + '\n')
                  for row in rows:
                      f.write('\t'.join(str(row.get(k,'')) for k in keys) + '\n')

          summaries.sort(key=lambda x: (x['target'], x['common_name'] == '', -(Decimal(x['max_post_tx_estimated_usd']) if x['max_post_tx_estimated_usd'] else Decimal(0)), x['symbol']))
          boundary_rows.sort(key=lambda x: (x['target'], x['token'], -integer(x['block_number']), x['tx_hash']))
          write_tsv('evidence/TOKEN_BOUNDARY_SUMMARY.tsv', summaries)
          write_tsv('evidence/TRANSACTION_BOUNDARIES.tsv', boundary_rows)
          Path('evidence/TOKEN_CATALOG.json').write_text(json.dumps(token_catalog, indent=2, sort_keys=True) + '\n')

          verdict = {
              'captured_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'targets': TARGETS,
              'transfer_items_captured': {k:len(v) for k,v in all_transfers.items()},
              'summary_rows': len(summaries),
              'boundary_rows': len(boundary_rows),
              'material_common_token_signals': material_signals,
              'decision': 'MATERIAL_OPERATIONAL_RESIDUAL_SIGNAL' if material_signals else 'NO_MATERIAL_COMMON_TOKEN_RESIDUAL_IN_CAPTURED_WINDOW',
              'method_note': 'Balances are reconstructed at transaction boundaries by reversing captured ERC-20 transfer net flows from the current Blockscout balance. Intra-transaction balances are intentionally excluded.',
          }
          Path('evidence/BOUNDARY_VERDICT.json').write_text(json.dumps(verdict, indent=2, sort_keys=True) + '\n')
          print(json.dumps(verdict, indent=2, sort_keys=True))
          PY
          find evidence -type f -printf '%P\t%s bytes\n' | sort > evidence/ARTIFACT_INDEX.txt
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload boundary census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-transfer-boundary-census-v3-20260822
          path: evidence/
          if-no-files-found: error
          retention-days: 1
