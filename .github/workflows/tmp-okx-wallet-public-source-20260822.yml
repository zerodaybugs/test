name: Temporary public OKX smart-wallet source export 2026-08-22

on:
  push:
    branches:
      - 'tmp/okx-wallet-public-source-20260822'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_COMMIT: '95aa59bbc22acd4573a9932e959384fe56c7b543'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Materialize exact public repository and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/evidence
          git clone https://github.com/okxlabs/okx-smart-wallet-evm.git export/repo
          git -C export/repo checkout --detach "$TARGET_COMMIT"
          git -C export/repo submodule update --init --recursive
          test "$(git -C export/repo rev-parse HEAD)" = "$TARGET_COMMIT"
          npm --prefix export/repo ci --ignore-scripts --no-audit --no-fund
          printf 'TARGET_COMMIT=%s\n' "$TARGET_COMMIT" > export/evidence/PIN.txt
          forge --version > export/evidence/FOUNDRY_VERSION.txt
          (cd export/repo && forge build --force -vv > ../evidence/BUILD.log 2>&1)
          set +e
          (cd export/repo && forge test -vv > ../evidence/TEST.log 2>&1)
          status=$?
          set -e
          printf '%s\n' "$status" > export/evidence/TEST_EXIT_STATUS.txt
          find export/repo -type d -name .git -prune -exec rm -rf {} +
          find export/repo -type f -name '.DS_Store' -delete
          (cd export && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload exact public source bundle
        uses: actions/upload-artifact@v4
        with:
          name: okx-smart-wallet-public-source-95aa59b
          path: export/
          if-no-files-found: error
          retention-days: 1
