name: Temporary public OKX smart-wallet source export 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-okx-wallet-source-trigger.txt'
      - '.github/workflows/tmp-okx-wallet-source-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WALLET_COMMIT: '95aa59bbc22acd4573a9932e959384fe56c7b543'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Materialize exact public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/evidence work
          git clone https://github.com/okxlabs/okx-smart-wallet-evm.git artifact/project
          git -C artifact/project checkout --detach "$WALLET_COMMIT"
          test "$(git -C artifact/project rev-parse HEAD)" = "$WALLET_COMMIT"

          for path in \
            lib/account-abstraction \
            lib/forge-std \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/solady \
            lib/webauthn-sol; do
            git -C artifact/project submodule update --init --recursive "$path"
          done

          git -C artifact/project submodule status > artifact/evidence/SUBMODULE_STATUS.txt || true
          printf '%s\n' \
            'OPTIONAL_PRIVATE_SUBMODULE=lib/smart-wallet-recovery' \
            'PIN=69fd01790461816359cd46320822bc1ab9231ac4' \
            'PUBLIC_BASELINE_EXCLUSION=test/Recovery.t.sol only' \
            > artifact/evidence/PRIVATE_SUBMODULE_BOUNDARY.txt
          printf 'WALLET_COMMIT=%s\n' "$WALLET_COMMIT" > artifact/evidence/PINS.txt
          forge --version > artifact/evidence/FOUNDRY_VERSION.txt

      - name: Install dependencies and run public exact-source baseline
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix artifact/project ci --ignore-scripts --no-audit --no-fund
          cp -a artifact/project work/project
          rm -f work/project/test/Recovery.t.sol
          cd work/project
          forge clean
          forge build --force -vv > "$GITHUB_WORKSPACE/artifact/evidence/BUILD.log" 2>&1
          forge test -vv > "$GITHUB_WORKSPACE/artifact/evidence/BASELINE_TEST.log" 2>&1
          grep -E 'Suite result|Ran [0-9]+ test|\[PASS\]|\[FAIL' \
            "$GITHUB_WORKSPACE/artifact/evidence/BASELINE_TEST.log" \
            > "$GITHUB_WORKSPACE/artifact/evidence/BASELINE_SUMMARY.txt" || true
          test "$(grep -c '\[FAIL' "$GITHUB_WORKSPACE/artifact/evidence/BASELINE_TEST.log" || true)" = '0'

      - name: Seal public bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact/project/node_modules
          find artifact/project -type d -name .git -prune -exec rm -rf {} +
          find artifact/project -type f -name '.DS_Store' -delete
          find artifact -type f -printf '%P\t%s bytes\n' | sort > artifact/evidence/ARTIFACT_INDEX.txt
          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload exact public source and baseline
        uses: actions/upload-artifact@v4
        with:
          name: okx-smart-wallet-exact-source-20260822
          path: artifact/
          if-no-files-found: error
          retention-days: 1
