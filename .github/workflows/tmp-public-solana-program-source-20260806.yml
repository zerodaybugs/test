name: Temporary pinned public Solana program source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-public-solana-program-source-20260806.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch immutable public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/velocity-exchange/protocol-v2.git source
          cd source
          git checkout --detach 13e8e9b8d614f3b62e3a65a8c372c819e6529aeb
          test "$(git rev-parse HEAD)" = "13e8e9b8d614f3b62e3a65a8c372c819e6529aeb"
          printf '%s\n' "$(git rev-parse HEAD)" > ../SOURCE_COMMIT.txt
          git status --short > ../SOURCE_STATUS.txt
          cd ..
          tar -czf velocity-public-source-13e8e9b8.tar.gz \
            source/programs/drift \
            source/sdk/src/idl/drift.json \
            source/sdk/src/driftClient.ts \
            source/Anchor.toml \
            source/Cargo.toml \
            SOURCE_COMMIT.txt SOURCE_STATUS.txt
          sha256sum velocity-public-source-13e8e9b8.tar.gz > velocity-public-source-13e8e9b8.tar.gz.sha256

      - name: Upload public-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-public-source-13e8e9b8-${{ github.run_id }}
          path: |
            velocity-public-source-13e8e9b8.tar.gz
            velocity-public-source-13e8e9b8.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
