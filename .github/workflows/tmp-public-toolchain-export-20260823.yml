name: Temporary public toolchain export 2026-08-23

on:
  push:
    paths:
      - .github/workflows/tmp-public-toolchain-export-20260823.yml
  pull_request:
    branches:
      - main
    paths:
      - .tmp/toolchain-trigger-20260823.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Export official binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/bin
          for tool in forge cast anvil chisel; do
            path="$(command -v "$tool")"
            cp "$path" "artifact/bin/$tool"
            chmod 0755 "artifact/bin/$tool"
          done

          curl --fail --location --silent --show-error --retry 3 \
            -o artifact/bin/solc-0.8.29 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.29+commit.ab55807c'
          chmod 0755 artifact/bin/solc-0.8.29

          expected='18d418a40dc04d17656b1b5c8a7b35cfbab8942b51f38d005d5b59e8aa6637e0'
          actual="$(sha256sum artifact/bin/solc-0.8.29 | awk '{print $1}')"
          test "$actual" = "$expected"

          forge --version | tee artifact/forge-version.txt
          cast --version | tee artifact/cast-version.txt
          anvil --version | tee artifact/anvil-version.txt
          artifact/bin/solc-0.8.29 --version | tee artifact/solc-version.txt

      - name: Export exact public OKX Smart Wallet source with public dependencies
        shell: bash
        run: |
          set -euo pipefail
          commit='95aa59bbc22acd4573a9932e959384fe56c7b543'
          webauthn_commit='619f20ab0f074fef41066ee4ab24849a913263b2'
          fresh_commit='76f3f135b7b27d2aa519f265b56bfc49a2573ab5'

          git clone https://github.com/okxlabs/okx-smart-wallet-evm.git source/okx-smart-wallet-evm
          git -C source/okx-smart-wallet-evm checkout --detach "$commit"
          git -C source/okx-smart-wallet-evm submodule update --init \
            lib/account-abstraction \
            lib/forge-std \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/solady \
            lib/webauthn-sol

          test "$(git -C source/okx-smart-wallet-evm rev-parse HEAD)" = "$commit"
          test "$(git -C source/okx-smart-wallet-evm/lib/webauthn-sol rev-parse HEAD)" = "$webauthn_commit"

          rm -rf source/okx-smart-wallet-evm/lib/webauthn-sol/lib/FreshCryptoLib
          git clone https://github.com/rdubois-crypto/FreshCryptoLib.git \
            source/okx-smart-wallet-evm/lib/webauthn-sol/lib/FreshCryptoLib
          git -C source/okx-smart-wallet-evm/lib/webauthn-sol/lib/FreshCryptoLib checkout --detach "$fresh_commit"
          test "$(git -C source/okx-smart-wallet-evm/lib/webauthn-sol/lib/FreshCryptoLib rev-parse HEAD)" = "$fresh_commit"

          git -C source/okx-smart-wallet-evm status --short > artifact/source-status.txt
          git -C source/okx-smart-wallet-evm submodule status > artifact/submodule-status.txt
          printf '%s\n' "$commit" > artifact/source-commit.txt
          printf '%s\n' "$webauthn_commit" > artifact/webauthn-commit.txt
          printf '%s\n' "$fresh_commit" > artifact/freshcryptolib-commit.txt
          printf '%s\n' 'lib/smart-wallet-recovery was not exported because the upstream URL is not anonymously accessible; production SmartWalletEntry does not import it.' > artifact/optional-private-submodule-note.txt
          tar --exclude='.git' --exclude='*/.git' -czf \
            artifact/okx-smart-wallet-evm-95aa59bbc22acd4573a9932e959384fe56c7b543-public-source.tar.gz \
            -C source okx-smart-wallet-evm

      - name: Capture advertised deployments through read-only RPC
        shell: bash
        run: |
          set -euo pipefail
          entry='0xe40ccB2D94975c51bff0C004eFDfd9B3a5796fA4'
          factory='0xDd3FEa01cD550C9EFfC893f346690b9A649f35EF'
          mkdir -p artifact/deployment
          cat > artifact/deployment/endpoints.tsv <<'EOF'
          ethereum	https://ethereum-rpc.publicnode.com
          base	https://base-rpc.publicnode.com
          arbitrum	https://arbitrum-one-rpc.publicnode.com
          optimism	https://optimism-rpc.publicnode.com
          bsc	https://bsc-rpc.publicnode.com
          polygon	https://polygon-bor-rpc.publicnode.com
          EOF

          printf 'chain\tblock\tentry_bytes\tfactory_bytes\tfactory_implementation\n' > artifact/deployment/summary.tsv
          while IFS=$'\t' read -r chain rpc; do
            block="$(cast block-number --rpc-url "$rpc")"
            cast code "$entry" --rpc-url "$rpc" > "artifact/deployment/${chain}-entry.hex"
            cast code "$factory" --rpc-url "$rpc" > "artifact/deployment/${chain}-factory.hex"
            impl="$(cast call "$factory" 'IMPLEMENTATION()(address)' --rpc-url "$rpc")"
            entry_bytes=$(( ( $(wc -c < "artifact/deployment/${chain}-entry.hex") - 3 ) / 2 ))
            factory_bytes=$(( ( $(wc -c < "artifact/deployment/${chain}-factory.hex") - 3 ) / 2 ))
            printf '%s\t%s\t%s\t%s\t%s\n' "$chain" "$block" "$entry_bytes" "$factory_bytes" "$impl" >> artifact/deployment/summary.tsv
          done < artifact/deployment/endpoints.tsv

          sha256sum artifact/deployment/*-entry.hex > artifact/deployment/entry-code-sha256.txt
          sha256sum artifact/deployment/*-factory.hex > artifact/deployment/factory-code-sha256.txt

      - name: Record checksums
        shell: bash
        run: |
          set -euo pipefail
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Upload toolchain, exact public source, and read-only deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: official-foundry-solc-okx-source-and-deployments
          path: artifact
          if-no-files-found: error
          retention-days: 1
