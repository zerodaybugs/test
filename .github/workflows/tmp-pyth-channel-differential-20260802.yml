name: Temporary official Pyth multi-channel capture 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-pyth-channel-diff/**'
      - '.github/workflows/tmp-pyth-channel-differential-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture signed payloads through the official rate-limited playground
        shell: bash
        env:
          OUT_DIR: evidence
          MAX_MESSAGES: '40'
          MAX_DURATION_MS: '18000'
        run: |
          set -o pipefail
          mkdir -p evidence
          node --check .tmp-pyth-channel-diff/capture.mjs
          sha256sum .tmp-pyth-channel-diff/capture.mjs > evidence/CAPTURE_SHA256.txt
          node .tmp-pyth-channel-diff/capture.mjs 2>&1 | tee evidence/RUN_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > evidence/EXIT_CODE.txt
          exit "$code"
      - name: Build immutable evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('evidence'); root.mkdir(exist_ok=True)
          rows=[]
          for p in sorted(x for x in root.iterdir() if x.is_file() and x.name not in {'MANIFEST.json','SHA256SUMS.txt'}):
              data=p.read_bytes(); rows.append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as f:
              for row in rows: f.write(f"{row['sha256']}  {row['name']}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-official-channel-differential-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
