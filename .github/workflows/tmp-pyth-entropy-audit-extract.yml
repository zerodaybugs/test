name: Temporary public Pyth Entropy audit extraction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-entropy-audit-extract.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download canonical public audit and extract text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://raw.githubusercontent.com/pyth-network/audit-reports/03d40026e95d266f647fa91f9548124f8d398c77/2024_23_01/Pyth%20Data%20Association%20-%20Entropy%20-%20Comprehensive%20Report.pdf'
          curl -fL --retry 5 "$URL" -o out/pyth-entropy-tob-audit.pdf
          file out/pyth-entropy-tob-audit.pdf | tee out/file.txt
          grep -F 'PDF document' out/file.txt
          pdfinfo out/pyth-entropy-tob-audit.pdf > out/pdfinfo.txt
          pdftotext -layout out/pyth-entropy-tob-audit.pdf out/pyth-entropy-tob-audit.txt
          test -s out/pyth-entropy-tob-audit.txt
          sha256sum out/pyth-entropy-tob-audit.pdf out/pyth-entropy-tob-audit.txt > out/SHA256SUMS
          grep -Ein 'critical|high|medium|low|informational|finding|issue|recommendation' \
            out/pyth-entropy-tob-audit.txt > out/finding-index.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: pyth-entropy-public-audit-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
