name: Temporary public Pyth Entropy Fortuna config snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-entropy-fortuna-config.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Capture public production configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://fortuna.dourolabs.app/v1/chains/configs'
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H 'accept: application/json' "$URL" -o out/fortuna-mainnet-chain-configs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/fortuna-mainnet-chain-configs.json')
          rows = json.loads(p.read_text())
          if not isinstance(rows, list) or not rows:
              raise SystemExit('invalid or empty config response')
          required = {'name','network_id','contract_addr','reveal_delay_blocks','gas_limit','default_fee'}
          for row in rows:
              if not required.issubset(row):
                  raise SystemExit(f'missing fields: {row}')
          rows = sorted(rows, key=lambda x: x['name'])
          Path('out/fortuna-mainnet-chain-configs.normalized.json').write_text(
              json.dumps(rows, indent=2, sort_keys=True) + '\n'
          )
          summary = {
              'chain_count': len(rows),
              'min_reveal_delay_blocks': min(x['reveal_delay_blocks'] for x in rows),
              'max_reveal_delay_blocks': max(x['reveal_delay_blocks'] for x in rows),
              'min_callback_gas_limit': min(x['gas_limit'] for x in rows),
              'max_callback_gas_limit': max(x['gas_limit'] for x in rows),
              'zero_delay_chains': [x['name'] for x in rows if x['reveal_delay_blocks'] == 0],
              'one_block_delay_chains': [x['name'] for x in rows if x['reveal_delay_blocks'] == 1],
          }
          Path('out/SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, sort_keys=True))
          PY
          sha256sum out/* > out/SHA256SUMS
          printf '%s\n' 'PUBLIC_CHAIN_TRANSACTIONS=0' > out/PUBLIC_CHAIN_TRANSACTIONS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pyth-entropy-fortuna-public-config-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
