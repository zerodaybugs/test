name: Temporary encrypted Pyth Entropy multichain drift scan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-entropy-multichain-scan.yml'
      - 'tmp-research/pyth-entropy/**'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout scan infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry tooling
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Decode and verify scan helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pyth-entropy-scan
          base64 -d tmp-research/pyth-entropy/pyth_entropy_scan.py.gz.b64 \
            | gzip -d > /tmp/pyth-entropy-scan/scan.py
          chmod 0700 /tmp/pyth-entropy-scan/scan.py
          python3 -m py_compile /tmp/pyth-entropy-scan/scan.py
          sha256sum /tmp/pyth-entropy-scan/scan.py \
            > /tmp/pyth-entropy-scan/scan.py.sha256
          grep -F 'signed_or_broadcast_transactions": 0' \
            /tmp/pyth-entropy-scan/scan.py

      - name: Execute read-only mainnet deployment scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pyth-entropy-scan/evidence
          START=$(date +%s)
          set +e
          timeout 4800 python3 /tmp/pyth-entropy-scan/scan.py \
            /tmp/pyth-entropy-scan/evidence \
            > /tmp/pyth-entropy-scan/console.log 2>&1
          STATUS=$?
          set -e
          END=$(date +%s)
          printf '%s\n' "$STATUS" > /tmp/pyth-entropy-scan/scan-exit-code.txt
          printf '%s\n' "$((END - START))" > /tmp/pyth-entropy-scan/duration-seconds.txt
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/pyth-entropy-scan/github-run-id.txt
          printf '%s\n' "$GITHUB_SHA" > /tmp/pyth-entropy-scan/github-sha.txt
          tail -n 20 /tmp/pyth-entropy-scan/console.log || true
          test "$STATUS" = '0' -o "$STATUS" = '2'
          test -s /tmp/pyth-entropy-scan/evidence/PYTH_ENTROPY_MULTICHAIN_SCAN.json
          test -s /tmp/pyth-entropy-scan/evidence/SUMMARY.json
          grep -F 'signed_or_broadcast_transactions=0' \
            /tmp/pyth-entropy-scan/console.log

      - name: Encrypt all detailed evidence before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-output /tmp/pyth-entropy-scan/evidence
          cp /tmp/pyth-entropy-scan/scan-exit-code.txt \
            /tmp/pyth-entropy-scan/duration-seconds.txt \
            /tmp/pyth-entropy-scan/github-run-id.txt \
            /tmp/pyth-entropy-scan/github-sha.txt \
            /tmp/pyth-entropy-scan/scan.py.sha256 \
            /tmp/pyth-entropy-scan/console.log \
            /tmp/pyth-entropy-scan/evidence/ 2>/dev/null || true
          tar --sort=name --mtime='UTC 2026-07-26' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/pyth-entropy-evidence.tar.gz \
            -C /tmp/pyth-entropy-scan evidence
          sha256sum /tmp/pyth-entropy-evidence.tar.gz | awk '{print $1}' \
            > encrypted-output/evidence-plaintext.sha256
          openssl rand 32 > /tmp/output-key.bin
          openssl rand 16 > /tmp/output-iv.bin
          cat /tmp/output-key.bin /tmp/output-iv.bin > /tmp/output-keyinfo.bin
          KEY=$(xxd -p -c 256 /tmp/output-key.bin)
          IV=$(xxd -p -c 256 /tmp/output-iv.bin)
          openssl enc -aes-256-cbc \
            -K "$KEY" -iv "$IV" \
            -in /tmp/pyth-entropy-evidence.tar.gz \
            -out encrypted-output/evidence.tar.gz.enc
          openssl pkeyutl -encrypt \
            -pubin -inkey tmp-research/pyth-entropy/output-public.pem \
            -in /tmp/output-keyinfo.bin \
            -out encrypted-output/evidence-keyinfo.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted-output/evidence.tar.gz.enc \
            encrypted-output/evidence-keyinfo.enc \
            encrypted-output/evidence-plaintext.sha256 \
            > encrypted-output/SHA256SUMS
          rm -rf /tmp/pyth-entropy-scan
          rm -f /tmp/pyth-entropy-evidence.tar.gz \
            /tmp/output-key.bin /tmp/output-iv.bin /tmp/output-keyinfo.bin

      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyth-entropy-encrypted-multichain-scan-${{ github.run_id }}
          path: encrypted-output/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Enforce encrypted-output boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s encrypted-output/evidence.tar.gz.enc
          test -s encrypted-output/evidence-keyinfo.enc
          test -s encrypted-output/evidence-plaintext.sha256
          test -s encrypted-output/SHA256SUMS
          test ! -e /tmp/pyth-entropy-scan
