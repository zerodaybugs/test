name: Temporary Pyth Lazer exact-active adversarial PR v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-pyth-lazer-adversarial/trigger.txt'
      - '.tmp-pyth-lazer-adversarial/exact_active_tests.rs'
      - '.github/workflows/tmp-pyth-lazer-active-adversarial-pr-v2.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''

      - name: Checkout exact active source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: 7655b9110db0fba0365b886a0878d88085204db5
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Install Solana Verify CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo install solana-verify --locked
          solana-verify --version | tee evidence/SOLANA_VERIFY_VERSION.txt

      - name: Build exact active binary
        shell: bash
        run: |
          set -o pipefail
          git -C candidate show -s --format='%H%n%aI%n%cI%n%s' HEAD | tee evidence/EXACT_SOURCE_COMMIT.txt
          cd candidate/lazer
          solana-verify build --library-name pyth_lazer_solana_contract 2>&1 | tee ../../evidence/SOLANA_VERIFY_BUILD.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../../evidence/SOLANA_VERIFY_BUILD_EXIT_CODE.txt
          cd ../..
          exit "$code"

      - name: Bind to active mainnet executable
        shell: bash
        run: |
          set -euo pipefail
          so='candidate/lazer/target/deploy/pyth_lazer_solana_contract.so'
          sha256sum "$so" | tee evidence/EXACT_ACTIVE_RAW_SHA256.txt
          solana-verify get-executable-hash "$so" | tee evidence/EXACT_ACTIVE_EXECUTABLE_HASH.txt
          grep -qi '20ab42e7bc37e60f65d24b0df405549dc42649351231ede0bcbcd3b514223677' evidence/EXACT_ACTIVE_RAW_SHA256.txt
          grep -qi 'b790774609fcb6ca5d37bb205ab7e1371a5082aa6770d1d143a0dd44f9f314f9' evidence/EXACT_ACTIVE_EXECUTABLE_HASH.txt
          cp "$so" evidence/EXACT_ACTIVE_PYTH_LAZER_SOLANA.so

      - name: Patch adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          test -s .tmp-pyth-lazer-adversarial/exact_active_tests.rs
          cat .tmp-pyth-lazer-adversarial/exact_active_tests.rs >> candidate/lazer/contracts/solana/programs/pyth-lazer-solana-contract/tests/test1.rs
          sha256sum .tmp-pyth-lazer-adversarial/exact_active_tests.rs > evidence/ADVERSARIAL_TEST_SOURCE_SHA256.txt

      - name: Execute exact-binary adversarial test suite
        shell: bash
        run: |
          set -o pipefail
          export SBF_OUT_DIR="$PWD/candidate/lazer/target/deploy"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pyth-lazer-host-target"
          mkdir -p "$CARGO_TARGET_DIR"
          cargo test \
            --manifest-path candidate/lazer/Cargo.toml \
            -p pyth-lazer-solana-contract \
            --locked \
            --test test1 \
            -- --nocapture 2>&1 | tee evidence/ADVERSARIAL_TEST.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > evidence/ADVERSARIAL_TEST_EXIT_CODE.txt
          exit "$code"

      - name: Evaluate security gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path('evidence/ADVERSARIAL_TEST.log').read_text(errors='replace') if Path('evidence/ADVERSARIAL_TEST.log').exists() else ''
          required = [
              'ADVERSARIAL_ECDSA_HIGH_S_TWIN_ACCEPTED=PASS',
              'ADVERSARIAL_ECDSA_UNSIGNED_TRAILING_BYTES_ACCEPTED=PASS',
              'ADVERSARIAL_ECDSA_SIGNED_PAYLOAD_MUTATION_REJECTED=PASS',
              'ADVERSARIAL_ECDSA_INVALID_RECOVERY_ID_REJECTED=PASS',
              'ADVERSARIAL_ECDSA_THIRD_SIGNER_REJECTED=PASS',
              'ADVERSARIAL_ED25519_UNSIGNED_TRAILING_BYTES_REJECTED=PASS',
          ]
          result = {
              'exactSourceCommit': '7655b9110db0fba0365b886a0878d88085204db5',
              'exactRawSha256': '20ab42e7bc37e60f65d24b0df405549dc42649351231ede0bcbcd3b514223677',
              'exactExecutableHash': 'b790774609fcb6ca5d37bb205ab7e1371a5082aa6770d1d143a0dd44f9f314f9',
              'markers': {marker: marker in log for marker in required},
              'allMarkersPass': all(marker in log for marker in required),
          }
          Path('evidence/GATE_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result['allMarkersPass']:
              raise SystemExit(1)
          PY

      - name: Package immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/lazer/contracts/solana/programs/pyth-lazer-solana-contract/src/lib.rs evidence/EXACT_ACTIVE_LIB.rs
          cp candidate/lazer/contracts/solana/programs/pyth-lazer-solana-contract/src/signature.rs evidence/EXACT_ACTIVE_SIGNATURE.rs
          cp candidate/lazer/sdk/rust/protocol/src/message.rs evidence/EXACT_ACTIVE_MESSAGE.rs
          cp candidate/lazer/sdk/rust/protocol/src/payload.rs evidence/EXACT_ACTIVE_PAYLOAD.rs
          cp .tmp-pyth-lazer-adversarial/exact_active_tests.rs evidence/ADVERSARIAL_TESTS.rs
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('evidence'); entries=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'EVIDENCE_MANIFEST.json','SHA256SUMS.txt'}):
              data=path.read_bytes(); entries.append({'path':path.relative_to(root).as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'EVIDENCE_MANIFEST.json').write_text(json.dumps(entries,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as h:
              for row in entries: h.write(f"{row['sha256']}  {row['path']}\n")
          PY
          tar --sort=name --mtime='UTC 2026-08-02' --owner=0 --group=0 --numeric-owner -czf pyth-lazer-exact-active-adversarial.tar.gz evidence
          sha256sum pyth-lazer-exact-active-adversarial.tar.gz > pyth-lazer-exact-active-adversarial.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-lazer-exact-active-adversarial-${{ github.run_id }}
          path: |
            evidence/
            pyth-lazer-exact-active-adversarial.tar.gz
            pyth-lazer-exact-active-adversarial.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
