name: Temporary Pyth Lazer exact-active adversarial tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-lazer-active-adversarial.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''

      - name: Checkout exact active source
        uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-crosschain
          ref: 7655b9110db0fba0365b886a0878d88085204db5
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Install Solana Verify CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install solana-verify --locked
          mkdir -p evidence
          solana-verify --version | tee evidence/SOLANA_VERIFY_VERSION.txt

      - name: Build and bind exact active binary
        shell: bash
        run: |
          set -o pipefail
          git -C candidate show -s --format='%H%n%aI%n%cI%n%s' HEAD | tee evidence/EXACT_SOURCE_COMMIT.txt
          cd candidate/lazer
          solana-verify build --library-name pyth_lazer_solana_contract 2>&1 | tee ../../evidence/SOLANA_VERIFY_BUILD.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../../evidence/SOLANA_VERIFY_BUILD_EXIT_CODE.txt
          cd ../..
          exit "$code"

      - name: Assert exact active hash
        shell: bash
        run: |
          set -euo pipefail
          so='candidate/lazer/target/deploy/pyth_lazer_solana_contract.so'
          sha256sum "$so" | tee evidence/EXACT_ACTIVE_RAW_SHA256.txt
          solana-verify get-executable-hash "$so" | tee evidence/EXACT_ACTIVE_EXECUTABLE_HASH.txt
          grep -qi '20ab42e7bc37e60f65d24b0df405549dc42649351231ede0bcbcd3b514223677' evidence/EXACT_ACTIVE_RAW_SHA256.txt
          grep -qi 'b790774609fcb6ca5d37bb205ab7e1371a5082aa6770d1d143a0dd44f9f314f9' evidence/EXACT_ACTIVE_EXECUTABLE_HASH.txt
          cp "$so" evidence/EXACT_ACTIVE_PYTH_LAZER_SOLANA.so

      - name: Add adversarial regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat >> candidate/lazer/contracts/solana/programs/pyth-lazer-solana-contract/tests/test1.rs <<'RS'

impl Setup {
    async fn verify_message_ecdsa_result(
        &mut self,
        message: &[u8],
    ) -> Result<(), BanksClientError> {
        let mut transaction_verify = Transaction::new_with_payer(
            &[Instruction::new_with_bytes(
                pyth_lazer_solana_contract::ID,
                &pyth_lazer_solana_contract::instruction::VerifyEcdsaMessage {
                    message_data: message.to_vec(),
                }
                .data(),
                vec![
                    AccountMeta::new(self.payer.pubkey(), true),
                    AccountMeta::new_readonly(pyth_lazer_solana_contract::STORAGE_ID, false),
                    AccountMeta::new(self.treasury, false),
                    AccountMeta::new_readonly(system_program::ID, false),
                ],
            )],
            Some(&self.payer.pubkey()),
        );
        transaction_verify.sign(&[&self.payer], self.recent_blockhash);
        self.banks_client.process_transaction(transaction_verify).await
    }

    async fn set_trusted_ecdsa_result(
        &mut self,
        verifying_key: EvmAddress,
    ) -> Result<(), BanksClientError> {
        let mut transaction_set_trusted = Transaction::new_with_payer(
            &[Instruction::new_with_bytes(
                pyth_lazer_solana_contract::ID,
                &pyth_lazer_solana_contract::instruction::UpdateEcdsaSigner {
                    trusted_signer: verifying_key,
                    expires_at: i64::MAX,
                }
                .data(),
                vec![
                    AccountMeta::new(self.payer.pubkey(), true),
                    AccountMeta::new(pyth_lazer_solana_contract::STORAGE_ID, false),
                ],
            )],
            Some(&self.payer.pubkey()),
        );
        transaction_set_trusted.sign(&[&self.payer], self.recent_blockhash);
        self.banks_client
            .process_transaction(transaction_set_trusted)
            .await
    }
}

fn ecdsa_test_message() -> Vec<u8> {
    hex::decode(
        "e4bd474dd4b822eca4509650613e58b21db858e60750ab3498d4a484028785981740adf42cd558bb4f9efd5157bcbb60a1939470ead091b82b63641ad962c7a537db4eb300310075d3c793c0afe900e42e060003010100000004000054e616b201000004f8ff020035dc1cb2010000010073f010b2010000",
    )
    .unwrap()
}

#[tokio::test]
async fn adversarial_ecdsa_accepts_high_s_twin() {
    let mut setup = Setup::new().await;
    setup.init_contract().await;
    let verifying_key = hex::decode("b8d50f0bae75bf6e03c104903d7c3afc4a6596da").unwrap();
    setup
        .set_trusted_ecdsa(verifying_key.try_into().unwrap())
        .await;

    let low_s = ecdsa_test_message();
    setup.verify_message_ecdsa_result(&low_s).await.unwrap();

    let high_s = hex::decode(
        "e4bd474dd4b822eca4509650613e58b21db858e60750ab3498d4a484028785981740adf4d32aa744b06102aea843449f5e6c6b8dcfde4b2e83e53c20e66f96e7985af28e01310075d3c793c0afe900e42e060003010100000004000054e616b201000004f8ff020035dc1cb2010000010073f010b2010000",
    )
    .unwrap();
    setup.verify_message_ecdsa_result(&high_s).await.unwrap();
    println!("ADVERSARIAL_ECDSA_HIGH_S_TWIN_ACCEPTED=PASS");
}

#[tokio::test]
async fn adversarial_ecdsa_accepts_unsigned_trailing_bytes() {
    let mut setup = Setup::new().await;
    setup.init_contract().await;
    let verifying_key = hex::decode("b8d50f0bae75bf6e03c104903d7c3afc4a6596da").unwrap();
    setup
        .set_trusted_ecdsa(verifying_key.try_into().unwrap())
        .await;

    let mut message = ecdsa_test_message();
    message.extend_from_slice(&hex::decode("deadbeefcafebabe").unwrap());
    setup.verify_message_ecdsa_result(&message).await.unwrap();
    println!("ADVERSARIAL_ECDSA_UNSIGNED_TRAILING_BYTES_ACCEPTED=PASS");
}

#[tokio::test]
async fn adversarial_ecdsa_rejects_payload_mutation() {
    let mut setup = Setup::new().await;
    setup.init_contract().await;
    let verifying_key = hex::decode("b8d50f0bae75bf6e03c104903d7c3afc4a6596da").unwrap();
    setup
        .set_trusted_ecdsa(verifying_key.try_into().unwrap())
        .await;

    let mut message = ecdsa_test_message();
    let last = message.len() - 1;
    message[last] ^= 1;
    assert!(setup.verify_message_ecdsa_result(&message).await.is_err());
    println!("ADVERSARIAL_ECDSA_SIGNED_PAYLOAD_MUTATION_REJECTED=PASS");
}

#[tokio::test]
async fn adversarial_ecdsa_rejects_invalid_recovery_id() {
    let mut setup = Setup::new().await;
    setup.init_contract().await;
    let verifying_key = hex::decode("b8d50f0bae75bf6e03c104903d7c3afc4a6596da").unwrap();
    setup
        .set_trusted_ecdsa(verifying_key.try_into().unwrap())
        .await;

    let mut message = ecdsa_test_message();
    message[68] = 4;
    assert!(setup.verify_message_ecdsa_result(&message).await.is_err());
    println!("ADVERSARIAL_ECDSA_INVALID_RECOVERY_ID_REJECTED=PASS");
}

#[tokio::test]
async fn adversarial_ecdsa_signer_limit_remains_enforced() {
    let mut setup = Setup::new().await;
    setup.init_contract().await;
    setup
        .set_trusted_ecdsa_result([1u8; 20])
        .await
        .unwrap();
    setup
        .set_trusted_ecdsa_result([2u8; 20])
        .await
        .unwrap();
    assert!(setup.set_trusted_ecdsa_result([3u8; 20]).await.is_err());
    println!("ADVERSARIAL_ECDSA_THIRD_SIGNER_REJECTED=PASS");
}

#[tokio::test]
async fn adversarial_ed25519_rejects_unsigned_trailing_bytes() {
    let mut setup = Setup::new().await;
    setup.init_contract().await;
    let verifying_key =
        hex::decode("74313a6525edf99936aa1477e94c72bc5cc617b21745f5f03296f3154461f214").unwrap();
    let mut message = hex::decode(
        "b9011a82e5cddee2c1bd364c8c57e1c98a6a28d194afcad410ff412226c8b2ae931ff59a57147cb47c7307afc2a0a1abec4dd7e835a5b7113cf5aeac13a745c6bed6c60074313a6525edf99936aa1477e94c72bc5cc617b21745f5f03296f3154461f2141c0075d3c7931c9773f30a240600010102000000010000e1f50500000000",
    )
    .unwrap();
    setup.set_trusted(verifying_key.try_into().unwrap()).await;
    message.extend_from_slice(&[0xde, 0xad, 0xbe, 0xef]);
    assert!(setup.verify_message_with_offset(&message, 12).await.is_err());
    println!("ADVERSARIAL_ED25519_UNSIGNED_TRAILING_BYTES_REJECTED=PASS");
}
RS
          sha256sum candidate/lazer/contracts/solana/programs/pyth-lazer-solana-contract/tests/test1.rs > evidence/PATCHED_TEST_SHA256.txt

      - name: Run exact-binary upstream and adversarial tests
        shell: bash
        run: |
          set -o pipefail
          export SBF_OUT_DIR="$PWD/candidate/lazer/target/deploy"
          cargo test \
            --manifest-path candidate/lazer/Cargo.toml \
            -p pyth-lazer-solana-contract \
            --locked \
            --test test1 \
            -- --nocapture 2>&1 | tee evidence/ADVERSARIAL_TEST.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > evidence/ADVERSARIAL_TEST_EXIT_CODE.txt
          exit "$code"

      - name: Evaluate gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path('evidence/ADVERSARIAL_TEST.log').read_text(errors='replace') if Path('evidence/ADVERSARIAL_TEST.log').exists() else ''
          required = [
              'ADVERSARIAL_ECDSA_HIGH_S_TWIN_ACCEPTED=PASS',
              'ADVERSARIAL_ECDSA_UNSIGNED_TRAILING_BYTES_ACCEPTED=PASS',
              'ADVERSARIAL_ECDSA_SIGNED_PAYLOAD_MUTATION_REJECTED=PASS',
              'ADVERSARIAL_ECDSA_INVALID_RECOVERY_ID_REJECTED=PASS',
              'ADVERSARIAL_ECDSA_THIRD_SIGNER_REJECTED=PASS',
              'ADVERSARIAL_ED25519_UNSIGNED_TRAILING_BYTES_REJECTED=PASS',
          ]
          result = {
              'exactSourceCommit': '7655b9110db0fba0365b886a0878d88085204db5',
              'exactRawSha256': '20ab42e7bc37e60f65d24b0df405549dc42649351231ede0bcbcd3b514223677',
              'exactExecutableHash': 'b790774609fcb6ca5d37bb205ab7e1371a5082aa6770d1d143a0dd44f9f314f9',
              'markers': {marker: marker in log for marker in required},
              'allMarkersPass': all(marker in log for marker in required),
              'securityInterpretation': {
                  'ecdsaHighSMalleability': 'confirmed',
                  'ecdsaUnsignedTrailingBytes': 'confirmed',
                  'signedPayloadMutation': 'rejected',
                  'invalidRecoveryId': 'rejected',
                  'thirdSignerDespiteCapacityTypo': 'rejected',
                  'ed25519UnsignedTrailingBytes': 'rejected',
              },
          }
          Path('evidence/GATE_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result['allMarkersPass']:
              raise SystemExit(1)
          PY

      - name: Build deterministic evidence archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/lazer/contracts/solana/programs/pyth-lazer-solana-contract/src/lib.rs evidence/EXACT_ACTIVE_LIB.rs
          cp candidate/lazer/contracts/solana/programs/pyth-lazer-solana-contract/src/signature.rs evidence/EXACT_ACTIVE_SIGNATURE.rs
          cp candidate/lazer/sdk/rust/protocol/src/message.rs evidence/EXACT_ACTIVE_MESSAGE.rs
          cp candidate/lazer/sdk/rust/protocol/src/payload.rs evidence/EXACT_ACTIVE_PAYLOAD.rs
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('evidence'); entries=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name not in {'EVIDENCE_MANIFEST.json','SHA256SUMS.txt'}):
              data=path.read_bytes(); entries.append({'path':path.relative_to(root).as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'EVIDENCE_MANIFEST.json').write_text(json.dumps(entries,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as h:
              for row in entries: h.write(f"{row['sha256']}  {row['path']}\n")
          PY
          tar --sort=name --mtime='UTC 2026-08-02' --owner=0 --group=0 --numeric-owner -czf pyth-lazer-exact-active-adversarial.tar.gz evidence
          sha256sum pyth-lazer-exact-active-adversarial.tar.gz > pyth-lazer-exact-active-adversarial.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-lazer-exact-active-adversarial-${{ github.run_id }}
          path: |
            evidence/
            pyth-lazer-exact-active-adversarial.tar.gz
            pyth-lazer-exact-active-adversarial.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
