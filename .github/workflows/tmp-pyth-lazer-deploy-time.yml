name: Temporary Pyth Lazer deploy slot time

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-lazer-deploy-time.yml'

permissions:
  contents: read

jobs:
  time:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Query finalized block time read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import datetime, json, urllib.request
          slot=330575503
          rpcs=['https://solana-rpc.publicnode.com','https://api.mainnet-beta.solana.com','https://solana.drpc.org','https://mainnet-beta.solflare.network']
          attempts=[]; result=None
          for url in rpcs:
              try:
                  req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':1,'method':'getBlockTime','params':[slot]}).encode(),headers={'content-type':'application/json','user-agent':'ReadOnly-Slot-Time/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as response: body=json.loads(response.read())
                  if body.get('error') is not None or body.get('result') is None: raise RuntimeError(body)
                  result={'slot':slot,'blockTime':body['result'],'utc':datetime.datetime.fromtimestamp(body['result'],datetime.timezone.utc).isoformat(),'rpc':url,'safety':{'publicChainWrites':0,'rpcMethods':['getBlockTime']}}
                  attempts.append({'rpc':url,'ok':True}); break
              except Exception as exc: attempts.append({'rpc':url,'ok':False,'error':repr(exc)})
          if result is None: raise SystemExit(attempts)
          result['attempts']=attempts
          open('evidence/DEPLOY_SLOT_TIME.json','w').write(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-lazer-deploy-slot-time-${{ github.run_id }}
          path: evidence/
          retention-days: 1
