name: Temporary Pyth Lazer Solana audit PDF snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-lazer-solana-audit-pdf.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: pyth-network/audit-reports
          path: audits
          persist-credentials: false
          fetch-depth: 1
      - name: Capture exact audit report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp audits/2025_01_17/pyth_lazer_solana_audit_final.pdf evidence/
          git -C audits rev-parse HEAD > evidence/AUDIT_REPO_COMMIT.txt
          sha256sum evidence/* > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-lazer-solana-audit-pdf-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
