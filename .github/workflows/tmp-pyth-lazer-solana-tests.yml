name: Temporary Pyth Lazer Solana upstream tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-lazer-solana-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: pyth-network/pyth-lazer-public
          ref: c3933a093bf66e761fc3c9a5a0e2d4655ac17780
          path: upstream
          persist-credentials: false
          fetch-depth: 1
      - name: Run normal-feature unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          cargo test \
            --manifest-path upstream/contracts/solana/Cargo.toml \
            -p pyth-lazer-solana-contract \
            --locked \
            2>&1 | tee evidence/CARGO_TEST_NORMAL_FEATURES.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > evidence/CARGO_TEST_NORMAL_FEATURES_EXIT_CODE.txt
          exit "$code"
      - name: Capture source and dependency provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream rev-parse HEAD > evidence/SOURCE_COMMIT.txt
          rustc --version --verbose > evidence/RUSTC_VERSION.txt
          cargo --version --verbose > evidence/CARGO_VERSION.txt
          sha256sum upstream/contracts/solana/programs/pyth-lazer-solana-contract/src/*.rs \
            upstream/contracts/solana/programs/pyth-lazer-solana-contract/tests/*.rs \
            > evidence/SOURCE_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-lazer-solana-tests-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
