name: Temporary Pyth Lazer mainnet usage census

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-pyth-lazer-usage/**'
      - '.github/workflows/tmp-pyth-lazer-usage.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify classifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .tmp-pyth-lazer-usage/scan_usage.py
          sha256sum .tmp-pyth-lazer-usage/scan_usage.py > CLASSIFIER_SHA256.txt
          grep -F '"publicChainWrites": 0' .tmp-pyth-lazer-usage/scan_usage.py >/dev/null
      - name: Scan recent finalized mainnet program usage read-only
        shell: bash
        env:
          PROGRAM_ID: pytd2yyk641x7ak7mkaasSJVXh6YYZnC7wTmtgAyxPt
          SIGNATURE_LIMIT: '3000'
          WORKERS: '5'
          OUT_DIR: evidence-usage
        run: |
          set -euo pipefail
          python .tmp-pyth-lazer-usage/scan_usage.py
      - name: Build deterministic archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d evidence-usage ]; then
            cp CLASSIFIER_SHA256.txt evidence-usage/
            find evidence-usage -type f -print0 | sort -z | xargs -0 sha256sum > evidence-usage/SHA256SUMS.txt
            tar --sort=name --mtime='UTC 2026-08-01' --owner=0 --group=0 --numeric-owner -czf pyth-lazer-usage-census.tar.gz evidence-usage
            sha256sum pyth-lazer-usage-census.tar.gz > pyth-lazer-usage-census.tar.gz.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyth-lazer-usage-census-${{ github.run_id }}
          path: |
            evidence-usage/
            pyth-lazer-usage-census.tar.gz
            pyth-lazer-usage-census.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
