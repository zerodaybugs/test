name: Temporary read-only Pyth staking deployment chronology

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-staking-deployment-chronology.yml'

permissions:
  contents: read

jobs:
  chronology:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Query public deployment chronology
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY' | tee evidence/summary.txt
          import datetime as dt, json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          SLOT=355018550
          RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com']
          def http_json(url, data=None, headers=None):
            req=urllib.request.Request(url,data=data,headers=headers or {})
            errs=[]
            for i in range(5):
              try:
                with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
              except Exception as e:
                errs.append(repr(e));time.sleep(i+1)
            raise RuntimeError({'url':url,'errors':errs})
          block_times=[]
          for i,url in enumerate(RPCS):
            body=json.dumps({'jsonrpc':'2.0','id':i+1,'method':'getBlockTime','params':[SLOT]}).encode()
            obj=http_json(url,body,{'content-type':'application/json','user-agent':'pyth-staking-chronology/1.0'})
            if obj.get('result') is not None:block_times.append({'rpc':url,'unix':obj['result'],'iso':dt.datetime.fromtimestamp(obj['result'],dt.timezone.utc).isoformat()})
          if len(block_times)<2 or len({x['unix'] for x in block_times})!=1:raise SystemExit({'block_time_provider_mismatch':block_times})
          deployed=dt.datetime.fromtimestamp(block_times[0]['unix'],dt.timezone.utc)
          since=(deployed-dt.timedelta(days=45)).isoformat().replace('+00:00','Z')
          until=(deployed+dt.timedelta(days=45)).isoformat().replace('+00:00','Z')
          q=urllib.parse.urlencode({'since':since,'until':until,'per_page':100})
          hdr={'accept':'application/vnd.github+json','authorization':'Bearer '+os.environ['GH_TOKEN'],'x-github-api-version':'2022-11-28','user-agent':'pyth-staking-chronology/1.0'}
          commits=http_json('https://api.github.com/repos/pyth-network/governance/commits?'+q,headers=hdr)
          compact=[]
          for c in commits:
            co=c.get('commit',{})
            compact.append({'sha':c.get('sha'),'date':(co.get('committer') or {}).get('date'),'author_date':(co.get('author') or {}).get('date'),'message':co.get('message'),'html_url':c.get('html_url'),'parents':[p.get('sha') for p in c.get('parents',[])]})
          tags=http_json('https://api.github.com/repos/pyth-network/governance/tags?per_page=100',headers=hdr)
          releases=http_json('https://api.github.com/repos/pyth-network/governance/releases?per_page=100',headers=hdr)
          osec=http_json('https://verify.osec.io/status/pytS9TjG1qyAZypk7n8rw8gfW9sUaqqYyMhJQ4E7JCQ',headers={'user-agent':'pyth-staking-chronology/1.0'})
          out={'deployment_slot':SLOT,'block_times':block_times,'window':{'since':since,'until':until},'commits':compact,'tags':[{'name':x.get('name'),'sha':(x.get('commit') or {}).get('sha')} for x in tags],'releases':[{'tag_name':x.get('tag_name'),'published_at':x.get('published_at'),'target_commitish':x.get('target_commitish'),'assets':[{'name':a.get('name'),'size':a.get('size'),'digest':a.get('digest'),'url':a.get('browser_download_url')} for a in x.get('assets',[])]} for x in releases],'osec':osec,'signed_or_broadcast_transactions':0}
          Path('evidence/deployment-chronology.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('PYTH_STAKING_DEPLOYMENT_CHRONOLOGY_PASS')
          print('DEPLOYMENT_SLOT='+str(SLOT))
          print('DEPLOYMENT_TIME='+block_times[0]['iso'])
          print('COMMIT_COUNT='+str(len(compact)))
          print('TAG_COUNT='+str(len(tags)))
          print('RELEASE_COUNT='+str(len(releases)))
          print('OSEC_VERIFIED='+str(bool(osec.get('is_verified'))).lower())
          print('OSEC_REPO_URL='+str(osec.get('repo_url')))
          print('OSEC_ON_CHAIN_HASH='+str(osec.get('on_chain_hash')))
          print('OSEC_EXECUTABLE_HASH='+str(osec.get('executable_hash')))
          print('SIGNED_OR_BROADCAST_TRANSACTIONS=0')
          PY
          sha256sum evidence/deployment-chronology.json evidence/summary.txt > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-staking-deployment-chronology-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
      - name: Enforce read-only result
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'PYTH_STAKING_DEPLOYMENT_CHRONOLOGY_PASS' evidence/summary.txt
          grep -qx 'SIGNED_OR_BROADCAST_TRANSACTIONS=0' evidence/summary.txt
