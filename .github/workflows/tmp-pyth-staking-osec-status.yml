name: Temporary read-only Pyth staking OSEC verification status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-staking-osec-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Query public verification service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          PROGRAM='pytS9TjG1qyAZypk7n8rw8gfW9sUaqqYyMhJQ4E7JCQ'
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "https://verify.osec.io/status/${PROGRAM}" \
            -o evidence/status.json
          python3 - <<'PY' | tee evidence/summary.txt
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/status.json').read_text())
          print('PROGRAM_VERIFICATION_STATUS_QUERY_PASS')
          print('IS_VERIFIED='+str(bool(x.get('is_verified'))).lower())
          print('MESSAGE='+str(x.get('message')))
          print('ON_CHAIN_HASH='+str(x.get('on_chain_hash')))
          print('EXECUTABLE_HASH='+str(x.get('executable_hash')))
          print('LAST_VERIFIED_AT='+str(x.get('last_verified_at')))
          print('REPO_URL='+str(x.get('repo_url')))
          print('SIGNED_OR_BROADCAST_TRANSACTIONS=0')
          PY
          sha256sum evidence/status.json evidence/summary.txt > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-staking-osec-status-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
      - name: Enforce read-only query
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'PROGRAM_VERIFICATION_STATUS_QUERY_PASS' evidence/summary.txt
          grep -qx 'SIGNED_OR_BROADCAST_TRANSACTIONS=0' evidence/summary.txt
