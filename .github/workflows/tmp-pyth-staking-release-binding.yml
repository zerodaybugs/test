name: Temporary exact Pyth staking live-to-release binding

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-staking-release-binding.yml'

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download official release binaries and live ProgramData
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/releases
          for V in v2.0.0 v2.1.0 v2.2.0; do
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              "https://github.com/pyth-network/governance/releases/download/${V}/staking.so" \
              -o "evidence/releases/staking-${V}.so"
          done
          python3 - <<'PY' | tee evidence/summary.txt
          import base64, hashlib, json, time, urllib.request
          from pathlib import Path
          PROGRAM='pytS9TjG1qyAZypk7n8rw8gfW9sUaqqYyMhJQ4E7JCQ'
          PROGRAMDATA='AHhUjFdPXAg9xPFmEFheRq4ZYHDAZfNX3F4zTbi7GsJr'
          RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com']
          def rpc(url,key,reqid):
            body=json.dumps({'jsonrpc':'2.0','id':reqid,'method':'getAccountInfo','params':[key,{'encoding':'base64','commitment':'finalized'}]}).encode()
            errs=[]
            for i in range(5):
              try:
                req=urllib.request.Request(url,data=body,headers={'content-type':'application/json','user-agent':'pyth-staking-release-binding/1.0'})
                with urllib.request.urlopen(req,timeout=45) as r:o=json.load(r)
                if 'error' in o:raise RuntimeError(o['error'])
                return base64.b64decode(o['result']['value']['data'][0]),o['result']['context'].get('slot')
              except Exception as e:errs.append(repr(e));time.sleep(i+1)
            raise RuntimeError({'rpc':url,'errors':errs})
          def h(b):return hashlib.sha256(b.rstrip(b'\0')).hexdigest()
          providers=[]
          for i,url in enumerate(RPCS):
            raw,slot=rpc(url,PROGRAMDATA,10+i)
            if int.from_bytes(raw[:4],'little')!=3:raise SystemExit('invalid ProgramData tag')
            opt=raw[12];header=45 if opt else 13
            binary=raw[header:]
            providers.append({'rpc':url,'slot':slot,'programdata_len':len(raw),'binary_padded_len':len(binary),'trimmed_len':len(binary.rstrip(b'\0')),'trimmed_sha256':h(binary)})
          if len({x['trimmed_sha256'] for x in providers})!=1:raise SystemExit({'provider_hash_mismatch':providers})
          live=providers[0]['trimmed_sha256']
          releases=[]
          for p in sorted(Path('evidence/releases').glob('staking-*.so')):
            b=p.read_bytes();releases.append({'file':p.name,'size':len(b),'raw_sha256':hashlib.sha256(b).hexdigest(),'trimmed_sha256':h(b),'matches_live':h(b)==live})
          matches=[x for x in releases if x['matches_live']]
          out={'program':PROGRAM,'programdata':PROGRAMDATA,'providers':providers,'providers_identical':True,'live_trimmed_sha256':live,'releases':releases,'matching_releases':[x['file'] for x in matches],'signed_or_broadcast_transactions':0}
          Path('evidence/release-binding.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('PYTH_STAKING_RELEASE_BINDING_PASS')
          print('LIVE_EXECUTABLE_HASH='+live)
          print('MATCH_COUNT='+str(len(matches)))
          for x in releases:
            print(x['file'].upper().replace('.','_').replace('-','_')+'_HASH='+x['trimmed_sha256'])
            print(x['file'].upper().replace('.','_').replace('-','_')+'_MATCH='+str(x['matches_live']).lower())
          print('SIGNED_OR_BROADCAST_TRANSACTIONS=0')
          PY
          sha256sum evidence/release-binding.json evidence/summary.txt evidence/releases/*.so > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-staking-release-binding-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
      - name: Enforce read-only result
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'PYTH_STAKING_RELEASE_BINDING_PASS' evidence/summary.txt
          grep -qx 'SIGNED_OR_BROADCAST_TRANSACTIONS=0' evidence/summary.txt
