name: Temporary Pyth staking slash-vote encrypted-runner key generation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-pyth-staking-slash-vote-keygen.yml'
      - 'tmp-research/pyth-staking-slash-vote-keygen/trigger'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Generate isolated input decryption key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out /tmp/pyth-staking-slash-vote-private.pem
          mkdir -p public-output
          openssl pkey -in /tmp/pyth-staking-slash-vote-private.pem -pubout \
            -out public-output/runner-input-public.pem
          openssl pkey -pubin -in public-output/runner-input-public.pem -text -noout \
            > public-output/runner-input-public-info.txt
          sha256sum public-output/* > public-output/SHA256SUMS
      - name: Save private input key to unique cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/pyth-staking-slash-vote-private.pem
          key: pyth-staking-slash-vote-input-key-v1
      - uses: actions/upload-artifact@v4
        with:
          name: pyth-staking-slash-vote-input-public-key-${{ github.run_id }}
          path: public-output/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Remove private key from workspace
        if: always()
        shell: bash
        run: rm -f /tmp/pyth-staking-slash-vote-private.pem
