name: Temporary finalized sequence census 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sequence-census-20260802.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decode pinned read-only probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s' '' > /tmp/probe.mjs.gz.b64
          base64 -d /tmp/probe.mjs.gz.b64 | gzip -d > /tmp/probe.mjs
          printf '%s  %s\n' '51bbd1d68e7480312a7f46fecd2ad1d7f7b9644343bddc2e324ae49316b60523' '/tmp/probe.mjs' | sha256sum -c -
          node --check /tmp/probe.mjs
          sha256sum /tmp/probe.mjs > evidence/PROBE_SHA256.txt

      - name: Execute finalized read-only census
        shell: bash
        run: |
          set -o pipefail
          node /tmp/probe.mjs 2>&1 | tee evidence/RUN_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > evidence/EXIT_CODE.txt
          exit "$code"

      - name: Package immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('evidence')
          entries = []
          for path in sorted(p for p in root.iterdir() if p.is_file() and p.name not in {'MANIFEST.json','SHA256SUMS.txt'}):
              data = path.read_bytes()
              entries.append({'name': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          (root/'MANIFEST.json').write_text(json.dumps(entries, indent=2, sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as handle:
              for row in entries:
                  handle.write(f"{row['sha256']}  {row['name']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalized-sequence-census-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 1
