name: Temporary read-only Solana block snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-solana-block-snapshot/**'
      - '.github/workflows/tmp-solana-block-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify deterministic read-only snapshotter
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .tmp-solana-block-snapshot/fetch_blocks.py
          sha256sum .tmp-solana-block-snapshot/fetch_blocks.py > SNAPSHOTTER_SHA256.txt
          grep -F '"publicChainWrites": 0' .tmp-solana-block-snapshot/fetch_blocks.py >/dev/null
          grep -F '"rpcMethods": ["getBlock"]' .tmp-solana-block-snapshot/fetch_blocks.py >/dev/null

      - name: Fetch and filter public finalized block data
        shell: bash
        env:
          OUT_DIR: evidence-blocks
          MAX_WORKERS: '3'
          PROGRAM_ID: vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P
        run: |
          set -euo pipefail
          python .tmp-solana-block-snapshot/fetch_blocks.py

      - name: Compress immutable public-chain evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d evidence-blocks ]; then
            cp SNAPSHOTTER_SHA256.txt evidence-blocks/
            tar --sort=name --mtime='UTC 2026-08-01' --owner=0 --group=0 --numeric-owner \
              -czf velocity-target-blocks.tar.gz evidence-blocks
            sha256sum velocity-target-blocks.tar.gz > velocity-target-blocks.tar.gz.sha256
          fi

      - name: Upload temporary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-solana-block-snapshot-${{ github.run_id }}
          path: |
            evidence-blocks/
            velocity-target-blocks.tar.gz
            velocity-target-blocks.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Enforce snapshot gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('evidence-blocks/SUMMARY.json').read_text())
          print(json.dumps(summary, indent=2, sort_keys=True))
          if summary.get('verdict') != 'PASS':
              raise SystemExit(1)
          PY
