name: Temporary official solc 0.8.17 export 2026-08-23

on:
  push:
    paths:
      - .github/workflows/tmp-solc-0.8.17-export-20260823.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export official compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/bin
          curl --fail --location --silent --show-error --retry 3 \
            -o artifact/bin/solc-0.8.17 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.17+commit.8df45f5f'
          chmod 0755 artifact/bin/solc-0.8.17
          artifact/bin/solc-0.8.17 --version | tee artifact/solc-version.txt
          sha256sum artifact/bin/solc-0.8.17 > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official-solc-v0.8.17-linux-amd64
          path: artifact
          retention-days: 1
          if-no-files-found: error
