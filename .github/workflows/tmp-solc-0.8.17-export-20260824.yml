name: Temporary official solc 0.8.17 export 2026-08-24

on:
  push:
    paths:
      - .github/workflows/tmp-solc-0.8.17-export-20260824.yml
  pull_request:
    branches:
      - main
    paths:
      - .tmp/solc-0.8.17-trigger-20260824.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify official Solidity compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/bin
          curl --fail --location --silent --show-error --retry 3 \
            -o artifact/list.json \
            https://binaries.soliditylang.org/linux-amd64/list.json
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root = pathlib.Path('artifact')
          data = json.loads((root / 'list.json').read_text())
          path = data['releases']['0.8.17']
          build = next(x for x in data['builds'] if x['path'] == path)
          url = 'https://binaries.soliditylang.org/linux-amd64/' + path
          target = root / 'bin' / 'solc-0.8.17'
          urllib.request.urlretrieve(url, target)
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          expected = build['sha256'].removeprefix('0x')
          if actual != expected:
              raise SystemExit(f'checksum mismatch: {actual} != {expected}')
          (root / 'metadata.json').write_text(json.dumps({
              'version': build['version'],
              'longVersion': build['longVersion'],
              'path': path,
              'sha256': actual,
              'keccak256': build['keccak256'],
          }, indent=2) + '\n')
          PY
          chmod 0755 artifact/bin/solc-0.8.17
          artifact/bin/solc-0.8.17 --version | tee artifact/version.txt
          sha256sum artifact/bin/solc-0.8.17 > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: official-solc-v0.8.17-linux-amd64
          path: artifact
          retention-days: 1
          if-no-files-found: error
