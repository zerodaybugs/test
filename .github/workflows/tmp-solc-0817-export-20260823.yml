name: Temporary official solc 0.8.17 export 2026-08-23

on:
  pull_request:
    branches:
      - main
    paths:
      - .tmp/solc-0817-export-20260823.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and verify official compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl --fail --location --silent --show-error --retry 3 \
            -o artifact/solc-0.8.17 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.17+commit.8df45f5f'
          chmod 0755 artifact/solc-0.8.17
          expected='99f2070b776e9714f1f76c43c229cf99b8978a92938ee8d2364c6de11c1a03d4'
          actual="$(sha256sum artifact/solc-0.8.17 | awk '{print $1}')"
          test "$actual" = "$expected"
          artifact/solc-0.8.17 --version | tee artifact/version.txt
          sha256sum artifact/solc-0.8.17 > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: official-solc-0.8.17-linux-amd64
          path: artifact
          retention-days: 1
          if-no-files-found: error
