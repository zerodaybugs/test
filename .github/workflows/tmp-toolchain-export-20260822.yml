name: Temporary public Foundry and solc export 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-toolchain-trigger.txt'
      - '.github/workflows/tmp-toolchain-export-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Materialize Foundry and Solidity 0.8.17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain project/src
          forge --version | tee toolchain/FOUNDRY_VERSION.txt
          for bin in forge cast anvil chisel; do
            src="$(command -v "$bin")"
            cp -L "$src" "toolchain/$bin"
            chmod 0755 "toolchain/$bin"
          done
          cat > project/foundry.toml <<'EOF'
          [profile.default]
          src = 'src'
          out = 'out'
          libs = []
          solc_version = '0.8.17'
          optimizer = true
          optimizer_runs = 200
          EOF
          cat > project/src/CompilerProbe.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.17;
          contract CompilerProbe { function probe() external pure returns (uint256) { return 817; } }
          EOF
          (cd project && forge build --force -vv)
          solc_path="$(find "$HOME/.svm" -type f \( -name 'solc-0.8.17' -o -name 'solc*0.8.17*' \) -perm -u+x | head -n 1)"
          test -n "$solc_path"
          cp -L "$solc_path" toolchain/solc-0.8.17
          chmod 0755 toolchain/solc-0.8.17
          toolchain/solc-0.8.17 --version | tee toolchain/SOLC_VERSION.txt
          printf '%s\n' 'Expected Foundry release archive SHA-256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b' > toolchain/UPSTREAM_ARCHIVE_SHA256.txt
          printf '%s\n' 'Expected solc binary SHA-256: 99f2070b776e9714f1f76c43c229cf99b8978a92938ee8d2364c6de11c1a03d4' > toolchain/UPSTREAM_SOLC_SHA256.txt
          actual_solc="$(sha256sum toolchain/solc-0.8.17 | awk '{print $1}')"
          test "$actual_solc" = '99f2070b776e9714f1f76c43c229cf99b8978a92938ee8d2364c6de11c1a03d4'
          (cd toolchain && sha256sum forge cast anvil chisel solc-0.8.17 > SHA256SUMS.txt)
          find toolchain -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee toolchain/INDEX.txt

      - name: Upload verified toolchain
        uses: actions/upload-artifact@v4
        with:
          name: foundry-v1.7.1-solc-0.8.17-linux-amd64
          path: toolchain/
          if-no-files-found: error
          retention-days: 1
