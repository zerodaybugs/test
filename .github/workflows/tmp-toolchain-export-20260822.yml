name: Temporary public compiler and dependency export 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-toolchain-trigger.txt'
      - 'tmp-source-trigger.txt'
      - '.github/workflows/tmp-toolchain-export-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Materialize compiler toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain project/src
          forge --version | tee toolchain/FOUNDRY_VERSION.txt
          for bin in forge cast anvil chisel; do
            src="$(command -v "$bin")"
            cp -L "$src" "toolchain/$bin"
            chmod 0755 "toolchain/$bin"
          done
          cat > project/foundry.toml <<'EOF'
          [profile.default]
          src = 'src'
          out = 'out'
          libs = []
          solc_version = '0.8.17'
          optimizer = true
          optimizer_runs = 200
          EOF
          cat > project/src/CompilerProbe.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.17;
          contract CompilerProbe { function probe() external pure returns (uint256) { return 817; } }
          EOF
          (cd project && forge build --force -vv)
          solc_path="$(find "$HOME/.svm" -type f \( -name 'solc-0.8.17' -o -name 'solc*0.8.17*' \) -perm -u+x | head -n 1)"
          test -n "$solc_path"
          cp -L "$solc_path" toolchain/solc-0.8.17
          chmod 0755 toolchain/solc-0.8.17
          actual_solc="$(sha256sum toolchain/solc-0.8.17 | awk '{print $1}')"
          test "$actual_solc" = '99f2070b776e9714f1f76c43c229cf99b8978a92938ee8d2364c6de11c1a03d4'
          (cd toolchain && sha256sum forge cast anvil chisel solc-0.8.17 > SHA256SUMS.txt)

      - name: Materialize exact public dependency trees
        shell: bash
        env:
          FIRST_COMMIT: '60052a8a35b65bd4fb8a38212f124317756e5572'
          SECOND_COMMIT: '1fc1508df3caeb18a8179dfc0ea4e956099ab481'
        run: |
          set -euo pipefail
          mkdir -p public-source
          git clone --recurse-submodules https://github.com/okxlabs/Web3-DEX-EVM-PMM.git public-source/project
          git -C public-source/project checkout --detach "$FIRST_COMMIT"
          git -C public-source/project submodule update --init --recursive
          npm --prefix public-source/project ci --ignore-scripts --no-audit --no-fund
          git clone https://github.com/okxlabs/Web3-DEX-Router-EVM-V1.git public-source/project/lib/router-reference
          git -C public-source/project/lib/router-reference checkout --detach "$SECOND_COMMIT"
          test "$(git -C public-source/project rev-parse HEAD)" = "$FIRST_COMMIT"
          test "$(git -C public-source/project/lib/router-reference rev-parse HEAD)" = "$SECOND_COMMIT"
          printf 'FIRST_COMMIT=%s\nSECOND_COMMIT=%s\n' "$FIRST_COMMIT" "$SECOND_COMMIT" > public-source/PINS.txt
          (cd public-source/project && forge build --force -vv)
          find public-source/project -type d -name .git -prune -exec rm -rf {} +
          find public-source/project -type f -name '.DS_Store' -delete
          (cd public-source && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload verified compiler toolchain
        uses: actions/upload-artifact@v4
        with:
          name: foundry-v1.7.1-solc-0.8.17-linux-amd64
          path: toolchain/
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact public dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: exact-public-dependency-bundle-20260822
          path: public-source/
          if-no-files-found: error
          retention-days: 1
