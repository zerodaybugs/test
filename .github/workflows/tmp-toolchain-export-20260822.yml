name: Temporary public OKX deployment bytecode export 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-okx-deployment-trigger.txt'
      - '.github/workflows/tmp-toolchain-export-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Select healthy public Ethereum RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for candidate in \
            'https://ethereum-rpc.publicnode.com' \
            'https://eth.llamarpc.com' \
            'https://eth-mainnet.public.blastapi.io' \
            'https://rpc.ankr.com/eth'; do
            if test "$(cast chain-id --rpc-url "$candidate" 2>/dev/null || true)" = '1'; then
              RPC="$candidate"
              break
            fi
          done
          test -n "${RPC:-}"
          echo "ETH_RPC=$RPC" >> "$GITHUB_ENV"
          printf '%s\n' "$RPC" > evidence/RPC_ENDPOINT.txt
          forge --version > evidence/FOUNDRY_VERSION.txt

      - name: Capture one-block-consistent deployment evidence
        shell: bash
        env:
          ROUTER: '0x5E1f62Dac767b0491e3CE72469C217365D5B48cC'
          PROTOCOL: '0x73b920dC64ab6156f2D22b85AB9A9b06E597e154'
          ADAPTER: '0x4ecD468E1010E006f768EC034e5a6d8803183469'
          IMPLEMENTATION_SLOT: '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          BEACON_SLOT: '0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50'
        run: |
          set -euo pipefail
          BLOCK="$(cast block-number --rpc-url "$ETH_RPC")"
          printf '%s\n' "$BLOCK" > evidence/BLOCK_NUMBER.txt
          cast block "$BLOCK" --json --rpc-url "$ETH_RPC" > evidence/BLOCK.json
          printf 'name\taddress\tcodesize\tcodehash\timplementation_slot\tbeacon_slot\n' > evidence/DEPLOYMENTS.tsv

          capture() {
            name="$1"
            addr="$2"
            code="$(cast code "$addr" --block "$BLOCK" --rpc-url "$ETH_RPC")"
            test "$code" != '0x'
            printf '%s\n' "$code" > "evidence/${name}_RUNTIME.hex"
            size="$(cast codesize "$addr" --block "$BLOCK" --rpc-url "$ETH_RPC")"
            hash="$(cast codehash "$addr" --block "$BLOCK" --rpc-url "$ETH_RPC")"
            impl="$(cast storage "$addr" "$IMPLEMENTATION_SLOT" --block "$BLOCK" --rpc-url "$ETH_RPC")"
            beacon="$(cast storage "$addr" "$BEACON_SLOT" --block "$BLOCK" --rpc-url "$ETH_RPC")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$addr" "$size" "$hash" "$impl" "$beacon" >> evidence/DEPLOYMENTS.tsv

            impl_addr="0x${impl: -40}"
            if test "$impl_addr" != '0x0000000000000000000000000000000000000000'; then
              impl_code="$(cast code "$impl_addr" --block "$BLOCK" --rpc-url "$ETH_RPC")"
              test "$impl_code" != '0x'
              printf '%s\n' "$impl_addr" > "evidence/${name}_IMPLEMENTATION_ADDRESS.txt"
              printf '%s\n' "$impl_code" > "evidence/${name}_IMPLEMENTATION_RUNTIME.hex"
              cast codehash "$impl_addr" --block "$BLOCK" --rpc-url "$ETH_RPC" > "evidence/${name}_IMPLEMENTATION_CODEHASH.txt"
            fi
          }

          capture ROUTER "$ROUTER"
          capture PROTOCOL "$PROTOCOL"
          capture ADAPTER "$ADAPTER"
          cat evidence/DEPLOYMENTS.tsv
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload public deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: okx-public-ethereum-deployment-evidence-20260822
          path: evidence/
          if-no-files-found: error
          retention-days: 1
