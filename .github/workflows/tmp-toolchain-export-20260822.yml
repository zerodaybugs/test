name: Temporary public OKX exact build-artifact export 2026-08-22

on:
  pull_request:
    paths:
      - 'tmp-okx-exact-artifact-trigger.txt'
      - '.github/workflows/tmp-toolchain-export-20260822.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-exact-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PMM_COMMIT: '60052a8a35b65bd4fb8a38212f124317756e5572'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Compile exact public PMM source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git clone https://github.com/okxlabs/Web3-DEX-EVM-PMM.git project
          git -C project checkout --detach "$PMM_COMMIT"
          npm --prefix project ci --ignore-scripts --no-audit --no-fund
          test "$(git -C project rev-parse HEAD)" = "$PMM_COMMIT"
          forge --version | tee export/FOUNDRY_VERSION.txt
          (cd project && forge clean && forge build --force --skip test --skip script -vv | tee ../export/BUILD.log)
          test -f project/out/PmmAdaptor.sol/PMMAdapter.json
          test -f project/out/PmmProtocol.sol/PMMProtocol.json
          test -f project/out/OrderRFQLib.sol/OrderRFQLib.json
          cp project/out/PmmAdaptor.sol/PMMAdapter.json export/
          cp project/out/PmmProtocol.sol/PMMProtocol.json export/
          cp project/out/OrderRFQLib.sol/OrderRFQLib.json export/
          cp project/foundry.toml export/
          cp project/remappings.txt export/
          printf 'PMM_COMMIT=%s\n' "$PMM_COMMIT" > export/PINS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['PMMAdapter.json','PMMProtocol.json','OrderRFQLib.json']:
              p=Path('export')/name
              data=json.loads(p.read_text())
              bc=data.get('bytecode',{}).get('object','')
              rt=data.get('deployedBytecode',{}).get('object','')
              assert bc and rt, name
              (Path('export')/(name+'.creation.hex')).write_text('0x'+bc+'\n')
              (Path('export')/(name+'.runtime.hex')).write_text('0x'+rt+'\n')
          PY
          (cd export && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find export -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee export/INDEX.txt

      - name: Upload exact public build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: okx-pmm-exact-via-ir-artifacts-20260822
          path: export/
          if-no-files-found: error
          retention-days: 1
