name: Temporary Twyne collateral vault enumeration

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-twyne-cv-enum-trigger.txt'
      - '.github/workflows/tmp-twyne-cv-enum.yml'

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Reconstruct factory-created vaults from receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/receipts
          RPC='https://ethereum-rpc.publicnode.com'
          FACTORY='0xa1517cCe0bE75700A8838EA1cEE0dc383cd3A332'
          BEACON_SLOT='0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50'
          cat > evidence/txhashes.txt <<'EOF'
          0x4ed4d1f9651e9e53fadc122b5a0d40297e61d9052b6579029a5e06ced65829b6
          0x77655155b19c45e9da3211fd50c8fc698b8274cde9618a6527cc23f9b8b4684f
          0x3ba330b6345e3311705bfe57520a04fbf49261bed0558eab002a5b36144197fc
          0xfb36ff23d7d42dfbe129199c46bafe23d14accf7bbe16c157085b209630aec3b
          0xcc7de773e6163f3e876a70f9cd33ccae9af76edc3fa2723ba8ee47e30c074499
          0xad13834582728c4a76a0835bd61ea18bd4e5bf3c5d38140bd7afd3d35d4ad6e2
          0x0dd69500c113883119c06c5f73b53ed4204e84fdfa974ff3c5708b7bedb4175a
          0xe82bf23269ed52afd4e456ba1256a0fd0a513bb026c9ed5200dbec8c7d876ded
          0xd728c4b3b175690972164687c5fbeab3d3d9a38c546c1d863e40c5f7f7effc62
          0xd27668d87534bcf8942e8dda8e0abf00458d7d5d54da77813d578f1ae405a999
          0xa2db73ffb1803ef41b426a95c30e15696278bb3b3dc95f14fb4440b7e6ce24b5
          0x82735f907a7cd80a6867f610036b5ad9d574ea0bbff3160d141ff4026bf935bf
          0x89d97f9c535ce77c322b5c1929296fa655c350379404a03a76ff5a29b5e022ec
          0x7422acf3180ff01c99066e633377f891f40816945d0a7a3525e3652c5647b40c
          0xf0db88626e9d27fa1b5606b8c67e07295ac490851085bd1cef08a924a25a70bf
          0x3357612af167099a8504106b98ccfee7f3b420c82ca2d4a9d83b25254dd58285
          0x13782b67f670a1cc7ed7362b938e4d972313bc3399f00732923dd71ea5c7d383
          0x6179f9595e9a6e87bb0bbf7025e9b8f5bf7656d9ead9ce7b406874d14b108b5c
          0xf7eea9115c02df387dd7e7b1d02935e2fe9b5a023dd300197c72e233360199c9
          0x930221e4d3dfe25a45f57ab8921c4da1bd06b0a0031453e6a14610904e06ad0e
          0x54dbc0da17520fe061e2fbc21c838f4bee55cc13117a39a607cd1416230891a0
          0x397b6495066411b6347d6908f071cff49f34a4acfb481f018d61ac36af14d65b
          0xdf308abf417e5c7dfbd8071ac7e43ab3552233ced4473a25e3630dc53895e23c
          0xef4f15598b1b438c07e301d429bf98ee9fe1ccd458dff10fd7e5df2a405fe3c0
          0xffb3b0a4060e3a08b774ec07424487c2825a22af1f2fe6b73ee635e54197a1b8
          0xbd504e2187790f3af1605c55e495d43452287fb53428f851802e7bb4b2070f3d
          0xbe17a9e20d3b8687f3f85ef23225da5f12446248de28f7938dc761d4517ed6a5
          0xaa8c5809d3981a5216e3038edcb084f58e4f707a7d7a825b387a8b2da386cb96
          0xee5cc9a1bc76b3fa94cf244da644faf7286fd3719835870b7a3005a794589b1f
          0xb851405ca2906d0919614df5e508a50f21dee8c3e776f227b5d5c06a27ca3cdc
          0x96d8f95a13496309fc4a6725fc25b623524fc0eeffe2fbe06ee913d63b89ecb7
          0x75303f834f1b900b92b8120e611590d78dd07925aea247e6980d3db60c6454fa
          0xeedf4d0040c6a48254486e5deedcc7fdc6e4c59875289d7550de30b9b4b393fe
          EOF
          sed -i 's/^[[:space:]]*//' evidence/txhashes.txt

          topic=$(cast keccak 'T_CollateralVaultCreated(address)')
          echo "$topic" > evidence/event-topic.txt

          while read -r tx; do
            [ -z "$tx" ] && continue
            curl -sS --retry 4 -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getTransactionReceipt\",\"params\":[\"$tx\"]}" \
              "$RPC" > "evidence/receipts/${tx}.json"
          done < evidence/txhashes.txt

          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('evidence/receipts')
          topic=pathlib.Path('evidence/event-topic.txt').read_text().strip().lower()
          factory='0xa1517cce0be75700a8838ea1cee0dc383cd3a332'
          rows=[]; errors=[]
          for p in sorted(root.glob('*.json')):
              try: obj=json.loads(p.read_text())
              except Exception as e: errors.append({'file':p.name,'error':str(e)}); continue
              receipt=obj.get('result')
              if not receipt:
                  errors.append({'file':p.name,'error':obj.get('error') or 'no receipt'}); continue
              tx=receipt.get('transactionHash')
              block=int(receipt.get('blockNumber','0x0'),16)
              for log in receipt.get('logs',[]):
                  topics=[x.lower() for x in log.get('topics',[])]
                  if log.get('address','').lower()==factory and topics and topics[0]==topic and len(topics)>1:
                      vault='0x'+topics[1][-40:]
                      rows.append({'tx':tx,'block':block,'vault':vault.lower(),'logIndex':int(log.get('logIndex','0x0'),16)})
          dedup=[]; seen=set()
          for r in sorted(rows,key=lambda x:(x['block'],x['logIndex'])):
              if r['vault'] not in seen:
                  seen.add(r['vault']); dedup.append(r)
          pathlib.Path('evidence/vaults.json').write_text(json.dumps(dedup,indent=2))
          pathlib.Path('evidence/vaults.txt').write_text('\n'.join(r['vault'] for r in dedup)+'\n')
          pathlib.Path('evidence/receipt-errors.json').write_text(json.dumps(errors,indent=2,default=str))
          print('vault_count',len(dedup),'errors',len(errors))
          PY

          : > evidence/vault-state.txt
          while read -r cv; do
            [ -z "$cv" ] && continue
            {
              echo "===== $cv ====="
              echo -n 'factoryRegistered='; cast call "$FACTORY" 'isCollateralVault(address)(bool)' "$cv" --rpc-url "$RPC" 2>&1 || true
              for sig in 'version()(uint256)' 'borrower()(address)' 'intermediateVault()(address)' 'targetVault()(address)' 'asset()(address)' 'totalAssetsDepositedOrReserved()(uint256)' 'maxRelease()(uint256)' 'maxRepay()(uint256)' 'twyneLiqLTV()(uint256)' 'canLiquidate()(bool)' 'isExternallyLiquidated()(bool)' 'canRebalance()(uint256)'; do
                echo -n "$sig = "
                cast call "$cv" "$sig" --rpc-url "$RPC" 2>&1 || true
              done
              echo -n 'rawAssetBalance='; asset=$(cast call "$cv" 'asset()(address)' --rpc-url "$RPC" 2>/dev/null | awk '{print $1}'); [ -n "$asset" ] && cast call "$asset" 'balanceOf(address)(uint256)' "$cv" --rpc-url "$RPC" 2>&1 || true
              echo -n 'beaconSlot='; cast storage "$cv" "$BEACON_SLOT" --rpc-url "$RPC" 2>&1 || true
            } >> evidence/vault-state.txt
          done < evidence/vaults.txt

          sha256sum evidence/*.txt evidence/*.json > evidence/SHA256SUMS

      - name: Upload vault inventory
        uses: actions/upload-artifact@v4
        with:
          name: twyne-cv-enum-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
