name: Temporary Twyne live configuration inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-twyne-live-trigger.txt'
      - '.github/workflows/tmp-twyne-live.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Collect read-only mainnet configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          RPC='https://ethereum-rpc.publicnode.com'
          VM='0x0acd3A3c8Ab6a5F7b5A594C88DFa28999dA858aC'
          FACTORY='0xa1517cCe0bE75700A8838EA1cEE0dc383cd3A332'
          EWSTETH='0x7613D202Af490c3d1cE1873b0a7022a34E89815f'
          AWSTETH='0x75029a47f28550C93Ad5A3BbD2d9b5315204B561'
          EWETH='0x87b8081A3ace680f35125F469526Ac10f5418Ca7'
          WRAPPER='0xFaBA8f777996C0C28fe9e6554D84cB30ca3e1881'
          AAVE_POOL='0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2'
          WETH='0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
          IMPL_SLOT='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
          BEACON_SLOT='0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50'

          latest=$(cast block-number --rpc-url "$RPC")
          echo "$latest" > evidence/block-number.txt
          cast block "$latest" --rpc-url "$RPC" --json > evidence/block.json

          call() {
            local label="$1" addr="$2" sig="$3"; shift 3
            {
              printf '## %s\naddress=%s\nsig=%s\n' "$label" "$addr" "$sig"
              cast call "$addr" "$sig" "$@" --rpc-url "$RPC"
            } > "evidence/${label}.txt" 2>&1 || true
          }

          storage() {
            local label="$1" addr="$2" slot="$3"
            { printf 'address=%s\nslot=%s\n' "$addr" "$slot"; cast storage "$addr" "$slot" --rpc-url "$RPC"; } > "evidence/${label}.txt" 2>&1 || true
          }

          call vm-version "$VM" 'version()(uint256)'
          call vm-owner "$VM" 'owner()(address)'
          call vm-admin "$VM" 'admin()(address)'
          call vm-factory "$VM" 'collateralVaultFactory()(address)'
          call vm-oracle "$VM" 'oracleRouter()(address)'
          storage vm-implementation "$VM" "$IMPL_SLOT"

          call factory-version "$FACTORY" 'version()(uint256)'
          call factory-owner "$FACTORY" 'owner()(address)'
          call factory-admin "$FACTORY" 'admin()(address)'
          call factory-guardian "$FACTORY" 'pauseGuardian()(address)'
          call factory-paused "$FACTORY" 'paused()(bool)'
          call factory-manager "$FACTORY" 'vaultManager()(address)'
          call factory-evc "$FACTORY" 'EVC()(address)'
          storage factory-implementation "$FACTORY" "$IMPL_SLOT"

          call wrapper-version "$WRAPPER" 'version()(uint256)'
          call wrapper-owner "$WRAPPER" 'owner()(address)'
          call wrapper-admin "$WRAPPER" 'admin()(address)'
          call wrapper-guardian "$WRAPPER" 'pauseGuardian()(address)'
          call wrapper-paused "$WRAPPER" 'paused()(bool)'
          call wrapper-asset "$WRAPPER" 'asset()(address)'
          call wrapper-atoken "$WRAPPER" 'aToken()(address)'
          call wrapper-totalSupply "$WRAPPER" 'totalSupply()(uint256)'
          call wrapper-totalAssets "$WRAPPER" 'totalAssets()(uint256)'
          storage wrapper-implementation "$WRAPPER" "$IMPL_SLOT"

          : > evidence/intermediate-summary.txt
          for entry in "ewsteth:$EWSTETH" "awsteth:$AWSTETH" "eweth:$EWETH"; do
            name=${entry%%:*}; addr=${entry#*:}
            {
              echo "===== $name $addr ====="
              for sig in 'asset()(address)' 'unitOfAccount()(address)' 'EVC()(address)' 'governorAdmin()(address)' 'oracle()(address)' 'cash()(uint256)' 'totalBorrows()(uint256)' 'totalAssets()(uint256)' 'totalSupply()(uint256)' 'interestAccumulator()(uint256)' 'interestRate()(uint256)' 'interestFee()(uint16)' 'feeReceiver()(address)' 'configFlags()(uint32)' 'caps()(uint16,uint16)' 'hookConfig()(address,uint32)'; do
                echo "-- $sig"
                cast call "$addr" "$sig" --rpc-url "$RPC" 2>&1 || true
              done
              echo '-- vm:isIntermediateVault'
              cast call "$VM" 'isIntermediateVault(address)(bool)' "$addr" --rpc-url "$RPC" 2>&1 || true
              echo '-- vm:maxTwyneLTVs'
              cast call "$VM" 'maxTwyneLTVs(address)(uint16)' "$addr" --rpc-url "$RPC" 2>&1 || true
              echo '-- vm:externalLiqBuffers'
              cast call "$VM" 'externalLiqBuffers(address)(uint16)' "$addr" --rpc-url "$RPC" 2>&1 || true
              echo '-- vm:targetVaultLength'
              n=$(cast call "$VM" 'targetVaultLength(address)(uint256)' "$addr" --rpc-url "$RPC" 2>/dev/null | awk '{print $1}' || echo 0)
              echo "$n"
              if [[ "$n" =~ ^[0-9]+$ ]]; then
                for ((i=0;i<n;i++)); do
                  tv=$(cast call "$VM" 'allowedTargetVaultList(address,uint256)(address)' "$addr" "$i" --rpc-url "$RPC" 2>/dev/null | awk '{print $1}' || true)
                  echo "target[$i]=$tv"
                  if [ -n "$tv" ]; then
                    echo -n '  allowed='; cast call "$VM" 'isAllowedTargetVault(address,address)(bool)' "$addr" "$tv" --rpc-url "$RPC" 2>&1 || true
                    echo -n '  target.asset='; cast call "$tv" 'asset()(address)' --rpc-url "$RPC" 2>&1 || true
                    echo -n '  target.unitOfAccount='; cast call "$tv" 'unitOfAccount()(address)' --rpc-url "$RPC" 2>&1 || true
                    echo -n '  target.oracle='; cast call "$tv" 'oracle()(address)' --rpc-url "$RPC" 2>&1 || true
                  fi
                done
              fi
              echo '-- proxy storage'
              cast storage "$addr" "$IMPL_SLOT" --rpc-url "$RPC" 2>&1 || true
              cast storage "$addr" "$BEACON_SLOT" --rpc-url "$RPC" 2>&1 || true
            } >> evidence/intermediate-summary.txt
          done

          {
            echo 'Aave allowlist checks'
            echo -n 'targetAsset WETH: '
            cast call "$VM" 'isAllowedTargetAssets(address,address,address)(bool)' "$AWSTETH" "$AAVE_POOL" "$WETH" --rpc-url "$RPC" 2>&1 || true
            wrapperAsset=$(cast call "$WRAPPER" 'asset()(address)' --rpc-url "$RPC" 2>/dev/null | awk '{print $1}')
            echo "wrapper underlying=$wrapperAsset"
            echo -n 'factory category: '
            cast call "$FACTORY" 'categoryId(address,address,address)(uint8)' "$AAVE_POOL" "$WRAPPER" "$WETH" --rpc-url "$RPC" 2>&1 || true
          } > evidence/aave-allowlist.txt

          topic=$(cast keccak 'T_CollateralVaultCreated(address)')
          : > evidence/cv-logs.jsonl
          start=23100000
          step=40000
          while [ "$start" -le "$latest" ]; do
            end=$((start+step-1)); [ "$end" -gt "$latest" ] && end="$latest"
            payload=$(printf '{"jsonrpc":"2.0","id":1,"method":"eth_getLogs","params":[{"fromBlock":"0x%x","toBlock":"0x%x","address":"%s","topics":["%s"]}]}' "$start" "$end" "$FACTORY" "$topic")
            resp=$(curl -sS --retry 4 -H 'content-type: application/json' --data "$payload" "$RPC")
            echo "$resp" >> evidence/cv-logs.jsonl
            start=$((end+1))
          done

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('evidence/cv-logs.jsonl')
          addresses=[]; errors=[]
          for line in p.read_text().splitlines():
              try: obj=json.loads(line)
              except Exception as e: errors.append(str(e)); continue
              if obj.get('error'): errors.append(obj['error'])
              for log in obj.get('result',[]):
                  topics=log.get('topics',[])
                  if len(topics)>1: addresses.append('0x'+topics[1][-40:])
          uniq=[]
          for x in addresses:
              x=x.lower()
              if x not in uniq: uniq.append(x)
          pathlib.Path('evidence/collateral-vaults.txt').write_text('\n'.join(uniq)+'\n')
          pathlib.Path('evidence/log-errors.json').write_text(json.dumps(errors,indent=2,default=str))
          print('collateral_vaults',len(uniq))
          PY

          : > evidence/collateral-vault-state.txt
          while read -r cv; do
            [ -z "$cv" ] && continue
            {
              echo "===== $cv ====="
              for sig in 'version()(uint256)' 'borrower()(address)' 'intermediateVault()(address)' 'targetVault()(address)' 'asset()(address)' 'targetAsset()(address)' 'totalAssetsDepositedOrReserved()(uint256)' 'maxRelease()(uint256)' 'maxRepay()(uint256)' 'twyneLiqLTV()(uint256)' 'canLiquidate()(bool)' 'isExternallyLiquidated()(bool)'; do
                echo -n "$sig = "
                cast call "$cv" "$sig" --rpc-url "$RPC" 2>&1 || true
              done
              cast storage "$cv" "$BEACON_SLOT" --rpc-url "$RPC" 2>&1 || true
            } >> evidence/collateral-vault-state.txt
          done < evidence/collateral-vaults.txt

          curl -L --retry 4 -sS 'https://immunefi.com/bug-bounty/twyne/scope/' > evidence/immunefi-scope.html || true
          grep -Eo 'https://etherscan.io/address/0x[0-9A-Fa-f]{40}' evidence/immunefi-scope.html | sort -u > evidence/immunefi-addresses.txt || true
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Upload live inventory
        uses: actions/upload-artifact@v4
        with:
          name: twyne-live-config-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
