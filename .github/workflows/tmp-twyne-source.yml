name: Temporary Twyne source and baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-twyne-source-trigger.txt'
      - '.github/workflows/tmp-twyne-source.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        id: foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Clone exact public Twyne sources and run baseline build
        shell: bash
        run: |
          mkdir -p evidence
          set +e

          TWYNE_HEAD='ac8e54619983d52d63a32f6d9f4b9f20b83603ac'
          WRAPPER_HEAD='797be33e22cce033f6d9c66650d9604ee48fc60d'

          git clone --recurse-submodules https://github.com/0xTwyne/twyne-contracts-v1.git twyne \
            > evidence/twyne-clone.log 2>&1
          twyne_clone_rc=$?
          twyne_checkout_rc=99
          twyne_submodule_rc=99
          if [ "$twyne_clone_rc" = 0 ]; then
            git -C twyne checkout --detach "$TWYNE_HEAD" >> evidence/twyne-clone.log 2>&1
            twyne_checkout_rc=$?
            git -C twyne submodule update --init --recursive >> evidence/twyne-clone.log 2>&1
            twyne_submodule_rc=$?
            git -C twyne rev-parse HEAD > evidence/twyne-head.txt 2>&1
            git -C twyne submodule status --recursive > evidence/twyne-submodules.txt 2>&1
          fi

          git clone --recurse-submodules https://github.com/0xTwyne/aave-v3-aToken-wrapper.git wrapper \
            > evidence/wrapper-clone.log 2>&1
          wrapper_clone_rc=$?
          wrapper_checkout_rc=99
          wrapper_submodule_rc=99
          if [ "$wrapper_clone_rc" = 0 ]; then
            git -C wrapper checkout --detach "$WRAPPER_HEAD" >> evidence/wrapper-clone.log 2>&1
            wrapper_checkout_rc=$?
            git -C wrapper submodule update --init --recursive >> evidence/wrapper-clone.log 2>&1
            wrapper_submodule_rc=$?
            git -C wrapper rev-parse HEAD > evidence/wrapper-head.txt 2>&1
            git -C wrapper submodule status --recursive > evidence/wrapper-submodules.txt 2>&1
          fi

          forge_rc=98
          build_rc=98
          if command -v forge >/dev/null 2>&1; then
            forge --version > evidence/foundry-version.txt 2>&1
            forge_rc=0
            if [ "$twyne_clone_rc" = 0 ] && [ "$twyne_checkout_rc" = 0 ] && [ "$twyne_submodule_rc" = 0 ]; then
              (cd twyne && forge clean && forge build) > evidence/twyne-build.log 2>&1
              build_rc=$?
            fi
          else
            echo 'forge unavailable' > evidence/foundry-version.txt
          fi

          printf '%s\n' \
            "twyne_clone_rc=$twyne_clone_rc" \
            "twyne_checkout_rc=$twyne_checkout_rc" \
            "twyne_submodule_rc=$twyne_submodule_rc" \
            "wrapper_clone_rc=$wrapper_clone_rc" \
            "wrapper_checkout_rc=$wrapper_checkout_rc" \
            "wrapper_submodule_rc=$wrapper_submodule_rc" \
            "forge_rc=$forge_rc" \
            "build_rc=$build_rc" > evidence/exit-codes.txt

          find twyne/src -type f 2>/dev/null | sort > evidence/twyne-src-files.txt
          find twyne/test -type f 2>/dev/null | sort > evidence/twyne-test-files.txt
          find wrapper/src -type f 2>/dev/null | sort > evidence/wrapper-src-files.txt

          rm -rf twyne/.git wrapper/.git
          tar -czf evidence/twyne-exact-source.tar.gz twyne wrapper
          tar_rc=$?
          echo "tar_rc=$tar_rc" >> evidence/exit-codes.txt
          exit 0

      - name: Build checksums
        if: always()
        shell: bash
        run: |
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload exact source and baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twyne-source-baseline-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 2
