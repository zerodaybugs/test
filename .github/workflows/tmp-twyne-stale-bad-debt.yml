name: Temporary Twyne stale bad-debt exit gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'security_research/twyne_stale_bad_debt/**'
      - 'tmp-twyne-stale-trigger.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout private PoC material
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Clone exact Twyne source and run pinned fork PoC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          RPC='https://gateway.tenderly.co/public/mainnet'
          git clone --quiet --recurse-submodules https://github.com/0xTwyne/twyne-contracts-v1.git twyne
          git -C twyne checkout --quiet --detach ac8e54619983d52d63a32f6d9f4b9f20b83603ac
          git -C twyne submodule update --init --recursive
          cp security_research/twyne_stale_bad_debt/TWYNE_STALE_BAD_DEBT_EXIT_POC.t.sol \
             twyne/test/twyne/mainnet/euler/TWYNE_STALE_BAD_DEBT_EXIT_POC.t.sol
          printf '%s\n' ac8e54619983d52d63a32f6d9f4b9f20b83603ac > evidence/twyne-head.txt
          printf '%s\n' "$RPC" > evidence/rpc.txt
          forge --version > evidence/foundry-version.txt
          (
            cd twyne
            FOUNDRY_PROFILE=mainnet forge test --fork-url "$RPC" \
              --fork-block-number 23600528 \
              --match-path test/twyne/mainnet/euler/TWYNE_STALE_BAD_DEBT_EXIT_POC.t.sol \
              --match-test test_PoC_ExternalLiquidationCreatesStaleNavExitWindow \
              -vvvv
          ) 2>&1 | tee evidence/poc-run-1.log
          (
            cd twyne
            FOUNDRY_PROFILE=mainnet forge test --fork-url "$RPC" \
              --fork-block-number 23600528 \
              --match-path test/twyne/mainnet/euler/TWYNE_STALE_BAD_DEBT_EXIT_POC.t.sol \
              --match-test test_PoC_ExternalLiquidationCreatesStaleNavExitWindow \
              -vvvv
          ) 2>&1 | tee evidence/poc-run-2.log
          cp security_research/twyne_stale_bad_debt/TWYNE_STALE_BAD_DEBT_EXIT_POC.t.sol evidence/
          grep -F '[PASS] test_PoC_ExternalLiquidationCreatesStaleNavExitWindow()' evidence/poc-run-1.log
          grep -F '[PASS] test_PoC_ExternalLiquidationCreatesStaleNavExitWindow()' evidence/poc-run-2.log
          grep -F 'attackerGain' evidence/poc-run-1.log
          grep -F 'victimExtraLoss' evidence/poc-run-1.log
          grep -F 'socializedLoss' evidence/poc-run-1.log

      - name: Build evidence checksums
        if: always()
        shell: bash
        run: |
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twyne-stale-bad-debt-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
