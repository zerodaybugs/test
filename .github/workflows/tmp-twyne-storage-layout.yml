name: Temporary Twyne storage layout delta

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-twyne-storage-trigger.txt'

permissions:
  contents: read

jobs:
  layouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build historical storage layouts
        shell: bash
        run: |
          set -u
          mkdir -p evidence repos
          commits=(
            7df4197d06641872ceeb3e313e78754a787e29c0
            1f7e12fd5aeb196a57691adec5a4396214c419cb
            918136da8695077ee8b1bf5982d78c8b5141f794
            e540c7dccb86ea32363f84366bbdfec9595bfdc3
            0c1ff9db684bea4fc6bf6fd31a3c90f7c787a1e7
            ac8e54619983d52d63a32f6d9f4b9f20b83603ac
          )
          : > evidence/status.txt
          for c in "${commits[@]}"; do
            repo="repos/$c"
            out="evidence/$c"
            mkdir -p "$out"
            clone_rc=0
            checkout_rc=0
            submodule_rc=0
            git clone --quiet --filter=blob:none --no-tags https://github.com/0xTwyne/twyne-contracts-v1.git "$repo" \
              > "$out/clone.log" 2>&1 || clone_rc=$?
            if [ "$clone_rc" = 0 ]; then
              git -C "$repo" checkout --quiet --detach "$c" >> "$out/clone.log" 2>&1 || checkout_rc=$?
            else
              checkout_rc=99
            fi
            if [ "$checkout_rc" = 0 ]; then
              git -C "$repo" submodule sync --recursive >> "$out/submodules.log" 2>&1
              git -C "$repo" submodule update --init --recursive --force >> "$out/submodules.log" 2>&1 || submodule_rc=$?
              git -C "$repo" rev-parse HEAD > "$out/HEAD"
            else
              submodule_rc=99
            fi
            printf '%s clone=%s checkout=%s submodules=%s\n' "$c" "$clone_rc" "$checkout_rc" "$submodule_rc" \
              >> evidence/status.txt

            if [ "$checkout_rc" = 0 ]; then
              for spec in \
                'src/twyne/CollateralVaultBase.sol:CollateralVaultBase' \
                'src/twyne/EulerCollateralVault.sol:EulerCollateralVault' \
                'src/twyne/AaveV3CollateralVault.sol:AaveV3CollateralVault' \
                'src/twyne/VaultManager.sol:VaultManager' \
                'src/TwyneFactory/CollateralVaultFactory.sol:CollateralVaultFactory'; do
                name=$(printf '%s' "$spec" | sed 's/.*://')
                path=${spec%%:*}
                if [ -f "$repo/$path" ]; then
                  (
                    cd "$repo"
                    forge inspect "$spec" storage-layout --json
                  ) > "$out/$name.json" 2> "$out/$name.err" || true
                fi
              done
              for f in src/twyne/CollateralVaultBase.sol src/twyne/EulerCollateralVault.sol src/twyne/AaveV3CollateralVault.sol src/twyne/VaultManager.sol src/TwyneFactory/CollateralVaultFactory.sol; do
                [ -f "$repo/$f" ] && cp "$repo/$f" "$out/$(basename "$f")"
              done
            fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('evidence')
          result = {}
          for d in sorted(p for p in root.iterdir() if p.is_dir()):
              result[d.name] = {}
              for f in sorted(d.glob('*.json')):
                  try:
                      data = json.loads(f.read_text())
                  except Exception as exc:
                      result[d.name][f.stem] = {'parse_error': str(exc)}
                      continue
                  storage = data.get('storage', data if isinstance(data, list) else [])
                  result[d.name][f.stem] = [
                      {k: item.get(k) for k in ('label', 'slot', 'offset', 'type', 'contract')}
                      for item in storage
                  ]
          (root / 'layout-summary.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twyne-storage-layout-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
