name: Temporary Twyne storage layout delta

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-twyne-storage-trigger.txt'

permissions:
  contents: read

jobs:
  layouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build historical storage layouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone --quiet https://github.com/0xTwyne/twyne-contracts-v1.git twyne
          cd twyne
          commits=(
            7df4197d06641872ceeb3e313e78754a787e29c0
            1f7e12fd5aeb196a57691adec5a4396214c419cb
            918136da8695077ee8b1bf5982d78c8b5141f794
            e540c7dccb86ea32363f84366bbdfec9595bfdc3
            0c1ff9db684bea4fc6bf6fd31a3c90f7c787a1e7
            ac8e54619983d52d63a32f6d9f4b9f20b83603ac
          )
          for c in "${commits[@]}"; do
            git checkout --quiet --detach "$c"
            git submodule sync --recursive
            git submodule update --init --recursive --force
            out="../evidence/$c"
            mkdir -p "$out"
            git rev-parse HEAD > "$out/HEAD"
            for spec in \
              'src/twyne/CollateralVaultBase.sol:CollateralVaultBase' \
              'src/twyne/EulerCollateralVault.sol:EulerCollateralVault' \
              'src/twyne/AaveV3CollateralVault.sol:AaveV3CollateralVault' \
              'src/twyne/VaultManager.sol:VaultManager' \
              'src/TwyneFactory/CollateralVaultFactory.sol:CollateralVaultFactory'; do
              name=$(printf '%s' "$spec" | sed 's/.*://')
              if [ -f "${spec%%:*}" ]; then
                forge inspect "$spec" storage-layout --json > "$out/$name.json" 2> "$out/$name.err" || true
              fi
            done
            for f in src/twyne/CollateralVaultBase.sol src/twyne/EulerCollateralVault.sol src/twyne/AaveV3CollateralVault.sol src/twyne/VaultManager.sol src/TwyneFactory/CollateralVaultFactory.sol; do
              [ -f "$f" ] && cp "$f" "$out/$(basename "$f")"
            done
          done
          cd ..
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence')
          result={}
          for d in sorted(p for p in root.iterdir() if p.is_dir()):
              result[d.name]={}
              for f in sorted(d.glob('*.json')):
                  try:
                      data=json.loads(f.read_text())
                  except Exception as e:
                      result[d.name][f.stem]={'parse_error':str(e)}
                      continue
                  storage=data.get('storage', data if isinstance(data,list) else [])
                  result[d.name][f.stem]=[
                      {k:x.get(k) for k in ('label','slot','offset','type','contract')}
                      for x in storage
                  ]
          (root/'layout-summary.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          PY
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload layout evidence
        uses: actions/upload-artifact@v4
        with:
          name: twyne-storage-layout-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
