name: Temporary Velocity cross-cluster value-bearing surface gate 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-velocity-cross-cluster-value-surface-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work evidence
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund @velocity-exchange/sdk@0.10.0 @solana/web3.js@1.98.0 > ../evidence/NPM_INSTALL.log 2>&1
      - name: Compute redacted live value-bearing overlap
        shell: bash
        run: |
          set -euo pipefail
          cd work
          cat > surface.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {Connection,Keypair,PublicKey} from '@solana/web3.js';
          import * as velocity from '@velocity-exchange/sdk';
          const OUT=path.resolve('../evidence');
          const PROGRAM=new PublicKey('vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P');
          const ENDPOINTS={
            'mainnet-beta':['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://solana.drpc.org'],
            devnet:['https://api.devnet.solana.com','https://solana-devnet.g.alchemy.com/v2/demo'],
          };
          const hash=(x)=>crypto.createHash('sha256').update(x).digest('hex');
          const id=(a,s)=>hash(Buffer.from(`${a}:${s}`)).slice(0,24);
          const to58=(v)=>v?.toBase58?.()??(v?String(v):null);
          const auth=(a)=>to58(a.authorityPubkey??a.authority_pubkey??a.authority??a.owner);
          const sub=(a)=>Number(a.subAccountId??a.sub_account_id??a.subaccountId??a.subAccount??0);
          const nz=(v)=>{try{return BigInt(v?.toString?.()??v??0)!==0n;}catch{return false;}};
          const variant=(v)=>v&&typeof v==='object'?Object.keys(v)[0]??'unknown':String(v??'unknown');
          const write=(name,v)=>fs.writeFileSync(path.join(OUT,name),JSON.stringify(v,null,2)+'\n');
          async function rpc(ep,method,params){const r=await fetch(ep,{method:'POST',headers:{'content-type':'application/json','user-agent':'Velocity-Value-Surface/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const t=await r.text();if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=JSON.parse(t);if(j.error)throw new Error(JSON.stringify(j.error));return j.result;}
          async function collect(env){
            const errors=[];
            for(const endpoint of ENDPOINTS[env]){
              let client;
              try{
                const slot=await rpc(endpoint,'getSlot',[{commitment:'finalized'}]);
                const genesisHash=await rpc(endpoint,'getGenesisHash',[]);
                const p=await rpc(endpoint,'getAccountInfo',[PROGRAM.toBase58(),{encoding:'base64',commitment:'finalized'}]);
                if(!p?.value?.executable)throw new Error('program missing');
                velocity.initialize({env});
                const connection=new Connection(endpoint,'finalized');
                const loader=new velocity.BulkAccountLoader(connection,'finalized',10000);
                client=new velocity.VelocityClient({connection,wallet:new velocity.Wallet(Keypair.generate()),env,programID:PROGRAM,opts:{commitment:'finalized',preflightCommitment:'finalized'},accountSubscription:{type:'polling',accountLoader:loader},activeSubAccountId:0,subAccountIds:[],userStats:false});
                if(!await client.subscribe())throw new Error('subscribe false');
                const users=(await client.program.account.user.all()).map(({publicKey,account})=>{
                  const authority=auth(account), subAccountId=sub(account);
                  const spots=(account.spotPositions??account.spot_positions??[]).filter((p)=>nz(p.scaledBalance??p.scaled_balance)).map((p)=>({marketIndex:Number(p.marketIndex??p.market_index??0),balanceType:variant(p.balanceType??p.balance_type),scaledBalance:String((p.scaledBalance??p.scaled_balance)?.toString?.()??0)}));
                  const perps=(account.perpPositions??account.perp_positions??[]).filter((p)=>nz(p.baseAssetAmount??p.base_asset_amount)||nz(p.quoteAssetAmount??p.quote_asset_amount)||nz(p.lpShares??p.lp_shares)).map((p)=>({marketIndex:Number(p.marketIndex??p.market_index??0),baseAssetAmount:String((p.baseAssetAmount??p.base_asset_amount)?.toString?.()??0),quoteAssetAmount:String((p.quoteAssetAmount??p.quote_asset_amount)?.toString?.()??0),lpShares:String((p.lpShares??p.lp_shares)?.toString?.()??0)}));
                  const orders=(account.orders??[]).filter((o)=>Number(o.orderId??o.order_id??0)>0&&variant(o.status)!=='init').map((o)=>({marketIndex:Number(o.marketIndex??o.market_index??0),marketType:variant(o.marketType??o.market_type),status:variant(o.status),baseAssetAmount:String((o.baseAssetAmount??o.base_asset_amount)?.toString?.()??0)}));
                  return {account:to58(publicKey),authority,subAccountId,identityHash:authority?id(authority,subAccountId):null,nonzeroSpotPositions:spots,nonzeroPerpPositions:perps,openOrders:orders,lastActiveSlot:String(account.lastActiveSlot?.toString?.()??account.last_active_slot?.toString?.()??0),hasValueBearingState:spots.length>0||perps.length>0||orders.length>0};
                });
                const signed=[];for(const n of Object.keys(client.program.account).filter((x)=>/signed.*msg/i.test(x))){for(const row of await client.program.account[n].all()){signed.push({authority:auth(row.account),namespace:n});}}
                await client.unsubscribe();
                return {env,endpoint,slot,genesisHash,users,signed,productionPrivateKeysLoaded:0,ephemeralReadOnlyKeypairsGenerated:1};
              }catch(e){errors.push(`${endpoint}: ${e.name}: ${e.message}`);if(client)try{await client.unsubscribe();}catch{}}
            }
            throw new Error(`${env} failed ${errors.join(' | ')}`);
          }
          const main=await collect('mainnet-beta');const dev=await collect('devnet');
          const mainByKey=new Map(main.users.filter((u)=>u.authority).map((u)=>[`${u.authority}:${u.subAccountId}`,u]));
          const mainByAuth=new Map();for(const u of main.users.filter((u)=>u.authority)){if(!mainByAuth.has(u.authority))mainByAuth.set(u.authority,[]);mainByAuth.get(u.authority).push(u);}
          const exact=[];for(const du of dev.users.filter((u)=>u.authority)){const mu=mainByKey.get(`${du.authority}:${du.subAccountId}`);if(mu)exact.push({identityHash:mu.identityHash,subAccountId:mu.subAccountId,mainnetHasValueBearingState:mu.hasValueBearingState,mainnetNonzeroSpotPositionCount:mu.nonzeroSpotPositions.length,mainnetNonzeroPerpPositionCount:mu.nonzeroPerpPositions.length,mainnetOpenOrderCount:mu.openOrders.length,mainnetLastActiveSlot:mu.lastActiveSlot});}
          const signedSurface=[];for(const ds of dev.signed.filter((s)=>s.authority)){for(const mu of mainByAuth.get(ds.authority)??[]){signedSurface.push({identityHash:mu.identityHash,namespace:ds.namespace,subAccountId:mu.subAccountId,mainnetHasValueBearingState:mu.hasValueBearingState,mainnetNonzeroSpotPositionCount:mu.nonzeroSpotPositions.length,mainnetNonzeroPerpPositionCount:mu.nonzeroPerpPositions.length,mainnetOpenOrderCount:mu.openOrders.length,mainnetLastActiveSlot:mu.lastActiveSlot});}}
          const result={status:'PASS_REDACTED_CROSS_CLUSTER_VALUE_SURFACE',programId:PROGRAM.toBase58(),mainnetFinalizedSlot:main.slot,devnetFinalizedSlot:dev.slot,exactCrossClusterUsers:exact.length,exactCrossClusterUsersWithMainnetValueBearingState:exact.filter((x)=>x.mainnetHasValueBearingState).length,devnetSignedAuthoritiesMappedMainnetUsers:signedSurface.length,devnetSignedAuthorityMainnetUsersWithValueBearingState:signedSurface.filter((x)=>x.mainnetHasValueBearingState).length,redactedExactWitnesses:exact,redactedSignedSurface:signedSurface,safety:{productionPrivateKeysLoaded:0,ephemeralReadOnlyKeypairsGenerated:2,transactionsConstructed:0,transactionsSigned:0,transactionsSent:0,publicChainWrites:0,rpcMethods:['getSlot','getGenesisHash','getAccountInfo','getProgramAccounts']}};
          write('VALUE_SURFACE.json',result);console.log(JSON.stringify(result,null,2));
          NODE
          node surface.mjs | tee ../evidence/RUN_STDOUT.log
          sha256sum surface.mjs > ../evidence/SCANNER_SHA256.txt
      - name: Build manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence');rows=[]
          for p in sorted(x for x in root.iterdir() if x.is_file() and x.name not in {'MANIFEST.json','SHA256SUMS.txt'}):
              b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as f:
              for r in rows:f.write(f"{r['sha256']}  {r['name']}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-cross-cluster-value-surface-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
