name: Temporary finalized public market-risk census 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-velocity-deficit-reachability-census-20260807.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture finalized public configuration only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work evidence
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 >/dev/null
          cat > census.cjs <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const {Connection,Keypair,PublicKey}=require('@solana/web3.js');
          const sdk=require('@velocity-exchange/sdk');
          const PROGRAM=new PublicKey('vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P');
          const EXPECTED_PD='HkRf36jvUB32dnHjHqpMnPcKJhUP2TUKJTH7RDTifJm7';
          const EXPECTED_SLOT=435978201;
          const EXPECTED_ELF='1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80';
          const RPCS=['https://moltnode.ag/solana','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com','https://api.mainnet-beta.solana.com','https://solana.drpc.org','https://1rpc.io/solana'];
          const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const norm=v=>{
            if(v===null||v===undefined)return v;
            if(typeof v==='bigint')return v.toString();
            if(v?.constructor?.name==='BN')return v.toString(10);
            if(typeof v?.toBase58==='function')return v.toBase58();
            if(Buffer.isBuffer(v)||v instanceof Uint8Array)return Buffer.from(v).toString('hex');
            if(Array.isArray(v))return v.map(norm);
            if(typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,norm(x)]));
            return v;
          };
          const name=x=>Buffer.from(x||[]).toString('utf8').replace(/\0/g,'').trim();
          const tokenAmount=data=>data&&data.length>=72?data.readBigUInt64LE(64).toString():null;
          function elfSize(data){
            if(data.length<64||data.subarray(0,4).toString('hex')!=='7f454c46'||data[4]!==2||data[5]!==1)throw new Error('NOT_ELF64LE');
            const phoff=Number(data.readBigUInt64LE(0x20)),shoff=Number(data.readBigUInt64LE(0x28));
            const eh=data.readUInt16LE(0x34),phe=data.readUInt16LE(0x36),phn=data.readUInt16LE(0x38),she=data.readUInt16LE(0x3a),shn=data.readUInt16LE(0x3c);let max=Math.max(64,eh);
            if(phoff&&phe&&phn){max=Math.max(max,phoff+phe*phn);for(let i=0;i<phn;i++){const o=phoff+i*phe;max=Math.max(max,Number(data.readBigUInt64LE(o+8)+data.readBigUInt64LE(o+32)));}}
            if(shoff&&she&&shn){max=Math.max(max,shoff+she*shn);for(let i=0;i<shn;i++){const o=shoff+i*she;if(data.readUInt32LE(o+4)!==8)max=Math.max(max,Number(data.readBigUInt64LE(o+24)+data.readBigUInt64LE(o+32)));}}
            if(max>data.length)throw new Error('ELF_EXTENT');return max;
          }
          (async()=>{
            let connection,endpoint,slot,last;
            for(const url of RPCS){try{const c=new Connection(url,'finalized');const s=await c.getSlot('finalized');connection=c;endpoint=url;slot=s;break;}catch(e){last=String(e);}}
            if(!connection)throw new Error('RPC_UNAVAILABLE '+last);
            const pi=await connection.getAccountInfo(PROGRAM,'finalized');if(!pi)throw new Error('PROGRAM_MISSING');
            const pd=new PublicKey(pi.data.subarray(4,36));const pdi=await connection.getAccountInfo(pd,'finalized');if(!pdi)throw new Error('PROGRAMDATA_MISSING');
            const deploymentSlot=Number(Buffer.from(pdi.data).readBigUInt64LE(4));const payload=Buffer.from(pdi.data).subarray(45);const canonical=payload.subarray(0,elfSize(payload));
            const deployment={programId:PROGRAM.toBase58(),programData:pd.toBase58(),programDataMatches:pd.toBase58()===EXPECTED_PD,deploymentSlot,deploymentSlotMatches:deploymentSlot===EXPECTED_SLOT,canonicalElfBytes:canonical.length,canonicalElfSha256:sha256(canonical),canonicalElfMatches:sha256(canonical)===EXPECTED_ELF,endpoint,finalizedSlot:slot};
            const wallet=new sdk.Wallet(Keypair.generate());
            const client=new sdk.VelocityClient({connection,wallet,programID:PROGRAM,skipLoadUsers:true,opts:{commitment:'finalized',preflightCommitment:'finalized'}});
            const perps=await client.program.account.perpMarket.all();
            const spots=await client.program.account.spotMarket.all();
            const rows=perps.map(({publicKey,account})=>({
              publicKey:publicKey.toBase58(),marketIndex:Number(account.marketIndex),name:name(account.name),status:norm(account.status),
              unrealizedPnlMaxImbalance:norm(account.unrealizedPnlMaxImbalance),pendingRevenueShare:norm(account.pendingRevenueShare),
              totalFeeMinusDistributions:norm(account.amm.totalFeeMinusDistributions),curveUpdateIntensity:Number(account.amm.curveUpdateIntensity),
              pnlPoolScaledBalance:norm(account.pnlPool.scaledBalance),feePoolScaledBalance:norm(account.amm.feePool.scaledBalance),
              maxRevenueWithdrawPerPeriod:norm(account.insuranceClaim.maxRevenueWithdrawPerPeriod),quoteMaxInsurance:norm(account.insuranceClaim.quoteMaxInsurance),
              quoteSettledInsurance:norm(account.insuranceClaim.quoteSettledInsurance),revenueWithdrawSinceLastSettle:norm(account.insuranceClaim.revenueWithdrawSinceLastSettle),
              oracle:account.oracle.toBase58(),oracleSource:norm(account.oracleSource)
            })).sort((a,b)=>a.marketIndex-b.marketIndex);
            const spot0=spots.find(x=>Number(x.account.marketIndex)===0);
            let spot0Summary=null;
            if(spot0){const vaults=await connection.getMultipleAccountsInfo([spot0.account.vault,spot0.account.insuranceFund.vault],'finalized');spot0Summary={marketIndex:0,name:name(spot0.account.name),vault:spot0.account.vault.toBase58(),vaultAmount:vaults[0]?tokenAmount(Buffer.from(vaults[0].data)):null,insuranceVault:spot0.account.insuranceFund.vault.toBase58(),insuranceVaultAmount:vaults[1]?tokenAmount(Buffer.from(vaults[1].data)):null,insuranceFund:norm(spot0.account.insuranceFund),revenuePool:norm(spot0.account.revenuePool)};}
            const eligible=rows.filter(r=>BigInt(r.unrealizedPnlMaxImbalance||'0')>0n && BigInt(r.quoteMaxInsurance||'0')>BigInt(r.quoteSettledInsurance||'0'));
            const pending=rows.filter(r=>BigInt(r.pendingRevenueShare||'0')>0n);
            const overlap=rows.filter(r=>BigInt(r.unrealizedPnlMaxImbalance||'0')>0n && BigInt(r.pendingRevenueShare||'0')>0n && BigInt(r.quoteMaxInsurance||'0')>BigInt(r.quoteSettledInsurance||'0'));
            const out={capturedAt:new Date().toISOString(),deployment,perpCount:rows.length,perpMarkets:rows,spot0:spot0Summary,gates:{resolverConfigEligibleMarketCount:eligible.length,pendingRevenueMarketCount:pending.length,currentDirectOverlapCount:overlap.length,eligibleMarketIndexes:eligible.map(x=>x.marketIndex),pendingMarketIndexes:pending.map(x=>x.marketIndex),overlapMarketIndexes:overlap.map(x=>x.marketIndex)},publicChainTransactions:0,transactionsConstructed:0,transactionsSigned:0,transactionsSent:0};
            fs.writeFileSync('../evidence/CURRENT_DEFICIT_REACHABILITY.json',JSON.stringify(out,null,2)+'\n');
            fs.writeFileSync('../evidence/SUMMARY.json',JSON.stringify({capturedAt:out.capturedAt,deployment:out.deployment,perpCount:out.perpCount,gates:out.gates,spot0:out.spot0,publicChainTransactions:0},null,2)+'\n');
            console.log(JSON.stringify({capturedAt:out.capturedAt,deployment:out.deployment,perpCount:out.perpCount,gates:out.gates,publicChainTransactions:0},null,2));
          })().catch(e=>{const out={status:'FAIL',error:String(e?.stack||e),publicChainTransactions:0};fs.writeFileSync('../evidence/SUMMARY.json',JSON.stringify(out,null,2)+'\n');console.error(out.error);process.exit(1);});
          NODE
          node census.cjs

      - name: Manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('evidence');rows=[]
          for p in sorted(r.glob('*')):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (r/'MANIFEST.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-deficit-reachability-${{ github.run_id }}
          path: evidence
          retention-days: 1
          if-no-files-found: error
