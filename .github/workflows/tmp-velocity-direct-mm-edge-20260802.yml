name: Temporary Velocity projected direct-vs-MM edge census 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-velocity-direct-mm-edge/**'
      - '.github/workflows/tmp-velocity-direct-mm-edge-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velocity-direct-mm-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned public dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work evidence
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 \
            bs58@4.0.1 > ../evidence/NPM_INSTALL.log 2>&1
          npm ls --all --json > ../evidence/NPM_DEPENDENCY_TREE.json \
            2> ../evidence/NPM_LS_STDERR.log || true
          cp ../.tmp-velocity-direct-mm-edge/scan_v2.mjs ./scan.mjs
          node --check scan.mjs
          sha256sum scan.mjs > ../evidence/SCANNER_SHA256.txt

      - name: Execute finalized read-only projected-staleness census
        shell: bash
        env:
          OUT_DIR: ../evidence
          ATTEMPTS: '6000'
          SLEEP_MS: '200'
          MIN_NET_EDGE_BPS: '0.5'
          EXECUTION_BUFFER_BPS: '0.75'
          MAX_PROJECTED_WAIT_SLOTS: '6'
          CONSERVATIVE_SLOT_SECONDS: '0.6'
        run: |
          set -o pipefail
          cd work
          node scan.mjs 2>&1 | tee ../evidence/RUN_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../evidence/EXIT_CODE.txt
          exit "$code"

      - name: Build immutable evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('evidence')
          rows = []
          for p in sorted(x for x in root.iterdir() if x.is_file() and x.name not in {'SHA256SUMS.txt', 'EVIDENCE_MANIFEST.json'}):
              data = p.read_bytes()
              rows.append({'name': p.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          (root / 'EVIDENCE_MANIFEST.json').write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n')
          with (root / 'SHA256SUMS.txt').open('w') as handle:
              for row in rows:
                  handle.write(f"{row['sha256']}  {row['name']}\n")
          PY

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-projected-edge-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
