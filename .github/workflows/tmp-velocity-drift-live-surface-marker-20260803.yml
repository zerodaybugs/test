name: Temporary Velocity-Drift live surface verdict marker 20260803

on:
  push:
    branches: [tmp-velocity-drift-live-surface-20260803]
    paths:
      - '.tmp-results/velocity-drift-live-surface.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-velocity-drift-live-surface-20260803
          fetch-depth: 1
          persist-credentials: true
      - name: Create fail-closed fixed verdict marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.tmp-results'); root.mkdir(exist_ok=True)
          data=json.loads((root/'velocity-drift-live-surface.json').read_text())
          for name in ['PASS_CURRENT_LIVE_VICTIM_SURFACE.txt','NO_CURRENT_LIVE_VICTIM_SURFACE.txt']:
              (root/name).unlink(missing_ok=True)
          passed=bool(data.get('currentLiveVictimSurface')) and int(data.get('driftSignedAuthorityMappedValueBearingVelocityUserCount',0))>0
          name='PASS_CURRENT_LIVE_VICTIM_SURFACE.txt' if passed else 'NO_CURRENT_LIVE_VICTIM_SURFACE.txt'
          (root/name).write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-results/PASS_CURRENT_LIVE_VICTIM_SURFACE.txt .tmp-results/NO_CURRENT_LIVE_VICTIM_SURFACE.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: publish Velocity-Drift live-surface verdict marker'
          git push origin HEAD:tmp-velocity-drift-live-surface-20260803
