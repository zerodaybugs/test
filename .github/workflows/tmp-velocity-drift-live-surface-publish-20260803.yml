name: Temporary Velocity-Drift SWIFT live surface publish 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp-velocity-drift-live-surface/**'
      - '.github/workflows/tmp-velocity-drift-live-surface-publish-20260803.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-velocity-drift-live-surface-20260803
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned official SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work evidence .tmp-results
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @drift-labs/sdk@2.163.0-beta.13 \
            @solana/web3.js@1.98.0 > ../evidence/NPM_INSTALL.log 2>&1
          cp ../.tmp-velocity-drift-live-surface/census.mjs ./census.mjs
          node --check census.mjs

      - name: Execute finalized read-only census
        shell: bash
        env:
          OUT_DIR: ../evidence
        run: |
          set -o pipefail
          cd work
          node census.mjs 2>&1 | tee ../evidence/RUN_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../evidence/EXIT_CODE.txt
          exit "$code"

      - name: Publish counts-only result to research branch
        shell: bash
        run: |
          set -euo pipefail
          cp evidence/PUBLIC_SUMMARY.json .tmp-results/velocity-drift-live-surface.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-results/velocity-drift-live-surface.json
          if git diff --cached --quiet; then
            echo 'No result change'
          else
            git commit -m 'evidence: publish redacted Velocity-Drift live surface counts'
            git push origin HEAD:tmp-velocity-drift-live-surface-20260803
          fi

      - name: Upload full redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-drift-live-surface-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
