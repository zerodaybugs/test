name: Temporary Velocity HYPE market snapshot 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-velocity-hype-market-snapshot-20260803.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned public dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work artifact
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 > ../artifact/NPM_INSTALL.log 2>&1
          npm ls --all --json > ../artifact/NPM_DEPENDENCY_TREE.json \
            2> ../artifact/NPM_LS_STDERR.log || true

      - name: Capture finalized generic market state
        shell: bash
        env:
          OUT_DIR: ../artifact
        run: |
          set -o pipefail
          cd work
          cat > snapshot.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { Connection, Keypair, PublicKey } from '@solana/web3.js';
          import * as sdk from '@velocity-exchange/sdk';

          const OUT = path.resolve(process.env.OUT_DIR ?? '../artifact');
          const PROGRAM = new PublicKey('vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P');
          const PYTH_STORAGE = new PublicKey('3rdJbqfnagQ4yx9HXJViD4zc4xpiSqmFsKpPuSCQVyQL');
          const EXPECTED_ELF = '1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80';
          const RPCS = [
            'https://api.mainnet-beta.solana.com',
            'https://solana-rpc.publicnode.com',
            'https://solana.drpc.org',
            'https://1rpc.io/solana',
            'https://mainnet-beta.solflare.network',
          ];
          fs.mkdirSync(OUT, { recursive: true });
          const sha256 = (b) => crypto.createHash('sha256').update(b).digest('hex');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          function clean(value, seen = new WeakSet()) {
            if (value == null) return value;
            if (typeof value === 'bigint') return value.toString();
            if (['string','number','boolean'].includes(typeof value)) return value;
            if (Buffer.isBuffer(value) || value instanceof Uint8Array) return { bytes: value.length, base64: Buffer.from(value).toString('base64') };
            if (value?.toBase58) return value.toBase58();
            if (value?.constructor?.name === 'BN' && value?.toString) return value.toString();
            if (Array.isArray(value)) return value.map((x) => clean(x, seen));
            if (typeof value === 'object') {
              if (seen.has(value)) return '[Circular]';
              seen.add(value); const out = {};
              for (const [k,v] of Object.entries(value)) { const n = clean(v, seen); if (n !== undefined) out[k] = n; }
              seen.delete(value); return out;
            }
            return String(value);
          }
          const write = (name, value) => fs.writeFileSync(path.join(OUT, name), JSON.stringify(clean(value), null, 2) + '\n');
          async function raw(endpoint, method, params, timeoutMs = 120000) {
            const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
              const r = await fetch(endpoint, { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json', 'user-agent': 'Velocity-Generic-HYPE-Snapshot/1.0' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }), signal: controller.signal });
              const text = await r.text(); if (!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0,250)}`);
              const body = JSON.parse(text); if (body.error) throw new Error(JSON.stringify(body.error)); return body.result;
            } finally { clearTimeout(timer); }
          }
          let cursor = 0;
          async function rpc(method, params, attempts = 18, timeoutMs = 120000) {
            let last; const errors = [];
            for (let i = 0; i < attempts; i++) {
              const ep = RPCS[(cursor + i) % RPCS.length];
              try { const result = await raw(ep, method, params, timeoutMs); cursor = (RPCS.indexOf(ep) + 1) % RPCS.length; return { endpoint: ep, result, errors }; }
              catch (e) { last = e; errors.push(`${ep}: ${e.name}: ${e.message}`); await sleep(Math.min(4000, 150 * 2 ** Math.min(i,5))); }
            }
            throw new Error(`${method} failed: ${last?.message}; ${errors.slice(-8).join(' | ')}`);
          }
          const u16 = (b,o) => b.readUInt16LE(o), u32 = (b,o) => b.readUInt32LE(o), u64 = (b,o) => Number(b.readBigUInt64LE(o));
          function canonicalLength(b) {
            if (b.length < 64 || b.subarray(0,4).toString('hex') !== '7f454c46' || b[4] !== 2 || b[5] !== 1) throw new Error('invalid ELF');
            const phoff = u64(b,0x20), shoff = u64(b,0x28), eh = u16(b,0x34), phe = u16(b,0x36), phn = u16(b,0x38), she = u16(b,0x3a), shn = u16(b,0x3c);
            let max = Math.max(64, eh);
            if (phoff && phe && phn) { max = Math.max(max, phoff + phe*phn); for (let i=0;i<phn;i++){const o=phoff+i*phe;max=Math.max(max,u64(b,o+8)+u64(b,o+32));} }
            if (shoff && she && shn) { max = Math.max(max, shoff + she*shn); for (let i=0;i<shn;i++){const o=shoff+i*she;if(u32(b,o+4)!==8)max=Math.max(max,u64(b,o+24)+u64(b,o+32));} }
            if (max > b.length) throw new Error('ELF extent exceeds payload'); return max;
          }
          function decodeAccount(coder, names, rawData) {
            const errors = [];
            for (const n of names) { try { return coder.accounts.decode(n, rawData); } catch (e) { errors.push(`${n}: ${e.message}`); } }
            throw new Error(errors.join(' | '));
          }

          sdk.initialize({ env: 'mainnet-beta' });
          const programResponse = await rpc('getAccountInfo', [PROGRAM.toBase58(), { encoding: 'base64', commitment: 'finalized' }]);
          const programInfo = programResponse.result?.value;
          if (!programInfo?.executable) throw new Error('Velocity program missing/non-executable');
          const programRaw = Buffer.from(programInfo.data[0], 'base64');
          const programData = new PublicKey(programRaw.subarray(4,36));
          const pdResponse = await rpc('getAccountInfo', [programData.toBase58(), { encoding: 'base64', commitment: 'finalized' }], 18, 240000);
          const pdRaw = Buffer.from(pdResponse.result.value.data[0], 'base64');
          const payload = pdRaw.subarray(45); const activeElf = payload.subarray(0, canonicalLength(payload));
          if (sha256(activeElf) !== EXPECTED_ELF) throw new Error(`active ELF changed: ${sha256(activeElf)}`);
          fs.writeFileSync(path.join(OUT, 'VELOCITY_ACTIVE_PROGRAM_CANONICAL.so'), activeElf);

          const connection = new Connection(programResponse.endpoint, 'finalized');
          const client = new sdk.VelocityClient({
            connection, wallet: new sdk.Wallet(Keypair.generate()), programID: PROGRAM, env: 'mainnet-beta',
            opts: { commitment: 'finalized', preflightCommitment: 'finalized' }, activeSubAccountId: 0, subAccountIds: [],
            perpMarketIndexes: [], spotMarketIndexes: [], oracleInfos: [], accountSubscription: { type: 'websocket' },
            userStats: false, skipLoadUsers: true, txVersion: 'legacy', marketLookupTables: [],
          });
          const statePda = await sdk.getVelocityStateAccountPublicKey(PROGRAM);
          const spot0Pda = await sdk.getSpotMarketPublicKey(PROGRAM, 0);
          const spot1Pda = await sdk.getSpotMarketPublicKey(PROGRAM, 1);
          const perp3Pda = await sdk.getPerpMarketPublicKey(PROGRAM, 3);
          const primaryKeys = [statePda, spot0Pda, spot1Pda, perp3Pda];
          const primary = await rpc('getMultipleAccounts', [primaryKeys.map(String), { encoding: 'base64', commitment: 'finalized' }]);
          if (primary.result.value.some((x) => !x)) throw new Error('primary account missing');
          const coder = client.program.coder;
          const decodedState = decodeAccount(coder, ['state','State'], Buffer.from(primary.result.value[0].data[0], 'base64'));
          const decodedSpot0 = decodeAccount(coder, ['spotMarket','SpotMarket'], Buffer.from(primary.result.value[1].data[0], 'base64'));
          const decodedSpot1 = decodeAccount(coder, ['spotMarket','SpotMarket'], Buffer.from(primary.result.value[2].data[0], 'base64'));
          const decodedPerp3 = decodeAccount(coder, ['perpMarket','PerpMarket'], Buffer.from(primary.result.value[3].data[0], 'base64'));
          const addresses = {
            state: statePda, spot0: spot0Pda, spot1: spot1Pda, perp3: perp3Pda,
            oracle0: decodedSpot0.oracle, oracle1: decodedSpot1.oracle, oracle110: decodedPerp3.oracle,
            mint0: decodedSpot0.mint, mint1: decodedSpot1.mint,
            vault0: decodedSpot0.vault, vault1: decodedSpot1.vault,
            insurance0: decodedSpot0.insuranceFund?.vault ?? decodedSpot0.insurance_fund?.vault,
            insurance1: decodedSpot1.insuranceFund?.vault ?? decodedSpot1.insurance_fund?.vault,
            pythStorage: PYTH_STORAGE,
          };
          const labels = ['state','spot0','spot1','perp3','oracle0','oracle1','oracle110','mint0','mint1','vault0','vault1','insurance0','insurance1','pythStorage'];
          const keys = labels.map((l) => new PublicKey(addresses[l]));
          const accountRows = [];
          for (let start=0; start<keys.length; start+=100) {
            const chunk = keys.slice(start,start+100);
            const response = await rpc('getMultipleAccounts', [chunk.map(String), { encoding: 'base64', commitment: 'finalized' }]);
            response.result.value.forEach((value, i) => {
              if (!value) throw new Error(`missing account ${chunk[i]}`);
              const label = labels[start+i]; const data = Buffer.from(value.data[0], 'base64');
              accountRows.push({ label, address: chunk[i].toBase58(), executable: value.executable, lamports: value.lamports, owner: value.owner, rentEpoch: value.rentEpoch ?? 0, dataBase64: value.data[0], dataBytes: data.length, dataSha256: sha256(data), provenance: 'current_finalized_read_only_rpc' });
            });
          }
          write('ACCOUNTS.json', accountRows);
          write('ADDRESSES.json', addresses);
          write('DECODED.json', { state: decodedState, spot0: decodedSpot0, spot1: decodedSpot1, perp3: decodedPerp3 });
          write('CAPTURE.json', {
            status: 'PASS_GENERIC_VELOCITY_HYPE_MARKET_SNAPSHOT', checkedAt: new Date().toISOString(),
            finalizedSlot: primary.result.context.slot, endpoint: primary.endpoint, programId: PROGRAM, programData,
            activeElfBytes: activeElf.length, activeElfSha256: sha256(activeElf), accountCount: accountRows.length,
            labels, publicChainTransactionsConstructed: 0, publicChainTransactionsSigned: 0, publicChainTransactionsSent: 0, publicChainWrites: 0,
            rpcMethods: ['getAccountInfo','getMultipleAccounts'],
          });
          const files = fs.readdirSync(OUT).sort().filter((n) => !['MANIFEST.json','SHA256SUMS.txt'].includes(n)).map((name) => { const b = fs.readFileSync(path.join(OUT,name)); return { name, bytes: b.length, sha256: sha256(b) }; });
          write('MANIFEST.json', files); fs.writeFileSync(path.join(OUT,'SHA256SUMS.txt'), files.map((r) => `${r.sha256}  ${r.name}`).join('\n') + '\n');
          console.log(JSON.stringify(clean({ status: 'PASS_GENERIC_VELOCITY_HYPE_MARKET_SNAPSHOT', finalizedSlot: primary.result.context.slot, activeElfSha256: sha256(activeElf), accounts: accountRows.map((x) => ({label:x.label,address:x.address,dataBytes:x.dataBytes,dataSha256:x.dataSha256})), publicChainWrites:0 }), null, 2));
          NODE
          node --check snapshot.mjs
          sha256sum snapshot.mjs > ../artifact/SCANNER_SHA256.txt
          node snapshot.mjs 2>&1 | tee ../artifact/RUN_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../artifact/EXIT_CODE.txt
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-hype-market-snapshot-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
