name: Temporary finalized isolated-position reachability census 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-velocity-isolated-reachability-census-20260807.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Aggregate finalized public state without user identifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work evidence
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 >/dev/null
          cat > census.cjs <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const {Connection,Keypair,PublicKey}=require('@solana/web3.js');
          const sdk=require('@velocity-exchange/sdk');
          const PROGRAM=new PublicKey('vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P');
          const EXPECTED_PD='HkRf36jvUB32dnHjHqpMnPcKJhUP2TUKJTH7RDTifJm7';
          const EXPECTED_SLOT=435978201;
          const EXPECTED_ELF='1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80';
          const RPCS=['https://moltnode.ag/solana','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com','https://api.mainnet-beta.solana.com','https://solana.drpc.org','https://1rpc.io/solana'];
          const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const bn=v=>BigInt(v?.toString?.(10)??v??0);
          const isBorrow=t=>t&&Object.prototype.hasOwnProperty.call(t,'borrow');
          const tokenAmount=data=>data&&data.length>=72?data.readBigUInt64LE(64).toString():null;
          function elfSize(data){
            if(data.length<64||data.subarray(0,4).toString('hex')!=='7f454c46'||data[4]!==2||data[5]!==1)throw new Error('NOT_ELF64LE');
            const phoff=Number(data.readBigUInt64LE(0x20)),shoff=Number(data.readBigUInt64LE(0x28));
            const eh=data.readUInt16LE(0x34),phe=data.readUInt16LE(0x36),phn=data.readUInt16LE(0x38),she=data.readUInt16LE(0x3a),shn=data.readUInt16LE(0x3c);let max=Math.max(64,eh);
            if(phoff&&phe&&phn){max=Math.max(max,phoff+phe*phn);for(let i=0;i<phn;i++){const o=phoff+i*phe;max=Math.max(max,Number(data.readBigUInt64LE(o+8)+data.readBigUInt64LE(o+32)));}}
            if(shoff&&she&&shn){max=Math.max(max,shoff+she*shn);for(let i=0;i<shn;i++){const o=shoff+i*she;if(data.readUInt32LE(o+4)!==8)max=Math.max(max,Number(data.readBigUInt64LE(o+24)+data.readBigUInt64LE(o+32)));}}
            if(max>data.length)throw new Error('ELF_EXTENT');return max;
          }
          (async()=>{
            let connection,endpoint,finalizedSlot,last;
            for(const url of RPCS){try{const c=new Connection(url,'finalized');const s=await c.getSlot('finalized');connection=c;endpoint=url;finalizedSlot=s;break;}catch(e){last=String(e);}}
            if(!connection)throw new Error('RPC_UNAVAILABLE '+last);
            const pi=await connection.getAccountInfo(PROGRAM,'finalized');if(!pi)throw new Error('PROGRAM_MISSING');
            const pd=new PublicKey(pi.data.subarray(4,36));const pdi=await connection.getAccountInfo(pd,'finalized');if(!pdi)throw new Error('PROGRAMDATA_MISSING');
            const deploymentSlot=Number(Buffer.from(pdi.data).readBigUInt64LE(4));const payload=Buffer.from(pdi.data).subarray(45);const canonical=payload.subarray(0,elfSize(payload));
            const deployment={programId:PROGRAM.toBase58(),programData:pd.toBase58(),programDataMatches:pd.toBase58()===EXPECTED_PD,deploymentSlot,deploymentSlotMatches:deploymentSlot===EXPECTED_SLOT,canonicalElfBytes:canonical.length,canonicalElfSha256:sha256(canonical),canonicalElfMatches:sha256(canonical)===EXPECTED_ELF,endpoint,finalizedSlot};
            const wallet=new sdk.Wallet(Keypair.generate());
            const client=new sdk.VelocityClient({connection,wallet,programID:PROGRAM,skipLoadUsers:true,opts:{commitment:'finalized',preflightCommitment:'finalized'}});
            const [users,perps,spots]=await Promise.all([client.program.account.user.all(),client.program.account.perpMarket.all(),client.program.account.spotMarket.all()]);
            const byMarket={};let isolatedUsers=0,isolatedPositions=0,activeIsolatedPositions=0,isolatedWithAnySpotBorrow=0,isolatedWithQuoteSpotBorrow=0,isolatedWithNegativePerpQuote=0,isolatedWithNonzeroStatus=0;
            for(const {account:u} of users){
              const isolated=(u.perpPositions||[]).filter(p=>(Number(p.positionFlag)&1)!==0);
              if(!isolated.length)continue;
              isolatedUsers++;
              isolatedPositions+=isolated.length;
              if(Number(u.status)!==0)isolatedWithNonzeroStatus++;
              let active=false,negative=false;
              for(const p of isolated){
                const idx=String(Number(p.marketIndex));byMarket[idx]=(byMarket[idx]||0)+1;
                if(bn(p.baseAssetAmount)!==0n||bn(p.quoteAssetAmount)!==0n||bn(p.isolatedPositionScaledBalance)!==0n){active=true;activeIsolatedPositions++;}
                if(bn(p.quoteAssetAmount)<0n)negative=true;
              }
              if(negative)isolatedWithNegativePerpQuote++;
              const borrows=(u.spotPositions||[]).filter(s=>isBorrow(s.balanceType)&&bn(s.scaledBalance)>0n);
              if(borrows.length)isolatedWithAnySpotBorrow++;
              if(borrows.some(s=>Number(s.marketIndex)===0))isolatedWithQuoteSpotBorrow++;
            }
            const spot0=spots.find(x=>Number(x.account.marketIndex)===0);
            let quoteInsuranceVaultAmount=null,quoteSpotMarket=null;
            if(spot0){const ai=await connection.getAccountInfo(spot0.account.insuranceFund.vault,'finalized');quoteInsuranceVaultAmount=ai?tokenAmount(Buffer.from(ai.data)):null;quoteSpotMarket={marketIndex:0,insuranceVault:spot0.account.insuranceFund.vault.toBase58(),insuranceVaultAmount:quoteInsuranceVaultAmount,totalFactor:Number(spot0.account.insuranceFund.totalFactor),userFactor:Number(spot0.account.insuranceFund.userFactor),totalShares:spot0.account.insuranceFund.totalShares.toString(10),userShares:spot0.account.insuranceFund.userShares.toString(10)};}
            const markets=perps.map(({account:p})=>({marketIndex:Number(p.marketIndex),status:Object.keys(p.status||{})[0]||'unknown',quoteMaxInsurance:p.insuranceClaim.quoteMaxInsurance.toString(10),quoteSettledInsurance:p.insuranceClaim.quoteSettledInsurance.toString(10),unrealizedPnlMaxImbalance:p.unrealizedPnlMaxImbalance.toString(10),pendingRevenueShare:p.pendingRevenueShare.toString(10)})).sort((a,b)=>a.marketIndex-b.marketIndex);
            const aggregate={totalUsers:users.length,isolatedUsers,isolatedPositions,activeIsolatedPositions,isolatedWithAnySpotBorrow,isolatedWithQuoteSpotBorrow,isolatedWithNegativePerpQuote,isolatedWithNonzeroStatus,isolatedPositionsByMarket:byMarket};
            const out={capturedAt:new Date().toISOString(),deployment,aggregate,quoteSpotMarket,perpMarkets:markets,privacy:'aggregate counts only; no user keys, authorities, balances, or account rows retained',publicChainTransactions:0,transactionsConstructed:0,transactionsSigned:0,transactionsSent:0};
            fs.writeFileSync('../evidence/ISOLATED_REACHABILITY_AGGREGATE.json',JSON.stringify(out,null,2)+'\n');
            fs.writeFileSync('../evidence/SUMMARY.json',JSON.stringify({capturedAt:out.capturedAt,deployment,aggregate,quoteSpotMarket,publicChainTransactions:0},null,2)+'\n');
            console.log(JSON.stringify({capturedAt:out.capturedAt,deployment,aggregate,quoteSpotMarket,publicChainTransactions:0},null,2));
          })().catch(e=>{const out={status:'FAIL',error:String(e?.stack||e),publicChainTransactions:0};fs.writeFileSync('../evidence/SUMMARY.json',JSON.stringify(out,null,2)+'\n');console.error(out.error);process.exit(1);});
          NODE
          node census.cjs

      - name: Manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('evidence');rows=[]
          for p in sorted(r.glob('*')):
              if p.is_file():
                  b=p.read_bytes();rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (r/'MANIFEST.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-isolated-reachability-${{ github.run_id }}
          path: evidence
          retention-days: 1
          if-no-files-found: error
