name: Temporary Velocity Jupiter-v6 mock SBF build 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp_velocity_jupiter_mock_build_20260807.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install pinned Agave SBF toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config zlib1g-dev llvm clang cmake make libudev-dev >/dev/null
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.11/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          cargo build-sbf --version

      - name: Generate minimal Jupiter-v6-compatible swap mock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mock/src artifact
          cat > mock/Cargo.toml <<'TOML'
          [package]
          name = "velocity-jupiter-mock"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [lib]
          crate-type = ["cdylib", "lib"]

          [dependencies]
          solana-program = "=2.2.1"

          [profile.release]
          overflow-checks = true
          lto = "fat"
          codegen-units = 1
          TOML

          cat > mock/src/lib.rs <<'RUST'
          use solana_program::{
              account_info::{next_account_info, AccountInfo},
              declare_id,
              entrypoint,
              entrypoint::ProgramResult,
              instruction::{AccountMeta, Instruction},
              program::{invoke, invoke_signed},
              program_error::ProgramError,
              pubkey::Pubkey,
          };

          declare_id!("JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4");
          entrypoint!(process_instruction);

          fn token_transfer_ix(
              token_program: &Pubkey,
              source: &Pubkey,
              destination: &Pubkey,
              authority: &Pubkey,
              amount: u64,
          ) -> Instruction {
              let mut data = Vec::with_capacity(9);
              data.push(3); // classic SPL Token Transfer
              data.extend_from_slice(&amount.to_le_bytes());
              Instruction {
                  program_id: *token_program,
                  accounts: vec![
                      AccountMeta::new(*source, false),
                      AccountMeta::new(*destination, false),
                      AccountMeta::new_readonly(*authority, true),
                  ],
                  data,
              }
          }

          pub fn process_instruction(
              program_id: &Pubkey,
              accounts: &[AccountInfo],
              data: &[u8],
          ) -> ProgramResult {
              if data.len() != 16 {
                  return Err(ProgramError::InvalidInstructionData);
              }
              let amount_in = u64::from_le_bytes(
                  data[0..8]
                      .try_into()
                      .map_err(|_| ProgramError::InvalidInstructionData)?,
              );
              let amount_out = u64::from_le_bytes(
                  data[8..16]
                      .try_into()
                      .map_err(|_| ProgramError::InvalidInstructionData)?,
              );

              let mut iter = accounts.iter();
              let authority = next_account_info(&mut iter)?;
              let asset_source = next_account_info(&mut iter)?;
              let asset_pool = next_account_info(&mut iter)?;
              let liability_pool = next_account_info(&mut iter)?;
              let liability_destination = next_account_info(&mut iter)?;
              let pool_authority = next_account_info(&mut iter)?;
              let token_program = next_account_info(&mut iter)?;
              if iter.next().is_some() {
                  return Err(ProgramError::InvalidArgument);
              }

              if !authority.is_signer {
                  return Err(ProgramError::MissingRequiredSignature);
              }
              let (expected_pool_authority, bump) =
                  Pubkey::find_program_address(&[b"pool"], program_id);
              if expected_pool_authority != *pool_authority.key {
                  return Err(ProgramError::InvalidSeeds);
              }

              if amount_in > 0 {
                  let ix = token_transfer_ix(
                      token_program.key,
                      asset_source.key,
                      asset_pool.key,
                      authority.key,
                      amount_in,
                  );
                  invoke(
                      &ix,
                      &[
                          asset_source.clone(),
                          asset_pool.clone(),
                          authority.clone(),
                          token_program.clone(),
                      ],
                  )?;
              }

              if amount_out > 0 {
                  let ix = token_transfer_ix(
                      token_program.key,
                      liability_pool.key,
                      liability_destination.key,
                      pool_authority.key,
                      amount_out,
                  );
                  let signer_seeds: &[&[u8]] = &[b"pool", &[bump]];
                  invoke_signed(
                      &ix,
                      &[
                          liability_pool.clone(),
                          liability_destination.clone(),
                          pool_authority.clone(),
                          token_program.clone(),
                      ],
                      &[signer_seeds],
                  )?;
              }

              Ok(())
          }
          RUST

          # Reuse the exact active Velocity dependency lock to avoid post-deployment
          # transitive releases that require a newer Cargo edition than Agave 2.3.11.
          curl -fsSL \
            https://raw.githubusercontent.com/velocity-exchange/protocol-v2/13e8e9b8d614f3b62e3a65a8c372c819e6529aeb/Cargo.lock \
            -o mock/Cargo.lock

          sha256sum mock/Cargo.toml mock/Cargo.lock mock/src/lib.rs | tee artifact/SOURCE_SHA256SUMS.txt

      - name: Build SBF shared object
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo build-sbf --manifest-path mock/Cargo.toml --sbf-out-dir artifact 2>&1 | tee artifact/BUILD.log
          test -s artifact/velocity_jupiter_mock.so
          sha256sum artifact/velocity_jupiter_mock.so | tee artifact/BINARY_SHA256.txt
          file artifact/velocity_jupiter_mock.so | tee artifact/FILE_TYPE.txt
          readelf -h artifact/velocity_jupiter_mock.so > artifact/ELF_HEADER.txt
          stat -c '%n %s bytes' artifact/velocity_jupiter_mock.so | tee artifact/BINARY_SIZE.txt

      - name: Build manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifact')
          rows = []
          for path in sorted(root.glob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  rows.append({'name': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          (root / 'MANIFEST.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY

      - name: Upload temporary mock artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-jupiter-mock-${{ github.run_id }}
          path: artifact/
          retention-days: 1
          if-no-files-found: error
