name: Trigger Monad high-S consensus v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-monad-v0160-highs-consensus-v3.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch registered v3 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run monad-v0160-highs-consensus-v3-20260818.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
