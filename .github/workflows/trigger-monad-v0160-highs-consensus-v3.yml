name: Trigger Monad high-S consensus v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-monad-v0160-highs-consensus-v3.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Dispatch registered v3 workflow and record result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +e
          output=$(gh workflow run monad-v0160-highs-consensus-v3-20260818.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main 2>&1)
          status=$?
          set -e

          mkdir -p results/monad-v0160-highs-consensus-v3-dispatch
          printf '%s\n' "$output" > results/monad-v0160-highs-consensus-v3-dispatch/output.txt
          printf '{"dispatch_exit":%s,"workflow":"monad-v0160-highs-consensus-v3-20260818.yml","sha":"%s"}\n' \
            "$status" "$GITHUB_SHA" > results/monad-v0160-highs-consensus-v3-dispatch/RESULT.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/monad-v0160-highs-consensus-v3-dispatch
          git commit -m 'Record Monad consensus-v3 dispatch result'
          git push origin HEAD:main
          exit "$status"
