name: uidmap Linux AMD64 helper bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uidmap-linux-amd64-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package newuidmap and newgidmap
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v newuidmap >/dev/null || ! command -v newgidmap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends uidmap
          fi
          mkdir -p out/bin
          cp -a "$(command -v newuidmap)" out/bin/
          cp -a "$(command -v newgidmap)" out/bin/
          file out/bin/* | tee out/FILE.txt
          ldd out/bin/newuidmap | tee out/NEWUIDMAP_LDD.txt
          ldd out/bin/newgidmap | tee out/NEWGIDMAP_LDD.txt
          stat -c '%A %a %U:%G %n' "$(command -v newuidmap)" "$(command -v newgidmap)" | tee out/ORIGINAL_MODES.txt
          sha256sum out/bin/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: uidmap-linux-amd64
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: out/
