name: veda-active-request-fast

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Query active IDs and fetch only their exact creation logs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request, urllib.parse, traceback

          ATTACKER="0x1111111111111111111111111111111111111111"
          CONFIG={
            "ethereum":{"id":1,"rpcs":["https://ethereum-rpc.publicnode.com","https://eth.drpc.org"],"explorer":"https://eth.blockscout.com","products":{
              "liquidBTC":["0x77A2fd42F8769d8063F2E75061FC200014E41Edf","0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929"],
              "liquidETH":["0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","0x23aff90ed3b3effcf78fb41ab001c525a6c32a01"],
              "liquidUSD":["0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","0x92b10e02825986bac2375bdacafa3e89e3f612aa"]}},
            "optimism":{"id":10,"rpcs":["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io"],"explorer":"https://optimism.blockscout.com","products":{
              "liquidBTC":["0x77A2fd42F8769d8063F2E75061FC200014E41Edf","0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929"],
              "liquidETH":["0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","0x23aff90ed3b3effcf78fb41ab001c525a6c32a01"],
              "liquidUSD":["0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","0x92b10e02825986bac2375bdacafa3e89e3f612aa"]}},
            "scroll":{"id":534352,"rpcs":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io"],"explorer":"https://scroll.blockscout.com","products":{
              "liquidBTC":["0x77A2fd42F8769d8063F2E75061FC200014E41Edf","0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29"],
              "liquidETH":["0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","0xe3F8Fa039fF7A8FE42fA2c6E9DC8565ecE6F7042"],
              "liquidUSD":["0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","0x6632d22a2062415BB37c8d7B6A5EC86c35Bb2610"]}},
            "ink":{"id":57073,"rpcs":["https://rpc-gel.inkonchain.com"],"explorer":"https://explorer.inkonchain.com","products":{
              "balanced":["0x4c433Ed6d57316170565D7Fedc11a841832cDc3d","0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67","0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6"],
              "boosted":["0x406E63323EF5d39D41C6fD895Ef9665AF926184c","0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9","0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF"]}},
          }
          def sh(*a):
            p=subprocess.run([str(x) for x in a],text=True,capture_output=True)
            if p.returncode:raise RuntimeError(p.stderr)
            return p.stdout.strip()
          def sig(x):return sh("cast","sig",x)
          def topic(x):return sh("cast","keccak",x).lower()
          S={"ids":sig("getRequestIds()"),"one":sig("ONE_SHARE()"),"quote":sig("getRateInQuoteSafe(address)"),"authority":sig("authority()"),"can":sig("canCall(address,address,bytes4)"),"pub":sig("isCapabilityPublic(address,bytes4)"),"solve":sig("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),"self":sig("boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),"symbol":sig("symbol()"),"decimals":sig("decimals()")}
          RT=topic("OnChainWithdrawRequested(bytes32,address,address,uint96,uint128,uint128,uint40,uint24,uint24)")
          def rpc(ep,m,p,t=40):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();req=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-active-fast/1"})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          def choose(c):
            bad={}
            for e in c["rpcs"]:
              try:
                if int(rpc(e,"eth_chainId",[]),16)==c["id"]:return e,bad
              except Exception as x:bad[e]=repr(x)
            raise RuntimeError(bad)
          def h(x):
            x=str(x or "");return x[2:] if x.startswith("0x") else x
          def aw(a):return h(a).lower().rjust(64,"0")
          def bw(s):return h(s).lower().ljust(64,"0")
          def addr(x):return "0x"+h(x)[-40:].lower()
          def words(x):
            x=h(x);return [int(x[i:i+64],16) for i in range(0,len(x),64)] if x and len(x)%64==0 else []
          def arr(x):
            x=h(x)
            if not x:return []
            off=int(x[:64],16)*2;n=int(x[off:off+64],16);cur=off+64
            return ["0x"+x[cur+i*64:cur+(i+1)*64].lower() for i in range(n)]
          def call(ep,to,data):return rpc(ep,"eth_call",[{"to":to,"data":data},"latest"])
          def safe(ep,to,data):
            try:return {"ok":1,"raw":call(ep,to,data)}
            except Exception as e:return {"ok":0,"error":repr(e)}
          def decstr(raw):
            x=h(raw)
            try:
              if len(x)==64:return bytes.fromhex(x).rstrip(b"\0").decode(errors="replace")
              off=int(x[:64],16)*2;n=int(x[off:off+64],16);return bytes.fromhex(x[off+64:off+64+2*n]).decode(errors="replace")
            except:return None
          def http(url,t=45):
            req=urllib.request.Request(url,headers={"accept":"application/json","user-agent":"veda-active-fast/1"})
            with urllib.request.urlopen(req,timeout=t) as r:return json.loads(r.read().decode())
          def exact_log(c,ep,queue,rid,latest):
            # First try one highly-filtered RPC query over all history.
            try:
              logs=rpc(ep,"eth_getLogs",[{"fromBlock":"0x0","toBlock":hex(latest),"address":queue,"topics":[RT,rid]}],60)
              if logs:return logs[-1],"rpc"
            except Exception:pass
            # Then Blockscout classic logs API with topic filter.
            params={"module":"logs","action":"getLogs","fromBlock":"0","toBlock":"latest","address":queue,"topic0":RT,"topic1":rid,"page":"1","offset":"10"}
            try:
              o=http(c["explorer"]+"/api?"+urllib.parse.urlencode(params),60);logs=o.get("result") if isinstance(o,dict) else None
              if isinstance(logs,list) and logs:return logs[-1],"classic"
            except Exception:pass
            return None,None
          out={"generated_at_unix":int(time.time()),"topic":RT,"chains":{},"definite_overvalued":[],"errors":[]}
          for cn,c in CONFIG.items():
            cr={"products":{}};out["chains"][cn]=cr
            try:
              ep,bad=choose(c);latest=int(rpc(ep,"eth_blockNumber",[]),16);blk=rpc(ep,"eth_getBlockByNumber",[hex(latest),False]);now=int(blk["timestamp"],16);cr.update({"endpoint":ep,"block":latest,"timestamp":now,"rpc_failures":bad})
              for pn,(q,acct,solver) in c["products"].items():
                r={"queue":q.lower(),"accountant":acct.lower(),"solver":solver.lower(),"requests":[]};cr["products"][pn]=r
                try:
                  if rpc(ep,"eth_getCode",[q,"latest"])=="0x":r["not_deployed"]=1;continue
                  ids=arr(call(ep,q,S["ids"]));one=int(call(ep,q,S["one"]),16);auth=addr(call(ep,q,S["authority"]));r.update({"active_count":len(ids),"active_ids":ids,"one":one,"authority":auth,"attacker_solve":bool(int(call(ep,auth,S["can"]+aw(ATTACKER)+aw(q)+bw(S["solve"])),16)),"solver_solve":bool(int(call(ep,auth,S["can"]+aw(solver)+aw(q)+bw(S["solve"])),16)),"attacker_self":bool(int(call(ep,auth,S["can"]+aw(ATTACKER)+aw(solver)+bw(S["self"])),16))})
                  for rid in ids:
                    log,source=exact_log(c,ep,q,rid,latest)
                    if not log:r["requests"].append({"id":rid,"error":"exact creation log unavailable"});continue
                    topics=[str(x).lower() for x in log.get("topics",[])];w=words(log.get("data"))
                    if len(topics)<4 or len(w)<6:r["requests"].append({"id":rid,"error":"bad log","source":source});continue
                    asset=addr(topics[3]);quote=int(call(ep,acct,S["quote"]+aw(asset)),16);current=w[1]*quote//one;over=w[2]-current;maturity=w[3]+w[4];deadline=maturity+w[5]
                    sy=safe(ep,asset,S["symbol"]);de=safe(ep,asset,S["decimals"])
                    item={"id":rid,"source":source,"user":addr(topics[2]),"asset":asset,"symbol":decstr(sy.get("raw")) if sy["ok"] else None,"decimals":int(de["raw"],16) if de["ok"] else None,"nonce":w[0],"shares":w[1],"fixed_assets":w[2],"creation":w[3],"maturity":maturity,"deadline":deadline,"current_quote":quote,"current_zero_discount":current,"definite_overvaluation":over,"is_mature":now>=maturity,"is_expired":now>deadline,"tx":log.get("transactionHash") or log.get("transaction_hash")}
                    r["requests"].append(item)
                    if over>0 and item["is_mature"] and not item["is_expired"]:out["definite_overvalued"].append({"chain":cn,"product":pn,**item})
                except Exception as e:r["error"]=repr(e);r["traceback"]=traceback.format_exc();out["errors"].append({"chain":cn,"product":pn,"error":repr(e)})
            except Exception as e:cr["error"]=repr(e);out["errors"].append({"chain":cn,"error":repr(e)})
          out["summary"]={"active":sum(p.get("active_count",0) for c in out["chains"].values() for p in c.get("products",{}).values()),"overvalued":len(out["definite_overvalued"]),"errors":len(out["errors"])}
          open("veda-active-request-fast.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload targeted request proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-active-request-fast
          path: veda-active-request-fast.json
          if-no-files-found: error
          retention-days: 1
