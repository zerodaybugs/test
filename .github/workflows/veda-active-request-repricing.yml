name: veda-active-request-repricing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reprice every active queue request against current live rates
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request, urllib.parse, traceback

          ATTACKER="0x1111111111111111111111111111111111111111"
          CHAINS={
            "ethereum":{
              "chain_id":1,"rpcs":["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"],"explorer":"https://eth.blockscout.com",
              "products":{
                "liquidBTC":{"queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929"},
                "liquidETH":{"queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01"},
                "liquidUSD":{"queue":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa"},
              }},
            "optimism":{
              "chain_id":10,"rpcs":["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"],"explorer":"https://optimism.blockscout.com",
              "products":{
                "liquidBTC":{"queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929"},
                "liquidETH":{"queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01"},
                "liquidUSD":{"queue":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa"},
              }},
            "scroll":{
              "chain_id":534352,"rpcs":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"],"explorer":"https://scroll.blockscout.com",
              "products":{
                "liquidBTC":{"queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929"},
                "liquidETH":{"queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01"},
                "liquidUSD":{"queue":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa"},
              }},
            "ink":{
              "chain_id":57073,"rpcs":["https://rpc-gel.inkonchain.com"],"explorer":"https://explorer.inkonchain.com",
              "products":{
                "balanced":{"queue":"0x4c433Ed6d57316170565D7Fedc11a841832cDc3d","accountant":"0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67","solver":"0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6"},
                "boosted":{"queue":"0x406E63323EF5d39D41C6fD895Ef9665AF926184c","accountant":"0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9","solver":"0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF"},
              }},
          }

          def sh(*a):
            p=subprocess.run([str(x) for x in a],text=True,capture_output=True)
            if p.returncode:raise RuntimeError({"args":a,"stdout":p.stdout,"stderr":p.stderr})
            return p.stdout.strip()
          def sig(x):return sh("cast","sig",x)
          def topic(x):return sh("cast","keccak",x).lower()
          S={
            "ids":sig("getRequestIds()"),"one":sig("ONE_SHARE()"),"authority":sig("authority()"),"paused":sig("isPaused()"),
            "quote":sig("getRateInQuoteSafe(address)"),"balance":sig("balanceOf(address)"),"decimals":sig("decimals()"),"symbol":sig("symbol()"),
            "can":sig("canCall(address,address,bytes4)"),"pub":sig("isCapabilityPublic(address,bytes4)"),
            "solve":sig("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),
            "self":sig("boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
            "selfmint":sig("boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
            "withdrawAssets":sig("withdrawAssets(address)"),
          }
          REQUEST_TOPIC=topic("OnChainWithdrawRequested(bytes32,address,address,uint96,uint128,uint128,uint40,uint24,uint24)")

          def rpc(ep,m,p,timeout=45):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();req=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-request-reprice/1"})
            with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          def choose(cfg):
            bad={}
            for ep in cfg["rpcs"]:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==cfg["chain_id"]:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def strip0(x):
            x=str(x or "");return x[2:] if x.startswith("0x") else x
          def aw(a):return strip0(a).lower().rjust(64,"0")
          def bw(s):return strip0(s).lower().ljust(64,"0")
          def addr(raw):return "0x"+strip0(raw)[-40:].lower()
          def words(raw):
            h=strip0(raw);return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h and len(h)%64==0 else []
          def decode_bytes32_array(raw):
            h=strip0(raw)
            if not h:return []
            off=int(h[:64],16)*2;n=int(h[off:off+64],16);cur=off+64
            return ["0x"+h[cur+i*64:cur+(i+1)*64].lower() for i in range(n)]
          def decode_string(raw):
            h=strip0(raw)
            if not h:return None
            try:
              if len(h)==64:return bytes.fromhex(h).rstrip(b"\x00").decode(errors="replace")
              off=int(h[:64],16)*2;n=int(h[off:off+64],16);return bytes.fromhex(h[off+64:off+64+n*2]).decode(errors="replace")
            except:return None
          def call(ep,to,data,block="latest"):
            return rpc(ep,"eth_call",[{"to":to,"data":data},block])
          def safe_call(ep,to,data,block="latest"):
            try:return {"ok":True,"raw":call(ep,to,data,block)}
            except Exception as e:return {"ok":False,"error":repr(e)}
          def can(ep,auth,caller,target,selector):
            r=safe_call(ep,auth,S["can"]+aw(caller)+aw(target)+bw(selector));return bool(int(r["raw"],16)) if r["ok"] else None
          def public(ep,auth,target,selector):
            r=safe_call(ep,auth,S["pub"]+aw(target)+bw(selector));return bool(int(r["raw"],16)) if r["ok"] else None
          def http_json(url,timeout=45,retries=4):
            last=None
            for i in range(retries):
              try:
                req=urllib.request.Request(url,headers={"accept":"application/json","user-agent":"veda-request-reprice/1"})
                with urllib.request.urlopen(req,timeout=timeout) as r:return json.loads(r.read().decode())
              except Exception as e:last=repr(e);time.sleep(.4*(i+1))
            raise RuntimeError({"url":url,"error":last})
          def address_logs(explorer,address,max_pages=200):
            url=f"{explorer}/api/v2/addresses/{address}/logs";out=[];errs=[]
            for _ in range(max_pages):
              try:p=http_json(url)
              except Exception as e:errs.append(repr(e));break
              batch=p.get("items") or [];out.extend(batch)
              nxt=p.get("next_page_params")
              if not nxt:break
              url=f"{explorer}/api/v2/addresses/{address}/logs?"+urllib.parse.urlencode(nxt)
              time.sleep(.05)
            return out,errs
          def parse_request_log(log):
            topics=[str(x).lower() for x in (log.get("topics") or [])]
            if len(topics)<4 or topics[0]!=REQUEST_TOPIC:return None
            w=words(log.get("data") or "0x")
            if len(w)<6:return None
            return {
              "request_id":topics[1],"user":"0x"+strip0(topics[2])[-40:],"asset":"0x"+strip0(topics[3])[-40:],
              "nonce":w[0],"shares":w[1],"assets":w[2],"creation":w[3],"maturity_seconds":w[4],"deadline_seconds":w[5],
              "block_number":int(log.get("block_number") or 0),"tx_hash":log.get("transaction_hash"),
            }

          result={"generated_at_unix":int(time.time()),"request_topic":REQUEST_TOPIC,"chains":{},"definite_overvalued":[],"errors":[]}
          for cname,cfg in CHAINS.items():
            crow={"products":{}};result["chains"][cname]=crow
            try:
              ep,rpc_failures=choose(cfg);block_hex=rpc(ep,"eth_blockNumber",[]);block=int(block_hex,16);latest=rpc(ep,"eth_getBlockByNumber",[block_hex,False]);now=int(latest["timestamp"],16)
              crow.update({"endpoint":ep,"rpc_failures":rpc_failures,"block":block,"timestamp":now})
              for pname,p in cfg["products"].items():
                row={"queue":p["queue"].lower(),"accountant":p["accountant"].lower(),"solver":p["solver"].lower(),"requests":[],"errors":[]};crow["products"][pname]=row
                try:
                  code=rpc(ep,"eth_getCode",[p["queue"],"latest"])
                  if code=="0x":row["not_deployed"]=True;continue
                  ids=decode_bytes32_array(call(ep,p["queue"],S["ids"]));one=int(call(ep,p["queue"],S["one"]),16);auth=addr(call(ep,p["queue"],S["authority"]));paused=bool(int(call(ep,p["queue"],S["paused"]),16))
                  row.update({"active_ids":ids,"active_count":len(ids),"one_share":one,"authority":auth,"paused":paused,"capabilities":{
                    "solve_public":public(ep,auth,p["queue"],S["solve"]),"attacker_solve":can(ep,auth,ATTACKER,p["queue"],S["solve"]),"configured_solver_solve":can(ep,auth,p["solver"],p["queue"],S["solve"]),
                    "self_public":public(ep,auth,p["solver"],S["self"]),"attacker_self":can(ep,auth,ATTACKER,p["solver"],S["self"]),"selfmint_public":public(ep,auth,p["solver"],S["selfmint"]),"attacker_selfmint":can(ep,auth,ATTACKER,p["solver"],S["selfmint"]),
                  }})
                  if not ids:continue
                  logs,log_errors=address_logs(cfg["explorer"],p["queue"]);row["log_errors"]=log_errors
                  parsed={x["request_id"]:x for x in (parse_request_log(log) for log in logs) if x}
                  row["parsed_requested_event_count"]=len(parsed)
                  for rid in ids:
                    req=parsed.get(rid)
                    if not req:
                      row["requests"].append({"request_id":rid,"error":"active request event not found"});continue
                    asset=req["asset"]
                    q=safe_call(ep,p["accountant"],S["quote"]+aw(asset));bal=safe_call(ep,asset,S["balance"]+aw(p["queue"]));dec=safe_call(ep,asset,S["decimals"]);sym=safe_call(ep,asset,S["symbol"]);wa=safe_call(ep,p["queue"],S["withdrawAssets"]+aw(asset))
                    current_quote=int(q["raw"],16) if q["ok"] else None;current_zero=req["shares"]*current_quote//one if current_quote is not None else None
                    definite=req["assets"]-current_zero if current_zero is not None else None
                    maturity=req["creation"]+req["maturity_seconds"];deadline=maturity+req["deadline_seconds"]
                    req.update({"asset_symbol":decode_string(sym.get("raw")) if sym["ok"] else None,"asset_decimals":int(dec["raw"],16) if dec["ok"] else None,"current_quote":current_quote,"current_zero_discount_assets":current_zero,"definite_overvaluation":definite,"maturity":maturity,"deadline":deadline,"is_mature":now>=maturity,"is_expired":now>deadline,"queue_asset_balance":int(bal["raw"],16) if bal["ok"] else None,"withdraw_asset_state":words(wa.get("raw")) if wa["ok"] else None,"quote_error":q.get("error")})
                    row["requests"].append(req)
                    if definite is not None and definite>0 and now>=maturity and now<=deadline:
                      result["definite_overvalued"].append({"chain":cname,"product":pname,**req})
                except Exception as e:
                  row["error"]=repr(e);row["traceback"]=traceback.format_exc();result["errors"].append({"chain":cname,"product":pname,"error":repr(e)})
            except Exception as e:
              crow["error"]=repr(e);crow["traceback"]=traceback.format_exc();result["errors"].append({"chain":cname,"error":repr(e)})
          result["summary"]={"definite_overvalued_count":len(result["definite_overvalued"]),"error_count":len(result["errors"]),"active_request_count":sum(p.get("active_count",0) for c in result["chains"].values() for p in c.get("products",{}).values())}
          with open("veda-active-request-repricing.json","w",encoding="utf-8") as f:json.dump(result,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"summary":result["summary"],"definite_overvalued":result["definite_overvalued"],"chains":{c:{"block":x.get("block"),"timestamp":x.get("timestamp"),"error":x.get("error"),"products":{p:{"active_count":r.get("active_count"),"capabilities":r.get("capabilities"),"requests":r.get("requests"),"error":r.get("error"),"log_errors":r.get("log_errors")} for p,r in x.get("products",{}).items()}} for c,x in result["chains"].items()},"errors":result["errors"]},indent=2,sort_keys=True))
          PY
      - name: Upload active request proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-active-request-repricing
          path: veda-active-request-repricing.json
          if-no-files-found: error
          retention-days: 1
