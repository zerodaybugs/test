name: veda-audit-gap-diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Veda source with history
        uses: actions/checkout@v4
        with:
          repository: Veda-Labs/boring-vault
          fetch-depth: 0
          path: veda
      - name: Produce exact audit-to-deployment diffs
        shell: bash
        run: |
          set -euo pipefail
          cd veda
          mkdir -p ../audit-gap-diff
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          PAIRS = [
              {
                  "name":"mainnet-liquidbtc-boring-vault",
                  "audit":"9c6e1e4458fba53f2ff09efe21195dcf570ffc3e",
                  "deploy":"847d0cba0b778bd54f94754e93fa3224fac989ee",
                  "paths":["src/base/BoringVault.sol"],
              },
              {
                  "name":"mainnet-liquidbtc-queue",
                  "audit":"ec74b24330a1d7b144dc397c1c20c76e3d6fc460",
                  "deploy":"847d0cba0b778bd54f94754e93fa3224fac989ee",
                  "paths":["src/base/Roles/BoringQueue/BoringOnChainQueue.sol","src/base/Roles/BoringQueue/BoringOnChainQueueWithTracking.sol"],
              },
              {
                  "name":"mainnet-liquidbtc-solver",
                  "audit":"ec74b24330a1d7b144dc397c1c20c76e3d6fc460",
                  "deploy":"847d0cba0b778bd54f94754e93fa3224fac989ee",
                  "paths":["src/base/Roles/BoringQueue/BoringSolver.sol","src/base/Roles/BoringQueue/IBoringSolver.sol"],
              },
              {
                  "name":"ink-liquideth-queue",
                  "audit":"edfcba3f29f691c638b06d04f60af79503632b58",
                  "deploy":"568d9467202a7f6e478cb8967fcee3c2afb38730",
                  "paths":["src/base/Roles/BoringQueue/BoringOnChainQueue.sol","src/base/Roles/BoringQueue/BoringOnChainQueueWithTracking.sol"],
              },
              {
                  "name":"ink-liquideth-solver",
                  "audit":"b9eafd46e656c532ea2c28a1bd66ce271ebedbc7",
                  "deploy":"568d9467202a7f6e478cb8967fcee3c2afb38730",
                  "paths":["src/base/Roles/BoringQueue/BoringSolver.sol","src/base/Roles/BoringQueue/IBoringSolver.sol"],
              },
              {
                  "name":"active-layerzero-rate-limiting-teller",
                  "audit":"3c768bd068af856b5de3def86b1940676847eb9d",
                  "deploy":"bf902717",
                  "paths":[
                      "src/base/Roles/CrossChain/Bridges/LayerZero/LayerZeroTellerWithRateLimiting.sol",
                      "src/base/Roles/CrossChain/CrossChainTellerWithGenericBridge.sol",
                      "src/base/Roles/CrossChain/PairwiseRateLimiter.sol",
                      "src/base/Roles/CrossChain/MessageLib.sol",
                      "src/base/Roles/TellerWithMultiAssetSupport.sol",
                      "src/base/BoringVault.sol"
                  ],
              },
          ]

          def run(args, check=True):
              p=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              if check and p.returncode != 0:
                  raise RuntimeError({"args":args,"output":p.stdout,"returncode":p.returncode})
              return p.stdout

          outdir=pathlib.Path("../audit-gap-diff")
          index=[]
          for pair in PAIRS:
              name=pair["name"]
              audit=pair["audit"]
              deploy=pair["deploy"]
              paths=pair["paths"]
              record={"name":name,"audit":audit,"deploy":deploy,"paths":paths}
              record["audit_resolved"]=run(["git","rev-parse",audit]).strip()
              record["deploy_resolved"]=run(["git","rev-parse",deploy]).strip()
              record["commits"]=run(["git","log","--oneline","--no-decorate",f"{audit}..{deploy}","--",*paths]).splitlines()
              record["name_status"]=run(["git","diff","--name-status",audit,deploy,"--",*paths]).splitlines()
              record["numstat"]=run(["git","diff","--numstat",audit,deploy,"--",*paths]).splitlines()
              patch=run(["git","diff","--find-renames","--find-copies","--histogram",audit,deploy,"--",*paths])
              (outdir/f"{name}.patch").write_text(patch,encoding="utf-8")
              for ref,label in ((audit,"audit"),(deploy,"deploy")):
                  for path in paths:
                      safe=path.replace("/","__")
                      content=run(["git","show",f"{ref}:{path}"],check=False)
                      if not content.startswith("fatal:"):
                          (outdir/f"{name}__{label}__{safe}").write_text(content,encoding="utf-8")
              index.append(record)
          (outdir/"index.json").write_text(json.dumps(index,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(index,indent=2,sort_keys=True))
          PY
          sha256sum ../audit-gap-diff/* > ../audit-gap-diff/SHA256SUMS
      - name: Upload exact diffs
        uses: actions/upload-artifact@v4
        with:
          name: veda-audit-gap-diff
          path: audit-gap-diff
          if-no-files-found: error
          retention-days: 1
