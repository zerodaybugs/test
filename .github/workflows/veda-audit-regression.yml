name: veda-audit-regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Probe known fixed audit regressions on live scope
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request

          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com']},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']},
            'ink':{'id':57073,'rpcs':['https://rpc-gel.inkonchain.com','https://rpc-qnd.inkonchain.com','https://ink.drpc.org']},
          }
          TARGETS={
            'ethereum':{
              'liquidETH':{'solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C'},
              'liquidBTC':{'solver':'0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726'},
              'liquidUSD':{'solver':'0x92b10e02825986bAc2375BdACaFA3e89E3f612aA','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C'},
            },
            'scroll':{
              'liquidETH':{'solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C'},
              'liquidBTC':{'solver':'0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726'},
              'liquidUSD':{'solver':'0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C'},
            },
            'ink':{
              'balanced':{'solver':'0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6','queue':'0x4c433Ed6d57316170565D7Fedc11a841832cDc3d','teller':'0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC','vault':'0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f'},
              'boosted':{'solver':'0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF','queue':'0x406E63323EF5d39D41C6fD895Ef9665AF926184c','teller':'0xc46f2443b3521632E2E2a903D6da8f965B46f6a0','vault':'0xDbD87325D7b1189Dcc9255c4926076fF4a96A271'},
            },
          }
          ATTACKER='0x1111111111111111111111111111111111111111'

          def sig(text):return subprocess.check_output(['cast','sig',text],text=True).strip()[2:]
          S={
            'authority':sig('authority()'),'owner':sig('owner()'),
            'canCall':sig('canCall(address,address,bytes4)'),
            'public':sig('isCapabilityPublic(address,bytes4)'),
            'roles':sig('getUserRoles(address)'),
            'caproles':sig('getRolesWithCapability(address,bytes4)'),
            'boringSolve':sig('boringSolve(address,address,address,uint256,uint256,bytes)'),
            'bulkWithdraw':sig('bulkWithdraw(address,uint256,uint256,address)'),
            'bulkDeposit':sig('bulkDeposit(address,uint256,uint256,address)'),
            'enter':sig('enter(address,address,uint256,address,uint256)'),
            'exit':sig('exit(address,address,uint256,address,uint256)'),
            'flashLoan':sig('flashLoan(address[],uint256[],bytes)'),
            'receiveFlashLoan':sig('receiveFlashLoan(address[],uint256[],uint256[],bytes)'),
          }
          def request(ep,m,p,attempts=4):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode()
            req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-audit-regression/1.0'})
            last=None
            for i in range(attempts):
              try:
                with urllib.request.urlopen(req,timeout=30) as f:o=json.loads(f.read().decode())
                if 'error' in o:raise RuntimeError(o['error'])
                return o['result']
              except Exception as e:last=e;time.sleep(min(3,i+1))
            raise RuntimeError(repr(last))
          def select(c):
            bad={}
            for ep in c['rpcs']:
              try:
                if int(request(ep,'eth_chainId',[]),16)==c['id']:return ep
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def strip0(x):return x[2:] if x.startswith('0x') else x
          def aw(a):return strip0(a).lower().rjust(64,'0')
          def b4w(x):return strip0(x).lower().ljust(64,'0')
          def addr(x):return '0x'+strip0(x)[-40:]
          def safe(f):
            try:return f()
            except Exception as e:return {'error':repr(e)}
          def call(ep,block,to,data,from_=None):
            tx={'to':to,'data':data}
            if from_:tx['from']=from_
            return request(ep,'eth_call',[tx,block])
          def can(ep,block,auth,user,target,selector):
            return bool(int(call(ep,block,auth,'0x'+S['canCall']+aw(user)+aw(target)+b4w(selector)),16))
          def pub(ep,block,auth,target,selector):
            return bool(int(call(ep,block,auth,'0x'+S['public']+aw(target)+b4w(selector)),16))
          def mask(ep,block,auth,user):return int(call(ep,block,auth,'0x'+S['roles']+aw(user)),16)
          def capmask(ep,block,auth,target,selector):return int(call(ep,block,auth,'0x'+S['caproles']+aw(target)+b4w(selector)),16)

          out={'queried_at_unix':int(time.time()),'selectors':S,'chains':{}}
          for chain,cfg in CHAINS.items():
            ep=select(cfg); block=request(ep,'eth_blockNumber',[])
            co={'endpoint':ep,'block':int(block,16),'products':{}}
            for name,t in TARGETS[chain].items():
              solver=t['solver'];queue=t['queue'];teller=t['teller'];vault=t['vault']
              auth=safe(lambda:addr(call(ep,block,solver,'0x'+S['authority'])))
              owner=safe(lambda:addr(call(ep,block,solver,'0x'+S['owner'])))
              entry={'addresses':{k:v.lower() for k,v in t.items()},'solver_authority':auth,'solver_owner':owner,'code_bytes':{}}
              for label,address in t.items():
                entry['code_bytes'][label]=safe(lambda address=address:(len(request(ep,'eth_getCode',[address,block]))-2)//2)
              if isinstance(auth,str):
                entry['boring_solve_gate']={
                  'public':safe(lambda:pub(ep,block,auth,solver,S['boringSolve'])),
                  'attacker_can_call':safe(lambda:can(ep,block,auth,ATTACKER,solver,S['boringSolve'])),
                  'queue_can_call':safe(lambda:can(ep,block,auth,queue,solver,S['boringSolve'])),
                  'solver_self_can_call':safe(lambda:can(ep,block,auth,solver,solver,S['boringSolve'])),
                  'queue_roles_mask':safe(lambda:mask(ep,block,auth,queue)),
                  'solver_roles_mask':safe(lambda:mask(ep,block,auth,solver)),
                  'capability_roles_mask':safe(lambda:capmask(ep,block,auth,solver,S['boringSolve'])),
                }
                entry['teller_privileges']={
                  'solver_bulk_withdraw':safe(lambda:can(ep,block,auth,solver,teller,S['bulkWithdraw'])),
                  'solver_bulk_deposit':safe(lambda:can(ep,block,auth,solver,teller,S['bulkDeposit'])),
                  'attacker_bulk_withdraw':safe(lambda:can(ep,block,auth,ATTACKER,teller,S['bulkWithdraw'])),
                  'attacker_bulk_deposit':safe(lambda:can(ep,block,auth,ATTACKER,teller,S['bulkDeposit'])),
                  'teller_enter':safe(lambda:can(ep,block,auth,teller,vault,S['enter'])),
                  'teller_exit':safe(lambda:can(ep,block,auth,teller,vault,S['exit'])),
                }
              # Deliberately malformed but read-only direct callback from an attacker.
              # Auth gate should reject before any downstream action.
              dynamic_offset=(6*32).to_bytes(32,'big').hex()
              calldata='0x'+S['boringSolve']+aw(solver)+aw(vault)+aw('0x0000000000000000000000000000000000000000')+('0'*64)+('0'*64)+dynamic_offset+('0'*64)
              entry['direct_attacker_eth_call']=safe(lambda:call(ep,block,solver,calldata,ATTACKER))
              co['products'][name]=entry
            out['chains'][chain]=co
          with open('veda-audit-regression.json','w') as f:json.dump(out,f,indent=2,sort_keys=True);f.write('\n')
          print(json.dumps({c:{p:{'authority':e['solver_authority'],'owner':e['solver_owner'],'gate':e.get('boring_solve_gate'),'priv':e.get('teller_privileges'),'direct':e['direct_attacker_eth_call']} for p,e in d['products'].items()} for c,d in out['chains'].items()},indent=2,sort_keys=True))
          PY
      - name: Upload regression result
        uses: actions/upload-artifact@v4
        with:
          name: veda-audit-regression
          path: veda-audit-regression.json
          if-no-files-found: error
          retention-days: 1
