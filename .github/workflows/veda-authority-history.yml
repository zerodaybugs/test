name: veda-authority-history

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct complete authority and queue history
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          CHAINS = {
              "ethereum": {
                  "id": 1,
                  "rpc": ["https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com", "https://1rpc.io/eth"],
                  "blockscout": "https://eth.blockscout.com",
                  "authorities": {
                      "liquidBTC": "0x49f954c67ff235034b69b8a59fbe309a40256c8d",
                      "liquidETH": "0x485bde66bb668a51f2372e34e45b1c6226798122",
                      "liquidUSD": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                  },
                  "queues": {
                      "liquidBTC": "0x77a2fd42f8769d8063f2e75061fc200014e41edf",
                      "liquidETH": "0x0d2df071207e18ca8638b4f04e98c53155ec2ce0",
                      "liquidUSD": "0x38fc1ba73b7ed289955a07d9f11a85b6e388064a",
                  },
              },
              "scroll": {
                  "id": 534352,
                  "rpc": ["https://scroll-rpc.publicnode.com", "https://rpc.scroll.io", "https://scroll.drpc.org"],
                  "blockscout": None,
                  "authorities": {
                      "liquidBTC": "0x49f954c67ff235034b69b8a59fbe309a40256c8d",
                      "liquidETH": "0x485bde66bb668a51f2372e34e45b1c6226798122",
                      "liquidUSD": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                  },
                  "queues": {
                      "liquidBTC": "0x77a2fd42f8769d8063f2e75061fc200014e41edf",
                      "liquidETH": "0x0d2df071207e18ca8638b4f04e98c53155ec2ce0",
                      "liquidUSD": "0x38fc1ba73b7ed289955a07d9f11a85b6e388064a",
                  },
              },
              "ink": {
                  "id": 57073,
                  "rpc": ["https://rpc-gel.inkonchain.com", "https://rpc-qnd.inkonchain.com", "https://ink.drpc.org"],
                  "blockscout": "https://explorer.inkonchain.com",
                  "authorities": {
                      "balanced": "0x3e8b0ee1d05267fe9f8d2b1f8cb48f2e23d69c6b",
                      "boosted": "0x1f53135155d6ff516bccfdd9424fcdb8ad1efb77",
                  },
                  "queues": {
                      "balanced": "0x4c433ed6d57316170565d7fedc11a841832cdc3d",
                      "boosted": "0x406e63323ef5d39d41c6fd895ef9665af926184c",
                  },
              },
          }

          TOPICS = {
              "UserRoleUpdated": "0x4c9bdd0c8e073eb5eda2250b18d8e5121ff27b62064fbeeeed4869bb99bc5bf2",
              "PublicCapabilityUpdated": "0x950a343f5d10445e82a71036d3f4fb3016180a25805141932543b83e2078a93e",
              "RoleCapabilityUpdated": "0xa52ea92e6e955aa8ac66420b86350f7139959adfcc7e6a14eee1bd116d09860e",
          }

          def cast_sig(signature):
              return subprocess.check_output(["cast", "sig", signature], text=True).strip().lower()

          VIEW = {
              "getUserRoles": cast_sig("getUserRoles(address)"),
              "getRolesWithCapability": cast_sig("getRolesWithCapability(address,bytes4)"),
              "isCapabilityPublic": cast_sig("isCapabilityPublic(address,bytes4)"),
              "canCall": cast_sig("canCall(address,address,bytes4)"),
              "authority": cast_sig("authority()"),
              "owner": cast_sig("owner()"),
              "vault": cast_sig("vault()"),
              "accountant": cast_sig("accountant()"),
              "queue": cast_sig("queue()"),
              "withdrawAssets": cast_sig("withdrawAssets(address)"),
          }

          CRITICAL_SIGNATURES = [
              "manage(address,bytes,uint256)",
              "manage(address[],bytes[],uint256[])",
              "enter(address,address,uint256,address,uint256)",
              "exit(address,address,uint256,address,uint256)",
              "bulkDeposit(address,uint256,uint256,address)",
              "bulkWithdraw(address,uint256,uint256,address)",
              "solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)",
              "boringSolve(address,address,address,uint256,uint256,bytes)",
              "boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address)",
              "boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address)",
              "boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)",
              "boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)",
              "deposit(address,uint256,uint256)",
              "depositWithPermit(address,uint256,uint256,uint256,uint8,bytes32,bytes32)",
              "withdraw(address,uint256,uint256,address)",
              "requestOnChainWithdraw(address,uint128,uint16,uint24)",
              "requestOnChainWithdrawWithPermit(address,uint128,uint16,uint24,uint256,uint8,bytes32,bytes32)",
              "cancelOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24))",
              "replaceOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24),uint16,uint24)",
              "setAuthority(address)",
              "transferOwnership(address)",
              "setBeforeTransferHook(address)",
              "setManageRoot(address,bytes32)",
              "updateExchangeRate(uint96)",
              "vestYield(uint256,uint256)",
              "postLoss(uint256)",
              "rescueTokens(address,uint256)",
          ]
          CRITICAL = {cast_sig(signature): signature for signature in CRITICAL_SIGNATURES}

          QUEUE_EVENTS = {
              cast_sig("WithdrawAssetUpdated(address,uint24,uint24,uint16,uint16,uint96)"): "WithdrawAssetUpdated",
              cast_sig("WithdrawAssetSetup(address,uint24,uint24,uint16,uint16,uint96)"): "WithdrawAssetSetup",
              cast_sig("WithdrawAssetStopped(address)"): "WithdrawAssetStopped",
              cast_sig("OnChainWithdrawRequested(bytes32,address,address,uint96,uint128,uint128,uint40,uint24,uint24)"): "OnChainWithdrawRequested",
          }

          def http_json(url, attempts=5):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={"user-agent": "veda-authority-history/1.0", "accept": "application/json"})
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(min(8, 1 + attempt * 2))
              raise RuntimeError({"url": url, "error": repr(last)})

          def routescan_logs(chain_id, address):
              all_logs = []
              for page in range(1, 101):
                  params = urllib.parse.urlencode({
                      "module": "logs", "action": "getLogs", "address": address,
                      "fromBlock": 0, "toBlock": "latest", "page": page, "offset": 1000,
                  })
                  url = f"https://api.routescan.io/v2/network/mainnet/evm/{chain_id}/etherscan/api?{params}"
                  data = http_json(url)
                  result = data.get("result")
                  if isinstance(result, str):
                      if "No records" in result or data.get("status") == "0":
                          break
                      raise RuntimeError({"source": "routescan", "chain": chain_id, "address": address, "response": data})
                  if not result:
                      break
                  all_logs.extend(result)
                  if len(result) < 1000:
                      break
                  time.sleep(0.55)
              return all_logs

          def blockscout_logs(base, address):
              all_logs = []
              params = {}
              for _ in range(200):
                  query = "?" + urllib.parse.urlencode(params) if params else ""
                  data = http_json(f"{base}/api/v2/addresses/{address}/logs{query}")
                  all_logs.extend(data.get("items", []))
                  params = data.get("next_page_params") or {}
                  if not params:
                      break
                  time.sleep(0.25)
              return all_logs

          def normalized_log(log):
              topics = [str(x).lower() for x in (log.get("topics") or [])]
              block = log.get("blockNumber", log.get("block_number", 0))
              index = log.get("logIndex", log.get("index", 0))
              tx = log.get("transactionHash", log.get("transaction_hash"))
              def to_int(value):
                  if isinstance(value, int): return value
                  if isinstance(value, str): return int(value, 16) if value.startswith("0x") else int(value)
                  return 0
              return {
                  "address": str(log.get("address", log.get("address_hash", {}).get("hash", ""))).lower(),
                  "topics": topics,
                  "data": str(log.get("data", "0x")).lower(),
                  "block": to_int(block),
                  "index": to_int(index),
                  "tx": tx,
              }

          def get_all_logs(config, address):
              errors = {}
              try:
                  logs = routescan_logs(config["id"], address)
                  if logs:
                      return [normalized_log(x) for x in logs], "routescan", errors
              except Exception as exc:
                  errors["routescan"] = repr(exc)
              if config.get("blockscout"):
                  try:
                      logs = blockscout_logs(config["blockscout"], address)
                      return [normalized_log(x) for x in logs], "blockscout", errors
                  except Exception as exc:
                      errors["blockscout"] = repr(exc)
              return [], None, errors

          def rpc_call(endpoint, method, params, attempts=4):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(endpoint, data=body, method="POST", headers={"content-type":"application/json","user-agent":"veda-authority-history/1.0"})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = json.loads(response.read().decode())
                      if "error" in data: raise RuntimeError(data["error"])
                      return data["result"]
                  except Exception as exc:
                      last = exc
                      time.sleep(attempt + 1)
              raise RuntimeError(repr(last))

          def select_rpc(config):
              failures = {}
              for endpoint in config["rpc"]:
                  try:
                      if int(rpc_call(endpoint, "eth_chainId", []), 16) == config["id"]:
                          return endpoint
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(failures)

          def strip0(value): return value[2:] if str(value).startswith("0x") else str(value)
          def address_word(value): return strip0(value).lower().rjust(64, "0")
          def bytes4_word(value): return strip0(value).lower().ljust(64, "0")
          def topic_address(value): return "0x" + strip0(value)[-40:]
          def topic_selector(value): return "0x" + strip0(value)[:8]
          def topic_uint(value): return int(strip0(value), 16)
          def data_bool(value): return bool(int(strip0(value) or "0", 16))

          def eth_call(endpoint, target, data, block="latest"):
              return rpc_call(endpoint, "eth_call", [{"to": target, "data": data}, block])
          def call_uint(endpoint, target, selector, args=""):
              raw = eth_call(endpoint, target, selector + args)
              return int(raw, 16) if raw and raw != "0x" else 0
          def call_address(endpoint, target, selector):
              raw = eth_call(endpoint, target, selector)
              return "0x" + strip0(raw)[-40:] if raw and raw != "0x" else None
          def code_size(endpoint, address):
              raw = rpc_call(endpoint, "eth_getCode", [address, "latest"])
              return max(0, (len(raw) - 2) // 2)

          output = {"generated_at_unix": int(time.time()), "topics": TOPICS, "critical_selectors": CRITICAL, "chains": {}}
          topic_to_name = {v.lower(): k for k, v in TOPICS.items()}

          for chain_name, config in CHAINS.items():
              endpoint = select_rpc(config)
              chain_out = {"endpoint": endpoint, "authorities": {}, "queues": {}, "candidate_edges": [], "unknown_role_holders": []}
              current_block = int(rpc_call(endpoint, "eth_blockNumber", []), 16)
              chain_out["block"] = current_block

              known_addresses = set(x.lower() for x in config["authorities"].values()) | set(x.lower() for x in config["queues"].values())

              for product, authority in config["authorities"].items():
                  logs, source, errors = get_all_logs(config, authority)
                  relevant = [x for x in logs if x["topics"] and x["topics"][0] in topic_to_name]
                  relevant.sort(key=lambda x: (x["block"], x["index"]))
                  user_events = []
                  public_events = []
                  role_cap_events = []
                  discovered_users = set()
                  discovered_pairs = set()

                  for log in relevant:
                      name = topic_to_name[log["topics"][0]]
                      try:
                          if name == "UserRoleUpdated" and len(log["topics"]) >= 3:
                              item = {**log, "user": topic_address(log["topics"][1]), "role": topic_uint(log["topics"][2]), "enabled": data_bool(log["data"])}
                              user_events.append(item); discovered_users.add(item["user"])
                          elif name == "PublicCapabilityUpdated" and len(log["topics"]) >= 3:
                              item = {**log, "target": topic_address(log["topics"][1]), "selector": topic_selector(log["topics"][2]), "enabled": data_bool(log["data"])}
                              public_events.append(item); discovered_pairs.add((item["target"], item["selector"])); known_addresses.add(item["target"])
                          elif name == "RoleCapabilityUpdated" and len(log["topics"]) >= 4:
                              item = {**log, "role": topic_uint(log["topics"][1]), "target": topic_address(log["topics"][2]), "selector": topic_selector(log["topics"][3]), "enabled": data_bool(log["data"])}
                              role_cap_events.append(item); discovered_pairs.add((item["target"], item["selector"])); known_addresses.add(item["target"])
                      except Exception as exc:
                          log["decode_error"] = repr(exc)

                  users = {}
                  for user in sorted(discovered_users):
                      try:
                          roles = call_uint(endpoint, authority, VIEW["getUserRoles"], address_word(user))
                      except Exception as exc:
                          roles = {"error": repr(exc)}
                      probes = {}
                      for probe in ("owner", "authority", "vault", "accountant", "queue"):
                          try: probes[probe] = call_address(endpoint, user, VIEW[probe])
                          except Exception: pass
                      try: size = code_size(endpoint, user)
                      except Exception as exc: size = {"error": repr(exc)}
                      users[user] = {"current_roles": roles, "code_bytes": size, "probes": probes}
                      if isinstance(roles, int) and roles and user.lower() not in known_addresses:
                          chain_out["unknown_role_holders"].append({"product": product, "authority": authority, "user": user, **users[user]})

                  pairs = {}
                  for target, selector in sorted(discovered_pairs):
                      args = address_word(target) + bytes4_word(selector)
                      try: public = bool(call_uint(endpoint, authority, VIEW["isCapabilityPublic"], args))
                      except Exception as exc: public = {"error": repr(exc)}
                      try: role_bitmap = call_uint(endpoint, authority, VIEW["getRolesWithCapability"], args)
                      except Exception as exc: role_bitmap = {"error": repr(exc)}
                      try: size = code_size(endpoint, target)
                      except Exception as exc: size = {"error": repr(exc)}
                      pairs[target + ":" + selector] = {
                          "target": target, "selector": selector, "signature": CRITICAL.get(selector),
                          "current_public": public, "current_role_bitmap": role_bitmap, "target_code_bytes": size,
                      }
                      if selector in CRITICAL and (public is True or (isinstance(role_bitmap, int) and role_bitmap != 0)):
                          for user, state in users.items():
                              roles = state["current_roles"]
                              if public is True or (isinstance(roles, int) and isinstance(role_bitmap, int) and (roles & role_bitmap)):
                                  try:
                                      can_call = bool(call_uint(endpoint, authority, VIEW["canCall"], address_word(user) + address_word(target) + bytes4_word(selector)))
                                  except Exception as exc:
                                      can_call = {"error": repr(exc)}
                                  if can_call is True:
                                      chain_out["candidate_edges"].append({
                                          "product": product, "authority": authority, "user": user, "user_roles": roles,
                                          "target": target, "selector": selector, "signature": CRITICAL[selector],
                                          "public": public, "capability_roles": role_bitmap, "user_code_bytes": state["code_bytes"],
                                          "user_probes": state["probes"],
                                      })

                  chain_out["authorities"][product] = {
                      "address": authority, "log_source": source, "source_errors": errors,
                      "total_logs": len(logs), "relevant_logs": len(relevant),
                      "user_role_events": user_events, "public_capability_events": public_events,
                      "role_capability_events": role_cap_events, "users": users, "current_pairs": pairs,
                  }

              for product, queue in config["queues"].items():
                  logs, source, errors = get_all_logs(config, queue)
                  logs.sort(key=lambda x: (x["block"], x["index"]))
                  assets = set()
                  events = []
                  for log in logs:
                      if not log["topics"]: continue
                      topic0 = "0x" + strip0(log["topics"][0])[:8]
                      name = QUEUE_EVENTS.get(topic0)
                      if not name: continue
                      item = {**log, "event": name}
                      if name in ("WithdrawAssetUpdated", "WithdrawAssetSetup", "WithdrawAssetStopped") and len(log["topics"]) >= 2:
                          item["asset"] = topic_address(log["topics"][1]); assets.add(item["asset"])
                      elif name == "OnChainWithdrawRequested" and len(log["topics"]) >= 4:
                          item["user"] = topic_address(log["topics"][2]); item["asset"] = topic_address(log["topics"][3]); assets.add(item["asset"])
                      events.append(item)
                  current_assets = {}
                  for asset in sorted(assets):
                      try:
                          raw = eth_call(endpoint, queue, VIEW["withdrawAssets"] + address_word(asset))
                          words = [int(strip0(raw)[i:i+64], 16) for i in range(0, len(strip0(raw)), 64)] if raw and raw != "0x" else []
                          current_assets[asset] = words
                      except Exception as exc:
                          current_assets[asset] = {"error": repr(exc)}
                  chain_out["queues"][product] = {
                      "address": queue, "log_source": source, "source_errors": errors,
                      "total_logs": len(logs), "configuration_events": events, "current_assets": current_assets,
                  }

              # Deduplicate candidate edges produced by repeated authorities/products.
              dedup = {}
              for edge in chain_out["candidate_edges"]:
                  key = (edge["authority"], edge["user"], edge["target"], edge["selector"])
                  dedup[key] = edge
              chain_out["candidate_edges"] = list(dedup.values())
              output["chains"][chain_name] = chain_out

          with open("veda-authority-history.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")

          summary = {}
          for chain_name, chain in output["chains"].items():
              summary[chain_name] = {
                  "block": chain["block"],
                  "authorities": {
                      name: {
                          "log_source": data["log_source"],
                          "logs": data["total_logs"],
                          "role_users": len(data["users"]),
                          "capability_pairs": len(data["current_pairs"]),
                      } for name, data in chain["authorities"].items()
                  },
                  "unknown_role_holders": chain["unknown_role_holders"],
                  "candidate_edge_count": len(chain["candidate_edges"]),
                  "candidate_edges": chain["candidate_edges"],
                  "queue_assets": {name: data["current_assets"] for name, data in chain["queues"].items()},
              }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload authority history
        uses: actions/upload-artifact@v4
        with:
          name: veda-authority-history
          path: veda-authority-history.json
          if-no-files-found: error
          retention-days: 1
