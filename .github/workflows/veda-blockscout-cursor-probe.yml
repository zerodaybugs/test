name: veda-blockscout-cursor-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Ethereum Blockscout V2 cursor semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          ADDRESS='0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387'
          BASE=f'https://eth.blockscout.com/api/v2/addresses/{ADDRESS}/logs'
          variants=[
            {},
            {'block_number':24580309,'index':999999,'items_count':50},
            {'block_number':24580309,'index':0,'items_count':50},
            {'block_number':24580309,'index':2147483647,'items_count':50},
            {'block_number':24580309,'index':999999,'items_count':50,'filter':'to'},
          ]
          out=[]
          for params in variants:
            url=BASE+('?' + urllib.parse.urlencode(params) if params else '')
            row={'params':params,'url':url}
            try:
              req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'Mozilla/5.0 VedaResearchCursor/1.0'})
              with urllib.request.urlopen(req,timeout=40) as r:d=json.loads(r.read().decode())
              items=d.get('items') or [];row['count']=len(items);row['first_block']=items[0].get('block_number') if items else None;row['last_block']=items[-1].get('block_number') if items else None;row['first_index']=items[0].get('index') if items else None;row['last_index']=items[-1].get('index') if items else None;row['next_page_params']=d.get('next_page_params')
            except Exception as e:row['error']=repr(e)
            out.append(row)
          open('veda-blockscout-cursor-probe.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: veda-blockscout-cursor-probe
          path: veda-blockscout-cursor-probe.json
          if-no-files-found: error
          retention-days: 1
