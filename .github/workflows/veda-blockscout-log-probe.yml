name: veda-blockscout-log-probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Scroll Blockscout log APIs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request

          ADDRESS='0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387'
          TOPIC='0xa48026f897840554d5e1a0252e4b32d3e8a167a86ddfefab271874fdeb8cdfec'
          urls=[
            'https://scroll.blockscout.com/api?'+urllib.parse.urlencode({
              'module':'logs','action':'getLogs','fromBlock':'34470000','toBlock':'34490000','address':ADDRESS,'topic0':TOPIC
            }),
            f'https://scroll.blockscout.com/api/v2/addresses/{ADDRESS}/logs',
            f'https://scrollscan.com/api?'+urllib.parse.urlencode({
              'module':'logs','action':'getLogs','fromBlock':'34470000','toBlock':'34490000','address':ADDRESS,'topic0':TOPIC
            }),
          ]
          out=[]
          for url in urls:
            row={'url':url}
            try:
              req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'Mozilla/5.0 VedaResearch/1.0'})
              with urllib.request.urlopen(req,timeout=40) as r:
                raw=r.read();row['status']=r.status;row['content_type']=r.headers.get('content-type');row['bytes']=len(raw)
              try:
                data=json.loads(raw.decode())
                row['json_type']=type(data).__name__
                if isinstance(data,dict):
                  row['keys']=list(data.keys());row['status_field']=data.get('status');row['message']=data.get('message')
                  result=data.get('result');row['result_type']=type(result).__name__;row['result_len']=len(result) if isinstance(result,list) else None
                  items=data.get('items');row['items_len']=len(items) if isinstance(items,list) else None;row['next_page_params']=data.get('next_page_params')
                  if isinstance(items,list) and items:row['first_item_keys']=list(items[0].keys())
              except Exception as e:row['json_error']=repr(e);row['prefix']=raw[:300].decode(errors='replace')
            except Exception as e:row['error']=repr(e)
            out.append(row)
          open('veda-blockscout-log-probe.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: veda-blockscout-log-probe
          path: veda-blockscout-log-probe.json
          if-no-files-found: error
          retention-days: 1
