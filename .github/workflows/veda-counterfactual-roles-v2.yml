name: veda-counterfactual-roles-v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct live role holders and isolate undeployed privileged addresses
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, traceback, urllib.parse, urllib.request

          ZERO='0x0000000000000000000000000000000000000000'
          ATTACKER='0x1111111111111111111111111111111111111111'
          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org'],'explorer':'https://eth.blockscout.com'},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io'],'explorer':'https://scroll.blockscout.com'},
            'ink':{'id':57073,'rpcs':['https://rpc-gel.inkonchain.com'],'explorer':'https://explorer.inkonchain.com'},
          }
          PRODUCTS={
            'ethereum':{
              'liquidETH':{'auth':'0x485Bde66Bb668a51f2372E34e45B1c6226798122','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0xf9f7969C357ce6dfd7973098Ea0D57173592bCCa'},
              'liquidBTC':{'auth':'0x49F954c67ff235034b69b8a59fbe309A40256c8d','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'auth':'0xAba6BA1E95E0926a6a6b917FE4e2f19ceAe4FF2E','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x92b10e02825986bAc2375BdACaFA3e89E3f612aA','manager':'0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'},
            },
            'scroll':{
              'liquidETH':{'auth':'0x485Bde66Bb668a51f2372E34e45B1c6226798122','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0x227975088C28DBBb4b421c6d96781a53578f19a8'},
              'liquidBTC':{'auth':'0x49F954c67ff235034b69b8a59fbe309A40256c8d','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'auth':'0xAba6BA1E95E0926a6a6b917FE4e2f19ceAe4FF2E','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610','manager':'0xcFF411d5C54FE0583A984beE1eF43a4776854B9A','scopedNoCodeManager':'0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'},
            },
            'ink':{
              'balanced':{'auth':'0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B','vault':'0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f','accountant':'0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67','teller':'0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC','queue':'0x4c433Ed6d57316170565D7Fedc11a841832cDc3d','solver':'0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6','manager':'0xA0e501F98A1B5d3d8e6Ffd161c76f92570E42931','pauser':'0x3C72F147CA6200dfAFe6d8D4e808ccC4bB612C54'},
              'boosted':{'auth':'0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77','vault':'0xDbD87325D7b1189Dcc9255c4926076fF4a96A271','accountant':'0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9','teller':'0xc46f2443b3521632E2E2a903D6da8f965B46f6a0','queue':'0x406E63323EF5d39D41C6fD895Ef9665AF926184c','solver':'0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF','manager':'0xEd23b12e7700BeB638562A22ED65f74291901c25','pauser':'0x4B0B3164B6731ACd96e29F13bF6c112204d5f024'},
            },
          }

          def sh(*args):
            p=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if p.returncode: raise RuntimeError({'args':args,'stdout':p.stdout,'stderr':p.stderr})
            return p.stdout.strip()
          def sig(s): return sh('cast','sig',s)
          TOPIC=sh('cast','keccak','UserRoleUpdated(address,uint8,bool)').lower()
          OWNER=sig('owner()'); ROLES=sig('getUserRoles(address)'); CAN=sig('canCall(address,address,bytes4)')
          SENSITIVE={
            'vault':['manage(address,bytes,uint256)','manage(address[],bytes[],uint256[])','enter(address,address,uint256,address,uint256)','exit(address,address,uint256,address,uint256)'],
            'accountant':['updateExchangeRate(uint96)','vestYield(uint256,uint256)','postLoss(uint256)','setRateProviderData(address,bool,address)','pause()','unpause()'],
            'teller':['bulkDeposit(address,uint256,uint256,address)','bulkWithdraw(address,uint256,uint256,address)','withdraw(address,uint256,uint256,address)','refundDeposit(uint256,address,address,uint256,uint256,uint256,uint256)','refundDeposit(uint256,address,address,uint256,uint256,uint256,uint256,address)','updateAssetData(address,bool,bool,uint16)','pause()','unpause()'],
            'queue':['solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)'],
            'solver':['boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,bool)','rescueTokens(address,uint256)'],
            'manager':['manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])','setManageRoot(address,bytes32)','pause()','unpause()'],
            'pauser':['senderPause()','senderUnpause()','pauseSingle(address)','unpauseSingle(address)'],
          }
          SELECTORS={s:sig(s) for arr in SENSITIVE.values() for s in arr}

          def rpc(ep,m,p,t=60):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-counterfactual-v2/1'})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if 'error' in o: raise RuntimeError(o['error'])
            return o['result']
          def choose(cfg):
            errors={}
            for ep in cfg['rpcs']:
              try:
                if int(rpc(ep,'eth_chainId',[]),16)==cfg['id']: return ep,errors
              except Exception as e: errors[ep]=repr(e)
            raise RuntimeError(errors)
          def http_json(url,t=60,retries=4):
            last=None
            for i in range(retries):
              try:
                req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'veda-counterfactual-v2/1'})
                with urllib.request.urlopen(req,timeout=t) as r:return json.loads(r.read().decode())
              except Exception as e:last=repr(e);time.sleep(.5*(i+1))
            raise RuntimeError({'url':url,'error':last})
          def h(x):
            x=str(x or '');return x[2:] if x.startswith('0x') else x
          def aw(a): return h(a).lower().rjust(64,'0')
          def bw(x): return h(x).lower().ljust(64,'0')
          def addr(raw): return ZERO if not raw or raw=='0x' else '0x'+h(raw)[-40:].lower()
          def call(ep,to,data): return rpc(ep,'eth_call',[{'to':to,'data':data},'latest'])
          def safe(ep,to,data):
            try:return {'ok':True,'raw':call(ep,to,data)}
            except Exception as e:return {'ok':False,'error':repr(e)}
          def live_roles(ep,auth,user):
            r=safe(ep,auth,ROLES+aw(user));return int(r['raw'],16) if r['ok'] and r['raw']!='0x' else 0
          def can(ep,auth,user,target,selector):
            r=safe(ep,auth,CAN+aw(user)+aw(target)+bw(selector));return bool(int(r['raw'],16)) if r['ok'] and r['raw']!='0x' else False
          def address_logs(explorer,address):
            items=[];params={}
            for _ in range(100):
              q=('?'+urllib.parse.urlencode(params)) if params else ''
              page=http_json(f'{explorer}/api/v2/addresses/{address}/logs{q}',60,4)
              items.extend(page.get('items') or [])
              nxt=page.get('next_page_params')
              if not nxt:break
              params=nxt
            return items
          def parse_users(logs):
            users=set();matched=[]
            for log in logs:
              topics=[str(x).lower() for x in (log.get('topics') or [])]
              if not topics or topics[0]!=TOPIC or len(topics)<3:continue
              user='0x'+h(topics[1])[-40:].lower();users.add(user);matched.append({'user':user,'role':int(topics[2],16),'enabled':bool(int(log.get('data') or '0x0',16)),'block':log.get('block_number'),'tx':log.get('transaction_hash')})
            return users,matched

          output={'generated_at_unix':int(time.time()),'topic':TOPIC,'chains':{},'counterfactual_flags':[],'errors':[]}
          for chain,cfg in CHAINS.items():
            try:
              ep,rpc_failures=choose(cfg);block=int(rpc(ep,'eth_blockNumber',[]),16)
              crow={'block':block,'endpoint':ep,'rpc_failures':rpc_failures,'authorities':{}};output['chains'][chain]=crow
              grouped={}
              for product,p in PRODUCTS[chain].items():grouped.setdefault(p['auth'].lower(),[]).append((product,p))
              for auth,plist in grouped.items():
                logs=address_logs(cfg['explorer'],auth);users,events=parse_users(logs)
                owner_result=safe(ep,auth,OWNER);owner=addr(owner_result.get('raw')) if owner_result['ok'] else ZERO
                if owner!=ZERO:users.add(owner)
                for _,p in plist:
                  for value in p.values():
                    if isinstance(value,str) and value.startswith('0x'):users.add(value.lower())
                arow={'products':[x[0] for x in plist],'owner':owner,'api_log_count':len(logs),'matched_role_events':events,'holders':{}};crow['authorities'][auth]=arow
                for user in sorted(users):
                  roles=live_roles(ep,auth,user);code=rpc(ep,'eth_getCode',[user,'latest']);nonce=int(rpc(ep,'eth_getTransactionCount',[user,'latest']),16);balance=int(rpc(ep,'eth_getBalance',[user,'latest']),16)
                  capabilities=[]
                  for pname,p in plist:
                    for kind,signatures in SENSITIVE.items():
                      target=p.get(kind)
                      if not target:continue
                      for signature in signatures:
                        if can(ep,auth,user,target,SELECTORS[signature]):capabilities.append({'product':pname,'kind':kind,'target':target.lower(),'signature':signature})
                  row={'roles_bitmap':roles,'is_authority_owner':user==owner,'code_bytes':len(h(code))//2,'nonce':nonce,'balance':balance,'eip7702_delegate':('0x'+h(code)[6:46] if h(code).startswith('ef0100') and len(h(code))>=46 else None),'sensitive_capabilities':capabilities}
                  arow['holders'][user]=row
                  if row['code_bytes']==0 and row['nonce']==0 and (row['roles_bitmap'] or row['is_authority_owner'] or row['sensitive_capabilities']):
                    output['counterfactual_flags'].append({'chain':chain,'authority':auth,'address':user,**row})
            except Exception as e:
              output['errors'].append({'chain':chain,'error':repr(e),'traceback':traceback.format_exc()})
          output['summary']={'authority_count':sum(len(x['authorities']) for x in output['chains'].values()),'holder_count':sum(len(a['holders']) for x in output['chains'].values() for a in x['authorities'].values()),'counterfactual_flag_count':len(output['counterfactual_flags']),'error_count':len(output['errors'])}
          with open('veda-counterfactual-roles-v2.json','w') as f:json.dump(output,f,indent=2,sort_keys=True);f.write('\n')
          print(json.dumps({'summary':output['summary'],'flags':output['counterfactual_flags'],'errors':output['errors']},indent=2,sort_keys=True))
          PY
      - name: Upload corrected counterfactual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-counterfactual-roles-v2
          path: veda-counterfactual-roles-v2.json
          if-no-files-found: error
          retention-days: 1
