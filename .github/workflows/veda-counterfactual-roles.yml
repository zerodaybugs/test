name: veda-counterfactual-roles

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct role holders and detect counterfactual privileged addresses
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, traceback, urllib.request

          ATTACKER='0x1111111111111111111111111111111111111111'
          ZERO='0x0000000000000000000000000000000000000000'
          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org'],'explorer':'https://eth.blockscout.com'},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io'],'explorer':'https://scroll.blockscout.com'},
            'ink':{'id':57073,'rpcs':['https://rpc-gel.inkonchain.com'],'explorer':'https://explorer.inkonchain.com'},
          }
          ARCH={
            'ethereum':{
              'liquidETH':{'auth':'0x485Bde66Bb668a51f2372E34e45B1c6226798122','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0xf9f7969C357ce6dfd7973098Ea0D57173592bCCa'},
              'liquidBTC':{'auth':'0x49F954c67ff235034b69b8a59fbe309A40256c8d','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'auth':'0xAba6BA1E95E0926a6a6b917FE4e2f19ceAe4FF2E','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x92b10e02825986bAc2375BdACaFA3e89E3f612aA','manager':'0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'},
            },
            'scroll':{
              'liquidETH':{'auth':'0x485Bde66Bb668a51f2372E34e45B1c6226798122','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0x227975088C28DBBb4b421c6d96781a53578f19a8'},
              'liquidBTC':{'auth':'0x49F954c67ff235034b69b8a59fbe309A40256c8d','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'auth':'0xAba6BA1E95E0926a6a6b917FE4e2f19ceAe4FF2E','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610','manager':'0xcFF411d5C54FE0583A984beE1eF43a4776854B9A','scoped_no_code_manager':'0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'},
            },
            'ink':{
              'balanced':{'auth':'0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B','vault':'0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f','accountant':'0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67','teller':'0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC','queue':'0x4c433Ed6d57316170565D7Fedc11a841832cDc3d','solver':'0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6','manager':'0xA0e501F98A1B5d3d8e6Ffd161c76f92570E42931','pauser':'0x3C72F147CA6200dfAFe6d8D4e808ccC4bB612C54'},
              'boosted':{'auth':'0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77','vault':'0xDbD87325D7b1189Dcc9255c4926076fF4a96A271','accountant':'0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9','teller':'0xc46f2443b3521632E2E2a903D6da8f965B46f6a0','queue':'0x406E63323EF5d39D41C6fD895Ef9665AF926184c','solver':'0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF','manager':'0xEd23b12e7700BeB638562A22ED65f74291901c25','pauser':'0x4B0B3164B6731ACd96e29F13bF6c112204d5f024'},
            },
          }

          def sh(*args):
            p=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if p.returncode: raise RuntimeError({'args':args,'stdout':p.stdout,'stderr':p.stderr})
            return p.stdout.strip()
          def sig(s): return sh('cast','sig',s)
          S={x:sig(x) for x in [
            'owner()','getUserRoles(address)','canCall(address,address,bytes4)',
            'setUserRole(address,uint8,bool)','setRoleCapability(uint8,address,bytes4,bool)','setPublicCapability(address,bytes4,bool)',
            'manage(address,bytes,uint256)','manage(address[],bytes[],uint256[])','enter(address,address,uint256,address,uint256)','exit(address,address,uint256,address,uint256)',
            'updateExchangeRate(uint96)','vestYield(uint256,uint256)','postLoss(uint256)','setRateProviderData(address,bool,address)','pause()','unpause()',
            'bulkDeposit(address,uint256,uint256,address)','bulkWithdraw(address,uint256,uint256,address)','withdraw(address,uint256,uint256,address)','refundDeposit(uint256,address,address,uint256,uint256,uint256,uint256)','updateAssetData(address,bool,bool,uint16)',
            'solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)',
            'boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,bool)','rescueTokens(address,uint256)',
            'manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])','setManageRoot(address,bytes32)',
            'senderPause()','senderUnpause()','pauseSingle(address)','unpauseSingle(address)'
          ]}
          EVENT=sig('UserRoleUpdated(address,uint8,bool)')

          def rpc(ep,method,params,timeout=60):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
            req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-counterfactual/1'})
            with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
            if 'error' in o: raise RuntimeError(o['error'])
            return o['result']
          def choose(cfg):
            bad={}
            for ep in cfg['rpcs']:
              try:
                if int(rpc(ep,'eth_chainId',[]),16)==cfg['id']: return ep,bad
              except Exception as e: bad[ep]=repr(e)
            raise RuntimeError(bad)
          def h(x):
            s=str(x or ''); return s[2:] if s.startswith('0x') else s
          def aw(a): return h(a).lower().rjust(64,'0')
          def bw(x): return h(x).lower().ljust(64,'0')
          def address_word(raw): return ZERO if not raw or raw=='0x' else '0x'+h(raw)[-40:].lower()
          def call(ep,to,data,frm=None):
            tx={'to':to,'data':data}
            if frm: tx['from']=frm
            return rpc(ep,'eth_call',[tx,'latest'])
          def safe(ep,to,data,frm=None):
            try: return {'ok':True,'raw':call(ep,to,data,frm)}
            except Exception as e: return {'ok':False,'error':repr(e)}
          def can(ep,auth,user,target,selector):
            r=safe(ep,auth,S['canCall(address,address,bytes4)']+aw(user)+aw(target)+bw(selector))
            return bool(int(r['raw'],16)) if r['ok'] and r['raw']!='0x' else False
          def get_roles(ep,auth,user):
            r=safe(ep,auth,S['getUserRoles(address)']+aw(user))
            return int(r['raw'],16) if r['ok'] and r['raw']!='0x' else 0
          def get_logs(ep,address,latest):
            # Topic-filtered adaptive range scan; sparse auth events make this inexpensive.
            out=[]
            def scan(lo,hi):
              try:
                out.extend(rpc(ep,'eth_getLogs',[{'address':address,'fromBlock':hex(lo),'toBlock':hex(hi),'topics':[EVENT]}],90)); return
              except Exception:
                if lo>=hi: return
                mid=(lo+hi)//2; scan(lo,mid); scan(mid+1,hi)
            scan(0,latest)
            out.sort(key=lambda x:(int(x['blockNumber'],16),int(x['logIndex'],16)))
            return out
          def reconstruct(logs):
            roles={}
            for log in logs:
              t=log.get('topics') or []
              if len(t)<3: continue
              user='0x'+h(t[1])[-40:].lower(); role=int(t[2],16); enabled=bool(int(log.get('data','0x0'),16))
              cur=roles.get(user,0)
              roles[user]=(cur | (1<<role)) if enabled else (cur & ~(1<<role))
            return {u:b for u,b in roles.items() if b}

          endpoints={}; blocks={}; output={'generated_at_unix':int(time.time()),'chains':{},'flags':[],'errors':[]}
          for chain,cfg in CHAINS.items():
            try:
              ep,bad=choose(cfg); endpoints[chain]=ep; blocks[chain]=int(rpc(ep,'eth_blockNumber',[]),16)
              output['chains'][chain]={'block':blocks[chain],'endpoint':ep,'rpc_failures':bad,'authorities':{}}
            except Exception as e: output['errors'].append({'chain':chain,'error':repr(e)})

          generic_sigs=['execute(address,uint256,bytes)','execute(address,bytes)','call(address,uint256,bytes)','forward(address,bytes)','multicall(bytes[])','bundleTxs((address,bytes,uint256)[])']
          generic={g:sig(g) for g in generic_sigs}
          for chain,products in ARCH.items():
            if chain not in endpoints: continue
            ep=endpoints[chain]; latest=blocks[chain]
            auth_products={}
            for pname,p in products.items(): auth_products.setdefault(p['auth'].lower(),[]).append((pname,p))
            for auth,plist in auth_products.items():
              try:
                logs=get_logs(ep,auth,latest); reconstructed=reconstruct(logs)
                owner_raw=safe(ep,auth,S['owner()']); owner=address_word(owner_raw.get('raw')) if owner_raw['ok'] else ZERO
                candidates=set(reconstructed)
                if owner!=ZERO: candidates.add(owner)
                # Include scoped no-code and all architecture addresses, even if absent from history.
                for _,p in plist:
                  candidates.update(v.lower() for k,v in p.items() if k not in ('auth',) and isinstance(v,str) and v.startswith('0x'))
                arow={'products':[x[0] for x in plist],'owner':owner,'event_count':len(logs),'holders':{}}
                output['chains'][chain]['authorities'][auth]=arow
                for user in sorted(candidates):
                  roles=get_roles(ep,auth,user); code=rpc(ep,'eth_getCode',[user,'latest']); nonce=int(rpc(ep,'eth_getTransactionCount',[user,'latest']),16); bal=int(rpc(ep,'eth_getBalance',[user,'latest']),16)
                  sensitive=[]
                  for pname,p in plist:
                    target_map={
                      'vault':['manage(address,bytes,uint256)','manage(address[],bytes[],uint256[])','enter(address,address,uint256,address,uint256)','exit(address,address,uint256,address,uint256)'],
                      'accountant':['updateExchangeRate(uint96)','vestYield(uint256,uint256)','postLoss(uint256)','setRateProviderData(address,bool,address)','pause()','unpause()'],
                      'teller':['bulkDeposit(address,uint256,uint256,address)','bulkWithdraw(address,uint256,uint256,address)','withdraw(address,uint256,uint256,address)','refundDeposit(uint256,address,address,uint256,uint256,uint256,uint256)','updateAssetData(address,bool,bool,uint16)','pause()','unpause()'],
                      'queue':['solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)'],
                      'solver':['boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,bool)','rescueTokens(address,uint256)'],
                      'manager':['manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])','setManageRoot(address,bytes32)','pause()','unpause()'],
                      'pauser':['senderPause()','senderUnpause()','pauseSingle(address)','unpauseSingle(address)'],
                    }
                    for kind,selectors in target_map.items():
                      target=p.get(kind)
                      if not target: continue
                      for selector_name in selectors:
                        if can(ep,auth,user,target,S[selector_name]): sensitive.append({'product':pname,'target_kind':kind,'target':target.lower(),'signature':selector_name})
                  admin_rights=(user==owner)
                  probes={}
                  if code!='0x':
                    inner=S['manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])']+('0'*64)*5
                    for name,sel in generic.items():
                      # Only an authorization surface probe; malformed args are acceptable as long as success is not returned.
                      probes[name]=safe(ep,user,sel+aw(plist[0][1].get('manager',ZERO))+('0'*64)*5,ATTACKER)
                  row={'roles_bitmap':roles,'code_bytes':len(h(code))//2,'nonce':nonce,'balance':bal,'eip7702_delegate':('0x'+h(code)[6:46] if h(code).startswith('ef0100') and len(h(code))>=46 else None),'authority_owner':admin_rights,'sensitive_capabilities':sensitive,'generic_probes':probes}
                  arow['holders'][user]=row
                  if row['code_bytes']==0 and nonce==0 and (sensitive or admin_rights):
                    flag={'chain':chain,'authority':auth,'address':user,'roles_bitmap':roles,'authority_owner':admin_rights,'sensitive_capabilities':sensitive,'reason':'NO_CODE_NONCE_ZERO_PRIVILEGED'}
                    output['flags'].append(flag)
              except Exception as e:
                output['errors'].append({'chain':chain,'authority':auth,'error':repr(e),'traceback':traceback.format_exc()})
          output['summary']={'flag_count':len(output['flags']),'error_count':len(output['errors']),'authority_count':sum(len(c['authorities']) for c in output['chains'].values()),'holder_count':sum(len(a['holders']) for c in output['chains'].values() for a in c['authorities'].values())}
          with open('veda-counterfactual-roles.json','w') as f: json.dump(output,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps({'summary':output['summary'],'flags':output['flags'],'errors':output['errors']},indent=2,sort_keys=True))
          PY
      - name: Upload counterfactual role proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-counterfactual-roles
          path: veda-counterfactual-roles.json
          if-no-files-found: error
          retention-days: 1
