name: veda-cross-teller-capabilities

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify cross-teller redeem-mint capability gates
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,subprocess,time,traceback,urllib.request
          ATTACKER="0x1111111111111111111111111111111111111111"
          CHAINS={
            "ethereum":{"id":1,"rpcs":["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]},
            "optimism":{"id":10,"rpcs":["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"]},
            "scroll":{"id":534352,"rpcs":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"]},
          }
          PRODUCTS={
            "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","solver":{"ethereum":"0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29","optimism":"0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929","scroll":"0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29"}},
            "eBTC":{"vault":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642","queue":"0x686696A3e59eE16e8A8533d84B62cfA504827135","solver":{"ethereum":"0x7aa7CB90eF6677B4389B0eB707c4c7208897Bee8","optimism":"0x7aa7CB90eF6677B4389B0eB707c4c7208897Bee8","scroll":"0x7aa7CB90eF6677B4389B0eB707c4c7208897Bee8"}},
            "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","solver":{"ethereum":"0x23Aff90ED3b3EFFcf78fB41ab001c525A6C32A01","optimism":"0x23Aff90ED3b3EFFcf78fB41ab001c525A6C32A01","scroll":"0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042"}},
            "liquidKatanaETH":{"vault":"0x69d210d3b60E939bfa6e87cccc4fab7e8f44c16b","queue":"0x52E523B849c584F86bF460A3cF2962b118Ce2506","solver":{"ethereum":"0x102b3F4D1D1c7fD82f45B27E96931793e92E1F7b"}},
          }
          PAIRS=[("liquidBTC","eBTC"),("eBTC","liquidBTC"),("liquidETH","liquidKatanaETH"),("liquidKatanaETH","liquidETH")]
          def rpc(ep,m,p,t=35):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();req=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-cross-teller-capabilities/1.0"})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError({"method":m,"error":o["error"]})
            return o["result"]
          def choose(c):
            failures={}
            for ep in c["rpcs"]:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==c["id"]:return ep,failures
              except Exception as e:failures[ep]=repr(e)
            raise RuntimeError(failures)
          def sig(s):return subprocess.check_output(["cast","sig",s],text=True).strip()
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def ws(x):h=st(x);return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h else []
          def addr(x):h=st(x);return None if len(h)<40 else "0x"+h[-40:]
          S={"hook":sig("hook()"),"authority":sig("authority()"),"withdrawAssets":sig("withdrawAssets(address)"),"queueRequest":sig("requestOnChainWithdraw(address,uint128,uint16,uint24)"),"queueSolve":sig("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),"selfMint":sig("boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),"bulkDeposit":sig("bulkDeposit(address,uint256,uint256,address)"),"bulkWithdraw":sig("bulkWithdraw(address,uint256,uint256,address)")}
          PUB=sig("isCapabilityPublic(address,bytes4)");CAN=sig("canCall(address,address,bytes4)")
          out={"generated_at_unix":int(time.time()),"chains":{},"open_routes":[],"errors":[]}
          for cname,c in CHAINS.items():
            try: ep,fail=choose(c)
            except Exception as e:out["chains"][cname]={"fatal":repr(e)};continue
            block=rpc(ep,"eth_blockNumber",[]);chain={"endpoint":ep,"rpc_failures":fail,"block":int(block,16),"routes":[]};out["chains"][cname]=chain
            def call(to,data):return rpc(ep,"eth_call",[{"to":to,"data":data},block])
            def code(a):return rpc(ep,"eth_getCode",[a,block]) if a else "0x"
            def gate(auth,target,selector,caller):
              if not auth or len(code(auth))<=2:return {"available":False}
              try:return {"available":True,"public":bool(int(call(auth,PUB+aw(target)+sw(selector)),16)),"caller":bool(int(call(auth,CAN+aw(caller)+aw(target)+sw(selector)),16))}
              except Exception as e:return {"available":False,"error":repr(e)}
            live={}
            for name,p in PRODUCTS.items():
              try:
                if len(code(p["vault"]))<=2:continue
                hook=addr(call(p["vault"],S["hook"]));solver=p["solver"].get(cname);queue=p["queue"]
                live[name]={"vault":p["vault"],"hook":hook,"solver":solver,"queue":queue,"hook_code_bytes":len(st(code(hook)))//2 if hook else 0,"solver_code_bytes":len(st(code(solver)))//2 if solver else 0,"queue_code_bytes":len(st(code(queue)))//2}
              except Exception as e:out["errors"].append({"chain":cname,"product":name,"stage":"resolve","error":repr(e)})
            for src,dst in PAIRS:
              if src not in live or dst not in live:continue
              s=live[src];d=live[dst]
              if not s["hook"] or not d["hook"] or not s["solver"] or s["hook_code_bytes"]==0 or d["hook_code_bytes"]==0 or s["solver_code_bytes"]==0 or s["queue_code_bytes"]==0:continue
              try:
                sta=addr(call(s["hook"],S["authority"]));dta=addr(call(d["hook"],S["authority"]));sqa=addr(call(s["queue"],S["authority"]));ssa=addr(call(s["solver"],S["authority"]));qw=ws(call(s["queue"],S["withdrawAssets"]+aw(d["vault"])))
                r={"source":src,"target":dst,"source_vault":s["vault"].lower(),"target_vault":d["vault"].lower(),"source_teller":s["hook"].lower(),"target_teller":d["hook"].lower(),"source_solver":s["solver"].lower(),"queue_allows_target_share":bool(qw[0]) if qw else False,"queue_words":qw,"user_queue_request":gate(sqa,s["queue"],S["queueRequest"],ATTACKER),"user_self_mint":gate(ssa,s["solver"],S["selfMint"],ATTACKER),"solver_queue_solve":gate(sqa,s["queue"],S["queueSolve"],s["solver"]),"solver_source_bulk_withdraw":gate(sta,s["hook"],S["bulkWithdraw"],s["solver"]),"solver_target_bulk_deposit":gate(dta,d["hook"],S["bulkDeposit"],s["solver"])}
                r["capability_chain_open"]=(r["queue_allows_target_share"] and r["user_queue_request"].get("caller") and r["user_self_mint"].get("caller") and r["solver_queue_solve"].get("caller") and r["solver_source_bulk_withdraw"].get("caller") and r["solver_target_bulk_deposit"].get("caller"))
                chain["routes"].append(r)
                if r["capability_chain_open"]:out["open_routes"].append({"chain":cname,**r})
              except Exception as e:
                chain["routes"].append({"source":src,"target":dst,"error":repr(e),"traceback":traceback.format_exc()});out["errors"].append({"chain":cname,"source":src,"target":dst,"error":repr(e)})
          with open("veda-cross-teller-capabilities.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload capability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-cross-teller-capabilities
          path: veda-cross-teller-capabilities.json
          if-no-files-found: error
          retention-days: 1
