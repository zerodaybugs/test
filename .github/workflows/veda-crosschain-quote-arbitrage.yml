name: veda-crosschain-quote-arbitrage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify live LiquidETH cross-chain quote arbitrage path
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          ATTACKER = "0x1111111111111111111111111111111111111111"
          VAULT = "0xf0bb20865277aBd641a307eCe5Ee04E79073416C"
          ACCOUNTANT = "0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198"
          TELLER = "0x9AA79C84b79816ab920bBcE20f8f74557B514734"
          QUEUE = "0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0"
          SCOPE_SOLVER = "0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042"
          ONE = 10**18

          CHAINS = {
              "ethereum": {
                  "id": 1,
                  "eid": 30101,
                  "rpcs": ["https://ethereum-rpc.publicnode.com", "https://eth.drpc.org", "https://rpc.mevblocker.io"],
                  "weeth": "0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee",
              },
              "scroll": {
                  "id": 534352,
                  "eid": 30214,
                  "rpcs": ["https://rpc.scroll.io", "https://scroll-rpc.publicnode.com", "https://scroll.drpc.org"],
                  "weeth": "0x01f0a31698C4d065659b9bdC21B3610292a1c506",
              },
          }

          def request(ep, method, params, timeout=35):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req = urllib.request.Request(ep, data=body, method="POST", headers={
                  "content-type":"application/json", "user-agent":"veda-crosschain-quote-arbitrage/1.0"
              })
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  obj = json.loads(response.read().decode())
              if "error" in obj:
                  raise RuntimeError(obj["error"])
              return obj["result"]

          def choose(config):
              failures = {}
              for ep in config["rpcs"]:
                  try:
                      if int(request(ep, "eth_chainId", []), 16) == config["id"]:
                          return ep
                  except Exception as exc:
                      failures[ep] = repr(exc)
              raise RuntimeError(failures)

          def sig(text):
              return subprocess.check_output(["cast", "sig", text], text=True).strip()
          def strip0(value):
              return value[2:] if value.startswith("0x") else value
          def aw(address):
              return strip0(address).lower().rjust(64, "0")
          def sw(selector):
              return strip0(selector).lower().ljust(64, "0")
          def uw(number):
              return hex(number)[2:].rjust(64, "0")
          def words(raw):
              value = strip0(raw)
              return [int(value[i:i+64], 16) for i in range(0, len(value), 64)] if value else []
          def addr(raw):
              return "0x" + strip0(raw)[-40:]
          def boolean(raw):
              return bool(int(raw, 16))

          PUBLIC = sig("isCapabilityPublic(address,bytes4)")
          CAN = sig("canCall(address,address,bytes4)")
          SELECTORS = {
              "authority": sig("authority()"),
              "owner": sig("owner()"),
              "getRate": sig("getRate()"),
              "getRateSafe": sig("getRateSafe()"),
              "getRateInQuoteSafe": sig("getRateInQuoteSafe(address)"),
              "assetData": sig("assetData(address)"),
              "shareLockPeriod": sig("shareLockPeriod()"),
              "isPaused": sig("isPaused()"),
              "balanceOf": sig("balanceOf(address)"),
              "totalSupply": sig("totalSupply()"),
              "withdrawAssets": sig("withdrawAssets(address)"),
              "idToChains": sig("idToChains(uint32)"),
              "peers": sig("peers(uint32)"),
              "canSend": sig("getAmountCanBeSent(uint32)"),
              "canReceive": sig("getAmountCanBeReceived(uint32)"),
          }
          SURFACES = {
              "teller": {
                  "deposit_v0": sig("deposit(address,uint256,uint256)"),
                  "deposit_referral": sig("deposit(address,uint256,uint256,address)"),
                  "deposit_to_referral": sig("deposit(address,uint256,uint256,address,address)"),
                  "depositAndBridge_v0": sig("depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)"),
                  "depositAndBridge_referral": sig("depositAndBridge(address,uint256,uint256,address,address,bytes,address,uint256)"),
                  "bridge": sig("bridge(uint96,address,bytes,address,uint256)"),
                  "withdraw": sig("withdraw(address,uint256,uint256,address)"),
                  "bulkWithdraw": sig("bulkWithdraw(address,uint256,uint256,address)"),
              },
              "queue": {
                  "request": sig("requestOnChainWithdraw(address,uint128,uint16,uint24)"),
                  "requestPermit": sig("requestOnChainWithdrawWithPermit(address,uint128,uint16,uint24,uint256,uint8,bytes32,bytes32)"),
                  "solve": sig("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),
                  "cancel": sig("cancelOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24))"),
              },
              "solver": {
                  "selfRedeem": sig("boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
                  "selfRedeemMint": sig("boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
                  "adminRedeem": sig("boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address)"),
                  "adminRedeemMint": sig("boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address)"),
              },
          }

          endpoints = {name: choose(config) for name, config in CHAINS.items()}
          snapshots = {}
          errors = []

          for chain_name, config in CHAINS.items():
              ep = endpoints[chain_name]
              block_hex = request(ep, "eth_blockNumber", [])
              block = int(block_hex, 16)
              weeth = config["weeth"]
              def call(to, data, sender=None):
                  tx = {"to": to, "data": data}
                  if sender:
                      tx["from"] = sender
                  return request(ep, "eth_call", [tx, block_hex])
              def safe_call(label, to, data, sender=None):
                  try:
                      return {"raw": call(to, data, sender)}
                  except Exception as exc:
                      errors.append({"chain":chain_name,"label":label,"error":repr(exc)})
                      return {"error":repr(exc)}

              authority = addr(call(TELLER, SELECTORS["authority"]))
              queue_authority = addr(call(QUEUE, SELECTORS["authority"]))
              solver_authority = addr(call(SCOPE_SOLVER, SELECTORS["authority"])) if len(request(ep,"eth_getCode",[SCOPE_SOLVER,block_hex])) > 2 else None

              def gates(target, authority_address, surface):
                  result = {}
                  for label, selector in surface.items():
                      public = boolean(call(authority_address, PUBLIC + aw(target) + sw(selector)))
                      attacker = boolean(call(authority_address, CAN + aw(ATTACKER) + aw(target) + sw(selector)))
                      result[label] = {"selector":selector,"public":public,"attacker":attacker}
                  return result

              quote = int(call(ACCOUNTANT, SELECTORS["getRateInQuoteSafe"] + aw(weeth)), 16)
              base_rate = int(call(ACCOUNTANT, SELECTORS["getRate"]), 16)
              asset_words = words(call(TELLER, SELECTORS["assetData"] + aw(weeth)))
              queue_words = words(call(QUEUE, SELECTORS["withdrawAssets"] + aw(weeth)))
              share_lock = int(call(TELLER, SELECTORS["shareLockPeriod"]), 16)
              paused = boolean(call(TELLER, SELECTORS["isPaused"]))
              vault_weeth_balance = int(call(weeth, SELECTORS["balanceOf"] + aw(VAULT)), 16)
              vault_total_supply = int(call(VAULT, SELECTORS["totalSupply"]), 16)
              remote_name = "scroll" if chain_name == "ethereum" else "ethereum"
              remote_eid = CHAINS[remote_name]["eid"]
              peer_words = words(call(TELLER, SELECTORS["idToChains"] + uw(remote_eid)))
              peer = call(TELLER, SELECTORS["peers"] + uw(remote_eid))
              can_send = words(call(TELLER, SELECTORS["canSend"] + uw(remote_eid)))
              can_receive = words(call(TELLER, SELECTORS["canReceive"] + uw(remote_eid)))

              snapshots[chain_name] = {
                  "endpoint": ep,
                  "block": block,
                  "weeth": weeth.lower(),
                  "accountant_base_rate": base_rate,
                  "liquideth_rate_in_weeth": quote,
                  "teller_authority": authority,
                  "queue_authority": queue_authority,
                  "solver_authority": solver_authority,
                  "share_lock_period": share_lock,
                  "teller_paused": paused,
                  "asset_data_words": asset_words,
                  "allow_deposits": bool(asset_words[0]) if len(asset_words) > 0 else None,
                  "allow_direct_withdraws": bool(asset_words[1]) if len(asset_words) > 1 else None,
                  "share_premium_bps": asset_words[2] if len(asset_words) > 2 else None,
                  "queue_withdraw_words": queue_words,
                  "allow_queue_withdraws": bool(queue_words[0]) if len(queue_words) > 0 else None,
                  "vault_weeth_balance": vault_weeth_balance,
                  "vault_total_supply": vault_total_supply,
                  "remote_peer": peer,
                  "remote_chain_words": peer_words,
                  "amount_can_send": can_send,
                  "amount_can_receive": can_receive,
                  "teller_gates": gates(TELLER, authority, SURFACES["teller"]),
                  "queue_gates": gates(QUEUE, queue_authority, SURFACES["queue"]),
                  "solver_gates": gates(SCOPE_SOLVER, solver_authority, SURFACES["solver"]) if solver_authority else {},
                  "runtime_code_bytes": {
                      "vault": (len(request(ep,"eth_getCode",[VAULT,block_hex]))-2)//2,
                      "teller": (len(request(ep,"eth_getCode",[TELLER,block_hex]))-2)//2,
                      "queue": (len(request(ep,"eth_getCode",[QUEUE,block_hex]))-2)//2,
                      "scope_solver": (len(request(ep,"eth_getCode",[SCOPE_SOLVER,block_hex]))-2)//2,
                  },
              }

          routes = []
          for source, destination in (("ethereum","scroll"),("scroll","ethereum")):
              src = snapshots[source]
              dst = snapshots[destination]
              deposit_open = any(v["attacker"] for k,v in src["teller_gates"].items() if k.startswith("deposit"))
              bridge_open = src["teller_gates"]["bridge"]["attacker"] or any(
                  v["attacker"] for k,v in src["teller_gates"].items() if k.startswith("depositAndBridge")
              )
              direct_cashout = dst["teller_gates"]["withdraw"]["attacker"] and dst["allow_direct_withdraws"]
              queue_request_open = dst["queue_gates"]["request"]["attacker"] and dst["allow_queue_withdraws"]
              self_solve_open = any(v["attacker"] for k,v in dst["solver_gates"].items() if k.startswith("self"))
              queue_cashout = queue_request_open and self_solve_open
              src_quote = src["liquideth_rate_in_weeth"]
              dst_quote = dst["liquideth_rate_in_weeth"]
              test_deposit = 10**18
              minted = test_deposit * ONE // src_quote
              destination_out = minted * dst_quote // ONE
              gross_profit = destination_out - test_deposit
              max_bridge = src["amount_can_send"][1] if len(src["amount_can_send"]) > 1 else 0
              max_by_direct_liquidity = dst["vault_weeth_balance"] * ONE // dst_quote if dst_quote else 0
              max_testable_shares = min(max_bridge, max_by_direct_liquidity) if direct_cashout else 0
              max_input = max_testable_shares * src_quote // ONE
              max_output = max_testable_shares * dst_quote // ONE
              routes.append({
                  "source":source,
                  "destination":destination,
                  "source_quote":src_quote,
                  "destination_quote":dst_quote,
                  "quote_delta":dst_quote-src_quote,
                  "gross_ratio_scaled_1e18":dst_quote*ONE//src_quote,
                  "gross_profit_bps_x1e9":(dst_quote-src_quote)*10_000_000_000_000//src_quote,
                  "one_weeth_test":{"deposit":test_deposit,"shares_minted":minted,"destination_weeth_out":destination_out,"gross_profit":gross_profit},
                  "source_deposit_open":deposit_open,
                  "source_bridge_open":bridge_open,
                  "source_share_lock_period":src["share_lock_period"],
                  "destination_direct_cashout":direct_cashout,
                  "destination_queue_request_open":queue_request_open,
                  "destination_self_solve_open":self_solve_open,
                  "destination_queue_cashout":queue_cashout,
                  "destination_vault_weeth_balance":dst["vault_weeth_balance"],
                  "source_bridge_capacity_shares":max_bridge,
                  "max_direct_cashout_shares":max_testable_shares,
                  "max_direct_cashout_input":max_input,
                  "max_direct_cashout_output":max_output,
                  "max_direct_cashout_gross_profit":max_output-max_input,
                  "permissionless_complete_path":deposit_open and bridge_open and (direct_cashout or queue_cashout),
                  "positive_gross_profit":gross_profit>0,
              })

          flags = [r for r in routes if r["permissionless_complete_path"] and r["positive_gross_profit"] and r["max_direct_cashout_gross_profit"]>0]
          result = {
              "generated_at_unix": int(time.time()),
              "addresses": {"vault":VAULT.lower(),"accountant":ACCOUNTANT.lower(),"teller":TELLER.lower(),"queue":QUEUE.lower(),"scope_solver":SCOPE_SOLVER.lower(),"attacker":ATTACKER.lower()},
              "selectors": SELECTORS,
              "surface_selectors": SURFACES,
              "chains": snapshots,
              "routes": routes,
              "flags": flags,
              "rpc_errors": errors,
          }
          with open("veda-crosschain-quote-arbitrage.json","w",encoding="utf-8") as f:
              json.dump(result,f,indent=2,sort_keys=True); f.write("\n")
          print(json.dumps({"routes":routes,"flags":flags,"rpc_errors":errors},indent=2,sort_keys=True))
          PY
      - name: Upload quote-arbitrage proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-crosschain-quote-arbitrage
          path: veda-crosschain-quote-arbitrage.json
          if-no-files-found: error
          retention-days: 1
