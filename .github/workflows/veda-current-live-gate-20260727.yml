name: veda-current-live-gate-20260727

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Snapshot current Scroll to Ethereum submission gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request

          ATTACKER='0x1111111111111111111111111111111111111111'
          TELLER='0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387'
          ACCOUNTANT='0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7'
          VAULT='0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C'
          QUEUE='0x38FC1BA73b7ED289955a07d9F11A85b6E388064A'
          SCROLL_USDC='0x06eFdBFf2a14a7c8E15944D1F4A48F9F95F663A4'
          ETH_USDT='0xdAC17F958D2ee523a2206206994597C13D831ec7'
          ETH_EID=30101
          SCROLL_EID=30214
          ONE_SHARE=10**6
          RPCS={
            'ethereum':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org','https://rpc.mevblocker.io'],
            'scroll':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org'],
          }
          CHAIN_ID={'ethereum':1,'scroll':534352}
          def sig(s):return subprocess.check_output(['cast','sig',s],text=True).strip()
          S={x:sig(x) for x in [
            'getRate()','getRateInQuoteSafe(address)','authority()','canCall(address,address,bytes4)',
            'depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)',
            'getAmountCanBeSent(uint32)','getAmountCanBeReceived(uint32)','idToChains(uint32)',
            'assetData(address)','shareLockPeriod()','isPaused()','balanceOf(address)','withdrawAssets(address)',
            'requestOnChainWithdraw(address,uint128,uint16,uint24)'
          ]}
          def rpc(url,m,p,timeout=35):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(url,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-current-gate/1'})
            with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          def choose(chain):
            bad={}
            for url in RPCS[chain]:
              try:
                if int(rpc(url,'eth_chainId',[]),16)!=CHAIN_ID[chain]:raise RuntimeError('wrong chain')
                block=int(rpc(url,'eth_blockNumber',[]),16)
                return url,block,bad
              except Exception as e:bad[url]=repr(e)
            raise RuntimeError(bad)
          def h(x):return x[2:] if x.startswith('0x') else x
          def aw(a):return h(a).lower().rjust(64,'0')
          def bw(b):return h(b).lower().ljust(64,'0')
          def uw(v):return hex(v)[2:].rjust(64,'0')
          def call(url,to,data,block='latest'):
            return rpc(url,'eth_call',[{'to':to,'data':data},hex(block) if isinstance(block,int) else block])
          def words(raw):
            x=h(raw);return [int(x[i:i+64],16) for i in range(0,len(x),64)] if x and len(x)%64==0 else []
          def addr(raw):return '0x'+h(raw)[-40:]
          def can(url,auth,user,target,selector):return bool(int(call(url,auth,S['canCall(address,address,bytes4)']+aw(user)+aw(target)+bw(selector)),16))

          endpoints={};blocks={};failures={};timestamps={}
          for chain in ['ethereum','scroll']:
            endpoints[chain],blocks[chain],failures[chain]=choose(chain)
            timestamps[chain]=int(rpc(endpoints[chain],'eth_getBlockByNumber',[hex(blocks[chain]),False])['timestamp'],16)
          E=endpoints['ethereum'];R=endpoints['scroll']
          source_rate=int(call(R,ACCOUNTANT,S['getRate()']),16)
          source_quote=int(call(R,ACCOUNTANT,S['getRateInQuoteSafe(address)']+aw(SCROLL_USDC)),16)
          dest_rate=int(call(E,ACCOUNTANT,S['getRate()']),16)
          dest_quote=int(call(E,ACCOUNTANT,S['getRateInQuoteSafe(address)']+aw(ETH_USDT)),16)
          source_auth=addr(call(R,TELLER,S['authority()']))
          queue_auth=addr(call(E,QUEUE,S['authority()']))
          source_asset=words(call(R,TELLER,S['assetData(address)']+aw(SCROLL_USDC)))
          outbound=words(call(R,TELLER,S['getAmountCanBeSent(uint32)']+uw(ETH_EID)))
          inbound=words(call(E,TELLER,S['getAmountCanBeReceived(uint32)']+uw(SCROLL_EID)))
          source_chain_cfg=words(call(R,TELLER,S['idToChains(uint32)']+uw(ETH_EID)))
          dest_chain_cfg=words(call(E,TELLER,S['idToChains(uint32)']+uw(SCROLL_EID)))
          wcfg=words(call(E,QUEUE,S['withdrawAssets(address)']+aw(ETH_USDT)))
          liquidity=int(call(E,ETH_USDT,S['balanceOf(address)']+aw(VAULT)),16)
          deposit_bridge_open=can(R,source_auth,ATTACKER,TELLER,S['depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)'])
          request_open=can(E,queue_auth,ATTACKER,QUEUE,S['requestOnChainWithdraw(address,uint128,uint16,uint24)'])
          edge_raw=dest_rate-source_rate
          edge_bps=edge_raw*10000/source_rate if edge_raw>0 else 0
          can_send=outbound[1] if len(outbound)>1 else 0
          can_receive=inbound[1] if len(inbound)>1 else 0
          max_by_liq=liquidity*ONE_SHARE//dest_quote if dest_quote else 0
          capacity=wcfg[6] if len(wcfg)>6 else 2**256-1
          executable_shares=min(can_send,can_receive,max_by_liq,capacity)
          max_source_input=executable_shares*source_quote//ONE_SHARE
          max_dest_output=executable_shares*dest_quote//ONE_SHARE
          max_gross_profit=max(0,max_dest_output-max_source_input)
          route_open=bool(
            deposit_bridge_open and request_open and
            len(source_asset)>=1 and source_asset[0] and
            len(source_chain_cfg)>=2 and source_chain_cfg[1] and
            len(dest_chain_cfg)>=1 and dest_chain_cfg[0] and
            len(wcfg)>=1 and wcfg[0] and
            int(call(R,TELLER,S['shareLockPeriod()']),16)==0 and
            not bool(int(call(R,TELLER,S['isPaused()']),16))
          )
          out={
            'generated_at_unix':int(time.time()),'endpoints':endpoints,'rpc_failures':failures,'blocks':blocks,'timestamps':timestamps,
            'source_rate':source_rate,'source_quote':source_quote,'destination_rate':dest_rate,'destination_quote':dest_quote,
            'edge_raw':edge_raw,'edge_bps':edge_bps,'route_open':route_open,'deposit_and_bridge_open':deposit_bridge_open,
            'queue_request_open':request_open,'source_asset_data':source_asset,'source_chain_config':source_chain_cfg,
            'destination_chain_config':dest_chain_cfg,'outbound_capacity':outbound,'inbound_capacity':inbound,
            'withdraw_config':wcfg,'destination_usdt_liquidity_raw':liquidity,'executable_shares_raw':executable_shares,
            'max_source_input_usd_raw':max_source_input,'max_destination_output_usd_raw':max_dest_output,
            'max_gross_profit_usd_raw':max_gross_profit,
            'submission_gate_pass':bool(route_open and edge_raw>0 and max_gross_profit>0)
          }
          open('veda-current-live-gate.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload current gate
        uses: actions/upload-artifact@v4
        with:
          name: veda-current-live-gate-20260727
          path: veda-current-live-gate.json
          if-no-files-found: error
          retention-days: 1
