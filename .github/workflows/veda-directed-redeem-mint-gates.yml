name: veda-directed-redeem-mint-gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify live self redeem-mint gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,time,urllib.request
          ATTACKER="0x1111111111111111111111111111111111111111"
          CHAINS={
            "ethereum":{"id":1,"rpcs":["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]},
            "optimism":{"id":10,"rpcs":["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"]},
            "scroll":{"id":534352,"rpcs":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"]},
          }
          P={
            "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","teller":{"ethereum":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353","optimism":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353","scroll":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353"},"queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","solver":{"ethereum":"0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29","optimism":"0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929","scroll":"0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29"}},
            "eBTC":{"vault":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642","accountant":"0x1b293DC39F94157fA0D1D36d7e0090C8B8B8c13F","teller":{"ethereum":"0x6Ee3aaCcf9f2321E49063C4F8da775DdBd407268","optimism":"0x6Ee3aaCcf9f2321E49063C4F8da775DdBd407268","scroll":"0x6Ee3aaCcf9f2321E49063C4F8da775DdBd407268"},"queue":"0x686696A3e59eE16e8A8533d84B62cfA504827135","solver":{"ethereum":"0x7aa7CB90eF6677B4389B0eB707c4c7208897Bee8","optimism":"0x7aa7CB90eF6677B4389B0eB707c4c7208897Bee8","scroll":"0x7aa7CB90eF6677B4389B0eB707c4c7208897Bee8"}},
            "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","teller":{"ethereum":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","optimism":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","scroll":"0x9AA79C84b79816ab920bBcE20f8f74557B514734"},"queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","solver":{"ethereum":"0x23Aff90ED3b3EFFcf78fB41ab001c525A6C32A01","optimism":"0x23Aff90ED3b3EFFcf78fB41ab001c525A6C32A01","scroll":"0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042"}},
            "liquidKatanaETH":{"vault":"0x69d210d3b60E939bfa6e87cccc4fab7e8f44c16b","accountant":"0xFCb9a6bF02C43f9E38Bb102fd960Cc1e738e787d","teller":{"ethereum":"0x739A1efFaDDB0b07ef1284598819232df4FD8d16"},"queue":"0x52E523B849c584F86bF460A3cF2962b118Ce2506","solver":{"ethereum":"0x102b3F4D1D1c7fD82f45B27E96931793e92E1F7b"}},
          }
          ASSETS={"btc":{"ethereum":["0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599","0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"],"optimism":["0x68f180fcCe6836688e9084f035309E29Bf0A2095"],"scroll":[]},"eth":{"ethereum":["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2","0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"],"optimism":["0x4200000000000000000000000000000000000006","0x346e03F8Cce9fE01dCB3d0Da3e9D00dC2c0E08f0"],"scroll":["0x5300000000000000000000000000000000000004"]}}
          PAIRS=[("liquidBTC","eBTC","btc"),("eBTC","liquidBTC","btc"),("liquidETH","liquidKatanaETH","eth"),("liquidKatanaETH","liquidETH","eth")]
          def rpc(ep,m,p,t=35):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();q=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json","user-agent":"veda-directed-redeem-mint-gates/1.0"})
            with urllib.request.urlopen(q,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          def choose(c):
            bad={}
            for ep in c["rpcs"]:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==c["id"]:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def sig(s):return subprocess.check_output(["cast","sig",s],text=True).strip()
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def ws(x):h=st(x);return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h else []
          def addr(x):return "0x"+st(x)[-40:]
          S={"authority":sig("authority()"),"assetData":sig("assetData(address)"),"quote":sig("getRateInQuoteSafe(address)"),"withdrawAssets":sig("withdrawAssets(address)"),"queueSolve":sig("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),"queueRequest":sig("requestOnChainWithdraw(address,uint128,uint16,uint24)"),"selfMint":sig("boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),"bulkDeposit":sig("bulkDeposit(address,uint256,uint256,address)"),"bulkWithdraw":sig("bulkWithdraw(address,uint256,uint256,address)")}
          PUB=sig("isCapabilityPublic(address,bytes4)");CAN=sig("canCall(address,address,bytes4)")
          out={"generated_at_unix":int(time.time()),"chains":{},"open_routes":[],"errors":[]}
          for cname,c in CHAINS.items():
            ep,bad=choose(c);block=rpc(ep,"eth_blockNumber",[]);cd={"endpoint":ep,"rpc_failures":bad,"block":int(block,16),"routes":[]};out["chains"][cname]=cd
            def call(to,data):return rpc(ep,"eth_call",[{"to":to,"data":data},block])
            def safe(label,to,data):
              try:return call(to,data)
              except Exception as e:out["errors"].append({"chain":cname,"label":label,"error":repr(e)});return None
            def gate(auth,target,sel,caller=ATTACKER):
              try:return {"public":bool(int(call(auth,PUB+aw(target)+sw(sel)),16)),"caller":bool(int(call(auth,CAN+aw(caller)+aw(target)+sw(sel)),16))}
              except Exception as e:return {"error":repr(e)}
            for src,dst,family in PAIRS:
              sp=P[src];dp=P[dst];st=sp["teller"].get(cname);dt=dp["teller"].get(cname);solver=sp["solver"].get(cname)
              if not all([st,dt,solver]):continue
              addrs=[sp["vault"],sp["accountant"],st,sp["queue"],solver,dp["vault"],dp["accountant"],dt]
              if any(len(rpc(ep,"eth_getCode",[a,block]))<=2 for a in addrs):continue
              sta=addr(call(st,S["authority"]));sqa=addr(call(sp["queue"],S["authority"]));ssa=addr(call(solver,S["authority"]));dta=addr(call(dt,S["authority"]));qw=ws(safe(src+".queue("+dst+")",sp["queue"],S["withdrawAssets"]+aw(dp["vault"])) or "0x")
              route={"source":src,"target":dst,"solver":solver.lower(),"queue_allows_target_share":bool(qw[0]) if qw else False,"queue_words":qw,"user_queue_request":gate(sqa,sp["queue"],S["queueRequest"]),"user_self_mint":gate(ssa,solver,S["selfMint"]),"solver_queue_solve":gate(sqa,sp["queue"],S["queueSolve"],solver),"solver_source_bulk_withdraw":gate(sta,st,S["bulkWithdraw"],solver),"solver_target_bulk_deposit":gate(dta,dt,S["bulkDeposit"],solver),"intermediates":[]}
              for asset in ASSETS[family].get(cname,[]):
                if len(rpc(ep,"eth_getCode",[asset,block]))<=2:continue
                sad=ws(safe(src+".sourceAsset",st,S["assetData"]+aw(asset)) or "0x");tad=ws(safe(src+".targetAsset",dt,S["assetData"]+aw(asset)) or "0x");sq=safe(src+".sourceQuote",sp["accountant"],S["quote"]+aw(asset));tq=safe(src+".targetQuote",dp["accountant"],S["quote"]+aw(asset))
                route["intermediates"].append({"asset":asset.lower(),"source_allow_withdraw":bool(sad[1]) if len(sad)>1 else False,"target_allow_deposit":bool(tad[0]) if tad else False,"source_quote":int(sq,16) if sq else None,"target_quote":int(tq,16) if tq else None})
              route["fully_open"]=(route["queue_allows_target_share"] and route["user_queue_request"].get("caller") and route["user_self_mint"].get("caller") and route["solver_queue_solve"].get("caller") and route["solver_source_bulk_withdraw"].get("caller") and route["solver_target_bulk_deposit"].get("caller") and any(i["source_allow_withdraw"] and i["target_allow_deposit"] and i["source_quote"] and i["target_quote"] for i in route["intermediates"]))
              cd["routes"].append(route)
              if route["fully_open"]:out["open_routes"].append({"chain":cname,**route})
          with open("veda-directed-redeem-mint-gates.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload route gates
        uses: actions/upload-artifact@v4
        with:
          name: veda-directed-redeem-mint-gates
          path: veda-directed-redeem-mint-gates.json
          if-no-files-found: error
          retention-days: 1
