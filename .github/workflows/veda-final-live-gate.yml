name: Veda final read-only live gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/veda_final_gate/**'
      - '.github/workflows/veda-final-live-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lz-auth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependency
        run: python -m pip install --disable-pip-version-check pycryptodome==3.23.0

      - name: Run read-only pinned LayerZero authorization gate
        id: gate
        shell: bash
        run: |
          set +e
          python research/veda_final_gate/veda_lz_auth_gate.py 2>&1 | tee results-run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > gate-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build checksums
        shell: bash
        run: |
          sha256sum \
            research/veda_final_gate/veda_lz_auth_gate.py \
            results/veda_lz_auth_gate.json \
            results/SUMMARY.md \
            results-run.log \
            gate-exit-code.txt \
            > SHA256SUMS

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: veda-final-live-gate-${{ github.run_id }}
          path: |
            results/veda_lz_auth_gate.json
            results/SUMMARY.md
            results-run.log
            gate-exit-code.txt
            SHA256SUMS
            research/veda_final_gate/veda_lz_auth_gate.py
          if-no-files-found: error
          retention-days: 30

      - name: Enforce binary result
        shell: bash
        run: |
          rc="$(cat gate-exit-code.txt)"
          case "$rc" in
            0) echo 'No permissionless LayerZero admin precondition found.' ;;
            2) echo 'MATERIAL LIVE PRECONDITION FOUND.'; exit 2 ;;
            3) echo 'Evidence incomplete.'; exit 3 ;;
            *) echo "Unexpected gate exit code: $rc"; exit 4 ;;
          esac
