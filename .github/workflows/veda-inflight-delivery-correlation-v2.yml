name: veda-inflight-delivery-correlation-v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve five candidates with direct Ethereum RPC logs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request
          from pathlib import Path

          CANDIDATES=[
            {'product':'liquidETH','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','one':10**18,'guid':'0x8f0a7530f2f79932550e6335df60f0f4ca2de611e32168aae5651c81e057e9e1','source_block':30932878,'source_timestamp':1772234290,'update_time':1772234339,'shares':94011967841297},
            {'product':'liquidETH','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','one':10**18,'guid':'0x4fb116b702290d7876b522e50bd14528e9d0e96bed707038c5013fe1f50ed93e','source_block':31176489,'source_timestamp':1772580369,'update_time':1772581643,'shares':130424307382454028},
            {'product':'liquidUSD','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','one':10**6,'guid':'0x2f0ccd504501ed1e96d259d201ad1e142a9312e0bc2975c4b8dff44727323d63','source_block':28912407,'source_timestamp':1769556275,'update_time':1769557547,'shares':286395633},
            {'product':'liquidUSD','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','one':10**6,'guid':'0xdbe4b87eee629f09d2c954cf1546470daa559bdf478993cd09d58817d954f537','source_block':30563082,'source_timestamp':1771718078,'update_time':1771718159,'shares':8726353},
            {'product':'liquidUSD','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','one':10**6,'guid':'0x19cee498fcc7bd2c53466cb46da1380ff2217b82e85bd691ae6057fb827a6904','source_block':33168221,'source_timestamp':1775519587,'update_time':1775519843,'shares':766122},
          ]
          ETH_RPCS=['https://ethereum-rpc.publicnode.com','https://eth.drpc.org','https://rpc.mevblocker.io']
          SCROLL_RPCS=['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']
          def sig(s):return subprocess.check_output(['cast','sig',s],text=True).strip()
          def keccak(s):return subprocess.check_output(['cast','keccak',s],text=True).strip()
          RECEIVED=keccak('MessageReceived(bytes32,uint256,address)');GET_RATE=sig('getRate()')
          def rpc(url,m,p,timeout=60):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(url,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-inflight-v2/1'})
            with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          def choose(candidates,cid):
            failures={}
            for u in candidates:
              try:
                if int(rpc(u,'eth_chainId',[]),16)!=cid:raise RuntimeError('wrong chain')
                return u,failures
              except Exception as e:failures[u]=repr(e)
            raise RuntimeError(failures)
          eth,eth_fail=choose(ETH_RPCS,1);scroll,scroll_fail=choose(SCROLL_RPCS,534352)
          eth_latest=int(rpc(eth,'eth_blockNumber',[]),16);block_cache={}
          def block(url,n):
            k=(url,n)
            if k not in block_cache:block_cache[k]=rpc(url,'eth_getBlockByNumber',[hex(n),False])
            return block_cache[k]
          def block_ts(url,n):return int(block(url,n)['timestamp'],16)
          def block_before(target):
            lo=1;hi=eth_latest
            while lo<hi:
              mid=(lo+hi+1)//2
              if block_ts(eth,mid)<=target:lo=mid
              else:hi=mid-1
            return lo
          def rate(url,accountant,b):return int(rpc(url,'eth_call',[{'to':accountant,'data':GET_RATE},hex(b)]),16)
          def find_logs(address,guid,lo,hi):
            out=[];errors=[]
            for a in range(lo,hi+1,1000):
              b=min(hi,a+999)
              try:
                out.extend(rpc(eth,'eth_getLogs',[{'address':address,'fromBlock':hex(a),'toBlock':hex(b),'topics':[RECEIVED,guid]}],90))
              except Exception as e:errors.append({'from':a,'to':b,'error':repr(e)})
              if out:break
            return out,errors
          results=[];errors=[]
          for c in CANDIDATES:
            try:
              anchor=block_before(c['update_time']);found,log_errors=find_logs(c['teller'],c['guid'],max(1,anchor-250),min(eth_latest,anchor+15000));x=dict(c);x['ethereum_anchor_block']=anchor;x['log_query_errors']=log_errors;x['delivery_found']=bool(found)
              if found:
                d=found[0];db=int(d['blockNumber'],16);dt=block_ts(eth,db);sr=rate(scroll,c['accountant'],c['source_block']);dr=rate(eth,c['accountant'],db);x.update({'destination_block':db,'destination_timestamp':dt,'destination_tx':d['transactionHash'],'destination_log_index':int(d['logIndex'],16),'source_rate':sr,'destination_rate':dr,'rate_edge_raw':dr-sr,'delivered_after_update':dt>=c['update_time'],'actual_extra_base_raw':c['shares']*max(0,dr-sr)//c['one']})
              results.append(x)
            except Exception as e:errors.append({'candidate':c,'error':repr(e)})
          positive=[x for x in results if x.get('delivery_found') and x.get('delivered_after_update') and x.get('rate_edge_raw',0)>0]
          out={'generated_at_unix':int(time.time()),'ethereum_rpc':eth,'scroll_rpc':scroll,'rpc_failures':{'ethereum':eth_fail,'scroll':scroll_fail},'candidate_count':len(CANDIDATES),'resolved_count':len(results),'delivery_found_count':sum(1 for x in results if x.get('delivery_found')),'positive_delayed_count':len(positive),'sum_actual_extra_by_product':{p:sum(x.get('actual_extra_base_raw',0) for x in positive if x['product']==p) for p in ['liquidETH','liquidUSD']},'results':results,'positive':positive,'errors':errors}
          Path('veda-inflight-delivery-correlation-v2.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps({k:out[k] for k in ['candidate_count','resolved_count','delivery_found_count','positive_delayed_count','sum_actual_extra_by_product']},indent=2));print('errors',len(errors))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veda-inflight-delivery-correlation-v2
          path: veda-inflight-delivery-correlation-v2.json
          if-no-files-found: error
          retention-days: 1
