name: veda-inflight-delivery-correlation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve five historical in-flight candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,time,urllib.parse,urllib.request
          from pathlib import Path
          C=[
            {'product':'liquidETH','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','one':10**18,'guid':'0x8f0a7530f2f79932550e6335df60f0f4ca2de611e32168aae5651c81e057e9e1','source_block':30932878,'source_timestamp':1772234290,'update_time':1772234339,'shares':94011967841297},
            {'product':'liquidETH','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','one':10**18,'guid':'0x4fb116b702290d7876b522e50bd14528e9d0e96bed707038c5013fe1f50ed93e','source_block':31176489,'source_timestamp':1772580369,'update_time':1772581643,'shares':130424307382454028},
            {'product':'liquidUSD','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','one':10**6,'guid':'0x2f0ccd504501ed1e96d259d201ad1e142a9312e0bc2975c4b8dff44727323d63','source_block':28912407,'source_timestamp':1769556275,'update_time':1769557547,'shares':286395633},
            {'product':'liquidUSD','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','one':10**6,'guid':'0xdbe4b87eee629f09d2c954cf1546470daa559bdf478993cd09d58817d954f537','source_block':30563082,'source_timestamp':1771718078,'update_time':1771718159,'shares':8726353},
            {'product':'liquidUSD','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','one':10**6,'guid':'0x19cee498fcc7bd2c53466cb46da1380ff2217b82e85bd691ae6057fb827a6904','source_block':33168221,'source_timestamp':1775519587,'update_time':1775519843,'shares':766122},
          ]
          ETH_API='https://eth.blockscout.com/api';ETH_RPCS=['https://ethereum-rpc.publicnode.com','https://eth.drpc.org','https://rpc.mevblocker.io'];SCROLL_RPCS=['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']
          def k(s):return subprocess.check_output(['cast','keccak',s],text=True).strip().lower()
          def sig(s):return subprocess.check_output(['cast','sig',s],text=True).strip().lower()
          RECEIVED=k('MessageReceived(bytes32,uint256,address)');GET_RATE=sig('getRate()')
          def get(url,retries=4):
            last=None
            for i in range(retries):
              try:
                req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'Mozilla/5.0 VedaResearch/9.0'})
                with urllib.request.urlopen(req,timeout=55) as r:return json.loads(r.read().decode())
              except Exception as e:last=e;time.sleep(.25*(i+1))
            raise last
          def rpc(url,m,p,timeout=45):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(url,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-inflight-correlation/1'})
            with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
            if 'error'in o:raise RuntimeError(o['error'])
            return o['result']
          def choose(cands,cid):
            bad={}
            for u in cands:
              try:
                if int(rpc(u,'eth_chainId',[]),16)!=cid:raise RuntimeError('wrong chain')
                return u,bad
              except Exception as e:bad[u]=repr(e)
            raise RuntimeError(bad)
          eth,ebad=choose(ETH_RPCS,1);scroll,sbad=choose(SCROLL_RPCS,534352);latest=int(rpc(eth,'eth_blockNumber',[]),16);bcache={}
          def bts(n):
            if n not in bcache:bcache[n]=int(rpc(eth,'eth_getBlockByNumber',[hex(n),False])['timestamp'],16)
            return bcache[n]
          def before(t):
            lo=1;hi=latest
            while lo<hi:
              mid=(lo+hi+1)//2
              if bts(mid)<=t:lo=mid
              else:hi=mid-1
            return lo
          def legacy(address,guid,lo,hi):
            q={'module':'logs','action':'getLogs','fromBlock':str(lo),'toBlock':str(hi),'address':address,'topic0':RECEIVED,'topic1':guid,'topic0_1_opr':'and'};d=get(ETH_API+'?'+urllib.parse.urlencode(q));r=d.get('result')
            if isinstance(r,list):return r
            if 'No logs found' in (str(d.get('message'))+' '+str(r)):return []
            raise RuntimeError(d)
          def num(v):
            s=str(v or'0');return int(s,16) if s.startswith('0x') else int(s)
          def rate(url,a,b):return int(rpc(url,'eth_call',[{'to':a,'data':GET_RATE},hex(b)]),16)
          results=[];errors=[]
          for c in C:
            try:
              anchor=before(c['update_time']);rows=[]
              for lo in range(max(1,anchor-200),min(latest,anchor+8000)+1,1600):
                rows.extend(legacy(c['teller'],c['guid'],lo,min(latest,lo+1599)))
                if rows:break
              x=dict(c);x['ethereum_anchor_block']=anchor;x['delivery_found']=bool(rows)
              if rows:
                r=rows[0];db=num(r['blockNumber']);dt=bts(db);sr=rate(scroll,c['accountant'],c['source_block']);dr=rate(eth,c['accountant'],db);x.update({'destination_block':db,'destination_timestamp':dt,'destination_tx':r.get('transactionHash'),'source_rate':sr,'destination_rate':dr,'rate_edge_raw':dr-sr,'delivered_after_update':dt>=c['update_time'],'actual_extra_base_raw':c['shares']*max(0,dr-sr)//c['one']})
              results.append(x)
            except Exception as e:errors.append({'candidate':c,'error':repr(e)})
          positive=[x for x in results if x.get('delivery_found') and x.get('delivered_after_update') and x.get('rate_edge_raw',0)>0]
          out={'generated_at_unix':int(time.time()),'rpc_failures':{'ethereum':ebad,'scroll':sbad},'candidate_count':len(C),'delivery_found_count':sum(1 for x in results if x.get('delivery_found')),'positive_delayed_count':len(positive),'sum_actual_extra_by_product':{p:sum(x.get('actual_extra_base_raw',0) for x in positive if x['product']==p) for p in ['liquidETH','liquidUSD']},'results':results,'positive':positive,'errors':errors}
          Path('veda-inflight-delivery-correlation.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps({k:out[k] for k in ['candidate_count','delivery_found_count','positive_delayed_count','sum_actual_extra_by_product']},indent=2));print('errors',len(errors))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veda-inflight-delivery-correlation
          path: veda-inflight-delivery-correlation.json
          if-no-files-found: error
          retention-days: 1
