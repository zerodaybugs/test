name: veda-ink-pauser-surface

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify every Ink Pauser capability and sender mapping
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.parse, urllib.request, traceback
          RPCS=["https://rpc-gel.inkonchain.com","https://rpc-qnd.inkonchain.com","https://ink.drpc.org"]
          ATTACKER="0x1111111111111111111111111111111111111111";ZERO="0x0000000000000000000000000000000000000000"
          PRODUCTS={
            "balanced":{"pauser":"0x3C72F147CA6200dfAFe6d8D4e808ccC4bB612C54","authority":"0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B","teller":"0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC","accountant":"0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67","queue":"0x4c433Ed6d57316170565D7Fedc11a841832cDc3d"},
            "boosted":{"pauser":"0x4B0B3164B6731ACd96e29F13bF6c112204d5f024","authority":"0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77","teller":"0xc46f2443b3521632E2E2a903D6da8f965B46f6a0","accountant":"0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9","queue":"0x406E63323EF5d39D41C6fD895Ef9665AF926184c"},
          }
          EVENT="SenderToPausableUpdated(address,address)"
          def rpc(ep,m,p,t=35):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();q=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json","user-agent":"veda-ink-pauser/1.0"})
            with urllib.request.urlopen(q,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          def choose():
            bad={}
            for ep in RPCS:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==57073:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def run(*a):
            p=subprocess.run([str(x) for x in a],text=True,capture_output=True);return {"ok":p.returncode==0,"stdout":p.stdout.strip(),"stderr":p.stderr.strip(),"returncode":p.returncode}
          def sig(s):return run("cast","sig",s)["stdout"].lower()
          def topic(s):return run("cast","keccak",s)["stdout"].lower()
          def calldata(s,*a):return run("cast","calldata",s,*a)["stdout"]
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def addr(x):return "0x"+st(x)[-40:].lower()
          def boolean(x):return bool(int(x,16))
          def call(ep,to,data,frm=None):
            tx={"to":to,"data":data}
            if frm:tx["from"]=frm
            return rpc(ep,"eth_call",[tx,"latest"])
          def safe(ep,to,data,frm=None):
            try:return {"ok":True,"raw":call(ep,to,data,frm)}
            except Exception as e:return {"ok":False,"error":repr(e)}
          def gate(ep,auth,caller,target,sel):return {"canCall":boolean(call(ep,auth,CAN+aw(caller)+aw(target)+sw(sel))),"public":boolean(call(ep,auth,PUB+aw(target)+sw(sel)))}
          def routescan_logs(pauser):
            p=urllib.parse.urlencode({"module":"logs","action":"getLogs","address":pauser,"fromBlock":0,"toBlock":"latest","topic0":topic(EVENT),"page":1,"offset":1000})
            q=urllib.request.Request(f"https://api.routescan.io/v2/network/mainnet/evm/57073/etherscan/api?{p}",headers={"accept":"application/json","user-agent":"veda-ink-pauser/1.0"})
            with urllib.request.urlopen(q,timeout=45) as r:d=json.loads(r.read().decode())
            return [] if isinstance(d.get("result"),str) else (d.get("result") or [])
          CAN=sig("canCall(address,address,bytes4)");PUB=sig("isCapabilityPublic(address,bytes4)")
          FUNCS={
            "addPausable":"addPausable(address)","removePausable":"removePausable(uint256)","updateSender":"updateSenderToPausable(address,address)",
            "pauseSingle":"pauseSingle(address)","unpauseSingle":"unpauseSingle(address)","pauseMultiple":"pauseMultiple(address[])","unpauseMultiple":"unpauseMultiple(address[])",
            "pauseAll":"pauseAll()","unpauseAll":"unpauseAll()","senderPause":"senderPause()","senderUnpause":"senderUnpause()",
            "setAuthority":"setAuthority(address)","transferOwnership":"transferOwnership(address)"}
          SEL={n:sig(s) for n,s in FUNCS.items()}
          ep,bad=choose();block=int(rpc(ep,"eth_blockNumber",[]),16);out={"generated_at_unix":int(time.time()),"block":block,"endpoint":ep,"rpc_failures":bad,"products":{},"flags":[],"errors":[]}
          for name,p in PRODUCTS.items():
            row={"addresses":p,"gates":{},"probes":{},"sender_mappings":{},"events":[]}
            try:
              row["owner"]=addr(call(ep,p["pauser"],sig("owner()")));row["pauser_authority"]=addr(call(ep,p["pauser"],sig("authority()")))
              row["pausables_raw"]=safe(ep,p["pauser"],sig("getPausables()"))
              for fn,sel in SEL.items():row["gates"][fn]=gate(ep,p["authority"],ATTACKER,p["pauser"],sel)
              for who in (ATTACKER,ZERO,p["teller"],p["accountant"],p["queue"],row["owner"]):row["sender_mappings"][who.lower()]=addr(call(ep,p["pauser"],sig("senderToPausable(address)")+aw(who)))
              logs=routescan_logs(p["pauser"])
              for l in logs:
                ts=l.get("topics") or []
                if len(ts)>=3:
                  sender=addr(ts[1]);pausable=addr(ts[2]);row["events"].append({"sender":sender,"pausable":pausable,"block":int(l.get("blockNumber","0x0"),16),"sender_code_bytes":len(st(rpc(ep,"eth_getCode",[sender,"latest"])))//2})
              row["probes"]["attacker_senderPause"]=safe(ep,p["pauser"],calldata("senderPause()"),ATTACKER)
              row["probes"]["attacker_senderUnpause"]=safe(ep,p["pauser"],calldata("senderUnpause()"),ATTACKER)
              row["probes"]["attacker_pauseSingle_teller"]=safe(ep,p["pauser"],calldata("pauseSingle(address)",p["teller"]),ATTACKER)
              row["probes"]["attacker_unpauseSingle_teller"]=safe(ep,p["pauser"],calldata("unpauseSingle(address)",p["teller"]),ATTACKER)
              for fn in ("pauseSingle","unpauseSingle","pauseMultiple","unpauseMultiple","pauseAll","unpauseAll","updateSender"):
                if row["gates"][fn]["canCall"]:out["flags"].append({"type":"ATTACKER_PAUSER_CAPABILITY","product":name,"function":fn})
              for ev in row["events"]:
                if ev["sender_code_bytes"]==0 and ev["sender"]!=ZERO:out["flags"].append({"type":"PRECONFIGURED_CODELESS_SENDER","product":name,"event":ev})
            except Exception as e:
              row["error"]=repr(e);row["traceback"]=traceback.format_exc();out["errors"].append({"product":name,"error":repr(e)})
            out["products"][name]=row
          with open("veda-ink-pauser-surface.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"flags":out["flags"],"errors":out["errors"],"products":{p:{"owner":r.get("owner"),"gates":r.get("gates"),"sender_mappings":r.get("sender_mappings"),"events":r.get("events"),"probes":{k:v.get("ok") for k,v in r.get("probes",{}).items()}} for p,r in out["products"].items()}},indent=2,sort_keys=True))
          PY
      - name: Upload Ink Pauser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-ink-pauser-surface
          path: veda-ink-pauser-surface.json
          if-no-files-found: error
          retention-days: 1
