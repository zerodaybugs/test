name: veda-ink-stale-role-matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Query old and current Ink component capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          RPCS=["https://rpc-gel.inkonchain.com","https://rpc-qnd.inkonchain.com","https://ink.drpc.org"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          ASSETS={
            "USDC":"0x2D270e6886d130d724215a266106e6832161EAEd",
            "USDT0":"0x0200C29006150606B650577BBE7B6248F58470c1",
          }
          PRODUCTS={
            "balanced":{
              "vault":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f",
              "authority":"0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B",
              "old_accountant":"0x727929AF06Fa4f6E96cbC3fF7F4b60A65E168e23",
              "new_accountant":"0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67",
              "old_teller":"0x1d8016AEdE8Bd0143C311Bb28CCdd8af8a245df9",
              "new_teller":"0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC",
              "old_queue":"0xF13d0670Ad2FD78e404a52Da45c6af1df7AD33DD",
              "new_queue":"0x4c433Ed6d57316170565D7Fedc11a841832cDc3d",
              "old_solver":"0x3B4699871d2f4C8A810671DDdB905dFAB09b3e8c",
              "new_solver":"0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6",
            },
            "boosted":{
              "vault":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271",
              "authority":"0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77",
              "old_accountant":"0x62A88Bea6fe527b5DEfAA103A3f8b5010205aF92",
              "new_accountant":"0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9",
              "old_teller":"0x4E0292caa97128e35a695dCd53c465E56F69c3A0",
              "new_teller":"0xc46f2443b3521632E2E2a903D6da8f965B46f6a0",
              "old_queue":"0x359Db9A866c1276a571b3A9FbbBc47ED1F945E71",
              "new_queue":"0x406E63323EF5d39D41C6fD895Ef9665AF926184c",
              "old_solver":"0xde2519e53BE8DC8d87638e790DfCe20a74bc187e",
              "new_solver":"0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF",
            },
          }

          def request(ep,method,params,timeout=35):
            payload=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
            req=urllib.request.Request(ep,data=payload,method="POST",headers={"content-type":"application/json","user-agent":"veda-ink-stale-role/1.0"})
            with urllib.request.urlopen(req,timeout=timeout) as response:
              result=json.loads(response.read().decode())
            if "error" in result: raise RuntimeError(result["error"])
            return result["result"]
          failures={}; endpoint=None
          for candidate in RPCS:
            try:
              if int(request(candidate,"eth_chainId",[]),16)==57073:
                endpoint=candidate; break
            except Exception as exc: failures[candidate]=repr(exc)
          if endpoint is None: raise RuntimeError(failures)

          def sig(text): return subprocess.check_output(["cast","sig",text],text=True).strip()
          def strip0(value): return value[2:] if value.startswith("0x") else value
          def aw(address): return strip0(address).lower().rjust(64,"0")
          def sw(selector): return strip0(selector).lower().ljust(64,"0")
          def call(target,data,block,frm=None):
            tx={"to":target,"data":data}
            if frm: tx["from"]=frm
            try: return {"result":request(endpoint,"eth_call",[tx,block])}
            except Exception as exc: return {"error":repr(exc)}
          def uint(raw): return int(raw,16) if isinstance(raw,str) else None
          def boolean(raw): return bool(int(raw,16)) if isinstance(raw,str) else None
          def address(raw): return "0x"+strip0(raw)[-40:] if isinstance(raw,str) and len(strip0(raw))>=40 else None
          def words(raw):
            if not isinstance(raw,str): return None
            value=strip0(raw)
            return [int(value[i:i+64],16) for i in range(0,len(value),64)] if value else []
          def dynamic_bytes32(raw):
            if not isinstance(raw,str): return []
            value=strip0(raw)
            if len(value)<128:return []
            offset=int(value[:64],16)*2
            length=int(value[offset:offset+64],16)
            start=offset+64
            return ["0x"+value[start+i*64:start+(i+1)*64] for i in range(length)]
          def has_push4(code,selector):
            return ("63"+strip0(selector).lower()) in strip0(code).lower()

          S={
            "authority":sig("authority()"),"owner":sig("owner()"),"vault":sig("vault()"),"accountant":sig("accountant()"),
            "boringVault":sig("boringVault()"),"ONE_SHARE":sig("ONE_SHARE()"),"isPaused":sig("isPaused()"),
            "getRequestIds":sig("getRequestIds()"),"getUserRoles":sig("getUserRoles(address)"),
            "balanceOf":sig("balanceOf(address)"),"totalSupply":sig("totalSupply()"),"getRateSafe":sig("getRateSafe()"),
            "enter":sig("enter(address,address,uint256,address,uint256)"),"exit":sig("exit(address,address,uint256,address,uint256)"),
            "bulkDeposit":sig("bulkDeposit(address,uint256,uint256,address)"),"bulkWithdraw":sig("bulkWithdraw(address,uint256,uint256,address)"),
            "queueRequest":sig("requestOnChainWithdraw(address,uint128,uint16,uint24)"),
            "queueRequestPermit":sig("requestOnChainWithdrawWithPermit(address,uint128,uint16,uint24,uint256,uint8,bytes32,bytes32)"),
            "queueCancel":sig("cancelOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24))"),
            "queueReplace":sig("replaceOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24),uint16,uint24)"),
            "queueSolve":sig("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),
            "boringSolve":sig("boringSolve(address,address,address,uint256,uint256,bytes)"),
            "rescueSolver":sig("rescueTokens(address,uint256)"),
            "rescueQueue":sig("rescueTokens(address,uint256,address,(uint96,address,address,uint128,uint128,uint40,uint24,uint24)[])"),
            "adminRedeemWithQueue":sig("boringRedeemSolve(address,(uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address)"),
            "adminRedeemNoQueue":sig("boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address)"),
            "adminRedeemNoQueueDeficit":sig("boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,bool)"),
            "adminMintWithQueue":sig("boringRedeemMintSolve(address,(uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address)"),
            "adminMintNoQueue":sig("boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address)"),
            "adminMintNoQueueDeficit":sig("boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address,bool)"),
            "selfRedeemWithQueue":sig("boringRedeemSelfSolve(address,(uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
            "selfRedeemNoQueue":sig("boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
            "selfMintWithQueue":sig("boringRedeemMintSelfSolve(address,(uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
            "selfMintNoQueue":sig("boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
          }
          PUBLIC="0x2f47571f"; CAN="0xb7009613"
          block=request(endpoint,"eth_blockNumber",[])
          out={"queried_at_unix":int(time.time()),"endpoint":endpoint,"block":int(block,16),"selectors":S,"products":{}}

          def public(auth,target,selector):
            r=call(auth,PUBLIC+aw(target)+sw(selector),block)
            return boolean(r.get("result")) if "result" in r else r
          def can(auth,user,target,selector):
            r=call(auth,CAN+aw(user)+aw(target)+sw(selector),block)
            return boolean(r.get("result")) if "result" in r else r
          def role_bitmap(auth,user):
            r=call(auth,S["getUserRoles"]+aw(user),block)
            return uint(r.get("result")) if "result" in r else r
          def component_state(name,target,auth):
            code=request(endpoint,"eth_getCode",[target,block])
            state={"address":target.lower(),"code_bytes":max(0,(len(code)-2)//2),"user_roles":role_bitmap(auth,target),"selectors_present":{key:has_push4(code,selector) for key,selector in S.items()}}
            for getter in ["authority","owner","vault","accountant","boringVault","ONE_SHARE","isPaused","getRequestIds","totalSupply","getRateSafe"]:
              r=call(target,S[getter],block)
              if "result" not in r: continue
              if getter in ["authority","owner","vault","accountant","boringVault"]: state[getter]=address(r["result"])
              elif getter=="getRequestIds": state[getter]=dynamic_bytes32(r["result"])
              elif getter=="isPaused": state[getter]=boolean(r["result"])
              else: state[getter]=uint(r["result"])
            state["balances"]={}
            for asset_name,asset in {**ASSETS,"vault_share":PRODUCTS[name]["vault"]}.items():
              r=call(asset,S["balanceOf"]+aw(target),block)
              state["balances"][asset_name]=uint(r.get("result")) if "result" in r else r
            return state

          SOLVER_SELECTORS=["boringSolve","rescueSolver","adminRedeemWithQueue","adminRedeemNoQueue","adminRedeemNoQueueDeficit","adminMintWithQueue","adminMintNoQueue","adminMintNoQueueDeficit","selfRedeemWithQueue","selfRedeemNoQueue","selfMintWithQueue","selfMintNoQueue"]
          QUEUE_SELECTORS=["queueRequest","queueRequestPermit","queueCancel","queueReplace","queueSolve","rescueQueue"]

          for product,addresses in PRODUCTS.items():
            auth=addresses["authority"]
            p={"addresses":{k:v.lower() for k,v in addresses.items()},"components":{},"capabilities":{},"cross_rights":{}}
            for key in ["vault","old_accountant","new_accountant","old_teller","new_teller","old_queue","new_queue","old_solver","new_solver"]:
              p["components"][key]=component_state(product,addresses[key],auth)

            for solver_key in ["old_solver","new_solver"]:
              solver=addresses[solver_key]
              p["capabilities"][solver_key]={}
              for selector_name in SOLVER_SELECTORS:
                selector=S[selector_name]
                p["capabilities"][solver_key][selector_name]={
                  "present":p["components"][solver_key]["selectors_present"][selector_name],
                  "public":public(auth,solver,selector),
                  "attacker_can_call":can(auth,ATTACKER,solver,selector),
                  "old_queue_can_call":can(auth,addresses["old_queue"],solver,selector),
                  "new_queue_can_call":can(auth,addresses["new_queue"],solver,selector),
                }
            for queue_key in ["old_queue","new_queue"]:
              queue=addresses[queue_key]
              p["capabilities"][queue_key]={}
              for selector_name in QUEUE_SELECTORS:
                selector=S[selector_name]
                p["capabilities"][queue_key][selector_name]={
                  "present":p["components"][queue_key]["selectors_present"][selector_name],
                  "public":public(auth,queue,selector),
                  "attacker_can_call":can(auth,ATTACKER,queue,selector),
                  "old_solver_can_call":can(auth,addresses["old_solver"],queue,selector),
                  "new_solver_can_call":can(auth,addresses["new_solver"],queue,selector),
                }

            for actor_key in ["old_solver","new_solver","old_queue","new_queue","old_teller","new_teller"]:
              actor=addresses[actor_key]
              p["cross_rights"][actor_key]={}
              for teller_key in ["old_teller","new_teller"]:
                teller=addresses[teller_key]
                p["cross_rights"][actor_key][teller_key]={
                  "bulk_deposit":can(auth,actor,teller,S["bulkDeposit"]),
                  "bulk_withdraw":can(auth,actor,teller,S["bulkWithdraw"]),
                }
              p["cross_rights"][actor_key]["vault"]={
                "enter":can(auth,actor,addresses["vault"],S["enter"]),
                "exit":can(auth,actor,addresses["vault"],S["exit"]),
              }
            out["products"][product]=p

          with open("veda-ink-stale-role-matrix.json","w",encoding="utf-8") as handle:
            json.dump(out,handle,indent=2,sort_keys=True);handle.write("\n")
          summary={}
          for product,p in out["products"].items():
            summary[product]={
              "old_component_roles":{key:p["components"][key]["user_roles"] for key in ["old_teller","old_queue","old_solver"]},
              "old_queue_requests":p["components"]["old_queue"].get("getRequestIds",[]),
              "old_queue_share_balance":p["components"]["old_queue"]["balances"]["vault_share"],
              "old_solver_balances":p["components"]["old_solver"]["balances"],
              "old_solver_boring_solve":p["capabilities"]["old_solver"]["boringSolve"],
              "old_solver_rights":p["cross_rights"]["old_solver"],
              "old_teller_vault_rights":p["cross_rights"]["old_teller"]["vault"],
            }
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Upload stale-role matrix
        uses: actions/upload-artifact@v4
        with:
          name: veda-ink-stale-role-matrix
          path: veda-ink-stale-role-matrix.json
          if-no-files-found: error
          retention-days: 1
