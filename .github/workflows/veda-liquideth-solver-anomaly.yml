name: veda-liquideth-solver-anomaly

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect solver, owner, authority, queue and balances
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          RPCS=["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com"]
          ADDR={
            "vault":"0xf0bb20865277abd641a307ece5ee04e79073416c",
            "accountant":"0x0d05d94a5f1e76c18fbeB7A13d17C8a314088198",
            "teller":"0x9aa79c84b79816ab920bbce20f8f74557b514734",
            "queue":"0x0d2df071207e18ca8638b4f04e98c53155ec2ce0",
            "solver":"0xe3f8fa039ff7a8fe42fa2c6e9dc8565ece6f7042",
            "common_authority":"0x485bde66bb668a51f2372e34e45b1c6226798122",
            "WETH":"0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2",
            "eETH":"0x35fa164735182de50811e8e2e824cfb9b6118ac2",
            "weETH":"0xcd5fe23c85820f7b72d0926fc9b05b43e359b7ee",
          }
          TEST="0x1111111111111111111111111111111111111111"
          ZERO="0x0000000000000000000000000000000000000000"
          SENTINEL="0x0000000000000000000000000000000000000001"

          def sig(s):return subprocess.check_output(["cast","sig",s],text=True).strip().lower()
          S={s:sig(s) for s in [
            "owner()","authority()","pendingOwner()","queue()","vault()","accountant()","boringVault()","getRequestIds()",
            "getUserRoles(address)","getRolesWithCapability(address,bytes4)","isCapabilityPublic(address,bytes4)","canCall(address,address,bytes4)",
            "getOwners()","getThreshold()","getModulesPaginated(address,uint256)","getGuard()","getFallbackHandler()",
            "balanceOf(address)","totalSupply()","boringSolve(address,address,address,uint256,uint256,bytes)",
            "boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address)",
            "boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address)",
            "boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)",
            "boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)",
            "rescueTokens(address,uint256)","bulkDeposit(address,uint256,uint256,address)","bulkWithdraw(address,uint256,uint256,address)",
            "solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)",
            "manage(address,bytes,uint256)","execute(address,uint256,bytes)","execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes)",
            "multicall(bytes[])","bundle(address[],bytes[],uint256[])"
          ]}

          def req(ep,m,p,timeout=25):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode()
            q=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-solver-anomaly/1.0"})
            with urllib.request.urlopen(q,timeout=timeout) as r:d=json.loads(r.read().decode())
            if "error" in d:raise RuntimeError(d["error"])
            return d["result"]
          def choose():
            errs={}
            for ep in RPCS:
              try:
                if int(req(ep,"eth_chainId",[]),16)==1:return ep,errs
              except Exception as e:errs[ep]=repr(e)
            raise RuntimeError(errs)
          def strip(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return strip(a).lower().rjust(64,"0")
          def b4(s):return strip(s).lower().ljust(64,"0")
          def uw(n):return hex(n)[2:].rjust(64,"0")
          def call(ep,to,data):return req(ep,"eth_call",[{"to":to,"data":data},"latest"])
          def addr(raw):return None if raw in (None,"0x") else "0x"+strip(raw)[-40:]
          def uint(raw):return None if raw in (None,"0x") else int(raw,16)
          def boolv(raw):
            v=uint(raw);return None if v is None else bool(v)
          def push4(code):
            x=strip(code);o=set();i=0
            while i+10<=len(x):
              if x[i:i+2].lower()=="63":o.add("0x"+x[i+2:i+10].lower());i+=10
              else:i+=2
            return sorted(o)
          def decode_addr_array(raw):
            x=strip(raw)
            try:
              off=int(x[:64],16)*2;n=int(x[off:off+64],16)
              return ["0x"+x[off+64+i*64:off+64+(i+1)*64][-40:] for i in range(n)]
            except Exception:return []
          def decode_modules(raw):
            x=strip(raw)
            try:
              off=int(x[:64],16)*2; nxt="0x"+x[64:128][-40:]; n=int(x[off:off+64],16)
              mods=["0x"+x[off+64+i*64:off+64+(i+1)*64][-40:] for i in range(n)]
              return {"modules":mods,"next":nxt}
            except Exception as e:return {"raw":raw,"error":repr(e)}

          ep,rpc_errors=choose(); out={"generated_at_unix":int(time.time()),"endpoint":ep,"rpc_errors":rpc_errors,"block":int(req(ep,"eth_blockNumber",[]),16),"addresses":ADDR,"selectors":S}
          solver=ADDR["solver"]
          solver_code=req(ep,"eth_getCode",[solver,"latest"]); solver_push=push4(solver_code)
          out["solver"]={"code_bytes":len(strip(solver_code))//2,"push4":solver_push,"probes":{},"balances":{},"gates":{}}
          for fn in ("owner()","authority()","queue()","vault()","accountant()","boringVault()"):
            try:out["solver"]["probes"][fn]=addr(call(ep,solver,S[fn]))
            except Exception as e:out["solver"]["probes"][fn]={"error":repr(e)}
          owner=out["solver"]["probes"].get("owner()")
          auth=out["solver"]["probes"].get("authority()")
          for name,token in {"vault_share":ADDR["vault"],"WETH":ADDR["WETH"],"eETH":ADDR["eETH"],"weETH":ADDR["weETH"]}.items():
            try:out["solver"]["balances"][name]=uint(call(ep,token,S["balanceOf(address)"]+aw(solver)))
            except Exception as e:out["solver"]["balances"][name]={"error":repr(e)}
          try:out["queue_request_ids_raw"]=call(ep,ADDR["queue"],S["getRequestIds()"])
          except Exception as e:out["queue_request_ids_raw"]={"error":repr(e)}

          gate_sigs=[
            "boringSolve(address,address,address,uint256,uint256,bytes)",
            "boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address)",
            "boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address)",
            "boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)",
            "boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)",
            "rescueTokens(address,uint256)"
          ]
          if isinstance(auth,str):
            for signature in gate_sigs:
              sel=S[signature]
              item={"selector":sel}
              for who_name,who in {"attacker":TEST,"queue":ADDR["queue"],"solver":solver,"owner":owner if isinstance(owner,str) else ZERO}.items():
                try:item[who_name]=boolv(call(ep,auth,S["canCall(address,address,bytes4)"]+aw(who)+aw(solver)+b4(sel)))
                except Exception as e:item[who_name]={"error":repr(e)}
              try:item["public"]=boolv(call(ep,auth,S["isCapabilityPublic(address,bytes4)"]+aw(solver)+b4(sel)))
              except Exception as e:item["public"]={"error":repr(e)}
              try:item["roles_mask"]=uint(call(ep,auth,S["getRolesWithCapability(address,bytes4)"]+aw(solver)+b4(sel)))
              except Exception as e:item["roles_mask"]={"error":repr(e)}
              out["solver"]["gates"][signature]=item
            try:out["solver"]["roles"]={n:uint(call(ep,auth,S["getUserRoles(address)"]+aw(a))) for n,a in {"solver":solver,"queue":ADDR["queue"],"owner":owner if isinstance(owner,str) else ZERO,"attacker":TEST}.items()}
            except Exception as e:out["solver"]["roles_error"]=repr(e)

          for name,target,selector in [
            ("solver_bulkDeposit",ADDR["teller"],S["bulkDeposit(address,uint256,uint256,address)"]),
            ("solver_bulkWithdraw",ADDR["teller"],S["bulkWithdraw(address,uint256,uint256,address)"]),
            ("solver_queueSolve",ADDR["queue"],S["solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"])
          ]:
            for authority_name,authority in {"solver_authority":auth,"common_authority":ADDR["common_authority"]}.items():
              if not isinstance(authority,str):continue
              try:out.setdefault("cross_gates",{}).setdefault(name,{})[authority_name]=boolv(call(ep,authority,S["canCall(address,address,bytes4)"]+aw(solver)+aw(target)+b4(selector)))
              except Exception as e:out.setdefault("cross_gates",{}).setdefault(name,{})[authority_name]={"error":repr(e)}

          nodes=[]
          if isinstance(owner,str) and owner.lower()!=ZERO:nodes.append(owner.lower())
          if isinstance(auth,str) and auth.lower()!=ZERO:nodes.append(auth.lower())
          seen=set();out["owner_graph"]={}
          while nodes:
            a=nodes.pop(0)
            if a in seen:continue
            seen.add(a);code=req(ep,"eth_getCode",[a,"latest"]);selectors=push4(code);node={"address":a,"code_bytes":len(strip(code))//2,"push4":selectors,"probes":{},"arbitrary":{}}
            for fn in ("owner()","authority()","pendingOwner()","getGuard()","getFallbackHandler()"):
              try:node["probes"][fn]=addr(call(ep,a,S[fn]))
              except Exception:pass
            for fn in ("getThreshold()",):
              try:node["probes"][fn]=uint(call(ep,a,S[fn]))
              except Exception:pass
            try:node["probes"]["getOwners()"]=decode_addr_array(call(ep,a,S["getOwners()"]));nodes.extend(x.lower() for x in node["probes"]["getOwners()"] if x.lower()!=ZERO)
            except Exception:pass
            try:node["probes"]["modules"]=decode_modules(call(ep,a,S["getModulesPaginated(address,uint256)"]+aw(SENTINEL)+uw(100)));nodes.extend(x.lower() for x in node["probes"]["modules"].get("modules",[]) if x.lower()!=ZERO)
            except Exception:pass
            for fn in ("manage(address,bytes,uint256)","execute(address,uint256,bytes)","execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes)","multicall(bytes[])","bundle(address[],bytes[],uint256[])"):
              node["arbitrary"][fn]=S[fn] in selectors
            out["owner_graph"][a]=node
            for fn in ("owner()","authority()","pendingOwner()"):
              x=node["probes"].get(fn)
              if isinstance(x,str) and x.lower() not in (ZERO,a):nodes.append(x.lower())

          out["flags"]=[]
          if any(v not in (0,{"error":""}) for v in out["solver"]["balances"].values() if isinstance(v,int)):
            out["flags"].append("SOLVER_HAS_BALANCE")
          if out.get("cross_gates",{}).get("solver_bulkWithdraw",{}).get("common_authority") is True:
            out["flags"].append("SOLVER_CAN_WITHDRAW_CURRENT_TELLER")
          for a,n in out["owner_graph"].items():
            mods=n["probes"].get("modules",{}).get("modules",[]) if isinstance(n["probes"].get("modules"),dict) else []
            if mods:out["flags"].append({"SAFE_OR_MODULES":a,"modules":mods})
          with open("veda-liquideth-solver-anomaly.json","w") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"block":out["block"],"solver":out["solver"],"cross_gates":out.get("cross_gates"),"owner_graph":out["owner_graph"],"flags":out["flags"]},indent=2,sort_keys=True))
          PY
      - name: Upload anomaly evidence
        uses: actions/upload-artifact@v4
        with:
          name: veda-liquideth-solver-anomaly
          path: veda-liquideth-solver-anomaly.json
          if-no-files-found: error
          retention-days: 1
