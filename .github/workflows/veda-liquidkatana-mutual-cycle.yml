name: veda-liquidkatana-mutual-cycle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect live LiquidETH and LiquidKatanaETH mutual collateral surface
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,subprocess,time,traceback,urllib.request
          RPCS=["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          VAULTS={"liquidETH":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","liquidKatanaETH":"0x69d210d3b60E939bfa6e87cccc4fab7e8f44c16b"}
          def rpc(ep,m,p,t=30):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();q=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json","user-agent":"veda-liquidkatana-mutual-cycle/2.0"})
            with urllib.request.urlopen(q,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError({"method":m,"error":o["error"]})
            return o["result"]
          def pick():
            bad={}
            for ep in RPCS:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==1:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def sig(s):return subprocess.check_output(["cast","sig",s],text=True).strip()
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def ws(x):h=st(x);return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h else []
          def addr(x):
            h=st(x);return None if len(h)<40 else "0x"+h[-40:]
          S={"authority":sig("authority()"),"hook":sig("hook()"),"accountant":sig("accountant()"),"assetData":sig("assetData(address)"),"rateProviderData":sig("rateProviderData(address)"),"quote":sig("getRateInQuoteSafe(address)"),"balanceOf":sig("balanceOf(address)"),"rate":sig("getRate()"),"supply":sig("totalSupply()"),"deposit3":sig("deposit(address,uint256,uint256)"),"deposit4":sig("deposit(address,uint256,uint256,address)"),"deposit5":sig("deposit(address,uint256,uint256,address,address)")}
          PUB=sig("isCapabilityPublic(address,bytes4)");CAN=sig("canCall(address,address,bytes4)")
          out={"generated_at_unix":int(time.time()),"vaults":{},"directions":{},"flags":[],"errors":[]}
          try:
            ep,bad=pick();block=rpc(ep,"eth_blockNumber",[]);out.update({"block":int(block,16),"endpoint":ep,"rpc_failures":bad})
            def call(to,data):return rpc(ep,"eth_call",[{"to":to,"data":data},block])
            def safe(label,to,data):
              try:return call(to,data)
              except Exception as e:out["errors"].append({"label":label,"error":repr(e)});return None
            def gate(auth,target,sel):
              if not auth:return {"error":"missing authority"}
              try:return {"public":bool(int(call(auth,PUB+aw(target)+sw(sel)),16)),"attacker":bool(int(call(auth,CAN+aw(ATTACKER)+aw(target)+sw(sel)),16))}
              except Exception as e:return {"error":repr(e)}
            live={}
            for name,vault in VAULTS.items():
              vcode=rpc(ep,"eth_getCode",[vault,block]);hookraw=safe(name+".hook",vault,S["hook"]);hook=addr(hookraw) if hookraw else None;hcode=rpc(ep,"eth_getCode",[hook,block]) if hook else "0x"
              accountant_raw=safe(name+".accountant",hook,S["accountant"]) if hook and len(hcode)>2 else None;accountant=addr(accountant_raw) if accountant_raw else None;acode=rpc(ep,"eth_getCode",[accountant,block]) if accountant else "0x"
              auth_raw=safe(name+".authority",hook,S["authority"]) if hook and len(hcode)>2 else None;auth=addr(auth_raw) if auth_raw else None
              row={"vault":vault.lower(),"vault_code_bytes":len(st(vcode))//2,"hook":hook,"hook_code_bytes":len(st(hcode))//2,"accountant":accountant,"accountant_code_bytes":len(st(acode))//2,"authority":auth}
              if hook and accountant and len(hcode)>2 and len(acode)>2:
                r=safe(name+".rate",accountant,S["rate"]);s=safe(name+".supply",vault,S["supply"]);row["rate"]=int(r,16) if r else None;row["supply"]=int(s,16) if s else None;row["deposit_gates"]={k:gate(auth,hook,S[k]) for k in ("deposit3","deposit4","deposit5")}
                live[name]={"vault":vault,"teller":hook,"accountant":accountant,"authority":auth}
              out["vaults"][name]=row
            if len(live)==2:
              for src,dst in (("liquidETH","liquidKatanaETH"),("liquidKatanaETH","liquidETH")):
                s=live[src];d=live[dst];asset=d["vault"]
                adraw=safe(src+".assetData("+dst+")",s["teller"],S["assetData"]+aw(asset));rpraw=safe(src+".rateProvider("+dst+")",s["accountant"],S["rateProviderData"]+aw(asset));qraw=safe(src+".quote("+dst+")",s["accountant"],S["quote"]+aw(asset));braw=safe(src+".balance("+dst+")",asset,S["balanceOf"]+aw(s["vault"]));ad=ws(adraw) if adraw else [];rp=ws(rpraw) if rpraw else []
                gates=out["vaults"][src].get("deposit_gates",{});public_deposit=any(bool(g.get("attacker")) for g in gates.values())
                out["directions"][src+"_to_"+dst]={"asset":asset.lower(),"allow_deposit":bool(ad[0]) if ad else False,"allow_direct_withdraw":bool(ad[1]) if len(ad)>1 else False,"premium_bps":ad[2] if len(ad)>2 else None,"rate_provider_words":rp,"quote":int(qraw,16) if qraw else None,"source_vault_balance_of_destination_share":int(braw,16) if braw else None,"public_deposit":public_deposit}
              a=out["directions"]["liquidETH_to_liquidKatanaETH"];b=out["directions"]["liquidKatanaETH_to_liquidETH"]
              if a["allow_deposit"] and b["allow_deposit"] and a["public_deposit"] and b["public_deposit"]:out["flags"].append({"type":"PUBLIC_MUTUAL_VAULT_CYCLE","a":a,"b":b})
          except Exception as e:
            out["fatal_error"]=repr(e);out["traceback"]=traceback.format_exc()
          with open("veda-liquidkatana-mutual-cycle.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-liquidkatana-mutual-cycle
          path: veda-liquidkatana-mutual-cycle.json
          if-no-files-found: error
          retention-days: 1
