name: veda-liquidkatana-mutual-cycle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect LiquidETH and LiquidKatanaETH mutual collateral surface
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,time,urllib.request
          RPCS=["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          V={
            "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0"},
            "liquidKatanaETH":{"vault":"0x69d210d3b60E939bfa6e87cccc4fab7e8f44c16b","accountant":"0xFCb9a6bF02C43f9E38Bb102fd960Cc1e738e787d","teller":"0x739A1efFaDDB0b07ef1284598819232df4FD8d16","queue":"0x52E523B849c584F86bF460A3cF2962b118Ce2506"}}
          def rpc(ep,m,p,t=30):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();q=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json"});
            with urllib.request.urlopen(q,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          ep=next(e for e in RPCS if int(rpc(e,"eth_chainId",[]),16)==1); block=rpc(ep,"eth_blockNumber",[])
          def sig(s):return subprocess.check_output(["cast","sig",s],text=True).strip()
          def st(x):return x[2:] if x.startswith("0x") else x
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def ws(x):h=st(x);return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h else []
          def addr(x):return "0x"+st(x)[-40:]
          S={"authority":sig("authority()"),"hook":sig("hook()"),"assetData":sig("assetData(address)"),"rateProviderData":sig("rateProviderData(address)"),"quote":sig("getRateInQuoteSafe(address)"),"withdrawAssets":sig("withdrawAssets(address)"),"balanceOf":sig("balanceOf(address)"),"rate":sig("getRate()"),"supply":sig("totalSupply()"),"deposit3":sig("deposit(address,uint256,uint256)"),"deposit4":sig("deposit(address,uint256,uint256,address)"),"queueReq":sig("requestOnChainWithdraw(address,uint128,uint16,uint24)")}
          PUB=sig("isCapabilityPublic(address,bytes4)");CAN=sig("canCall(address,address,bytes4)")
          def call(to,data):return rpc(ep,"eth_call",[{"to":to,"data":data},block])
          def gate(auth,target,sel):return {"public":bool(int(call(auth,PUB+aw(target)+sw(sel)),16)),"attacker":bool(int(call(auth,CAN+aw(ATTACKER)+aw(target)+sw(sel)),16))}
          out={"block":int(block,16),"endpoint":ep,"vaults":{},"directions":{},"flags":[],"errors":[]}
          for n,p in V.items():
            a=addr(call(p["teller"],S["authority"]));qa=addr(call(p["queue"],S["authority"]));out["vaults"][n]={"hook":addr(call(p["vault"],S["hook"])),"authority":a,"queue_authority":qa,"rate":int(call(p["accountant"],S["rate"]),16),"supply":int(call(p["vault"],S["supply"]),16),"deposit3":gate(a,p["teller"],S["deposit3"]),"deposit4":gate(a,p["teller"],S["deposit4"]),"queue_request":gate(qa,p["queue"],S["queueReq"])}
          for src,dst in (("liquidETH","liquidKatanaETH"),("liquidKatanaETH","liquidETH")):
            s=V[src];d=V[dst];asset=d["vault"]
            def safe(label,to,data):
              try:return ws(call(to,data))
              except Exception as e:out["errors"].append({"label":label,"error":repr(e)});return []
            ad=safe(src+".assetData",s["teller"],S["assetData"]+aw(asset));rp=safe(src+".rateProvider",s["accountant"],S["rateProviderData"]+aw(asset));q=safe(src+".quote",s["accountant"],S["quote"]+aw(asset));w=safe(src+".withdraw",s["queue"],S["withdrawAssets"]+aw(asset));bal=int(call(asset,S["balanceOf"]+aw(s["vault"])),16)
            out["directions"][src+"_to_"+dst]={"asset":asset.lower(),"allow_deposit":bool(ad[0]) if ad else False,"allow_direct_withdraw":bool(ad[1]) if len(ad)>1 else False,"premium_bps":ad[2] if len(ad)>2 else None,"rate_provider":rp,"quote":q[0] if q else None,"allow_queue":bool(w[0]) if w else False,"queue_words":w,"balance":bal,"public_deposit":out["vaults"][src]["deposit3"]["attacker"] or out["vaults"][src]["deposit4"]["attacker"]}
          x=out["directions"];a=x["liquidETH_to_liquidKatanaETH"];b=x["liquidKatanaETH_to_liquidETH"]
          if a["allow_deposit"] and b["allow_deposit"] and a["public_deposit"] and b["public_deposit"]:out["flags"].append({"type":"PUBLIC_MUTUAL_VAULT_CYCLE","a":a,"b":b})
          with open("veda-liquidkatana-mutual-cycle.json","w") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: veda-liquidkatana-mutual-cycle
          path: veda-liquidkatana-mutual-cycle.json
          if-no-files-found: error
          retention-days: 1
