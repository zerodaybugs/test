                          "assets": {
                              "WBTC":"0x3C1BCa5a656e69edCD0D4E36BEbb3FcDAcA60Cf1",
                              "eBTC":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642",
                              "liquidBTC":"0x5f46d540b6eD704C3c8789105F30E075AA900726",
                              "liquidETH":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C",
                              "liquidUSD":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C"
                          }
                      },
                      "liquidETH": {
                          "vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C",
                          "accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198",
                          "teller":"0x9AA79C84b79816ab920bbce20f8f74557B514734",
                          "queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0",
                          "assets": {
                              "WETH":"0x5300000000000000000000000000000000000004",
                              "weETH":"0x01f0a31698C4d065659b9bdC21B3610292a1c506",
                              "liquidBTC":"0x5f46d540b6eD704C3c8789105F30E075AA900726",
                              "liquidETH":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C",
                              "liquidUSD":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C"
                          }
                      },
                      "liquidUSD": {
                          "vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C",
                          "accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7",
                          "teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
