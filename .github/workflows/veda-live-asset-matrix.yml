                              "liquidUSD":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C"
                          }
                      }
                  }
              },
              "ink": {
                  "id": 57073,
                  "rpcs": ["https://rpc-gel.inkonchain.com", "https://rpc-qnd.inkonchain.com", "https://ink.drpc.org"],
                  "products": {
                      "balanced": {
                          "vault":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f",
                          "accountant":"0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67",
                          "teller":"0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC",
                          "queue":"0x4c433Ed6d57316170565D7Fedc11a841832cDc3d",
                          "assets": {
                              "USDC":"0x2D270e6886d130D724215A266106e6832161EAEd",
                              "USDT0":"0x0200C29006150606B650577BBE7B6248F58470c1",
                              "balanced":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f",
                              "boosted":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271"
                          }
                      },
                      "boosted": {
                          "vault":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271",
                          "accountant":"0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9",
                          "teller":"0xc46f2443b3521632E2E2a903D6da8f965B46f6a0",
                          "queue":"0x406E63323EF5d39D41C6fD895Ef9665AF926184c",
                          "assets": {
                              "USDC":"0x2D270e6886d130D724215A266106e6832161EAEd",
                              "USDT0":"0x0200C29006150606B650577BBE7B6248F58470c1",
                              "balanced":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f",
                              "boosted":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271"
                          }
                      }
                  }
              }
          }

          def sig(text):
              return subprocess.check_output(["cast", "sig", text], text=True).strip()[2:]

          S = {
              "decimals":sig("decimals()"),
              "symbol":sig("symbol()"),
              "balanceOf":sig("balanceOf(address)"),
              "base":sig("base()"),
              "getRate":sig("getRate()"),
              "getRateSafe":sig("getRateSafe()"),
              "getRateInQuoteSafe":sig("getRateInQuoteSafe(address)"),
              "rateProviderData":sig("rateProviderData(address)"),
              "assetData":sig("assetData(address)"),
              "withdrawAssets":sig("withdrawAssets(address)"),
              "totalSupply":sig("totalSupply()"),
              "ONE_SHARE":sig("ONE_SHARE()")
          }

          def request(endpoint, method, params, attempts=3):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(endpoint,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-asset-matrix/2.0"})
              last=None
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(req,timeout=25) as response:
                          result=json.loads(response.read().decode())
                      if "error" in result: raise RuntimeError(result["error"])
                      return result["result"]
                  except Exception as exc:
                      last=exc
                      if attempt+1<attempts: time.sleep(attempt+1)
              raise RuntimeError(repr(last))

          def batch_request(endpoint, calls, chunk_size=80):
              output=[]
              for start in range(0,len(calls),chunk_size):
                  chunk=calls[start:start+chunk_size]
                  payload=[
                      {"jsonrpc":"2.0","id":index,"method":"eth_call","params":[{"to":call[1],"data":call[2]},call[3]]}
                      for index,call in enumerate(chunk)
                  ]
                  req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),method="POST",headers={"content-type":"application/json","user-agent":"veda-asset-matrix/2.0"})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      values=json.loads(response.read().decode())
                  by_id={value["id"]:value for value in values}
                  for index,call in enumerate(chunk):
                      value=by_id[index]
                      output.append((call[0],value.get("result"),value.get("error")))
              return output

          def select_rpc(config):
              failures={}
              for endpoint in config["rpcs"]:
                  try:
                      if int(request(endpoint,"eth_chainId",[]),16)==config["id"]:
                          return endpoint
                  except Exception as exc:
                      failures[endpoint]=repr(exc)
              raise RuntimeError(failures)

          def strip0(value): return value[2:] if value.startswith("0x") else value
          def aw(address): return strip0(address).lower().rjust(64,"0")
          def decode_words(raw):
              if not isinstance(raw,str): return None
              value=strip0(raw)
              return [int(value[index:index+64],16) for index in range(0,len(value),64)] if value else []
          def decode_address(raw): return "0x"+strip0(raw)[-40:]
          def decode_string(raw):
              if not isinstance(raw,str): return None
              value=strip0(raw)
              try:
                  offset=int(value[:64],16)*2
                  length=int(value[offset:offset+64],16)
                  return bytes.fromhex(value[offset+64:offset+64+length*2]).decode(errors="replace")
              except Exception:
                  try: return bytes.fromhex(value[:64]).rstrip(b"\0").decode(errors="replace")
                  except Exception: return raw

          output={"queried_at_unix":int(time.time()),"selectors":S,"chains":{}}

          for chain_name,config in CHAINS.items():
              endpoint=select_rpc(config)
              block=request(endpoint,"eth_blockNumber",[])
              calls=[]
              for product_name,product in config["products"].items():
                  prefix=(product_name,)
                  calls.extend([
                      ((product_name,"product","base"),product["accountant"],"0x"+S["base"],block),
                      ((product_name,"product","rate"),product["accountant"],"0x"+S["getRate"],block),
                      ((product_name,"product","rate_safe"),product["accountant"],"0x"+S["getRateSafe"],block),
                      ((product_name,"product","vault_decimals"),product["vault"],"0x"+S["decimals"],block),
                      ((product_name,"product","total_supply"),product["vault"],"0x"+S["totalSupply"],block),
                      ((product_name,"product","one_share"),product["queue"],"0x"+S["ONE_SHARE"],block)
                  ])
                  for asset_name,asset in product["assets"].items():
                      calls.extend([
                          ((product_name,asset_name,"decimals"),asset,"0x"+S["decimals"],block),
                          ((product_name,asset_name,"symbol"),asset,"0x"+S["symbol"],block),
                          ((product_name,asset_name,"balance"),asset,"0x"+S["balanceOf"]+aw(product["vault"]),block),
                          ((product_name,asset_name,"asset_data"),product["teller"],"0x"+S["assetData"]+aw(asset),block),
                          ((product_name,asset_name,"rate_data"),product["accountant"],"0x"+S["rateProviderData"]+aw(asset),block),
                          ((product_name,asset_name,"quote_safe"),product["accountant"],"0x"+S["getRateInQuoteSafe"]+aw(asset),block),
                          ((product_name,asset_name,"queue_data"),product["queue"],"0x"+S["withdrawAssets"]+aw(asset),block)
                      ])

              raw_results=batch_request(endpoint,calls)
              values={key:{"result":result,"error":error} for key,result,error in raw_results}
              chain_out={"endpoint":endpoint,"block":int(block,16),"products":{}}

              for product_name,product in config["products"].items():
                  def result(key): return values[key]["result"]
                  def error(key): return values[key]["error"]
                  base_raw=result((product_name,"product","base"))
                  rate_raw=result((product_name,"product","rate"))
                  rate_safe_raw=result((product_name,"product","rate_safe"))
                  decimals_raw=result((product_name,"product","vault_decimals"))
                  supply_raw=result((product_name,"product","total_supply"))
                  one_share_raw=result((product_name,"product","one_share"))
                  product_out={
                      "addresses":{key:value.lower() for key,value in product.items() if key!="assets"},
                      "base":decode_address(base_raw) if base_raw else {"error":error((product_name,"product","base"))},
                      "rate":int(rate_raw,16) if rate_raw else {"error":error((product_name,"product","rate"))},
                      "rate_safe":int(rate_safe_raw,16) if rate_safe_raw else {"error":error((product_name,"product","rate_safe"))},
                      "vault_decimals":int(decimals_raw,16) if decimals_raw else {"error":error((product_name,"product","vault_decimals"))},
                      "total_supply":int(supply_raw,16) if supply_raw else {"error":error((product_name,"product","total_supply"))},
                      "one_share":int(one_share_raw,16) if one_share_raw else {"error":error((product_name,"product","one_share"))},
                      "assets":{}
                  }
                  for asset_name,asset in product["assets"].items():
                      def get(field): return values[(product_name,asset_name,field)]
                      decimals=get("decimals")
                      symbol=get("symbol")
                      balance=get("balance")
                      asset_data=get("asset_data")
                      rate_data=get("rate_data")
                      quote=get("quote_safe")
                      queue_data=get("queue_data")
                      asset_out={
                          "address":asset.lower(),
                          "decimals":int(decimals["result"],16) if decimals["result"] else {"error":decimals["error"]},
                          "symbol":decode_string(symbol["result"]) if symbol["result"] else {"error":symbol["error"]},
                          "vault_balance":int(balance["result"],16) if balance["result"] else {"error":balance["error"]},
                          "asset_data_words":decode_words(asset_data["result"]) if asset_data["result"] else {"error":asset_data["error"]},
                          "rate_provider_words":decode_words(rate_data["result"]) if rate_data["result"] else {"error":rate_data["error"]},
                          "rate_in_quote_safe":int(quote["result"],16) if quote["result"] else {"error":quote["error"]},
                          "queue_withdraw_words":decode_words(queue_data["result"]) if queue_data["result"] else {"error":queue_data["error"]}
                      }
                      if isinstance(asset_out["rate_provider_words"],list) and len(asset_out["rate_provider_words"])>=2:
                          asset_out["is_pegged_to_base"]=bool(asset_out["rate_provider_words"][0])
                          asset_out["rate_provider"]="0x"+f'{asset_out["rate_provider_words"][1]:040x}'
                      relevant=(
                          isinstance(asset_out["asset_data_words"],list) and any(asset_out["asset_data_words"])
                      ) or (
                          isinstance(asset_out["rate_provider_words"],list) and any(asset_out["rate_provider_words"])
                      ) or (
                          isinstance(asset_out["queue_withdraw_words"],list) and any(asset_out["queue_withdraw_words"])
                      ) or isinstance(asset_out["rate_in_quote_safe"],int)
                      asset_out["relevant"]=relevant
                      product_out["assets"][asset_name]=asset_out
                  chain_out["products"][product_name]=product_out
              output["chains"][chain_name]=chain_out

          with open("veda-live-asset-matrix.json","w",encoding="utf-8") as handle:
              json.dump(output,handle,indent=2,sort_keys=True)
              handle.write("\n")

          summary={}
          for chain_name,chain in output["chains"].items():
              summary[chain_name]={}
              for product_name,product in chain["products"].items():
                  summary[chain_name][product_name]={
                      "rate":product["rate"],
                      "assets":{
                          name:{
                              "decimals":asset["decimals"],
                              "deposit_withdraw_premium":asset["asset_data_words"],
                              "pegged_provider":asset["rate_provider_words"],
                              "quote":asset["rate_in_quote_safe"],
                              "queue":asset["queue_withdraw_words"]
                          }
                          for name,asset in product["assets"].items() if asset["relevant"]
                      }
                  }
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Upload live asset matrix
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-asset-matrix
          path: veda-live-asset-matrix.json
          if-no-files-found: error
          retention-days: 1
