                              "USDT0":"0x0200C29006150606B650577BBE7B6248F58470c1",
                              "balanced":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f",
                              "boosted":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271"
                          },
                      },
                  },
              },
          }

          def sig(text):
              return subprocess.check_output(["cast", "sig", text], text=True).strip()[2:]

          S = {
              "decimals":sig("decimals()"),
              "symbol":sig("symbol()"),
              "balanceOf":sig("balanceOf(address)"),
              "base":sig("base()"),
              "getRate":sig("getRate()"),
              "getRateSafe":sig("getRateSafe()"),
              "getRateInQuote":sig("getRateInQuote(address)"),
              "getRateInQuoteSafe":sig("getRateInQuoteSafe(address)"),
              "rateProviderData":sig("rateProviderData(address)"),
              "assetData":sig("assetData(address)"),
              "withdrawAssets":sig("withdrawAssets(address)"),
              "previewAssetsOut":sig("previewAssetsOut(address,uint128,uint16)"),
              "totalSupply":sig("totalSupply()"),
              "ONE_SHARE":sig("ONE_SHARE()"),
          }

          def request(ep, method, params, attempts=4):
              payload=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(ep,data=payload,method="POST",headers={"content-type":"application/json","user-agent":"veda-asset-matrix/1.0"})
              last=None
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as response:
                          out=json.loads(response.read().decode())
                      if "error" in out: raise RuntimeError(out["error"])
                      return out["result"]
                  except Exception as exc:
                      last=exc; time.sleep(min(4,i+1))
              raise RuntimeError(repr(last))

          def select_rpc(config):
              failures={}
              for ep in config["rpcs"]:
                  try:
                      if int(request(ep,"eth_chainId",[]),16)==config["id"]: return ep
                  except Exception as exc: failures[ep]=repr(exc)
              raise RuntimeError(failures)

          def strip0(x): return x[2:] if x.startswith("0x") else x
          def aw(a): return strip0(a).lower().rjust(64,"0")
          def uw(v): return hex(v)[2:].rjust(64,"0")
          def decode_words(raw):
              h=strip0(raw)
              return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h else []
          def decode_address(raw): return "0x"+strip0(raw)[-40:]
          def decode_string(raw):
              h=strip0(raw)
              if not h: return ""
              try:
                  offset=int(h[:64],16)*2
                  length=int(h[offset:offset+64],16)
                  return bytes.fromhex(h[offset+64:offset+64+length*2]).decode(errors="replace")
              except Exception:
                  try: return bytes.fromhex(h[:64]).rstrip(b"\0").decode(errors="replace")
                  except Exception: return raw
          def safe(fn):
              try: return fn()
              except Exception as exc: return {"error":repr(exc)}

          output={"queried_at_unix":int(time.time()),"selectors":S,"chains":{}}
          for chain_name,chain in CHAINS.items():
              ep=select_rpc(chain); block=request(ep,"eth_blockNumber",[])
              def call(to,data): return request(ep,"eth_call",[{"to":to,"data":data},block])
              chain_out={"endpoint":ep,"block":int(block,16),"products":{}}
              for product_name,p in chain["products"].items():
                  base=safe(lambda:decode_address(call(p["accountant"],"0x"+S["base"])))
                  rate=safe(lambda:int(call(p["accountant"],"0x"+S["getRate"]),16))
                  rate_safe=safe(lambda:int(call(p["accountant"],"0x"+S["getRateSafe"]),16))
                  vault_decimals=safe(lambda:int(call(p["vault"],"0x"+S["decimals"]),16))
                  queue_one=safe(lambda:int(call(p["queue"],"0x"+S["ONE_SHARE"]),16))
                  po={
                      "addresses":{k:v.lower() for k,v in p.items() if k!="assets"},
                      "base":base,
                      "rate":rate,
                      "rate_safe":rate_safe,
                      "vault_decimals":vault_decimals,
                      "queue_one_share":queue_one,
                      "vault_total_supply":safe(lambda:int(call(p["vault"],"0x"+S["totalSupply"]),16)),
                      "assets":{},
                  }
                  for asset_name,asset in p["assets"].items():
                      decimals=safe(lambda asset=asset:int(call(asset,"0x"+S["decimals"]),16))
                      symbol=safe(lambda asset=asset:decode_string(call(asset,"0x"+S["symbol"])))
                      asset_data=safe(lambda asset=asset:decode_words(call(p["teller"],"0x"+S["assetData"]+aw(asset))))
                      rate_data=safe(lambda asset=asset:decode_words(call(p["accountant"],"0x"+S["rateProviderData"]+aw(asset))))
                      quote=safe(lambda asset=asset:int(call(p["accountant"],"0x"+S["getRateInQuote"]+aw(asset)),16))
                      quote_safe=safe(lambda asset=asset:int(call(p["accountant"],"0x"+S["getRateInQuoteSafe"]+aw(asset)),16))
                      withdraw=safe(lambda asset=asset:decode_words(call(p["queue"],"0x"+S["withdrawAssets"]+aw(asset))))
                      preview=safe(lambda asset=asset:decode_words(call(p["queue"],"0x"+S["previewAssetsOut"]+aw(asset)+uw(10**(vault_decimals if isinstance(vault_decimals,int) else 18))+uw(0))))
                      balance=safe(lambda asset=asset:int(call(asset,"0x"+S["balanceOf"]+aw(p["vault"])),16))
                      expected_pegged=None
                      if isinstance(decimals,int) and isinstance(rate,int) and isinstance(base,str):
                          base_dec=safe(lambda:int(call(base,"0x"+S["decimals"]),16))
                          if isinstance(base_dec,int):
                              expected_pegged=rate*10**(decimals-base_dec) if decimals>=base_dec else rate//10**(base_dec-decimals)
                      po["assets"][asset_name]={
                          "address":asset.lower(),"symbol":symbol,"decimals":decimals,
                          "asset_data_words":asset_data,"rate_provider_words":rate_data,
                          "rate_in_quote":quote,"rate_in_quote_safe":quote_safe,
                          "expected_if_pegged":expected_pegged,
                          "queue_withdraw_words":withdraw,"preview_one_share_zero_discount":preview,
                          "vault_balance":balance,
                      }
                  chain_out["products"][product_name]=po
              output["chains"][chain_name]=chain_out
          with open("veda-live-asset-matrix.json","w",encoding="utf-8") as f:
              json.dump(output,f,indent=2,sort_keys=True);f.write("\n")
          summary={}
          for chain,data in output["chains"].items():
              summary[chain]={}
              for product,p in data["products"].items():
                  summary[chain][product]={
                      "rate":p["rate"],
                      "assets":{
                          name:{
                              "decimals":a["decimals"],"teller":a["asset_data_words"],
                              "rate_provider":a["rate_provider_words"],"quote":a["rate_in_quote_safe"],
                              "expected_pegged":a["expected_if_pegged"],"queue":a["queue_withdraw_words"],
                          }
                          for name,a in p["assets"].items()
                      },
                  }
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Upload live asset matrix
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-asset-matrix
          path: veda-live-asset-matrix.json
          if-no-files-found: error
          retention-days: 1
