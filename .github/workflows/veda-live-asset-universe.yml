name: veda-live-asset-universe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct all configured teller, accountant and queue assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.parse
          import urllib.request

          CHAINS = {
              "ethereum": {
                  "id": 1,
                  "rpcs": ["https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com"],
                  "products": {
                      "liquidBTC": {"vault":"0x5f46d540b6ed704c3c8789105f30e075aa900726","accountant":"0xea23ac6d7d11f6b181d6b98174d334478adae6b0","teller":"0x8ea0b382d054dbebeb1d0ae47ee4ac433c730353","queue":"0x77a2fd42f8769d8063f2e75061fc200014e41edf"},
                      "liquidETH": {"vault":"0xf0bb20865277abd641a307ece5ee04e79073416c","accountant":"0x0d05d94a5f1e76c18fbeb7a13d17c8a314088198","teller":"0x9aa79c84b79816ab920bbce20f8f74557b514734","queue":"0x0d2df071207e18ca8638b4f04e98c53155ec2ce0"},
                      "liquidUSD": {"vault":"0x08c6f91e2b681faf5e17227f2a44c307b3c1364c","accountant":"0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7","teller":"0x4de413a26fc24c3fc27cc983be70aa9c5c299387","queue":"0x38fc1ba73b7ed289955a07d9f11a85b6e388064a"},
                  },
              },
              "optimism": {
                  "id": 10,
                  "rpcs": ["https://optimism-rpc.publicnode.com", "https://mainnet.optimism.io", "https://optimism.drpc.org"],
                  "products": {
                      "liquidBTC": {"vault":"0x5f46d540b6ed704c3c8789105f30e075aa900726","accountant":"0xea23ac6d7d11f6b181d6b98174d334478adae6b0","teller":"0x8ea0b382d054dbebeb1d0ae47ee4ac433c730353","queue":"0x77a2fd42f8769d8063f2e75061fc200014e41edf"},
                      "liquidETH": {"vault":"0xf0bb20865277abd641a307ece5ee04e79073416c","accountant":"0x0d05d94a5f1e76c18fbeb7a13d17c8a314088198","teller":"0x9aa79c84b79816ab920bbce20f8f74557b514734","queue":"0x0d2df071207e18ca8638b4f04e98c53155ec2ce0"},
                      "liquidUSD": {"vault":"0x08c6f91e2b681faf5e17227f2a44c307b3c1364c","accountant":"0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7","teller":"0x4de413a26fc24c3fc27cc983be70aa9c5c299387","queue":"0x38fc1ba73b7ed289955a07d9f11a85b6e388064a"},
                  },
              },
              "scroll": {
                  "id": 534352,
                  "rpcs": ["https://scroll-rpc.publicnode.com", "https://rpc.scroll.io", "https://scroll.drpc.org"],
                  "products": {
                      "liquidBTC": {"vault":"0x5f46d540b6ed704c3c8789105f30e075aa900726","accountant":"0xea23ac6d7d11f6b181d6b98174d334478adae6b0","teller":"0x8ea0b382d054dbebeb1d0ae47ee4ac433c730353","queue":"0x77a2fd42f8769d8063f2e75061fc200014e41edf"},
                      "liquidETH": {"vault":"0xf0bb20865277abd641a307ece5ee04e79073416c","accountant":"0x0d05d94a5f1e76c18fbeb7a13d17c8a314088198","teller":"0x9aa79c84b79816ab920bbce20f8f74557b514734","queue":"0x0d2df071207e18ca8638b4f04e98c53155ec2ce0"},
                      "liquidUSD": {"vault":"0x08c6f91e2b681faf5e17227f2a44c307b3c1364c","accountant":"0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7","teller":"0x4de413a26fc24c3fc27cc983be70aa9c5c299387","queue":"0x38fc1ba73b7ed289955a07d9f11a85b6e388064a"},
                  },
              },
              "ink": {
                  "id": 57073,
                  "rpcs": ["https://rpc-gel.inkonchain.com", "https://rpc-qnd.inkonchain.com", "https://ink.drpc.org"],
                  "products": {
                      "balanced": {"vault":"0xcaae49fb7f74ccfbe8a05e6104b01c097a78789f","accountant":"0x0c4df79d9e35e5c4876bc1ae4663e834312ddc67","teller":"0xc151e263d5c890fd0bceb33a6525f1a76a8329fc","queue":"0x4c433ed6d57316170565d7fedc11a841832cdc3d"},
                      "boosted": {"vault":"0xdbd87325d7b1189dcc9255c4926076ff4a96a271","accountant":"0x9c2477d4ea17d3ccc45e6b1087c94d14926f54c9","teller":"0xc46f2443b3521632e2e2a903d6da8f965b46f6a0","queue":"0x406e63323ef5d39d41c6fd895ef9665af926184c"},
                  },
              },
          }

          def sig(text):
              return subprocess.check_output(["cast", "sig", text], text=True).strip().lower()

          def topic(text):
              return subprocess.check_output(["cast", "keccak", text], text=True).strip().lower()

          EVENTS = {
              "AssetDataUpdated": topic("AssetDataUpdated(address,bool,bool,uint16)"),
              "RateProviderUpdated": topic("RateProviderUpdated(address,bool,address)"),
              "WithdrawAssetSetup": topic("WithdrawAssetSetup(address,uint24,uint24,uint16,uint16,uint96)"),
              "WithdrawAssetUpdated": topic("WithdrawAssetUpdated(address,uint24,uint24,uint16,uint16,uint96)"),
              "WithdrawAssetStopped": topic("WithdrawAssetStopped(address)"),
          }
          S = {
              "assetData": sig("assetData(address)"),
              "rateProviderData": sig("rateProviderData(address)"),
              "getRateInQuoteSafe": sig("getRateInQuoteSafe(address)"),
              "withdrawAssets": sig("withdrawAssets(address)"),
              "decimals": sig("decimals()"),
              "symbol": sig("symbol()"),
              "name": sig("name()"),
              "totalSupply": sig("totalSupply()"),
              "owner": sig("owner()"),
              "authority": sig("authority()"),
              "hook": sig("hook()"),
              "vault": sig("vault()"),
              "accountant": sig("accountant()"),
              "balanceOf": sig("balanceOf(address)"),
              "ONE_SHARE": sig("ONE_SHARE()"),
          }

          def request(endpoint, method, params, timeout=25):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(endpoint,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-asset-universe/1.0"})
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  result=json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          def http_json(url, timeout=45):
              req=urllib.request.Request(url,headers={"accept":"application/json","user-agent":"veda-asset-universe/1.0"})
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  return json.loads(response.read().decode())

          def choose_rpc(config):
              failures={}
              for endpoint in config["rpcs"]:
                  try:
                      if int(request(endpoint,"eth_chainId",[]),16)==config["id"]:
                          return endpoint,failures
                  except Exception as exc:
                      failures[endpoint]=repr(exc)
              raise RuntimeError(failures)

          def explorer_logs(chain_id,address,event_topic):
              collected=[]
              for page in range(1,6):
                  params=urllib.parse.urlencode({"module":"logs","action":"getLogs","address":address,"fromBlock":0,"toBlock":"latest","topic0":event_topic,"page":page,"offset":1000})
                  url=f"https://api.routescan.io/v2/network/mainnet/evm/{chain_id}/etherscan/api?{params}"
                  data=http_json(url); result=data.get("result")
                  if isinstance(result,str):
                      if data.get("status")=="0" or "No records" in result:
                          break
                      raise RuntimeError(data)
                  if not result: break
                  collected.extend(result)
                  if len(result)<1000: break
                  time.sleep(.3)
              return collected

          def strip0(value): return value[2:] if str(value).startswith("0x") else str(value)
          def address_word(value): return strip0(value).lower().rjust(64,"0")
          def topic_address(value): return "0x"+strip0(value)[-40:].lower()
          def decode_words(raw):
              if not raw or raw=="0x": return []
              value=strip0(raw)
              return [value[i:i+64] for i in range(0,len(value),64)]
          def decode_address_word(word): return "0x"+word[-40:].lower()
          def decode_address(raw):
              words=decode_words(raw); return None if not words else decode_address_word(words[0])
          def decode_uint(raw):
              words=decode_words(raw); return None if not words else int(words[0],16)
          def decode_text(raw):
              if not raw or raw=="0x": return None
              value=strip0(raw)
              try:
                  offset=int(value[:64],16)*2; length=int(value[offset:offset+64],16)
                  return bytes.fromhex(value[offset+64:offset+64+length*2]).decode(errors="replace")
              except Exception:
                  try:return bytes.fromhex(value[:64]).rstrip(b"\0").decode(errors="replace")
                  except Exception:return None
          def call(endpoint,target,data): return request(endpoint,"eth_call",[{"to":target,"data":data},"latest"])

          output={"generated_at_unix":int(time.time()),"events":EVENTS,"selectors":S,"chains":{},"flags":[]}
          known_scope_vaults={p["vault"].lower() for c in CHAINS.values() for p in c["products"].values()}

          for chain_name,config in CHAINS.items():
              endpoint,rpc_failures=choose_rpc(config)
              chain={"endpoint":endpoint,"rpc_failures":rpc_failures,"block":int(request(endpoint,"eth_blockNumber",[]),16),"products":{}}
              for product_name,product in config["products"].items():
                  assets=set(); history=[]; errors=[]
                  event_targets=[("teller",product["teller"],["AssetDataUpdated"]),("accountant",product["accountant"],["RateProviderUpdated"]),("queue",product["queue"],["WithdrawAssetSetup","WithdrawAssetUpdated","WithdrawAssetStopped"])]
                  for component,address,names in event_targets:
                      for event_name in names:
                          try: logs=explorer_logs(config["id"],address,EVENTS[event_name])
                          except Exception as exc:
                              errors.append({"component":component,"event":event_name,"error":repr(exc)}); continue
                          for log in logs:
                              topics=[str(x).lower() for x in (log.get("topics") or [])]
                              words=decode_words(log.get("data","0x"))
                              asset=None
                              if event_name in {"AssetDataUpdated","WithdrawAssetSetup","WithdrawAssetUpdated","WithdrawAssetStopped"} and len(topics)>1:
                                  asset=topic_address(topics[1])
                              elif event_name=="RateProviderUpdated" and words:
                                  asset=decode_address_word(words[0])
                              if asset:
                                  assets.add(asset)
                              history.append({"component":component,"event":event_name,"asset":asset,"block":int(log.get("blockNumber","0x0"),16) if str(log.get("blockNumber","0x0")).startswith("0x") else int(log.get("blockNumber",0) or 0),"tx":log.get("transactionHash")})
                  # Always include product contracts as possible quote/share tokens.
                  assets.update(p["vault"].lower() for p in config["products"].values())
                  assets.add(product["vault"].lower())
                  entries={}
                  for asset in sorted(assets):
                      code=request(endpoint,"eth_getCode",[asset,"latest"])
                      entry={"address":asset,"code_bytes":len(strip0(code))//2,"state":{},"token":{},"contract_shape":{}}
                      calls={
                          "assetData":(product["teller"],S["assetData"]+address_word(asset)),
                          "rateProviderData":(product["accountant"],S["rateProviderData"]+address_word(asset)),
                          "quote":(product["accountant"],S["getRateInQuoteSafe"]+address_word(asset)),
                          "withdrawAssets":(product["queue"],S["withdrawAssets"]+address_word(asset)),
                          "decimals":(asset,S["decimals"]),"symbol":(asset,S["symbol"]),"name":(asset,S["name"]),"totalSupply":(asset,S["totalSupply"]),
                          "owner":(asset,S["owner"]),"authority":(asset,S["authority"]),"hook":(asset,S["hook"]),"vault":(asset,S["vault"]),"accountant":(asset,S["accountant"]),
                          "productBalance":(asset,S["balanceOf"]+address_word(product["vault"])),
                      }
                      for name,(target,data_call) in calls.items():
                          try: raw=call(endpoint,target,data_call)
                          except Exception as exc:
                              entry["state"][name]={"error":repr(exc)}; continue
                          if name in {"symbol","name"}: value=decode_text(raw)
                          elif name in {"owner","authority","hook","vault","accountant"}: value=decode_address(raw)
                          elif name in {"decimals","totalSupply","quote","productBalance"}: value=decode_uint(raw)
                          else: value=[int(word,16) for word in decode_words(raw)]
                          entry["state"][name]={"raw":raw,"value":value}
                      ad=entry["state"].get("assetData",{}).get("value")
                      rp=entry["state"].get("rateProviderData",{}).get("value")
                      wd=entry["state"].get("withdrawAssets",{}).get("value")
                      entry["active_deposit"] = isinstance(ad,list) and len(ad)>0 and bool(ad[0])
                      entry["active_direct_withdraw"] = isinstance(ad,list) and len(ad)>1 and bool(ad[1])
                      entry["active_queue_withdraw"] = isinstance(wd,list) and len(wd)>0 and bool(wd[0])
                      entry["has_rate"] = isinstance(entry["state"].get("quote",{}).get("value"),int)
                      entry["appears_boring_vault"] = all(
                          isinstance(entry["state"].get(field,{}).get("value"), (str,int))
                          for field in ("authority","decimals","totalSupply")
                      ) and entry["state"].get("authority",{}).get("value") not in (None,"0x0000000000000000000000000000000000000000")
                      entries[asset]=entry
                      if entry["active_queue_withdraw"] and entry["appears_boring_vault"]:
                          output["flags"].append({"type":"ACTIVE_BORING_VAULT_QUEUE_ASSET","chain":chain_name,"product":product_name,"source_vault":product["vault"].lower(),"asset":asset,"asset_decimals":entry["state"].get("decimals",{}).get("value"),"source_decimals":None,"scope_asset":asset in known_scope_vaults})
                      if (entry["active_deposit"] or entry["active_direct_withdraw"] or entry["active_queue_withdraw"]) and not entry["has_rate"]:
                          output["flags"].append({"type":"ACTIVE_ASSET_WITHOUT_SAFE_QUOTE","chain":chain_name,"product":product_name,"asset":asset})
                  try: source_decimals=decode_uint(call(endpoint,product["vault"],S["decimals"]))
                  except Exception: source_decimals=None
                  for flag in output["flags"]:
                      if flag.get("chain")==chain_name and flag.get("product")==product_name and flag.get("source_decimals") is None:
                          flag["source_decimals"]=source_decimals
                          if flag.get("asset_decimals") is not None:
                              flag["decimal_mismatch"]=flag["asset_decimals"]!=source_decimals
                  chain["products"][product_name]={"addresses":{k:v.lower() for k,v in product.items()},"source_decimals":source_decimals,"event_errors":errors,"history":history,"assets":entries}
              output["chains"][chain_name]=chain

          with open("veda-live-asset-universe.json","w",encoding="utf-8") as handle:
              json.dump(output,handle,indent=2,sort_keys=True);handle.write("\n")
          print(json.dumps({
              "blocks":{c:v["block"] for c,v in output["chains"].items()},
              "asset_counts":{c:{p:len(x["assets"]) for p,x in v["products"].items()} for c,v in output["chains"].items()},
              "active_assets":{c:{p:{a:{"symbol":e["state"].get("symbol",{}).get("value"),"decimals":e["state"].get("decimals",{}).get("value"),"deposit":e["active_deposit"],"direct_withdraw":e["active_direct_withdraw"],"queue":e["active_queue_withdraw"],"quote":e["state"].get("quote",{}).get("value"),"boring_vault":e["appears_boring_vault"]} for a,e in x["assets"].items() if e["active_deposit"] or e["active_direct_withdraw"] or e["active_queue_withdraw"]} for p,x in v["products"].items()} for c,v in output["chains"].items()},
              "flags":output["flags"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload complete live asset universe
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-asset-universe
          path: veda-live-asset-universe.json
          if-no-files-found: error
          retention-days: 1
