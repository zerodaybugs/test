name: veda-live-ledger

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reconstruct live peer and role ledgers
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request

          CHAINS = {
              "ethereum": {
                  "chain_id": 1,
                  "rpcs": [
                      "https://ethereum-rpc.publicnode.com",
                      "https://eth.llamarpc.com",
                      "https://rpc.ankr.com/eth",
                  ],
                  "authorities": {
                      "liquidBTC": "0x49f954c67ff235034b69b8a59fbe309a40256c8d",
                      "liquidETH": "0x485bde66bb668a51f2372e34e45b1c6226798122",
                      "liquidUSD": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                  },
                  "tellers": {
                      "liquidBTC": "0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
                      "liquidETH": "0x9AA79C84b79816ab920bBcE20f8f74557B514734",
                      "liquidUSD": "0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
                  },
              },
              "scroll": {
                  "chain_id": 534352,
                  "rpcs": [
                      "https://scroll-rpc.publicnode.com",
                      "https://rpc.scroll.io",
                      "https://scroll.drpc.org",
                  ],
                  "authorities": {
                      "liquidBTC": "0x49f954c67ff235034b69b8a59fbe309a40256c8d",
                      "liquidETH": "0x485bde66bb668a51f2372e34e45b1c6226798122",
                      "liquidUSD": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                  },
                  "tellers": {
                      "liquidBTC": "0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
                      "liquidETH": "0x9AA79C84b79816ab920bBcE20f8f74557B514734",
                      "liquidUSD": "0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
                  },
              },
              "ink": {
                  "chain_id": 57073,
                  "rpcs": [
                      "https://rpc-gel.inkonchain.com",
                      "https://rpc-qnd.inkonchain.com",
                      "https://ink.drpc.org",
                  ],
                  "authorities": {
                      "balanced": "0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B",
                      "boosted": "0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77",
                  },
                  "tellers": {},
              },
          }

          TOPICS = {
              "PeerSet": "0x238399d427b947898edb290f5ff0f9109849b1c3ba196a42e35f00c50a54b98b",
              "UserRoleUpdated": "0x4c9bdd0c8e073eb5eda2250b18d8e5121ff27b62064fbeeeed4869bb99bc5bf2",
              "PublicCapabilityUpdated": "0x950a343f5d10445e82a71036d3f4fb3016180a25805141932543b83e2078a93e",
              "RoleCapabilityUpdated": "0xa52ea92e6e955aa8ac66420b86350f7139959adfcc7e6a14eee1bd116d09860e",
          }

          SELECTORS = {
              "get_user_roles": "06a36aee",
              "is_capability_public": "2f47571f",
              "get_roles_with_capability": "7917b794",
              "peers": "bb0b6a53",
              "id_to_chains": "d1822216",
              "outbound_rate_limits": "51c32a88",
              "inbound_rate_limits": "55b56c0c",
              "owner": "8da5cb5b",
              "authority": "bf7e214f",
          }

          def rpc_request(endpoint, method, params, attempts=4):
              payload = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={
                      "content-type": "application/json",
                      "user-agent": "veda-readonly-ledger/1.0",
                  },
              )
              last_error = None
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          result = json.loads(response.read().decode())
                      if "error" in result:
                          raise RuntimeError(result["error"])
                      return result["result"]
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(min(8, 1.5 ** attempt))
              raise RuntimeError(f"{method} failed at {endpoint}: {last_error!r}")

          def select_rpc(config):
              failures = {}
              for endpoint in config["rpcs"]:
                  try:
                      chain_id = int(rpc_request(endpoint, "eth_chainId", []), 16)
                      if chain_id != config["chain_id"]:
                          raise RuntimeError(f"unexpected chain id {chain_id}")
                      rpc_request(endpoint, "eth_blockNumber", [])
                      return endpoint
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(f"No usable endpoint: {failures}")

          def strip0(value):
              return value[2:] if value.startswith("0x") else value

          def address_word(address):
              return strip0(address).lower().rjust(64, "0")

          def uint_word(value):
              return hex(value)[2:].rjust(64, "0")

          def bytes4_word(selector):
              return strip0(selector).lower().ljust(64, "0")

          def decode_address(raw):
              return "0x" + strip0(raw)[-40:]

          def decode_words(raw):
              value = strip0(raw)
              if not value:
                  return []
              return [int(value[index:index + 64], 16) for index in range(0, len(value), 64)]

          def eth_call(endpoint, block, to, data):
              return rpc_request(endpoint, "eth_call", [{"to": to, "data": data}, hex(block)])

          def safe_call(fn):
              try:
                  return fn()
              except Exception as exc:
                  return {"error": repr(exc)}

          def code_state(endpoint, block, address):
              code = rpc_request(endpoint, "eth_getCode", [address, hex(block)])
              raw = bytes.fromhex(strip0(code)) if code != "0x" else b""
              return {
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }

          def first_code_block(endpoint, address, latest):
              latest_code = rpc_request(endpoint, "eth_getCode", [address, hex(latest)])
              if latest_code == "0x":
                  return None
              low = 0
              high = latest
              while low < high:
                  middle = (low + high) // 2
                  code = rpc_request(endpoint, "eth_getCode", [address, hex(middle)])
                  if code == "0x":
                      low = middle + 1
                  else:
                      high = middle
              return low

          def get_logs_adaptive(endpoint, address, topics, start, end):
              if start is None:
                  return []
              cursor = start
              chunk = 1_000_000
              minimum_chunk = 2_000
              logs = []
              while cursor <= end:
                  upper = min(end, cursor + chunk - 1)
                  params = {
                      "address": address,
                      "fromBlock": hex(cursor),
                      "toBlock": hex(upper),
                      "topics": [topics if isinstance(topics, list) else topics],
                  }
                  try:
                      page = rpc_request(endpoint, "eth_getLogs", [params], attempts=3)
                      logs.extend(page)
                      cursor = upper + 1
                      if chunk < 1_000_000:
                          chunk = min(1_000_000, chunk * 2)
                  except Exception:
                      if chunk <= minimum_chunk:
                          raise
                      chunk = max(minimum_chunk, chunk // 2)
              logs.sort(key=lambda item: (
                  int(item.get("blockNumber", "0x0"), 16),
                  int(item.get("transactionIndex", "0x0"), 16),
                  int(item.get("logIndex", "0x0"), 16),
              ))
              return logs

          def event_meta(log):
              return {
                  "block": int(log.get("blockNumber", "0x0"), 16),
                  "tx": log.get("transactionHash"),
                  "log_index": int(log.get("logIndex", "0x0"), 16),
              }

          def current_user_roles(endpoint, block, authority, user):
              raw = eth_call(
                  endpoint,
                  block,
                  authority,
                  "0x" + SELECTORS["get_user_roles"] + address_word(user),
              )
              return int(raw, 16)

          def current_public(endpoint, block, authority, target, selector):
              raw = eth_call(
                  endpoint,
                  block,
                  authority,
                  "0x" + SELECTORS["is_capability_public"] + address_word(target) + bytes4_word(selector),
              )
              return bool(int(raw, 16))

          def current_capability_roles(endpoint, block, authority, target, selector):
              raw = eth_call(
                  endpoint,
                  block,
                  authority,
                  "0x" + SELECTORS["get_roles_with_capability"] + address_word(target) + bytes4_word(selector),
              )
              return int(raw, 16)

          def current_peer(endpoint, block, teller, eid):
              raw = eth_call(
                  endpoint,
                  block,
                  teller,
                  "0x" + SELECTORS["peers"] + uint_word(eid),
              )
              return "0x" + strip0(raw)[-64:]

          def current_chain_state(endpoint, block, teller, eid):
              return decode_words(eth_call(
                  endpoint,
                  block,
                  teller,
                  "0x" + SELECTORS["id_to_chains"] + uint_word(eid),
              ))

          def current_rate_limit(endpoint, block, teller, eid, inbound):
              selector = SELECTORS["inbound_rate_limits" if inbound else "outbound_rate_limits"]
              return decode_words(eth_call(
                  endpoint,
                  block,
                  teller,
                  "0x" + selector + uint_word(eid),
              ))

          output = {
              "queried_at_unix": int(time.time()),
              "topics": TOPICS,
              "chains": {},
          }

          for chain_name, config in CHAINS.items():
              endpoint = select_rpc(config)
              latest = int(rpc_request(endpoint, "eth_blockNumber", []), 16)
              chain_out = {
                  "endpoint": endpoint,
                  "block": latest,
                  "authorities": {},
                  "tellers": {},
              }

              for product, authority in config["authorities"].items():
                  creation_block = first_code_block(endpoint, authority, latest)
                  logs = get_logs_adaptive(
                      endpoint,
                      authority,
                      [
                          TOPICS["UserRoleUpdated"],
                          TOPICS["PublicCapabilityUpdated"],
                          TOPICS["RoleCapabilityUpdated"],
                      ],
                      creation_block,
                      latest,
                  )

                  users = set()
                  capability_pairs = set()
                  history = []

                  for log in logs:
                      topic0 = log["topics"][0].lower()
                      topics = log["topics"]
                      data_words = decode_words(log.get("data", "0x"))
                      meta = event_meta(log)

                      if topic0 == TOPICS["UserRoleUpdated"].lower():
                          user = "0x" + topics[1][-40:]
                          role = int(topics[2], 16)
                          enabled = bool(data_words[0]) if data_words else False
                          users.add(user.lower())
                          history.append({
                              "type": "UserRoleUpdated",
                              "user": user.lower(),
                              "role": role,
                              "enabled": enabled,
                              **meta,
                          })
                      elif topic0 == TOPICS["PublicCapabilityUpdated"].lower():
                          target = "0x" + topics[1][-40:]
                          selector = "0x" + strip0(topics[2])[:8]
                          enabled = bool(data_words[0]) if data_words else False
                          capability_pairs.add((target.lower(), selector.lower()))
                          history.append({
                              "type": "PublicCapabilityUpdated",
                              "target": target.lower(),
                              "selector": selector.lower(),
                              "enabled": enabled,
                              **meta,
                          })
                      elif topic0 == TOPICS["RoleCapabilityUpdated"].lower():
                          role = int(topics[1], 16)
                          target = "0x" + topics[2][-40:]
                          selector = "0x" + strip0(topics[3])[:8]
                          enabled = bool(data_words[0]) if data_words else False
                          capability_pairs.add((target.lower(), selector.lower()))
                          history.append({
                              "type": "RoleCapabilityUpdated",
                              "role": role,
                              "target": target.lower(),
                              "selector": selector.lower(),
                              "enabled": enabled,
                              **meta,
                          })

                  current_users = []
                  for user in sorted(users):
                      mask = safe_call(lambda user=user: current_user_roles(endpoint, latest, authority, user))
                      code = safe_call(lambda user=user: code_state(endpoint, latest, user))
                      current_users.append({
                          "user": user,
                          "roles_mask": mask,
                          "roles": [index for index in range(256) if isinstance(mask, int) and ((mask >> index) & 1)],
                          "code": code,
                      })

                  current_capabilities = []
                  for target, selector in sorted(capability_pairs):
                      public = safe_call(
                          lambda target=target, selector=selector: current_public(
                              endpoint, latest, authority, target, selector
                          )
                      )
                      roles_mask = safe_call(
                          lambda target=target, selector=selector: current_capability_roles(
                              endpoint, latest, authority, target, selector
                          )
                      )
                      if public is True or (isinstance(roles_mask, int) and roles_mask != 0):
                          current_capabilities.append({
                              "target": target,
                              "selector": selector,
                              "public": public,
                              "roles_mask": roles_mask,
                              "roles": [
                                  index for index in range(256)
                                  if isinstance(roles_mask, int) and ((roles_mask >> index) & 1)
                              ],
                              "target_code": safe_call(
                                  lambda target=target: code_state(endpoint, latest, target)
                              ),
                          })

                  active_edges = []
                  for user_entry in current_users:
                      user_mask = user_entry["roles_mask"]
                      if not isinstance(user_mask, int) or user_mask == 0:
                          continue
                      for capability in current_capabilities:
                          capability_mask = capability["roles_mask"]
                          if not isinstance(capability_mask, int):
                              continue
                          matched = user_mask & capability_mask
                          if matched:
                              active_edges.append({
                                  "user": user_entry["user"],
                                  "target": capability["target"],
                                  "selector": capability["selector"],
                                  "matched_roles": [index for index in range(256) if (matched >> index) & 1],
                              })

                  chain_out["authorities"][product] = {
                      "address": authority.lower(),
                      "creation_block": creation_block,
                      "owner": safe_call(lambda: decode_address(eth_call(
                          endpoint, latest, authority, "0x" + SELECTORS["owner"]
                      ))),
                      "authority": safe_call(lambda: decode_address(eth_call(
                          endpoint, latest, authority, "0x" + SELECTORS["authority"]
                      ))),
                      "code": safe_call(lambda: code_state(endpoint, latest, authority)),
                      "event_count": len(logs),
                      "history": history,
                      "users": current_users,
                      "capabilities": current_capabilities,
                      "active_edges": active_edges,
                  }

              for product, teller in config["tellers"].items():
                  creation_block = first_code_block(endpoint, teller, latest)
                  logs = get_logs_adaptive(
                      endpoint,
                      teller,
                      TOPICS["PeerSet"],
                      creation_block,
                      latest,
                  )
                  eids = set()
                  history = []
                  for log in logs:
                      words = decode_words(log.get("data", "0x"))
                      if len(words) < 2:
                          continue
                      eid = words[0]
                      peer = "0x" + f"{words[1]:064x}"
                      eids.add(eid)
                      history.append({
                          "eid": eid,
                          "peer": peer,
                          **event_meta(log),
                      })

                  peers = []
                  for eid in sorted(eids):
                      peer = safe_call(lambda eid=eid: current_peer(endpoint, latest, teller, eid))
                      chain_state = safe_call(lambda eid=eid: current_chain_state(endpoint, latest, teller, eid))
                      inbound = safe_call(lambda eid=eid: current_rate_limit(endpoint, latest, teller, eid, True))
                      outbound = safe_call(lambda eid=eid: current_rate_limit(endpoint, latest, teller, eid, False))
                      peers.append({
                          "eid": eid,
                          "peer": peer,
                          "chain_state": chain_state,
                          "inbound_rate_limit": inbound,
                          "outbound_rate_limit": outbound,
                      })

                  chain_out["tellers"][product] = {
                      "address": teller.lower(),
                      "creation_block": creation_block,
                      "code": safe_call(lambda: code_state(endpoint, latest, teller)),
                      "peer_event_count": len(logs),
                      "history": history,
                      "peers": peers,
                  }

              output["chains"][chain_name] = chain_out

          with open("veda-live-ledger.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")

          summary = {
              chain: {
                  "block": data["block"],
                  "authorities": {
                      name: {
                          "events": entry["event_count"],
                          "active_users": sum(
                              1 for user in entry["users"]
                              if isinstance(user["roles_mask"], int) and user["roles_mask"] != 0
                          ),
                          "active_capabilities": len(entry["capabilities"]),
                          "active_edges": len(entry["active_edges"]),
                      }
                      for name, entry in data["authorities"].items()
                  },
                  "tellers": {
                      name: {
                          "peer_events": entry["peer_event_count"],
                          "eids": [peer["eid"] for peer in entry["peers"]],
                      }
                      for name, entry in data["tellers"].items()
                  },
              }
              for chain, data in output["chains"].items()
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload ledger
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-ledger
          path: veda-live-ledger.json
          if-no-files-found: error
          retention-days: 1
