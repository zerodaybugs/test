name: veda-live-ledger

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reconstruct live peer and role ledgers
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          import urllib.request

          CHAINS = {
              "ethereum": {
                  "chain_id": 1,
                  "rpcs": [
                      "https://ethereum-rpc.publicnode.com",
                      "https://eth.llamarpc.com",
                      "https://rpc.ankr.com/eth",
                  ],
                  "products": {
                      "liquidUSD": {
                          "start": 19570000,
                          "authority": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                          "teller": "0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
                      },
                      "liquidETH": {
                          "start": 19910000,
                          "authority": "0x485bde66bb668a51f2372e34e45b1c6226798122",
                          "teller": "0x9AA79C84b79816ab920bBcE20f8f74557B514734",
                      },
                      "liquidBTC": {
                          "start": 21080000,
                          "authority": "0x49f954c67ff235034b69b8a59fbe309a40256c8d",
                          "teller": "0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
                      },
                  },
              },
              "scroll": {
                  "chain_id": 534352,
                  "rpcs": [
                      "https://scroll-rpc.publicnode.com",
                      "https://rpc.scroll.io",
                      "https://scroll.drpc.org",
                  ],
                  "products": {
                      "liquidETH": {
                          "start": 12640000,
                          "authority": "0x485bde66bb668a51f2372e34e45b1c6226798122",
                          "teller": "0x9AA79C84b79816ab920bBcE20f8f74557B514734",
                      },
                      "liquidUSD": {
                          "start": 12640000,
                          "authority": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                          "teller": "0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
                      },
                      "liquidBTC": {
                          "start": 13840000,
                          "authority": "0x49f954c67ff235034b69b8a59fbe309a40256c8d",
                          "teller": "0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
                      },
                  },
              },
          }

          TOPICS = {
              "PeerSet": "0x238399d427b947898edb290f5ff0f9109849b1c3ba196a42e35f00c50a54b98b",
              "UserRoleUpdated": "0x4c9bdd0c8e073eb5eda2250b18d8e5121ff27b62064fbeeeed4869bb99bc5bf2",
              "PublicCapabilityUpdated": "0x950a343f5d10445e82a71036d3f4fb3016180a25805141932543b83e2078a93e",
              "RoleCapabilityUpdated": "0xa52ea92e6e955aa8ac66420b86350f7139959adfcc7e6a14eee1bd116d09860e",
          }

          SELECTORS = {
              "get_user_roles": "06a36aee",
              "is_capability_public": "2f47571f",
              "get_roles_with_capability": "7917b794",
              "peers": "bb0b6a53",
              "id_to_chains": "d1822216",
              "outbound_rate_limits": "51c32a88",
              "inbound_rate_limits": "55b56c0c",
              "owner": "8da5cb5b",
              "authority": "bf7e214f",
          }

          def rpc_request(endpoint, method, params, attempts=4):
              payload = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={"content-type":"application/json","user-agent":"veda-readonly-ledger/2.0"},
              )
              last_error = None
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          result = json.loads(response.read().decode())
                      if "error" in result:
                          raise RuntimeError(result["error"])
                      return result["result"]
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(min(5, 1.4 ** attempt))
              raise RuntimeError(f"{method} at {endpoint}: {last_error!r}")

          def select_rpc(config):
              failures = {}
              for endpoint in config["rpcs"]:
                  try:
                      if int(rpc_request(endpoint, "eth_chainId", []), 16) != config["chain_id"]:
                          raise RuntimeError("wrong chain")
                      rpc_request(endpoint, "eth_blockNumber", [])
                      return endpoint
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(failures)

          def strip0(value): return value[2:] if value.startswith("0x") else value
          def address_word(address): return strip0(address).lower().rjust(64, "0")
          def uint_word(value): return hex(value)[2:].rjust(64, "0")
          def bytes4_word(selector): return strip0(selector).lower().ljust(64, "0")
          def decode_address(raw): return "0x" + strip0(raw)[-40:]
          def decode_words(raw):
              value = strip0(raw)
              return [int(value[i:i+64], 16) for i in range(0, len(value), 64)] if value else []
          def event_meta(log):
              return {
                  "block": int(log.get("blockNumber", "0x0"), 16),
                  "transaction_index": int(log.get("transactionIndex", "0x0"), 16),
                  "log_index": int(log.get("logIndex", "0x0"), 16),
                  "tx": log.get("transactionHash"),
              }
          def safe(fn):
              try: return fn()
              except Exception as exc: return {"error":repr(exc)}

          def eth_call(endpoint, block, to, data):
              return rpc_request(endpoint, "eth_call", [{"to":to,"data":data}, hex(block)])

          def code_state(endpoint, block, address):
              code = rpc_request(endpoint, "eth_getCode", [address, hex(block)])
              raw = bytes.fromhex(strip0(code)) if code != "0x" else b""
              return {"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}

          def fetch_logs(endpoint, address, topic, start, end):
              output = []
              cursor = start
              chunk = 2_000_000
              minimum = 1_000
              while cursor <= end:
                  upper = min(end, cursor + chunk - 1)
                  params = {
                      "address": address,
                      "fromBlock": hex(cursor),
                      "toBlock": hex(upper),
                      "topics": [topic],
                  }
                  try:
                      page = rpc_request(endpoint, "eth_getLogs", [params], attempts=2)
                      output.extend(page)
                      cursor = upper + 1
                      chunk = min(2_000_000, max(chunk, 10_000) * 2)
                  except Exception:
                      if chunk <= minimum:
                          raise
                      chunk = max(minimum, chunk // 2)
              output.sort(key=lambda log: (
                  int(log.get("blockNumber", "0x0"), 16),
                  int(log.get("transactionIndex", "0x0"), 16),
                  int(log.get("logIndex", "0x0"), 16),
              ))
              return output

          def call_user_roles(endpoint, block, authority, user):
              raw = eth_call(endpoint, block, authority, "0x"+SELECTORS["get_user_roles"]+address_word(user))
              return int(raw, 16)

          def call_public(endpoint, block, authority, target, selector):
              raw = eth_call(
                  endpoint, block, authority,
                  "0x"+SELECTORS["is_capability_public"]+address_word(target)+bytes4_word(selector),
              )
              return bool(int(raw, 16))

          def call_capability_roles(endpoint, block, authority, target, selector):
              raw = eth_call(
                  endpoint, block, authority,
                  "0x"+SELECTORS["get_roles_with_capability"]+address_word(target)+bytes4_word(selector),
              )
              return int(raw, 16)

          def call_eid(endpoint, block, teller, selector, eid):
              return decode_words(eth_call(endpoint, block, teller, "0x"+selector+uint_word(eid)))

          result = {"queried_at_unix":int(time.time()),"topics":TOPICS,"chains":{}}

          for chain_name, config in CHAINS.items():
              chain_result = {"products":{}}
              try:
                  endpoint = select_rpc(config)
                  latest = int(rpc_request(endpoint, "eth_blockNumber", []), 16)
                  chain_result.update({"endpoint":endpoint,"block":latest})
              except Exception as exc:
                  chain_result["fatal_error"] = repr(exc)
                  result["chains"][chain_name] = chain_result
                  continue

              for product_name, product in config["products"].items():
                  authority = product["authority"]
                  teller = product["teller"]
                  product_result = {
                      "start":product["start"],
                      "authority":authority.lower(),
                      "teller":teller.lower(),
                      "errors":{},
                  }

                  event_pages = {}
                  for event_name in ("UserRoleUpdated","PublicCapabilityUpdated","RoleCapabilityUpdated"):
                      try:
                          event_pages[event_name] = fetch_logs(
                              endpoint, authority, TOPICS[event_name], product["start"], latest
                          )
                      except Exception as exc:
                          event_pages[event_name] = []
                          product_result["errors"][event_name] = repr(exc)

                  users = set()
                  capability_pairs = set()
                  role_history = []

                  for log in event_pages["UserRoleUpdated"]:
                      try:
                          user = "0x" + log["topics"][1][-40:]
                          role = int(log["topics"][2], 16)
                          data = decode_words(log.get("data", "0x"))
                          enabled = bool(data[0])
                          users.add(user.lower())
                          role_history.append({
                              "type":"UserRoleUpdated","user":user.lower(),"role":role,"enabled":enabled,
                              **event_meta(log),
                          })
                      except Exception as exc:
                          product_result["errors"].setdefault("decode_user_role", []).append(repr(exc))

                  for log in event_pages["PublicCapabilityUpdated"]:
                      try:
                          target = "0x" + log["topics"][1][-40:]
                          selector = "0x" + strip0(log["topics"][2])[:8]
                          data = decode_words(log.get("data", "0x"))
                          enabled = bool(data[0])
                          capability_pairs.add((target.lower(), selector.lower()))
                          role_history.append({
                              "type":"PublicCapabilityUpdated","target":target.lower(),
                              "selector":selector.lower(),"enabled":enabled,**event_meta(log),
                          })
                      except Exception as exc:
                          product_result["errors"].setdefault("decode_public", []).append(repr(exc))

                  for log in event_pages["RoleCapabilityUpdated"]:
                      try:
                          role = int(log["topics"][1], 16)
                          target = "0x" + log["topics"][2][-40:]
                          selector = "0x" + strip0(log["topics"][3])[:8]
                          data = decode_words(log.get("data", "0x"))
                          enabled = bool(data[0])
                          capability_pairs.add((target.lower(), selector.lower()))
                          role_history.append({
                              "type":"RoleCapabilityUpdated","role":role,"target":target.lower(),
                              "selector":selector.lower(),"enabled":enabled,**event_meta(log),
                          })
                      except Exception as exc:
                          product_result["errors"].setdefault("decode_role_capability", []).append(repr(exc))

                  current_users = []
                  for user in sorted(users):
                      mask = safe(lambda user=user: call_user_roles(endpoint, latest, authority, user))
                      current_users.append({
                          "user":user,
                          "roles_mask":mask,
                          "roles":[r for r in range(256) if isinstance(mask,int) and ((mask >> r) & 1)],
                          "code":safe(lambda user=user: code_state(endpoint, latest, user)),
                      })

                  current_capabilities = []
                  for target, selector in sorted(capability_pairs):
                      public = safe(lambda target=target, selector=selector: call_public(
                          endpoint, latest, authority, target, selector
                      ))
                      roles_mask = safe(lambda target=target, selector=selector: call_capability_roles(
                          endpoint, latest, authority, target, selector
                      ))
                      if public is True or (isinstance(roles_mask,int) and roles_mask):
                          current_capabilities.append({
                              "target":target,"selector":selector,"public":public,"roles_mask":roles_mask,
                              "roles":[r for r in range(256) if isinstance(roles_mask,int) and ((roles_mask >> r) & 1)],
                              "target_code":safe(lambda target=target: code_state(endpoint, latest, target)),
                          })

                  active_edges = []
                  for user in current_users:
                      if not isinstance(user["roles_mask"], int):
                          continue
                      for capability in current_capabilities:
                          if not isinstance(capability["roles_mask"], int):
                              continue
                          matched = user["roles_mask"] & capability["roles_mask"]
                          if matched:
                              active_edges.append({
                                  "user":user["user"],"target":capability["target"],
                                  "selector":capability["selector"],
                                  "matched_roles":[r for r in range(256) if (matched >> r) & 1],
                              })

                  product_result["roles"] = {
                      "authority_owner":safe(lambda: decode_address(eth_call(
                          endpoint, latest, authority, "0x"+SELECTORS["owner"]
                      ))),
                      "authority_parent":safe(lambda: decode_address(eth_call(
                          endpoint, latest, authority, "0x"+SELECTORS["authority"]
                      ))),
                      "authority_code":safe(lambda: code_state(endpoint, latest, authority)),
                      "event_counts":{name:len(logs) for name,logs in event_pages.items()},
                      "history":role_history,
                      "users":current_users,
                      "capabilities":current_capabilities,
                      "active_edges":active_edges,
                  }

                  try:
                      peer_logs = fetch_logs(endpoint, teller, TOPICS["PeerSet"], product["start"], latest)
                  except Exception as exc:
                      peer_logs = []
                      product_result["errors"]["PeerSet"] = repr(exc)

                  peer_history = []
                  eids = set()
                  for log in peer_logs:
                      try:
                          data = decode_words(log.get("data", "0x"))
                          if len(data) != 2:
                              raise RuntimeError(f"unexpected PeerSet data words {len(data)}")
                          eid = data[0]
                          peer = "0x" + f"{data[1]:064x}"
                          eids.add(eid)
                          peer_history.append({"eid":eid,"peer":peer,**event_meta(log)})
                      except Exception as exc:
                          product_result["errors"].setdefault("decode_peer", []).append(repr(exc))

                  peers = []
                  for eid in sorted(eids):
                      peer_raw = safe(lambda eid=eid: eth_call(
                          endpoint, latest, teller, "0x"+SELECTORS["peers"]+uint_word(eid)
                      ))
                      peer = "0x" + strip0(peer_raw)[-64:] if isinstance(peer_raw,str) else peer_raw
                      peers.append({
                          "eid":eid,
                          "peer":peer,
                          "chain_state":safe(lambda eid=eid: call_eid(
                              endpoint, latest, teller, SELECTORS["id_to_chains"], eid
                          )),
                          "inbound_rate_limit":safe(lambda eid=eid: call_eid(
                              endpoint, latest, teller, SELECTORS["inbound_rate_limits"], eid
                          )),
                          "outbound_rate_limit":safe(lambda eid=eid: call_eid(
                              endpoint, latest, teller, SELECTORS["outbound_rate_limits"], eid
                          )),
                      })

                  product_result["peers"] = {
                      "teller_code":safe(lambda: code_state(endpoint, latest, teller)),
                      "event_count":len(peer_logs),
                      "history":peer_history,
                      "current":peers,
                  }
                  chain_result["products"][product_name] = product_result

              result["chains"][chain_name] = chain_result

          with open("veda-live-ledger.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")

          summary = {}
          for chain, chain_data in result["chains"].items():
              summary[chain] = {"block":chain_data.get("block"),"products":{}}
              for product, entry in chain_data.get("products",{}).items():
                  summary[chain]["products"][product] = {
                      "errors":entry.get("errors"),
                      "role_events":entry.get("roles",{}).get("event_counts"),
                      "active_users":sum(
                          1 for user in entry.get("roles",{}).get("users",[])
                          if isinstance(user.get("roles_mask"),int) and user["roles_mask"]
                      ),
                      "active_capabilities":len(entry.get("roles",{}).get("capabilities",[])),
                      "active_edges":len(entry.get("roles",{}).get("active_edges",[])),
                      "peer_eids":[peer["eid"] for peer in entry.get("peers",{}).get("current",[])],
                  }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload ledger
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-ledger
          path: veda-live-ledger.json
          if-no-files-found: error
          retention-days: 1
