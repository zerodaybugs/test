name: veda-live-rate-snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Snapshot live Scroll to Ethereum raw-share arbitrage gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          CHAINS = {
              "ethereum": {
                  "id": 1,
                  "rpcs": ["https://ethereum-rpc.publicnode.com", "https://eth.drpc.org", "https://rpc.mevblocker.io"],
              },
              "scroll": {
                  "id": 534352,
                  "rpcs": ["https://scroll-rpc.publicnode.com", "https://rpc.scroll.io", "https://scroll.drpc.org"],
              },
          }
          PRODUCTS = {
              "liquidBTC": {
                  "authority": "0x49F954c67ff235034b69b8a59fbe309A40256c8d",
                  "accountant": "0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0",
                  "teller": "0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
                  "queue": "0x77A2fd42F8769d8063F2E75061FC200014E41Edf",
                  "solver_scroll": "0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29",
                  "solver_ethereum": "0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929",
                  "one_share": 10**8,
              },
              "liquidETH": {
                  "authority": "0x485Bde66Bb668a51f2372E34e45B1c6226798122",
                  "accountant": "0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198",
                  "teller": "0x9AA79C84b79816ab920bBcE20f8f74557B514734",
                  "queue": "0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0",
                  "solver_scroll": "0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042",
                  "solver_ethereum": "0x23aff90ed3b3effcf78fb41ab001c525a6c32a01",
                  "one_share": 10**18,
              },
              "liquidUSD": {
                  "authority": "0xABa6Ba1e95E0926A6a6B917Fe4e2f19CEaE4fF2e",
                  "accountant": "0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7",
                  "teller": "0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
                  "queue": "0x38FC1BA73b7ED289955a07d9F11A85b6E388064A",
                  "solver_scroll": "0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610",
                  "solver_ethereum": "0x92b10e02825986bac2375bdacafa3e89e3f612aa",
                  "one_share": 10**6,
              },
          }
          ATTACKER = "0x1111111111111111111111111111111111111111"

          def sh(*args):
              p = subprocess.run([str(x) for x in args], text=True, capture_output=True)
              if p.returncode != 0:
                  raise RuntimeError({"args": args, "stdout": p.stdout, "stderr": p.stderr})
              return p.stdout.strip()

          SIG = {
              "rate": sh("cast", "sig", "getRate()"),
              "can_send": sh("cast", "sig", "getAmountCanBeSent(uint32)"),
              "can_receive": sh("cast", "sig", "getAmountCanBeReceived(uint32)"),
              "chain": sh("cast", "sig", "idToChains(uint32)"),
              "peer": sh("cast", "sig", "peers(uint32)"),
              "public": sh("cast", "sig", "isCapabilityPublic(address,bytes4)"),
              "can_call": sh("cast", "sig", "canCall(address,address,bytes4)"),
              "deposit_bridge_7": sh("cast", "sig", "depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)"),
              "deposit_bridge_8": sh("cast", "sig", "depositAndBridge(address,uint256,uint256,address,bytes,address,uint256,address)"),
              "queue_request": sh("cast", "sig", "requestOnChainWithdraw(address,uint128,uint16,uint24)"),
              "queue_solve": sh("cast", "sig", "solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),
              "bulk_withdraw": sh("cast", "sig", "bulkWithdraw(address,uint256,uint256,address)"),
          }

          def rpc(endpoint, method, params, timeout=35):
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
              request = urllib.request.Request(endpoint, data=body, method="POST", headers={"content-type": "application/json", "user-agent": "veda-live-rate-snapshot/1.0"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  payload = json.loads(response.read().decode())
              if "error" in payload:
                  raise RuntimeError(payload["error"])
              return payload["result"]

          def choose(config):
              failures = {}
              for endpoint in config["rpcs"]:
                  try:
                      if int(rpc(endpoint, "eth_chainId", []), 16) == config["id"]:
                          return endpoint, failures
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(failures)

          def strip0(value):
              value = str(value)
              return value[2:] if value.startswith("0x") else value

          def address_word(address):
              return strip0(address).lower().rjust(64, "0")

          def uint_word(value):
              return hex(int(value))[2:].rjust(64, "0")

          def bytes4_word(value):
              return strip0(value).lower().ljust(64, "0")

          def words(raw):
              value = strip0(raw)
              return [int(value[i:i+64], 16) for i in range(0, len(value), 64)] if value and len(value) % 64 == 0 else []

          def call(endpoint, target, data, block="latest"):
              return rpc(endpoint, "eth_call", [{"to": target, "data": data}, block])

          def bool_call(endpoint, authority, caller, target, selector):
              raw = call(endpoint, authority, SIG["can_call"] + address_word(caller) + address_word(target) + bytes4_word(selector))
              return bool(int(raw, 16))

          def public_call(endpoint, authority, target, selector):
              raw = call(endpoint, authority, SIG["public"] + address_word(target) + bytes4_word(selector))
              return bool(int(raw, 16))

          endpoints = {}
          chain_state = {}
          for chain_name, config in CHAINS.items():
              endpoint, failures = choose(config)
              endpoints[chain_name] = endpoint
              block_hex = rpc(endpoint, "eth_blockNumber", [])
              block = rpc(endpoint, "eth_getBlockByNumber", [block_hex, False])
              chain_state[chain_name] = {
                  "endpoint": endpoint,
                  "rpc_failures": failures,
                  "block": int(block_hex, 16),
                  "timestamp": int(block["timestamp"], 16),
              }

          output = {
              "generated_at_unix": int(time.time()),
              "chains": chain_state,
              "products": {},
              "active_positive_edges": [],
              "errors": [],
          }

          for product_name, product in PRODUCTS.items():
              row = {"one_share": product["one_share"]}
              output["products"][product_name] = row
              try:
                  eth = endpoints["ethereum"]
                  scroll = endpoints["scroll"]
                  eth_rate = int(call(eth, product["accountant"], SIG["rate"]), 16)
                  scroll_rate = int(call(scroll, product["accountant"], SIG["rate"]), 16)
                  outbound = words(call(scroll, product["teller"], SIG["can_send"] + uint_word(30101)))
                  inbound = words(call(eth, product["teller"], SIG["can_receive"] + uint_word(30214)))
                  scroll_chain = words(call(scroll, product["teller"], SIG["chain"] + uint_word(30101)))
                  eth_chain = words(call(eth, product["teller"], SIG["chain"] + uint_word(30214)))
                  scroll_peer = call(scroll, product["teller"], SIG["peer"] + uint_word(30101))
                  eth_peer = call(eth, product["teller"], SIG["peer"] + uint_word(30214))
                  db7_public = public_call(scroll, product["authority"], product["teller"], SIG["deposit_bridge_7"])
                  db8_public = public_call(scroll, product["authority"], product["teller"], SIG["deposit_bridge_8"])
                  db7_attacker = bool_call(scroll, product["authority"], ATTACKER, product["teller"], SIG["deposit_bridge_7"])
                  db8_attacker = bool_call(scroll, product["authority"], ATTACKER, product["teller"], SIG["deposit_bridge_8"])
                  request_public = public_call(eth, product["authority"], product["queue"], SIG["queue_request"])
                  request_attacker = bool_call(eth, product["authority"], ATTACKER, product["queue"], SIG["queue_request"])
                  solver_can_solve = bool_call(eth, product["authority"], product["solver_ethereum"], product["queue"], SIG["queue_solve"])
                  solver_can_withdraw = bool_call(eth, product["authority"], product["solver_ethereum"], product["teller"], SIG["bulk_withdraw"])
                  available_out = outbound[1] if len(outbound) > 1 else 0
                  available_in = inbound[1] if len(inbound) > 1 else 0
                  executable_shares = min(available_out, available_in)
                  delta = eth_rate - scroll_rate
                  gross_extra = executable_shares * max(delta, 0) // product["one_share"]
                  row.update({
                      "ethereum_rate": eth_rate,
                      "scroll_rate": scroll_rate,
                      "ethereum_minus_scroll": delta,
                      "edge_bps": delta * 10000 / scroll_rate if scroll_rate else None,
                      "scroll_outbound": outbound,
                      "ethereum_inbound": inbound,
                      "executable_shares": executable_shares,
                      "gross_extra_base_units": gross_extra,
                      "scroll_chain_config": scroll_chain,
                      "ethereum_chain_config": eth_chain,
                      "scroll_peer": scroll_peer,
                      "ethereum_peer": eth_peer,
                      "scroll_deposit_bridge_7_public": db7_public,
                      "scroll_deposit_bridge_8_public": db8_public,
                      "scroll_deposit_bridge_7_attacker": db7_attacker,
                      "scroll_deposit_bridge_8_attacker": db8_attacker,
                      "ethereum_queue_request_public": request_public,
                      "ethereum_queue_request_attacker": request_attacker,
                      "ethereum_solver_can_solve": solver_can_solve,
                      "ethereum_solver_can_bulk_withdraw": solver_can_withdraw,
                  })
                  if delta > 0 and executable_shares > 0 and (db7_attacker or db8_attacker) and request_attacker and solver_can_solve and solver_can_withdraw:
                      output["active_positive_edges"].append({"product": product_name, **row})
              except Exception as exc:
                  row["error"] = repr(exc)
                  output["errors"].append({"product": product_name, "error": repr(exc)})

          output["summary"] = {
              "active_positive_edge_count": len(output["active_positive_edges"]),
              "errors": len(output["errors"]),
              "rates": {
                  name: {
                      "ethereum": row.get("ethereum_rate"),
                      "scroll": row.get("scroll_rate"),
                      "edge_bps": row.get("edge_bps"),
                      "gross_extra_base_units": row.get("gross_extra_base_units"),
                  }
                  for name, row in output["products"].items()
              },
          }
          with open("veda-live-rate-snapshot.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps({"summary": output["summary"], "active_positive_edges": output["active_positive_edges"], "products": output["products"], "errors": output["errors"]}, indent=2, sort_keys=True))
          PY
      - name: Upload live snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-rate-snapshot
          path: veda-live-rate-snapshot.json
          if-no-files-found: error
          retention-days: 1
