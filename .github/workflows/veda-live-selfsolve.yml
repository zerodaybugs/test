name: veda-live-selfsolve

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify Ethereum user self-solve capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request
          RPCS=["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          PRODUCTS={
            "liquidBTC":{"authority":"0x49F954c67ff235034b69b8a59fbe309A40256c8d","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929"},
            "liquidETH":{"authority":"0x485Bde66Bb668a51f2372E34e45B1c6226798122","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01"},
            "liquidUSD":{"authority":"0xABa6Ba1e95E0926A6a6B917Fe4e2f19CEaE4fF2e","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa"},
          }
          def sh(*a):
            p=subprocess.run([str(x) for x in a],text=True,capture_output=True)
            if p.returncode: raise RuntimeError({"args":a,"stdout":p.stdout,"stderr":p.stderr})
            return p.stdout.strip()
          S={
            "canCall":sh("cast","sig","canCall(address,address,bytes4)"),
            "isPublic":sh("cast","sig","isCapabilityPublic(address,bytes4)"),
            "selfSolve":sh("cast","sig","boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
            "selfMintSolve":sh("cast","sig","boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
          }
          def rpc(ep,m,p,t=30):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode()
            req=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-live-selfsolve/1.0"})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          def choose():
            bad={}
            for ep in RPCS:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==1:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def call(ep,to,data):return rpc(ep,"eth_call",[{"to":to,"data":data},"latest"])
          def gate(ep,auth,caller,target,sel):return bool(int(call(ep,auth,S["canCall"]+aw(caller)+aw(target)+sw(sel)),16))
          def public(ep,auth,target,sel):return bool(int(call(ep,auth,S["isPublic"]+aw(target)+sw(sel)),16))
          ep,bad=choose();block=int(rpc(ep,"eth_blockNumber",[]),16)
          out={"generated_at_unix":int(time.time()),"endpoint":ep,"rpc_failures":bad,"block":block,"selectors":S,"products":{},"errors":[]}
          for name,p in PRODUCTS.items():
            try:
              code=rpc(ep,"eth_getCode",[p["solver"],"latest"])
              out["products"][name]={
                "solver":p["solver"].lower(),"code_bytes":len(st(code))//2,
                "self_solve_public":public(ep,p["authority"],p["solver"],S["selfSolve"]),
                "self_solve_attacker":gate(ep,p["authority"],ATTACKER,p["solver"],S["selfSolve"]),
                "self_mint_solve_public":public(ep,p["authority"],p["solver"],S["selfMintSolve"]),
                "self_mint_solve_attacker":gate(ep,p["authority"],ATTACKER,p["solver"],S["selfMintSolve"]),
              }
            except Exception as e:
              out["products"][name]={"error":repr(e)};out["errors"].append({"product":name,"error":repr(e)})
          out["summary"]={"permissionless_self_solve_products":[n for n,r in out["products"].items() if r.get("self_solve_attacker")],"errors":len(out["errors"])}
          with open("veda-live-selfsolve.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload self-solve gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-selfsolve
          path: veda-live-selfsolve.json
          if-no-files-found: error
          retention-days: 1
