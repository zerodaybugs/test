name: veda-live-trigger-capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Watch exact Ethereum-Scroll rate edges
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request

          PRODUCTS={
            'liquidETH':{'accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','one_share':10**18},
            'liquidBTC':{'accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','one_share':10**8},
            'liquidUSD':{'accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','one_share':10**6},
          }
          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org','https://rpc.mevblocker.io']},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']},
          }
          GET_RATE=subprocess.check_output(['cast','sig','getRate()'],text=True).strip()
          def rpc(url,m,p,timeout=20):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(url,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-live-trigger/1'})
            with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          def choose(chain):
            bad={}
            for u in CHAINS[chain]['rpcs']:
              try:
                if int(rpc(u,'eth_chainId',[]),16)!=CHAINS[chain]['id']:raise RuntimeError('wrong chain')
                return u,bad
              except Exception as e:bad[u]=repr(e)
            raise RuntimeError(bad)
          endpoints={};failures={}
          for c in CHAINS:endpoints[c],failures[c]=choose(c)
          samples=[];trigger=None;errors=[]
          deadline=time.time()+15*60
          while time.time()<deadline and trigger is None:
            sample={'wallclock_unix':int(time.time()),'chains':{},'products':{}}
            try:
              for chain,url in endpoints.items():
                block=int(rpc(url,'eth_blockNumber',[]),16)
                obj=rpc(url,'eth_getBlockByNumber',[hex(block),False])
                sample['chains'][chain]={'block':block,'timestamp':int(obj['timestamp'],16)}
              for product,cfg in PRODUCTS.items():
                er=int(rpc(endpoints['ethereum'],'eth_call',[{'to':cfg['accountant'],'data':GET_RATE},'latest']),16)
                sr=int(rpc(endpoints['scroll'],'eth_call',[{'to':cfg['accountant'],'data':GET_RATE},'latest']),16)
                sample['products'][product]={'ethereum_rate':er,'scroll_rate':sr,'scroll_to_ethereum_edge_raw':er-sr,'ethereum_to_scroll_edge_raw':sr-er}
                if er>sr:
                  trigger={'direction':'scroll_to_ethereum','product':product,'edge_raw':er-sr,'sample':sample}
                  break
                if sr>er:
                  trigger={'direction':'ethereum_to_scroll','product':product,'edge_raw':sr-er,'sample':sample}
                  break
              samples.append(sample)
            except Exception as e:
              errors.append({'wallclock_unix':int(time.time()),'error':repr(e)})
            if trigger is None:time.sleep(5)
          out={'generated_at_unix':int(time.time()),'endpoints':endpoints,'rpc_failures':failures,'sample_count':len(samples),'trigger':trigger,'errors':errors,'first_sample':samples[0] if samples else None,'last_sample':samples[-1] if samples else None,
               'verdict':{'live_rate_edge_detected':trigger is not None,'requires_immediate_fixed_block_poc':trigger is not None}}
          open('veda-live-trigger-capture.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out['verdict']|{'trigger':trigger,'sample_count':len(samples),'errors':errors},indent=2,sort_keys=True))
          PY

      - name: Upload live trigger evidence
        uses: actions/upload-artifact@v4
        with:
          name: veda-live-trigger-capture
          path: veda-live-trigger-capture.json
          if-no-files-found: error
          retention-days: 1
