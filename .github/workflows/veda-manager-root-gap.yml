name: veda-manager-root-gap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect legacy Optimism manager and no-code root holders
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, urllib.parse, time, traceback

          ZERO='0x0000000000000000000000000000000000000000'
          ATTACKER='0x1111111111111111111111111111111111111111'
          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org'],'explorer':'https://eth.blockscout.com','holders':['0x18deea881548a592285d9ba63f0f67dc97e28e99','0xc8111d00351765c64d301cdfc1848bf5ff2e23a2']},
            'optimism':{'id':10,'rpcs':['https://optimism-rpc.publicnode.com','https://mainnet.optimism.io'],'explorer':'https://optimism.blockscout.com','holders':['0x18deea881548a592285d9ba63f0f67dc97e28e99','0xc8111d00351765c64d301cdfc1848bf5ff2e23a2']},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io'],'explorer':'https://scroll.blockscout.com','holders':['0x18deea881548a592285d9ba63f0f67dc97e28e99','0xc8111d00351765c64d301cdfc1848bf5ff2e23a2']},
            'ink':{'id':57073,'rpcs':['https://rpc-gel.inkonchain.com'],'explorer':'https://explorer.inkonchain.com','holders':['0x1e76918e4da0f12f47171698e2935133f899116c','0x49faebd1caed2488398e80fbb9d1dfcb8b502bdc']},
          }
          MANAGER='0xf9f7969c357ce6dfd7973098ea0d57173592bcca'
          def sh(*args):
            p=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if p.returncode: raise RuntimeError({'args':args,'stdout':p.stdout,'stderr':p.stderr})
            return p.stdout.strip()
          def sig(x): return sh('cast','sig',x)
          def topic(x): return sh('cast','keccak',x).lower()
          S={'vault':sig('vault()'),'authority':sig('authority()'),'owner':sig('owner()'),'paused':sig('isPaused()'),'root':sig('manageRoot(address)'),'manage':sig('manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])'),'can':sig('canCall(address,address,bytes4)'),'pub':sig('isCapabilityPublic(address,bytes4)')}
          ROOT_TOPIC=topic('ManageRootUpdated(address,bytes32,bytes32)')
          def rpc(ep,m,p,t=45):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-manager-gap/1'})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if 'error' in o: raise RuntimeError(o['error'])
            return o['result']
          def choose(c):
            bad={}
            for ep in c['rpcs']:
              try:
                if int(rpc(ep,'eth_chainId',[]),16)==c['id']:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def h(x):
            x=str(x or '');return x[2:] if x.startswith('0x') else x
          def aw(a):return h(a).lower().rjust(64,'0')
          def bw(s):return h(s).lower().ljust(64,'0')
          def addr(raw):return ZERO if not raw or raw=='0x' else '0x'+h(raw)[-40:].lower()
          def call(ep,to,data,frm=None):
            tx={'to':to,'data':data}
            if frm:tx['from']=frm
            return rpc(ep,'eth_call',[tx,'latest'])
          def safe(ep,to,data,frm=None):
            try:return {'ok':True,'raw':call(ep,to,data,frm)}
            except Exception as e:return {'ok':False,'error':repr(e)}
          def http(url,t=45):
            req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'veda-manager-gap/1'})
            with urllib.request.urlopen(req,timeout=t) as r:return json.loads(r.read().decode())
          def logs(explorer,address,max_pages=100):
            url=f'{explorer}/api/v2/addresses/{address}/logs';out=[];errs=[]
            for _ in range(max_pages):
              try:p=http(url)
              except Exception as e:errs.append(repr(e));break
              out.extend(p.get('items') or []);nxt=p.get('next_page_params')
              if not nxt:break
              url=f'{explorer}/api/v2/addresses/{address}/logs?'+urllib.parse.urlencode(nxt);time.sleep(.04)
            return out,errs
          def smart(explorer,address):
            try:return http(f'{explorer}/api/v2/smart-contracts/{address}')
            except Exception as e:return {'_error':repr(e)}
          def address_meta(explorer,address):
            try:return http(f'{explorer}/api/v2/addresses/{address}')
            except Exception as e:return {'_error':repr(e)}
          def abi_functions(sc):
            abi=sc.get('abi') if isinstance(sc,dict) else []
            if isinstance(abi,str):
              try:abi=json.loads(abi)
              except:abi=[]
            return [{'name':x.get('name'),'inputs':[i.get('type') for i in x.get('inputs',[])],'outputs':[i.get('type') for i in x.get('outputs',[])],'state':x.get('stateMutability')} for x in abi or [] if isinstance(x,dict) and x.get('type')=='function']

          out={'generated_at_unix':int(time.time()),'chains':{},'optimism_liquideth_manager':{},'errors':[]}
          for cn,c in CHAINS.items():
            row={'holders':{}};out['chains'][cn]=row
            try:
              ep,bad=choose(c);row.update({'endpoint':ep,'rpc_failures':bad,'block':int(rpc(ep,'eth_blockNumber',[]),16)})
              for a in c['holders']:
                code=rpc(ep,'eth_getCode',[a,'latest']);nonce=int(rpc(ep,'eth_getTransactionCount',[a,'latest']),16);bal=int(rpc(ep,'eth_getBalance',[a,'latest']),16)
                row['holders'][a]={'code_bytes':len(h(code))//2,'nonce':nonce,'balance':bal,'blockscout':address_meta(c['explorer'],a)}
            except Exception as e:row['error']=repr(e);out['errors'].append({'chain':cn,'error':repr(e)})
          try:
            c=CHAINS['optimism'];ep=out['chains']['optimism']['endpoint'];m=out['optimism_liquideth_manager'];code=rpc(ep,'eth_getCode',[MANAGER,'latest']);sc=smart(c['explorer'],MANAGER);fs=abi_functions(sc)
            m.update({'address':MANAGER,'code_bytes':len(h(code))//2,'verified_name':sc.get('name') or sc.get('contract_name'),'abi_functions':fs,'getter_calls':{}})
            for name,s in S.items():
              if name in ('root','can','pub'):continue
              m['getter_calls'][name]=safe(ep,MANAGER,s)
            vault=m['getter_calls']['vault'];authority=m['getter_calls']['authority'];auth=addr(authority.get('raw')) if authority.get('ok') and authority.get('raw')!='0x' else ZERO
            m['decoded_vault']=addr(vault.get('raw')) if vault.get('ok') and vault.get('raw')!='0x' else ZERO;m['decoded_authority']=auth
            m['manage_public']=safe(ep,auth,S['pub']+aw(MANAGER)+bw(S['manage'])) if auth!=ZERO else None
            m['attacker_manage']=safe(ep,auth,S['can']+aw(ATTACKER)+aw(MANAGER)+bw(S['manage'])) if auth!=ZERO else None
            ls,errs=logs(c['explorer'],MANAGER);m['log_errors']=errs;candidates={MANAGER}
            for log in ls:
              ts=[str(x).lower() for x in (log.get('topics') or [])]
              if len(ts)>=2 and ts[0]==ROOT_TOPIC:candidates.add('0x'+h(ts[1])[-40:].lower())
            m['root_holders']=[]
            for a in sorted(candidates):
              rr=safe(ep,MANAGER,S['root']+aw(a));root=rr.get('raw') if rr.get('ok') else None
              if root and root!='0x' and int(root,16)!=0:
                codea=rpc(ep,'eth_getCode',[a,'latest']);nonce=int(rpc(ep,'eth_getTransactionCount',[a,'latest']),16);canr=safe(ep,auth,S['can']+aw(a)+aw(MANAGER)+bw(S['manage'])) if auth!=ZERO else None
                m['root_holders'].append({'address':a,'root':root,'code_bytes':len(h(codea))//2,'nonce':nonce,'authorized_manage':bool(int(canr['raw'],16)) if canr and canr.get('ok') else None,'metadata':address_meta(c['explorer'],a)})
          except Exception as e:out['optimism_liquideth_manager']['error']=repr(e);out['optimism_liquideth_manager']['traceback']=traceback.format_exc();out['errors'].append({'section':'optimism_liquideth_manager','error':repr(e)})
          out['summary']={'errors':len(out['errors']),'no_code_zero_nonce':[(cn,a) for cn,c in out['chains'].items() for a,v in c.get('holders',{}).items() if v.get('code_bytes')==0 and v.get('nonce')==0],'op_manager_root_holders':len(out['optimism_liquideth_manager'].get('root_holders',[]))}
          open('veda-manager-root-gap.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload gap proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-manager-root-gap
          path: veda-manager-root-gap.json
          if-no-files-found: error
          retention-days: 1
