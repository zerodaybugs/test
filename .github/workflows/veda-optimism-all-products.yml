name: veda-optimism-all-products

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct all Ethereum to Optimism product routes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          ATTACKER="0x1111111111111111111111111111111111111111"
          ETH_RPC=["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"]
          OP_RPC=["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"]
          PRODUCTS={
            "liquidBTC":{
              "vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353","queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929","one_share":10**8,
              "source_assets":{
                "WBTC":"0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599","cbBTC":"0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf","LBTC":"0x8236a87084f8B84306f72007F36F2618A5634494","fBTC":"0xC96dE26018A54D51c097160568752c4E3BD6C364","eBTC":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642"},
              "destination_assets":{
                "WBTC":"0x68f180fcCe6836688e9084f035309E29Bf0A2095","eBTC":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642"}},
            "liquidETH":{
              "vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01","one_share":10**18,
              "source_assets":{
                "WETH":"0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2","weETH":"0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee","eETH":"0x35fA164735182de50811E8e2E824cFb9B6118ac2","wstETH":"0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0","aEthWETH":"0x4d5F47FA6A74757f35C14fD3a6Ef8E3C9BC514E8","LiquidKatanaETH":"0x69d210d3b60e939bfa6e87cccc4fab7e8f44c16b"},
              "destination_assets":{
                "WETH":"0x4200000000000000000000000000000000000006","weETH":"0x346e03F8Cce9fE01dCB3d0Da3e9D00dC2c0E08f0","weETH_OFT":"0x5A7fACB970D094B6C7FF1df0eA68D99E6e73CBFF","wstETH":"0x1F32b1c2345538c0c6f582fCB022739c4A194Ebb"}},
            "liquidUSD":{
              "vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387","queue":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa","one_share":10**6,
              "source_assets":{
                "USDC":"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48","USDT":"0xdAC17F958D2ee523a2206206994597C13D831ec7","DAI":"0x6B175474E89094C44Da98b954EedeAC495271d0F","USDe":"0x4c9EDD5852cd905f086C759E8383e09bff1E68B3","sUSDe":"0x9D39A5DE30e57443BfF2A8307A4256c8797A3497"},
              "destination_assets":{
                "USDC":"0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85","USDT":"0x94b008aA00579c1307B0EF2c499aD98a8ce58e58","DAI":"0xDA10009cBd5D07dd0CeCc66161FC93D7c9000da1","USDe":"0x5d3a1Ff2b6BAb83b63cd9AD0787074081a52ef34"}}
          }

          def rpc(ep,method,params,timeout=35):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-optimism-all-products/1.0"})
              with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
              if "error" in o:raise RuntimeError(o["error"])
              return o["result"]
          def choose(eps,chainid):
              bad={}
              for ep in eps:
                  try:
                      if int(rpc(ep,"eth_chainId",[]),16)==chainid:return ep
                  except Exception as e:bad[ep]=repr(e)
              raise RuntimeError(bad)
          def sig(s):return subprocess.check_output(["cast","sig",s],text=True).strip()
          def strip0(x):return x[2:] if x.startswith("0x") else x
          def aw(a):return strip0(a).lower().rjust(64,"0")
          def sw(s):return strip0(s).lower().ljust(64,"0")
          def words(raw):
              x=strip0(raw);return [int(x[i:i+64],16) for i in range(0,len(x),64)] if x else []
          def addr(raw):return "0x"+strip0(raw)[-40:]
          def text(raw):
              x=strip0(raw)
              try:
                  off=int(x[:64],16)*2;n=int(x[off:off+64],16);return bytes.fromhex(x[off+64:off+64+n*2]).decode(errors="replace")
              except Exception:return None

          E=choose(ETH_RPC,1);O=choose(OP_RPC,10)
          blocks={"ethereum":rpc(E,"eth_blockNumber",[]),"optimism":rpc(O,"eth_blockNumber",[])}
          PUBLIC=sig("isCapabilityPublic(address,bytes4)");CAN=sig("canCall(address,address,bytes4)")
          S={"authority":sig("authority()"),"getRate":sig("getRate()"),"quote":sig("getRateInQuoteSafe(address)"),"assetData":sig("assetData(address)"),"withdrawAssets":sig("withdrawAssets(address)"),"balanceOf":sig("balanceOf(address)"),"decimals":sig("decimals()"),"symbol":sig("symbol()"),"depositBridge":sig("depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)"),"queueRequest":sig("requestOnChainWithdraw(address,uint128,uint16,uint24)"),"queueSolve":sig("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),"bulkWithdraw":sig("bulkWithdraw(address,uint256,uint256,address)")}
          errors=[];products={};routes=[]
          def safe(ep,block,to,data,label):
              try:return rpc(ep,"eth_call",[{"to":to,"data":data},block])
              except Exception as e:errors.append({"label":label,"error":repr(e)});return None
          def gate(ep,block,auth,target,selector,caller):
              raw=safe(ep,block,auth,CAN+aw(caller)+aw(target)+sw(selector),"canCall")
              return bool(int(raw,16)) if raw else False

          for pname,p in PRODUCTS.items():
              pa={}
              for side,ep,block in (("ethereum",E,blocks["ethereum"]),("optimism",O,blocks["optimism"])):
                  ta=addr(rpc(ep,"eth_call",[{"to":p["teller"],"data":S["authority"]},block]));qa=addr(rpc(ep,"eth_call",[{"to":p["queue"],"data":S["authority"]},block]))
                  base_rate=int(rpc(ep,"eth_call",[{"to":p["accountant"],"data":S["getRate"]},block]),16)
                  asset_map=p["source_assets"] if side=="ethereum" else p["destination_assets"]
                  aa={}
                  for label,a in asset_map.items():
                      code=rpc(ep,"eth_getCode",[a,block])
                      if len(code)<=2:aa[label]={"address":a.lower(),"code_bytes":0};continue
                      ad=safe(ep,block,p["teller"],S["assetData"]+aw(a),f"{pname}:{side}:{label}:assetData");qd=safe(ep,block,p["queue"],S["withdrawAssets"]+aw(a),f"{pname}:{side}:{label}:queue");q=safe(ep,block,p["accountant"],S["quote"]+aw(a),f"{pname}:{side}:{label}:quote");b=safe(ep,block,a,S["balanceOf"]+aw(p["vault"]),f"{pname}:{side}:{label}:balance");d=safe(ep,block,a,S["decimals"],f"{pname}:{side}:{label}:decimals");sy=safe(ep,block,a,S["symbol"],f"{pname}:{side}:{label}:symbol")
                      adw=words(ad) if ad else [];qdw=words(qd) if qd else []
                      aa[label]={"address":a.lower(),"code_bytes":(len(code)-2)//2,"symbol":text(sy) if sy else None,"decimals":int(d,16) if d else None,"quote":int(q,16) if q else None,"vault_balance":int(b,16) if b else 0,"allow_deposit":bool(adw[0]) if len(adw)>0 else False,"allow_direct_withdraw":bool(adw[1]) if len(adw)>1 else False,"premium_bps":adw[2] if len(adw)>2 else 0,"allow_queue":bool(qdw[0]) if len(qdw)>0 else False,"min_discount_bps":qdw[3] if len(qdw)>3 else 0,"max_discount_bps":qdw[4] if len(qdw)>4 else 0}
                  pa[side]={"base_rate":base_rate,"teller_authority":ta,"queue_authority":qa,"deposit_bridge_open":gate(ep,block,ta,p["teller"],S["depositBridge"],ATTACKER),"queue_request_open":gate(ep,block,qa,p["queue"],S["queueRequest"],ATTACKER),"solver_can_solve":gate(ep,block,qa,p["queue"],S["queueSolve"],p["solver"]),"solver_can_withdraw":gate(ep,block,ta,p["teller"],S["bulkWithdraw"],p["solver"]),"assets":aa}
              products[pname]=pa
              src=pa["ethereum"];dst=pa["optimism"]
              for sl,sa in src["assets"].items():
                  if not (sa.get("allow_deposit") and sa.get("quote") and src["deposit_bridge_open"]):continue
                  for dl,da in dst["assets"].items():
                      if not (da.get("allow_queue") and da.get("quote") and dst["queue_request_open"]):continue
                      one=p["one_share"];input_amount=10**(sa["decimals"] or 18);shares=(input_amount*one//sa["quote"])*(10000-(sa.get("premium_bps") or 0))//10000;payout=(shares*da["quote"]//one)*(10000-(da.get("min_discount_bps") or 0))//10000
                      src_base=input_amount*src["base_rate"]//sa["quote"]
                      dst_base=payout*dst["base_rate"]//da["quote"]
                      max_shares_by_liq=(da.get("vault_balance") or 0)*one//da["quote"]
                      max_input=max_shares_by_liq*sa["quote"]//one*10000//max(1,10000-(sa.get("premium_bps") or 0));max_payout=max_shares_by_liq*da["quote"]//one*(10000-(da.get("min_discount_bps") or 0))//10000
                      max_src_base=max_input*src["base_rate"]//sa["quote"];max_dst_base=max_payout*dst["base_rate"]//da["quote"]
                      same_family=(sl==dl) or ({sl,dl} <= {"weETH","weETH_OFT"})
                      routes.append({"product":pname,"source_asset":sl,"destination_asset":dl,"source_quote":sa["quote"],"destination_quote":da["quote"],"source_base_rate":src["base_rate"],"destination_base_rate":dst["base_rate"],"source_premium_bps":sa.get("premium_bps",0),"destination_discount_bps":da.get("min_discount_bps",0),"same_family":same_family,"one_source_token":{"input":input_amount,"shares":shares,"output":payout,"source_base_value":src_base,"destination_base_value":dst_base,"base_profit":dst_base-src_base},"destination_liquidity":da.get("vault_balance",0),"max_liquid_shares":max_shares_by_liq,"max_source_input":max_input,"max_destination_output":max_payout,"max_source_base_value":max_src_base,"max_destination_base_value":max_dst_base,"max_base_profit":max_dst_base-max_src_base,"normal_solver_path":dst["solver_can_solve"] and dst["solver_can_withdraw"],"user_side_open":src["deposit_bridge_open"] and dst["queue_request_open"]})
          flags=[r for r in routes if r["user_side_open"] and r["normal_solver_path"] and r["same_family"] and r["max_base_profit"]>0]
          out={"generated_at_unix":int(time.time()),"blocks":{k:int(v,16) for k,v in blocks.items()},"products":products,"routes":routes,"flags":flags,"errors":errors}
          with open("veda-optimism-all-products.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"flags":flags,"route_count":len(routes),"errors":errors},indent=2,sort_keys=True))
          PY
      - name: Upload route matrix
        uses: actions/upload-artifact@v4
        with:
          name: veda-optimism-all-products
          path: veda-optimism-all-products.json
          if-no-files-found: error
          retention-days: 1
