name: veda-optimism-cap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Query Optimism direct exits and exact rounding loops
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request

          RPCS=["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          PRODUCTS={
            "liquidBTC":{"authority":"0x49f954c67ff235034b69b8a59fbe309a40256c8d","vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353","queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929","one":10**8,"assets":{"WBTC":"0x68f180fcCe6836688e9084f035309E29Bf0A2095","eBTC":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642"}},
            "liquidETH":{"authority":"0x485bde66bb668a51f2372e34e45b1c6226798122","vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01","one":10**18,"assets":{"WETH":"0x4200000000000000000000000000000000000006","weETH_OFT":"0x5A7fACB970D094B6C7FF1df0eA68D99E6e73CBFF"}},
            "liquidUSD":{"authority":"0xff90f1b24dfbd25f439b94ed090f373bde24f60e","vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387","queue":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa","one":10**6,"assets":{"USDC":"0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85","USDT":"0x94b008aA00579c1307B0EF2c499aD98a8ce58e58"}}
          }
          def sh(*a):
            p=subprocess.run([str(x) for x in a],text=True,capture_output=True)
            if p.returncode: raise RuntimeError({"a":a,"out":p.stdout,"err":p.stderr})
            return p.stdout.strip()
          S={
            "can":"0x"+sh("cast","sig","canCall(address,address,bytes4)")[2:],
            "pub":"0x"+sh("cast","sig","isCapabilityPublic(address,bytes4)")[2:],
            "deposit":sh("cast","sig","deposit(address,uint256,uint256)"),
            "withdraw":sh("cast","sig","withdraw(address,uint256,uint256,address)"),
            "queue":sh("cast","sig","requestOnChainWithdraw(address,uint128,uint16,uint24)"),
            "self":sh("cast","sig","boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
            "selfmint":sh("cast","sig","boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
            "quote":sh("cast","sig","getRateInQuoteSafe(address)"),
            "assetData":sh("cast","sig","assetData(address)"),
            "balance":sh("cast","sig","balanceOf(address)"),
            "decimals":sh("cast","sig","decimals()"),
          }
          def rpc(ep,m,p,t=35):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();r=urllib.request.Request(ep,data=b,method="POST",headers={"content-type":"application/json","user-agent":"veda-optimism-cap/1"})
            with urllib.request.urlopen(r,timeout=t) as f:o=json.loads(f.read().decode())
            if "error" in o: raise RuntimeError(o["error"])
            return o["result"]
          ep=None;fail={}
          for x in RPCS:
            try:
              if int(rpc(x,"eth_chainId",[]),16)==10: ep=x;break
            except Exception as e: fail[x]=repr(e)
          if not ep: raise RuntimeError(fail)
          block=int(rpc(ep,"eth_blockNumber",[]),16)
          def z(x):return (x[2:] if str(x).startswith("0x") else str(x)).lower()
          def aw(a):return z(a).rjust(64,"0")
          def bw(s):return z(s).ljust(64,"0")
          def call(to,data):return rpc(ep,"eth_call",[{"to":to,"data":data},"latest"])
          def can(auth,caller,target,sel):return bool(int(call(auth,S["can"]+aw(caller)+aw(target)+bw(sel)),16))
          def pub(auth,target,sel):return bool(int(call(auth,S["pub"]+aw(target)+bw(sel)),16))
          def words(raw):
            h=z(raw);return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h and len(h)%64==0 else []
          out={"block":block,"endpoint":ep,"rpc_failures":fail,"products":{},"positive_loops":[],"errors":[]}
          for name,p in PRODUCTS.items():
            row={"capabilities":{},"assets":{},"roundtrip_search":[]};out["products"][name]=row
            try:
              for key,target,sel in (("deposit",p["teller"],S["deposit"]),("withdraw",p["teller"],S["withdraw"]),("queue_request",p["queue"],S["queue"]),("self_solve",p["solver"],S["self"]),("self_mint",p["solver"],S["selfmint"])):
                row["capabilities"][key]={"public":pub(p["authority"],target,sel),"attacker":can(p["authority"],ATTACKER,target,sel),"selector":sel}
              for an,a in p["assets"].items():
                q=int(call(p["accountant"],S["quote"]+aw(a)),16);ad=words(call(p["teller"],S["assetData"]+aw(a)));bal=int(call(a,S["balance"]+aw(p["vault"])),16);dec=int(call(a,S["decimals"]),16)
                row["assets"][an]={"address":a.lower(),"quote":q,"allow_deposit":bool(ad[0]) if ad else False,"allow_withdraw":bool(ad[1]) if len(ad)>1 else False,"premium_bps":ad[2] if len(ad)>2 else 0,"vault_balance":bal,"decimals":dec}
              if row["capabilities"]["deposit"]["attacker"] and row["capabilities"]["withdraw"]["attacker"]:
                for src,sa in row["assets"].items():
                  if not sa["allow_deposit"]: continue
                  for dst,da in row["assets"].items():
                    if not da["allow_withdraw"]: continue
                    # Search all small raw amounts and quotient boundaries, plus liquidity endpoints.
                    candidates=set(range(1,200000))
                    max_shares=da["vault_balance"]*p["one"]//da["quote"]
                    max_in=max_shares*sa["quote"]//p["one"]*10000//max(1,10000-sa["premium_bps"])
                    candidates.update([max(1,max_in+d) for d in range(-20,21)])
                    # Deposit quotient boundaries for first 200k share values and around max.
                    for s in range(1,200001):
                      x=(s*sa["quote"]+p["one"]-1)//p["one"]
                      if x<=max_in: candidates.add(x); candidates.add(max(1,x-1)); candidates.add(x+1)
                    best=None
                    for x in candidates:
                      if x<=0 or x>max_in: continue
                      sh=x*p["one"]//sa["quote"];sh=sh*(10000-sa["premium_bps"])//10000
                      y=sh*da["quote"]//p["one"]
                      # Common base-value comparison.
                      src_base=x*int(call(p["accountant"],sh("cast","sig","getRate()")),16)//sa["quote"]
                      dst_base=y*int(call(p["accountant"],sh("cast","sig","getRate()")),16)//da["quote"]
                      profit=dst_base-src_base
                      if best is None or profit>best[0]: best=(profit,x,sh,y,src_base,dst_base)
                    item={"source":src,"destination":dst,"max_input":max_in,"best":{"base_profit":best[0],"input":best[1],"shares":best[2],"output":best[3],"source_base":best[4],"destination_base":best[5]} if best else None}
                    row["roundtrip_search"].append(item)
                    if best and best[0]>0: out["positive_loops"].append({"product":name,**item})
            except Exception as e:
              row["error"]=repr(e);out["errors"].append({"product":name,"error":repr(e)})
          out["summary"]={"positive_loop_count":len(out["positive_loops"]),"errors":len(out["errors"])}
          open("veda-optimism-cap.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload Optimism proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-optimism-cap
          path: veda-optimism-cap.json
          if-no-files-found: error
          retention-days: 1
