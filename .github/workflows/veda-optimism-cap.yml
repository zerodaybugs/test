name: veda-optimism-cap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Query Optimism direct exits and exact rounding loops
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request

          RPCS=["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          PRODUCTS={
            "liquidBTC":{"authority":"0x49f954c67ff235034b69b8a59fbe309a40256c8d","vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353","queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929","one":10**8,"assets":{"WBTC":"0x68f180fcCe6836688e9084f035309E29Bf0A2095","eBTC":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642"}},
            "liquidETH":{"authority":"0x485bde66bb668a51f2372e34e45b1c6226798122","vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01","one":10**18,"assets":{"WETH":"0x4200000000000000000000000000000000000006","weETH_OFT":"0x5A7fACB970D094B6C7FF1df0eA68D99E6e73CBFF"}},
            "liquidUSD":{"authority":"0xff90f1b24dfbd25f439b94ed090f373bde24f60e","vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387","queue":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa","one":10**6,"assets":{"USDC":"0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85","USDT":"0x94b008aA00579c1307B0EF2c499aD98a8ce58e58"}}
          }
          def shell(*args):
            proc=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if proc.returncode: raise RuntimeError({"args":args,"stdout":proc.stdout,"stderr":proc.stderr})
            return proc.stdout.strip()
          S={
            "can":shell("cast","sig","canCall(address,address,bytes4)"),
            "pub":shell("cast","sig","isCapabilityPublic(address,bytes4)"),
            "deposit":shell("cast","sig","deposit(address,uint256,uint256)"),
            "withdraw":shell("cast","sig","withdraw(address,uint256,uint256,address)"),
            "queue":shell("cast","sig","requestOnChainWithdraw(address,uint128,uint16,uint24)"),
            "self":shell("cast","sig","boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
            "selfmint":shell("cast","sig","boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
            "quote":shell("cast","sig","getRateInQuoteSafe(address)"),
            "rate":shell("cast","sig","getRate()"),
            "assetData":shell("cast","sig","assetData(address)"),
            "balance":shell("cast","sig","balanceOf(address)"),
            "decimals":shell("cast","sig","decimals()"),
          }
          def rpc(endpoint,method,params,timeout=35):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
            request=urllib.request.Request(endpoint,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-optimism-cap/2"})
            with urllib.request.urlopen(request,timeout=timeout) as response: payload=json.loads(response.read().decode())
            if "error" in payload: raise RuntimeError(payload["error"])
            return payload["result"]
          endpoint=None;failures={}
          for candidate in RPCS:
            try:
              if int(rpc(candidate,"eth_chainId",[]),16)==10: endpoint=candidate;break
            except Exception as exc: failures[candidate]=repr(exc)
          if not endpoint: raise RuntimeError(failures)
          block=int(rpc(endpoint,"eth_blockNumber",[]),16)
          def strip0(value):
            text=str(value);return (text[2:] if text.startswith("0x") else text).lower()
          def address_word(address): return strip0(address).rjust(64,"0")
          def bytes4_word(selector): return strip0(selector).ljust(64,"0")
          def call(target,data): return rpc(endpoint,"eth_call",[{"to":target,"data":data},"latest"])
          def can(authority,caller,target,selector): return bool(int(call(authority,S["can"]+address_word(caller)+address_word(target)+bytes4_word(selector)),16))
          def public(authority,target,selector): return bool(int(call(authority,S["pub"]+address_word(target)+bytes4_word(selector)),16))
          def words(raw):
            value=strip0(raw);return [int(value[i:i+64],16) for i in range(0,len(value),64)] if value and len(value)%64==0 else []

          output={"block":block,"endpoint":endpoint,"rpc_failures":failures,"products":{},"positive_loops":[],"errors":[]}
          for product_name,product in PRODUCTS.items():
            row={"capabilities":{},"assets":{},"roundtrip_search":[]};output["products"][product_name]=row
            try:
              for key,target,selector in (("deposit",product["teller"],S["deposit"]),("withdraw",product["teller"],S["withdraw"]),("queue_request",product["queue"],S["queue"]),("self_solve",product["solver"],S["self"]),("self_mint",product["solver"],S["selfmint"])):
                row["capabilities"][key]={"public":public(product["authority"],target,selector),"attacker":can(product["authority"],ATTACKER,target,selector),"selector":selector}
              base_rate=int(call(product["accountant"],S["rate"]),16)
              row["base_rate"]=base_rate
              for asset_name,asset_address in product["assets"].items():
                quote=int(call(product["accountant"],S["quote"]+address_word(asset_address)),16)
                data=words(call(product["teller"],S["assetData"]+address_word(asset_address)))
                balance=int(call(asset_address,S["balance"]+address_word(product["vault"])),16)
                decimals=int(call(asset_address,S["decimals"]),16)
                row["assets"][asset_name]={"address":asset_address.lower(),"quote":quote,"allow_deposit":bool(data[0]) if data else False,"allow_withdraw":bool(data[1]) if len(data)>1 else False,"premium_bps":data[2] if len(data)>2 else 0,"vault_balance":balance,"decimals":decimals}
              if row["capabilities"]["deposit"]["attacker"] and row["capabilities"]["withdraw"]["attacker"]:
                for source_name,source in row["assets"].items():
                  if not source["allow_deposit"]: continue
                  for destination_name,destination in row["assets"].items():
                    if not destination["allow_withdraw"]: continue
                    candidates=set(range(1,200000))
                    max_shares=destination["vault_balance"]*product["one"]//destination["quote"]
                    max_input=max_shares*source["quote"]//product["one"]*10000//max(1,10000-source["premium_bps"])
                    candidates.update(max(1,max_input+delta) for delta in range(-20,21))
                    for share_boundary in range(1,200001):
                      amount=(share_boundary*source["quote"]+product["one"]-1)//product["one"]
                      if amount<=max_input:
                        candidates.update((max(1,amount-1),amount,amount+1))
                    best=None
                    for amount_in in candidates:
                      if amount_in<=0 or amount_in>max_input: continue
                      shares_out=amount_in*product["one"]//source["quote"]
                      shares_out=shares_out*(10000-source["premium_bps"])//10000
                      amount_out=shares_out*destination["quote"]//product["one"]
                      source_base=amount_in*base_rate//source["quote"]
                      destination_base=amount_out*base_rate//destination["quote"]
                      profit=destination_base-source_base
                      if best is None or profit>best[0]: best=(profit,amount_in,shares_out,amount_out,source_base,destination_base)
                    item={"source":source_name,"destination":destination_name,"max_input":max_input,"best":{"base_profit":best[0],"input":best[1],"shares":best[2],"output":best[3],"source_base":best[4],"destination_base":best[5]} if best else None}
                    row["roundtrip_search"].append(item)
                    if best and best[0]>0: output["positive_loops"].append({"product":product_name,**item})
            except Exception as exc:
              row["error"]=repr(exc);output["errors"].append({"product":product_name,"error":repr(exc)})
          output["summary"]={"positive_loop_count":len(output["positive_loops"]),"errors":len(output["errors"])}
          with open("veda-optimism-cap.json","w",encoding="utf-8") as handle: json.dump(output,handle,indent=2,sort_keys=True);handle.write("\n")
          print(json.dumps(output,indent=2,sort_keys=True))
          PY
      - name: Upload Optimism proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-optimism-cap
          path: veda-optimism-cap.json
          if-no-files-found: error
          retention-days: 1
