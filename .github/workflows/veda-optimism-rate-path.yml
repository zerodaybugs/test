name: veda-optimism-rate-path

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Query live Optimism to Ethereum rate path
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          CHAINS = {
              "optimism": {
                  "id": 10,
                  "rpcs": [
                      "https://optimism-rpc.publicnode.com",
                      "https://mainnet.optimism.io",
                      "https://optimism.drpc.org",
                  ],
              },
              "ethereum": {
                  "id": 1,
                  "rpcs": [
                      "https://ethereum-rpc.publicnode.com",
                      "https://eth.llamarpc.com",
                  ],
              },
          }

          PRODUCTS = {
              "liquidETH": {
                  "vault": "0xf0bb20865277aBd641a307eCe5Ee04E79073416C",
                  "accountant": "0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198",
                  "teller": "0x9AA79C84b79816ab920bBcE20f8f74557B514734",
                  "queue": "0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0",
                  "solver_optimism": "0x23aff90ed3B3EfFCf78FB41Ab001C525A6c32A01",
                  "solver_ethereum": "0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042",
                  "base_optimism": "0x4200000000000000000000000000000000000006",
                  "base_ethereum": "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2",
              },
              "liquidBTC": {
                  "vault": "0x5f46d540b6eD704C3c8789105F30E075AA900726",
                  "accountant": "0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0",
                  "teller": "0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
                  "queue": "0x77A2fd42F8769d8063F2E75061FC200014E41Edf",
                  "solver_optimism": "0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929",
                  "solver_ethereum": "0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929",
                  "base_optimism": "0x68f180fcCe6836688e9084f035309E29Bf0A2095",
                  "base_ethereum": "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599",
              },
              "liquidUSD": {
                  "vault": "0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C",
                  "accountant": "0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7",
                  "teller": "0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
                  "queue": "0x38FC1BA73b7ED289955a07d9F11A85b6E388064A",
                  "solver_optimism": "0x92b10e02825986bAc2375BdACaFA3e89E3f612aA",
                  "solver_ethereum": "0x92b10e02825986bAc2375BdACaFA3e89E3f612aA",
                  "base_optimism": "0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85",
                  "base_ethereum": "0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48",
              },
          }

          ATTACKER = "0x1111111111111111111111111111111111111111"
          EID_ETHEREUM = 30101
          EID_OPTIMISM = 30111

          def selector(signature):
              return subprocess.check_output(["cast", "sig", signature], text=True).strip()[2:]

          SIG = {name: selector(signature) for name, signature in {
              "vault":"vault()",
              "accountant":"accountant()",
              "authority":"authority()",
              "owner":"owner()",
              "hook":"hook()",
              "decimals":"decimals()",
              "total_supply":"totalSupply()",
              "balance_of":"balanceOf(address)",
              "is_paused":"isPaused()",
              "share_lock_period":"shareLockPeriod()",
              "deposit_cap":"depositCap()",
              "asset_data":"assetData(address)",
              "get_rate":"getRate()",
              "get_rate_safe":"getRateSafe()",
              "get_rate_quote_safe":"getRateInQuoteSafe(address)",
              "base":"base()",
              "can_call":"canCall(address,address,bytes4)",
              "is_public":"isCapabilityPublic(address,bytes4)",
              "withdraw_assets":"withdrawAssets(address)",
              "queue_paused":"isPaused()",
              "queue_nonce":"nonce()",
              "request_ids":"getRequestIds()",
              "peers":"peers(uint32)",
              "id_to_chains":"idToChains(uint32)",
              "outbound_rate_limits":"outboundRateLimits(uint32)",
              "inbound_rate_limits":"inboundRateLimits(uint32)",
          }.items()}

          ACTION_SELECTORS = {
              "deposit": selector("deposit(address,uint256,uint256)"),
              "deposit_with_permit": selector("depositWithPermit(address,uint256,uint256,uint256,uint8,bytes32,bytes32)"),
              "bridge": selector("bridge(uint96,address,bytes,address,uint256)"),
              "deposit_and_bridge": selector("depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)"),
              "deposit_and_bridge_with_permit": selector("depositAndBridgeWithPermit(address,uint256,uint256,uint256,uint8,bytes32,bytes32,address,bytes,address,uint256)"),
              "withdraw": selector("withdraw(address,uint256,uint256,address)"),
              "bulk_deposit": selector("bulkDeposit(address,uint256,uint256,address)"),
              "bulk_withdraw": selector("bulkWithdraw(address,uint256,uint256,address)"),
              "enter": selector("enter(address,address,uint256,address,uint256)"),
              "exit": selector("exit(address,address,uint256,address,uint256)"),
              "request": selector("requestOnChainWithdraw(address,uint128,uint16,uint24)"),
              "request_permit": selector("requestOnChainWithdrawWithPermit(address,uint128,uint16,uint24,uint256,uint8,bytes32,bytes32)"),
              "solve": selector("solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"),
              "self_solve": selector("boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
              "self_mint_solve": selector("boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
          }

          def request(endpoint, method, params, attempts=4):
              body = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req = urllib.request.Request(
                  endpoint, data=body, method="POST",
                  headers={"content-type":"application/json","user-agent":"veda-optimism-readonly/1.0"},
              )
              last = None
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          result = json.loads(response.read().decode())
                      if "error" in result:
                          raise RuntimeError(result["error"])
                      return result["result"]
                  except Exception as exc:
                      last = exc
                      time.sleep(min(4, attempt + 1))
              raise RuntimeError(repr(last))

          def select_rpc(config):
              failures = {}
              for endpoint in config["rpcs"]:
                  try:
                      if int(request(endpoint, "eth_chainId", []), 16) != config["id"]:
                          raise RuntimeError("wrong chain")
                      request(endpoint, "eth_blockNumber", [])
                      return endpoint
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(failures)

          def strip0(value): return value[2:] if value.startswith("0x") else value
          def aw(address): return strip0(address).lower().rjust(64, "0")
          def uw(value): return hex(value)[2:].rjust(64, "0")
          def b4w(value): return strip0(value).lower().ljust(64, "0")
          def decode_address(raw): return "0x" + strip0(raw)[-40:]
          def decode_words(raw):
              value = strip0(raw)
              return [int(value[i:i+64], 16) for i in range(0, len(value), 64)] if value else []
          def safe(fn):
              try: return fn()
              except Exception as exc: return {"error":repr(exc)}

          selected = {name:select_rpc(config) for name,config in CHAINS.items()}
          blocks = {name:request(endpoint,"eth_blockNumber",[]) for name,endpoint in selected.items()}

          def call(chain, to, data):
              return request(selected[chain], "eth_call", [{"to":to,"data":data}, blocks[chain]])
          def code_bytes(chain, address):
              return (len(request(selected[chain], "eth_getCode", [address, blocks[chain]]))-2)//2
          def call0(chain, to, name): return call(chain, to, "0x"+SIG[name])
          def call_address(chain, to, name, address): return call(chain, to, "0x"+SIG[name]+aw(address))
          def public(chain, authority, target, action_selector):
              return bool(int(call(chain, authority, "0x"+SIG["is_public"]+aw(target)+b4w(action_selector)),16))
          def can_call(chain, authority, user, target, action_selector):
              return bool(int(call(chain, authority, "0x"+SIG["can_call"]+aw(user)+aw(target)+b4w(action_selector)),16))
          def eid_call(chain, target, name, eid):
              return decode_words(call(chain, target, "0x"+SIG[name]+uw(eid)))

          output = {
              "queried_at_unix": int(time.time()),
              "selectors": {"views":SIG,"actions":ACTION_SELECTORS},
              "chains": {
                  chain:{"endpoint":selected[chain],"block":int(blocks[chain],16)}
                  for chain in selected
              },
              "products": {},
          }

          for product, config in PRODUCTS.items():
              entry = {"config":{k:v.lower() for k,v in config.items()},"chains":{}}
              for chain in ("optimism","ethereum"):
                  base = config["base_optimism" if chain == "optimism" else "base_ethereum"]
                  authority = safe(lambda chain=chain: decode_address(call0(chain, config["teller"], "authority")))
                  chain_entry = {
                      "base":base.lower(),
                      "code_bytes": {
                          "vault":safe(lambda chain=chain:code_bytes(chain,config["vault"])),
                          "accountant":safe(lambda chain=chain:code_bytes(chain,config["accountant"])),
                          "teller":safe(lambda chain=chain:code_bytes(chain,config["teller"])),
                          "queue":safe(lambda chain=chain:code_bytes(chain,config["queue"])),
                      },
                      "vault": {
                          "decimals":safe(lambda chain=chain:int(call0(chain,config["vault"],"decimals"),16)),
                          "total_supply":safe(lambda chain=chain:int(call0(chain,config["vault"],"total_supply"),16)),
                          "hook":safe(lambda chain=chain:decode_address(call0(chain,config["vault"],"hook"))),
                          "base_balance":safe(lambda chain=chain,base=base:int(call_address(chain,base,"balance_of",config["vault"]),16)),
                      },
                      "accountant": {
                          "base":safe(lambda chain=chain:decode_address(call0(chain,config["accountant"],"base"))),
                          "rate":safe(lambda chain=chain:int(call0(chain,config["accountant"],"get_rate"),16)),
                          "rate_safe":safe(lambda chain=chain:int(call0(chain,config["accountant"],"get_rate_safe"),16)),
                          "base_quote_rate_safe":safe(lambda chain=chain,base=base:int(call_address(chain,config["accountant"],"get_rate_quote_safe",base),16)),
                      },
                      "teller": {
                          "authority":authority,
                          "owner":safe(lambda chain=chain:decode_address(call0(chain,config["teller"],"owner"))),
                          "vault":safe(lambda chain=chain:decode_address(call0(chain,config["teller"],"vault"))),
                          "accountant":safe(lambda chain=chain:decode_address(call0(chain,config["teller"],"accountant"))),
                          "paused":safe(lambda chain=chain:bool(int(call0(chain,config["teller"],"is_paused"),16))),
                          "share_lock_period":safe(lambda chain=chain:int(call0(chain,config["teller"],"share_lock_period"),16)),
                          "deposit_cap":safe(lambda chain=chain:int(call0(chain,config["teller"],"deposit_cap"),16)),
                          "asset_data_words":safe(lambda chain=chain,base=base:decode_words(call_address(chain,config["teller"],"asset_data",base))),
                      },
                      "queue": {
                          "paused":safe(lambda chain=chain:bool(int(call0(chain,config["queue"],"queue_paused"),16))),
                          "nonce":safe(lambda chain=chain:int(call0(chain,config["queue"],"queue_nonce"),16)),
                          "withdraw_asset_words":safe(lambda chain=chain,base=base:decode_words(call_address(chain,config["queue"],"withdraw_assets",base))),
                          "request_ids":safe(lambda chain=chain:call0(chain,config["queue"],"request_ids")),
                      },
                      "capabilities": {},
                  }
                  if isinstance(authority,str):
                      for action, action_selector in ACTION_SELECTORS.items():
                          target = config["teller"]
                          if action in ("enter","exit"):
                              target = config["vault"]
                          elif action in ("request","request_permit","solve"):
                              target = config["queue"]
                          elif action in ("self_solve","self_mint_solve"):
                              target = config["solver_optimism" if chain == "optimism" else "solver_ethereum"]
                          user = ATTACKER
                          if action in ("enter","exit"):
                              user = config["teller"]
                          chain_entry["capabilities"][action] = {
                              "target":target.lower(),
                              "public":safe(lambda chain=chain,authority=authority,target=target,action_selector=action_selector:public(chain,authority,target,action_selector)),
                              "attacker_or_component_can_call":safe(lambda chain=chain,authority=authority,user=user,target=target,action_selector=action_selector:can_call(chain,authority,user,target,action_selector)),
                          }
                  peer_eid = EID_ETHEREUM if chain == "optimism" else EID_OPTIMISM
                  chain_entry["peer"] = {
                      "eid":peer_eid,
                      "peer":safe(lambda chain=chain,peer_eid=peer_eid:"0x"+call(chain,config["teller"],"0x"+SIG["peers"]+uw(peer_eid))[-64:]),
                      "chain_words":safe(lambda chain=chain,peer_eid=peer_eid:eid_call(chain,config["teller"],"id_to_chains",peer_eid)),
                      "outbound_words":safe(lambda chain=chain,peer_eid=peer_eid:eid_call(chain,config["teller"],"outbound_rate_limits",peer_eid)),
                      "inbound_words":safe(lambda chain=chain,peer_eid=peer_eid:eid_call(chain,config["teller"],"inbound_rate_limits",peer_eid)),
                  }
                  entry["chains"][chain] = chain_entry
              opt_rate = entry["chains"]["optimism"]["accountant"]["rate"]
              eth_rate = entry["chains"]["ethereum"]["accountant"]["rate"]
              entry["rate_comparison"] = {
                  "optimism":opt_rate,
                  "ethereum":eth_rate,
                  "ethereum_minus_optimism":eth_rate-opt_rate if isinstance(opt_rate,int) and isinstance(eth_rate,int) else None,
                  "gross_bps":((eth_rate*10000)//opt_rate-10000) if isinstance(opt_rate,int) and isinstance(eth_rate,int) and opt_rate else None,
              }
              output["products"][product] = entry

          with open("veda-optimism-rate-path.json","w",encoding="utf-8") as handle:
              json.dump(output,handle,indent=2,sort_keys=True)
              handle.write("\n")

          print(json.dumps({
              product:{
                  "rates":entry["rate_comparison"],
                  "optimism_asset_data":entry["chains"]["optimism"]["teller"]["asset_data_words"],
                  "optimism_public_deposit":entry["chains"]["optimism"]["capabilities"].get("deposit"),
                  "optimism_public_bridge":entry["chains"]["optimism"]["capabilities"].get("bridge"),
                  "ethereum_queue":entry["chains"]["ethereum"]["queue"]["withdraw_asset_words"],
                  "ethereum_request":entry["chains"]["ethereum"]["capabilities"].get("request"),
                  "optimism_peer":entry["chains"]["optimism"]["peer"],
              }
              for product,entry in output["products"].items()
          },indent=2,sort_keys=True))
          PY
      - name: Upload Optimism rate path
        uses: actions/upload-artifact@v4
        with:
          name: veda-optimism-rate-path
          path: veda-optimism-rate-path.json
          if-no-files-found: error
          retention-days: 1
