name: veda-optimism-selector-map

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Map every Optimism ABI and runtime selector to live attacker capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, subprocess, time, urllib.request, traceback

          BASE="https://explorer.optimism.io"
          RPCS=["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"]
          ATTACKER="0x1111111111111111111111111111111111111111"
          PRODUCTS={
            "liquidBTC":{"authority":"0x49F954c67ff235034b69b8a59fbe309A40256c8d","components":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","accountant":"0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0","teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353","queue":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf","solver":"0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929","manager":"0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d","pauser":"0x8c61f2368aaf64aaf7f3c41b6870f584adfabc33"}},
            "liquidETH":{"authority":"0x485Bde66Bb668a51f2372E34e45B1c6226798122","components":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","accountant":"0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734","queue":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0","solver":"0x23aff90ed3b3effcf78fb41ab001c525a6c32a01","manager":"0x227975088C28DBBb4b421c6d96781a53578f19a8","pauser":"0xdc10b195360aacc31969f5c5fcad24a335afb6b4"}},
            "liquidUSD":{"authority":"0xff90f1B24DFBD25F439B94ed090F373BDE24f60E","components":{"vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","accountant":"0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7","teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387","queue":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A","solver":"0x92b10e02825986bac2375bdacafa3e89e3f612aa","manager":"0x7b57ad1a0aa89583130acfad024241170d24c13c","pauser":"0xe5f994b710f42efbd4e19affdc0909485b7848eb"}},
          }
          EXPECTED={
            "teller":{"bridge(uint96,address,bytes,address,uint256)"},
            "queue":{"requestOnChainWithdraw(address,uint128,uint16,uint24)","requestOnChainWithdrawWithPermit(address,uint128,uint16,uint24,uint256,uint8,bytes32,bytes32)","cancelOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24))","replaceOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24),uint16,uint24)"},
          }
          def shell(*args):
            proc=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if proc.returncode:raise RuntimeError({"args":args,"stdout":proc.stdout,"stderr":proc.stderr})
            return proc.stdout.strip()
          CAN=shell("cast","sig","canCall(address,address,bytes4)");PUBLIC=shell("cast","sig","isCapabilityPublic(address,bytes4)")
          def http_json(url,timeout=60,retries=4):
            last=None
            for attempt in range(retries):
              try:
                request=urllib.request.Request(url,headers={"accept":"application/json","user-agent":"veda-optimism-selector-map/1"})
                with urllib.request.urlopen(request,timeout=timeout) as response:return json.loads(response.read().decode())
              except Exception as exc:last=repr(exc);time.sleep(.4*(attempt+1))
            raise RuntimeError({"url":url,"error":last})
          def rpc(endpoint,method,params,timeout=35):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode();request=urllib.request.Request(endpoint,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-optimism-selector-map/1"})
            with urllib.request.urlopen(request,timeout=timeout) as response:payload=json.loads(response.read().decode())
            if "error" in payload:raise RuntimeError(payload["error"])
            return payload["result"]
          endpoint=None;failures={}
          for candidate in RPCS:
            try:
              if int(rpc(candidate,"eth_chainId",[]),16)==10:endpoint=candidate;break
            except Exception as exc:failures[candidate]=repr(exc)
          if not endpoint:raise RuntimeError(failures)
          def strip0(value):
            text=str(value or "");return text[2:] if text.startswith("0x") else text
          def aw(address):return strip0(address).lower().rjust(64,"0")
          def bw(selector):return strip0(selector).lower().ljust(64,"0")
          def call(target,data):return rpc(endpoint,"eth_call",[{"to":target,"data":data},"latest"])
          def public(authority,target,selector):return bool(int(call(authority,PUBLIC+aw(target)+bw(selector)),16))
          def can(authority,target,selector):return bool(int(call(authority,CAN+aw(ATTACKER)+aw(target)+bw(selector)),16))
          def canonical_type(item):
            typ=item.get("type") or ""
            if typ.startswith("tuple"):
              return "("+",".join(canonical_type(component) for component in item.get("components",[]))+")"+typ[5:]
            return typ
          def signature(item):return f"{item.get('name')}({','.join(canonical_type(value) for value in item.get('inputs',[]))})"
          def get_abi(address):
            payload=http_json(f"{BASE}/api/v2/smart-contracts/{address}");abi=payload.get("abi") if isinstance(payload,dict) else None
            if isinstance(abi,str):
              try:abi=json.loads(abi)
              except Exception:abi=[]
            return payload,abi if isinstance(abi,list) else []
          def runtime_push4(code):
            raw=bytes.fromhex(strip0(code));selectors=set();index=0
            while index<len(raw):
              op=raw[index]
              if op==0x63 and index+4<len(raw):selectors.add("0x"+raw[index+1:index+5].hex())
              index+=1+(op-0x5f if 0x60<=op<=0x7f else 0)
            return sorted(selectors)
          output={"block":int(rpc(endpoint,"eth_blockNumber",[]),16),"rpc":endpoint,"rpc_failures":failures,"products":{},"unexpected_attacker_callables":[],"runtime_only_callables":[],"errors":[]}
          cache={}
          for product,config in PRODUCTS.items():
            prow={"authority":config["authority"].lower(),"components":{}};output["products"][product]=prow
            for component,address in config["components"].items():
              key=(config["authority"].lower(),address.lower())
              if key in cache:prow["components"][component]=cache[key];continue
              row={"address":address.lower(),"abi_functions":[],"runtime_selector_count":0,"runtime_attacker_callables":[]};cache[key]=row;prow["components"][component]=row
              try:
                metadata,abi=get_abi(address);row["verified_name"]=metadata.get("name") or metadata.get("contract_name")
                abi_selectors=set()
                for item in abi:
                  if not isinstance(item,dict) or item.get("type")!="function":continue
                  sig=signature(item);selector=shell("cast","sig",sig);abi_selectors.add(selector.lower());is_public=public(config["authority"],address,selector);attacker=can(config["authority"],address,selector)
                  record={"signature":sig,"selector":selector,"state_mutability":item.get("stateMutability"),"public_capability":is_public,"attacker_can_call":attacker}
                  row["abi_functions"].append(record)
                  if attacker and item.get("stateMutability") not in ("view","pure") and sig not in EXPECTED.get(component,set()):
                    output["unexpected_attacker_callables"].append({"product":product,"component":component,"address":address.lower(),**record})
                code=rpc(endpoint,"eth_getCode",[address,"latest"]);selectors=runtime_push4(code);row["runtime_selector_count"]=len(selectors)
                for selector in selectors:
                  if can(config["authority"],address,selector):
                    record={"selector":selector,"public_capability":public(config["authority"],address,selector),"abi_known":selector.lower() in abi_selectors}
                    row["runtime_attacker_callables"].append(record)
                    if not record["abi_known"]:output["runtime_only_callables"].append({"product":product,"component":component,"address":address.lower(),**record})
              except Exception as exc:
                row["error"]=repr(exc);row["traceback"]=traceback.format_exc();output["errors"].append({"product":product,"component":component,"error":repr(exc)})
          output["summary"]={"unexpected_count":len(output["unexpected_attacker_callables"]),"runtime_only_count":len(output["runtime_only_callables"]),"errors":len(output["errors"])}
          with open("veda-optimism-selector-map.json","w",encoding="utf-8") as handle:json.dump(output,handle,indent=2,sort_keys=True);handle.write("\n")
          print(json.dumps({"summary":output["summary"],"unexpected":output["unexpected_attacker_callables"],"runtime_only":output["runtime_only_callables"],"errors":output["errors"]},indent=2,sort_keys=True))
          PY
      - name: Upload Optimism selector map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-optimism-selector-map
          path: veda-optimism-selector-map.json
          if-no-files-found: error
          retention-days: 1
