name: veda-optimism-weeth-fee

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Quote LayerZero fee and net route economics
        shell: bash
        run: |
          set -euo pipefail
          RPC="https://ethereum-rpc.publicnode.com"
          TELLER="0x9AA79C84b79816ab920bBcE20f8f74557B514734"
          WEETH="0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"
          ATTACKER="0x1111111111111111111111111111111111111111"
          NATIVE="0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"
          WILDCARD=$(cast abi-encode "f(uint32)" 30111)
          python3 - <<'PY'
          import json, subprocess, time, urllib.request
          RPC="https://ethereum-rpc.publicnode.com"
          TELLER="0x9AA79C84b79816ab920bBcE20f8f74557B514734"
          WEETH="0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"
          ATTACKER="0x1111111111111111111111111111111111111111"
          NATIVE="0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"
          WILDCARD=subprocess.check_output(["cast","abi-encode","f(uint32)","30111"],text=True).strip()
          SRC_Q=1000248452788510717
          DST_Q=1000306126778812395
          MAX_SHARES=18530392479118458075
          ONE=10**18
          def rpc(method,params):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(RPC,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-optimism-weeth-fee/1.0"})
              with urllib.request.urlopen(req,timeout=35) as r:o=json.loads(r.read().decode())
              if "error" in o:raise RuntimeError(o["error"])
              return o["result"]
          block=rpc("eth_blockNumber",[])
          provider_rate=int(rpc("eth_call",[{"to":WEETH,"data":subprocess.check_output(["cast","sig","getRate()"],text=True).strip()},block]),16)
          rows=[]
          for shares in [10**18,MAX_SHARES]:
              data=subprocess.check_output(["cast","calldata","previewFee(uint96,address,bytes,address)",str(shares),ATTACKER,WILDCARD,NATIVE],text=True).strip()
              fee=int(rpc("eth_call",[{"to":TELLER,"data":data},block]),16)
              fee_weeth=fee*ONE//provider_rate
              input_amount=shares*SRC_Q//ONE
              payout=shares*DST_Q//ONE
              gross=payout-input_amount
              rows.append({"shares":shares,"native_fee_wei":fee,"native_fee_in_weeth":fee_weeth,"input_weeth":input_amount,"payout_weeth":payout,"gross_profit_weeth":gross,"net_after_lz_fee_weeth":gross-fee_weeth})
          out={"generated_at_unix":int(time.time()),"ethereum_block":int(block,16),"wildcard":WILDCARD,"source_weeth_getRate":provider_rate,"rows":rows}
          with open("veda-optimism-weeth-fee.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload fee proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-optimism-weeth-fee
          path: veda-optimism-weeth-fee.json
          if-no-files-found: error
          retention-days: 1
