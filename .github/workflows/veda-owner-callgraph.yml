name: veda-owner-callgraph

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Map recursive owner authorization call graph
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          CHAINS={
            "ethereum":{"id":1,"rpcs":["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com"],"roots":{
              "liquidBTC":["0x5f46d540b6ed704c3c8789105f30e075aa900726","0xea23ac6d7d11f6b181d6b98174d334478adae6b0","0x8ea0b382d054dbebeb1d0ae47ee4ac433c730353","0x77a2fd42f8769d8063f2e75061fc200014e41edf","0xed41172438897bcb22c9dd72b9f9bbf9a8bf8929","0xafa8c08bedb2ec1bbeb64a7ffa44c604e7cca68d","0x49f954c67ff235034b69b8a59fbe309a40256c8d"],
              "liquidETH":["0xf0bb20865277abd641a307ece5ee04e79073416c","0x0d05d94a5f1e76c18fbeb7a13d17c8a314088198","0x9aa79c84b79816ab920bbce20f8f74557b514734","0x0d2df071207e18ca8638b4f04e98c53155ec2ce0","0xe3f8fa039ff7a8fe42fa2c6e9dc8565ece6f7042","0xf9f7969c357ce6dfd7973098ea0d57173592bcca","0x485bde66bb668a51f2372e34e45b1c6226798122"],
              "liquidUSD":["0x08c6f91e2b681faf5e17227f2a44c307b3c1364c","0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7","0x4de413a26fc24c3fc27cc983be70aa9c5c299387","0x38fc1ba73b7ed289955a07d9f11a85b6e388064a","0x92b10e02825986bac2375bdacafa3e89e3f612aa","0x7b57ad1a0aa89583130acfad024241170d24c13c","0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e"]}},
            "scroll":{"id":534352,"rpcs":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"],"roots":{
              "liquidBTC":["0x5f46d540b6ed704c3c8789105f30e075aa900726","0xea23ac6d7d11f6b181d6b98174d334478adae6b0","0x8ea0b382d054dbebeb1d0ae47ee4ac433c730353","0x77a2fd42f8769d8063f2e75061fc200014e41edf","0x7102c6889b0bb93acf4a895f3ebeb17080d91d29","0xafa8c08bedb2ec1bbeb64a7ffa44c604e7cca68d","0x49f954c67ff235034b69b8a59fbe309a40256c8d"],
              "liquidETH":["0xf0bb20865277abd641a307ece5ee04e79073416c","0x0d05d94a5f1e76c18fbeb7a13d17c8a314088198","0x9aa79c84b79816ab920bbce20f8f74557b514734","0x0d2df071207e18ca8638b4f04e98c53155ec2ce0","0xe3f8fa039ff7a8fe42fa2c6e9dc8565ece6f7042","0x227975088c28dbbb4b421c6d96781a53578f19a8","0x485bde66bb668a51f2372e34e45b1c6226798122"],
              "liquidUSD":["0x08c6f91e2b681faf5e17227f2a44c307b3c1364c","0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7","0x4de413a26fc24c3fc27cc983be70aa9c5c299387","0x38fc1ba73b7ed289955a07d9f11a85b6e388064a","0x6632d22a2062415bb37c8d7b6a5ec86c35bb2610","0x7b57ad1a0aa89583130acfad024241170d24c13c","0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e"]}},
            "ink":{"id":57073,"rpcs":["https://rpc-gel.inkonchain.com","https://rpc-qnd.inkonchain.com","https://ink.drpc.org"],"roots":{
              "balanced":["0xcaae49fb7f74ccfbe8a05e6104b01c097a78789f","0x0c4df79d9e35e5c4876bc1ae4663e834312ddc67","0xc151e263d5c890fd0bceb33a6525f1a76a8329fc","0x4c433ed6d57316170565d7fedc11a841832cdc3d","0xffdffb178cb469002b77b47f7e4a6bcad041a9b6","0xa0e501f98a1b5d3d8e6ffd161c76f92570e42931","0x3e8b0ee1d05267fe9f8d2b1f8cb48f2e23d69c6b"],
              "boosted":["0xdbd87325d7b1189dcc9255c4926076ff4a96a271","0x9c2477d4ea17d3ccc45e6b1087c94d14926f54c9","0xc46f2443b3521632e2e2a903d6da8f965b46f6a0","0x406e63323ef5d39d41c6fd895ef9665af926184c","0xdf4123c18dc985ed94061f2c08ce17b7b17f21ff","0xed23b12e7700beb638562a22ed65f74291901c25","0x1f53135155d6ff516bccfdd9424fcdb8ad1efb77"]}},
          }
          TEST="0x1111111111111111111111111111111111111111"
          ZERO="0x0000000000000000000000000000000000000000"
          def ks(x):return subprocess.check_output(["cast","keccak",x],text=True).strip()
          def ss(x):return subprocess.check_output(["cast","sig",x],text=True).strip()
          S={x:ss(x) for x in [
            "owner()","authority()","pendingOwner()","getMinDelay()","threshold()","getThreshold()","getOwners()",
            "DEFAULT_ADMIN_ROLE()","PROPOSER_ROLE()","EXECUTOR_ROLE()","CANCELLER_ROLE()",
            "hasRole(bytes32,address)","isOperationReady(bytes32)","isOperationDone(bytes32)",
            "execute(address,uint256,bytes,bytes32,bytes32)","executeBatch(address[],uint256[],bytes[],bytes32,bytes32)",
            "schedule(address,uint256,bytes,bytes32,bytes32,uint256)","scheduleBatch(address[],uint256[],bytes[],bytes32,bytes32,uint256)",
            "execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes)",
            "multicall(bytes[])","manage(address,bytes,uint256)","bundle(address[],bytes[],uint256[])",
            "setPublicCapability(address,bytes4,bool)","setRoleCapability(uint8,address,bytes4,bool)","setUserRole(address,uint8,bool)"]}
          ROLES={"DEFAULT_ADMIN_ROLE":"0x"+"00"*32,"PROPOSER_ROLE":ks("PROPOSER_ROLE"),"EXECUTOR_ROLE":ks("EXECUTOR_ROLE"),"CANCELLER_ROLE":ks("CANCELLER_ROLE")}
          def req(ep,m,p,attempts=4):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":m,"params":p}).encode();last=None
            for i in range(attempts):
              try:
                q=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-owner-callgraph/1.0"})
                with urllib.request.urlopen(q,timeout=45) as r:d=json.loads(r.read().decode())
                if "error" in d:raise RuntimeError(d["error"])
                return d["result"]
              except Exception as exc:last=exc;time.sleep(i+1)
            raise RuntimeError(repr(last))
          def choose(c):
            e={}
            for ep in c["rpcs"]:
              try:
                if int(req(ep,"eth_chainId",[]),16)==c["id"]:return ep,e
              except Exception as exc:e[ep]=repr(exc)
            raise RuntimeError(e)
          def strip(x):return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a):return strip(a).lower().rjust(64,"0")
          def bw(b):return strip(b).lower().rjust(64,"0")
          def call(ep,to,data):return req(ep,"eth_call",[{"to":to,"data":data},"latest"])
          def addr(raw):return "0x"+strip(raw)[-40:] if raw not in (None,"0x") else None
          def uint(raw):return int(raw,16) if raw not in (None,"0x") else None
          def boolv(raw):return bool(uint(raw))
          def bytes4s(code):
            x=strip(code); out=set();i=0
            while i+10<=len(x):
              if x[i:i+2].lower()=="63":out.add("0x"+x[i+2:i+10].lower());i+=10
              else:i+=2
            return sorted(out)
          def decode_addr_array(raw):
            x=strip(raw)
            try:
              off=int(x[:64],16)*2;n=int(x[off:off+64],16);return ["0x"+x[off+64+i*64:off+64+(i+1)*64][-40:] for i in range(n)]
            except Exception:return []

          out={"generated_at_unix":int(time.time()),"selectors":S,"role_ids":ROLES,"chains":{},"candidate_open_owner_paths":[]}
          for cn,c in CHAINS.items():
            ep,errs=choose(c); co={"endpoint":ep,"block":int(req(ep,"eth_blockNumber",[]),16),"rpc_errors":errs,"products":{},"nodes":{}}
            queue=[]
            for p,roots in c["roots"].items():co["products"][p]={"roots":roots};queue.extend(roots)
            seen=set();depth={x.lower():0 for x in queue}
            while queue:
              a=queue.pop(0).lower()
              if a in seen or a==ZERO:continue
              seen.add(a);code=req(ep,"eth_getCode",[a,"latest"]);node={"address":a,"code_bytes":len(strip(code))//2,"push4":bytes4s(code),"probes":{},"roles":{}}
              for fn in ("owner()","authority()","pendingOwner()"):
                try:node["probes"][fn]=addr(call(ep,a,S[fn]))
                except Exception:pass
              for fn in ("getMinDelay()","threshold()","getThreshold()"):
                try:node["probes"][fn]=uint(call(ep,a,S[fn]))
                except Exception:pass
              try:node["probes"]["getOwners()"] = decode_addr_array(call(ep,a,S["getOwners()"])).copy()
              except Exception:pass
              for role,roleid in ROLES.items():
                try:
                  node["roles"][role]={"attacker":boolv(call(ep,a,S["hasRole(bytes32,address)"]+bw(roleid)+aw(TEST))),"zero":boolv(call(ep,a,S["hasRole(bytes32,address)"]+bw(roleid)+aw(ZERO)))}
                except Exception:pass
              node["known_arbitrary_call_selectors"]={fn:sel in node["push4"] for fn,sel in S.items() if fn.startswith(("execute(","executeBatch(","schedule(","scheduleBatch(","execTransaction(","multicall(","manage(","bundle(","setPublic","setRole","setUser"))}
              co["nodes"][a]=node
              for nxt in [node["probes"].get("owner()"),node["probes"].get("authority()"),node["probes"].get("pendingOwner()")]+node["probes"].get("getOwners()",[]):
                if nxt and nxt.lower()!=ZERO and depth.get(a,0)<4 and nxt.lower() not in seen:
                  depth[nxt.lower()]=depth.get(a,0)+1;queue.append(nxt.lower())
            out["chains"][cn]=co
            for a,n in co["nodes"].items():
              open_executor=n.get("roles",{}).get("EXECUTOR_ROLE",{}).get("zero") is True
              attacker_admin=any(x.get("attacker") for x in n.get("roles",{}).values())
              arbitrary=any(n["known_arbitrary_call_selectors"].values())
              if (open_executor or attacker_admin) and arbitrary:
                out["candidate_open_owner_paths"].append({"chain":cn,"node":a,"open_executor":open_executor,"attacker_role":attacker_admin,"node_data":n})
          with open("veda-owner-callgraph.json","w") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"nodes":{c:len(x["nodes"]) for c,x in out["chains"].items()},"candidates":out["candidate_open_owner_paths"],"owners":{c:{a:n["probes"].get("owner()") for a,n in x["nodes"].items() if n["probes"].get("owner()")} for c,x in out["chains"].items()}},indent=2,sort_keys=True))
          PY
      - name: Upload owner call graph
        uses: actions/upload-artifact@v4
        with:
          name: veda-owner-callgraph
          path: veda-owner-callgraph.json
          if-no-files-found: error
          retention-days: 1
