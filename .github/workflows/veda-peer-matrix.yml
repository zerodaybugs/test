name: veda-peer-matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query configured Veda peer domains
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request

          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com']},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']},
          }
          TELLERS={
            'liquidETH':'0x9AA79C84b79816ab920bBcE20f8f74557B514734',
            'liquidBTC':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353',
            'liquidUSD':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387',
          }
          EIDS={
            30101:'ethereum',30184:'base',30111:'optimism',30110:'arbitrum',30183:'linea',30214:'scroll',
            30331:'corn',30335:'swell',30332:'sonic',30320:'unichain',30362:'berachain',30325:'movement',
            30295:'flare',30339:'ink',30367:'hyperevm',30370:'plume',30375:'katana',30377:'tac',
            30343:'ton',30383:'plasma',30280:'sei'
          }
          SEL={'peer':'bb0b6a53','chain':'d1822216','out':'51c32a88','in':'55b56c0c'}

          def request(ep,m,p,attempts=4):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode()
            req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-peer-matrix/1.0'})
            last=None
            for i in range(attempts):
              try:
                with urllib.request.urlopen(req,timeout=30) as f:o=json.loads(f.read().decode())
                if 'error' in o:raise RuntimeError(o['error'])
                return o['result']
              except Exception as e:
                last=e; time.sleep(min(3,1+i))
            raise RuntimeError(repr(last))
          def select(c):
            bad={}
            for ep in c['rpcs']:
              try:
                if int(request(ep,'eth_chainId',[]),16)==c['id']:return ep
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def uw(x):return hex(x)[2:].rjust(64,'0')
          def words(raw):
            h=raw[2:];return [int(h[i:i+64],16) for i in range(0,len(h),64)] if h else []
          def safe(f):
            try:return f()
            except Exception as e:return {'error':repr(e)}

          out={'queried_at_unix':int(time.time()),'eid_names':{str(k):v for k,v in EIDS.items()},'chains':{}}
          for cname,cfg in CHAINS.items():
            ep=select(cfg); block=request(ep,'eth_blockNumber',[])
            co={'endpoint':ep,'block':int(block,16),'tellers':{}}
            for pname,teller in TELLERS.items():
              found=[]
              for eid,remote in EIDS.items():
                peer=safe(lambda eid=eid:request(ep,'eth_call',[{'to':teller,'data':'0x'+SEL['peer']+uw(eid)},block]))
                chain=safe(lambda eid=eid:request(ep,'eth_call',[{'to':teller,'data':'0x'+SEL['chain']+uw(eid)},block]))
                outbound=safe(lambda eid=eid:request(ep,'eth_call',[{'to':teller,'data':'0x'+SEL['out']+uw(eid)},block]))
                inbound=safe(lambda eid=eid:request(ep,'eth_call',[{'to':teller,'data':'0x'+SEL['in']+uw(eid)},block]))
                if any(isinstance(v,dict) for v in (peer,chain,outbound,inbound)):
                  found.append({'eid':eid,'remote':remote,'peer':peer,'chain':chain,'outbound':outbound,'inbound':inbound,'query_error':True})
                  continue
                pw=int(peer,16); cw=words(chain); ow=words(outbound); iw=words(inbound)
                if pw or any(cw) or any(ow) or any(iw):
                  found.append({
                    'eid':eid,'remote':remote,'peer':'0x'+peer[-64:],
                    'chain_words':cw,'outbound_words':ow,'inbound_words':iw,
                  })
              co['tellers'][pname]=found
            out['chains'][cname]=co
          with open('veda-peer-matrix.json','w') as f:json.dump(out,f,indent=2,sort_keys=True);f.write('\n')
          print(json.dumps({c:{p:[(x['eid'],x['remote']) for x in rows if not x.get('query_error')] for p,rows in d['tellers'].items()} for c,d in out['chains'].items()},indent=2,sort_keys=True))
          PY
      - name: Upload peer matrix
        uses: actions/upload-artifact@v4
        with:
          name: veda-peer-matrix
          path: veda-peer-matrix.json
          if-no-files-found: error
          retention-days: 1
