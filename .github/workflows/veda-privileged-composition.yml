name: veda-privileged-composition

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Probe alternate solver, subvault, manager, timelock and Safe holders
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          RPCS = ["https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com"]
          TEST = "0x1111111111111111111111111111111111111111"
          ZERO = "0x0000000000000000000000000000000000000000"
          SENTINEL = "0x0000000000000000000000000000000000000001"

          A = {
              "parent_vault": "0xf0bb20865277abd641a307ece5ee04e79073416c",
              "parent_teller": "0x9aa79c84b79816ab920bbce20f8f74557b514734",
              "parent_queue": "0x0d2df071207e18ca8638b4f04e98c53155ec2ce0",
              "parent_authority": "0x485bde66bb668a51f2372e34e45b1c6226798122",
              "alternate_solver": "0x23aff90ed3b3effcf78fb41ab001c525a6c32a01",
              "scope_solver": "0xe3f8fa039ff7a8fe42fa2c6e9dc8565ece6f7042",
              "subvault": "0x83599937c2c9bea0e0e8ac096c6f32e86486b410",
              "subvault_authority": "0x5979f753b417c17fcd8f8c87b86154a0eb0e2c17",
              "subvault_manager": "0x62b283d4fefb2a120e1120dba9f83be6ca41bcd7",
              "subvault_teller": "0xd445c65e4821dbd4ed0114ecdf6325c69fad7653",
              "subvault_queue": "0xe2f6157656ed2bbbd87f1c01a29c1b92acb17476",
              "subvault_solver": "0x45d85c0a1168726bbee2352d78e7647f70654d56",
              "subvault_timelock": "0x946f01f13ecafdbbd4cc2bded41703b3365b9d17",
              "liquid_multisig": "0xcea8039076e35a825854c5c2f85659430b06ec96",
              "strategist_safe_1": "0x41dfc53b13932a2690c9790527c1967d8579a6ae",
              "strategist_safe_2": "0x607d0c7e3578802eb46d388cb86cfba8ff657306",
              "strategist_safe_3": "0x71e2d6c34f569cc4df5802d675b208fb8ae3bcd6",
              "strategist_safe_4": "0x7859baa3e12b6480b15b77b069d8d0279ebc74ea",
              "WETH": "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2",
              "eETH": "0x35fa164735182de50811e8e2e824cfb9b6118ac2",
              "weETH": "0xcd5fe23c85820f7b72d0926fc9b05b43e359b7ee",
          }

          def sig(text):
              return subprocess.check_output(["cast", "sig", text], text=True).strip().lower()

          SIGNATURES = [
              "owner()", "authority()", "pendingOwner()", "name()", "symbol()", "decimals()", "totalSupply()",
              "getUserRoles(address)", "getRolesWithCapability(address,bytes4)", "isCapabilityPublic(address,bytes4)",
              "canCall(address,address,bytes4)", "getOwners()", "getThreshold()", "getModulesPaginated(address,uint256)",
              "getGuard()", "getFallbackHandler()", "getMinDelay()", "hasRole(bytes32,address)",
              "balanceOf(address)", "manage(address,bytes,uint256)", "manage(address[],bytes[],uint256[])",
              "enter(address,address,uint256,address,uint256)", "exit(address,address,uint256,address,uint256)",
              "setAuthority(address)", "transferOwnership(address)",
              "manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])",
              "setManageRoot(address,bytes32)",
              "deposit(address,uint256,uint256,address)", "withdraw(address,uint256,uint256,address)",
              "bridge(uint96,address,bytes,address,uint256)", "bulkDeposit(address,uint256,uint256,address)",
              "bulkWithdraw(address,uint256,uint256,address)",
              "requestOnChainWithdraw(address,uint128,uint16,uint24)",
              "cancelOnChainWithdraw((uint96,address,address,uint128,uint128,uint40,uint24,uint24))",
              "solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)",
              "boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,bool)",
              "boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address,bool)",
              "boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)",
              "boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)",
              "boringSolve(address,address,address,uint256,uint256,bytes)", "rescueTokens(address,uint256)",
              "multicall(bytes[])", "execute(address,uint256,bytes,bytes32,bytes32)",
              "executeBatch(address[],uint256[],bytes[],bytes32,bytes32)",
          ]
          S = {text: sig(text) for text in SIGNATURES}

          def keccak(text):
              return subprocess.check_output(["cast", "keccak", text], text=True).strip()

          ROLE_IDS = {
              "DEFAULT_ADMIN_ROLE": "0x" + "00" * 32,
              "PROPOSER_ROLE": keccak("PROPOSER_ROLE"),
              "EXECUTOR_ROLE": keccak("EXECUTOR_ROLE"),
              "CANCELLER_ROLE": keccak("CANCELLER_ROLE"),
          }

          def request(endpoint, method, params, timeout=25):
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={"content-type": "application/json", "user-agent": "veda-privileged-composition/1.0"},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          def choose_rpc():
              failures = {}
              for endpoint in RPCS:
                  try:
                      if int(request(endpoint, "eth_chainId", []), 16) == 1:
                          return endpoint, failures
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(failures)

          def strip0(value):
              return value[2:] if str(value).startswith("0x") else str(value)

          def address_word(value):
              return strip0(value).lower().rjust(64, "0")

          def bytes4_word(value):
              return strip0(value).lower().ljust(64, "0")

          def uint_word(value):
              return hex(value)[2:].rjust(64, "0")

          def call(endpoint, target, data):
              return request(endpoint, "eth_call", [{"to": target, "data": data}, "latest"])

          def decode_address(raw):
              return None if not raw or raw == "0x" else "0x" + strip0(raw)[-40:]

          def decode_uint(raw):
              return None if not raw or raw == "0x" else int(raw, 16)

          def decode_bool(raw):
              value = decode_uint(raw)
              return None if value is None else bool(value)

          def decode_text(raw):
              if not raw or raw == "0x":
                  return None
              value = strip0(raw)
              try:
                  offset = int(value[:64], 16) * 2
                  length = int(value[offset:offset + 64], 16)
                  return bytes.fromhex(value[offset + 64:offset + 64 + length * 2]).decode(errors="replace")
              except Exception:
                  try:
                      return bytes.fromhex(value[:64]).rstrip(b"\0").decode(errors="replace")
                  except Exception:
                      return None

          def decode_address_array(raw):
              if not raw or raw == "0x":
                  return []
              value = strip0(raw)
              try:
                  offset = int(value[:64], 16) * 2
                  length = int(value[offset:offset + 64], 16)
                  return [
                      "0x" + value[offset + 64 + index * 64:offset + 64 + (index + 1) * 64][-40:]
                      for index in range(length)
                  ]
              except Exception:
                  return []

          def decode_modules(raw):
              if not raw or raw == "0x":
                  return {"modules": [], "next": None}
              value = strip0(raw)
              try:
                  offset = int(value[:64], 16) * 2
                  next_address = "0x" + value[64:128][-40:]
                  length = int(value[offset:offset + 64], 16)
                  modules = [
                      "0x" + value[offset + 64 + index * 64:offset + 64 + (index + 1) * 64][-40:]
                      for index in range(length)
                  ]
                  return {"modules": modules, "next": next_address}
              except Exception as exc:
                  return {"modules": [], "next": None, "error": repr(exc), "raw": raw}

          def push4(code):
              value = strip0(code)
              result = set()
              index = 0
              while index + 10 <= len(value):
                  if value[index:index + 2].lower() == "63":
                      result.add("0x" + value[index + 2:index + 10].lower())
                      index += 10
                  else:
                      index += 2
              return sorted(result)

          def basic_contract(endpoint, address):
              code = request(endpoint, "eth_getCode", [address, "latest"])
              item = {"address": address.lower(), "code_bytes": len(strip0(code)) // 2, "push4": push4(code), "probes": {}}
              if item["code_bytes"] == 0:
                  return item
              for signature in ("owner()", "authority()", "pendingOwner()"):
                  try:
                      item["probes"][signature] = decode_address(call(endpoint, address, S[signature]))
                  except Exception as exc:
                      item["probes"][signature] = {"error": repr(exc)}
              for signature in ("name()", "symbol()"):
                  try:
                      item["probes"][signature] = decode_text(call(endpoint, address, S[signature]))
                  except Exception as exc:
                      item["probes"][signature] = {"error": repr(exc)}
              for signature in ("decimals()", "totalSupply()", "getThreshold()", "getMinDelay()"):
                  try:
                      item["probes"][signature] = decode_uint(call(endpoint, address, S[signature]))
                  except Exception as exc:
                      item["probes"][signature] = {"error": repr(exc)}
              try:
                  item["probes"]["getOwners()"] = decode_address_array(call(endpoint, address, S["getOwners()"]))
              except Exception as exc:
                  item["probes"]["getOwners()"] = {"error": repr(exc)}
              try:
                  item["probes"]["modules"] = decode_modules(
                      call(endpoint, address, S["getModulesPaginated(address,uint256)"] + address_word(SENTINEL) + uint_word(100))
                  )
              except Exception as exc:
                  item["probes"]["modules"] = {"error": repr(exc)}
              for signature in ("getGuard()", "getFallbackHandler()"):
                  try:
                      item["probes"][signature] = decode_address(call(endpoint, address, S[signature]))
                  except Exception as exc:
                      item["probes"][signature] = {"error": repr(exc)}
              return item

          endpoint, rpc_failures = choose_rpc()
          output = {
              "generated_at_unix": int(time.time()),
              "endpoint": endpoint,
              "rpc_failures": rpc_failures,
              "block": int(request(endpoint, "eth_blockNumber", []), 16),
              "addresses": A,
              "selectors": S,
              "alternate_solver": {},
              "subvault": {},
              "safe_holders": {},
              "flags": [],
          }

          # Alternate solver controls.
          alt = basic_contract(endpoint, A["alternate_solver"])
          alt_auth = alt["probes"].get("authority()")
          alt_owner = alt["probes"].get("owner()")
          alt["self_gates"] = {}
          solver_signatures = [
              "boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,bool)",
              "boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address,bool)",
              "boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)",
              "boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)",
              "boringSolve(address,address,address,uint256,uint256,bytes)", "rescueTokens(address,uint256)", "multicall(bytes[])",
          ]
          if isinstance(alt_auth, str):
              for signature in solver_signatures:
                  selector = S[signature]
                  gate = {}
                  for subject_name, subject in {
                      "attacker": TEST,
                      "owner": alt_owner if isinstance(alt_owner, str) else ZERO,
                      "parent_queue": A["parent_queue"],
                      "self": A["alternate_solver"],
                  }.items():
                      try:
                          gate[subject_name] = decode_bool(call(
                              endpoint, alt_auth,
                              S["canCall(address,address,bytes4)"] + address_word(subject) + address_word(A["alternate_solver"]) + bytes4_word(selector)
                          ))
                      except Exception as exc:
                          gate[subject_name] = {"error": repr(exc)}
                  try:
                      gate["public"] = decode_bool(call(
                          endpoint, alt_auth,
                          S["isCapabilityPublic(address,bytes4)"] + address_word(A["alternate_solver"]) + bytes4_word(selector)
                      ))
                  except Exception as exc:
                      gate["public"] = {"error": repr(exc)}
                  try:
                      gate["roles_mask"] = decode_uint(call(
                          endpoint, alt_auth,
                          S["getRolesWithCapability(address,bytes4)"] + address_word(A["alternate_solver"]) + bytes4_word(selector)
                      ))
                  except Exception as exc:
                      gate["roles_mask"] = {"error": repr(exc)}
                  alt["self_gates"][signature] = gate
          alt["cross_permissions"] = {}
          for target_name, target, signatures in [
              ("parent_teller", A["parent_teller"], ["bulkDeposit(address,uint256,uint256,address)", "bulkWithdraw(address,uint256,uint256,address)"]),
              ("parent_queue", A["parent_queue"], ["solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)"]),
          ]:
              for signature in signatures:
                  try:
                      alt["cross_permissions"][f"{target_name}:{signature}"] = decode_bool(call(
                          endpoint, A["parent_authority"],
                          S["canCall(address,address,bytes4)"] + address_word(A["alternate_solver"]) + address_word(target) + bytes4_word(S[signature])
                      ))
                  except Exception as exc:
                      alt["cross_permissions"][f"{target_name}:{signature}"] = {"error": repr(exc)}
          alt["balances"] = {}
          for token_name, token in {"parent_shares": A["parent_vault"], "WETH": A["WETH"], "eETH": A["eETH"], "weETH": A["weETH"]}.items():
              try:
                  alt["balances"][token_name] = decode_uint(call(endpoint, token, S["balanceOf(address)"] + address_word(A["alternate_solver"])))
              except Exception as exc:
                  alt["balances"][token_name] = {"error": repr(exc)}
          output["alternate_solver"] = alt

          # Subvault and its control plane.
          sub = basic_contract(endpoint, A["subvault"])
          sub_auth = sub["probes"].get("authority()")
          sub["parent_share_balance"] = decode_uint(call(
              endpoint, A["parent_vault"], S["balanceOf(address)"] + address_word(A["subvault"])
          ))
          sub["parent_teller_permissions"] = {}
          for signature in ("bulkDeposit(address,uint256,uint256,address)", "bulkWithdraw(address,uint256,uint256,address)"):
              sub["parent_teller_permissions"][signature] = decode_bool(call(
                  endpoint, A["parent_authority"],
                  S["canCall(address,address,bytes4)"] + address_word(A["subvault"]) + address_word(A["parent_teller"]) + bytes4_word(S[signature])
              ))
          sub["own_gates"] = {}
          if isinstance(sub_auth, str):
              for signature in (
                  "manage(address,bytes,uint256)", "manage(address[],bytes[],uint256[])",
                  "enter(address,address,uint256,address,uint256)", "exit(address,address,uint256,address,uint256)",
                  "setAuthority(address)", "transferOwnership(address)"
              ):
                  selector = S[signature]
                  gate = {}
                  for subject_name, subject in {"attacker": TEST, "manager": A["subvault_manager"], "teller": A["subvault_teller"], "timelock": A["subvault_timelock"]}.items():
                      gate[subject_name] = decode_bool(call(
                          endpoint, sub_auth,
                          S["canCall(address,address,bytes4)"] + address_word(subject) + address_word(A["subvault"]) + bytes4_word(selector)
                      ))
                  gate["public"] = decode_bool(call(
                      endpoint, sub_auth,
                      S["isCapabilityPublic(address,bytes4)"] + address_word(A["subvault"]) + bytes4_word(selector)
                  ))
                  gate["roles_mask"] = decode_uint(call(
                      endpoint, sub_auth,
                      S["getRolesWithCapability(address,bytes4)"] + address_word(A["subvault"]) + bytes4_word(selector)
                  ))
                  sub["own_gates"][signature] = gate
          sub["manager"] = basic_contract(endpoint, A["subvault_manager"])
          sub["manager_gates"] = {}
          for signature in ("manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])", "setManageRoot(address,bytes32)"):
              gate = {}
              for subject_name, subject in {"attacker": TEST, "timelock": A["subvault_timelock"], "manager_self": A["subvault_manager"]}.items():
                  gate[subject_name] = decode_bool(call(
                      endpoint, A["subvault_authority"],
                      S["canCall(address,address,bytes4)"] + address_word(subject) + address_word(A["subvault_manager"]) + bytes4_word(S[signature])
                  ))
              gate["public"] = decode_bool(call(
                  endpoint, A["subvault_authority"],
                  S["isCapabilityPublic(address,bytes4)"] + address_word(A["subvault_manager"]) + bytes4_word(S[signature])
              ))
              sub["manager_gates"][signature] = gate
          sub["teller"] = basic_contract(endpoint, A["subvault_teller"])
          sub["teller_public_surface"] = {}
          for signature in ("deposit(address,uint256,uint256,address)", "withdraw(address,uint256,uint256,address)", "bridge(uint96,address,bytes,address,uint256)"):
              try:
                  sub["teller_public_surface"][signature] = decode_bool(call(
                      endpoint, A["subvault_authority"],
                      S["isCapabilityPublic(address,bytes4)"] + address_word(A["subvault_teller"]) + bytes4_word(S[signature])
                  ))
              except Exception as exc:
                  sub["teller_public_surface"][signature] = {"error": repr(exc)}
          sub["timelock"] = basic_contract(endpoint, A["subvault_timelock"])
          sub["timelock_roles"] = {}
          for role_name, role_id in ROLE_IDS.items():
              values = {}
              for subject_name, subject in {"attacker": TEST, "zero": ZERO}.items():
                  values[subject_name] = decode_bool(call(
                      endpoint, A["subvault_timelock"],
                      S["hasRole(bytes32,address)"] + strip0(role_id).rjust(64, "0") + address_word(subject)
                  ))
              sub["timelock_roles"][role_name] = values
          output["subvault"] = sub

          # Safe-like privileged holders.
          for name in ("liquid_multisig", "strategist_safe_1", "strategist_safe_2", "strategist_safe_3", "strategist_safe_4"):
              output["safe_holders"][name] = basic_contract(endpoint, A[name])

          # Flags.
          if any(gate.get("attacker") is True or gate.get("public") is True for gate in alt.get("self_gates", {}).values() if isinstance(gate, dict)):
              output["flags"].append("ALTERNATE_SOLVER_PERMISSIONLESS_SELECTOR")
          if any(gate.get("attacker") is True or gate.get("public") is True for gate in sub.get("own_gates", {}).values() if isinstance(gate, dict)):
              output["flags"].append("SUBVAULT_PERMISSIONLESS_CONTROL")
          if any(gate.get("attacker") is True or gate.get("public") is True for gate in sub.get("manager_gates", {}).values() if isinstance(gate, dict)):
              output["flags"].append("SUBVAULT_MANAGER_PERMISSIONLESS_CONTROL")
          for name, safe in output["safe_holders"].items():
              modules = safe.get("probes", {}).get("modules", {}).get("modules") if isinstance(safe.get("probes", {}).get("modules"), dict) else []
              if modules:
                  output["flags"].append({"SAFE_MODULES": name, "address": safe["address"], "modules": modules})

          with open("veda-privileged-composition.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")

          print(json.dumps({
              "block": output["block"],
              "alternate_solver": {
                  "owner": alt.get("probes", {}).get("owner()"),
                  "authority": alt.get("probes", {}).get("authority()"),
                  "self_gates": alt.get("self_gates"),
                  "cross_permissions": alt.get("cross_permissions"),
                  "balances": alt.get("balances"),
              },
              "subvault": {
                  "name": sub.get("probes", {}).get("name()"),
                  "symbol": sub.get("probes", {}).get("symbol()"),
                  "authority": sub.get("probes", {}).get("authority()"),
                  "parent_share_balance": sub.get("parent_share_balance"),
                  "parent_teller_permissions": sub.get("parent_teller_permissions"),
                  "own_gates": sub.get("own_gates"),
                  "manager_gates": sub.get("manager_gates"),
                  "teller_public_surface": sub.get("teller_public_surface"),
                  "timelock_roles": sub.get("timelock_roles"),
              },
              "safe_holders": {
                  name: {
                      "address": safe["address"],
                      "code_bytes": safe["code_bytes"],
                      "owners": safe.get("probes", {}).get("getOwners()"),
                      "threshold": safe.get("probes", {}).get("getThreshold()"),
                      "modules": safe.get("probes", {}).get("modules"),
                      "guard": safe.get("probes", {}).get("getGuard()"),
                      "fallback_handler": safe.get("probes", {}).get("getFallbackHandler()"),
                  }
                  for name, safe in output["safe_holders"].items()
              },
              "flags": output["flags"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload privileged composition evidence
        uses: actions/upload-artifact@v4
        with:
          name: veda-privileged-composition
          path: veda-privileged-composition.json
          if-no-files-found: error
          retention-days: 1
