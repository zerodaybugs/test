name: veda-production-window-scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Scan production bridge traffic inside positive rate windows
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, json, subprocess, time, urllib.request

          WINDOW_B64 = ''''''

          windows = json.loads(gzip.decompress(base64.b64decode(WINDOW_B64)))
          TELLERS = {
              'liquidETH': '0x9AA79C84b79816ab920bBcE20f8f74557B514734',
              'liquidBTC': '0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353',
              'liquidUSD': '0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387',
          }
          ONE = {'liquidETH': 10**18, 'liquidBTC': 10**8, 'liquidUSD': 10**6}
          RPCS = ['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']
          ETH_RPCS = ['https://ethereum-rpc.publicnode.com','https://eth.drpc.org','https://rpc.mevblocker.io']

          def sig(s): return subprocess.check_output(['cast','keccak',s],text=True).strip()
          SENT = sig('MessageSent(bytes32,uint256,address)')
          RECEIVED = sig('MessageReceived(bytes32,uint256,address)')
          DEPOSIT_TOPICS = {
              sig('Deposit(uint256,address,address,uint256,uint256,uint256,uint256,address)'),
              sig('Deposit(uint256,address,address,uint256,uint256,uint256,uint256)'),
          }
          ATOMIC_SELECTORS = {
              subprocess.check_output(['cast','sig','depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)'],text=True).strip().lower(),
              subprocess.check_output(['cast','sig','depositAndBridge(address,uint256,uint256,address,bytes,address,uint256,address)'],text=True).strip().lower(),
              subprocess.check_output(['cast','sig','depositAndBridgeWithPermit((address,uint256,uint256,uint256,uint8,bytes32,bytes32,address,bytes,address,uint256,address))'],text=True).strip().lower(),
          }

          def rpc(url,method,params,timeout=45):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(url,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-production-window-scan/1'})
              with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
              if 'error' in o: raise RuntimeError(o['error'])
              return o['result']

          def choose(candidates,chain_id):
              bad={}
              for u in candidates:
                  try:
                      if int(rpc(u,'eth_chainId',[]),16)!=chain_id: raise RuntimeError('wrong chain')
                      return u,bad
                  except Exception as e: bad[u]=repr(e)
              raise RuntimeError(bad)

          scroll,scroll_fail=choose(RPCS,534352)
          eth,eth_fail=choose(ETH_RPCS,1)
          eth_latest=int(rpc(eth,'eth_blockNumber',[]),16)
          block_ts_cache={}
          def block_ts(url,n):
              k=(url,n)
              if k not in block_ts_cache:
                  block_ts_cache[k]=int(rpc(url,'eth_getBlockByNumber',[hex(n),False])['timestamp'],16)
              return block_ts_cache[k]
          def find_block_at_or_before(url,hi,target):
              lo=1
              while lo<hi:
                  mid=(lo+hi+1)//2
                  if block_ts(url,mid)<=target: lo=mid
                  else: hi=mid-1
              return lo
          def get_logs(url,address,from_block,to_block,topics):
              return rpc(url,'eth_getLogs',[{'address':address,'fromBlock':hex(from_block),'toBlock':hex(to_block),'topics':topics}],90)
          def h(x): return x[2:] if x.startswith('0x') else x
          def topic_addr(t): return '0x'+h(t)[-40:]

          raw_hits=[]; errors=[]; seen=set()
          for idx,w in enumerate(windows):
              teller=TELLERS[w['p']]
              # Post-bounty windows are <500 seconds; 1200 Scroll blocks is a conservative envelope.
              lo=max(1,int(w['b'])-1200); hi=int(w['b'])
              try:
                  logs=get_logs(scroll,teller,lo,hi,[SENT])
              except Exception as e:
                  errors.append({'index':idx,'stage':'source_logs','error':repr(e),'window':w}); continue
              for log in logs:
                  key=(log['transactionHash'],log['logIndex'])
                  if key in seen: continue
                  ts=block_ts(scroll,int(log['blockNumber'],16))
                  if not (w['t0']<=ts<=w['t1']): continue
                  seen.add(key)
                  try:
                      tx=rpc(scroll,'eth_getTransactionByHash',[log['transactionHash']])
                      rc=rpc(scroll,'eth_getTransactionReceipt',[log['transactionHash']])
                      selector=(tx.get('input') or '0x')[:10].lower()
                      topics=log.get('topics') or []
                      shares=int(log.get('data','0x0'),16)
                      guid=topics[1] if len(topics)>1 else None
                      recipient=topic_addr(topics[2]) if len(topics)>2 else None
                      receipt_topics={x['topics'][0].lower() for x in rc.get('logs',[]) if x.get('topics')}
                      has_deposit_event=any(t.lower() in receipt_topics for t in DEPOSIT_TOPICS)
                      atomic=selector in ATOMIC_SELECTORS or has_deposit_event
                      extra=shares*(int(w['dr'])-int(w['sr']))//ONE[w['p']]
                      hit={'window_index':idx,'window':w,'block':int(log['blockNumber'],16),'timestamp':ts,'tx':log['transactionHash'],'selector':selector,'atomic_selector':selector in ATOMIC_SELECTORS,'has_deposit_event':has_deposit_event,'atomic':atomic,'guid':guid,'recipient':recipient,'shares_raw':shares,'gross_extra_base_units':extra,'tx_from':tx.get('from'),'tx_to':tx.get('to')}
                      raw_hits.append(hit)
                  except Exception as e:
                      errors.append({'index':idx,'stage':'hydrate_hit','tx':log.get('transactionHash'),'error':repr(e)})

          # For atomic source hits, resolve destination delivery near the same timestamp.
          delivered=[]
          for hit in raw_hits:
              if not hit['atomic'] or not hit.get('guid'): continue
              try:
                  start=find_block_at_or_before(eth,eth_latest,hit['timestamp'])
                  found=[]
                  for chunk_lo in range(max(1,start-200),min(eth_latest,start+12000)+1,1500):
                      chunk_hi=min(eth_latest,chunk_lo+1499)
                      found.extend(get_logs(eth,TELLERS[hit['window']['p']],chunk_lo,chunk_hi,[RECEIVED,hit['guid']]))
                      if found: break
                  item=dict(hit)
                  item['destination_delivery_found']=bool(found)
                  if found:
                      d=found[0]
                      item['destination_block']=int(d['blockNumber'],16)
                      item['destination_tx']=d['transactionHash']
                      item['destination_timestamp']=block_ts(eth,item['destination_block'])
                  delivered.append(item)
              except Exception as e:
                  errors.append({'stage':'destination_delivery','tx':hit['tx'],'error':repr(e)})

          atomic=[x for x in raw_hits if x['atomic']]
          delivered_atomic=[x for x in delivered if x.get('destination_delivery_found')]
          out={
              'generated_at_unix':int(time.time()),
              'scroll_rpc':scroll,'ethereum_rpc':eth,
              'rpc_failures':{'scroll':scroll_fail,'ethereum':eth_fail},
              'window_count':len(windows),
              'source_message_hit_count':len(raw_hits),
              'atomic_source_hit_count':len(atomic),
              'delivered_atomic_hit_count':len(delivered_atomic),
              'max_atomic_gross_extra_base_units':max([x['gross_extra_base_units'] for x in atomic] or [0]),
              'sum_atomic_gross_extra_base_units':sum(x['gross_extra_base_units'] for x in atomic),
              'source_hits':raw_hits,
              'delivered_atomic_hits':delivered_atomic,
              'errors':errors,
          }
          open('veda-production-window-scan.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ['window_count','source_message_hit_count','atomic_source_hit_count','delivered_atomic_hit_count','max_atomic_gross_extra_base_units','sum_atomic_gross_extra_base_units']},indent=2))
          if errors: print('errors',len(errors))
          PY

      - name: Upload production-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-production-window-scan
          path: veda-production-window-scan.json
          if-no-files-found: error
          retention-days: 1
