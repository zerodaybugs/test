name: veda-rate-provider-introspection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Introspect live rate providers and configured target calls
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          CHAINS = {
              "ethereum": {
                  "id": 1,
                  "rpcs": ["https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com"],
                  "providers": {
                      "liquidBTC_LBTC": "0x94916a66fc119a0ac7d612927f0d909cac15314c",
                      "liquidETH_weETH": "0xcd5fe23c85820f7b72d0926fc9b05b43e359b7ee",
                      "liquidETH_wstETH": "0x8a4207bfc6fc475f172f929468acdd4a2c4c3c19",
                  },
              },
              "scroll": {
                  "id": 534352,
                  "rpcs": ["https://scroll-rpc.publicnode.com", "https://rpc.scroll.io", "https://scroll.drpc.org"],
                  "providers": {
                      "liquidBTC_eBTC": "0x1b293dc39f94157fa0d1d36d7e0090c8b8b8c13f",
                      "liquidETH_weETH": "0xe8cdf5630b2d6cd3214118f82c4f6dd4297d22b4",
                  },
              },
              "optimism": {
                  "id": 10,
                  "rpcs": ["https://optimism-rpc.publicnode.com", "https://mainnet.optimism.io", "https://optimism.drpc.org"],
                  "providers": {
                      "weETH_exchange_feed": "0x72ec6bf88effed88290c66dcf1be2321d80502f5",
                  },
              },
          }

          SIG = {
              "getRate": "0x679aefce",
              "target": "0xd4b83992",
              "selector": "0xea3d508a",
              "signed": "0x232a6b9d",
              "inputDecimals": "0xba8bdb03",
              "outputDecimals": "0xbf560ad8",
              "staticArgument0": "0x9cc5661d",
              "staticArgument1": "0x61efe54d",
              "staticArgument2": "0x4d8aefa2",
              "staticArgument3": "0x92be0620",
              "staticArgument4": "0xc2a69a98",
              "staticArgument5": "0x33307567",
              "staticArgument6": "0xef060d4f",
              "staticArgument7": "0xa9f31af5",
              "decimals": "0x313ce567",
              "name": "0x06fdde03",
              "symbol": "0x95d89b41",
              "owner": "0x8da5cb5b",
              "authority": "0xbf7e214f",
              "vault": "0xfbfa77cf",
              "base": "0x5001f3b5",
              "accountant": "0x4fb3ccc5",
              "totalSupply": "0x18160ddd",
              "totalAssets": "0x01e1d114",
              "latestAnswer": "0x50d25bcd",
              "latestRoundData": "0xfeaf968c",
          }

          def request(endpoint, method, params, timeout=18):
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={"content-type": "application/json", "user-agent": "veda-rate-provider-introspection/2.0"},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          def choose_rpc(config):
              failures = {}
              for endpoint in config["rpcs"]:
                  try:
                      if int(request(endpoint, "eth_chainId", []), 16) == config["id"]:
                          return endpoint, failures
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(failures)

          def batch_calls(endpoint, calls):
              payload = [
                  {"jsonrpc": "2.0", "id": index, "method": "eth_call", "params": [{"to": target, "data": data}, "latest"]}
                  for index, (target, data) in enumerate(calls)
              ]
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={"content-type": "application/json", "user-agent": "veda-rate-provider-introspection/2.0"},
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  values = json.loads(response.read().decode())
              by_id = {item["id"]: item for item in values}
              return [by_id[index] for index in range(len(calls))]

          def decode_address(raw):
              return None if not raw or raw == "0x" else "0x" + raw[2:][-40:]

          def decode_uint(raw):
              return None if not raw or raw == "0x" else int(raw, 16)

          def decode_bool(raw):
              value = decode_uint(raw)
              return None if value is None else bool(value)

          def decode_bytes4(raw):
              return None if not raw or len(raw) < 10 else "0x" + raw[2:10]

          def decode_text(raw):
              if not raw or raw == "0x":
                  return None
              value = raw[2:]
              try:
                  offset = int(value[:64], 16) * 2
                  length = int(value[offset:offset + 64], 16)
                  return bytes.fromhex(value[offset + 64:offset + 64 + length * 2]).decode(errors="replace")
              except Exception:
                  try:
                      return bytes.fromhex(value[:64]).rstrip(b"\0").decode(errors="replace")
                  except Exception:
                      return None

          provider_fields = list(SIG)
          output = {"generated_at_unix": int(time.time()), "selectors": SIG, "chains": {}}

          for chain_name, config in CHAINS.items():
              endpoint, rpc_failures = choose_rpc(config)
              chain = {
                  "endpoint": endpoint,
                  "rpc_failures": rpc_failures,
                  "block": int(request(endpoint, "eth_blockNumber", []), 16),
                  "providers": {},
              }
              calls = []
              keys = []
              for label, provider in config["providers"].items():
                  for field in provider_fields:
                      calls.append((provider, SIG[field]))
                      keys.append((label, field))
              results = batch_calls(endpoint, calls)
              raw_by_key = {key: result for key, result in zip(keys, results)}

              for label, provider in config["providers"].items():
                  code = request(endpoint, "eth_getCode", [provider, "latest"])
                  item = {"address": provider, "code_bytes": len(code[2:]) // 2, "calls": {}}
                  for field in provider_fields:
                      response = raw_by_key[(label, field)]
                      if "error" in response:
                          item["calls"][field] = {"error": response["error"]}
                          continue
                      raw = response.get("result")
                      if field in {"target", "owner", "authority", "vault", "base", "accountant"}:
                          value = decode_address(raw)
                      elif field in {"name", "symbol"}:
                          value = decode_text(raw)
                      elif field == "selector":
                          value = decode_bytes4(raw)
                      elif field == "signed":
                          value = decode_bool(raw)
                      else:
                          value = decode_uint(raw)
                      item["calls"][field] = {"raw": raw, "value": value}

                  target = item["calls"].get("target", {}).get("value")
                  configured_selector = item["calls"].get("selector", {}).get("value")
                  if target:
                      target_code = request(endpoint, "eth_getCode", [target, "latest"])
                      target_item = {"address": target, "code_bytes": len(target_code[2:]) // 2, "calls": {}}
                      target_fields = ["name", "symbol", "decimals", "owner", "authority", "vault", "base", "accountant", "totalSupply", "totalAssets", "getRate", "latestAnswer", "latestRoundData"]
                      target_results = batch_calls(endpoint, [(target, SIG[field]) for field in target_fields])
                      for field, response in zip(target_fields, target_results):
                          if "error" in response:
                              target_item["calls"][field] = {"error": response["error"]}
                              continue
                          raw = response.get("result")
                          if field in {"owner", "authority", "vault", "base", "accountant"}:
                              value = decode_address(raw)
                          elif field in {"name", "symbol"}:
                              value = decode_text(raw)
                          else:
                              value = decode_uint(raw)
                          target_item["calls"][field] = {"raw": raw, "value": value}

                      if configured_selector:
                          static_args = "".join(
                              (item["calls"].get(f"staticArgument{index}", {}).get("raw") or ("0x" + "00" * 32))[2:]
                              for index in range(8)
                          )
                          configured_data = configured_selector + static_args
                          target_item["configured_selector"] = configured_selector
                          target_item["configured_calldata"] = configured_data
                          try:
                              target_item["configured_call_raw"] = request(
                                  endpoint, "eth_call", [{"to": target, "data": configured_data}, "latest"]
                              )
                          except Exception as exc:
                              target_item["configured_call_error"] = repr(exc)
                      item["target"] = target_item
                  chain["providers"][label] = item
              output["chains"][chain_name] = chain

          with open("veda-rate-provider-introspection.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")

          summary = {
              chain_name: {
                  label: {
                      "provider": provider["address"],
                      "provider_code_bytes": provider["code_bytes"],
                      "rate": provider["calls"].get("getRate", {}).get("value"),
                      "target": provider.get("target", {}).get("address"),
                      "target_code_bytes": provider.get("target", {}).get("code_bytes"),
                      "selector": provider.get("target", {}).get("configured_selector"),
                      "configured_call_raw": provider.get("target", {}).get("configured_call_raw"),
                      "input_decimals": provider["calls"].get("inputDecimals", {}).get("value"),
                      "output_decimals": provider["calls"].get("outputDecimals", {}).get("value"),
                  }
                  for label, provider in chain["providers"].items()
              }
              for chain_name, chain in output["chains"].items()
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload rate provider introspection
        uses: actions/upload-artifact@v4
        with:
          name: veda-rate-provider-introspection
          path: veda-rate-provider-introspection.json
          if-no-files-found: error
          retention-days: 1
