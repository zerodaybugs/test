name: veda-rate-sync-history

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct cross-chain rate update ordering
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import traceback
          import urllib.parse
          import urllib.request

          CHAINS = {
              1:{"name":"ethereum","rpc":["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com"],"fallback_start":19_000_000},
              10:{"name":"optimism","rpc":["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"],"fallback_start":115_000_000},
              534352:{"name":"scroll","rpc":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"],"fallback_start":5_000_000},
          }
          PRODUCTS = {
              "liquidBTC":"0xea23ac6d7d11f6b181d6b98174d334478adae6b0",
              "liquidETH":"0x0d05d94a5f1e76c18fbeb7a13d17c8a314088198",
              "liquidUSD":"0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7",
          }

          def sig(text): return subprocess.check_output(["cast","keccak",text],text=True).strip().lower()
          TOPIC = sig("ExchangeRateUpdated(uint96,uint96,uint64)")

          def http_json(url, attempts=4):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={"accept":"application/json","user-agent":"veda-rate-sync-history/2.1"})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return json.loads(r.read().decode())
                  except Exception as exc:
                      last=exc; time.sleep(1+i*2)
              raise RuntimeError({"url":url,"error":repr(last)})

          def rpc(endpoint,method,params,attempts=4):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(endpoint,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-rate-sync-history/2.1"})
                      with urllib.request.urlopen(req,timeout=45) as r: d=json.loads(r.read().decode())
                      if "error" in d: raise RuntimeError(d["error"])
                      return d["result"]
                  except Exception as exc:
                      last=exc; time.sleep(i+1)
              raise RuntimeError(repr(last))

          def select_rpc(config,chain_id):
              errors={}
              for endpoint in config["rpc"]:
                  try:
                      if int(rpc(endpoint,"eth_chainId",[]),16)==chain_id: return endpoint,errors
                  except Exception as exc: errors[endpoint]=repr(exc)
              return None,errors

          def first_code_block(endpoint,address,current,fallback):
              if not endpoint: return fallback,{"fallback":"no_rpc"}
              try:
                  if rpc(endpoint,"eth_getCode",[address,"latest"]) in ("0x","0x0"): return current,{"error":"no_current_code"}
                  lo,hi=0,current
                  while lo<hi:
                      mid=(lo+hi)//2
                      code=rpc(endpoint,"eth_getCode",[address,hex(mid)])
                      if code not in ("0x","0x0"): hi=mid
                      else: lo=mid+1
                  return lo,None
              except Exception as exc:
                  return fallback,{"fallback_error":repr(exc)}

          def route_range(chain_id,address,start,end):
              params=urllib.parse.urlencode({
                  "module":"logs","action":"getLogs","address":address,"fromBlock":start,"toBlock":end,
                  "topic0":TOPIC,"page":1,"offset":1000,
              })
              url=f"https://api.routescan.io/v2/network/mainnet/evm/{chain_id}/etherscan/api?{params}"
              d=http_json(url); result=d.get("result")
              if isinstance(result,list): return result,None
              text=str(result)
              if d.get("status")=="0" and ("No records" in text or "No transactions" in text): return [],None
              return None,{"response":d,"url":url}

          def logs(chain_id,address,start,end):
              all_logs=[]; errors=[]; stack=[(start,end)]
              calls=0
              while stack:
                  a,b=stack.pop(0); calls+=1
                  try:
                      result,error=route_range(chain_id,address,a,b)
                  except Exception as exc:
                      result,error=None,{"exception":repr(exc)}
                  if result is not None:
                      all_logs.extend(result)
                      if len(result)>=1000 and a<b:
                          mid=(a+b)//2; stack.insert(0,(mid+1,b)); stack.insert(0,(a,mid))
                  elif b-a>50_000:
                      mid=(a+b)//2; stack.insert(0,(mid+1,b)); stack.insert(0,(a,mid))
                  else:
                      errors.append({"from":a,"to":b,"error":error})
                  time.sleep(.52)
              unique={}
              for x in all_logs:
                  key=(x.get("transactionHash"),x.get("logIndex")); unique[key]=x
              return list(unique.values()),errors,calls

          def iv(v):
              if isinstance(v,int): return v
              s=str(v or "").strip()
              if s in ("","0x","0X"): return 0
              return int(s,16) if s.lower().startswith("0x") else int(s)
          def words(data):
              x=data[2:] if data.startswith("0x") else data
              return [int(x[i:i+64],16) for i in range(0,len(x),64)] if x else []

          output={"topic":TOPIC,"chains":{},"products":{},"generated_at_unix":int(time.time()),"fatal_errors":[]}
          by_product={p:{} for p in PRODUCTS}
          try:
              for chain_id,config in CHAINS.items():
                  chain_name=config["name"]; endpoint,rpc_errors=select_rpc(config,chain_id)
                  try: current=int(rpc(endpoint,"eth_blockNumber",[]),16) if endpoint else config["fallback_start"]+30_000_000
                  except Exception as exc: current=config["fallback_start"]+30_000_000; rpc_errors["block"]=repr(exc)
                  output["chains"][chain_name]={"endpoint":endpoint,"rpc_errors":rpc_errors,"current_block":current}
                  for product,address in PRODUCTS.items():
                      start,start_note=first_code_block(endpoint,address,current,config["fallback_start"])
                      raw,errors,calls=logs(chain_id,address,max(0,start-10),current)
                      events=[]
                      for log in raw:
                          if not log.get("topics") or log["topics"][0].lower()!=TOPIC: continue
                          w=words(log.get("data","0x"))
                          if len(w)<3: continue
                          events.append({
                              "block":iv(log.get("blockNumber",0)),"log_index":iv(log.get("logIndex",0)),
                              "tx":log.get("transactionHash"),"timestamp":w[2],
                              "old_rate":w[0],"new_rate":w[1],"event_time":w[2],
                          })
                      events.sort(key=lambda e:(e["timestamp"],e["block"],e["log_index"]))
                      output["chains"][chain_name][product]={
                          "address":address,"start_block":start,"start_note":start_note,"api_calls":calls,
                          "range_errors":errors,"events":events,"count":len(events),
                      }
                      by_product[product][chain_name]=events

              for product,chains in by_product.items():
                  eth=chains.get("ethereum",[]); scroll=chains.get("scroll",[]); optimism=chains.get("optimism",[])
                  def state_at(events,ts):
                      rate=None; event=None
                      for e in events:
                          if e["timestamp"]<=ts: rate=e["new_rate"]; event=e
                          else: break
                      return rate,event
                  matches=[]; windows=[]
                  all_rates=sorted(set(e["new_rate"] for es in chains.values() for e in es))
                  for rate in all_rates:
                      rows={name:next((e for e in events if e["new_rate"]==rate),None) for name,events in chains.items()}
                      matches.append({"rate":rate,"events":rows})
                  for ee in eth:
                      for source_name,source_events in (("scroll",scroll),("optimism",optimism)):
                          source_rate,source_event=state_at(source_events,ee["timestamp"])
                          if source_rate and ee["new_rate"]>source_rate:
                              close=next((x for x in source_events if x["timestamp"]>=ee["timestamp"] and x["new_rate"]>=ee["new_rate"]),None)
                              windows.append({
                                  "direction":source_name+"_to_ethereum","ethereum_update":ee,
                                  "source_rate":source_rate,"source_state_event":source_event,"close_event":close,
                                  "duration_seconds":None if not close else close["timestamp"]-ee["timestamp"],
                                  "gross_profit_bps":(ee["new_rate"]-source_rate)*10000/source_rate,
                              })
                  output["products"][product]={
                      "matched_rates":matches,"profitable_source_windows":windows,
                      "max_gross_profit_bps":max([w["gross_profit_bps"] for w in windows],default=0),
                      "max_window_seconds":max([w["duration_seconds"] or 0 for w in windows],default=0),
                  }
          except Exception as exc:
              output["fatal_errors"].append({"error":repr(exc),"traceback":traceback.format_exc()})

          with open("veda-rate-sync-history.json","w",encoding="utf-8") as f:
              json.dump(output,f,indent=2,sort_keys=True); f.write("\n")
          summary={}
          for p,v in output["products"].items():
              summary[p]={
                  "events":{c:len(output["chains"].get(c,{}).get(p,{}).get("events",[])) for c in ("ethereum","optimism","scroll")},
                  "profitable_windows":len(v["profitable_source_windows"]),
                  "max_gross_profit_bps":v["max_gross_profit_bps"],"max_window_seconds":v["max_window_seconds"],
              }
          print(json.dumps({"summary":summary,"fatal_errors":output["fatal_errors"]},indent=2,sort_keys=True))
          PY
      - name: Upload rate synchronization history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-rate-sync-history
          path: veda-rate-sync-history.json
          if-no-files-found: warn
          retention-days: 1
