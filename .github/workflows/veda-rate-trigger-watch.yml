name: veda-rate-trigger-watch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Watch for the next cross-chain accountant update ordering window
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, traceback, urllib.request

          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org']},
            'optimism':{'id':10,'rpcs':['https://optimism-rpc.publicnode.com','https://mainnet.optimism.io','https://optimism.drpc.org']},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io']},
          }
          ACCOUNTANTS={
            'liquidBTC':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0',
            'liquidETH':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198',
            'liquidUSD':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7',
          }
          def sh(*args):
            p=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if p.returncode:raise RuntimeError({'args':args,'stdout':p.stdout,'stderr':p.stderr})
            return p.stdout.strip()
          GET_RATE=sh('cast','sig','getRate()')
          def rpc(ep,m,p,t=20):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-rate-trigger-watch/1'})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          def choose(cfg):
            for ep in cfg['rpcs']:
              try:
                if int(rpc(ep,'eth_chainId',[]),16)==cfg['id']:return ep
              except:pass
            raise RuntimeError('no rpc')
          endpoints={c:choose(cfg) for c,cfg in CHAINS.items()}
          def sample(i):
            row={'index':i,'wall_time':time.time(),'chains':{},'edges':[]}
            for c,ep in endpoints.items():
              block=int(rpc(ep,'eth_blockNumber',[]),16);b=rpc(ep,'eth_getBlockByNumber',[hex(block),False]);rates={}
              for p,a in ACCOUNTANTS.items():rates[p]=int(rpc(ep,'eth_call',[{'to':a,'data':GET_RATE},'latest']),16)
              row['chains'][c]={'block':block,'timestamp':int(b['timestamp'],16),'rates':rates}
            for src,sc in row['chains'].items():
              for dst,dc in row['chains'].items():
                if src==dst:continue
                for p,a in sc['rates'].items():
                  b=dc['rates'][p]
                  if b>a:row['edges'].append({'source':src,'destination':dst,'product':p,'source_rate':a,'destination_rate':b,'delta':b-a,'edge_bps':(b-a)*10000/a})
            return row
          rows=[];errors=[];trigger=None;baseline=None
          for i in range(600):
            try:
              r=sample(i);rows.append(r)
              if baseline is None:baseline={c:dict(v['rates']) for c,v in r['chains'].items()}
              changed=[]
              for c,v in r['chains'].items():
                for p,rate in v['rates'].items():
                  if rate!=baseline[c][p]:changed.append({'chain':c,'product':p,'old':baseline[c][p],'new':rate})
              if changed or r['edges']:
                r['changed_from_baseline']=changed;trigger=r
                # Continue for 12 additional snapshots to capture propagation order.
                for j in range(12):
                  time.sleep(1);rows.append(sample(i*1000+j+1))
                break
            except Exception as e:errors.append({'index':i,'error':repr(e),'traceback':traceback.format_exc()})
            time.sleep(2)
          out={'generated_at_unix':int(time.time()),'endpoints':endpoints,'baseline':baseline,'trigger':trigger,'samples':rows,'errors':errors,'summary':{'sample_count':len(rows),'triggered':trigger is not None,'positive_edge_sample_count':sum(1 for r in rows if r.get('edges')),'positive_edge_count':sum(len(r.get('edges',[])) for r in rows),'error_count':len(errors)}}
          open('veda-rate-trigger-watch.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'summary':out['summary'],'trigger':trigger,'tail':rows[-15:],'errors':errors[-10:]},indent=2,sort_keys=True))
          PY
      - name: Upload trigger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-rate-trigger-watch
          path: veda-rate-trigger-watch.json
          if-no-files-found: error
          retention-days: 1
