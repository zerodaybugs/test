name: veda-rate-window-sampler

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Sample live accountant rates and route capacities
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, traceback, urllib.request

          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org']},
            'optimism':{'id':10,'rpcs':['https://optimism-rpc.publicnode.com','https://mainnet.optimism.io','https://optimism.drpc.org']},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io']},
          }
          PRODUCTS={
            'liquidBTC':{'accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','one':10**8},
            'liquidETH':{'accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','one':10**18},
            'liquidUSD':{'accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','one':10**6},
          }
          EIDS={'ethereum':30101,'optimism':30111,'scroll':30214}
          ATTACKER='0x1111111111111111111111111111111111111111'

          def sh(*args):
            p=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if p.returncode: raise RuntimeError({'args':args,'stdout':p.stdout,'stderr':p.stderr})
            return p.stdout.strip()
          def sig(s):return sh('cast','sig',s)
          S={x:sig(x) for x in ['getRate()','getAmountCanBeSent(uint32)','getAmountCanBeReceived(uint32)','authority()','canCall(address,address,bytes4)','isCapabilityPublic(address,bytes4)','depositAndBridge(address,uint256,uint256,address,bytes,address,uint256,address)','bridge(uint96,address,bytes,address,uint256)','requestOnChainWithdraw(address,uint128,uint16,uint24)']}
          def rpc(ep,m,p,t=35):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-rate-sampler/1'})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          def choose(cfg):
            bad={}
            for ep in cfg['rpcs']:
              try:
                if int(rpc(ep,'eth_chainId',[]),16)==cfg['id']:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def h(x):
            s=str(x or '');return s[2:] if s.startswith('0x') else s
          def aw(a):return h(a).lower().rjust(64,'0')
          def uw(v):return hex(int(v))[2:].rjust(64,'0')
          def bw(x):return h(x).lower().ljust(64,'0')
          def addr(raw):return '0x'+h(raw)[-40:].lower()
          def call(ep,to,data):return rpc(ep,'eth_call',[{'to':to,'data':data},'latest'])
          def can(ep,auth,user,target,selector):return bool(int(call(ep,auth,S['canCall(address,address,bytes4)']+aw(user)+aw(target)+bw(selector)),16))
          def public(ep,auth,target,selector):return bool(int(call(ep,auth,S['isCapabilityPublic(address,bytes4)']+aw(target)+bw(selector)),16))
          def words(raw):
            x=h(raw);return [int(x[i:i+64],16) for i in range(0,len(x),64)] if x else []

          endpoints={};state={};errors=[]
          for cn,cfg in CHAINS.items():
            try:
              ep,bad=choose(cfg);endpoints[cn]=ep;state[cn]={'endpoint':ep,'rpc_failures':bad}
            except Exception as e:errors.append({'chain':cn,'error':repr(e)})

          routes={}
          for cn,ep in endpoints.items():
            routes[cn]={}
            for pn,p in PRODUCTS.items():
              try:
                auth=addr(call(ep,p['teller'],S['authority()']))
                qauth=addr(call(ep,p['queue'],S['authority()']))
                routes[cn][pn]={
                  'deposit_bridge_public':public(ep,auth,p['teller'],S['depositAndBridge(address,uint256,uint256,address,bytes,address,uint256,address)']),
                  'bridge_public':public(ep,auth,p['teller'],S['bridge(uint96,address,bytes,address,uint256)']),
                  'queue_request_public':public(ep,qauth,p['queue'],S['requestOnChainWithdraw(address,uint128,uint16,uint24)']),
                  'attacker_deposit_bridge':can(ep,auth,ATTACKER,p['teller'],S['depositAndBridge(address,uint256,uint256,address,bytes,address,uint256,address)']),
                  'attacker_bridge':can(ep,auth,ATTACKER,p['teller'],S['bridge(uint96,address,bytes,address,uint256)']),
                  'attacker_queue_request':can(ep,qauth,ATTACKER,p['queue'],S['requestOnChainWithdraw(address,uint128,uint16,uint24)']),
                }
              except Exception as e:routes[cn][pn]={'error':repr(e)}

          samples=[];windows=[]
          previous=None
          for i in range(40):
            sample={'index':i,'wall_time':time.time(),'chains':{},'edges':[]}
            for cn,ep in endpoints.items():
              try:
                block=int(rpc(ep,'eth_blockNumber',[]),16);blk=rpc(ep,'eth_getBlockByNumber',[hex(block),False]);sample['chains'][cn]={'block':block,'timestamp':int(blk['timestamp'],16),'rates':{}}
                for pn,p in PRODUCTS.items():sample['chains'][cn]['rates'][pn]=int(call(ep,p['accountant'],S['getRate()']),16)
              except Exception as e:sample['chains'][cn]={'error':repr(e)};errors.append({'sample':i,'chain':cn,'error':repr(e)})
            for src in sample['chains']:
              if 'rates' not in sample['chains'][src]:continue
              for dst in sample['chains']:
                if src==dst or 'rates' not in sample['chains'][dst]:continue
                for pn,p in PRODUCTS.items():
                  a=sample['chains'][src]['rates'][pn];b=sample['chains'][dst]['rates'][pn]
                  if b>a:
                    edge={'source':src,'destination':dst,'product':pn,'source_rate':a,'destination_rate':b,'delta':b-a,'edge_bps_1e6':(b-a)*10_000_000_000//a,'source_route':routes.get(src,{}).get(pn),'destination_route':routes.get(dst,{}).get(pn)}
                    sample['edges'].append(edge)
            if sample['edges']:windows.append(sample)
            samples.append(sample)
            if i<39:time.sleep(3)

          capacities=[]
          for src in endpoints:
            for dst in endpoints:
              if src==dst:continue
              ep=endpoints[src]
              for pn,p in PRODUCTS.items():
                try:
                  out=words(call(ep,p['teller'],S['getAmountCanBeSent(uint32)']+uw(EIDS[dst])))
                  inn=words(call(endpoints[dst],p['teller'],S['getAmountCanBeReceived(uint32)']+uw(EIDS[src])))
                  capacities.append({'source':src,'destination':dst,'product':pn,'outbound_in_flight':out[0] if len(out)>0 else None,'can_send':out[1] if len(out)>1 else None,'inbound_in_flight':inn[0] if len(inn)>0 else None,'can_receive':inn[1] if len(inn)>1 else None})
                except Exception as e:capacities.append({'source':src,'destination':dst,'product':pn,'error':repr(e)})

          out={'generated_at_unix':int(time.time()),'routes':routes,'samples':samples,'positive_edge_samples':windows,'capacities':capacities,'errors':errors,'summary':{'sample_count':len(samples),'positive_edge_sample_count':len(windows),'positive_edge_count':sum(len(x['edges']) for x in windows),'error_count':len(errors)}}
          open('veda-rate-window-sampler.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'summary':out['summary'],'last_sample':samples[-1],'first_positive':windows[0] if windows else None,'routes':routes,'capacity_errors':[x for x in capacities if 'error' in x][:20]},indent=2,sort_keys=True))
          PY
      - name: Upload rate-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-rate-window-sampler
          path: veda-rate-window-sampler.json
          if-no-files-found: error
          retention-days: 1
