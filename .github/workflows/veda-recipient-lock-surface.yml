name: veda-recipient-lock-surface

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect live arbitrary-recipient deposit and lock surface
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          ATTACKER="0x1111111111111111111111111111111111111111"
          CHAINS={
            "ethereum":{"id":1,"rpcs":["https://ethereum-rpc.publicnode.com","https://eth.drpc.org","https://rpc.mevblocker.io"],"products":{
              "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353"},
              "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734"},
              "liquidUSD":{"vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387"}}},
            "optimism":{"id":10,"rpcs":["https://optimism-rpc.publicnode.com","https://mainnet.optimism.io","https://optimism.drpc.org"],"products":{
              "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353"},
              "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734"},
              "liquidUSD":{"vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387"}}},
            "scroll":{"id":534352,"rpcs":["https://scroll-rpc.publicnode.com","https://rpc.scroll.io","https://scroll.drpc.org"],"products":{
              "liquidBTC":{"vault":"0x5f46d540b6eD704C3c8789105F30E075AA900726","teller":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353"},
              "liquidETH":{"vault":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C","teller":"0x9AA79C84b79816ab920bBcE20f8f74557B514734"},
              "liquidUSD":{"vault":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C","teller":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387"}}},
            "ink":{"id":57073,"rpcs":["https://rpc-gel.inkonchain.com","https://rpc-qnd.inkonchain.com","https://ink.drpc.org"],"products":{
              "balancedUSDC":{"vault":"0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f","teller":"0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC"},
              "boostedUSDC":{"vault":"0xDbD87325D7b1189Dcc9255c4926076fF4a96A271","teller":"0xc46f2443b3521632E2E2a903D6da8f965B46f6a0"}}},
          }

          def rpc(ep,method,params,timeout=35):
              body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-recipient-lock-surface/1.0"})
              with urllib.request.urlopen(req,timeout=timeout) as r: out=json.loads(r.read().decode())
              if "error" in out: raise RuntimeError(out["error"])
              return out["result"]
          def choose(c):
              failures={}
              for ep in c["rpcs"]:
                  try:
                      if int(rpc(ep,"eth_chainId",[]),16)==c["id"]: return ep,failures
                  except Exception as e: failures[ep]=repr(e)
              raise RuntimeError(failures)
          def sig(s): return subprocess.check_output(["cast","sig",s],text=True).strip().lower()
          def strip0(x): return x[2:] if str(x).startswith("0x") else str(x)
          def aw(a): return strip0(a).lower().rjust(64,"0")
          def sw(s): return strip0(s).lower().ljust(64,"0")
          def addr(raw): return "0x"+strip0(raw)[-40:]
          def uint(raw): return int(raw,16)
          def has_push4(code,selector): return ("63"+strip0(selector).lower()) in strip0(code).lower()

          S={
            "authority":sig("authority()"),"hook":sig("hook()"),"shareLock":sig("shareLockPeriod()"),"paused":sig("isPaused()"),"depositCap":sig("depositCap()"),
            "deposit3":sig("deposit(address,uint256,uint256)"),
            "deposit4":sig("deposit(address,uint256,uint256,address)"),
            "deposit5":sig("deposit(address,uint256,uint256,address,address)"),
            "depositPermit7":sig("depositWithPermit(address,uint256,uint256,uint256,uint8,bytes32,bytes32)"),
            "depositPermit8":sig("depositWithPermit(address,uint256,uint256,uint256,uint8,bytes32,bytes32,address)"),
            "withdraw4":sig("withdraw(address,uint256,uint256,address)"),
            "beforeTransfer3":sig("beforeTransfer(address,address,address)"),
            "beforeTransfer1":sig("beforeTransfer(address)"),
            "beforeTransferData":sig("beforeTransferData(address)"),
            "permissionedTransfers":sig("permissionedTransfers()"),
          }
          PUBLIC=sig("isCapabilityPublic(address,bytes4)")
          CAN=sig("canCall(address,address,bytes4)")
          output={"generated_at_unix":int(time.time()),"selectors":S,"chains":{},"flags":[],"errors":[]}

          for cname,c in CHAINS.items():
              ep,failures=choose(c);block=rpc(ep,"eth_blockNumber",[])
              chain={"endpoint":ep,"rpc_failures":failures,"block":int(block,16),"products":{}}
              output["chains"][cname]=chain
              def call(to,data): return rpc(ep,"eth_call",[{"to":to,"data":data},block])
              for pname,p in c["products"].items():
                  row={"vault":p["vault"].lower(),"teller":p["teller"].lower()}
                  try:
                      code=rpc(ep,"eth_getCode",[p["teller"],block]);vcode=rpc(ep,"eth_getCode",[p["vault"],block])
                      auth=addr(call(p["teller"],S["authority"]));hook=addr(call(p["vault"],S["hook"]))
                      row.update({"teller_code_bytes":len(strip0(code))//2,"vault_code_bytes":len(strip0(vcode))//2,"authority":auth,"vault_hook":hook,"is_active_hook":hook.lower()==p["teller"].lower()})
                      for key in ("shareLock","paused","depositCap","permissionedTransfers"):
                          try: row[key]=uint(call(p["teller"],S[key]))
                          except Exception as e: row[key+"_error"]=repr(e)
                      gates={}
                      for key in ("deposit3","deposit4","deposit5","depositPermit7","depositPermit8","withdraw4","beforeTransfer3","beforeTransfer1"):
                          selector=S[key]
                          present=has_push4(code,selector)
                          try: public=bool(uint(call(auth,PUBLIC+aw(p["teller"])+sw(selector))))
                          except Exception as e: public=None;output["errors"].append({"chain":cname,"product":pname,"gate":key,"kind":"public","error":repr(e)})
                          try: attacker=bool(uint(call(auth,CAN+aw(ATTACKER)+aw(p["teller"])+sw(selector))))
                          except Exception as e: attacker=None;output["errors"].append({"chain":cname,"product":pname,"gate":key,"kind":"canCall","error":repr(e)})
                          gates[key]={"selector":selector,"runtime_push4":present,"public":public,"attacker_can_call":attacker}
                      row["gates"]=gates
                      try: row["attacker_beforeTransferData_raw"]=call(p["teller"],S["beforeTransferData"]+aw(ATTACKER))
                      except Exception as e: row["attacker_beforeTransferData_error"]=repr(e)
                      if row.get("is_active_hook") and row.get("shareLock",0)>0 and gates["deposit5"].get("attacker_can_call"):
                          output["flags"].append({"chain":cname,"product":pname,"type":"ARBITRARY_RECIPIENT_DEPOSIT_CAN_REFRESH_LOCK","share_lock_seconds":row["shareLock"],"row":row})
                  except Exception as e:
                      row["error"]=repr(e);output["errors"].append({"chain":cname,"product":pname,"error":repr(e)})
                  chain["products"][pname]=row

          with open("veda-recipient-lock-surface.json","w",encoding="utf-8") as f: json.dump(output,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps({"flags":output["flags"],"errors":output["errors"],"summary":{c:{p:{"active":r.get("is_active_hook"),"lock":r.get("shareLock"),"deposit5":r.get("gates",{}).get("deposit5")} for p,r in d["products"].items()} for c,d in output["chains"].items()}},indent=2,sort_keys=True))
          PY
      - name: Upload live surface proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-recipient-lock-surface
          path: veda-recipient-lock-surface.json
          if-no-files-found: error
          retention-days: 1
