name: veda-roleholder-fast

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct active role holders and critical capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.parse
          import urllib.request

          CHAINS = {
              "ethereum": {
                  "id": 1,
                  "rpcs": ["https://ethereum-rpc.publicnode.com", "https://eth.llamarpc.com"],
                  "products": {
                      "liquidBTC": {
