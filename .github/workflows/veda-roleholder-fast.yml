                          "queue": "0x0d2df071207e18ca8638b4f04e98c53155ec2ce0",
                          "solver": "0xe3f8fa039ff7a8fe42fa2c6e9dc8565ece6f7042",
                          "manager": "0xf9f7969c357ce6dfd7973098ea0d57173592bcca",
                      },
                      "liquidUSD": {
                          "authority": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                          "vault": "0x08c6f91e2b681faf5e17227f2a44c307b3c1364c",
                          "accountant": "0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7",
                          "teller": "0x4de413a26fc24c3fc27cc983be70aa9c5c299387",
                          "queue": "0x38fc1ba73b7ed289955a07d9f11a85b6e388064a",
                          "solver": "0x92b10e02825986bac2375bdacafa3e89e3f612aa",
                          "manager": "0x7b57ad1a0aa89583130acfad024241170d24c13c",
                      },
                  },
              },
              "scroll": {
                  "id": 534352,
                  "rpcs": ["https://scroll-rpc.publicnode.com", "https://rpc.scroll.io", "https://scroll.drpc.org"],
                  "products": {
                      "liquidBTC": {
                          "authority": "0x49f954c67ff235034b69b8a59fbe309a40256c8d",
                          "vault": "0x5f46d540b6ed704c3c8789105f30e075aa900726",
                          "accountant": "0xea23ac6d7d11f6b181d6b98174d334478adae6b0",
                          "teller": "0x8ea0b382d054dbebeb1d0ae47ee4ac433c730353",
                          "queue": "0x77a2fd42f8769d8063f2e75061fc200014e41edf",
                          "solver": "0x7102c6889b0bb93acf4a895f3ebeb17080d91d29",
                          "manager": "0xafa8c08bedb2ec1bbeb64a7ffa44c604e7cca68d",
                      },
                      "liquidETH": {
                          "authority": "0x485bde66bb668a51f2372e34e45b1c6226798122",
                          "vault": "0xf0bb20865277abd641a307ece5ee04e79073416c",
                          "accountant": "0x0d05d94a5f1e76c18fbeb7a13d17c8a314088198",
                          "teller": "0x9aa79c84b79816ab920bbce20f8f74557b514734",
                          "queue": "0x0d2df071207e18ca8638b4f04e98c53155ec2ce0",
                          "solver": "0xe3f8fa039ff7a8fe42fa2c6e9dc8565ece6f7042",
                          "manager": "0x227975088c28dbbb4b421c6d96781a53578f19a8",
                      },
                      "liquidUSD": {
                          "authority": "0xaba6ba1e95e0926a6a6b917fe4e2f19ceae4ff2e",
                          "vault": "0x08c6f91e2b681faf5e17227f2a44c307b3c1364c",
                          "accountant": "0xc315d6e14ddcdc7407784e2caf815d131bc1d3e7",
                          "teller": "0x4de413a26fc24c3fc27cc983be70aa9c5c299387",
                          "queue": "0x38fc1ba73b7ed289955a07d9f11a85b6e388064a",
                          "solver": "0x6632d22a2062415bb37c8d7b6a5ec86c35bb2610",
                          "manager": "0x7b57ad1a0aa89583130acfad024241170d24c13c",
                      },
                  },
              },
              "ink": {
                  "id": 57073,
                  "rpcs": ["https://rpc-gel.inkonchain.com", "https://rpc-qnd.inkonchain.com", "https://ink.drpc.org"],
                  "products": {
                      "balanced": {
                          "authority": "0x3e8b0ee1d05267fe9f8d2b1f8cb48f2e23d69c6b",
                          "vault": "0xcaae49fb7f74ccfbe8a05e6104b01c097a78789f",
                          "accountant": "0x0c4df79d9e35e5c4876bc1ae4663e834312ddc67",
                          "teller": "0xc151e263d5c890fd0bceb33a6525f1a76a8329fc",
                          "queue": "0x4c433ed6d57316170565d7fedc11a841832cdc3d",
                          "solver": "0xffdffb178cb469002b77b47f7e4a6bcad041a9b6",
                          "manager": "0xa0e501f98a1b5d3d8e6ffd161c76f92570e42931",
                      },
                      "boosted": {
                          "authority": "0x1f53135155d6ff516bccfdd9424fcdb8ad1efb77",
                          "vault": "0xdbd87325d7b1189dcc9255c4926076ff4a96a271",
                          "accountant": "0x9c2477d4ea17d3ccc45e6b1087c94d14926f54c9",
                          "teller": "0xc46f2443b3521632e2e2a903d6da8f965b46f6a0",
                          "queue": "0x406e63323ef5d39d41c6fd895ef9665af926184c",
                          "solver": "0xdf4123c18dc985ed94061f2c08ce17b7b17f21ff",
                          "manager": "0xed23b12e7700beb638562a22ed65f74291901c25",
                      },
                  },
              },
          }

          USER_ROLE_TOPIC = "0x4c9bdd0c8e073eb5eda2250b18d8e5121ff27b62064fbeeeed4869bb99bc5bf2"
          ZERO = "0x0000000000000000000000000000000000000000"
          TEST = "0x1111111111111111111111111111111111111111"

          def sig(signature):
              return subprocess.check_output(["cast", "sig", signature], text=True).strip().lower()

          S = {
              "getUserRoles": sig("getUserRoles(address)"),
              "canCall": sig("canCall(address,address,bytes4)"),
              "owner": sig("owner()"),
              "authority": sig("authority()"),
              "vault": sig("vault()"),
              "accountant": sig("accountant()"),
              "queue": sig("queue()"),
              "getOwners": sig("getOwners()"),
              "getThreshold": sig("getThreshold()"),
              "getModulesPaginated": sig("getModulesPaginated(address,uint256)"),
          }

          CRITICAL_BY_COMPONENT = {
              "vault": [
                  "manage(address,bytes,uint256)",
                  "manage(address[],bytes[],uint256[])",
                  "enter(address,address,uint256,address,uint256)",
                  "exit(address,address,uint256,address,uint256)",
                  "setAuthority(address)",
                  "transferOwnership(address)",
                  "setBeforeTransferHook(address)",
              ],
              "accountant": [
                  "updateExchangeRate(uint96)",
                  "updateExchangeRate()",
                  "vestYield(uint256,uint256)",
                  "postLoss(uint256)",
                  "setRateProviderData(address,bool,address)",
                  "claimFees(address)",
                  "setAuthority(address)",
                  "transferOwnership(address)",
              ],
              "teller": [
                  "bulkDeposit(address,uint256,uint256,address)",
                  "bulkWithdraw(address,uint256,uint256,address)",
                  "refundDeposit(uint256,address,address,uint256,uint256,uint256,uint256)",
                  "refundDeposit(uint256,address,address,uint256,uint256,uint256,uint256,address)",
                  "updateAssetData(address,bool,bool,uint16)",
                  "setDepositBufferHelper(address,address)",
                  "setWithdrawBufferHelper(address,address)",
                  "allowBufferHelper(address,address)",
                  "setAuthority(address)",
                  "transferOwnership(address)",
              ],
              "queue": [
                  "solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)",
                  "cancelUserWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[])",
                  "rescueTokens(address,uint256,address,(uint96,address,address,uint128,uint128,uint40,uint24,uint24)[])",
                  "updateWithdrawAsset(address,uint24,uint24,uint16,uint16,uint96)",
                  "stopWithdrawsInAsset(address)",
                  "setAuthority(address)",
                  "transferOwnership(address)",
              ],
              "solver": [
                  "boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address)",
                  "boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address)",
                  "boringSolve(address,address,address,uint256,uint256,bytes)",
                  "rescueTokens(address,uint256)",
                  "setAuthority(address)",
                  "transferOwnership(address)",
              ],
              "manager": [
                  "setManageRoot(address,bytes32)",
                  "manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])",
                  "setAuthority(address)",
                  "transferOwnership(address)",
              ],
              "authority": [
                  "setPublicCapability(address,bytes4,bool)",
                  "setRoleCapability(uint8,address,bytes4,bool)",
                  "setUserRole(address,uint8,bool)",
                  "setAuthority(address)",
                  "transferOwnership(address)",
              ],
          }
          CRITICAL = {
              component: {sig(signature): signature for signature in signatures}
              for component, signatures in CRITICAL_BY_COMPONENT.items()
          }
          ARBITRARY_SIGNATURES = {
              sig(signature): signature
              for signature in [
                  "execute(address,uint256,bytes)",
                  "execute(address,uint256,bytes,bytes32,bytes32)",
                  "executeBatch(address[],uint256[],bytes[],bytes32,bytes32)",
                  "execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes)",
                  "multicall(bytes[])",
                  "bundle(address[],bytes[],uint256[])",
                  "manage(address,bytes,uint256)",
                  "call(address,bytes,uint256)",
                  "functionCall(address,bytes)",
              ]
          }

          def request(endpoint, method, params, timeout=25):
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={"content-type": "application/json", "user-agent": "veda-roleholder-fast/1.0"},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          def http_json(url, timeout=35):
              req = urllib.request.Request(url, headers={"accept": "application/json", "user-agent": "veda-roleholder-fast/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode())

          def choose_rpc(config):
              failures = {}
              for endpoint in config["rpcs"]:
                  try:
                      if int(request(endpoint, "eth_chainId", []), 16) == config["id"]:
                          return endpoint, failures
                  except Exception as exc:
                      failures[endpoint] = repr(exc)
              raise RuntimeError(failures)

          def strip0(value):
              return value[2:] if str(value).startswith("0x") else str(value)

          def address_word(address):
              return strip0(address).lower().rjust(64, "0")

          def bytes4_word(selector):
              return strip0(selector).lower().ljust(64, "0")

          def decode_address(raw):
              return None if not raw or raw == "0x" else "0x" + strip0(raw)[-40:]

          def decode_uint(raw):
              return None if not raw or raw == "0x" else int(raw, 16)

          def decode_bool(raw):
              value = decode_uint(raw)
              return None if value is None else bool(value)

          def push4(code):
              value = strip0(code)
              result = set()
              index = 0
              while index + 10 <= len(value):
                  if value[index:index + 2].lower() == "63":
                      result.add("0x" + value[index + 2:index + 10].lower())
                      index += 10
                  else:
                      index += 2
              return sorted(result)

          def routescan_user_logs(chain_id, authority):
              params = urllib.parse.urlencode({
                  "module": "logs",
                  "action": "getLogs",
                  "address": authority,
                  "fromBlock": 0,
                  "toBlock": "latest",
                  "topic0": USER_ROLE_TOPIC,
                  "page": 1,
                  "offset": 1000,
              })
              url = f"https://api.routescan.io/v2/network/mainnet/evm/{chain_id}/etherscan/api?{params}"
              data = http_json(url)
              result = data.get("result")
              if isinstance(result, str):
                  if data.get("status") == "0" or "No records" in result:
                      return [], {"response": data}
                  raise RuntimeError(data)
              return result or [], {"response_status": data.get("status"), "message": data.get("message")}

          def topic_address(topic):
              return "0x" + strip0(topic)[-40:]

          def call(endpoint, target, data):
              return request(endpoint, "eth_call", [{"to": target, "data": data}, "latest"])

          def probe_user(endpoint, user):
              code = request(endpoint, "eth_getCode", [user, "latest"])
              selectors = push4(code)
              item = {
                  "address": user.lower(),
                  "code_bytes": len(strip0(code)) // 2,
                  "push4": selectors,
                  "arbitrary_call_surface": {
                      signature: selector in selectors for selector, signature in ARBITRARY_SIGNATURES.items()
                  },
                  "owner": None,
                  "authority": None,
                  "vault": None,
                  "accountant": None,
                  "queue": None,
              }
              if item["code_bytes"]:
                  for name in ("owner", "authority", "vault", "accountant", "queue"):
                      try:
                          item[name] = decode_address(call(endpoint, user, S[name]))
                      except Exception:
                          pass
                  try:
                      item["safe_owners_raw"] = call(endpoint, user, S["getOwners"])
                  except Exception:
                      pass
                  try:
                      item["safe_threshold"] = decode_uint(call(endpoint, user, S["getThreshold"]))
                  except Exception:
                      pass
              return item

          output = {
              "generated_at_unix": int(time.time()),
              "event_topic": USER_ROLE_TOPIC,
              "critical_selectors": CRITICAL,
              "chains": {},
              "unknown_privileged_contracts": [],
              "arbitrary_privileged_contracts": [],
          }

          for chain_name, config in CHAINS.items():
              endpoint, rpc_failures = choose_rpc(config)
              chain = {
                  "endpoint": endpoint,
                  "rpc_failures": rpc_failures,
                  "block": int(request(endpoint, "eth_blockNumber", []), 16),
                  "products": {},
              }
              for product_name, product in config["products"].items():
                  authority = product["authority"]
                  try:
                      raw_logs, log_meta = routescan_user_logs(config["id"], authority)
                      log_error = None
                  except Exception as exc:
                      raw_logs, log_meta, log_error = [], {}, repr(exc)

                  users = set()
                  decoded_events = []
                  for log in raw_logs:
                      topics = [str(value).lower() for value in (log.get("topics") or [])]
                      if len(topics) < 3 or topics[0] != USER_ROLE_TOPIC:
                          continue
                      user = topic_address(topics[1]).lower()
                      role = int(strip0(topics[2]) or "0", 16)
                      data = strip0(log.get("data", "0x"))
                      enabled = bool(int(data or "0", 16))
                      users.add(user)
                      decoded_events.append({
                          "user": user,
                          "role": role,
                          "enabled": enabled,
                          "block": int(log.get("blockNumber", "0x0"), 16) if str(log.get("blockNumber", "0x0")).startswith("0x") else int(log.get("blockNumber", 0) or 0),
                          "tx": log.get("transactionHash"),
                      })

                  known_addresses = {value.lower() for value in product.values()}
                  try:
                      authority_owner = decode_address(call(endpoint, authority, S["owner"]))
                  except Exception:
                      authority_owner = None
                  if authority_owner:
                      users.add(authority_owner.lower())
                      known_addresses.add(authority_owner.lower())

                  holders = {}
                  for user in sorted(users):
                      try:
                          roles = decode_uint(call(endpoint, authority, S["getUserRoles"] + address_word(user))) or 0
                      except Exception as exc:
                          holders[user] = {"roles_error": repr(exc)}
                          continue
                      if roles == 0 and user != (authority_owner or "").lower():
                          continue
                      user_item = probe_user(endpoint, user)
                      user_item["roles"] = roles
                      user_item["is_known_component"] = user in known_addresses
                      user_item["critical_capabilities"] = []
                      for component, target in product.items():
                          if component not in CRITICAL:
                              continue
                          for selector, signature in CRITICAL[component].items():
                              try:
                                  allowed = decode_bool(call(
                                      endpoint,
                                      authority,
                                      S["canCall"] + address_word(user) + address_word(target) + bytes4_word(selector),
                                  ))
                              except Exception:
                                  allowed = None
                              if allowed:
                                  user_item["critical_capabilities"].append({
                                      "component": component,
                                      "target": target.lower(),
                                      "selector": selector,
                                      "signature": signature,
                                  })
                      holders[user] = user_item

                      if user_item["code_bytes"] > 0 and user_item["critical_capabilities"] and not user_item["is_known_component"]:
                          output["unknown_privileged_contracts"].append({
                              "chain": chain_name,
                              "product": product_name,
                              "user": user,
                              "holder": user_item,
                          })
                      if user_item["critical_capabilities"] and any(user_item["arbitrary_call_surface"].values()):
                          output["arbitrary_privileged_contracts"].append({
                              "chain": chain_name,
                              "product": product_name,
                              "user": user,
                              "holder": user_item,
                          })

                  chain["products"][product_name] = {
                      "addresses": {key: value.lower() for key, value in product.items()},
                      "authority_owner": authority_owner,
                      "log_meta": log_meta,
                      "log_error": log_error,
                      "event_count": len(decoded_events),
                      "events": decoded_events,
                      "holders": holders,
                  }
              output["chains"][chain_name] = chain

          with open("veda-roleholder-fast.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")

          print(json.dumps({
              "blocks": {name: chain["block"] for name, chain in output["chains"].items()},
              "products": {
                  chain_name: {
                      product_name: {
                          "event_count": product["event_count"],
                          "active_holders": len(product["holders"]),
                          "holders": {
                              address: {
                                  "roles": holder.get("roles"),
                                  "code_bytes": holder.get("code_bytes"),
                                  "known": holder.get("is_known_component"),
                                  "critical_capabilities": len(holder.get("critical_capabilities", [])),
                                  "arbitrary_call_surface": holder.get("arbitrary_call_surface"),
                              }
                              for address, holder in product["holders"].items()
                          },
                      }
                      for product_name, product in chain["products"].items()
                  }
                  for chain_name, chain in output["chains"].items()
              },
              "unknown_privileged_contracts": output["unknown_privileged_contracts"],
              "arbitrary_privileged_contracts": output["arbitrary_privileged_contracts"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload active role-holder graph
        uses: actions/upload-artifact@v4
        with:
          name: veda-roleholder-fast
          path: veda-roleholder-fast.json
          if-no-files-found: error
          retention-days: 1
