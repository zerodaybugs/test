name: veda-scope-buffer-crossbind

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query live Ink helper and teller binding state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          RPCS = [
              "https://rpc-gel.inkonchain.com",
              "https://rpc-qnd.inkonchain.com",
              "https://ink.drpc.org",
          ]
          USDC = "0x2D270e6886d130D724215A266106e6832161EAEd"
          USDT0 = "0x0200C29006150606B650577BBE7B6248F58470c1"
          HELPERS = {
              "scope_shared": "0xC2867bd44E58B43e74859cbd1c320477b3ca9f33",
              "registry_balanced": "0xc11c44c8b44355c41d7E7f88f07e9EA5b9625Eb4",
              "registry_boosted": "0x1bAb9A7d8b56C2c67889466cc6dca6F5821f6dc7",
          }
          VAULTS = {
              "balanced": {
                  "vault": "0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f",
                  "teller": "0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC",
                  "authority": "0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B",
              },
              "boosted": {
                  "vault": "0xDbD87325D7b1189Dcc9255c4926076fF4a96A271",
                  "teller": "0xc46f2443b3521632E2E2a903D6da8f965B46f6a0",
                  "authority": "0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77",
              },
          }
          SEL = {
              "aaveV3Pool": "0x86a06ff0",
              "vault": "0xfbfa77cf",
              "currentBufferHelpers": "0xc8285411",
              "allowedBufferHelpers": "0xa905ffb5",
              "canCall": "0xb7009613",
              "isCapabilityPublic": "0x2f47571f",
              "manageSingle": "0xf6e715d0",
              "manageBatch": "0x224d8703",
              "owner": "0x8da5cb5b",
              "authority": "0xbf7e214f",
              "hook": "0x7f5a7c7b",
              "assetData": "0x41fee44a",
              "balanceOf": "0x70a08231",
              "getDepositManageCall": "0x11d3ed0e",
              "getWithdrawManageCall": "0xf41dd552",
          }

          def request(endpoint, method, params, timeout=20):
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={"content-type": "application/json", "user-agent": "veda-buffer-crossbind/1.0"},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          def choose_rpc():
              errors = {}
              for endpoint in RPCS:
                  try:
                      if int(request(endpoint, "eth_chainId", []), 16) == 57073:
                          return endpoint, errors
                  except Exception as exc:
                      errors[endpoint] = repr(exc)
              raise RuntimeError(errors)

          def word_address(address):
              return address.lower().removeprefix("0x").rjust(64, "0")

          def word_bytes4(selector):
              return selector.removeprefix("0x").ljust(64, "0")

          def call(endpoint, target, data):
              return request(endpoint, "eth_call", [{"to": target, "data": data}, "latest"])

          def decode_words(raw):
              if not raw or raw == "0x":
                  return []
              value = raw.removeprefix("0x")
              return [value[index:index + 64] for index in range(0, len(value), 64)]

          def decode_address_word(word):
              return "0x" + word[-40:]

          def decode_address(raw):
              words = decode_words(raw)
              return None if not words else decode_address_word(words[0])

          def decode_bool(raw):
              words = decode_words(raw)
              return None if not words else bool(int(words[0], 16))

          def decode_uint(raw):
              words = decode_words(raw)
              return None if not words else int(words[0], 16)

          endpoint, rpc_errors = choose_rpc()
          block = int(request(endpoint, "eth_blockNumber", []), 16)
          output = {
              "generated_at_unix": int(time.time()),
              "endpoint": endpoint,
              "rpc_errors": rpc_errors,
              "block": block,
              "selectors": SEL,
              "helpers": {},
              "vaults": {},
              "flags": [],
          }

          for helper_name, helper in HELPERS.items():
              code = request(endpoint, "eth_getCode", [helper, "latest"])
              item = {"address": helper.lower(), "code_bytes": len(code.removeprefix("0x")) // 2}
              for field in ("vault", "aaveV3Pool", "owner", "authority"):
                  try:
                      raw = call(endpoint, helper, SEL[field])
                      item[field] = {"raw": raw, "value": decode_address(raw)}
                  except Exception as exc:
                      item[field] = {"error": repr(exc)}
              for asset_name, asset in {"USDC": USDC, "USDT0": USDT0}.items():
                  try:
                      amount = (1_000_000).to_bytes(32, "big").hex()
                      item[f"deposit_plan_{asset_name}"] = call(
                          endpoint, helper, SEL["getDepositManageCall"] + word_address(asset) + amount
                      )
                  except Exception as exc:
                      item[f"deposit_plan_{asset_name}"] = {"error": repr(exc)}
                  try:
                      amount = (1_000_000).to_bytes(32, "big").hex()
                      item[f"withdraw_plan_{asset_name}"] = call(
                          endpoint, helper, SEL["getWithdrawManageCall"] + word_address(asset) + amount
                      )
                  except Exception as exc:
                      item[f"withdraw_plan_{asset_name}"] = {"error": repr(exc)}
              output["helpers"][helper_name] = item

          for vault_name, config in VAULTS.items():
              vault = config["vault"]
              teller = config["teller"]
              authority = config["authority"]
              item = {
                  "addresses": {key: value.lower() for key, value in config.items()},
                  "teller": {},
                  "vault": {},
                  "authority": {},
                  "helper_matrix": {},
              }
              for field, target in (("teller_owner", teller), ("teller_authority", teller), ("teller_vault", teller),
                                    ("vault_owner", vault), ("vault_authority", vault), ("vault_hook", vault)):
                  selector = SEL[field.split("_", 1)[1]]
                  try:
                      raw = call(endpoint, target, selector)
                      item["teller" if field.startswith("teller") else "vault"][field] = {
                          "raw": raw, "value": decode_address(raw)
                      }
                  except Exception as exc:
                      item["teller" if field.startswith("teller") else "vault"][field] = {"error": repr(exc)}

              for asset_name, asset in {"USDC": USDC, "USDT0": USDT0}.items():
                  try:
                      raw = call(endpoint, teller, SEL["currentBufferHelpers"] + word_address(asset))
                      words = decode_words(raw)
                      item["teller"][f"current_{asset_name}"] = {
                          "raw": raw,
                          "deposit": decode_address_word(words[0]) if len(words) > 0 else None,
                          "withdraw": decode_address_word(words[1]) if len(words) > 1 else None,
                      }
                  except Exception as exc:
                      item["teller"][f"current_{asset_name}"] = {"error": repr(exc)}
                  try:
                      raw = call(endpoint, teller, SEL["assetData"] + word_address(asset))
                      item["teller"][f"assetData_{asset_name}"] = {"raw": raw, "words": decode_words(raw)}
                  except Exception as exc:
                      item["teller"][f"assetData_{asset_name}"] = {"error": repr(exc)}

              for helper_name, helper in HELPERS.items():
                  helper_entry = {"address": helper.lower(), "allowed": {}}
                  for asset_name, asset in {"USDC": USDC, "USDT0": USDT0}.items():
                      try:
                          raw = call(
                              endpoint,
                              teller,
                              SEL["allowedBufferHelpers"] + word_address(asset) + word_address(helper),
                          )
                          helper_entry["allowed"][asset_name] = {"raw": raw, "value": decode_bool(raw)}
                      except Exception as exc:
                          helper_entry["allowed"][asset_name] = {"error": repr(exc)}
                  helper_bound_vault = output["helpers"][helper_name].get("vault", {}).get("value")
                  helper_entry["bound_vault"] = helper_bound_vault
                  helper_entry["bound_to_this_vault"] = (
                      helper_bound_vault is not None and helper_bound_vault.lower() == vault.lower()
                  )
                  item["helper_matrix"][helper_name] = helper_entry

              for manage_name in ("manageSingle", "manageBatch"):
                  selector = SEL[manage_name]
                  try:
                      raw = call(
                          endpoint,
                          authority,
                          SEL["canCall"] + word_address(teller) + word_address(vault) + word_bytes4(selector),
                      )
                      item["authority"][f"teller_can_{manage_name}"] = {"raw": raw, "value": decode_bool(raw)}
                  except Exception as exc:
                      item["authority"][f"teller_can_{manage_name}"] = {"error": repr(exc)}
                  try:
                      raw = call(
                          endpoint,
                          authority,
                          SEL["isCapabilityPublic"] + word_address(vault) + word_bytes4(selector),
                      )
                      item["authority"][f"public_{manage_name}"] = {"raw": raw, "value": decode_bool(raw)}
                  except Exception as exc:
                      item["authority"][f"public_{manage_name}"] = {"error": repr(exc)}

              for asset_name, asset in {"USDC": USDC, "USDT0": USDT0}.items():
                  try:
                      raw = call(endpoint, asset, SEL["balanceOf"] + word_address(vault))
                      item["vault"][f"balance_{asset_name}"] = {"raw": raw, "value": decode_uint(raw)}
                  except Exception as exc:
                      item["vault"][f"balance_{asset_name}"] = {"error": repr(exc)}

              output["vaults"][vault_name] = item

          zero = "0x" + "00" * 20
          for vault_name, item in output["vaults"].items():
              vault = item["addresses"]["vault"]
              for asset_name in ("USDC", "USDT0"):
                  current = item["teller"].get(f"current_{asset_name}", {})
                  for side in ("deposit", "withdraw"):
                      active = current.get(side)
                      if not active or active.lower() == zero:
                          continue
                      match = next(
                          (name for name, helper in HELPERS.items() if helper.lower() == active.lower()),
                          None,
                      )
                      bound = output["helpers"].get(match, {}).get("vault", {}).get("value") if match else None
                      if bound and bound.lower() != vault.lower():
                          output["flags"].append({
                              "type": "ACTIVE_CROSS_VAULT_HELPER",
                              "vault": vault_name,
                              "asset": asset_name,
                              "side": side,
                              "helper": active,
                              "bound_vault": bound,
                          })
              for helper_name, helper in item["helper_matrix"].items():
                  if helper.get("bound_vault") and not helper.get("bound_to_this_vault"):
                      if any(
                          value.get("value") is True
                          for value in helper.get("allowed", {}).values()
                          if isinstance(value, dict)
                      ):
                          output["flags"].append({
                              "type": "ALLOWLISTED_CROSS_VAULT_HELPER",
                              "vault": vault_name,
                              "helper_name": helper_name,
                              "helper": helper["address"],
                              "bound_vault": helper["bound_vault"],
                              "allowed": helper["allowed"],
                          })

          with open("veda-scope-buffer-crossbind.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")

          print(json.dumps({
              "block": output["block"],
              "helpers": {
                  name: {
                      "address": helper["address"],
                      "code_bytes": helper["code_bytes"],
                      "vault": helper.get("vault", {}).get("value"),
                      "pool": helper.get("aaveV3Pool", {}).get("value"),
                  }
                  for name, helper in output["helpers"].items()
              },
              "vaults": {
                  name: {
                      "current_USDC": item["teller"].get("current_USDC"),
                      "current_USDT0": item["teller"].get("current_USDT0"),
                      "helper_matrix": item["helper_matrix"],
                      "authority": item["authority"],
                  }
                  for name, item in output["vaults"].items()
              },
              "flags": output["flags"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload cross-binding state
        uses: actions/upload-artifact@v4
        with:
          name: veda-scope-buffer-crossbind
          path: veda-scope-buffer-crossbind.json
          if-no-files-found: error
          retention-days: 1
