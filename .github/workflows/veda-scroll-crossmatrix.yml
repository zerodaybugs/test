name: veda-scroll-crossmatrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Query Scroll solver-teller cross matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          ENDPOINTS=["https://rpc.scroll.io","https://scroll-rpc.publicnode.com","https://scroll.drpc.org"]
          SOLVERS={
            "liquidBTC":"0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29",
            "liquidETH":"0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042",
            "liquidUSD":"0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610",
          }
          QUEUES={
            "liquidBTC":"0x77A2fd42F8769d8063F2E75061FC200014E41Edf",
            "liquidETH":"0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0",
            "liquidUSD":"0x38FC1BA73b7ED289955a07d9F11A85b6E388064A",
          }
          TELLERS={
            "liquidBTC_active":"0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353",
            "liquidETH_active":"0x9AA79C84b79816ab920bBcE20f8f74557B514734",
            "liquidUSD_active":"0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387",
            "liquidBTC_legacy":"0x9E88C603307fdC33aA5F26E38b6f6aeF3eE92d48",
            "liquidETH_legacy":"0x5c135e8eC99557b412b9B4492510dCfBD36066F5",
            "liquidUSD_legacy":"0x221Ea02d409074546265CCD1123050F4D498ef64",
            "eBTC_active":"0x6ee3aaccf9f2321e49063c4f8da775ddbd407268",
            "eBTC_legacy":"0xe19a43B1b8af6CeE71749Af2332627338B3242D1",
          }
          VAULTS={
            "liquidBTC":"0x5f46d540b6eD704C3c8789105F30E075AA900726",
            "liquidETH":"0xf0bb20865277aBd641a307eCe5Ee04E79073416C",
            "liquidUSD":"0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C",
            "eBTC":"0x657e8C867D8B37dCC18fA4Caead9C45EB088C642",
          }
          ATTACKER="0x1111111111111111111111111111111111111111"

          def request(ep,method,params,timeout=35):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
            req=urllib.request.Request(ep,data=body,method="POST",headers={"content-type":"application/json","user-agent":"veda-scroll-crossmatrix/1.0"})
            with urllib.request.urlopen(req,timeout=timeout) as r:o=json.loads(r.read().decode())
            if "error" in o: raise RuntimeError(o["error"])
            return o["result"]
          failures={}; ep=None
          for candidate in ENDPOINTS:
            try:
              if int(request(candidate,"eth_chainId",[]),16)==534352: ep=candidate; break
            except Exception as e: failures[candidate]=repr(e)
          if ep is None: raise RuntimeError(failures)

          def sig(s): return subprocess.check_output(["cast","sig",s],text=True).strip()
          def strip0(x): return x[2:] if x.startswith("0x") else x
          def aw(a): return strip0(a).lower().rjust(64,"0")
          def sw(s): return strip0(s).lower().ljust(64,"0")
          def call(to,data,block):
            try:return {"result":request(ep,"eth_call",[{"to":to,"data":data},block])}
            except Exception as e:return {"error":repr(e)}
          def addr(x): return "0x"+strip0(x)[-40:] if isinstance(x,str) and len(strip0(x))>=40 else None
          def uint(x): return int(x,16) if isinstance(x,str) else None
          def boolean(x): return bool(int(x,16)) if isinstance(x,str) else None
          def dynamic_bytes32(x):
            if not isinstance(x,str):return []
            h=strip0(x)
            if len(h)<128:return []
            off=int(h[:64],16)*2; n=int(h[off:off+64],16); start=off+64
            return ["0x"+h[start+i*64:start+(i+1)*64] for i in range(n)]

          S={
            "authority":sig("authority()"),"vault":sig("vault()"),"accountant":sig("accountant()"),
            "decimals":sig("decimals()"),"getRequestIds":sig("getRequestIds()"),
            "bulkDeposit":sig("bulkDeposit(address,uint256,uint256,address)"),
            "bulkWithdraw":sig("bulkWithdraw(address,uint256,uint256,address)"),
            "enter":sig("enter(address,address,uint256,address,uint256)"),
            "exit":sig("exit(address,address,uint256,address,uint256)"),
            "selfSolve":sig("boringRedeemSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address)"),
            "selfMintSolve":sig("boringRedeemMintSelfSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24),address,address,address)"),
          }
          CAN="0xb7009613"; PUBLIC="0x2f47571f"
          block=request(ep,"eth_blockNumber",[])
          out={"queried_at_unix":int(time.time()),"endpoint":ep,"block":int(block,16),"solvers":{},"tellers":{},"queues":{},"matrix":{}}

          def authority(target):
            r=call(target,S["authority"],block); return addr(r.get("result")) if "result" in r else None
          def can(auth,user,target,selector):
            r=call(auth,CAN+aw(user)+aw(target)+sw(selector),block); return boolean(r.get("result")) if "result" in r else r
          def public(auth,target,selector):
            r=call(auth,PUBLIC+aw(target)+sw(selector),block); return boolean(r.get("result")) if "result" in r else r

          for name,teller in TELLERS.items():
            code=request(ep,"eth_getCode",[teller,block]); auth=authority(teller)
            vr=call(teller,S["vault"],block); ar=call(teller,S["accountant"],block)
            vault=addr(vr.get("result")) if "result" in vr else None
            accountant=addr(ar.get("result")) if "result" in ar else None
            decimals=None
            if vault:
              dr=call(vault,S["decimals"],block); decimals=uint(dr.get("result")) if "result" in dr else None
            out["tellers"][name]={"address":teller.lower(),"code_bytes":max(0,(len(code)-2)//2),"authority":auth,"vault":vault,"accountant":accountant,"vault_decimals":decimals}

          for name,solver in SOLVERS.items():
            code=request(ep,"eth_getCode",[solver,block]); auth=authority(solver)
            out["solvers"][name]={
              "address":solver.lower(),"code_bytes":max(0,(len(code)-2)//2),"authority":auth,
              "self_solve_public":public(auth,solver,S["selfSolve"]),
              "self_mint_solve_public":public(auth,solver,S["selfMintSolve"]),
              "attacker_self_solve":can(auth,ATTACKER,solver,S["selfSolve"]),
              "attacker_self_mint_solve":can(auth,ATTACKER,solver,S["selfMintSolve"]),
            }
            out["matrix"][name]={}
            for tname,teller in TELLERS.items():
              tauth=authority(teller)
              out["matrix"][name][tname]={
                "bulk_deposit":can(tauth,solver,teller,S["bulkDeposit"]),
                "bulk_withdraw":can(tauth,solver,teller,S["bulkWithdraw"]),
              }

          for name,queue in QUEUES.items():
            code=request(ep,"eth_getCode",[queue,block]); auth=authority(queue)
            ids=call(queue,S["getRequestIds"],block)
            out["queues"][name]={"address":queue.lower(),"code_bytes":max(0,(len(code)-2)//2),"authority":auth,"request_ids":dynamic_bytes32(ids.get("result")) if "result" in ids else ids}

          # Also verify teller mint/burn roles against their own vaults.
          for tname,t in out["tellers"].items():
            if not t["vault"]:continue
            vauth=authority(t["vault"])
            t["can_enter_own_vault"]=can(vauth,TELLERS[tname],t["vault"],S["enter"])
            t["can_exit_own_vault"]=can(vauth,TELLERS[tname],t["vault"],S["exit"])

          with open("veda-scroll-crossmatrix.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload cross matrix
        uses: actions/upload-artifact@v4
        with:
          name: veda-scroll-crossmatrix
          path: veda-scroll-crossmatrix.json
          if-no-files-found: error
          retention-days: 1
