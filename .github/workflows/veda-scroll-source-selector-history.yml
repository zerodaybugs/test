name: veda-scroll-source-selector-history

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve historical source selectors and permissions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request

          RPCS=['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']
          BLOCK=33_422_847
          ATTACKER='0x00000000000000000000000000000000000A11cE'
          TELLER='0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387'
          AUTH='0xaBA6bA1E95E0926a6A6b917FE4E2f19ceaE4FF2e'

          signatures=[
              'deposit(address,uint256,uint256)',
              'deposit(address,uint256,uint256,address)',
              'deposit(address,uint256,uint256,address,address)',
              'depositAndBridge(address,uint256,uint256,address,bytes,address,uint256)',
              'depositAndBridge(address,uint256,uint256,address,bytes,address,uint256,address)',
              'bridge(uint96,address,bytes,address,uint256)',
              'depositWithPermit(address,uint256,uint256,uint256,uint8,bytes32,bytes32)',
              'depositWithPermit(address,uint256,uint256,uint256,uint8,bytes32,bytes32,address)',
          ]
          selectors={s:subprocess.check_output(['cast','sig',s],text=True).strip() for s in signatures}
          can_sel=subprocess.check_output(['cast','sig','canCall(address,address,bytes4)'],text=True).strip()
          pub_sel=subprocess.check_output(['cast','sig','isCapabilityPublic(address,bytes4)'],text=True).strip()
          auth_sel=subprocess.check_output(['cast','sig','authority()'],text=True).strip()

          def rpc(url,method,params):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(url,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-selector-history/1'})
              with urllib.request.urlopen(req,timeout=35) as r:o=json.loads(r.read().decode())
              if 'error' in o:raise RuntimeError(o['error'])
              return o['result']
          failures={};url=None
          for candidate in RPCS:
              try:
                  if int(rpc(candidate,'eth_chainId',[]),16)!=534352:raise RuntimeError('wrong chain')
                  if rpc(candidate,'eth_getBlockByNumber',[hex(BLOCK),False]) is None:raise RuntimeError('missing block')
                  rpc(candidate,'eth_getCode',[TELLER,hex(BLOCK)])
                  url=candidate;break
              except Exception as e:failures[candidate]=repr(e)
          if not url:raise RuntimeError(failures)

          def h(x):return x[2:] if x.startswith('0x') else x
          def aw(a):return h(a).lower().rjust(64,'0')
          def bw(b):return h(b).lower().ljust(64,'0')
          def call(to,data):return rpc(url,'eth_call',[{'to':to,'data':data},hex(BLOCK)])

          code=h(rpc(url,'eth_getCode',[TELLER,hex(BLOCK)])).lower()
          actual_auth='0x'+h(call(TELLER,auth_sel))[-40:]
          rows=[]
          for name,selector in selectors.items():
              can=bool(int(call(AUTH,can_sel+aw(ATTACKER)+aw(TELLER)+bw(selector)),16))
              public=bool(int(call(AUTH,pub_sel+aw(TELLER)+bw(selector)),16))
              rows.append({'signature':name,'selector':selector,'runtime_push4':h(selector).lower() in code,'can_call_attacker':can,'public':public})
          out={'block':BLOCK,'rpc':url,'rpc_failures':failures,'expected_authority':AUTH.lower(),'actual_authority':actual_auth.lower(),'rows':rows}
          open('veda-scroll-source-selector-history.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload selector proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-scroll-source-selector-history
          path: veda-scroll-source-selector-history.json
          if-no-files-found: error
          retention-days: 1
