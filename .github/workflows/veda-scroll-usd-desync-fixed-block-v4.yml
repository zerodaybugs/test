name: veda-scroll-usd-desync-fixed-block-v4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Extract corrected IR proof scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/veda-scroll-usd-desync-fixed-block.yml').read_text()

          def extract(step_name: str) -> str:
              marker = f'      - name: {step_name}\n'
              start = source.index(marker)
              run_marker = '        run: |\n'
              start = source.index(run_marker, start) + len(run_marker)
              lines = source[start:].splitlines()
              output = []
              for line in lines:
                  if line.startswith('      - name: '):
                      break
                  output.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(output) + '\n'

          select_script = extract('Select archive-capable RPC endpoints')
          build_script = extract('Build and execute dual-fork exploit proof')
          replacements = {
              '0xd23086c4e450caaf55704ebc03875a04b4716ca2': '0xD23086C4e450cAAF55704EbC03875A04B4716CA2',
              '0xdb8345450b0e4d28514a1c18ee1110c417b5b0a2': '0xDb8345450b0E4d28514A1C18EE1110C417b5B0A2',
              '0xf8553c8552f906c19286f21711721e206ee4909e': '0xf8553c8552f906C19286F21711721E206EE4909E',
              'optimizer_runs = 200': 'optimizer_runs = 200\n          via_ir = true',
              'forge test --match-test test_fixedBlockScrollToEthereumInsolvencyAndCashout -vvv | tee ../forge-output.txt':
                  'forge test --match-test test_fixedBlockScrollToEthereumInsolvencyAndCashout -vvvv 2>&1 | tee ../forge-output.txt',
          }
          for old, new in replacements.items():
              build_script = build_script.replace(old, new)

          Path('select-rpc.sh').write_text(select_script)
          Path('run-proof.sh').write_text(build_script)
          PY
          chmod +x select-rpc.sh run-proof.sh

      - name: Select archive-capable RPC endpoints
        shell: bash
        run: ./select-rpc.sh

      - name: Execute corrected IR dual-fork proof
        shell: bash
        run: ./run-proof.sh

      - name: Build fail-closed verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          evidence = {}
          if os.path.exists('veda-scroll-usd-desync-evidence.json'):
              evidence = json.load(open('veda-scroll-usd-desync-evidence.json'))
          verdict = {
              'technical_path_pass': bool(evidence.get('technical_path_pass')),
              'current_submission_gate_pass': False,
              'reason_current_gate_fails': 'Historical fixed-block condition; current live condition must be re-proven before submission.',
              'evidence': evidence,
          }
          open('veda-scroll-usd-desync-verdict.json','w').write(json.dumps(verdict,indent=2,sort_keys=True)+'\n')
          print(json.dumps(verdict,indent=2,sort_keys=True))
          PY

      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-scroll-usd-desync-fixed-block-v4
          path: |
            rpc-selection.json
            forge-output.txt
            veda-scroll-usd-desync-evidence.json
            veda-scroll-usd-desync-verdict.json
          if-no-files-found: warn
          retention-days: 1
