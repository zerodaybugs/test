name: veda-scroll-usd-desync-fixed-block-v6

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Prepare exact deployed-ABI IR proof
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/veda-scroll-usd-desync-fixed-block.yml').read_text()
          def extract(step_name):
              start=source.index(f'      - name: {step_name}\n')
              start=source.index('        run: |\n',start)+len('        run: |\n')
              out=[]
              for line in source[start:].splitlines():
                  if line.startswith('      - name: '): break
                  out.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(out)+'\n'
          select_script=extract('Select archive-capable RPC endpoints')
          build_script=extract('Build and execute dual-fork exploit proof')
          pairs=[
              ('0xd23086c4e450caaf55704ebc03875a04b4716ca2','0xD23086C4e450cAAF55704EbC03875A04B4716CA2'),
              ('0xdb8345450b0e4d28514a1c18ee1110c417b5b0a2','0xDb8345450b0E4d28514A1C18EE1110C417b5B0A2'),
              ('0xf8553c8552f906c19286f21711721e206ee4909e','0xf8553c8552f906C19286F21711721E206EE4909E'),
              ('optimizer_runs = 200','optimizer_runs = 200\n          via_ir = true'),
              ('depositAndBridge(address,uint256,uint256,address,bytes calldata,address,uint256,address)','depositAndBridge(address,uint256,uint256,address,bytes calldata,address,uint256)'),
              ('SCROLL_USDC,amount,0,ATTACKER,wildcard,NATIVE,bridgeFee,address(0)','SCROLL_USDC,amount,0,ATTACKER,wildcard,NATIVE,bridgeFee'),
              ('forge test --match-test test_fixedBlockScrollToEthereumInsolvencyAndCashout -vvv | tee ../forge-output.txt','forge test --match-test test_fixedBlockScrollToEthereumInsolvencyAndCashout -vvvv 2>&1 | tee ../forge-output.txt'),
          ]
          for old,new in pairs:
              if old not in build_script: raise SystemExit('missing: '+old)
              build_script=build_script.replace(old,new)
          Path('select-rpc.sh').write_text(select_script)
          Path('run-proof.sh').write_text(build_script)
          PY
          chmod +x select-rpc.sh run-proof.sh

      - name: Select archive-capable RPC endpoints
        run: ./select-rpc.sh

      - name: Execute exact deployed-ABI proof
        run: ./run-proof.sh

      - name: Build verdict
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          e=json.load(open('veda-scroll-usd-desync-evidence.json')) if os.path.exists('veda-scroll-usd-desync-evidence.json') else {}
          v={'technical_path_pass':bool(e.get('technical_path_pass')),'current_submission_gate_pass':False,'reason_current_gate_fails':'Historical fixed-block condition; current live condition must be re-proven before submission.','evidence':e}
          open('veda-scroll-usd-desync-verdict.json','w').write(json.dumps(v,indent=2,sort_keys=True)+'\n')
          print(json.dumps(v,indent=2,sort_keys=True))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-scroll-usd-desync-fixed-block-v6
          path: |
            rpc-selection.json
            forge-output.txt
            veda-scroll-usd-desync-evidence.json
            veda-scroll-usd-desync-verdict.json
          if-no-files-found: warn
          retention-days: 1
