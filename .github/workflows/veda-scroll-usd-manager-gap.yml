name: veda-scroll-usd-manager-gap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prove authorization and deployment status of scoped no-code manager
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, urllib.parse, time, traceback

          RPCS=['https://scroll-rpc.publicnode.com','https://rpc.scroll.io','https://scroll.drpc.org']
          EXPLORER='https://scroll.blockscout.com'
          VAULT='0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C'
          SCOPED_MANAGER='0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'
          DEPLOYER='0xFD65ADF7d2f9ea09287543520a703522E0a360C9'
          ATTACKER='0x1111111111111111111111111111111111111111'
          ZERO='0x0000000000000000000000000000000000000000'
          MANAGER_NAME='EtherFi Liquid USD Manager With Merkle Verification V0.0'

          def sh(*args):
            p=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if p.returncode:raise RuntimeError({'args':args,'stdout':p.stdout,'stderr':p.stderr})
            return p.stdout.strip()
          def sig(x):return sh('cast','sig',x)
          def topic(x):return sh('cast','keccak',x).lower()
          S={
            'authority':sig('authority()'),'owner':sig('owner()'),'getUserRoles':sig('getUserRoles(address)'),
            'rolesCap':sig('getRolesWithCapability(address,bytes4)'),'can':sig('canCall(address,address,bytes4)'),'pub':sig('isCapabilityPublic(address,bytes4)'),
            'manage1':sig('manage(address,bytes,uint256)'),'manageN':sig('manage(address[],bytes[],uint256[])'),
            'deploy':sig('deployContract(string,bytes,bytes,uint256)'),'getAddress':sig('getAddress(string)')
          }
          USER_ROLE=topic('UserRoleUpdated(address,uint8,bool)')
          def rpc(ep,m,p,t=45):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-scroll-manager-gap/1'})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          ep=None;rpc_failures={}
          for x in RPCS:
            try:
              if int(rpc(x,'eth_chainId',[]),16)==534352:ep=x;break
            except Exception as e:rpc_failures[x]=repr(e)
          if not ep:raise RuntimeError(rpc_failures)
          def h(x):
            x=str(x or '');return x[2:] if x.startswith('0x') else x
          def w(x):return hex(int(x))[2:].rjust(64,'0')
          def aw(a):return h(a).lower().rjust(64,'0')
          def bw(s):return h(s).lower().ljust(64,'0')
          def addr(raw):return ZERO if not raw or raw=='0x' else '0x'+h(raw)[-40:].lower()
          def call(to,data,frm=None):
            tx={'to':to,'data':data}
            if frm:tx['from']=frm
            return rpc(ep,'eth_call',[tx,'latest'])
          def safe(to,data,frm=None):
            try:return {'ok':True,'raw':call(to,data,frm)}
            except Exception as e:return {'ok':False,'error':repr(e)}
          def can(auth,user,target,sel):
            if auth==ZERO:return user.lower()==addr(safe(target,S['owner']).get('raw')).lower()
            r=safe(auth,S['can']+aw(user)+aw(target)+bw(sel));return bool(int(r['raw'],16)) if r['ok'] else None
          def public(auth,target,sel):
            if auth==ZERO:return False
            r=safe(auth,S['pub']+aw(target)+bw(sel));return bool(int(r['raw'],16)) if r['ok'] else None
          def http(url,t=45,retries=5):
            last=None
            for i in range(retries):
              try:
                req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'veda-scroll-manager-gap/1'})
                with urllib.request.urlopen(req,timeout=t) as r:return json.loads(r.read().decode())
              except Exception as e:last=repr(e);time.sleep(.4*(i+1))
            raise RuntimeError({'url':url,'error':last})
          def logs(address,max_pages=250):
            url=f'{EXPLORER}/api/v2/addresses/{address}/logs';out=[];errs=[]
            for _ in range(max_pages):
              try:p=http(url)
              except Exception as e:errs.append(repr(e));break
              out.extend(p.get('items') or []);nxt=p.get('next_page_params')
              if not nxt:break
              url=f'{EXPLORER}/api/v2/addresses/{address}/logs?'+urllib.parse.urlencode(nxt);time.sleep(.04)
            return out,errs
          def meta(a):
            try:return http(f'{EXPLORER}/api/v2/addresses/{a}')
            except Exception as e:return {'_error':repr(e)}
          def dyn_string(s):
            x=s.encode().hex();return w(32)+w(len(s.encode()))+x.ljust(((len(x)+63)//64)*64,'0')
          def get_address_calldata(name):return S['getAddress']+dyn_string(name)
          def deploy_empty_calldata(name):
            # head: string offset, creation bytes offset, args bytes offset, value; tails string + empty bytes + empty bytes
            sx=name.encode().hex();spad=sx.ljust(((len(sx)+63)//64)*64,'0')
            string_tail=w(len(name.encode()))+spad
            off_string=128;off_code=128+len(string_tail)//2;off_args=off_code+32
            return S['deploy']+w(off_string)+w(off_code)+w(off_args)+w(0)+string_tail+w(0)+w(0)

          out={'generated_at_unix':int(time.time()),'endpoint':ep,'rpc_failures':rpc_failures,'block':int(rpc(ep,'eth_blockNumber',[]),16),'vault':{},'scoped_manager':{},'deployer':{},'errors':[]}
          try:
            vauth=addr(call(VAULT,S['authority']));vowner=addr(call(VAULT,S['owner']));out['vault'].update({'address':VAULT.lower(),'authority':vauth,'owner':vowner,'manage1_roles':int(call(vauth,S['rolesCap']+aw(VAULT)+bw(S['manage1'])),16),'manageN_roles':int(call(vauth,S['rolesCap']+aw(VAULT)+bw(S['manageN'])),16),'manage1_public':public(vauth,VAULT,S['manage1']),'attacker_manage1':can(vauth,ATTACKER,VAULT,S['manage1'])})
            scoped_code=rpc(ep,'eth_getCode',[SCOPED_MANAGER,'latest']);out['scoped_manager']={'address':SCOPED_MANAGER.lower(),'code_bytes':len(h(scoped_code))//2,'nonce':int(rpc(ep,'eth_getTransactionCount',[SCOPED_MANAGER,'latest']),16),'balance':int(rpc(ep,'eth_getBalance',[SCOPED_MANAGER,'latest']),16),'user_roles':int(call(vauth,S['getUserRoles']+aw(SCOPED_MANAGER)),16),'can_manage1':can(vauth,SCOPED_MANAGER,VAULT,S['manage1']),'can_manageN':can(vauth,SCOPED_MANAGER,VAULT,S['manageN']),'metadata':meta(SCOPED_MANAGER)}
            ls,errs=logs(vauth);out['vault']['authority_log_errors']=errs;candidates={SCOPED_MANAGER.lower()}
            for log in ls:
              ts=[str(x).lower() for x in (log.get('topics') or [])]
              if len(ts)>=2 and ts[0]==USER_ROLE:candidates.add('0x'+h(ts[1])[-40:].lower())
            holders=[]
            for a in sorted(candidates):
              roles=int(call(vauth,S['getUserRoles']+aw(a)),16)
              c1=can(vauth,a,VAULT,S['manage1']);cn=can(vauth,a,VAULT,S['manageN'])
              if c1 or cn:
                code=rpc(ep,'eth_getCode',[a,'latest']);holders.append({'address':a,'roles':roles,'can_manage1':c1,'can_manageN':cn,'code_bytes':len(h(code))//2,'nonce':int(rpc(ep,'eth_getTransactionCount',[a,'latest']),16),'metadata':meta(a)})
            out['vault']['current_manage_holders']=holders
          except Exception as e:out['errors'].append({'section':'vault','error':repr(e),'traceback':traceback.format_exc()})
          try:
            code=rpc(ep,'eth_getCode',[DEPLOYER,'latest']);dauth=addr(call(DEPLOYER,S['authority']));downer=addr(call(DEPLOYER,S['owner']));pred=safe(DEPLOYER,get_address_calldata(MANAGER_NAME));direct=safe(DEPLOYER,deploy_empty_calldata(MANAGER_NAME),ATTACKER)
            out['deployer']={'address':DEPLOYER.lower(),'code_bytes':len(h(code))//2,'authority':dauth,'owner':downer,'predicted_manager':addr(pred['raw']) if pred['ok'] else None,'get_address_call':pred,'deploy_public':public(dauth,DEPLOYER,S['deploy']),'attacker_can_deploy':can(dauth,ATTACKER,DEPLOYER,S['deploy']),'attacker_direct_deploy_call':direct,'metadata':meta(DEPLOYER)}
          except Exception as e:out['errors'].append({'section':'deployer','error':repr(e),'traceback':traceback.format_exc()})
          out['summary']={'error_count':len(out['errors']),'scoped_manager_has_code':out.get('scoped_manager',{}).get('code_bytes',0)>0,'scoped_manager_has_manage':bool(out.get('scoped_manager',{}).get('can_manage1') or out.get('scoped_manager',{}).get('can_manageN')),'actual_manage_holder_count':len(out.get('vault',{}).get('current_manage_holders',[])),'deployer_predicts_scoped_manager':out.get('deployer',{}).get('predicted_manager','').lower()==SCOPED_MANAGER.lower(),'attacker_can_deploy':out.get('deployer',{}).get('attacker_can_deploy')}
          open('veda-scroll-usd-manager-gap.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload no-code manager proof
        uses: actions/upload-artifact@v4
        with:
          name: veda-scroll-usd-manager-gap
          path: veda-scroll-usd-manager-gap.json
          if-no-files-found: error
          retention-days: 1
