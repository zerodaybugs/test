name: veda-sensitive-deputies

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct every contract holder of sensitive Veda capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time, traceback, urllib.request

          ZERO='0x0000000000000000000000000000000000000000'
          ATTACKER='0x1111111111111111111111111111111111111111'
          CHAINS={
            'ethereum':{'id':1,'rpcs':['https://ethereum-rpc.publicnode.com','https://eth.drpc.org'],'explorer':'https://eth.blockscout.com'},
            'scroll':{'id':534352,'rpcs':['https://scroll-rpc.publicnode.com','https://rpc.scroll.io'],'explorer':'https://scroll.blockscout.com'},
            'ink':{'id':57073,'rpcs':['https://rpc-gel.inkonchain.com'],'explorer':'https://explorer.inkonchain.com'},
          }
          PRODUCTS={
            'ethereum':{
              'liquidETH':{'auth':'0x485Bde66Bb668a51f2372E34e45B1c6226798122','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0xf9f7969C357ce6dfd7973098Ea0D57173592bCCa'},
              'liquidBTC':{'auth':'0x49F954c67ff235034b69b8a59fbe309A40256c8d','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0xED41172438897BcB22c9dd72B9F9bbF9A8bF8929','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'auth':'0xAba6BA1E95E0926a6a6b917FE4e2f19ceAe4FF2E','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x92b10e02825986bAc2375BdACaFA3e89E3f612aA','manager':'0x7b57Ad1A0AA89583130aCfAD024241170D24C13C'},
            },
            'scroll':{
              'liquidETH':{'auth':'0x485Bde66Bb668a51f2372E34e45B1c6226798122','vault':'0xf0bb20865277aBd641a307eCe5Ee04E79073416C','accountant':'0x0d05D94a5F1E76C18fbeB7A13d17C8a314088198','teller':'0x9AA79C84b79816ab920bBcE20f8f74557B514734','queue':'0x0D2dF071207E18Ca8638b4f04E98c53155eC2cE0','solver':'0xe3F8fa039fF7A8Fe42fA2C6e9DC8565EcE6f7042','manager':'0x227975088C28DBBb4b421c6d96781a53578f19a8'},
              'liquidBTC':{'auth':'0x49F954c67ff235034b69b8a59fbe309A40256c8d','vault':'0x5f46d540b6eD704C3c8789105F30E075AA900726','accountant':'0xEa23aC6D7D11f6b181d6B98174D334478ADAe6b0','teller':'0x8Ea0B382D054dbEBeB1d0aE47ee4AC433C730353','queue':'0x77A2fd42F8769d8063F2E75061FC200014E41Edf','solver':'0x7102C6889B0BB93Acf4A895f3EbeB17080D91d29','manager':'0xaFa8c08bedB2eC1bbEb64A7fFa44c604e7cca68d'},
              'liquidUSD':{'auth':'0xAba6BA1E95E0926a6a6b917FE4e2f19ceAe4FF2E','vault':'0x08c6F91e2B681FaF5e17227F2a44C307b3C1364C','accountant':'0xc315D6e14DDCDC7407784e2Caf815d131Bc1D3E7','teller':'0x4DE413a26fC24c3FC27Cc983be70aA9c5C299387','queue':'0x38FC1BA73b7ED289955a07d9F11A85b6E388064A','solver':'0x6632d22A2062415bB37C8d7b6A5EC86c35bb2610','manager':'0xcFF411d5C54FE0583A984beE1eF43a4776854B9A'},
            },
            'ink':{
              'balanced':{'auth':'0x3E8B0ee1D05267fE9F8d2b1f8CB48F2e23d69c6B','vault':'0xcaae49fb7f74cCFBE8A05E6104b01c097a78789f','accountant':'0x0C4dF79d9e35E5C4876BC1aE4663E834312DDc67','teller':'0xC151E263d5c890FD0Bceb33a6525F1A76a8329fC','queue':'0x4c433Ed6d57316170565D7Fedc11a841832cDc3d','solver':'0xFfDffb178Cb469002B77b47f7e4a6bCAd041a9b6','manager':'0xA0e501F98A1B5d3d8e6Ffd161c76f92570E42931'},
              'boosted':{'auth':'0x1F53135155d6fF516bCcfDd9424fcdB8AD1eFB77','vault':'0xDbD87325D7b1189Dcc9255c4926076fF4a96A271','accountant':'0x9c2477D4Ea17d3cCC45e6b1087c94d14926F54C9','teller':'0xc46f2443b3521632E2E2a903D6da8f965B46f6a0','queue':'0x406E63323EF5d39D41C6fD895Ef9665AF926184c','solver':'0xdf4123c18DC985ed94061f2C08cE17b7b17f21fF','manager':'0xEd23b12e7700BeB638562A22ED65f74291901c25'},
            },
          }
          SENSITIVE={
            'vault':[
              'manage(address,bytes,uint256)','manage(address[],bytes[],uint256[])','enter(address,address,uint256,address,uint256)','exit(address,address,uint256,address,uint256)','setBeforeTransferHook(address)','setAuthority(address)','transferOwnership(address)'],
            'accountant':['updateExchangeRate(uint96)','updateExchangeRate()','vestYield(uint256,uint256)','postLoss(uint256)','setRateProviderData(address,bool,address)','pause()','unpause()','claimFees(address)','setAuthority(address)','transferOwnership(address)'],
            'teller':['bulkDeposit(address,uint256,uint256,address)','bulkWithdraw(address,uint256,uint256,address)','withdraw(address,uint256,uint256,address)','refundDeposit(uint256,address,address,uint256,uint256,uint256,uint256,address)','updateAssetData(address,bool,bool,uint16)','setShareLockPeriod(uint64)','allowBufferHelper(address,address)','setDepositBufferHelper(address,address)','setWithdrawBufferHelper(address,address)','addChain(uint32,bool,bool,address,uint128)','allowMessagesFromChain(uint32,address)','allowMessagesToChain(uint32,address,uint128)','stopMessagesFromChain(uint32)','stopMessagesToChain(uint32)','setOutboundRateLimits((uint32,uint256,uint256)[])','setInboundRateLimits((uint32,uint256,uint256)[])','pause()','unpause()','setAuthority(address)','transferOwnership(address)'],
            'queue':['solveOnChainWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],bytes,address)','rescueTokens(address,uint256,address,(uint96,address,address,uint128,uint128,uint40,uint24,uint24)[])','cancelUserWithdraws((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[])','setWithdrawCapacity(address,uint256)','updateWithdrawAsset(address,uint24,uint24,uint16,uint16,uint96)','stopWithdrawsInAsset(address)','pause()','unpause()','setAuthority(address)','transferOwnership(address)'],
            'solver':['boringRedeemSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,bool)','boringRedeemMintSolve((uint96,address,address,uint128,uint128,uint40,uint24,uint24)[],address,address,address,bool)','rescueTokens(address,uint256)','setAuthority(address)','transferOwnership(address)'],
            'manager':['manageVaultWithMerkleVerification(bytes32[][],address[],address[],bytes[],uint256[])','setManageRoot(address,bytes32)','pause()','unpause()','setAuthority(address)','transferOwnership(address)'],
          }

          def sh(*args):
            p=subprocess.run([str(x) for x in args],text=True,capture_output=True)
            if p.returncode:raise RuntimeError({'args':args,'stdout':p.stdout,'stderr':p.stderr})
            return p.stdout.strip()
          def sig(s):return sh('cast','sig',s)
          SIG={s:sig(s) for values in SENSITIVE.values() for s in values}
          CORE={x:sig(x) for x in ['getRolesWithCapability(address,bytes4)','getUserRoles(address)','owner()','getOwners()','getThreshold()','getModulesPaginated(address,uint256)']}
          USER_EVENT=sig('UserRoleUpdated(address,uint8,bool)')
          def rpc(ep,m,p,t=60):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode();req=urllib.request.Request(ep,data=body,method='POST',headers={'content-type':'application/json','user-agent':'veda-sensitive-deputies/1'})
            with urllib.request.urlopen(req,timeout=t) as r:o=json.loads(r.read().decode())
            if 'error' in o:raise RuntimeError(o['error'])
            return o['result']
          def choose(cfg):
            bad={}
            for ep in cfg['rpcs']:
              try:
                if int(rpc(ep,'eth_chainId',[]),16)==cfg['id']:return ep,bad
              except Exception as e:bad[ep]=repr(e)
            raise RuntimeError(bad)
          def h(x):
            s=str(x or '');return s[2:] if s.startswith('0x') else s
          def aw(a):return h(a).lower().rjust(64,'0')
          def bw(b):return h(b).lower().ljust(64,'0')
          def uw(v):return hex(int(v))[2:].rjust(64,'0')
          def addr(raw):return ZERO if not raw or raw=='0x' else '0x'+h(raw)[-40:].lower()
          def safe(ep,to,data,frm=None):
            tx={'to':to,'data':data}
            if frm:tx['from']=frm
            try:return {'ok':True,'raw':rpc(ep,'eth_call',[tx,'latest'])}
            except Exception as e:return {'ok':False,'error':repr(e)}
          def http_json(url,t=40):
            req=urllib.request.Request(url,headers={'accept':'application/json','user-agent':'veda-sensitive-deputies/1'})
            with urllib.request.urlopen(req,timeout=t) as r:return json.loads(r.read().decode())
          def metadata(explorer,a):
            try:return http_json(f'{explorer}/api/v2/addresses/{a}')
            except Exception as e:return {'_error':repr(e)}
          def contract_info(explorer,a):
            try:return http_json(f'{explorer}/api/v2/smart-contracts/{a}')
            except Exception as e:return {'_error':repr(e)}
          def get_logs(ep,address,latest):
            out=[]
            def scan(lo,hi):
              try:
                out.extend(rpc(ep,'eth_getLogs',[{'address':address,'fromBlock':hex(lo),'toBlock':hex(hi),'topics':[USER_EVENT]}],90));return
              except Exception:
                if lo>=hi:return
                mid=(lo+hi)//2;scan(lo,mid);scan(mid+1,hi)
            scan(0,latest);out.sort(key=lambda x:(int(x['blockNumber'],16),int(x['logIndex'],16)));return out
          def role_holders(logs):
            state={}
            for log in logs:
              t=log.get('topics') or []
              if len(t)<3:continue
              user='0x'+h(t[1])[-40:].lower();role=int(t[2],16);enabled=bool(int(log.get('data','0x0'),16));bits=state.get(user,0);state[user]=(bits|(1<<role)) if enabled else (bits&~(1<<role))
            return {u:b for u,b in state.items() if b}
          def roles_for(ep,auth,target,selector):
            r=safe(ep,auth,CORE['getRolesWithCapability(address,bytes4)']+aw(target)+bw(selector));return int(r['raw'],16) if r['ok'] and r.get('raw')!='0x' else 0
          def decode_abi_functions(ci):
            abi=ci.get('abi') if isinstance(ci,dict) else None
            if isinstance(abi,str):
              try:abi=json.loads(abi)
              except:abi=[]
            out=[]
            for x in abi or []:
              if x.get('type')!='function':continue
              inputs=','.join(i.get('type','') for i in x.get('inputs',[]));out.append({'name':x.get('name'),'signature':f"{x.get('name')}({inputs})",'stateMutability':x.get('stateMutability')})
            return out
          def decode_addresses(raw):
            x=h(raw)
            try:
              off=int(x[:64],16)*2;n=int(x[off:off+64],16);return ['0x'+x[off+64+i*64+24:off+64+(i+1)*64] for i in range(n)]
            except:return []

          endpoints={};blocks={};errors=[]
          for cn,cfg in CHAINS.items():
            try:
              ep,bad=choose(cfg);endpoints[cn]=ep;blocks[cn]=int(rpc(ep,'eth_blockNumber',[]),16)
            except Exception as e:errors.append({'chain':cn,'error':repr(e)})

          output={'generated_at_unix':int(time.time()),'chains':{},'contract_deputies':[],'flags':[],'errors':errors}
          high_words=('execute','call','forward','multicall','bundle','solve','withdraw','deposit','manage','bridge','claim','process','fulfill','settle','redeem')
          for cn,products in PRODUCTS.items():
            if cn not in endpoints:continue
            ep=endpoints[cn];cfg=CHAINS[cn];chain={'block':blocks[cn],'authorities':{}};output['chains'][cn]=chain
            auth_groups={}
            for pn,p in products.items():auth_groups.setdefault(p['auth'].lower(),[]).append((pn,p))
            for auth,plist in auth_groups.items():
              try:
                holders=role_holders(get_logs(ep,auth,blocks[cn]));owner=addr(safe(ep,auth,CORE['owner()']).get('raw'));authrow={'owner':owner,'holder_count':len(holders),'capabilities':[]};chain['authorities'][auth]=authrow
                seen_contracts={}
                for pn,p in plist:
                  for component,signatures in SENSITIVE.items():
                    target=p.get(component)
                    if not target:continue
                    for fsig in signatures:
                      bits=roles_for(ep,auth,target,SIG[fsig])
                      if not bits:continue
                      cap={'product':pn,'component':component,'target':target.lower(),'signature':fsig,'selector':SIG[fsig],'roles_bitmap':bits,'holders':[]}
                      for user,userbits in holders.items():
                        if not (userbits&bits):continue
                        code=rpc(ep,'eth_getCode',[user,'latest']);nonce=int(rpc(ep,'eth_getTransactionCount',[user,'latest']),16);entry={'address':user,'user_roles_bitmap':userbits,'matching_roles_bitmap':userbits&bits,'code_bytes':len(h(code))//2,'nonce':nonce};cap['holders'].append(entry)
                        if entry['code_bytes'] and user not in seen_contracts:
                          ci=contract_info(cfg['explorer'],user);md=metadata(cfg['explorer'],user);funcs=decode_abi_functions(ci);risk=[f for f in funcs if any(w in (f.get('name') or '').lower() for w in high_words) and f.get('stateMutability') not in ('view','pure')]
                          safeOwners=safe(ep,user,CORE['getOwners()']);safeThreshold=safe(ep,user,CORE['getThreshold()']);safeModules=safe(ep,user,CORE['getModulesPaginated(address,uint256)']+aw('0x0000000000000000000000000000000000000001')+uw(50))
                          seen_contracts[user]={'address':user,'code_bytes':entry['code_bytes'],'metadata':md,'contract_info':ci,'function_count':len(funcs),'risk_functions':risk,'safe_probe':{'owners':decode_addresses(safeOwners.get('raw')) if safeOwners['ok'] else [],'threshold':int(safeThreshold['raw'],16) if safeThreshold['ok'] and safeThreshold.get('raw')!='0x' else None,'modules_raw':safeModules.get('raw') if safeModules['ok'] else None},'capabilities':[]}
                      authrow['capabilities'].append(cap)
                for cap in authrow['capabilities']:
                  for e in cap['holders']:
                    if e['address'] in seen_contracts:seen_contracts[e['address']]['capabilities'].append({k:cap[k] for k in ['product','component','target','signature','selector','roles_bitmap']})
                for dep in seen_contracts.values():
                  dep['chain']=cn;dep['authority']=auth;output['contract_deputies'].append(dep)
                  if dep['risk_functions'] and not dep['safe_probe']['owners']:
                    output['flags'].append({'type':'NON_SAFE_CONTRACT_WITH_RISKY_ENTRYPOINTS','deputy':dep})
              except Exception as e:errors.append({'chain':cn,'authority':auth,'error':repr(e),'traceback':traceback.format_exc()})

          output['summary']={'chain_count':len(output['chains']),'authority_count':sum(len(c['authorities']) for c in output['chains'].values()),'contract_deputy_count':len(output['contract_deputies']),'flag_count':len(output['flags']),'error_count':len(errors)}
          open('veda-sensitive-deputies.json','w').write(json.dumps(output,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'summary':output['summary'],'flags':[{'chain':f['deputy']['chain'],'address':f['deputy']['address'],'name':(f['deputy'].get('metadata') or {}).get('name'),'risk_functions':f['deputy']['risk_functions'],'capabilities':f['deputy']['capabilities']} for f in output['flags']],'errors':errors},indent=2,sort_keys=True))
          PY
      - name: Upload sensitive-deputy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veda-sensitive-deputies
          path: veda-sensitive-deputies.json
          if-no-files-found: error
          retention-days: 1
