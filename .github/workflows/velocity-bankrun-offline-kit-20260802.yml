name: Velocity final read-only active deployment preflight 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/velocity-bankrun-offline-kit-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velocity-final-live-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute finalized read-only deployment verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/live_preflight.py <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, random, struct, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          PROGRAM='vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P'
          EXPECTED_PROGRAMDATA='HkRf36jvUB32dnHjHqpMnPcKJhUP2TUKJTH7RDTifJm7'
          EXPECTED_LOADER='BPFLoaderUpgradeab1e11111111111111111111111'
          EXPECTED_DEPLOYMENT_SLOT=435978201
          EXPECTED_CANONICAL_BYTES=4523208
          EXPECTED_CANONICAL_SHA='1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80'
          RPCS=[
              'https://solana-rpc.publicnode.com',
              'https://api.mainnet-beta.solana.com',
              'https://solana.drpc.org',
              'https://1rpc.io/solana',
              'https://mainnet-beta.solflare.network',
              'https://solana-mainnet.rpc.extrnode.com',
          ]

          ALPHABET='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          def b58encode(data: bytes) -> str:
              n=int.from_bytes(data,'big')
              out=''
              while n:
                  n,r=divmod(n,58); out=ALPHABET[r]+out
              zeros=0
              for b in data:
                  if b: break
                  zeros += 1
              return '1'*zeros + (out or '')

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def request(endpoint: str, method: str, params: list, timeout: int=180):
              body=json.dumps({'jsonrpc':'2.0','id':random.randint(1,2**31-1),'method':method,'params':params}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'content-type':'application/json','accept':'application/json','user-agent':'Velocity-Final-ReadOnly-Preflight/1.0'},method='POST')
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  parsed=json.loads(response.read())
              if parsed.get('error') is not None:
                  raise RuntimeError(json.dumps(parsed['error'],sort_keys=True))
              return parsed.get('result')

          def rpc(method: str, params: list, attempts: int=24):
              errors=[]
              for i in range(attempts):
                  endpoint=RPCS[i % len(RPCS)]
                  try:
                      return request(endpoint,method,params),endpoint,errors
                  except Exception as exc:
                      errors.append(f'{endpoint}: {type(exc).__name__}: {exc}')
                      time.sleep(min(5.0,0.15*(2**min(i,5))))
              raise RuntimeError(' | '.join(errors[-12:]))

          def u16(data: bytes, off: int) -> int: return struct.unpack_from('<H',data,off)[0]
          def u32(data: bytes, off: int) -> int: return struct.unpack_from('<I',data,off)[0]
          def u64(data: bytes, off: int) -> int: return struct.unpack_from('<Q',data,off)[0]

          def canonical_elf_length(data: bytes) -> int:
              if len(data)<64 or data[:4]!=b'\x7fELF' or data[4]!=2 or data[5]!=1:
                  raise RuntimeError('ProgramData payload is not ELF64 little-endian')
              phoff=u64(data,0x20); shoff=u64(data,0x28)
              ehsize=u16(data,0x34); phentsize=u16(data,0x36); phnum=u16(data,0x38)
              shentsize=u16(data,0x3a); shnum=u16(data,0x3c)
              maximum=max(64,ehsize)
              if phoff and phentsize and phnum:
                  maximum=max(maximum,phoff+phentsize*phnum)
                  for i in range(phnum):
                      off=phoff+i*phentsize
                      maximum=max(maximum,u64(data,off+8)+u64(data,off+32))
              if shoff and shentsize and shnum:
                  maximum=max(maximum,shoff+shentsize*shnum)
                  for i in range(shnum):
                      off=shoff+i*shentsize
                      if u32(data,off+4)!=8:
                          maximum=max(maximum,u64(data,off+24)+u64(data,off+32))
              if maximum>len(data): raise RuntimeError('ELF extent exceeds payload')
              return maximum

          def main():
              finalized,slot_ep,slot_errors=rpc('getSlot',[{'commitment':'finalized'}])
              genesis,gen_ep,gen_errors=rpc('getGenesisHash',[])
              program,program_ep,program_errors=rpc('getAccountInfo',[PROGRAM,{'encoding':'base64','commitment':'finalized'}])
              value=program.get('value') if isinstance(program,dict) else None
              if not value: raise RuntimeError('Velocity Program account not found')
              program_raw=base64.b64decode(value['data'][0])
              if len(program_raw)!=36 or u32(program_raw,0)!=2: raise RuntimeError('unexpected Program account layout')
              programdata=b58encode(program_raw[4:36])
              pd,pd_ep,pd_errors=rpc('getAccountInfo',[programdata,{'encoding':'base64','commitment':'finalized'}])
              pd_value=pd.get('value') if isinstance(pd,dict) else None
              if not pd_value: raise RuntimeError('Velocity ProgramData account not found')
              pd_raw=base64.b64decode(pd_value['data'][0])
              if len(pd_raw)<45 or u32(pd_raw,0)!=3: raise RuntimeError('unexpected ProgramData account layout')
              deployment=u64(pd_raw,4)
              authority_option=pd_raw[12]
              authority=b58encode(pd_raw[13:45]) if authority_option==1 else None
              payload=pd_raw[45:]
              canonical_bytes=canonical_elf_length(payload)
              canonical=payload[:canonical_bytes]
              trailing=payload[canonical_bytes:]
              gates={
                  'programExecutable': value.get('executable') is True,
                  'programOwnerMatches': value.get('owner')==EXPECTED_LOADER,
                  'programDataAddressMatches': programdata==EXPECTED_PROGRAMDATA,
                  'programDataOwnerMatches': pd_value.get('owner')==EXPECTED_LOADER,
                  'deploymentSlotMatches': deployment==EXPECTED_DEPLOYMENT_SLOT,
                  'canonicalBytesMatch': canonical_bytes==EXPECTED_CANONICAL_BYTES,
                  'canonicalSha256Matches': sha256(canonical)==EXPECTED_CANONICAL_SHA,
                  'trailingPaddingAllZero': all(b==0 for b in trailing),
              }
              result={
                  'PREFLIGHT_STATUS':'PASS' if all(gates.values()) else 'FAIL',
                  'checkedAtUtc':datetime.now(timezone.utc).isoformat(),
                  'finalizedSlot':finalized,
                  'genesisHash':genesis,
                  'programId':PROGRAM,
                  'programDataAddress':programdata,
                  'deploymentSlot':deployment,
                  'upgradeAuthorityOption':authority_option,
                  'upgradeAuthority':authority,
                  'programDataAccountBytes':len(pd_raw),
                  'paddedPayloadBytes':len(payload),
                  'canonicalElfBytes':canonical_bytes,
                  'canonicalElfSha256':sha256(canonical),
                  'programDataAccountSha256':sha256(pd_raw),
                  'trailingPaddingBytes':len(trailing),
                  'trailingPaddingAllZero':all(b==0 for b in trailing),
                  'rpcEndpoints':{'slot':slot_ep,'genesis':gen_ep,'program':program_ep,'programData':pd_ep},
                  'rpcErrorsBeforeSuccess':{'slot':slot_errors,'genesis':gen_errors,'program':program_errors,'programData':pd_errors},
                  'gates':gates,
                  'rpcMethods':['getSlot','getGenesisHash','getAccountInfo'],
                  'privateKeysLoaded':0,
                  'transactionsConstructed':0,
                  'publicChainTransactionsSigned':0,
                  'publicChainTransactionsSent':0,
                  'publicChainWrites':0,
              }
              Path('evidence/LIVE_PREFLIGHT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
              print(json.dumps(result,indent=2,sort_keys=True))
              if result['PREFLIGHT_STATUS']!='PASS': raise SystemExit(1)

          if __name__=='__main__': main()
          PY
          python evidence/live_preflight.py | tee evidence/RUN_STDOUT.log

      - name: Build immutable evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence')
          rows=[]
          for p in sorted(x for x in root.iterdir() if x.is_file() and x.name not in {'MANIFEST.json','SHA256SUMS.txt'}):
              data=p.read_bytes(); rows.append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as f:
              for row in rows: f.write(f"{row['sha256']}  {row['name']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-final-live-preflight-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
