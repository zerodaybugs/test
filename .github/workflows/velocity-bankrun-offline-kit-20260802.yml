name: Velocity public Bankrun offline runtime 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.velocity-bankrun-kit/**'
      - '.github/workflows/velocity-bankrun-offline-kit-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velocity-bankrun-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install complete pinned generic Velocity Bankrun runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work artifact
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 \
            @solana/spl-token@0.4.13 \
            solana-bankrun@0.4.0 \
            anchor-bankrun@0.5.0 \
            bs58@4.0.1 > ../artifact/NPM_INSTALL.log 2>&1
          npm ls --all --json > ../artifact/NPM_DEPENDENCY_TREE.json \
            2> ../artifact/NPM_LS_STDERR.log || true
          node --version > ../artifact/NODE_VERSION.txt
          npm --version > ../artifact/NPM_VERSION.txt
          cp package.json package-lock.json ../artifact/

      - name: Package portable Linux x64 runtime deterministically
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name \
              --mtime='UTC 2026-08-02' \
              --owner=0 --group=0 --numeric-owner \
              -czf artifact/VELOCITY_BANKRUN_NODE_MODULES_LINUX_X64.tar.gz \
              -C work node_modules package.json package-lock.json
          tar -tzf artifact/VELOCITY_BANKRUN_NODE_MODULES_LINUX_X64.tar.gz \
              > artifact/RUNTIME_FILE_INDEX.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('artifact')
          rows=[]
          for p in sorted(x for x in root.iterdir() if x.is_file() and x.name not in {'MANIFEST.json','SHA256SUMS.txt'}):
              data=p.read_bytes(); rows.append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as f:
              for row in rows: f.write(f"{row['sha256']}  {row['name']}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: velocity-bankrun-runtime-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
