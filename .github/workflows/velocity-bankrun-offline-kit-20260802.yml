name: Velocity public Bankrun offline runtime and witness snapshot 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.velocity-bankrun-kit/**'
      - '.github/workflows/velocity-bankrun-offline-kit-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velocity-bankrun-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install complete pinned generic Velocity Bankrun runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work artifact snapshot
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @velocity-exchange/sdk@0.10.0 \
            @solana/web3.js@1.98.0 \
            @solana/spl-token@0.4.13 \
            solana-bankrun@0.4.0 \
            anchor-bankrun@0.5.0 \
            bs58@4.0.1 > ../artifact/NPM_INSTALL.log 2>&1
          npm ls --all --json > ../artifact/NPM_DEPENDENCY_TREE.json \
            2> ../artifact/NPM_LS_STDERR.log || true
          node --version > ../artifact/NODE_VERSION.txt
          npm --version > ../artifact/NPM_VERSION.txt
          cp package.json package-lock.json ../artifact/
          cp ../.velocity-bankrun-kit/capture_positive_witness.mjs ./capture.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('capture.mjs')
          text=path.read_text()
          old='    ...candidateInstruction.accountKeys,\n'
          new='    ...candidateInstruction.accountKeys.slice(3),\n'
          if text.count(old) != 1:
              raise SystemExit(f'patch anchor count={text.count(old)}')
          path.write_text(text.replace(old,new))
          PY
          node --check capture.mjs
          sha256sum capture.mjs > ../artifact/CAPTURE_SHA256.txt

      - name: Capture finalized public dependencies for the positive witness
        shell: bash
        env:
          OUT_DIR: ../snapshot
        run: |
          set -o pipefail
          cd work
          node capture.mjs 2>&1 | tee ../artifact/CAPTURE_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../artifact/CAPTURE_EXIT_CODE.txt
          exit "$code"

      - name: Validate and package portable offline material
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('snapshot/snapshot.json').read_text())
          assert data['status']=='PASS_PUBLIC_POSITIVE_WITNESS_DEPENDENCY_SNAPSHOT'
          assert data['activeElfSha256']=='1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80'
          assert data['candidate']['signature']=='sD3g31zyumf4As1JP5LQ9ABPCsNESt9tcvhJYZGwEUbXzhR77yk2MYhnfcZDqTtGv6ypZJftaqeDTvDV8i8v6dK'
          assert data['candidate']['instruction']['messageSha256']=='b9e28e0d937332a1a9f2d1cdd430b1b4a7081323cc00f0a7b3c4eda39c372c72'
          assert data['safety']['publicChainWrites']==0
          PY
          tar --sort=name \
              --mtime='UTC 2026-08-02' \
              --owner=0 --group=0 --numeric-owner \
              -czf artifact/VELOCITY_BANKRUN_NODE_MODULES_LINUX_X64.tar.gz \
              -C work node_modules package.json package-lock.json
          tar -tzf artifact/VELOCITY_BANKRUN_NODE_MODULES_LINUX_X64.tar.gz \
              > artifact/RUNTIME_FILE_INDEX.txt
          cp -a snapshot artifact/public-witness-snapshot
          cp work/capture.mjs artifact/CAPTURE.mjs
          find artifact/public-witness-snapshot -type f -printf '%P\n' | sort \
              > artifact/SNAPSHOT_FILE_INDEX.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('artifact')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name not in {'MANIFEST.json','SHA256SUMS.txt'}):
              data=p.read_bytes(); rows.append({'name':str(p.relative_to(root)),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as f:
              for row in rows: f.write(f"{row['sha256']}  {row['name']}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: velocity-bankrun-witness-runtime-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
