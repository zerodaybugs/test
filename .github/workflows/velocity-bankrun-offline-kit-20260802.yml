name: Velocity public Bankrun offline kit 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.velocity-bankrun-kit/**'
      - '.github/workflows/velocity-bankrun-offline-kit-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned generic Bankrun dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work snapshot artifact
          cd work
          npm init -y >/dev/null
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            @solana/web3.js@1.98.0 \
            solana-bankrun@0.4.0 \
            anchor-bankrun@0.5.0 \
            bs58@4.0.1 > ../artifact/NPM_INSTALL.log 2>&1
          npm ls --all --json > ../artifact/NPM_DEPENDENCY_TREE.json \
            2> ../artifact/NPM_LS_STDERR.log || true
          node --version > ../artifact/NODE_VERSION.txt
          npm --version > ../artifact/NPM_VERSION.txt

      - name: Decode and verify public snapshot collector
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .velocity-bankrun-kit/CAPTURE.mjs.gz.b64 | gzip -d > work/capture.mjs
          node --check work/capture.mjs
          printf '%s  %s\n' \
            '9cf0c59077df90a8d2035a1df55d3ed22dc2f879af4ff2666bc93a71d8ded120' \
            'work/capture.mjs' | sha256sum -c -
          sha256sum work/capture.mjs > artifact/CAPTURE_SHA256.txt

      - name: Capture exact public Solana state read-only
        shell: bash
        run: |
          set -o pipefail
          cd work
          node capture.mjs 2>&1 | tee ../artifact/CAPTURE_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../artifact/CAPTURE_EXIT_CODE.txt
          exit "$code"

      - name: Validate and package portable offline material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('work/snapshot/snapshot.json')
          if not path.exists():
              raise SystemExit('snapshot.json missing')
          data = json.loads(path.read_text())
          if data.get('status') != 'PASS_PUBLIC_SOLANA_OFFLINE_SNAPSHOT':
              raise SystemExit(f"bad status: {data.get('status')}")
          if data.get('velocity', {}).get('canonicalElfSha256') != '1b7b06d17af813b5a505df8f534bfd0779a1a7457f0d2626b1a45c8741686c80':
              raise SystemExit('active ELF binding mismatch')
          if data.get('candidate', {}).get('signature') != '4qvauhiSNb2CLGvQPihwDPu69uu4qzuKq5YCsVFS5ShNuygV1Jvwg38cv5f1zweKcPbrZFxgVoJdJx6XrWNDNJHb':
              raise SystemExit('candidate signature mismatch')
          if data.get('candidate', {}).get('decoded', {}).get('messageSha256') != '21cfdfc6c66b6562fbd557364cd049da26408ab8d55fe919e69b562e9ee5a766':
              raise SystemExit('candidate message mismatch')
          if data.get('safety', {}).get('publicChainWrites') != 0:
              raise SystemExit('non-zero public write count')
          PY

          cp -a work/snapshot artifact/public-snapshot
          cp work/capture.mjs artifact/CAPTURE.mjs
          cp work/package.json work/package-lock.json artifact/
          tar --sort=name \
              --mtime='UTC 2026-08-02' \
              --owner=0 --group=0 --numeric-owner \
              -czf artifact/BANKRUN_NODE_MODULES_LINUX_X64.tar.gz \
              -C work node_modules package.json package-lock.json
          find artifact/public-snapshot -type f -printf '%P\n' | sort \
            > artifact/PUBLIC_SNAPSHOT_FILE_INDEX.txt
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('artifact')
          rows = []
          for path in sorted(p for p in root.iterdir() if p.is_file() and p.name not in {'MANIFEST.json', 'SHA256SUMS.txt'}):
              data = path.read_bytes()
              rows.append({'name': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          for path in sorted((root / 'public-snapshot').rglob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  rows.append({'name': str(path.relative_to(root)), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          (root / 'MANIFEST.json').write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n')
          with (root / 'SHA256SUMS.txt').open('w') as handle:
              for row in rows:
                  handle.write(f"{row['sha256']}  {row['name']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-bankrun-offline-kit-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
