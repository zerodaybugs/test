          f+PSZXeC8rsWI/HkzqbRMTIq9SZlUgemzQxq+ev+d7lY/4/Q0G0PnlPNlEEYQC2B
          Bc8iuuP4yzA3/EHE6DUs3zkuDhfVBB+b6lqUDqduxsG/14gTpmxqeGoc8LJB7qqd
          b/se6/ZbGjAMB6ia5VS+f1dRAk4NADNE60ETG1QSf4eg3tp35+CStK70SS/h5C9y
          WWoN8n+si35xfStrG94HXJ9ehdR31yiK6QOv3EGeuEzt3h5KPTekYzPshlPZJJ7F
          LTCNRBRJeigPz74hgojh0kGuoZr50DHgXvphmMqC9CKxy7kl/REgNq0G4kk028YC
          yZ6RVGoXR53KZBQq3QIDAQABo1MwUTAdBgNVHQ4EFgQUQy/LySOx7MHVkxWPF02N
          JbzLcSUwHwYDVR0jBBgwFoAUQy/LySOx7MHVkxWPF02NJbzLcSUwDwYDVR0TAQH/
          BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAgEAfLkm/xNoFxaxghc6Dg7dZgbOIMEb
          KaW2HiTdS/bh2vo3ltWHa1g7qeNzxiIBb/4wf5NTAWP8BfOoGq4j7TDZwaVY5jdx
          zKmIxM5HSYC6xpnRcB/v3LhprLLlWhWF9VVCm382V20zF7NMO8KfI8yIDUCAW+RG
          FUVldcdIJ3qrXInnevmyS+MLL5ajzUUnFy3X3nNAVMr+KblZ1KA/6lo1eJxCmz7Z
          CwrOJxMOxuIjY0krtjjE1q1ae7s4aB+iqbGHf/r2Q7tQd+YMccbZPqaY/G3uEAOC
          CdWzQMQBySfLJ2Ig2FVKNWLMsbf1A3csdcstaxnSkfixggfMXzDpTXnIuHYNmRZ9
          8YHQgTLeXGjBpX7MI9XRBsVqaaoZ3xU7v/R2ERyec/aSRNCL9LSY/vPtAGoFNwYj
          WZKxphWCLq4usVkToEV5vj/bM8FdzUjETa0c1HA5qNXdmrw9hx0OZhoKE6BKqBgZ
          Ej9n2zLVs/rIGtZ634NzMH2KNsE49YWe2CJdvEoa85rIJ9eKpF1TmOlky6YbEQNo
          dv1y2al5idG03Ur37qUiZmBQhksmxJcBkebdbXdsv1O2H84dqb/w8oJYAgdIGBSE
          anzf6Ik6gmhpd5Ejq9MFI+GgVJAjx05q+7+E/sJunNAqRmApXx01qLu4jX0rE5Z+
          olPaH1I711WYe7U=
          -----END CERTIFICATE-----
          CERT
          tar -czf INVENTORY.tar.gz INVENTORY.json SUMMARY.json
          openssl cms -encrypt -binary -aes256 -in INVENTORY.tar.gz -outform DER -out INVENTORY.cms research-cert.pem
          openssl x509 -in research-cert.pem -noout -fingerprint -sha256 > CERT_FINGERPRINT.txt
          cp SUMMARY.json ../encrypted/SUMMARY.json
          cp INVENTORY.cms CERT_FINGERPRINT.txt ../encrypted/
          rm -f INVENTORY.json INVENTORY.tar.gz

      - name: Upload encrypted detailed evidence and aggregate summary
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-cross-program-account-inventory
          path: encrypted
          if-no-files-found: error
          retention-days: 1
