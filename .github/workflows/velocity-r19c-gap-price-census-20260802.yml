name: Velocity R19C read-only gap price census 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - '.velocity-r19c/**'
      - '.github/workflows/velocity-r19c-gap-price-census-20260802.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Decode and validate scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-r19c
          base64 -d .velocity-r19c/scan.py.gz.b64 | gzip -d > scan.py
          python -m py_compile scan.py
          printf '%s  %s\n' \
            'cce7852923a42bdfeb163848898a217484e06cc74eb7e3ab653e38b04bd75ad1' \
            'scan.py' | sha256sum -c -

      - name: Run finalized read-only census
        shell: bash
        run: |
          set -o pipefail
          python scan.py 2>&1 | tee evidence-r19c/RUN_STDOUT.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > evidence-r19c/EXIT_CODE.txt
          sha256sum scan.py > evidence-r19c/SCANNER_SHA256.txt
          exit "$code"

      - name: Package immutable evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-r19c
          cp scan.py evidence-r19c/SCANNER.py || true
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('evidence-r19c')
          rows = []
          for path in sorted(
              p for p in root.iterdir()
              if p.is_file() and p.name not in {'MANIFEST.json', 'SHA256SUMS.txt'}
          ):
              data = path.read_bytes()
              rows.append({
                  'name': path.name,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          (root / 'MANIFEST.json').write_text(
              json.dumps(rows, indent=2, sort_keys=True) + '\n'
          )
          with (root / 'SHA256SUMS.txt').open('w') as handle:
              for row in rows:
                  handle.write(f"{row['sha256']}  {row['name']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-r19c-gap-price-census-${{ github.run_id }}
          path: evidence-r19c/
          if-no-files-found: error
          retention-days: 1
