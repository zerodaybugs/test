name: Vendor CometBFT v0.39.3 source

on:
  push:
    branches:
      - research/vendor-cometbft-v0400-source
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4
      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.39.3 https://github.com/cometbft/cometbft.git cometbft
          test "$(git -C cometbft rev-parse HEAD)" = "49b82838fcca442b2445f76605c101609ed04130"
          test "$(git -C cometbft describe --tags --exact-match)" = "v0.39.3"
      - name: Create deterministic source archive
        run: |
          set -euxo pipefail
          {
            echo "repository=https://github.com/cometbft/cometbft"
            echo "tag=v0.39.3"
            echo "commit=$(git -C cometbft rev-parse HEAD)"
            echo "runner=$(uname -a)"
          } > SOURCE_PROVENANCE.txt
          rm -rf cometbft/.git
          TZ=UTC find cometbft -exec touch -h -d '@0' {} +
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf cometbft-v0.39.3-source.tar.gz cometbft SOURCE_PROVENANCE.txt
          sha256sum cometbft-v0.39.3-source.tar.gz SOURCE_PROVENANCE.txt > SHA256SUMS
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.39.3-source
          retention-days: 1
          if-no-files-found: error
          path: |
            cometbft-v0.39.3-source.tar.gz
            SOURCE_PROVENANCE.txt
            SHA256SUMS
