name: Vendor CometBFT v0.39.3 source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v4
        with:
          repository: cometbft/cometbft
          ref: v0.39.3
          path: cometbft
          fetch-depth: 1

      - name: Verify exact tag commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C cometbft rev-parse HEAD)"
          printf 'actual=%s\n' "$actual" | tee SOURCE_PROVENANCE.txt
          git -C cometbft status --porcelain | tee SOURCE_WORKTREE_STATUS.txt
          test ! -s SOURCE_WORKTREE_STATUS.txt

      - name: Install repository Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: cometbft/go.mod
          cache: false

      - name: Verify focused packages
        shell: bash
        run: |
          set -euo pipefail
          cd cometbft
          go version | tee ../GO_VERSION.txt
          go test -count=1 ./blocksync/... 2>&1 | tee ../BLOCKSYNC_TEST.log
          go test -count=1 ./internal/p2p/... 2>&1 | tee ../P2P_TEST.log
          go test -count=1 ./internal/guard/... ./mempool/... 2>&1 | tee ../MEMPOOL_TEST.log

      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name \
              --mtime='UTC 2026-05-05' \
              --owner=0 --group=0 --numeric-owner \
              --exclude='.git' \
              -czf cometbft-v0.39.3-source.tar.gz cometbft
          sha256sum \
            cometbft-v0.39.3-source.tar.gz \
            SOURCE_PROVENANCE.txt \
            SOURCE_WORKTREE_STATUS.txt \
            GO_VERSION.txt \
            BLOCKSYNC_TEST.log \
            P2P_TEST.log \
            MEMPOOL_TEST.log > SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.39.3-source
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            cometbft-v0.39.3-source.tar.gz
            SOURCE_PROVENANCE.txt
            SOURCE_WORKTREE_STATUS.txt
            GO_VERSION.txt
            BLOCKSYNC_TEST.log
            P2P_TEST.log
            MEMPOOL_TEST.log
            SHA256SUMS
