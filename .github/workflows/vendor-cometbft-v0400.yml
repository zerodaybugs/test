name: Vendor CometBFT v0.40.0 source

on:
  push:
    branches:
      - research/vendor-cometbft-v0400-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: false

      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.40.0 https://github.com/cometbft/cometbft.git cometbft
          test "$(git -C cometbft rev-parse HEAD)" = "0880b4d378f347ab16e54ec677ff50d803f37d62"
          test "$(git -C cometbft describe --tags --exact-match)" = "v0.40.0"

      - name: Verify security-sensitive packages
        run: |
          set -euxo pipefail
          cd cometbft
          go test -count=1 ./crypto/encoding ./crypto/mldsa65 ./crypto/secp256k1eth ./types ./state ./mempool

      - name: Export offline Go module cache
        run: |
          set -euxo pipefail
          cd cometbft
          go mod download
          cd ..
          tar -C "$(go env GOMODCACHE)" -czf cometbft-v0.40.0-gomodcache.tar.gz .
          split -b 240M -d -a 2 cometbft-v0.40.0-gomodcache.tar.gz cometbft-v0.40.0-gomodcache.part-
          sha256sum cometbft-v0.40.0-gomodcache.tar.gz cometbft-v0.40.0-gomodcache.part-* > GOMODCACHE_SHA256SUMS

      - name: Create deterministic source archive
        run: |
          set -euxo pipefail
          commit="$(git -C cometbft rev-parse HEAD)"
          {
            echo "repository=https://github.com/cometbft/cometbft"
            echo "tag=v0.40.0"
            echo "commit=${commit}"
            echo "go=$(go version)"
            echo "runner=$(uname -a)"
          } > SOURCE_PROVENANCE.txt
          rm -rf cometbft/.git
          TZ=UTC find cometbft -exec touch -h -d '@0' {} +
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf cometbft-v0.40.0-source.tar.gz cometbft SOURCE_PROVENANCE.txt
          sha256sum cometbft-v0.40.0-source.tar.gz SOURCE_PROVENANCE.txt > SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.40.0-source
          retention-days: 1
          if-no-files-found: error
          path: |
            cometbft-v0.40.0-source.tar.gz
            SOURCE_PROVENANCE.txt
            SHA256SUMS

      - name: Upload module-cache manifest
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.40.0-gomodcache-manifest
          retention-days: 1
          if-no-files-found: error
          path: GOMODCACHE_SHA256SUMS

      - name: Upload module-cache part 00
        if: ${{ hashFiles('cometbft-v0.40.0-gomodcache.part-00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.40.0-gomodcache-part-00
          retention-days: 1
          path: cometbft-v0.40.0-gomodcache.part-00

      - name: Upload module-cache part 01
        if: ${{ hashFiles('cometbft-v0.40.0-gomodcache.part-01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.40.0-gomodcache-part-01
          retention-days: 1
          path: cometbft-v0.40.0-gomodcache.part-01

      - name: Upload module-cache part 02
        if: ${{ hashFiles('cometbft-v0.40.0-gomodcache.part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.40.0-gomodcache-part-02
          retention-days: 1
          path: cometbft-v0.40.0-gomodcache.part-02

      - name: Upload module-cache part 03
        if: ${{ hashFiles('cometbft-v0.40.0-gomodcache.part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-v0.40.0-gomodcache-part-03
          retention-days: 1
          path: cometbft-v0.40.0-gomodcache.part-03
