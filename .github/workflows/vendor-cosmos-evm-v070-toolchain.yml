name: Vendor Cosmos EVM v0.7.0 offline toolchain

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      GOMODCACHE: ${{ github.workspace }}/gomodcache
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v4
        with:
          repository: cosmos/evm
          ref: v0.7.0
          path: cosmos-evm
          fetch-depth: 1

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false

      - name: Verify source and populate module cache
        shell: bash
        run: |
          set -uo pipefail
          actual="$(git -C cosmos-evm rev-parse HEAD)"
          expected="f4ab9a3e3fbe353468327d5cacda94b33b41ed11"
          test "$actual" = "$expected" || exit 90
          cd cosmos-evm
          go version | tee ../GO_VERSION.txt
          go env -json > ../GO_ENV.json

          set +e
          go mod download all > ../GO_MOD_DOWNLOAD.log 2>&1
          download_rc=$?
          go mod verify > ../GO_MOD_VERIFY.log 2>&1
          verify_rc=$?
          go list -deps -test ./evmd/tests/integration > ../GO_LIST_DEPS.log 2>&1
          list_rc=$?
          set -e

          {
            echo "source_commit=$actual"
            echo "go_version=$(go version)"
            echo "goroot=$(go env GOROOT)"
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "download_rc=$download_rc"
            echo "verify_rc=$verify_rc"
            echo "list_rc=$list_rc"
          } > ../TOOLCHAIN_PROVENANCE.txt

          # Do not suppress packaging: diagnostics and partial cache are needed
          # even when one repository dependency has an upstream availability issue.
          exit 0

      - name: Package Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          goroot="$(go env GOROOT)"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              -C "$goroot" -czf go1.25.9-linux-amd64.tar.gz .
          sha256sum go1.25.9-linux-amd64.tar.gz > GO_TOOLCHAIN_SHA256SUMS

      - name: Package module cache and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GOMODCACHE"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              -C "$GOMODCACHE" -czf cosmos-evm-v0.7.0-gomodcache.tar.gz .
          sha256sum cosmos-evm-v0.7.0-gomodcache.tar.gz > GOMODCACHE_SHA256SUMS

      - name: Upload Go toolchain
        uses: actions/upload-artifact@v4
        with:
          name: go1.25.9-linux-amd64
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            go1.25.9-linux-amd64.tar.gz
            GO_TOOLCHAIN_SHA256SUMS
            GO_ENV.json
            GO_VERSION.txt
            TOOLCHAIN_PROVENANCE.txt
            GO_MOD_DOWNLOAD.log
            GO_MOD_VERIFY.log
            GO_LIST_DEPS.log

      - name: Upload Cosmos EVM module cache
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v0.7.0-gomodcache
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            cosmos-evm-v0.7.0-gomodcache.tar.gz
            GOMODCACHE_SHA256SUMS
            TOOLCHAIN_PROVENANCE.txt
            GO_MOD_DOWNLOAD.log
            GO_MOD_VERIFY.log
            GO_LIST_DEPS.log
