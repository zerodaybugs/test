name: Vendor Cosmos EVM v0.7.0 offline toolchain

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      GOMODCACHE: ${{ github.workspace }}/gomodcache
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v4
        with:
          repository: cosmos/evm
          ref: v0.7.0
          path: cosmos-evm
          fetch-depth: 1

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false

      - name: Verify source and populate root and evmd module caches
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C cosmos-evm rev-parse HEAD)"
          expected="f4ab9a3e3fbe353468327d5cacda94b33b41ed11"
          test "$actual" = "$expected"
          go version | tee GO_VERSION.txt
          go env -json > GO_ENV.json

          cd cosmos-evm
          go mod download all > ../GO_MOD_DOWNLOAD_ROOT.log 2>&1
          go mod verify > ../GO_MOD_VERIFY_ROOT.log 2>&1
          go list -deps -test ./tests/integration/x/vm > ../GO_LIST_DEPS_ROOT.log 2>&1

          cd evmd
          go mod download all > ../../GO_MOD_DOWNLOAD_EVMD.log 2>&1
          go mod verify > ../../GO_MOD_VERIFY_EVMD.log 2>&1
          go list -deps -test ./tests/integration > ../../GO_LIST_DEPS_EVMD.log 2>&1
          cd ../..

          {
            echo "source_commit=$actual"
            echo "go_version=$(go version)"
            echo "goroot=$(go env GOROOT)"
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "root_download_rc=0"
            echo "root_verify_rc=0"
            echo "root_list_rc=0"
            echo "evmd_download_rc=0"
            echo "evmd_verify_rc=0"
            echo "evmd_list_rc=0"
          } > TOOLCHAIN_PROVENANCE.txt

      - name: Package Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          goroot="$(go env GOROOT)"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$goroot" -czf go1.25.9-linux-amd64.tar.gz .
          sha256sum go1.25.9-linux-amd64.tar.gz > GO_TOOLCHAIN_SHA256SUMS

      - name: Package and split module cache
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$GOMODCACHE" -czf cosmos-evm-v0.7.0-gomodcache.tar.gz .
          sha256sum cosmos-evm-v0.7.0-gomodcache.tar.gz > GOMODCACHE_SHA256SUMS
          split -b 240M -d -a 2 cosmos-evm-v0.7.0-gomodcache.tar.gz cosmos-evm-v0.7.0-gomodcache.part-
          sha256sum cosmos-evm-v0.7.0-gomodcache.part-* > GOMODCACHE_PART_SHA256SUMS
          ls -l cosmos-evm-v0.7.0-gomodcache.part-* > GOMODCACHE_PARTS.txt
          rm cosmos-evm-v0.7.0-gomodcache.tar.gz

      - name: Upload Go toolchain
        uses: actions/upload-artifact@v4
        with:
          name: go1.25.9-linux-amd64
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            go1.25.9-linux-amd64.tar.gz
            GO_TOOLCHAIN_SHA256SUMS
            GO_ENV.json
            GO_VERSION.txt
            TOOLCHAIN_PROVENANCE.txt
            GO_MOD_DOWNLOAD_ROOT.log
            GO_MOD_VERIFY_ROOT.log
            GO_LIST_DEPS_ROOT.log
            GO_MOD_DOWNLOAD_EVMD.log
            GO_MOD_VERIFY_EVMD.log
            GO_LIST_DEPS_EVMD.log

      - name: Upload module-cache manifest
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v0.7.0-gomodcache-manifest
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            GOMODCACHE_SHA256SUMS
            GOMODCACHE_PART_SHA256SUMS
            GOMODCACHE_PARTS.txt
            TOOLCHAIN_PROVENANCE.txt
            GO_MOD_DOWNLOAD_ROOT.log
            GO_MOD_VERIFY_ROOT.log
            GO_LIST_DEPS_ROOT.log
            GO_MOD_DOWNLOAD_EVMD.log
            GO_MOD_VERIFY_EVMD.log
            GO_LIST_DEPS_EVMD.log

      - name: Upload module-cache part 00
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-00, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-00}
      - name: Upload module-cache part 01
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-01, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-01}
      - name: Upload module-cache part 02
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-02, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-02}
      - name: Upload module-cache part 03
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-03, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-03}
      - name: Upload module-cache part 04
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-04, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-04}
      - name: Upload module-cache part 05
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-05, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-05}
      - name: Upload module-cache part 06
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-06, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-06}
      - name: Upload module-cache part 07
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-07, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-07}
      - name: Upload module-cache part 08
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-08, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-08}
      - name: Upload module-cache part 09
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.0-gomodcache-part-09, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.0-gomodcache.part-09}
