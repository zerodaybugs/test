name: Vendor Cosmos EVM v0.7.1 build cache

on:
  push:
    branches:
      - research/vendor-cosmos-evm-v071-buildcache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-buildcache:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GOMAXPROCS: "4"
      GOMEMLIMIT: "6GiB"
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: false

      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.7.1 https://github.com/cosmos/evm.git cosmos-evm
          test "$(git -C cosmos-evm rev-parse HEAD)" = "fb82a3f865d500ac33c635b0694d35738be323b7"
          test "$(git -C cosmos-evm describe --tags --exact-match)" = "v0.7.1"

      - name: Compile unchanged EVMD mempool integration package
        run: |
          set -euxo pipefail
          cd cosmos-evm/evmd
          /usr/bin/time -v go test -vet=off -c ./tests/integration/mempool -o ../../mempool-v071.test

      - name: Export split Go build cache
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          cache="$(go env GOCACHE)"
          tar -C "$cache" -cf - . | zstd -T0 -3 -o cosmos-evm-v071-gocache.tar.zst
          split -d -a 2 -b 180M cosmos-evm-v071-gocache.tar.zst cosmos-evm-v071-gocache.part-
          sha256sum cosmos-evm-v071-gocache.tar.zst cosmos-evm-v071-gocache.part-* > GOCACHE_SHA256SUMS
          {
            echo "repository=https://github.com/cosmos/evm"
            echo "tag=v0.7.1"
            echo "commit=$(git -C cosmos-evm rev-parse HEAD)"
            echo "go=$(go version)"
            echo "runner=$(uname -a)"
            echo "cpu_count=$(nproc)"
            echo "gocache=$cache"
            echo "binary_sha256=$(sha256sum mempool-v071.test | awk '{print $1}')"
          } > SOURCE_PROVENANCE.txt
          ls -lh cosmos-evm-v071-gocache.part-* mempool-v071.test SOURCE_PROVENANCE.txt GOCACHE_SHA256SUMS

      - name: Upload manifest and compiled unchanged test binary
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-buildcache-manifest
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            SOURCE_PROVENANCE.txt
            GOCACHE_SHA256SUMS
            mempool-v071.test

      - name: Upload build-cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-gocache-part-00
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
          path: cosmos-evm-v071-gocache.part-00

      - name: Upload build-cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-gocache-part-01
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
          path: cosmos-evm-v071-gocache.part-01

      - name: Upload build-cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-gocache-part-02
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
          path: cosmos-evm-v071-gocache.part-02

      - name: Upload build-cache part 03
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-gocache-part-03
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
          path: cosmos-evm-v071-gocache.part-03

      - name: Upload build-cache part 04
        uses: actions/upload-artifact@v4
