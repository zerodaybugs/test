name: Vendor Cosmos EVM v0.7.1 evmd integration build cache

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evmd-buildcache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      GOMODCACHE: ${{ github.workspace }}/gomodcache
      GOCACHE: ${{ github.workspace }}/gocache
      GOMAXPROCS: '4'
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v4
        with:
          repository: cosmos/evm
          ref: v0.7.1
          path: cosmos-evm
          fetch-depth: 1

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false

      - name: Verify and compile unchanged evmd integration package
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C cosmos-evm rev-parse HEAD)"
          expected="fb82a3f865d500ac33c635b0694d35738be323b7"
          test "$actual" = "$expected"
          cd cosmos-evm/evmd
          go mod download all
          /usr/bin/time -v go test -count=1 -run '^$' ./tests/integration 2>&1 | tee ../../EVMD_BUILD.log
          {
            echo "source_commit=$actual"
            echo "go_version=$(go version)"
            echo "goos=$(go env GOOS)"
            echo "goarch=$(go env GOARCH)"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } > ../../BUILDCACHE_PROVENANCE.txt

      - name: Package and split build cache
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$GOCACHE" -czf cosmos-evm-v0.7.1-evmd-gocache.tar.gz .
          sha256sum cosmos-evm-v0.7.1-evmd-gocache.tar.gz > GOCACHE_SHA256SUMS
          split -b 240M -d -a 2 cosmos-evm-v0.7.1-evmd-gocache.tar.gz cosmos-evm-v0.7.1-evmd-gocache.part-
          sha256sum cosmos-evm-v0.7.1-evmd-gocache.part-* > GOCACHE_PART_SHA256SUMS
          ls -l cosmos-evm-v0.7.1-evmd-gocache.part-* > GOCACHE_PARTS.txt
          rm cosmos-evm-v0.7.1-evmd-gocache.tar.gz

      - name: Upload build-cache manifest
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v0.7.1-evmd-gocache-manifest
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            GOCACHE_SHA256SUMS
            GOCACHE_PART_SHA256SUMS
            GOCACHE_PARTS.txt
            BUILDCACHE_PROVENANCE.txt
            EVMD_BUILD.log

      - name: Upload build-cache part 00
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.1-evmd-gocache-part-00, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.1-evmd-gocache.part-00}
      - name: Upload build-cache part 01
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.1-evmd-gocache-part-01, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.1-evmd-gocache.part-01}
      - name: Upload build-cache part 02
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.1-evmd-gocache-part-02, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.1-evmd-gocache.part-02}
      - name: Upload build-cache part 03
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.1-evmd-gocache-part-03, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.1-evmd-gocache.part-03}
      - name: Upload build-cache part 04
        uses: actions/upload-artifact@v4
        with: {name: cosmos-evm-v0.7.1-evmd-gocache-part-04, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: cosmos-evm-v0.7.1-evmd-gocache.part-04}
