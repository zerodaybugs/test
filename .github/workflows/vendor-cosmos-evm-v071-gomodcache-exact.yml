name: Vendor Cosmos EVM v0.7.1 exact module cache

on:
  push:
    branches:
      - research/vendor-cosmos-evm-v071-gomodcache-exact
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-gomodcache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: false

      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.7.1 https://github.com/cosmos/evm.git cosmos-evm
          test "$(git -C cosmos-evm rev-parse HEAD)" = "fb82a3f865d500ac33c635b0694d35738be323b7"
          test "$(git -C cosmos-evm describe --tags --exact-match)" = "v0.7.1"

      - name: Materialize exact root and EVMD dependencies
        run: |
          set -euxo pipefail
          cd cosmos-evm
          go mod download all
          go mod verify
          cd evmd
          go mod download all
          go mod verify
          go test -vet=off -run '^$' ./tests/integration/mempool

      - name: Export split offline module cache
        run: |
          set -euxo pipefail
          gomodcache="$(go env GOMODCACHE)"
          tar -C "$gomodcache" -czf cosmos-evm-v0.7.1-gomodcache.tar.gz .
          split -b 230M -d -a 2 cosmos-evm-v0.7.1-gomodcache.tar.gz cosmos-evm-v0.7.1-gomodcache.part-
          {
            echo "repository=https://github.com/cosmos/evm"
            echo "tag=v0.7.1"
            echo "commit=$(git -C cosmos-evm rev-parse HEAD)"
            echo "go=$(go version)"
            echo "runner=$(uname -a)"
            echo "gomodcache=$gomodcache"
          } > SOURCE_PROVENANCE.txt
          sha256sum cosmos-evm-v0.7.1-gomodcache.tar.gz cosmos-evm-v0.7.1-gomodcache.part-* > GOMODCACHE_SHA256SUMS

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-exact-gomodcache-manifest
          retention-days: 1
          if-no-files-found: error
          path: |
            SOURCE_PROVENANCE.txt
            GOMODCACHE_SHA256SUMS

      - name: Upload cache part 00
        if: ${{ hashFiles('cosmos-evm-v0.7.1-gomodcache.part-00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-exact-gomodcache-part-00
          retention-days: 1
          path: cosmos-evm-v0.7.1-gomodcache.part-00
      - name: Upload cache part 01
        if: ${{ hashFiles('cosmos-evm-v0.7.1-gomodcache.part-01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-exact-gomodcache-part-01
          retention-days: 1
          path: cosmos-evm-v0.7.1-gomodcache.part-01
      - name: Upload cache part 02
        if: ${{ hashFiles('cosmos-evm-v0.7.1-gomodcache.part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-exact-gomodcache-part-02
          retention-days: 1
          path: cosmos-evm-v0.7.1-gomodcache.part-02
      - name: Upload cache part 03
        if: ${{ hashFiles('cosmos-evm-v0.7.1-gomodcache.part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v071-exact-gomodcache-part-03
          retention-days: 1
          path: cosmos-evm-v0.7.1-gomodcache.part-03
      - name: Upload cache part 04
