name: Vendor Cosmos EVM v0.7.1 source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v4
        with:
          repository: cosmos/evm
          ref: v0.7.1
          path: cosmos-evm
          fetch-depth: 1

      - name: Verify exact tag commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C cosmos-evm rev-parse HEAD)"
          expected="fb82a3f865d500ac33c635b0694d35738be323b7"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual" | tee SOURCE_PROVENANCE.txt
          test "$actual" = "$expected"
          git -C cosmos-evm status --porcelain | tee SOURCE_WORKTREE_STATUS.txt
          test ! -s SOURCE_WORKTREE_STATUS.txt

      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 2026-07-16' --owner=0 --group=0 --numeric-owner --exclude='.git' -czf cosmos-evm-v0.7.1-source.tar.gz cosmos-evm
          sha256sum cosmos-evm-v0.7.1-source.tar.gz SOURCE_PROVENANCE.txt SOURCE_WORKTREE_STATUS.txt > SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-evm-v0.7.1-source
          retention-days: 1
          if-no-files-found: error
          path: |
            cosmos-evm-v0.7.1-source.tar.gz
            SOURCE_PROVENANCE.txt
            SOURCE_WORKTREE_STATUS.txt
            SHA256SUMS
