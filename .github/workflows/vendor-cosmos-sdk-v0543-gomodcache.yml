name: Vendor Cosmos SDK v0.54.3 module cache

on:
  push:
    branches:
      - research/vendor-cosmos-sdk-v0543-gomodcache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-gomodcache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: false

      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.54.3 https://github.com/cosmos/cosmos-sdk.git cosmos-sdk
          test "$(git -C cosmos-sdk rev-parse HEAD)" = "046046a6731ddc00bca29193f5f0529d7017b3e3"
          test "$(git -C cosmos-sdk describe --tags --exact-match)" = "v0.54.3"

      - name: Materialize exact dependencies and compile target package
        run: |
          set -euxo pipefail
          cd cosmos-sdk
          go mod download
          go test -vet=off -run '^$' ./internal/blockstm

      - name: Export split offline module cache
        run: |
          set -euxo pipefail
          gomodcache="$(go env GOMODCACHE)"
          tar -C "$gomodcache" -czf cosmos-sdk-v0.54.3-gomodcache.tar.gz .
          split -b 240M -d -a 2 cosmos-sdk-v0.54.3-gomodcache.tar.gz cosmos-sdk-v0.54.3-gomodcache.part-
          sha256sum cosmos-sdk-v0.54.3-gomodcache.tar.gz > GOMODCACHE_SHA256SUMS
          sha256sum cosmos-sdk-v0.54.3-gomodcache.part-* > GOMODCACHE_PART_SHA256SUMS
          ls -l cosmos-sdk-v0.54.3-gomodcache.part-* > GOMODCACHE_PARTS.txt
          {
            echo "repository=https://github.com/cosmos/cosmos-sdk"
            echo "tag=v0.54.3"
            echo "commit=$(git -C cosmos-sdk rev-parse HEAD)"
            echo "go=$(go version)"
            echo "runner=$(uname -a)"
          } > SOURCE_PROVENANCE.txt

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-manifest
          retention-days: 1
          if-no-files-found: error
          path: |
            GOMODCACHE_SHA256SUMS
            GOMODCACHE_PART_SHA256SUMS
            GOMODCACHE_PARTS.txt
            SOURCE_PROVENANCE.txt

      - name: Upload module-cache part 00
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-00
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-00

      - name: Upload module-cache part 01
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-01
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-01

      - name: Upload module-cache part 02
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-02
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-02

      - name: Upload module-cache part 03
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-03
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-03

      - name: Upload module-cache part 04
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-04
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-04

      - name: Upload module-cache part 05
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-05') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-05
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-05

      - name: Upload module-cache part 06
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-06') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-06
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-06

      - name: Upload module-cache part 07
        if: ${{ hashFiles('cosmos-sdk-v0.54.3-gomodcache.part-07') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-gomodcache-part-07
          retention-days: 1
          path: cosmos-sdk-v0.54.3-gomodcache.part-07
