name: Vendor Cosmos SDK v0.54.3 source

on:
  push:
    branches:
      - research/vendor-cosmos-sdk-v0543-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: false

      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.54.3 https://github.com/cosmos/cosmos-sdk.git cosmos-sdk
          test "$(git -C cosmos-sdk rev-parse HEAD)" = "046046a6731ddc00bca29193f5f0529d7017b3e3"
          test "$(git -C cosmos-sdk describe --tags --exact-match)" = "v0.54.3"

      - name: Verify exact target package
        run: |
          set -euxo pipefail
          cd cosmos-sdk
          go test -count=1 ./internal/blockstm

      - name: Create deterministic source archive
        run: |
          set -euxo pipefail
          commit="$(git -C cosmos-sdk rev-parse HEAD)"
          {
            echo "repository=https://github.com/cosmos/cosmos-sdk"
            echo "tag=v0.54.3"
            echo "commit=${commit}"
            echo "go=$(go version)"
            echo "runner=$(uname -a)"
          } > SOURCE_PROVENANCE.txt
          rm -rf cosmos-sdk/.git
          TZ=UTC find cosmos-sdk -exec touch -h -d '@0' {} +
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf cosmos-sdk-v0.54.3-source.tar.gz cosmos-sdk SOURCE_PROVENANCE.txt
          sha256sum cosmos-sdk-v0.54.3-source.tar.gz SOURCE_PROVENANCE.txt > SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sdk-v0543-source
          retention-days: 1
          if-no-files-found: error
          path: |
            cosmos-sdk-v0.54.3-source.tar.gz
            SOURCE_PROVENANCE.txt
            SHA256SUMS
