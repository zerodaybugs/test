name: Vendor Solidity IBC Eureka v3.0.2 portable toolchain

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v5
        with:
          repository: cosmos/solidity-ibc-eureka
          ref: solidity-v3.0.2
          path: eureka
          fetch-depth: 1

      - name: Verify exact release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C eureka rev-parse HEAD)" = "39904319467b5fbdec8c34c43b66af6f1d256dba"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and prime solc
        working-directory: eureka
        run: |
          bun install --frozen-lockfile
          forge build >/dev/null

      - name: Package dereferenced portable binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portable/bin portable/svm
          for tool in forge cast anvil chisel bun; do
            src="$(readlink -f "$(command -v "$tool")")"
            test -x "$src"
            cp "$src" "portable/bin/$tool"
          done
          cp -a "$HOME/.svm/." portable/svm/
          {
            echo "source_commit=$(git -C eureka rev-parse HEAD)"
            echo "forge=$(forge --version | head -n1)"
            echo "cast=$(cast --version | head -n1)"
            echo "anvil=$(anvil --version | head -n1)"
            echo "bun=$(bun --version)"
            echo "solc_sha256=$(sha256sum "$HOME/.svm/0.8.28/solc-0.8.28" | awk '{print $1}')"
          } > PORTABLE_TOOLCHAIN_PROVENANCE.txt
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf eureka-v302-portable-toolchain.tar.gz portable
          sha256sum eureka-v302-portable-toolchain.tar.gz PORTABLE_TOOLCHAIN_PROVENANCE.txt > SHA256SUMS

      - name: Upload portable toolchain
        uses: actions/upload-artifact@v4
        with:
          name: eureka-v302-portable-toolchain
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            eureka-v302-portable-toolchain.tar.gz
            PORTABLE_TOOLCHAIN_PROVENANCE.txt
            SHA256SUMS
