name: Vendor Solidity IBC Eureka v3.0.2 source and toolchain

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-eureka:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOUNDRY_PROFILE: default
      ETH_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v5
        with:
          repository: cosmos/solidity-ibc-eureka
          ref: solidity-v3.0.2
          path: eureka
          fetch-depth: 1

      - name: Verify exact release commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C eureka rev-parse HEAD)"
          expected="39904319467b5fbdec8c34c43b66af6f1d256dba"
          printf 'repository=cosmos/solidity-ibc-eureka\ntag=solidity-v3.0.2\nexpected=%s\nactual=%s\n' "$expected" "$actual" | tee SOURCE_PROVENANCE.txt
          test "$actual" = "$expected"
          git -C eureka status --porcelain | tee SOURCE_WORKTREE_STATUS.txt
          test ! -s SOURCE_WORKTREE_STATUS.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Solidity dependencies
        working-directory: eureka
        run: bun install --frozen-lockfile

      - name: Build exact Solidity release
        working-directory: eureka
        run: |
          forge --version | tee ../FOUNDRY_VERSION.txt
          bun --version | tee ../BUN_VERSION.txt
          forge build --sizes 2>&1 | tee ../FORGE_BUILD.log

      - name: Run focused router and transfer tests
        working-directory: eureka
        run: |
          set -o pipefail
          FOUNDRY_FUZZ_RUNS=256 forge test \
            --match-path 'test/solidity-ibc/**/*.t.sol' \
            2>&1 | tee ../FORGE_TEST.log

      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name \
              --mtime='UTC 2026-06-18' \
              --owner=0 --group=0 --numeric-owner \
              --exclude='.git' --exclude='node_modules' --exclude='out' --exclude='cache' \
              -C eureka -czf eureka-solidity-v3.0.2-source.tar.gz .
          sha256sum eureka-solidity-v3.0.2-source.tar.gz SOURCE_PROVENANCE.txt SOURCE_WORKTREE_STATUS.txt FORGE_BUILD.log FORGE_TEST.log > SOURCE_SHA256SUMS

      - name: Package local Solidity toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain/foundry toolchain/bun toolchain/svm
          cp -a "$HOME/.foundry/bin/." toolchain/foundry/
          cp -a "$HOME/.bun/bin/." toolchain/bun/
          if [ -d "$HOME/.svm" ]; then cp -a "$HOME/.svm/." toolchain/svm/; fi
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf eureka-v302-toolchain.tar.gz toolchain
          sha256sum eureka-v302-toolchain.tar.gz > TOOLCHAIN_SHA256SUMS

      - name: Package and split Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner -C eureka -czf eureka-v302-node-modules.tar.gz node_modules
          sha256sum eureka-v302-node-modules.tar.gz > NODE_MODULES_SHA256SUMS
          split -b 220M -d -a 2 eureka-v302-node-modules.tar.gz eureka-v302-node-modules.part-
          sha256sum eureka-v302-node-modules.part-* > NODE_MODULES_PART_SHA256SUMS
          ls -l eureka-v302-node-modules.part-* > NODE_MODULES_PARTS.txt
          rm eureka-v302-node-modules.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: eureka-solidity-v3.0.2-source
          retention-days: 1
          if-no-files-found: error
          path: |
            eureka-solidity-v3.0.2-source.tar.gz
            SOURCE_PROVENANCE.txt
            SOURCE_WORKTREE_STATUS.txt
            SOURCE_SHA256SUMS
            FOUNDRY_VERSION.txt
            BUN_VERSION.txt
            FORGE_BUILD.log
            FORGE_TEST.log

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: eureka-v302-toolchain
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            eureka-v302-toolchain.tar.gz
            TOOLCHAIN_SHA256SUMS

      - name: Upload dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: eureka-v302-node-modules-manifest
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            NODE_MODULES_SHA256SUMS
            NODE_MODULES_PART_SHA256SUMS
            NODE_MODULES_PARTS.txt

      - name: Upload dependency part 00
        uses: actions/upload-artifact@v4
        with: {name: eureka-v302-node-modules-part-00, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: eureka-v302-node-modules.part-00}
      - name: Upload dependency part 01
        uses: actions/upload-artifact@v4
        with: {name: eureka-v302-node-modules-part-01, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: eureka-v302-node-modules.part-01}
      - name: Upload dependency part 02
        uses: actions/upload-artifact@v4
        with: {name: eureka-v302-node-modules-part-02, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: eureka-v302-node-modules.part-02}
      - name: Upload dependency part 03
        uses: actions/upload-artifact@v4
        with: {name: eureka-v302-node-modules-part-03, retention-days: 1, compression-level: 0, if-no-files-found: ignore, path: eureka-v302-node-modules.part-03}
