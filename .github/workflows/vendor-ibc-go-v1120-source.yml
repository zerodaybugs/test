name: Vendor IBC-Go v11.2.0 source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v4
        with:
          repository: cosmos/ibc-go
          ref: v11.2.0
          path: ibc-go
          fetch-depth: 1

      - name: Verify exact tag commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C ibc-go rev-parse HEAD)"
          expected="cfc072e53eee42b2ab804cd4344ba610016f793c"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual" | tee SOURCE_PROVENANCE.txt
          test "$actual" = "$expected"
          git -C ibc-go status --porcelain | tee SOURCE_WORKTREE_STATUS.txt
          test ! -s SOURCE_WORKTREE_STATUS.txt

      - name: Install repository Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: ibc-go/go.mod
          cache: false

      - name: Verify target packages build and test
        shell: bash
        run: |
          set -euo pipefail
          cd ibc-go
          go version | tee ../GO_VERSION.txt
          go test -count=1 ./modules/apps/rate-limiting/... 2>&1 | tee ../RATE_LIMIT_TEST.log
          go test -count=1 ./modules/core/04-channel/v2/... 2>&1 | tee ../CHANNEL_V2_TEST.log

      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name \
              --mtime='UTC 2026-07-15' \
              --owner=0 --group=0 --numeric-owner \
              --exclude='.git' \
              -czf ibc-go-v11.2.0-source.tar.gz ibc-go
          sha256sum \
            ibc-go-v11.2.0-source.tar.gz \
            SOURCE_PROVENANCE.txt \
            SOURCE_WORKTREE_STATUS.txt \
            GO_VERSION.txt \
            RATE_LIMIT_TEST.log \
            CHANNEL_V2_TEST.log > SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ibc-go-v11.2.0-source
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            ibc-go-v11.2.0-source.tar.gz
            SOURCE_PROVENANCE.txt
            SOURCE_WORKTREE_STATUS.txt
            GO_VERSION.txt
            RATE_LIMIT_TEST.log
            CHANNEL_V2_TEST.log
            SHA256SUMS
