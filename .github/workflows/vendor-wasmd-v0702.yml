name: Vendor wasmd v0.70.2 source

on:
  push:
    branches:
      - research/vendor-wasmd-v0702-source
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Install exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: false

      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.70.2 https://github.com/CosmWasm/wasmd.git wasmd
          test "$(git -C wasmd rev-parse HEAD)" = "2de381daa1b40c305d5e91cdcf74cf173ef89337"
          test "$(git -C wasmd describe --tags --exact-match)" = "v0.70.2"
          grep -F 'github.com/CosmWasm/wasmvm/v3 v3.0.6' wasmd/go.mod

      - name: Verify representative exact-release packages
        run: |
          set -euxo pipefail
          cd wasmd
          go test -count=1 ./x/wasm/types ./x/wasm/keeper -run 'TestNonexistentName' || test $? -eq 0

      - name: Export split offline Go module cache
        run: |
          set -euxo pipefail
          cd wasmd
          go mod download
          cd ..
          tar -C "$(go env GOMODCACHE)" -czf wasmd-v0.70.2-gomodcache.tar.gz .
          sha256sum wasmd-v0.70.2-gomodcache.tar.gz > GOMODCACHE_SHA256SUMS
          split -b 240000000 -d -a 2 wasmd-v0.70.2-gomodcache.tar.gz wasmd-v0.70.2-gomodcache.part-
          sha256sum wasmd-v0.70.2-gomodcache.part-* > GOMODCACHE_PART_SHA256SUMS
          ls -l wasmd-v0.70.2-gomodcache.part-* > GOMODCACHE_PARTS.txt
          test "$(find . -maxdepth 1 -name 'wasmd-v0.70.2-gomodcache.part-*' | wc -l)" -eq 4

      - name: Create deterministic source archive
        run: |
          set -euxo pipefail
          commit="$(git -C wasmd rev-parse HEAD)"
          {
            echo "repository=https://github.com/CosmWasm/wasmd"
            echo "tag=v0.70.2"
            echo "commit=${commit}"
            echo "wasmvm=v3.0.6"
            echo "go=$(go version)"
            echo "runner=$(uname -a)"
          } > SOURCE_PROVENANCE.txt
          rm -rf wasmd/.git
          TZ=UTC find wasmd -exec touch -h -d '@0' {} +
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf wasmd-v0.70.2-source.tar.gz wasmd SOURCE_PROVENANCE.txt
          sha256sum wasmd-v0.70.2-source.tar.gz SOURCE_PROVENANCE.txt > SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wasmd-v0.70.2-source
          retention-days: 1
          if-no-files-found: error
          path: |
            wasmd-v0.70.2-source.tar.gz
            SOURCE_PROVENANCE.txt
            SHA256SUMS

      - name: Upload module-cache manifest
        uses: actions/upload-artifact@v4
        with:
          name: wasmd-v0.70.2-gomodcache-manifest
          retention-days: 1
          if-no-files-found: error
          path: |
            GOMODCACHE_SHA256SUMS
            GOMODCACHE_PART_SHA256SUMS
            GOMODCACHE_PARTS.txt

      - name: Upload module-cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: wasmd-v0.70.2-gomodcache-part-00
          retention-days: 1
          if-no-files-found: error
          path: wasmd-v0.70.2-gomodcache.part-00

      - name: Upload module-cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: wasmd-v0.70.2-gomodcache-part-01
          retention-days: 1
          if-no-files-found: error
          path: wasmd-v0.70.2-gomodcache.part-01

      - name: Upload module-cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: wasmd-v0.70.2-gomodcache-part-02
          retention-days: 1
          if-no-files-found: error
          path: wasmd-v0.70.2-gomodcache.part-02

      - name: Upload module-cache part 03
        uses: actions/upload-artifact@v4
        with:
          name: wasmd-v0.70.2-gomodcache-part-03
          retention-days: 1
          if-no-files-found: error
          path: wasmd-v0.70.2-gomodcache.part-03
