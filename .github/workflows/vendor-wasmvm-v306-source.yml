name: Vendor wasmvm v3.0.6 source

on:
  push:
    branches:
      - research/vendor-wasmvm-v306-source
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false

      - name: Checkout exact immutable release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v3.0.6 https://github.com/CosmWasm/wasmvm.git wasmvm
          test "$(git -C wasmvm rev-parse HEAD)" = "8a3884d02a59e469feb8be6514922f167f39361a"
          test "$(git -C wasmvm describe --tags --exact-match)" = "v3.0.6"

      - name: Verify exact release tests
        run: |
          set -euxo pipefail
          cd wasmvm
          go test -count=1 ./...

      - name: Export offline Go module cache
        run: |
          set -euxo pipefail
          gomodcache="$(go env GOMODCACHE)"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf wasmvm-v3.0.6-gomodcache.tar.gz -C "${gomodcache}" .
          sha256sum wasmvm-v3.0.6-gomodcache.tar.gz > GOMODCACHE_SHA256SUMS

      - name: Create deterministic source archive
        run: |
          set -euxo pipefail
          commit="$(git -C wasmvm rev-parse HEAD)"
          {
            echo "repository=https://github.com/CosmWasm/wasmvm"
            echo "tag=v3.0.6"
            echo "commit=${commit}"
            echo "go=$(go version)"
            echo "runner=$(uname -a)"
          } > SOURCE_PROVENANCE.txt
          rm -rf wasmvm/.git
          TZ=UTC find wasmvm -exec touch -h -d '@0' {} +
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf wasmvm-v3.0.6-source.tar.gz wasmvm SOURCE_PROVENANCE.txt
          sha256sum wasmvm-v3.0.6-source.tar.gz SOURCE_PROVENANCE.txt > SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wasmvm-v3.0.6-source
          retention-days: 1
          if-no-files-found: error
          path: |
            wasmvm-v3.0.6-source.tar.gz
            SOURCE_PROVENANCE.txt
            SHA256SUMS

      - name: Upload offline Go module cache
        uses: actions/upload-artifact@v4
        with:
          name: wasmvm-v3.0.6-gomodcache
          retention-days: 1
          if-no-files-found: error
          path: |
            wasmvm-v3.0.6-gomodcache.tar.gz
            GOMODCACHE_SHA256SUMS
