name: Vercel H1 account A encrypted device token

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Request short-lived device authorization
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/vercel-h1-auth-a
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          client_id = 'cl_HYyOPBNtFMfHhaUn9L4QPfTZz6TP47bp'
          body = urllib.parse.urlencode({
              'client_id': client_id,
              'scope': 'openid offline_access',
          }).encode()
          req = urllib.request.Request(
              'https://api.vercel.com/login/oauth/device-authorization',
              data=body,
              headers={
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'User-Agent': 'vercel-research-bootstrap',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              device = json.loads(response.read())

          required = {
              'device_code', 'user_code', 'verification_uri',
              'verification_uri_complete', 'expires_in', 'interval'
          }
          missing = sorted(required - set(device))
          if missing:
              raise SystemExit(f'missing device fields: {missing}')

          root = Path('/tmp/vercel-h1-auth-a')
          (root / 'device-private.json').write_text(json.dumps(device), encoding='utf-8')
          public = {
              'account_label': 'A',
              'required_alias': 'zdbug@wearehackerone.com',
              'user_code': device['user_code'],
              'verification_uri': device['verification_uri'],
              'verification_uri_complete': device['verification_uri_complete'],
              'expires_at_unix': int(time.time()) + int(device['expires_in']),
              'expires_in_seconds': int(device['expires_in']),
              'instructions': [
                  'Open verification_uri_complete.',
                  'Choose Sign Up if the alias account does not exist yet.',
                  'Use exactly zdbug@wearehackerone.com.',
                  'Complete email verification and approve CLI login.',
              ],
          }
          (root / 'VERIFICATION.json').write_text(json.dumps(public, indent=2) + '\n', encoding='utf-8')
          print('Device authorization created; verification details are in the artifact.')
          PY

      - name: Upload verification instructions
        uses: actions/upload-artifact@v4
        with:
          name: vercel-h1-account-a-verification
          path: /tmp/vercel-h1-auth-a/VERIFICATION.json
          if-no-files-found: error
          retention-days: 1

      - name: Poll token endpoint without logging credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path('/tmp/vercel-h1-auth-a')
          device = json.loads((root / 'device-private.json').read_text())
          deadline = time.time() + int(device['expires_in'])
          interval = max(5, int(device.get('interval', 5)))
          client_id = 'cl_HYyOPBNtFMfHhaUn9L4QPfTZz6TP47bp'

          while time.time() < deadline:
              body = urllib.parse.urlencode({
                  'client_id': client_id,
                  'grant_type': 'urn:ietf:params:oauth:grant-type:device_code',
                  'device_code': device['device_code'],
              }).encode()
              req = urllib.request.Request(
                  'https://api.vercel.com/login/oauth/token',
                  data=body,
                  headers={
                      'Content-Type': 'application/x-www-form-urlencoded',
                      'User-Agent': 'vercel-research-bootstrap',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      token = json.loads(response.read())
                  if not isinstance(token.get('access_token'), str):
                      raise SystemExit('token response did not contain access_token')
                  (root / 'token-private.json').write_text(json.dumps(token), encoding='utf-8')
                  print('Authorization completed; token captured for encryption.')
                  break
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      error = json.loads(raw)
                  except Exception:
                      raise SystemExit(f'unexpected token endpoint status {exc.code}')
                  code = error.get('error')
                  if code == 'authorization_pending':
                      time.sleep(interval)
                      continue
                  if code == 'slow_down':
                      interval += 5
                      time.sleep(interval)
                      continue
                  if code in {'access_denied', 'expired_token'}:
                      raise SystemExit(f'device authorization ended: {code}')
                  raise SystemExit(f'unexpected OAuth error: {code or exc.code}')
          else:
              raise SystemExit('device authorization expired before approval')
          PY

      - name: Encrypt token set for local research runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'cryptography>=43,<46'
          cat > /tmp/vercel-h1-auth-a/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqpZEY5UIZsb5Mg7M20iu
          ylHlnFSyeZyAIQhf1dJNLhGovXSwx0uoV9HT5eGqrACbyppEO/64YwtdAgp8bAgs
          +53xJAae9bEwvR0oJi70RcNYDZHxShM5yyUGCa+do53fW1DpgdBI3ObBPm/dIC+U
          6u/rzO5eYKcyYAobXa6JhqnGPMtVktPiYlxTJjPp89Tkm0qgCqTZMwdt/dRe7GTu
          Qph4QeY0tZa8tvoBt7A4maA+BJcglcYJKcto6sIxv5JN7malaqnm3S1XKRBLSb2Z
          C1m8HeXJ225E1f3FH+J6WGv/0yWfDnl1xVWf/AtgBnXEPZFz3NafNzzllBJplYsr
          DerNxDEpq2/Q8FHRz7n44W/fxkyacdwfKvjqKuhIFpZsd4wNMB4ko2tJ1xZQpOJH
          VaL212l/QsDinzJ9YcU7PqPOY9FEO7CSUlUHE4IQx4AHiD5GpkRzZ/C9B/XY0hTK
          BAfYwGFig1/g1991Q9wq28SD0MqWw46U7U50crRNNIs9AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path('/tmp/vercel-h1-auth-a')
          plaintext = (root / 'token-private.json').read_bytes()
          public_key = serialization.load_pem_public_key((root / 'public.pem').read_bytes())
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          aad = b'vercel-h1-account-a-v1'
          ciphertext = AESGCM(aes_key).encrypt(nonce, plaintext, aad)
          wrapped_key = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          token = json.loads(plaintext)
          envelope = {
              'version': 1,
              'account_label': 'A',
              'algorithm': 'RSA-OAEP-SHA256+A256GCM',
              'public_key_fingerprint_sha256': '8a62ba4e4572068892102ba94927475c302eab5d2726a823940af3292752b917',
              'aad_b64': base64.b64encode(aad).decode(),
              'wrapped_key_b64': base64.b64encode(wrapped_key).decode(),
              'nonce_b64': base64.b64encode(nonce).decode(),
              'ciphertext_b64': base64.b64encode(ciphertext).decode(),
              'plaintext_sha256': hashlib.sha256(plaintext).hexdigest(),
              'token_metadata': {
                  'token_type': token.get('token_type'),
                  'expires_in': token.get('expires_in'),
                  'scope': token.get('scope'),
                  'has_refresh_token': isinstance(token.get('refresh_token'), str),
              },
          }
          (root / 'TOKEN_ENCRYPTED.json').write_text(json.dumps(envelope, indent=2) + '\n', encoding='utf-8')

          for path in (root / 'token-private.json', root / 'device-private.json'):
              try:
                  size = path.stat().st_size
                  path.write_bytes(b'\x00' * size)
                  path.unlink()
              except FileNotFoundError:
                  pass
          PY

      - name: Upload encrypted token envelope
        uses: actions/upload-artifact@v4
        with:
          name: vercel-h1-account-a-encrypted-token
          path: /tmp/vercel-h1-auth-a/TOKEN_ENCRYPTED.json
          if-no-files-found: error
          retention-days: 1
