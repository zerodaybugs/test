name: Vercel H1 alias A request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  request-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vercel-signup
          cd /tmp/vercel-signup
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Request email authentication link
        shell: bash
        env:
          TEST_EMAIL: zerodaybugs+vercel-a@wearehackerone.com
        run: |
          set -euo pipefail
          cd /tmp/vercel-signup
          cat > run.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ locale: 'en-US', viewport: { width: 1360, height: 900 } });
          const result = { ok: false, stage: 'start', url: '', title: '', text: '', errors: [] };
          page.on('pageerror', e => result.errors.push(String(e)));
          try {
            await page.goto('https://vercel.com/signup', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            result.stage = 'signup-loaded';
            let emailOption = page.getByText('Continue with Email', { exact: false }).first();
            if (!(await emailOption.count())) {
              await page.getByText('Show other options', { exact: false }).first().click().catch(() => {});
              emailOption = page.getByText('Continue with Email', { exact: false }).first();
            }
            await emailOption.click();
            await page.waitForTimeout(1000);
            const input = page.locator('input[type="email"]').first();
            await input.waitFor({ state: 'visible', timeout: 20000 });
            await input.fill(process.env.TEST_EMAIL);
            const submitters = [
              page.locator('button[type="submit"]').last(),
              page.getByRole('button', { name: /continue/i }).last(),
              page.getByRole('button', { name: /sign up/i }).last(),
            ];
            let clicked = false;
            for (const s of submitters) {
              if (await s.count()) {
                try { await s.click({ timeout: 10000 }); clicked = true; break; } catch {}
              }
            }
            if (!clicked) throw new Error('submit control not found');
            result.stage = 'submitted';
            await page.waitForTimeout(8000);
            result.url = page.url();
            result.title = await page.title();
            result.text = (await page.locator('body').innerText().catch(() => '')).slice(0, 3000);
            result.ok = /email|inbox|check|verification|link/i.test(result.text) || !result.url.includes('/signup');
          } catch (e) {
            result.errors.push(String(e?.stack || e));
            result.url = page.url();
            result.title = await page.title().catch(() => '');
            result.text = (await page.locator('body').innerText().catch(() => '')).slice(0, 3000);
          } finally {
            fs.writeFileSync('/tmp/vercel-signup/status.json', JSON.stringify(result, null, 2));
            await browser.close();
          }
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exitCode = 2;
          JS
          node run.mjs

      - name: Upload non-secret status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-h1-alias-a-request-status
          path: /tmp/vercel-signup/status.json
          if-no-files-found: error
          retention-days: 1
