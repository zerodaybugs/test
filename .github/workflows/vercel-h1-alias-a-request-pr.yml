name: Vercel H1 alias A request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  request-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vercel-signup
          cd /tmp/vercel-signup
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Request email authentication link
        shell: bash
        env:
          TEST_EMAIL: zerodaybugs@wearehackerone.com
        run: |
          set -euo pipefail
          cd /tmp/vercel-signup
          cat > run.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            locale: 'en-US',
            timezoneId: 'Europe/Budapest',
            viewport: { width: 1360, height: 900 },
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
          });
          await context.addInitScript(() => {
            Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
          });
          const page = await context.newPage();
          const result = {
            ok: false,
            emailKind: 'base-h1-alias',
            stage: 'start',
            url: '',
            title: '',
            text: '',
            errors: [],
            api: [],
          };

          page.on('pageerror', e => result.errors.push(String(e)));
          page.on('response', async response => {
            const request = response.request();
            const url = response.url();
            if (!url.includes('vercel.com') || request.method() === 'GET') return;
            const record = {
              method: request.method(),
              status: response.status(),
              url: url.replace(/[?#].*$/, ''),
            };
            try {
              const contentType = response.headers()['content-type'] || '';
              if (/json|text/.test(contentType)) {
                const body = await response.text();
                record.body = body.slice(0, 2000).replaceAll(process.env.TEST_EMAIL, '[H1_ALIAS]');
              }
            } catch {}
            result.api.push(record);
          });

          try {
            await page.goto('https://vercel.com/signup', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            result.stage = 'signup-loaded';

            let emailOption = page.getByText('Continue with Email', { exact: false }).first();
            if (!(await emailOption.count())) {
              await page.getByText('Show other options', { exact: false }).first().click().catch(() => {});
              emailOption = page.getByText('Continue with Email', { exact: false }).first();
            }
            await emailOption.click();
            await page.waitForTimeout(1000);

            const input = page.locator('input[type="email"]').first();
            await input.waitFor({ state: 'visible', timeout: 20000 });
            await input.fill(process.env.TEST_EMAIL);

            const submitters = [
              page.locator('button[type="submit"]').last(),
              page.getByRole('button', { name: /continue/i }).last(),
              page.getByRole('button', { name: /sign up/i }).last(),
            ];
            let clicked = false;
            for (const submitter of submitters) {
              if (!(await submitter.count())) continue;
              try {
                await submitter.click({ timeout: 10000 });
                clicked = true;
                break;
              } catch {}
            }
            if (!clicked) throw new Error('submit control not found');

            result.stage = 'submitted';
            await page.waitForTimeout(8000);
            result.url = page.url();
            result.title = await page.title();
            result.text = (await page.locator('body').innerText().catch(() => '')).slice(0, 4000);

            const explicitError = /please try again|different sign up method|account recovery|error/i.test(result.text);
            const explicitSuccess = /check your (email|inbox)|verification (email|link)|email (was )?sent|magic link/i.test(result.text);
            result.ok = explicitSuccess && !explicitError;
          } catch (error) {
            result.errors.push(String(error?.stack || error));
            result.url = page.url();
            result.title = await page.title().catch(() => '');
            result.text = (await page.locator('body').innerText().catch(() => '')).slice(0, 4000);
          } finally {
            fs.writeFileSync('/tmp/vercel-signup/status.json', JSON.stringify(result, null, 2));
            await browser.close();
          }

          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exitCode = 2;
          JS
          node run.mjs

      - name: Upload non-secret status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-h1-alias-a-request-status-base
          path: /tmp/vercel-signup/status.json
          if-no-files-found: error
          retention-days: 1
