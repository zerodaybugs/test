name: Vercel Python SDK sandbox export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and unpack official Python SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/wheels export/unpacked export/evidence
          python -m pip download --no-deps --only-binary=:all: --dest export/wheels vercel==0.7.2
          python - <<'PY'
          import hashlib
          import pathlib
          import zipfile

          root = pathlib.Path('export')
          wheel = next((root / 'wheels').glob('vercel-0.7.2-*.whl'))
          with zipfile.ZipFile(wheel) as zf:
              zf.extractall(root / 'unpacked')
          (root / 'evidence' / 'WHEEL_SHA256.txt').write_text(
              hashlib.sha256(wheel.read_bytes()).hexdigest() + '  ' + wheel.name + '\n',
              encoding='utf-8',
          )
          PY
          grep -RInE '/v[0-9]+/sandboxes|sandboxes/sessions|snapshot|network-policy|forwardURL|injectionRules' export/unpacked/vercel export/unpacked 2>/dev/null \
            > export/evidence/SANDBOX_ENDPOINT_STRINGS.txt || true
          find export/unpacked/vercel -type f -print | sort > export/evidence/FILELIST.txt

      - name: Upload Python SDK export
        uses: actions/upload-artifact@v4
        with:
          name: vercel-python-sdk-0.7.2-export
          path: export/
          if-no-files-found: error
          retention-days: 1
