name: Vercel Sandbox public scope evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-public-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public HackerOne profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.error
          import urllib.request

          out = pathlib.Path("artifacts")
          url = "https://hackerone.com/graphql"
          headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "Origin": "https://hackerone.com",
              "Referer": "https://hackerone.com/vercel_sandbox?type=team",
              "User-Agent": "Mozilla/5.0 (compatible; ZeroDayBugs-scope-bootstrap/1.0)",
              "X-Requested-With": "XMLHttpRequest",
          }

          def save(name, value):
              (out / name).write_text(
                  json.dumps(value, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          def post(query, variables=None, operation_name=None):
              payload = {"query": query}
              if variables is not None:
                  payload["variables"] = variables
              if operation_name is not None:
                  payload["operationName"] = operation_name
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return {
                          "http_status": response.status,
                          "headers": dict(response.headers.items()),
                          "body": json.loads(response.read().decode("utf-8")),
                      }
              except urllib.error.HTTPError as exc:
                  return {
                      "http_status": exc.code,
                      "headers": dict(exc.headers.items()) if exc.headers else {},
                      "error_body": exc.read().decode("utf-8", errors="replace"),
                  }
              except Exception as exc:
                  return {"exception": type(exc).__name__, "message": str(exc)}

          profile_query = r'''
          query PublicProgramScope(
            $handle: String!
            $from: Int
            $size: Int
            $searchString: String
            $eligibleForSubmission: Boolean
            $eligibleForBounty: Boolean
          ) {
            team(handle: $handle) {
              id
              handle
              name
              state
              url
              offers_bounties
              offers_thanks
              submission_state
              external_url
              scope_description
              policy_setting {
                id
                policy
                last_policy_change_at
              }
              external_program {
                id
                policy_url
                policy
                disclosure_url
                offers_rewards
                thanks_url
              }
              declarative_policy {
                id
                has_open_scope
                protected_by_gold_standard_safe_harbor
                protected_by_ai_safe_harbor
                scope_exclusions {
                  id
                  category
                  details
                }
              }
              structured_scopes_search(
                from: $from
                size: $size
                search_string: $searchString
                eligible_for_submission: $eligibleForSubmission
                eligible_for_bounty: $eligibleForBounty
              ) {
                total_count
                nodes {
                  ... on StructuredScopeDocument {
                    id
                    identifier
                    display_name
                    instruction
                    eligible_for_bounty
                    eligible_for_submission
                    cvss_score
                    asset_type
                    created_at
                    updated_at
                  }
                }
              }
            }
          }
          '''
          variables = {
              "handle": "vercel_sandbox",
              "from": 0,
              "size": 100,
              "searchString": None,
              "eligibleForSubmission": None,
              "eligibleForBounty": None,
          }
          profile = post(profile_query, variables, "PublicProgramScope")
          save("profile.json", profile)

          team_fields = post(r'''
          query TeamFields {
            __type(name: "Team") {
              name
              fields(includeDeprecated: true) {
                name
                isDeprecated
                deprecationReason
                args {
                  name
                  type { kind name ofType { kind name ofType { kind name } } }
                }
                type { kind name ofType { kind name ofType { kind name } } }
              }
            }
          }
          ''', operation_name="TeamFields")
          save("team-fields.json", team_fields)

          schema_types = post(r'''
          query SchemaTypes {
            __schema { types { kind name } }
          }
          ''', operation_name="SchemaTypes")
          save("schema-types.json", schema_types)

          body = profile.get("body") if isinstance(profile, dict) else None
          team = ((body or {}).get("data") or {}).get("team") if isinstance(body, dict) else None
          save("summary.json", {
              "program_handle": "vercel_sandbox",
              "profile_http_status": profile.get("http_status"),
              "profile_graphql_errors": (body or {}).get("errors") if isinstance(body, dict) else None,
              "team_found": isinstance(team, dict),
              "team": team,
          })
          if not isinstance(team, dict):
              raise SystemExit("Public team profile missing; inspect artifact")
          print(json.dumps({
              "handle": team.get("handle"),
              "name": team.get("name"),
              "submission_state": team.get("submission_state"),
              "offers_bounties": team.get("offers_bounties"),
              "scope_count": ((team.get("structured_scopes_search") or {}).get("total_count")),
          }, indent=2))
          PY

      - name: Upload scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-sandbox-public-scope-pr
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
