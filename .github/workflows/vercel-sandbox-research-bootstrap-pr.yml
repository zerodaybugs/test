name: Vercel Sandbox research bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Export current public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 250 https://github.com/vercel/sandbox.git target
          git -C target rev-parse HEAD | tee target-commit.txt
          git -C target log --date=iso-strict --pretty=format:'%H%x09%aI%x09%s' -n 250 > target-history.tsv
          rm -rf target/.git

      - name: Fetch expanded public HackerOne metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p program-metadata
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.error
          import urllib.request

          out = pathlib.Path('program-metadata')
          endpoint = 'https://hackerone.com/graphql'
          headers = {
              'Accept': 'application/json',
              'Content-Type': 'application/json',
              'Origin': 'https://hackerone.com',
              'Referer': 'https://hackerone.com/vercel_sandbox?type=team',
              'User-Agent': 'Mozilla/5.0 (compatible; ZeroDayBugs-research-bootstrap/1.0)',
              'X-Requested-With': 'XMLHttpRequest',
          }

          def save(name, value):
              (out / name).write_text(json.dumps(value, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8')

          def post(query, variables=None, operation_name=None):
              payload = {'query': query}
              if variables is not None:
                  payload['variables'] = variables
              if operation_name is not None:
                  payload['operationName'] = operation_name
              request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return {'http_status': response.status, 'body': json.loads(response.read().decode())}
              except urllib.error.HTTPError as exc:
                  return {'http_status': exc.code, 'error_body': exc.read().decode(errors='replace')}
              except Exception as exc:
                  return {'exception': type(exc).__name__, 'message': str(exc)}

          metadata_query = r'''
          query ProgramMetadata($handle: String!) {
            team(handle: $handle) {
              id
              _id
              handle
              name
              state
              submission_state
              offers_bounties
              offers_thanks
              created_at
              updated_at
              last_updated_at
              launched_at
              started_accepting_at
              currency
              minimum_bounty
              base_bounty
              minimum_bounty_table_value
              maximum_bounty_table_value
              average_bounty_lower_amount
              average_bounty_upper_amount
              top_bounty_lower_amount
              top_bounty_upper_amount
              hide_bounty_amounts
              critical_submissions_enabled
              allows_bounty_splitting
              bounty_table {
                id
                _id
                currency
                description
                low
                medium
                high
                critical
              }
              policy_setting {
                id
                last_policy_change_at
                policy
              }
              structured_scopes_search(from: 0, size: 100) {
                total_count
                nodes {
                  ... on StructuredScopeDocument {
                    id
                    identifier
                    display_name
                    instruction
                    eligible_for_bounty
                    eligible_for_submission
                    cvss_score
                    asset_type
                    created_at
                    updated_at
                  }
                }
              }
            }
          }
          '''
          metadata = post(metadata_query, {'handle': 'vercel_sandbox'}, 'ProgramMetadata')
          save('program-metadata.json', metadata)

          for type_name in ['BountyTable', 'BountyTableRow', 'PolicySetting', 'SubmissionRequirements']:
              query = r'''
              query TypeFields($name: String!) {
                __type(name: $name) {
                  name
                  kind
                  fields(includeDeprecated: true) {
                    name
                    description
                    isDeprecated
                    deprecationReason
                    args { name type { kind name ofType { kind name ofType { kind name } } } }
                    type { kind name ofType { kind name ofType { kind name } } }
                  }
                }
              }
              '''
              save(f'type-{type_name}.json', post(query, {'name': type_name}, 'TypeFields'))
          PY

      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: vercel-sandbox-current-source
          path: |
            target/
            target-commit.txt
            target-history.tsv
          if-no-files-found: error
          retention-days: 1

      - name: Upload expanded program metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-sandbox-program-metadata
          path: program-metadata/
          if-no-files-found: error
          retention-days: 1
