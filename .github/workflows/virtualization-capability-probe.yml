name: Generic virtualization capability probe

on:
  push:
    branches:
      - openhcl-kvm-capability-20260818
    paths:
      - .github/workflows/virtualization-capability-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Capture runner virtualization capabilities
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "utc=$(date -u +%FT%TZ)"
            echo "kernel=$(uname -a)"
            echo "user=$(id)"
            echo "cpu_count=$(nproc)"
            echo "mem_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "dev_kvm=$(test -e /dev/kvm && echo present || echo absent)"
            if test -e /dev/kvm; then
              ls -l /dev/kvm
              sudo chmod 666 /dev/kvm || true
              echo "dev_kvm_after=$(ls -l /dev/kvm)"
            fi
            echo "cpu_virtualization_flags=$(grep -m1 -Eo '(^| )(vmx|svm)( |$)' /proc/cpuinfo | tr '\n' ' ' || true)"
            echo "qemu_system_x86_64=$(command -v qemu-system-x86_64 || true)"
          } | tee runner-capabilities.txt

      - name: Download pinned Microsoft UEFI firmware release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/microsoft/mu_msvm/releases/download/v26.0.19/RELEASE-X64-VS2022-artifacts.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors -o mu_msvm-x64.tar.gz "$url"
          sha256sum mu_msvm-x64.tar.gz | tee mu_msvm-x64.sha256
          mkdir mu_msvm-x64
          tar -xzf mu_msvm-x64.tar.gz -C mu_msvm-x64
          test -f mu_msvm-x64/FV/MSVM.fd
          stat -c 'MSVM_fd_bytes=%s' mu_msvm-x64/FV/MSVM.fd | tee firmware-info.txt
          sha256sum mu_msvm-x64/FV/MSVM.fd | tee MSVM.fd.sha256

      - name: Upload capability artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtualization-capability-probe
          path: |
            runner-capabilities.txt
            firmware-info.txt
            MSVM.fd.sha256
          retention-days: 7
