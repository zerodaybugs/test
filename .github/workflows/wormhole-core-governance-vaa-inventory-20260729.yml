name: Wormhole Core public governance VAA inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wormhole-core-governance-vaa-inventory-20260729.yml'
      - 'public_tools/wormhole_core_governance_vaa_inventory.py'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download and decode public Wormhole Core governance VAAs
        shell: bash
        run: |
          set -euo pipefail
          python3 public_tools/wormhole_core_governance_vaa_inventory.py

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence-wormhole-core-governance -type f -printf '%P\t%s bytes\n' | sort \
            > evidence-wormhole-core-governance/FILE_INDEX.txt
          (
            cd evidence-wormhole-core-governance
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-core-governance-inventory-${{ github.run_id }}
          path: evidence-wormhole-core-governance/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
