name: Bounded Wormhole Core governance probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wormhole-core-page0-20260729.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch and decode twenty public Wormholescan pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pages
          for page in $(seq 0 19); do
            curl --fail --silent --show-error --max-time 5 \
              "https://api.wormholescan.io/api/v1/vaas/1/11111111111111111111111111111115?page=${page}&pageSize=50&sortOrder=DESC" \
              -o "evidence/pages/page-${page}.json"
          done
          python3 - <<'PY'
          import base64
          import json
          from collections import Counter
          from pathlib import Path

          decoded = []
          page_summaries = []
          for path in sorted(Path('evidence/pages').glob('page-*.json')):
              payload = json.loads(path.read_text())
              rows = payload.get('data', [])
              page_summaries.append({
                  'page': int(path.stem.split('-')[-1]),
                  'row_count': len(rows),
                  'first_sequence': rows[0].get('sequence') if rows else None,
                  'last_sequence': rows[-1].get('sequence') if rows else None,
              })
              for item in rows:
                  raw = base64.b64decode(item['vaa'])
                  cursor = 6 + raw[5] * 66
                  cursor += 4 + 4 + 2 + 32 + 8 + 1
                  body = raw[cursor:]
                  module = body[:32].lstrip(b'\0').decode(errors='replace') if len(body) >= 32 else None
                  action = body[32] if len(body) >= 33 else None
                  chain = int.from_bytes(body[33:35], 'big') if len(body) >= 35 else None
                  row = {
                      'sequence': int(item.get('sequence')),
                      'timestamp': item.get('timestamp'),
                      'module': module,
                      'action': action,
                      'target_chain_id': chain,
                      'payload_length': len(body),
                  }
                  if module == 'Core' and action == 2 and len(body) >= 40:
                      row['new_guardian_set_index'] = int.from_bytes(body[35:39], 'big')
                      row['guardian_count'] = body[39]
                  decoded.append(row)

          unique = {row['sequence']: row for row in decoded}
          rows = sorted(unique.values(), key=lambda row: row['sequence'], reverse=True)
          guardian = [row for row in rows if row['module'] == 'Core' and row['action'] == 2]
          non_global = [row for row in guardian if row['target_chain_id'] != 0]
          summary = {
              'page_summaries': page_summaries,
              'raw_row_count': len(decoded),
              'unique_row_count': len(rows),
              'duplicate_row_count': len(decoded) - len(rows),
              'module_counts': dict(Counter(str(row['module']) for row in rows)),
              'guardian_set_update_count': len(guardian),
              'guardian_set_updates': guardian,
              'non_global_guardian_set_update_count': len(non_global),
              'non_global_guardian_set_updates': non_global,
          }
          Path('evidence/decoded.json').write_text(json.dumps(rows, indent=2))
          Path('evidence/summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-core-bounded-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
