name: Short Wormhole Core governance probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wormhole-core-page0-20260729.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch one public Wormholescan page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --max-time 15 \
            'https://api.wormholescan.io/api/v1/vaas/1/11111111111111111111111111111115?page=0&pageSize=50&sortOrder=DESC' \
            -o evidence/page0.json
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path('evidence/page0.json').read_text())
          rows = payload.get('data', [])
          decoded = []
          for item in rows:
              raw = base64.b64decode(item['vaa'])
              cursor = 6 + raw[5] * 66
              cursor += 4 + 4 + 2 + 32 + 8 + 1
              body = raw[cursor:]
              module = body[:32].lstrip(b'\0').decode(errors='replace') if len(body) >= 32 else None
              action = body[32] if len(body) >= 33 else None
              chain = int.from_bytes(body[33:35], 'big') if len(body) >= 35 else None
              row = {
                  'sequence': item.get('sequence'),
                  'timestamp': item.get('timestamp'),
                  'module': module,
                  'action': action,
                  'target_chain_id': chain,
                  'payload_length': len(body),
              }
              if module == 'Core' and action == 2 and len(body) >= 40:
                  row['new_guardian_set_index'] = int.from_bytes(body[35:39], 'big')
                  row['guardian_count'] = body[39]
              decoded.append(row)
          Path('evidence/decoded.json').write_text(json.dumps(decoded, indent=2))
          guardian = [r for r in decoded if r['module'] == 'Core' and r['action'] == 2]
          summary = {
              'pagination': payload.get('pagination'),
              'row_count': len(rows),
              'first_sequence': rows[0].get('sequence') if rows else None,
              'last_sequence': rows[-1].get('sequence') if rows else None,
              'guardian_set_updates': guardian,
          }
          Path('evidence/summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-core-page0-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
