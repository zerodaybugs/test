name: Wormhole core source bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wormhole-core-source.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive pinned public source
        run: |
          set -euo pipefail
          COMMIT=af311c20f657571460b62d20aaa8d9fce541bfde
          git clone --filter=blob:none --no-checkout https://github.com/guibescos/wormhole.git wormhole
          git -C wormhole checkout "$COMMIT"
          test "$(git -C wormhole rev-parse HEAD)" = "$COMMIT"
          rm -rf wormhole/.git
          printf '%s\n' "$COMMIT" > COMMIT.txt
          tar -czf wormhole-core-source.tar.gz wormhole COMMIT.txt
          sha256sum wormhole-core-source.tar.gz > ARCHIVE_SHA256.txt
          rg -n 'InitEncodedVaa|WriteEncodedVaa|VerifyEncodedVaaV1|ProcessingStatus|EncodedVaa' wormhole > ENCODED_VAA_SEARCH.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: wormhole-core-source
          retention-days: 7
          compression-level: 0
          path: |
            wormhole-core-source.tar.gz
            ARCHIVE_SHA256.txt
            ENCODED_VAA_SEARCH.txt
            COMMIT.txt
