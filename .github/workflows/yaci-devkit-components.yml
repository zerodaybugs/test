name: Yaci DevKit native component bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/yaci-devkit-components.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public native components
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/IntersectMBO/cardano-node/releases/download/10.1.4/cardano-node-10.1.4-linux.tar.gz \
            -o out/cardano-node-10.1.4-linux.tar.gz
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/bloxbean/yaci-store/releases/download/rel-native-2.0.0-beta1-devkit/yaci-store-2.0.0-beta1-devkit-linux-x64-n2c.zip \
            -o out/yaci-store-2.0.0-beta1-devkit-linux-x64-n2c.zip
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/CardanoSolutions/ogmios/releases/download/v6.11.2/ogmios-v6.11.2-x86_64-linux.zip \
            -o out/ogmios-v6.11.2-x86_64-linux.zip
          tar -tzf out/cardano-node-10.1.4-linux.tar.gz > out/cardano-node-contents.txt
          unzip -l out/yaci-store-2.0.0-beta1-devkit-linux-x64-n2c.zip > out/yaci-store-contents.txt
          unzip -l out/ogmios-v6.11.2-x86_64-linux.zip > out/ogmios-contents.txt
          sha256sum out/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: yaci-devkit-native-components
          retention-days: 7
          compression-level: 0
          path: out/
