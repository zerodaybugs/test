name: Compatibility bundle pagination 20260828

on:
  push:
    branches:
      - ci/compat-probe-20260828
    paths:
      - .github/workflows/z-compat-probe-20260828.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paginate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and paginate encrypted evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          source_id='33188709859-1'
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci/compat-results-20260828/sealed/${source_id}.b64" \
            > work/bundle.b64
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci/compat-results-20260828/sealed/${source_id}.sha256" \
            > work/bundle.sha256
          tr -d '\r\n' < work/bundle.b64 | base64 -d > work/bundle.bin
          expected=$(tr -d '\r\n ' < work/bundle.sha256)
          actual=$(sha256sum work/bundle.bin | cut -d' ' -f1)
          test "$actual" = "$expected"
          fold -w 256 work/bundle.b64 > work/bundle.wrapped
          base64 -w0 work/bundle.wrapped > work/bundle.api

          jq -n \
            --arg message "ci: paginate sealed compatibility result ${source_id}" \
            --rawfile content work/bundle.api \
            --arg branch 'ci/compat-results-20260828' \
            '{message:$message,content:$content,branch:$branch}' \
            > work/upload.json
          status=$(curl -sS -o work/upload-response.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/sealed/${source_id}.wrapped" \
            --data-binary @work/upload.json)
          test "$status" = '201'
