name: Compatibility probe 20260828

on:
  push:
    branches:
      - ci/compat-probe-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner check
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
          uname -a
          command -v dotnet || true
          dotnet --list-sdks || true
          openssl version
