name: Vercel H1 alias zdbug device bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  request-login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zdb-vercel-device
          cd /tmp/zdb-vercel-device
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Request device-flow email
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zdb-vercel-device
          cat > request.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const email = ['zdbug', 'wearehackerone.com'].join('@');
          const out = '/tmp/zdb-vercel-device';
          const result = {
            ok: false,
            stage: 'start',
            email_sha256: crypto.createHash('sha256').update(email).digest('hex'),
            url_path: '',
            title: '',
            body_text: '',
            inputs: [],
            api: [],
            errors: [],
          };

          const deviceResponse = await fetch('https://api.vercel.com/login/oauth/device-authorization', {
            method: 'POST',
            headers: {
              'content-type': 'application/x-www-form-urlencoded',
              'user-agent': 'vercel-research-bootstrap',
            },
            body: new URLSearchParams({
              client_id: 'cl_HYyOPBNtFMfHhaUn9L4QPfTZz6TP47bp',
              scope: 'openid offline_access',
            }),
          });
          const device = await deviceResponse.json();
          result.device_status = deviceResponse.status;
          if (!deviceResponse.ok || !device.verification_uri_complete) {
            result.errors.push('device authorization failed');
            fs.writeFileSync(`${out}/status.json`, JSON.stringify(result, null, 2));
            process.exit(2);
          }

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            locale: 'en-US',
            timezoneId: 'Europe/Budapest',
            viewport: { width: 1440, height: 1100 },
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
          });
          await context.addInitScript(() => Object.defineProperty(navigator, 'webdriver', { get: () => undefined }));
          const page = await context.newPage();
          page.on('pageerror', error => result.errors.push(String(error)));
          page.on('response', async response => {
            const request = response.request();
            const url = response.url();
            if (!url.includes('vercel.com') || request.method() === 'GET') return;
            const item = { method: request.method(), status: response.status(), path: new URL(url).pathname };
            try {
              const type = response.headers()['content-type'] || '';
              if (/json|text/.test(type)) {
                item.body = (await response.text()).slice(0, 1800).replaceAll(email, '[H1_ALIAS]');
              }
            } catch {}
            result.api.push(item);
          });

          try {
            result.stage = 'open';
            await page.goto(device.verification_uri_complete, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            fs.writeFileSync(`${out}/01.html`, (await page.content()).replaceAll(email, '[H1_ALIAS]'));

            result.stage = 'choose-email';
            const choice = page.getByRole('button', { name: /continue with email/i }).first();
            await choice.waitFor({ state: 'visible', timeout: 20000 });
            await choice.click();
            await page.waitForTimeout(1500);
            fs.writeFileSync(`${out}/02.html`, (await page.content()).replaceAll(email, '[H1_ALIAS]'));

            result.inputs = await page.locator('input').evaluateAll(nodes => nodes.map((node, index) => ({
              index,
              type: node.getAttribute('type'),
              name: node.getAttribute('name'),
              id: node.getAttribute('id'),
              placeholder: node.getAttribute('placeholder'),
              autocomplete: node.getAttribute('autocomplete'),
              visible: Boolean(node.offsetWidth || node.offsetHeight || node.getClientRects().length),
            })));

            const selectors = [
              'input[name="email"]:visible',
              'input[autocomplete="email"]:visible',
              'input[type="email"]:visible',
              'input:visible',
            ];
            let input = null;
            for (const selector of selectors) {
              const candidate = page.locator(selector).first();
              if (await candidate.count() && await candidate.isVisible().catch(() => false)) {
                input = candidate;
                break;
              }
            }
            if (!input) throw new Error('no visible email input');
            await input.fill(email);
            if ((await input.inputValue()) !== email) throw new Error('email fill mismatch');

            result.stage = 'submit';
            const buttons = [
              page.getByRole('button', { name: /^continue$/i }).last(),
              page.locator('button[type="submit"]:visible').last(),
            ];
            let submitted = false;
            for (const button of buttons) {
              if (!(await button.count()) || !(await button.isVisible().catch(() => false))) continue;
              try { await button.click({ timeout: 10000 }); submitted = true; break; } catch {}
            }
            if (!submitted) await input.press('Enter');

            await page.waitForTimeout(9000);
            result.stage = 'complete';
            result.url_path = new URL(page.url()).pathname;
            result.title = await page.title();
            result.body_text = (await page.locator('body').innerText().catch(() => '')).slice(0, 5000).replaceAll(email, '[H1_ALIAS]');
            const failed = /please try again|different (sign up|login) method|account recovery|unknown error|unauthorized/i.test(result.body_text);
            const sent = /check your (email|inbox)|verification (email|link)|email (was )?sent|magic link|we sent/i.test(result.body_text);
            result.ok = sent && !failed;
            fs.writeFileSync(`${out}/03.html`, (await page.content()).replaceAll(email, '[H1_ALIAS]'));
          } catch (error) {
            result.errors.push(String(error?.stack || error).replaceAll(email, '[H1_ALIAS]'));
            result.url_path = (() => { try { return new URL(page.url()).pathname; } catch { return ''; } })();
            result.title = await page.title().catch(() => '');
            result.body_text = (await page.locator('body').innerText().catch(() => '')).slice(0, 5000).replaceAll(email, '[H1_ALIAS]');
            fs.writeFileSync(`${out}/failure.html`, (await page.content().catch(() => '')).replaceAll(email, '[H1_ALIAS]'));
          } finally {
            fs.writeFileSync(`${out}/status.json`, JSON.stringify(result, null, 2));
            await browser.close();
          }

          console.log(JSON.stringify({ ok: result.ok, stage: result.stage, url_path: result.url_path, errors: result.errors }, null, 2));
          if (!result.ok) process.exitCode = 2;
          JS
          node request.mjs

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zdb-vercel-device-bootstrap-status
          path: /tmp/zdb-vercel-device/
          if-no-files-found: error
          retention-days: 1
